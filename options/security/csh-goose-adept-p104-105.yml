data:
  source_section: 'GM Information / Goose Totem / Executive Protection / Physical Adept Abilities (printed 104, PDF 113)'
  goose_totem:
    identity: Goose
    category: Wilderness totem
    characteristics: Aggressively territorial, jumpy, easily startled, loud, boisterous
    favored_environment: Open fields; parks when in cities
    spell_dice_modifiers:
    - category: Detection spells
      bonus_dice: 2
    - category: Combat spells
      bonus_dice: 1
    spirit_conjuring_modifiers:
    - environment: Wilderness
      spirit: Wind spirit
      bonus_dice: 2
    - environment: Urban
      spirit: Field spirit
      bonus_dice: 2
    surprise_tests_disadvantage: '+1 penalty on all Surprise Tests'
    behavior_note: Often honks loudly when surprised.
  executive_protection_physical_adept:
    source_relation: Applies to physical adepts described in the Executive Protection section, printed pages 54-61.
    mandatory_power: Astral Perception
    typical_powers:
    - Combat Sense
    - Improved Physical Senses
    - Increased Reaction
    - Increased Reflexes
    - Pain Resistance
    new_powers:
      extended_missile_parry:
        required_reference: Missile Parry (Grimoire II, printed page 34)
        cost_points: 1.5
        effect: Extends Missile Parry to an individual whom the adept is protecting.
        maximum_distance_m_from_adept: 3
      enhanced_perception:
        effect: Additional dice applied to Perception Tests according to purchased ability Rating.
        purchase_cost_brackets:
        - intelligence_relation: Less than or equal to one-half racial maximum Intelligence
          power_points_per_plus_one_rating: 0.25
        - intelligence_relation: Up to racial maximum Intelligence
          power_points_per_plus_one_rating: 0.5
        - intelligence_relation: Up to 1.5 times racial maximum Intelligence
          power_points_per_plus_one_rating: 1.0
  lineage: Historical Second Edition character options; no inferred Shadowrun Third Edition supersession.
