headline: "Eastern magical tradition character guidelines"
framing: reference_exact
data:
  publication: {title: Shadows of Asia, publisher: FanPro, edition: SR3, catalog: FanPro25007}
  scope: Fictional magical character guidelines, not assertions about actual religions.
  general_reference: Magic in the Shadows pp10-11
  buddhism:
    paths: Any common Shadowrun magical path.
    shamanic_tendency: Bodhisattva associated with animal or ideal.
    monk_tendency: Somatic adept.
  confucianism: Usually hermetic; shamanic path uncommon, not forbidden.
  sufi_mystics: Usually adept or hermetic magician practicing mathematical divination.
  eastern_shamanism:
    replaces: Spirits of Man
    replacement: ancestor spirits
    other_totem_options: Same kinds as shamans elsewhere.
  shinto: All Awakened priests are shamans; most are female and called miko in the setting.
  daoism:
    wai_dan: Usually hermetic mage or wujen.
    nei_dan:
      usual_paths: [adept, shaman]
      nature_totems: all
      mythic_totems: [Griffin, Phoenix, Pegasus/Unicorn, Leviathan, Wyrm]
      pegasus_unicorn_regional_name: Qi-ren
      idols: all except listed exclusions
      excluded_idols: [Bacchus, Horned Man, Wild Huntsman]
      additional_path: Magician's Way adepts are common in monasteries.
  zoroastrianism:
    usual_path: hermetic
    occasional_shaman_totems: [Bull, Sun, Fire-Bringer, Sky Father, Wise Warrior]
