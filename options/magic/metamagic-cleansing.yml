  incompatible_with: []

effects:
  - "Allows an initiate to reduce temporary background count after its underlying cause has been removed."
  - "Cleansing also erases astral traces/signatures associated with the cleansed background count."
  - "The initiate tests Sorcery against the background count and resists Drain from the cleansing."

