  totems:
  - name: Bear
    printed_page: 163
    pdf_page: 164
    environment: Forest
    bonus_dice:
      health_spells: 2
      forest_spirits: 2
    disadvantages:
      when: Physical damage taken in combat
      test: Willpower (4)
      on_failure: Enters berserk state for 3 turns minus one per success; three or
        more successes prevent it
      behavior: Attacks the closest living target, friendly or hostile, with most
        powerful available weapons; rage ends early if target is incapacitated
    character: Gentle protector and healer, slow to anger but dangerous when provoked
  - name: Buffalo
    printed_page: 163
    pdf_page: 164
    environment: Plains
    bonus_dice:
      health_spells: 2
      prairie_spirits: 2
    dice_penalties:
      illusion_spells: -1
    character: Generous and tireless protector who responds to sincere requests for
      aid
  - name: Cat
    printed_page: 164
    pdf_page: 165
    environment: Urban
    bonus_dice:
      illusion_spells: 2
      city_spirits: 2
    disadvantages:
      dirty_or_unkempt: +1 target number to all Mental tests
      unwounded_casting_damaging_spell: Willpower (6) test; failure requires choosing
        least-damaging available spell cast at minimum Damage Level (Light for fixed-level,
        or at half Force for variable-damage spells); after the shaman is wounded,
        the toying behavior ceases
    character: Stealthy, independent and mischievous, preferring to taunt rather than
      immediately kill
  - name: Coyote
    printed_page: 164
    pdf_page: 165
    environment: Anywhere on land
