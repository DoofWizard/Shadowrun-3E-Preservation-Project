  interpretive_limits:
    dice: All numbers are dice additions or subtractions except those explicitly identified
      as target-number modifiers, tests, timing or Essence changes.
    spirit_choice: An environment-conditional spirit category or one-time player choice
      applies only as described for that totem; no bonus is extended beyond its listed
      domain.
    berserk: Cross-reference Bear's exact original Willpower (4) berserk test rather
      than inventing a separate procedure for Shark or Wolf.
    later_sources: Do not silently import later Magic in the Shadows options or alternative-edition
      errata.
