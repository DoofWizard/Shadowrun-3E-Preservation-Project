id: option.magic.metamagic-invoking
record_type: option
name: "Metamagic: Invoking"
domain: magic
status: ingested

effective:
  status: current
  source: source.mits
  page: 75
  basis: defines

option_for:
  - option.magic.metamagic

selection:
  timing: "when summoning an eligible spirit"
  prerequisites:
    - "initiate capable of conjuring the spirit type"
  incompatible_with: []

effects:
  - "Allows an initiate to attempt to transform a normally summoned spirit into a more powerful great form spirit."
  - "The intention is declared before the initial Conjuring Test and requires an additional Conjuring Test and Drain Resistance Test."
  - "Failure can leave the summoned spirit uncontrolled."

links:
  modifies:
    - subsystem.magic.conjuring
  requires:
    - option.magic.metamagic
  interacts_with: []

sources:
  - source: source.mits
    page: 75
    relation: defines
    note: "Invoking"

notes: []

source: source.mits
printed_pages: '75-76'
pdf_pages: '76-77'
edition_scope: SR3
content_class: [rule_exact]
data:
  eligibility:
    printed_page: 75
    requires_conjuring_capability: true
    examples_without_great_form: [watchers, allies, ancestor spirits]
  declaration:
    printed_page: 75
    timing: Before initial Conjuring Test.
    requirements: Declare intention to summon a great form and specify the great-form bonuses (p106).
  summoning:
    printed_page: 75
    initial_summoning: Resolve normal summoning.
    additional_tests: [Conjuring Test, Drain Resistance Test]
    additional_actions: 0
    timing: Immediately as part of summoning, once the spirit appears.
    additional_conjuring_tn: (spirit Force times 2) minus initiation grade
    success: Spirit changes to great form.
    failure: Spirit remains in normal form and becomes uncontrolled.
  additional_drain:
    printed_pages: '75-76'
    effective_force_for_drain: (spirit Force times 2) minus initiation grade
    physical_drain_determined_by: spirit's normal Force
    physical_drain_reference: SR3 p187
    centering_successes: Apply successes from the initial summoning Centering Test to this test as well.
    new_centering_test_allowed: false
    if_drain_incapacitates_or_kills_summoner: Great-form spirit becomes uncontrolled.
framing: reference_exact
headline: "Fictional Shadowrun Third Edition rule: Invoking (FASA7907, pp75-76/PDF76-77)"
summary: "FASA Corporation, Magic in the Shadows; exact tabletop RPG test resolution and exceptions from the original pp75-76/PDF76-77."
