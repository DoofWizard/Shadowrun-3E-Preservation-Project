data:
  cost_multiplier_reduction: 0.5
  without_ordeal: GM may require various smaller tasks and rituals; choosing no ordeal does not remove initiation effort.
  repeat_type: GM permission required to use the same ordeal again; some types including oath can never be repeated.
  avatar: Avatar interaction should occur during the ordeal.
  selection_timing: Choose before initiation; only deed can be completed before the character initiates.
  outcome: Success grants new grade; failure requires retry until successful.
  retry_karma: No additional initiation Karma payment after a failed ordeal.
