data:
  standard:
    eligible: Sustained spells; Exclusive-limited spells excluded.
    result: Self-sustaining until dispelled, without sustaining focus or caster attention.
    prerequisites: Cast normally, resist initial Drain, sustain while astrally perceiving the spell; Centering may assist initial Drain.
    base_time: Permanent Spell Base Time Table (SR3 p178).
    time_test: Sorcery plus dice equal to initiation grade.
    target_number: Total dice actually used to cast, including Spell Pool, totem, elemental aid, foci and any other bonuses.
    successful_duration: Divide base time by successes and round down; minimum 1 Combat Turn.
    zero_successes: Twice base time.
    all_ones: Spell ends.
    exclusivity: Exclusive activity; no other magical actions during quickening.
    karma: At end of final turn, pay Karma equal to Force; can increase total payment up to twice actual Force.
    dispelling_force: Total Karma spent to quicken.
    second_drain: Resist original Drain Code again after paying Karma; successes from initial Centering against Drain may instead be applied here; no new Centering Test.
    abort: May end attempt if time is too long, but second Drain Resistance Test still required.
    example:
      grade: 3
      sorcery: 7
      force: 1
      casting_dice: 7
      drain: 2S
      time_test_dice: 10
      time_test_tn: 7
      base_turns: 15
      successes: 2
      sustain_turns: 7
      karma: 1
  tattoo_magic:
    printed_page: 78
    separate_metamagical_technique: true
    required_skills:
    - Enchanting
    - Tattooing
    fictional_ink_reagents: One unit of herbal or mineral radicals for each 2 Force points.
    ink_test: Enchanting (Alchemy); TN equals reagent units, minimum 2; base time 10 days.
    minimum_area_square_cm: 100 times Force squared
    tattoo_base_days: Force squared
    tattoo_test: Tattooing (4); divide base time by successes; zero successes doubles time; all ones ruins tattoo and may leave a scar.
    completion: Cast and quicken the spell as normal after preparing tattoo.
    effective_dispelling_force: Twice Karma spent.
framing: reference_exact
