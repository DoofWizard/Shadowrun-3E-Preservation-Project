data:
  approval: Player and gamemaster may agree in advance; the gamemaster may also approve
    a recently completed run.
  karma_guideline: The run award should be comparable to the Karma cost of the initiation
    grade sought. A high award alone is insufficient; the task must be personally
    relevant.
  award_forfeited: true
  advance_completion: A deed may be completed before the character is ready to initiate.
    It must be used for the next initiation grade and cannot be saved beyond that
    grade.
  illustrative_goals:
  - Overcome a magical threat
  - Deal with a free spirit
  - Gain magical knowledge through exceptional magical experience or an astral quest
    with a different objective
  - Uphold a magical or ethical code in difficult circumstances
