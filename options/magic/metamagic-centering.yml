effects:
  - "Allows an initiate to channel magical discipline through a creative practice such as singing, dancing, instruments, languages or meditation."
  - "Centering can reduce Drain, overcome penalties affecting magical target numbers, and improve magical concentration."
  - "Adepts may learn to apply Centering to additional skill areas as they gain initiation grades."

