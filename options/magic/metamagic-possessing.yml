data:
  entry:
    eligible: Astrally projecting initiate; target must be astrally active, including dual critters, and have a physical body not created by Materialization.
    location: Initiate must be at the physical body's location with its astral form.
    contest: Astral combat with Stun damage only; victory permits control, but host takes that Stun damage only on departure.
    willing_host: Astrally active willing hosts need not be defeated; nonsentient beings cannot volunteer and unconscious dual beings cannot resist.
    projecting_magician: Body is not dual-natured during projection; exception permits immediate possession after astral victory when the body is in line of sight.
    riggers_deckers: Astrally active riggers or deckers defeated in astral combat can be possessed and are immediately disconnected from their vehicle or icon; initiate may attempt either activity.
    maximum_hours: initiation grade
  control:
    dual_natured: true
    attributes: Host normal Physical Attributes; initiate Mental Attributes.
    abilities: Host physical and innate magical abilities, including adept and physical critter powers; applicable host geasa must be fulfilled.
    inaccessible:
    - host skills
    - host spells
    - host memories
    magic: Initiate may use magic; all Drain is Physical damage to initiate astral form, not host.
    unwilling_or_unconscious_host_tn_modifier: 2
    damage: Damage during possession goes to host body; mana-based magic including mana critter powers affects initiate instead.
    host_astral_form: Enveloped rather than displaced; initiate with Masking can deliberately mask it like a focus with Force equal to host Essence.
    barriers: Initiate may traverse own astral barriers, not barriers created by host; barrier recognizes dominant initiate astral form.
  departure:
    host_killed_or_unconscious: initiate disrupted
    banishing: Opposed Magic Test; successful banishing disrupts initiate.
    astral_combat: May kill or disrupt initiate under standard rules.
    overstay: Initiate disrupted if exceeding grade hours.
    host_on_departure: Immediately apply Stun damage from initial astral contest, cumulative with Stun or Physical damage suffered during possession.
    willing_host_drain:
      power: initiate Magic plus grade
      level: Deadly
      damage_type: Stun
      resistance: Willpower
    host_memory: No recollection of events during possession.
framing: reference_exact
