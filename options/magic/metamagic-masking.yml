selection:
  timing: "when concealing or penetrating magical auras"
  prerequisites:
    - "initiate"
  incompatible_with: []

effects:
  - "Allows an initiate to disguise the true nature of the initiate's aura from astral observers."
  - "Can disguise dual nature/emotional state and can penetrate another initiate's masking."
  - "Ordinary masking conceals foci and sustained/quickened spells within a grade-based Force limit; deliberate masking can conceal additional Force."

