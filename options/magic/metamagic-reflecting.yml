data:
  allocation:
    dice: Sorcery and Spell Pool; same limits as Spell Defense.
    trigger: Target of incoming spell has reflecting dice allocated; initiate elects to use them.
  resolution:
    test_tn: Incoming spell Force.
    defense: Reflecting successes offset caster successes as Spell Defense.
    reflection_condition: Reflecting successes exceed caster successes, not the spell Force.
    reflected_force: Original spell Force.
    reflected_cast: Roll net reflecting successes as spellcasting dice in a new Spellcasting Test; stage effect normally using extra successes.
  area:
    ordinary: Only subjects allocated reflecting dice are protected; other area targets remain affected. If reflected, only original caster is target, not surrounding subjects.
    elemental_manipulation: If any target successfully reflects, entire spell returns as an area effect centered on original caster.
  resistance:
    original_caster: May use Spell Defense or Shielding dice against reflected spell.
    repeat_reflection: Original caster who is an initiate with Reflecting can reflect again.
    ritual: A reflected ritual spell affects every member of the casting ritual circle equally.
  example:
    force: 4
    casting_dice: 6
    caster_tn: 6
    caster_successes: 2
    reflecting_dice: 6
    reflecting_tn: 4
    reflecting_successes: 4
    reflected_cast_dice: 2
    reflected_cast_tn: 5
framing: reference_exact
