effects:
- Protects up to grade subjects within line of sight using allocated Sorcery and Spell Pool dice.
- Subjects receive allocated dice for Spell Resistance until the initiate next acts; hostile spell target numbers increase by one per allocated die up to grade.
- Multiple initiates may stack protection.
