- character_option
headline: 'Original FASA7905a Shadowrun Companion printed p17/PDF18: optional Bonus
  Attribute Point and Exceptional Attribute Edge mechanics.'
summary: Source-reviewed numerical creation benefits and exactly bounded limit exceptions
  for optional Attribute Edges in the fictional tabletop game.
data:
  publication:
    title: Shadowrun Companion
    publisher: FASA Corporation
    catalog: FASA7905a
    edition: Shadowrun Third Edition
    printed_page: 17
    physical_pdf_page: 18
  original_heading: ATTRIBUTE EDGES
  options:
  - name: Bonus Attribute Point
    kind: Edge
    creation_point_cost: 2
    character_creation_benefit: Gain 1 bonus Attribute Point, usable on a Mental or
      Physical Attribute.
    limit_exception: Can raise the starting Attribute above its racial modified limit
      under the original Creating a Character rules.
    per_character_cap: Only one Attribute may be increased by this Edge.
    per_attribute_point_cap: Only one such bonus point can apply to a single Attribute.
  - name: Exceptional Attribute
    kind: Edge
    creation_point_cost: 2
    benefit: Raise the Racial Modified Limit of one Attribute by 1.
    maximum_recalculation: The Attribute Maximum is the Racial Modified Limit multiplied
      by 1.5, rounded up; recompute it using the improved limit.
    source_worked_example:
      character: Human with Body Racial Modified Limit improved to 7.
      resulting_body_attribute_maximum: 11
    may_take_once_for_each_attribute: true
    may_apply_to:
    - Body
    - Quickness
    - Strength
    - Charisma
    - Intelligence
    - Willpower
    excluded_attributes:
    - Essence
    - Reaction
    - Magic
  source_relationship:
    uses_optional_framework: subsystem.character.edges-flaws
    numeric_summary_source: FASA7905a original printed p31/PDF32; point values separately
      indexed in the exact two-table catalog.
    distinction: Bonus Attribute Point increases a starting Attribute rating; Exceptional
      Attribute increases its racial modified limit and derived maximum, not the current
      rating.
framing: reference_exact
