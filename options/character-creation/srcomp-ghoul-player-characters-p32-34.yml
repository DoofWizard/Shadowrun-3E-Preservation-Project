edition_scope: Shadowrun Third Edition optional Shadowrun Companion fictional ghoul player-character rules
content_class:
- character_option
framing: reference_exact
headline: "Optional fictional ghoul player-character construction, FASA Corporation Shadowrun Companion (FASA7905a, Shadowrun Third Edition), printed pp32-34/PDF33-35."
summary: "Original source-reviewed SR3 Companion ghoul player-character option: Building Point method, +10 points over race cost, +2 dice on starting ghoul Willpower (6) stage-three test, cyberware Essence multiplier 2."
data:
  publication:
    title: Shadowrun Companion
    publisher: FASA Corporation
    catalog: FASA7905a
    edition: Shadowrun Third Edition
    printed_pages: [32, 33, 34]
    pdf_pages: [33, 34, 35]
  optional_status: The Companion offers playable ghouls subject to the gamemaster allowing the optional character type; not a baseline SR3 character option.
  creation:
    method_required: Companion Building Point System; Priority System explicitly not used for a beginning ghoul.
    ghoul_build_point_surcharge: 10
    race_cost_addition: The 10 points are in addition to any costs of the chosen metahuman race.
    permitted_races: Ghouls may originate from any metahuman race.
    sequence:
    - Build a normal character, assigning Attributes, skills, Resources, and any applicable Spell Points or Power Points.
    - Charge 10 additional Building Points for beginning as a ghoul, above the selected race's own cost.
    - Apply the companion's transformation beginning at the third stage of Krieger-strain infection.
    - Make a Willpower (6) Test using 2 additional dice because the character starts play as a ghoul.
    - Apply Third Stage Infection Table modifiers to Attributes as well as Ghoul Characteristics Table modifiers.
    - Continue normal advancement of Attributes and skills after creation, subject to adjusted racial limits.
    starting_ghoul_third_stage_bonus_dice: 2
    starting_ghoul_test_target_number: 6
    magical_characters: Normal Spell Point/Power Point selection remains possible when the chosen character type permits it; apply published ghoul Magic penalties and restrictions separately.
  installed_cyberware_at_start:
    allowed: true
    essence_cost_multiplier: 2
    timing_assumption: Ghoul characters who start with cyberware are considered to have acquired it after they became ghouls.
    distinction_from_infection_transformation: Earlier installed cyberware may break or survive as specified in the separate transformation procedure; this is a different source condition.
  ghoul_rules_dependency:
    record_id: rule.character-creation.srcomp-ghoul-krieger-infection
    purpose: Apply the third-stage and ghoul-characteristics tables, Karma prohibition, fictionally acquired Traits and posttransformation damage/augmentation conditions.
  implementation_status: Optional source-reviewed record. The published Build Point method, race costs and separate infection mechanic must be available for an executable chargen module; no executable implementation is claimed.
