data:
  publication:
    title: Shadowrun Companion
    publisher: FASA Corporation
    catalog: FASA7905a
    edition: Shadowrun Third Edition
  framework:
    existing_option: option.character-creation.point-based-design
    budget: GM selects Building Point allocation in place of standard priorities A-E;
      120 recommended, most SR3 sample characters approximately 123.
    standard_restrictions: All ordinary SR3 creation restrictions apply unless expressly
      modified; starting gear Availability cannot exceed 8.
    GM_controls: GM may impose Attribute and Skill rating ceilings or change starting
      budgets for power level and differing player experience.
    edges_flaws_reuse: rule.character-creation.srcomp-edges-flaws-purchasing-limits-elimination-p15-16
  race_BP_table:
    human: 0
    dwarf: 5
    ork: 5
    elf: 10
    troll: 10
    metavariant_surcharge: 5
    ghoul_surcharge: 10
    otaku_surcharge: 30
    shapeshifter: 25
  race_conditions:
    surcharge_basis: Metavariant, ghoul and otaku costs are added to the applicable
      base race cost; shapeshifter is a separate 25-BP option.
    examples:
      troll_otaku_BP: 40
      cyclops_BP: 15
      ork_ghoul_BP: 15
    GM_optional_alternative_example:
      human: 2
      dwarf: 5
      ork: 7
      elf: 8
      troll: 11
  magic_BP_table:
    full_magician:
      BP: 30
      initial_Spell_Points: 25
    aspected_magician:
      BP: 25
      initial_Spell_Points: 35
    adept:
      BP: 25
      initial_Power_Points: equal_to_Magic_Rating
  magic_conditions:
    otaku_may_spend_BP_on_Magic: false
    extra_Spell_Point_purchase:
      nuyen_per_point: 25000
      maximum_total_points: 50
    optional_point_exchange:
      Force_Points_relinquished: 5
      Building_Points_received: 1
    exchange_scope: Printed prose permits reducing starting Spell Points to gain Building
      Points, describing the surrendered units as Force Points; this is not sale for
      nuyen.
    standard_Spell_and_Power_Point_spending_rules_apply: true
    GM_controls: GM may change magic BP prices to encourage or discourage magical
      character creation.
