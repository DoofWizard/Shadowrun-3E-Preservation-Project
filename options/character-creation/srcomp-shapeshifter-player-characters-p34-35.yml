id: option.character-creation.shapeshifter-player-characters
record_type: option
status: source_reviewed
source: source.srcomp
printed_pages: 34-35
pdf_pages: 35-36
edition_scope: Shadowrun Third Edition optional Shadowrun Companion FASA7905a character rules
content_class:
- character_option
headline: Source-reviewed optional shapeshifter character creation in the fictional tabletop RPG Shadowrun
  Companion (FASA Corporation, FASA7905a, SR3), printed pp34-35/PDF35-36.
summary: 'Optional published SR3 shapeshifter character rules (seven species): priorities, separate form attributes,
  starting money, skills, dual-form restrictions. Original fictional source; exact mechanics preserved.'
data:
  publication:
    title: Shadowrun Companion
    publisher: FASA Corporation
    catalog: FASA7905a
    edition: Shadowrun Third Edition
    printed_pages:
    - 34
    - 35
    pdf_pages:
    - 35
    - 36
  option_scope: Optional player-character type; the published companion explicitly advises gamemaster review
    because of unusual power and balance.
  eligible_species:
  - Bear
  - Eagle
  - Fox
  - Leopard
  - Seal
  - Tiger
  - Wolf
  creation_methods:
    point_based: Recommended by the published Companion; follows its point-based character creation procedure.
    priority:
      race_priority: C
      resources_priority_normal: A
      resources_priority_if_full_magician: B
      all_other_priorities: Assign under ordinary SR3 Priority System restrictions.
  starting_nuyen: 5000
  attribute_assignment:
    physical_attributes:
    - Body
    - Quickness
    - Strength
    separate_forms: true
    human_and_animal_physical_ratings: Assign separate starting attribute points to human-form and animal-form
      physical ratings; apply the species/form racial modifiers only after ratings are allocated.
    mental_attributes_shared:
    - Charisma
    - Intelligence
    - Willpower
    mental_attributes_same_in_both_forms: true
    reaction: Determine Reaction separately for each form from that form's applicable attributes under the
      normal procedure.
    essence_same_in_both_forms: true
    starting_essence: 8
    magic_same_in_both_forms: true
    starting_magic_if_magician_or_adept: 6
    physical_attribute_advancement: Spend Karma independently to improve human-form and animal-form physical
      attributes; use the species/form limits from the printed Companion table.
    optional_gm_advancement_limit: The gamemaster may instead calculate Karma costs of animal-form physical
      attributes from human-form Racial Modified Limits and Maximums, to limit unusually powerful shapeshifters.
  skills:
    linked_attribute_during_creation: Use the human-form linked Attribute rating when determining skill costs.
    free_knowledge_skill_points: Intelligence x 3
    free_language_skill_points: Intelligence
    free_contact_allotment: 0
    starting_contacts: Purchase contacts using allocated Resource Points.
  magical_and_adept_restrictions:
    animal_form_adept_powers: Adept powers which affect physical attributes apply only to the shapeshifter's
      human form.
    animal_form_spellcasting: Shapeshifter magicians in animal form can cast spells and summon spirits.
    animal_form_centering_and_geasa: Animal-form magicians cannot use Centering Skills or fulfill geasa which
      their animal form cannot perform.
    animal_form_other_adept_powers: A shapeshifter in animal form cannot use any adept powers; they function
      in human form only.
  transformation:
    action_type: Complex Action
    equipment_and_clothes: Transformation from human to animal form does not include clothing/equipment; remove
      them first or the clothing can rip and equipment can be damaged.
    animal_social_skills: Animal form cannot speak or use Social Skills other than Intimidation; can communicate
      with others of its own species.
  source_boundaries:
    racial_modifiers: Referenced source table on printed p36/PDF37, to be normalized separately.
    attribute_limits: Referenced source table on printed p37/PDF38, to be normalized separately.
    regeneration_and_silver: Referenced source-specific mechanics on printed pp36-37/PDF37-38, to be normalized
      separately.
framing: reference_exact
