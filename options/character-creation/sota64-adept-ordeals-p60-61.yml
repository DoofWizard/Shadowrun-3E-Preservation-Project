data:
  publication: {title: 'State of the Art: 2064', publisher: FanPro, catalog_number: FanPro25004, edition: Shadowrun Third Edition, chapter: The Path of the Adept, section: New Ordeals, printed_pages: '60-61', physical_pdf_pages: '61-62'}
  relationship: Extends adept initiation ordeals in Magic in the Shadows pp58-61.
  masterpiece:
    minimum_months: 1
    work: Entirely original, challenging artistic work requiring complete concentration, without ordinary work, study or shadowrunning during the ordeal.
    prerequisite: Know Virtuoso metamagic (p64) or learn it during the initiation, and possess an appropriate artistic Knowledge skill.
    success: Create a successful virtuoso work; otherwise the ordeal fails and the artist must restart.
    repeat: Each subsequent masterpiece ordeal starts anew with a distinctly new theme.
  way_ordeal:
    procedure: Character and gamemaster devise a trial appropriate to progress along the chosen way and significant to philosophical development.
    cost: Significant sacrifice of resources, time or even attribute points, at gamemaster discretion.
    result: Must be measurable.
    examples:
      speaker: Groundbreaking address appropriate to the ambition (e.g. televised keynote advancing a scientific agenda or political cause), counseling that saves a person affected by chip dependency or abuse at imminent risk of suicide, or a major risky confidence scheme.
      athlete: Win a major sporting contest or perform at a premier venue in the field.
      faith_based_cultural_way: Earn peer respect through pilgrimage, evangelical publication or recovery of a lost religious icon.
    scope: Examples are alternatives, not mandatory trials; no fixed target number or cost is printed.
framing: reference_exact
headline: "Fictional Shadowrun Third Edition: Masterpiece and Way Ordeals (FanPro25004)"
