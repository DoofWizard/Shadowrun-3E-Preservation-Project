    - 29
    original_pdf_sha256: 8c52409108459a130ff6292722d98dc1f7a65cf870e63e363c34dc1dc299afd5
  original_heading: MAGICAL EDGES AND FLAWS
  opening_scope: Unless a specific entry says otherwise, any character can take a
    Magical Edge or Flaw; individual entries give their own Awakened or non-Awakened
    restrictions.
  optional_traits:
  - name: Astral Chameleon
    kind: Edge
    point_value: 2
    eligibility: Only Awakened characters may take this Edge.
    astral_signature_effective_force_modifier: -1
    signature_recognition_or_assensing_target_number_modifier_for_observer: 2
    source_condition: Each astral signature left by the character blends more quickly
      into astral background and is treated as though its Force were one less.
    paired_opposite_flaw: Astral Impressions
  - name: Astral Impressions
    kind: Flaw
    point_value: -2
    eligibility: Only Awakened characters may take this Flaw.
    astral_signature_effective_force_modifier: 1
    signature_recognition_or_assensing_target_number_modifier_for_observer: -2
    source_condition: Astral signatures left by the character stand out and persist
      as though their Force were one higher.
    printed_modifier_wording: The original uses a subtraction verb with a signed
      negative two; its contextual intent is easier reading. Preserve the printed
      ambiguity rather than treating subtraction of a negative as a new bonus.
    paired_opposite_edge: Astral Chameleon
  - name: Focused Concentration
    kind: Edge
    point_value: 2
    eligibility: Only Awakened characters may take this Edge.
    spell_sustaining_target_number_modifier: 1
    comparison: The Companion specifies a plus-one sustaining modifier; the ordinary
      plus-two modifier is the core-rule comparison.
    maximum_simultaneously_sustained_spells_formula: Intelligence Rating + 1
    limitations:
    - This Edge does not permit performing Exclusive Actions while the character sustains
      spells.
    - It does not permit sustaining an Exclusive spell while another magical activity
      is performed.
    original_core_cross_reference: Shadowrun Third Edition printed p160, Exclusive
      Action requirements.
  - name: Magic Resistance
    kind: Edge
    allowed_point_values:
    - 1
    - 2
    - 3
    - 4
    eligibility: Character may not be magically active; this includes even minor magical
      ability.
    added_dice_for_spell_resistance_tests_per_point: 1
    positive_and_negative_spells: The bonus applies when resisting helpful spells
      such as Heal, not only harmful spells.
    cannot_lower_magic_resistance: true
    scope_of_involuntary_resistance: The source explicitly includes all spells and magical
      effects, beneficial or adverse; it does not establish a new numerical test for
      effects lacking a resistance procedure.
    willing_subject_exception: A magically resistant character is never a willing
      subject for a spell requiring a voluntary subject, so such a spell automatically
      fails when used on the character.
    distinction: This is an optional Companion character Edge for nonmagical characters,
      not the adept Magic Resistance power from the core rulebook.
  - name: Poor Link
    kind: Edge
    original_literal_value_line: Value 2
    point_value: 2
    enemy_ritual_sorcery_link_test_target_number_modifier: 2
    condition: Apply to the Link Test portion of any ritual sorcery directed against
      the character.
    source_limitation: The book notes that the benefit may instead make friendly magical
      attempts to locate or aid the character more difficult.
    note_on_source: Printed p28 calls the trait an Edge and gives positive Value 2;
      do not infer that its name is a Flaw.
  - name: Spirit Affinity
    kind: Edge
    point_value: 2
    chosen_spirit_kind: One particular kind of nature spirit.
    gm_effect: Spirits of the chosen kind are attracted to the character. They are more
      inclined to perform favors for a shaman character and may occasionally perform
      small favors unasked. In some situations they may hesitate to attack; the source
      says they are likely to use a nonlethal power.
    source_limitation: No universal compulsory dice modifier, free service count,
      or spirit summoning bonus is specified.
    paired_opposite_flaw: Spirit Bane
  - name: Spirit Bane
    kind: Flaw
    point_value: -2
    chosen_spirit_kind: One particular kind of nature spirit.
    gm_effect: Spirits of the chosen kind dislike the character, are likely to harass
      the character in their Domain, and may be reluctant to assist the character or
      friends. If ordered to attack a party including the character, they target that
      character first and seek the character’s destruction within the fictional encounter.
    source_qualifier: The book states that spirits of either relationship may reappear
      in the same form and seem to remember previous conjurings; no fixed recall test
      is specified.
    printed_wording_ambiguity: The paragraph describing Spirit Bane uses the phrase
      'Spirit Bane Edge'; the heading pairs an Edge with a Flaw and lists +2/-2. Preserve
      the apparent wording tension without treating Spirit Bane as a positive-cost
      Edge.
  adjacent_excluded_section:
    heading: MATRIX EDGES & FLAWS
    original_start: printed p28 / physical PDF29, separately pending original p29
      continuation review
    status: not_included_in_this_magical_section
