id: option.character-creation.srcomp-miscellaneous-edges-flaws-p29-32
record_type: option
status: source_reviewed
source: source.srcomp
printed_pages: 29-32
pdf_pages: 30-33
edition_scope: FASA Corporation Shadowrun Companion FASA7905a, Shadowrun Third Edition
  optional character Edges and Flaws
content_class:
- character_option
headline: Shadowrun Companion Miscellaneous Edges and Flaws, original printed pp29-32/PDF30-33.
summary: 'Original FASA7905a optional character features: costs, conditional outcomes
  and gamemaster discretion, as reported in the published fictional tabletop game.'
data:
  publication:
    title: Shadowrun Companion
    publisher: FASA Corporation
    catalog: FASA7905a
    edition: Shadowrun Third Edition
    printed_pages:
    - 29
    - 30
    - 31
    - 32
    physical_pdf_pages:
    - 30
    - 31
    - 32
    - 33
  original_heading: Miscellaneous Edges and Flaws
  scope: The optional published individual character Edges and Flaws; their point
    values are those printed in the original p29-30 descriptions and p31 numerical
    summary table.
  options:
  - name: Bad Karma
    kind: Flaw
    point_value: -5
    effect: The Karma cost for increasing the character Karma Pool is doubled.
  - name: Cranial Bomb
    kind: Flaw
    point_value: -6
    fictional_effect: The gamemaster chooses an existing implanted device, the identity
      of its planter and its purpose; the player does not spend starting Resource
      points on the device.
    after_neutralization: If the character successfully disarms the device, the gamemaster
      may replace this Flaw with equal-value Extra Enemies, Bad Reputation, Amnesia,
      Phobia or another Flaw.
    provenance: Historical fictional game-option consequences only; the publication
      refers elsewhere for bomb variants, not an instruction to construct a device.
  - name: Cursed Karma
    kind: Flaw
    point_value: -6
    trigger: Whenever a character uses a Karma Pool point.
    check: Roll 1D6.
    result_on_one: The point is expended but produces the opposite of the intended
      effect; the example of adding a die instead loses a die.
  - name: Daredevil
    kind: Edge
    point_value: 3
    per_session: Receives one extra Karma Pool point for that game session.
    use_condition: Can be used only for a heroic or particularly risky action.
    after_use: The extra point is gone for the remainder of that session.
    burn_for_permanent_effect: false
  - name: Gremlins
    kind: Flaw
    allowed_point_values:
    - -1
    - -2
    - -3
    - -4
    trigger: Whenever the character handles a piece of equipment, make a 2D6 malfunction
      check.
    malfunction_on: 2
    consequences_by_point_value:
      '-1': Affected equipment operates with an adverse +1 or -1 modifier to applicable
        Success Tests or effect-value ratings until the character spends a Simple
        Action banging it against a hard surface; normal operation returns in the
        next Combat Phase.
      '-2': Affected equipment does not work; the character must spend a Simple Action
        to bring it online for the next Combat Turn.
      '-3': Major malfunction gives an adverse +2 or -2 modifier to Success Tests
        or effect-value ratings and requires repair; suggested cost is twice the equipment
        cost, plus repair labor if applicable.
      '-4': Equipment breaks down and ceases to work; suggested repair cost is five
        times the equipment cost, plus labor if applicable.
    vehicle_application: A vehicle driven by the affected character may have a major
      subsystem, customized modification or special feature fail; the gamemaster may
      test each item or choose a single system for the result.
    exclusion: Does not affect cyberware or magical equipment.
    electronic_media_exception: The original says electronic hermetic libraries may
      be affected and may lose data or malfunction.
  - name: Hunted
    kind: Flaw
    allowed_point_values:
    - -2
    - -4
    - -6
    reference: Uses the Enemy system described in the same Companion, printed p68.
    by_point_value:
      '-2': A Rank 3 Enemy, or one extra point added to an existing Enemy.
      '-4': A Rank 4 Enemy, or two extra points added to an existing Enemy.
      '-6': A Rank 5 or 6 Enemy subject to gamemaster approval, or three extra points
        added to an existing Enemy.
    persistence: Enemies actively hunt the character; if the original Enemy is killed,
      a new Enemy replaces it at the same rank.
  - name: Mysterious Cyberware
    kind: Flaw
    point_value: -3
    source_condition: The gamemaster chooses an implanted piece of cyberware unbeknownst
      to the character and may reveal it at an inconvenient moment.
    after_discovery: When discovered and removed or neutralized, the gamemaster may
      replace this Flaw with equal-value Extra Enemies, Bad Reputation, Amnesia, Phobia
      or another Flaw.
  - name: Pirate Family
    kind: Edge
    point_value: 3
    character_condition: Only characters born and raised within the fictional pirate
      life qualify.
    benefit: The character has extensive pirate-family connections in many ports that
      may help or hinder, but these persons count as Friends and not ordinary Contacts.
    gm_alternative: The gamemaster may make this a Flaw or reduce its initial Edge
      cost to 1; the publication does not fix an alternate Flaw point value.
    connection_scope: The fictional family extends beyond blood relatives to past
      crew, family friends, mentors and others.
  - name: Police Record
    kind: Flaw
    point_value: -6
    contact_limit: At creation, the character may only have street-level contacts;
      corporate types are excluded.
    surveillance_and_identity: The fictional record may include face, fingerprints,
      cyberware and modus operandi; Lone Star holds copies and patrol officers may
      recognize or harass the character.
    criminal_sin: true
    reporting_obligation: The character calls the parole officer every two days and
      checks in once a week.
    parole_details: The parole officer knows the character residence and usual contacts
      and may legally enter or break down the door under the published setting.
    if_record_cleared: If the record is expunged or character evades prior status,
      the gamemaster may replace with Hung Out to Dry, Bad Reputation, Extra Enemies,
      or other Flaws of equal point value.
  adjacent_already_separately_verified_option:
    name: Vehicle Empathy
    original_printed_page: 32
    canonical_id: option.character-creation.srcomp-vehicle-empathy-p32
    canonical_path: options/character-creation/srcomp-vehicle-empathy-p32.yml
    point_value: 2
    note: A distinct gate-confirmed canonical option already preserves the physical-vehicle-contact
      requirement and vehicle Handling -1; do not duplicate it here.
  printed_p31_global_reference_table:
    source_heading: Edges Table / Flaws Table
    use_in_this_record: The Miscellaneous category point values are preserved above;
      unrelated categories and their full original p31 numeric catalog remain separate
      source-verified normalization work.
  lineage:
    framework: subsystem.character.edges-flaws
    balance: rule.character.edges-flaws-balance
    effective: Optional features, not automatic additions to every Shadowrun Third
      Edition character.
framing: reference_exact
