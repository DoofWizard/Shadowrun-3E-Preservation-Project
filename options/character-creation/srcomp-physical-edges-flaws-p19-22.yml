id: option.character-creation.srcomp-physical-edges-flaws-p19-22
record_type: option
status: source_reviewed
source: source.srcomp
printed_pages: 19-22
pdf_pages: 20-23
edition_scope: FASA Corporation, Shadowrun Companion, FASA7905a, Shadowrun Third Edition;
  optional character creation
content_class:
- character_option
headline: 'FASA Shadowrun Companion FASA7905a (Third Edition), original printed pp19-22/PDF20-23:
  physical Edges and Flaws'
summary: Source-specific optional physical character traits, their point costs, numeric
  test and Attribute effects, qualifications and incompatible combinations in the
  published tabletop game.
data:
  publication:
    title: Shadowrun Companion
    publisher: FASA Corporation
    catalog: FASA7905a
    edition: Shadowrun Third Edition
    original_printed_pages:
    - 19
    - 20
    - 21
    - 22
    physical_pdf_pages:
    - 20
    - 21
    - 22
    - 23
    source_pdf_sha256: 8c52409108459a130ff6292722d98dc1f7a65cf870e63e363c34dc1dc299afd5
  source_heading: PHYSICAL EDGES AND FLAWS
  scope: Optional character-creation benefits and restrictions in the original publication.
    Not automatically granted to every character.
  exclusions_previously_normalized:
  - name: Adrenaline Surge
    canonical_path: options/character-creation/srcomp-adrenaline-surge-allergy-p18-19.yml
  - name: Allergy and Allergy Table
    canonical_path: options/character-creation/srcomp-adrenaline-surge-allergy-p18-19.yml
  physical_options:
  - name: Bio-Rejection
    kind: Flaw
    point_value: -5
    point_value_magically_active: -2
    effect: Body rejects cyberware implants; any replacement organs or limbs must
      be cloned from the character's own cells.
    original_incompatibilities:
    - Bio-Rejection and Sensitive System cannot both be selected.
    - Shamans whose totem gives cyberware penalties (original examples Eagle and Unicorn)
      cannot select Bio-Rejection.
  - name: Blind
    kind: Flaw
    point_value: -6
    point_value_magically_active: -2
    visual_test_target_modifier: 6
    cyber_replacement_eyes_cannot_cure: true
    magical_astral_perception_possible: true
    magically_active_physical_visual_test_target_modifier: 2
    rigging_matrix_effect: Determine per character whether the underlying blindness
      affects their rigging or Matrix actions; it can be inconsequential to simsense
      or prevent those actions depending on cause.
    incompatible_with:
    - Color Blind
    - Night Blindness
  - name: Borrowed Time
    kind: Flaw
    point_value: -6
    secretly_rolled_remaining_game_months: 3D6
    effect: The gamemaster secretly determines the character's finite in-game lifespan
      and narrates the outcome when it expires.
    optional_gm_exchange: If the player later requests a different fate, the gamemaster
      may exchange this for another Flaw worth -6, at the gamemaster's discretion;
      the alternative must not be offered at initial selection.
  - name: Color Blind
    kind: Flaw
    point_value: -1
    distinction_of_colors_target_modifier: 4
    cannot_be_cured_by_cyber_replacement_eyes: true
    incompatible_with:
    - Blind
  - name: Deaf
    kind: Flaw
    point_value: -3
    point_value_if_rigging_and_matrix_unaffected: -1
    hearing_tests_possible: false
    hearing_relevant_test_target_modifier: 4
    cyberware_cannot_cure: true
    rigging_matrix_effect: The GM and player assess whether nerve damage versus brain
      disorder affects rigging or Matrix hearing and other actions; cases without
      such impact use the -1 value.
  - name: Double Jointed
    kind: Edge
    point_value: 1
    athletics_escape_artist_test_target_modifier: -1
    confined_space_effect: GM may permit traversal of small, cramped spaces inaccessible
      to less limber characters.
  - name: High Pain Tolerance
    kind: Edge
    point_value_per_ignored_damage_box: 2
    effect: For each two Edge points, character resists the effect of one box of physical
      or mental damage, starting at Light wound and moving up, using the adept Pain
      Resistance power rules in other respects.
    source_cross_reference: SR3 core printed p170, adept Pain Resistance
  - name: Infirm
    kind: Flaw
    allowed_point_values:
    - -1
    - -2
    - -3
    - -4
    - -5
    physical_attribute_maximum_reduction_per_flaw_point: 1
    cap_exception: If the reduced Attribute Maximum falls below the Racial Modified
      Limit, the reduced maximum serves as both the Attribute Maximum and Racial Modified
      Limit.
  - name: Lightning Reflexes
    kind: Edge
    allowed_point_values:
    - 2
    - 4
    - 6
    surprise_only_reaction_bonus_per_two_edge_points: 1
    maximum_purchased_reaction_bonus: 3
    reaction_bonus_applies_to_initiative: false
    surprise_bonus_cumulative_with_other_reaction_modifiers: true
    incompatible_with:
    - Combat Sense adept power
  - name: Low Pain Tolerance
    kind: Flaw
    point_value: -4
    injury_wound_level_increase_for_target_modifiers: 1
    scope: Increase Wounds by one level when calculating wound-related target modifiers,
      not an extra box of actual damage.
  - name: Natural Immunity
    kind: Edge
    allowed_point_values:
    - 1
    - 3
    one_point: Immunity against one natural disease or toxin, chosen jointly with
      the gamemaster; excludes synthetic toxins and biological warfare agents.
    three_points: Tolerates one specific drug or poison, including synthetic or biological
      toxins, without ill effects subject to the dosage interval.
    qualification: The GM and player choose one plausible substance the character
      could encounter.
    safe_interval_days_formula: Body + 2
    extra_doses: Taking more than one dose within that interval causes normal poison
      damage; recovery begins after Body + 2 days if the character survives.
  - name: Night Blindness
    kind: Flaw
    point_value: -2
    point_value_for_riggers_or_deckers: -1
    added_visual_test_target_modifier_in_full_darkness_or_minimal_light: 2
    additional_to_core_darkness_modifiers: true
    rigging_matrix_effect: Original states that assisted vehicle sensors and Matrix
      visual stimuli remove the ordinary disability in those modes.
    incompatible_with:
    - Blind
  - name: Night Vision
    kind: Edge
    point_value: 2
    point_value_for_riggers_or_deckers: 1
    grants_human_low_light_vision: true
    source_comparison: As with metahumans possessing low-light vision; consult SR3
      core Perception modifiers.
    rigging_matrix_effect: No practical effect when rigging using image-intensive
      vehicle sensors or in the Matrix.
  - name: Paraplegic
    kind: Flaw
    point_value: -3
    physical_limit: Lower body paralyzed; cannot use the legs for ordinary physical
      tasks and normally moves using a wheelchair.
    combat_pool: Halve Combat Pool, rounding down.
    astral_and_matrix_pools: No restriction to full Hacking and Astral Combat Pools.
    cannot_be_cured_by_cyberware: true
    incompatible_with:
    - Quadriplegic
  - name: Quadriplegic
    kind: Flaw
    point_value: -6
    physical_limit: Paralyzed from neck down and cannot perform physical tasks; Attribute
      ratings and Mental Skills remain governed by normal character rules.
    mental_test_note: Physical Attributes still used in calculations such as Reaction
      where applicable; the Flaw does not modify the underlying Attribute ratings.
    matrix_and_astral_pools: Full Hacking and Astral Combat Pools remain available.
    cyberware_or_magic_cannot_cure: true
    incompatible_with:
    - Paraplegic
  - name: Quick Healer
    kind: Edge
    point_value: 2
    healing_test_target_number_modifier: -2
    minimum_target_number_after_modifiers: 2
  - name: Resistance to Pathogens
    kind: Edge
    point_value: 1
    additional_body_dice_to_resist_disease: 1
  - name: Resistance to Toxins
    kind: Edge
    point_value: 1
    additional_body_dice_to_resist_drugs_or_toxins: 1
  - name: Sensitive System
    kind: Flaw
    point_value: -3
    point_value_magically_active: -2
    cyberware_essence_loss_multiplier: 2
    magically_active_magic_rating_effect: Deduct the total resulting Essence loss
      caused by this Flaw from the character's Magic Rating.
    incompatible_with:
    - Bio-Rejection
  - name: Toughness
    kind: Edge
    point_value: 3
    additional_body_dice_for_damage_resistance_tests: 1
    bonus_applies_to: Damage Resistance Tests only.
    cumulative_with_natural_dermal_armor: true
  - name: Water Sprite
    kind: Edge
    point_value_per_ability_improvement: 1
    improvements:
    - ability: Holding Breath Underwater
      value: +20 seconds per Edge point
    - ability: Swimming distance
      value: +0.1 multiplier per Edge point
    - ability: Swimming fatigue
      value: +1 to fatigue rate, ordinarily Body + 2
    - ability: Treading Water fatigue
      value: +1 minute to the interval between Swimming Tests, ordinarily Strength
        in minutes
    - ability: Treading Water damage
      value: -1 target number for Damage Resistance Test
    - ability: Floating buoyancy
      value: -1 target modifier for Buoyancy and Treading Water Tests except resistance
        to Damage
    - ability: Floating duration
      value: +1 Body for duration afloat
    source_cross_reference: Original Companion printed pp47-48 Athletics, Swimming,
      Treading Water and Floating procedures.
  - name: Weak Immune System
    kind: Flaw
    point_value: -1
    disease_resistance_body_dice_modifier: -1
    minimum_body_dice_for_disease_resistance: 1
    source_qualification: Triggered by immune-suppression treatment used in cybernetic
      or biogenetic procedures, though the published Flaw is not limited to one precise
      implant.
  - name: Will to Live
    kind: Edge
    allowed_point_values:
    - 1
    - 2
    - 3
    additional_damage_overflow_boxes_per_edge_point: 1
    no_change_to:
    - unconsciousness threshold
    - incapacitation threshold
    - wound-based test target modifiers
  original_section_end: Mental Edges and Flaws starts at printed p22/PDF23 and is
    not part of this record.
  lineage:
    source_optional_framework: subsystems/character/edges-flaws.yml
    source_balance: rules/character/edges-flaws-balance.yml
    summary_table: options/character-creation/srcomp-edges-flaws-original-point-value-tables-p31.yml
framing: reference_exact
