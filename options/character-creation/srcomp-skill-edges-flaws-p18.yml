content_class:
- character_option
headline: 'Original FASA7905a Shadowrun Companion printed p18/PDF19: Aptitude, Incompetence,
  Computer Illiterate and Home Ground skills options.'
summary: Optional Edges and Flaws with exact target-number signs, per-skill restrictions,
  location limits and discretionary gamemaster tests.
data:
  publication:
    title: Shadowrun Companion
    publisher: FASA Corporation
    catalog: FASA7905a
    edition: Shadowrun Third Edition
    printed_page: 18
    physical_pdf_page: 19
  source_heading: SKILL EDGES AND FLAWS
  entries:
  - name: Aptitude
    kind: Edge
    point_value: 4
    modifier_to_tests_with_selected_skill: -1
    skill_restriction: Must be a skill the character can use. Neither Aptitude nor
      Incompetence may apply while defaulting to that skill.
    limit: A character may take Aptitude or Incompetence only once for any individual
      skill.
    gamemaster_guidance: The gamemaster may limit the character to one Aptitude, and
      should consider character balance carefully before allowing Aptitude for Combat,
      Magical or Computer skills; this is advice, not an absolute printed ban.
  - name: Incompetence
    kind: Flaw
    point_value: -2
    modifier_to_tests_with_selected_skill: 1
    skill_restriction: Must be a skill the character can use; no effect when defaulting
      to that skill.
    limit: A character may take Aptitude or Incompetence only once for any individual
      skill.
    gamemaster_guidance: The book suggests the gamemaster can allow several different
      Incompetence options and should showcase the limitations in play when feasible.
  - name: Computer Illiterate
    kind: Flaw
    point_value: -3
    equipment_scope: Any test involving a computer or other electronic device, regardless
      of its shape or form.
    test_modifier: 1
    optional_extra_mundane_tasks: Gamemaster may require Success Tests against target
      number 4 even for routine tasks such as an unfamiliar telecom, e-mail or recording
      device; this is optional GM judgment, not a fixed universal additional roll.
    affected_character_types: May apply to riggers and deckers as well, as the source
      does not categorically exclude them.
  - name: Home Ground
    kind: Edge
    point_value: 2
    active_skill_test_modifier_within_home_ground: -1
    knowledge_skill_test_modifier_within_home_ground: -2
    scope: 'A fixed place intimately familiar to the character: a bounded local area
      no larger than a building, or a distinct campaign environment encountered infrequently.'
    example_for_decker: A particular familiar Matrix host or system, rather than unrestricted
      advantage on all hosts or the entire Matrix.
    matrix_home_ground_example_modifier: -1
    matrix_home_ground_example_test_scope: The source describes the modifier as applying to all tests in the selected system. It does not specify how this wording interacts with the general Knowledge Skill modifier; do not stack the two by assumption.
    gamemaster_approval: All home-ground selections require gamemaster approval.
    cannot_move_home_ground_to_new_location: true
    if_original_home_ground_destroyed: The character loses the Edge.
  aptitude_and_incompetence_session_guidance: If possible, the gamemaster should highlight both kinds of trait at least once per game session; this is guidance, not an automatic test or compulsory event.
  original_source_table_link:
    source_printed: 31
    original_pdf: 32
    canonical_table: options/character-creation/srcomp-edges-flaws-original-point-value-tables-p31.yml
    distinction: Aptitude and Home Ground are Edges; Incompetence and Computer Illiterate
      are Flaws; full effects come from this p18 original-description record rather
      than merely the table.
framing: reference_exact
