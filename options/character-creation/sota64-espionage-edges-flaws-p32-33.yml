  options:
    diplomatic_immunity:
      type: Social Edge
      value: 2
      prerequisite: Possess SIN under host sponsor identification system; immunity
        abroad only in jurisdictions recognizing sponsor
      protected_actions: Cannot be arrested, charged, or convicted of felony or misdemeanor
        abroad in recognizing jurisdiction; cannot be searched without permission
      limitations:
      - May be temporarily detained while law enforcement validates credentials
      - Can be expelled as persona non grata
      - Immunity can be revoked by sponsor for conduct or political embarrassment
      - After revocation, the sponsor embassy or extraterritorial property is protective
        scope only, as presented in source
      - Sponsor legal system still applies; sponsor may prosecute or extradite
      - Sponsor holds extensive background information and can track use of required
        sponsor SIN
      real_world_scope: Purely fictional game Edge, not contemporary advice about
        diplomatic law
    dossier_on_file:
      type: Social Flaw
      value: -4
      effect: Fictional agency or corporation possesses detailed, accurate dossier
        including cover identities, biographical weaknesses, known relationships and
        lifestyles
      non_effect: Presence of dossier does not itself mean an active enemy is hunting
        the character
      enemy_rules_if_used:
        cross_reference: Shadowrun Companion pp68-70 enemy system
        enemy_knowledge_rating_minimum: 5
        enemy_overall_rating: Increases as result of Knowledge floor, usually +1;
          GM may decline rise if unjustified hostility
        applicability: Only an enemy legitimately able to access substantial secure
          intelligence dossier
      erasure_scope: Dossiers are very hard to erase; intended as major adventure
        objective rather than ordinary quick Matrix operation
    incomplete_deprogramming:
      type: Mental Flaw
      value: -2
      stress_trigger: Interrogation, combat, injury, or other stressful situation
      initial_test:
        attribute: Willpower
        target_number: 4
        failure: Cover identity takes control for GM-determined minutes to hours;
          original personality and cover behaviors not merged
      temporary_cover_state:
        duration: GM discretion, several minutes to several hours
        actions: Character uses cover identity personality and memories
        possible_skill_effects: May forget skill or specialization, using reduced
          level or defaulting; no exact reduction printed
      subsequent_stress_test:
        attribute: Willpower
        target_number: 4
        failure: Real personality regains control; this is specifically the printed
          unusual inverse outcome
      cycles: May relapse or re-emerge several times in extended stressful situations
  scope_boundary: Exactly three Game Information Edges/Flaws; following New Spells
    and their success table are separately scoped.
