data:
  publication_context: 'Fictional tabletop RPG archival source: Missions, FASA Corporation,
    copyright 1996, FASA7325, original Second Edition, source.fasa-7325, printed pp8/PDF
    pp9.'
  source_review_scope: Statements below report this fictional published source; scenario
    options are hypothetical game-master branches, not historical assertions or real-world
    advice.
  character_creation_context: These are original Second Edition-era options for undercover
    Lone Star player characters in the optional Under the Influence adventure, not
    universal SR3 rules.
  departmental_roles: Most player characters may be Division of Investigation personnel,
    particularly Special Investigation or Organized Crime; one or two can be loaned
    from Paranormal Investigation. Other divisions can be reassigned.
  street_contacts: Every player character should have Street Etiquette plus any other
    Etiquette for internal Lone Star communications that the game master considers
    appropriate, and at least 1 street contact.
  cyberware_essence_limit: Lone Star policy prohibits officer cyberware causing more
    than 3 points of Essence loss. The authors restrict player characters to normal
    and alpha-grade cyberware; beta- and delta-grade upgrades are excluded under the
    stated salary premise. Cybered eyes, ears and smartlinks are identified as common
    options.
  starting_equipment: Each Lone Star officer has a handgun. Each player character
    may choose a single handgun of any size as the standard-issued weapon, a DocWagon
    Platinum contract, and a communication system (headware for mundane characters
    and an external system for magicians).
  registration: The fictional Lone Star database holds the characters’ fingerprints,
    retinal patterns, DNA, psychological profiles and personal histories.
  lifestyle: Lone Star player characters receive salary supporting a Middle lifestyle,
    generally through timed account systems.
  family_flaw: A player character with a family must take the Dependent Flaw, referenced
    to Shadowrun Companion p31.
  cross_references:
  - Shadowrun Companion p34 Registered Equipment Edge for externally hired shadowrunners.
  - For those hired runner characters, the game offers six months of DocWagon Platinum
    protection, SINs, and enduring fake identification.
  - Shadowrun Companion p117 “I Am the Law” for law-enforcement character guidance.
