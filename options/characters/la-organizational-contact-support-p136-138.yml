headline: 'Loose Alliances (FanPro25006, FanPro, SR3), printed/PDF pp136-138: conditional organizational assistance and character affiliations in the fictional game'
data:
  publication: {title: Loose Alliances, publisher: FanPro, edition: SR3, catalog: FanPro25006}
  campaign_affiliation: Characters may all belong to one organization or individually associate as contacts, members or supporters in a regular campaign.
  shared_membership: The GM determines the internal operation, key members and resources. Membership can confer backup, resources, influence and allegiances but also responsibilities and conditions.
  contact_access:
    one_contact_does_not_buy_whole_group_access: true
    outside_assistance: A group is likely to help outsiders only when doing so serves its interests; it expects compensation or a reward, which can include favors later called in.
    unauthorized_resource_use: A contact may use group resources for a character without authorization; potentially adverse consequences apply to both the contact and character.
    source_cross_reference: Shadowrun Companion (FASA7905a), printed p64, optional special contact networking.
