headline: 'Loose Alliances (FanPro25006, FanPro, SR3), printed/PDF p141: three fictional Equity campaign character roles and team composition'
data:
  publication: {title: Loose Alliances, publisher: FanPro, edition: SR3, catalog: FanPro25006}
  typical_roles:
    corporate_infiltrators: Fictional player characters may be corporate employees whose actual allegiance is to Equity; they provide sensitive corporate information to Equity and may act against corporate rivals while betraying both sides.
    data_specialists: Deckers and researchers are alternatives; a team emphasizes deckers and surveillance experts, supported by varied shadowrunning skills for acting on information when necessary.
    broadcasters: Trid pirates and other propagandists expose corporate secrets; the text describes mobility and a continuing supply of new information as practical needs. Crews often employ runners for protection or obtaining news.
