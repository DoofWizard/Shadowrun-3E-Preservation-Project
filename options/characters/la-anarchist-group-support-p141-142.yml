      preferred_recipients: Anarchist characters in legal difficulty.
      other_eligible_recipients: Activists pursuing causes the group supports and persecuted people may receive assistance when resources permit.
      assistance_categories: [Legal funding, Lawyers, Support campaigns, In-world prisoner liberation, In-world fugitive identity and shelter assistance]
      reciprocal_obligation: Recipients are asked to use their own skills to assist another person in need through the group.
    Anarchist Black Crescent:
      eligible_recipients: Anarchists and people in need.
      assistance_categories: [Emergency medical services, Cybersurgery]
      quality_and_equipment: The GM determines available care and equipment quality according to campaign and circumstances; resources may be limited or outdated.
      reciprocal_obligation: Medical care recipients are asked for a suitable favor in return, such as medical or ambulance service, magical healing for magician characters, or obtaining medical supplies.
