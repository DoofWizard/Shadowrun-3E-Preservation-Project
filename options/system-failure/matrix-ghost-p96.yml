data:
  publication: {title: System Failure, publisher: FanPro, edition: SR3, catalog: FanPro25014}
  heading: Down the Rabbit Hole Game Information
  applicability:
    event: Crash 2.0 Singularity
    separation: Temporary or permanent; permanent transition is exceptionally rare and accidental.
    hardware: Permanent transition is usually accompanied by sophisticated computing hardware not available to player characters.
    discretion: The gamemaster should carefully consider whether to permit player-character transition.
  options:
    - {type: retirement, effect: Retire the player character and consider use as an NPC.}
    - {type: matrix_only_entity, effect: Use the character's Matrix attributes at the time of transformation.}
    - {type: semi_autonomous_knowbot, abbreviation: SK, reference: {title: Matrix, heading: Autonomous Programs, printed_page: 147}}
  player_consultation: The gamemaster and player should discuss how the character reacts to the transformation.
  limits: The section provides discretionary alternatives, not a new transformation test or numerical probability.
