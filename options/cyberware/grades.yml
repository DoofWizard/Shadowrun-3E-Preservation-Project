selection:
  timing: "purchase/implantation"
  prerequisites: []
  incompatible_with: []

effects:
  - "Cyberware may be basic, alpha, beta, delta, or used."
  - "Alphaware reduces base Essence Cost by 20 percent (x0.8) and multiplies cyberware cost by 2."
  - "Betaware reduces base Essence Cost by 40 percent (x0.6) and multiplies cyberware cost by 4."
  - "Deltaware reduces base Essence Cost by 50 percent (x0.5) and multiplies cyberware cost by 8."
  - "Used cyberware uses the Essence reduction appropriate to its actual grade and has a cost multiplier of 0.5."
  - "Essence reductions are rounded up and cannot reduce Essence Cost below 0.01 by this method."
  - "Accessories/systems installed as components of graded cyberware generally must match the parent system's grade where the book specifies."

