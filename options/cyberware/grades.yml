id: option.cyberware.grades
record_type: option
name: Cyberware Grades
domain: cyberware
status: ingested
source: source.mm
printed_pages: '10-11,44-45'
pdf_pages: '10-11,44-45'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: Cyberware Grades, Acquisition and Implantation Conditions
summary: FASA7126 Man & Machine, FASA Corporation (1999), Shadowrun Third Edition tabletop RPG, printed and PDF pp10-11,44-45.
effective: {status: current, source: source.mm, page: 45, basis: extends}
option_for: [entity.cyberware.cyberware]
selection:
  timing: purchase/implantation
  prerequisites: []
  incompatible_with: []
effects:
  - Four grades are basic, alpha, beta and delta; used items are available in all except delta.
  - Grade affects Essence, purchase price, Availability and cyberlimb capacity and Concealability.
data:
  grade_table:
    alpha: {essence_multiplier: 0.8, cost_multiplier: 2, availability_modifier: 0, availability_time_multiplier: 1}
    beta: {essence_multiplier: 0.6, cost_multiplier: 4, availability_modifier: 5, availability_time_multiplier: 1.5}
    delta: {essence_multiplier: 0.5, cost_multiplier: 8, availability_modifier_minimum: 9, availability_time_multiplier_minimum: 3}
    used: {essence_multiplier: by actual grade, cost_multiplier: 0.5, availability: standard}
  essence: {rounding: up, minimum: 0.01}
  purchase_price_excludes: [doctor fees, hospitalization]
  manufacture: {mass_produced: [basic, alpha], individually_customized: [beta, delta]}
  availability:
    beta_starting_characters: false
    shadow_clinics: Basic and alpha equipment and often custom beta equipment are accessible.
    delta_access: Corporate clinic access is exceptional and controlled by the corporation; listed Availability is a minimum.
    used_access: Standard Availability, but providers may be unreliable.
  grade_matching:
    graded_device_accessories: same grade
    separately_purchased_system_components: same grade
    cyberlimb_or_body_compartment_devices: exempt from matching the grade of the containing limb or compartment
  used_stress: {permanent_points: 1D3, removable: false, cumulative_with_new_stress: true}
  introductory_grade_conditions:
    basic:
      ordinary_surgeon_or_street_doctor_can_implant: true
      individualized_or_purpose_specific_customization: false
    alpha:
      generally_ordered: true
      beginning_to_be_stocked: true
    beta:
      special_order_required: true
      custom_fitted_to_user: true
      preimplant_screening: [body condition assessment, chemical tests, DNA screening]
      takes_longer_to_produce: true
    delta:
      custom_built_during_surgical_process: true
      surgeon_training: [microelectronics, medicine]
      implants_parts_tools_cost_multiplier: 8
      street_availability: unavailable
      capable_clinics_often_offer_cybermancy_access: true
      medical_costs_and_repair_times: qualitatively much higher than standard, no numeric factor specified here
    used_delta:
      ordinarily_purchasable: false
      if_acquired_otherwise: may be installed as betaware
      note: No general change to the implant's grade or additional numerical cost modifier is stated here.
