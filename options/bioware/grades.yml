effects:
  - "Basic and cultured are the two grades. Basic bioware can also be ordered as cultured."
  - "Culturing basic bioware raises cost and Availability; the source labels its reduced index cost Essence Index."
  - "Used bioware is available only at basic grade, costs less, and begins with permanent Stress."
data:
  grades:
    printed_page: 76
    continuation_printed_page: 77
    basic: "Generic implant from an organ donor, not tailored to a particular recipient."
    cultured: "Custom-grown from the recipient's own cells; some implants require this grade to function."
    recipient_matching: "Matching blood type is required; metatype or gender may also need to match."
    growth_time_reference: "Body Parts Table, SR3 p123."
    implantation_context:
      printed_pages: "60,62,77"
      usual_treatment: "The source describes immunosuppressive treatment as usual during implantation; no separate numerical modifier is specified here."
      basic_grade: "The source describes basic bioware as manufactured by blood classification and metahuman type, rather than individually tailored."
      cultured_grade: "The source describes cultured bioware as protein-matched and cloned from the recipient's cellular matrix. Neural bioware is usually attached to the brain or neural pathways; those pieces require individual tailoring to function."
      acquisition_time: "Growing custom bioware takes longer than locating available generic implants; use the cited growth-time rules."
      basic_rejection_context: "The Used Bioware subsection on p62 describes basic bioware as generally genetically indifferent and cellularly homogeneous, precluding rejection. This is retained as the source's general description; the failed Implant Surgery rule on p147 separately describes rejection. Their scope interaction is not explicitly resolved by the source."
      surgery_reference: "M&M p147, Surgery"
  basic_as_cultured:
    printed_page: 77
    cost_multiplier: 4
    source_table_index_label: "Essence Index"
    source_table_index_multiplier: 0.75
    source_prose_index_reduction_percent: 25
    availability_target_modifier: 2
    availability_time_multiplier: 5
    street_index: "Source states that it is increased, but the table gives no separate numerical Street Index modifier."
    availability_excludes_cloning_time: true
    cloning_time_reference: "SR3 p128"
    already_cultured_only_implants: "Modifiers do not apply; they are already included in item descriptions."
    cosmetic_bioware_can_be_cultured: true
    terminology_note: "Retain the printed Essence Index label and prose; the source does not explicitly reconcile it with the surrounding Bio Index rules."
  used_bioware:
    printed_page: 77
    cost_multiplier: 0.60
    permanent_unremovable_stress_points: 1
    eligible_grade: basic
    cultured_reusable: false
    gm_discretion: "The gamemaster can rule that procedures which cannot practically be transferred are unavailable used; enhanced articulation is the source's example."
