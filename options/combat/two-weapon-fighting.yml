  "effects": [
    "Ranged: two pistol/SMG-class weapons; +2 TN to each, no smartgun/aiming modifiers, uncompensated recoil from either weapon affects the other, +2 per additional target, separate Attack Tests.",
    "Melee: lead-hand primary plus off-hand secondary no larger than primary. Roll primary skill plus half Off-Hand skill (round down); half bonus dice apply to off-hand portion, Combat Pool capped by primary skill, only primary Reach counts, and damage uses primary weapon.",
    "Without Off-Hand skill, use half Quickness for the secondary, +4 TN, no Combat Pool.",
    "Ambidexterity Edge 2/4/6/8 reduces second-firearm penalties by 1 per 2 Edge points; at 6, first weapon no penalty and second +1; at 8, both no penalty. At 6/8, ordinary weapon skill may replace Off-Hand skill in melee, but only half dice count for the secondary."
