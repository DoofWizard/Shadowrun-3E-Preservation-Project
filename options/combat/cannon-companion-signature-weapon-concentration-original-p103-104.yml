data:
  publication: {title: Cannon Companion, publisher: FASA Corporation, catalog_number: FASA7908}
  extends: option.combat.signature-weapon
  tabletop_rules:
    starting_character_option: not available at character creation; earned in play
    prerequisite: existing specialization in the weapon type and established preference for the specific weapon over others; designation at GM discretion
    personalized_grip_qualification: original requirement expressly refers to a signature firearm; Cannon Companion p82
    concentration_increase: use standard specialization advancement rules in SR3 p244 with the original Concentration Cost Table instead of ordinary cost
    loss_or_destruction:
      access: the character loses access to the unique weapon concentration; cannot simply replace the same signature weapon
      ordinary_specialization_option: add half the difference between old specialization and current concentration, rounded down, to ordinary specialization
      replacement_weapon_option: alternatively halve the current Signature Weapon skill and have a new weapon modified at that skill rating; no separate rounding instruction is stated for this alternative
    original_cost_example: {base_skill: 4, specialization: 6, concentration: 7, linked_attribute: 5, multiplier: 0.5, unrounded_good_karma: 3.5, paid_good_karma: 3}
