headline: FASA7126 optional box-by-box healing — seven modifier rows and recovery timing
summary: FASA7126 Man & Machine, FASA Corporation (1999), Shadowrun Third Edition tabletop rules, printed p134/PDF135.
effective: {status: optional, source: source.mm, page: 134, basis: adds_option}
option_for: [procedures.healing.natural-and-medical]
selection:
  timing: campaign healing rules
  prerequisites: []
  incompatible_with: []
effects:
  - Replaces standard SR3 pp126-127 Physical damage healing stages when selected.
  - Also applicable to bioware and Attribute Stress healing (M&M p130).
data:
  optional_healing_table:
    below_minimum_lifestyle: '+2 per level below minimum'
    above_minimum_lifestyle: '-1 per level above minimum'
    bad_conditions: 1
    terrible_conditions: 3
    consistent_recovery_assistance: '-floor(Biotech (Extended Care) / 2)'
    recovery_assistance_minimum_skill: 3
    patient_has_bioware: 'ceil(Bio Index / 2)'
    previous_box_rest_interrupted_by_activity: 1
  without_medical_care:
    test: Unaugmented Body
    target_number: Total Physical damage boxes plus wound modifiers and applicable Optional Healing Table modifiers.
    base_time_hours: '24 x total wound modifiers'
    positive_successes_time_hours: base time / successes
    zero_successes_time_hours: base time x 2
    time_credit: Rest only; physical activity and strenuous mental activity such as rigging or decking do not count.
    rest_may_be_interrupted: true
    completion: Remove one Physical damage box and determine the next box's healing duration anew.
    new_physical_damage_during_healing: Abort the current process and begin again.
  with_medical_care:
    base_time_multiplier: 2
    applies_expanded_doctoring_modifiers: true
    rest_may_be_interrupted: false
    doctor_daily_hours: 'Physical damage boxes / (doctor Biotech + tool Rating)'
    care_cost_reference: SR3 p128
    on_new_damage_level:
      test: Body
      target_number_reference: SR3 p126 Wound Table
      discharge_successes: 2
      automatic_discharge_at: Light wound
links:
  modifies: [procedures.healing.natural-and-medical]
