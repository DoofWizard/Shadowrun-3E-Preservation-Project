  reporter_prerequisites:
    portacam: Essential for a snoop; original p84 supplies no numerical minimum rating.
    interview: General Interrogation or a form of Interview is essential for reporters;
      p84 supplies no minimum rating.
    reporting: Original p85 identifies Reporting as the third career skill in this
      set; no minimum rating supplied.
  performance_list_scope:
    singing: Original p7 describes typical concentrations; p85 explicitly includes
      Rock as a concentration. Retain both lists without interpreting p7 as excluding
      Rock.
    instruments: Original p7 explicitly includes linked instruments as concentrations;
      p85 abbreviated list omits linked. No prohibition on linked concentration is
      printed.
    note: Reuse the already indexed concentration, specialization and attribute substitution
      data; no new skill rating or native SR3 hierarchy inferred.
