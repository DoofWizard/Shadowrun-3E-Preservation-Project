data:
  section:
  - Insect Totems
  - Insect Shamans
  - Increasing Potency
  - Insect Shaman Threat Rating
  source_context: Insect-shaman totems summon insect spirits with a more direct connection than conventional totems; normal traditional totem advantages,
    disadvantages and restrictions are not conferred.
  player_character_access: Source recommends that gamemasters not let player characters follow insect totems because hive-centered goals make them unsuitable
    player-character/teammate options.
  term_lineage: The term Potency replaces the Grimoire Second Edition insect/toxic Threat Rating terminology in this book, to distinguish from SRII p.187
    and Prime Runners p.100 Threat Rating.
  shaman_potency:
    initial_rating: 1D6 / 2 (round down), assigned by gamemaster.
    task_resolution: Each assigned hive/nest task accomplished increases Potency by 1; each failed task decreases Potency by 1.
    setting_link: Potency rises and falls as the shaman advances or fails the hive/nest agenda.
    spirit_control: Potency dictates the number of spirits controlled before summoning a Queen (specific limits on printed p.137).
  threat_rating:
    standard: Insect shaman Threat Rating = current Potency; increases/decreases with it (SRII p.187).
    optional_prime_runners: Under optional Prime Runners p.100 Magic Threat Rating rules, shaman Magic Threat Rating = Potency.
  gm_scenario_hooks:
    nature: Fictional, GM-assigned tests of an insect shaman serving the hive; the gamemaster should allow player characters a meaningful opportunity to
      disrupt an assignment.
    nonoperational_examples:
    - Source describes a rumor campaign against a public institution.
    - Source describes acquiring Neolithic artifacts for a hive.
    - Source describes coercive temporary displacement of residents of a city block.
    - Source describes creating a group of magically controlled workers.
  editions: Preserve period mechanics and cited books without inferred supersession.
summary: Insect-shaman Potency advancement, threat-rating linkage, and game-master character restriction.
framing: reference_exact
headline: Historical insect shaman Potency rules
