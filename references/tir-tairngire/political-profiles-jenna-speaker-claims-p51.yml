  editorial_method: Fictional Shadowrun tabletop-RPG source, reported in third person;
    narrator, in-world allegations, and optional hypothetical readings are kept distinct.
  claims:
  - speaker: Aegis
    claim: Aegis says little is known about Ni’Fairra and reports rumors of disagreements
      with Ehran and Laverty despite a superficially similar ideological orientation.
      The factional alignment is speculative.
  - speaker: Anonymous
    claim: An anonymous poster says they visited Ni’Fairra’s Crater Lake home and
      saw a large, old-looking painting kept behind sealed glass with equipment resembling
      a vacuum pump. The poster describes a woman resembling Ni’Fairra or a close
      relative, wearing a black-and-silver gown with thorn-like growths piercing her
      skin and producing blood; the poster interprets her expression as both serene
      beauty and extreme suffering. This is a single in-world eyewitness allegation
      about an image, not proof of the subject’s identity, the original event, or
      any actual person.
  - speaker: The Laughing Man
    claim: The Laughing Man refers to Ni’Fairra as a “Blood Queen” and hints at an
      undisclosed account but provides no substantiated details.
  - speaker: The Big ’D’
    claim: The Big ’D’ requests that account immediately; the Laughing Man declines,
      saying it will come in time.
  narrator_distinction: The rumor concerning Gerard McCoy and the artwork identification
    remain unverified. Do not convert this fictional testimony into factual real-world
    allegations.
