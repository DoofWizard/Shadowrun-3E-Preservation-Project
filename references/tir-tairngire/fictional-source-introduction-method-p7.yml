    in_world_setting: Fictional Shadowrun elven nation Tir Tairngire is described as occupying territory
      corresponding to contemporary Oregon in the game setting.
    format: Sourcebook presents most material as an in-world electronic-document dossier interspersed
      with Shadowland users’ comments and corrections.
    editorial_caution: Comments cannot automatically be treated as truthful, accurate, complete, considered
