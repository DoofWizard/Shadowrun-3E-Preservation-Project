    fictional_media: Shadowrun tabletop role-playing game
    edition: original/Second Edition historical setting
  editorial_method: Fictional Shadowrun tabletop-RPG source, reported in third person;
    narrator, in-world allegations, and optional hypothetical readings are kept distinct.
  claims:
  - speaker: Millicent
    printed_page: 55
    claim: Millicent reports a restaurant visit in Portland during which human diners
      were ignored until complaining and then received unwanted substitutions, unlike
      the elven customers present.
  - speaker: Randy
    printed_page: 55
    claim: Randy describes a friend who successfully filed a complaint against a restaurant
      and recovered a 1,000 nuyen fine and legal costs, but spent 50 hours over six
      weeks and estimated 4,000 nuyen in lost productivity; he considers the process
      ineffective.
  - speaker: Sean Fitzgibbons
    printed_page: 55
    claim: Sean Fitzgibbons, identifying as a representative for Clackamas Riding,
      says no non-elf has ever stood for election in that riding; this is his challenge
      to claims that office is denied.
  - speaker: Willis
    printed_page: 55
    claim: Willis argues that anticipated defeat could prevent non-elven candidates
      from applying, even without explicit exclusion.
  - speaker: Margo
    printed_page: 55
    claim: Margo alleges some Tir merchants post prices inflated roughly 10–25 percent
      and then give elf customers discretionary discounts, while non-elves must pay
      the public price. The numeric range and legal workaround are accusations from
      the speaker, not verified general policy.
  - speaker: The Chromed Bookkeeper
    printed_page: 55
    claim: The speaker asserts that effective tax rates are opaque and that, for otherwise
      similar employment and lifestyles, orks and trolls consistently pay more than
      elves; the criticism is not presented as a published tax table.
  - speaker: Latimer
    printed_page: 55
    claim: Latimer criticizes the gap between Tir’s sanctuary rhetoric and the reported
      discrimination.
  - speaker: Jacob
    printed_page: 55
    claim: Jacob sarcastically suggests elven residents see themselves as targets
      of prejudice elsewhere.
  - speaker: Bacchus
    printed_page: 55
    claim: Bacchus warns visitors to expect identity checks when buying alcohol at
      a bar or liquor store.
  certainty: Fictional in-world testimony and commentary; each speaker’s assertion
    is separately attributable.
