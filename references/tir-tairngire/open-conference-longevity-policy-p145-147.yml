data:
  publication:
    title: 'Tir Tairngire: The Land of Promise'
    publisher: FASA Corporation
    publication_year: 1993
    catalog_number: FASA7210
    source_id: source.fasa-7210
    edition: 1993 original/Second Edition, not converted to SR3
    source_pdf_sha256: ebe687016c4921013e3c58679d44f36a339e734935ff9ed18c69400d578e2e2e
    printed_pages: 145-147
    physical_pdf_pages: 151-153
  editorial_context: Source-reviewed third-person reporting from an historical fictional
    tabletop role-playing game; differentiate narrator facts, attributed forum claims
    and speculative material.
  speakers:
  - speaker: Fischer
    claim: 'Describes early metabolic studies of elven subjects as yielding uncertain
      projected lifespans: initially several centuries, then later an outside estimate
      near 125 years, stressing disputed analysis.'
    printed_page: 145
  - speaker: Stark
    claim: Notes the provisional and revisable nature of scientific inference, rather
      than accepting either projection as definitive.
    printed_page: 145
  - speaker: Babs
    claim: Questions why study results appeared without changes to underlying techniques,
      distinguishing scientific reproducibility from political suppression claims.
    printed_page: 145
  - speaker: Bluegenes
    claim: Speculates that someone offered researchers money or pressured them to
      withdraw results, while asking whether Spes can clarify.
    printed_page: 145
  - speaker: Spes
    claim: Claims pressure was indeed applied through government policy, but says
      he does not know who specifically ordered the withdrawal.
    printed_page: 146
  - speaker: Dr. Finn O’Doul
    claim: An identified Willamette University genetics professor in the discussion,
      argues that withholding claimed elven-life research from other metatypes was
      presented by Tir institutions as protection against resentment and that discovering
      a transferable longevity complex might extend other metatypes’ lives. This is
      his partisan explanation, not a verified narrator fact.
    printed_page: 146
  - speaker: Spes
    claim: Suggests contemporary elves born around or after the 2011 Awakening may
      reach approximately 400 years; additionally alleges aging may slow around age
      25 and resume much later, while qualifying his knowledge as secondhand or conjectural.
    printed_page: 147
  - speaker: Fischer
    claim: Questions speculative reports of some elves living substantially longer
      and asks Spes for a firmer answer.
    printed_page: 147
  source_limit: Public in-world forum discussion with disagreement; no longevity number
    or government motive is adopted as established factual game mechanics.
