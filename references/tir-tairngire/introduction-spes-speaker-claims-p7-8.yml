data:
  publication:
    title: 'Tir Tairngire: The Land of Promise'
    publisher: FASA Corporation
    publication_year: 1993
    catalog_number: FASA7210
    source_id: source.fasa-7210
    edition: Historical Shadowrun original and Second Edition compatibility stated in printed p7; no Third Edition conversion
      asserted
    source_pdf_sha256: ebe687016c4921013e3c58679d44f36a339e734935ff9ed18c69400d578e2e2e
    printed_pages: 7-8
    physical_pdf_pages: 8-9
  source_method: Third-person archival reporting from invented-world tabletop role-playing-game publication; named Shadowland
    participants express in-universe allegations, not established real-world history.
  attributed_in_world_claims:
  - speaker: Captain Chaos
    source: editorial opening and timestamped 2054 post
    claim: Says Shadowland repeatedly tried to publish information about the fictional Tir Tairngire, and claims files were
      corrupted, accidentally deleted or that original contributors were lost in various incidents. He interprets this pattern
      as possible deliberate suppression by Tír actors rather than verified publisher narration.
  - speaker: Captain Chaos
    source: editorial opening
    claim: Identifies Spes as a contributor claiming to be an elf from inside the Tír who supplied accounts of the country.
      The editor admits Spes is biased and says the Denver Data Haven stored replicated copies as a precaution. He also makes
      disputed allegations of a later attempted physical attack on that fictional data haven and conflict with Sioux security
      forces.
  - speaker: Captain Chaos
    source: 2-4-54 and 2-12-54 posts printed p8
    claim: Says multiple copies of Spes files were distributed, calls the government response evidence of seriousness, but
      acknowledges missing independent sources and warns that even the account of Tír affairs must be treated cautiously;
      confirms he supplemented Spes with excerpts from unannotated databases, tourist advisories and informational material
      and did not tag every imported source.
  - speaker: TomTom
    source: 2-8-54 and 2-10-54 posts printed p8
    claim: Claims the entire file could be a deliberately contrived disinformation effort in which an apparent attempt to
      suppress false material makes it seem true; uses sarcasm to challenge other commenters.
  - speaker: Marci
    source: 2-8-54 printed p8
    claim: Reacts skeptically to TomTom and describes his claim as paranoid.
  - speaker: Zack Black
    source: 2-10-54 and 2-11-54 printed p8
    claim: Says TomTom often perceives conspiracies and responds sarcastically to the dispute.
  - speaker: Lerefihen Verantin
    source: Signed Tir Tairngire Consul General, 2-13-54, printed p8
    claim: Denounces the document as biased and alleges the Humanis Policlub and its associates have fabricated claims to
      damage relations between the fictional Tír and other nations. The source does not independently establish the alleged
      affiliations or falsification.
  - speaker: Aegis
    source: 2-17-54 printed p8
    claim: Identifies as a former Tír insider and describes Spes files as one biased layer of an opaque society. He suspects
      some problems are deliberate and others concealed even from insiders, pledging to distinguish his observations from
      rumors and innuendo.
  - speaker: The Laughing Man
    source: 2-19-54 and 3-11-54 printed p8
    claim: Uses ambiguous remarks implying greater hidden knowledge, then critiques the exchange of anonymous accusations.
  - speaker: The Big 'D'
    source: 3-11-54 printed p8
    claim: Asks whether a contribution from this speaker would be considered unwise; no additional factual claim is supplied.
  evidence_limit: All the above are attributed fictional-source posts. Suspected deliberate interference, violent incidents,
    institutional motives and possible misinformation remain disputed or narrator-uncertain; none becomes an independently
    confirmed real-world event.
  chronology: The fictive forum posts are dated February–March 2054, whereas the real FASA publication is ©1993; preserve
    these distinct timelines.
framing: newsroom_neutral
