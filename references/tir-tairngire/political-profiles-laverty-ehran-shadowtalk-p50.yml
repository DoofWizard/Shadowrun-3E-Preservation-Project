  editorial_method: Fictional Shadowrun tabletop-RPG source, reported in third person;
    narrator, in-world allegations, and optional hypothetical readings are kept distinct.
  claims:
  - speaker: Ace Detective
    claim: Ace Detective claims a pre-Awakening Sean Laverty match connected him near
      the turn of the century with the Xavier Foundation, a selective boarding school/orphanage
      south of Portland. The comment alleges Foundation employees reviewed Oregon
      and Washington foster-care/orphanage records to identify and care for particular
      orphans, and speculates that Laverty and associates were gathering “spike babies”
      before the Awakening. The in-world account is uncorroborated and should not
      be promoted to established history.
  - speaker: Wisher
    claim: Wisher asks why foreknowledge, if genuine, was not publicly disclosed.
  - speaker: Keal
    claim: Keal proposes that advance knowledge could confer strategic power; this
      is an interpretation, not independently established motive.
  - speaker: Seer
    claim: Seer rejects a blanket negative reading and defends Laverty’s humanitarian
      ideals.
  - speaker: Cynic Supreme
    claim: Cynic Supreme mocks Ehran’s influence by suggesting that Tir might be named
      for him.
  - speaker: Aegis
    claim: Aegis jokes that a proposal to rename the nation after Ehran was voted
      down; the dialogue treats this as humor, not a documented vote.
  - speaker: Conrad
    claim: Conrad asserts that Ehran commands significant personal and political power
      and speculates that he might cease operating behind the scenes.
  - speaker: The Laughing Man
    claim: The Laughing Man jokes about Ehran’s age in terms of long-lived elves.
  - speaker: The Big ’D’
    claim: The Big ’D’ replies with a joke about age and personal hygiene.
  source: In-world Shadowtalk under Sean Laverty and Ehran the Scribe, printed p50.
