  editorial_method: Source-reviewed narrative from a FICTIONAL tabletop-RPG publication;
    book narrator, named in-world allegations and optional scenario material are distinct.
  claims:
  - speaker: Aegis
    source_page: 48
    claim: Interprets Surehand’s reputation for compromise as deliberate political
      leverage rather than helpless manipulation.
  - speaker: Darkheart
    source_page: 48
    claim: Alleges a shot was fired at Surehand during a June 2047 tour of Eugene;
      he says a magical shield stopped it and bystanders could not explain the event.
      This is a named account, not an independently established attack.
  - speaker: Wizard Walt
    source_page: 48
    claim: Speculates that the shield was triggered, physical, and connected to anchoring
      metamagic.
  - speaker: Allard
    source_page: 48
    claim: Notes the alleged 2047 event preceded public release of anchoring theory
      in 2053; asks how Darkheart knew of the alleged episode.
  - speaker: Brewster
    source_page: 49
    claim: Claims Glasgian Oakforest is antagonizing his father’s political peers
      and is abrasive and ambitious; assessment is attributed.
  - speaker: Glower
    source_page: 49
    claim: Alleges Glasgian has been seen around Andalusian Light Industry facilities
      and says this lends credence to rumors that the family owns an interest in that
      company.
  - speaker: Aegis
    source_page: 49
    claim: Relates an uncorroborated story that Mealla transformed a rural garden
      with magic and Aithne destroyed rose bushes, which she says contributed to the
      couple’s separation.
