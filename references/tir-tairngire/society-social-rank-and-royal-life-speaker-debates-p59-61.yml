  editorial_method: Source-reviewed neutral reference record from a FICTIONAL tabletop
    RPG; narrator, named allegations and optional scenarios remain separate.
  claims:
  - speaker: Lacey
    printed_page: 59
    allegation: Claims Gentry may defer compulsory Peace Force service by paying roughly
      22,000 nuyen and face a long government-imposed term after failing to enlist;
      speaker estimate is not statutory text.
  - speaker: Mondo Angeles
    printed_page: 59
    observation: Argues formal rank-specific modes of dress and address are socially
      consequential and that misaddressing people can offend or seem ignorant.
  - speaker: Raffi
    printed_page: 59
    observation: Claims many young Counts and Countesses volunteer for the Peace Force
      for ambition or family pressure despite weak enforcement.
  - speaker: Slade
    printed_page: 59
    claim: Warns prospective rank challengers that a Ducal demotion can cost developed
      lands and buildings, including investments.
  - speaker: Lady Macbeth
    printed_page: 61
    claim: Says unregistered irenis reject ranking formalities and are institutionally
      categorized regardless of their preference.
  - speaker: Bog
    printed_page: 61
    opinion: Criticizes the Royal class as benefiting at ordinary subjects’ expense,
      while narration distinguishes established capital and ceremony costs.
  - speaker: Bluegenes
    printed_page: 61
    claim: Discusses consanguineous marriage screening by a fictional Genetic Screening
      Board, including possible disapproval of apparently unrelated couples.
  - speaker: Portland Belle
    printed_page: 61
    claim: Alleges an unnamed Royal forest hunting party encountered dangerous supernatural
      creatures during a hunt; the incident is an in-world rumor, not a narrator-confirmed
      event.
  - speaker: Abby
    printed_page: 61
    claim: Distinguishes spousal rank at the time of marriage from changes occurring
      later in a marriage.
