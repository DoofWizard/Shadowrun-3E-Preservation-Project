data:
  publication:
    title: 'Tir Tairngire: The Land of Promise'
    publisher: FASA Corporation
    publication_year: 1993
    catalog_number: FASA7210
    source_id: source.fasa-7210
    edition: 1993 original/Second Edition, not converted to SR3
    source_pdf_sha256: ebe687016c4921013e3c58679d44f36a339e734935ff9ed18c69400d578e2e2e
    printed_pages: 147-149
    physical_pdf_pages: 153-155
  editorial_context: Source-reviewed third-person reporting from an historical fictional
    tabletop role-playing game; differentiate narrator facts, attributed forum claims
    and speculative material.
  claims:
  - speaker: Doc
    claim: Reports a hypothetical chromosome-4 gene cluster, colloquially a stopwatch
      complex, that could interrupt biological aging under high ambient magic; says
      he has not found a mechanism to reactivate aging afterward. This is an in-world
      research claim, not real biology.
    printed_page: 147
  - speaker: Sagan
    claim: Interprets laboratory work as proof of elven immortality, but other speakers
      explicitly dispute that certainty.
    printed_page: 148
  - speaker: Stark
    claim: Suggests a different complementary genomic feature might permit aging to
      restart and presses Doc to acknowledge theoretical possibilities.
    printed_page: 148
  - speaker: Doc
    claim: Says the proposed complementary complex has not been observed in his studies;
      absence of evidence is not asserted as logical impossibility.
    printed_page: 148
  - speaker: Slider
    claim: Points out that Doc and Dr. Samantha Stark have professional associations
      with Dr. Finn O’Doul’s research, implying possible bias; Stark denies current
      Tir involvement.
    printed_page: 148
  - speaker: Curious Curator
    claim: Suggests longer-lived individuals could predate the current high-mana period
      and asks if immortal elves really exist, while other discussants note short
      lives may result from danger rather than natural aging.
    printed_page: 149
  - speaker: The Big D
    claim: Warns participants against conflating fantasy with evidence and criticizes
      the speed with which claims of immortal elves are being believed; comments that
      the discussion has drawn attention from his online search programs.
    printed_page: 149
  forum_termination: After a purported intrusion alert, the captured fictional Shadowland
    transcript displays an illegal-code-sequence and repeated system-failure notices,
    then declares the connected node ceased transmitting. The exact triggering actor
    is not established.
  illustrations: The preserved source pages include monochrome portraits and a speculative
    creature illustration; these are art, not independent evidentiary support for
    forum claims.
