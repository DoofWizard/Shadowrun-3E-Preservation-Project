    physical_pdf_pages: 59-60
    source_pdf_sha256: ebe687016c4921013e3c58679d44f36a339e734935ff9ed18c69400d578e2e2e
  editorial_method: Source-reviewed narrative from a FICTIONAL tabletop-RPG publication;
    book narrator, named in-world allegations and optional scenario material are distinct.
  claims:
  - speaker: Ace Detective
    source_page: 50
    claim: Links a person resembling young Sean Laverty to the Xavier Foundation,
      an orphanage and boarding-school organization said to have shifted children
      from state-run systems in Oregon and Washington. Claims some of its children
      were elves born before the Awakening; the identification and inferred motives
      are speculative, not narrator-certified facts.
  - speaker: Whiser
    source_page: 50
    claim: Challenges the possibility that foreknowledge of the Awakening could have
      been concealed.
  - speaker: Keal
    source_page: 50
    claim: Interprets the alleged operation as a way to position influential metahumans
      before the Awakening.
  - speaker: Seer
    source_page: 50
    claim: Rejects the hostile speculation, describing Laverty’s beliefs and humanitarian
      goals as sincere.
  - speaker: Cynic Supreme
    source_page: 50
    claim: Mocks Ehran’s name and suggests an alternative nickname.
  - speaker: Aegis
    source_page: 50
    claim: Jokingly asserts Ehran proposed a different name and was outvoted; subsequently
      clarifies that statement was a joke.
  - speaker: Conrad
    source_page: 50
    claim: Portrays Ehran as a dangerous concentration of personal and political power,
      speculating he might cease operating indirectly.
  - speaker: The Laughing Man
    source_page: 51
    claim: Hints cryptically that Jenna has an alarming history; makes no independently
      verifiable factual assertion in the exchange.
  - speaker: Aegis
    source_page: 51
    claim: Describes Ni’Fairra as enigmatic, sometimes opposed to Ehran, and privately
      informed about her own political aims.
  - speaker: Anonymous
    source_page: 51
    claim: Alleges seeing a disturbing old portrait of a woman resembling Jenna in
      her home near Crater Lake, with magical or supernatural bodily imagery. The
      story and inference are an anonymous in-world allegation, not a verified portrait
      or historical event.
