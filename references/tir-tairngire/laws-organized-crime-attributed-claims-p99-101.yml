          "claim": "Discusses the limited presence of Mafia, Yakuza, Triads, Tongs, and Seoulpa Rings in Tír, asserting that family affiliation, exclusionary recruitment, and rigorous immigration checks constrain penetration, although some Seoulpa activity is alleged around Astoria docks. Also speculates that some Yakuza families recruited elven affiliates over the preceding five years."
