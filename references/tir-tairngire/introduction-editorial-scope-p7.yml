  source_method: Third-person archival reporting from invented-world tabletop role-playing-game publication; named Shadowland
    participants express in-universe allegations, not established real-world history.
  book_narrator_statements:
  - The publication describes a fictional elven state Tir Tairngire occupying the geography of present-day Oregon in the Shadowrun
    world.
  - The book uses an in-world electronic-document format with additional comments from fictional readers whose assertions
    may be accurate, incomplete, misleading, or contradictory; readers are explicitly cautioned against treating comments
    as independently reliable.
  - The publication says the main informational account comes chiefly from a single biased source, which likewise should not
    be accepted without question.
  - The narrator explains that the source bias permits gamemasters to choose whether a particular report is accurate, misleading,
    or false for their own game.
  - No other Shadowrun sourcebooks are required to use this book; the Grimoires, Second Edition and London Sourcebook are
    named as potentially useful extra sources.
  - The publication says its material works with both original Shadowrun and second-edition Shadowrun rules; it does not state
    any later Third Edition conversion.
  document_construction: Opening page combines direct rulebook-to-reader exposition with an immediately following invented-world
    Captain Chaos editorial post. These two voices are preserved in different records rather than conflated.
