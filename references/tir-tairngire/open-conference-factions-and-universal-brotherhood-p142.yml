  editorial_context: Source-reviewed third-person reporting from an historical fictional
    tabletop role-playing game; differentiate narrator facts, attributed forum claims
    and speculative material.
  factions:
  - speaker: Rooney
    claim: 'Frames Tir society as two factions: environmental and spiritual New Agers
      versus pragmatic affluent movers, attributing significant social influence to
      the latter.'
    printed_page: 142
  - speaker: Star
    claim: Disputes Rooney’s binary characterization and maintains that longstanding
      traditions can coexist with modern interests.
    printed_page: 142
  - speaker: Anonymous
    claim: Suggests a third stratum of well-connected high-status nobles and named
      council figures linked to older traditions; offers an in-world interpretation
      rather than a census.
    printed_page: 142
  - speaker: Tex
    claim: Asks whether Universal Brotherhood lacks a foothold in Tir Tairngire and
      why.
    printed_page: 142
  - speaker: Cardinal
    claim: Alleges that Universal Brotherhood organizers sought recognition first
      in Salem around 2051 and later Portland, but the Council denied nonprofit or
      licensed-religion recognition twice, citing concerns about its individual leader’s
      control.
    printed_page: 142
  - speaker: Tremeine
    claim: Calls the denial religious repression, explicitly questioning the Council’s
      justification.
    printed_page: 142
