  editorial_method: Source-reviewed neutral reference record from a FICTIONAL tabletop
    RPG; narrator, named allegations and optional scenarios remain separate.
  claims:
  - speaker: Professional Student
    printed_pages: '62'
    comment: Compares computer-based rank testing to college entrance examinations
      and notes opaque grading.
  - speaker: Bingo
    printed_pages: 63-64
    opinion: Objects to physical Games as an arbitrary method of class assignment.
  - speaker: Karyn
    printed_pages: '63'
    account: Portrays the Games as socially significant competitive events attended
      by relatives and supporters.
  - speaker: Lonnie
    printed_pages: '63'
    allegation: Claims an applicant for Royal rank died in a reported accident during
      a cross-country event in 2050 while a high-ranked rival received elevation and
      land; the Proctor declared it accidental. The claim of suspicious circumstances
      is explicitly attributed, not resolved as fact.
  - speaker: Darkmane
    printed_pages: '63'
    claim: Speculates that confidential lobbying permits political intervention in
      official results.
  - speaker: Leif Highmount
    printed_pages: '64'
    claim: Claims his son earned demotion in the 2050 Rite despite excellent testing
      and lobbying, and alleges threats connected to Leif’s criticism of the High
      Prince. These are first-person political allegations.
  - speaker: Vander Zalm
    printed_pages: '64'
    rumor: Repeats an unverified story that Ducal rank challengers face a mental-probing
      interview with Council figures and two royal magicians.
  - speaker: Aegis
    printed_pages: '64'
    response: Directly denies the rumored special mind-probing interview. Contrary
      sources remain distinguishable.
  illustrations:
  - printed_page: 62
    physical_pdf_page: 71
    description: Monochrome large panel of a fictional computer-using testing hall
      and students.
  - printed_page: 63
    physical_pdf_page: 72
    description: Monochrome drawing of Games scene and media screens with 2050 date.
