data:
  publication:
    title: 'Tir Tairngire: The Land of Promise'
    publisher: FASA Corporation
    publication_year: 1993
    catalog_number: FASA7210
    source_id: source.fasa-7210
    edition: 1993 original/Second Edition, not converted to SR3
    source_pdf_sha256: ebe687016c4921013e3c58679d44f36a339e734935ff9ed18c69400d578e2e2e
    printed_pages: 139-140
    physical_pdf_pages: 147-148
  editorial_context: Source-reviewed third-person reporting from an historical fictional
    tabletop role-playing game; differentiate narrator facts, attributed forum claims
    and speculative material.
  forum_frame:
    speaker: Captain Chaos
    claim: The fictional Shadowland moderator opens an unrestricted conversation board
      and indicates that messages from one discussion will remain grouped for later
      reading.
    printed_page: 139
  forest_claims:
  - speaker: Carmagnah
    claim: Suggests the ancient-looking forests north of Portland have a magical quality
      and invite visitors to reconnect with nature.
    printed_page: 139
  - speaker: Gerhard
    claim: Disputes their actual antiquity, citing extensive logging in the late 1990s
      and fires around 2021; reports surprisingly fast regrowth afterward, with the
      oldest local trees less than about three metres tall just a few years earlier.
    printed_page: 139
  - speaker: Corinne
    claim: Proposes that Tir leaders magically accelerated forest growth, perhaps
      to impress observers with a supposedly ancient forest. This is speculation,
      not established narrator fact.
    printed_page: 139
  - speaker: Green Cat
    claim: Says spirits and paranormal animals gather in the forests and personally
      senses oppressive magical resonance there.
    printed_page: 139
  - speaker: Rapunzel
    claim: Disagrees with Green Cat’s adverse impression, describing fresh and pleasant
      forest life.
    printed_page: 139
  - speaker: Miranda
    claim: Reports an apparently unusually large number of free spirits around the
      Tir while acknowledging limited access to evidence; says some spirits seem to
      materialize without summons.
    printed_page: 140
  - speaker: Pele
    claim: Recounts visiting a Stormbringer Technologies research facility and describes
      the free spirit Gormenghast; these firsthand-sounding details remain a character
      account rather than narrator confirmation.
    printed_page: 140
  - speaker: Pele
    claim: Attributes a Fourth World cyclical magic theory to an earlier lecture by
      Ehran the Scribe, proposing long high-mana and low-mana eras and an Awakening
      at the beginning of the present high-mana era.
    printed_page: 140
  uncertainty: The exchanges are mutually disputed Shadowland forum statements by
    fictional speakers, not verified real-world evidence or universally established
    setting facts.
