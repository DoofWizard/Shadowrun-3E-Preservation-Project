    source_pdf_sha256: ebe687016c4921013e3c58679d44f36a339e734935ff9ed18c69400d578e2e2e
    printed_pages: 144-145
    physical_pdf_pages: 150-151
  editorial_context: Source-reviewed third-person reporting from an historical fictional
    tabletop role-playing game; differentiate narrator facts, attributed forum claims
    and speculative material.
  dragon_debate:
  - speaker: Ringo
    claim: Speculates that Council dragons are locked in factional struggle and may
      hold mutual animosities.
    printed_page: 144
  - speaker: Finder-Man
    claim: Cautions that unspecified remarks do not prove universal racial antagonism
      and that some named dragons are assigned Council roles.
    printed_page: 144
  - speaker: Dysan
    claim: Claims Lugh Surehand selected Lofwyr for Council membership and that Ehran
      nearly opposed the choice; the claim concerns fictional court politics and is
      not independent narrator confirmation.
    printed_page: 144
  - speaker: DDT
    claim: Rejects a blanket theory of elf–dragon racial antagonism and argues attitudes
      may differ by personal history and national origin.
    printed_page: 144
  hot_spots:
  - speaker: Paul Duhl
    claim: 'Provides a list of proposed magical sites: Mount Hood, Hells Canyon on
      the Oregon–Idaho line, Turnbull Dry Lake near Malheur Lake, Warner Lakes near
      Lakeview, and Alkali Lake near the Oregon/California/Nevada junction.'
    printed_page: 145
  - speaker: Paul Duhl
    claim: Reports that Tir Council authorities kept Crater Lake off-limits to his
      inspection; its omission from his measured-site list does not establish absence
      of a magical effect.
    printed_page: 145
  - speaker: Nan
    claim: Speculates that alleged sites retain signs of earlier magical influence
      in terrain or environmental history.
    printed_page: 145
  - speaker: Ian
    claim: Relays a purported university study of echo-like residual magical effects,
      emphasizing uncertain measurement and change over time rather than treating
      the phenomenon as verified.
    printed_page: 145
  source_limit: Printed p143 preceding the dragon discussion is missing from this
    cataloged scan; the opening fragment on p144 has no reconstructed referent.
