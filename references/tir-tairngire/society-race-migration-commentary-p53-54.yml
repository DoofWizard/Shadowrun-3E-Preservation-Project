  claims:
  - speaker: Bongo
    printed_page: 53
    claim: Bongo alleges elven immigrant groups discouraged orks and trolls despite
      formal promises of inclusion.
  - speaker: Ork And Proud Of It
    printed_page: 53
    claim: The speaker denounces the supposed broad invitation as racist hypocrisy.
  - speaker: Teacher
    printed_page: 53
    claim: Teacher says database figures support the narrator’s demographic description
      but asks why it occurred.
  - speaker: Connie
    printed_page: 54
    claim: Connie suggests wealth, nutrition and health could help explain reported
      differential metatype emergence before or after the Awakening. This is an in-world
      hypothesis, not a real biological claim.
  - speaker: Slats
    printed_page: 54
    claim: Slats challenges the cited study, alleging it was funded by Humanis Policlub
      and authored by members, and reports later claims linking diet with metatype
      outcomes. The book presents this as contested, not verified biology.
  - speaker: B-Boy
    printed_page: 54
    claim: B-Boy questions the 2036 expulsion order and the earlier invitation to
      all metahumans.
  - speaker: Zoner
    printed_page: 54
    claim: Zoner alleges the Council cynically intended an exclusively elven nation
      and justified the expulsion order with claims that other metatypes were threatening
      California. The speaker rejects this justification as fabrication.
  source_discourse: Named in-world comments, not source narrator fact or scientific
    advice.
