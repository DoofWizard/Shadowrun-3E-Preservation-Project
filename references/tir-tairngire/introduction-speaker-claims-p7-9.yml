  section: Named Shadowland allegations and the fictional Spes dossier dispute
  in_world_file_origin_dispute:
  - speaker: Captain Chaos
    claim: Claims multiple previous submissions about Tír Tairngire were disrupted, lost, corrupted or
      erased, alleges remote and physical interference involving the Denver Data Haven, and says the dossier
      arrived from a contributor signing as Spes. He expressly cautions against assuming Spes is unbiased.
    certainty: first-person editorial allegations with uncertainty about perpetrators; not publisher narrator-confirmed
      facts
  - speaker: TomTom
    claim: Proposes the interruptions and eventual handoff may themselves be a ploy to make disinformation
      seem credible.
    certainty: express suspicion, not established history
  - speaker: Marci
    claim: Criticizes TomTom’s suspicions as excessively paranoid.
    certainty: opinion
  - speaker: Zack Black
    claim: Mocks conspiracy explanations in a brief comment.
    certainty: opinion
  - speaker: Lerethien Verantin, Tír Tairngire Consul-General
    claim: Calls the file a false or biased disinformation document associated with Humanis Policlub,
      disputes the reliability of Spes, and says evidence could be supplied to Shadowland readers.
    certainty: named diplomatic rebuttal, not independently settled truth
  - speaker: Spes
    claim: Contends internal dishonesty or dysfunction exists in the Tír ruling circle, alleges some have
      acted without farsighted planning and suggests further disclosures may be difficult.
    certainty: self-reported in-world insider allegation
  - speaker: Aegis
    claim: Warns the dossier has layers of bias or incompleteness and that some claims may be rumor or
      innuendo.
    certainty: cautionary source criticism
  - speaker: The Laughing Man
    claim: Tells readers to attend to what is disclosed and comments cryptically about undisclosed facts.
    certainty: ambiguous in-world commentary
  - speaker: The Big D
    claim: Makes a brief questioning or conciliatory remark about being considered unwise.
    certainty: brief attributed remark, not independent fact
