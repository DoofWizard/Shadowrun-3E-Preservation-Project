data:
  publication:
    title: 'Tir Tairngire: The Land of Promise'
    publisher: FASA Corporation
    catalog_number: FASA7210
    publication_year: 1993
    source_id: source.fasa-7210
    printed_pages: 53-58
    physical_pdf_pages: 62-67
    source_pdf_sha256: ebe687016c4921013e3c58679d44f36a339e734935ff9ed18c69400d578e2e2e
  editorial_method: Source-reviewed narrative from a FICTIONAL tabletop-RPG publication;
    book narrator, named in-world allegations and optional scenario material are distinct.
  claims:
  - speaker: Bongo
    pages: 53,56
    claim: Attributes exclusion of orks and trolls to bias among elven followers of
      the national founders, and later raises the possibility that some elders anticipated
      the Awakening; both are in-world interpretation.
  - speaker: Connie
    pages: '54'
    claim: Offers a conjecture connecting nutrition, wealth and fictional metatype
      population outcomes; the exchange itself notes disputed underlying research.
  - speaker: Slats
    pages: '54'
    claim: Challenges the research offered by Connie as tied to the anti-metahuman
      Humanis Policlub and alleges the senior researchers were members.
  - speaker: Zoner
    pages: '54'
    claim: Argues that the demand for non-elves to leave conquered California undercuts
      the public equality claims of the Tír’s founders.
  - speaker: Millicent
    pages: 54-55
    claim: Describes an alleged restaurant episode where staff ignored human guests
      despite facially neutral service.
  - speaker: Randy
    pages: '55'
    claim: Reports an alleged discrimination lawsuit ending in a legal victory and
      substantial personal expense without broad policy change.
  - speaker: Margo
    pages: '55'
    claim: Claims price discrimination is disguised through posted markups of roughly
      10–25 percent and selective reductions for elves; this is a speaker allegation,
      not a published statute.
  - speaker: The Chromed Bookkeeper
    pages: '55'
    claim: Alleges complex tax assessments burden non-elven earners disproportionately;
      commentary rather than a precise published tax table.
  - speaker: Wendy and Socio Pat
    pages: '56'
    claim: Discuss legal adulthood and differential longevity; some comments speculate
      about racial disparities and are not treated as established game-world biology.
  - speaker: Jack Be Careful
    pages: '56'
    claim: Warns that speculation about founders’ intentions behind the rites lacks
      adequate evidence.
  - speaker: Spes
    pages: 57-58
    claim: Claims the Rite of Passage is not openly discussed in its spiritual aspect,
      and separately alleges that elven youths attacked a human applicant with Ehran’s
      tacit approval; allegations remain attributed, not independently established.
  - speaker: Noam
    pages: '58'
    claim: Describes Sperethiel as linguistically complex with social and emotional
      distinctions; the exchange contains different opinions on its accessibility.
  - speaker: Jojo
    pages: '58'
    claim: Describes alleged caste effects on neighborhoods, schooling, taxes and
      travel. His claims are distinguished from the narrator’s general rank description.
