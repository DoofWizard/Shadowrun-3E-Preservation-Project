id: reference.sota63-magical-security-products-p90-91
record_type: reference
status: reviewed
source: source.fanpro-10664
printed_pages: '90-91'
pdf_pages: '91-92'
edition_scope: 'Shadowrun Third Edition, FanPro 2003; fictional magical security descriptions, not real-world procedures'
content_class:
  - attributed_claim
framing: newsroom_neutral
headline: 'State of the Art: 2063 (FanPro, Shadowrun Third Edition, FanPro10664), printed pp90-91/PDF91-92 — fictional Knight Errant magical security catalogue'
summary: 'FanPro State of the Art: 2063, Shadowrun Third Edition, printed pp90-91/PDF91-92: fictional corporate claims regarding magical security and fiber-optic observation, distinguished from separately attributed Shadowland commentary.'
data:
  provenance:
    title: 'State of the Art: 2063'
    publisher: FanPro
    edition: Shadowrun Third Edition
    catalog_number: FanPro10664
    chapter: Keeping the Rabble Out
    printed_page_range: [90, 91]
    physical_pdf_page_range: [91, 92]
    subsection_titles: ['Magical Security', 'Spirits and Paranormal Guard Animals', 'Astral Barriers', 'Fluorescing Astral Bacteria (FAB)', 'Spellcraft', 'Fiberoptic Observation Network']
  catalogue_claims:
    source_attribution: 'Fictional Knight Errant promotional catalogue describing imagined magical security products and services in the Shadowrun universe.'
    general_magic_context: 'The book contrasts fictional astral intrusion with physical and technical protection and offers both magical specialists and countermeasures.'
    paranormal_services: 'The firm advertises bound-spirit and paranormal guard services while acknowledging associated training, feeding, handling, and maintenance costs.'
    astral_barrier_types:
      - 'wards'
      - 'biofiber'
      - 'guardian vines'
    astral_barrier_characterization: 'The fictional catalogue says wards may perform basic alarm, polarization, and masking roles; it presents biofiber and guardian vines as cheaper alternatives for some deployments.'
    fluorescing_astral_bacteria:
      strain_i: 'FAB strain I is marketed in the fictional setting as an astral detection indicator, visible by fluorescence under ultraviolet illumination after contact with an astral form.'
      strain_ii: 'Dual-natured FAB strain II is presented as a living astral barrier in nutrient suspension and containment equipment.'
    spellcraft: 'Knight Errant advertises anchored or quickened detection, barrier and illusion spells as possible security options, with trained magic specialists to use them.'
    prometheus_observation_network:
      - 'The Prometheus system is advertised as a self-contained, non-electronic, fiber-optic observation network for fictional magical personnel, distinct from an electronic security-camera feed.'
      - 'Its stated configuration uses precision optics and lenses, fiber-optic transmission, an operator-selectable image feed and a level of illumination sufficient for the mage to view the observed location.'
  attributed_shadowland_commentary:
    - speaker: Fisher
      printed_page: 90
      claim: 'Describes costly and unpredictable consequences attributed to fictional paranormal guard animals and spirits.'
    - speaker: 'Crazy Leon'
      printed_page: 90
      claim: 'Criticizes the conduct of some in-world security firms that deploy paranormal creatures.'
    - speaker: Faisal
      printed_page: 90
      claim: 'Says that FAB strain III is regulated as a Class C controlled substance outside Chicago or extraterritorial jurisdictions, citing fictional UCSA restrictions; it is not listed as a standard catalogue product on this page.'
    - speaker: 'Nuyen Nick'
      printed_page: 91
      claim: 'Describes advanced spell-based systems as expensive and infrequently used relative to lower-cost fictional defensive options.'
    - speaker: Firefly
      printed_page: 91
      claim: 'Disputes the idea that Prometheus is unobservable, referring to visibility of its supporting illumination and citing an in-world 250-meter example.'
    - speaker: TechWiz
      printed_page: 91
      claim: 'Notes that insufficient illumination makes the Prometheus system less useful to its operator.'
    - speaker: 'Grey Knight'
      printed_page: 91
      claim: 'Says trained security magicians can adapt to adverse observational conditions and should not depend exclusively on Prometheus.'
  coverage_limit: 'Covers only the Magical Security subsections on printed p90 and continuing Fiberoptic Observation Network on printed p91; does not authorize unrelated Matrix Security, Personnel Services, Integration, or security tips.'
