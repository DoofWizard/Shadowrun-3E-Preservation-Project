data:
  provenance:
    title: 'State of the Art: 2063'
    publisher: FanPro
    edition: Shadowrun Third Edition
    catalog_number: FanPro10664
    chapter: Keeping the Rabble Out
    physical_pdf_page: 84
    printed_page: 83
    subsection_titles:
    - Doors
    - HVAC
  fictional_corporate_catalogue:
    source_attribution: Knight Errant 2063 corporate security catalogue; claims and recommendations are in-universe marketing
      copy.
    doors:
    - The catalogue presents protected interior compartments and security doors as ways to divide a fictional facility into
      controlled sections.
    - The firm describes exterior access doors opening inward, with separate easy-opening emergency exit doors; access doors
      are connected to intrusion alarms.
    - The fictional standard secured door is described as solid, high-quality stainless steel with a single-body stain-resistant
      16-gauge steel frame.
    - Pocket doors retract into the wall rather than swinging inward or outward, and are presented as suitable for laboratory
      spaces with limited floor area.
    - Transparent laminated or projectile-resistant polymer variants and photochromic densiplast that switches between opaque
      and transparent states are also advertised.
    heating_ventilation_air_conditioning:
    - The source says HVAC provides needed climate control while presenting possible security vulnerabilities associated with
      duct networks.
    - Knight Errant markets a fictional Airwall product for duct interiors, describing microbe-killing ultraviolet air treatment
      to limit airborne pathogens.
    - Its CCSS-integrated product claims allow selected zones to be isolated or remotely climate-controlled.
    - The catalogue also explicitly proposes dispersal of incapacitating gases against fictional intruders through controlled
      air systems; this is a setting claim, not advice to deploy agents in real buildings.
  separately_attributed_commentary:
    speaker: Faisal
    assertion: The named in-world commenter warns that fictional large ventilation networks may still create a route into
      protected facilities, regardless of their advertised precautions.
  coverage_limit: This record covers the discrete Doors and HVAC subsections and the immediately adjacent named comment on
    printed p83 only; the continuing Technical Security and Switch Alarms sections are not represented or authorized here.
