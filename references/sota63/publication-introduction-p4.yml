data:
  publication:
    title: 'State of the Art: 2063'
    publisher: FanPro
    publication_year: 2003
    catalog_number: FanPro10664
    edition: Shadowrun Third Edition
    source_id: source.fanpro-10664
    source_pdf_sha256: a49f6c0030ed18e8541a7d45ca2a263ada608e6a22689287a4d234caa471265a
    printed_page: 4
    physical_pdf_page: 5
    kind: published fictional cyberpunk tabletop role-playing game sourcebook
  section: Introduction
  book_narrator_method:
    presentation: The publication is presented as five themed files compiled for a
      fictional Shadowland information archive; Captain Chaos is described as the
      fictional compiler and presenter.
    attributed_commentary: In-world remarks added by Shadowland participants can include
      observations, revisions, contradictions, rumors, misconceptions, opinions and
      deliberate falsehoods; they are not narrator-certified facts.
    gm_discretion: The introduction expressly leaves the truth and game use of doubtful
      information to the gamemaster rather than treating every Shadowland post as
      established history.
  chapter_route:
  - chapter: Genetech
    scope: Manipulation of fictional metahuman DNA, therapies and processes, from
      environmental microadaptation to the named Ebola Plus material.
    historical_reference: The introduction describes this as an update to previously
      published engineering material in Shadowtech; this is a sourcebook-scope statement,
      not proof of supersession of any particular rule.
  - chapter: 'Charmed Life: New Metamagic'
    scope: New fictional magical practices including symbolic ritual links, psychometry,
      arcane duels and geomancy.
  - chapter: Soldiers of Fortune
    scope: Contemporary fictional mercenary activity, organizations, gathering places,
      military equipment and vehicles.
    historical_reference: The introduction says this section updates and expands Fields
      of Fire; no blanket conversion or replacement of rules is implied.
  - chapter: Keeping the Rabble Out
    scope: Corporate-site security in the fictional game, including nanotechnology
      and biometric systems.
    historical_reference: The introduction calls this an update and expansion of Corporate
      Security Handbook material; specific rules still require direct comparison.
  - chapter: Culture Shock
    scope: Fictional contemporary music, art, entertainment, sports, nightlife, travel
      locations and potential campaign plot hooks.
  source_artwork: A monochrome industrial illustration of pipes and architectural
    structures occupies the upper half of the original printed p4.
  coverage_limit: Printed p4/PDF5 publication introduction; not a substitute for any
    later chapter's exact mechanical rules or complete-source authorization.
headline: 'Fictional tabletop RPG publication introduction: FanPro State of the Art:
  2063 (FanPro10664, 2003), Shadowrun Third Edition, printed p4/PDF5'
summary: Original introduction identifies five sourcebook chapters and intended historical
  relationships to Shadowtech, Fields of Fire and Corporate Security Handbook, while
  distinguishing disputed in-world Shadowland comments from authoritative game facts;
  printed p4/PDF5.
