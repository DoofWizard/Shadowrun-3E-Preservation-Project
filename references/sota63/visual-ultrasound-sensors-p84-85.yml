data:
  source_context:
    publication_title: 'State of the Art: 2063'
    publisher: FanPro
    edition: Shadowrun Third Edition
    catalog_number: FanPro10664
    chapter: Keeping the Rabble Out
    source_classification: fictional 2003 tabletop RPG sourcebook; period claims attributed to publisher narrative and in-world commenters
    printed_pages: 84-85
    physical_pdf_pages: 85-86
    section: Cameras and Visual Sensors; Ultraviolet; Ultrasound
  fictional_source_narrator:
    camera_range: The fictional catalogue describes ordinary security cameras across multiple spectral bands, ranging from visibly full-sized
      units to hidden pinhole models.
    infrared: It distinguishes long-established infrared detection of body heat from mature multispectral infrared products; passive infrared
      outputs are characterized as monochrome with bright hot spots, while thermographic overlays add graded color to a conventional display.
    low_light: The source depicts low-light amplification as a green-hued image made by electronically boosting ambient light and notes glare
      and optical damage during intense illumination.
    ultraviolet: Ultraviolet sensors register light with wavelengths less than 400 nanometers. The narrative describes their use with marker dyes
      and alongside fantasy astral-intruder detection.
    ultrasound: The source places ultrasound alongside camera types for its security function but expressly says it is not a light-based detector.
      It sends sound pulses and uses reflected information to build a wireframe representation of movement; it is described as unaffected by fictional
      invisibility spells.
  named_in_world_comments:
  - speaker: Poker
    nature: in-world comment
    claim: Notes that large heat sources can obscure other heat signatures and rejects collateral-damage-heavy distractions.
  - speaker: Nova
    nature: in-world comment
    claim: Reports that extreme brightness can disrupt low-light imagery.
  - speaker: Faisal
    nature: in-world anecdote
    claim: Recounts an unexplained ultrasound incident in a fictional research facility while accompanied by an adept; the anecdote is not a confirmed
      universal limitation.
  coverage_limit: Only the Cameras and Visual Sensors continuation on printed p84, and ultraviolet/ultrasound continuation on printed p85. The
    full-page source illustration and unrelated weapon-scanner subsection on p85 remain separate.
