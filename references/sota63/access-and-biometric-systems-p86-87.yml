headline: 'Fictional FanPro Shadowrun Third Edition sourcebook State of the Art: 2063
  (FanPro10664), printed pp86-87/PDF pp87-88: Maglocks, Key Locks, and Biometric Recognition
  Systems'
summary: 'Independently page-image-reviewed fictional publication reference and attributed
  in-world commentary from FanPro State of the Art: 2063 (Shadowrun Third Edition,
  FanPro10664, 2003), printed 86-87/physical PDF 87-88.'
data:
  source_context:
    publication_title: 'State of the Art: 2063'
    publisher: FanPro
    edition: Shadowrun Third Edition
    catalog_number: FanPro10664
    chapter: Keeping the Rabble Out
    historical_scope: Fictional 2003 tabletop RPG; technical descriptions are period
      in-world claims, not modern-world advice
    printed_pages: 86-87
    physical_pdf_pages: 87-88
    section: Maglocks, Key Locks, and Biometric Recognition Systems
  fictional_source_narrator:
    maglocks: The catalogue presents electromagnetic maglocks as electrically monitored
      physical-access locks, usually coupled to card/key and biometric authorization;
      power loss makes the lock inoperable but is expressly said not to open it automatically.
    maglock_authorization: Basic access-control mechanisms use magnetic keycards or
      proximity cards; the source also mentions swipe cards and memory-storage keys.
      These are fictional system descriptions, not instructions for intrusion.
    mechanical_key_locks: The fictional narrative contrasts historical cylindrical
      pin-tumbler designs with electronic transponder keys and distinguishes common
      five-to-ten-position consumer devices from systems with greater pin counts.
    biometric_access: Biometric systems grant or deny access by comparing observed
      personal traits against a fictional authorization database; the source identifies
      fingerprints, palms, voiceprints, and retinal patterns as common identifiers.
    finger_and_palm: The fictional modern hand scanners are described as measuring
      both an image and electrical characteristics of a living biological sample.
    voiceprint: Voiceprint authorization is described as using an encrypted stored
      reference and incorporating stress measurements and key phrases to detect possible
      coercion.
    face: Facial recognition uses a three-dimensional facial map from laser observation,
      with higher-end variants described as incorporating thermal or ultrasound measurements.
    retina: Retinal scans use a laser pattern of the retina and a temperature-based
      check; the fictional catalogue asserts that synthetic retinal imitations can
      be detected by advanced Knight Errant units.
    new_knight_errant_claims: 'The fictional Knight Errant R&D advertisement claims
      three technologies: pheromone sensing, cellular/DNA sampling, and breath sensing.'
    cellular_and_dna: The source distinguishes rapid cellular sample-pattern comparisons
      from a more detailed DNA comparison, which it says requires several minutes;
      it also attributes forensic uses to collected sample material.
    breath: The fictional breath scanner examines material in an exhaled sample using
      a special membrane and is said to clean the membrane after each sample with
      ultraviolet light.
  named_in_world_comments:
  - speaker: Tony Two-Chins
    nature: fictional comment
    claim: Notes an electricity-dependence drawback for maglocks; unlike a mechanical
      key, power loss does not automatically release their locking mechanism.
  - speaker: Charlie
    nature: fictional comment
    claim: Discusses illicit duplication of conventional keys, reflecting an in-world
      intrusion concern rather than a game-test rule.
  - speaker: Highwire
    nature: fictional comment
    claim: Mentions attempted unauthorized access to electronic keys and comments
      on the use of transponder devices.
  - speaker: Kan Opener
    nature: fictional comment
    claim: Raises the possibility of voice-recording attacks on voiceprint authentication
      and questions confidence in database authorization.
  - speaker: Clyde
    nature: fictional comment
    claim: Claims facial-recognition products historically produced false matches
      and missed matches, and argues cost remains high.
  - speaker: Conjunctivitis
    nature: fictional skeptical claim
    claim: Questions vendor assurances about retinal anti-imitation technology.
  - speaker: Doc X
    nature: fictional technical comment
    claim: Distinguishes the cellular scanner from full DNA decoding and describes
      its comparison as a cell-surface pattern.
  - speaker: PhDee
    nature: fictional skepticism
    claim: Questions whether breath samples contain sufficiently distinctive material
      to support reliable identity verification.
  - speaker: Silent Sam
    nature: fictional comment
    claim: Jokes about breath analysis revealing a person’s recent meal.
  - speaker: BioE
    nature: fictional comment
    claim: Speculates that stolen epithelial cell samples, replicated DNA and an aerosol
      mixture could be used to spoof the fictional breath scanner; it is an unverified
      in-world proposal, not a confirmed technology.
  narrative_and_credibility: The source distinguishes invented vendor product marketing
    from named Shadowland commentators who challenge claims; no printed biometric
    target-number table appears on these pages.
  coverage_limit: Covers named physical-access and biometric narrative systems from
    bottom of p86 through p87; excludes the Cyberware Scanners preceding it, p88 embedded
    sensors, and later game-information mechanics.
