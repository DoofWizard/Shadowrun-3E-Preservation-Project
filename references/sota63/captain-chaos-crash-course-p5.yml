  editorial_claims:
  - Captain Chaos addresses Shadowland runners and depicts the fictional Sixth World
    as rapidly changing, with dangerous consequences for people who fail to keep up
    with technological and social developments.
  - He presents the fictional file as his intelligence collection on recent developments
    and asks Shadowland readers to evaluate information they might otherwise overlook.
  - He names genetics, new metamagic, mercenary operations, corporate security and
    mainstream culture as the five areas of special interest.
  - He associates new genetic technology and corporate defensive technologies with
    new risks; he also argues that new technology changes everyday culture, ideas
    and society, not only technical equipment.
  - He characterizes the cultural review as a year-in-review spanning popular music,
    entertainment, sports and travel, and suggests gamemasters can use its stories
    as inspiration.
  attribution_limit: These are Captain Chaos's fictional editorial perspective and
    invitation, not independently established Sixth World history or a direct game
    procedure.
  source_artwork: The original Crash Course page has a wide monochrome screen illustration
    of futuristic vehicles, not a data table.
  coverage_limit: Printed p5/PDF6 Crash Course; following Genetech section begins
    on printed p6/PDF7 and is covered by separate canonical records.
