  fictional_publication_narration:
    section_context: The sourcebook shifts from preceding anti-personnel ammunition
      discussion to Fire in the Hole, a fictional mercenary-focused treatment of demolition
      equipment and field commentary.
    named_equipment_categories:
    - Bangalore torpedo
    - Claymore mine
    - Cratering charge
    - Detonation cord
    - Mine detection gear
    source_kind: The described items are the sourcebook's period military equipment
      categories in a fictional setting; this record identifies classifications and
      narrative attribution, not assembly or use instructions.
    relationship_to_following_pages: This p71 section continues into p72, while game-system
      equipment-stat tables and numerical mechanics on printed pp73-74 already have
      independently indexed canonical records.
  named_shadowland_commentary:
  - speaker: Jackhammer
    reporting: Argues in first person that fictional mercenary work features more
      demolition than quiet shadowrunning and emphasizes limiting collateral mission
      damage; this is an in-world professional opinion.
  - speaker: Picador
    reporting: Comments on the period limitations of the catalogued Bangalore torpedo
      and introduces a fictional exception to a broad anti-obstacle claim.
  - speaker: Drake
    reporting: States that older obstructions can resist the effect described by Picador,
      challenging an overly expansive equipment claim.
  - speaker: Crazy Hillary
    reporting: Relates an anecdote about fictional industrial-site demolition and
      infrastructure disruption; the account is an attributed episode, not verified
      narrator history.
  - speaker: MacDoog
    reporting: Warns about dangerous side effects of the fictional mine class discussed
      in the entry.
  - speaker: Cherry Bomb
    reporting: Comments on alternate uses of demolition equipment in the fictional
      mercenary setting.
  - speaker: Molyneux
    reporting: Comments on limits of the prior ammunition claim at the top of the
      page.
  editorial_note: Names and equipment categories remain explicit. The record does
    not reproduce construction, triggering, placement or operational instructions,
    nor does it imply their mechanics have been exhaustively normalized.
  coverage_limit: One non-procedural attributed-commentary index for printed p71 only.
    It does not replace exact equipment-stat records, independently resolve the source's
    operational narratives, or authorize full-page completion.
