summary: 'Original-source-reviewed archive of fictional visual, infrared, ultraviolet,
  and ultrasound surveillance catalog from FanPro State of the Art: 2063, Shadowrun
  Third Edition, FanPro10664, printed p84-85/physical PDF p85-86. Narrator catalogue
  descriptions and named fictional speaker reactions remain distinct.'
data:
  source_context:
    title: 'State of the Art: 2063'
    publisher: FanPro
    catalog_number: FanPro10664
    edition: Shadowrun Third Edition
    source_id: source.fanpro-10664
    chapter: Keeping the Rabble Out
    printed_pages:
    - 84
    - 85
    physical_pdf_pages:
    - 85
    - 86
    section: Cameras and Visual Sensors; Ultraviolet; Ultrasound
  fictional_catalog_narrator:
    cameras: The fictional vendor describes conspicuous full-size cameras, concealed
      miniature cameras, and sensors covering multiple visible or nonvisible light
      ranges.
    infrared: Infrared systems are described as observing body-heat differences, including
      passive black-and-white displays and thermographic color overlays distinguishing
      temperature gradients, with the vendor acknowledging effects of other strong
      heat sources.
    low_light: Light-amplification sensors electronically enhance available light
      into a distinctive green-hued image; the text distinguishes their vulnerability
      to exceptionally bright sources or glare from infrared heat observation.
    ultraviolet: Ultraviolet sensors register short-wavelength light below 400 nanometers;
      the source says security systems primarily use the near-UV range because distant
      bands demand high energy, and describes ultraviolet use with marker dyes and
      the separate in-world FAB astral-detection technology.
    ultrasound: The catalogue presents ultrasound as a non-light method for mapping
      movement by emitted acoustic pulses and reflected returns processed into a wireframe
      display. The source asserts light-targeted magical concealment does not automatically
      deceive such nonvisual sensing.
  named_in_world_comments:
  - speaker: Poker
    type: in-world caution
    substance: Argues that major heat sources interfere with thermographic distinctions
      and cautions against assuming such environmental interference is a benign diversion.
  - speaker: Nova
    type: in-world caution
    substance: Remarks that very bright lighting can produce glare or damage in light-amplification
      sensors.
  - speaker: Faisal
    type: in-world anecdote
    substance: Describes a failed fictional facility intrusion involving an ultrasonic
      surveillance device with additional deterrent capability, ending with the team
      leaving without its objective.
  original_illustration: The printed p85/PDF86 page contains a large monochrome illustration
    of three figures against a radiating circular mechanical or sensor backdrop, with
    prominent KODAK lettering in the circular backdrop. This image is adjacent to,
    but not part of, the numerical rules.
  mechanical_status: No original numerical modifiers or replacement mechanics are
    assigned by this descriptive catalogue section; already accepted motion and visual
    sensor game-test records from pp98–99 remain separate.
  coverage_limit: Only Cameras and Visual Sensors beginning on printed p84 and the
    Ultraviolet and Ultrasound subsections on p85, with associated named comments.
    Excludes the Weapon and Control Scanners subsection that follows on p85.
