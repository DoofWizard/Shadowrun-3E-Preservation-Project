        "title": "Doors and Locks",
        "source_reviewed_assertions": [
          "The in-world lecturer argues that the strength of a door and frame should be appropriate to its lock and intended level of protection; an elaborate lock is not an adequate substitute for a durable door.",
          "The text presents standard card-reader and proximity-card maglocks as sufficient for routine offices, contrasting them with elaborate protection for higher-security laboratories.",
          "The lecturer notes that mechanical keys can be copied or lost, and warns against treating them as sole protection for especially valuable fictional assets."
        ]
      },
