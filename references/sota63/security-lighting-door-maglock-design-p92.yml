          "The fictional lecturer argues that illumination supports observation of a controlled doorway and that lighting choices should be matched to the security plan.",
          "The lecture distinguishes older vapor-lamp technology with delayed restoration of illumination after a power interruption from immediate, reliable observation; the example is presented as a fictional-system weakness rather than a real-world intrusion recommendation."
