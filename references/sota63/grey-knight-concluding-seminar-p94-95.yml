    chapter: Keeping the Rabble Out
    section: Putting It All Together — closing Grey Knight seminar
    printed_pages: 94-95
    physical_pdf_pages: 95-96
    publication_type: fictional tabletop RPG sourcebook
  speaker_and_attribution:
    speaker: Grey Knight
    setting: The in-world training lecture that begins on printed p91 continues across
      printed p94 and concludes at the top of p95. The views are attributed to the
      fictional speaker, not publisher-endorsed real-world security advice.
  thematic_assertions:
  - The speaker describes fenced fictional facilities as having multiple potential
    security layers rather than a perimeter alone, and draws a distinction between
    electrical protection, wire hazards, guard patrols and alarm instrumentation.
  - The lecture explicitly separates the perimeter area from the building itself;
    the latter is described as involving monitored entries, locks, windows, walls,
    roofs, and building infrastructure.
  - Grey Knight invokes the existence of magical guards, watchers, elementals and
    spirits within the Shadowrun fictional cosmology, alongside ordinary surveillance
    and physical barriers.
  - The lecture identifies unknown or improvised conditions as a reason why fictional
    infiltration plans may fail and emphasizes that experience changes outcomes.
  - The p95 ending is self-consciously humorous about unrealistically competent security
    guards and concludes that the lecture offers suggestions rather than a universal
    solution.
  continuity:
    previous_sections: Separate already accepted Grey Knight seminar references cover
      printed pp91-93.
    next_section: The printed p95 Game Information section expressly transitions from
      in-world narration to gamemaster-designed dice-and-roleplay security challenges;
      its mechanical precedence and fence/wire rules are already recorded in rule.security.sota63-fences-wire-electrical-tests-p95-96.
  coverage_limit: Fictional speaker, scenario framing and seminar transition only,
    not real-world intruder guidance, not equipment instruction, and not a claim that
    the tactical prose or numerical Game Information mechanics have been re-normalized.
