content_class: [campaign_guidance]
data:
  related_option: option.magic.metamagic-psychometry
  scope: Qualitative guidance from the Charmed Life chapter narrator, not additional numeric tests or modifiers.
  manifestations:
    depends_on: [practitioner sensitivity, magical tradition, beliefs, individual session]
    emotional: May experience emotions resembling those of people associated with the impression.
    sensory: May experience visual, auditory, olfactory, tactile or taste sensations.
    somatic: May experience bodily responses including symptoms of illness associated with the impression, irregular heartbeat or elevated temperature.
    coherence: Impressions are usually indirect or fragmented, including disconnected events, brief sensations or emotion.
    documentation: If possible, record the session electronically or have another person note impressions before they fade.
  backlash_qualifiers:
    heightened_risk: High sensitivity to psychic energy or association with an especially intense physical or emotional event.
    possible_effects: [fainting, severe headache, nausea, exhaustion, emotional distress]
    rare_effect: Psychic wounds likened to physical effects of injury to a projecting magician's astral form.
    contact_aversion: An object associated with a violent past may cause physical and emotional discomfort on contact, persisting until contact ends; reading remains possible but is significantly more difficult.
    decision: The magician chooses whether to proceed and is advised to consult another psychometrist if available.
  countermeasures:
    cleansing: The narrator describes removal of psychic traces by initiated magicians as potentially leaving an object unusable for examination.
    signature_erasure: Erasing astral signatures can make examination more difficult or impossible.
    alternate_subject: If expected impressions are absent, examine other objects nearby.
    mechanical_limit: Use the separate Game Information target-number modifiers; no additional numerical modifier or automatic failure rule is specified here.
framing: newsroom_neutral
headline: 'FanPro10664 State of the Art: 2063, SR3 psychometry qualitative guidance, pp39-40/PDF40-41'
summary: 'Fictional tabletop guidance on impressions, backlash, contact aversion, and countermeasures, distinct from the formal psychometry test.'
