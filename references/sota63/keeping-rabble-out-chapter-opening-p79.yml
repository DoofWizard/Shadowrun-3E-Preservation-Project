headline: 'FanPro State of the Art: 2063 (Shadowrun 3E, FanPro10664), printed 79/PDF80 — fictional Captain Chaos
  and Knight Errant catalogue introduction'
summary: 'Source-attributed 2063 fictional tabletop-RPG security-catalogue introduction: editorial claims by Captain
  Chaos and promotional assertions by Knight Errant; not real-world reports.'
data:
  publication_context:
    title: 'State of the Art: 2063'
    publisher: FanPro
    publication_year: 2003
    edition: Shadowrun Third Edition
    catalog_number: FanPro10664
    chapter: Keeping the Rabble Out
    printed_page: 79
    physical_pdf_page: 80
    fictional_setting_year: 2063
  attributed_chapter_introduction:
    speaker: Captain Chaos
    message_timestamp_as_printed: 05 January 2063 at 09:54:40 (PST)
    assertions:
    - Captain Chaos comments on the contradiction between fictional corporations making use of shadowrunners and
      developing measures to deter them, both for corporate benefit.
    - The chapter presents a 2063 security-product catalogue received from a fictional Motor City security firm;
      Captain Chaos calls much of it older information but says the updated edition includes useful new data.
    - Captain Chaos characterizes the catalogue as written for corporate management and gated-community associations,
      rather than for shadowrunners.
    - 'Captain Chaos says supplemental commentary follows the catalogue: Grey Knight, identified as an Ares colonel,
      discusses integrating security devices into systems; another feature presents fictional break-in specialists
      commenting on ways of bypassing the security products.'
  attributed_security_catalogue:
    speaker_or_source: Knight Errant Security Catalogue, 2063, fictional corporate promotional copy
    section_heading: Corporate Security
    assertions:
    - Knight Errant advertises contemporary intrusion-prevention and detection products as a response to ongoing
      unauthorized access to protected fictional corporate property.
    - The catalogue identifies Barrier, Sensor, and CCSS Infrastructure as product categories for its new 2063 offerings.
    - Knight Errant says its expanded Integrated Services advise customers on security plans tailored to budgets
      and needs.
    - The catalogue also advertises staff training, administration of security procedures, and security staffing.
    - Claims of product leadership, customer service, and superior staffing are the fictional company’s promotional
      assertions, not independent assessments by the publication narrator.
  source_boundary_note: This record covers the chapter opening and introductory corporate sales copy only; it does
    not claim coverage or mechanical authorization for the later security catalogue, physical-security chapter,
    technical sensors, or Game Information.
