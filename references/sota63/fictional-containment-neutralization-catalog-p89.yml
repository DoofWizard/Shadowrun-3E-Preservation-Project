    chapter: Keeping the Rabble Out
    subsection: Containment and Neutralization
  attribution: The historical sourcebook presents this material as fictional Knight
    Errant product-catalog narration; recommendations and claims are vendor claims
    about imaginary facilities, not real-world advice.
  source_reported_options:
  - category: Access restrictions
    claim: The fictional vendor describes reinforced doors, windows, shutters and
      gates used to isolate an area after a security alarm; the catalogue also describes
      restrictive laser or monowire field systems under central security control.
  - category: Nonlethal response and detention
    claim: The catalogue includes fictional gas-delivery controls and ventilation-managed
      detention, together with net guns and tasers as defensive response options.
  - category: Armed facility response
    claim: For extreme fictional scenarios, the vendor also offers concealed gun ports
      and related response systems, distinguishing these from ordinary access restrictions
      and nonlethal measures.
  named_in_world_comment:
    speaker: Rooster
    type: fictional Shadowland observation
    claim: Warns that security operators may use overhead facility response devices,
      rather than assuming all such devices are installed at wall level.
  mechanics_status: This source subsection supplies no independent numerical damage-code
    table, dice target numbers, or new equipment market prices. The later Game Information
    records are not superseded by the catalogue narration.
  coverage_limit: Only the Containment and Neutralization subsection and Rooster comment
    on printed p89/PDF90. The preceding embedded-sensor discussion and following CCSS
    Infrastructure and Junction Switches sections are excluded.
