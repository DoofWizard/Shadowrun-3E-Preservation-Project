    kind: Fictional Shadowland mercenary setting overview
  intro: The narrator says hired mercenaries frequent military bases, army towns and veterans’ social venues.
    Fort Lewis near Seattle is named as one North American concentration following Salish–Tsimshian border
    fighting; this is a source-period characterization.
  havens:
  - name: Lisbon
    printed_pages: '63'
    narrator_claims:
    - Capital of Portugal and major mercenary hiring center following Euro-Wars, North African conflicts and
      Portugal–Morocco fighting associated with the Alliance for Allah.
    - The account says contracted mercenary forces aided Portuguese defenses during operations across the Straits
      of Gibraltar.
    - The narrator connects the city’s growth in mercenary activity to North African fighting, Desert Wars
      and an influx of Brazilian refugees during Amazonian conflicts.
    - Lisbon also has tourism and a fictional illicit trade. Its rebuilt downtown is described as a mix of
      eighteenth-century mansions and twenty-first-century glass towers.
    named_comments:
    - speaker: Flak Jack
      claim: Describes Lisbon’s dangerous nightlife and notes an in-world establishment called A Cidade do
        Delinquo.
    - speaker: Sepherim
      claim: Attributes much of Lisbon and Africa smuggling activity to the Kussundulola Ghost Cartel and alleges
        its leader Jah Soba was indicted for war crimes in Angola; allegation, not settled fact.
    - speaker: Flak Jack
      claim: Warns against dealings with the named alleged cartel leader.
  - name: Macao
    printed_pages: 63-64
    narrator_claims:
    - The source describes Macao’s historic and politically restored Chinese status, proximity to Hong Kong,
      and the prevalence of legal gambling alongside organized crime, chip and flesh trades.
    - The narrator associates its mercenary hiring market with conflict in Southeast Asia, the withdrawal of
      Japanese forces from the Philippines, and contests between Huks and Japanocorps.
    - Macao’s mercenary market is depicted as developing during a late-2020s Canton Confederation/Guangxi dispute
      and later competition across Asia.
    named_comments:
    - speaker: China Doll
      claim: Compares personal safety and politics in Macao and Hong Kong and alleges Macao Triads replaced
        some Hong Kong underworld organizations.
    - speaker: Mekong Michelle
      claim: Describes an attributed weapons and magical-commodities trafficking route through Macao.
    - speaker: Johnny Hotel
      claim: Claims Combat Inc. chose Macao under duress rather than by preference.
    - speaker: Tai Ho Leng
      claim: Reports representatives of CBC, ABS, Henan neo-communists and the Imperial Kingdom of Beijing
        were present or interested around the fictional Gobi media program; motives remain conjectural.
  - name: Constantinople
    printed_pages: 64-65
    narrator_claims:
    - Formerly Istanbul; during the 2036 Euro-Wars and the collapse of the Alliance for Allah, Turkey fragmented.
      Istanbul declared independence in 2042, adopted the name Constantinople and claimed authority around
      the Bosfor Straits.
    - The text identifies Ukraine as an early recognizer and reports Ukrainian naval support, military aid,
      and Saeder-Krupp economic interests.
    - The narrator characterizes Constantinople as nominally secular but divided by religious, linguistic and
      national tensions, and a mercenary gathering place because of nearby conflicts.
    named_comments:
    - speaker: Felix
      claim: Suggests Ukrainian interest in securing Caspian oil shipments through the straits.
    - speaker: Zortan
      claim: Discusses Greek, Turkish, Arabic, Slavic and Ukrainian linguistic influences.
    - speaker: Titus X
      claim: Speculates that Orthodox religious influence and Vatican concern may grow.
  - name: The Outpost
    printed_pages: '65'
    narrator_claims:
    - An entirely virtual mercenary gathering hub within the Matrix rather than a physical geographic location.
    - Built on the old American AUTOVON infrastructure and later connected to American military and NATO posts,
      it was reused from the early 2040s by Matrix-aware mercenaries and retired Euro-Wars veterans.
    - The hub is described as an international mercenary job marketplace; the War Room offers a three-dimensional
      representation of military conflicts, and the Range is a practice room for combat-decker simulation.
    named_comments:
    - speaker: Kraker-Jack
      claim: Says the Range prohibits lethal or deck-damaging utilities by contract but alleges some unregulated
        grudge matches occur privately.
    - speaker: Telviper
      claim: Denies the alleged grudge matches.
    - speaker: Kraker-Jack
      claim: Dismisses that denial as self-interested.
  image_note: Printed page 64/PDF65 carries a full-width monochrome illustration of a hooded figure in front
    of large domed buildings; the chapter narration resumes below the artwork. The illustration supplies no
    numeric tabletop rules.
  coverage_limit: Situation Reports / Merc Hangouts city and virtual Outpost profiles on pp63–65/PDF64–66.
    The adjacent Battles/organizations material continues separately. Reader allegations are not narrator-certified
    history.
headline: 'Fictional tabletop RPG source: FanPro State of the Art: 2063 (FanPro10664, 2003), Shadowrun Third
  Edition; printed pp63-65/physical PDF pp64-66: fictional mercenary havens and the Matrix Outpost'
summary: Documents the distinct fictional locations Lisbon, Macao, Constantinople and the Matrix-only Outpost,
  retaining chronology, names, and attribution of disputed in-world claims. Original printed pp63-65/physical
  PDF pp64-66, FanPro10664 (2003), Shadowrun Third Edition. In-world sources and claims are identified; not
  a real-world report.
