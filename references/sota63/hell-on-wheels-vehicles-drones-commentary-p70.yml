headline: 'Fictional Shadowrun Third Edition sourcebook State of the Art: 2063 (FanPro,
  FanPro10664), printed p70/PDF71: Soldiers of Fortune vehicle commentary'
summary: Archival description of the 2003 FanPro fictional tabletop sourcebook narrative
  and attributed Shadowland commentary on mercenary vehicles, remotely piloted drones
  and dependency on outside support.
data:
  publication:
    title: 'State of the Art: 2063'
    publisher: FanPro
    edition: Shadowrun Third Edition
    source_id: source.fanpro-10664
    catalog_number: FanPro10664
    publication_year: 2003
    printed_pages:
    - 70
    physical_pdf_pages:
