  chapter: Soldiers of Fortune
  section: Hell on Wheels
  narrator_account:
    fictional_context: The chapter describes vehicles as central to the setting’s
      mercenary campaigns; it distinguishes common infantry fighting vehicles from
      larger tanks and aircraft and describes their role as mobile protection and
      transport.
    scope: This is fictional setting exposition, not additional vehicle combat modifiers.
  attributed_in_world_commentary:
  - speaker: Picador
    attribution: Mercenary narrator in the fictional source
    claim: Remotely piloted drones can reach some locations where conventional armored
      vehicles cannot, but the narrator regards their autonomous judgment and crew
      skills as inadequate for precise or demanding tasks.
    certainty: named speaker evaluation, not a universally established mechanical
      rule
  - speaker: MC Jammer
    attribution: Named Shadowland respondent
    claim: The commenter disputes uncomplicated reliance on drones, citing vulnerability
      of remote links to electronic interference or disruption.
    certainty: in-world speaker warning; no new signal-interference test or modifier
      is specified here
  - speaker: Colonel Cobra
    attribution: Named Shadowland respondent
    claim: The commenter challenges the narrator’s optimism about artillery support,
      saying mercenary organizations can find external sponsors’ promised support
      unreliable when circumstances change.
    certainty: attributed in-world criticism rather than a rule or a fact about actual
      military contracts
  coverage_limit: Indexes the non-numerical fictional vehicle/drone discourse and
    named claims from printed p70 only. Does not transcribe real-world tactics, artillery
    employment details, weapon specifications or the following Fire in the Hole material.
    Existing p69-70 camouflage and p73-78 equipment/vehicle records are separate.
  mechanical_status: No fresh dice tests, target numbers, item costs, or game stat
    blocks claimed.
