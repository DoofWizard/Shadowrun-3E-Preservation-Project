data:
  publication:
    publication_title: 'State of the Art: 2063'
    publisher: FanPro
    publication_year: 2003
    catalog_number: FanPro10664
    edition: Shadowrun Third Edition
    source_id: source.fanpro-10664
    source_pdf_sha256: a49f6c0030ed18e8541a7d45ca2a263ada608e6a22689287a4d234caa471265a
    chapter: Soldiers of Fortune
    fictional_source: Published fictional cyberpunk tabletop role-playing game sourcebook
    printed_pages: 60-62
    physical_pdf_pages: 61-63
  article:
    speaker: Picador
    section: The Art of War
    kind: In-world mercenary primer
    source_context: A fictional account of long-term mercenary contracts, unit organization and differing specialties,
      rather than an additional game mechanical procedure.
  contracts:
    comparison: Picador contrasts shadowrunner work hired for one particular mission with mercenary work arranged
      for a tour of duty that may span multiple assignments.
    example_tour_durations: One, three, six or other numbers of months; illustrative durations, not an exact
      Shadowrun service-duration rule.
    employment_context: Picador treats trust in an employer and group loyalty as significant; a Shadowland
      response by Hangfire says mercenaries learn long-term coworkers’ foibles and that intra-company conflict
      can be severe.
  chain_of_command:
    source_status: Picador supplies typical organizations but explicitly says individual mercenary units and
      countries vary; counts are descriptions, not binding tabletop team-size rules.
    unit_levels:
    - unit: squad
      typical_members_low: 8
      typical_members_high: 10
      alternate_vehicle_crew_low: 3
      alternate_vehicle_crew_high: 5
      organization: Usually junior personnel led by a sergeant; some groups temporarily split squads into teams.
    - unit: platoon
      squads_low: 3
      squads_high: 5
      command: Lieutenant is the lowest officer grade in the primer; more substantial multi-squad detachments.
    - unit: company
      platoons_low: 3
      platoons_high: 5
      command: Mid-level officer, generally a captain; may have internal cooks, mechanics and clerks.
    - unit: battalion
      companies_low: 3
      companies_high: 5
      command: Senior officer, such as lieutenant colonel; includes support staff and its own command structure.
    size_exception: The article says the great majority of mercenary organizations are battalion-sized; MET
      2000 and Tsunami are larger than a single battalion.
    rank_exception: Ranks are not standardized; veteran mercenaries may retain military ranks or obtain commissions
      without equivalent military careers.
    reader_comments:
    - speaker: Arctic White
      claim: Contrasts common junior enlisted squads with smaller, sometimes advisory mercenary groups working
        for governments or corporate sponsors.
    - speaker: Raptor
      claim: Challenges the importance of formal mercenary ranks and describes unusual career stories.
    - speaker: El Desperado
      claim: Says major groups such as MET 2000 and Tsunami use formal training and promotion programs, while
        alleging favoritism in advancement.
  skills_and_specialties:
    jacks_of_all_trades: Picador argues that mercenaries need combined mobility, field survival and practical
      competence beyond weapon proficiency. The accompanying prose references wilderness navigation and modern
      technology but specifies no new dice test.
    field_survival_comment:
      speaker: Unreal McCoy
      claim: Reports that physical and navigation training in a CAS Ranger course produced substantial early
        attrition in the speaker’s group; his numerical phrasing is twelve weeks across four stages.
    information_warfare: Picador says Matrix specialists are usually less common within mercenary groups than
      in shadowrunner teams, unless the company specializes in intelligence. A battalion may have a small decker
      group; mercenary deckers may have electronic-warfare and frontline duties.
    matrix_reader_comments:
    - speaker: Seminary
      claim: Says mercenary deckers may combine electronics and communications roles.
    - speaker: Copperhead
      claim: Says mercenary deckers may spend more time in reconnaissance and information work than in direct
        firefights.
    augmentations: The narrator reports cyberware and bioware may be more common among career mercenaries than
      among regular line troops because they invest personally in long careers; specialist forces are exceptions.
      On the same page, the narrator also says basic or inexpensive augmentations are more common than exceptional
      equipment in less-funded groups.
    augmentations_comments:
    - speaker: Big Boa
      claim: Warns that elite augmentation can indicate unusually formidable opponents.
    - speaker: Ballidou
      claim: Questions the reliability of highly augmented personnel and cites MET 2000 as a rival.
    combat_magic: The narrator says mercenary forces often use magic in supporting roles such as reconnaissance,
      protective wards and healing; some units nevertheless field mages prominently. A following text section
      continues onto printed p63.
    magic_reader_comment:
      speaker: Warlord Gray
      claim: Notes that opposing forces may also field spellcasters, requiring magical protection and countermeasures.
  coverage_limit: Art of War/Contract, Chain of Command, Jacks of All Trades, Information Warfare, Supertroopers
    and Combat Magic through printed p62/PDF63. Printed p63 continues Combat Magic and begins Situation Reports,
    handled separately. No claimed extraction of new Shadowrun game mechanics.
headline: 'Fictional tabletop RPG source: FanPro State of the Art: 2063 (FanPro10664, 2003), Shadowrun Third
  Edition; printed pp60-62/physical PDF pp61-63: mercenary contracts, unit-size ranges and specializations'
summary: Preserves source-era mercenary unit numbers, illustrative tour lengths and named in-world disagreements
  without converting fictional professional descriptions into universal game rules. Original printed pp60-62/physical
  PDF pp61-63, FanPro10664 (2003), Shadowrun Third Edition. In-world sources and claims are identified; not
  a real-world report.
