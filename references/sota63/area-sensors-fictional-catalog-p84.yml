  speaker reactions remain distinct.'
data:
  source_context:
    title: 'State of the Art: 2063'
    publisher: FanPro
    catalog_number: FanPro10664
    edition: Shadowrun Third Edition
    source_id: source.fanpro-10664
    chapter: Keeping the Rabble Out
    printed_page: 84
    physical_pdf_page: 85
    section: Area Sensors
  fictional_catalog_narrator:
    area_sensors: The fictional catalogue distinguishes room-wide sensors monitoring
      changes in motion, temperature, vibration/sound, and air pressure, especially
      for closed laboratories and containment areas where employees are not routinely
      present.
    motion: The text describes infrared-based motion sensors that respond to changes
      in room heat patterns, monitor movement across their observed area without forming
      a conventional visual image, and may interact with ambient temperature settings.
    sound: Sound sensors employ sensitive microphones for vibrations, with programmable
      exclusions for commonplace or expected noises. The vendor recommends monitoring
      by trained personnel using a closed-circuit simsense security system (CCSS),
      distinguishing such filtering from true identification of individual incidents.
    pressure: Air-pressure systems register barometric changes within comparatively
      sealed rooms, which the fictional vendor presents as useful for environments
      requiring stable conditions and infrequent door openings.
    pheromone: The catalogue claims pheromone scanners recognize biological chemical
      markers in sampled air and suggests that augmented or tailored pheromone profiles
      complicate their use for access recognition.
  named_in_world_comments:
  - speaker: Mother
    type: in-world assessment
    substance: Calls attention to the dependence of heat-sensitive motion detection
      on ambient climate control, rather than claiming a new game-rule modifier.
  - speaker: Faisal
    type: in-world objection
    substance: Challenges the value of sound filters that exclude gunshot-like noise
      because hostile events and ordinary expected sounds may overlap.
  - speaker: Highwire
    type: in-world speculation
    substance: Discusses the dependence of pressure monitoring on ventilation airflow
      and acknowledges the dirty, cramped condition of ductwork.
  - speaker: Drowned Rat
    type: in-world anecdote
    substance: Recounts a fictional research-laboratory encounter in which a teammate
      with enhanced pheromones reportedly triggered an unexpected sensor alert and
      security response.
  - speaker: Septum
    type: in-world assessment
    substance: Claims that pheromone-based individual authorization is not mature
      without tailored pheromone profiles or gland augmentation and describes the
      latter as costly.
  mechanical_status: This is in-world product commentary rather than a numerical game-test
    table. Previously accepted sensor-test mechanics at printed pp97–99 remain independently
    authoritative.
  coverage_limit: Only the complete Area Sensors subsection and its immediately related
    fictional comments on printed p84/PDF85. Excludes the continued laser-trip-beam
    passage and the separate Cameras and Visual Sensors section.
