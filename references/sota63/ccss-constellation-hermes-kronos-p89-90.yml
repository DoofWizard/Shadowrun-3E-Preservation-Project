pdf_pages: '90-91'
edition_scope: 'Shadowrun Third Edition, FanPro 2003 fictional-world catalogue; not present-day real security advice'
content_class:
  - attributed_claim
framing: newsroom_neutral
headline: 'State of the Art: 2063 (FanPro, Shadowrun Third Edition, FanPro10664), printed pp89-90/PDF90-91 — fictional Knight Errant CCSS network catalogue'
summary: 'Original-page-reviewed fictional 2063 Knight Errant CCSS network descriptions and exact switch-port specifications from FanPro State of the Art: 2063, Shadowrun Third Edition, printed pp89-90/PDF90-91; in-world marketing and named claims are distinguished.'
data:
  provenance:
    title: 'State of the Art: 2063'
    publisher: FanPro
    edition: Shadowrun Third Edition
    catalog_number: FanPro10664
    chapter: Keeping the Rabble Out
    printed_page_range: [89, 90]
    physical_pdf_page_range: [90, 91]
    subsection_titles: ['CCSS Infrastructure', 'Junction Switches', 'Routers', 'Access Points', 'Matrix Interlinks']
  catalogue_claims:
    source_attribution: 'Knight Errant corporate catalogue in a fictional 2063 Shadowrun setting; product descriptions are in-world promotional assertions.'
    system_context:
      - 'The closed-circuit simsense system (CCSS) is presented as the common infrastructure connecting a fictional facility’s security devices, adapted from vehicle interface and trigger protocols.'
      - 'The catalogue describes a fiber-optic interconnected system that can be administered as a unified network; security systems require trained operators and significant installation resources.'
    constellation_junction_switches:
      purpose: 'Fiber-optic interconnection and high-density trunks for CCSS-connected devices.'
      models:
        - {name: 'Constellation-IV', fiber_connections: 64, dedicated_uplink_ports: 2}
        - {name: 'Constellation-III', fiber_connections: 32, dedicated_uplink_ports: 1}
        - {name: 'Constellation-II', fiber_connections: 16, dedicated_uplink_ports: 1, available_device_connections: 15}
      common_advertised_features: 'Redundant power supplies and processors, explicitly not hot-swappable; firmware can be updated during use.'
    hermes_routers:
      - 'The Hermes CCSS router family is described as assembling signal feeds from multiple linked security devices into a composite feed and delivering configurable event alerts.'
      - 'The source illustrates this with security cameras of different light sensitivities, although it says the router is not limited to camera inputs.'
      - 'In-world configuration is available through the Kronos master access point; the catalogue also describes Hephaistos auxiliary connections, firmware uploads, and hardware processing upgrades.'
    kronos_access_points:
      - 'Kronos master access points provide operator-facing control of connected security devices; the source lists LCD and plasma displays, remote drone-control bridging, and DNI interfaces for equipped staff.'
      - 'The catalogue specifies an integrated cyberterminal workstation, logging, event review and investigation capabilities.'
      - 'Hephaistos auxiliary access points are described as a local maintenance and diagnostic interface for segmented or nonfunctional CCSS networks.'
    poseidon_matrix_interlinks:
      - 'Poseidon is presented as an optional bridge between legacy Matrix-based security infrastructure and the vendor CCSS.'
      - 'Its claimed configurations include one-way and two-way communications; the catalogue associates one-way links with legacy passive devices.'
      - 'The vendor advertises encryption, local traffic logs, and forwarding logs to a Kronos access point.'
  attributed_shadowland_commentary:
    - speaker: 'Kan Opener'
      printed_page: 89
      claim: 'Expresses skepticism that a centralized fictional CCSS network is infallible when security operators depend on detecting every alert.'
    - speaker: 'Highwire'
      printed_page: 90
      claim: 'Notes that mobile CCSS displays and direct rigging-style data feeds are additional fictional deployment options omitted from the catalogue.'
    - speaker: 'Leggy'
      printed_page: 90
      claim: 'Argues that a Matrix integration link can create separate trust concerns despite the catalogue’s encryption claims; this is named commentary, not a narrator-established universal vulnerability.'
  coverage_limit: 'Only CCSS Infrastructure and named subsections spanning printed pp89-90 are included. Separate Containment and Neutralization on p89, Matrix Security and Magical Security on p90, and other chapter material are not represented or authorized by this record.'
