content_class:
- attributed_claim
framing: newsroom_neutral
headline: 'State of the Art: 2063 (FanPro, Shadowrun Third Edition, FanPro10664), printed p82/PDF83 — attributed fictional
  Knight Errant lighting catalogue'
summary: Original-page reviewed fictional light products, switch categories and separate named Shadowland commentary; no
  real-world security advice.
data:
  source_context:
    publisher: FanPro
    title: 'State of the Art: 2063'
    edition: Shadowrun Third Edition
    catalog_number: FanPro10664
    printed_page: 82
    physical_pdf_page: 83
    chapter: Keeping the Rabble Out
    natural_subsections:
    - Lighting
    - Lighting Switches
  fictional_security_catalogue:
    vendor_attribution: Knight Errant Security Catalogue, 2063
    general_position: The fictional vendor promotes exterior lighting as a deterrent and as a complement to perimeter sensors
      and monitoring.
    listed_product_families:
    - trademark: Polis Incandescent
      described_role: task and decorative illumination
    - trademark: Citizen Fluorescent
      described_role: energy-efficient commercial and office illumination
    - trademark: Vibrance Gas-Discharge
      described_role: long-duration, high-wattage outdoor illumination
    - trademark: Daylight Halogen-Quartz
      described_role: high-wattage indoor and outdoor illumination
    - trademark: Nightshot Active Infrared
      described_role: infrared illumination for augmented vision and sensors
    - trademark: Spectra Ultraviolet
      described_role: forensic and perimeter lighting for identifying dye-marked persons, fingerprints and biological trace
        evidence
    configurations:
    - handheld
    - portable floodlight
    - fixed floodlight
    - some weapon-mounted variants
    lighting_switch_categories:
    - type: photoelectric
      described_behavior: automatic control according to ambient illumination level
    - type: timed
      described_behavior: time-based activation; catalog notes potential circuit/power interruption and use with complementary
        illumination
    - type: electronically operated
      described_behavior: programmable and remotely controlled through designated Matrix or CCSS security-network systems;
        catalog distinguishes emergency or alarm indication use
    - type: manual
      described_behavior: locally operated for task-specific lamps; catalog says the control has less remote automation
        capability
  separately_attributed_comments:
  - speaker: Farkman
    assertion: Questions the usefulness of an elaborate exterior-lighting system.
  - speaker: Highwire
    assertion: Warns that lighting can reveal a person’s approach and that active infrared sources are perceivable with
      relevant in-world augmented vision.
  - speaker: 3i Blind
    assertion: Recounts temporary visual impairment after a fictional security lamp was activated unexpectedly.
  - speaker: Highwire
    assertion: Reports an example of fictional infrared-reflective interior material interfering with thermographic sight.
  - speaker: Highwire
    assertion: Observes that electronic switches may be linked to private security infrastructure rather than to publicly
      reachable Matrix systems.
  source_boundary_note: Only the named Lighting and Lighting Switches subsections and their immediately associated speaker
    commentary on printed p82 are normalized here. The unrelated wallboard-continuation and Windows text on the same physical
    page remain outside this record; no complete-page authorization is asserted.
