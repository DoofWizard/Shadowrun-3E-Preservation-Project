headline: 'State of the Art: 2063 (FanPro, Shadowrun Third Edition, FanPro10664), printed p91/PDF92 — fictional Knight Errant personnel and integration catalogue'
summary: 'Source-reviewed historical fictional tabletop-RPG security-services catalogue, State of the Art: 2063 (FanPro, Shadowrun Third Edition, FanPro10664), printed p91/PDF92, distinguishing vendor promotion from established game-world facts.'
data:
  provenance:
    title: 'State of the Art: 2063'
    publisher: FanPro
    edition: Shadowrun Third Edition
    catalog_number: FanPro10664
    chapter: Keeping the Rabble Out
    printed_page: 91
    physical_pdf_page: 92
    subsection_titles: ['Personnel Services', 'Integration']
  fictional_catalogue_claims:
    source_attribution: 'Knight Errant corporate promotional material in FanPro’s fictional Shadowrun 2063 setting; claims are not independently verified real-world services.'
    personnel_services:
      - 'The fictional vendor characterizes inadequately trained or untrustworthy employees as potential weaknesses in even a well-equipped facility.'
      - 'It advertises trained uniformed security officers for site protection, perimeter patrols and emergency responses.'
      - 'Matrix specialists are said to monitor private company networks for fictional intrusion events and risks.'
      - 'Security riggers are offered to coordinate elements of a facility’s defenses.'
      - 'Specialist security magicians are advertised for astral observation or responding to alarm events, remotely or on site, and for other protective magic.'
      - 'The source also advertises executive bodyguard services, defensive driving, information-control and threat-analysis staff.'
      - 'Additional services advertised include employee background screening, internal investigations, counterintelligence, and security-awareness training.'
    system_integration:
      - 'The catalogue argues that isolated security technologies and staffing deliver less value than integrated deployment and ongoing maintenance.'
      - 'Knight Errant, described in conjunction with Ares Security International, advertises consultancy for site selection and defense planning.'
      - 'It also offers equipment installation, employee training, repair, and maintenance as integrated services.'
  coverage_limit: 'Only the Personnel Services and Integration promotional subsections on printed p91/PDF92. The separate Fiberoptic Observation Network continuation and Grey Knight’s subsequent Putting It All Together scenario advice are excluded; no full-page credit or contiguous authorization is asserted.'
