  section: The Art of War — Combat Magic (continuation and conclusion)
  speaker: Picador
  narrator_observations:
    frontline_vs_support: Picador describes mercenary magicians used as frontline
      fighters, but observes that many spells are less effective against armored or
      mechanized forces, and that conspicuous casting may draw enemy fire. She says
      reconnaissance, astral defense and medical support may be better uses of magicians;
      a specialized magical weapons team is another possibility in the fictional setting.
    relative_distribution: Picador says magicians appear more often in lower-level
      mercenary formations than in corporate or national armies. In those larger forces,
      magical assets tend to be concentrated at brigade, division or higher echelons
      and assigned sparingly to lower units, typically one per combat battalion. Mercenary
      companies and battalions more frequently have their own magicians, while a platoon
      with its own staff mage is exceptionally rare.
    status: These are Picador’s source-period fictional professional generalizations,
      not mandatory tabletop unit sizes, numerical rule modifiers, or present-day
      claims.
  named_in_world_comments:
  - speaker: Warlord Gray
    kind: in-world reply
    claim: Emphasizes that opposing mercenaries may also have magicians and that a
      spellcaster may be occupied with spell defense and magical countermeasures rather
      than offensive use.
  - speaker: TDC
    kind: in-world anecdote
    claim: Recalls a specialist conjurer in a fictional mercenary unit who did not
      cast ordinary spells but summoned earth elementals for combat-engineering tasks,
      including digging entrenchments, preparing vehicle tracks and clearing minefields.
      This is an attributed fantastical anecdote, not a real-world procedure.
  scope_and_reuse: Closes the Combat Magic continuation from printed pp62-63/PDF pp63-64,
    especially TDC’s comment and the relative distribution of magical assets on printed
    p63. Reuses existing reference.sota63-mercenary-contract-units-specialties-p60-62
    for the opening description and avoids duplicating its unit-hierarchy, Matrix
    and cyberware sections.
