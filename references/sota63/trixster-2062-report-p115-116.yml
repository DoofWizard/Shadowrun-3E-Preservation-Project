{"id":"reference.sota63-trixster-2062-report-p115-116","record_type":"reference","status":"source_reviewed","source":"source.fanpro-10664","printed_pages":"115-116","pdf_pages":"116-117","edition_scope":"Original FanPro Shadowrun Third Edition fictional setting reference, printed in 2003; no real-world claims or mechanically inferred conversions","content_class":["attributed_claim"],"headline":"Fictional Shadowrun Third Edition tabletop setting — FanPro State of the Art: 2063 (FanPro10664, 2003), The Trix-ster Report: 2062 retrospective, printed 115-116/PDF 116-117","summary":"Original-page-reviewed fictional-world The Trix-ster Report: 2062 retrospective material from FanPro State of the Art: 2063 (Shadowrun Third Edition, FanPro10664, 2003), printed 115-116/physical PDF 116-117; publication narration, named in-world allegations, and unresolved rumors are distinguished, not adopted as real-world findings.","data":{"provenance":{"published_title":"State of the Art: 2063","publisher":"FanPro","year":2003,"edition":"Shadowrun Third Edition","catalog_number":"FanPro10664","source_id":"source.fanpro-10664","original_source_sha256":"a49f6c0030ed18e8541a7d45ca2a263ada608e6a22689287a4d234caa471265a","printed_pages":"115-116","physical_pdf_pages":"116-117","chapter":"Culture Shock","section":"The Trix-ster Report: 2062 retrospective","reference_type":"fictional tabletop-roleplaying sourcebook"},"byline":{"author":"Cara Oke","outlet":"Trix-ster hostzine","format":"in-world annual best-story roundup"},"stories":[{"label":"Best Scandal Involving a Major Corporate Player","subject":"UOL virtual-party-room scandal","reporter_claims":["In the fictional report, UOL had denied reports of illegal paid personal services; a UCAS federal investigation began after a tip about a simsense-customized virtual-party room.","Cara Oke reports missing funds traced from the Republican Party to a UOL holding account and alleges that former Vice President and presidential candidate James Booth was involved in transferring money and simulated bodily fluids.","The feature says Booth was caught by federal investigators during an encounter with a virtual hostess; UOL executives deny knowledge and blame three enterprise-middle-management figures."],"epistemic_status":"Attributed fictional tabloid reporting, accusations and corporate denials; not independent documentary findings."},{"label":"Best Vandalism Without a Clue","subject":"Knight Errant defensive Matrix host incident","reporter_claims":["Comet-season vandals entered the fictionally described Knight Errant Matrix host; a November incident took its icon offline for six hours despite an automated defense trap.","The reporter says intruders attempted to rebuild affected host areas rather than simply destroy them, and that Knight Errant later recovered its structure.","The named perpetrators were not identified. The article reports two vandals killed, while Knight Errant suffered only minor losses; it explicitly labels prior warning to Knight Errant as rumor."],"epistemic_status":"Attribution to Cara Oke; source does not establish the perpetrators or confirm the purported warning."},{"label":"Best Scandal Involving a Wanna-be","subject":"Yumiko Hime and the simflick Seven Deadly Virtuals","reporter_claims":["The article recalls Yumiko Hime claiming, in a June Sim Scene interview, to have been an otaku raised by the Compi Lar tribe in the Noose Net2.","It describes Seven Deadly Virtuals as a forthcoming fiction about a computer host gaining sentience and attempting to kill the senior programmer’s girlfriend; that film premise is not treated as an actual event.","The reporter claims negotiations with the group revealed a cousin of Yumiko who had joined the tribe, accepted an advance for Yumiko to claim membership, and did not receive the promised payment.","The report says that after publication Yumiko was dismissed from the film project for stated artistic differences, the studio lost several top executives, and the studio substituted Chrissie Raey for the simflick lead."],"epistemic_status":"Tabloid investigation attributed to source narrator; claims about identity and payment are not upgraded to established historical facts."},{"label":"Best Tech-to-the-Masses Invention","subject":"Global Technologies Sim-Vironment","cross_reference":"world.media.sota63-sim-vironment-grid-snap-p116","coverage":"Existing canonical record holds fictional room interactions, 1.5–3 hour sessions, five simultaneous visitors and scenario release intervals; not duplicated here."},{"label":"Best New Trix-n-Treats Hot Spot","subject":"Grid Snap","cross_reference":"world.media.sota63-sim-vironment-grid-snap-p116","coverage":"Existing source-verified Grid Snap venue record reused, not duplicated here."}],"scope_and_limits":"Covers the three distinct news/scandal items from Cara Oke’s roundup on printed pp115–116/PDF116–117. Two consumer-entertainment selections are linked to pre-existing canonical material; final preceding nightclub debate and separate Olympic report are outside this record. No additional Shadowrun dice mechanics are printed in this section."},"framing":"newsroom_neutral"}
