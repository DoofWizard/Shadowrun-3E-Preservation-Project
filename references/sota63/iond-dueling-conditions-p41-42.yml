source: source.fanpro-10664
printed_pages: 41-42
pdf_pages: 42-43
edition_scope: FanPro, State of the Art 2063, FanPro10664, Shadowrun Third Edition
  fictional tabletop RPG, printed pp41-42/PDF42-43.
content_class:
- attributed_claim
data:
  attribution: Halo, in-world Duels Arcane article, paraphrasing the formal conditions
    of the Illuminates of the New Dawn.
  scope: Named organization's source-period conventions, not universal magical duel
    rules.
  related_game_resolution: rule.magic.magic-duels
  conditions:
    terms:
      determined_by: challenged party
      challenger_must_accept: true
      includes:
      - warded area size
      - spellcasting or focus limitations
      - date and time
      - spectator permission
      - victory conditions
      victory_examples:
      - unconsciousness
      - incapacitation
      - first blood
      - first hit regardless of severity
      - specified number of hits
    ward:
      required: true
      functions:
      - protect spectators from magical attacks
      - prevent outside magical interference
    judge:
      mutually_agreed: true
      duties:
      - inspect wards
      - verify both parties accept terms
      - verify readiness
      - decide definitively when duel ends
      - ensure next-of-kin contact information or medical personnel and equipment
        are available afterward
    seconds:
      minimum_per_party: 1
      maximum_per_party: 2
      duties:
      - proxy if something happens to principal
      - additional witness
      customary_additional_duty: custody of principal's equipment or possessions during
        the duel
    participation:
      permitted_combatants:
      - challenger
      - challenged party
      halt_immediately_if:
      - third party joins
      - separate fight between seconds
    conclusion:
      salute: Before start and after end if capable.
      dispute_resolution: Both parties accept outcome and pay applicable penalties,
        if any.
  separate_commentary:
    speaker: Thanatos
    claim: Reports that a duel ending in death is also an unadvertised option because
      it is illegal.
  limitation: Source gives no independent dice test or universal victory requirement
    for these institutional conventions.
framing: newsroom_neutral
headline: FanPro10664 State of the Art 2063, Shadowrun Third Edition, pp41-42/PDF42-43
summary: Halo reports the fictional Illuminates of the New Dawn duel conditions;
  their institutional scope is distinct from general game resolution.
