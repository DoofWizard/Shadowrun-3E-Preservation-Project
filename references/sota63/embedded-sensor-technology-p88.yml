  FanPro10664; printed 88, physical PDF 89), separating book narration from named fictional comments.'
data:
  source_context:
    publication_title: 'State of the Art: 2063'
    publisher: FanPro
    edition: Shadowrun Third Edition
    catalog_number: FanPro10664
    chapter: Keeping the Rabble Out
    source_classification: fictional 2003 tabletop RPG sourcebook; period claims attributed to publisher narrative and in-world commenters
    printed_pages: '88'
    physical_pdf_pages: '89'
    section: Embedded Sensor Technology
  fictional_source_narrator:
    novatech_composite_claim: In the fictional catalogue, Novatech piezoelectric composite materials support sensor-embedded walls that can incorporate
      multiple monitoring modalities throughout a building surface.
    knight_errant_products: Knight Errant is described as marketing compact embedded motion, air-pressure, chem-sniffer, pheromone and pressure-pad
      systems with nanotechnology to reduce the bulk of earlier sensors.
    motion: The nanotech motion variant is described as a capacitance/infrared hybrid in contrast to conventional motion sensors with large heat-sensitive
      components.
    air_pressure: The embedded pressure variant uses a sensitive nanotechnology membrane within a piezoelectric mesh that reports an electrical
      change when the monitored pressure shifts.
    chemical_and_pheromone: The source differentiates networked small chemical sensing units in a smart wall from reduced-depth embedded pheromone
      sensors and treats them as compact versions of the catalogued macro-technology.
    floor_sensors: Ultra-thin nanotech pressure-sensing pads are described as compatible with multiple fictional floor materials.
    display_requirement: The closing paragraph states embedded arrays need dedicated closed-circuit sim-sense interfaces because ordinary displays
      cannot carry their information volume and control needs.
  named_in_world_comments:
  - speaker: Donjon
    nature: in-world comment
    claim: Expresses discomfort about hidden monitoring and recounts a dangerous fictional raid where no sensor was visibly evident.
  - speaker: Highwire
    nature: in-world comment
    claim: Agrees that earlier inexplicable failures may have involved hidden sensor networks, and mentions looking for evidence from that earlier
      facility incident.
  coverage_limit: Covers only the one-page Embedded Sensor Technology section printed p88/PDF89; it does not claim total coverage of preceding
    biometric and lock technology or following CCSS materials.
