data:
  source_context:
    publication_title: 'State of the Art: 2063'
    publisher: FanPro
    edition: Shadowrun Third Edition
    catalog_number: FanPro10664
    chapter: Keeping the Rabble Out
    source_classification: fictional 2003 tabletop RPG sourcebook; period claims attributed to publisher narrative and in-world commenters
    printed_pages: '84'
    physical_pdf_pages: '85'
    section: Technical Security — Area Sensors
  fictional_source_narrator:
    overall_scope: The fictional Knight Errant catalogue distinguishes room-wide monitoring of motion, ambient temperature, sound or vibration,
      and air pressure in sealed interiors from discrete switch-alarm hardware.
    installation_context: The narrator recommends area sensors for laboratories or containment facilities when authorized employees are absent,
      because normal occupancy generates alerts.
    motion: Infrared movement detectors report changes relative to ambient room temperature; their output does not resolve a visual image. The
      narrative recommends pairing motion with ambient-temperature monitoring.
    sound: Sensitive microphone-based sound/vibration detectors can be programmed to ignore selected familiar noises. The publisher text says
      a trained Knight Errant security rigger should monitor them through CCSS to reduce false alerts.
    air_pressure: A closed-room pressure detector reports barometric changes and is presented as useful for environmental integrity where a laboratory
      space must maintain specified conditions or remain unopened.
    pheromone: Pheromone sensors sample metahuman gland secretions in air; the narrator notes that pheromone-enhancing augmentation complicates
      identification and that individualized scent-gland solutions are costly.
  named_in_world_comments:
  - speaker: Mother
    nature: in-world comment
    claim: Connects room-temperature monitoring with control of heating and ventilation settings.
  - speaker: Faisal
    nature: in-world comment
    claim: Remarks that configuring detectors around some routine sound signatures can also lead to unintended alarm behavior.
  - speaker: Highwire
    nature: in-world comment
    claim: Reports a fictional example of selective alarm classification and its limitations.
  - speaker: Drowned Rat
    nature: in-world comment
    claim: Recalls a speculative facility incident involving an alarm from a pheromone sensor, without presenting it as an established event.
  - speaker: Septum
    nature: in-world comment
    claim: Argues that fine-grained identification using pheromones requires an expensive individualized augmentation.
  coverage_limit: Only the Area Sensors subsection from printed p84/PDF85, not the preceding laser-beam continuation or the following complete
    visual-sensors subsection; commentary is abbreviated at non-operational level.
