data:
  related_procedures: [procedure.magic.ritual-sorcery, procedure.magic.ritual-sorcery-reverse-link]
  source_context: In-world commentary in Charmed Life on reverse ritual magic.
  claims:
    - speaker: Eli
      circumstance: A prior injury left a blood sample that Eli believed a hostile ritual team would use.
      timing: Eli reports destroying the sample before the ritual team established the link, before noticing a Sending.
      outcome: Eli presents this as a successful preventive use of reverse ritual magic.
    - speaker: Junebug
      condition_before_connection: Destruction of the material link must precede establishment of the ritual connection to be effective.
      condition_after_connection: Once the connection is established, the ritual team no longer needs the physical link; its destruction no longer prevents the ritual on that basis.
  limitation: These attributed statements supply a timing distinction, not a new formal Linking Test, duration, or automatic interruption rule.
