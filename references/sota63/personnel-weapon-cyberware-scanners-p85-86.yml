headline: 'Fictional FanPro Shadowrun Third Edition sourcebook State of the Art: 2063
  (FanPro10664), printed pp85-86/PDF pp86-87: Weapon and Control Scanners; Cyberware
  Scanners'
summary: 'Independently page-image-reviewed fictional publication reference and attributed
  in-world commentary from FanPro State of the Art: 2063 (Shadowrun Third Edition,
  FanPro10664, 2003), printed 85-86/physical PDF 86-87.'
data:
  source_context:
    publication_title: 'State of the Art: 2063'
    publisher: FanPro
    edition: Shadowrun Third Edition
    catalog_number: FanPro10664
    chapter: Keeping the Rabble Out
    historical_scope: Fictional 2003 tabletop RPG; technical descriptions are period
      in-world claims, not modern-world advice
    printed_pages: 85-86
    physical_pdf_pages: 86-87
    section: Weapon and Control Scanners; Cyberware Scanners
  fictional_source_narrator:
    scope: The book describes personnel sensors used in fictional security entrances
      to flag weapons, modifications and other regulated objects; it distinguishes
      human examination from installed automated scanning.
    magnetic_anomaly_detection: Magnetic Anomaly Detector (MAD) units detect ferromagnetic
      objects through an electromagnetic field and compare an observed response with
      reference profiles; the fictional catalogue shows both fixed archway and portable
      units.
    chemical_detection: Chem-sniffer systems are described as sampling airborne chemical
      particles associated with fictional ammunition propellant and explosives; both
      installed and hand-held variants appear.
    cyberware_detection: Cyberware scanners are portrayed as combining ultrasound
      and magnetic-resonance approaches to distinguish soft tissue from denser internal
      structures; advanced units compare patterns with a database and classify modifications
      for a security user.
    classification_limit: The narrator expressly says extensive cybernetic modification
      does not always signify illegal conduct, including where corporate bylaws apply.
    claimed_vendor_service: The fictional Knight Errant product catalogue promotes
      cyberware identification and permit-matching services; it does not establish
      that every body modification is unlawful.
  named_in_world_comments:
  - speaker: Redeye
    nature: fictional joking aside
    claim: Jokes that plastic baggies associated with the fictional drug novacoke
      have other uses.
  - speaker: Highwire
    nature: fictional in-world caution
    claim: Suggests sealed plastic concealment of fictional weapons and ammunition
      to elude chemical scanners, while noting that unpacking exposes them for inspection;
      an in-world allegation, not a game rule.
  - speaker: Grip
    nature: fictional in-world caution
    claim: Claims propellant residue from a prior fictional firefight may remain on
      hands or arms and cause security questioning even after the weapons are gone;
      this is a character warning, not a universal mechanic.
  - speaker: Razor Rick
    nature: fictional commentary
    claim: Questions purported cooperation between Knight Errant and Lone Star.
    certainty: speaker skepticism
  - speaker: X-Star
    nature: fictional allegation
    claim: Alleges Lone Star charges access fees and Knight Errant marks up use of
      an identity-matching service; not independently established.
  - speaker: Biomatic
    nature: fictional rumor
    claim: Reports hearing that Knight Errant and others were developing a bioware
      detector; does not claim working detection is already in use.
  source_narrative_note: The source contains several fictional commenters suggesting
    evasions; this archival record identifies those as unverified in-world comments
    rather than operational procedures.
  coverage_limit: Covers the Weapon and Control Scanners material on p85 and the continuation
    through Cyberware Scanners on p86. Does not cover maglocks, key locks or biometric
    systems on p86-87, nor exact cyberware-scanner rules on p100.
