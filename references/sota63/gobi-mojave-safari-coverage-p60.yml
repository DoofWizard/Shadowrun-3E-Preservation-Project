    chapter: Soldiers of Fortune
    fictional_source: Published fictional cyberpunk tabletop role-playing game sourcebook
    printed_pages: '60'
    physical_pdf_pages: '61'
  source_scope: Continuation of Gobi/Desert Wars coverage and separately titled Safari feature on printed page
    60; first Desert Wars feature on printed p59 is already indexed under reference.sota63-desert-wars-feature-p59.
  gobi_wars_commentary:
  - speaker: Datura
    kind: in-world suspicion
    account: Says CBC is the lead producer and that Mitsuhama, which has mines in the Russian Far East, was
      reportedly favored for mineral rights at Yamatesu; suspects the Gobi event is a screen for a corporation
      seeking exclusive mining rights. These are conjectures, not verified corporate intentions.
  - speaker: Black Knight
    kind: in-world counterclaim
    account: Disputes Mitsuhama as the principal beneficiary, identifies CBC as originating from ABS and alleges
      Saeder-Krupp ownership of ABS through intermediaries. He proposes that rivalries connected with Lung
      and late-February activity at Shandong may explain the event; the ownership and motive are speaker claims.
  mojave_program:
    speaker: Picador
    kind: in-world professional reporting
    program: EEX
    producer_description: An entertainment studio in Los Angeles plans a separate reality-style broadcast of
      fictional conflicts in the Mojave Desert near Barstow among mercenary groups, Pueblo security forces,
      desert raiders and dangerous creatures.
    source_period_status: Announced or planned programming within the 2063 setting, not an established later
      outcome.
    named_comments:
    - speaker: Studio Tech
      account: Claims Amalgamated Studios owns EX following a buyout involving the Pueblo; speculates about
        Pueblo production interests and audience appeal. Ownership and motive are commentator assertions.
  safari_feature:
    speaker: Picador
    context: Mercenary job category within the fictional Shadowrun universe
    assignments:
    - Capture uncommon Awakened metacritters, usually dangerous, in remote wilderness.
    - In some cases, remove dangerous paracritter groups threatening remote facilities.
    risk_account: Describes these as hazardous field assignments requiring more than ordinary small-arms experience;
      does not specify a tabletop-resolution test or an equipment-stat table.
    named_comments:
    - speaker: Recondo
      account: Argues that conventional tactics may be ineffective against some paracritters and recalls flamethrowers
        as unexpectedly useful.
    - speaker: Haydn Sikh
      account: Describes a fictional incident involving an aeropter pursuit and improvised animal traps, in
        which mercenaries prevented aeropters from escaping.
    attribution_note: Commentators’ anecdotes and suggestions are character statements, not independent narrator
      facts or real-world recommendations.
  coverage_limit: Only the Gobi continuation, Mojave EX spinoff and Safari feature on printed p60/PDF61. The
    Art of War/Contract material beginning on the page is normalized separately; the Desert Wars p59 core already
    has its own accepted record.
headline: 'Fictional tabletop RPG source: FanPro State of the Art: 2063 (FanPro10664, 2003), Shadowrun Third
  Edition; printed pp60/physical PDF pp61: Gobi/Mojave entertainment and Safari commentary'
summary: Separately attributes the fictional media-production suspicions, planned Mojave broadcast and paracritter
  Safari anecdotes; avoids treating in-world rumor as fact. Original printed pp60/physical PDF pp61, FanPro10664
  (2003), Shadowrun Third Edition. In-world sources and claims are identified; not a real-world report.
