summary: 'Original-source-reviewed archive of embedded sensor and smart-wall fictional
  source catalogue from FanPro State of the Art: 2063, Shadowrun Third Edition, FanPro10664,
  printed p88/physical PDF p89. Narrator catalogue descriptions and named fictional
  speaker reactions remain distinct.'
data:
  source_context:
    title: 'State of the Art: 2063'
    publisher: FanPro
    catalog_number: FanPro10664
    edition: Shadowrun Third Edition
    source_id: source.fanpro-10664
    chapter: Keeping the Rabble Out
    printed_page: 88
    physical_pdf_page: 89
    section: Embedded Sensor Technology
  fictional_catalog_narrator:
    technology: The source describes piezo-electrical composite materials distributed
      within fictional smart walls, integrating several kinds of sensors across a
      structure rather than relying solely on separate visible devices.
    advertised_families:
    - motion sensing
    - air-pressure sensing
    - chemical sniffers
    - pheromone sensors
    - pressure-pad sensing
    sensor_miniaturization: The Knight Errant catalogue attributes reduced bulk and
      wide distribution of sensors to nanotechnology and piezo-electrical wall composites.
    motion_and_pressure: Narration contrasts a capacitive-infrared hybrid movement
      sensor with conventional thermal motion systems, and describes a responsive
      piezo-electrical membrane in air-pressure sensors.
    chemical_and_pheromone: The source says specialized sensing particles distributed
      through a wall sample room air for volatile chemicals and pheromones, serving
      functions analogous to larger dedicated devices.
    floor_pressure: The catalog describes extremely thin pressure pads integrated
      into flooring, including a variable range of floor materials.
    integration: These embedded devices are described as part of a closed-circuit
      simsense security system rather than ordinary standalone displays, with the
      source describing the larger system as requiring training and infrastructure.
  named_in_world_comments:
  - speaker: Donjon
    type: in-world reaction
    substance: Expresses unease about the prospect of unobtrusive embedded sensors
      and recalls an unsettling previous facility assignment.
  - speaker: Highwire
    type: in-world reaction
    substance: Agrees with Donjon, cites an earlier visit to the fictional Whitehall
      facility and raises the possibility that apparently empty spaces had concealed
      monitoring.
  - speaker: Donjon
    type: in-world inference
    substance: Claims the earlier team was fortunate to escape a facility where hidden
      sensors apparently observed them.
  - speaker: Highwire
    type: in-world speculation
    substance: Speculates that the team might have been marked by the facility and
      suggests seeking an examination; this is a character concern, not verified publication
      narration.
  illustration: Printed p88/PDF89 includes a black-and-white illustration showing
    two masked or breathing-apparatus-wearing figures amid bold angular structures,
    with one larger figure in the foreground and another behind.
  cross_references: No new numerical sensor rating, price, Availability, or game-test
    modifier is assigned here. Distinct equipment mechanics and later sensor tests
    already indexed for pp97–103 are not duplicated.
  coverage_limit: Covers the original illustration and complete Embedded Sensor Technology
    subsection and associated in-world comments on printed p88/PDF89. The p89 Containment
    and Neutralization and CCSS infrastructure discussion is separate.
