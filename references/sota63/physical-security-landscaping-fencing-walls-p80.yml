headline: 'FanPro Shadowrun Third Edition State of the Art: 2063 (FanPro10664) fictional security catalogue, printed p80/PDF81:
  landscaping, fencing, walls'
summary: Source-reviewed 2063 in-universe Knight Errant catalogue claims, exact printed dimensional specifications and attributed
  fictional readers’ commentary.
data:
  source_context:
    title: 'State of the Art: 2063'
    publisher: FanPro
    edition: Shadowrun Third Edition
    catalog_number: FanPro10664
    chapter: Keeping the Rabble Out
    printed_page: 80
    physical_pdf_page: 81
    segment: 'Physical Security: Landscaping, Fencing, Walls'
  fictional_catalogue:
    attributed_to: Knight Errant security catalogue, 2063
    scope: Corporate promotional descriptions, not confirmed real-world engineering guidance or independent historical facts.
    section_premise: The catalogue promotes layered perimeter, illumination, wall, door, and locking systems combined with
      installation and training.
    landscaping:
    - The catalogue describes incorporating local geography into a fictional facility security plan and adding constructed
      terrain and restricted routes to the proposed design.
    - The product discussion includes bodies of water, earthworks, perimeter barriers, controlled entry areas, and monitoring
      devices.
    fencing:
      materials:
      - alloy
      - electrically conductive densiplast
      standard_height_meters: 3.5
      maximum_standard_bottom_clearance_centimeters: 2
      sensitive_installations_aboveground_remainder_meters_at_least: 3
      described_options:
      - embedded base for sensitive sites
      - 45-degree outward-angled top fitting
      - concertina or barbed-wire fittings
      - fictional monomolecular wire
      - electrification
      - independent power-feed option
      - proximity sensors linked to active alarms
      attribution: These are fictional manufacturer catalogue specifications and options, not normative real-world construction
        advice.
    walls:
      exterior_material_tiers:
      - lower-cost plastacrete
      - intermediate concrete
      - steel-reinforced concrete
      mentioned_features:
      - variable wall thickness
      - reinforced structures
      - staggered access points
      interior_product: Knight Errant describes interior wallboards incorporating a 1-centimeter ballistic weave liner, claiming
        reduced collateral damage during a firearms incident.
  separately_attributed_reader_comments:
  - speaker: Murphy
    topic: The fictional shadowrunner criticizes expensive perimeter equipment as economically unrealistic for some installations.
  - speaker: Left Hand Lucky
    topic: The commenter objects to the physical danger posed by monomolecular wire.
  - speaker: Highwire
    topic: The commenter cautions about potentially lethal electrified perimeter systems and notes that some fictional facilities
      vary voltage.
  - speaker: AI
    topic: The commenter alleges cheaper variants of plastacrete are easier to damage than the catalogue implies.
  - speaker: Drive-By
    topic: The commenter describes the practical significance of fortified, staggered access points in the fictional world.
  - speaker: Midnight Gardener
    topic: The commenter observes that the prison-like appearance of fortified workplaces may lead employers to add decorative
      landscaping.
  - speaker: Seenik
    topic: The commenter skeptically questions the catalogue’s priority between building protection and protecting personnel.
  coverage_limit: This record covers only the three titled physical-security subsections and adjacent speaker claims on printed
    p80; later chapter material and full-page art on p81 have not been declared complete.
