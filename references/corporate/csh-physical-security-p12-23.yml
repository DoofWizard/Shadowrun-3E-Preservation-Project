overview:
  - "Knight Errant describes corporate physical-security planning in layers: landscape, site perimeter, building boundaries, access control and supervised interior spaces."
  - "Natural features include cliffs, waterways and other terrain boundaries. Constructed features include walls, fencing, landscape modifications, illumination and signal systems."
  - "Internal systems combine controlled entries, reinforced building materials, shutters, monitoring, and supervised response."
  - "Personnel section discusses training, screening, augmented versus unaugmented staffing, animal companions and handlers."
  - "The exact physical dimensions and lighting specifications in pp.14-20 are separately normalized in reference.gear.csh-physical-specifications-p14-20."

