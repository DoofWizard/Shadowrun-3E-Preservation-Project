id: reference.corporate.corporate-download-framework
record_type: reference
name: "Corporate Download - Corporate System and Runner Guidance"
domain: corporate
status: ingested
source_period: "2061"
source: source.fasa-7125
printed_pages: "5-30"
pdf_pages: "6-31"

corporate_system:
  - "The source presents the AAA megacorporations as major political/economic actors with extraterritorial rights and worldwide reach."
  - "Corporate identities are complex; divisions and subsidiaries may have substantially different cultures, priorities and operating methods."
  - "Corporate Court institutions mediate disputes among major corporations and maintain the extraterritorial corporate order."
  - "Zurich-Orbital is a central financial and institutional component of the Corporate Court system."
  - "Corporate scrip, internal services, controlled housing/employment, and corporate citizenship can bind employees closely to their employer."

corporate_status:
  AAA:
    description: "Megacorporate tier represented on the Corporate Court and possessing the broadest global power."
  AA:
    description: "Major multinational extraterritorial corporation without AAA/Court-seat status."
  A:
    description: "Large recognized corporation below AA/AAA scale; rights and reach are more limited."
  note: "The chapter treats ratings/status as institutional categories, not simple measures of one-dimensional power."

shadow_work:
  deniable_assets:
    - "Megacorporations routinely use outside runners when plausible deniability, specialist skills, or distance from internal personnel is useful."
    - "A run may be initiated by the parent corporation, a division, a subsidiary, an executive, or an internal faction."
    - "The apparent employer and ultimate beneficiary may differ."
  johnsons:
    - "Mr. Johnson represents the employer but may not reveal the full corporate chain behind the job."
    - "Negotiation, reputation, corporate culture and the sensitivity of the operation affect terms and treatment."
  company_men:
    - "Some shadowrunners work repeatedly or exclusively for one corporation."
    - "A company relationship may provide steadier work, resources and contacts but also creates obligations and exposure to internal politics."
  operational_guidance:
    - "Do not assume a megacorporation acts as a single mind."
    - "Track the relevant division, executive faction and subsidiary when determining motives and response."
    - "Corporate retaliation and security should scale with the importance of the asset or operation rather than the logo alone."

corporate_court:
  role:
    - "Intercorporate judicial and regulatory body for the major extraterritorial corporations."
    - "Provides mechanisms for adjudication, sanctions and management of conflicts that threaten the corporate system."
  authority:
    - "Its power derives from member megacorporations, treaty/extraterritorial structures, and control of key corporate institutions."
  campaign_use:
    - "Court action, arbitration, corporate sanctions and political bargaining can be alternatives or complements to direct shadow operations."

provenance_policy:
  - "Captain Chaos posts and shadowtalk are attributed commentary."
  - "Rumors about hidden motives, illegal operations and personal culpability are not promoted to neutral facts."

sources:
  - {source: source.fasa-7125, printed_pages: "5-30", pdf_pages: "6-31", relation: defines_world_state}
