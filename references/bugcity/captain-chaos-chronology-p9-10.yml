data:
  chapter: City Under Siege
  account:
    attributed_to: Captain Chaos
    timestamp: '2056-01-21'
    viewpoint: Denver Nexus Shadowland forum introduction based on purported Chicago Matrix materials
    narrator_assertions:
      - {printed_page: 9, date: '2055-08-22', approximate_local_time: '16:00', statement: A hive of insect spirits west of the Shattergraves disgorged a swarm that spread through Chicago; the author identifies this as the underlying cause of the emergency.}
      - {printed_page: 9, date: '2055-08-22', statement: Eagle Security received reports of unusually large insects, while early media treatment portrayed the sightings as a juvenile gang-related phenomenon.}
      - {printed_page: 9, date: '2055-08-23', statement: Chicago news reporting and communication deteriorated, with fiber-optic infrastructure disrupted and official announcements warning of severe air pollution.}
      - {printed_page: 10, date: '2055-08-23', approximate_local_time: '18:00', statement: The public was told of a purported new strain of VITAS; Chicago communications were isolated, and a quarantine was announced.}
      - {printed_page: 10, date: '2055-09-01', statement: A large blast north of the Chicago Core was visible from a distance; outside observers tentatively characterized it as a sub-tactical nuclear detonation.}
      - {printed_page: 10, statement: Military containment and restricted access left a large population within the city, while reports of incidents outside the containment perimeter were comparatively limited.}
      - {printed_page: 10, statement: Information attributed to a local Matrix group led by System 05 was reportedly collected from the remaining Chicago network for release outside the city.}
    narrator_reported_organizational_positions:
      - {actor: UCAS government, period: August 2055, characterization: Public-health explanation of an infectious disease; author disputes this as a cover account.}
      - {actor: UCAS government, period: August-September 2055, characterization: Officially restricted access and established military barricades and refugee camps, according to the narrator.}
      - {actor: Red Cross and World Health Organization, period: August 2055, characterization: Reportedly protested restricted relief-team access and virus sample collection; this is the narrator's report, not an independently verified institutional statement.}
      - {actor: major news agencies, characterization: The narrator alleges reporting was filtered through a government-controlled pool.}
    narrator_not_confirmed:
      - {topic: alleged_corporate_strike_team_detonation, certainty: rumor, statement: A corporation-linked team was rumored to have caused the September blast; the narrator does not substantiate responsibility.}
      - {topic: outside_city_insect_events, certainty: narrator_report, statement: Incidents in Manhattan, Philadelphia, Atlanta, Buenos Aires, and Istanbul were described as far smaller than Chicago; no precise verified totals are supplied.}
    caution: Treat the narrator's claims and government reports as separate attributed perspectives, not mutually verified statements.
