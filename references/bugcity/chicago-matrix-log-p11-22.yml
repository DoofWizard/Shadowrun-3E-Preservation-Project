data:
  chapter: City Under Siege
  record_form: Sourcebook-presented extracts of a degraded in-world Chicago Matrix forum and system log, with unreliable timestamps after network failures.
  dated_august_22_23_2055:
    - {printed_page: 11, speakers: [Tailor Tim, Uncle Leo, Titus Androgynous, V. Wilson, D.K. Goolup], event: Early chat participants described rumors of gang activity, police vehicles, agitated dogs, and an unexplained buzzing sound; D.K. Goolup's later absence prompted concern.}
    - {printed_pages: '11-12', speakers: [Q. Davies, Vince Aflash, M. Katche, T. Levin], event: Users discussed conflicting news coverage, insect reports, and an alleged 22:00 curfew.}
    - {printed_page: 12, speakers: [L. Minassian, Angel X., Twigger, RipperJack, C. Garfield, O. Walsh], event: Multiple users reported or challenged sightings of large wasps, flies, and insects near Chicago neighborhoods including Clark and Damen; these are witness reports and disputes, not independently verified observations.}
    - {printed_pages: '12-14', speakers: [System 05, SirLee, Max Bias, REMbrandt], event: The in-city Matrix and outside connections became unstable; users described failed lines and a locally announced computer-virus emergency shutdown.}
    - {printed_page: 13, speaker: System 05, reported_measure: 76_percent_of_connected_users_dropped_in_4_minutes, status: in_world_operator_report}
    - {printed_page: 14, statement_type: system_log, event: Chicago LTG issued repeated global-failure messages during an official computer-virus warning and communications collapse.}
  after_network_time_failure:
    - {printed_pages: '15-17', speakers: [System 05, Teig, Hawkeye, Turant, Mr. Hyde-Park, Quantum Princess], event: Participants re-established local communications with unreliable clocks, discussed widespread insect-spirit reports, and concluded from local observations that Chicago was sealed by military forces.}
    - {printed_page: 17, speaker: Teig, event: Reported aircraft distributing quarantine and curfew leaflets across the city; the reported leaflet omitted a definite curfew hour.}
    - {printed_page: 18, speaker: System 05, event: Described repurposing three Fuchi FTX 3000 HyperBox-Elite computers with Jose to restore a local communications service after the old Chicago Online nodes became unusable.}
    - {printed_page: 19, speaker: System 05, event: Reported that full-sense service remained unavailable; partial single-channel feedback might become available in approximately one week, contingent on technical work.}
    - {printed_page: 19, speaker: Teig, event: Reported continued insect-spirit incidents near Irving Park and an unconfirmed report of military magicians protecting refugee camps.}
    - {printed_page: 20, speaker: 2Spirits, event: Claimed to have created a protected haven near the Field Museum and made claims about insect queens and hunters; the scene gives no independent confirmation of the speaker's identity or assertions.}
    - {printed_page: 20, speaker: Hawkeye, event: Reported that local residents had killed a human-insect creature; this remains Hawkeye's eyewitness account.}
    - {printed_pages: '20-21', speaker: Teig, event: Reported nearby fighting along Cermak near Ashland, flashes, aircraft, and unusual violet light, followed by an interrupted connection.}
  later_system05_note:
    - {printed_page: 21, displayed_timestamp: '2055-11-18 20:19:17', asserted_event_date: '2055-10-01', speaker: System 05, event: Identified the preceding exchange as an early October log of the Cermak blast, expressed uncertainty about whether the cause was a large magical event or a nuclear device, and described the city network as still unreliable with principally text-oriented service.}
  image_only:
    - {printed_page: 22, pdf_page: 23, treatment: full_page_insect_illustration_no_independent_prose_or_game_rules}
  caution: Displayed chat dates, alleged sightings, technical reports, motives, and magical claims are speaker-attributed evidence within a fictional in-world narrative. They are not verified external historical facts.
framing: newsroom_neutral
headline: Chicago Matrix forum and System 05 log, August-November 2055
summary: Attributed fictional Matrix witness and system reports with time-failure and Cermak-blast uncertainty retained.
