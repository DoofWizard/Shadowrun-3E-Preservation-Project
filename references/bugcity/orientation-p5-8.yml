data:
  section: Welcome to Bug City
  primary_printed_page: 5
  primary_pdf_page: 6
  framing_and_authorial_summary:
    - The book concerns the aftermath of the insect-spirit infestation of Chicago in late summer 2055.
    - The introduction describes the UCAS military sealing the Chicago Containment Zone, leaving a large civilian population inside.
    - It describes a disrupted economy, food and supply shortages, ineffective law enforcement, and the aftermath of a sub-tactical nuclear detonation directed at a primary hive.
    - The book presents its setting material as online files and commentary assembled from the damaged Chicago Matrix; individual in-world contributions express varying perspectives and may not be independently reliable.
    - The material is expressly intended as a gamemaster campaign framework rather than a single fixed account of every character's experience.
  sources_and_play_references:
    - Shadowrun Second Edition rules and Second Edition Grimoire are the stated rules prerequisites.
    - Burning Bright, by Tom Dowd, is identified as a useful but not necessary companion novel.
    - Additional contextual references include Street Samurai Catalog, Rigger Black Book, Shadowtech, Fields of Fire, Corporate Shadowfiles, Neo-Anarchist's Guide to North America, Queen Euphoria, Universal Brotherhood, and Double Exposure.
  chapter_organization:
    - Windy City compares historical pre-infestation Chicago with its subsequent condition.
    - Living in Oblivion offers survival-oriented setting perspectives.
    - Insects Among Us presents an insect-spirit reference guide.
    - Bug City surveys locations, organizations, and campaign opportunities.
    - Gamemaster Information supplies adventure guidance and game statistics, with rules-bearing details deferred to dedicated records in later pages.
