data:
  source_context: Original fictional Shadowrun tabletop RPG book Blood in the Boardroom,
    FASA Corporation (FASA7327, 1999), printed pp46-48/PDF pp46-48; all persons, institutions
    and events below are fictional game material.
  scenario_title: Prove It to Me
  narrative_frame: Optional game-master scenario involving fictional Renraku executive
    Yukiako Watanabe’s doubts about Miles Lanier’s Renraku loyalties after his Fuchi
    association. The source does not establish that Lanier actually betrays Renraku.
  setup: A matrix-connected Mr. Johnson, acting for Watanabe, hires a team to investigate
    Lanier’s Boston activities under the pretext of testing new security measures.
    The employer provides scheduling data and seeks surveillance reports rather than
    a proven act of disloyalty.
  events_and_claims:
  - Watanabe anonymously feeds the team details of Lanier’s planned appearance at
    a marine-biology forum and New England Aquarium exhibit, then asks for a staged
    assassination attempt intended to fail as a security test; Renraku watchers are
    deployed as observers.
  - Fuchi Internal Security, secretly warned by Watanabe, may spot surveillance or
    intervene. This manipulation is concealed from the player characters, and they
    can refuse the job or take other branches.
  - Watanabe later prompts a fictitious Renraku employee to offer supposedly secret
    information. An associate of Lanier called Phaze at the Rox Rootz Matrix establishment
    may confront the player characters about the exchange and flee, with details contingent
    on their choices.
  - A Renraku agent masquerades as a Fuchi captive to serve as another loyalty test.
    Lanier-linked security may arrest the team with nonlethal gear, while Red Samurai
    may interrupt a proposed trade; the scenario is designed to leave Lanier’s actual
    allegiance unproven.
  exact_game_equipment: The setup specifies one-shot Rating 10 scanner and tracking
    programs for the player-character decker; both program types and Rating 10 are
    exact published game values, not estimates.
  possible_aftermath: Watanabe may permit broader access to Renraku secrets after
    her test; Lanier may continue appearing loyal while employees suspect him. The
    text gives no proof of actual Fuchi cooperation.
