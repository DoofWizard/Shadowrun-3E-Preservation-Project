data:
  source_context: Original fiction-only Shadowrun Third Edition-era tabletop source
    Blood in the Boardroom (FASA Corporation, FASA7327, 1999), printed pp34/PDF pp34;
    original-page imagery independently reviewed; all named subjects and events are
    invented-world game material.
  source_scope: End of Track One, printed p34 immediately before Track Two begins
    p35; each is a suggested GM plot hook rather than an established occurrence.
  ideas:
  - title: Hostile Takeover
    scenario: An independent Fuchi aquasphere near Indonesia declares separation amid
      corporate turmoil. Its Workers Council asks player characters to transport food,
      other supplies, and weapons through the blockade and may ask them to assist
      resistance or train workers; different council factions consider asking rival
      megacorporations for aid.
  - title: A Gift for the Bride
    scenario: Korin Yamana hires runners to obtain a king cobra at least eight meters
      long for Mitsuko Shiawase, but they encounter evidence the target has already
      been captured by Parashield and is in a guarded company compound; other factions
      may compete for it.
  - title: Bustin’ Out
    scenario: A group claiming to be the anti-megacorporate Corpbusters hires runners
      to extract Darnel Burns from a Fuchi prison and assist other prisoners. The
      premise reveals Burns and several others have experimental implanted tactical-computing
      equipment; supposed sponsors are in fact Saeder-Krupp agents seeking subjects,
      a hidden GM plot twist rather than a fact known to the runners at the start.
