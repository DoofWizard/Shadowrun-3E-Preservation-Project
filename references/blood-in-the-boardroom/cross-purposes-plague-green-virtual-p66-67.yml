data:
  source_context: Fictional Shadowrun tabletop role-playing-game supplement Blood
    in the Boardroom (FASA Corporation, FASA7327, 1999), original Third Edition-era
    setting and optional scenarios; printed and PDF page numbers coincide in this
    range. Original cataloged PDF SHA-256 8c32ca7d540110deea9acf8714dc7fb2b92f742beeca004489cd0dc1a472d5e4.
  record_scope: 'Three optional adventure ideas: Plague of Angels, Green Piece and
    Virtual Funds'
  section: 'Track Three: Cross Purposes — Adventure Ideas, printed pp66-67'
  plague_of_angels:
    setup: A fictional extremist Alamos 20K faction seeks devil rats carrying Strain
      III-Beta, described in the RPG as an astrally active parasitic bacterium used
      against insect spirits in Chicago. Their intended victims are ghoul, metahuman
      and magical communities whom the faction disparages as undesirable; the source
      explicitly portrays discriminatory hostility rather than an actual humanitarian
      undertaking.
    deception: A faction representative falsely approaches the player characters in
      the guise of an Awakened Liberation Front supporter, claiming to rescue abused
      animals from an Ares thaumaturgical laboratory in Seattle. He conceals the faction’s
      actual plan and the strain’s involvement.
    possible_branches: The source allows a trap after the fictional animal exchange,
      the representative presenting himself as a Cross Applied Technologies Seraphim
      if captured, a proposed reward to acquire animals in a later negotiation, and
      imagined Strain III outbreaks. Ares and Seraphim actors may investigate the
      source; the Alamos faction may threaten the player characters. No outbreak or
      murder is established as compulsory history.
    source_scope: The bacteria and astral properties are fictional Shadowrun science-fantasy
      elements; this record describes an optional narrative hook and provides no real-world
      biological method.
  green_piece:
    setup: Leviathan Technical, a Silicon Valley Ares subsidiary making cyberware
      and related products, disposes of toxic biomedical waste in a manner said by
      the source to damage the environment. Local ecological activists, including
      Terra First! members, have evidence suggestive of the dumping but not enough
      to prove its origin.
    conflicting_interests: The Nakatomi faction of Fuchi, seeking to weaken Ares,
      unlawfully obtains relevant records from a Leviathan Matrix host and leaks material
      to Terra First! but retains an incomplete deal. Arthur Vogel has been asked
      for help; Damien Knight has blocked his investigation. The source describes
      both factional interests, rather than presenting the activists as a single institution.
    optional_events: A Fuchi decker’s monitored system notices the leaked information.
      Ares may deploy personnel to recover the data. Vogel may hire player characters
      to reach the decker first, hoping to confront Ares from within, while Terra
      First! remains wary of him. The outcome is contingent on player actions.
  virtual_funds:
    setup: Richard Villiers commissions an inquiry into how Arthur Vogel acquired
      the money used to purchase Leonard Aurelius’s Ares shares. Characters trace
      suspicious financial transfers from anonymous international accounts to a supposed
      teleporting system access node.
    fictional_reveal: The investigation may reveal a virtual bank on a heavily protected
      Matrix host connected with Santa Fe in the Pueblo Corporate Council. A subsequent
      visit discovers a gutted physical site, an unusual mixture of spoofed Matrix
      records and transferred secrets. Local officials may arrest or obstruct the
      characters, and Villiers may assist or compensate them. These are optional adventure
      developments, not established events.
  attribution: Alamos, Ares, Cross, Fuchi, Terra First!, Vogel and Villiers roles
    are ascribed by the published scenarios; motives and outcomes must not be asserted
    as events that necessarily occurred.
