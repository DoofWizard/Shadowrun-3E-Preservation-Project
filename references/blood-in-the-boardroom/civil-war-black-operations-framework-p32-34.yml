data:
  source_context: Original fiction-only Shadowrun Third Edition-era tabletop source
    Blood in the Boardroom (FASA Corporation, FASA7327, 1999), printed pp32-34/PDF
    pp32-34; original-page imagery independently reviewed; all named subjects and
    events are invented-world game material.
  scenario_status: Optional tabletop fiction involving a Fuchi delta clinic; no real-world
    procedures or advice is intended.
  premise: Rumor reports two Fuchi delta clinics, including one alleged to be within
    Pueblo Corporate Council territory and secretly controlled by Villiers. As Fuchi
    fragments, the Yamana faction tries to gain control, seeking independent mercenaries
    and shadowrunners rather than an open Fuchi deployment.
  setup: A well-connected fixer offers a high-paying but secretive facility-entry
    job; after acceptance provides maps, equipment and air transport. The characters
    are to take command of a remote facility and permit a mercenary force to arrive
    while minimizing harm and collateral damage; personnel extraction is a secondary
    requirement.
  sequence:
  - A contact and pilot at Santa Fe provide a Fuchi helicopter and clothing/identification
    while the group makes its way toward the clinic.
  - The remote compound includes a helipad, access control, drones, magical barriers
    and guarding staff; the source presents multiple possible approaches rather than
    a compulsory procedure.
  - After securing the control center, a mercenary group moves in, while incumbent
    guards try to reclaim it; Dr. Dmitri Zalman, leading a hermetic mage research
    group, refuses to assist the takeover.
  - Dr. Quinn Hildebrandt is brought in by the Yamana side to replace Zalman; after
    the change, Zalman seeks the runners’ aid against their employers.
  - Mr. Monty Livingston, fictional British vampire affiliated with the Ordo Maximus
    and teaching mages cybermancy, enters the conflict to undermine the Yamana takeover
    and extract Zalman.
  - Pueblo Security Forces respond to escalation and contain the property while the
    group must decide whether to follow its prior extraction instructions or change
    sides.
  climax_sequel: Possible rescue, escape, corporate and Ordo retaliation, or lethal
    consequences to Zalman are conditional branches, not established world outcomes.
    The book identifies no precise dice or target-number mechanic in this range.
