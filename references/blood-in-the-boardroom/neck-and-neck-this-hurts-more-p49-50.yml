data:
  source_context: Original fictional Shadowrun tabletop RPG book Blood in the Boardroom,
    FASA Corporation (FASA7327, 1999), printed pp49-50/PDF pp49-50; all persons, institutions
    and events below are fictional game material.
  scenario_title: This Hurts Me More Than It Hurts You
  narrative_frame: Optional branchable corporate-conflict adventure in the fictional
    game.
  corporate_background: HyperSense is a small experimental simsense production company.
    Founder Jacob Kitt holds 49 percent and Renraku holds 51 percent after a rescue
    investment; Kitt secretly claims to have achieved new recording techniques derived
    from former Leonardo-related advances. Renraku owns a controlling interest but
    has not discovered all of his experiments.
  employer_deception: Kitt masquerades as a Mr. Johnson and offers the runners a misleadingly
    simple and deliberately nonlethal sabotage job against his own facility, aiming
    to make Renraku sell its investment. He withholds his relationship to HyperSense
    and his dependence on organized-crime financing.
  possible_discoveries:
  - The team may uncover records of Renraku-controlled shell shareholders, Kitt’s
    secret new production site and a loan tied to a yakuza oyabun.
  - Kitt’s creditor has leveraged his obligation into a demand to produce a new fictional
    BTL product called Flashers, creating a coercive relationship beyond Kitt’s original
    arrangement.
  - Renraku’s investigation and the yakuza’s suspicions can independently escalate;
    the company may reinforce the facility while the criminal group attempts to protect
    its stake, with a possible destructive confrontation at the hidden site.
  - If characters refuse or expose Kitt, the employer may commission another team
    and attempt to implicate them; depending on events Renraku might sell its holdings
    to a rival instead of Kitt.
  uncertainty_and_consent: Coercion from an organized-crime loan, a concealed corporate
    controlling stake and competing violence are facts/possible events in this published
    scenario. The GM selects their resolution; no single outcome is an established
    canon.
