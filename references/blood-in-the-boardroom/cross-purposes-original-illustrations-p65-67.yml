data:
  source_context: Fictional Shadowrun tabletop role-playing-game supplement Blood
    in the Boardroom (FASA Corporation, FASA7327, 1999), original Third Edition-era
    setting and optional scenarios; printed and PDF page numbers coincide in this
    range. Original cataloged PDF SHA-256 8c32ca7d540110deea9acf8714dc7fb2b92f742beeca004489cd0dc1a472d5e4.
  record_scope: Three original uncaptioned monochrome illustrations in Cross Purposes
    adventure ideas
  section: 'Track Three: Cross Purposes — original source artwork, printed pp65-67'
  plates:
  - printed_page: 65
    pdf_page: 65
    description: Tall framed monochrome illustration of a spacesuited or pressure-suited
      human figure floating or working among orbital-platform structural elements,
      wires and equipment. The artwork accompanies the Look Before You Leap scenario.
  - printed_page: 66
    pdf_page: 66
    description: Large monochrome scene of two alarmed human figures with equipment
      near panes, pipes, and a mass of creatures or distorted forms in an industrial
      or laboratory environment. No names or species are identified by a caption.
  - printed_page: 67
    pdf_page: 67
    description: Rectangular black-and-white head-and-shoulders drawing of a bespectacled
      man with closely cropped or swept-back hair, set above the Virtual Funds text.
      The printed illustration provides no definitive name caption.
  identity_caution: Do not infer the identity of the depicted figures from narrative
    proximity alone, or create character entries from the plates without separate
    source verification.
  asset_preservation: Original monochrome illustrations are preserved as image-source
    references; no claim that this YAML file embeds the raster illustration.
