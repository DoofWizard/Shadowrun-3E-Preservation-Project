data:
  source_context: Fictional Shadowrun Third Edition-era tabletop role-playing game source, Blood in the
    Boardroom (FASA Corporation, 1999, FASA7327); independently reviewed original printed/PDF page images;
    historical edition, no inferred conversion. Printed pages 63-64 / PDF pages 63-64.
  record_scope: Optional Knight’s Gambit scenario concerning a missing antique chess piece
  section: 'Cross Purposes — Adventure Frameworks: Knight’s Gambit, printed pp63–64'
  premise: Dunkelzahn bequeathed an antique chess set to Damien Knight, except for the black king, which
    went to Leonard Aurelius. An Ares employee, acting at Aurelius’s direction, sends player characters
    to find a missing antique piece taken from a safe in Aurelius’s old Knight Plaza office. Aurelius
    believes the corporate team failed him; the characters may infer rival involvement, which is not established
    at the outset.
  setup: An Ares-connected fixer explains that a rival team entered Leonard Aurelius’s former office in
    Knight Plaza and removed an object from a secret safe. Aurelius demands its return and does not fully
    disclose its value; the player characters investigate the rival runners and Aurelius’s estate during
    his absence.
  events:
  - The rival team used false identities and a chess set as a diversion. The scenario supplies a lead
    involving Aurelius’s daughter Evelyn, also called Eve Night, a player of chess and an urban brawl
    enthusiast.
  - Eve hid the real king piece in a different chess set and intends to use it to force a chess encounter
    with Damien Knight; the player characters may eventually learn they were deceived about the apparent
    theft.
  - Aurelius blames the characters for failure and sends others to retrieve the king. Eve proposes that
    they help arrange the game while Ares and her family become more involved.
  climax: After the players confront Eve, the scenario allows a staged chess event at a secure location.
    Knight can play Eve; Aurelius’s other agents may interrupt, creating a conflict over possession of
    the piece.
  optional_sequels: Eve’s interest in Knight is described as a stratagem to challenge her father, and
    the scheme can create family and corporate repercussions. The published adventure does not mandate
    a single outcome.
  attribution: All character actions and endings are described as optional gamemaster fiction rather than
    enacted historical events.
