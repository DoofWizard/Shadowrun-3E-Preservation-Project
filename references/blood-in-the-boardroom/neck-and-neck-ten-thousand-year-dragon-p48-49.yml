data:
  source_context: Original fictional Shadowrun tabletop RPG book Blood in the Boardroom,
    FASA Corporation (FASA7327, 1999), printed pp48-49/PDF pp48-49; all persons, institutions
    and events below are fictional game material.
  scenario_title: What Does a Ten-Thousand-Year-Old Dragon Get?
  premise: The fictional inventor Leonardo has disappeared, and the great dragon Hestaby
    reportedly seeks his whereabouts and Great Work. The book presents rival pursuit
    and an optional investigation rather than establishing his final fate.
  setup: A California shaman called Breeze recruits the team to investigate Leonardo’s
    destroyed African observatory. He provides a composite portrait, false travel
    credentials and transport toward Baghdad/Ahvaz. An ork rigger named Spin Doctor
    may assist.
  optional_scenario_events:
  - At Ahvaz, a local armed group under Abu Khalid occupies the observatory area and
    may question or capture intruders. Locals mention a dragon destroying the observatory;
    the report is not independently established by their testimony alone.
  - The observatory has burned; military advisers are revealed in the scenario to
    work for Saeder-Krupp and to be concealing relevant traces after Lofwyr hired
    Abu Khalid’s group to clear the location.
  - Possible clues include a Renraku Matrix-host reference, a file labeled Mil Zeta
    Five, a protected optical chip, and the encoded transponder in an employee’s headware.
    Searches may discover a partially erased personnel file associated with Mr. Kineda,
    a personal aide to Renraku executive Haruhiko Nakada.
  - The team may catch up with Mr. Kineda near San Francisco; Tir Ghost operatives
    acting for Ehran the Scribe contest the retrieval. A chase can reach the Tir Tairngire
    border, while Hestaby’s Shasta-associated shamans may intervene depending on player
    decisions.
  exact_matrix_terms:
  - Locate File operation
  - Locate Slave operation
  - Analyze Icon operation
  - Red 8 October (host name as printed)
  uncertainty_and_ending: Hestaby may acquire the chip without its access codes; multiple
    corporate and elven groups may continue seeking evidence of Leonardo’s work. None
    of the pursuit outcomes is a fixed historical result in the source.
