data:
  source_context: Fictional Shadowrun tabletop role-playing-game supplement Blood
    in the Boardroom (FASA Corporation, FASA7327, 1999), original Third Edition-era
    setting and optional scenarios; printed and PDF page numbers coincide in this
    range. Original cataloged PDF SHA-256 8c32ca7d540110deea9acf8714dc7fb2b92f742beeca004489cd0dc1a472d5e4.
  record_scope: Optional Return Policy scenario involving Reactive Meditech bonds
    and Lucien Cross
  section: 'Track Three: Cross Purposes — Adventure Ideas, Return Policy, printed
    pp65-66'
  corporate_background: Reactive Meditech, described as a third-tier biotechnology
    company, faces a Cross Applied Technologies takeover. Its management had issued
    many short-term bearer bonds as an emergency financing tactic; a large share came
    to be owned by an unidentified investor, leaving Reactive Meditech exposed as
    the bonds mature.
  employer_and_goal: Jeff Hansen, Reactive Meditech’s security director, hires player
    characters to recover the bearer bonds from downtown bank safe-deposit boxes.
    He believes their recovery could prevent a financially ruinous obligation for
    the company. The fiction portrays this as a physical bank theft, with optional
    ancillary thefts suggested to disguise the true target.
  complication_and_attribution: In the published optional twist, the bondholder is
    Lucien Cross himself, and his Seraphim discover the player characters’ involvement.
    Cross intended the bonds to pressure Reactive Meditech and move toward corporate
    control; the suggested ending may involve his agents attempting to reclaim them.
    This is one scripted campaign possibility, not mandatory canon.
  context: The text explicitly distinguishes the relatively uncommon physical bank
    theft from ordinary electronic financial activity in its future setting.
