data:
  source_context: Fictional Shadowrun tabletop role-playing game, Blood in the Boardroom,
    FASA Corporation (1999), FASA7327; original Third Edition-era published setting/adventure
    reference. Independently inspected original cataloged printed/PDF page images;
    these are optional scenarios, in-world facts, or exact fictional game mechanics,
    not contemporary factual allegations or real-world advice.
  section_context: Out of the East
  section: 'Out of the East: Adventure Ideas, pp86–87'
  ideas:
  - title: Ancient Chinese Secret, Huh?
    facts_and_premise: Eric Wong operates the Lee Chee Garden restaurant and falsely
      claims contact with an ancient Chinese ghost. The alleged ghost is actually
      the astrally projected form of Sau-kok Chu, the chief executive of Tan Tien,
      Inc. Wong passes information collected from guests to Chu. Mitsuhama Computer
      Technologies agents abduct Wong; after discovering Wong and Chu are half-brothers
      they seek leverage to make Tan Tien leave the Pacific Prosperity Group. Shadowrunners
      may be hired by Wong’s supposed cousin, who is another Tan Tien operative.
  - title: Truck Stop
    facts_and_premise: Yong-jo Moon of Eastern Tiger Corporation asks runners to investigate
      Red Rovers attacks on company convoys. A rumor about Eastern Tiger receiving
      military firearms is false and was spread by a Mitsuhama operative. The real
      objective in the scenario is to distract competitors from a separate Mitsuhama
      convoy carrying military-specification gear. The source does not establish the
      rumor as fact.
  - title: Mob Clash
    facts_and_premise: Yamatetsu’s relocation increases legal and illegal trade between
      Tacoma and Vladivostok. Dimitri Makaroff, a Tacoma-based Vory leader, is gathering
      evidence about Hanzo Shotozumi’s ambition to establish an independent yakuza
      organization; Shotozumi counters with inquiries and leverage. The groups use
      rival freelancers as tensions intensify. This is optional fictional-world campaign
      conflict, not operational advice.
  - title: Tome Raiders
    facts_and_premise: After two Triad members are found dead, Octagon Triad leader
      David Gao hires the player characters to investigate. Magical evidence points
      to two elves, revealed in the GM scenario as Mystic Crusaders working for the
      Atlantean Foundation to obtain a scroll from Chao Su-Cheng. Chao is Wuxing’s
      geomancer, a Triad member, and connected with Octagon Incense Master Chen Kwan-Ti.
      The characters may uncover the plan in time to influence its outcome.
  attribution: All four are optional plot seeds; rumors, staged deception, and possible
    outcomes are not converted into established setting history.
