  "data": {
    "source_context": "The fictional dated narrator scene titled Pieces of a Puzzle in FASA Corporation’s Blood in the Boardroom (FASA7327, 1999), original Shadowrun Third Edition-era source; original printed pp6-7/physical PDF6-7. Narrator events and character assessments are distinguished from Priault’s beliefs and Lofwyr’s statements.",
    "scene_date": "15 August 2059, an in-world fictional date",
    "participants": {
      "Jean-Claude Priault": "Corporate agent working for Lofwyr and stationed aboard Zurich-Orbital; scene viewpoint character.",
      "Lofwyr": "A fictional great dragon and corporate principal; appears over telecom in human form and directs Priault’s political strategy."
    },
    "setting": "The first scene takes place in Priault’s compact office aboard Zurich-Orbital, overlooking Earth and Asia, using a telecom conversation with Lofwyr. The narrator describes Priault’s long employment, discomfort with the orbital environment, and the comparative perspective from space; these subjective impressions are Priault’s.",
    "corporate_court_election": {
      "electoral_result": "In the fictional scene, Priault reports that Li Feng of Wuxing was selected to replace Hague as a Corporate Court justice; it is the first time in seventeen years a new corporation is represented. Wuxing, headquartered in Hong Kong, leads a consortium of Pacific Rim corporations challenging Japanese domination of the regional economy.",
      "voters_reported_by_priault": "Priault reports that Ares, Aztechnology and Yamatetsu favored Wuxing as expected. Fuchi electors also voted for Wuxing. He interprets their votes as suggesting alignment with the Richard Villiers faction; this political interpretation remains his.",
      "past_incident": "Priault connects Fuchi voter behavior with David Hague, a Fuchi justice who died unexpectedly after opposing Richard Villiers during an internal Fuchi conflict. The circumstances and Villiers’s responsibility for the death are not established by the source scene.",
      "opposition_and_surprise": "Priault reports Mitsuhama, Renraku and Shiawase opposed Wuxing; Priault believes one Saeder-Krupp elector defied Lofwyr’s order and voted for Wuxing. These are Priault’s reported electoral observations and suspicions.",
      "authority_distinction": "Priault fears he failed Lofwyr’s instructions to block the candidate; Lofwyr tells him he was ordered to oppose the candidacy, not necessarily prevent the election."
    },
    "lofwyrs_strategy": "Lofwyr explains that public opposition to Wuxing encourages Japanese corporations to regard Saeder-Krupp as an ally, while helping ensure Ares and Aztechnology support Wuxing because they see an outcome opposed by Japan and Saeder-Krupp as favorable to themselves. He says Saeder-Krupp’s voting dissent may encourage rivals to underestimate it; Wuxing, newest and weakest on the Court, can be allowed a seat without comparable strategic concern. These are Lofwyr’s statements, not independently recorded court proceedings.",
    "priault_conclusion": "Priault recognizes he was deceived as part of Lofwyr’s broader plan. The narrator ends with Priault reflecting that remaining in orbit may be safer than joining Lofwyr on Earth.",
    "original_art_pdf7": "Original monochrome full-page illustration above the concluding text depicts a suit-clad figure in a curved technology-filled station facing a large screen with the face of another person. The illustration accompanies the prologue but has no explicit printed character caption; visual identities are not assigned beyond narrative context."
  },
