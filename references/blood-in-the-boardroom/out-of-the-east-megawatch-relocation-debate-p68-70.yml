data:
  source_context: Fictional Shadowrun tabletop role-playing game supplement Blood
    in the Boardroom (FASA Corporation, FASA7327, 1999); historical Third Edition-era
    publication; source-original PDF SHA256 8c32ca7d540110deea9acf8714dc7fb2b92f742beeca004489cd0dc1a472d5e4;
    printed pp68-70/PDF pp68-70. Distinguish narrator, in-world reports, and optional
    GM outcomes.
  record_scope: MegaWatch, relocation news bulletin and contested Shadowland commentary
  section: 'Track Four: Out of the East — On Location, news bulletin and annotated
    comments, printed pp68-70'
  primary_publication: In a fictional syndicated news story reproduced by MegaWatch
    contributor Kaptain Krude, Yamatetsu Corporation announces relocating its primary
    offices and corporate headquarters from Kyoto, Japan to Vladivostok, Russia. This
    is an in-world news report, distinguished from the surrounding anonymous commentators.
  context_in_report: The news account links the surprise move to post-February 22
    mourning for former chair Tad amako Shibanokuji (spelled Tad amako as one name
    in this source, here recorded as Tadamako Shibanokuji), questions about successor
    son Yuri, financial pressures, Japanese trade-regulation investigations, and CEO
    Saru Iwano’s displeasure. It reports that the board approved Yuri’s motion rather
    than his expected resignation; a more-than-700-point Nikkei fall is an in-world
    contemporary report, not a mechanically verified game statistic.
  quotes_attribution:
  - speaker: Fang
    claim: Describes Yuri dismissively and alleges the ministry in Japan used environmental
      rules as a means of exerting pressure on Yamatetsu; these are the speaker’s
      contentions.
  - speaker: Green Queen
    claim: Challenges the premise that every environmental enforcement action was
      discriminatory against Yamatetsu, arguing that anti-pollution action may have
      its own rationale.
  - speaker: AAAbacus
    claim: Supports Green Queen’s skepticism toward corporate motives and likens Japan’s
      megacorporations to other exploitative operators.
  - speaker: Kaptain Krude
    claim: Emphasizes a Japanese megacorporation shifting business to Russia and anticipates
      consequences in the market; makes no claim to know the board’s entire motive.
  - speaker: Diente
    claim: Initially minimizes the HQ move as geographic office movement, then argues
      that direct Russian consumption may not explain the expense; remains skeptical
      of inferred motives.
  - speaker: Marjorie Morningstar
    claim: Explains extraterritorial corporate property may not alter national jurisdiction
      but argues the apparently costly move could signal a strategic purpose.
  - speaker: Flagman
    claim: Argues extraterritoriality does not prevent host governments from affecting
      production and shipping; later suggests Russian officials may welcome jobs,
      tax receipts and corporate prestige while making regulatory accommodations.
  - speaker: Obie-1
    claim: Posits environmental regulations can serve as leverage against an uncooperative
      megacorporation; this is a perspective, not a confirmed official policy.
  - speaker: Olympus
    claim: Notes corporations’ non-extraterritorial subsidiaries and potential jurisdictional
      constraints.
  - speaker: Butterfly
    claim: Speculates Yuri or another actor might be depressing Yamatetsu share prices
      for a control struggle or takeover; this is identified as unverified speculation.
  - speaker: The Dark Wight
    claim: Suggests metahuman policy conflicts may have motivated the relocation,
      citing reported Vladivostok metahuman refugees from Japan; source presents it
      as conjecture.
  source_certainty: Distinguish the replicated in-world news account, individual attributed
    Shadowland interpretations, and any later omniscient source narrative. Do not
    promote claims of a secret plot, discrimination motive or takeover to settled
    narrator facts.
framing: newsroom_neutral
