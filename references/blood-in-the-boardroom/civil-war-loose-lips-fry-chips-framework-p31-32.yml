data:
  source_context: Original fiction-only Shadowrun Third Edition-era tabletop source
    Blood in the Boardroom (FASA Corporation, FASA7327, 1999), printed pp31-32/PDF
    pp31-32; original-page imagery independently reviewed; all named subjects and
    events are invented-world game material.
  status_scope: An expressly optional adventure framework; outcomes and exact actions
    depend on player decisions and gamemaster choice.
  premise: A fictional freelance decker known as HAL accidentally contacts experimental
    psychotropic black IC named Stoolie C during a San Francisco Fuchi Matrix run
    and becomes unable to refrain from disclosing true facts, including confidential
    information about shadowrunning contacts and corporate secrets.
  antagonists: Fuchi Asia wants HAL silenced and wishes to investigate the experimental
    IC before killing him; Fuchi Americas and Pan-Europa seek to obtain him alive
    for information about the technology and his knowledge.
  events:
  - Characters meet HAL in a decker gathering or bar where disclosures draw attention;
    Fuchi Asia guards attempt to seize him.
  - Later Fuchi teams from Americas and Pan-Europa pursue the character and may clash
    with the Asia team as HAL flees.
  - HAL’s exposed former associates become interested in questioning or harming him
    because he can no longer keep secrets.
  - An IC counter-conditioning program exists in Fuchi Asia’s San Francisco host and
    may reverse the effect; its download includes trace IC and his physical location
    may become known.
  climax_and_sequels: The group may pursue the counterprogram, flee the factions,
    rescue HAL, or face consequences from people HAL exposed. If cured HAL may temporarily
    retain his knowledge; in-world factions remain interested in him. None of these
    are mandatory canon outcomes.
  source_terms: The printed proper name of the psychotropic black IC is used as a
    fictional name and not a real-world program claim.
