data:
  source_context: Original fiction-only Shadowrun Third Edition-era tabletop source
    Blood in the Boardroom (FASA Corporation, FASA7327, 1999), printed pp29-30/PDF
    pp29-30; original-page imagery independently reviewed; all named subjects and
    events are invented-world game material.
  canonical_status: The source presents a possible tabletop scenario using the fictional
    corporate history, not an event presumed to have happened in all campaigns.
  premise: In early July 2059 a fixer hires the player characters to intercept and
    protect fictional Corporate Court justice David Hague, aboard Flight 1118 arriving
    from Tokyo at Seattle; the aircraft crashes into the Redmond Barrens at over 300
    kilometers per hour.
  setup: A Mr. Johnson representing Richard Villiers requests Hague’s abduction and
    survival, with strict airport/downtown Fuchi security. The flight crashes before
    the planned extraction; Johnson then requests Hague’s case and/or remains as priorities.
  event_sequence:
  - Airfield alarm and citywide traffic hamper access. GM may offer alternative travel
    such as a helicopter arranged through Johnson.
  - At the crash site the aircraft is fragmented across miles and has been partly
    submerged. Characters encounter an apparent DocWagon crisis-response team whose
    conduct deviates from ordinary emergency practice.
  - The apparent first-response team is Renraku operatives seeking Hague; after combat
    involving real DocWagon responders, the Renraku team carries Hague’s body and
    a case with a Corporate Court logo away.
  - The group may follow the operatives to a deserted apartment building, where technical
    staff attempt to remove Hague’s cyberware memory; a four-person security team
    protects them while an operative tries to open the case.
  alternative_outcomes:
  - Johnson may send runners back to the crash for the body, introducing law enforcement
    and fire/rescue complications.
  - Later in-world information may implicate sabotage of Flight 1118 guidance systems,
    but this belongs to the presented scenario, not unconditional canon.
  - If runners take an ambulance, DocWagon may seek its return and their identities;
    media coverage may affect reputation.
  - Alternate DocWagon-focused campaign uses medically staffed responders pursuing
    Hague as a patient and confronting impersonators.
  game_rule_review: No explicit dice tests, target numbers, damage tables or other
    numerical game-resolution formulas appear in this source section; the stated flight
    speed is fictional scenario detail, not a mechanics conversion.
