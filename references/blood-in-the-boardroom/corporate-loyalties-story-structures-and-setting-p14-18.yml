  pp14-18: GM portrayal of corporations, loyalty conflicts and four optional plot
  structures'
summary: Archival third-person, source-reviewed record of gm portrayal of corporations,
  loyalty conflicts and four optional plot structures, original fictional Shadowrun
  source source.fasa-7327, published by FASA Corporation in Blood in the Boardroom
  (FASA7327, 1999), Third Edition-era; printed pp14-18/PDF pp14-18.
data:
  source_context: Published fictional Shadowrun tabletop RPG Blood in the Boardroom,
    FASA Corporation, FASA7327 (1999), original Third Edition-era publication, printed
    pp14–18/PDF14–18. Book narrator gives fiction-writing/game-master options; specific
    illustrations and source chronology are indexed separately.
  gamemastering_corporations:
    avoid_flat_types: The text recommends giving fictional corporate employees individual
      fears, motives, and loyalties instead of assuming every employee shares a corporate
      stereotype.
    divided_loyalties: Internal competition can split Fuchi staff among Villiers,
      Nakatomi, and Yamana, or cause mixed Shiawase/Novatech allegiances following
      acquisitions; employers and staff can change allegiance without a compulsory
      outcome.
    working_for_factions: Management and subsidiaries can recruit characters for competing
      purposes; the source proposes espionage, monitoring, and extraction as possible
      campaign contexts, rather than specific real-world methods.
    research_and_property: Named fictional research projects and subsidiary holdings
      may create contested assets; the narration identifies Damien Knight’s Ares Arms,
      Security and Space interests and Leonard Aurelius’s other projects as examples.
    orphan_companies: Layered holding companies may leave unrelated subsidiaries vulnerable
      or independent after megacorporate mergers; p16 supplies a deliberately complex
      fictional chain linking small companies across Tallahassee, Atlanta, Denver
      and London through Calablack and Fuchi Pan-Europa. This is an illustrative network,
      not a real company registry.
  story_structures:
    one_track_mind: Follow a single corporate track and use the other tracks as background,
      interspersing scenarios to span time.
    jumping_tracks: Switch among corporate factions and player-character allegiances
      as the interrelated events unfold; major NPC reactions persist in other tracks
      even when offscreen.
    freeform_plot_line: Let players select their involvement and direction, while
      the GM adapts material rather than imposing a fixed path; the source gives examples
      involving Lucien Cross, Damien Knight, former Fuchi subsidiaries and Richard
      Villiers/Novatech.
    novel_plot_line: Use a planned beginning, middle and end based on the printed
      chronology, appropriate for a defined-length campaign with a conclusion; not
      a unique canonical result.
  running_outside_seattle: The narrator permits moving most scenarios to other cities;
    the notable setting-specific exception is the Redmond Barrens suborbital shuttle
    crash in Seattle (p20), which is treated as occurring there regardless of where
    a group plays.
  ending_the_war: The book explicitly states the fictional corporate conflict can
    subside or resume; not all possible tabletop campaigns have to resolve identically.
    The overt conflict may end while rivalry continues.
  additional_source_context: 'Printed p18 cites Portfolio of a Dragon: Dunkelzahn’s
    Secrets; Target: UCAS; the Dragon Heart novels Stranger Souls, Clockwork Asylum
    and Beyond the Pale; Headhunters; Technobabel; and the then-upcoming Target: Smuggler
    Havens, Renraku Arcology: Shutdown, Corporate Download and New Seattle.'
