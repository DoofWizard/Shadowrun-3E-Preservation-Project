data:
  source_context: Original fictional Shadowrun tabletop RPG book Blood in the Boardroom,
    FASA Corporation (FASA7327, 1999), printed pp44-46/PDF pp44-46; all persons, institutions
    and events below are fictional game material.
  scenario_title: This Is Your Brain on Otaku
  narrative_frame: The publication explicitly presents this episode as an optional
    gamemaster adventure outline, not as a fixed outcome in Shadowrun continuity.
  premise: Renraku covertly places agents near Seattle otaku to learn about them.
    Undercover Renraku agent Diana Peng joins an otaku tribe, reportedly undergoes
    the Deep Resonance initiation and is found seriously cognitively impaired. Renraku
    operatives secretly transfer her to an unaffiliated clinic using an assumed identity,
    seeking information about the otaku. Fuchi-backed outsiders also seek access to
    her.
  identity_and_attribution:
  - Diana is twenty, publicly described as a third-generation Renraku data-entry employee
    in Seattle arcology security; a deeper Renraku file instead identifies her as
    an undercover security operative currently listed as Classified / M.I.A.
  - A caller calling himself Stuart Peng claims to be Diana’s father, but the adventure
    reveals that this Stuart is a Fuchi corporate expediter working with Shikei Nakatomi’s
    family; the genuine Stuart Peng is an executive who believes his daughter is assigned
    to the Red Samurai.
  - Stasky Institute near Doctor’s Hospital in Tacoma keeps Diana under the admission
    name Olivia Tang; the admission register names Roger Tang as her father and the
    account is funded by certified credsticks. The fictitious identities are presented
    as deceptive paperwork, not true family relationships.
  - Beamwalkers are described as a Puyaullup-associated youth group; rumors of connections
    to otaku are explicitly not proven.
  optional_sequence:
  - Employer asks player characters to remove Diana from the clinic and obtain evidence
    relevant to the Beamwalkers. Clinic records describe her neurological injury and
    obsessive interest in cyberdecks and the Matrix.
  - The group may meet hospital/clinic guards and Lone Star patrols. A Beamwalker
    observes the case and attempts to follow Diana; the group may choose whether to
    return her, keep her, or seek another outcome.
  - At a Villa Plaza mall handoff, the purported father arrives with Fuchi guards
    while Beamwalkers intervene. Diana responds to a cyberdeck display and runs toward
    an electronics store, preventing the planned quiet exchange.
  - Renraku has implanted a tracking-memory device associated with Diana’s headware;
    surveillance and company employees may pursue the group. Her headware includes
    an implanted datajack and retractable spur. These are published character-equipment
    descriptors, not a new standalone rules table.
  coercion_and_uncertainty: Diana is described as cognitively impaired and unable
    to understand or voluntarily authorize the proposed transfers. The Fuchi employer
    seeks her extraction without valid paternal identity; all competing custody/escape
    endings are gamemaster-contingent.
  optional_aftermath: The real father may investigate; the Beamwalkers may expose
    the group through mall video; if Diana lives, she may later be observed entering
    the Renraku arcology mall despite her ongoing disability. None of those options
    is an automatic outcome.
