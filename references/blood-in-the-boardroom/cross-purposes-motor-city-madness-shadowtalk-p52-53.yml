data:
  source_context: Fictional Shadowrun tabletop-RPG sourcebook Blood in the Boardroom,
    FASA Corporation, 1999, FASA7327, original Third Edition-era, printed pp52-53/PDF
    pp52-53.
  section: 'Track Three: Cross Purposes / Motor City Madness'
  editorial_frame: This is a signed fictional Megawatch discussion thread from the
    book. Assertions below represent individual speakers, not all certified narrator
    facts.
  known_discussion_subject: Leonard Aurelius has departed Ares Macrotechnology after
    losing his bid to oust Damien Knight; speakers debate motives and stock buyers.
  speaker_claims:
  - speaker: Pistol-Packin’ Piston
    statement: Says Leonard Aurelius sold Ares stock and withdrew after failing to
      displace Damien Knight; later predicts Knight would own 45 percent of Ares if
      he could buy the shares.
  - speaker: Neon Samurai
    statement: Suggests Knight might have threatened Leonard Aurelius’s family; explicitly
      presented as speculation. Elsewhere calls Aurelius’s action otherwise inconsistent
      with his long rivalry with Knight.
  - speaker: Fogo
    statement: Describes the board-control rivalry, including Knight’s support from
      Nadja Daviar after he lost control of the stock he received from her; argues
      Aurelius might have conceded a prolonged contest.
  - speaker: EdgeRunner
    statement: Wonders whether Knight or Cross Applied Technologies bought Aurelius’s
      stock; also speculates that a private sale protected Ares from hostile acquisition.
  - speaker: The Chromed Accountant
    statement: Claims Aurelius found a buyer or buyers off the open market rather
      than selling large holdings in public trading.
  - speaker: AAAabacus
    statement: Proposes that a private sale to Knight would give him direct control;
      later says a third-party purchaser would create a potential counterweight to
      Knight and hypothesizes a Daviar/Draco Foundation financing connection.
  - speaker: Alfie
    statement: Reports a source’s claim that Arthur Vogel bought Aurelius’s stock.
      This speaker attribution remains distinct from narrator confirmation on later
      printed p57.
  - speaker: Skeets
    statement: Questions Arthur Vogel’s personal means, considers donor/connection
      support and suggests possible tactical consequences for Knight; later suggests
      Aurelius could align with Villiers and Novatech.
  - speaker: Hopalong
    statement: Suggests Cross might not afford such a share purchase and that Knight
      could have an advantage over Cross.
  - speaker: Frookie
    statement: Raises a possible relation between Renraku’s alleged Babel computer
      virus and Cross cyberdecks; this is an in-world rumor, not a verified real-world
      or in-world software capability.
  - speaker: Ronin
    statement: Denies the alleged Cross link; claims personal knowledge of the fictional
      Babel virus creator, who is said not to work for Cross or anyone else and later
      says the virus no longer exists.
  - speaker: Zeb
    statement: Questions the implications for Leonard Aurelius’s retirement.
  - speaker: Kaptain Krude
    statement: Argues Richard Villiers is unlikely to join Leonard Aurelius after
      the conflict surrounding Novatech, Yamana and Nakatomi.
  source_claims_limit: No allegations in this conversation are asserted about actual
    persons or real-world companies; the debate is fictional and source-attributed.
framing: newsroom_neutral
