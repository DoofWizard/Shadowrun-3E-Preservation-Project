data:
  source_context: Published fictional Shadowrun tabletop RPG Blood in the Boardroom,
    FASA Corporation, FASA7327 (1999), original Third Edition-era publication, printed
    pp8–10/PDF8–10; source narrator describes publication structure and expressly
    optional game-master methods, not real-world advice.
  book_form: The supplement follows the results of corporate maneuvering over roughly
    late 2057 to early 2060, rather than a single linear adventure. It describes the
    consequences of the disappearance/destruction of an old megacorporation and the
    rise of three new major corporate contenders. The book follows a previous multi-thread
    format (Mob War).
  tracks: The book divides interrelated corporate conflict into separate tracks, each
    with background, major participants, corporate goals, outcomes, adventure frameworks
    and further adventure ideas. The GM may run a single track, move player characters
    across tracks, or treat other tracks as background; outcomes need not be predetermined.
  chapter_structure:
    opening: Each track begins with an in-world fictional Shadowland BBS-style voice
      piece, then What’s Going Down gives the plotted background and events.
    players: The Players provides profiles, motivations, goals and corporate functions
      of important fictional characters; these are more detailed than ordinary stat
      descriptions and can be reused in other campaigns.
    frameworks: Adventure Frameworks supplies optional outlines for tabletop sessions;
      Adventure Ideas gives shorter prompts for additional adventures.
    framework_five_parts:
    - 'Premise: conflict and starting issue'
    - 'Setup: entry situation and relevant background'
    - 'Events: possible challenges, not a compulsory fixed sequence'
    - 'Climax: possible outcome, alternatives if characters diverge'
    - 'Sequels: follow-on story possibilities'
  external_source_references: 'The narrator names Target: UCAS, Cyberpirates, and
    Shadowrun Companion: Beyond the Shadows as potentially relevant supplementary
    books; the latter has optional Contacts and Enemies material cited at pp62–75.'
  role_of_player_choices: The original text explicitly encourages campaign customization,
    substitution of characters/organizations, and different endings instead of treating
    every proposed scenario as canon.
