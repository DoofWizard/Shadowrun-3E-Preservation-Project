data:
  source_context: Original fiction-only Shadowrun Third Edition-era tabletop source
    Blood in the Boardroom (FASA Corporation, FASA7327, 1999), printed pp20-22/PDF
    pp20-22; original-page imagery independently reviewed; all named subjects and
    events are invented-world game material.
  article_frame:
    printed_section: 'Track One: Civil War — There Goes the Neighborhood'
    reporting_frame: Fictional MegaWatch SIG messages; posts have explicit handles
      and mix a quoted corporate announcement with speculation.
  corporate_press_release:
    date: October 6, 2059
    place: New York, NY, UCAS
    headline: Villiers International and Cambridge Holdings merge as Novatech
    publisher_claims:
    - Novatech Incorporated formed from Cambridge Holdings and Villiers International
      after the merger; focus on Matrix development and software, with aerospace,
      magical research, and corporate-security interests.
    - Richard Villiers named Novatech president, formerly president and CEO of Fuchi
      Americas and Villiers International.
    - Lucas Don, Cambridge Holdings managing director and CEO of CompuForce, to serve
      as senior vice president of Novatech.
    - Cambridge Holdings shareholders to receive 1.32 shares of Novatech stock per
      Cambridge share; Villiers International stock converts 1-to-1.
    - Press release projects Novatech as a major independent UCAS company; those projections
      remain corporate promotion, not independent confirmation.
  speaker_attributed_interpretations:
  - speaker: Beancounter
    claim: Interprets the announcement as evidence of Fuchi breakup and explains the
      historical relations among Villiers, Fuchi, Cambridge and Lucas Don.
  - speaker: The Dark Wight
    claim: Cites Cambridge’s software holdings, CompuForce acquisition trajectory
      and WolfWare as part of a broader corporate-control analysis.
  - speaker: Turner
    claim: Notes WolfWare’s earlier position under Cyberspace Development Corp. and
      suggests Villiers deliberately allowed Cambridge to take over the firm, then
      regained it through Cambridge.
  - speaker: AAAbacus
    claim: Interprets the pattern as Villiers acquiring personal control over formerly
      Fuchi-controlled subsidiaries and anticipating a break with Nakatomi and Yamana.
  - speaker: Kuroshii
    claim: Reports a list of at least twenty-two Fuchi Americas companies lost over
      the preceding four months, apparently acquired by Cambridge-affiliated firms.
  - speaker: The Dark Wight
    claim: Reports a late-2057 30-million-nuyen Cambridge credit line from Silveril
      Investments, which the discussion links to JRJ International.
  - speaker: Whatzit
    claim: Raises skeptical questions about Fuchi’s breakdown, Cambridge acquisitions
      and Villiers’s true motives.
  attribution_rule: These are participant interpretations inside a fictional message-board
    transcript. The source does not elevate every theory about Villiers’s intention
    into narrator-verified fact.
framing: newsroom_neutral
