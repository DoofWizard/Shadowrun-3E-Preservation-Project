data:
  source_context: Fictional Shadowrun Third Edition-era tabletop role-playing game source, Blood in the
    Boardroom (FASA Corporation, 1999, FASA7327); independently reviewed original printed/PDF page images;
    historical edition, no inferred conversion. Printed pages 62-63 / PDF pages 62-63.
  record_scope: Optional Not in My Back Yard adventure concerning QTS, CATCO, Knight, and the Quebec City
    council
  section: 'Cross Purposes — Adventure Frameworks: Not in My Back Yard, printed pp62–63'
  premise: CATCO is the only Matrix-technology company in Quebec without a home rival. Damien Knight tries
    to change this by backing Quiet Trigger Systems (QTS), a Detroit IC-software developer, for relocation
    to Quebec through the Quebec Empowerment Zones. Montreal-born Cross sees this as a competitive threat.
    The relocation has government approval but requires the Quebec City Council decision. The mayor supports
    the move; Cross’s supporters oppose it.
  setup: A fixer acting on behalf of Knight hires the players to serve as additional security for QTS
    in Detroit for two weeks. A toured facility appears well defended, with surveillance, guards and magical
    defenses. Its security posture is part of the fictional scenario, not tactical instructions.
  events:
  - In an arranged diversion, Seraphim operatives impersonating Knight Errant officers bring a staged
    hostile vehicle event near QTS; while a disguised disturbance occupies guards, Seraphim agents try
    to obtain company information. The party may observe conflicting corporate claims about the intrusion.
  - Following the QTS failure, Knight suspects Cross without proof, and a fixer asks the characters to
    identify alleged Cross agents. The pursuit leads to Seraphim agents in Quebec; questioning them may
    reveal information about Cross’s influence on Quebec City police chief Sebastian Hull.
  climax: The party receives a new optional assignment to prevent Sebastian Hull reaching the Quebec City
    council meeting before the vote. The source describes Hull using protective personnel and vehicles;
    the scenario can unfold by delay, diversion, negotiation or other game outcomes. His arrival could
    alter the balance of the vote in favor of Cross.
  optional_sequels: If QTS relocates, Knight uses corporate leverage against Cross; if the move loses,
    Cross’s gains are limited while the player characters may face Ares hostility in the Quebec area.
    The source describes different consequences for the fate of Hull; these remain conditional scenario
    outcomes.
  attribution: Fictional published gamemaster options only; no specified branch is claimed to have actually
    happened.
