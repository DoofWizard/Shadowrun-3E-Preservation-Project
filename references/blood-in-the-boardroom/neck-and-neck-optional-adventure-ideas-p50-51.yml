data:
  source_context: Original fictional Shadowrun tabletop RPG book Blood in the Boardroom,
    FASA Corporation (FASA7327, 1999), printed pp50-51/PDF pp50-51; all persons, institutions
    and events below are fictional game material.
  section: Adventure Ideas
  classification: Four independently optional fictional RPG campaign seeds, not events
    that necessarily occur in the setting.
  ideas:
  - name: Unwilling Transfer
    source_pages: 50-51
    proposal: Shikei Nakatomi seeks Fuchi Asia research talent. The characters are
      offered a nonconsensual extraction of a Filipino marine biologist from a Philippines
      Fuchi facility to Renraku’s Underwater Living Project. The biologist refuses
      the transfer, seeks aid through the rebel-pirate Huk Network and has a complicated
      prior corporate acquisition history. The text presents his resistance and possible
      retaliation as separate from Renraku’s offer.
  - name: The Squeeze
    source_pages: '51'
    proposal: Renraku seeks a majority position in WasserKraft, a German water-purification
      company connected to Fuchi’s Yamana faction. Reluctant shareholder Dieter Arkona
      is targeted for pressure; his associates include the Duchy of Pomorya’s ruler,
      a GreenWar-linked police figure, and North Sea pirates. Arkona may react to
      coercion or ambush; outcomes depend on player choices.
  - name: Public Secrets
    source_pages: '51'
    proposal: A Renraku system operator seeks help when confidential files appear
      in public systems. A semi-autonomous knowbot, identified as SK, appears to be
      moving files from a damaged Fuchi host through Renraku infrastructure; a mysterious
      decker repurposes the earlier dormant host and its corporate code. The situation
      is speculative/branching and does not establish an independent new general Matrix
      rule.
  - name: Transys Neuromess
    source_pages: '51'
    proposal: Transys Neuronet hires runners posing as Fuchi Asia scientists to obtain
      secrets while two other companies compete over the same facility. Renraku agents
      capture and forcibly transport them to a Renraku location, where they must decide
      whether to escape or contact Transys. These are fictional contested and nonconsensual
      scenario events, not real-world guidance.
  editorial_distinction: The chapter frames every idea as game-master-selectable,
    including proposed captures, corporate conflicts, deceptions and possible aftermaths;
    none should be normalized as completed canonical chronology.
