data:
  source_context: Fictional Shadowrun Third Edition-era tabletop role-playing game source, Blood in the
    Boardroom (FASA Corporation, 1999, FASA7327); independently reviewed original printed/PDF page images;
    historical edition, no inferred conversion. Printed pages 61-62 / PDF pages 61-62.
  record_scope: Optional Double Crossover fictional adventure premise, setup, three events, climax and
    sequels
  section: 'Cross Purposes — Adventure Frameworks: Double Crossover, printed pp61–62'
  fictional_premise: Raymond Briggs is vice president of Ares Seattle’s Consumer Electronics division.
    His father William Briggs is executive vice president of Ares Global Entertainment and is about to
    follow his former boss Leonard Aurelius to Cross Applied Technologies. Lucien Cross sees William as
    a capable replacement for Bernard Cross at Cross Advanced Electronics in Seattle.
  verified_relation: The source identifies Raymond Briggs as William Briggs’s son and Jezebel Surrateau
    as a Seraphim agent involved in extracting Raymond. The scenario does not establish that any kidnapping
    or employment transfer must occur in the canonical setting.
  setup: Surrateau hires the player characters to extract Raymond from Ares. His office is on the top
    floor of Ares Bellevue offices; he lives with his family in Ares-owned housing in Seattle’s Beaux
    Arts district. His father provides possible backdoors to the Matrix systems at the office and monorail
    control center. The optional job must be completed within a week, with Raymond unharmed, and an Amerindian
    samurai named Goliath accompanies the group to protect him.
  events:
  - At the Ares building, Knight Errant security protects the headquarters and the proposed access routes
    prove useful. Surrateau schedules a separate intervention at an Ares facility during the planned extraction.
  - Raymond summons DocWagon high-threat response via his Platinum DocWagon wristband. The DocWagon responders
    treat the incident as a possible abduction and may move to protect him; the characters can instead
    arrange a nonviolent handoff to Ares employee Knight Errant retrieval personnel or escape.
  - Raymond is presented to Surrateau, who contacts William; Raymond explains his wife is still held under
    Ares control at the family residence. The optional party may undertake a further rescue despite Raymond’s
    defection, while corporate security tightens around Mrs. Briggs.
  climax: Novatech personnel also approach Raymond because of his strategic value; the gamemaster permits
    the party to choose whether to resist the team or support Raymond’s alternative employment. The choice
    can create an adversarial relationship with one corporation.
  optional_sequels: If Raymond reaches CATCO, Surrateau offers more work; if the party becomes entangled
    with Novatech, the source proposes additional future jobs. Bernard is promoted to Cross Matrix Technologies
    and Raymond takes over Cross Advanced Electronics after the contemplated transfer. The sequels are
    optional scenario branches, not established narrator history.
  classification: All events and outcomes in this record are optional gamemaster scenario material, not
    real-world procedures.
