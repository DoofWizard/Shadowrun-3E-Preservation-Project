data:
  source_context: Fictional Shadowrun tabletop role-playing-game supplement Blood
    in the Boardroom (FASA Corporation, FASA7327, 1999), original Third Edition-era
    setting and optional scenarios; printed and PDF page numbers coincide in this
    range. Original cataloged PDF SHA-256 8c32ca7d540110deea9acf8714dc7fb2b92f742beeca004489cd0dc1a472d5e4.
  record_scope: Optional Look Before You Leap adventure idea concerning Leonard Aurelius
    and Ares Daedalus
  section: 'Track Three: Cross Purposes — Adventure Ideas, Look Before You Leap, printed
    pp64-65'
  premise: Before leaving Ares, Leonard Aurelius seeks data from a crystal-growth
    and fiber-optics research project operating aboard the Ares Daedalus orbital platform.
    He considers the research attractive to Cross Applied Technologies, which he hopes
    will purchase it.
  proposed_contract: Aurelius offers a large payment and Ares corporate identification
    with a repair-crew cover. Player characters travel by shuttle to Daedalus to obtain
    a computer memory storage unit holding more than fifty years of data and the project’s
    latest results. The return pilot is scheduled to depart twenty-four hours after
    their arrival.
  setting_constraints: The fictional setting limits weapons and unusual gear because
    of station security. The text asserts magic cannot be used in space and therefore
    the team must rely on ordinary skills and available mechanical/electronic kits.
    The platform has security personnel, retinal-scanning maglocks and surveillance
    equipment; security guards carry tasers and stun batons only because the station
    prohibits firearms.
  complication: The supposed repair work on the communications array actually needs
    doing. The optional scenario presents a dilemma over conducting legitimate repairs
    under false pretenses while collecting the data, amid a potentially hostile environment.
    An alarm can trigger station lockdown until AresSpace crisis-response personnel
    arrive.
  possible_endings: The source anticipates a dangerous return flight; Ares prefers
    forcing its shuttle to land and capturing passengers instead of shooting down
    one of its own craft. These are possible GM-played events, not completed setting
    history.
  attribution: Everything described under this heading is optional gamemaster material,
    not a report that an actual mission occurred.
