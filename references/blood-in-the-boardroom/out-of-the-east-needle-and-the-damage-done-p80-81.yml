data:
  source_context: Fictional Shadowrun tabletop role-playing game, Blood in the Boardroom,
    FASA Corporation (1999), FASA7327; original Third Edition-era published setting/adventure
    reference. Independently inspected original cataloged printed/PDF page images;
    these are optional scenarios, in-world facts, or exact fictional game mechanics,
    not contemporary factual allegations or real-world advice.
  section_context: Out of the East
  section: 'Adventure Frameworks: The Needle and the Damage Done; p80–81'
  premise: In this optional scenario a female contact of the runners’ principal fixer
    is abducted in broad daylight, then reappears the next day apparently unharmed
    but accused of the murder of Tadamako Shibanokuji. The fixer enlists the runners
    to investigate before the contact, Akemi, is convicted or killed.
  setup: The fixer reports that Akemi missed their meeting and failed to return from
    a trip to a Seattle shopping mall. He identifies her as previously a nurse at
    a Yamatetsu corporate hospital in Kyoto. The characters may find Akemi’s vehicle
    still at the mall and indications that men in business attire carried her away
    against her will.
  event_1: Akemi is later located unconscious near a roadway and hospitalized at Tacoma’s
    Charity General Hospital. Yamatetsu investigators ask the characters about the
    previous night’s killing of Tadamako Shibanokuji. Akemi reports incomplete memories
    of Buttercup and injecting Shibanokuji, with signs that her memories have been
    manipulated; the investigators allege that Akemi is implicated, not that the runners
    committed the murder.
  event_2: Akemi says she was assisting with care for the incapacitated former chairman
    Shibanokuji, using a needle to administer routine anticoagulant; this was not
    the immediate cause of his death. The scenario separately establishes that Yuri
    Shibanokuji’s supporters sought to cast suspicion on Buttercup and that Yamatetsu
    agents had altered Akemi’s memory and planted a false recollection of Buttercup
    giving the order.
  event_3: The characters arrange a safe meeting to obtain Akemi’s recollection. A
    hidden Yamatetsu recording team stages an attack and attempts to create false
    footage depicting the runners as aggressors while silencing Akemi. A cameraman
    attempts to return the footage to Yamatetsu.
  climax: The runners may rescue Akemi, pursue the film or its transmitter, and resist
    the framing effort. The scenario permits multiple outcomes; no confrontation or
    rescue is a predetermined historical event.
  possible_sequels: If Akemi is protected, Buttercup may publicize allegations that
    Yuri sought to frame her, leading to renewed Yamatetsu conflicts. A fixer’s opinion
    of the characters changes with their treatment of Akemi and the fixer.
  attribution: Scenario authorial premises and possible outcomes, not evidence that
    fictional-world events necessarily occurred.
