data:
  source_context: 'Fictional Shadowrun RPG source: FASA Corporation, FASA7327 (1999),
    original Shadowrun Third Edition-era tabletop RPG; Blood in the Boardroom, printed
    pp35-37/PDF pp35-37; original printed/PDF page images independently inspected
    before baseline freeze; fiction-only historical game reference.'
  format: On the Brink section; ShadowWatch/MegaWatch SIG posts on fictional Shadowland
    BBS, followed by narrator transition into Renraku history on p37.
  narrator_context: The chapter concerns Renraku Computer Systems, its growth, its
    conflict with Fuchi and events shaping the corporation in the 2060s. ShadowWatch
    posts are not omniscient narrator facts.
  attributed_posts:
  - speaker: Black-Eyed Susan
    context: Printed p35
    claim: Relays a secondhand source describing an unscheduled Kennedy International
      to Zurich-Orbital boost; says Corporate Court justice Paul Graves departed a
      Detroit strategy session for a private jet, and claims four of the other eleven
      justices left for New York, two were already aboard Zurich-Orbital, with five
      unaccounted for. She infers a possible Court conclave and notes extra on-orbit
      communication security.
  - speaker: Link
    context: Printed p35
    claim: Challenges Black-Eyed Susan’s arithmetic about the number of justices;
      his correction is disputed in the same dialogue.
  - speaker: Black-Eyed Susan
    context: Printed p35
    claim: Replies that one Mitsuhama justice, Dosan Aburakoji, died the previous
      month and the Court has not selected a replacement.
  - speaker: Lone Gunman
    context: Printed p35
    claim: Alleges the yakuza killed Aburakoji to prevent his disclosure of alleged
      Mitsuhama dealings to the Japanese government; presented as an unverified in-world
      allegation.
  - speaker: Turner; Whatzit
    context: Printed p35
    claim: Reject the asserted Mitsuhama-government connection and dispute Lone Gunman’s
      theory.
  - speaker: FastJack
    context: Printed p36
    claim: Reports Zurich-Orbital communications blackout; later argues Renraku’s
      behavior may conceal a larger secret of interest to the Court and explicitly
      marks his suspicion as uncertainty, not proof.
  - speaker: Piker
    context: Printed p36
    claim: Remarks on the blackout and lack of information; responds to Captain Chaos’s
      bulletin.
  - speaker: Kaptain Krude
    context: Printed p36
    claim: Says MegaWatch SIG observed movement of Fuchi and Renraku security/military
      assets after the Court news, connected to tensions over Miles Lanier’s switch
      from Fuchi to Renraku.
  - speaker: Captain Chaos
    context: Printed p36
    claim: Issues an in-world system bulletin dated 6 June 2059 at 15:44:19 (EST),
      saying Fuchi and Renraku appear to be preparing covertly for conflict while
      Corporate Court justices convene on Zurich-Orbital, and requests information;
      warning and prediction, not a recorded war.
  - speaker: The Chromed Accountant
    context: Printed p36
    claim: Says there is a flurry of Renraku internal traffic but no Court decision
      at the time of writing; speculates on an impending first strike and warns investors.
  - speaker: Hawkeye
    context: Printed p36
    claim: Reports priority traffic from China to a Renraku subsidiary in Des Moines,
      database deletions and tracing an allegedly deleted original packet; interprets
      it as a coverup without conclusive evidence.
  - speaker: Bouncing Boy
    context: Printed p36
    claim: Alleges an intercepted packet to a Renraku subsidiary in Boston carried
      a targeted delete order, while admitting evidence is unavailable because his
      deck was affected by deletion code.
  - speaker: Father Time
    context: Printed pp36-37
    claim: Requests proof, challenges premature inference and warns against drawing
      unsupported conclusions.
  - speaker: The Dark Wight
    context: Printed p37
    claim: Asks whether FastJack is predicting a Corporate Court mandate against Renraku.
  mechanics_scan: No numerical game test, dice, stat block, modifier or character
    equipment rule appears in printed pp35-36.
framing: newsroom_neutral
