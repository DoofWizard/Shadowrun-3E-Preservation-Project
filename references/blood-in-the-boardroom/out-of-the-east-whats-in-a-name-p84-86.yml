data:
  source_context: Fictional Shadowrun tabletop role-playing game, Blood in the Boardroom,
    FASA Corporation (1999), FASA7327; original Third Edition-era published setting/adventure
    reference. Independently inspected original cataloged printed/PDF page images;
    these are optional scenarios, in-world facts, or exact fictional game mechanics,
    not contemporary factual allegations or real-world advice.
  section_context: Out of the East
  section: 'Adventure Frameworks: What’s in a Name?; pp84–86'
  premise: Buttercup seeks the true-name secret held by an aging ork, Craig Sanchez;
    Jacques Barnard and other Yamatetsu figures seek the same person as corporate
    leverage. The characters may intervene while a hired mage plans to bind Buttercup.
  in_world_background: In 2033 Dunkelzahn bound Buttercup into the body of a young,
    uneducated ork for one year and one day after a dispute about her treatment of
    a human. The source portrays this as an imposed lesson rather than a voluntary
    arrangement. The ork later received a new identity (Craig Sanchez), a SIN and
    a substantial trust fund. The binding left Sanchez aware of Buttercup’s true name
    without realizing its importance.
  search_context: Dunkelzahn gave Sanchez an amulet intended to frustrate Buttercup’s
    attempts to locate him. Sanchez lost the pendant when evicted and became isolated
    amid serious alcohol dependence. Buttercup traced the object’s circumstances and
    hired runners to find Sanchez; Jacques Barnard wanted to use the same information
    against her.
  countercontract: Michael Lane, a Yamatetsu Seattle executive, hires the characters
    to locate and acquire the 56-year-old Sanchez for a sizeable payment without revealing
    the full corporate motive. A mage named Caldwell leads an opposing Yamatetsu team.
  event_1: The original listed address in Bellevue leads to a tenant manager, Malek
    Hamesh, who lacks Sanchez’s new location. The abandoned apartment contains a green-stone
    amulet on a broken silver chain and other evidence, including a Draco Foundation
    forwarding address.
  event_2: A bank inquiry indicates that Libra Holdings deposited 1,000,000 nuyen
    in June 2034 and that interest and regular rent transactions continued; subsequent
    information connects Libra Holdings to Cherry Creek Limited and the Draco Foundation.
    These are fictional-source facts; the characters’ discovery is contingent.
  event_3: The runners may reach a rundown Redmond apartment before Caldwell’s group.
    Sanchez can be taken into protective custody or intercepted. Caldwell aims to
    find the secret, and uses magical surveillance; the runners can discover competing
    employers and intervene.
  event_4: Caldwell learns that Sanchez knows Buttercup’s true name and moves him
    to a guarded Yamatetsu warehouse, preparing an elaborate hermetic circle and a
    binding. Buttercup may ask the runners to interrupt this ritual.
  climax_and_sequels: The runners can avert the binding, suffer reversals or allow
    it to proceed; if Caldwell dies, Buttercup can reward characters with an additional
    30,000 nuyen each, conditional on their taking laës to erase memory of the true
    name. The conditional memory erasure is an explicit requirement of Buttercup’s
    offer, not portrayed as freely volunteered medical care. Barnard and other corporate
    participants may continue their pursuit.
  attribution: Published optional GM story material; neither a fixed historical outcome
    nor real-world instruction.
  mechanics_cross_reference: Rule-specific amulet effect and its Grade 5/Magic 11
    equivalence are preserved in the separate rule_exact record for printed p86.
