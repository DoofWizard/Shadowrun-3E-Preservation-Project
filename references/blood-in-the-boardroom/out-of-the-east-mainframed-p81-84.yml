data:
  source_context: Fictional Shadowrun tabletop role-playing game, Blood in the Boardroom,
    FASA Corporation (1999), FASA7327; original Third Edition-era published setting/adventure
    reference. Independently inspected original cataloged printed/PDF page images;
    these are optional scenarios, in-world facts, or exact fictional game mechanics,
    not contemporary factual allegations or real-world advice.
  section_context: Out of the East
  section: 'Adventure Frameworks: Mainframed; pp81–84'
  premise: A Wuxing-linked corporate agent posing as Ms. Johnson hires runners to
    divert two old mainframe computer units from a cargo ship. Rival runner teams
    are unknowingly recruited under different corporate pretexts; the competition
    functions as a Wuxing assessment as well as a transfer of older Yamatetsu equipment.
  initial_contract: A female Japanese contact using the name Ms. Johnson arranges
    a meeting at Ling Ho restaurant. Two crates, each 3 by 2 by 2 meters, are due
    at Pier 27 in approximately 48 hours aboard the freighter Maneko, destined nominally
    for a City Center location. The characters are hired to deliver the undamaged
    crates to an office at Green Lake, approximately eight miles north, with payment,
    damage penalties, and possible speed bonuses.
  corporate_context: The pagoda symbol on her clothing points to Mitsuhama Computer
    Technologies but is a decoy. She actually works for Wuxing, which is building
    its Seattle operations. Wuxing knowingly pits several teams against one another;
    their presumed employers and rival affiliations must not be mistaken for objective
    facts.
  event_1: The Maneko is described as an older commercial freighter belonging to Tsuruga
    International and carrying the hijacked cargo. The City Center office is near
    Yamatetsu Seattle headquarters; the apparent alternative location is former Hauckshorn
    Chemicals premises. A false lead to Optical Industries, an MCT subsidiary, sends
    a second team toward an unrelated building.
  event_2: The cargo reaches the docks around 1700 hours and moves in an unmarked
    Ares Roadmaster. Escort riders in Honda Viking cycles present themselves as guards,
    though the account raises doubts about their claimed role. The equipment consists
    of large Yamatetsu mainframes containing data at least one year old, not classified
    or especially valuable.
  event_3: An Eye-Fivers distraction is used while rival runners interfere with the
    original delivery. The opposing team’s brooch bears a small Shi’aWase mark; the
    Ms. Johnson description may expose their common recruiter. Their understanding
    of their actual client is incomplete.
  climax: At the safe delivery point, a Tsuruga team attempts to reclaim the diverted
    crates. Ms. Johnson explains the arrangement as a completed delivery while judging
    the competing teams. Survival, protection of the cargo and the runners’ reactions
    influence optional outcomes.
  possible_sequels: The scenario says Wuxing later announces its acquisition of the
    Hauckshorn towers for a new Seattle headquarters and may hire effective teams
    again. The hijacking team may also exploit or resell information in the outdated
    computers or attract further corporate attention.
  attribution: All contracts, pursuits and outcomes are conditional gamemaster scenario
    events, not established continuity.
