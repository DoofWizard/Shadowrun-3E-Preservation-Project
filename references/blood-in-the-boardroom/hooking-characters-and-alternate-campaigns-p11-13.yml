data:
  source_context: Published fictional Shadowrun tabletop RPG Blood in the Boardroom,
    FASA Corporation, FASA7327 (1999), original Third Edition-era publication, printed
    pp11–13/PDF11–13; all examples are optional tabletop campaign approaches, not
    established world outcomes.
  hooking_characters:
    small_corporation: Suggested simplest approach is a corporate employer hiring
      runners; internal factions and divided loyalties within a smaller corporation
      expose the characters gradually to the wider megacorporate dispute.
    contacts: 'A character’s business associates, contacts or contacts-of-contacts
      can convey rumors or requests, be affected by events, or serve as opposing viewpoints.
      The source cites Shadowrun Companion: Beyond the Shadows, Contacts and Enemies
      and Friend of a Friend (p63).'
    security: Characters can guard small-company staff or important executives, or
      work for competing corporate clients. The fictional example includes mom-and-pop
      business owners Damien Knight and Arthur Vogel—this is a hypothetical named-character
      setup, not a canonical job.
    personal: Old friends, associates, favors, obligations, and threatened family/contacts
      can draw characters into the corporate story.
  adaptation: Gamemasters may substitute existing campaign organizations and characters
    for published NPCs while preserving overarching corporate-war tracks. Corporate
    conflicts can be background rather than central plot.
  alternate_character_campaigns:
    docwagon: Emergency responders may encounter casualties and threatened employees;
      Platinum DocWagon cards may draw runners into corporate situations. The source
      names the Redmond Barrens suborbital crash in Track 1 (printed p20) as an additional
      fictional event with possible rescue scenarios.
    media: Reporters can investigate competing corporate accounts, expose activities,
      deal with planted information, or cover public events using the chronology (printed
      pp18–19).
    special_forces: Military personnel may be involved only tangentially, through
      infiltration or corporate assignments, with tension between loyalties. These
      are campaign variants, not specific military procedures.
    law_enforcement: Fictional police agencies may investigate competing security-company
      allegations, especially Knight Errant versus Lone Star Quebec. The source depicts
      possible evidence manipulation as storyline conduct, not instructions.
    magic: Magic-focused player characters can investigate fictional corporate magical
      research, shifting alliances, and the position of the free spirit Buttercup
      on Yamatetsu’s board, referencing Track 4 printed p84.
    gangs_pirates: 'Gang and pirate campaigns may use supply, territorial, and factional
      conflicts; the text references Cyberpirates, Underworld Sourcebook, and Track
      4: Out of the East (p81) as further fictional game materials.'
