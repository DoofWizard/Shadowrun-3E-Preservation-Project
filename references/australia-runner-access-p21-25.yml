source_period: "2062"
conditions:
  - "Handguns are treated as more restricted than ordinary long arms; rural sporting and farm uses make some long arms easier to justify."
  - "Automatic-fire weapons draw especially serious legal attention."
  - "Combat-oriented cyberware is generally treated as security-grade equipment."
  - "Computer and communications hardware is comparatively available and inexpensive; ordinary Matrix access costs more than in the UCAS but bandwidth is strong."
  - "Many chemical drugs are decriminalized under controlled supply, while electronic addictive media remain prohibited."
  - "Urban water service is rationed by household allocation and may be shut off after the allocation is exhausted."
