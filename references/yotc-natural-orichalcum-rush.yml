id: reference.yotc.natural-orichalcum-rush
record_type: reference
name: "Natural Orichalcum Rush"
domain: magic
status: ingested
source: source.fanpro-10650
printed_pages: "76-87"
pdf_pages: "77-88"
discovery:
  - "During the 2061-2062 mana upheavals, naturally occurring orichalcum veins are confirmed in multiple parts of the world despite prior orthodoxy that orichalcum could only be created alchemically."
  - "Dunkelzahn Institute of Magical Research publicly confirms a Transvaal/Azania vein in late November 2061."
  - "Wuxing claims geomancy and dragon-line knowledge allow it to locate deposits early and acquires extensive mining rights."
geology_and_magic:
  - "Deposits are reported disproportionately near powerful mana-line junctions, power sites and other unusual mana disturbances."
  - "Parageologists in the source argue that rising background mana may be producing a 'Second Awakening' of minerals/geology."
  - "The duration of naturally occurring deposits is unresolved; some researchers speculate they may disappear as comet-era conditions pass."
processing:
  raw_ore:
    - "Orichalcum occurs mixed with ordinary rock/metal ore and must be extracted through mining."
    - "Ordinary metallurgical separation destroys the orichalcum, reducing it to its component metals."
  usable_material:
    - "Ore must be purified through an alchemical circulation process before use as a radical for artificing."
    - "Natural orichalcum that has been circulated retains some impurities and is described as less potent for artificing than synthetic orichalcum."
economics:
  raw_value: "The chapter states that a single kilogram of raw orichalcum was worth over 1,000,000¥ during the rush."
  consequences:
    - "Corporations, magical groups, governments and private prospectors race to acquire land/mineral rights and secure deposits."
    - "Claim-jumping, sabotage, smuggling and armed security turn some deposits into shadowrun flashpoints."
major_reported_sites:
  - {location: "Antarctica / Transantarctic Mountains", context: "Japanese expedition claim; severe weather and corporate competition."}
  - {location: "Asamando", context: "DeBeers-Omnitech operations produce orichalcum-bearing byproduct; national leverage and prospecting boom."}
  - {location: "Avebury, England", context: "Major ley-line site; Wuxing claim challenged by local/national interests."}
  - {location: "Azania", context: "Diamond/mineral operations and DeBeers-Omnitech/Wuxing competition."}
  - {location: "Aztlan", context: "Aztechnology sponsors digs at archaeological/mana-line sites; details closely controlled."}
  - {location: "Nepal / Himalayas", context: "Mining claims near Wuxing facilities and reports near Mount Everest."}
  - {location: "Peruvian Andes", context: "Traces found near remnant ancient-Incan mineral sites."}
  - {location: "Snowdonia, Wales", context: "Rumored hidden/cultivated deposits in magical caverns."}
  - {location: "Southern UCAS / Cumberland, Kentucky", context: "Deposits near former strip-mine country and CAS border."}
  - {location: "Caucasus / Ukraine", context: "Atlantean Foundation obtains mining rights around archaeological digs."}
  - {location: "Unnamed Pacific volcanic island", context: "Competing Wuxing, DeBeers-Omnitech and Federated-Boeing claims create armed dispute."}
notes:
  - "Claims that Wuxing can reliably 'read' dragon lines to locate deposits are source-period corporate claims and shadowtalk, not independently elevated into a universal rule."
  - "Formal orichalcum/game mechanics, if any, are deferred to the Game Information chapter."
sources:
