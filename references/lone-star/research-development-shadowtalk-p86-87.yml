data:
  publication: {title: Lone Star Sourcebook, publisher: FASA Corporation, catalog: FASA7115, year: 1994, medium: fictional cyberpunk tabletop role-playing game}
  source_anchors:
    - {printed_page: 86, pdf_page: 94, heading: "Research and Development and three department forum comments"}
    - {printed_page: 87, pdf_page: 95, heading: "Top-left concluding Technical Research forum contribution"}
  messages:
    - speaker: Confi
      timestamp: "00:11:21/9-21-54"
      claim: Says Lone Star has only a small Seattle research laboratory and workshop at the local Academy, responding to the narrator's broader description of R&D centers.
      certainty: Local observation reported by a fictional contributor.
    - speaker: Delores
      timestamp: "15:02:37/9-23-54"
      claim: Challenges Confi's characterization of Seattle facilities, alleging that Lone Star's Thunderbolt firearm was developed in Seattle R&D and suggesting additional equipment files.
      certainty: Speaker assertion, not independently verified by the narrator here.
    - speaker: Leiter
      timestamp: "23:12:07/9-8-54"
      claim: Distinguishes the applied psychological work of DivPsych from the Psychological Research Department's more basic, less immediately useful investigations.
      certainty: Participant's contrast; department identities are also separately narrator described.
    - speaker: Featherstone
      timestamp: "06:52:14/9-10-54"
      claim: Disagrees with dismissive views of basic research and argues that major breakthroughs may originate from relatively unconstrained investigation rather than incremental commercial research.
      certainty: Opinion.
    - speaker: Lake Skimmer
      timestamp: "17:14:35/9-20-54"
      claim: Relays Milwaukee rumors that Psychological Research investigates the psychological components of a magician's spellcasting Drain, aiming to reduce adverse consequences of casting high-powered spells.
      certainty: Attributed street rumor, not an established new magical rule or completed invention.
    - speaker: Dobu
      timestamp: "08:13:56/9-22-54"
      claim: Expresses interest in the alleged magical-Drain research.
      certainty: Reaction.
    - speaker: Tarquin
      timestamp: "03:41:15/9-26-54"
      claim: Compares Computer Research to overlapping GridSec work and alleges that GridSec receives a larger research budget for more novel technology, whereas Computer Research focuses on improving established systems.
      certainty: Participant's comparative assessment.
    - speaker: Lanier
      timestamp: "11:35:59/9-28-54"
      claim: Defends steady technical improvement, comparing outdated combustion-engine technology with a newer model.
      certainty: Analogy and opinion.
    - speaker: Mactoo
      timestamp: "21:53:01/9-30-54"
      claim: Reports that Computer Research reverse-engineered Transys Neuronet's fictional expert IC, and claims a prototype reduced system load enough for a node otherwise operating near a Blaster-5-style load to handle expert black IC at an approximate rating of nine or ten with little extra load.
      certainty: Attributed unverified technical allegation; ratings are quoted setting assertions, not a complete SR3 mechanic or independently confirmed benchmark.
    - speaker: Rage
      timestamp: "07:28:43/10-2-54"
      claim: Briefly reacts to the Computer Research allegation.
      certainty: Reaction.
    - speaker: TANSTAAFL
      timestamp: "02:44:37/9-19-54"
      claim: Argues that even a well-funded Lone Star Technical Research department can manufacture only prototypes at scale and must license finished equipment to an outside manufacturer; offers Lone Star's Thunderbolt pistol and Ruger as an example.
      certainty: Claim begins on printed p86 and is signed at the beginning of printed p87; no independent manufacturing contract is established by this forum account alone.
  attribution_rules:
    - The source presents these in-world 2054 comments as a mixed collection of observations, rumors, opinions and allegations, not all as narrator-established facts.
    - Preserve the cross-page TANSTAAFL statement as one contribution, not two.
    - Numbers mentioned in a fictional IC performance anecdote are not a complete tabletop statistic block; do not invent rule conversions.
  cross_record: world/lone-star/research-and-development-division-p86.yml
