  comments:
  - speaker: Cowboy
    timestamp: 12:54:38/9-5-54
    printed_page: 61
    pdf_page: 61
    assertion: Jokes about GridSec arresting or otherwise severely punishing Matrix offenders.
    certainty: darkly comic commentary, not verified policy
  - speaker: Slicer
    timestamp: 03:19:05/9-6-54
    printed_page: 61
    pdf_page: 61
    assertion: Challenges the assertion that GridSec uses portable IC within a cyberdeck.
    certainty: skeptical technical question
  - speaker: FastJack
    timestamp: 00:14:26/9-7-54
    printed_page: 61
    pdf_page: 61
    assertion: Explains an alleged distinction between full IC and smaller combat utilities. Says a standard black-IC biofeedback routine
      alone needs approximately 250 Mp; a complete IC program may need 600 Mp or more; compact combat utilities may require at least
      200 Mp. Lists excluded supporting routines such as sensors, sleaze and analyze.
    certainty: in-world technical claim; Mp figures preserved as quoted-speaker estimates, not canonical build specifications
  - speaker: Slicer
    timestamp: 03:09:17/9-7-54
    printed_page: 61
    pdf_page: 61
    assertion: Asks whether the fictional GridSec utilities may infect datajack firmware or cyberdeck hardware.
    certainty: Question by the same printed speaker Slicer; original-page name rechecked at PDF61.
  - speaker: FastJack
    timestamp: 21:07:48/9-7-54
    printed_page: 61
    pdf_page: 61
    assertion: Alleges that GridSec uses difficult-to-detect persistent software affecting Matrix-connected equipment and warns of disruptive
      effects.
    certainty: speaker allegation, not established real-world instruction
  - speaker: ChrysH
    timestamp: 08:42:00/9-8-54
    printed_page: 61
    pdf_page: 61
    assertion: Rejects the claim that Lone Star itself developed that software and criticizes the suggestion.
    certainty: Unverified attribution dispute; printed name rechecked at PDF61.
  - speaker: DNF
    timestamp: 22:11:58/9-8-54
    printed_page: 62
    pdf_page: 62
    assertion: Asks what is troubling the preceding commenter.
    certainty: speaker reply
  - speaker: Red Wraith
    timestamp: 05:35:48/9-9-54
    printed_page: 62
    pdf_page: 62
    assertion: Dismisses the GridSec combat utilities as inferior to the real threat level implied in prior claims and compares them
      to approximately Level-2 utilities.
    certainty: attributed estimate, not narrator-certified Rating 2
  - speaker: FastJack
    timestamp: 22:57:08/9-10-54
    printed_page: 62
    pdf_page: 62
    assertion: Suggests research improvements may eventually make the disputed Matrix technology more capable.
    certainty: forecast, not printed current mechanics
  - speaker: Space Ranger
    timestamp: 14:20:30/9-9-54
    printed_page: 62
    pdf_page: 62
    assertion: Claims virus programs may also be present inside Lone Star systems.
    certainty: speaker allegation
  - speaker: Vergis
    timestamp: 09:44:34/9-11-54
    printed_page: 62
    pdf_page: 62
    assertion: Speculates that clients might object to undisclosed virus deployments, alleges some programs could mutate, and says the
      corporation conceals them.
    certainty: speaker speculation, not narrator proof of client agreements
  - speaker: Core Tex
    timestamp: 17:26:08/9-17-54
    printed_page: 62
    pdf_page: 62
    assertion: Describes a data worm’s apparent detection signature as hard to distinguish from benign activity.
    certainty: in-world technical opinion
  - speaker: Cracker Bob
    timestamp: 12:26:34/9-13-54
    printed_page: 62
    pdf_page: 62
    assertion: Claims program size changes can indicate a data worm, giving an example utility that was 64 Mp and unexpectedly reads
      64.01 Mp.
    certainty: speaker example; preserve units and values, not an official detection modifier
  - speaker: Switchback
    timestamp: 12:31:37/10-18-54
    printed_page: 62
    pdf_page: 62
    assertion: Offers a personal approach to identifying persistent data-worm traces in program records and asserts that complete removal
      may require replacing or erasing cyberdeck hardware.
    certainty: speaker claim, not universal repair advice
  - speaker: Zig
    timestamp: 03:37:16/10-21-54
    printed_page: 62
    pdf_page: 62
    assertion: Claims there are longer-running worms whose logs permit comparing a decker’s later conduct with earlier incidents.
    certainty: allegation about fictional investigative capability
  - speaker: Rodge
    timestamp: 18:37:28/10-23-54
    printed_page: 62
    pdf_page: 62
    assertion: Warns readers that a GridSec officer might know a surprising amount about a targeted decker.
    certainty: speaker inference
  - speaker: Dingo
    timestamp: 14:52:00/10-25-54
    printed_page: 62
    pdf_page: 62
    assertion: Questions how GridSec could deploy such worms across the Matrix at scale.
    certainty: skeptical question
  - speaker: Rodge
    timestamp: 19:05:10/10-25-54
    printed_page: 63
    pdf_page: 63
    assertion: Speculates that a modified combat utility might spread a data worm to someone in a GridSec engagement; also notes the
      claimed risk to authorized Matrix users.
    certainty: speaker allegation, not official Matrix procedure
  - speaker: Niles
    timestamp: 11:03:55/11-3-54
    printed_page: 63
    pdf_page: 63
    assertion: Claims a looper might trigger even when an affected decker is offline, with severe loss of function.
    certainty: alleged effect, not narrator-established activation rule
  - speaker: Sounder
    timestamp: 15:38:16/10-24-54
    printed_page: 63
    pdf_page: 63
    assertion: Recounts a claimed incident in which Hamilton became trapped in a repeating room illusion and required emergency aid
      and replacement equipment.
    certainty: secondhand anecdote without source confirmation
  - speaker: Zig
    timestamp: 17:56:09/10-25-54
    printed_page: 63
    pdf_page: 63
    assertion: Compares the alleged looper effect to permanent dump shock.
    certainty: speaker interpretation
  - speaker: Fie
    timestamp: 22:17:06/10-25-54
    printed_page: 63
    pdf_page: 63
    assertion: Rejects Zig’s comparison as exaggerated and questions the speaker’s judgment.
    certainty: disagreement
  - speaker: Book
    timestamp: 16:27:01/10-30-54
    printed_page: 63
    pdf_page: 63
    assertion: Explains that the fictional program is named after twentieth-century optical-illusion artist M. C. Escher.
    certainty: in-world educational aside
  - speaker: Core Tex
    timestamp: 00:04:56/10-31-54
    printed_page: 63
    pdf_page: 63
    assertion: First suggests that a looper combat utility is in trial use in several cities, then immediately retracts the claim after
      checking the discussion timeline.
    certainty: explicit self-correction; initial claim NOT established
  - speaker: Rodge
    timestamp: 19:07:01/11-1-54
    printed_page: 63
    pdf_page: 63
    assertion: Claims attack utilities might transfer loopers to targeted users and that legitimate visitors could also be affected.
    certainty: speaker allegation of collateral effects
  - speaker: Fie
    timestamp: 06:56:20/10-30-54
    printed_page: 63
    pdf_page: 63
    assertion: Discusses an unverified expensive hardware countermeasure to the fictional looper and argues about its cost and replacement
      burden.
    certainty: speaker proposal, not established gear rule
  - speaker: Jan
    timestamp: 17:22:08/11-2-54
    printed_page: 63
    pdf_page: 63
    assertion: Asks where to obtain the suggested hardware.
    certainty: speaker question
  - speaker: Fie
    timestamp: 07:13:38/11-3-54
    printed_page: 63
    pdf_page: 63
    assertion: Names UVEPROMs, or UV-Erasable Programmable Read-Only Memory, and claims they cost about 10 percent more than standard
      chips and are available in assorted configurations.
    certainty: 'attributed product/cost assertion: +10% preserved; NOT a canonical purchase price'
