data:
  publication:
    title: Lone Star Sourcebook
    publisher: FASA Corporation
    catalog: FASA7115
    publication_year: 1994
    genre: fictional Shadowrun cyberpunk tabletop role-playing game
    edition: original/Second Edition historical source; no inferred SR3 conversion
  source_anchor:
    printed_pages: 93-95
    pdf_pages: 101-103
    heading: Tissue Archives — attributed discussion
  scope: Fictional 2054 Shadowtalk comments on mandatory collection and possible security,
    surveillance, ritual-magic and employment abuses; these remain assertions, guesses
    or disputes rather than established book-narrator facts.
  speakers:
  - name: Dirk
    timestamp: 10:14:44/9-7-54
    report: Says samples are taken at a medical clinic under observation; a technician
      draws blood and removes a small tissue specimen. Claims surveillance systems
      verify identity and that the transaction is recorded.
  - name: Droog
    timestamp: 16:35:55/9-6-54
    report: Alleges the collection also gives Lone Star leverage over employees through
      material links that could enable ritual magic against a departing employee or
      one who disobeys. This is an in-world suspicion, not the official health rationale.
  - name: Wiz Kid
    timestamp: 06:26:42/9-7-54
    report: Challenges the value of frozen samples as long-lived magical material
      links; asks whether old stored specimens remain usable.
  - name: Quincy
    timestamp: 09:04:43/9-7-54
    report: Claims source-era magical sample-stasis spells may preserve biological
      material and enable prolonged viability; speaks generally, without supplying
      a game-system spell stat or a confirmed company deployment.
  - name: Wiz Kid
    timestamp: 04:38:55/9-8-54
    report: Challenges Quincy’s assertion that preservation could last indefinitely.
  - name: Quincy
    timestamp: 10:15:47/9-8-54
    report: 'Qualifies the claim: suggests a sample-stasis spell lock, describes uncertainty
      about how magic linked to vault architecture would maintain contact with stored
      samples, and reports secondhand accounts of potent magic; does not claim personal
      verification.'
  - name: Arrak
    timestamp: 06:28:33/9-10-54
    report: Says an astral look at one vault suggested large-scale magical protection;
      suspects a complex spell lock but could not identify its mechanism due to other
      possible threats and incomplete observation.
  - name: Mungo Jerry
    timestamp: 06:41:10/9-10-54
    report: Asks how secure the vaults are.
  - name: Lyle
    timestamp: 17:00:51/9-10-54
    report: 'Responds to Mungo Jerry: claims local branch vaults are deep within headquarters
      facilities, with layered access controls and physical and magical defenses,
      and says these systems do not connect directly to the Matrix. Relays hearsay
      about a hermetic circle, watcher spirit or elemental guards. Emphasizes that
      entering or leaving the fictional vault would be difficult; these are in-world
      claims, not instructions for real facilities.'
  - name: Dirk
    timestamp: 10:21:04/9-12-54
    report: Claims, as a purported first-person experience, that an employee’s stored
      sample could be substituted while still employed; advises such a measure in
      the discussion. This is a fictional speaker’s claim, not a confirmed narrator
      fact or real-world recommendation.
  - name: Wolf
    timestamp: 03:52:30/9-17-54
    report: Claims the Milwaukee operation destroyed undercover workers’ samples because
      of feared magical misuse; speculates about using stored samples to test infiltration
      suspicions.
  - name: Lanier
    timestamp: 18:06:08/9-17-54
    report: Questions Wolf’s claim that Lone Star genuinely destroyed those samples.
  - name: Wolf
    timestamp: 02:18:37/9-18-54
    report: Asserts confidence, citing personal continued survival as joking evidence
      while providing no independent verification.
  authority_boundary: Only narrator-identified mandatory collection, flash-frozen
    storage, job consequence and stated medical rationale appear in the separate world_fact
    record. The speakers’ magical/security assertions and proposed actions remain
    disputed fictional commentary, not mechanics or procedures endorsed by this reference.
