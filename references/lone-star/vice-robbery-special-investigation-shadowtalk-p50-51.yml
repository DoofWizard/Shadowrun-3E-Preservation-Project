  messages:
  - speaker: X-Star
    timestamp_as_printed: 06:54:55/9-5-54
    claim: Criticizes stereotypes surrounding Vice officers and observes that investigators who genuinely help vulnerable people may eventually suffer burnout.
    certainty: Speaker's sympathetic opinion, not quantitative personnel data.
  - speaker: Imager
    timestamp_as_printed: 10:21:18/9-7-54
    claim: Responds dismissively to the previous speaker's concern.
    certainty: Brief hostile opinion.
  - speaker: Binky
    timestamp_as_printed: 12:45:54/9-6-54
    claim: Suggests that confiscated stolen property may be auctioned when its rightful owner cannot be found or has died before retrieval.
    certainty: Unverified fictional claim, distinct from narrator-established safekeeping and return policy.
  - speaker: Bonejolt
    timestamp_as_printed: 10:14:41/9-13-54
    claim: Recommends that an in-world runner value Robbery detectives as contacts because their cases may provide information about matters crossing other departments' jurisdictions.
    certainty: Speaker assessment, not narrator-established assistance to runners.
  - speaker: Hangover
    timestamp_as_printed: 13:59:32/9-8-54
    claim: Says temporary contracts handled by Special Investigation differ from ongoing Corporate Security contracts.
    certainty: Speaker affirmation of a narrator-described organizational distinction.
  - speaker: SPD
    timestamp_as_printed: 01:04:14/9-9-54
    claim: Criticizes internal rivalry between Special Investigation and Corporate Security and speculates that corporate managers impede organizational integration to preserve influence.
    certainty: Speaker analysis and speculation about motives, not established policy.
  - speaker: Blue Light
    timestamp_as_printed: 21:42:09/9-19-54
    claim: Offers a sardonic denial that some disputed contract work is actually referred to Corporate Security.
    certainty: Sarcastic in-world comment, not evidence of a specific referral.
  - speaker: Jax
    timestamp_as_printed: 04:17:49/10-15-54
    claim: Alleges that Lone Star deliberately minimizes public attention to one-time private investigations; claims fictional clientele include private individuals, companies and commercial collection services.
    certainty: Attributed commentary about motives and client categories.
  - speaker: Montage
    timestamp_as_printed: 15:37:00/10-23-54
    claim: Relates a secondhand account of an acquaintance who joined an undercover investigation into an illicit BTL chip operation in Jersey. The acquaintance reportedly learned of devices used to record victims' deaths on black-market simsense chips, nicknamed Black Beetles. Montage alleges that the operative reported the lead, subsequently died, and the investigation was shut down; the speaker speculates that a later GridSec black-IC product drew on the same illicit technology.
    certainty: Uncorroborated speaker narrative with a chronology, reported death and inferred corporate connection; neither the alleged technology transfer nor the implication of internal responsibility is narrator-certified.
  attribution_boundary: Distinguish in-world speakers' alleged corruption, secondhand accounts and interpretations from the source narrator's official departmental descriptions. The fictional wrongdoing is not real-world reportage.
