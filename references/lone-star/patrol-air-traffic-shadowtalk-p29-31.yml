data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog_number: FASA7115
    year: 1994
    game_context: Fictional Shadowrun tabletop roleplaying game
    edition_context: Original and Second Edition compatible (historical); no inferred
      SR3 conversion
  source_pages:
  - printed_page: 29
    pdf_page: 29
  - printed_page: 30
    pdf_page: 30
  - printed_page: 31
    pdf_page: 31
  section: Vehicle-computer discussion, Chromed Cops, Air Patrol and Traffic Patrol
  messages:
  - speaker: Argent
    date_time: 14:27:58/10-17-54
    source_pages:
    - 29
    - 30
    report: In fictional Shadowrun Matrix terms, Argent claims a patrol-car cellular
      connection may expose a different route into the precinct network than the LTG
      system access nodes, but warns the car’s surveillance cameras, electronic tracing
      and response drones make this risky and the cellular link is slower. This is
      a dated in-world claim, not a real-world intrusion instruction or a narrator-verified
      exploit.
  - speaker: Toby Tuna
    date_time: 16:02:18/10-17-54
    source_pages:
    - 30
    report: Claims patrol cars are receiving additional internal security systems
      including shock pads and gas, and warns that fictional Matrix intrusions may
      be punished.
  - speaker: Snow White
    date_time: 17:16:00/9-8-54
    source_pages:
    - 30
    report: Claims that when Lone Star pays to surgically repair seriously injured
      officers, its employment contracts purportedly allow the company to install
      additional cyberware during the same operation, sometimes without separately
      consulting an officer who is unaware of that clause. Says some recovering officers
      have augmentations chosen by Lone Star rather than by them, and some transfer
      to the Tactical Division while others return to street patrol. This alleges
      contractual power and possible absence of informed case-specific consent, not
      proof that no agreement was ever signed.
  - speaker: SPD
    date_time: 00:09:46/9-19-54
    source_pages:
    - 30
    report: Claims some Air Patrol recruits initially lack rigger augmentations; Lone
      Star offers medical and insurance discounts and other benefits as incentives
      for augmentation.
  - speaker: Clutch
    date_time: 13:41:58/9-17-54
    source_pages:
    - 30
    report: Asserts that in emergencies the Air Patrol division can procure military-grade
      Wandjina RPVs from CAS military suppliers; unverified procurement claim.
  - speaker: Suddenly Paranoid
    date_time: 00:44:55/9-18-54
    source_pages:
    - 30
    report: Expresses surprise at the alleged Wandjina aircraft.
  - speaker: Clutch
    date_time: 12:31:45/10-15-54
    source_pages:
    - 31
    report: Argues that interference with traffic radar drones can invite penalties;
      opinion about the surveillance/ticketing equipment.
  - speaker: Fie
    date_time: 09:37:20/10-19-54
    source_pages:
    - 31
    report: Counters Clutch’s cavalier framing by saying repeated contact with fixed-speed
      cameras would draw official enforcement.
  - speaker: Diva
    date_time: 15:07:52/10-19-54
    source_pages:
    - 31
    report: Claims radar drones notice most vehicles unless they are unusually stealth-equipped,
      and speculates about encounters with patrols.
  - speaker: Vixen
    date_time: 00:55:29/10-12-54
    source_pages:
    - 31
    report: Claims airborne speed-control drones converge at illegal racing locations,
      rather than only at isolated accident sites.
  - speaker: Gear-Jammer
    date_time: 17:29:40/10-19-54
    source_pages:
    - 31
    report: Distinguishes task-specific airborne radar drone sensors from fixed-radar
      surveillance sensors, as an attributed technical opinion.
  - speaker: Aero
    date_time: 10:20:14/9-10-54
    source_pages:
    - 31
    report: Claims a signal drone can be configured through a physical access interface
      and estimates an original-edition system security rating of Green-3 with Access-4
      IC; this is speaker assessment, not narrator-certified rule.
  - speaker: Ringer
    date_time: 21:19:50/9-15-54
    source_pages:
    - 31
    report: Claims newer signal drones have anti-vandalism shock plates and a trembler
      switch, described in a joking threatening tone.
  - speaker: Turtle
    date_time: 07:39:28/9-4-54
    source_pages:
    - 31
    report: Jokes that the Highway Patrol department is absent from the official index.
  - speaker: SysOp
    date_time: 11:46:09/9-10-54
    source_pages:
    - 31
    report: Explains the original Highway Patrol posting was blank and invites other
      participants to add information.
  - speaker: Switchback
    date_time: 02:47:09/9-14-54
    source_pages:
    - 31
    report: Says highways primarily belong to federal-defense jurisdiction, while
      Lone Star enforcement is city-based; contested by the following printed-page
      discussion.
  continuation: Highway Patrol discussion continues extensively on pages 32–33 and
    remains a separate future record; the p29 vehicle-system conversation is preserved
    with its p30 continuation here.
framing: newsroom_neutral
headline: FASA Corporation Lone Star Sourcebook (FASA7115, 1994), fictional Shadowrun
