summary: Dated fictional Shadowtalk claims separated by speaker, including allegations
  of involuntary augmentation and a non-authoritative Green-3 system estimate. Source
  is a fictional historical Shadowrun RPG publication by FASA Corporation, Lone Star
  Sourcebook FASA7115 (1994), printed pp29-31/PDF29-31; not claims about real-world
  law enforcement.
