  printed_page_6:
    section: Behind the Star
    fictional_narrator: An unnamed in-world Shadowland SysOp introduces an electronic dossier assembled from two anonymous voices with conflicting perspectives on the fictional Lone Star corporation.
    document_presentation: The SysOp says the acquired contributions are presented without editing of their original words and invites in-world comments; this is a claim by the fictional narrator, not independent verification of reliability.
    proposed_voice_one: The SysOp provisionally labels the first contributor Tarnished Badge, describing a possibly alienated former Lone Star officer with access to the company's hierarchy; their discharge and motive for disclosure are expressly conjectures, not established biographical facts.
    proposed_voice_two: The SysOp labels the other contributor Muckraker and speculates that this writer may be a journalist who researched Lone Star, compared notes with Tarnished Badge, and circulated the resulting material through Shadowland; professional identity is not confirmed.
    regional_limit: The SysOp warns that the two unnamed writers appear to be from outside Seattle and that descriptions of company-wide practice may not apply to Seattle's local fictional police operations; the narrator urges independent local checking rather than treating their dossier as authoritative.
  printed_page_7:
    format: Full-page fictional police-themed illustration with multiple stylized figures, five-pointed stars, and police-line imagery; no legible game-stat table or independent source assertions are printed on this page.
    identification_limit: The art alone does not identify its depicted figures as named canon characters or establish biographical facts.
