  scope: In-world 2054 Shadowland commentary only, not confirmed law or historical real-world practice.
    All source voices on this printed page are separate from a book-narrator claim.
  comments:
  - speaker: Knowbot
    timestamp: 15:42:56/11-12-54
    context: Continuation of earlier p103 debate
    claim: Responds sarcastically to the preceding incarceration account without adding an independent
      procedural fact.
  - speaker: Hizzoner
    timestamp: 12:06:18/11-13-54
    section: The Evidence
    claim: 'Asserts that Lone Star secures most seized possessions as evidence and turns them over
      to a federal agency with the accused on trial day. Says restricted gear may be seized regardless
      of direct relation to an alleged crime; firearms, weapons and much cyberware are traced to
      their origin. Describes prospective liability for possession of stolen goods if an acquisition
      chain is irregular and asserts most gear is destroyed. Distinguishes magical equipment: generally
      destroyed because its production is not controlled under the alleged laws, but preserved until
      trial when it is itself evidence.'
  - speaker: Weasel
    timestamp: 18:40:53/11-14-54
    section: The Evidence
    claim: 'Contradicts the official disposal account: says restricted property that is not evidence
      is officially destroyed, but alleges officers instead appropriate items from inventory, and
      magical gear may be diverted to the Division of Paranormal Investigation. These alleged diversions
      are not narrator-established events.'
  - speaker: Ape
    timestamp: 23:47:52/11-14-54
    claim: Jokes about MEGO and losing interest in the lengthy explanation; no operational assertion.
  - speaker: Twinky
    timestamp: 04:25:25/11-15-54
    claim: Asks what MEGO means.
  - speaker: Tox
    timestamp: 09:02:54/11-15-54
    claim: Expands MEGO as My Eyes Glaze Over, disputes the idea that an outsider could profitably
      take property from a Lone Star headquarters vault, portrays headquarters as densely occupied
      by armed and dangerous Lone Star personnel, and warns that attempted theft would carry fatal
      and/or significant financial consequences. This is a rhetorical risk claim, not a sourcebook
      game modifier.
  - speaker: Hizzoner
    timestamp: 12:59:09/11-16-54
    section: Your Trial
    claim: Claims that Lone Star transfers the accused to the state for trial and that defendants
      generally must finance their own defense counsel.
  - speaker: Papillon
    timestamp: 13:09:13/11-16-54
    section: Doin’ the Time
    claim: Says a court may release or sentence defendants and that Lone Star then uses holding facilities
      but does not itself run long-term incarceration in this stated period. Describes federal or
      corporate-owned prisons, government placement with privately controlled custody, and uncertainty
      over whether a sentence is enforced exactly. Alleges abusive research involving detainees,
      and recounts an in-world Renraku-owned prison reality game show named Blood Alley, with forced
      lethal contests and entertainment prizes. Distinguishes accusations and hearsay from narrator
      facts.
  - speaker: Marcus
    timestamp: 15:22:34/11-18-54
    claim: Recalls Blood Alley and says pirate television operators circulated weekly program summaries
      or episodes. Does not independently establish the alleged program’s factual status.
  - speaker: Dirk
    timestamp: 23:06:11/11-19-54
    claim: Claims Lone Star was beginning to enter the long-term incarceration business by contracting
      to operate government facilities, referencing the earlier Penology discussion.
  - speaker: Crystale
    timestamp: 07:10:41/11-20-54
    claim: Argues that federal incarceration and law-enforcement powers should be kept separate,
      especially where an enforcement agency has corporate extraterritorial status.
  - speaker: Lister
    timestamp: 18:26:42/11-20-54
    claim: Responds to Crystale by dismissing the practical effectiveness of idealistic separation
      arguments.
