data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog_number: FASA7115
    year: 1994
    game: Shadowrun
    edition: original and Second Edition compatible historical source
    fiction_status: fictional cyberpunk tabletop RPG sourcebook; 2054 speakers are invented-world
      commentary
  topic: Lone Star irregular assets and outside contractors
  source_anchors:
  - printed_page: 43
    pdf_page: 43
    heading: Irregular Assets inline Shadowtalk
  - printed_page: 44
    pdf_page: 44
    heading: Irregular Assets Shadowtalk continued before Division of Investigation
  messages:
  - speaker: Papa
    timestamp_as_printed: 11:23:00/9-9-54
    printed_page: 43
    pdf_page: 43
    reported_claim: States that some freelance hunters also accept assignments from other customers,
      while certain employers prefer negotiations through a fixer; claims Lone Star can sometimes
      engage specific contractors indirectly.
    certainty: speaker account, not a universal contract rule
  - speaker: Fish
    timestamp_as_printed: 13:30:05/9-7-54
    printed_page: 43
    pdf_page: 43
    reported_claim: Complains about allegedly poor Lone Star pay; illustrates with an approximately
      1,000-nuyen bounty that pays quickly only if the subject is located immediately, but may cost
      more than it earns if the search lasts months. Says expenses are closely scrutinized and unsuccessful
      contractors risk reputational harm.
    certainty: speaker criticism and example, not narrator-confirmed salary survey
  - speaker: Fish
    timestamp_as_printed: 13:31:07/9-7-54
    printed_page: 43
    pdf_page: 43
    reported_claim: Claims a dead-or-alive contract makes killing the target easier than capturing
      that person alive, with a disparaging characterization of the risk.
    certainty: in-world violent preference alleged by a speaker; not advice
  - speaker: Oz
    timestamp_as_printed: 20:42:08/9-8-54
    printed_page: 43
    pdf_page: 43
    reported_claim: Asks rhetorically whether a Lone Star representative would openly commission
      a murder while claiming another subject should be eliminated.
    certainty: rhetorical question, not narrator evidence of a specific commission
  - speaker: Papa
    timestamp_as_printed: 11:25:44/9-9-54
    printed_page: 43
    pdf_page: 43
    reported_claim: Clarifies that Papa refuses contract killings personally, but suggests some flat-fee
      contractors take such work and that a corporation may disclaim intent while benefiting from
      a lethal result.
    certainty: individual denial and speculative allegation; preserves refusal versus alleged conduct
  - speaker: Mosh
    timestamp_as_printed: 03:01:29/9-10-54
    printed_page: 44
    pdf_page: 44
    reported_claim: Says contracting practices vary across city offices; contractors known in one
      city may not be favored by another, which Mosh attributes to inter-office rivalry and local
      exclusivity.
    certainty: speaker observation and interpretation
  - speaker: Laguna Gloria
    timestamp_as_printed: 01:07:39/9-11-54
    printed_page: 44
    pdf_page: 44
    reported_claim: 'Relates a supposedly apocryphal Austin bounty-hunter incident: a contractor
      sent after an ork fugitive named Chumley returned with the wrong man and learned that his captured
      subject was a different ork; treats the story as a cautionary anecdote, not proven history.'
    certainty: speaker explicitly describes the anecdote as apocryphal
  - speaker: Argent
    timestamp_as_printed: 11:17:30/9-6-54
    printed_page: 44
    pdf_page: 44
    reported_claim: Tells interested participants to contact their local Tactical Division if they
      want work with the fictional corporation.
    certainty: speaker suggestion, not operational guidance from narrator
  - speaker: The Machine
    timestamp_as_printed: 18:24:01/9-6-54
    printed_page: 44
    pdf_page: 44
    reported_claim: Objects that the discussion participants are shadowrunners rather than bounty
      hunters.
    certainty: speaker identity claim
  - speaker: On the Edge
    timestamp_as_printed: 02:31:19/9-7-54
    printed_page: 44
    pdf_page: 44
    reported_claim: Questions the purported distinction between shadowrunners and bounty hunters.
    certainty: speaker rhetorical challenge
  - speaker: Argent
    timestamp_as_printed: 10:32:19/9-7-54
    printed_page: 44
    pdf_page: 44
    reported_claim: Responds that shadowrunners are more flexible than the best bounty hunters and
      may therefore be more useful to Lone Star.
    certainty: speaker judgment, not narrator-certified ranking
  - speaker: Mary Contrary
    timestamp_as_printed: 14:51:21/9-8-54
    printed_page: 44
    pdf_page: 44
    reported_claim: Expresses disbelief that Lone Star would hire shadowrunners, characterizing the
      corporation as an opponent of their profession.
    certainty: speaker skepticism
  - speaker: Wolf
    timestamp_as_printed: 02:38:25/9-9-54
    printed_page: 44
    pdf_page: 44
    reported_claim: Argues that Lone Star can hire deniable contractors for tasks it does not want
      linked to itself, and describes those workers as expendable.
    certainty: unverified attributed allegation and opinion about corporate incentives
  - speaker: Hiroaki
    timestamp_as_printed: 05:23:27/9-11-54
    printed_page: 44
    pdf_page: 44
    reported_claim: Claims the rivalry between Lone Star and Knight Errant sometimes escalates into
      dirty-tricks competition.
    certainty: speaker claim, not established corporate incident
  - speaker: Dodd
    timestamp_as_printed: 18:05:39/9-11-54
    printed_page: 44
    pdf_page: 44
    reported_claim: Replies that corporate competition is routine regardless of business line.
    certainty: speaker generalization
  authority_boundary: Each entry is a dated statement by a named fictional forum participant. The
    sourcebook narrator separately establishes the contractor network and compensation structure
    on p43. Participants disagree, speculate and tell apocryphal stories; speaker claims are not
    independently established corporate policies, crimes or real-world allegations.
framing: newsroom_neutral
headline: Fictional Shadowrun irregular-assets commentary — FASA Corporation Lone Star Sourcebook
  FASA7115 (1994), original/Second Edition, printed pp43-44/PDF43-44
summary: Fifteen dated in-world speaker contributions discuss fictional contractor payment, cross-city
  competition, professional boundaries, lethal allegations and an expressly apocryphal Austin anecdote;
  separate from narrator facts and any real-world advice.
