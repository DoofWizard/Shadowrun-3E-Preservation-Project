  - {printed_page: 49, pdf_page: 49, heading: Post-mortem changes and Bullet Entry Wounds}
  - {printed_page: 50, pdf_page: 50, heading: Bullet Entry Wounds continuation}
  time_of_death_exposition:
    distinction: The source distinguishes a legal time of death, when a body was found, from an estimated actual time of death; it describes environmental markers and post-mortem changes as approximate indicators.
    conditions: The text cautions that ambient temperature, exertion before death, body composition and other circumstances affect the timing and appearance of changes.
    temperature_change_claim: The historical source gives an approximate post-mortem cooling rate of 0.85 degrees Celsius or 1.5 degrees Fahrenheit per hour; this is an in-book estimate, not a verified modern forensic constant.
    approximate_observation_windows_as_printed:
    - {interval: around 30 minutes, source_description: skin waxy-grey, with lips and nails pale}
    - {interval: 30 minutes to four hours, source_description: pooling of blood described as non-fixed lividity, with position-dependent changes}
    - {interval: four to six hours, source_description: early rigor mortis involving face, neck and jaw muscles, subject to individual variation}
    - {interval: six to eight hours, source_description: stiffness extending to larger muscles and lividity becoming fixed}
    - {interval: eight to twelve hours, source_description: body described as completely stiff}
    - {interval: eighteen to twenty-four hours, source_description: body described as cold and clammy, with rigor beginning to diminish}
    - {interval: beyond twenty-four hours, source_description: body approaches surrounding temperature, discoloration and decomposition progress}
    - {interval: after three weeks, source_description: advanced decomposition with skin and hair changes}
    - {interval: about three and one half weeks to two months, source_description: the book contrasts tropical and colder environments for further decomposition}
    fictional_magic_context: The source mentions magical spells among many causes that may affect the timing of rigor through extreme physical exertion; this is an invented-world claim, not proof of magic.
  ballistic_forensics_exposition:
    source_topic: The historical book discusses the appearance of firearm entry wounds, residues, muzzle proximity and exit-wound formation.
    illustrative_distance_claims:
    - {condition: direct muzzle contact, source_description: star-shaped wound in the printed narrative}
    - {condition: less than 2 centimeters, source_description: nearby heat may create a rim burn}
    - {condition: within 6 centimeters, source_description: surface soot or residue may be present}
    - {condition: around 10 to 18 centimeters, source_description: powder stippling or tattooing is described}
    - {condition: greater than 50 centimeters, source_description: text claims no gunpowder or soot reaches the target}
    velocity_range_as_printed: The source gives a broad illustrative bullet-speed range from 200 to 1,700 meters per second, with shots above 1,000 meters per second described as hypervelocity.
    ammunition_comparisons_as_printed:
    - Hollow-point and semi-jacketed rounds deform and distribute energy differently than other bullet types in the source description.
    - Full-metal-jacket and Teflon-coated rounds are described as more penetrating and more likely to make exit wounds, with less energy left in a target under the book's stated comparison.
    - The narrator relates wound appearance to ammunition type, projectile diameter, velocity and target conditions, without introducing dice rules or a Shadowrun weapon-stat table.
  fidelity_boundary:
    source_type: This is non-mechanical historical prose from a fictional role-playing sourcebook, not a clinical manual or real-world ballistics guidance.
    significance: Preserve the original numeric source assertions for archival comparison without converting them into present-day scientific recommendations.
    separate_forum: Attributed comments by Rest, Gunhead, Blocher and Sidewinder on p50 are captured separately.
