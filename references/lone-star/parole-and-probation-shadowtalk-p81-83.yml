data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog_number: FASA7115
    publication_year: 1994
    edition: Historical original/Second Edition Shadowrun tabletop role-playing fiction
    forum_setting: Dated in-world 2054 Shadowtalk
  source_anchors:
    - {printed_page: 81, pdf_page: 89, section: Department of Parole and Probation; Probation and Parole}
    - {printed_page: 82, pdf_page: 90, section: Continued parole commentary}
    - {printed_page: 83, pdf_page: 91, section: Concluding simulations commentary; before False Arrest Suits}
  attributed_claims:
    - speaker: Inca
      timestamp: 15:25:47/9-9-54
      page: 81
      assertion: Claims UCAS courts' expansion of probation is limited to nonviolent offenses, contrasting with the broad narrator formulation.
      certainty: Jurisdiction-specific fictional speaker correction.
    - speaker: Tico
      timestamp: 08:14:57/9-7-54
      page: 81
      assertion: Sarcastically dismisses the suggestion that everyone on probation answers officers truthfully.
      certainty: Joke and disputed generalization.
    - speaker: Dara
      timestamp: 01:28:59/9-9-54
      page: 81
      assertion: Claims probation officers may investigate suspected dishonesty and seek revocation, not merely accept routine statements.
      certainty: In-world claim about practice, not confirmed narrator procedure.
    - speaker: Coatl
      timestamp: 15:04:00/9-6-54
      page: 81
      assertion: Warns that corporate employment of probation officers may enable abuse of discretionary supervision powers.
      certainty: Critical speaker opinion.
    - speaker: Sydney
      timestamp: 06:21:26/9-7-54
      page: 81
      assertion: Challenges Coatl to specify the possible abuse.
      certainty: Skeptical question.
    - speaker: Coatl
      timestamp: 15:39:53/9-7-54
      page: 81
      assertion: Invites Sydney to consider examples without claiming a specific verified incident.
      certainty: Rhetorical reply.
    - speaker: Amburst
      timestamp: 11:04:21/9-9-54
      page: 81
      assertion: Says some municipalities, including Seattle, retain government probation/parole employees while purchasing limited supplementary Lone Star services.
      certainty: Speaker's jurisdictional qualification, not universal narrator assertion.
    - speaker: Carson
      timestamp: 03:54:43/9-8-54
      page: 81
      assertion: Deplores early parole releases attributed to overcrowding, describing some released prisoners as dangerous.
      certainty: Opinion.
    - speaker: The Screaming Bastard
      timestamp: 02:44:57/9-13-54
      page: 81
      assertion: Asks whether a fictional parolee crossing into Renraku corporate territory thereby violates conditions not to leave a granting jurisdiction.
      certainty: Hypothetical question, not a confirmed legal outcome.
    - speaker: Legal Beagle
      timestamp: 21:48:21/9-22-54
      page: 82
      assertion: Says parolees may violate UCAS jurisdictional travel restrictions by entering Renraku's extraterritorial Arcology; describes possible corporate noncooperation with extradition and the risk of hostile private enforcement.
      certainty: In-world legal interpretation and contingency, not an instruction to evade supervision.
    - speaker: Hardcastle
      timestamp: 15:26:00/9-23-54
      page: 82
      assertion: Rejects the assumption that corporate parole officers operate under ordinary police limitations and alleges broader coercive supervision authority.
      certainty: Unverified in-world claim, not actual law.
    - speaker: Tictoc
      timestamp: 19:46:15/9-25-54
      page: 82
      assertion: Alleges corporate parole officers may enter homes and surveil supervisees without standard police warrants; treats these claims as troubling.
      certainty: Speaker accusation not corroborated by narrator.
    - speaker: Cindi
      timestamp: 16:48:00/9-30-54
      page: 82
      assertion: Claims firsthand work as a former justice-system parole agent now with Lone Star, describes an intrusive and confrontational personal monitoring style, and prefers the corporation's equipment and pay.
      certainty: First-person in-world testimony, not company-wide policy.
    - speaker: Yuriko
      timestamp: 04:14:52/10-2-54
      page: 82
      assertion: Warns that the power to revoke parole may be abused by corrupt officers who coerce supervised people into further offenses.
      certainty: Concern and anecdotal generalization.
    - speaker: Detached Observer
      timestamp: 19:17:58/10-4-54
      page: 82
      assertion: Claims that after a year on parole eight percent evade one way or another and only sixteen percent satisfy parole conditions, while the rest die or return to prison.
      certainty: Source-era unverified in-world statistic, not real-world data.
    - speaker: Meg
      timestamp: 17:56:52/10-13-54
      page: 82
      assertion: Alleges the Gray Men of fictional DivPsych developed coercive simulated incarceration and parole, with simulated hearings and release used to steer subjects' behavior.
      certainty: Conspiracy-like in-world allegation, not independent evidence or established narrator technology.
    - speaker: The Other Guy
      timestamp: 20:33:01/10-14-54
      page: 83
      assertion: Suggests the hypothetical simulated-parole system is another Renraku innovation and implies corporate involvement.
      certainty: Sarcastic conjecture.
    - speaker: RAS Master
      timestamp: 00:59:12/10-14-54
      page: 83
      assertion: Denies the hypothetical simulated-parole sequence could function as described.
      certainty: Direct dissenting opinion.
    - speaker: Featherstone
      timestamp: 12:05:47/10-15-54
      page: 83
      assertion: Disputes RAS Master's dismissal, speculates about BTL-like simulated sequences and subconscious manipulation, and condemns involuntary experiential coercion as destructive.
      certainty: Technological and ethical speculation, not narrator-confirmed procedure.
    - speaker: Sneakthief
      timestamp: 09:34:21/10-16-54
      page: 83
      assertion: Says an alleged earlier encounter with Lone Star left the speaker fearful that ordinary surroundings might be simulated; explicitly uncertain.
      certainty: Anecdote and personal uncertainty, not proof of the rumored program.
  section_boundary:
    end: The False Arrest Suits heading on printed p83 begins a distinct narrator section and is not included in these parole claims.
    rule: Do not promote speaker speculation about corporate extradition, powers, simulated mind control or disputed statistics into historical game mechanics.
headline: >-
