  introduction_source_scope:
    setting_subject: The book's narrator describes the fictional Lone Star corporation from its beginnings in Austin, Texas, to its contemporary dominance of law enforcement in North America.
    book_contents: The introduction promises fictional organizational history, procedures, manpower, and equipment, as well as game statistics for weapons, computer programs, vehicles, and contacts specific to Lone Star.
    historical_rules_compatibility: The printed introduction explicitly states that the book works with both original and second-edition Shadowrun rules; it does not claim a Third Edition conversion.
  source_criticism:
    in_world_format: The book is presented as an electronic document from the fictional Shadowrun world.
    comments: In-world reader comments may correct, expand, corroborate, or contradict the source text, and the introduction explicitly cautions that such comments cannot be assumed truthful, accurate, considered, or well reasoned.
    original_information: The introduction describes multiple edited fictional source streams, including Lone Star manuals, retired patrol officers, police discussion groups, and observers, with possible editorial biases.
    game_master_discretion: The real-world introduction assigns final judgment about the source's accuracy to individual gamemasters and encourages adapting the fictional corporation to each gaming group's needs.
