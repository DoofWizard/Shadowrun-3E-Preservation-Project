data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog_number: FASA7115
    publication_year: 1994
    franchise: Shadowrun
    setting_type: fictional cyberpunk tabletop role-playing game
    edition: historical original/Second Edition material; no automatic Third Edition
      supersession
  source_anchors:
  - printed_page: 74
    pdf_page: 74
    section: MENTAL TECHNIQUES — Orwell opening remarks
  - printed_page: 75
    pdf_page: 75
    section: Pavlov, Neuron Surfer and the start of Shock Doc commentary
  - printed_page: 76
    pdf_page: 76
    section: continued psychological rehabilitation debate
  comments:
  - speaker: Orwell
    timestamp_as_printed: 00:37:26/9-17-54
    printed_pages: '74'
    pdf_pages: '74'
    assertion: Criticizes Lone Star’s purported collaboration with UCAS/CAS prisons
      on rehabilitation experiments, says the R&D and Division of Psychology teams
      may use extended simsense conditioning on inmates, and alleges a severe infringement
      of prisoners’ mental autonomy.
    certainty: First-person editorial-allegation post, not independently established
      official policy.
  - speaker: Pavlov
    timestamp_as_printed: 13:16:23/9-18-54
    printed_pages: 74-75
    pdf_pages: 74-75
    assertion: Claims some prisoners face coerced participation in experimental rehabilitation
      despite official volunteer language, through pressure or threatened solitary
      confinement; says details are concealed and describes ASIST/simsense aversive
      conditioning as a theoretical behavioral intervention.
    certainty: Source character describes nonconsensual pressure and gives an illustrative
      hypothesis; not evidence it works.
  - speaker: Neuron Surfer
    timestamp_as_printed: 00:14:20/9-19-54
    printed_pages: '75'
    pdf_pages: '75'
    assertion: Claims manipulation of simsense signals and track-looping might intensify
      neurological effects, including involuntary flashbacks.
    certainty: Secondhand speculation and warning rather than a clinical finding.
  - speaker: Shock Doc
    timestamp_as_printed: 09:36:55/9-19-54
    printed_pages: 75-76
    pdf_pages: 75-76
    assertion: Cites supposedly suppressed evidence linking looped simsense conditioning
      to anxiety, paranoia and other psychiatric harms; explicitly says understanding
      of the mind and these effects remains insufficient.
    certainty: Speaker alleges suppression; uncertainty is explicit.
  - speaker: Featherstone
    timestamp_as_printed: 13:45:56/9-19-54
    printed_pages: '76'
    pdf_pages: '76'
    assertion: Expresses alarm at the possibility that such conditioning is occurring
      in Seattle and invokes a fictional dystopian comparison.
    certainty: Alarmed question; not independent confirmation.
  - speaker: Marat
    timestamp_as_printed: 18:50:39/9-19-54
    printed_pages: '76'
    pdf_pages: '76'
    assertion: Calls the alleged conditioning cruel, psychologically torturous, unconstitutional
      and contrary to social values.
    certainty: Normative opinion of an in-world speaker.
  - speaker: Featherstone
    timestamp_as_printed: 12:06:34/9-20-54
    printed_pages: '76'
    pdf_pages: '76'
    assertion: Argues that conditioning against all violence can leave former inmates
      unable to defend themselves from attacks and may provoke extreme incapacitating
      reactions.
    certainty: Speaker’s speculative harm analysis, not measured outcomes.
  - speaker: Gordon
    timestamp_as_printed: 15:48:40/9-20-54
    printed_pages: '76'
    pdf_pages: '76'
    assertion: Claims the corporation may be considering narrower conditionings against
      specific violent acts rather than all violence.
    certainty: Hearsay; distinction between the proposals is maintained.
  - speaker: Shock Doc
    timestamp_as_printed: 20:00:02/9-20-54
    printed_pages: '76'
    pdf_pages: '76'
    assertion: Disputes Gordon’s optimism, argues specific-object aversions may generalize
      unpredictably to innocent uses of tools, fears induced psychosis, and predicts
      the corporation will continue regardless.
    certainty: Critical professional-style speaker assessment, not verified clinical
      science.
  central_consent_distinction: Orwell and Pavlov describe arrangements labeled voluntary
    by authorities while alleging that prison officials pressure or punish prisoners
    who decline; the record does not recast coerced compliance as free informed consent.
  epistemic_limit: The printed discussion mixes allegations, hypotheticals, strong
    personal criticism and unknown clinical outcomes; these are fictional source-era
    voices, not real-world therapeutic instructions or established game mechanics.
  later_debate: references/lone-star/brainlock-shadowtalk-and-controversy-p76-78.yml
  source_fidelity_details_restored_from_original_pages:
  - speaker: Orwell
    printed_page: 74
    pdf_page: 74
    independently_reviewed_assertion: The fictional commentator says Lone Star's
      R&D and Psychology teams work with UCAS and CAS penal agencies on conditioning
      before release, describes lengthy simsense exposure, and alleges government
      access to prisoners' minds violates their rights. The speaker admits limited
      knowledge of the programs and does not identify an established outcome.
    epistemic_status: Source-attributed allegation and acknowledged uncertainty.
  - speaker: Pavlov
    printed_pages: [74, 75]
    pdf_pages: [74, 75]
    independently_reviewed_assertion: Distinguishes earlier penal drug-trial
      arrangements offering possible sentence reductions from the allegedly coercive
      Lone Star program. The speaker says authorities choose prisoners who might
      benefit, withhold experimental details, invoke an official volunteer label,
      and threaten solitary confinement for refusing. The illustrative episode
      involves an incarcerated person striking a prison employee with a bat and
      a speculative simsense scenario intended to associate assault with distress;
      it is not evidence that a particular prisoner underwent such treatment.
    epistemic_status: Participant allegation and hypothetical illustration, not an
      established policy, consent record or clinical result.
  - speaker: Neuron Surfer
    printed_page: 75
    pdf_page: 75
    independently_reviewed_assertion: Speculates about adjusting delta-phi values
      in simsense playback and looping selected experience tracks, suggesting
      uncontrolled flashbacks could result; no measured effects or Shadowrun
      game-stat procedure appears in the post.
    epistemic_status: Fictional participant's technical speculation and caution.
  - speaker: Shock Doc
    printed_pages: [75, 76]
    pdf_pages: [75, 76]
    independently_reviewed_assertion: Claims trade journals selectively publicize
      conditioning successes while underreporting failures, asserts that repeated
      exposure may generalize into reactions to nearby violence or ordinary cues,
      and describes fugue-like incapacitation lasting minutes or hours along with
      potential phobic or paranoid symptoms. The speaker stresses that experiments
      are necessary to distinguish theory from outcomes and that the mind remains
      poorly understood. These are allegations and speculative effects, not
      independently established clinical findings.
    epistemic_status: In-world professional-style assertion, speculation and
      explicit acknowledgment of unknown outcomes.
  - speaker: Shock Doc
    printed_page: 76
    pdf_page: 76
    independently_reviewed_assertion: In reply to Gordon's proposal to condition
      only specific assaults, questions whether a person could distinguish
      self-defense from prohibited violence or harmless use of an everyday
      cutting tool from its use as a weapon, and expresses concern about induced
      psychosis. The objections are predictions, not measured results.
    epistemic_status: Named speaker's objections and predictions; no official rule.
headline: Fictional Shadowrun simsense rehabilitation allegations — FASA Lone Star
