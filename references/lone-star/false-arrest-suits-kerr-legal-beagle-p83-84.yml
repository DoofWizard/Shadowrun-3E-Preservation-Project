data:
  publication:
    title: Lone Star Sourcebook
    publisher: FASA Corporation
    catalog: FASA7115
    year: 1994
    setting: Fictional cyberpunk tabletop role-playing game, historical original/Second Edition
  source_anchors:
    - {printed_page: 83, pdf_page: 91, heading: "Signed Shadowland article: FALSE ARREST SUITS begins"}
    - {printed_page: 84, pdf_page: 92, heading: "FALSE ARREST SUITS continued and second forum response"}
  principal_article:
    speaker: Kerr
    signed_at: "10:37:22/10-24-54"
    attribution: Article heading begins with a Shadowland post marker on printed p83; the long article closes with Kerr's signature on printed p84. Its account must not be promoted into unqualified narrator facts or real-world legal doctrine.
    claims:
      - In the fictional jurisdictions described, a court can issue an arrest warrant after a probable-cause finding, grand-jury indictment, or parole/probation violation; a warrant identifies the allegation and may be served by an authorized officer or court appointee.
      - Kerr distinguishes liability for a court-issued warrant from liability for allegedly wrongful warrantless arrests. Kerr says police may apprehend a person during an observed offense or where there is reason to believe the person committed an offense; the article also describes civilian citizen's arrests.
      - Kerr says an acquitted accused person may seek a false-arrest claim against an officer or civilian who detained them, including claims for damaged reputation and emotional harm, with possible punitive damages. Kerr reports having heard of fictional awards reaching 100000 nuyen or more; no individual case is verified.
      - Kerr depicts Lone Star Academy as teaching proper arrest procedure, and describes both frequent dismissal of suits and a well-funded corporate legal defense. The author's judgments about most officers' professionalism, claim success, and superior legal representation are commentary, not source-certified statistics.
    time_boundary: The article describes Shadowrun's in-universe law and corporate practice as argued by Kerr in 2054, not a present-day law guide.
  followup:
    speaker: Legal Beagle
    signed_at: "07:29:06/10-25-54"
    claim: Argues that Lone Star resists false-arrest lawsuits more aggressively than municipal police because a loss could damage the company's reputation and future jurisdictional contracts, with business consequences exceeding an individual award.
    certainty: Attributed fictional legal/business assessment, not a verified corporate directive.
  exclusions:
    - No numeric Shadowrun dice tests, TNs or direct legal adjudication procedure are printed in this passage.
    - The previous parole-simtech conversation at the top of printed p83 belongs to the existing Parole and Probation forum record.
  provenance_rule: Preserve the 2054 speakers and separate claims from narrator-established facts and modern legal advice.
headline: "Fictional Shadowrun false-arrest dispute by Kerr and Legal Beagle — FASA Corporation Lone Star Sourcebook (FASA7115, 1994), original/Second Edition, printed pp83–84/PDF91–92"
