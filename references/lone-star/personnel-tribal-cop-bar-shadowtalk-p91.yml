    heading: Personnel demographics continuation and police socializing commentary
  scope: Separate 2054 in-world forum commentary continuing the p90 demographic debate;
    not the narrator’s Recruiting and Training history.
  speakers:
  - name: Billy Jack
    timestamp: 10:14:43/9-15-54
    report: 'Responds to a prior question on tribal background: offers an estimate
      of about five percent American Indian descent among street officers and ten
      percent among office personnel, claiming almost none in top management; distinguishes
      ancestry from active tribal affiliation and argues committed tribal residents
      would be unlikely to move to the city and join Lone Star. These are his estimates
      and interpretation, not source-census percentages.'
  - name: Janus
    timestamp: 11:46:47/9-27-54
    report: Describes the fictional "cop bar" phenomenon, distinguishing officers,
      civilians, would-be officers and groupies; says such establishments display
      memorabilia and are politically conservative, socially difficult for outsiders
      but may yield information to someone able to blend in. Names Mulroney’s on Western
      Avenue under the viaduct as an unsuccessful Irish-pub recreation and The Edge
      on First Avenue South near Brougham as a favored local watering hole.
  - name: Baxter
    timestamp: 14:29:08/9-27-54
    report: Jokes that an RPG activity is occurring near the discussion, without providing
      reliable event evidence.
  - name: Snap
    timestamp: 06:42:15/9-28-54
    report: Replies to Baxter with a dismissive remark about the inevitability of
      such participants.
  source_authority: Named fictional discussion only; never convert ancestry guesses,
    bar characterizations or named venue anecdotes into established demographic facts.
