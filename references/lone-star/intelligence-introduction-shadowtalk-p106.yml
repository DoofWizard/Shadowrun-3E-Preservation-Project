  - speaker: Gorgon
    timestamp: 10:16:09/9-13-54
    claim: Sarcastically says the narrator’s observation about police intelligence is obvious.
  - speaker: Wirefox
    timestamp: 18:27:46/9-13-54
    claim: Disputes the assertion of obviousness by invoking misleading media depictions of investigations.
  - speaker: X-Star
    timestamp: 21:30:00/9-21-54
    claim: Alleges Lone Star’s public reputation motivates it to obscure unresolved crimes. The speaker
      argues management moves older investigations away from active teams and formally assigns them
      to investigators long retired but whose names remain on the rolls, so public cold-case lists
      misleadingly show a named investigator. Treat as X-Star’s allegation, not narrator-confirmed
      staffing policy.
  claims_are_fictional: All posts are attributed 2054 Shadowland discussion from the tabletop source
    and are not corroborated investigative findings.
