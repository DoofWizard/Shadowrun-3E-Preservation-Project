  section: Department of Highway Patrol — in-world Shadowtalk only
  preceding_record: references/lone-star/patrol-air-traffic-shadowtalk-p29-31.yml
  messages:
  - speaker: Jackie S.
    timestamp: 00:56:37/9-15-54
    printed_page: 32
    assertion: Reports having been identified by highway patrol while traveling Interstate
      5, and says officers appeared to check for her specifically.
    certainty: Speaker's first-person anecdote, not independently established.
  - speaker: Switchback
    timestamp: 03:28:18/9-15-54
    printed_page: 32
    assertion: Asks whether the claimed patrol encounter was in or near Seattle.
    certainty: Question prompted by an anecdote.
  - speaker: Jackie S.
    timestamp: 09:34:06/9-15-54
    printed_page: 32
    assertion: Confirms the alleged encounter was in or near Seattle.
    certainty: First-person anecdotal confirmation.
  - speaker: Switchback
    timestamp: 06:18:10/9-16-54
    printed_page: 32
    assertion: Argues that city-bound highways can fall under Lone Star street-patrol
      jurisdiction, while longer intercity routes generally cross federal or tribal
      jurisdictions, border crossings and disputed territories. Claims bridges and
      roads were destroyed or repaired unevenly after the Great Ghost Dance and
      that remote highways have a different social code from urban streets. The
      speaker advocates punishing theft and helping stranded travelers; this is a
      character's worldview and not a narrator-established legal rule.
    certainty: Opinion with asserted fictional setting history, not independent
      verification of specific incidents or an enforceable frontier code.
  - speaker: Jackie S.
    timestamp: 01:48:34/9-17-54
    printed_page: 32
    assertion: Criticizes Switchback's frontier code and disputes the romanticized
      treatment of life outside urban areas, while saying the discussion feels out
      of touch with present society.
    certainty: Speaker's opinion.
  - speaker: Denver Dan
    timestamp: 04:56:32/9-20-54
    printed_page: 32
    assertion: Suggests a separate reader-authored board report on Lone Star Highway
      Patrol in Québec, attributed to someone called Jaywalk.
    certainty: Unverified cross-reference, not a checked external publication.
  - speaker: Switchback
    timestamp: 09:14:18/9-20-54
    printed_page: 32
    assertion: Describes a claimed earlier practice of leaving cars on open land and
      receiving help from Pueblo Nation travelers, contrasting it with current gangs,
      splinter nations and road danger; presents frontier solidarity as a valued
      heritage.
    certainty: Personal retrospective and opinion; not universal setting fact.
  - speaker: Dragonfly
    timestamp: 10:16:38/9-21-54
    printed_page: 32
    assertion: Dismisses the frontier romanticism as irrelevant to present danger.
    certainty: Speaker opinion.
  - speaker: Diamondback
    timestamp: 13:45:25/9-21-54
    printed_page: 32
    assertion: Rejects Switchback's account of a historical frontier honor code,
      alleging the actual past involved rape, killing and land dispossession, rather
      than the idealized chivalry being invoked.
    certainty: Fictional participant's criticism, not a narrator-authored historical
      adjudication.
  - speaker: Roosterrail
    timestamp: 16:19:04/9-23-54
    printed_page: 32
    assertion: Claims most open highways remain under federal jurisdiction, except
      Québec, and argues that claimed encounters with Lone Star on distant highways
      might indicate renegade officers using stolen corporate equipment; also
      characterizes some legitimate Highway Patrol units as unusually harsh.
    certainty: Speculative, disputed in-world jurisdictional claim.
  - speaker: Clutch
    timestamp: 00:22:19/9-25-54
    printed_pages:
    - 32
    - 33
    assertion: Claims Lone Star deploys heavily equipped Thunderbird-type aircraft
      on intercity highways. Describes fictional scout-class LAVs, armored air-cushion
      lift, remote rigger links and weapon loads, comparing smaller craft with
      military Banshee variants and a named Land Shark type; this is an anecdotal
      equipment claim, not a narrator-certified inventory or real-world advice.
    certainty: Alleged in-world military/patrol equipment observation.
  - speaker: Chrome Dome
    timestamp: 16:30:10/9-25-54
    printed_page: 33
    assertion: Responds to the aircraft comparison by claiming remote riggers can
      threaten the underside of such vehicles; expresses hostility toward perceived
      boasting about armor.
    certainty: Opinion and assertion about fictional vehicles, not a verified
      technical vulnerability or a procedure to perform.
  - speaker: Road Runner
    timestamp: 21:46:11/9-26-54
    printed_page: 33
    assertion: Disputes Chrome Dome's claimed effectiveness against armored vehicles
      and insists opponents would need to be exceptionally quick.
    certainty: Counter-opinion.
  - speaker: Eight
    timestamp: 00:03:17/10-4-54
    printed_page: 33
    assertion: Says similarly configured land-shark vehicles have appeared in Sioux
      Nation tribal-security operations, which the speaker observed as effective
      on open plains, and speculates on whether such vehicles were present during
      an earlier trip.
    certainty: First-person sighting claim plus speculation, not narrator confirmation.
  boundaries: These messages include fictional statements about violence, jurisdiction,
    weapons and disputed history. Preserve speaker attribution and disagreement;
    none constitutes official advice, universal rule, confirmed organization fact,
    or verified real-world equipment guidance. The new Department of Shore/Water Patrol
    begins separately on printed page 33.
