    printed_page: 64
    pdf_page: 64
    assertion: Alleges that DEA aircraft challenged drug flights and fired on unresponsive aircraft; this is an in-world claim in a historical
      policy debate.
    certainty: attributed secondhand allegation, not an independently verified event
  - speaker: Monk McQueen
    timestamp: 12:45:48/9-8-54
    printed_page: 64
    pdf_page: 64
