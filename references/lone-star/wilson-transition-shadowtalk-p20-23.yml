  messages:
  - speaker: Rawhide
    timestamp: 06:29:35/9-7-54
    printed_page: 20
    claim: Characterizes Clayton Wilson's Wild West outlook as requiring everyone
      at Lone Star, including administrative and cleaning personnel, to know how to
      handle a firearm.
    certainty: speaker recollection and attitude
  - speaker: Garth
    timestamp: 12:09:11/9-7-54
    printed_page: 21
    claim: Defends Lone Star by arguing that it accomplishes the assigned public-security
      work despite criticism.
    certainty: defensive opinion
  - speaker: SPD
    timestamp: 18:10:17/9-7-54
    printed_page: 21
    claim: Questions the social cost of the conduct Garth defends.
    certainty: critical opinion
  - speaker: Chung
    timestamp: 13:54:48/9-9-54
    printed_page: 21
    claim: Claims the fictional Beau Arts community also dropped Lone Star and contracted
      with Knight Errant during the period of corporate criticism.
    certainty: in-world contract recollection, not narrator independently establishing
      this specific transfer
  - speaker: Sukoshi
    timestamp: 11:50:25/9-6-54
    printed_page: 21
    claim: Questions how Lone Star founder Clayton Wilson could lose control of the
      company.
    certainty: question
  - speaker: Arioch
    timestamp: 00:00:07/9-7-54
    printed_page: 21
    claim: Explains that Wilson sold stock to investors and entered partnerships to
      raise capital, owned around 25 percent of voting shares, and no longer commanded
      the board despite being its largest individual shareholder.
    certainty: in-world financial explanation
  - speaker: Ken L
    timestamp: 03:31:12/9-7-54
    printed_page: 21
    claim: Claims James Wilson was the younger half-brother from their father’s later
      marriage, around twenty years younger than Clayton.
    certainty: claimed family detail, not promoted to book-narrator fact
  - speaker: Jacques
    timestamp: 15:00:06/9-6-54
    printed_page: 22
    claim: Rejects the possibility of such a dramatic boardroom removal.
    certainty: skeptical reaction
  - speaker: Arioch
    timestamp: 00:01:47/9-7-54
    printed_page: 22
    claim: Counters that the fiercest corporate power struggles often occur in boardrooms.
    certainty: speaker opinion
  - speaker: Tomtom
    timestamp: 13:45:06/9-6-54
    printed_page: 22
    claim: Mocks the founder of Lone Star for being excluded from the firm he created.
    certainty: hostile opinion
  - speaker: Karl
    timestamp: 22:50:01/9-6-54
    printed_page: 23
    claim: Argues that executive cooperation may arise from fear or personal advantage,
      not genuine loyalty.
    certainty: general opinion
  - speaker: Watcher
    timestamp: 06:54:33/9-8-54
    printed_page: 23
    claim: Claims James gradually reshuffled Lone Star leadership from 2036 to 2038;
      alleges old CFO Darwin Ho disappeared during this process.
    certainty: in-world allegation, disappearance unverified by narrator
  - speaker: Crom
    timestamp: 19:10:11/9-8-54
    printed_page: 23
    claim: Alleges Clayton still holds nearly a quarter of Lone Star, remains wealthy
      and resents his brother; speculates he might retaliate.
    certainty: speaker claim with speculative future motive
  - speaker: Rat
    timestamp: 22:05:33/9-8-54
    printed_page: 23
    claim: Reports unsubstantiated rumors of close Clayton Wilson–Damien Knight ties
      around 2037-2040 and imagines support for Knight Errant in a corporate rivalry.
    certainty: explicitly unsubstantiated rumor and hypothetical
  - speaker: Biv
    timestamp: 03:57:11/9-9-54
    printed_page: 23
    claim: Expresses surprise at Rat’s claim without corroborating it.
    certainty: reaction
  - speaker: The Keynesian Kid
    timestamp: 20:54:02/9-8-54
    printed_page: 23
    claim: Interprets James’s stock offering to Theodore Winslow as strengthening
      the James faction and diluting Clayton’s relative voting power.
    certainty: speaker financial inference
  - speaker: Beastman
    timestamp: 13:06:14/9-9-54
    printed_page: 23
    claim: Jokes that the Winslow appointment may also place Theodore on Clayton’s
      list of rivals.
    certainty: jocular speculation
  - speaker: Carmen
    timestamp: 14:26:09/9-11-54
    printed_page: 23
    claim: Claims Clayton continues to retain money and a grudge against James over
      losing his corporate role.
    certainty: unverified personal-motive assessment
  - speaker: Waterboy
    timestamp: 21:52:49/9-11-54
    printed_page: 23
    claim: Dismisses Clayton as irrelevant to current corporate events and says he
      has not affected Lone Star for three years.
    certainty: opposing speaker opinion
  - speaker: Echo
    timestamp: 01:28:27/9-12-54
    printed_page: 23
    claim: Responds that apparent calm could precede future upheaval.
    certainty: ominous speculation, not an established event
