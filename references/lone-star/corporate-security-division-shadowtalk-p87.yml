data:
  publication:
    title: Lone Star Sourcebook
    publisher: FASA Corporation
    catalog_number: FASA7115
    year: 1994
    property: fictional Shadowrun tabletop role-playing game
    edition: original/Second Edition historical source
  source_anchor:
    printed_page: 87
    pdf_page: 95
    heading: CORPORATE SECURITY DIVISION
  attribution_policy: Six in-world Shadowland contributors express questions, suspicions
    or opinions about the fictional Lone Star corporation; they are not narrator-confirmed
    institutional facts or claims about actual people.
  messages:
  - speaker: Stef
    timestamp: 17:30:16/9-21-54
    claim: Asks why CorpSec is in the corporate arm rather than the enforcement arm,
      given the speaker’s impression that these officers are street-level security
      personnel. This is an in-world question, not a factual classification.
  - speaker: Bingo
    timestamp: 23:52:32/9-21-54
    claim: Speculates that Clay Wilson placed CorpSec away from Enforcement Arm divisional
      managers to prevent demands for CorpSec transfers during difficult riot-control
      or similar work. Assumes a comparable institutional rationale for Military Liaison;
      neither inference is narrator-certified.
  - speaker: TTB
    timestamp: 03:20:14/9-23-54
    claim: 'Corrects Bingo: says Wilson shifted civic enforcement functions into their
      own division, not CorpSec, although the result may be similar. This distinction
      must not be reversed.'
  - speaker: Simmons
    timestamp: 11:49:08/10-1-54
    claim: Alleges some CorpSec officers do not even receive the two-week training
      described by the narrator. Derides their conduct and claims few are cybernetically
      augmented and even fewer magically adept. These are speaker allegations, not
      confirmed personnel demographics.
  - speaker: Genie
    timestamp: 00:23:52/10-3-54
    claim: Expresses the opinion that CorpSec personnel are less capable than Knight
      Errant security personnel and claims CorpSec wins contracts by offering lower
      prices. No source-verified contract price comparison is given.
  - speaker: Orchard
    timestamp: 17:44:13/9-13-54
    claim: Says Military Liaison is also part of the corporate arm, declines to offer
      more details, and points readers to earlier comments under Military Connections
      in the Corporate Structure section.
  continuity: The very top of printed p87 completes TANSTAAFL’s Technical Research
    remark begun on printed p86; that contribution is already separately preserved
    in references/lone-star/research-development-shadowtalk-p86-87.yml and is intentionally
    not duplicated here.
  mechanics_boundary: No dice, TN, equipment statistics, mandatory GM procedures or
    Third Edition conversion occur in these six comments.
