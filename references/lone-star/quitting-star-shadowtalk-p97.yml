  comments:
  - speaker: Dean
    timestamp: 00:52:11/9-10-54
    printed_page: 97
    claim: Interprets the corporate-jurisdiction issue as potentially allowing an employee to change employers
      by signing a contract with fictional megacorporation Renraku inside Renraku jurisdiction; acknowledges
      possible renewed exposure on return to Renraku’s competitor’s territory. Speaker legal interpretation,
      not narrator-certified immunity.
  - speaker: Lorna
    timestamp: 12:01:00/9-10-54
    printed_page: 97
    claim: Says smaller competitors with insufficient extraterritorial standing may leave a former Lone Star
      employee exposed to the contract restriction.
  - speaker: Kerr
    timestamp: 04:17:18/9-11-54
    printed_page: 97
    claim: Alleges the corporation cares more about departing staff taking commercially confidential data than
      replacing workers; speculates that the tissue archive could discourage departures.
  - speaker: Dirk
    timestamp: 07:52:09/9-11-54
    printed_page: 97
    claim: Suggests even formally compliant resignations may leave employees concerned about tissue samples
      held by Lone Star. This is speaker suspicion, not a verified magical mechanism.
  source_placement: All four fictional speaker contributions appear in the right column of printed p97 after
    the QUITTING THE STAR narrator passage begins at the lower left.
  attribution_boundary: Personal legal readings, the company’s motivation and alleged tissue-based deterrents
    remain unverified in-world claims; none alters the printed four-year contractual wording.
