id: reference.lone_star.military_liaison_claims_2054
record_type: historical_fictional_attributed_shadowtalk
status: source_reviewed
source: source.fasa-7115
printed_pages: 25-26
pdf_pages: 25-26
edition_scope: FASA Corporation, Lone Star Sourcebook (FASA7115, 1994), fictional
  Shadowrun original/Second Edition security discussion; no inferred Third Edition
  supersession.
content_class:
- attributed_claim
data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog: FASA7115
    year: 1994
    setting: fictional tabletop RPG
  section_title: Military Connections
  source_anchors:
  - printed_page: 25
    pdf_page: 25
    heading: Military Connections opening thread
  - printed_page: 26
    pdf_page: 26
    heading: Military Connections continuation and conclusion
  attribution_rule: This subsection consists of fictional in-world comments and questions,
    not narrator-certified military force inventories. Claimed units and affiliations
    must not be treated as operationally verified fact or as real-world security instructions.
  messages:
  - speaker: The Cat
    timestamp: 11:02:01/9-7-54
    printed_page: 25
    claim: Reports hearing about a Lone Star Military Liaison operation, distinguishes
      it from an incorporated subsidiary, and alleges offices in Washington and Atlanta
      coordinating personnel with public military and emergency agencies; questions
      what function justifies separate personnel and assets.
    certainty: in-world investigative post and openly unanswered questions
  - speaker: Red October
    timestamp: 19:47:10/9-7-54
    printed_page: 25
    claim: Says the Atlanta Military Liaison location is allegedly staffed with communications
      specialists, logistics personnel, weapons-and-tactics employees and officers
      transferred from SWAT and Fast Response Teams.
    certainty: unverified speaker investigation
  - speaker: Yours Truly
    timestamp: 22:42:08/9-7-54
    printed_page: 25
    claim: Interprets the reported resources as an apparent private army.
    certainty: speaker conjecture
  - speaker: Hiroaki
    timestamp: 02:11:00/9-8-54
    printed_page: 26
    claim: Agrees with Yours Truly and characterizes Lone Star as having its own privately
      controlled military force.
    certainty: participant interpretation
  - speaker: Tozer
    timestamp: 12:36:29/9-9-54
    printed_page: 26
    claim: Rejects that conclusion and asserts Lone Star is a policing corporation
      rather than a military megacorporation such as Ares.
    certainty: disagreement
  - speaker: Wolf
    timestamp: 02:59:22/9-11-54
    printed_page: 26
    claim: Argues that corporate organizations such as Ares, Renraku and Aztechnology
      maintain heavily armed security forces and that Lone Star may do likewise.
    certainty: generalizing speaker assertion
  - speaker: Red
    timestamp: 00:12:45/9-12-54
    printed_page: 26
    claim: Sarcastically asks whether police companies also maintain covert violent
      operatives or commando forces.
    certainty: rhetorical question
  - speaker: Wolf
    timestamp: 03:59:02/9-12-54
    printed_page: 26
    claim: Cites Lone Star Fast Response Teams as evidence of militarized corporate
      security and alleges megacorporate forces protect their own commercial interests,
      often at public expense.
    certainty: speaker allegation and moral assessment
  - speaker: Yours Truly
    timestamp: 21:06:48/9-12-54
    printed_page: 26
    claim: Presses the forum for an explanation of whether Military Liaison really
      acts as Lone Star’s private army.
    certainty: question, not verified conclusion
  - speaker: KC
    timestamp: 00:27:54/9-13-54
    printed_page: 26
    claim: Defers to Wolf rather than providing independent evidence.
    certainty: brief cross-reference
  - speaker: Argent
    timestamp: 23:18:06/9-13-54
    printed_page: 26
    claim: Claims the Washington and Atlanta Military Liaison offices function semi-autonomously,
      each able to field a heavily equipped battalion; alleges Lone Star offers such
      assets for hire to corporate clients needing armed assistance overseas or during
      regional instability.
    certainty: unverified claimed organizational capacity, no operational methodology
  - speaker: Oswald Butcher
    timestamp: 23:20:19/9-13-54
    printed_page: 26
    claim: Asks whether Knight Errant offers similar services.
    certainty: question only
  - speaker: Cowan
    timestamp: 01:41:32/9-14-54
    printed_page: 26
    claim: Objects to the gap between the corporation’s public civil-defense messaging
      and the alleged private military role.
    certainty: critical opinion
  - speaker: Wolf
    timestamp: 03:28:56/9-14-54
    printed_page: 26
    claim: Suggests the Washington and Atlanta offices allow Lone Star to blend into
      nearby military institutions and preserve a public-service image; names Fort
      Gillem and corporate examples as speculative associations.
    certainty: partially speculative public-relations interpretation
  - speaker: Talon
    timestamp: 10:22:09/9-14-54
    printed_page: 26
    claim: Asks about rumored plans for a Military Liaison unit in Seattle.
    certainty: unconfirmed rumor question
  - speaker: Argent
    timestamp: 19:34:35/9-14-54
    printed_page: 26
    claim: Replies that any such Seattle plans produced no unit and apparently changed.
    certainty: corrective speaker claim
framing: newsroom_neutral
headline: Fictional Lone Star Military Connections discussion, FASA Corporation Lone
  Star Sourcebook (FASA7115, 1994), original/Second Edition, printed/PDF pp25-26
summary: Sixteen attributed 2054 fictional forum entries questioning Lone Star Military
  Liaison offices and resources; military-capability claims remain unconfirmed in-world
  statements.
