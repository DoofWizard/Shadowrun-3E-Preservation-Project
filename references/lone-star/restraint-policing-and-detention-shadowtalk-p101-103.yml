data:
  publication:
    title: Lone Star Sourcebook
    publisher: FASA Corporation
    catalog: FASA7115
    year: 1994
    setting: fictional Shadowrun tabletop role-playing game
    edition: historical original/Second Edition-era FASA sourcebook; not converted
      to Shadowrun Third Edition
  review_scope:
    printed_pages: 101-103
    pdf_pages: 109-111
    original_source_images_reviewed: true
    content_class: attributed_claim
  attribution_boundary: X-Star, Yellow, Wolf, MOM, Numerate and Papillon supply independent
    attributed fictional forum views; Biko’s equipment-catalog reproduction (p101-103)
    is likewise attributed, not anonymous book-narrator equipment knowledge. The speaker
    Biko’s byline closes the catalog at p103. None is unqualified real-world fact,
    game-rule advice, or a universal institutional practice.
  comments:
  - speaker: X-Star
    timestamp: 22:33:58/11-8-54
    printed_page: 101
    claim: Alleges that abusive treatment of already apprehended suspects is culturally
      entrenched at some Lone Star precincts, variable by precinct and city. Claims
      some stations conceal it while others build reputations for harming prisoners.
  - speaker: Yellow
    timestamp: 07:19:25/11-9-54
    printed_page: 101
    claim: Questions the expression used for assaulting detainees.
  - speaker: X-Star
    timestamp: 20:48:43/11-9-54
    printed_page: 101
    claim: Explains a slang term for police assaults against persons already subdued,
      and another term for an officer especially proficient in such abuse.
  - speaker: Biko
    timestamp: 12:34:19/11-3-54
    printed_pages: 101-103
    claim: Introduces a copied corporate catalog of fictional restraints and screening
      devices, says its source was a shipment headed toward Toronto, and includes
      listed prices for each item. Makes a darkly comic comparison between certain
      restraint devices and adult consumer products, and describes some restraints
      as physically painful. The signature after Cyberware Scanner cost on p103 attributes
      the entire multi-page catalog passage to Biko, not just a separate closing comment.
      Listed in-world device specifications are retained separately in equipment/lone-star/arrest-restraint-screening-devices-p101-103.yml.
  - speaker: Wolf
    timestamp: 03:09:14/11-10-54
    printed_page: 103
    claim: Recounts a purported incident at a Milwaukee precinct in which officers
      beat a suspect described as a perpetrator of child sexual abuse. The speaker
      says roughly fifteen people were present by the end and alleges a second-floor
      booking route; this is a narrated allegation, not confirmed institutional practice.
  - speaker: MOM
    timestamp: 12:04:09/11-10-54
    printed_page: 103
    claim: Alleges racially discriminatory police shootings, specifically claiming
      fictional orks and trolls were reported killed while allegedly trying to escape
      at a rate about twelve times higher than people of other races; the statistical
      comparison is an unverified speaker allegation.
  - speaker: Numerate
    timestamp: 17:07:56/11-10-54
    printed_page: 103
    claim: Challenges simplistic readings of crime and police-shooting statistics
      and names socioeconomic status, augmentations and narcotic use as possible confounders;
      nevertheless acknowledges that racial disparities involving orks and trolls
      appear statistically significant after adjustment.
  - speaker: MOM
    timestamp: 08:52:34/11-11-54
    printed_page: 103
    claim: Objects to both overt racial prejudice and attempts to excuse it; this
      short forum reaction is not a narrator conclusion.
  - speaker: Papillon
    timestamp: 12:02:42/11-12-54
    printed_page: 103
    claim: 'Offers a second-person fictional account of detention after arrest: asserts
      a night in a precinct cell, identity and augmentations checks, possible bail
      for misdemeanors but not typical felonies, and transfer from station to higher-security
      incarceration. States an in-world claimed interval of three weeks to eighteen
      months; describes differentiated custody of street criminals and magically active
      people, restrictive magical countermeasures, possible deprivation and chemical
      exposure, and alleges that police may send detainees to a corporation under
      short-term extraterritorial-contract arrangements. These are speaker claims,
      not established rules or a recommended procedure.'
  critical_distinctions: Preserves exact fictional speaker attribution to Biko for
    the multi-page equipment catalog; alleged victims, racial identities, accusations
    of child sexual abuse, speakers’ distinct certainty and disagreement, custody/coercion
    rather than consent, and claimed detention intervals.
headline: Fictional Biko catalog and detention Shadowtalk — FASA Lone Star Sourcebook
  (FASA7115, 1994), Second Edition-era, pp101–103/PDF109–111
summary: Nine independently attributed forum contributions including Biko’s multi-page
  in-world equipment catalog and disputed policing/detention claims, preserving original
  speaker signature and uncertainties.
framing: newsroom_neutral
