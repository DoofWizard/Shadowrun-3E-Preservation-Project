  source_anchors:
  - printed_page: 27
    pdf_page: 27
  - printed_page: 28
    pdf_page: 28
  - printed_page: 29
    pdf_page: 29
  attributed_interview:
    speaker: Sergeant Anne Weitzmann
    program: Good Morning, Austin
    printed_page: 27
    status: Interview excerpt, not narrator fact or operational recommendation
    claim: Weitzmann argues that patrol officers learn to anticipate criminal thinking
      while remaining distinct through their badges; the closing garbage-can comparison
      is her attributed rhetoric.
  messages:
  - speaker: Red
    timestamp: 07:19:32/9-2-54
    printed_page: 28
    claim: Objects to the proposed compulsory cybernetic surgery and predicts progressive
      escalation from simple implant radios to more extensive augmentation; this is
      Red’s reaction to a budget proposal, not established deployment.
  - speaker: Point Five
    timestamp: 12:17:47/9-2-54
    printed_page: 28
    claim: Questions where Lone Star will obtain funds for the proposed implanted
      radios and recorders.
  - speaker: Dixie
    timestamp: 01:01:24/9-5-54
    printed_page: 28
    claim: Reports, with uncertainty about timing, a supposed prior issue of “medical
      beacon” life-sign monitors to street police including SWAT and meter-readers.
      Describes a chest harness, skin-induction vital signs, radio warning to a nearby
      Lone Star monitor (often a vehicle computer), extra observation when readings
      leave tolerance, and an “officer down” Dispatch code if readings become critical
      or stop; compares the mechanism to DocWagon Super-Platinum. A dated in-world
      speaker’s technical claim, not an independently authenticated universal deployment.
  - speaker: Crosshairs
    timestamp: 15:22:06/9-6-54
    printed_page: 28
    claim: Claims some officers refuse the alleged medical-beacon devices despite
      purported dismissal rules, and speculates that their objection is to continuous
      location monitoring or being watched by Lone Star.
  - speaker: Waster
    timestamp: 11:47:22/10-4-54
    printed_page: 28
    claim: Jokes about numerous organizational subdivisions and police administration.
  - speaker: SPD
    timestamp: 03:23:56/10-4-54
    printed_page: 28
    claim: Claims that approximately three years before the 2054 comment Lone Star
      replaced standard Yamaha Rapier patrol cycles with Harley Electroglide-1000
      motorcycles and reassigned the older cycles to traffic patrol.
  - speaker: Flashpoint
    timestamp: 14:37:23/10-11-54
    printed_page: 28
    claim: Claims Chrysler-Nissan patrol cars were first issued in 2052; older Ford
      Americars and Honda-GM ZX variants remain active in large cities where replacement
      budgets limit upgrades, and in smaller communities without the same equipment
      need.
  - speaker: Bad Grrrl
    timestamp: 03:54:11/9-10-54
    printed_page: 28
    claim: Jokes about the amount of equipment carried on patrol cycles.
  - speaker: Burge
    timestamp: 00:56:35/10-13-54
    printed_page: 29
    claim: Makes a dark joke that the patrol car’s electrified rear-seat restraint
      would coerce suspects into talking; this fictional speaker’s joke is not narrator
      approval or evidence of real-world practice.
  continuation_alert: A new fictional Shadowtalk post about vehicle computer security
    begins on p29 and continues on p30; its complete content and speaker attribution
    must be assessed with p30 rather than treating p29 alone as a complete claim.
  evidentiary_boundaries: Speaker opinions, dated claims and jokes are not necessarily
    source-narrator facts; statements about contested deployment and officer tracking
    remain attributed, not established.
