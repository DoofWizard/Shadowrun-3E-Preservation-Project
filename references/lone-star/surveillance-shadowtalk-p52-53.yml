data:
  publication:
    title: Lone Star Sourcebook
    publisher: FASA Corporation
    catalog: FASA7115
    year: 1994
    edition: Shadowrun original/Second Edition historical source (original and Second
      Edition compatibility stated on printed p5)
    status: fictional tabletop role-playing-game setting
  source_anchors:
  - printed_page: 52
    pdf_page: 52
    heading: Shadowtalk surrounding Department of Surveillance
  - printed_page: 53
    pdf_page: 53
    heading: Shadowtalk preceding Department of Organized Crime
  messages:
  - speaker: Turnkey
    timestamp: 13:10:09/9-8-54
    printed_page: 52
    claim: Speculates that British police or MI-5 had specialized surveillance teams
      called shadows as far back as the 1980s; the speaker explicitly hedges the historical
      recollection.
    certainty: speaker recollection and speculation
  - speaker: X-Star
    timestamp: 13:32:45/9-9-54
    printed_page: 52
    claim: Recounts watching Watcher teams maintain a twelve-hour observation of an
      alert fictional suspect, coordinating team handoffs; tells it as a first-person
      anecdote rather than an institutional standard.
    certainty: speaker anecdote
  - speaker: Advantage
    timestamp: 06:06:27/9-6-54
    printed_page: 52
    claim: Challenges the previous assertion that an expert observer evaded detection
      by the Watchers.
    certainty: challenge to an anecdote
  - speaker: X-Star
    timestamp: 16:30:13/9-6-54
    printed_page: 52
    claim: Says the speaker sat in a surveillance control van and saw an officer in
      charge monitor the team’s video feeds, allegedly bending rules to do so.
    certainty: first-person allegation
  - speaker: Boxpusher
    timestamp: 13:40:53/9-9-54
    printed_page: 52
    claim: Boasts about claimed fictional surveillance hardware including laser/acoustic
      sensors, miniature video cameras, and counter-countermeasures hardware; exact
      availability or capabilities are not verified by the book narrator.
    certainty: equipment-related speaker claim, not rules statistics
  - speaker: Wordsmith
    timestamp: 05:52:01/9-10-54
    printed_page: 52
    claim: Claims Watchers make heavy use of cyberware, remote observation equipment,
      and, less often, magical assistance from spirits arranged through local spellcasters.
    certainty: in-world commentary
  - speaker: CySpy
    timestamp: 20:31:47/9-10-54
    printed_page: 52
    claim: Argues that effective observers rely on judgment and skill even when their
      equipment is technologically advanced.
    certainty: speaker opinion
  - speaker: The Man
    timestamp: 23:53:39/9-10-54
    printed_page: 53
    claim: Claims Watchers can defend themselves if directly confronted; describes
      seeing one fight to protect recording equipment.
    certainty: speaker anecdote
  - speaker: Deb
    timestamp: 00:38:56/9-14-54
    printed_page: 53
    claim: Claims corporate families sometimes use implanted recognition transmitters
      to track children and speculates that Lone Star monitors signals carried by
      other people or animals.
    certainty: unverified allegations and speculation, not narrator facts
  - speaker: SPD
    timestamp: 17:08:02/9-16-54
    printed_page: 53
    claim: Claims certain special surveillance contracts involving wealthy clients’
      children generate substantial profit.
    certainty: speaker claim, no amount independently established
  attribution_boundary: Comments retain dated 2054 pseudonymous speakers, firsthand
    versus secondhand claims, uncertainty and disagreement. They are not narrator-certified
    facts or actual equipment rules.
headline: Fictional Surveillance Shadowtalk — FASA Corporation Lone Star Sourcebook
