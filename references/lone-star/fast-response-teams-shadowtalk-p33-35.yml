data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog_number: FASA7115
    publication_year: 1994
    game_context: Fictional Shadowrun tabletop roleplaying game
    edition_lineage: Original/Second Edition-compatible historical material; no implicit
      SR3 conversion
  source_anchors:
  - printed_page: 33
    pdf_page: 33
    heading: Fast Response Teams discussion
  - printed_page: 34
    pdf_page: 34
    heading: Fast Response Teams continued
  - printed_page: 35
    pdf_page: 35
    heading: Fast Response Teams equipment and personnel discussion
  messages:
  - speaker: Laguna Gloria
    timestamp: 01:12:22/9-7-54
    printed_page: 34
    assertion: Alleges Bryce Ward sometimes delayed SWAT backup to patrol personnel
      as part of a rivalry with Connie Bannister.
    certainty: In-world allegation concerning a manager's intent and practice, not
      a narrator-certified individual incident.
  - speaker: Laguna Gloria
    timestamp: 01:14:01/9-7-54
    printed_page: 34
    assertion: Criticizes departmental maintenance budgets, suggesting FRT help is
      unavailable for mundane squad-level incidents and may not cover damage to patrol
      vehicles.
    certainty: Sarcastic criticism and example, not a general rule for resolving vehicle
      damage.
  - speaker: Friday
    timestamp: 03:38:47/9-7-54
    printed_page: 34
    assertion: Claims FRT and SWAT sometimes both arrive at an incident and dispute
      command, to the detriment of bystanders; urges clearer command designation.
    certainty: Anecdotal assessment, not guaranteed departmental response behavior.
  - speaker: Wolf
    timestamp: 04:29:05/9-9-54
    printed_page: 34
    assertion: Argues FRT may increasingly accompany raids, including operations presented
      as searches or seizures and cases where targets show strong resistance, expanding
      the practical scope of fast response.
    certainty: Speaker's forecast and criticism rather than an established blanket
      policy.
  - speaker: Carnivore
    timestamp: 20:35:33/9-9-54
    printed_page: 34
    assertion: Expresses the opinion that SWAT personnel resent the FRT's expansion.
    certainty: Speculation about group attitudes.
  - speaker: Point Man
    timestamp: 10:42:33/9-8-54
    printed_page: 35
    assertion: Describes active helmets with limited internal heads-up displays for
      targeting and silent squad coordination, while criticizing their power consumption
      and heat.
    certainty: Alleged fictional equipment characteristics, not a narrator-certified
      equipment stat line.
  - speaker: X-Star
    timestamp: 16:05:47/9-6-54
    printed_page: 35
    assertion: Claims FRT snipers usually employ explosive ammunition.
    certainty: Unverified equipment assertion by an in-world commenter; no new numerical
      damage statistic is supplied.
  - speaker: Wolf
    timestamp: 21:51:28/9-7-54
    printed_page: 35
    assertion: States that FRT teams can modify the standard weapons allocation to
      circumstances, including different firearms, launchers or a mounted minigun,
      and recounts a reported counter-surveillance practice used in conflicts with
      hostile riggers.
    certainty: General reported variation, not an exact game loadout rule or real-world
      sabotage instructions.
  - speaker: Argent
    timestamp: 23:09:10/9-7-54
    printed_page: 35
    assertion: Describes a fictional electronic countermeasure nicknamed a zapper,
      alleging that equipment used against hostile surveillance rigs can disable vehicle
      or drone systems, and claims some street groups have similar devices.
    certainty: Speaker's in-world technical claim; no verified item statistics or
      real-world procedure.
  - speaker: Technocrat
    timestamp: 06:22:59/9-9-54
    printed_page: 35
    assertion: Asks what the in-world term 6PAK means.
    certainty: Terminology question.
  - speaker: Gunhead
    timestamp: 09:28:19/9-9-54
    printed_page: 35
    assertion: Defines 6PAK as a six-barreled Colt firearm resembling a GE Vindictor
      design, offering no full game stat line.
    certainty: Fictional equipment identification by a named commenter.
  - speaker: Duo
    timestamp: 08:52:10/9-8-54
    printed_page: 35
    assertion: Suggests FRT staff may include augmented individuals, including cyberware,
      adept and magic-capable personnel, and alleges some receive protective magic
      cast by contracted magicians.
    certainty: Broad unverified in-world rumor; not narrator-established standard
      staffing.
  - speaker: Razor's Edge
    timestamp: 10:34:37/9-8-54
    printed_page: 35
    assertion: Expresses interest in allegedly sustained or quickened protective magic
      and speculates about paying a magician for support.
    certainty: Personal wish and speculation, not a priced spell rule or confirmed
      engagement.
  - speaker: Bung
    timestamp: 18:11:11/9-8-54
    printed_page: 35
    assertion: Teases Razor's Edge about already facing dangerous situations, without
      adding independently verified squad facts.
    certainty: Reply and joke.
  - speaker: Razor's Edge
    timestamp: 11:54:09/9-9-54
    printed_page: 35
    assertion: Responds that the speaker already owes favors or support to a magician.
    certainty: Self-reported relationship, not independently established.
  - speaker: Constance
    timestamp: 06:47:41/9-11-54
    printed_page: 35
    assertion: Warns that magically augmented FRT personnel are possible but are not
      part of standard operating procedure; attributes such cases to arrangements
      by particular units.
    certainty: Corrective in-world operational claim, not a formal rulebook default.
  - speaker: Constance
    timestamp: 06:48:50/9-11-54
    printed_page: 35
    assertion: Explains the benefit of FRT cross-training in allowing staff to perform
      different squad positions over time, in contrast to rigid specialization.
    certainty: Speaker's explanation, consistent with but independent of the narrator's
      cross-training statement.
  authority_boundary: This record preserves dated fictional speaker claims and disagreements
    separately from the sourcebook narrator's original/Second Edition-compatible FRT
    organization, history and default equipment; no allegation is treated as verified
    policy, game mechanics, or real-world guidance.
