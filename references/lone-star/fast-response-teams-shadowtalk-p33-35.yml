headline: Fictional FRT Shadowtalk — FASA Corporation Lone Star Sourcebook FASA7115
  (1994), printed pp33–35/PDF33–35
summary: Seventeen separately attributed in-world comments address SWAT rivalry, competing
  response authority, equipment, optional augmentation and the FRT's role; original/Second
