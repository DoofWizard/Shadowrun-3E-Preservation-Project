  comments:
  - speaker: Refugee
    timestamp: 17:26:42/9-11-54
    printed_page: 68
    pdf_page: 68
    assertion: Complains that Internal Affairs scrutinizes corporate enforcers and
      alleges its investigators invent corruption where none exists.
    certainty: Critical in-world opinion and unverified accusation.
  - speaker: Monitor
    timestamp: 15:05:11/9-12-54
    printed_page: 68
    pdf_page: 68
    assertion: Rebukes Refugee for the hostile language and redirects the discussion.
    certainty: Moderating response, not an agency fact.
  - speaker: Your Mother
    timestamp: 03:12:42/9-14-54
    printed_page: 68
    pdf_page: 68
    assertion: Says the Corporate Arm includes the Division of Psychology, whose staff
      the speaker calls the Gray Men, and warns readers not to dismiss the office
      staff as unimportant.
    certainty: Named speaker characterization, not narrator confirmation of terminology.
  - speaker: Renard
    timestamp: 15:53:36/9-16-54
    printed_page: 68
    pdf_page: 68
    assertion: Claims Lone Star requires all employees, including data-processing
      workers, to carry firearms. The speaker disparages desk workers as liable to
      mishandle weapons and praises SWAT officers as relatively reliable under fire.
    certainty: Speaker claim and derogatory workplace stereotype, not an independently
      verified firearms policy.
  - speaker: Annie Oakley
    timestamp: 12:21:20/9-17-54
    printed_page: 68
    pdf_page: 68
    assertion: Rejects Renard’s sexist dismissal of clerical employees, saying those
      staff know how to use the weapons assigned to them.
    certainty: Speaker rebuttal; independent training claims are unverified.
  speaker_boundary: These are fictional dated 2054 Shadowland messages about corporate
    personnel. The printed narrator states only that the corporate arm supports Lone
    Star off the street. The comments do not establish official internal policies
    or convert speculative statements into factual history.
