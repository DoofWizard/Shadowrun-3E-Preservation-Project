data:
  publication:
    title: Lone Star Sourcebook
    publisher: FASA Corporation
    catalog: FASA7115
    year: 1994
    setting: fictional Shadowrun tabletop role-playing game
    edition: historical original/Second Edition-era FASA sourcebook; not converted
      to Shadowrun Third Edition
  review_scope:
    printed_pages: 98-100
    pdf_pages: 106-108
    original_source_images_reviewed: true
    content_class: attributed_claim
  commentary_attribution: Named Shadowland speakers comment on and dispute the published
    fictional Lone Star procedures; assertions are not narrator-certified institutional
    facts.
  comments:
  - speaker: Zingbat
    timestamp: 20:52:01/9-6-54
    printed_page: 98
    claim: Argues that knowing required procedures could help an accused person delay
      the fictional legal process.
  - speaker: Friday
    timestamp: 13:28:03/9-5-54
    printed_page: 98
    claim: Interprets infringement of a suspect’s rights as a reason a fictional court
      might reject an arrest or prosecution.
  - speaker: Twist
    timestamp: 09:10:14/10-5-54
    printed_page: 100
    claim: Questions strict badge-display requirements when an arresting officer faces
      a dangerous armed suspect; contrasts a badge with an obviously displayed firearm.
  - speaker: Front Zone Fran
    timestamp: 14:48:27/9-8-54
    printed_page: 100
    claim: Responds with laughter to the preceding requirement that the person’s safety
      be ensured.
  - speaker: Lynx
    timestamp: 10:17:25/9-13-54
    printed_page: 100
    claim: Claims an assigned SIN functions as a persistent tracking identifier through
      the booking process.
  - speaker: Lynx
    timestamp: 10:18:58/9-13-54
    printed_page: 100
    claim: Speculates that biometric and tissue data are permanently linked to a new
      SIN and may permit future police comparison with crime-scene material whether
      or not a person was involved.
  - speaker: Tinkerbell
    timestamp: 19:00:59/9-13-54
    printed_page: 100
    claim: Reactively expresses alarm following Lynx’s description of lasting biometric
      records.
  - speaker: Freezeframe
    timestamp: 06:58:17/10-15-54
    printed_page: 100
    claim: Expresses concern that removing illegal cyberware during processing could
      involve careless and physically harmful treatment.
  attribution_boundary: Lynx’s claims about permanent records and Freezeframe’s fears
    are speaker assertions; do not import them as independently established universal
    police procedures.
headline: Fictional Lone Star arrest commentary — FASA Lone Star Sourcebook (FASA7115,
  1994), Second Edition-era, pp98–100/PDF106–108
summary: Eight individually attributed 2054 forum contributions dispute procedure,
  suspect rights, identity tracking, and handling of cyberware without converting
  opinions into facts.
