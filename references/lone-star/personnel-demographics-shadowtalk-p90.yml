data:
  publication:
    title: Lone Star Sourcebook
    publisher: FASA Corporation
    catalog_number: FASA7115
    publication_year: 1994
    work_type: fictional cyberpunk tabletop role-playing game sourcebook
    edition: original/Second Edition historical material; no inferred Third Edition conversion
  source_anchors:
  - printed_pages: '90'
    pdf_pages: '98'
    section: Demographics accompanying Shadowtalk
  subject: Published fictional Shadowland debate about gender, metatype and administrative hiring at Lone Star
  attributed_comments:
  - speaker: Wolf
    timestamp: 02:56:47/9-9-54
    claim: Briefly challenges an earlier speaker by saying the answer might be surprising; the original immediately
      preceding remark is on the prior page, so this snippet alone supplies no detailed factual claim.
  - speaker: Libbie
    timestamp: 13:19:04/9-9-54
    claim: Criticizes the apparent gender imbalance in the street ranks and senior management; her rhetorical question
      alleges persisting sexism.
  - speaker: Compustat
    timestamp: 15:02:11/9-11-54
    claim: Claims founder Clay Wilson did not hire women and that the restriction was lifted only after James Wilson
      took over; interprets the increase in women street officers as comparatively rapid.
  - speaker: Libbie
    timestamp: 15:02:20/9-11-54
    claim: Challenges the claim of progress by pointing to the still male-dominated senior management and entrenched
      workplace culture.
  - speaker: Tozer
    timestamp: 13:33:02/9-7-54
    claim: Echoes criticism of a male-dominated internal culture.
  - speaker: Laguna Gloria
    timestamp: 21:49:08/9-7-54
    claim: Attributes anti-metahuman hiring attitudes to founder Clay Wilson, while asserting that his successor
      has a more egalitarian approach.
  - speaker: HRO
    timestamp: 01:25:49/9-10-54
    claim: Offers a competing explanation of apparent hiring outcomes, alleging that publicity-driven protest applications,
      unsuitable applicants, and rejected applicants’ accusations compound perceptions of institutional discrimination.
  - speaker: Ork and Fragging Proud Of It
    timestamp: 07:00:46/9-11-54
    claim: Rejects HRO’s mitigating argument and calls the corporation racist; strong fictional in-world opinion,
      not a quantified narrator finding.
  - speaker: X-Star
    timestamp: 15:30:45/9-11-54
    claim: Claims corporate managers are pursuing metahuman community-policing recruits, but that practical patrol
      deployment lags and insufficient qualified metahuman officers are available.
  - speaker: Sheaffer
    timestamp: 21:47:08/9-12-54
    claim: Asks why demographics by tribal background were not reported; does not provide an alternative numerical
      dataset.
  - speaker: O.K. Corrales
    timestamp: 01:34:11/9-13-54
    claim: Replies dismissively to the tribal-background question and invokes Clayton Wilson’s old Texas Rangers
      image.
  source_authority: All speaker statements are dated fictional Shadowtalk claims. Exact printed tables and narrator
    caveats are preserved independently in world/lone-star/personnel-demographics-tables-p90.yml; do not conflate
    opinions with verified demographics.
