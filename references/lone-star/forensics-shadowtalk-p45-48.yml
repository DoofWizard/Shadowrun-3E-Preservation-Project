  messages:
  - speaker: Dybuk
    timestamp_as_printed: 17:41:05/9-28-54
    printed_pages: 45-46
    claim: Says that the UCAS federal authorities outsourced some magical-forensic inquiries to the rival Knight Errant company and that the arrangement ended Lone Star's earlier distinctive status in that field.
    certainty: attributed fictional speaker claim, not narrator establishment of a federal procurement contract
  - speaker: Dybuk
    timestamp_as_printed: 17:35:07/9-28-54
    printed_pages: '46'
    claim: Complains that identification technicians are subordinated when specialists from the Division of Paranormal Investigations or Matrix Security appear at the same crime scene.
    certainty: speaker opinion about interdepartmental hierarchy
  - speaker: Dirk
    timestamp_as_printed: 00:26:39/10-1-54
    printed_pages: 46-47
    claim: Former Lone Star personnel member describes training in evidence observation, contemporaneous notes, photographs and physical corroboration, distrust of easily altered digital images and records, limitations of witness recollection, and possible consultation with paranormal investigators. Claims personal experience with secrecy and rivalry among paranormal specialists.
    certainty: extended first-person training recollection and subjective appraisal; not a narrator-established forensic procedure or real-world advice
  - speaker: Rest
    timestamp_as_printed: 05:59:03/10-17-54
    printed_pages: '47'
    claim: Alleges that Lone Star charges substantial fees for civilian forensic services and sometimes characterizes incidents as crimes to justify conducting lucrative autopsies.
    certainty: unverified fictional corruption allegation, distinct from narrator-confirmed outside-agency billing
  - speaker: YT
    timestamp_as_printed: 03:14:56/9-8-54
    printed_pages: '47'
    claim: Attributes conflicts of interest to the treatment of Forensic Pathology as a revenue center, alleging that some managers favor broader case classification while Homicide personnel seek to avoid unnecessary investigations.
    certainty: speaker's organizational analysis, not confirmed policy
  - speaker: Raven
    timestamp_as_printed: 09:37:31/10-2-54
    printed_pages: '48'
    claim: Alleges that pathologists confiscate illegal cyberware found at autopsy and that records of illicit or grey-market surgical work may give them knowledge of underground providers.
    certainty: speaker allegation, not narrator-established law or verified staff conduct
  - speaker: Boxer
    timestamp_as_printed: 21:25:57/10-6-54
    printed_pages: '48'
    claim: Suggests, in a hostile remark, that someone might seek clandestine cyberware-provider information from Forensic Pathology through payments or threats.
    certainty: speculative in-world suggestion, not established action or advice endorsed by the archive
  - speaker: Zig
    timestamp_as_printed: 06:28:47/10-2-54
    printed_pages: '48'
    claim: Alleges misuse of temporarily unassigned fictional SIN identity numbers around coroner processing for fraudulent impersonation and commercial transactions.
    certainty: unverified in-world allegation, not established behavior or a procedural instruction
  - speaker: Argent
    timestamp_as_printed: 12:34:17/10-5-54
    printed_pages: '48'
    claim: Warns that forged identities could attract interdepartmental attention and discusses alleged corrupt document facilitation by officials in exchange for money.
    certainty: fictional personal warning and corruption allegation, not proven availability of such services
  - speaker: Moxie
    timestamp_as_printed: 06:52:11/9-7-54
    printed_pages: '48'
    claim: Claims Homicide access to forensic files or bodies may override ordinary clearance barriers amid departmental financial disputes.
    certainty: sarcastic in-world observation, not a verified breach incident
  - speaker: uncredited in-world advertiser
    timestamp_as_printed: not present on reviewed page
    printed_pages: '48'
    claim: A source-page advertisement addresses shadowrunners and offers annotated educational material about postmortem investigation, with a fictional payment and postal contact. The original passage does not identify a speaker in its visible attribution.
    certainty: promotional solicitation in a fictional discussion; not independent evidence of the advertised expertise
  narrator_boundary: Source-narrator information about the existence of the Forensics Department and its official subdivisions is separately preserved in world/lone-star/forensics-department-identification-pathology-p45-48.yml.
  source_speech_boundary: The comments contain allegations and suggestions about fictional crime or corruption; preserving their topics and named authors does not endorse or operationalize them.
