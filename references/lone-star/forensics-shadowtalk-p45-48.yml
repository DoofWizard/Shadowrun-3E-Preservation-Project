  source_anchors:
  - {printed_page: 45, pdf_page: 45, heading: Department of Forensics introductory Shadowtalk}
  - {printed_page: 46, pdf_page: 46, heading: Identification Section discussion}
  - {printed_page: 47, pdf_page: 47, heading: Forensic Pathology comments}
