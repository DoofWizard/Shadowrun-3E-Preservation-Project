data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog: FASA7115
    year: 1994
    edition: fictional Shadowrun original/Second Edition sourcebook
    historical_not_automatically_sr3: true
  source_anchors:
  - printed_page: 41
    pdf_page: 41
    heading: Dispatch Office Shadowtalk
  - printed_page: 42
    pdf_page: 42
    heading: Dispatch Office Shadowtalk continuation
  messages:
  - speaker: Flid
    timestamp: 23:01:58/9-6-54
    pages: '41'
    claim: Disputes that all Lone Star officers have the cyber-radio and smartgun
      implants mandated in the narrator-described policy.
    certainty: unverified reported noncompliance
  - speaker: Doogie
    timestamp: 00:52:08/9-7-54
    pages: '41'
    claim: Asks why more dispatch work is not automated.
    certainty: question, not evidence
  - speaker: SPD
    timestamp: 12:46:47/9-7-54
    pages: '41'
    claim: Responds that they believe the implantation policy is fully enforced in
      Austin, contradicting Flid’s generalization.
    certainty: qualified opinion about one city
  - speaker: Sass
    timestamp: 15:09:32/9-7-54
    pages: '42'
    claim: Says automated dispatch would be costly and voices concerns that software
      could misjudge emergency priorities and overlook panic communicated by callers.
    certainty: speculative assessment
  - speaker: Tiagy
    timestamp: 03:52:22/9-19-54
    pages: '41'
    claim: Jokes that a field or dispatch officer sometimes tells a caller to arm
      themselves with a butcher knife and hide in a closet.
    certainty: anecdotal or sardonic comment, not actual emergency guidance
  - speaker: Tuna
    timestamp: 07:38:08/10-24-54
    pages: '42'
    claim: Alleges Lone Star tries to acquire smaller private hospitals to reduce
      DocWagon dependence and complains that wealthier DocWagon Gold/Platinum clients
      may receive priority over wounded officers.
    certainty: unverified in-world institutional allegation
  - speaker: Zingbat
    timestamp: 12:13:03/10-25-54
    pages: '42'
    claim: Argues that tone and word choice make live voice radio superior to minimal
      on-screen dispatch text; says dispatch transmissions echo to patrol-car microphones.
    certainty: technical opinion and alleged practice
  - speaker: Connor
    timestamp: 18:11:00/10-25-54
    pages: '42'
    claim: Alleges a special dispatch code 10-2000 means to switch to land lines when
      radio or cellular channels may be compromised, including by groups or officials
      seeking sensitive information.
    certainty: unconfirmed forum-only code, separate from the published code table
  authority_boundary: All eight items are 2054 in-world fictional Shadowtalk attributed
    to their named speakers; a speaker assertion is not an established Lone Star policy
    or narrator fact. The source-printed dispatch radio-code table is preserved separately.
headline: Fictional Lone Star Dispatch Office Shadowtalk — FASA Corporation, Lone
  Star Sourcebook FASA7115 (1994), printed pp41–42/PDF41–42
summary: Eight named 2054 fictional comments on implant compliance, dispatch automation,
  medical response, voice communication and an alleged additional radio code; uncertainties
  and speaker attribution retained.
