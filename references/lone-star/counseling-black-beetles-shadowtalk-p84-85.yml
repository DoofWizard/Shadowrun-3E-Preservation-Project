data:
  publication: {title: Lone Star Sourcebook, publisher: FASA Corporation, catalog: FASA7115, year: 1994, setting: fictional cyberpunk tabletop role-playing game}
  source_anchors:
    - {printed_page: 84, pdf_page: 92, heading: "DEPARTMENT OF COUNSELING forum begins"}
    - {printed_page: 85, pdf_page: 93, heading: "Continued Counseling/black-beetle Shadowland thread"}
  chronological_speakers:
    - speaker: Jiff
      timestamp: "01:17:48/9-12-54"
      claim: Reacts with ironic approval to the stated counseling services.
      certainty: Sarcastic fictional opinion.
    - speaker: Zig
      timestamp: "00:39:56/9-13-54"
      claim: Suggests Counseling makes its beneficiaries into subjects for Research and Development statistics.
      certainty: Skeptical speaker inference, not proof of human experimentation.
    - speaker: Neon Splatter
      timestamp: "23:09:03/10-1-54"
      claim: Alleges a clandestine Counseling-associated network called the Gray Men used contacts among illegal BTL-chip traffickers to locate people producing recorded lethal simulations, establish off-books experimental operations and study illicit recordings using involuntary or vulnerable subjects. The speaker says the project could have relocated, closed down or concealed evidence, and speculates about future use. Claims to have heard of a relative harmed by these chips; offers no independently verified evidence.
      certainty: Multi-paragraph anonymous 2054 account beginning on p84 and ending p85, mixing hearsay, family anecdote and explicit speculation; not a narrator-certified company program.
    - speaker: Fie
      timestamp: "12:49:00/10-4-54"
      claim: Objects to a suspected lethal-execution use, speculates about disguising punishment as natural medical failure and possible internal cover-up.
      certainty: Rhetorical reaction to Neon Splatter, not a verified corporate plan.
    - speaker: Neon Splatter
      timestamp: "02:36:11/10-5-54"
      claim: Speculates the alleged research could be repurposed as a legal execution mechanism.
      certainty: Hypothesis only.
    - speaker: Sidewinder
      timestamp: "00:04:56/10-6-54"
      claim: Challenges Neon Splatter for withholding corroboration and argues no publicly known new capital-punishment method has been demonstrated.
      certainty: Counter-claim and request for proof.
    - speaker: Neon Splatter
      timestamp: "03:29:55/10-6-54"
      claim: Gives Amazonia as an extremely terse purported clue.
      certainty: Unsupported single-word assertion.
    - speaker: Jo
      timestamp: "11:07:13/10-6-54"
      claim: Questions whether the single-word reply provides meaningful explanation.
      certainty: Challenge.
    - speaker: Neon Splatter
      timestamp: "23:57:09/10-6-54"
      claim: Refuses to elaborate on the alleged clue and invites the readers to speculate.
      certainty: No verification offered.
    - speaker: Sidewinder
      timestamp: "01:27:09/10-7-54"
      claim: Says the implication is unwelcome after considering it.
      certainty: Emotional reaction, not factual corroboration.
    - speaker: IMHO
      timestamp: "09:15:08/10-7-54"
      claim: Asks others to explain the alleged black-beetle or black-BTL technology.
      certainty: Clarification request.
    - speaker: Victoria Secret
      timestamp: "13:10:52/10-7-54"
      claim: Describes an alleged Atlanta-origin black-market simulation format built around an actual person's death, with sensory recordings processed and distributed on modified chips. The speaker contrasts illicit lethal recordings with ordinary sim entertainment, but the production history and mechanism are not independently verified.
      certainty: In-world secondhand technical and marketing account; not a real-world instruction.
    - speaker: IMHO
      timestamp: "10:51:26/10-8-54"
      claim: Responds with disbelief and revulsion.
      certainty: Reaction.
    - speaker: pH
      timestamp: "17:16:11/10-10-54"
      claim: Gives an elaborate in-universe comparison of mainstream legal dreamchips, illegally modified Better-Than-Life and lethal black-BTL recordings. The speaker alleges high-intensity sensory overstimulation, addictive use, damage to brain and autonomic functions, an approximately eight-percent first-exposure fatality rate, and other outcomes including psychosis, severe paranoia, phobia and personality change. Also speculates about why users seek such recordings.
      certainty: Pseudonymous lore and estimates only; the 8 percent figure is not a verified medical statistic.
  interpretation_boundaries:
    - No named comment establishes that Lone Star actually ran lethal chip experiments, manufactured black BTL recordings, employed the Gray Men as claimed or developed capital-punishment technology.
    - The in-world speakers describe coercive abuse and dangerous illegal simulations; no source statement shows informed consent from affected subjects.
    - Keep the source's 2054 chronology, hearsay status, speaker responses and contrasts among ordinary dreamchips, modified BTL chips and alleged lethal recordings.
    - The fictional descriptions are archival setting commentary, not present-day neuroscience, medicine, criminology, or manufacturing directions.
