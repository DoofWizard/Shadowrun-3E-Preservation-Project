data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog_number: FASA7115
    publication_year: 1994
    edition_context: Original and Second Edition Shadowrun historical tabletop RPG setting
    fictional_setting_period: Dated 2054 in-world forum discussion
  source_anchors:
    - {printed_page: 78, pdf_page: 78, section: Juvenile commentary following the Penology brainlock discussion}
    - {printed_page: 79, pdf_page: 79, section: Juveniles in the System; Legal Recourse; Making Bail}
    - {printed_page: 80, pdf_page: 80, section: Making Bail shadowtalk}
  claims:
    - speaker: Canary
      timestamp: 16:55:54/9-10-54
      printed_page: 78
      assertion: Challenges the fairness of assigning full adult culpability to a minor for unanticipated consequences and warns that this reasoning could implicate many adults.
      status: Normative in-world opinion.
    - speaker: Childe Harold
      timestamp: 11:05:17/9-9-54
      printed_page: 79
      assertion: Calls juvenile detention abusive and alleges some youths prefer adult high-security prisons; contests the reform-school rationale.
      status: Speaker testimony and hyperbole, not narrator-certified prison conditions.
    - speaker: Cassandra
      timestamp: 04:08:29/9-6-54
      printed_page: 79
      assertion: Argues that violent crime is increasing across categories, disputing that the source narrator's youth-crime trend is exceptional.
      status: Dissenting in-world interpretation, not a verified statistic.
    - speaker: Legal Beagle
      timestamp: 09:05:08/9-5-54
      printed_page: 79
      assertion: Alleges increasing adult prosecution of juvenile offenders where violence and weapons are involved; sharply criticizes lenient treatment.
      status: Speaker assertion about judicial practice and attitude, not established universal policy.
    - speaker: Carruthers
      timestamp: 15:33:01/9-7-54
      printed_page: 79
      assertion: Argues that serious group sexual assault by fifteen-year-olds deserves comparable punishment to sexual assault committed by adults.
      status: Fictional speaker's punitive opinion; the cited conduct is not a documented event in this source section.
    - speaker: Hades
      timestamp: 09:27:46/9-13-54
      printed_page: 79
      assertion: Replies that powerful or corrupt public officials also take advantage of legal protections described in the narrator's common-law discussion.
      status: Satirical in-world claim.
    - speaker: Army Brat
      timestamp: 13:21:31/9-15-54
      printed_page: 79
      assertion: Warns that the legal commentary is limited to British-derived common-law countries and may differ from Québec's Napoleonic-code tradition and laws of individual NAN states.
      status: Jurisdictional qualifier attributed to the speaker.
    - speaker: Monster
      timestamp: 09:04:48/9-21-54
      printed_page: 79
      assertion: Cynically portrays payment of bail as sufficient to avoid further contact with the legal process.
      status: Opinion, not legal advice or confirmed outcome.
    - speaker: Legal Beagle
      timestamp: 21:44:18/9-22-54
      printed_page: 79
      assertion: Disputes Monster, claiming judges may set bond amounts from tens of thousands to millions of nuyen or deny bail for sufficiently serious charges; invokes the constitutional prohibition on excessive bail.
      status: Fictional jurisdiction-specific legal commentary rather than universal current law.
    - speaker: Binky
      timestamp: 17:56:39/9-25-54
      printed_page: 79
      assertion: Suggests consulting a bondsman as a possible financial intermediary while awaiting trial.
      status: In-world suggestion, not real-world advice.
    - speaker: Nuyen Nick
      timestamp: 12:09:03/9-26-54
      printed_page: 80
      assertion: Gives a hypothetical 200,000-nuyen bond and 20,000-nuyen cash-on-hand example; describes a bondsman posting the bond in return for a nonrefundable 10-percent charge and alleges some may charge 20 percent or higher in riskier cases.
      status: Speaker illustration, not a narrator-established universal fee schedule or genuine offer.
    - speaker: Thorson
      timestamp: 14:15:00/9-28-54
      printed_page: 80
      assertion: Alleges that bond agents can pressure or forcibly recover nonappearing defendants; predicts severe consequences for those who miss hearings.
      status: Unverified in-world accusation, not an endorsed practice.
    - speaker: Outaluck
      timestamp: 14:24:21/9-30-54
      printed_page: 80
      assertion: Wonders what happens when an accused person cannot afford even the cited ten-percent fee.
      status: Question.
    - speaker: Munchkin
      timestamp: 18:02:26/9-30-54
      printed_page: 80
      assertion: Claims some bondsmen extend credit against possessions, demand fees and interest beyond ten percent, and may speculate on repayment.
      status: Allegation, not contractual or legal documentation.
    - speaker: Tolly
      timestamp: 22:08:18/10-3-54
      printed_page: 80
      assertion: Gives an anecdote about a 100,000-nuyen bond followed by years of debt, alleging total repayment of more than 250,000 nuyen.
      status: First-person debt account, uncorroborated.
    - speaker: Ugly Truth
      timestamp: 04:56:21/10-6-54
      printed_page: 80
      assertion: Claims Seattle Lone Star controlled the local bail-bond business beginning in 2051 and charged a five-percent processing fee on returned bonds, blaming institutional profit incentives.
      status: Specific in-world corporate-control allegation, not a narrator-established fact.
    - speaker: On the Docket
      timestamp: 08:22:25/10-7-54
      printed_page: 80
      assertion: Responds skeptically to the preceding allegations.
      status: Dissenting reaction.
    - speaker: SysOp
      timestamp: 10:21:24/10-7-54
      printed_page: 80
      assertion: Redirects the discussion to its original topic as the Department of Parole and Probation heading begins.
      status: Forum moderation comment; does not itself establish parole policy.
  authority_boundary: Speaker claims, hypotheticals, normative positions and humor remain distinct from the fictional sourcebook narrator's Juveniles in the System and Legal Recourse descriptions.
headline: >-
  Fictional Shadowrun juvenile justice and bail commentary — FASA Corporation Lone Star Sourcebook FASA7115 (1994), printed pp78–80/PDF78–80
summary: >-
  Eighteen speaker-attributed 2054 fictional observations and allegations, distinct from the published book-narrator legal descriptions.
