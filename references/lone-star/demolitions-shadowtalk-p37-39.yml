data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog_number: FASA7115
    publication_year: 1994
    fictional_game: Shadowrun tabletop roleplaying game
    historical_edition: Original/Second Edition-compatible; not revised into Third
      Edition
  source_anchors:
  - printed_page: 37
    pdf_page: 37
    heading: Department of Demolitions Shadowtalk begins
  - printed_page: 38
    pdf_page: 38
    heading: Department of Demolitions continuing speakers and equipment claims
  - printed_page: 39
    pdf_page: 39
    heading: Final Demolitions responses precede Riot Control
  messages:
  - speaker: Axel
    timestamp: 09:20:26/9-9-54
    printed_page: 37
    assertion: Jokes about an improbable small nuclear device supposedly associated
      with cigarette lighters.
    certainty: Sarcastic fictional comment, not evidence of a working weapon.
  - speaker: Gunhead
    timestamp: 21:37:00/9-10-54
    printed_page: 37
    assertion: Disputes the joke's full exaggeration while claiming the fictional
      UCAS military has a new explosive designated C16; the printed message includes
      the fragment "1.8 MP" followed by an explicit SYSOP deletion in place of technical
      information; its missing mathematical and chemical discussion is not available.
    certainty: Attributed equipment assertion and visibly redacted source; missing
      detail cannot be reconstructed.
  - speaker: SysOp
    timestamp: 23:06:21/9-10-54
    printed_page: 37
    assertion: Says a previous forum message's arithmetic and chemical analysis were
      removed, and claims the proposed C16 effect remains exceptionally destructive.
    certainty: In-world moderation action with removed text not present in the source.
  - speaker: Yonda
    timestamp: 07:18:29/10-14-54
    printed_page: 37
    assertion: Reports spending the first twenty-two years of life in an elven ghetto,
      seeing no police bomb-squad response despite repeated incendiary attacks by
      human supremacists on homes and communal buildings.
    certainty: Serious first-person in-world allegation of discriminatory neglect;
      not independently verified and not equated with the narrator's general policy.
  - speaker: Maxine
    timestamp: 17:25:31/10-17-54
    printed_page: 37
    assertion: Contrasts Yonda's report with an allegation that a suspected abandoned
      shopping bag in a corporate enclave can elicit a rapid, highly armored bomb-squad
      response.
    certainty: Critical hypothetical/anecdotal contrast, not a universal policy.
  - speaker: Monkteith
    timestamp: 21:30:09/10-18-54
    printed_pages:
    - 37
    - 38
    assertion: Responds to a question about deadly leftover explosives, portraying
      bomb-disposal volunteers as daring and skilled; alleges these personnel use
      heavy armor, disposal drones and occasionally summoned elementals, especially
      water elementals.
    certainty: Speaker's fictional equipment and personnel description; not game statistics
      or verified universal departmental inventory.
  - speaker: SPD
    timestamp: 21:32:25/10-20-54
    printed_page: 38
    assertion: Defines UXB as UneXploded Bomb and argues bomb-disposal specialists
      take pride in their difficult work while facing fewer failures than outsiders
      expect.
    certainty: In-world terminology and favorable evaluation; no validated casualty
      rate.
  - speaker: Davitt
    timestamp: 09:35:49/10-21-54
    printed_page: 38
    assertion: Asks how Lone Star can fund the dermal-plating augmentation allegedly
      common among some disposal personnel.
    certainty: Question based on an unverified premise.
  - speaker: X-Star
    timestamp: 13:41:07/10-24-54
    printed_page: 38
    assertion: Replies that the alleged augmented personnel may be sufficiently few
      for Lone Star to afford substantial protection for each.
    certainty: Speculative resource explanation, not a budget figure.
  - speaker: Audrey
    timestamp: 06:11:48/10-30-54
    printed_page: 38
    assertion: Reports seeing magical elementals accompany bomb squads without observing
      a magically active officer among the responders, questioning who provides that
      support.
    certainty: Personal anecdote and question, not proof of universal staffing.
  - speaker: Kris
    timestamp: 13:28:05/11-1-54
    printed_page: 38
    assertion: Speculates that Lone Star's Demolitions Department retains or borrows
      magicians who summon elementals for certain local teams, with arrangements varying
      by city.
    certainty: In-world hypothesis; specific contracts are not established.
  - speaker: Dingo
    timestamp: 04:00:52/11-3-54
    printed_page: 38
    assertion: Asks whether the Seattle explosives-disposal team has acquired a newly
      announced device.
    certainty: Question, not evidence of deployment.
  - speaker: Slider
    timestamp: 06:56:08/11-3-54
    printed_page: 38
    assertion: Identifies the device as Booby-One, a small rigger-operated disposal
      drone with sophisticated imaging, two articulated arms and blast shielding;
      says the rigger usually operates it by fiber link; the drone is slower than
      a human operator but protected by shielding, and its use is limited by responders
      confirming the character of the suspected explosive. The speaker describes deployment
      only in a controlled, evacuated fictional incident, without supplying a game
      rule.
    certainty: Attributed fictional equipment description, not a canonical stat line
      or an instructional disposal procedure.
  - speaker: Diamondback
    timestamp: 12:06:10/11-7-54
    printed_page: 38
    assertion: Describes a supposed Austin trial of a firetrack net, an experimental
      system combining microwave radar and laser tracking stations for detection of
      launched missiles or rockets; alleges a beta-test network can recognize a launch,
      follow its trajectory, and pass an alert to bound air elementals that may stop
      the projectile. The speaker says the system is expensive and that several AAA
      megacorporations are funding development, and predicts possible wider deployment
      in three years; this is not a verified missile-defense capability.
    certainty: Speaker's unverified technical and funding claims and forecast; not
      narrator-established capability or game mechanics.
  - speaker: Laguna Gloria
    timestamp: 07:42:36/11-8-54
    printed_page: 38
    assertion: Asks whether the alleged firetrack trial caused a recent explosion
      above Duval Street.
    certainty: Speculative question; cause of an explosion is not established.
  - speaker: Alchemy
    timestamp: 09:47:08/11-8-54
    printed_page: 38
    assertion: Questions whether downtown missile-launch defense justifies firetrack's
      expense, noting the apparently unlikely threat in the corporate core.
    certainty: Speaker's policy skepticism.
  - speaker: Texas Thunderstorm
    timestamp: 03:54:00/11-9-54
    printed_page: 39
    assertion: Predicts Lone Star might license firetrack technology to corporations
      for their enclaves and facilities after the Austin prototype trials, affecting
      the shadow economy and covert operations in the future.
    certainty: Future commercial and campaign prediction, not established later deployment.
  - speaker: Smilin' Steve
    timestamp: 05:29:27/11-10-54
    printed_page: 39
    assertion: Responds that Austin's location beside the Texas/Aztlan border makes
      a hypothetical explosive-rocket attack from across that frontier on Lone Star
      headquarters conceivable, in the speaker's opinion.
    certainty: Speaker threat speculation, not narrator-confirmed attack planning.
  source_boundary: These are separately attributed fictional reader comments and guesses,
    not narrator-certified technology specifications, world military facts, current
    real-world advice, or Shadowrun Third Edition weapon rules. The fictional UCAS
    C16 detailed technical text was explicitly redacted by the source and must remain
    unknown.
