  comments:
  - speaker: Control
    timestamp_as_printed: 11:58:42/9-8-54
    printed_page: 72
    pdf_page: 72
    assertion: Introduces the Penal Theory subject by saying the writer knows little
      and has asked an associate, Birdman, to provide background on what happens in
      the UCAS and CAS corrections system.
    certainty: First-person editorial introduction, not an omniscient legal conclusion.
  - speaker: Freebird
    timestamp_as_printed: 12:04:28/9-13-54
    printed_page: 72
    pdf_page: 72
    assertion: Offers to discuss personal experience with Aztlan’s justice system
      when released from custody.
    certainty: Personal prospective testimony, details and eventual release not established.
  - speaker: Capricorn
    timestamp_as_printed: 12:56:50/9-9-54
    printed_page: 72
    pdf_page: 72
    assertion: Rejects the discussion of imprisonment and says the speaker intends
      to avoid incarceration, even at grave personal risk.
    certainty: Speaker’s extreme personal stance; not book advice.
  - speaker: SPD
    timestamp_as_printed: 03:07:42/9-11-54
    printed_page: 72
    pdf_page: 72
    assertion: Argues that law-enforcement tools can incapacitate fleeing offenders
      and warns that imprisonment is a real possibility for shadowrunners; describes
      the Neuro-Stun line as difficult to detect.
    certainty: Dated in-world opinion and equipment allegation; no verified operational
      procedure.
  - speaker: Mickey Finn
    timestamp_as_printed: 17:32:00/9-11-54
    printed_page: 72
    pdf_page: 72
    assertion: Says learning about prisons might be useful if hired to locate or rescue
      someone held there.
    certainty: Speculative future job, not completed event.
  - speaker: Neon Splatter
    timestamp_as_printed: 06:50:39/9-13-54
    printed_page: 72
    pdf_page: 72
    assertion: Responds that a recovered captive might require help after purported
      psychological rehabilitation methods.
    certainty: Speculation and concern, no verified victim outcome.
  - speaker: Bookworm
    timestamp_as_printed: 13:56:08/9-12-54
    printed_page: 72
    pdf_page: 72
    assertion: Claims historical feudal Japanese authorities frequently used death
      as punishment for infractions against their rule.
    certainty: Speaker’s historical assertion, not corroborated independently.
  - speaker: Bookworm
    timestamp_as_printed: 13:57:49/9-12-54
    printed_page: 73
    pdf_page: 73
    assertion: Adds a general assertion that amputation persisted as punishment in
      multiple nations.
    certainty: Historical speaker claim without specific independent sources.
  - speaker: Vargas
    timestamp_as_printed: 09:18:27/9-10-54
    printed_page: 73
    pdf_page: 73
    assertion: Relates an anecdote of a person given three life sentences for a lethal
      attack, stresses the sentences allegedly ran concurrently rather than consecutively,
      reports parole eligibility after four years, and says the person later committed
      a similar offense after release.
    certainty: Unverified personal anecdote; source does not establish a universal
      sentencing rule.
  - speaker: Jobim
    timestamp_as_printed: 17:09:18/9-13-54
    printed_page: 74
    pdf_page: 74
    assertion: Proposes a brutal hypothetical reduction of the prison population through
      preventable prisoner deaths and commercialized broadcasting.
    certainty: Violent fictional forum rhetoric; not narrator-sanctioned policy or
      real-world instructions.
  - speaker: Head Screw
    timestamp_as_printed: 21:58:24/9-15-54
    printed_page: 74
    pdf_page: 74
    assertion: Replies that the speaker has considered Jobim’s violent proposition.
    certainty: Unverified boast, not proof of official adoption.
  - speaker: Antonia
    timestamp_as_printed: 00:35:17/9-9-54
    printed_page: 74
    pdf_page: 74
    assertion: Claims the transfer of appeal cases imposes costs on lower governments
      and that appellants may receive time-served credit even when an appeal fails;
      speculates that a sentence might expire before federal imprisonment.
    certainty: Speaker interpretation of fictional correctional bureaucracy, not a
      universal legal rule.
  - speaker: Jobim
    timestamp_as_printed: 17:09:56/9-13-54
    printed_page: 74
    pdf_page: 74
    assertion: Dismisses rehabilitative self-esteem workshops as wasted effort and
      disparages prisoners.
    certainty: Speaker opinion, not prison-program evidence.
  - speaker: Madame G
    timestamp_as_printed: 11:31:47/9-14-54
    printed_page: 74
    pdf_page: 74
    assertion: Claims capital punishment necessarily prevents an executed individual
      from reoffending.
    certainty: A hostile opinion in a fictional forum, not endorsement.
