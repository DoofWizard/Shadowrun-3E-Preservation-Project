  - speaker: X-Star
    timestamp: 03:16:38/9-29-54
    printed_page: 70
    pdf_page: 70
    assertion: Claims Internal Affairs originally existed to keep officers in line
      but now protects corporate interests, selectively pursues abuse complaints and
      can fire or transfer officers, control investigations and seize evidence. The
      speaker claims Lone Star’s extraterritorial status shields its personnel from
      government enforcement on corporate property, while federal agencies and military
      could theoretically intervene. Ends by questioning who genuinely oversees the
      corporation.
    certainty: Long polemical fictional Shadowland accusation, not book-narrator-certified
      law or internal policy.
  source_boundary: No uncorrupted narrator description of Internal Affairs is available
