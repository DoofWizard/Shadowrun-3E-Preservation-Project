  scope: Dated fictional speaker posts responding to sourcebook narrator. Speaker allegations and
    quips are not legal rules.
  comments:
  - speaker: Zuzu
    timestamp: 07:14:52/9-6-54
    section: Deathbed Statement
    claim: Raises concern about potential abuse of special dying-witness evidence procedures.
  - speaker: Ghoul Anonymous
    timestamp: 16:09:41/9-9-54
    section: Deathbed Statement
    claim: Offers an ominous and non-specific reply implying that a speaker could ensure the contested
      death condition. This is fictional insinuation, not a confirmed incident.
  - speaker: Torpedo
    timestamp: 21:31:54/9-10-54
    section: Searches
    claim: Claims corporate extraterritoriality means only a megacorporation’s own security force
      may search and seize on its property; disputes the completeness of the narrator’s simple division
      of jurisdiction.
  - speaker: SPD
    timestamp: 12:39:59/10-25-54
    section: Obtaining a Search Warrant
    claim: Alleges that ostensibly neutral judicial warrants are frequently signed through familiar
      judges and contacts in Lone Star jurisdictions, and criticizes the institutional independence
      of such authorizations.
