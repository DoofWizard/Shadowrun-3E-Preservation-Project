data:
  publication:
    title: Lone Star Sourcebook
    publisher: FASA Corporation
    catalog_number: FASA7115
    year: 1994
    setting: Fictional Shadowrun tabletop-roleplaying game Shadowland discussion; the named speakers are in-world personas, not verified real people.
  section: Behind the Star
  attribution_policy: The posts are competing in-world speakers' positions, not neutral book-narrator findings, official rules, or real-world allegations.
  posts:
    - speaker: Control
      printed_timestamp: 11:44:45/9-1-54
      position: Control describes the dossier as containing information on fictional Lone Star corporate structure and basic procedures that in-world readers may consider helpful when encountering the company.
    - speaker: Wolf
      printed_timestamp: 03:09:16/9-5-54
      position: Wolf alleges that serious wrongdoing occurs inside fictional Lone Star; the post supplies an accusation, not corroborated examples.
    - speaker: SPD
      printed_timestamp: 12:47:59/9-5-54
      position: SPD contrasts police conduct in the fictional setting with the earlier public-service slogan about serving and protecting, suggesting the institution has changed.
    - speaker: Thelma
      printed_timestamp: 13:52:42/9-6-54
      position: Thelma argues that fictional Lone Star should be understood as a corporation answerable to directors and shareholders and driven partly by share prices, dividends, and investment returns, comparing it to Renraku corporate security rather than assuming it is different merely because it performs policing.
    - speaker: Hulk
      printed_timestamp: 15:43:31/9-6-54
      position: Hulk acknowledges Lone Star's corporate profit incentive but argues that its purchased service is law enforcement, peacekeeping, and bringing offenders to justice, with a protective public purpose that might distinguish it from other corporations.
    - speaker: Thelma
      printed_timestamp: 19:10:03/9-6-54
      position: Thelma responds that Renraku's armed security representatives could also invoke peacekeeping or enforcement as a justification, so the stated service does not alone resolve the motivation or trustworthiness dispute.
    - speaker: Margeson
      printed_timestamp: 23:01:12/9-6-54
      position: Margeson tentatively distinguishes Lone Star enforcing Seattle law from Renraku enforcing corporate law, while questioning whether the distinction is ultimately meaningful.
    - speaker: Candi
      printed_timestamp: 08:58:46/9-7-54
      position: Candi argues that effectiveness in maintaining order matters more than whether the fictional corporation is motivated by public-service ideals or commercial incentives; the post is a character's judgment, not a factual conclusion.
    - speaker: Cast-Iron Rationalist
      printed_timestamp: 19:20:03/9-7-54
      position: Cast-Iron Rationalist disputes Candi's equivalence by arguing that motives change conduct. The post poses a hypothetical in which a fictional Florence Nightingale responds to attempted theft of drugs by recommending a twelve-step NarcAnon program, whereas a DocWagon team responds to a comparable attempted theft with lethal gunfire. These are the speaker's hypothetical claims, not established incidents or procedural advice.
