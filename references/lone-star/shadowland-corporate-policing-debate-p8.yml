headline: 'FASA Lone Star Sourcebook (FASA7115, 1994 original/Second Edition): conflicting fictional Shadowland voices on corporate policing, printed p8/PDF8'
summary: 'FASA Corporation’s 1994 fictional Shadowrun tabletop RPG Lone Star Sourcebook, FASA7115, printed p8/PDF8: named in-world speakers disagree about the Lone Star corporation’s profits, duty, conduct, Seattle-versus-corporate law, and motivations. Rhetoric and hypothetical harm remain specifically attributed.'
