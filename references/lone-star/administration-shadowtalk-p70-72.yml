data:
  publication:
    title: Lone Star Sourcebook
    publisher: FASA Corporation
    catalog: FASA7115
    publication_year: 1994
    edition: historical Shadowrun original/Second Edition (p5 compatibility statement)
    medium: fictional cyberpunk tabletop role-playing game
  source_anchors:
  - printed_page: 70
    pdf_page: 70
    heading: Administration introduction and dated reactions
  - printed_page: 71
    pdf_page: 71
    heading: Public Relations, Personnel and Records Shadowland comments
  - printed_page: 72
    pdf_page: 72
    heading: Renton Rob comment continued from Records, before DIVISION OF PENOLOGY
  comments:
  - speaker: Jackhammer
    timestamp: 03:19:46/9-25-54
    printed_page: 70
    pdf_page: 70
    assertion: Expresses relief that a lengthy technical-program description is omitted
      from the Administration file.
    certainty: Speaker reaction, not narrator fact.
  - speaker: Duey Decimal
    timestamp: 18:36:27/9-29-54
    printed_page: 70
    pdf_page: 70
    assertion: Teases the previous speaker about losing patience with supposedly tedious
      information.
    certainty: Humorous rejoinder.
  - speaker: Puget Deb
    timestamp: 12:36:10/10-1-54
    printed_page: 70
    pdf_page: 70
    assertion: Complains about a Lone Star traffic citation outside what the commenter
      believed was its municipal patrol boundary.
    certainty: Personal unverified jurisdiction complaint.
  - speaker: Fontaine
    timestamp: 10:35:42/9-27-54
    printed_page: 71
    pdf_page: 71
    assertion: Claims Lone Star hires well-paid public relations personnel from rival
      megacorporations, including recruits from Madison Avenue and Ginza; contrasts
      polished corporate spin with crude policing.
    certainty: Speaker’s hiring and public-relations allegation.
  - speaker: Lizard
    timestamp: 23:41:19/9-28-54
    printed_page: 71
    pdf_page: 71
    assertion: Accuses Lone Star PR of recasting harmful incidents into benign public
      narratives, using deliberately absurd metaphors.
    certainty: Hostile speaker interpretation and hyperbole.
  - speaker: Doe
    timestamp: 16:40:54/10-1-54
    printed_page: 71
    pdf_page: 71
    assertion: Asks why the company needs a public relations department if it claims
      to operate as police.
    certainty: Question and implied criticism.
  - speaker: Codger
    timestamp: 19:56:38/10-1-54
    printed_page: 71
    pdf_page: 71
    assertion: Replies that Lone Star is a corporation presenting itself as police
      and cites a historical LAPD incident involving a minor videotaping complaint
      as an analogy.
    certainty: Speaker’s political judgment and retrospective analogy, not narrator
      proof.
  - speaker: Zig
    timestamp: 04:26:05/10-2-54
    printed_page: 71
    pdf_page: 71
    assertion: Asks what the Personnel Department’s employee slide number signifies.
    certainty: Question without established answer.
  - speaker: Chili
    timestamp: 13:56:20/10-2-54
    printed_page: 71
    pdf_page: 71
    assertion: Claims each employee slide number maps to a cryopreserved tissue sample
      allegedly maintained by Lone Star for injury matching or tissue cultivation.
    certainty: Unverified fictional tissue-bank claim.
  - speaker: Full of Questions in Chicago
    timestamp: 16:00:36/10-5-54
    printed_page: 71
    pdf_page: 71
    assertion: Says private biotechnology firms maintain tissue catalogs and questions
      why employees would need this kind of inventory; speculates about future transplant
      demand.
    certainty: Speaker report and inquiry, not verified corporate policy.
  - speaker: Rest
    timestamp: 13:27:07/10-12-54
    printed_page: 71
    pdf_page: 71
    assertion: Alleges tissue samples are maintained as magical material links to
      company employees; questions the viability and shelf life of that theory and
      claims employees would be expected to fear their use.
    certainty: Unverified in-world magical conspiracy claim, not book-narrator-certified
      policy.
  - speaker: Figaro
    timestamp: 02:56:09/10-13-54
    printed_page: 71
    pdf_page: 71
    assertion: Asks whether five black marks would also remove an employee from non-enforcement
      positions such as Internal Affairs.
    certainty: Question; no narrator ruling.
  - speaker: Book
    timestamp: 00:13:19/10-5-54
    printed_page: 71
    pdf_page: 71
    assertion: Says reprimands remain in records, comparing employee dossiers to persistent
      computer files or zombie documents.
    certainty: Speaker metaphor about record retention.
  - speaker: Margeson
    timestamp: 11:15:54/10-6-54
    printed_page: 71
    pdf_page: 71
    assertion: Speculates that a victim of an abusive officer might fabricate enough
      official black-mark complaints to have the officer removed from service.
    certainty: Speaker hypothetical, not verified mechanism or instruction.
  - speaker: Waitasec
    timestamp: 13:15:56/10-6-54
    printed_page: 71
    pdf_page: 71
    assertion: Expresses surprise that the company also sells insurance.
    certainty: Question, no independent verification.
  - speaker: Codger
    timestamp: 13:35:41/10-6-54
    printed_page: 71
    pdf_page: 71
    assertion: Claims Lone Star sells insurance under law-enforcement contracts to
      those able to pay and profits from that arrangement.
    certainty: Speaker claim about corporate business incentives.
  - speaker: Renton Rob
    timestamp: 08:37:03/9-15-54
    printed_page: 71
    pdf_page: 71
    assertion: Claims Lone Star arrested a Tir Tairngire molecular biologist who had
      reportedly lived quietly in Seattle on seventeen fictional murder counts. Says
      a Tir extradition request signed by Prince Aithne Oakforest alleges the scientist
      unlawfully experimented on and killed seventeen of his own patients; the scientist
      denies the charges and says the Tir wants him imprisoned because he refused
      a military request to help develop a biological weapon involving a deadly mutated
      human-only strain of HMHVV. The speaker speculates corporate access to records
      might allow false charges and suppression of a refugee scientist's testimony.
      None of these allegations is established independently by the book narrator.
    certainty: Extended contested in-world case report, carrying specific charges,
      alleged coercive military request, the scientist’s denial, and the speaker’s
      conspiracy suspicion; not an actual real-world case.
  cross_page_boundary: The final Renton Rob contribution begins beneath Records on
    printed p71 and continues at the top of printed p72. It is one speaker’s disputed
    story, not two separate events. The Division of Penology and its subsequent commentary
    begin lower on p72 and remain outside this Administration slice.
  speaker_policy: Maintain speaker-attributed speculation, disagreement, gender-neutral
    third-person reference, denial of the scientist, and the distinction between alleged
    involuntary experiments and voluntary consent. Do not treat forum remarks as official
    corporate policy, real-world medical information or instructions.
headline: Fictional Shadowrun Administration Shadowland discourse — FASA Corporation
  Lone Star Sourcebook (FASA7115, 1994), original/Second Edition, printed pp70–72/PDF70–72
summary: Seventeen named fictional 2054 speaker comments on PR, personnel slide numbers,
  unverified biological and magical claims, reprimands, insurance and the disputed
  Tir scientist case; no promotion to narrator facts. FASA Lone Star pp70–72/PDF70–72.
