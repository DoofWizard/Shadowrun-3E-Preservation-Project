data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog_number: FASA7115
    publication_year: 1994
    franchise: Shadowrun
    setting_type: fictional cyberpunk tabletop role-playing game
    edition: historical original/Second Edition material; no automatic Third Edition
      supersession
  source_anchors:
  - printed_page: 76
    pdf_page: 76
    section: Hi-Res description and competing origin claims
  - printed_page: 77
    pdf_page: 77
    section: Iron Jim report, legality, reversal and memory questions
  - printed_page: 78
    pdf_page: 78
    section: continued debate, speculative imprisonment and alleged implants, ending
      before JUVENILES IN THE SYSTEM
  comments:
  - speaker: Hi-Res
    timestamp_as_printed: 23:22:49/9-20-54
    printed_page: 76
    pdf_page: 76
    assertion: Claims knowledge of a new fictional conditioning system called brainlock,
      allegedly restricted to some prisons or rehabilitation centers; distinguishes
      broad response categories from narrow stimuli and gives hypothetical effects
      on movement or weapon perception.
    certainty: Unverified claimed technical description, not a rules statistic or
      proven practice.
  - speaker: Kumiko
    timestamp_as_printed: 23:58:41/9-20-54
    printed_page: 76
    pdf_page: 76
    assertion: Asks how the proposed brainlock system works.
    certainty: Question, not a factual endorsement.
  - speaker: Mariposa
    timestamp_as_printed: 03:51:54/9-21-54
    printed_page: 76
    pdf_page: 76
    assertion: Alleges Lone Star tightly compartmentalizes brainlock information and
      even its Division of Psychology does not share it company-wide.
    certainty: Organizational secrecy rumor.
  - speaker: Laguna Gloria
    timestamp_as_printed: 16:27:10/9-21-54
    printed_page: 76
    pdf_page: 76
    assertion: Claims Lone Star R&D is using industrial espionage to obtain information
      from its own Psychology division.
    certainty: Unverified speaker allegation, not independently established corporate
      conduct.
  - speaker: The Other Guy
    timestamp_as_printed: 18:22:15/9-21-54
    printed_page: 76
    pdf_page: 76
    assertion: Disputes that DivPsych created the technique and says the firm instead
      licensed it from Renraku along with other unspecified cognitive technology.
    certainty: Claim of external source licensing; conflicts with assumptions of internal
      invention.
  - speaker: Stylin'
    timestamp_as_printed: 18:52:34/9-21-54
    printed_page: 76
    pdf_page: 76
    assertion: Questions why Renraku Computer Systems would have developed such technology
      in the first place.
    certainty: Question only.
  - speaker: Flashpoint
    timestamp_as_printed: 19:30:15/9-21-54
    printed_page: 77
    pdf_page: 77
    assertion: Repeats the request for a coherent technical explanation of brainlock.
    certainty: No established answer implied.
  - speaker: Anonymous
    timestamp_as_printed: 16:44:19/9-28-54
    printed_page: 77
    pdf_page: 77
    assertion: Reports that an associate nicknamed Iron Jim was detained after a failed
      run, moved from Metroplex Prison to a Lone Star Seattle interrogation facility,
      later found severely disoriented and terrified; believes, but cannot independently
      prove, he was subjected to brainlock, and reports the person has not recovered.
    certainty: Speaker’s first-person rescue aftermath and inference, not clinical
      diagnosis or narrator-established detention facts.
  - speaker: Raz
    timestamp_as_printed: 22:58:52/9-28-54
    printed_page: 77
    pdf_page: 77
    assertion: Claims the case shows Lone Star used brainlock before Iron Jim received
      a trial.
    certainty: Secondhand inference from the anonymous account, not a verified legal
      finding.
  - speaker: Alan D
    timestamp_as_printed: 00:21:44/9-29-54
    printed_page: 77
    pdf_page: 77
    assertion: Condemns the alleged pretrial practice as illegal and unconstitutional.
    certainty: Legal opinion predicated on unverified allegation.
  - speaker: Berger Buddy
    timestamp_as_printed: 03:10:18/9-29-54
    printed_page: 77
    pdf_page: 77
    assertion: Questions whether a person voluntarily living without a SIN receives
      constitutional protections in the fictional society.
    certainty: Provocative in-world legal question, not source narrator ruling.
  - speaker: SPD
    timestamp_as_printed: 04:48:42/9-30-54
    printed_page: 77
    pdf_page: 77
    assertion: Questions whether the anonymous friend targeted Lone Star or an affiliated
      business on the failed run.
    certainty: Speculative causal question.
  - speaker: SPD
    timestamp_as_printed: 03:35:00/10-3-54
    printed_page: 77
    pdf_page: 77
    assertion: Requests a reply from the anonymous witness.
    certainty: Unanswered follow-up.
  - speaker: Anonymous
    timestamp_as_printed: 16:00:54/10-4-54
    printed_page: 77
    pdf_page: 77
    assertion: Says an Ares contract led the group to attempt a GridSec facility intrusion;
      the speaker does not say that this authorized any alleged coercive treatment.
    certainty: Self-reported client/job claim, not externally confirmed.
  - speaker: SPD
    timestamp_as_printed: 06:30:53/10-5-54
    printed_page: 77
    pdf_page: 77
    assertion: Suggests the preceding report implies the firm may employ such techniques
      more broadly in the future and urges caution.
    certainty: Prediction, not established scope.
  - speaker: The Cat
    timestamp_as_printed: 09:56:02/10-6-54
    printed_page: 77
    pdf_page: 77
    assertion: Asks whether brainlock effects can be reversed.
    certainty: Question.
  - speaker: Pamela
    timestamp_as_printed: 05:02:20/10-7-54
    printed_page: 77
    pdf_page: 77
    assertion: Claims no proven reversal exists within her knowledge; speculates advanced
      clinical access could help but warns attempted reversal might worsen psychiatric
      effects and that forced repeated exposure could be traumatic.
    certainty: Qualified and contested fictional in-world claim, not medical or rehabilitation
      instructions.
  - speaker: Monty
    timestamp_as_printed: 08:35:05/10-7-54
    printed_page: 77
    pdf_page: 77
    assertion: Interprets Pamela’s suggested approach as torture.
    certainty: Ethical reaction, not a proven treatment.
  - speaker: Pamela
    timestamp_as_printed: 06:01:55/10-8-54
    printed_page: 77
    pdf_page: 77
    assertion: Agrees that the suggested approach is torturous.
    certainty: Explicit agreement.
  - speaker: Doc Oz
    timestamp_as_printed: 11:45:34/10-8-54
    printed_page: 77
    pdf_page: 77
    assertion: Compares recovering a psychologically manipulated person to repairing
      a disassembled pocket watch, warning that restoration is difficult.
    certainty: Metaphor expressing uncertainty.
  - speaker: Lethe
    timestamp_as_printed: 14:47:06/10-8-54
    printed_page: 77
    pdf_page: 77
    assertion: Asks whether brainlock can erase memories.
    certainty: Question.
  - speaker: Pamela
    timestamp_as_printed: 07:29:58/10-9-54
    printed_page: 77
    pdf_page: 77
    assertion: Does not think brainlock erases memories and says she will investigate.
    certainty: Explicit qualified negation, not proof of impossibility.
  - speaker: Emerald
    timestamp_as_printed: 12:02:04/10-9-54
    printed_page: 77
    pdf_page: 77
    assertion: Alleges a separate memory-affecting drug called laés is used by Tir
      Tairngire border personnel and sometimes Lone Star.
    certainty: Uncorroborated comparative speaker allegation; distinct from brainlock.
  - speaker: Pin-Up
    timestamp_as_printed: 14:57:42/10-9-54
    printed_page: 78
    pdf_page: 78
    assertion: Expresses surprise that Lone Star might obtain laés.
    certainty: Question/opinion, not proof.
  - speaker: Backroom Boffin
    timestamp_as_printed: 22:45:00/10-9-54
    printed_page: 78
    pdf_page: 78
    assertion: Speculates a government or corporate user could chemically reproduce
      laés after obtaining a sample, and alleges Lone Star sometimes employs a similar
      drug.
    certainty: Unsupported conjecture; no real-world chemical synthesis directions.
  - speaker: Fraser
    timestamp_as_printed: 05:11:28/10-11-54
    printed_page: 78
    pdf_page: 78
    assertion: Questions why Lone Star would spend resources on conditioning the anonymous
      friend rather than using immediate violence.
    certainty: Speaker question, not official motive.
  - speaker: Ranger Rick
    timestamp_as_printed: 09:35:45/10-11-54
    printed_page: 78
    pdf_page: 78
    assertion: Speculates the organization was pursuing information concerning the
      anonymous friend or the friend’s associates, and cautions that the original
      poster may be in danger.
    certainty: Explicit hypothetical motive.
  - speaker: Derek
    timestamp_as_printed: 07:51:15/10-13-54
    printed_page: 78
    pdf_page: 78
    assertion: Disputes a simple interrogation motive and interprets the episode as
      a deliberately visible warning to other runners.
    certainty: Alternate attributed hypothesis, not narrator-verified intent.
  - speaker: VQ
    timestamp_as_printed: 11:13:18/10-13-54
    printed_page: 78
    pdf_page: 78
    assertion: Disagrees with Derek and proposes that the incident was a clinical
      trial whose subject and associates were being monitored.
    certainty: Competing attributed hypothesis, not established experiment.
  - speaker: Consul
    timestamp_as_printed: 21:00:13/10-13-54
    printed_page: 78
    pdf_page: 78
    assertion: Speculates about simsense-assisted imprisonment that might cause someone
      to experience many years of subjective incarceration over a short real interval.
    certainty: Hypothetical in-world technology, not source-verified capability.
  - speaker: RAS Master
    timestamp_as_printed: 00:55:21/10-14-54
    printed_page: 78
    pdf_page: 78
    assertion: Objects that simsense does not work in the manner Consul proposes.
    certainty: Explicit contradiction.
  - speaker: Consul
    timestamp_as_printed: 05:14:23/10-15-54
    printed_page: 78
    pdf_page: 78
    assertion: Claims a Denver correctional institution is researching a similar technique
      and is optimistic about progress.
    certainty: Unverified speaker report in tension with RAS Master’s objection.
  - speaker: The Other Guy
    timestamp_as_printed: 12:25:03/10-15-54
    printed_page: 78
    pdf_page: 78
    assertion: Speculates the alleged Denver research may also involve a Renraku purchase.
    certainty: Unverified question, not an established transaction.
  - speaker: RAS Master
    timestamp_as_printed: 13:56:22/10-15-54
    printed_page: 78
    pdf_page: 78
    assertion: Repeats that the proposed simsense subjective-time effect is technically
      infeasible as described.
    certainty: Repeated explicit negation.
  - speaker: Street Monster
    timestamp_as_printed: 22:52:50/10-15-54
    printed_page: 78
    pdf_page: 78
    assertion: Says any failed speculative research would divert resources from enforcement
      against runners.
    certainty: Speaker opinion, not established budget allocation.
  - speaker: John Brown's Body
    timestamp_as_printed: 23:04:57/10-23-54
    printed_page: 78
    pdf_page: 78
    assertion: Relates an uncorroborated rumor about permanent neural implants used
      to discourage repeat offending, acknowledges possible indiscriminate or ineffective
      responses, and explicitly says no supporting evidence has been established.
    certainty: A named speaker’s self-disclaimed rumor; not an actual clinical device
      design or game mechanic.
  central_attribution_and_causality_limits:
    brainlock_reality: All brainlock descriptions here arise in dated in-world comments,
      not confirmed game rules or reliable technical evidence.
    iron_jim: The anonymous post reports his condition after custody; association
      with brainlock is an inference and speaker motives are disputed.
    consent_and_coercion: Alleged detention, experimentation and forced behavior modification
      must not be redescribed as voluntary rehabilitation.
    disagreements: Source preserves incompatible statements about technical feasibility,
      Renraku development/licensing, ability to reverse effects, subjective imprisonment,
      and possible reasons for the reported Iron Jim episode.
    start_next_section: JUVENILES IN THE SYSTEM begins partway down the right column
      on printed/PDF p78 and remains unprocessed.
  non_procedural_safety_context: No real-world technical or clinical instructions
    are derived from the fictional dialogue. Any in-world techniques are preserved
    as source-attributed historical claims and hypothetical capabilities.
headline: Fictional Shadowrun brainlock and Iron Jim debate — FASA Lone Star Sourcebook
  FASA7115 (1994), pp76–78/PDF76–78
summary: Dated fictitious forum record of 36 disputed assertions, questions and contradictory
  claims, separated from narrator facts and original game mechanics.
