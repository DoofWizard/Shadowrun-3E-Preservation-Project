data:
  publication:
    title: Lone Star Sourcebook
    publisher: FASA Corporation
    catalog: FASA7115
    publication_year: 1994
    genre: fictional Shadowrun cyberpunk tabletop role-playing game
    edition: original/Second Edition historical source; no inferred SR3 conversion
  source_anchor:
    printed_pages: 91-93
    pdf_pages: 99-101
    heading: Recruiting and Training Shadowtalk
  scope: Dated in-world speakers debate early recruiting, public/private policing,
    training and selection; allegations and disputes are not narrator-certified policies.
  speakers:
  - name: Dogface
    timestamp: 01:06:51/9-8-54
    report: Derisively likens the early hires to military-police enforcers.
  - name: Wyatt
    timestamp: 20:10:44/9-8-54
    report: Argues Wilson valued officers able to enforce corporate contracts and
      suppress labor activity or public demonstrations over conventional investigative
      ability.
  - name: Mynx
    timestamp: 23:36:12/9-8-54
    report: Speculates that early city police departments privatizing enforcement
      displaced more public police officers than hired by the new company.
  - name: SPD
    timestamp: 18:07:14/9-9-54
    report: 'Disputes Mynx’s displacement prediction: says some municipal police unions
      incorporated and won their own contracts, while higher-paying private security
      divisions recruited experienced public officers. Also criticizes Wilson’s alleged
      early emphasis on forceful corporate contract enforcement over more reform-minded
      policing.'
  - name: Gruff
    timestamp: 01:04:22/9-10-54
    report: Repeats a rumor that Wilson recruited correctional officers dismissed
      for brutality.
  - name: Hangfire
    timestamp: 22:50:01/9-12-54
    report: Challenges Gruff’s rumor, saying supporting evidence has not been shown.
  - name: Laguna Gloria
    timestamp: 15:07:44/9-10-54
    report: Claims the fictional Texas School for the Blind property was closed and
      repurposed by Wilson for academy facilities.
  - name: Rest
    timestamp: 15:21:03/9-6-54
    report: Identifies a purported Seattle academy site on Russel Road in Everett,
      near the fictional Darrington Correctional Facilities.
  - name: Boxer
    timestamp: 22:42:55/9-7-54
    report: Describes the reputed building as unattractive and says it resembles a
      prison annex.
  - name: Bubba-Boy
    timestamp: 05:24:36/9-9-54
    report: Replies that the building is worse inside.
  - name: Crosshairs
    timestamp: 15:33:34/9-6-54
    report: 'Disputes the narrator’s reduced-combat-training account, claiming weapon
      qualification applies at every rank, and alleges firearms exercises: ten-shot
      slow fire at 20 meters with a threshold score of 40 at the academy; certification
      requires 70 on ten-shot slow fire at 20 meters and 50 on ten-shot rapid fire
      at 35 meters. These are in-world alleged range standards, not RPG dice mechanics.'
  - name: Versa Vice
    timestamp: 05:54:21/9-8-54
    report: Claims most Lone Star officers do not need periodic refresher qualification,
      except the Tac Squad and FRTs.
  - name: X-Star
    timestamp: 13:55:11/9-8-54
    report: 'Contradicts Versa Vice’s sweeping portrayal: says Tac Squad and FRTs
      must renew their certifications, and many peace officers voluntarily train at
      ranges monthly.'
  - name: X-Star
    timestamp: 04:15:59/9-9-54
    report: Speculates that Lone Star tries to recruit trained corporate security
      employees but lacks enough pay to draw many away, and might introduce accelerated
      courses.
  - name: Sharp
    timestamp: 10:30:42/9-10-54
    report: 'Describes alleged academy entry conditions: citizenship in the country
      of attendance, at least eighteen years of age, good health, high-school credential,
      SIN, no criminal record, financing/credit screening for bribery vulnerability,
      and satisfactory explanation of desire to join. Says a university degree or
      diploma is beneficial rather than mandatory.'
  - name: Fish
    timestamp: 23:03:19/9-10-54
    report: Challenges strict criminal-history exclusions, claiming GridSec employs
      convicted deckers and Seattle FRTs formerly included street samurai with criminal
      records.
  - name: Whispering Wind
    timestamp: 07:24:32/9-11-54
    report: Cites a purported Lone Star procedures manual as barring applicants with
      criminal records, while conceding that managers may disregard it.
  - name: Marg
    timestamp: 03:13:51/9-12-54
    report: Asks how Lone Star acquires administrative personnel, researchers, data-processing
      staff and managers.
  - name: John-Boy
    timestamp: 16:18:04/9-12-54
    report: Answers that the company recruits administrative candidates through placement
      agencies, schools and universities, competing companies, and employment advertisements.
  - name: Augustus
    timestamp: 22:05:18/9-13-54
    report: Claims handgun proficiency must be achieved by the end of probation, regardless
      of role, or employment ends.
  certainty_boundary: Speaker allegations are sometimes mutually inconsistent. No
    narrator-certified shooting qualification, character-creation rule, or universally
    verified hiring exclusion is established by these forum assertions.
