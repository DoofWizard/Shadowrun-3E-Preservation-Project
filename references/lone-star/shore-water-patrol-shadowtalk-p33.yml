    heading: Department of Shore/Water Patrol, in-world Shadowtalk
  subject: Lone Star Department of Shore/Water Patrol
  messages:
  - speaker: Silverbone
    timestamp: 01:37:19/9-19-54
    assertion: Questions how the television crews obtained vantage points for the
      Manhattan Bridge coverage precisely when the highly publicized use of explosive
      rounds occurred.
    certainty: Suggestive rhetorical suspicion; the speaker does not prove staging
      or coordination.
  - speaker: Kilroy
    timestamp: 08:27:39/10-10-54
    assertion: Alleges that the department rushed to purchase inferior equipment and
      deployed incompletely trained personnel; describes particularly rapid growth
      and high casualties over the previous two years, and says rebroadcasts of the
      Manuel Jardine Tonight footage might deter troublemakers on Seattle metropolitan
      waterfronts.
    certainty: In-world criticism and prediction; not narrator-confirmed purchasing
      or casualty statistics.
  - speaker: Traci
    timestamp: 03:17:58/10-15-54
    assertion: Argues that after roughly two years the division still lacks upgrades
      and training; speculates that Lone Star deliberately secured profitable contracts
      rapidly, expecting municipalities to reduce shore-service contracts when many
      renew approximately three years later, avoiding replacement costs for poor equipment.
      The speaker characterizes this as short-term financial exploitation.
    certainty: Proposed commercial motive and forecast, not independently established
      intent or later event.
  - speaker: Maxine
    timestamp: 16:10:25/10-15-54
    assertion: Criticizes the Surfstar Marine Seacop and GMC Beechcraft Patroller
      as conspicuous but under-armed vessels; says continental division decision-makers
      responded to calls for a faster forward patrol line by purchasing modified Suzuki
      Watersport jet skis with enhanced engines, armor and firm points. Calls the
      design poorly chosen and alleges riders suffer severe losses, with no subsequent
      correction.
    certainty: Named fictional commenter’s equipment and performance assessment, not
      an independently verified canonical stat line.
  - speaker: Wolf
    timestamp: 04:00:59/10-18-54
    assertion: Counters that the Watersport craft can perform well with a skilled
      pilot.
    certainty: Counter-opinion about effectiveness.
  - speaker: Maxine
    timestamp: 15:57:11/10-18-54
    assertion: Acknowledges Wolf's point and argues that personnel skill is the department's
      larger failing, rather than its equipment alone.
    certainty: Speaker's revised assessment, not narrator conclusion.
  boundaries: These are dated, pseudonymous fictional in-world claims about a setting
    organization, a disputed televised confrontation and alleged shortcomings. The
    sourcebook narrator's narrower claims are independently indexed under world/lone-star/shore-water-patrol-p33.yml;
    the comments do not establish real-world events or advice.
