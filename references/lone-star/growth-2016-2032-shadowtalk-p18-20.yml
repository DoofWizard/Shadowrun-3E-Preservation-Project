data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog: FASA7115
    year: 1994
    setting: fictional tabletop role-playing game
  source_anchors:
  - printed_page: 18
    pdf_page: 18
    type: inline_shadowtalk
  - printed_page: 19
    pdf_page: 19
    type: inline_shadowtalk
  - printed_page: 20
    pdf_page: 20
    type: inline_shadowtalk
  interpretive_boundary: All below are dated in-world commenters' assertions, disputes
    or conjectures, not independently established book-narrator facts.
  messages:
  - speaker: Target
    timestamp: 13:55:12/9-11-54
    printed_page: 18
    claim: Says details of the fictional Resolution Act became public in 2017 over
      objections, and speculates Wilson had prior political connections or advance
      knowledge.
    certainty: rumor and inference
  - speaker: Wryter
    timestamp: 02:48:49/9-12-54
    printed_page: 18
    claim: Replies affirmatively to Target's suspicion without supplying evidence.
    certainty: speaker opinion
  - speaker: Laguna Gloria
    timestamp: 13:03:21/9-4-54
    printed_page: 18
    claim: Says Austin municipal work-site security bylaws aided Bartholomew's construction-site
      guarding contracts; describes holes and excavation locations as low-value targets.
    certainty: in-world anecdote
  - speaker: Christine
    timestamp: 07:21:24/9-7-54
    printed_page: 18
    claim: Expresses surprise that Lone Star had computer-security resources early
      in its history.
    certainty: reaction
  - speaker: Wryter
    timestamp: 02:50:00/9-12-54
    printed_page: 18
    claim: Corrects Christine that external computer-security contracts began about
      five years after Lone Star's founding, despite Wilson's earlier acquisition
      of Absolute Software for his own firm's systems.
    certainty: corrective in-world claim
  - speaker: Angie Angst
    timestamp: 13:24:10/9-9-54
    printed_page: 18
    claim: Contends Wilson hired many army veterans and former correctional officers,
      disparaging their temperaments.
    certainty: hostile speaker assessment
  - speaker: Shadow
    timestamp: 22:26:50/10-1-54
    printed_page: 18
    claim: Argues that Lone Star's early staff were physically intimidating and armed
      rather than merely a large guard force.
    certainty: in-world observation
  - speaker: One Trick Pony
    timestamp: 21:30:56/9-21-54
    printed_page: 18
    claim: Credits Damien Knight's eventual security-market success in part to demand
      created by Lone Star's expansion.
    certainty: causal opinion
  - speaker: Jaws
    timestamp: 01:31:18/9-22-54
    printed_page: 18
    claim: Rebukes One Trick Pony for repeating the argument.
    certainty: reaction
  - speaker: Denise
    timestamp: 15:35:16/9-13-54
    printed_page: 19
    claim: Alleges Wilson favored certain police applicants after the Corpus Christi
      strike and offered Denise approximately 15 percent less than municipal police
      pay; Denise says solidarity and fair treatment of experienced officers led to
      refusal.
    certainty: first-person testimony and appraisal
  - speaker: Rooney
    timestamp: 05:27:08/9-14-54
    printed_page: 19
    claim: Criticizes Denise's refusal as economically self-defeating.
    certainty: hostile response
  - speaker: Quan
    timestamp: 16:01:44/9-15-54
    printed_page: 19
    claim: Alleges that city leaders and Wilson engineered the Corpus Christi labor
      conflict to replace a union force with cheaper private contractors and selectively
      rehire former police.
    certainty: unverified conspiracy allegation
  - speaker: Itsal
    timestamp: 02:28:10/9-16-54
    printed_page: 19
    claim: Believes Seattle supplied Lone Star's first municipal police contract.
    certainty: mistaken in-world assertion
  - speaker: Diamondback
    timestamp: 16:03:56/9-16-54
    printed_page: 19
    claim: Rejects the Seattle-first belief.
    certainty: corrective speaker assertion
  - speaker: Blue Light
    timestamp: 01:04:46/9-8-54
    printed_page: 19
    claim: Attributes heightened street violence partly to wage freezes and reduced
      police training and support.
    certainty: causal opinion
  - speaker: Chung
    timestamp: 13:47:54/9-9-54
    printed_page: 19
    claim: Says the fictional Beau Arts enclave once used Lone Star to install security
      fencing, sensor arrays and water defenses before later contracting with Knight
      Errant in 2035.
    certainty: dated in-world recollection
  - speaker: Olive
    timestamp: 16:26:03/9-7-54
    printed_page: 20
    claim: Wonders whether Wilson foresaw or helped orchestrate the Crash of 2029,
      or knew those responsible.
    certainty: explicit speculation only
  - speaker: Neon Splatter
    timestamp: 04:23:11/9-8-54
    printed_page: 20
    claim: Rejects Olive's conspiracy as unsupported; interprets Wilson's system isolation
      as longstanding distrust of integrated networks and recognition of his own technical
      limits.
    certainty: counterargument and psychological interpretation
  - speaker: Neon Splatter
    timestamp: 04:24:46/9-8-54
    printed_page: 20
    claim: Identifies GridSec as an in-world nickname for Lone Star's Division of
      Matrix Security.
    certainty: terminology claim
  - speaker: Neon Splatter
    timestamp: 04:27:01/9-8-54
    printed_page: 20
    claim: Alleges 2032 acquisitions included research operations, a simsense production
      firm, psychiatric clinics later associated with DivPsych and the Gray Men, and
      a hermetic think tank later folded into Paranormal Investigation.
    certainty: in-world allegation, not narrator-certified transaction list
  - speaker: Go Boy
    timestamp: 17:03:08/9-8-54
    printed_page: 20
    claim: Criticizes Lone Star's acquisitions as harmful growth.
    certainty: hostile speaker opinion
framing: newsroom_neutral
headline: Fictional source forum on Lone Star growth, FASA Corporation Lone Star Sourcebook
  (FASA7115, 1994), original/Second Edition, printed/PDF pp18-20
