  comments:
  - speaker: Bullyboy Grim
    timestamp: 10:59:58/9-8-54
    printed_page: 96
    claim: Makes a sardonic comparison of early Lone Star officers’ ethics with notorious fictional/public
      figures; not a numerical corruption claim.
  - speaker: SPD
    timestamp: 16:06:59/9-11-54
    printed_page: 96
    claim: Alleges individual officers range from scrupulous to bribe-demanding; argues corruption is real
      but not pervasive and asserts that most workers fall between those extremes. Describes possible acceptance
      of money under exceptional pressure, not a corporate policy.
  - speaker: Bullyboy Grim
    timestamp: 10:07:25/9-13-54
    printed_page: 96
    claim: Challenges whether the preceding speaker has personal experience of bribery.
  - speaker: Shield
    timestamp: 12:19:11/9-16-54
    printed_page: 96
    claim: Alleges Lone Star Internal Affairs monitors suspected bribe-taking closely, sometimes frightening
      innocent officers or presuming wrongdoing; nonetheless considers IA oversight a deterrent.
  - speaker: SPD
    timestamp: 18:17:57/9-16-54
    printed_page: 96
    claim: Disagrees that all Internal Affairs units operate identically and alleges major variation among
      precincts in bribe-taking and the handling of suspected misconduct.
  - speaker: Spook
    timestamp: 16:30:00/9-19-54
    printed_pages: 96-97
    claim: Describes hypothetical corruption of fictional police officers, discussing monetary bribery, scrutiny
      by Internal Affairs, concealment and coercive leverage through threatened exposure. This is a named speaker’s
      hypothetical discussion, not book-narrator fact, a game procedure or real-world advice. The source’s
      operational directions are not reproduced.
  - speaker: Hardesty
    timestamp: 11:29:27/9-20-54
    printed_page: 97
    claim: Proposes a hypothetical evidence-release threat aimed at revealing a corrupt officer to Internal
      Affairs; not a historical occurrence.
  - speaker: Argent
    timestamp: 21:57:20/9-26-54
    printed_page: 97
    claim: Replies that sophisticated corrupt officers might circumvent the preceding proposed exposure tactic;
      withholds details.
  scope: Commentary under the published CORRUPTION heading runs from lower printed p96 across upper-left p97;
