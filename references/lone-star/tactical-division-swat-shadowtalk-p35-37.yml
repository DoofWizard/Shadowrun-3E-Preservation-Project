data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog_number: FASA7115
    publication_year: 1994
    game: Fictional Shadowrun tabletop roleplaying game
    edition: Historical original/Second Edition-compatible, not converted to SR3
  source_anchors:
  - printed_page: 35
    pdf_page: 35
    heading: Tactical Division begins
  - printed_page: 36
    pdf_page: 36
    heading: Tactical Division and SWAT Shadowtalk
  - printed_page: 37
    pdf_page: 37
    heading: SWAT Shadowtalk continues; Demolitions begins
  messages:
  - speaker: Gauss
    timestamp: 04:08:54/9-23-54
    printed_page: 36
    assertion: Dismisses the non-SWAT subdivisions of TacDiv as unappealing assignments.
    certainty: In-world opinion, not a narrator description of hiring policy.
  - speaker: SPD
    timestamp: 13:18:00/9-26-54
    printed_page: 36
    assertion: Counters that TacDiv's non-SWAT components support SWAT with sufficient
      additional capacity to make the division powerful and influential.
    certainty: Speaker opinion regarding divisional standing.
  - speaker: Spear Carrier
    timestamp: 06:53:30/9-9-54
    printed_page: 36
    assertion: Characterizes SWAT as TacDiv's most publicized unit, while arguing
      bomb squads bear exceptional danger and riot-control officers handle especially
      unpopular or risky public-facing events; claims SWAT attracts favorable publicity
      by resolving high-profile crises.
    certainty: Speaker's contested comparative assessment.
  - speaker: Deacon Blue
    timestamp: 18:47:28/9-10-54
    printed_page: 36
    assertion: Claims SWAT teams have fewer deaths than bomb squads or riot-control
      teams despite the difficulty of assignments.
    certainty: Comparative anecdote; no verified casualty table supplied.
  - speaker: SPD
    timestamp: 09:39:21/9-11-54
    printed_page: 36
    assertion: Attributes perceived SWAT effectiveness to better training and equipment,
      while claiming riot-control personnel commonly draw less protective equipment
      and bomb squads receive less rewarding assignments.
    certainty: Organizational opinion, not a narrator-established comparative standard.
  - speaker: Ghost in the Machine
    timestamp: 14:04:11/9-7-54
    printed_page: 36
    assertion: Alleges Lone Star's simsense training is unusually similar to illicit
      BTL entertainment in its perceived realism.
    certainty: Comparative opinion, not a tested technological or legal equivalence.
  - speaker: X-Star
    timestamp: 06:27:59/9-8-54
    printed_page: 36
    assertion: Criticizes scripted simsense tactical training as predictable under
      pressure and speculates that outsiders familiar with standard patterns can anticipate
      a squad's responses.
    certainty: Speaker assessment, not an operational rule or verified vulnerability.
  - speaker: SPD
    timestamp: 11:49:54/9-10-54
    printed_page: 36
    assertion: Reports that Seattle's TacDiv negotiated joint SWAT training with the
      military at an Urban Combat Simulator called Downtown Hell in Fort Lewis, predicting
      changes to SWAT tactics.
    certainty: Speaker-reported institutional arrangement and forecast, not narrator
      verification.
  - speaker: X-Star
    timestamp: 06:28:52/9-8-54
    printed_page: 36
    assertion: Notes competing terminology for long-range SWAT firearm specialists,
      including sharpshooter and long rifle.
    certainty: Terminology aside.
  - speaker: The Cat
    timestamp: 22:36:42/9-8-54
    printed_page: 36
    assertion: Questions why a standard sixteen-person SWAT team would include four
      snipers and whether that is excessive.
    certainty: Question, not roster correction.
  - speaker: Crosshairs
    timestamp: 09:59:47/9-9-54
    printed_page: 36
    assertion: Defends the sniper allotment, saying long-rifle personnel work with
      spotters and alleging coordinated fields of coverage are valuable in difficult
      fictional scenarios.
    certainty: Speaker's tactical explanation, not an instruction or independent confirmation.
  - speaker: The Cat
    timestamp: 14:00:48/9-9-54
    printed_page: 36
    assertion: Asks why two-person sniper teams are used.
    certainty: Request for an explanation.
  - speaker: Crosshairs
    timestamp: 10:04:15/9-10-54
    printed_pages:
    - 36
    - 37
    assertion: Claims some two-person sniper crews synchronize shots when an intervening
      window may affect a projectile, characterizing the first impact on glass and
      the following shot as a means of overcoming deflection. The source presents
      the speaker's violent account, not verified physical performance.
    certainty: Fictional in-world tactical claim, not canon mechanics or practical
      instructions.
  - speaker: Annie
    timestamp: 00:10:14/9-13-54
    printed_page: 37
    assertion: Alleges spotters give a series of verbal calls while paired snipers
      hold their aim for extended periods and fire very close together; describes
      the resulting tension as severe.
    certainty: Attributed fictional anecdote; not a universal firing protocol.
  - speaker: Crosshairs
    timestamp: 09:21:15/9-14-54
    printed_page: 37
    assertion: Describes the personal and psychological intensity of a sniper's work,
      including seeing consequences through high-powered optics, anticipation, and
      a strong adrenaline response; gives an opinion about motives for choosing long-rifle
      roles.
    certainty: Speaker's first-person and generalizing claims, not narrator-proven
      psychology.
  - speaker: Real Men Use APDS
    timestamp: 17:55:17/9-14-54
    printed_page: 37
    assertion: Mocks Crosshairs' account of psychological strain.
    certainty: Sarcastic response, not an independent factual assertion.
  - speaker: SPD
    timestamp: 03:28:36/9-6-54
    printed_page: 37
    assertion: Says SWAT teams also carry substantial protective armor.
    certainty: In-world equipment impression without numerical armor values.
  - speaker: Converse
    timestamp: 11:44:50/9-8-54
    printed_page: 37
    assertion: Claims a SWAT combat decker handles building surveillance and electronic
      systems during response assignments, with special difficulties in structures
      lacking Matrix access; alleges the decker is especially heavily armored.
    certainty: In-world equipment-and-role account, not a narrator-certified Matrix
      rule or real-world method.
  - speaker: X-Star
    timestamp: 17:36:09/9-7-54
    printed_page: 37
    assertion: Qualifies the narrator's specialization statement by suggesting some
      SWAT teams conduct unofficial, individually organized cross-training.
    certainty: Possible localized exception, not a correction of the general narrator
      pattern.
  distinction: All speakers are pseudonymous voices within a fictional sourcebook's
    2054 discussion. The narrator-certified sixteen-person roster, hovercraft and
    official division scope are preserved separately in world/lone-star/tactical-division-swat-p35-37.yml.
    Individual violent anecdotes, disputed tactics and technology opinions do not
    become real-world operational advice or universal game mechanics.
