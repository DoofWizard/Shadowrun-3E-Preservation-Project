data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog: FASA7115
    year: 1994
    game: fictional Shadowrun tabletop role-playing game
    edition: original/Second Edition compatible
  source_anchors:
  - printed_page: 39
    pdf_page: 39
    heading: Department of Riot Control; Shadowtalk
  - printed_page: 40
    pdf_page: 40
    heading: Riot Control continuation; Shadowtalk
  - printed_page: 41
    pdf_page: 41
    heading: Riot Control Shadowtalk ends before Dispatch Office
  messages:
  - speaker: Boar
    timestamp: 16:25:08/9-4-54
    pages: '40'
    claim: Refers to the Ork Rights Committee sit-in at Metropole Hall and says they
      heard estimates of ten dead, seventy-five injured, and five missing; alleges
      authorities harmed people said to be nonlethally equipped. These numbers and
      motive are not book-narrator findings.
    certainty: in-world hearsay and critical accusation
  - speaker: Thin Blue Line
    timestamp: 19:41:32/9-5-54
    pages: '40'
    claim: Alleges news footage selectively favors visually dramatic gel-round responses
      to metahuman activists or protesters while omitting earlier provocations, including
      thrown bottles, sharpened rebar, and bags of nails, and therefore creates misleading
      impressions of police actions.
    certainty: participant perspective, not independently verified editorial finding
  - speaker: Kilroy
    timestamp: 23:59:00/9-5-54
    pages: '40'
    claim: Challenges whether enforcement responses are proportionate, arguing that
      Lone Star often crosses the line even when protests begin with provocations.
    certainty: critical speaker opinion
  - speaker: X-Star
    timestamp: 06:45:35/9-6-54
    pages: '40'
    claim: Describes riot-control recruitment as involuntary or unpopular, asserts
      that personnel assigned to frontline riot shields are inexperienced, and attributes
      hesitation to management reviews and career-damaging postincident second-guessing.
    certainty: self-presented insider account and interpretation
  - speaker: Kilroy
    timestamp: 22:48:10/9-6-54
    pages: '40'
    claim: Rejects excuses for harmful results and says consequences matter regardless
      of the asserted explanation.
    certainty: critical speaker opinion
  - speaker: Crosshairs
    timestamp: 16:35:41/9-7-54
    pages: 40-41
    claim: Claims many frontline officers respond badly from fear and lack of guidance,
      describes riot control as physically and emotionally dangerous, and criticizes
      postincident scrutiny of surveillance video, gun-camera footage, and command
      decisions. Alleges that radio-frequency interference repeatedly affected gun-camera
      links at scenes.
    certainty: first-person-style in-world account, disputed elsewhere; not narrator-certified
      facts
  - speaker: Dragnet
    timestamp: 17:30:22/9-7-54
    pages: '39'
    claim: Says the Riot Control Force struggles to attract qualified members and
      receives employees reassigned from other departments or recruits who lack organizational
      influence.
    certainty: anonymous in-world assessment
  - speaker: Thin Blue Line
    timestamp: 19:37:20/9-8-54
    pages: '39'
    claim: 'Contradicts descriptions of riot control as eager to use force: says units
      may arrive carrying less-lethal crowd-control tools, then seek to de-escalate,
      use calmly spoken negotiation, and apply force only after protesters initiate
      violence.'
    certainty: participant defense of department practice; disputed by other speakers
  - speaker: Trasher
    timestamp: 17:16:19/9-9-54
    pages: '39'
    claim: Offers hostile opinion that police should use preemptive lethal force on
      civilians rather than wait for crimes; retained solely as a fictional participant
      statement, not game guidance or narrator endorsement.
    certainty: hostile extremist opinion
  - speaker: Ox
    timestamp: 04:46:46/9-9-54
    pages: '41'
    claim: Says monitoring cameras also exist inside patrol-car driver compartments
      and disputes the claim that cameras can be disrupted by incidental RF interference
      because the equipment is hardwired to a sealed recorder.
    certainty: in-world technical correction; not independent verification
  - speaker: Agnew
    timestamp: 07:06:10/9-10-54
    pages: '41'
    claim: Alleges some repeat demonstrators are hired professional agitators who
      attend unrelated protests, provoke incidents, and exchange information with
      reporters, sometimes summoning cameras at planned moments.
    certainty: unverified accusation about protesters and media
  - speaker: Cassandra
    timestamp: 09:46:22/9-10-54
    pages: '41'
    claim: Accuses Agnew of defending Lone Star and using authoritarian rhetoric.
    certainty: brief hostile rebuttal
  - speaker: Argent
    timestamp: 17:31:55/9-10-54
    pages: '41'
    claim: Supports Agnew and counters by questioning Cassandra’s relationship to
      the fictional Humanis organization.
    certainty: ad hominem speculation, not evidence of affiliation
  - speaker: Gear-Jammer
    timestamp: 00:03:12/9-11-54
    pages: '41'
    claim: Describes a Mobmaster armored riot-control vehicle as a Citymaster variant
      with two forward-facing triple-shot gas-grenade launchers, a microturret with
      twin FN-MAG 5 medium machine guns usually loaded with gel rounds, three firing
      ports on each side, and two ports in the rear hatch.
    certainty: source-attributed equipment description, not a published vehicle stat
      block
  source_authority_boundary: All entries above are fictional dated Shadowtalk messages,
    not corroborated sourcebook narrator facts. The separate world_fact record preserves
    narrator descriptions. Gear-Jammer’s vehicle account is not presented here as
    mechanically authoritative equipment statistics.
headline: Fictional Shadowrun Riot Control Shadowtalk — FASA Corporation, Lone Star
  Sourcebook (FASA7115, 1994), printed pp39–41/PDF39–41
summary: Fourteen named 2054 fictional reader comments about riot-control practices,
  disputed misconduct, press claims, surveillance, recruitment and a purported vehicle
  configuration; speaker attribution and uncertainty preserved.
framing: newsroom_neutral
