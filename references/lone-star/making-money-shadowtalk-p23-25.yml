data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog: FASA7115
    year: 1994
    setting: fictional tabletop role-playing game
  source_anchors:
  - printed_page: 23
    pdf_page: 23
    section: Making Money in-world forum dialogue
  - printed_page: 24
    pdf_page: 24
    section: Making Money in-world forum dialogue
  - printed_page: 25
    pdf_page: 25
    section: Making Money in-world forum dialogue
  claim_boundary: Each dated in-world comment is a distinct assertion or argument;
    claimed corporate wrongdoing, future business losses, extra profit centers and
    software allegations are not narrator-certified findings.
  messages:
  - speaker: Dodd
    timestamp: 14:02:00/9-8-54
    printed_page: 23
    claim: Says Seattle exclusivity gives Lone Star strong brand recognition even
      though rivals challenge corporate and smaller city contracts; claims Knight
      Errant has begun challenging Seattle Governor Schultz over the policing contract.
    certainty: market interpretation and unverified lobbying claim
  - speaker: Orgchart
    timestamp: 19:47:33/9-10-54
    printed_page: 24
    claim: Claims Lone Star and Seattle quietly renegotiated their contract early,
      potentially undercutting Knight Errant’s chance to compete.
    certainty: speaker inference without released terms
  - speaker: T2000
    timestamp: 17:13:09/9-11-54
    printed_page: 24
    claim: Interprets early renegotiation as a possible response to business pressure
      and contraction.
    certainty: opinion
  - speaker: Dodd
    timestamp: 14:51:35/9-12-54
    printed_page: 24
    claim: Predicts a domino effect if Lone Star loses its first major exclusive municipal
      contract, given the importance of its brand and market position.
    certainty: forecast, not future fact
  - speaker: Read
    timestamp: 02:16:13/9-7-54
    printed_page: 24
    claim: Observes that Lone Star-themed trideo crime dramas may provide the company
      additional income.
    certainty: speaker inference
  - speaker: Garth
    timestamp: 18:59:56/9-14-54
    printed_page: 24
    claim: Claims CSD provides corporate security personnel even to Ares.
    certainty: attributed in-world commercial assertion
  - speaker: X-Star
    timestamp: 15:38:28/9-6-54
    printed_page: 24
    claim: Accuses CSD personnel of acting as private corporate police without the
      legal procedures, warrant checks or civilian-law restraints described for municipal
      enforcement.
    certainty: critical allegation, not rules or established universal company practice
  - speaker: Miranda
    timestamp: 18:06:11/9-6-54
    printed_page: 24
    claim: Condemns X-Star’s advocacy and remarks using hostile language.
    certainty: hostile reaction
  - speaker: X-Star
    timestamp: 13:33:09/9-7-54
    printed_page: 24
    claim: Asks whether critics recognize the irony in the company’s public claims
      about protecting civil rights.
    certainty: critical opinion
  - speaker: Constance
    timestamp: 05:49:01/9-6-54
    printed_page: 24
    claim: Claims Dips also offers longer-term contracts for magically capable security
      specialists.
    certainty: unverified scope expansion
  - speaker: Constance
    timestamp: 05:50:02/9-6-54
    printed_page: 25
    claim: Claims GridSec licenses security ICE code to corporate clients and gains
      substantial income.
    certainty: speaker commercial allegation
  - speaker: HAL 9000
    timestamp: 13:52:59/9-7-54
    printed_page: 25
    claim: Claims GridSec develops and licenses dangerous computer viruses as well
      as defensive ICE.
    certainty: unverified allegation about fictional Matrix software; no operational
      instructions
  - speaker: Ski
    timestamp: 15:00:32/9-6-54
    printed_page: 25
    claim: Claims Lone Star lacks its own manufacturing facilities and outsources
      production and marketing of approved R&D designs.
    certainty: speaker operational assertion
  - speaker: Slicer
    timestamp: 20:17:14/9-6-54
    printed_page: 25
    claim: Contrasts R&D security ICE products with GridSec’s alleged high-risk ICE;
      claims R&D confines its own projects to less extreme forms and profits from
      that work.
    certainty: commenter comparison and opinion
  - speaker: AES
    timestamp: 22:53:55/9-6-54
    printed_page: 25
    claim: Alleges the Department of Forensics, the Division of Psychology and a Military
      Liaison department are additional profitable centers not fully described by
      the organizational chart.
    certainty: unverified additional-division claim
  - speaker: Hiroaki
    timestamp: 07:06:52/9-15-54
    printed_page: 25
    claim: Directs readers to later discussion of Military Liaison for more detail.
    certainty: cross-reference
  - speaker: Apollo 100
    timestamp: 16:10:37/9-16-54
    printed_page: 25
    claim: Speculates that confidential investigative and intelligence holdings are
      sold or leaked to wealthy clients including corporations and governments.
    certainty: unverified information-brokerage allegation
  - speaker: Flink
    timestamp: 12:36:11/9-17-54
    printed_page: 25
    claim: Questions whether confidentiality laws would forbid the alleged information
      trafficking.
    certainty: question, not a legal holding
  - speaker: X-Star
    timestamp: 17:18:04/9-17-54
    printed_page: 25
    claim: Dismisses Flink’s reliance on laws to constrain corporate misconduct.
    certainty: cynical opinion
framing: newsroom_neutral
headline: Fictional Lone Star revenue debate, FASA Corporation Lone Star Sourcebook
