  attributed_comments:
  - speaker: Socio Pat
    timestamp: 15:35:59/9-7-54
    claim: Argues that every group develops a distinctive, self-perpetuating culture which attracts or repels participants;
      disputes that people who join a corporation can wholly remake an established culture.
  - speaker: Confused in Kent
    timestamp: 17:11:32/9-7-54
    claim: Responds that the preceding abstract explanation is unclear.
  - speaker: Auntie Social
    timestamp: 04:16:42/9-8-54
    claim: Interprets the preceding argument through a hypothetical anti-corporate libertarian bridge club, saying
      new members self-select and perpetuate the club's established attitudes; illustrative analogy, not a source-narrator
      statement about Lone Star.
  - speaker: Dog Soldier
    timestamp: 23:00:30/9-8-54
    claim: Alleges Lone Star is reputed to use excessive force and violate civil rights, and speculates this attracts
      recruits who enjoy that conduct; hostile in-world opinion, not established employee psychology.
  authority_boundary: These are dated in-world Shadowtalk interpretations and accusations, not independently established
    narrator findings or real-world institutional claims.
