  visual_plates:
    - pdf_page: 81
      prominent_heading: JOIN LONE STAR!
      visual_description: Stylized close-up of a recruiting officer with star goggles against a large badge-like graphic; the speech bubble recruits viewers.
      presentation_voice: Fictional in-world advertising poster, not factual personnel data.
    - pdf_page: 82
      prominent_heading: CHROMER COP
      visual_description: Armored cybernetically augmented Lone Star police figure in a full-body poster with a recruiting testimonial panel.
      presentation_voice: Fictional recruitment persona; no equipment statistics supplied by this plate.
    - pdf_page: 83
      prominent_heading: COMBAT MAGE
      visual_description: Uniformed long-haired magical officer with bubbles or magical effects beside a stylized recruiting statement.
      presentation_voice: Fictional recruitment persona, not a spell-stat record.
    - pdf_page: 84
      prominent_heading: LONE STAR PROS
      visual_description: Recruitment-poster layout with ten promotional reasons to join and an illustration of a figure beneath a targeting/sensor graphic.
      presentation_voice: In-world promotional claims; not independently verified organizational policy.
    - pdf_page: 85
      prominent_heading: LONE STAR CONS
      visual_description: Matching list of ten anti-crime promotional slogans with a caricature figure and a framed character portrait.
      presentation_voice: In-world corporate propaganda and satirical advertising, not the book narrator's neutral account.
    - pdf_page: 86
      prominent_heading: CYCLE COP
      visual_description: Full-body uniformed motorcycle-officer recruiting persona holding a sidearm, alongside a promotional text panel.
      presentation_voice: Fictional recruitment illustration, not a weapon-stat block.
    - pdf_page: 87
      prominent_heading: FAST RESPONSE COP
      visual_description: Heavy-armor fast-response officer with equipment and recruiting-copy column.
      presentation_voice: Fictional recruitment illustration, not an equipment-stat block.
    - pdf_page: 88
      prominent_heading: LONE STAR GEAR
      visual_description: Large Lone Star shield/badge recruitment end card with company slogan and printed art/design credits.
      presentation_voice: Fictional corporate recruitment design.
  source_boundary:
    image_review: Indexed by direct visual inspection of each original PDF page, with no implied transfer of slogans into canon rules.
