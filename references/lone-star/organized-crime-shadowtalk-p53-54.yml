data:
  publication:
    title: Lone Star Sourcebook
    publisher: FASA Corporation
    catalog: FASA7115
    year: 1994
    edition: Shadowrun original/Second Edition historical source (original and Second
      Edition compatibility stated on printed p5)
    status: fictional tabletop role-playing-game setting
  source_anchors:
  - printed_page: 53
    pdf_page: 53
    heading: Organized Crime introductory shadowtalk
  - printed_page: 54
    pdf_page: 54
    heading: Organized Crime shadowtalk and undercover remarks
  messages:
  - speaker: VuePoint
    timestamp: 14:25:14/9-8-54
    printed_page: 53
    claim: Claims CEO James Wilson overcame an initially hostile board that rejected
      costs for a specialized Organized Crime department; says the speaker does not
      know how the board was convinced.
    certainty: speaker opinion about internal corporate events
  - speaker: Torpedo
    timestamp: 22:48:25/9-10-54
    printed_page: 53
    claim: Alleges that James Wilson exploited damaging information about some directors
      to secure board approval and may have used outside pressure.
    certainty: accusation and speculation, not narrator-confirmed misconduct
  - speaker: Lew
    timestamp: 15:09:27/9-12-54
    printed_page: 53
    claim: Questions the alleged pressure, recalling that Wilson had once been close
      to directors and was reportedly involved in removing his brother.
    certainty: contradicting speaker recollection
  - speaker: Vector
    timestamp: 09:16:31/9-13-54
    printed_page: 53
    claim: Agrees Wilson wanted approval but objects that there is no evidence for
      the alleged extreme means.
    certainty: explicit caution against promoting rumor into fact
  - speaker: Hip
    timestamp: 11:04:00/9-13-54
    printed_page: 53
    claim: Mentions director Donna Lutz having resigned for stated personal reasons
      during the controversy and treats the timing as suspicious, without establishing
      coercion.
    certainty: speaker insinuation
  - speaker: Winget
    timestamp: 16:08:00/10-17-54
    printed_page: 53
    claim: Predicts a Seattle Triad Task Force will make its debut soon, distinguishing
      the prediction from a confirmed past event.
    certainty: in-world forecast
  - speaker: Sai
    timestamp: 11:32:53/9-7-54
    printed_page: 53
    claim: Jokes about interdepartmental conflict when organized-crime task forces
      demand personnel and resources.
    certainty: sarcastic opinion
  - speaker: Converse
    timestamp: 15:31:12/9-7-54
    printed_page: 54
    claim: Uses a blunt refusal to characterize how other departments may resist task-force
      demands.
    certainty: expressive in-world comment
  - speaker: Dean
    timestamp: 19:47:14/9-8-54
    printed_page: 54
    claim: Claims organized-crime task-force leaders have substantial influence within
      Lone Star because of their organizational sponsor and authority.
    certainty: speaker assessment
  - speaker: Beni
    timestamp: 16:15:00/9-9-54
    printed_page: 54
    claim: Questions whether expensive specialized task forces genuinely save resources
      compared with strengthening ordinary investigative divisions.
    certainty: speaker challenge
  - speaker: Orgchart
    timestamp: 22:00:21/9-9-54
    printed_page: 54
    claim: Speculates that senior task-force managers cost about 100,000 nuyen annually
      and selected case officers about 70,000 nuyen in wages and bonuses; presents
      a calculation, not narrator-confirmed corporate payroll.
    certainty: speaker’s numerical estimates, not rules costs
  - speaker: Indy
    timestamp: 03:22:41/9-10-54
    printed_page: 54
    claim: Asks what benefit Lone Star receives from the department if units take
      resources away from other cases.
    certainty: question rather than factual assertion
  - speaker: Blue Light
    timestamp: 09:25:13/9-10-54
    printed_page: 54
    claim: Argues that task forces let case officers specialize in a specific organized
      group and focus on intelligence rather than unrelated cases.
    certainty: speaker argument
  - speaker: SPD
    timestamp: 15:28:00/9-11-54
    printed_page: 54
    claim: Claims a chosen Mafia task-force leader may understand a local fictional
      syndicate better than its members; speaker exaggeration is not independent verification.
    certainty: speaker boast
  - speaker: Wolf
    timestamp: 04:22:42/9-8-54
    printed_page: 54
    claim: Alleges the fictional corporate employer supplies undercover operatives
      with specialized resources for their assigned identities and activities.
    certainty: speaker allegation
  - speaker: Cox
    timestamp: 17:34:25/9-9-54
    printed_page: 54
    claim: Challenges Wolf to explain the claimed insider knowledge.
    certainty: speaker question
  - speaker: Wolf
    timestamp: 03:01:12/9-10-54
    printed_page: 54
    claim: Responds cryptically to the challenge rather than offering independently
      checkable evidence.
    certainty: speaker reply
  attribution_boundary: All listed posts are distinct 2054 fictional messages; allegations
    of coercion, covert interference, business pressure, funding and later Seattle
    activity are not certified as true by the narrator.
headline: Fictional Organized Crime Shadowtalk — FASA Corporation Lone Star Sourcebook
  FASA7115 (1994), Shadowrun original/Second Edition, printed pp53-54/PDF53-54
summary: Seventeen named and dated fictional in-world claims, objections and calculations
  about Lone Star’s Organized Crime department and James Wilson in FASA Corporation
  Lone Star Sourcebook FASA7115 (1994), pp53-54/PDF53-54.
