data:
  publication:
    title: Lone Star Sourcebook
    publisher: FASA Corporation
    catalog: FASA7115
    year: 1994
    setting: fictional Shadowrun tabletop role-playing game
    edition: historical original/Second Edition-era FASA source; not converted to Third Edition
  review_scope:
    printed_pages: 95-96
    pdf_pages: 103-104
    original_source_images_reviewed: true
    content_class: attributed_claim
  comments:
  - speaker: Grip
    printed_page: 95
    timestamp: 11:14:16/9-9-54
    claim: Reacts favorably to the street-officer salary ceiling; offers no alternative verified figure.
  - speaker: Norris
    printed_page: 95
    timestamp: 18:42:17/9-9-54
    claim: Says 20,000 nuyen would be inadequate compensation for the perceived personal danger of routine
      street policing.
  - speaker: Lance
    printed_page: 95
    timestamp: 21:00:35/9-10-54
    claim: Claims 20,000 nuyen exceeds this speaker’s annual shadowrunning income; personal comparison, not
      a general earnings statistic.
  - speaker: Reno
    printed_page: 95
    timestamp: 16:52:07/9-12-54
    claim: Questions whether seniority-based raises resemble union pay arrangements.
  - speaker: Arlo
    printed_page: 95
    timestamp: 19:09:24/9-12-54
    claim: Argues that promotion sometimes reflects tenure rather than competence and that capable managers
      can also reward performance. A qualified opinion, not a fixed corporate rule.
  - speaker: X-Star
    printed_page: 95
    timestamp: 12:42:23/9-13-54
    claim: Alleges some managers give excessive weight to attendance while others reward merit and competence;
      contests universal promotion-by-seniority claims.
  - speaker: Louis
    printed_page: 95
    timestamp: 23:33:11/9-7-54
    claim: Describes fictional administrative-office politics as cutthroat and hostile; alleges some information
      workers engage in rivalry.
  - speaker: The Finger
    printed_page: 95
    continues_on_printed_page: 96
    timestamp: 11:26:46/9-10-54
    claim: Concludes an earlier exchange by saying data-processing employees wield information power; a speaker
      interpretation, not an established access-control specification.
  - speaker: Wolf
    printed_page: 96
    timestamp: 03:57:31/9-6-54
    claim: Claims a Milwaukee vice president could earn 200,000 nuyen through a percentage of company proceeds
      and alleges CEO James Wilson receives 2.6 million; neither figure is endorsed by the narrator.
  - speaker: Luce
    printed_page: 96
    timestamp: 11:44:52/9-10-54
    claim: Dismisses the practical value of employees’ benefits to the forum audience.
  - speaker: Argent
    printed_page: 96
    timestamp: 15:10:51/9-11-54
    claim: Responds that salary and benefits matter to a person considering compromising an employer; distinguishes
      the employee’s existing compensation from what would be lost, without a confirmed offer or event.
  attribution_boundary: These are named, dated, fictional 2054 Shadowland messages. The book’s salary and health-plan
    figures appear separately as narrator-established material; speculative salary figures and judgments in
    the comments are not promoted to facts.
headline: Fictional salary-and-benefits Shadowland commentary — FASA Lone Star Sourcebook (FASA7115, 1994),
  Second Edition-era, pp95–96/PDF103–104
summary: Eleven attributed fictional 2054 comments on pay, seniority, office politics and health cover; disputed
  figures remain named allegations, not narrator facts.
