id: reference.organization.draco-foundation-assets-relations
record_type: reference
name: "Draco Foundation Assets and External Relations"
domain: organizations
status: ingested
assets:
  legacy:
    - "Undisclosed remaining portion of Dunkelzahn's hoard and estate."
    - "Potential magical items, art, securities, real estate and intelligence archives."
  facilities:
    - "Worldwide branch-office network; office scale varies from small local suites to substantial facilities."
    - "Rumors of secret warehouses, caches, runner-training sites and drake safehouses are not confirmed."
  shadow_assets:
    - "Regular use of hired shadowrunners."
    - "Assets, Inc. retained as a prominent Foundation team."
    - "Ryan Mercury identified as team leader and adept; Jane-in-the-Box as decker."
  drakes:
    - "Foundation provides sanctuary, assistance and education to awakened drakes."
relations:
  nations:
    NAN: "Generally cordial/cooperative when interests align."
    CAS: "Relations improved after Foundation participation in resolving Ghostwalker's Denver takeover and transfer of former Aztlan sector."
    Aztlan: "Openly hostile; Foundation is effectively banned and accused of sponsoring terrorism."
    Tir_Tairngire: "Frosty; recurring dispute around Dunkelzahn's First Key of Power bequest condition."
    Tir_na_nOg: "Frosty for the same Key of Power condition."
  megacorporations:
    general: "No stable megacorporate alliance; corps distrust Foundation independence and its ability to disturb existing power balances."
    Ares: "Source commentary suggests the strongest pragmatic corporate connection through Daviar/Damien Knight/UCAS interests, but not a permanent alliance."
  peer_organizations:
    friendly_or_related:
      - "Dunkelzahn Institute of Magical Research"
      - "Astral Space Preservation Society"
    competitors:
      - "Atlantean Foundation"
      - "Illuminates of the New Dawn"
    explicitly_not_affiliated:
      - "Children of the Dragon"
      - "Church of the Dragon Reborn"
  dragons:
    - "Early relations with great dragons were cordial but cool, focused on delivery of bequests."
    - "Foundation representatives later had direct dealings with Ghostwalker and Hestaby."
    - "Drake sanctuary creates potential conflict with great dragons seeking those drakes."
sources:
