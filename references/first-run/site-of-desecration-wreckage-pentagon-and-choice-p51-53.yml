  encounter_setup:
  - printed_page: 51
    book_narrator: At Hemlock Pass the runners find a wrecked smugglers’ vehicle; the source’s read-aloud passages describe
      a ruined craft, signs of surviving occupants, and an armed standoff with survivors emerging from nearby rocks and
      brush.
  - printed_page: 51
    book_narrator: The five surviving Pentagon smugglers initially mistake the runners for attackers. Their defensive
      reaction is a misunderstanding; they may cease fighting if they understand the situation.
  - printed_page: 52
    book_narrator: After the crash the party requires passage to the Tooth to obtain Daisy’s cargo. The printed scenario
      prefers a short encounter followed by negotiations with the crew.
  pentagon_cast:
  - printed_page: 51
    name: Pounder
    identity: Black dwarf from New Orleans; Pentagon leader and spokesperson, but Breetva handles most bargaining.
  - printed_page: 51
    name: Breetva
    identity: Tall human brunette of Russian descent, identified with a noticeable accent and as the party’s principal
      negotiator.
  - printed_page: 52
    name: Heeley
    identity: Adult human rigger who appears about twelve years old and speaks with a Southern drawl; do not mistake
      apparent age for being a child.
  - printed_page: 52
    name: Red-Scale-Snake
    identity: Female Amerindian ork, a Snake shaman from the Pueblo Corporate Council.
  - printed_page: 52
    name: Night-Strike-Woman
    identity: Red-Scale-Snake’s twin sister, a physical adept.
  starting_wounds_as_printed:
    printed_page: 52
    Heeley: Deadly Stun damage
    Night-Strike-Woman: No damage reported
    Red-Scale-Snake: Light Physical wound and Serious Stun damage
    Pounder: Light Physical damage
    Breetva: No damage reported
  attributed_accounts:
  - printed_pages: 52-53
    speaker: Pounder
    claim: The Pentagon visited the Tooth to collect merchandise, was attacked by the Tooth Warriors, lost its cargo,
      and crashed after Heeley temporarily lost control of the craft.
  - printed_pages: 52-53
    speaker: Red-Scale-Snake
    claim: She reports astrally observing a rainbow-colored, humanoid spirit and interprets the attack as involving a
      dangerous shaman or spirit. Her account is her stated understanding, not an independent factual finding.
  choices_as_written:
  - printed_page: 53
    optional: Breetva can arrange a three-party bargain under which runners escort the Pentagon to the Tooth, recover
      Daisy’s magical telesma, and exchange some of Daisy’s merchandise for a vehicle or other resources.
  - printed_page: 53
    conditional: The smugglers cannot assume the party’s aid without agreement. Runners who leave may lose Daisy’s pay
      and contact; those who succeed in negotiations may obtain future smuggling leads or compensation.
  source_boundaries: Character descriptions and prior events are fictional; reports by the Pentagon are attributed to
    named speakers. Potential outcomes depend on participant choices and gamemaster adjudication.
