summary: Third-person archival extraction from FASA Corporation’s published fictional tabletop RPG adventure First Run
  (FASA7329, 1999), printed pp51-53/PDF52-54; distinguishes book-narrator facts, character statements and optional GM
  events, retaining exact original mechanics where present.
