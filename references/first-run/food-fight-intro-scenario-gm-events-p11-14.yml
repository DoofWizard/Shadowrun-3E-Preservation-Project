{"id":"reference.first_run.food_fight_intro_scenario_gm_events_p11_14","record_type":"reference","status":"reviewed_forward_unindexed","source":"source.fasa-7329","printed_pages":"11-14","pdf_pages":"12-15","edition_scope":"FASA Corporation, First Run (FASA7329, copyright 1999), original Shadowrun Third Edition fictional tabletop-roleplaying adventures; no later-edition conversion","content_class":["campaign_guidance"],"data":{"publication":{"title":"First Run","publisher":"FASA Corporation","author":"Michael Mulvihill","copyright_year":1999,"catalog_number":"FASA7329","source_id":"source.fasa-7329","edition":"Shadowrun Third Edition","cataloged_original_pdf_sha256":"222cb911ef86b0ddf2a853d622068859fe09a078d23c881a32cee0100eaf0c5e","printed_pages":"11-14","physical_pdf_pages":"12-15"},"original_page_mapping":{"printed_11":12,"printed_12":13,"printed_13":14,"printed_14":15},"scenario_title":"Food Fight","scope":"The source presents this introductory fictional combat scenario as a teaching exercise for Shadowrun Third Edition, not a documented in-world occurrence or recommended real-world conduct.","purpose_and_player_entry":{"primary_mechanical_purpose":"Introduce playing characters, dice rolls and the Shadowrun combat system in a short supermarket shootout. The adventure supports any character types; the book permits gamemasters to use the sample characters in the SR3 core rules beginning at printed p65.","setting":"The story opens at a standard twenty-four-hour Stuffer Shack convenience store on a Seattle street at night; the store address is not identified.","conflict":"A six-member fictional street gang, the Chiller Thrillers, seeks to rob the store and its customers. The core scenario is an introductory skirmish, not an investigative mystery."},"gang_entrance_sequence":{"first_inside":["SlicerDicer","Static","Zany"],"signal_to_leader":"After checking the store, the three inside signal Catcher that the store is ready for a robbery.","arriving_from_parking_lot":["Catcher","Wiley","Spike"],"entrance_event":"The original scenario says Spike smashes the exterior PanicButton(TM) security box so that it cannot be used; Catcher, Wiley and Spike enter the Stuffer Shack demanding compliance while SlicerDicer, Static and Zany are already positioned inside.","precombat":"Until the players choose to act or Catcher orders action, the Chiller Thrillers intimidate the customers and attempt to collect their belongings. Zany and Wiley are described as targeting people for property and provoking violence.","escalation":"The scene intensifies if customers or players object: the gang responds violently, and the read-aloud passage on printed p14 has Wanda scream, SlicerDicer display his katana and the remainder of the gang enter through the damaged front door.","initiative":"The source explicitly says no Initiative is rolled at the initial non-combat entrance. Once the gunfire begins in the read-aloud trigger at the end of printed p14, players may roll Initiative."},"read_aloud_setup":{"position":"GM reads after characters arrive at the store (printed p12).","visitor_context":"The book introduces player characters as hungry and out late; rainy weather in the Stuffer Shack parking lot is a setting detail, without an independent assertion that every character is cold or wet.","shop_description":"The shop advertises synthetic snack foods, household items and arcade entertainment and is staffed by a tired cashier.","ordinary_people":"The scene contains cashier Wanda, manager Mr. Nick, employees and several named customers; all are fictional sourcebook NPCs who are not initially expecting the robbery."},"hooks":{"layout":"A familiar standardized chain-store layout encourages players to navigate aisles without needing a tour.","concealability":"The author notes that stores have little security and that weapons with Concealability Ratings lower than 5 can be carried inside; this is in-universe RPG adventure framing rather than an external safety statement.","manager_panic_button":"If the manager sees the threatening events and can react, he attempts to use the panic control contacting the fictional Lone Star security service. The GM may conceal the act from player characters.","entrance_pacing":"The game master can vary player arrival and shopping details; this is an optional setup, not a deterministic historical event."},"behind_scenes":{"parking":"The lot contains about six cars or vans, a pair of bikes and an electric scooter. Rainwater collects in puddles.","ordinary_store_behavior":"The GM can give characters a map or read out merchandise and positions, allow shopping choices, and then ask for relevant checks if a character attempts to identify concealed armament.","perception_rule_reference":"The author suggests a Perception Success Test using target number 8 to notice concealed weapons on ordinary patrons in the shop; it is a source-specific example, not a universal concealment rule.","staging":"The adventure treats the player character route through the shop and timing of confrontation flexibly."},"people_in_the_store":[{"name":"Wanda","role":"Elven checkout clerk in Area A","role_in_scene":"Startled by disturbance, stays behind the checkout; the author says she forgets to operate the panic control."},{"name":"Mr. Nick","role":"Dwarf manager","role_in_scene":"Works in the store, has a Defiance shotgun under his desk (Shotgun skill 2), hides behind boxes, and attempts a panic alert before confronting the robbers when he believes the moment is right."},{"name":"Mrs. Needles","role":"Human customer","role_in_scene":"Described as shopping with her small child, trying to keep her family unharmed and shouting at the attackers as the situation develops."},{"name":"Louis Needles","role":"Child customer","role_in_scene":"Talks to the shoppers about urban legend figures during the scene, despite being told not to."},{"name":"Johnny","role":"Human Stuffer Shack stockboy, not a customer","role_in_scene":"Gangly adolescent store employee who attempts to hide during the robbery, remaining behind boxes of soup in Aisle 16."},{"name":"Timmy Thinners","role":"Elven customer, not human","role_in_scene":"Scrawny elf shopping for audio players in Area D who tries to summon courage to talk to Wanda."},{"name":"Jack Scatman","role":"Rock-music-fashion patron shopping with Angie Scatman; no separate metatype established.","role_in_scene":"Described as having clothing, jewelry, and handgun gear; he and Angie are present while buying food."},{"name":"Angie Scatman","role":"Rock-music-fashion patron shopping with Jack Scatman; no separate metatype established.","role_in_scene":"Shops with Jack; the source depicts their provocative styling, not an established organized role in the robbery."}],"gang_character_distinctions":[{"name":"Catcher","portrayal":"Named gang leader who receives the interior scouts\u2019 signal and arrives with Wiley and Spike."},{"name":"SlicerDicer","portrayal":"One of the three inside scouts, described on printed p14 as dressed in a Japanese warrior costume and displaying a katana."},{"name":"Static","portrayal":"One of the three gang scouts already inside the store when Catcher arrives."},{"name":"Zany","portrayal":"One of the three initial inside scouts; along with Wiley, the source says she searches shoppers for valuables."},{"name":"Wiley","portrayal":"Named gang member who arrives with Catcher and Spike; with Zany, the source depicts body-searching patrons for valuables."},{"name":"Spike","portrayal":"Named gang member who destroys the exterior PanicButton box before the rest of the gang enters."}],"class_limits":"NPC attribute and weapon stat blocks on printed pp15\u201317 are distinct rules-bearing content, and must receive their own protected mechanics record. The supermarket sweep table on p17 is independent of this scenario summary."},"headline":"Source-verified archival record: Food Fight introductory adventure and encounter flow","summary":"Fictional tabletop-RPG archival record from First Run, FASA Corporation, FASA7329 (1999), original Shadowrun Third Edition, printed pp11-14/physical PDF pp12-15. GM-only timing, cast, scene choices and in-world motives are separated from player-facing text and from exact combat/NPC statistics.","framing":"newsroom_neutral"}
