    "scope": "Historical guide for running fictional Shadowrun tabletop adventures; the GM suggestions are discretionary, not additional mandatory game mechanics or descriptions of events in reality.",
    "book_purpose": "First Run is an accessory for learning or teaching Shadowrun Third Edition. It offers three adventure treatments progressing from a quick combat example through modular encounters to a longer exploration, plus advice about adapting published modules to a group's play style.",
    "three_adventure_treatments": [
      {
        "title": "Food Fight",
