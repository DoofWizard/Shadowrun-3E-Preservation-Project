    "game_master_advice": {
      "role": "The gamemaster portrays the surrounding game world, adjudicates fictional NPC and event responses, and helps players build the story collaboratively; the book warns against treating the GM-player relationship as adversarial.",
      "solving_problems": "The published game rules are a reference for resolving conflicting interpretations; the book acknowledges mutually accepted house rules but calls for fairness, clarity to all players, and consistency rather than changing adjudications unpredictably.",
      "steps": [
        {
          "step": 1,
          "label": "Read the adventure",
          "source_intent": "Understand the overall plot and player-facing objectives while recognizing that character choices may diverge from the printed path."
        },
        {
          "step": 2,
          "label": "Assess the adventure",
          "source_intent": "Adapt difficulty, opponents, and expectations to the actual player group rather than assuming every written scene will play out exactly."
        },
        {
          "step": 3,
          "label": "Know the characters",
          "source_intent": "Review player sheets and note distinctive abilities, advantages, and contacts before play."
        },
        {
          "step": 4,
          "label": "Write yourself notes",
          "source_intent": "Keep usable descriptions, NPC statistics, scene outlines, and adjustments at hand; do not depend on remembering every detail of the book."
        },
        {
          "step": 5,
          "label": "Don't panic",
          "source_intent": "Improvise when players produce unexpected choices; do not treat a missed clue or altered scene as fatal to the campaign."
        }
      ]
    },
    "context_note": "Printed p5 is an atmospheric introductory example about a team and warehouse confrontation; its fictional narrative is not prescribed as a fixed historical event or as game-resolution instructions.",
