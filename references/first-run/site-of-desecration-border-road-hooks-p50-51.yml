headline: 'FICTIONAL Shadowrun Third Edition source record: First Run (FASA Corporation, FASA7329, 1999), printed pp50-51/PDF51-52
  — Border crossing, Denny Creek, terrain and travel encounters'
summary: Third-person archival extraction from FASA Corporation’s published fictional tabletop RPG adventure First Run
  (FASA7329, 1999), printed pp50-51/PDF51-52; distinguishes book-narrator facts, character statements and optional GM
  events, retaining exact original mechanics where present.
