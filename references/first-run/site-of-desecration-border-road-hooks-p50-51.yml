  default_route:
  - printed_page: 50
    source_fact: The adventure sends the fictional runner team eastward out of Seattle on Interstate 90 toward Denny
      Creek, then along the creekside road into the Cascade Mountains and off-road toward Hemlock Pass, approximately
      a mile north of the creek source.
  - printed_page: 50
    conditional: If runners do not obtain an off-road vehicle, the GM depicts an extended walk. The text cites Ford Bison
      or GMC Banshee as example alternatives to an off-road vehicle; VTOLs and rotorcraft are possible but generally
      too small for a full party.
  - printed_page: 50
    conditional: If the group travels by air, a published boxed scene has the aircraft approach from the Redmond Barrens
      and cross the Salish-Shidhe border low before rising once inside. The adventure says air entries receive more scrutiny
      than an ordinary road vehicle.
  regional_context:
  - printed_page: 50
    book_narrator_fact: In the Salish and Cascade Ork lands the Seattle-based visitors are outsiders; Denny Creek is
      a small tourist, farming and rafting town inhabited mostly by humans, with a few metahumans seen as outsiders.
  - printed_page: 50
    book_narrator_fact: 'Denny Creek has two notable creekside stops: Keekwulee Falls and Snowshoe Falls, used for hiking
      and rafting; the surrounding landscape becomes rough wilderness.'
  gamemaster_options:
  - printed_page: 50
    optional: Play up a sense of unfamiliarity in the mountains, the broad daylight, social distrust of Seattle, and
      different attitudes in the Salish and Cascade communities; do not record every optional reaction as a fixed event.
  - printed_page: 50
    optional: A border-guard ID check, prejudice at a stopover, and a view of the scenic mountain landscape are example
      encounters; the encounter difficulty is adjustable.
  - printed_page: 51
    optional: Off-road travel can introduce muddy tracks, downed trees, sudden cliffs or other obstructions and occasional
      forest encounters. The gamemaster may choose mundane or Awakened animals, using SR3 Critters/Gamemaster Screen
      as historical references.
  - printed_page: 51
    optional: Examples explicitly offered for wildlife include aardwolves, barghests, blood kites, cerebus hounds, dzoo-noo-qua,
      griffins, harpies, imperial eagles, thunderbirds and lesser thunderbirds, oracle owls, piasmae, and shapeshifters.
  - printed_page: 51
    optional: If border guards or Metroplex Guards are deceived or attacked, the source suggests reusing Red Samurai
      statistics from the preceding Supernova scenario but using armor vests with plates rather than Red Samurai armor.
  source_boundaries: All roads, borders and authorities are fictional setting descriptions. Encounter suggestions are
    optional branches, not claims of accomplished player actions.
