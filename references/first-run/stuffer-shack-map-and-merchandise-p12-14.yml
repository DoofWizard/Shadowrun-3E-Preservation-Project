{"id":"reference.first_run.stuffer_shack_map_and_merchandise_p12_14","record_type":"reference","status":"reviewed_forward_unindexed","source":"source.fasa-7329","printed_pages":"12-14","pdf_pages":"13-15","edition_scope":"FASA Corporation, First Run (FASA7329, copyright 1999), original Shadowrun Third Edition fictional tabletop-roleplaying adventures; no later-edition conversion","content_class":["narrative_context"],"data":{"publication":{"title":"First Run","publisher":"FASA Corporation","author":"Michael Mulvihill","copyright_year":1999,"catalog_number":"FASA7329","source_id":"source.fasa-7329","edition":"Shadowrun Third Edition","cataloged_original_pdf_sha256":"222cb911ef86b0ddf2a853d622068859fe09a078d23c881a32cee0100eaf0c5e","printed_pages":"12-14","physical_pdf_pages":"13-15"},"original_page_mapping":{"printed_12":13,"printed_13":14,"printed_14":15},"map_type":"Original overhead Stuffer Shack floor-plan and numbered aisle/area key, including four cameras and two linked panic controls; reference diagram is printed on p12, full key continues pp13\u201314.","map_reference":"The source illustration labels 18 aisles in paired rows plus Areas A\u2013H and J\u2013L. The entrance is centered at the bottom of the map, the checkout counter and back rooms are left, and security cameras are marked O and panic controls PB. Area I does not appear.","numbered_aisles":[{"aisle":1,"content":"Air filters, radon testers, water purifiers, Detoxi products and other environmental and anti-pollution items."},{"aisle":2,"content":"Automotive and bike supplies."},{"aisle":3,"content":"Soaps, detergents, insect-control sprays and other household pest items."},{"aisle":4,"content":"Small hardware, household goods, paint and spray paints."},{"aisle":5,"content":"Personal hygiene supplies, strips and sprays (source describes these as ordinary consumer goods)."},{"aisle":6,"content":"First-aid supplies and medicinals, with advertising for patent medicines, vitamins and fluids."},{"aisle":7,"content":"Pet foods and supplies."},{"aisle":8,"content":"Small appliances including branded microwaves, roasters, coffee makers and similar items."},{"aisle":9,"content":"Locked shelf of audio/video simchips and simdisks; a sign advertises a new simsense chip."},{"aisle":10,"content":"Disposable plastic tableware, containers and utensils."},{"aisle":11,"content":"Baked goods, convenience snacks and a refrigerated synthetic-cake display on the Area E side."},{"aisle":12,"content":"Breakfast foods and cereals, including flavors of Maxiblast Sugar Bombs."},{"aisle":13,"content":"Soykaf, teas and drink mixes."},{"aisle":14,"content":"Two shelf groupings: Aztechnology-branded Aztex-mex selections on the left; pricier imported Native American Nations and Tir Tairngire foods on the right."},{"aisle":15,"content":"Chips, dips, crackers, cookies and other packaged snacks."},{"aisle":16,"content":"Sauces, soups, noodles, and prepackaged heat-and-serve meals."},{"aisle":17,"content":"Plastic-wrapped fresh fruits and vegetables, with small radiation wrappers on packaging; the source alleges preservation treatment but does not characterize wrappers as a specific warning label."},{"aisle":18,"content":"Nutrisoy, flavor additives, sugars, textured vegetable protein and substitutes."}],"areas":[{"area":"A","purpose":"Checkout counter, with bar-code scanner, cash-register terminal, card reader and displays; cashier Wanda is stationed here."},{"area":"B","purpose":"Four coin-operated arcade cabinets, with the fictional game titles Little Mutant VIK Ninja Cyberboy! 3, Orbital Ninja Death Commando 5, The All-New Ultimate Bike Race Ninja Street Duel, and Street Fighting Magical Ninja 8."},{"area":"C","purpose":"Manager\u2019s office with a second panic button, shotgun and camera recorder."},{"area":"D","purpose":"Locked display of small personal electronics such as computer readers, music players and simsense rigs."},{"area":"E","purpose":"Dispensers for liquids and viscous branded refreshments; source refers to Soykaf and Shakeups among products."},{"area":"F","purpose":"Food-preparation appliances, including a cook-it-yourself microwave, rotating pizza display and hot-dog and Soy Patty preparation devices."},{"area":"G","purpose":"Employee lounge, clock, toilet, lockers, sofa and chairs; adjacent area is restroom."},{"area":"H","purpose":"Stockroom, with a back door leading to the alley."},{"area":"J","purpose":"Cold-food storage with microwaveable foods near Area F, overnight-delivered sandwiches and soy-based drinks."},{"area":"K","purpose":"Frozen foods and preserved confectionery near Aisles 1 and 2."},{"area":"L","purpose":"Old-fashioned printed magazines and books, plus electronic news/holoreader terminals."}],"security_and_access":{"number_of_cameras":4,"cameras":"One above checkout records the person and register; another faces the front door; a third monitors back corners between Areas J and K; a fourth covers parking lot.","panic_controls":"One under checkout counter (direct access to Lone Star) and a second in the manager office, Area C. The diagram uses the labels PB and O.","restroom_and_backdoor":"Restroom access is indicated on the left side near Area G; stockroom Area H includes a back door to an alley."},"published_visuals":[{"printed_page":12,"description":"Black-and-white top-down shop floor plan with shelf rows, labeled areas and security labels."}],"interpretation":"The aisle inventory and brand references are the adventure author\u2019s fictional retail setting, not a list of real goods to source or directions for real-world concealment. Missing Area I is not invented; the printed map uses A\u2013H and J\u2013L."},"headline":"Source-verified archival record: Stuffer Shack map, aisle inventory and original art","summary":"Fictional tabletop-RPG archival record from First Run, FASA Corporation, FASA7329 (1999), original Shadowrun Third Edition, printed pp12-14/physical PDF pp13-15. Source-image map review preserves 18 aisles and labeled areas, four camera markers, two panic controls and author-described merchandising.","framing":"newsroom_neutral"}
