  chapter_opening:
    title: Site of Desecration
    starting_printed_page: 44
    theme: A looser scenario-driven adventure with player choices and opportunities
      to add optional encounters or side stories, unlike the more linear preceding
      Supernova scenario.
    intended_use: The author presents material suitable for participants learning
      about the Shadowrun world while allowing a gamemaster to add original subplots.
  gamemaster_method:
    required_vs_optional: The book describes key source setting and background, while
      explicitly permitting the gamemaster to alter or omit individual elements, introduce
      new motivations, or create extra adventures. Such changes are options rather
      than canonical event history.
    recommended_preparation: Keep notes during the adventure, consider the reference
      works Shadowrun Gamemaster Screen and Critters for wild animals and paranormal
      creatures, and choose optional plot hooks based on the players.
    experienced_groups: The book explicitly invites experienced players and gamemasters
      to make the storyline more demanding.
  published_setup:
    place: The Tooth, a fictional area of the Cascade Mountains on Cascade Ork tribal
      territory, with an isolated smuggling corridor between Seattle and the rest
      of the UCAS.
    historical_tension: Fictional local residents have become dissatisfied with outsiders
      leaving merchandise and contraband in the area; the passage reports smugglers
      trafficking weapons, electronics, alcohol, simsense and related goods.
    key_people:
    - Katoz, a local farmer and member of the Tooth community
    - Denver Bob, an experienced smuggler leading the Tooth Warriors and their armed
      shipment
    - The Old One, a nature spirit independent of a conjurer
    - Daisy, a talismonger who later approaches the player characters
    chronological_events:
    - phase: prior to player-character employment
      account: Katoz discovers a crashed Ares Dragon rotocraft once used by smugglers
        and meets a powerful nature spirit he names the Old One. He initially believes
        the spirit can help keep smugglers away.
    - phase: following month
      account: Denver Bob leads another smuggler shipment into the Tooth. Katoz and
        the Old One confront the group. The ambush destroys the aircraft and forces
        the smugglers to abandon cargo; some escape.
    - phase: after the clash
      account: A smuggling team called the Pentagon engages the runners through Daisy
        to recover its lost magical telesma. The player characters must travel into
        the Cascades and meet the team.
    causal_attribution: The published background says Katoz assumes he controls the
      Old One, but the Old One in fact manipulates and controls Katoz. The players
      do not initially know the true relationship.
  fiction_provenance: All descriptions concern an invented Shadowrun setting; optional
    gamemaster revisions are not recorded as fixed events.
