{"id":"reference.first_run.supernova_milk_run_recovery_four_corners_scenes_p28_32","record_type":"reference","status":"reviewed_forward_unindexed","source":"source.fasa-7329","printed_pages":"28-32","pdf_pages":"29-33","edition_scope":"FASA Corporation, First Run (FASA7329, copyright 1999), original Shadowrun Third Edition fictional tabletop RPG adventure; no later-edition conversion","content_class":["campaign_guidance"],"data":{"publication":{"title":"First Run","publisher":"FASA Corporation","author":"Michael Mulvihill","copyright_year":1999,"catalog_number":"FASA7329","source_id":"source.fasa-7329","edition":"original Shadowrun Third Edition","cataloged_original_pdf_sha256":"222cb911ef86b0ddf2a853d622068859fe09a078d23c881a32cee0100eaf0c5e","printed_pages":"28-32","physical_pdf_pages":"29-33"},"original_page_mapping":{"printed_28":29,"printed_29":30,"printed_30":31,"printed_31":32,"printed_32":33},"structure":[{"section":"Milk Run concluding scene","pages":"28-29","summary":"A seemingly simple retrieval at TekLon becomes tense when unseen activity occurs near the exit. The book encourages suspense without necessarily forcing a confrontation.","alternatives":"An optional brief encounter with minor magical critters, additional distractions, or a harmless alarm may be used by the GM; these are not automatic events."},{"section":"Waiting Is the Hardest Part","pages":"29-30","summary":"The team gets a limited break after the lab, and an intermediary telephones a later meeting arrangement. The characters may speak with contacts or attempt other actions while waiting.","alternatives":"Safehouse and recovery choices can affect preparedness; contact usefulness varies by the relationship and time."},{"section":"Four Corners","pages":"30-32","summary":"Nigel directs an exchange in Bellevue at 100th and Main. A badly damaged vehicle approaches; the intended courier Elizabeth Chavez is involved. Renraku Red Samurai arrive as the encounter escalates. The narrative's planned result is a disputed case and an electronic personal assistant linked to another meeting.","alternatives":"The scenario explicitly allows player characters to react differently, and the printed sequence is GM scaffolding rather than fixed setting history."}],"distinct_characters":[{"name":"Nigel Terwilliger","role":"Fictional TekLon-linked intermediary, the Mr. Johnson for the scenario; directs the fictional players toward the rendezvous."},{"name":"Elizabeth Chavez","role":"Fictional Novatech-linked courier involved in the case exchange; source scenario depicts her being killed during the scripted escalation. Player decisions may change encounter timing."},{"name":"Renraku Red Samurai","role":"Fictional elite corporate combat group in the written encounter; the magazine-style adventure stages their entry as an antagonist event."}],"geography":{"city":"Bellevue district, Seattle of the fictional Shadowrun setting","location":"Intersection of 100th Street and Main Street; source describes adjacent four-story commercial buildings and an alley, but no real-world route is presented as operational advice."},"planned_combat_sequence":[{"turn":1,"event":"One Red Samurai team descends and begins engagement; mages are scheduled for a separate initiative timing."},{"turn":2,"event":"An armed group pressures the vehicle carrying the case; mages and cyberzombie enter later."},{"turn":3,"event":"Renraku personnel concentrate on retrieving the corporate property."},{"turn":4,"event":"Survivors may withdraw toward their vehicle."},{"turn":5,"event":"The van departs while the cyberzombie remains unable to drive."}],"scene_qualifier":"This is an optional, fictional adventure scenario. The scripted death and military/corporate actions are source-narrative events, not real-world factual allegations or mandatory outcomes.","rules_separation":"Exact ability, initiative, Perception TN, wound, maglock and other mechanics are preserved in separate source-reviewed exact-rule records."},"headline":"Supernova — fictional GM scene framework from lab exit through Four Corners","summary":"Source-reviewed FASA Corporation First Run (FASA7329, 1999), original Shadowrun Third Edition, printed pp28–32/PDF29–33; distinct GM scene options and scripted fictional character/organization events.","framing":"newsroom_neutral"}
