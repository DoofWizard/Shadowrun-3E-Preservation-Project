  smuggler_hospitality:
    printed_page: 55
    situation: Katozk has taken Denver Bob, the Pentagon, Crescent Eye and other smugglers
      to the Site of Desecration, the Tooth Warriors’ camp around a wrecked Ares Dragon
      rotorcraft. The party may enter voluntarily as visitors or captives.
    physical_site: Numerous fires and temporary shelters surround the crashed rotorcraft;
      approximately fifty orks and trolls are present, none appearing to be a trained
      magician.
    old_one_behavior: The man-of-the-woods changes among tree, animal and humanoid
      forms while judging party members.
    breetva_bargain: Breetva initially offers Daisy’s sake in exchange for stolen
      goods, then alcohol, consumer products and a simsense deck; the source says
      she knows the cargo contents despite appearances and may pursue her own deal.
    katoz_belief: Katozk wrongly believes the runners have concealed advanced equipment;
      he regards smugglers as exploiters and tries to use the spirit to force departures.
  conversation_and_branching:
  - pages: 55-56
    speaker: Old One
    claim: The spirit wants the runners to show that they and their associates are
      trustworthy and should not harm Katozk or the Tooth. He is also probing their
      capacities and motives.
  - page: 56
    option: Runners talk to the Old One alone.
    source_outcome: After a successful test, the spirit evaluates their mettle and
      may be persuaded that Katozk is abusing it. He can set challenges unrelated
      to the runners’ immediate interests.
  - pages: 56-57
    option: Runners bring evidence from the rotorcraft crash.
    source_outcome: A competent rigger can identify evidence that the crashed craft
      was not engaged in combat with local defenders; this can undermine the Old One’s
      interpretation.
  - page: 57
    option: Runners make a deal to leave.
    source_outcome: Tooth Warriors may permit departure without much equipment, while
      Katozk keeps most captured goods and tests whether the party is truthful.
  - page: 57
    option: Katozk tries to betray the deal.
    source_outcome: He sends people to retrieve crates, then seeks to keep the party
      at camp; the Old One may expose his control of the spirit as false and choose
      one runner or Pentagon member as a potential companion.
  - page: 57
    event: Katozk fires his Ares Predator after objecting to the spirit’s departure.
    book_presentation: The printed Spirit World sequence first depicts the weapon
      firing at a selected character, then reveals that the bullet ricochets off a
      rock and the Ares Dragon wreckage and strikes Katozk in the head. The illusion/reveal
      is a scripted fictional event, not a player choice.
  - page: 58
    option: The party truthfully explains its work as a favor for Daisy.
    source_outcome: The Old One may release the runners and Pentagon from supernatural
      confusion and allow recovery of the stash.
  - page: 58
    option: The party falsely claims it will take the Old One elsewhere.
    source_outcome: After game tests, the spirit may initially believe the claim,
      but will eventually discover the deception.
  - page: 58
    option: The spirit attempts to accompany the runners.
    source_outcome: The text offers GM fallback options allowing the Pentagon or its
      own change of mind to resolve the complication without forcing a fixed ending.
  optional_stash_suggestions:
    printed_page: 58
    book_status: Examples only; the GM may choose what the Tooth holds.
    categories:
    - Cases of rifles, SMGs or pistols and appropriate ammunition
    - Simchips and computer electronics
    - Medical supplies including patches and medkits
    - Alcoholic beverages or drugs from fictional regions
    - Magical telesma and magical items
    - Cultural artifacts, sports and tourist merchandise
    - Personal computers and cheap cyberdecks
    - Daisy’s missing crates
    - Exotic GM-selected compensation such as vehicles, drones, artwork or advanced
      equipment
  return_to_seattle:
    pages: 58-59
    narrator: After the mountain scenario the team returns to Seattle; Daisy is not
      yet in the city and is expected several days later. The team may stay overnight
      to avoid conspicuous border crossing and may gain smuggler contacts if it aided
      the crews.
    consequences: If the team fails to bring Daisy’s magical goods, payment and future
      contacts can be reduced. An Old One companion may prove more difficult than
      expected, and Daisy may seek additional assistance.
  future_campaign_hooks:
    page: 59
    sourcebooks:
    - Cyberpirates
    - 'Target: Smuggler Havens'
    - New Seattle
    notes: The source proposes follow-up smuggling adventures, further work for Daisy
      and contacts with the Pentagon. These are optional future developments.
  attribution_boundary: All outcomes are published conditional GM branches; the Spirit
    World scene contains scripted fictional violence, not actual history. The spirit’s
    claims and Katozk’s misconceptions are not narrator facts.
