ints to separate game-statistics entries."},"pushing_envelope":"For a more demanding fictional encounter, the GM may add a pursuing unit, producing an extended chase.","debugging":[{"condition":"Player characters critically injured or incapacitated","option":"The source permits a fictional DocWagon rescue for characters with platinum contracts and a benefactor having paid treatment costs."},{"condition":"Characters crash and lack a way to escape","option":"The source proposes a surrender/rescue branch; Renraku interrogates the characters and later lets them go without equipment, retaining credsticks in this optional outcome."},{"condition":"Characters decide to turn against Villiers and Lanier","option":"The authored scene allows Villiers to bargain while Renraku forces approach, followed by alternatives involving the cases and possible Renraku custody."}],"favors":{"examples":["cyberware","adept training","game equipment","vehicles","spells","assistance when in danger","mysterious aid"],"qualification":"The GM chooses from these hypothetical benefits; no benefit is unconditional canon. Villiers may seek repayment in service or use the team for further assignments."},"source_attribution":"This is third-person archival reporting of hypothetical game-master options, not real-world operating guidance."},"headline":"Supernova — original GM finale, contingency hooks and Villiers favors","summary":"Fictional tabletop-RPG GM guidance from FASA Corporation's First Run (FASA7329, 1999), original Shadowrun Third Edition, printed pp37–38/PDF38–39; conditional scene variants, author-suggested future adventure hooks and game benefits.","framing":"newsroom_neutral"}
