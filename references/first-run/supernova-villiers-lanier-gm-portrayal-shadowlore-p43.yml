  gm_guidance:
    section: Playing Villiers and Lanier
    printed_page: 43
    character_statistics: No printed numeric NPC stat blocks for either corporate executive. The GM may
      author attributes and skills to suit the game, with Villiers and Lanier generally higher Intelligence
      and Willpower than the players, other attributes roughly comparable or higher, social/Intelligence
      skills notably better, and Lanier combat skills higher.
    source_established_equipment: Both corporate executives have datajacks; they are not otherwise described
      as heavily augmented.
    narrator_role: Confidence and significant corporate influence are more important to portray than overpowering
      the party in a fight; their relationship to shadowrunners is mostly strategic.
