  encounter_scene:
    printed_page: 54
    narrator_setup: At the farm clearing, the fictional adventurers discover a human
      farmer, Katozk, conversing with a supernatural Old One while Tooth Warriors
      watch captives and Denver Bob. The book supplies a read-aloud scene describing
      a captured smuggling crew and unusual forest activity.
    tooth_warriors_initial_strength: 'At least six fighters: three trolls and three
      orks; the GM may increase this for a more intimidating encounter.'
    other_participants:
    - Farmer Crescent Eye and his relatives are present near the house.
    - Denver Bob and surviving smugglers are held at the barn; others are visible
      around the site.
    - The Old One is at the edge of the woods and initially shows little visible reaction.
    source_perspective: The published scenario establishes that the Old One directs
      Katozk; Katozk believes himself in command, a belief the book does not endorse.
  roleplaying_context:
  - printed_page: 54
    speaker: Katozk
    attributed_statement: He claims smuggling is ruining his land and says the Old
      One protects the Tooth; he interprets his access to captured supplies as justified
      local authority.
  - printed_page: 54
    speaker: Crescent Eye
    attributed_statement: He explains that Denver Bob brought medicine for a sick
      person and that local farmers have depended on passing smugglers for supplies.
  - printed_page: 54
    speaker: Pounder
    attributed_statement: He identifies the captives as a Denver-linked team called
      the Black Dogs and asks whether Denver Bob is present.
  published_action_reaction_branches:
  - option: A
    printed_page: 54
    player_choice: The team observes a warrior striking Denver Bob.
    reaction_1: If the adventurers do not intervene, Night-Strike-Woman leaves cover
      to reach the barn and tries to help, eventually injuring one or two warriors
      before capture.
    reaction_2: Pounder may surrender to protect his teammate; the text directs play
      toward Smuggler Hospitality.
  - option: B
    printed_page: 54
    player_choice: Katozk asks the Old One to create a new clearing for smugglers.
    reaction_1: The spirit vanishes beneath ground and returns in an alarming form;
      it deploys Fear, prompting Crescent Eye to flee while warriors restrain him.
    reaction_2: The Tooth Warriors also panic, then become confused by the Old One.
    reaction_3: If the characters are discovered through these effects, Katozk may
      capture and question them.
  - option: C
    printed_pages: 54-55
    player_choice: A character uses astral perception or projection.
    consequence: The Old One follows the astrally active person, then reappears nearby,
      using Crescent Eye as leverage and warning against disclosure.
    reaction_1: The adventurers may be able to reason with the spirit away from Katozk.
  - option: C continuation
    printed_page: 55
    player_choice: The adventurers attempt a direct strike or trick against the spirit.
    reactions:
    - The spirit uses Confusion and Accident, followed by Fear, to expose them to
      Katozk.
    - Accident can discharge a firearm and draw warrior attention.
  - option: D
    printed_page: 55
    player_choice: The party attacks Katozk and his warriors.
    reaction_1: The Old One uses its powers to stop the attack; surviving characters
      are directed toward the Smuggler Hospitality consequences.
  gamemaster_bounds:
    printed_page: 55
    advice: Optional forest encounters from Mother Nature may increase pressure. The
      Pentagon smugglers should act consistently in pursuit of goods and survival;
      conflict need not be gratuitous. Branches are contingencies, not events that
      always happen.
  fictional_context: The described characters, confrontations and magical powers are
    narrative branches in a published tabletop role-playing adventure; the source
    does not describe real people or actual crimes.
