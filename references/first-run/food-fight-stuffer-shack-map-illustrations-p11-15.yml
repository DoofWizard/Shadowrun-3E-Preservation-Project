{"id":"reference.first_run.food_fight_stuffer_shack_map_illustrations_p11_15","record_type":"reference","status":"reviewed_forward_unindexed","source":"source.fasa-7329","printed_pages":"11-15","pdf_pages":"12-16","edition_scope":"FASA Corporation, First Run (FASA7329, copyright 1999), original Shadowrun Third Edition fictional tabletop roleplaying adventure; no later-edition conversion","content_class":["narrative_context"],"data":{"publication":{"title":"First Run","publisher":"FASA Corporation","author":"Michael Mulvihill","copyright_year":1999,"catalog_number":"FASA7329","source_id":"source.fasa-7329","edition":"Shadowrun Third Edition","cataloged_original_pdf_sha256":"222cb911ef86b0ddf2a853d622068859fe09a078d23c881a32cee0100eaf0c5e","printed_pages":"11-15","physical_pdf_pages":"12-16"},"original_page_mapping":{"printed_11":12,"printed_12":13,"printed_13":14,"printed_14":15,"printed_15":16},"archival_scope":"Sourcebook floor plan and black-and-white artwork for Food Fight, a fictional introductory Shadowrun Third Edition adventure. Map labels describe an invented retail environment, not a real address or building.","illustrated_pages":[{"printed_page":11,"physical_pdf_page":12,"type":"Chapter-opening black-and-white illustration","description":"A broad horizontal monitor with a small scene of stylized figures is suspended among dense cables and side speakers; a bold FOOD FIGHT title sits above. The illustration introduces the scenario rather than documenting an actual event."},{"printed_page":12,"physical_pdf_page":13,"type":"The Stuffer Shack site floor plan","description":"Rectangular convenience-store schematic with central paired aisles 1–18, checkout and manager areas at left, rear storage and side service areas, a front entrance near the bottom center, security-camera symbols, and two interior panic-button labels. The plan's map key continues on printed pp13–14."},{"printed_page":15,"physical_pdf_page":16,"type":"Black-and-white encounter illustration","description":"One stylized gang figure brandishes a long blade in front of a brick-wall background, while another frightened figure is partially visible. The scene is decorative fictional encounter artwork; it is not a playable tactical map."}],"map_heading":"The Stuffer Shack","source_legend":{"PB":"Panic Button; examples marked in checkout/manager areas","O":"Security cameras; the accompanying description states four cameras in total"},"topology":"Entrance on the lower edge, paired shelves Aisles 1/2 through 17/18 progressing toward the rear, left-side employee/office areas and right-side product areas. Map markings identify lettered Areas A–L as well as the two panic buttons and cameras.","floor_plan_regions":[{"label":"A","description":"Checkout counter: cashier, barcode scanner, register, credstick receptor and small displays; one panic control."},{"label":"B","description":"Four coin-operated simsense arcade machines."},{"label":"C","description":"Manager's office: a second panic button, a firearm under the desk and the security-camera recorder."},{"label":"D","description":"Locked display of low-cost consumer electronics, portable players, personal computers and data readers."},{"label":"E","description":"Drink and liquid-food dispenser bars."},{"label":"F","description":"Food-preparation machines and disposable tableware, including a microwave, pizza display machine and synthetic hot-food dispenser; printed description continues onto p14."},{"label":"G","description":"Employee lounge with time clock, lockers, sofa, chairs and attached restroom."},{"label":"H","description":"Stockroom; an additional door connects to the alley behind the store."},{"label":"I","description":"Cold-food shelves and displays; depicted near the top of the plan."},{"label":"J","description":"Prepared chilled meals and sandwiches, beverages and other cold foods, with microwavable products nearest Area F."},{"label":"K","description":"Frozen foods and frozen confections adjoining Aisles 1 and 2."},{"label":"L","description":"Books and magazines, two NewsFax terminals and a HoloQuik copy machine."}],"paired_aisle_directory":[{"aisle":1,"contents":"Air filters, radon testers, water purifiers, detoxification products and home-environment supplies."},{"aisle":2,"contents":"Automotive and bicycle supplies."},{"aisle":3,"contents":"Soaps, detergents, traps and household pest-control products."},{"aisle":4,"contents":"Small hardware, tools, paint and household sprays."},{"aisle":5,"contents":"Personal hygiene products and toiletries."},{"aisle":6,"contents":"First aid, medications, vitamins and related pharmacy goods."},{"aisle":7,"contents":"Pet food and pet supplies."},{"aisle":8,"contents":"Small appliances, coffeemakers and similar household devices."},{"aisle":9,"contents":"Locked display of chips and simdisks; surrounding store merchandise includes commercial entertainment."},{"aisle":10,"contents":"Disposable plastic household goods, clothing, tablecloths, utensils and umbrellas."},{"aisle":11,"contents":"Cakes, doughnuts, bakery goods and a NutraSoy Energy Cakes display."},{"aisle":12,"contents":"Breakfast products, prepared cereals and synthetic breakfast foods."},{"aisle":13,"contents":"Teas, herbal teas, coffee substitutes and beverage mixes."},{"aisle":14,"contents":"Aztex-mex foods and imported organic health-food displays."},{"aisle":15,"contents":"Snacks, chips, cookies and packaged candy."},{"aisle":16,"contents":"Soypasta, sauces, ramen-style noodles, soups and dehydrated foodstuffs."},{"aisle":17,"contents":"Packaged fruit and vegetables with irradiation-prevention packaging graphics."},{"aisle":18,"contents":"Flour, flavor additives, textured proteins, sugar substitutes and bulk ingredients."}],"nonduplicate_reference":"The accepted First Run Food Fight campaign-guidance record already covers the scenario's people and events. This distinct record preserves the original floor-plan geometry, aisle/area legend and visual-art inventory; it is not a new narrative or mechanical interpretation."},"headline":"Food Fight — Stuffer Shack floor plan and original illustrations","summary":"Source-reviewed fictional tabletop-RPG visual-reference inventory from First Run (FASA Corporation, FASA7329, 1999), original Shadowrun Third Edition, printed pp11–15/physical PDF pp12–16: map, areas A–L, aisles 1–18 and two original illustrations.","framing":"newsroom_neutral"}
