gel Terwilliger) hires a runner team to obtain a case from TekLon, with subsequent corporate complications. The longer plot and the character motivations are independently indexed in a world_fact record; player decisions can alter the sequence.","page_22_suggested_timeline":[{"time":"7:00 p.m.","event":"Characters contacted by their fixer","scenario":"A Job Is a Job Is a Job"},{"time":"8:00 p.m.","event":"Meet Nigel at Club Penumbra","scenario":"A Job Is a Job Is a Job"},{"time":"9:00 p.m.","event":"Runners head to safehouses for gear/go to Auburn","scenario":"A Job Is a Job Is a Job"},{"time":"10:00 p.m.","event":"Runners enter the sewer tunnels","scenario":"Milk Run"},{"time":"10:30 p.m.","event":"Reach the wall outside TekLon","scenario":"Milk Run"},{"time":"11:30 p.m.","event":"Inside TekLon obtaining the case","scenario":"Milk Run"},{"time":"12:00 a.m.","event":"Out of the sewer in Auburn","scenario":"Milk Run"},{"time":"12:15 a.m.","event":"Call Mr. Johnson","scenario":"Waiting Is the Hardest Part"},{"time":"12:30 a.m.","event":"Johnson contacts runners with exchange information","scenario":"Waiting Is the Hardest Part"},{"time":"2:00 a.m.","event":"Exchange with Chavez","scenario":"Four Corners"},{"time":"2:06 a.m.","event":"Attack by Renraku Red Samurai","scenario":"Four Corners"},{"time":"2:30 a.m.","event":"Flee scene with both cases/Chavez's PDA","scenario":"Four Corners"},{"time":"3:00 a.m.","event":"Chavez's meeting downtown","scenario":"Nobody Will Believe You"},{"time":"3:10 a.m.","event":"Meet Lanier, Villiers and Nigel","scenario":"Nobody Will Believe You"},{"time":"4:00 a.m.","event":"All deals are made","scenario":"Nobody Will Believe You"},{"time":"4:15 a.m.","event":"Hand over the case to Villiers","scenario":"Too Much of a Good Thing"},{"time":"4:20 a.m.","event":"The second Renraku attack","scenario":"Too Much of a Good Thing"},{"time":"4:30 a.m.","event":"The hopeful escape","scenario":"Too Much of a Good Thing"}],"timeline_qualification":"The source presents approximate suggested times for pacing; it explicitly warns unpredictable characters and GM changes may alter the timetable.","opening_meeting":{"section":"A Job Is a Job Is a Job","location":"Club Penumbra in Seattle","contact":"An intermediary fixer calls the players to meet Mr. Johnson; the entry code supplied in this fictional scene is Nigel.","published_offer":"20,000 nuyen per player character, payable on completing the adventure's described mission, with no money up front in the initial offer.","offered_materials":"A sewer/laboratory map, a wrist cellphone, an entry-solvent accessory and a physical description of the target case are provided in the story.","nigel_portrayal":"He appears nervous and inexperienced at acting as a Mr. Johnson, with a silver case, a TekLon-related security folder, and a higher corporate background concealed from player characters.","opening_condition":"The scenario begins as the player group agrees to the job and is directed to prepare and proceed toward Auburn."},"hook_and_debugging":"The author uses nightclub atmosphere and an uneasy client to introduce hiring, fictional secrecy and RPG social interaction. Optional GM debugging addresses violent player deviations or club conflict, rather than asserting unavoidable outcomes.","scenario_transition":"Printed p24 begins Milk Run and introduces travel to the Auburn tunnel; the tunnel and laboratory's detailed operational play continues on later pages and is not claimed complete in this record.","rules_separation":"All fixed die rolls, explicit target numbers, spell adjudications, weapon concealability and negotiation success thresholds from pp23–24 are retained in a separate exact-rule record.","visual_separation":"The original Supernova title illustration on p18 and page art on p19 are indexed separately in the narrative_context art record."},"headline":"Supernova — historical GM preparation, scenario timetable and job briefing","summary":"Source-reviewed fictional 