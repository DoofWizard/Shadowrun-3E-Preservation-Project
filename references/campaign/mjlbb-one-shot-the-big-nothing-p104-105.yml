data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  scenario: The Big Nothing
  client: Larry Smithson
  compensation: {group_nuyen: 7000, free_vip_access_years: 1, drinks_included: false}
  timing: {rival_club_opening_weeks: 1, urgency: immediate}
  location_template: {name: Social Services Office, printed_page: 77}
  cast:
    - {name: Larry Smithson, npc_rating: Inferior, professional_rating: 1}
  adjudication:
    - In the fictional adventure the client seeks to ruin a rival club without an insurance payout. The first leg can be played as a physical-entry or Matrix encounter; the fictional policy excludes earthquake coverage.
    - GM may reduce the first leg's difficulty if the players are intended to complete both legs, increase opposition if competition is too low, and emphasize the opening deadline.
    - The scenario's magical solution specifies an earth elemental of Force 8 or greater; alternative is a great form earth elemental or equivalent spirit with sufficient capability. GM is advised to make the fictional task difficult but possible.
    - The source calls for a rare knowledgeable NPC contact (geology professor or geomancer) for the second leg, and optional resistance from the rival's hired NPCs.
  scope: Scenario-local fictional parameters; no general summoning rule or real-world procedure introduced.
