  national_republic_of_poland:
    legal_entry_visa_required: true
    visa_application_timing: in advance
    application_proof: Business inside Poland must be demonstrated to the embassy.
    corporate_visa: Major corporations operating in Poland can issue visas to their employees.
    pilgrim_visa: {issuer: Catholic Church, permitted_destination: Częstochowa only}
    typical_fictional_patrol_group_size: 8
    typical_support: drones
  free_republic_of_poland:
    visa_required_in_principle: true
    qualification: The book describes discretionary admission by volunteer border controllers.
  tricity:
    visa_exemption_visit_duration: {comparison: less_than, days: 90}
  resolution: No visa application target number, price, or success probability is specified here. The patrol number describes a typical fictional encounter, not a fixed encounter roll; use the separately published SR3 game statistics for resolution.
