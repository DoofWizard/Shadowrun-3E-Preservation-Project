id: reference.campaign.cyberpirates-philippines-financing-trade
record_type: reference
name: "Cyberpirates - Philippines Financing and Trade"
domain: campaign
status: ingested
source_period: "2059"
source: source.fasa-7124
canonical_region: world.region.philippines-2059
printed_pages: "74-77"
pdf_pages: "75-78"

revenue_sources:
  corporate_goods:
    - "The chapter presents corporate facilities and outbound shipping as the main sources of high-value goods available to pirate crews."
    - "Examples include prototype electronics, cyberdecks, computers, drones, robotics, medical products and biotechnology."
    - "Corporate research data, personnel files and commercially useful technical information are also treated as saleable assets."
  natural_resources:
    - "The Philippines is described as the world's seventh-largest gold producer in the source period."
    - "Copper from the Cordillera, oil around Mount Apo and hardwood are identified as additional export commodities."
  magical_goods:
    - "Telesma can command high prices but is described as a small specialist market."
    - "A Shadowland commentator estimates that only about 0.18 percent of the local population could both use and afford a focus; this is retained as an attributed market estimate, not a demographic rule."

huk_exchange:
  - "The Huk is described as accepting useful equipment, fuel, vehicles, medical expertise, replacement parts and intelligence."
  - "In return, crews may receive shelter, contacts, local information, introductions and work."
  - "The chapter says Huk resources are heavily committed to food, medicine and basic support, so trade and barter can be more common than cash payment."
  - "The source specifically notes demand for cyberware parts because augmentation beyond common headware/datajacks is difficult to obtain legally."
  - "Information about corporate or Imperial planning is presented as especially valuable to the Network."

distribution_network:
  - "Most crews are described as selling through movers, fixers and intermediaries rather than directly handling long-distance distribution."
  - "Nearby transit markets include Malaysia, Australia, Thailand and Indonesia."
  - "Tourist and passenger traffic provides substantial legal maritime movement in and out of the islands, while cargo distribution is handled through a mix of commercial and covert channels."
  - "The chapter warns that political factions, commercial smugglers and profiteers may compete for or manipulate the same cargo and information networks."

foreign_markets:
  primary:
    - "Aztlan"
    - "Amazonia"
    - "Tir Tairngire"
    - "Tir na nOg"
    - "Taiwan"
    - "England"
  other_context:
    - "The source says Japanese goods can command higher prices in markets where Japanacorps face trade restrictions."
    - "North American sales are described as less attractive because Japanese consumer goods are already widely available, with California Free State singled out as an exception."
    - "Trade into CalFree is associated with demand for effective government, consumer products and selected magical goods in the source commentary."

corporate_information_market:
  - "Biotechnology, environmental research, medical technology and corporate records are presented as information categories with buyers outside the Philippines."
  - "The chapter treats corporate rivalry as a potential market for information about personnel, projects and competitors."
  - "No fixed resale table or SR3 price modifier is given in this section; quoted profits in Shadowland posts remain anecdotal examples."

source_attribution:
  - "Claims about organized-crime buyers, corporate infiltration of the Huk and individual foreign sponsors remain attributed Shadowland commentary."
  - "The trade geography and item categories are normalized as campaign-world guidance, not as universal pricing rules."

sources:
