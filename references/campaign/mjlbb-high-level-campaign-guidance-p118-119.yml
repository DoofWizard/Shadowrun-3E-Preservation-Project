headline: "Mr. Johnson's Little Black Book (FanPro25003, FanPro, SR3), fictional Shadowrun pp118-119/PDF119-120: high-level campaign guidance"
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  resource_access:
    printed_page: 118
    setup: The GM and players choose a country before character creation and determine the fictional agency's training, equipment and other resources.
    examples:
      - An agency might regularly provide alpha- and beta-grade cyberware.
      - Another might favor intensive training and loaned high-grade accessories.
    discretion: Available resources ultimately depend on the GM; neither example is a guaranteed character entitlement.
    extension: The same guidance applies to megacorporate employees, including runners and legitimate troubleshooters; independent contractor campaigns are also suggested.
  challenge_design:
    printed_page: 119
    choices: The GM can challenge experienced characters through conflicting moral obligations as well as technical opposition.
    resource_loss: The GM may create scenarios where a sponsor withdraws gear or characters temporarily lose access to their usual equipment or magical resources; the text poses possible constraints, not automatic penalties.
    opposition: The publication recommends opponents of comparable high capability.
    reputation: Unwanted publicity and loss of cover may complicate the fictional campaign; the text mentions another initiation level as necessary to change a magician's astral signature and does not specify a replacement initiation procedure.
  related_creation_option: option.mjlbb.high-level-creation-p119
  related_resource_rules: option.campaign.srcomp-law-campaign-resource-access-p117-118
  scope: Discretionary campaign guidance, not a universal equipment benefit, ownership transfer, price adjustment or initiation exception.
