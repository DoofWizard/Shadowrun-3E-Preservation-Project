headline: Fictional Shadowrun SR3 City Streets templates (FanPro25003), printed pp74-76/PDF75-77
summary: Fictional city location guidance in Mr. Johnson's Little Black Book, FanPro, SR3.
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  general:
    printed_page: 74
    attention: NPCs notice runners whose clothing differs from local attire.
    zone_factors: [Gridlink, GridGuide sensors, Panicbutton booths, vehicle patrols, foot patrols]
    host_scope: Public telecoms and corner credstick readers where present.
  templates:
  - name: Strivers Row
    printed_pages: [74, 75]
    zone: C
    road: {direction: east-west, traffic: two-way, gridlink: true, parking: alternate sides, enforcement: infrequent}
    north_side: {apartment_buildings: 2, apartment_floors: 8, park_m: [30, 30], private_brownstone_floors: 5}
    south_side: {apartment_buildings: 4, apartment_floors: 6, church_floors: 2, church_first_floor_ceiling_m: 10}
    fixtures: {foodmart_telecom: working, foodmart_panicbutton: not working, church_corner_panicbutton: working}
    residential_entry: {south_apartment_maglock_rating: 4, condition: resident must admit visitor, doormen: false}
    npc_security: Armed doormen at the two north apartments protect their residents but do not intervene in street violence; advertised neighborhood watch is not functioning.
    public_security: Minimal fictional Lone Star coverage, partly working cameras at intersections and GridGuide sensors at east and west intersections.
    other_features: Shamanic magic shop stocks authentic materials; church basement serves as soup kitchen; former gang building is under renovation with ownership uncertain.
  - name: Downtown
    printed_pages: [75, 76]
    zone: A
    road: {direction: north-south, traffic: two-way, lanes: 4, gridlink: true, parking: particularly scarce on weekends}
    typical_building_floors: [18, 40]
    condo_buildings: 2
    major_clubs: 2
    telecoms: Functioning public telecom at each corner.
    public_security: Frequent foot and vehicle patrols, street cameras, Panicbutton booths near three named businesses, and GridGuide coverage of street and parking spaces.
    bias: Appearance, behavior and odor affect social reception; crowds avoid obvious runner or gang attire; some NPCs activate Panicbutton when followed or harassed.
    turnover: Club names change about every six months.
  - name: Market Street
    printed_page: 76
    zone_range: [AA, B]
    zone_by_condition: {business_hours: AA, night: A, off_season_night: B}
    public_telecoms: 4
    designated_matrix_terminals: 3
    building_floor_max: 4
    vehicle_access: Cars prohibited along the entire block.
    mall: More than half underground.
    public_security: Regular foot and bicycle patrols.
    crowd: Families, children, tourists and daytime performers.
    encounter_context: Fictional marketplace includes Fenwick's Bar and Grill, identified by the book as a front for illicit trade involving local smugglers and pirates.
