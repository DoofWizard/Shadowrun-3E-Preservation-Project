headline: "Mr. Johnson's Little Black Book (FanPro25003, FanPro, SR3), fictional tabletop pp20-21/PDF21-22: negotiation and payment guidance"
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  dependency: {publication: Shadowrun Companion, printed_page: 100, rule: rule.campaign.srcomp-baseline-shadowrun-payment-table-p99-100}
  pay_factors: Campaign style, living and mission expenses, danger and difficulty, and employer-supplied information and resources.
  budget:
    cash: Employer has a budget ceiling; initial offer should leave bargaining room.
    additional_support: Extra equipment or information, rather than payment in kind, reduces the available budget and may lower the offered fee.
    in_kind_equipment:
      usual_affordable_over_budget_percent: 25
      condition: Corporate employer paying in actual corporate gear; few employers offer the full extra amount.
      scope: Suggested employer capacity, not a guaranteed increase, gear price discount, or cash multiplier.
  up_front_payment:
    maximum_fraction: {numerator: 1, denominator: 2}
    rarely_exceeds_fraction: {numerator: 1, denominator: 3}
    preference: Employer avoids advance payment where possible.
    scope: Fictional employer negotiation guidance, not a universal payment entitlement.
  expenses:
    expected: Employer generally covers miscellaneous mission expenses, including travel, and covers visa fees; unoffered expenses may not be reimbursed if the team forgets to ask.
    identity: Characters normally supply their own identity documents; employer may make exceptions.
    negotiated: Responsibility for travel arrangements, gear purchases and other expenses is settled through negotiation.
  currency:
    default: nuyen
    alternatives: Other currencies are possible; GM should state the exchange rate.
    corporate_scrip: Spendable only with issuing corporation; offer may be higher due to restricted usefulness.
  low_difficulty_pay_example:
    amounts_nuyen: [10000, 20000]
    interpretation: Source suggests these amounts are generally excessive for very low-risk play; illustrative, not a fixed cap or fee schedule.
  scope: Campaign payment guidance, retaining the Companion baseline table without replacing it.
