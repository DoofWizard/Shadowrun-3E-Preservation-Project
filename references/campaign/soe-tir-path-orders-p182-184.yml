headline: FanPro25002 Shadows of Europe (FanPro), fictional Shadowrun Third Edition, pp182-184/PDF183-185, Path of the Wheel orders
summary: Fictional magical-order affiliations, doctrine and campaign membership qualifiers, with existing resolution rules retained.
data:
  publication: {title: Shadows of Europe, publisher: FanPro, edition: SR3, catalog: FanPro25002}
  section: The Paths and Magical Orders
  doctrine:
    page: 182
    intended_followers: Elves alone according to the described Danaan doctrine; some scholars and family leaders allow the possibility of enlightened spirits in other metatypes, a minority position.
    structure: Five paths, four equally important paths associated with the cardinal directions and a fifth set above them associated with the center; each is officially supported by an order that initiates and guides students in Tir na nOg.
  orders:
    - path: Warrior
      order: Cu Chulainn
      page: 182
      typical_initiates: Mostly adepts, with some magician adepts and magicians.
    - path: Steward
      order: Etain
      page: 183
      attributed_membership: {speaker: Connor, claim: Membership is exclusively elven and usually drawn from Danaan families.}
    - path: Bard
      order: Brigid
      page: 183
      attributed_practice: {speaker: Silicon Mage, claim: Initiates often use performance as a means of centering and integrate magic into performance.}
    - path: Druid
      order: Ogma
      page: 183
      role: Umbrella organization for the various druidic circles in Tir na nOg.
    - path: Rígh
      order: "Sun, Moon and Stars"
      pages: '183-184'
      aliases: [Order of Kings, Sacred Order of Tara]
      membership_count: {less_than: 50, scope: Entire fictional nation}
      attributed_membership: {speaker: Sidhain, claim: Membership is invitation-only and self-selecting, including influential Danaan family members.}
  existing_game_rules: [rule.soe.path-magic-ogam-stones-p235-236, option.magic.path-wheel-warrior, option.magic.path-wheel-steward, option.magic.path-wheel-bard, option.magic.path-wheel-druid, option.magic.path-wheel-righ]
  qualification: The doctrinal and order membership descriptions are not new universal character-creation prerequisites or spell bonuses. Preserve the existing exact Path Magic rules and general initiation and centering mechanics.
