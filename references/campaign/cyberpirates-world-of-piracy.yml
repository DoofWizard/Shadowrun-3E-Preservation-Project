id: reference.campaign.cyberpirates-world-of-piracy
record_type: reference
name: "Cyberpirates - A World of Piracy"
domain: campaign
status: ingested
source_period: "2050s"
source: source.fasa-7124
printed_pages: "10-22"
pdf_pages: "11-23"

pirate_economy:
  supply_and_demand:
    - "Piracy targets goods, cargo and vessels that can be resold through illicit markets."
    - "The value of stolen goods depends strongly on demand, buyer access, transport cost and the ability to move goods without attracting enforcement."
    - "Smuggling and piracy frequently overlap because stolen cargo still needs distribution routes and buyers."
  contacts:
    - "Pirates rely on fences, smugglers, syndicates, dockworkers, ship crews, fixers and buyers."
    - "Trust and reputation matter because crews operate in environments where formal contracts and enforcement are limited."
  buyers_and_payment:
    - "Stolen cargo commonly sells below nominal retail value because buyers absorb risk, transport and laundering costs."
    - "The chapter emphasizes that identifying a buyer before an operation can substantially reduce post-operation risk."
    - "Specialized cargo may require specialized contacts and may be difficult to liquidate quickly."

crew_structure:
  common_roles:
    - "captain/leader"
    - "rigger or pilot"
    - "deck/Matrix specialist"
    - "combat personnel"
    - "Awakened support"
    - "technical/repair specialists"
    - "boarding or underwater specialists"
  observations:
    - "Effective crews combine navigation, vehicle handling, communications, technical repair and combat capability."
    - "Many crews are small enough that members fill multiple roles."
    - "Rigging capability is especially valuable for vessels and sensors."
    - "Deckers may be uncommon on smaller crews but provide communications, intelligence and electronic access."
    - "Awakened members may provide astral reconnaissance, magical defense and environment-specific support."

raid_framework:
  preparation:
    - "Select targets based on cargo, defenses, route and available buyers."
    - "Establish approach, interception, boarding, extraction and escape plans."
    - "Account for sensors, communications, escorts and nearby enforcement."
  execution:
    - "The chapter describes interception and boarding as coordinated vehicle/team operations rather than isolated personal combat."
    - "Surprise, deception and controlling communications can matter as much as raw firepower."
    - "Crews need contingency plans for damaged vessels, injured personnel and failed boarding attempts."
  aftermath:
    - "Move or conceal captured cargo quickly."
    - "Avoid predictable routes and known enforcement concentrations."
    - "Repair, refuel and replace expendable equipment before the next operation."

bases_and_routes:
  hideouts:
    - "Useful bases combine concealment, access to transport routes, supplies, repair capability and defensible approaches."
    - "Remote islands, secluded harbors and hidden coastal facilities are common models."
  route_selection:
    - "Pirates balance traffic density, expected cargo value, patrol activity, weather and escape options."
    - "Long-distance operations require fuel, repair, provisions and reliable navigation."

law_and_enforcement:
  - "Maritime enforcement varies by territorial waters, national jurisdiction and the identity of the victim."
  - "Major corporations and governments can field aircraft, ships, sensors, Matrix support and specialized security."
  - "Border crossings and open-ocean pursuit complicate jurisdiction but do not eliminate enforcement."
  - "The chapter treats piracy as a high-risk criminal profession with long-term consequences for identity, reputation and movement."

escape_and_survival:
  - "Successful escape may require alternate landing sites, hidden supply caches, misleading routes and redundant transportation."
  - "Weather and sea conditions can be as important as hostile pursuit."
  - "Crews operating far from shore must plan for casualties, vessel failure and loss of communications."

hostages:
  source_treatment:
    - "The chapter discusses hostage-taking as a fictional pirate practice and notes that it can greatly increase enforcement pressure."
    - "Magic, surveillance and corporate/government response make prolonged hostage situations particularly risky."
  normalization:
    - "Retained as campaign-world context rather than procedural instruction."

provenance_policy:
  - "First-person pirate commentary is treated as character perspective."
  - "Specific claims about organizations, corruption, or enforcement weaknesses remain attributed unless established elsewhere."

sources:
  - {source: source.fasa-7124, printed_pages: "10-22", pdf_pages: "11-23", relation: defines_campaign_world}
