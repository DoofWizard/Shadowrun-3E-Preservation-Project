data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  scenario: Deliver Me from Evil
  recruitment: The fictional fixer requests a meeting with the client within one hour.
  compensation:
    offered_nuyen: 500
    noncash: Courtside season tickets
    condition: Bring Zephram Hood to the stadium before tip-off.
    additional_reward: Hood offers his complimentary tickets to that game after arrival.
  cast:
    - {name: Zephram Hood, npc_rating: Superior, professional_rating: 2}
  encounter:
    security_zone: Z
    gang_minimum_multiplier_of_runner_count: 2
    gang_composition: Some members ride bikes and others are on foot.
    initial_state: Hood survived the fictional mob's assault and is trying to leave the neighborhood; the gang is circling when the runners locate him.
  ritual_sorcery:
    initial_material_link_available: false
    first_available_material_link: Hood's blood on the clothing of the fictional mob members who assaulted him.
    time_constraint: Ritual tracking may take too long to meet the deadline.
  adjudication:
    - The GM may run the adventure as a race against the deadline or as a social investigation involving the fictional mob and street contacts.
    - An optional twist has the mob direct the gang to keep Hood down; the gang then misleads the runners, leading to confrontation.
  scope: These are adventure-specific circumstances and discretionary choices, not a replacement for general material-link, NPC or encounter rules.
