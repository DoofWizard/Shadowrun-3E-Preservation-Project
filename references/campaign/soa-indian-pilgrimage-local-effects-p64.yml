data:
  publication: {title: Shadows of Asia, publisher: FanPro, edition: SR3, catalog: FanPro25007}
  scope: In-universe GaneXa account of fictional SR3 locations and visitor reports; local scenario adjudication, not established real-world phenomena or universal game rules.
  rameshwaram:
    location: Temple complex at the Great Dham of Rameshwaram.
    purifying_well_count: 22
    claimed_effects: The wells reportedly have distinct-tasting water and allegedly bestow magical gifts, including new senses and extraordinary longevity.
    corridor_claim: Walking the mandapa on certain unspecified days is believed to allow access to the heavens.
    qualification: No specific gift assignment, date, duration, test or rating is supplied.
  taj_mahal_agra:
    astral_shallow: Described by the chapter narrator as an astral shallow, with strong positive emotions perceptible even to mundane characters.
    resident_spirit: Benign powerful ashura known as Mumtaz; reportedly resident since spring of 2062.
    spirit_communication: Described as speaking to no one.
    visitor_claim: While Mumtaz is seen moving through the halls and gardens, visitors report seeing and speaking with recently deceased loved ones in bardo, before reincarnation.
    qualification: Reports are unexplained; no fixed interaction test, guaranteed effect, spirit Force or background count is prescribed.
  existing_mechanics: Ganges mana surges and Orissa astral network are separately indexed under their Game Information rules.
