printed_pages: "57-60"
pdf_pages: "58-61"

joining_and_affiliation:
  - "The chapter presents Huk affiliation as a spectrum ranging from political or community support to direct participation in pirate cells."
  - "New participants often enter through personal networks, family connections, employers, community contacts or existing resistance groups."
  - "Unaffiliated pirates can operate in the Philippines, but the source portrays them as lacking the information, shelter and social protection available to crews connected to local networks."
  - "Supporters may contribute food, hiding places, information, introductions or other assistance without serving as active pirates."

training:
  - "New recruits are described as spending time in dispersed safe houses and training sites before receiving specialized duties."
  - "Training locations include northern Luzon support sites, remote islands off Palawan and concealed maritime bases."
  - "Initial instruction emphasizes sailing, escape, basic field skills and service across multiple support roles before specialization."
  - "Experienced members commonly mentor small groups of roughly three to five recruits at a time."
  - "Foreign or outside specialists may be valued for languages, piloting, technical work or other scarce skills."

cell_structure:
  - "Permanent large crews are discouraged in favor of temporary mission teams drawn from a wider pool."
  - "The source describes typical action teams as roughly six to thirty pirates."
  - "Compartmentalization is intended to limit internal rivalry and reduce the damage caused by infiltration or capture."
  - "Factional differences are common, but the broader network is expected to cooperate when operations serve shared resistance goals."

funding_and_logistics:
  - "Piracy, smuggling and resale of captured cargo are presented as major funding sources for ships, supplies, displaced families and hidden personnel."
  - "The chapter treats fixers and intermediaries as essential because crews often need buyers, medical support, safe routes and replacement equipment."
  - "Revenue-producing operations coexist with explicitly political missions; source commentary disagrees about how consistently individual crews follow ideological goals."

security_and_infiltration:
  - "The Huk is described as highly concerned with informants, double agents and factional penetration."
  - "Outside operatives can be useful but are also treated as potential intelligence risks."
  - "The chapter portrays trust as local and relationship-based rather than guaranteed by a single central membership system."

provenance_policy:
  - "Descriptions of recruitment pressure, ideological commitment and internal discipline come largely from partisan speakers and are normalized as campaign-world practice rather than universal fact."
  - "Graphic anecdotal material is omitted where it adds no mechanical, organizational or provenance value."

