employment_and_movement:
  - "The source presents local employment as strongly dependent on relationships with regional authorities, corporations, traders and community intermediaries."
  - "Seasonal weather is a major logistical constraint; the rainy season is identified as roughly June through August, when roads may become unreliable."
  - "Local guides, river knowledge and community contacts are repeatedly treated as important to inland movement."
  - "The Black Volta and other river systems function as major transport corridors where road access is poor."
  - "The source distinguishes inland and ocean-going groups: larger seagoing vessels are associated with longer-range commerce, while small local craft dominate many coastal and river operations."

environmental_constraints:
  - "Wildlife, disease, difficult terrain and limited medical access are recurring regional hazards."
  - "The source includes anecdotal descriptions of venomous animals and tropical disease but supplies no SR3 damage code, target number, resistance test or disease stat block in this subsection."
  - "Agricultural and mining sites may be remote from major settlements and depend on river or improvised transport."

resource_and_trade_categories:
  - "Gold, diamonds, bauxite, cocoa and coffee are major regional commodities."
  - "Corporate products, electronics, medical goods and magical materials are also described as significant trade categories."
  - "The source distinguishes direct resource markets from secondary markets that depend on intermediaries, port access and foreign buyers."
  - "Magical goods are described as having especially strong foreign demand in jurisdictions with restrictive magical markets."

