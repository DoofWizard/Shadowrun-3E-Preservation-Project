headline: Fictional Shadowrun Third Edition regional magical eligibility and services
data:
  publication:
    title: Shadows of Asia
    publisher: FanPro
    edition: SR3
    catalog: FanPro25007
  scope: In-world campaign conditions reported for fictional Iran; not current law
    or a new spellcasting resolution system.
  narrator_account:
    speaker: Spectral Shah
    spellcasting_permit_required: true
    ordinary_permit_scope: Only simple magic, with no specified spell category or
      Force threshold.
    unlicensed_spellcasting_possible_consequence: The narrator warns of forced lobotomy
      and resulting permanent loss of spellcasting.
    shamanic_magic_prohibited: true
    stated_shamanic_magic_penalty: Death.
    legal_services:
    - provider: Islamic Renaissance Movement
      service: Legal help in religious cases
      cost: free
    - provider: Zoroastrian Order
      service: Assistance obtaining spellcasting licenses
      cost: unspecified
  corporate_exception_report:
    speaker: Felix
    qualification: Megacorporations have special permits for magic and cyberware;
      an employer contact might obtain one for a character working for a megacorporation.
  resolution: The source does not specify a permit price, application test, required
    successes or a spell Force limit. The visitor-entry requirements on pp218-219
    remain separate.
