headline: 'FanPro25003, FanPro, SR3 fictional tabletop RPG, pp73-74/PDF74-75: Bar templates'
summary: Fictional location guidance in Mr. Johnson's Little Black Book, FanPro, SR3.
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  general:
    printed_page: 73
    layout: Main room and side corridor to facilities; normally front and service entrances, with front-door guards depending on establishment.
    staffing: At least one bartender and several servers; upscale establishments may use service drones.
    amenities: Table viewscreens may provide ordering and entertainment; games and food vary.
    admission: Atmosphere governs dress, clientele, prejudice and security; fictional venues may expect patrons to carry arms or admit only apparent metahumans.
    gm_usage: Meetings, information gathering and contacts; drinking may lower NPC vigilance without a specified numeric modifier.
  templates:
  - name: "Caveman Kate's"
    printed_pages: [73, 73]
    zone: B
    matrix_host: Orange-Average
    betting_limit_nuyen: 2000
    betting_condition: Fictional illicit sports betting available through a recognized referral.
    layout_m: {main_room: [15, 30]}
    features: Food service, table trideo, central oval bar, booths, no windows, kitchen exit, two bathrooms, office, storage, side exit and security room.
    security: Cameras cover main room, entrances and credstick readers; one troll bouncer monitors them and leaves that duty only in emergencies.
  - name: Ultra Suede
    printed_pages: [73, 74]
    zone: AA
    matrix_host: Green-Average
    layout_m: {main_room: [10, 25], vip_lounge_each: [4, 5], bathrooms: [4, 3]}
    vip_lounges: 2
    table_seats: 3
    couch_seats: 2
    guards: {total_human_bouncers: 4, front_door: 2, vip: 2}
    features: Dance floor, DJ, credstick tab tracking, two soundproof VIP rooms with one-way mirrors, downstairs storage and office.
    security: Cameras monitor front and back entrances; VIP rooms guarded.
    admission: Strict dress code, upscale clientele and fictional metahuman prejudice.
  - name: Chasers
    printed_pages: [74, 74]
    zone: C
    matrix_host: Blue-Average
    servers_employed: 3
    servers_on_duty: 1
    layout_m: {main_room: [7, 15], pool_area: [10, 7], bathroom_each: [2, 2]}
    pool_tables: 3
    bathrooms: 2
    observed_pool_bets_up_to_nuyen: 250
    betting_condition: Pool tournaments are played for money; 250 is a reported past amount, not a hard cap.
    features: L-shaped room; public telecom is the only Matrix access; fictional BTL dealer tolerated because of a supporting local fixer.
    security: Ork door bouncer; ork bartender has a combat shotgun for emergencies.
    admission: Welcomes strangers, particularly women; expensive formal attire may result in forcible removal.
