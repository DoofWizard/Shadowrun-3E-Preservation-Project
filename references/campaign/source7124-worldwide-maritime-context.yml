scope:
  - "Regional campaign context for long-range maritime activity outside the Caribbean, Philippines and West Africa."
  - "This section supplies setting, market and travel context rather than a new resolution subsystem."
  - "Detailed regional price percentages are consolidated later in the Cost of Living table on printed pp.137-138 and are not duplicated here."

regions:
  - id: world.region.arctic-maritime-2059
    name: "Arctic maritime markets"
    source_notes:
      - "The source treats Arctic travel as difficult, seasonal and expensive, with long distances between reliable ports and supplies."
      - "Northern NAN territories, Siberia, Norway, Finland and the Trans-Polar Aleut region are named as relevant markets or transit areas."
      - "Entertainment, consumer electronics, food, clothing and other imports are described as important in isolated settlements, while oil, timber and mineral exports support some northern cities."

  - id: world.region.australia-maritime-2059
    name: "Australia"
    source_notes:
      - "Australia is presented as geographically isolated, making imported high-technology goods comparatively valuable."
      - "Sydney is described as a major industrial and maritime center with vehicle and boat manufacturing."
      - "Paranormal wildlife, magical materials, minerals and gemstones are important export categories in the source-period economy."
      - "The chapter notes significant Aboriginal magical traditions and local political sensitivity around magical resources."

  - id: world.region.mediterranean-maritime-2059
    name: "Mediterranean"
    source_notes:
      - "The post-Euro-Wars Mediterranean is described as politically fragmented, with many local ports, factions and overlapping commercial networks."
      - "North African and Middle Eastern markets are described as strong importers of food, water, raw materials, medical goods and other necessities."
      - "Port access, local organizations and differing national restrictions are emphasized as campaign constraints."

  - id: world.region.southeast-asia-maritime-2059
    name: "Southeast Asia"
    source_notes:
      - "The source describes dense maritime activity, organized-crime influence and strong regional trade among Southeast Asian states."
      - "High-end manufactured goods move south from Japan and China while magical materials, low-cost labor and narcotics are among the categories moving through regional illicit markets."
      - "Singapore and Kuching are described as comparatively security-conscious, while other ports and coastal areas vary sharply in enforcement."

  - id: world.region.southern-africa-maritime-2059
    name: "Southern Africa"
    source_notes:
      - "Azanian states are presented as resource-rich and industrially important, with diamonds, magic and other controlled goods creating strong demand."
      - "Cape Town is identified as a major port and commercial center."
      - "Security, race and local political divisions vary strongly among the Cape Republic, Oranje-Vrystaat, Trans-Swazi Federation and Zulu Nation."

  - id: world.region.amazonia-maritime-2059
    name: "Amazonia"
    source_notes:
      - "Amazonia is described as highly restrictive toward outsiders despite substantial magical and natural resources."
      - "Most commentary about access, enforcement and local conditions is anecdotal and remains attributed."

