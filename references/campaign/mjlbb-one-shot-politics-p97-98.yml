data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  scenario: Politics
  setup: The fictional politician Lorraine Kennedy commissions fabrication of an apparent connection between fictional electoral rival David Emerson and Humanis; the association is not established as true.
  cast:
    - {name: Lorraine Kennedy, npc_rating: Inferior, professional_rating: 1}
  compensation: No amount specified in this scenario.
  structure:
    stage_count: 3
    stages: [Research, Preparation of fabricated evidence, Placement of fabricated evidence]
    scenario_success_condition: Kennedy requires physical evidence that the fictional press could verify; the form is not prescribed.
  location_templates:
    - {site: Emerson's residence, template: Corporate apartment, printed_page: 73}
    - {site: Emerson's electronics store, template: Europa Clothiers, printed_page: 86}
  adjudication:
    - Kennedy prefers that the runners not use additional contacts; the GM may impose this constraint to increase mission difficulty.
    - For a combat-oriented table, the GM may add an encounter with Emerson's security personnel or Humanis; use the corporate security officer statistics on p38.
  scope: Scenario-specific template references and optional adjustments only; no general new social test, payment formula or security statistics stated.
