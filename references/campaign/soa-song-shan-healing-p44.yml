data:
  publication: {title: Shadows of Asia, publisher: FanPro, edition: SR3, catalog: FanPro25007}
  scope: Fictional SR3 local scenario claims, not universal health rules or real-world medical advice.
  narrator_account:
    site: Song Shan
    correspondence: Earth, balance of yin and yang, transition between states.
    healing_scope: Physical, astral and spiritual injuries or ailments.
    patient_reports: Some incurable maladies reportedly regress unexpectedly when patients visit to pray and meditate.
    magician_reports: Magicians nearing burnout have experienced rejuvenation while recuperating there.
  faith_qualification:
    attribution: Bonhoffer
    claim: Healing reportedly draws primarily on the patient's faith and spiritual fortitude; the commentator therefore considers it largely ineffective for atheists in Henan.
  resolution: The account gives no fixed healing test, TN, duration, restoration of Magic rating or guaranteed cure.
