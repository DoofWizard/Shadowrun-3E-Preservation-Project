headline: "Mr. Johnson's Little Black Book (FanPro25003, FanPro, SR3), fictional tabletop pp30-31/PDF31-32: optional cinematic resolution"
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  scope: Optional GM pacing alternatives under Tempo and Hi-NRG, not replacement initiative or task-resolution rules.
  routine_tasks:
    printed_page: 30
    condition: A character has a fair chance of successful completion.
    option: GM may omit the test and narrate the elapsed time and result.
    example: {skill: Athletics, rating: 3, task: climbing a wall, elapsed_time: a few minutes}
    qualification: The example is not a universal Athletics rating threshold or fixed climbing duration.
  cinematic_combat:
    printed_pages: '30-31'
    initiative: GM may resolve a turn cinematically instead of strictly following initiative order.
    procedure: Players state intended actions for the turn; GM narrates the turn and calls for rolls at appropriate points.
    alternative: GM may omit rolls entirely and use character skills as a guide to adjudicate success.
    multiple_passes: For characters ordinarily receiving multiple initiative passes, GM may allow an average number of multiple actions in each Combat Turn.
    unspecified: No mandatory action count or averaging formula is given.
