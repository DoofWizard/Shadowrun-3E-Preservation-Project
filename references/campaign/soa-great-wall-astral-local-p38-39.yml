headline: 'Shadows of Asia (FanPro, FanPro25007, SR3), fictional tabletop pp38-39: Great Wall astral terrain claims'
data:
  publication: {title: Shadows of Asia, publisher: FanPro, edition: SR3, catalog: FanPro25007}
  scope: Source-local fictional SR3 magical terrain reports, not universal rules or real-world phenomena.
  astral_barrier:
    page: 38
    attribution: Chapter narrator reports accounts by magicians.
    effect: The Wall has an astral presence reported to be as solid and impassable as a physical object.
  materialization:
    page: 38
    observed_period: Year of the Comet (fictional event)
    reported_effect: Parts of the astral Wall randomly materialized where the physical Wall had gaps.
    cessation: Spontaneous materialization stopped after the comet departed the vicinity.
    attributed_qualification: Tiger Mage relays reports that localized magical activity can temporarily materialize parts of the Wall again.
  astral_guards:
    page: 38
    attribution: Liondog reports regularly patrolling ghostly guards visible only in astral space.
    south_to_north: Guards reportedly disregard travelers from China toward Mongolia.
    north_to_south: Guards reportedly act hostilely toward astrally projecting entrants from Mongolia toward China.
  mana_line_claim:
    page: 39
    attribution: Pearl
    claim: The Wall is effectively a mana line, not itself a dragon line because of its artificial origin; Pearl speculates it crosses numerous dragon lines.
  resolution: No fixed test, rating, guard statistics, materialization frequency or duration is prescribed; adjudicate the reports as attributed local scenario conditions.
