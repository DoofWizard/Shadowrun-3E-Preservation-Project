administrative_controls:
  vehicles:
    - "Private motor-vehicle ownership and operation are described as tightly controlled."
    - "Ordinary legal ownership of powered vehicles generally requires an accepted business or state-service purpose; most residents rely on buses, bicycles, jeepneys and truck-taxi services."
    - "Small fishing boats may be owned with a fishing license, while larger or more capable craft are associated with licensed commercial or state functions."
  identity:
    - "SIN and identity records are administered through the Ministry of Demographics and Records."
    - "The source describes identity records as frequently created, retired or corrected, with biometric information such as fingerprints, facial data and blood type used in official checks."
    - "Hospitals, maternity facilities and other civil-record institutions are described as important sources of identity records in the setting."
  cyberware:
    - "Visible or military-grade cyberware attracts additional scrutiny."
    - "The chapter distinguishes ordinary headware/datajack use from more restricted augmentation and notes that medical authorization may be required for other implants."

surveillance:
  - "Traffic-control systems are described as able to associate vehicles with identity records and archive movement data."
  - "Some traffic sensors use facial recognition; the source also describes automated records processing and search across linked identity databases."
  - "These capabilities are presented as setting infrastructure rather than new SR3 test modifiers."

facility_security:
  shore_sites:
    - "Inland industrial facilities can employ magnetic, chemical and electronic detection in addition to guards and alarms."
    - "Coastal sites are described as relying more heavily on durable conventional security because marine conditions are hard on delicate electronics."
  vessels:
    - "Commercial vessels typically use armed guards, detection systems and emergency signaling."
    - "Higher-value or hazardous cargo receives stronger protection."
  environment:
    - "Night operations are common in the source because some metahumans have natural low-light or thermographic vision advantages."
    - "Diving and snorkeling equipment are described as broadly available compared with many other controlled goods."

law_enforcement:
  civil_police:
    - "Civil police are described as the least heavily equipped public security force and commonly use nonlethal crowd-control methods."
  imperial_police:
    - "Imperial Police focus on intelligence, political security and investigation of suspected subversive or pirate activity."
    - "The chapter describes a containment strategy in which enforcement resources are concentrated in selected districts, leaving other areas with lighter routine presence."
  imperial_marines:
    - "Imperial Marines are described as the response force for major threats to public order outside corporate jurisdiction."
  corporate_security:
    - "Megacorporate security operates under corporate jurisdiction and may assign a corporate SIN to previously SINless detainees before handling them through corporate legal systems."

sentencing_and_detention:
  - "A convicted Filipino pirate is described as facing sentences from 10 to 200 years depending on offense and metatype."
  - "Alternative penalties mentioned by the source include fines, restricted Matrix access through a rider chip, or relocation to a low-status island."
  - "Shiawase's Meifumado complex on Yomi is described as a 50,000-inmate prison."
  - "Mitsuhama, Renraku and Fuchi are also described as maintaining corporate detention facilities."

network_cooperation:
  - "The chapter portrays labor unions and workplace contacts as important support networks for the Huk."
  - "Strikes and demonstrations are commonly described as organized separately from maritime operations, though some participants support both."
  - "Rescue and detention-recovery scenarios are presented as recurring campaign situations."

provenance_policy:
  - "Operational anecdotes are reduced to setting capabilities and campaign constraints rather than step-by-step evasion procedures."
  - "Shadowland claims about misconduct, covert experimentation or individual motives remain attributed commentary."

