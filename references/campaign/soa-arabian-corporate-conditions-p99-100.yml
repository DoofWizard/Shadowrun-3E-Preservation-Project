data:
  publication:
    title: Shadows of Asia
    publisher: FanPro
    edition: SR3
    catalog: FanPro25007
  scope: Regional corporate operating conditions narrated for the fictional Sixth
    World campaign setting; not current law or a universal corporation-resolution
    mechanic.
  narrator_report:
    authority: Islamic-Corporate Coordination Board (ICCB)
    A_rated_corporations:
      strict_conduct_code_applies: true
      exception: Coastal cities.
      architecture: Interior and exterior restrictions include a prohibition on art
        depicting living creatures.
      language: Arabic required on all physical and electronic signs and documents.
      director_for_Arabia_eligibility: Muslim.
      on_site_mosques_required: true
      government_press_releases_and_information_channels_distribution_required: true
    foreign_corporations:
      board_authorization_required: true
      authorization_body_for_most: Islamic Development Cooperative Bank (IDCB)
      oversight: The narrator describes irregular Mudaween inspections and an oversight
        agent at all important meetings.
    AA_rated_corporations:
      semi_sovereign_enclaves_permitted: true
      tax_basis:
      - turnover
      - domain of activity
      conditional_tax_reduction: Large numbers of staff converting to Islam or exceptional
        company promotion of the faith.
      inspection_and_board_requirements: Same as outside the enclaves.
      enforcement_qualification: The narrator alleges less strict enforcement by oversight
        agents paid by corporations.
  resolution: No tax percentage, required number of conversions, inspection frequency,
    test, or target number is specified. These regional conditions do not supply a
    new corporate rating system.
