crew_and_base_practice:
  - "New crews are advised to establish local contacts, temporary shelter, repair capability and a secure place for equipment before attempting larger operations."
  - "Small crews commonly rely on mobility, alternate boats, secluded coves, caves or lightly populated islands rather than one conspicuous permanent base."
  - "The source emphasizes changing operating sites, tracking favors and obligations, watching storage and docking locations, and reducing avoidable conflicts with local residents."
  - "Successful crews reinvest in vessels, personal equipment, communications, technical capability and defensive preparations."

distribution_and_markets:
  - "Piracy and smuggling are presented as distribution problems as much as acquisition problems: cargo has limited value without buyers and transport."
  - "Crews are advised to identify buyers or fences early, avoid flooding one market, diversify sale routes and keep cargo volumes manageable."
  - "Large single-purpose cargoes can be harder to move than mixed smaller loads because a buyer may not be able to absorb the full quantity."
  - "Regional fixers, criminal organizations, commercial buyers and port contacts are recurring distribution nodes."
  - "Long-haul intermediaries become more important when a crew's own vessels are poorly suited to ocean crossings."

regional_routes:
  - "The chapter identifies Miami and New Orleans as major transfer points for Caribbean trade into the CAS."
  - "New Orleans is described as an important destination for magical goods and weapons as well as a broader smuggling market."
  - "Electronics, medicine and other restricted goods move through the same regional networks, with destination choices depending on demand and enforcement."
  - "Ports farther north on the UCAS coast are described as possible markets but generally require more capable long-haul transport."
  - "Aztlan, Amazonia and other destinations can provide demand for specialized goods when crews have suitable buyers and routes."
  - "The chapter states that most long-distance traffic through or near the Caribbean eventually interacts with local transshipment networks."

enforcement_and_risk:
  - "CAS enforcement is described as especially active against selected contraband traffic along the Gulf and East Coast."
  - "Cargo value affects the level of security and counter-surveillance expected from both transporters and buyers."
  - "Air transport, Matrix interference, inspection avoidance and rerouting are recurring features of higher-value smuggling."
  - "The chapter repeatedly warns that very large seizures or attacks on major commercial shipments attract national, corporate and military attention out of proportion to ordinary small-scale piracy."

attributed_claims:
  - "A Shadowland post claims the Atlantean Foundation purchases unusual material recovered from the Bermuda Triangle at unusually high prices; this remains an attributed setting claim."
  - "Posts describing corruption, bribery rates, syndicate control or specific law-enforcement vulnerabilities are preserved as source-period commentary unless independently established."

