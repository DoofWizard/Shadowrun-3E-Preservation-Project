summary: Scenario compensation, negotiation limit, supplied game equipment, optional encounters and follow-up conditions.
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  scenario: Where the Wild Things Are
  location_template: {name: Bodyshop, printed_page: 89}
  client: Ted Pugnetti
  compensation:
    nuyen_per_runner: 2000
    live_capture_bonus_nuyen_per_runner: 500
    negotiation_maximum_original_offer_multiplier: 2
    supplied_game_equipment_per_runner: {Narcoject rifle: 1, ammunition clip: 1}
  objective: In the fictional game, locate the escaped SURGEd cerberus hound before public discovery; Bio-Fine prefers live return and treats killing as a last resort.
  knowledge:
    - The client provides the creature's appearance and general speed and strength, not its specific capabilities; the company suspects additional Awakened powers but did not observe them.
    - The creature escaped the previous failed run the night before; at scenario start its lair is a sewage pumping substation.
  adjudication:
    - The inexperienced client is flexible on pricing; the GM can structure the fictional sewer adventure as a dungeon crawl with NPC and creature encounters.
    - Optional encounters include sewer workers, squatters, a rat shaman or other subterranean magic user, devil rats, ghouls and other Awakened creatures; a surviving worker may supply a clue to the creature's direction.
    - The rival corporation may send another runner team to complete its previous mission.
  creature_record: entity.mjlbb.surged-cerberus-hound-p107
  aftermath: The client remains at risk of dismissal regardless of the runners' efforts and hires them for a subsequent extraction of himself and his collected company data.
  scope: Scenario-local terms and GM guidance; creature statistics are preserved separately.
