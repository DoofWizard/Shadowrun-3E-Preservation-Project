data:
  publication: {title: Shadows of Asia, publisher: FanPro, edition: SR3, catalog: FanPro25007}
  scope: Source-period local legal conditions in the fictional SR3 campaign setting; not actual Tokyo law.
  narrator_report:
    firearm_ownership: Restricted to officers.
    blade_prohibition: Attempts at a prohibition have been rejected.
    private_police_forces_allowed: false
    corporate_armed_officers: Permitted on extraterritorial corporate grounds; treated as ordinary citizens off corporate grounds.
  attributed_comment:
    speaker: Corp Watcher
    qualification: The speaker reports that enforcement practice increasingly permits corporate security to use weapons away from corporate premises as corporations supplement the police, despite the stated policy.
  resolution: No numerical legality code, licensing fee, test or security rating is printed; policy and reported practice are distinct.
