headline: 'Shadows of Asia (FanPro, FanPro25007, SR3), fictional tabletop p40-41/PDF40-41: Beijing source-local astral terrain claims'
data:
  publication: {title: Shadows of Asia, publisher: FanPro, edition: SR3, catalog: FanPro25007}
  scope: In-universe chapter-narrator and named commentary descriptions of fictional magical terrain; not verified universal SR3 astral rules or real-world claims.
  narrator_reports:
    forbidden_city:
      pages: [40, 41]
      background_count: Noticeable; no numerical rating printed.
      astral_presence: Buildings and other structures have astral constructs described as solid and impassable to spirits, analogous to physical buildings for metahumans.
      spirit_inhabitants: Some constructs are inhabited by spirits with roles resembling those of the physical counterparts.
      example: A physically unoccupied temple except for occasional caretaking is described as an astral courthouse used by spirits.
    tiananmen_square:
      page: 41
      constraint: The fictional Emperor Li Tianzi and his magical spirits are described as powerless within the square.
      other_effect: The square is described as hindering hostile action by authorities; no numerical effect or resolution procedure is printed.
  qualifications:
    p40: The narrator notes that observers report unusual astral signatures resembling spirit abilities and an entourage of spirits without witnessed summoning; the Emperor claims to be a wujen. Moon Lady speculates that he may be possessed or a spirit himself; his nature is unresolved.
    p41: Moon Lady speculates about the Forbidden City being the capital of the Celestial Bureaucracy; this is not established as fact. Pung's commentary suggests a distinction between authority acting as such and ordinary presence in the square; no game test or exact threshold is provided.
  resolution: Treat as source-local scenario claims requiring GM adjudication, not quantified background count, universal ward or immunity mechanics.
