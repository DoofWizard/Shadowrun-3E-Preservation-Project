headline: "Mr. Johnson's Little Black Book (FanPro25003, FanPro, SR3), fictional tabletop pp10-11/PDF11-12: campaign creation constraints"
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  scope: Optional campaign-specific restrictions or advantages discussed with players during character creation; no universal new numeric limits.
  generation_system: GM may choose the priority system or point system according to simplicity and flexibility desired.
  attributes: GM may set campaign-specific minimum or maximum attributes or cap the number initially at maximum; advise players of requirements.
  skills: GM may cap skill ratings or the number of high-rated skills beyond standard restrictions, require minimum ratings in particular skills, or encourage diversified skills.
  examples: {minimum_skill_example: Biotech in a DocWagon campaign, minimum_elf_count_example: 1, elf_example_setting: Tir Tairngire}
  metatypes: GM may restrict available metatypes or require a particular group composition according to the fictional setting; examples are not universal restrictions.
  archetypes: GM may restrict or require particular character archetypes, including deckers and riggers.
  equipment: GM may require or exclude categories of gear based on campaign type; assess individual gear in addition to Availability and Street Index.
  references: [Shadowrun Companion pp102-103, FanPro25003 p35]
  distinct_variants: [option.mjlbb.low-level-creation-p118, option.mjlbb.high-level-creation-p119]
