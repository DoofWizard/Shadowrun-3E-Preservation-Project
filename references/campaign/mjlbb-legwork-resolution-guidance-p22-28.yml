headline: "Mr. Johnson's Little Black Book (FanPro25003, FanPro, SR3), fictional tabletop pp22-28/PDF23-29: legwork resolution guidance"
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  information:
    standard_tests: [Etiquette, Computer (Search Operations)]
    preparation: GM may prepare success-indexed information lists and discovery-order flowcharts.
    knowledge_skill: GM may test relevant Knowledge skills with difficulty based on the information or directly provide information according to skill rating and subject specificity.
    illustrative_skill_rating: 4
    illustration_scope: A character with Yakuza Knowledge 4 is expected to know the leader's name and other important figures and locations; not a general rating threshold.
  contacts:
    level_1: Typically helps for payment or other benefits.
    level_3: May help out of friendship or because of minor reciprocal assistance.
    availability: Use core p272; for easy-to-obtain items the GM may omit dice rolls, and the GM may declare an item unavailable.
    maintenance: Neglect may cost a contact; generosity may improve loyalty, but some contacts may exploit it. No automatic level change or fixed modifier is introduced.
  matrix_search:
    exact_known_location: If a specific piece of information and its location are known, GM may skip the roll and determine elapsed time.
    public_information_unknown_location: GM may likewise skip tests and determine search time.
    aggregate_option: GM may resolve a prioritized list through individual tests and tracked times, or a single roll with successes determining progress in a given time interval.
    scope: Discretionary pacing alternatives; no new fixed time, TN, or success table.
  stalled_investigation:
    optional_check: Intelligence or appropriate skill test may help the characters recognize an erroneous assumption.
    gm_discretion: A contact or encounter can supply a missed crucial clue; if this fails, play can continue without it.
  references:
    core: [254, 272]
    companion: ['60', '62-63', '65-66', '63']
    matrix: ['124-132']
    existing_rules: [rule.contacts.legwork, rule.contacts.searching-matrix, rule.contacts.contact-knowledge, rule.contacts.friends-of-friends, rule.contacts.upkeep]
  scope: Optional GM procedures and roleplaying guidance, not a replacement for existing search, availability, contact or security rules.
