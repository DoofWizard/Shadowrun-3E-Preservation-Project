data:
  publication: {title: Shadows of Europe, publisher: FanPro, edition: SR3, catalog: FanPro25002}
  section: Strange Magic
  veil:
    speaker: Cailleach
    former_height_above_sea_km: 20
    initial_thickening_duration: {approximate: true, value: 1, unit: week, context: Halley's first appearance}
    initial_thickening_effect: Nearly wall-like and almost impenetrable.
    intermittent_calcification: Can affect portions of the Veil and trap airborne or seagoing vessels until a passage is forced open or the phenomenon loosens spontaneously.
    exact_current_mechanics: rule.soe.tir-veil-p236
  standing_storms:
    speaker: Cailleach
    context: Magical storms formerly near coastal cairn sites have grown and sometimes extend inland; smaller occurrences along cairns, underground barrows and dolmens generally occur before or after an ebb or surge of manaflow and may transmit effects along slighe roads.
  slighe_roads:
    speaker: Ethernaut
    attributed_claim: Travelers report unexplained accelerated journeys, unintended destinations and disappearances; some allege being taken elsewhere before returning.
  scope_limit: No fixed calcification interval, escape test, storm rating or slighe travel modifier is specified here. Historical height is not the current twenty-meter value in the separate exact SR3 rule.
