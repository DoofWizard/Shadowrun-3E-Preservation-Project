data:
  publication: {title: Shadows of Asia, publisher: FanPro, edition: SR3, catalog: FanPro25007}
  scope: Fictional Sixth World currency and medical-response parameters from the source-period table, not present-day exchange rates or medical-service information.
  currency:
    local_currency: Ruble (RUB)
    nuyen_also_accepted: true
    printed_exchange_rates:
      - {RUB: 1, nuyen: 0.33}
      - {nuyen: 3, RUB: 1}
    reconciliation: The two printed rate statements conflict; neither is silently inverted or corrected.
  medical_services:
    - {provider: CrashCart, coverage: All major cities, guaranteed_response_minutes: 10}
    - {provider: Monobe Medical, coverage: Moscow only, guaranteed_response_minutes: 15}
  interpretation: Coverage is the printed service coverage, not an encounter probability. Guaranteed response is the printed duration, without additional contract conditions inferred. Demographic fields are outside this mechanical scope.
