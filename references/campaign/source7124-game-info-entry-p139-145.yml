campaign_guidance:
  - "The section shifts from regional source material to player/gamemaster guidance for self-directed maritime campaigns."
  - "Characters are expected to seek their own work, use contacts and market information, and choose objectives more independently than in a typical Johnson-directed run."
  - "The source recommends open-ended campaign preparation with multiple possible contacts, encounters and fallback plans rather than a single fixed job path."
  - "Competition with rival groups is presented as a recurring campaign pressure."

matrix_and_communications:
  - "Major ports and even many small islands are described as having Matrix access through satellite uplinks."
  - "Ships that routinely remain at sea for 24 hours or more are described as commonly carrying permanent satellite uplinks."
  - "A decker aboard a ship can create a personal satellite uplink using the existing rules referenced on p.88 of Virtual Realities 2.0; this subsection defines no replacement Matrix test."

