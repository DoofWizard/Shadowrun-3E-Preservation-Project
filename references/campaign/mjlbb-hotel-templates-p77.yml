headline: Fictional Shadowrun SR3 Hotels templates (FanPro25003), printed p77/PDF78
summary: Fictional hotel templates in Mr. Johnson's Little Black Book, FanPro, SR3.
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  lineage: Sprawl Survival Guide pp14-17, hotel discussion.
  templates:
  - name: "Nick's Nooks"
    printed_page: 77
    zone: C
    matrix_host: Green-Average
    rental: {interval: hourly, paid_in_advance: true}
    standard_coffin: {dimensions_m: [1, 1, 2], stack_height: 4}
    metahuman_coffin: {dimensions_m: [2, 1, 3], stack_height: 3}
    shared_bathroom_m: [3, 1]
    facilities: Soundproof cubicles with bed, trideo and Matrix jackpoint; keyed doors; shared showers and toilets on each floor.
    matrix_charges: Line use and downloads prepaid.
    game_security: Rating 3 maglocks; some returning renters install physical locks despite hotel rules; operator visits once daily; busy lobby makes unnoticed transport difficult.
    maglock_rating: 3
  - name: Binary Hotel
    printed_page: 77
    zone: B
    hotel_stars: 2
    matrix_host: Green-Average
    rental: {interval: hourly available, paid_in_advance: true, payment: [certified credit, cash], sin_check: false}
    rooms_per_floor: 10
    room_m: [4, 3]
    facilities: Attached bath, bed, home telecom with Matrix jackpoint, vending area and free ice on each floor.
    game_security: Contracted rent-a-cop present continuously; cameras in lobby and elevators feed main-floor security office.
    rent_a_cop_count: 1
    npc_template: Rent-a-cop p38.
  - name: The Carleton
    printed_page: 77
    zone: AA
    hotel_stars: 4
    matrix_host: Orange-Average
    check_in: Cursory SIN identity review and download to hotel mainframe; fictional clerk may waive review for payment of unspecified amount.
    rooms_per_floor: 15
    standard_rooms_per_floor: 10
    suites_per_floor: 5
    standard_bed_options: [one queen-sized bed, two twin-sized beds]
    facilities: Standard rooms have large trideo/telecom and programmable safe; suites add wet bar and hot tub; meeting rooms have movable partitions.
    game_security: Microphones monitor all rooms; cameras monitor lobby, hallways, meeting rooms, parking and entrances; sysop occasionally patrols Matrix host and protects important patron files.
    on_site_security: {security_rigger: 1, hotel_security_team: 5}
    npc_templates: [Corporate Security pp38-40, Security Rigger pp38-40, Mercenary p40 for security chief]
    security_chief: Usually former corporate or military officer.
