headline: FanPro25002 Shadows of Europe (FanPro), fictional Shadowrun Third Edition, pp169 and 173, Swiss character identification status
summary: Fictional campaign identification and permit qualifications, preserving the scope and attribution of the zone exception.
data:
  publication: {title: Shadows of Europe, publisher: FanPro, edition: SR3, catalog: FanPro25002}
  section: Identification and Extraterritorial Business Zones
  citizen_identification:
    page: 169
    issue_condition: Qualification for fictional Swiss nationality, normally at birth.
    device: Subcutaneous identification chip with personal registration number comparable to a SIN.
  visitor_identification:
    page: 169
    device: Sensor attached to a registered credstick rather than an implant; required to be carried at all times.
    possible_time_restrictions: [tourists, short business trips]
    possible_area_restrictions: [corporate citizens, metahumans]
    zone_resident_corporate_citizens: Additional electronic permits required to reside on Swiss soil.
  attributed_zone_exception:
    page: 173
    speaker: Switch
    condition: Corporate citizens remaining within the fictional Extraterritorial Business Zone itself.
    claim: They need not obtain ID sensors while remaining within the zone.
  general_consequence: The setting describes arrest as the normal consequence of invalid identification or missing required licenses or visas.
  related_rules: [rule.soe.swiss-visitor-id-sensor-p233, reference.soe.swiss-visitor-visa-conditions-p233]
  resolution: No new fixed permit duration, cost, device rating or test is specified by these passages. The attributed zone exception is not a general exemption.
