  disaster_in_japan:
    treatment: "campaign guidance"
    notes:
      - "Use Ring of Fire disasters, evacuation, recovery, corporate opportunism, the child emperor's accession, and the Imperial Marine recall as scenario drivers."
      - "The material offers shadowrun opportunities around rescue, information, political intrigue and disrupted corporate security rather than a standalone rules procedure."
  chaos_in_california:
    treatment: "campaign guidance"
    notes:
      - "Use Saito's expansion, resistance, Ares/Silicon Valley activity, Los Angeles upheaval and Pueblo occupation as run generators."
      - "The section is scenario framing; no new numeric subsystem is introduced."
  war_in_the_yucatan:
    treatment: "campaign guidance with environmental rules"
    notes:
      - "Use mercenary work, blockade running, insurgency, intelligence operations and environmental devastation as campaign hooks."
      - "The actual toxic-zone mechanics are normalized separately as rule.environment.yotc-toxic-zones."
