name: "Cyberpirates - Caribbean Operating Practice"
domain: campaign
status: ingested
source_period: "2059"
source: source.fasa-7124
printed_pages: "23-41"
pdf_pages: "24-42"

reputation_and_hierarchy:
  - "Caribbean pirate groups commonly treat reputation as a practical deterrent and status signal."
  - "Visible confidence, successful challenges and recognizable style can establish standing without requiring every dispute to become a prolonged fight."
  - "A reputation that becomes too dominant can cause rival groups to cooperate against the perceived leader."
  - "Local standing is highly contextual; a reputation that matters in one port or island may carry little weight elsewhere."

operational_practice:
  - "Crews are expected to alternate quickly between social signaling, negotiation and direct action as circumstances change."
  - "Bluff, intimidation, surprise and control of communications are presented as common ways to reduce resistance during a raid."
  - "After an operation, crews may disperse personnel, conceal cargo, use small hideouts or remote islands, and delay sale until attention drops."
  - "Injured personnel and obvious cargo can expose a crew through clinics, informants and local rivals, so post-operation concealment is treated as a major concern."
  - "Private islands, isolated coves and lightly governed ports can function as storage points, repair stops, meeting places and temporary bases."

territory_and_contacts:
  - "The chapter repeatedly treats individual islands, neighborhoods, ports and gang areas as separate social territories with their own rules."
  - "Language, local custom and knowledge of current power holders are important for distinguishing residents, trusted visitors and outsiders."
  - "Pirate and smuggling networks rely on port contacts, local intermediaries, commercial buyers, corruptible officials and information pipelines."
  - "South Florida and Jamaica are presented as major contact and transfer points for regional trade, smuggling and freelance work."

regional_economy:
  - "The regional economy mixes tourism, shipping, contraband, private security, local agriculture and illicit trade."
  - "Cuba is described as both enforcing selected League policies and benefiting from legal and illegal exports."
  - "South Florida supports piracy-adjacent commerce through ports, organized crime, private security and movement of goods into North America."
  - "Bermuda is presented as a useful transit and finance point because of its location, air links and corporate presence."

governance_and_enforcement:
  - "League-wide authority is weak compared with individual island governments and local power brokers."
  - "Enforcement priorities vary sharply by territory, producing inconsistent risks for the same activity from one island to another."
  - "Private security organizations, local governments, criminal groups and corporations may all exercise practical control over ports or districts."
  - "The chapter advises treating official jurisdiction and actual local power as separate questions."

magic_and_local_belief:
  - "Voudoun, obeah and related traditions are presented as established parts of regional culture and magical practice."
  - "Bermuda is associated with reports of unstable magical conditions; the chapter presents these as setting testimony rather than quantified rules."
  - "Awakened plants, magical materials and local practitioners can create specialized trade and employment opportunities."

provenance_policy:
  - "First-person Shadowland posts are treated as attributed perspective unless independently established."
  - "Operational guidance is normalized as campaign-world practice, not as a replacement for SR3 core combat, social, vehicle or magic rules."
  - "Sensational or graphic anecdotal wording is omitted where it adds no mechanical or provenance value."

