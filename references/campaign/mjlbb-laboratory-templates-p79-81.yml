headline: Fictional Shadowrun SR3 laboratory templates (FanPro25003), printed pp79-81/PDF80-82
summary: Source-specific laboratory scenario guidance in Mr. Johnson's Little Black Book, FanPro, SR3.
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  general: Fictional scientific and magical laboratories may be espionage targets or sites of undisclosed employer-sponsored security tests. Corporate laboratory entry requires valid ID at one or more checkpoints; identity verification can include facial matching, fingerprint or DNA checks depending on security level. Departure inspections may include searches, scans or X-rays. Astral protection is standard; physical protection can be personnel-based or automated.
  templates:
  - name: The Vault
    printed_pages: [79, 80]
    zone: E
    matrix_host: Green-Hard
    proprietor: Warden, elf weaponsmith
    named_door_guard: Briggs, troll
    staff: {dwarf_technicians: 3, ork_technicians: 1, human_technicians: 1, named_human_technician: Lana, lab_technicians_per_lab: 1, other_testing_team_members_min_when_warden_present: 1}
    layout: {clean_rooms: 6, attached_offices_per_clean_room: 1, office_matrix_jackpoint: true, private_bathroom_access: through clean room, clean_room_maglock_rating: 8, testing_range: full building length}
    source_discrepancy: The five explicitly described technicians differ from the six lab assignments if every lab has a separate technician. No additional staff or occupancy rule is inferred.
    scenario_context: Fictional former shadowrunners provide personal security and equipment testing. The facility uses automated defenses; each clean room is accessible to its technician and Warden. A door guard is present during business hours. About once a year Warden hires runners through a fixer for an apparent design theft that is actually a test of the laboratory and its latest equipment, without their knowledge.
  - name: ZIC White Room Nanotechnological Research Center
    printed_page: 80
    zone: B
    matrix_host: Orange-Hard
    building_floor: 55
    layout: {cover_business: Ingersoll Publishing, secretaries: 2, offices: 15, office_m: [7, 8], laboratory_m: [14, 14], scientists: 15, matrix_connected_rendering_booths: true, research_data_storage: database}
    access_conditions: The fictional laboratory requires entrants to remove their ordinary clothing and wear white surgical scrubs and shoes. Its entry process uses palm-print identity matching; departure requires X-ray and bioscan, with a further scan at building exit.
    security: {physical_security_levels: 2, reinforced_maglocked_door_rating: 9, security_secretaries: 2, astral_patrolling_mages: 1, combat_deckers_patrolling_LTG: 2, IC: true}
    scenario_context: The building security provider handles access to the floor; the facility handles its own internal security. Both secretaries are armed and authorized by the fictional facility to respond with their weapons if a visitor fails the identity match.
  - name: Mitsuhama Thaumaturgical Research Facility 5
    printed_pages: [80, 81]
    zone: AA
    matrix_host: Red-Hard
    access_conditions: Fictional facility entry requires a pass card or appointment; Area C requires DNA clearance. The facility is isolated from the rest of the campus to contain mishaps.
    layout: {main_sections: 3, section_A_researcher_offices: 25, researcher_office_m: [9, 12], administrative_offices: 5, administrative_office_m: [8, 10], section_B_rooms: 12, casting_rooms: 5, casting_room_m: [15, 20], library_rooms: 1, temple_rooms: 1, temple_m: [20, 20], path_rooms: 5}
    magical_resources: {hermetic_library_rating: 15, hermetic_circle_force: 12, temple_uses: [ritual sorcery, elemental summoning], path_room_use: metaplanar research, medical_team_near_each_path_room: true}
    scenario_context: Researchers attempt metaplanar contact under medical supervision and report their astral experiences afterward. Area C contains cells and operating rooms; some cells hold Awakened creatures. The source describes security as primarily concerned with containment.
    security: {magical_response_guards: 15, guards_with_natural_magic_resistance: 5, IC_based_matrix_security: true, campus_security_deckers_allowed_to_patrol_host: false}
