headline: "Mr. Johnson's Little Black Book (FanPro25003, FanPro, SR3), fictional tabletop pp8-10/PDF9-11: optional group and character-pool variants"
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  limited_group:
    options: [players operate multiple characters, broaden character skill coverage, reduce scenario scope, use NPC and contact assistance]
    recommended_creation_adjustment: With only one or two players, consider granting additional character creation points; no amount or mandatory schedule is provided.
    example_player_count: {minimum: 1, maximum: 2}
  departing_player: GM may retain the character as an NPC, plan around the missing skills, or introduce NPC assistance; avoid making scenarios impossible solely due to missing abilities.
  character_pool:
    group_pool: Shared selection of characters for the whole group; GM may select suitable characters for a story arc or let players choose. Different players may play the same character across scenarios.
    player_pool: Each player maintains a personal smaller selection of characters.
    condition: Establish an appropriate in-fiction reason for the pool.
  extended_groups:
    consent: Interconnection between campaigns is at the discretion of all participating gamemasters.
    balance: Coordinate money and Karma advancement, special restrictions and optional rules to prevent imbalance; agree on ownership of character stories and share campaign developments.
    simultaneous_groups: A crossover adventure with multiple groups should have the corresponding gamemasters present, each guiding their group.
  references: [Shadowrun Companion p87, Shadowrun Companion pp109-129]
  scope: Optional table and campaign structure guidance, not a new mandatory Karma or build-point allocation.
