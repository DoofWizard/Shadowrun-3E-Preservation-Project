headline: "Mr. Johnson's Little Black Book (FanPro25003, FanPro, SR3), fictional tabletop p14/PDF15: optional improvised adjudication"
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  source_heading: Keep the Game Moving
  condition: When a rule or situation is uncertain and play would otherwise stall, the GM may improvise an outcome; consult details when they are crucial to the plot.
  dramatic_option: Prefer a dramatic outcome when appropriate rather than introducing a fixed replacement rule.
  optional_die_decision:
    die: any die
    two_choices: {choice_count: 2, resolution: odd or even result}
    greater_variation: {high_roll: best possible result, low_roll: worst possible result}
    unspecified: Intermediate outcomes and die type are left to the GM.
  scope: A discretionary GM fallback for an uncertain decision, not a new task TN, probability table or mandatory general test system.
  related: reference.mjlbb.cinematic-resolution-guidance-p30-31
