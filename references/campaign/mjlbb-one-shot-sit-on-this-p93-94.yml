headline: "FanPro25003, FanPro, SR3 fictional Shadowrun, printed pp93-94/PDF94-95: one-shot format and Sit on This"
summary: Optional tabletop scenario setup, NPC ratings, compensation and limits on magical information in the fictional adventure.
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  one_shot_format:
    printed_page: 93
    purpose: Short adventures usable independently or between longer adventures.
    sections:
      - {name: "What's Up, Chummer?", function: Background and setup}
      - {name: Tell It to Them Straight, function: "Recruitment, meeting, employer expectations and standard pay"}
      - {name: Behind the Scenes, function: Scenario progression}
      - {name: Hooks, function: "Themes, atmosphere, hidden information and adaptation to runner skill"}
      - {name: Cast of Shadows, function: Major NPCs with relative and professional ratings}
      - {name: Picking up the Pieces, function: Consequences and links to other scenarios}
    pay_basis: Shadowrun Companion p100 baseline payment table; GM may raise or lower pay to match campaign scale.
    npc_rating_reference: Shadowrun Companion pp83-84.
  scenario:
    title: Sit on This
    printed_page: 94
    setup: The primary fixer offers the runners overnight protection work for Audrey Golba until arrangements can be made the next morning.
    offered_pay_nuyen: 200
    cast:
      - {name: Edward Choi, npc_rating: Equal, professional_rating: 3}
      - {name: Audrey Golba, npc_rating: Inferior, professional_rating: 1}
    adjudication:
      - Investigation near the site of Tinker's death may reveal Audrey's relationship with Tinker; inquiries about Audrey reveal past premonitions.
      - The GM treats the scenario as a chase; if the team stays in one place too long police catch up. Police involvement is adjustable to player experience; a harder variant includes a SWAT team.
      - Audrey may discern a color or part of a name in a vision but cannot pinpoint the location. Her visions are genuine magical manifestations outside her control, but she may fabricate a vision to provoke confrontation with Choi.
      - The fictional scenario attributes the reawakening and distortion of Audrey's oracular talent to BTL abuse. Magicians can identify her unintentional magic but cannot determine more during this adventure.
      - Analyze Truth may mislead before the characters uncover her background; she sincerely believes her actual visions but initially lies about her relationships with Tinker and Choi.
    scope: Scenario-specific NPC ratings and discretionary GM handling; no general new spell, psychic power test, chase interval or payment formula is specified.
