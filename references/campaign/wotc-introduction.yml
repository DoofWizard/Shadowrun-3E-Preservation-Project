coverage:
  - "Frames the book as three linked adventures that may also be run independently."
  - "Provides gamemaster preparation guidance: read the adventure, assess fit to the campaign, review player characters, take continuity notes, and adapt when needed."
  - "Adventures use standard Shadowrun Third Edition rules and relevant sourcebooks; specialized subsystem rules are referenced rather than reprinted."
npc_guidance:
  - "NPCs are intended as adjustable opposition/background characters rather than fixed challenge ratings."
  - "NPCs are supplied with Karma Pool and Professional Rating values under the SR3 rules."
  - "Gamemasters may strengthen important opposition, including converting appropriate NPCs to prime runners, when needed for the player group."
