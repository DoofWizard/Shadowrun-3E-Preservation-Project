data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  scenario: What Are You Playing At?
  compensation: {nuyen_per_runner_per_day: 1000, days: 2}
  location_template: {name: Law Office, printed_page: 76}
  preparation_days: 1
  site_security_rating: E
  planned_simulated_encounters: 2
  simulation: In the fictional adventure AU supplies blanks and laser designators; target sensors report whether and where a simulated hit occurred. The client is unaware of either planned encounter.
  cast:
    - {name: Onyema Adele, npc_rating: Inferior, professional_rating: 3}
  adjudication:
    - The fictional simulated opposition is replaced by actual hostile NPCs; both encounter groups are hired by someone in Adele's corporation. The client insists on continuing despite the danger and demands transport to the pickup site if he retrieves the target.
    - The extraction target is Adele's secretary playing a role; Adele knows this. He claims not to know who hired the hostile NPCs, but subsequent investigation can establish payment from an account under his control.
    - The GM is directed to run the adventure as a genuine run from the client's perspective; his unrealistic expectations may create additional demands during the preparation day.
  scope: Scenario-local parameters; no general combat or sensor rule is introduced.
