headline: "Mr. Johnson's Little Black Book (FanPro25003, FanPro, SR3), fictional tabletop p35/PDF36: integrating riggers and deckers"
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  decker_integration:
    character_option_guidance: A combat-capable decker may participate in scenes outside the Matrix; this is a suggested focus, not a creation prerequisite.
    group_scene_option: GM may include the entire team in virtual scenes and establish recurring virtual locations.
    discretionary_resolution: Where possible, GM may omit dice rolls in those Matrix scenes and resolve through imaginative interaction while maintaining challenge.
    companion_reference: Shadowrun Companion pp107-108
    quick_resolution_reference: FanPro25003 p122
    related: rule.mjlbb.quick-resolution-decking-p122-124
  rigger_integration:
    character_focus_guidance: Encourage at least one specialty among surveillance, armed support and opposition to security riggers; not a mechanical eligibility restriction.
    combat_reference: Rigger 3 p80, vehicle integration into ordinary combat
    related: rule.mjlbb.quick-resolution-vehicle-combat-p123-124
  scope: Discretionary GM/player guidance, not a new initiative, dice-pool or vehicle maneuver procedure.
