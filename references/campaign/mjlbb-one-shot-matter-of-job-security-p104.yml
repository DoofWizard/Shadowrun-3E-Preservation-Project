  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  scenario: A Matter of Job Security
  client: Adam O'Farrell
  compensation: {flat_group_nuyen: 12500}
  timing: {start_day: Wednesday, deadline_day: Sunday, stated_days_available: 5, scheduled_incident_day: Friday, scheduled_incident_period: after work}
