      members:
        - {name: Falchion, template: Mercenary, printed_page: 40, role: blades specialist}
        - {name: Wraith, template: covert-ops specialist, printed_page: 68, source: SR3}
        - {name: Sylvie, role: decker and team founder, equipment_scope: decking and rigging cyberware and gear}
  adjudication:
    - The fictional client's objective is to cancel a contract against Dr. Eva Cray; he provides the remainder of the opposing team's payment and believes full payment will persuade them to stop.
    - The fictional adventure offers two investigation routes, following the protected NPC or using contacts; the original intermediary can provide a clue.
    - GM may adjust opposing team size and strength to match the runner team. Negotiation is the intended scenario mode, but opposition may refuse cancellation to preserve its reputation.
  scope: Scenario-local parameters and templates; no general combat or investigation rule introduced.
