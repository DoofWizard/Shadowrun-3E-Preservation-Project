data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  scenario: "Mister, Can You Help Me Find My Parents?"
  cast:
    - {name: Hogo Akabashi, npc_rating: Inferior, professional_rating: 2}
  compensation:
    alternatives:
      - {amount_nuyen: 2000, medium: Yamatetsu corpscrip}
      - {amount_nuyen: 1500, medium: Certified money}
    timing: Akabashi requires a face-to-face encounter with his parents before paying the runners.
    bonus: The narrator specifies an additional bonus if Akabashi carries out his intended killing; no amount is given.
    intervention_exception: The GM guidance says Akabashi pays for the runners' services whether they prevent or assist the intended killing.
  template: {site: Former Fuchi office, location: Law office, printed_page: 76}
  adjudication:
    - Akabashi claims his parents were forced to send him to Yomi Island and that he has forgiven them. The scenario establishes that he has not forgiven them and intends to kill them; the GM may introduce indications of voluntary parental action.
    - Optional complexity increases include parental separation or an unknown sibling. No numerical modifier is specified.
  scope: Adventure-specific compensation and ratings; no general currency conversion rate or new NPC rule is implied.
