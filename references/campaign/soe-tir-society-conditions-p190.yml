    cultural_heritage: Destruction, distortion and exact reproduction of Tir heritage are forbidden; making money from it is forbidden for foreigners or those lacking sanction.
    environmental: Pollution is subject to fines and imprisonment, with no amounts or terms specified.
    discrimination: The Constitution Acts prohibit discrimination, but the account describes loopholes; the plaintiff bears the burden of proof.
    religious: Citizens may choose a religion unless it threatens state integrity or stability or other citizens' religious freedom.
