world_state:
  - "Adult entertainment markets are described as partly independent and partly organization-controlled, with Mafia, Yakuza, Seoulpa Ring and Triad involvement varying by city and neighborhood."
  - "Protection rackets remain common at syndicate and gang scale; the source distinguishes nominally protective arrangements from straightforward coercive collection."
  - "Seoulpa Rings are described as using Matrix-oriented protection schemes in addition to street-level protection."
  - "Large syndicates generally treat robbery as a high-risk, lower-priority market and more often support independent operators through fixers, contacts and resale channels than conduct robberies directly."
  - "Syndicates maintain specialist pools of deckers, bodyguards, surveillance staff and other temporary talent, and may hire shadowrunners for discrete assignments."
  - "Long-term association with one organization can cause a runner or fixer to be treated as belonging to that organization, affecting employability and rival relationships."
  - "Smuggling remains a broad syndicate market for controlled goods, weapons, magical materials and other restricted cargo, but the source also emphasizes major independent smuggling networks."
  - "The North American Autoduel route through the Rocky Mountains is named as a major independent smuggling network; the source also identifies maritime routes associated with the Caribbean, Gulf region, African coast and Far East."
  - "Gunrunning is framed primarily as a distribution and identity-check problem in the Sixth World rather than as a shortage of weapons."
  - "Talislegging exists because licensing, restricted magical materials and protected sources create black-market demand; magical groups and syndicates compete for access."
  - "White-collar offenses are described as primarily the domain of executives, accountants and specialist Matrix operators, though syndicates recruit such expertise when useful."
  - "Money laundering is described as mixing illegal proceeds with legitimate businesses and financial intermediaries; the source emphasizes increasingly complex jurisdictional and corporate banking structures."

campaign_constraints:
  - "The source repeatedly treats organizational sponsorship, fixer relationships, territorial control and access to buyers as more important than raw availability for many underworld markets."
  - "Weapon and magical-goods examples are source-period setting context; no new weapon statistic, magical-item statistic or universal resale modifier is introduced in this range."
  - "Matrix identity and banking examples establish world-state expectations about records, SIN checks and institutional access but do not define a new Matrix test procedure here."

