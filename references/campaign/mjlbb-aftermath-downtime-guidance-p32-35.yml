headline: "Mr. Johnson's Little Black Book (FanPro25003, FanPro, SR3), fictional tabletop pp32-35/PDF33-36: aftermath and downtime"
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  scope: Optional campaign bookkeeping and between-run adjudication, with no new mandatory numerical schedule.
  payment:
    printed_pages: '32-34'
    final_meet: Characters may seek to renegotiate payment after a more difficult than expected run or discovery of compromising information about the fictional employer; additional compensation is not guaranteed, particularly without advance notice, and a later exchange may be arranged.
    bookkeeping: GM may require characters to track the location of their funds or address the handling of illicit in-game proceeds if needed in a detailed campaign.
    related: reference.mjlbb.negotiation-payment-p20-21
  healing:
    printed_page: 34
    existing_limit: Wounds may be magically healed only once; combine magical healing with conventional medical care when appropriate.
    existing_rule: rule.magic.sr3-core-heal-treat-p193-194
  reputation:
    printed_page: 34
    consequence: GM may adapt job offers to conduct; openly destructive behavior tends toward less subtle assignments, while successful professional conduct may lead to harder, better-paying work. The shadow community may judge conduct differently from the runners themselves; there is no prescribed point adjustment in this section.
    related: rule.mjlbb.reputation-p120-121
  downtime:
    printed_pages: '34-35'
    uses: [lifestyle payments, spending earned funds, equipment upgrades, contact interactions]
    extended_projects: Research, programming, vehicle modification and implant installation may occupy a character between runs; where the work permits, it may be paused for a new run and resumed later, with progress tracked.
    resolution: GM determines downtime length and resolves activities efficiently; the Legwork guidance may be used for pacing.
    related: reference.mjlbb.legwork-resolution-guidance-p22-28
  separate_karma_record: rule.mjlbb.player-awarded-karma-p34
