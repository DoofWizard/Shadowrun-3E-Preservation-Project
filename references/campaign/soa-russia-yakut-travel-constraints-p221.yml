headline: 'Shadows of Asia (FanPro, FanPro25007, SR3), fictional tabletop p221/PDF221: Russia and Yakut transport availability'
data:
  publication: {title: Shadows of Asia, publisher: FanPro, edition: SR3, catalog: FanPro25007}
  scope: Fictional Sixth World campaign access and technology availability only; not present-day travel advice.
  russia:
    visa_requirement: Mandatory except for unspecified favored persons.
    visa_background_check: Almost always required.
    encounter_context: The setting describes monitored ports of entry and border patrol encounters; no fixed encounter probability or new test is supplied in this passage.
  yakut:
    major_external_transport_connections: Limited to Yakutsk and Magadan.
    yakutsk_airport: Conventional aircraft only; no HSCT, suborbital or semiballistic service.
    yakutsk_roads: Secondary roads rather than major highways.
    magadan_transport: Most forms of air and sea travel; limited rail and road connections to corporate work camps.
    magadan_capacity: All transport routes are undersized relative to major North American and European sprawls in the setting.
    wilderness_context: Survival away from civilization is a campaign consideration, with no additional numerical survival rule in this heading.
  resolution: No new fixed visa price, transport fare, encounter probability, dice test or target number is specified. The subsequent magical terrain and creature rules are indexed independently.
  references: [rule.soa.valley-of-geysers-p221, rule.soa.yakut-power-sites-p221-222, rule.soa.booryazmei-p222]
