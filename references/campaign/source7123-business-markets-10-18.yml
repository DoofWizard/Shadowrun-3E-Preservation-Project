world_state:
  - "The source presents the Mafia, Yakuza and Seoulpa Rings as the dominant Seattle/North American syndicate-scale organizations, with Triads and smaller groups competing in selected markets."
  - "Syndicates are described as diversified businesses rather than single-market organizations; each mixes illicit markets with legitimate or semi-legitimate enterprises."
  - "Matrix specialists can work as permanent syndicate staff or contract specialists, with organization backing providing hardware, software, contacts and protection."
  - "Controlled-substance and BTL distribution is presented as a layered market in which large organizations concentrate on production, wholesale distribution or territorial control while smaller sellers operate closer to retail."
  - "Triad activity is described as particularly strong in Asian and Golden Triangle markets; North American syndicates also retain interests in drugs and BTLs."
  - "Counterfeiting increasingly centers on electronic identity, credsticks and records rather than only physical currency."
  - "The source distinguishes low-grade credstick spoofing from high-end identity fabrication that requires alteration of matching records across Matrix hosts."
  - "Art forgery and illicit art dealing expanded after the Dunkelzahn estate released valuable works and collectibles into circulation."
  - "Fences are portrayed as information-and-contact brokers as much as resellers; major fences commonly have ties to a syndicate or other powerful patron."
  - "Successful independent fixers commonly rely on syndicate or corporate backing; syndicates use fixer networks to locate temporary specialists, including shadowrunners."
  - "Gambling markets include both legal businesses used for revenue/laundering and illicit venues; control varies by jurisdiction and local organization."
  - "Hijacking remains a syndicate market but increasingly targets high-value mobile cargo; Mafia, Seoulpa Rings and gangs are named as important participants."
  - "Kidnapping is described as less common as a routine syndicate business than in earlier eras, though specialist abductions and corporate extraction work still occur."
  - "Loansharking is described as valuable chiefly for influence and leverage as well as interest income."
  - "Adult entertainment and BTL markets are described as both legitimate and illicit revenue streams, with syndicate involvement varying by jurisdiction."

campaign_economy:
  - "Narrative examples repeatedly emphasize large markups between production, wholesale and street-level distribution; these examples are source-period color, not universal SR3 resale modifiers."
  - "Fencing examples state that sellers commonly receive roughly 20-30 percent of an item's real value from a fence; this is presented as campaign guidance rather than a formal universal pricing rule."
  - "The source treats fixer/fence access, organizational loyalty and reputation as important campaign constraints but defines no new dice test in this range."

