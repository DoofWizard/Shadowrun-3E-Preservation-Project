data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  scenario: The Haunting of Alyssa Camanack
  setup: Fictional NPC Rodney Leary commissions a staged death and false haunting to frighten his former partner Alyssa Camanack into returning to him; she has not consented to the deception.
  compensation: {nuyen_per_runner_per_day: 250, days: 7}
  cast:
    - {name: Alyssa Camanack, npc_rating: Equal, professional_rating: 1}
  adjudication:
    - The staged death is witnessed by Alyssa and the fictional body is not readily identifiable; the false haunting lasts one week and ends when Leary reappears.
    - The party's scenario objective is to avoid discovery of the deception before Leary reappears; the NPC recognizes the deception afterward regardless of mission outcome.
    - If events escalate too rapidly Alyssa contacts the police; the GM may introduce a local shaman as an additional magical complication.
    - The source specifies that Alyssa will not resume the relationship regardless of the outcome.
  scope: Adventure-specific GM guidance, not a new general fear, illusion or social-test mechanic.
