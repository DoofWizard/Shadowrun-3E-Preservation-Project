seattle_2058:
  - "James O'Malley, Seattle Mafia capo and Finnigan Family don, is deceased at the opening of the source-period crisis."
  - "His death creates a Seattle Mafia succession dispute; Rowena O'Malley is identified as his groomed heir but her succession is uncertain."
  - "The broader setting is presented as unstable after Dunkelzahn's death and the redistribution of wealth and influence."

attributed_economic_context:
  - "The narrator X-Star describes organized crime primarily as a supply-and-demand business operating in illegal markets."
  - "X-Star attributes roughly 60 percent of counted Seattle crimes to criminal organizations or directly related activity, and more than 80 percent when measured by nuyen volume."
  - "These percentages are source-period setting claims, not SR3 resolution modifiers."

