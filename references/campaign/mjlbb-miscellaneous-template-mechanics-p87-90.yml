data:
  publication:
    title: Mr. Johnson's Little Black Book
    publisher: FanPro
    edition: SR3
    catalog: FanPro25003
  scope: Eight illustrative fictional location templates for the Shadowrun gamemaster;
    game-specific staffing, ratings, services and scenario conditions, not universal
    rules or descriptions of actual facilities.
  templates:
  - name: Boeing Federal Airport
    page: 87
    zone: AAA
    matrix_host: Orange-Hard
    terminals: 5
    service_eligibility: Fictional airport service does not serve SINless characters.
    international_travel: Deeper SIN-record review than ordinary domestic travel;
      no test or target number specified.
    security_qualification: Fictional surveillance and secondary scanning systems
      are described; no equipment rating or resolution test specified.
    matrix_records: SIN and travel information for booked passengers.
  - name: Zurich-Gemeinshaft Bank
    page: 87
    zone: AA
    matrix_host: Red-Hard
    normal_guard_count: 3
    after_closing_guard_count: 1
    after_closing_condition: Fictional example has bank alarm set and vault sealed
      after closing; no rating specified.
  - name: Falcon Express Bus Station
    page: 87
    zone: D
    matrix_host: Green-Average
    public_telecom_jackpoints:
      total: 4
      working_at_any_time: 2
    locker_rent_nuyen_per_week: 15
    security_guard_count: 2
    backup: Fictional guards can call police backup.
  - name: Monorail Transit Station
    page: 88
    zone:
      rush_hour: A
      evenings_and_off_peak: C
    matrix_host: Blue-Average
    station_officers: 2
    extra_peak_patrol_officers: 2
    service_schedule: Continuous monorail operation.
    matrix_access: Public access only; no telecoms on boarding level.
    admission: Fare required; amount not specified.
    safety_equipment: Functioning Panicbuttons near stairwells in the fictional example;
      no rating specified.
  - name: Phoenix Fire Management Station
    page: 89
    zone: B
    matrix_host: Green-Easy
    staffing_when_not_on_call:
      officers: 15
      watch_room_technicians: 2
      watch_commander: 1
    watch_duty_personnel: 2
    watch_duty_roles: One technician handles calls and another validates calls in
      the fictional Matrix.
    maglock_rating: 5
    vehicles:
      Citymasters: 3
      hose_work: 2
      ladder_truck: 1
      crew_per_engine: 5
    dorm_capacity:
      firefighters: 15
      administrative_crew: 3
  - name: Lone Star Police Station
    page: 89
    zone: AAA
    matrix_host: Orange-Average
    cells:
      count: 8
      capacity_each_adult_trolls: 2
    bullpen_desks_computers: 35
    medical_support: Fictional paramedic-staffed medical room also accommodates magicians
      performing astral backup.
    security_coordination: A fictional security rigger coordinates building security
      and may summon backup; no resolution test specified.
  - name: Universal Omnitech Body Shop
    page: 89-90
    zone: A
    matrix_host: Green-Hard
    staffing:
      doctors: 2
      nurses: 4
      secretary: 1
      security_officer: 1
    rooms:
      operating: 2
      recovery: 4
      examination: 2
    maglock_rating: 8
    service_eligibility: Fictional shop offers cyberware installation and does not
      itself supply illegal cyberware; the text describes installation of customer-provided
      cyberware.
    maximum_installation_grade: alpha
    higher_grades: Require a hospital in this scenario guidance.
  - name: Legion Hall
    page: 90
    zone: D
    matrix_host: Blue-Average
    matrix_access: Limited to jackpoints in the main hall stage area.
    security_qualification: Fictional hall has no significant security when not in
      use; any security is provided by the renter.
summary: Source-indexed campaign_guidance from source.fanpro-25003, printed pages
  87-90; substantive assertions and provenance are in the structured data.
