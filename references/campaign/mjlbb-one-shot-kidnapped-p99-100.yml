data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  scenario: Kidnapped!
  setup: Fictional gallery owner Ricky Blair voluntarily arranges a staged abduction to obtain an insurance payout; his claim of involuntary captivity is false.
  compensation: {initial_nuyen: 2500, certified_credsticks: 2, additional_payment: Unspecified, payment_independent_of_outcome: true}
  fictional_financial_parameters: {policy_nuyen: 2000000, proposed_ransom_nuyen: 1000000}
  cast:
    - {name: Ricky Blair, npc_rating: Inferior, professional_rating: 1}
    - {name: Tak Fukari, npc_rating: Equal, professional_rating: 3}
  location_templates:
    - {site: College bar, template: Charlie's, printed_page: 81}
    - {site: Blair's apartment studio, template: 1817 Larch, printed_page: 72}
  adjudication:
    - The fictional insurer already holds Blair's ritual sample; unless the player characters have anticipated this, magical location takes place within one hour.
    - If Fukari has not located the runners after two days, the adventure changes to a refusal of the insurance payout and a request to meet via the party's contacts or fixer.
    - Fukari seeks to expose Blair's scheme rather than kill or arrest the runners; the GM may use her as a later client.
    - Blair's actions are intended as comic complications, without forfeiting the player characters' pay or reputation; the insurer encounter remains threatening until the meeting.
  scope: Scenario-specific timings and values, not a new general ritual-sorcery or financial rule.
