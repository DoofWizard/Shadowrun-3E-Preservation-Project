headline: "FanPro25003, FanPro, SR3 fictional Shadowrun, printed pp116-118/PDF117-119: low-level campaign guidance"
summary: Optional fictional tabletop campaign premises, skill emphasis and character creation links.
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  creation_option: option.mjlbb.low-level-creation-p118
  campaign_premises:
    - type: newly admitted gang members
      printed_page: 116
      group_creation: GM or players may create a gang or select an existing one; SRComp pp124-129 and New Seattle are references.
      typical_skill_emphasis: Combat and street skills
      specialized_variants: [Otaku gang (Matrix p133), Ghoul gang (SRComp p32)]
      scenario_focus: Survival in the fictional criminal underworld.
    - type: affluent thrill seekers
      printed_pages: '116-118'
      typical_skill_emphasis: Knowledge and Social skills
      athlete_variant: More contacts may compensate for fewer Knowledge skills.
      challenge: Fictional scenarios can involve consequences that social influence cannot resolve, including ransom by organized crime or repercussions from targeting a rival of the family's employer.
    - type: falsely accused employees
      printed_page: 118
      premise: Ordinary law-abiding employees are falsely identified as perpetrators; the campaign follows their transition to SINless runners and investigation of who framed them.
      skill_guidance:
        athletics_and_combat: Normally one or two skills at low ratings, unless recreational sports or climbing justify more.
        knowledge: Higher specialized and corporate Knowledge skills; esoteric hobbies are plausible.
  scope: Discretionary character and scenario guidance, not compulsory additional character creation limits or a rule for losing SIN status.
