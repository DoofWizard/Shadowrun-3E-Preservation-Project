legal_and_social_controls:
  - "The source states that private manufacture, sale and possession of firearms were prohibited beginning in 2026."
  - "Carrying a melee weapon longer than seven centimeters outside the home is described as prohibited."
  - "Arnis de mano and related martial traditions are described as politically sensitive and restricted by occupation authorities."
  - "Metahuman residents are described as subject to separate residential and public-service arrangements."
  - "Government housing assignments and controlled travel are presented as routine administrative tools."

magic_and_education:
  - "The source says corporations test students annually for magical ability beginning in eighth grade."
  - "Detected magical talent is described as being routed into corporate training and employment tracks."
  - "The chapter notes that the visible concentration of trained Filipino magicians is comparatively low and offers concealment or limited access to training as possible explanations."

game_use:
  - "These are setting and legality conditions rather than new SR3 task modifiers."
  - "They affect what equipment, identities and travel arrangements are plausible for characters operating in the region."
  - "Where individual Shadowland posts propose causes, enforcement gaps or exceptions, those claims remain attributed rather than universalized."

