summary: Published fictional tabletop RPG encounter scaling, payment, NPC ratings and conditional GM adjudication.
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  scenario: Trouble on Fifth Avenue
  compensation: {nuyen_for_entire_group: 5000}
  encounter_scaling:
    groups: [Road Spikes, Zeros]
    members_per_runner_in_each_group: {min: 6, max: 8}
    relative_strength: Road Spikes are initially stronger; recent Zeros cyberware upgrades have changed recent encounter outcomes.
  cast:
    - {name: Zero Leslie, npc_rating: Equal, professional_rating: 2}
    - {name: Boxer, npc_rating: Equal, professional_rating: 3}
  adjudication:
    - In the fictional adventure the neighborhood association hires the player characters to end gang control or provoke police intervention; the gangs are paid to intimidate residents and the authorities are paid to stay uninvolved unless conflict spreads to adjoining areas.
    - The GM may resolve the scenario through direct encounters or conflict between the two fictional NPC gangs; the latter is characterized as less dangerous for the party. The adventure requires a significant fictional incident before gang hostility overcomes their existing financial incentive.
    - Police remain reluctant to intervene even after hostilities begin; for greater difficulty the GM may keep them uninvolved until the characters convince them that their own safety is threatened.
  scope: Scenario-local guidance rather than a general combat, negotiation or police-response rule.
