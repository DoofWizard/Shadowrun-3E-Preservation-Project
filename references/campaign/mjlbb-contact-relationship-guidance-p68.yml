headline: "Mr. Johnson's Little Black Book (FanPro25003, FanPro, SR3), fictional Shadowrun p68/PDF69: contact relationship guidance"
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  independent_npc: Contacts have motivations and events in their own lives that can change their willingness to help and the information they provide.
  reciprocity: The relationship applies in both directions unless the runner pays the contact very well; no payment threshold is specified.
  dependency: {publication: Shadowrun Companion, printed_page: 60, rule: rule.contacts.upkeep}
  example:
    conflict: A friend may ask the runner for assistance during a job.
    refusal: Refusal may end the friendship or lead to opposition by the contact.
    assistance: Helping may compromise the runner's professional reputation through failure of the job, while leaving the contact indebted.
    scope: Possible GM-directed consequences, not fixed level changes, automatic penalties, or a replacement for contact upkeep tests.
  scope: Campaign guidance with no additional numeric modifier, price, or test.
