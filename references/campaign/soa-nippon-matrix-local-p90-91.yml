headline: 'Shadows of Asia (FanPro, FanPro25007, SR3), fictional tabletop p90-91/PDF90-91: Nippon Matrix and Neo-Tokyo connection parameters'
data:
  publication: {title: Shadows of Asia, publisher: FanPro, edition: SR3, catalog: FanPro25007}
  scope: Source-period descriptions of fictional SR3 Matrix access technology, not a new universal Matrix procedure or a claim about modern networks.
  narrator_report:
    p90:
      city_grid_entry: Passage through checkpoints is required to enter a city grid.
      full_hot_mode_wireless_decking: Not yet generally available.
      cellphone_network: Extensive; smartphone, pocket secretary integration and limited deck links broadly available.
      neo_tokyo_beta_hotspot_io_speed_range: [150, 250]
      status: Reported operating beta speed, not a universal equipment rating.
    p91:
      predicted_wireless_io_speed: Upward of 500; prediction, not current capacity.
      full_asist_wireless_hotspots: Difficult to locate.
      matrix_cafe_jackpoint_lowest_reported_cost_nuyen_per_hour: 1
      matrix_cafe_monitoring: The narrator states that local police monitor these fictional sites.
      matrix_overlay: Available in tourist-friendly central areas and in Ikebukuro, Shibuya and Ueno.
  attributed_comment:
    speaker: Netwalker
    page: 90
    overlay_fee: Described as small; no amount printed.
    overlay_modes: Normal and Matrix speeds.
    persona_display: A rapidly moving Matrix persona is not visible in real time; the image appears at the location where the decker pauses.
    communication: Permits communication with people in the physical game world.
    fictional_utility_interaction: The speaker states that the SR3 Sleaze utility can keep a decker invisible to fictional real-time cameras; no test or modifier given.
  related_rules: [rule.soa.asian-rtg-ratings-p229-231]
  resolution: No new test, target number or general wireless equipment specification is prescribed in these headings. Current beta figures, forecast and minimum reported price are separate values.
