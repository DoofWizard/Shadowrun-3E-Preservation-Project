    headline: DISTURBANCE AT ARCOLOGY QUARANTINE
    posted: 01-18-60
    source_character: In-world Seattle press clipping; not independent contemporary
      nonfiction journalism
    content: Reports witness accounts of gunfire and explosions outside quarantined
      Renraku arcology; reports Renraku guards and UCAS Army troops were killed and
      injured, restriction of traffic and ongoing government/security impasse. Reporters
      say the military declines comment. Actual culpability remains disputed by this
      brief clipping.
  - printed_page: 51
    pdf_page: 52
    headline: RENRAKU CEO TAKES LEAVE OF ABSENCE
    posted: 02-03-60
    source_character: In-world Chiba news clipping
    content: Reports Renraku CEO Inazo Aneki taking indefinite leave for pressing
      personal issues; Renraku Chief Operating Officer Haruhiko Nakada to temporarily
      replace him. Rumors that the move relates to the Seattle Arcology shutdown or
      his presidency/will are explicitly unsubstantiated.
  original_illustrations:
