    visual: Within fictional Renraku CEO news clipping, grayscale head-and-shoulders
      portrait of stern bespectacled middle-aged man in suit, presented as Inazo Aneki.
    caption_status: Identity established by adjacent news article; portrait not a
      photograph of a real CEO.
  - printed_page: 53
    pdf_page: 54
    visual: Monochrome drawing of multiple distorted cybernetic/human-animal-hybrid
      creatures, including a skeletal figure, a heavily modified sprawled figure and
      an enormous head with skeletal or robotic elements.
    caption_status: Uncaptioned original illustration; no one-to-one creature ID is
      identified by printed caption.
  - printed_page: 55
