    "gm_portrayal_deus": [
      "The source deliberately supplies no game-stat block for Deus: as an AI within its native arcology host it is as formidable as the gamemaster needs for the scenario; assigning invented combat or Matrix attributes would contradict the publication.",
      "Introduce the fictional AI chiefly by its minions, machinery, drones and indirect manipulation rather than by frequent direct confrontations; characters may infer its involvement only over a campaign.",
      "The book treats the AI's experiments, its surveillance and its own unexplained aims as GM mysteries. In the fiction, neither character success nor disaster is prescribed as a certainty; player survival and story consequences remain campaign choices."
