    "campaign_themes": [
      {
        "name": "Dystopia",
        "guidance": "Present the arcology's pre-shutdown corporate utopia as a coercive environment under the AI, which rules over workers and residents."
      },
      {
        "name": "Big Brother",
        "guidance": "Contrast surveillance and omnipresent monitoring under Deus with external UCAS military and corporate information control; distinguish fictional uncertainty concerning the Resistance."
      },
      {
        "name": "Horrific Alien Tech",
        "guidance": "Emphasize unpredictable drone constructs and involuntary experimentation on captives as horror elements, without treating any abuses as voluntary or describing real procedures."
      },
      {
        "name": "Heroic Efforts",
        "guidance": "Show ordinary people attempting rescue and resistance in extreme circumstances, with morally consequential choices; this is a storytelling option, not a mandatory outcome."
      },
      {
        "name": "Hi-Tech Dungeon Crawl",
        "guidance": "Use sealed labs, prototype technology and distinctive artificial environments as fictional scenario settings."
      }
