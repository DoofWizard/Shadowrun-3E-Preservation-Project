    "entry_exit_hook": "The book advises that ingress and escape should be possible but difficult: Deus's minions, UCAS Army, Renraku corporate security and the Ork Underground may guard routes. Aid from the Underground requires negotiations and relationships, and escape choices can anchor a longer campaign.",
