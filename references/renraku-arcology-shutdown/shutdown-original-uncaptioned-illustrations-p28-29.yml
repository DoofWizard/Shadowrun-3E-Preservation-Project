  object_type: Two original uncaptioned monochrome interior fantasy/cyberpunk illustrations within the chapter "Shutdown!";
    the illustrations are artwork and do not provide game mechanics.
  printed_page_28: A black-silhouette figure in profile with blown-back, disheveled hair or tendrils, amid a large
    curling cluster of pale flowing tentacle- or ribbon-shaped elements patterned with stars and small circular
    and geometric devices; the composition suggests an energy effect or Matrix persona without a printed identifying
    caption.
  printed_page_29: A large central monochrome image of a grimacing, armored, muscular winged figure with very dark
    spreading wings, a long polearm/bladed weapon carried across the torso, a flowing curled sash or banner, and
    ornate shaped boots/leg armor; dialogue text is arranged in columns on either side.
  identity_limit: Do not assign specific named characters (for example Megaera, Gabriel, Raphael, Deus or a particular
    program) to either uncaptioned image solely by their proximity to the surrounding fictional Matrix exchange.
