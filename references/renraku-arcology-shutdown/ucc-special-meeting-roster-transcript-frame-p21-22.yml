data:
  source_document: The fictional Shadowland curator Captain Chaos introduces a leaked United Corporate Council
    Central Planning Committee transcript. He attributes the transcript to an anonymously accessed corporate data
    store and says he removed routine introductory material, roll calls and other digressions. He cautions readers
    that the in-world executives may have private motives; his commentary is not the meeting minutes.
