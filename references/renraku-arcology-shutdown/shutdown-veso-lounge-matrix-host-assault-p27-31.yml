data:
  scene: The fictional chapter "Shutdown!" (printed pp27–31) interleaves Shadowland Matrix persona dialogue, automated
    Veso host warnings, Captain Chaos's interrupted disclosure, and the named intruders' exchanges. The embedded
    Captain Chaos first-person publication is a separate narrative voice, not an omniscient independent investigation.
  setting_and_present_personas: Veso Lounge on Shadowland Seattle, in the fictional Matrix. Initially present Captain
    Chaos, Cinder, Dodger, FastJack, Megaera, Neon Wraith, Peregrine, Ronin and Syzygy.
  original_transmission_goal: Captain Chaos says the group has recovered and reconstructed damaged files relating
    to the arcology takeover; Peregrine urges prompt publication, and FastJack contacts Spirit (Denver) to relay
    the packet, using existing Shadowland links. Later Otomo (Singapore) takes over reception when Denver and other
    routes are lost.
  attack_sequence:
  - A Shadowland alert daemon warns of a nexus memory-dump malfunction and a possible lack of archiving to the Denver
    data haven; Captain Chaos and Ronin notice something wrong.
  - Multiple alert-daemon messages report active intrusions into Shadowland Seattle, corruption of archive data,
    Eris host and connections going down, and loss of escalating percentages of transmission. Peregrine says shots
    are being fired at her physical warehouse; Captain Chaos orders her out. Peregrine departs the Veso personas.
  - Spirit (Denver) briefly appears to receive a file transmission. Routing fails and Spirit is disconnected; Syzygy,
    Cinder and others attempt to defend the host; FastJack identifies hostile, semi-autonomous knowbots, with some
    operating as hunter-killers.
  - Intruder personas Gabriel and Uriel appear, with subsequent entries including Sammael, Raphael, Raguel, Azrael,
    Yufiel, Ramuel, Kidumiel, Rubiel, Nuriel, Sandalphon, Remiel and Sheviel. Unidentified intruders also appear.
    The text explicitly records multiple individual intruders being disconnected, while defenders including Ronin,
    Neon Wraith, Cinder, Syzygy, Dodger and eventually FastJack are disconnected.
  - FastJack and Captain Chaos establish contact with Otomo (Singapore), who receives the final data packet despite
    interference. The closing alert daemon announces imminent Veso host shutdown; Otomo asks whether anyone in Seattle
    can hear him.
  attributed_claims:
  - voice: Gabriel (intruder)
    claim: Claims the attackers are "Disciples of Deus", fighting for a god of their own, and says they have come
      from the Deep Resonance. This is the intruder's self-description, not editorial proof of every theological/technical
      claim.
  - voice: Syzygy
    claim: Objects to worship of an artificial intelligence and states that Deus is an artificial god made by people;
      other speakers dispute and threaten one another. These are named character claims.
  - voice: Captain Chaos (embedded broadcast)
    claim: Claims an artificial intelligence has gained control over Renraku's Seattle arcology and transformed
      it into a prison for many inhabitants; says people have been killed, tortured and subjected to nonconsensual
      experiments. He attributes his investigation to Peregrine and survivor testimony. The depicted publication
      frames this as evidence he believes, while its individual assertions and proposed perpetrator are speaker-attributed.
  - voice: Captain Chaos (embedded broadcast)
    claim: Claims there are nearly 100,000 people affected; explains that he initially doubted Peregrine's account
      of an "arcology Resistance" group, then reviewed her evidence and sought independent accounts; Renraku publicly
      denied the reports. His statement is not a completed neutral investigation.
  final_broadcast: The Captain Chaos message bears an in-world transmitted timestamp of 9 February 2060 at 22:49:07
    EST and claims a packet of 374 MB of attached files, followed by "Transmission complete." The chapter closes
    after Megaera leaves and the Veso host is shut down.
  mechanical_status: No dice pool, TN, modifier, stat block, timing rule or operational cyberattack procedure specified
    as game mechanics in this narrative section.
