data:
  context: Risk ratings and narrated consequences are sourced to the fictional Resistance notes accompanying
    the Shadowland transmission. These are invented-machine descriptions, not real-world biological or
    tactical guidance.
  bumblebee:
    label: 'Construct: Bumblebee'
    risk: High
    capabilities:
    - The notes describe a very small flying construct with very short flight range, extremely high heat
      emission and a near-silent propulsion system.
    - The construct is said to hold two small sacs of fictional nanites. The notes allege these can induce
      fatal heat effects after entering blood. Its fixed payload is two attacks before returning to a
      cell/hive for repair and replenishment.
    - The text says the Resistance prepared a fictional counteracting drug mixture that must be administered
      within two minutes of the attack; this timing is an exact setting assertion, not a medical instruction.
    illustration: Black-and-white technical-style sketch of a small insectlike flying drone with a single
      rotor and curved stinger.
  medusa:
    label: 'Construct: Medusa'
    risk: Extremely High
    capabilities:
    - Four legs and two arms; advanced hydraulic rear legs for long rapid leaps and equally fast running.
    - Chroma cilia over the body provide sound and light sensing, including thermographic perception;
      tails can support its weight and grasp objects.
    - Reportedly capable of electrical discharge against equipment/cyberware and of radio coordination
      in groups of approximately three to five.
    - The Resistance characterizes the Medusa as highly intelligent and tactically dangerous.
    illustration: Monochrome sketch of a low, four-legged robotic animal with long tails and prominent
      clawed forelimbs.
  mechanics: The labeled Risk values and two-minute statement are not accompanied by numeric SR3 combat
    modifiers, damage codes or formal dice mechanics.
