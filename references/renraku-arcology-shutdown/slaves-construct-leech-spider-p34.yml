data:
  context: The book presents these as Peregrine’s Resistance notes accompanying Neon Wraith’s fictional
    account. Risk categories are exact in-world editorial labels, not dice modifiers or real biological
    classifications.
  leech:
    label: 'Construct: Leech'
    risk: None
    description: Peregrine calls the Leech a biological construct that relies on other drones for transportation.
      It attaches to a wall or door, spreads into attached material and reinforces the surface with fibrous
      tendrils.
    illustration: Small inset monochrome drawing of curved, segmented, slug-like construct with small
      nodes along the inner edge.
  spider:
    label: 'Construct: Spider'
    risk: Low
    description: Peregrine describes a construct with an ellipsoid body and flexible limbs; observed models
      vary from four to twelve limbs. Its limbs may carry knives, drills or grippers and can transport
      internal tools. It is principally employed for construction and demolition, and the notes describe
      it as generally nonthreatening to metahumans unless its work is interrupted.
    illustration: Larger original pencil-style drawing of an oval central drone with multiple long hinged
      spiderlike legs.
  no_game_statistics: Neither construct sidebar supplies a Shadowrun initiative, damage code, dice pool,
    target number or formal equipment rating.
