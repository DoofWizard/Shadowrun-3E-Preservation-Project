data:
  source_frame:
    chapter: Deus’s Playground
    opening_epigraph: Attributed to Dante Alighieri; a literary citation, not in-world
      factual testimony
    compiler: Captain Chaos
    reporter: Peregrine
    transmission: 10 February 2060, 12:22:31 EST
    reliability: Shadowland Resistance summary of partly captured records, not independently
      demonstrated objective knowledge
  arcology_information_limits: Peregrine states that internal eyewitness information
    is difficult to obtain because residents are prisoners or work for Deus; the Resistance
    has compiled documents and acknowledges substantial unknowns.
  banded_description_as_reported:
    identity: 'The Banded: human servants of the AI Deus, marked with black stripes
      on their arms after initiation; the number of bands denotes status.'
    recruitment: Peregrine says some, including otaku, join willingly while many other
      captives undergo coercive indoctrination. Deus reportedly subjects resisting
      residents to the conversion process. Do not equate coercion with consent.
    factions: Three Banded camps, Whites, Blues and Greens, are conventionally distinguished
      by cybernetic-eye color; differences extend to their assigned roles.
    implants: Peregrine reports artificial eyes and other augmentation among all camps,
      with enhanced combat bodies among many Blues, specialized skill systems among
      Greens and some physical augmentation among Whites. Some Banded are allegedly
      punished through induced pain.
    population_estimate: Peregrine estimates roughly one quarter of arcology residents
      have become Banded, mostly Greens; others are members of the Resistance, dead,
      or imprisoned. This is a dated in-world estimate, not independently proven.
  whites_description_as_reported:
    role: The Whites are Deus-devoted otaku, described as having entered from outside
      before the shutdown and gathered in the upper levels.
    evidence: A captured White had a personal journal on a Fuchi pocket recorder during
      a Resistance raid on the so-called zombie rooms. The journal is presented as
      an imperfect window into their experiences.
    zombie_rooms: Peregrine describes captive people connected to SCIRE Matrix hosts
      for extended periods, fed intravenously while constrained; he places many such
      rooms in tower areas around the mid-200 numbered block. Their confinement is
      not voluntary.
    religious_claims: The Whites perceive Deus as a divine being. Forum commentators
      dispute whether the Resonance is actually divine, whether Deus creates or manipulates
      it, and whether otaku owe it obedience. These are distinct claims, not established
      metaphysics.
  specific_shadowland_commentary:
  - speaker: Black-Eyed Susan
    claim: Asks about the zombie rooms and later alleges Deus seeks and alters particular
      otaku.
  - speaker: Thumper
    claim: Compares pervasive surveillance to Big Brother and objects to religious
      language.
  - speaker: Renraku Fox
    claim: Relates the archived mall photograph to apparent unaccompanied youths at
      mall data points.
  - speaker: Rapier
    claim: Describes Pax and her childhood/teenage followers in Atlanta; claims their
      ideology prioritizes technology rather than magic or religion.
  - speaker: Wingate
    claim: Reports similar otaku groups around North America, without evidence of
      one universal group.
  - speaker: The Dark Wight
    claim: Mentions that the former Renraku associate Cham Lam Won was involved with
      Blood Monies Software; contested by other commentators.
  - speaker: Peregrine
    claim: Explains banding, the Whites, the raid, and the limits of Resistance intelligence.
  mechanics_scan: No new numbered tabletop tests, modifiers, dice pools, equipment
    statistics or procedure tables on these pages.
