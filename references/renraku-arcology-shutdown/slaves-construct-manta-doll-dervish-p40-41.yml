data:
  context: Resistance descriptions of AI machines in fictional FASA7328 pp40–41; speculative effects and
    observations retain their in-world source attribution.
  manta:
    label: 'Construct: Manta'
    risk: High
    description:
    - Large aerial machine resembling an aquatic manta ray; some observed wingspans exceed eight meters.
    - Thermographic sensors are reportedly on its dorsal surface, with its underside effectively blind
      to these sensors; the notes report internal projectile payloads and long-range engagement.
    illustration: Two original line diagrams presenting top and underside of broad wing-shaped machine,
      including a trailing appendage.
  doll:
    label: 'Construct: Doll'
    risk: Moderate
    description:
    - Resistance reports Dolls issued to children held by the AI as seemingly constant companions and
      observers, tracking whether a child becomes an otaku.
    - The notes claim that a Doll can influence the child and may explode before capture for examination.
      These are allegations in the fictional source, not independently verified results.
    illustration: Monochrome sketch of a seated toy doll with rounded face, overalls and two small pigtails
      or antenna-like tufts.
  dervish:
    label: 'Construct: Dervish'
    risk: High
    description:
    - The notes describe a very fast rotating cylindrical machine with long radial spikes and erratic
      movement.
    - The spikes can be ejected and are described as coated with a movement-impairing neurotoxin; the
      account portrays the machine as both evasive and dangerous to many targets.
    illustration: Original drawing of a spinning tapered cylindrical object with a spiral ribbed body
      and motion lines.
  mechanics: No tabulated weapon statistics, target numbers, damage codes or skill tests are given in
    these three note boxes.
