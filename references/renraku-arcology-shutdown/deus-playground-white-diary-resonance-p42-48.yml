data:
  source_document: Dated personal diary attributed to a captured unnamed White otaku,
    accompanied by separately attributed Shadowland debate; the diary voice is not
    a narrator-established account of what Deus or the Resonance actually is.
  dated_entries:
  - date: '2059-12-14'
    recorded_at: '15:23:12'
    account: Writer reports hearing Paul and a voice in the Deep Resonance; the perceived
      voice commands the writer to go to the arcology/Realm of Light. Description
      is subjective mystical testimony, not independent proof.
  - date: '2059-12-16'
    recorded_at: 09:11:38
    account: Writer reaches the arcology, joining other called otaku; names Pax, the
      Nubian, Scarecrow and Sebastian among those assembled. Further names are unknown
      to the writer.
  - date: '2059-12-17'
    recorded_at: 04:02:22
    account: Writer first enters the tower Realm of Light, reports a reassuring call
      from the Resonance and anticipates the Day of Arrival.
  - date: '2059-12-18'
    recorded_at: '20:10:35'
    account: Writer says Pax communicated with them and anticipates an imminent event
      after returning to the tower.
  - date: '2059-12-20'
    recorded_at: 08:23:42
    account: Writer reports feeling rejected, but recalls a collective experience
      called the Rapture; a voice directed the gathered to an Upper Reach ceremony
      called Transfiguration.
  - date: '2059-12-23'
    recorded_at: '14:11:12'
    account: Writer continues to seek forgiveness and states the Resonance has become
      silent to them.
  - date: '2059-12-26'
    recorded_at: '17:11:04'
    account: Writer says they seized the Creator and brought him to Pax, with a screamer
      attached so his movements could be monitored; writer reports a Banded task.
  - date: '2059-12-28'
    recorded_at: 03:02:00
    account: Writer says Rachel became Banded, inspected the Creator’s equipment,
      and fears the Creator may threaten Pax or Deus.
  - date: '2059-12-30'
    recorded_at: '11:22:41'
    account: Writer suspects an unusual deck linked to the Creator, describes concerns
      about its capacity and storage, and receives the Creator’s cryptic response.
  - date: '2060-01-02'
    recorded_at: '20:20:57'
    account: Writer claims to have received their band and new instruction from Deus;
      assigned to monitor the people confined in so-called communion chambers; Peregrine
      identifies these with zombie rooms and says Paul later died during a raid of
      a chamber.
  ceremony_p46:
    source: Writer’s December 20 diary entry, not verified omniscient narration
    observed: Otaku assembled at a tower hospital; constructs replaced Pax’s eyes
      with cybernetic eyes. The writer describes Pax entering a private Matrix experience
      and returning with seven black bands, while others were called in turn and banded.
    not_selected: The writer says their name was not called, causing a crisis of religious
      belief.
    other_figures: Scarecrow, Nubian and Cat are among the names the writer recalls
      as selected; Sebastian reacts skeptically. The writer claims Sebastian was from
      the Nexus and knew the writer as a child.
    consent: Participant willingness differs; elsewhere the source documents coercive
      conversion, and these events must not be generalized as voluntary.
  discussion_not_settled_fact:
    Pax: Rapier alleges Pax led an Atlanta group and was involved in an attack on
      Nelson Blythe of Parents Against SimSense Schools (P.A.S.S.), intended to expose
      his private hypocrisy. The graphic episode is summarized as an in-world accusation,
      not independently corroborated.
    Babel: Ronin asserts Babel was an early Deus otaku who later turned against him
      and worked against Deus from outside the arcology.
    Deus_and_resonance: Syzgy, Ronin, Edge, Ambrose, Grid Reaper and others debate
      whether Deus causes, mimics or exploits the Deep Resonance. None is established
      by the debate as a certainty.
    screamer: Renraku Fox describes a Renraku security tracking device often attached
      to a limb, and sensors at arcology passages that detect it. Its existence here
      is equipment lore, not a numbered mechanical statblock.
    Creator: Peregrine identifies the Creator with Cham Lam Won, described as an engineer
      linked to Deus; others debate earlier Blood Monies Software and Renraku affiliations.
  mechanics_scan: No standalone quantified RPG tests or statblocks in this diary and
    commentary segment.
