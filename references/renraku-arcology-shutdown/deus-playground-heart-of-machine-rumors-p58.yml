data:
  section: The Heart of the Machine
  main_source: 'Peregrine’s Resistance account and surrounding Shadowland comments,
    original fictional Shadowrun Third Edition sourcebook Renraku Arcology: Shutdown,
    FASA7328 (FASA Corporation 1998). Different hypotheses remain distinct.'
  restricted_manufacture: Peregrine reports entire floors inaccessible even to converted
    Whites, Blues and Greens; identifies the formerly cybertechnology-manufacturing
    72nd floor as an example and says AI-directed automated systems fabricate machines
    without humans.
  reported_environment:
    Peregrine: Reports possibly poisonous/noxious atmosphere on one area, alternate
      hypotheses including corrosive foam and a moving white cloud that reacts to
      living beings, as well as destroyed reconnaissance drones. Says Resistance has
      not sampled the unknown material; its precise nature is unresolved.
    comparison: The white phenomenon is described by one alleged survivor as enveloping
      and harming human intruders while leaving drones unaffected; no concrete substance
      identification is verified.
    floor_mentions: 72nd, 73rd, 202nd and 313th levels are mentioned in attributed
      reports; do not conflate them as the same manufacturing floor.
  hypotheses:
  - speaker: FastJack
    claim: Speculates it could be a tailored variant of unusual bacteria or an unknown
      protective compound; hypothesis, not demonstrated toxicological fact.
  - speaker: Pensive
    claim: Speculates critical hardware supporting Deus’s intelligence might be on
      these floors.
  - speaker: Black-Eyed Susan
    claim: Says Vanessa Cliber’s former office was on level 202 and urges protection
      of valued corporate assets.
  - speaker: Peregrine
    claim: Says 202nd level was mainly production assembly and that some sections
      are cut off from sensors, and cannot identify where Deus or its core hardware
      is.
  - speaker: Razor
    claim: Questions what became of the basement fusion plants; receives no reliable
      answer.
  edition_specificity: Technological and Matrix speculation in this source is historical
    fictional setting attribution, not a real technical assessment or an SR3 game
    rule.
  mechanics_scan: No quantified test, modifier, combat sequence, damage value, legal
    price or statblock printed in this section.
