printed_pages: '6'
pdf_pages: '7'
data:
  book_role: The original page describes the publication as an adventure setting about
    the fictional Renraku arcology shutdown, rather than a prescriptive single-scenario
    adventure.
  editorial_source_device:
    original_form: A compilation of fictional online files and reports distributed
      through the Shadowland network.
    reliability: The original introduction explicitly warns that some fictional witnesses
      are unreliable or biased. In-book character claims should not automatically
      be treated as omniscient narrative fact.
    curator: Captain Chaos, the in-world sysop of Shadowland Seattle BBS, introduces
      the collection.
  source_sequence_as_described:
  - Initial Shadowland presentation by Captain Chaos and a stolen Renraku promotion
    brochure outlining the fictional arcology.
  - Personal and media accounts surrounding the night the shutdown began.
  - Purported records of a hastily convened meeting of Seattle’s United Corporate
    Council and its response to the shutdown.
  - A transcript depicting an attack on Shadowland and an interruption of its file
    posting; the fictional archive is said to have been copied to Singapore Data Haven
    and other Shadowland nodes.
  - A record attributed to an improvised survivor Resistance inside the arcology.
  - Final Game Information section with GM-only background, control-of-arcology context,
    game rules, and adventure/campaign hooks.
  gamemaster_options:
    ending: The shutdown is presented as deliberately open-ended; the original text
      does not mandate a single restoring resolution.
    continuity: The book explicitly permits a GM to omit or alter events and adapt
      their chronology or significance for an ongoing campaign.
    tone: The authors describe the material as darker and more unsettling than a conventional
      setting; GMs can choose how to incorporate it.
    rules_compatibility: The original p6 expressly states the setting is compatible
      with Shadowrun, Third Edition.
  related_prior_publications_as_cited:
  - Blood in the Boardroom (adventure)
  - Technobabel (novel)
  - Secrets of Power novel trilogy
  - Virtual Realities 2.0
  - Rigger 2
  original_page_art: A detailed monochrome illustration of a youth before a large
    articulated mechanical/biomechanical creature dominates the lower page; not treated
    as a named factual character absent a caption.
  provenance_note: Source-image reviewed printed p6, PDF7, original FASA7328; all
    claims about fictional organizations and events are represented as publication
    accounts.
headline: 'Fictional Shadowrun tabletop RPG — FASA Corporation Renraku Arcology: Shutdown
  (FASA7328, 1998, Third Edition), printed p6/PDF7 GM introduction'
