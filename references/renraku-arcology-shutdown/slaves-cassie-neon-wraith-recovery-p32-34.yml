data:
  context: In fictional Shadowrun source FASA7328, Captain Chaos forwards a 10 February 2060 11:48:17
    EST transmission from Neon Wraith, drawing on Peregrine’s notes and source interviews. The report
    and Shadowtalk contain attributed, disputed statements, not independently established real-world allegations.
  newspaper_report:
    headline: Jumper Hospitalized
    posted: 22 December 2059
    claims:
    - An unidentified woman jumped near the monorail track at the 3rd Avenue and Seneca Street terminal;
      Lone Star officials regarded an attempted suicide as possible but had not ruled out foul play.
    - Lone Star and the Transit Authority denied an established connection to the arcology shutdown, while
      acknowledging public criticism and the incident’s investigation.
  cassie:
  - Neon Wraith identifies the woman as rigger Cassie Barnett, previously part of a Renraku special-operations
    team based outside San Francisco; he says she was removed from sight and taken to a Renraku black
    clinic.
  - Wraith says a Dodger tip identified the clinic, a group of otaku had watched her, and a separate rescue
    team and Wraith’s group encountered one another during an attempted extraction.
  - The groups reportedly escaped with Cassie alive, despite Renraku’s attempts to recapture or kill her.
    Wraith reports that her memory and mental health remained affected and that Renraku had planted carcerands
    in her bloodstream, intended to kill her if she were extracted. Dodger reportedly found the supporting
    information in time.
  - Wraith says Cassie’s team had secured a copy of mission logs at a Renraku installation on the arcology’s
    southern perimeter, inaccessible through the Matrix, after a diversion elsewhere.
  attribution_and_uncertainty:
  - Captain Chaos says Peregrine escaped from the arcology via Orc Underground tunnels four days before
    this transmission and supplied sketches and notes.
  - Wraith attributes a 2054 Sons of the Green hydroponics demonstration and subsequent operation against
    that group to Cassie’s team. These are character claims in the fictional setting.
  - 'Shadowtalk contains contradictory accounts of Sherman Huang’s whereabouts during the shutdown: San
    Francisco, escaping by bullet train, remaining trapped in the arcology, or an impersonator; no conclusion
    is established.'
  - Neon Wraith claims responsibility for an anti-corporate demonstration, while other Shadowtalk posters
    challenge the claim or speculate about its effects.
  mechanics: This excerpt contains no independently stated Shadowrun TN, dice-test, numerical character-stat
    block or gameplay procedure.
