data:
  source_form: Fictional Shadowland bulletin, GREETINGS, by the in-world sysop Captain
    Chaos, transmitted 10 February 2060 at 11:44:54 EST.
  character_report:
    source_speaker: Captain Chaos, writing as Shadowland curator, not an omniscient
      narrator
    timeline: He reports that the Renraku Seattle arcology shutdown began around a
      week before Christmas 2059, after a purported systems malfunction and a violent
      incident in the shopping mall.
    first_incident_counts_as_claimed: Captain Chaos cites seven people killed by shooting,
      fourteen people fatally trampled in the rush to the exits, two helicopter crashes,
      and at least three heart attacks; these are his reported figures, not a reconciled
      independent total.
    information_review: After the public closure he solicited sources and inspected
      reports, rejected or questioned much rumor, claims to have independently checked
      insider credibility, and posted materials in original order.
    shadowland_interruption: He says the archive was attacked after he started compiling
      it and that the surviving files, including a transcript of the incident, were
      backed up on multiple servers/data havens.
    renraku_control: He asserts that Renraku no longer controls the arcology and warns
      that people still inside may be in danger; this is his February 2060 perspective,
      not an independently established narrator fact.
  source_commentary: The page includes a separate joking comparison to the fictional
    Bug City crisis by Jackal; it is not evidence that the two events share causes.
  mechanical_rules: None appear on this page.
