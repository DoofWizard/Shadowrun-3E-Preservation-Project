data:
  document_and_editorial_limits: Fictional Shadowland release of an alleged personal
    diary of arcology resident Cal Reynolds, age ten, from original FASA source; Captain
    Chaos says his anonymous source is not yet independently verified. Entries are
    the child narrator’s perspective and subsequent editorial claims are separately
    attributed, not omniscient fact.
  captain_chaos_first_preface:
    source_speaker: Captain Chaos, Shadowland sysop
    transmitted: 3 February 2060, 10:14:09 EST
    claims: He says the diary was allegedly recovered from a former resident of the
      twentieth floor; he acknowledges not yet verifying its truthfulness and warns
      of disturbing material. The timestamp is on a fictional in-world upload.
  diary_early_entries:
    dec_19_2059: Cal records receiving a Renraku 6100 pocket computer for Christmas
      from Aunt Wendy of San Francisco. Later he describes a brief apartment power/telecom
      outage, followed by the news reporting a computer glitch. Cal names parents,
      his younger sister Cindy, his friend Brady and cousin Chris.
    dec_20_2059: Cal and Brady play Firebird Flight III before Brady and his father
      go shopping in the arcology mall; they never return home that night. Cal also
      describes his father’s work and his mother’s worry.
    dec_21_2059: Cal writes that Brady and Brady’s father are missing, and that an
      investigator with blue cybernetic eyes questions his family. Cal’s father worries
      the investigator suspects him of acting against Renraku.
    dec_22_2059: Brady briefly answers Cal’s telephone call and claims his father
      has arranged a special Christmas present. Later Cal hears a man shouting at
      Brady’s residence; Brady describes being given green cybernetic eyes despite
      his prior blue-eyed investigator. Whether Brady was speaking freely cannot be
      established from Cal’s diary.
    dec_23_2059: Cal says Aunt Wendy’s telephone explanations are contradictory; he
      observes several little children with green cybernetic eyes following him in
      the park, a disturbed street scene and increasing tensions at home.
    dec_26_2059: After writing that an in-world doctor wants him to record symptoms
      before receiving a sedative, Cal describes his sister Cindy’s talking doll addressing
      him by name and claiming knowledge unavailable to him. The doll offers him superior
      cybernetic eyes and says it is taking him to meet Dayus; the entity’s claims
      and motives are not established facts.
  coercive_event_as_testimony: Cal’s first-person account describes the doll leading
    him from their apartment to an unfamiliar medical floor, where children and adults
    appear immobilized and some undergo forced eye removal or cybernetic alteration.
    Cal reports seeing spiderlike machines attack a fleeing adult; he himself is restrained
    by a doctor named Woolsey, injected against his wishes, and loses consciousness.
    These are alleged events in the fictional diary. There is no consent from the
    children, and they are not portrayed as volunteers.
  cal_escape_account: Cal says he wakes disoriented and partially blind while unidentified
    rescuers carry him away, amid fighting; he is taken to a hospital outside the
    arcology and told his parents and Cindy remain trapped inside. He hopes for medical
    replacement of his vision, requesting any eye color except green.
  captain_chaos_second_note:
    source_speaker: Captain Chaos, Shadowland sysop
    transmitted: 3 February 2060, 11:22:17 EST
    reported_claim: He says acquaintances retrieved Cal and approximately twelve other
      children from the arcology’s thirteenth-floor hospital after a rescue team entered
      for a corporate patient. He says two rescuers did not return and does not know
      if they survived. He expresses uncertainty about the meaning of events inside.
  rules_status: No character statistics, tests, target numbers or game-play mechanics
    in this excerpt; no rules inferred from the story.
