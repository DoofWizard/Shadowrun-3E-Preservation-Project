    "source_context": "FASA Corporation Renraku Arcology: Shutdown (FASA7328, 1998), printed pp84–85/PDF85–86, an explicitly optional gamemaster scenario-idea section.",
    "coyne_toss": {
      "character": "Jason Coyne, former Renraku security designer and former Novatech employee, who designed portions of the arcology defenses.",
      "past": "The source says Miles Lanier tried to recruit him; a former Renraku board member and an ex-girlfriend were involved in the subsequent difficulties. Coyne later joined Novatech but grows worried after the shutdown.",
      "scenario": "Coyne leaves Novatech without permission, hires the player characters to enter the arcology and rescue people, citing concern for ex-girlfriend and friends and offering modest payment. His security expertise can help entry, but cannot bypass defenses of the Banded/Deus. If Deus discovers him, the book says Deus sends minions against him.",
      "conditional_outcomes": "If characters and Coyne survive, the scenario may reveal his former girlfriend in an arcology 'zombie room'; Resistance members may press him for knowledge. After departure, Renraku, Novatech and the UCAS Army may seek him and his associates. These are options, not canonically fixed outcomes."
    },
    "live_and_direct": {
      "client": "KSFA hires player characters to recover news recordings from a van in the arcology parking garage, preferably also the news crew, or else obtain a live broadcast from inside.",
      "access_and_hazards": "Ork Underground contacts may point out alternative routes but want secrecy maintained. The garage is patrolled in the story by Manta and Dervish drones (Floor Index B4–B3, printed p86).",
      "broadcast": "The camera operator hid equipment in a thirteenth-floor hospital room; a timed burst transmission from the van may be jammed. The GM may have Deus dispatch Blue Banded forces after the recordings or the van. The source identifies a reporter as Sharon Michaels and cameraman as Walter Takeda, with only two crew survivors reported at that point.",
      "ending_options": "Potential rescue, broadcast, escape, and a live report are all optional play outcomes; the source does not mandate any result."
    },
    "scavenger_hunt": {
      "origin": "The fictional last will and testament of Dunkelzahn offers 5 million nuyen to whoever finds what is behind room 1835 in the arcology and reports the findings to the Draco Foundation.",
      "adjustment": "After shutdown, the book raises the award to 8 million nuyen and suggests an investor may equip a runner team with SOTA gear at the expense of sharing the reward.",
      "location_and_puzzle": "Room 1835 is on the eighteenth floor, between rooms 1834 and 1836. An access route through nearby maintenance and waste-disposal facilities is described in the plot. A decker may find 'Room 1835' appears as a fictional backwater node in the SCIRE Matrix, controlled by a fourth-tier Waste Disposal Services host, with a trap-door connection to a UV host created by Leonardo. The Big D's prior knowledge is itself an in-world mystery.",
      "conditional_outcomes": "The GM can place a data mystery, opposition and pursuit along the route; the source does not state a mandatory player outcome."
    },
    "note": "This is optional tabletop adventure guidance, not a real-world instruction manual; characters' involvement, danger and outcomes remain contingent."
