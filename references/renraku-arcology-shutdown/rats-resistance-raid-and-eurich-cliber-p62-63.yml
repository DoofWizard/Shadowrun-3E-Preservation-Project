data:
  voice: Peregrine’s first-person story on the left-hand columns, with separately
    attributed Shadowland commentary on the right; fictional eyewitness account, not
    independent omniscient history.
  organization_and_raid: Peregrine describes Ori teaching resistance fighting methods
    and planning a coordinated raid on a lightly defended 251st-floor food storage
    facility whose tanks produce yeast-like food; Ori’s team, Kiel Raugslos’s team
    and Alia Black Fox’s third team coordinate an assault via an elevator shaft spanning
    the 231st–251st floors. Peregrine says the teams aim to extract food and open
    a passage; their abilities are a fictional narrative, not a published playable
    rule.
  named_people_and_losses: Peregrine reports her team encountered Medusa machines
    during the raid, that one decapitated Sam and Kiel destroyed another, that she
    herself fired on a Medusa, and that she witnessed Ori fall. She describes fear
    and incomplete recollection rather than infallible combat observation.
  subsequent_resistance: After the raid Peregrine reports the Resistance established
    mobile cells, removed or destroyed surveillance to hide from Deus, managed escape
    routes, and carried prisoners down from the 231st floor hospital toward the Ork
    Underground via the Civil War-era Underground Railroad.
  matrix_ai_accounts: Peregrine says she worked with Kiel and Devon Eurich in a rescue
    cell in the 200–250 floor block and heard that Eurich, formerly associated with
    Renraku’s AI project, tried to use resistance work to atone for a perceived role
    in creating Deus. These details are reported attitudes/rumors, not narrator-verifiable
    responsibility.
  cliber_confrontation: Peregrine reports a tense reunion of Devon Eurich and Vanessa
    Cliber on the 214th floor after the escape of prisoners; Cliber asserts Morgan
    was originally theirs as a Renraku asset, while Devon disputes her claim and says
    he aided Morgan’s escape, acknowledging Morgan was damaged. They disagree over
    whether Morgan survived, and Devon departs. Preserve the characters’ disagreement
    rather than declaring Morgan’s destruction or survival settled.
  thread_cross_references: Shadowland commenters including Neon Wraith, Sasha, Lady
    Dee and others connect Kiel’s team to Devon Eurich (aka Redline), Alia Black Fox
    and Jason; these named exchanges are independent claims/comments, not direct witness
    confirmation.
  mechanics_scan: No actual dice TN, test, combat modifier, gear-stat row or other
    numeric tabletop procedure is specified by this narrative.
