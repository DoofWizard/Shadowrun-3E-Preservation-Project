data:
  art_provenance: Original full-page uncaptioned monochrome printed illustration occupying
    p61/PDF62 in FASA7328, between Peregrine’s Resistance narrative pages 60 and 62.
    An artist mark appears near lower right and resembles Hoop ’98; exact signature
    transcription is not independently established.
  visual_description: A heavily armored helmeted human figure crouches on the right,
    holding a long firearm with an illuminated muzzle facing left. A mechanical jointed
    insect-/spider-like form and cabling occupy the lower left foreground; behind
    are industrial pipes, panels and machinery, some visibly damaged. Dynamic line
    work and sparks suggest a fictional combat scene.
  identification_limits: The illustration does not provide a reliable printed caption
