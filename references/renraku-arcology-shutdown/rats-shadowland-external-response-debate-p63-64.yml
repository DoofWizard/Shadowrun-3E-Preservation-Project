data:
  source_context: Named in-world Shadowland commentary attached to Captain Chaos’s
    publication of Peregrine’s Resistance story, original FASA7328 printed pp63–64.
    All claims below remain speaker-attributed.
  comments:
  - speaker: Dodger
    report: Claims Morgan no longer exists; says a Renraku host created her, she escaped,
      and Renraku contracted Cham Lam Won to hunt and dissect her, incorporating pieces
      of her code into AEP. He says Devon Eurich tried to free her and Renraku crippled
      her; this is Dodger’s account and not neutral verification of her ultimate fate.
  - speaker: FastJack
    report: Speculates Renraku tried to understand Morgan by taking her apart and
      incorporating learned elements into AEP, accidentally creating more advanced
      artificial intelligence it could not fully control; presents a theory, not an
      established cause.
  - speaker: Peregrine
    report: Asks for capable volunteers to return and fight for survivors; says the
      Resistance contacted Brigadier General Colloton in the Ork Underground and has
      not heard back, and resists trusting Renraku without evidence.
  - speaker: Marceles
    report: Offers a possible paid salvage/rescue opportunity and warns of hazard
      pay; not presented as verified employment advice.
  - speaker: Connectivity
    report: Reports rumors of Draco Foundation interest, Universal Omnitech bounties,
      and a lawsuit over a daughter missing after Christmas shopping; unverified rumors
      in the fictional thread.
  - speaker: Grind Reaper
    report: Reports rumors of a Corporate Court investigation and a proposed corporate
      AI policing group; does not establish its existence.
  - speaker: Renraku Fox
    report: Argues that apparent Deus errors might reflect limited AI learning, notes
      Resistance efforts, and questions the inference that Deus intends to show exploitable
      weaknesses.
  - speaker: Pensive
    report: Argues that the apparent errors may be deliberate tests or experiments
      against the Resistance and that their success statistics are inadequate; speculation,
      not narrator-confirmed AI intent.
  - speaker: Brick
    report: Predicts UCAS forces approaching the Ork Underground could cause bloodshed;
      the comment is an opinion, not a verified operation.
  - speaker: Peregrine
    report: Rejects dismissing rescue because only a small number of lives might be
      saved; her statement is a personal moral stance, not a game rule.
  mechanics_scan: No quantified SR3 mechanics in the forum exchange.
