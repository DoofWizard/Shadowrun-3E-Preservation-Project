data:
  medium: 'Two fictional news inserts embedded in the Renraku Arcology: Shutdown sourcebook
    alongside a promotional brochure; their claims and editorial questions are attributed
    to in-world outlets.'
  initial_report:
    source: FastFaxFacts, Metropolitan Seattle Edition, 19 December 2059 at 6:17 PM
      PST, printed p12/PDF13
    event: The in-world report describes a disturbance during Christmas shopping in
      and around the Renraku Arcology Mall, including gunfire, panicked shoppers,
      locked doors, building-mounted weapons fire and helicopter crashes. The number
      of people trapped remains unknown in the report.
    toll: Headline claims dozens dead and injured without a verified count; it should
      not be collapsed into Captain Chaos’s later numerical claim.
    causal_status: Speculates whether armed assailants took over the mall or the corporation’s
      own security acted; neither theory is established by this news item.
  new_year_report:
    source: Fictional unnamed Seattle report titled Arcology Still Closed as New Year
      Arrives, posted 1 January 2060, printed p17/PDF18
    event: Reports the arcology still closed after a shutdown on the night of December
      19, with would-be visitors turned away by guards and people inside no longer
      heard from.
    toll: States three people killed and dozens more injured when security systems
      malfunctioned; this is the report’s particular shutdown framing, not a reconciled
      total for the December mall violence.
    corporate_explanation: Attributes to Renraku representatives an initial security
      malfunction possibly from a computer virus, and their claim to have regained
      control of affected systems less than an hour later.
    ongoing_impacts: Describes disabled outbound links to the city’s Intercity 5,
      delivery interruptions, reported monorail diversions, and a New Year’s Eve aircraft
      incident; vehicle ownership and intent are contested between Renraku and observers.
    other_corporate_speaker: Includes reported remarks attributed to Stratus Arcology
      resident Ajun Ko, who fears risk at a similar building in Kuala Lumpur; this
      is his personal concern.
  separation: Two fictional news sources report different dates, effects and casualty
    framings. No single verified real-world casualty count or explanation is asserted.
