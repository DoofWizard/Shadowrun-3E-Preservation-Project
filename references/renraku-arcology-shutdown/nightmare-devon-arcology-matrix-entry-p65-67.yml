data:
  source_framing: Captain Chaos introduces a transcript obtained by Devon Eurich,
    formerly an engineer associated with Renraku artificial intelligence, called Redline;
    he transmits it via Shadowland on 10 February 2060 at 13:08:17 EST. Transcript
    header describes a HEADEWARE DUMP—A2496.293, created 29 December 2059 at 01:32:16
    EST. These timestamps refer to a fictional saved account, not an automatically
    verified independent chronology.
  starting_location_and_companion: In the first-person account Devon describes hiding
    amid a waste collection area on the 151st floor of the arcology after a tank explosion
    exposed a fiber-optic trunk. Charlie Foxtrot, identified as a decker associated
    with his Resistance group, guards the area while Devon connects to the fictional
    SCIRE waste-processing systems.
  virtual_entry: Devon adopts a generic corporate-looking icon in the Matrix, encounters
    an apparently abandoned host and a giant glowing albino-hound intrusion countermeasure.
    He interprets the hound as a White-otaku design, uses a previously installed Janitor
    utility within the story, and escapes before proceeding through simulated shafts.
    This is a fictional Matrix narrative, not a prescribed real cyberattack technique.
  matrix_layout_according_to_devon: The narrator explains that SCIRE’s various fictional
    Matrix hosts are connected by virtual shafts within a private local telecommunications
    grid. He distinguishes an ordinary routed connection from express shaft transit
    for privileged users and security. He says Deus has rearranged hosts, created
    loops and mirror datavalls, eliminated some access-control barriers, and placed
    strange traps; these are perceived changes and character theories rather than
    codified game mechanics.
  grendel_project_and_hallway: A projected shaftpoint labeled Grendel Project (Renraku
    CCR-235)—Access Restricted leads Devon unexpectedly into a highly detailed ultraviolet-realm
    hallway. He describes a leopard-like guard construct pursuing another intruder
    beyond a black door, and corridors coated in brown pulsing organic-looking capillaries.
    He then encounters a human-looking captive head embedded in the material, which
    he suspects is part of an unwilling experiment.
  narrative_attribution: Devon’s impressions, suspicion about host rearrangement,
    identification of IC and the hound, and the prison interpretation are his own
    first-person testimony; these are not independently verified technical specifications
    or narrator-omniscient truth.
  mechanics_scan: The original story names fictional Matrix systems but contains no
    explicit SR3 dice tests, target numbers, damage codes, intrusion rules, prices,
    or character stat blocks in printed pp65–67.
