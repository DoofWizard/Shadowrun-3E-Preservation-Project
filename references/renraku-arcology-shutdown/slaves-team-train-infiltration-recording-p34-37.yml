data:
  context: An excerpt of the audio/video account is introduced by Neon Wraith and relayed on Shadowland.
    Its speaker-identified dialogue and surrounding forum remarks are sources within a fictional 1998
    tabletop game supplement.
  call_signs:
  - Cassie Barnett uses Control. Named team voices include Condor, Eagle, Hawk, Ferret and Jaguar; a support
    caller is referred to as Ice.
  - Captain Chaos periodically interrupts to add Peregrine’s Resistance identifications, including descriptions
    of Leech and other constructs.
  sequence:
  - The team approaches the amusement-park station and notices modified barrier material and an arachnoid
    drone on the wall.
  - Control orders an emergency separation of the rear car. The rail vehicle comes to rest; the participants
    confirm their physical condition, deploy surveillance drones and make their way toward the FunZone
    below.
  - In the park, team members see Renraku personnel moving nervously with drawn weapons, and Control detects
    elevated body temperature and a foreign substance in Eagle’s bloodstream.
  - Eagle reports a wounded palm and unusual sensations before collapsing and dying; the team later identifies
    a Bumblebee construct as the source.
  uncertainties:
  - The team initially cannot identify the changed tunnel barrier or the drone.
  - Shadowtalk users disagree on the AI’s intentions and explain the local emergency transit geometry
    in different ways.
  mechanics: The tape contains fictional equipment and position descriptions but no explicit combat-test
    procedure or TN for player use.
