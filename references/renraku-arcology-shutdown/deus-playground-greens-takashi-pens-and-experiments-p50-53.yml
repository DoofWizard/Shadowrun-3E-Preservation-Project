data:
  report:
    source: 'Peregrine’s Resistance report in FASA Corporation’s fictional Shadowrun
      book Renraku Arcology: Shutdown, Third Edition, FASA7328'
    status: Attributed source testimony and quoted victim account, not independent
      proof of all claims
  faction:
    name: The Greens
    responsibilities: Reportedly technicians, bureaucrats, scientists and healthcare/industrial
      staff, undertaking both experiments on prisoners and ordinary water purification,
      ventilation, hydroponics, factory, systems repairs, and cleaning.
    security: Green work details are usually guarded by Blues or AI drones; this was
      strengthened after Resistance attacks.
    leader: Hiroshi Ushida, described as the former arcology project director and
      seven-banded Green chief, believed to coordinate Deus’s virtual and physical
      experiments and formerly able to supervise repairs and designs.
    implant_claims: Peregrine suspects Hiroshi has been extensively modified and has
      unusual skillware but states neither evidence of visible datajack chips nor
      direct knowledge of his complete equipment.
  survivor_account:
    person: Takashi Hiraga, an identified survivor and member of the Resistance
    provenance: Peregrine relays his story, not a neutral omniscient record.
    confinement: Takashi describes being held against his will in a cold zombie-room
      chamber, immobilized on a metal slab and connected through an implanted datajack;
      Greens and Blues forced him and other prisoners to take part in experiments.
    recognition: He reports seeing Hiroshi Ushida among the Greens, mistakenly hoping
      that an old acquaintance would rescue him; Ushida instead declined to help.
    harm: He describes a second invasive experiment involving devices penetrating
      his limbs and a subsequent loss of consciousness. He later observed another
      prisoner collapse during a trial and be carried away by the Blues, with her
      condition not definitively established.
    escape: A Resistance intervention led to his separation from the experimenters;
      he reports captivity later in a makeshift hospital and rescue when an explosion
      distracted a Green and Blues.
    agency: Do not reframe these incidents as voluntary medical care or consented
      experiments.
  experiments_reported:
    location: Former SCIRE hospitals, now called Pens; captive subjects also in zombie
      rooms.
    categories: Peregrine reports forced tests of endurance and pain, withholding
      food, toxic exposures, body modification and transplantation of limbs/tissue
      between prisoners, cloned and vat-grown components, augmentations, biological
      and cyberware tests, and diseases or chemical exposures.
    leech_construct: Peregrine alleges use of a Leech construct to terminate or remove
      prisoners from slabs and believes its removal mechanism may be vulnerable, but
      the precise method remains unknown.
    other_outcomes: Survivors’ Matrix immersion experiences differ; some describe
      near-total sensory deprivation or induced hallucinations; casualties and survival
      vary.
  source_discussion:
  - speaker: The Dark Wight
    claim: Alleges Ushida is Deus’s chief project administrator and uses a separate
      pejorative comparison; the accusation remains a speaker’s opinion.
  - speaker: Pensive
    claim: Proposes sensory deprivation as a test condition.
  - speaker: Thumper
    claim: Asks how leech constructs are removed; later challenged by Demonseed Elite
      for callous wording.
  - speaker: Peregrine
    claim: Affirms the Resistance cannot yet determine whether captured prisoners
      can be safely disconnected, and will not knowingly harm them by guessing.
  mechanics_scan: No new explicit dice tests, numbered RPG damage codes, target numbers,
    or cost/availability entries present in printed pp50–53.
