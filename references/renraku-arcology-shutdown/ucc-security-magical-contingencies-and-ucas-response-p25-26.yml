data:
  provenance: Continuation and end of fictional January 3, 2060 UCC meeting transcript, followed by Captain Chaos
    and named Shadowland commenters. Every security claim, magical observation, and legal contention is attributed
    to its speaker.
  reporting_and_disputes:
  - speaker: Sherman Huang
    report: Claims Renraku tried monitoring heavily encrypted radio signals from the building without decipherable
      responses; outside magical scouts have encountered active magical defenses, spirits and barriers, ambient
      magical background interference and zones varying in spiritual activity, including hospitals. He reports
      no decisive proof of controller identity.
  - speaker: Morgan Gallagher
    question: Asks whether astral exploration of the building has been attempted, and considers the possibility
      of paranormal entities.
  - speaker: Mika Red Tree
    speculation: Suggests, without evidence, the possibility of hostile toxic shamans or similar supernatural
      actors.
  - speaker: Alberta Johnson
    reaction: Fears magical insect-related possibilities, but does not establish such beings as present.
  - speaker: Sherman Huang
    contingencies: Explains that Renraku had security and priority override plans but not a hostile internal takeover
      response. He describes possible extreme fictional military contingencies involving armed action, biological
      agents called Strain Three bacteria and magical barriers. These are hypothetical remarks in a work of fiction,
      not enacted events or real-world instructions.
  - speaker: William Loudon
    objection: Warns that military intervention in the densely populated Seattle business district could make
      downtown a war zone.
  - speaker: Samantha Villiers
    concern: Warns of unknown intentions of the occupier, including potential large-scale danger; she presents
      worst-case hypothetical scenarios rather than confirmed plans.
  final_intervention:
    military_speaker: Brigadier General Angela Colloton, UCAS Army
    claimed_authorization: Colloton announces an instruction by President Haeffner to oversee investigation and
      security of the arcology on behalf of the United Canadian and American States.
    source_reason: Colloton points to three nuclear reactors located in or under the facility and possible contamination
      danger to Seattle if sabotage occurs. Her comments are a fictional military jurisdiction claim.
    objection: Huang disputes UCAS authority over Renraku company property; Colloton asserts federal national-security
      jurisdiction and says she is carrying out a military operation.
    close: Colloton instructs an aide identified as Griffin to stop recording. The transcript ends at this point.
  closing_shadowland_notes:
    captain_chaos: The Shadowland curator posts the transcript with an uncertain commentary about whether the
      new military presence can restore control, transmitted 3 February 2060 at 11:28:08 EST.
    Kaptain_Krude: A fictional user questions whether deployed troops are friendly to Renraku guards.
    BlackWolf: A separate user comments that military personnel detained the speaker after an encounter; treat
      as user testimony, not an established independent event.
  gameplay_scope: The original transcript does not give action mechanics, dice pools, target numbers, game-scale
    spell ratings or weapon specifications.
