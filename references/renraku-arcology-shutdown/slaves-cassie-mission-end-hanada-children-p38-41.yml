data:
  context: Narrative is a fictional in-world recording relayed by Neon Wraith, with Peregrine’s commentary
    and uncertain outcomes kept distinguishable from narrator-established rules.
  sequence:
  - Following multiple attacks from unknown constructs, Eagle is dead; Control and Condor continue coordinating
    the other surviving team members.
  - The team reaches the RenSim facility in the FunZone and Jaguar finds a girl reported to be five and
    a boy reported to be about twelve. Their eyes appear artificial/green or blue in different views,
    leading participants to suspect AI control.
  - The little girl says Deus wills events and offers Jaguar a toy Doll; Jaguar refuses. An explosion
    then strikes the RenSim building and Jaguar is killed.
  - A speaker identifying himself as Kosuke Hanada, Sergeant in arcology security, introduces himself
    and issues a unit identification code. He and his accompanying samurai initially appear authenticated
    by Control’s checks, although Condor questions the source of his credentials.
  - Others with artificial eyes approach; the speaker identified as Hanada attacks Condor. Later the log
    reports Hawk and Ferret killed and Ice off-line.
  - The recording ends with Control/Cassie isolated and attempting an exit. Neon Wraith recounts that
    a Dervish wounded her and that she escaped by throwing herself off the monorail track near the Seneca
    terminal; the AI reportedly left her for dead.
  original_art: Original full-page monochrome p39 illustration depicts several armed, headset-wearing
    team figures in a stylized indoor commercial area beneath a large, streamlined hovering device, with
    a small decorative sign in the foreground.
  uncertainty: The account’s identification of the children as AI-linked, Kosuke Hanada’s status, precise
    causes of all failures, and whether Cassie was left for dead follow the fictional recording and narrators;
    do not transform attributed suspicions into independently confirmed facts.
  mechanics: No explicit playable SR3 combat-resolution mechanics are provided in the inspected passage.
