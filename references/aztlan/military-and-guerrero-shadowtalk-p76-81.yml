source: source.fasa-7213
printed_pages: 76-81
pdf_pages: 77-82
edition_scope: FASA Corporation, Aztlan, FASA7213 (1995), fictional Shadowrun Second Edition-era
  sourcebook; preserve historical edition, no Third Edition inference
content_class:
- attributed_claim
data:
  primary_source: FASA Corporation fictional Shadowland transcript in Aztlan, FASA7213 (1995); named
    speakers/rumors are in-world statements.
  interventions:
  - speaker: Captain Chaos
    page: 76
    claim: Introduces Arctic White to continue the military discussion.
  - speakers:
    - Jumper
    - Argent
    - Flashburn
    page: 76
    claim: Disagree over whether Arctic White overstates military danger, with Argent also referring
      to his reputation.
  - speakers:
    - WordSmyth
    - Jungle Cat
    page: 76
    claim: React to alleged tension between Aztechnology and national forces and the possibility
      of exploiting it; in-world opinion, not verified strategy.
  - speaker: Nikchick
    page: 77
    claim: Challenges the plausibility of Arctic White’s estimate of about 30,000 national combat
      troops, citing observed border deployment.
  - speaker: Arctic White
    page: 77
    claim: Distinguishes an approximately 50,000-strong national military from a corporate military
      perhaps three times as large; reiterates estimate rather than official numbers.
  - speaker: Kevin
    page: 79
    claim: Says General Paolo Batiste was recalled a month earlier by the Plumed Serpent; does not
      establish the reason.
  - speaker: Caveat
    page: 79
    claim: Asks whether the recall relates to a rumored shakeup.
  - speaker: Little Jo
    page: 79
    claim: Alleges an unexplained recent shakeup of four senior intelligence officials and a departure
      of an individual called Espectro, with details and causation unconfirmed.
  - speaker: Vantage
    page: 79
    claim: Doubts claims about access to fiber-optic communications; no procedural discussion is
      preserved.
  - speaker: TS
    page: 79
    claim: Responds sarcastically to Vantage, implying disagreement.
  - speaker: Argent
    page: 79
    claim: Repeats an in-world warning about corporate interception of cellular communications; it
      is a fictional allegation.
  - speaker: The Big D
    page: 79
    claim: Briefly comments on the larger fictional discussion.
  - speaker: Low Ranger
    page: 80
    claim: Asks the meaning of military slang “zipperheads”.
  - speaker: Beowulf
    page: 80
    claim: Explains that “zipperheads” refers to tank crews, because crew members can suffer head
      lacerations inside armored vehicles.
  - speakers:
    - Low Ranger
    - Beowulf
    page: 81
    claim: Explain the term REMFs as rear-echelon personnel, with Beowulf providing the expansion.
  - speaker: Jones
    page: 81
    claim: Claims every guerrero is magically talented and hypothesizes an initiation hierarchy;
      labels the hierarchy interpretation speculation.
  - speaker: Arctic White
    page: 81
    claim: Questions Jones about whether the orders are combat mages and why such orders would exist.
  - speaker: Jones
    page: 81
    claim: Distinguishes magical gifts from standard combat spellcasting and speculates that initiatory
      orders reinforce loyalty and morale.
  - speaker: Pyramid Watcher
    page: 81
    claim: Asserts all warriors have Aztechnology ties, leaving verification open.
  - speakers:
    - WordSmyth
    - Hecate
    - Lady of the Court
    - The Big D
    - The Laughing Man
    page: 81
    claim: A concluding distinct exchange alludes cryptically to ancient traditions, copying, awareness
      and prior knowledge; these comments are not independently identified facts.
  attribution_rule: Do not merge narrator claims, named speakers’ allegations, opinion and speculation
    into omniscient background fact.
framing: newsroom_neutral
headline: 'Fictional Shadowrun tabletop-RPG sourcebook Aztlan, FASA Corporation 1995, historical
  Second Edition, FASA7213/source.fasa-7213, printed pp76-81/PDF77-82: Named Shadowtalk disputes,
