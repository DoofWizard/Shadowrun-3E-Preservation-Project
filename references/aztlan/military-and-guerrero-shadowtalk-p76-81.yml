summary: 'Archival report on fictional FASA Corporation Shadowrun Aztlan (FASA7213, historical Second
  Edition, printed pp76-81/PDF77-82): Named Shadowtalk disputes, military population estimates, Batiste
  rumors and magical-order speculation. Narrator Arctic White’s uncertain estimates, distinct named
  Shadowtalk allegations, and the book’s visuals are separately attributed; not real-world claims
  or newly invented SR3 rules.'
