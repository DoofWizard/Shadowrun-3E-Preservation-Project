data:
  context: Fictional Shadowtalk attached to Compton's HyperMedia Encyclopedia language
    discussion; views on ethnicity, literacy and culture are contested statements
    by in-world speakers.
  claims:
  - speaker: Captain Chaos
    page: 149
    claim: Introduces the 2052 Compton's HyperMedia Encyclopedia excerpt as an in-world
      reference for language use.
  - speaker: Dartmouth
    page: 149
    claim: Claims that some Aztlaners' reluctance to use English reflects nationalism
      and inherited resentment of colonial rule.
  - speaker: Winston
    page: 150
    claim: Compares the language situation to Québec.
  - speaker: Monitor Lizard
    page: 150
    claim: Rejects the comparison as overstated and says speaking English with Aztlan
      government officials is not illegal, while being nonfluent may provoke mockery.
  - speaker: Lingo
    page: 150
    claim: Claims some urban traditionalists identify as Aztec and react forcefully
      to perceived insults to ancestral practice; anecdotal, not universal.
  - speaker: TwiceShy
    page: 150
    claim: Offers a Seattle comparison concerning the visibility of indigenous traditions.
  - speaker: Catseye
    page: 151
    claim: Criticizes racialized generalizations about Aztec people.
  - speaker: Holly
    page: 151
    claim: Disagrees that the encyclopedia's social descriptions are necessarily inaccurate,
      claiming some subsistence-farming communities deliberately maintain traditions;
      adds an anecdote about continued Catholic and older Aztec religious practices.
  - speaker: Socio Pat
    page: 151
    claim: Challenges the encyclopedia's figure of two million speakers of Yucatec,
      distinguishes other Mayan languages, and estimates perhaps half a million speak
      Yucatec.
  - speaker: Lady of the Court
    page: 151
    claim: Asks whether the Yucatán civil war constitutes a Maya-versus-Aztec cultural
      conflict.
  - speaker: Jungle Cat
    page: 151
    claim: Rejects framing the war as primarily cultural while acknowledging having
      witnessed cultural tensions.
  - speaker: Maggie May
    page: 151
    claim: Disputes a reductive depiction of Mixtec communities and describes contemporary
      technical artistry and evolving traditions.
  - speaker: Synthaxe
    page: 151
    claim: Attributes rhythmic and melodic influences in Aztlan popular music to Tarascan
      styles and cites a contemporary electric-folk revival.
  - speaker: Babycakes
    page: 151
    claim: Jokes about a Tarascan-linked band; the exchange is musical banter rather
      than demographics.
  editorial_boundary: The historical source text and satirical forum voices are not
    reliable observations of real Indigenous groups or modern political conditions.
headline: Fictional language and heritage discussions — FASA Aztlan 1995 Second Edition
  (FASA7213), printed pp149-151/PDF158-160
summary: Separately attributes disagreements over English, Nahuatl, Mayan-language
  estimates, civil-war interpretation, Mixtec art and Tarascan music.
