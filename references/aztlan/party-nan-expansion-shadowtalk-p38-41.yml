pdf_pages: 39-42
edition_scope: FASA Corporation, Aztlan (FASA7213, 1995), fictional Shadowrun Second
  Edition-era tabletop-RPG sourcebook; historical material, no implied Third Edition
  conversion
content_class:
- attributed_claim
data:
  scope: Distinct fictional Shadowtalk speaker assertions; do not convert them into
    the institutional narrator’s established history.
  claims:
  - speakers:
    - Tracer
    - Sangre
    - Larkspur
    claim: Tracer describes Pavón as a follower of Quetzalcóatl; Sangre alludes to
      alleged violence connected to the Aztlán Party; Larkspur questions whether the
      reported rapid change in religion and politics is plausible.
  - speakers:
    - Argent
    claim: Disputes the statement that Pavón was simply called home in 2033, alleging
      instead a palace coup and pressure from corporate sponsors or handlers. The
      exact account is not established.
  - speakers:
    - Socio Pat
    - Arctic White
    - The Chromed Accountant
    claim: Challenge Aztlan’s stated ideals and the official explanation for STC withdrawal.
      The Chromed Accountant asserts that ORO/Aztechnology, rather than Pavón alone,
      influenced the STC decision.
  - speakers:
    - Diamondback
    - Wallace
    - Markops
    - Auntie Social
    claim: Dispute the official account of the Texas campaign, the CAS role, the NAN’s
      intentions and the extent of military control of Austin. Their statements are
      conflicting perspectives, not a unified record.
  - speakers:
    - Argent
    claim: Describes a fictional espionage anecdote of psychologically provoking an
      individual in the Aztlan–NAN rivalry. It is an unverified in-world boast with
      no mechanics or real-world actionable method retained.
  - speakers:
    - Socio Pat
    - Webster
    claim: Claim the later San Diego and nationalization narratives conceal political
      and corporate motives. Webster alleges Aztechnology prompted the nationalization
      and that a president was removed during succession; neither assertion is certified
      by the book’s institutional narrator.
  - speakers:
    - Auntie Social
    claim: Says Amazonian and Aztlan narratives conflict, suggesting competing territorial
      ambitions rather than one straightforward innocent defender.
  mechanics_review: These posts contain political allegations and narrative anecdotes
    rather than rules for players.
framing: newsroom_neutral
headline: 'Fictional Shadowrun tabletop RPG — FASA Corporation Aztlan (1995, historical
