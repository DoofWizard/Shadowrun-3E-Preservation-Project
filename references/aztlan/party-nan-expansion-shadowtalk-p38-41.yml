summary: Historical fictional tabletop reference from FASA Corporation Aztlan (FASA7213,
  1995, Second Edition-era), printed pp38-41/PDF39-42. Critical alternative claims
  remain associated with their named speakers. The book’s institutional account, edited
  source file, named Shadowtalk allegations, and visual context are independently
  distinguished; not contemporary factual reporting or advice.
