data:
  publication:
    title: Aztlan
    publisher: FASA Corporation
    catalog_number: FASA7213
    copyright_year: 1995
    original_edition: Shadowrun Second Edition
  narrative_epistemic_status: All entries describe named fictional speakers’ assertions, disagreement or interface
    dialogue from the original in-world text; none establishes a real-world leak, identity or supernatural
    event.
  source_of_claims_printed_p10:
    speaker: Captain Chaos
    date_of_post: May 1, 2056
    assertion: He claims the material was copied from hidden Aztechnology information, brought to Shadowland
      by Espectro (Ghost), whom he thinks sympathizes with Yucatán rebels; his explanation expressly acknowledges
      uncertainty about motives and data authenticity.
    translation_qualification: He reports that Espectro’s source material was in Aztlaner Spanish, that multiple
      translator programs were compared, and that uncertain or untranslatable passages were marked rather than
      silently resolved.
  authenticity_dispute_printed_p11:
  - speaker: Monty
    claim: Expresses apprehension about even discussing Aztechnology because of its feared reputation; he does
      not allege the document is about the wrong subject or offer independent authenticity evidence.
  - speaker: Doc
    claim: Expresses suspicion that intentionally leaked material may be disinformation; presses for independent
      assessment of Espectro as the supposed source.
  - speaker: Oshkosh
    claim: Argues the compilation could be fabricated, naming apparent Ares Arms memos, UCAS consular material
      and mercenary briefings from Yucatán rebels among the source genres as grounds for suspicion.
  - speaker: Jason
    claim: Counters that the UCAS Consular Operations document identifier syntax appears plausible while openly
      questioning whether the Ares formatting can be trusted; he does not establish the authenticity of either.
  - speaker: Plaintive in Poughkeepsie
    claim: Suggests that a source who has operated inside Aztechnology and wants to expose its practices might
      have a motive to tell the truth; the speaker does not prove this or the source’s identity.
  parallel_panel_printed_pp11_12:
    participants:
    - The Big D
    - Hecate
    - Wordsmith
    - The Laughing Man
    - Lady of the Court
    - Jungle Cat
    - Umsundu
    meeting: A distinct stylized conversation is shown concurrently. The Big D says he invited the others because
      of their identities or affiliations, arranged a virtual setting with help from a technically gifted friend,
      and will provide all of them the Aztlan compilation simultaneously for discussion.
    disagreement: Hecate and Lady of the Court express hostility or reluctance; The Big D urges civility; Laughing
      Man jokes, while Wordsmith and Jungle Cat ask questions. The scene is dialogue rather than the narrator
      certifying the participants’ hidden identities.
    uncertainty: A joke suggests an extremely old dragon, but this is a participant’s joke and not an independently
      established age or proof of identity. The Big D promises a third point of explanation only after the
      document is read; the scene does not supply it.
    closing: Printed p12 ends with the participant group agreeing to read the shared Aztlan file; no mechanical
      test or game numeric modifier is supplied.
  continuity: The opening illustration at printed p9/PDF10 introduces Inside the Big A; this record covers
    the following textual panel through printed p12/PDF13, where the panel ends.
framing: newsroom_neutral
headline: 'Fictional Shadowrun Second Edition Aztlan (FASA7213, FASA Corporation 1995), source.fasa-7213, printed
  pp10–12/PDF11–13: named Shadowland authenticity dispute and Big D panel'
summary: FASA Corporation’s fictional Second Edition Aztlan (FASA7213, 1995), source.fasa-7213, printed pp10–12/PDF11–13.
  Captain Chaos attributes an uncertain leak to Espectro, named Shadowland posters contest its authenticity,
  and a separate Big D, Hecate and Laughing Man conversation establishes a fictional review-panel frame, not
  verified identities or game rules.
