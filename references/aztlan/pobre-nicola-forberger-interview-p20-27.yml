data:
  document_type: Fictional Nicola Forberger interview embedded in a purported leaked newsFAXday draft.
    The interview contains first-person narration, dialogue, crossed-out deletions, bold editor additions
    and Shadowtalk commentary; it is not an independently certified interview of a real person.
  encounter_and_interview:
  - Forberger describes entering Tizimín, noticing traditionalist residents and seeking refreshments at
    a roadside shop. She recounts being incapacitated without consent by the proprietor, losing consciousness,
    and awakening on a cot in an unfamiliar room. She identifies this experience as an involuntary abduction,
    not voluntary safe passage.
  - A figure appearing as a feathered serpent who speaks without visibly moving its mouth introduces itself
    as Pobre. The narrator hears the voice as unusually polished and unaccented. Commenters debate whether
    the appearance is a disguise or a real supernatural form within the fictional setting.
  - Pobre says the venue and reporter’s journey were concealed to prevent tracking by Aztlan forces and
    says Forberger and her belongings were screened using technology and magic. Pobre claims her health
    aura is sound. These are Pobre’s statements, not verified capacities.
  - Pobre claims a position on the insurgency’s Revolutionary Council, compares it to a joint chiefs body,
    rejects being an Aztlaner or Amazonian, identifies as Mexican, and uses the rights and autonomy of
    the land’s first nations as an asserted motivation.
  - Pobre says the movement does not exist simply to destroy the Aztlan government, but the edited version
    asserts continuing armed resistance while oppression persists. Struck-through passages preserve a
    materially different stated emphasis, so both versions remain distinguishable.
  - Pobre claims logistical and financial help from some revolutionary elements in Native American Nations,
    from Tir Tairngire, and unspecified other sources; an interview response about other support is visibly
    edited. Shadowtalk writers speculate about further supporters and opposing states without proving
    them.
  - When asked about civilian casualties and alleged attacks on people outside military sites, Pobre maintains
    that the insurgency has strategic objectives but does not independently substantiate the interview’s
    competing accounts. The journalist raises the Cancún–Cozumel ferry tragedy; the draft includes a lengthy
    deleted answer and an edited response shifting emphasis to public confidence in government protection.
    The source explicitly leaves responsibility contested.
  - When Forberger asks about a vanished 24-member Aztlan technical unit near Tulum and reported desecration,
    Pobre claims the episode affected morale but does not establish how the killings happened. A later
    question asks about rumors of ritual sacrifice; Pobre gives no direct confirmation or denial. Neither
    violence nor claimed rituals are to be asserted as narrator-certified fact.
  - Pobre says their fictional forces use magical practitioners and spirits against opponents with magic,
    while the edited wording explicitly denies blood magic. Comments dispute the definition of blood magic
    and its relationship to the Great Ghost Dance; the draft gives no conclusive ruling.
  - Asked whether there could be peace, the editor-added closing answer says peace depends on the Aztlan
    government being destroyed; a crossed-out answer had instead emphasized recognition of the speaker’s
    people as a distinct culture and sovereign nation. These are materially different assertions and both
    textual states are preserved.
  - After the interview Pobre renders the journalist unconscious again. Forberger says she awakes by her
    vehicle west of Tizimín with a reset GPS, remembers little of the journey, and returns west toward
    Progreso. She sees fictional Aztlan aircraft while leaving.
  rebel_identity_and_agency: Pobre speaks on behalf of a claimed Revolutionary Council, not all local
    people. Descriptions of government oppression and justifications for armed resistance are Pobre’s
    attributed political claims. The abduction of Forberger is nonconsensual in the narrator’s account.
  mechanics_review: The interview references magic, spirits, aircraft and military equipment, but no numeric
    Shadowrun tests, ratings, damage codes or other standalone rules are printed in this portion.
