data:
  art:
    subject: Wide black-and-white futuristic transit-car illustration near top of
      page, showing ornamented vehicle and multi-level built environment.
    signature: Image bears a visible B 95 monogram at upper left (artist not independently
      identified).
  claims:
  - speaker: Ding
    page: 156
    claim: Compares Tenochtitlán to early-21st-century Mexico City and Seattle, arguing
      that visual similarities disguise substantial local change.
  - speaker: Old-Timer
    page: 156
    claim: Challenges Ding’s implication that Seattle has changed less.
  - speaker: Hauka
    page: 156
    claim: Claims local GridGuide versions can misroute a driver, including the example
      of a trip to Xochimilco, due to older or incompatible navigation software.
  - speaker: Henry IV
    page: 156
    claim: Disputes the idea that modern Aztlan and Seattle cars are interchangeable
      on their respective GridGuide highways; says two networks diverged after earlier
      common standards and warns cross-compatibility does not follow.
  - speaker: Henry IV
    page: 156
    claim: Describes his own confusing and dangerous traffic experience, including
      an autoroute exit; an anecdote, not real-world driving advice.
  provenance: Printed p156 / PDF165; in-world speaker claims recorded separately from
    narrator’s installed-hardware statement.
