data:
  presentation_context: On these pages a named fictional review panel and Shadowtalk readers repeatedly
    interrupt the Forberger–Pobre interview. They offer conflicting interpretations; their remarks cannot
    be merged into the journalist’s transcript or certified as book-narrator conclusions.
  panel_speakers:
  - Hecate
  - Jungle Cat
  - Wordsmith
  - The Big D
  - Umsundu
  - The Laughing Man
  - Lady of the Court
  panel_responses:
  - Hecate questions whether Pobre is a recognizable person and whether allegations of magical violence
    are true. The Big D guesses Pobre may be a lesser figure, not proving identity.
  - Jungle Cat distinguishes allegiance to indigenous groups from approving every faction’s conduct, questions
    Pobre’s characterization, and offers no confirmation of the ritual allegations.
  - Umsundu advises caution that appearances and masks may be deceptive; Wordsmith doubts immediate inferences,
    while Laughing Man jokes and is rebuked. These are the panel’s subjective assessments.
  - Commenters Goliath and Lanza debate the meaning of the name Pobre; Curious George speculates the figure
    could be Hualpa. Neither identity nor relationship is established by the original pages.
  - Commenters including Vergis, Talbot, Findler-Man, Little Jo and Media Watcher contest how the newsFAXday
    editorial changes and possible Espectro involvement influence the text; none demonstrates a verified
    alteration history beyond the visible markings.
  - On support for insurgents, commenters raise the Confederation of American States, Tir na nOg, Trans-Polar
    Aleut, Tsimshian and others as possible donors or opponents. These claims remain expressly speculative
    and distinct from Pobre’s own claim of limited support from certain NAN factions and Tir Tairngire.
  - Arctic White and other named contributors discuss the fictional use of mercenaries and armed groups.
    Forberger and Pobre’s differing descriptions are preserved without treating comment speculation as
    a confirmed military order.
  - Brass, Man-of-Many-Names, Magister and The Ref disagree over the Great Ghost Dance and blood magic.
    Man-of-Many-Names characterizes the Great Ghost Dance as voluntary, altruistic sacrifice and alleged
    blood magic as coercive exploitation, while Magister and The Ref make narrower magical-theory distinctions.
    This is a contested in-world comparison, not an established real phenomenon.
  - Gaius and other posters criticize the interview for lacking detailed troop dispositions and supply
    information. The record preserves that criticism as commentary, not as a request for real-world tactical
    guidance.
  artwork_context: Printed p23 includes a fictional armed-person portrait; p26 shows a long-haired armed
    figure. These are illustrated scene depictions, not external photographic identities.
  no_standalone_mechanics: No printed mechanical tables, spell force numbers, target numbers, dice tests
    or procedures occur in this panel sequence.
