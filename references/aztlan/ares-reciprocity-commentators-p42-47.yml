pdf_pages: 43-48
edition_scope: FASA Corporation, Aztlan (FASA7213, 1995), fictional Shadowrun Second
  Edition-era tabletop-RPG sourcebook; historical material, no implied Third Edition
  conversion
content_class:
- attributed_claim
data:
  scope: Disputed Shadowland commentary on a purported Ares corporate file, separate
    from the purported internal Ares assertions.
  claims:
  - speakers:
    - Captain Chaos
    - Jason
    - Talbot
    - Link
    claim: Captain Chaos identifies the material as a possible Espectro leak; Jason
      questions whether its header and Omega classification are authentic. Talbot
      asks about Omega Orders, and Link explains a fictional Corporate Court status
      permitting sanctions against a corporation.
  - speakers:
    - Andy L
    - Link
    claim: Disagree on whether corporate extraterritorial status existed inside Aztlan
      and whether Aztlan’s nationalization or Corporate Court jurisdiction had legal
      priority.
  - speakers:
    - Keynesian Kid
    claim: Maintains that the corporate intervention was financial retaliation against
      nationalization, not primarily collective legal principle.
  - speakers:
    - Arclight
    - Billabong
    claim: Discuss the purported corporate demonstration with skepticism, including
      contradictory claims about who had access to staging assets. These are in-world
      assessments, not independently audited military facts.
  - speakers:
    - Post Haste
    - Beowulf
    claim: Challenge the alleged clean collateral-damage account. Post Haste alleges
      serious harm in surrounding residential districts, while Beowulf mentions a
      Saeder-Krupp Phantom IV Wild Weasel crash and claims civilian casualties were
      lower than alleged. The opposing assertions are not reconciled as an established
      number.
  - speakers:
    - Mondo Esto
    - Webster
    claim: Speculate about a later threatened Ares weapon and the meaning of Big Gun;
      Webster suggests an orbital kinetic weapon or other system, explicitly conjectural,
      not a source-verified device or rules statistic.
  - speakers:
    - Nguyen Nick
    - Largo
    - Argent
    claim: Nguyen Nick provides the Chalco share-ownership example and alleged corporate-court
      decision; Largo relates it to megacorporate competition; Argent warns that the
      fictional Veracruz settlement remains a significant source of tension. None
      is confirmed independently.
  mechanics_review: Original pp42–47 include in-world documents and Shadowtalk, not
    exact SR2 or SR3 combat mechanics. No actionable tactical steps are retained.
framing: newsroom_neutral
headline: 'Fictional Shadowrun tabletop RPG — FASA Corporation Aztlan (1995, historical
  Second Edition; FASA7213; source.fasa-7213), printed pp42-47/PDF43-48: Named challenges
  to the alleged Ares Reciprocity account'
summary: Historical fictional tabletop reference from FASA Corporation Aztlan (FASA7213,
  1995, Second Edition-era), printed pp42-47/PDF43-48. Claims about legal jurisdiction,
  corporate motives, civilian harm and confidential ownership remain attributed. The
  book’s institutional account, edited source file, named Shadowtalk allegations,
  and visual context are independently distinguished; not contemporary factual reporting
  or advice.
