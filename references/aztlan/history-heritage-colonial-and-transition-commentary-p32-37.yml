edition_scope: FASA Corporation, Aztlan (FASA7213, 1995), fictional Shadowrun Second
  Edition-era tabletop-RPG sourcebook; historical material, no implied Third Edition
  conversion
content_class:
- attributed_claim
data:
  editor_scope: Shadowland posts are named in-world disagreements and hypotheses,
    not independent proof of the institutional narrative or real history.
  comments:
  - speakers:
    - Larkspur
    - Bandit of Love
    - Doc
    claim: Criticize the heritage essay as chauvinistic; contrast Aztec and Olmec/Mayan
      descendants and lower-class traditions with the Spanish-descended governing
      elite, arguing that modern Aztlan reconstructed and appropriated a formerly
      suppressed cultural identity.
  - speakers:
    - Matador
    - Smiley
    claim: Matador, an opponent of Aztlan’s elite, links his Yucatán activism to his
      belief that the state has appropriated Indigenous traditions. Smiley mocks him;
      the post does not establish either assessment as an objective fact.
  - speakers:
    - Marguerita
    - Dynalink
    claim: Marguerita relates La Venta to a later organization and speculates about
      a leader and alleged Azzie pursuers; Dynalink cautions that the rumors are unsupported.
  - speakers:
    - Laser’s Edge
    - Webster
    - Holly
    claim: Dispute the historical relevance of ruins and the degree of Maya/Toltec/Aztec
      influence in current Aztlan; Webster treats the mixture as needed cultural context,
      Holly challenges celebratory conquest framing.
  - speakers:
    - Captain Chaos
    claim: Notes an original-language term for temple (teocalli), identifies an ancient
      religious rivalry as Toltec legend, and expressly says he removed large portions
      of Spanish-conquest, republic and revolution passages.
  - speakers:
    - Matador
    claim: Says Indigenous Mesoamerinds under Spanish colonizers were nominally legally
      free and entitled to wages but in practice subjected to forced or quasi-enslaved
      labor; later compensation efforts did not erase these harms. This identifies
      coercion explicitly rather than recasting the relationship as voluntary.
  - speakers:
    - Marcus
    - Locutor
    - Link
    - FastJack
    claim: Exchange disputed allegations about a modern New Society of Jesus, including
      clerical/political activism and armed organization; Locutor denies the caricature
      and presents an official religious mission, while Marcus describes a militant
      faction and FastJack alleges Jesuit deckers.
  - speakers:
    - Carthago
    - Locutor
    - Socio Pat
    - Crystal
    - Benny G
    claim: Argue over PRI scandals, possible political orchestration, corporate influence,
      Church culpability and the Aztlan vote system. Crystal alleges its central operator
      could manipulate ballots; FastJack echoes suspicion elsewhere. These are allegations,
      not demonstrated vote fraud.
  mechanics_review: The Shadowtalk is in-world social and political commentary, without
    distinct dice, tables or numeric mechanics.
framing: newsroom_neutral
