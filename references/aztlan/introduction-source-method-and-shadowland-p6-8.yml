data:
  publication:
    title: Aztlan
    publisher: FASA Corporation
    catalog_number: FASA7213
    copyright_year: 1995
    writer: Nigel Findley
    original_edition: Shadowrun Second Edition
  setting_and_purpose_printed_p6: The book’s introduction calls Aztlan a fictional nation controlled by Aztechnology
    and says it provides players and gamemasters with campaign material, setting information and potential
    story openings, including Tenochtitlán, formerly Mexico City.
  source_document_epistemology_printed_p6: The sourcebook expressly depicts itself as an in-world electronic
    document. Its fictional readers may append opinions, misunderstandings, allegations and lies; the text
    warns that these speakers are not uniformly reliable and leaves factual distinctions to the gamemaster.
  source_rule_scope_printed_p6: The author explicitly identifies Shadowrun Second Edition as the game framework,
    mentions new rules later in the volume for environmental conditions, equipment and Aztlan-specific magic,
    and cites Grimoire Second Edition, Corporate Shadowfiles, Denver, and The Neo-Anarchist’s Guide to Real
    Life as earlier material; the introduction itself provides no numerical rules.
  shadowland_interface_printed_p7_8: The printed introduction simulates a Shadowland connection and file-access
    interruptions. Its fictional interface refers to an Ascending datamag Spring 2056 issue; the next page
    presents a deliberately interrupted Ascending article and a palimpsest-style transition into the leaked
    Aztlan file.
  art_printed_p6: The introduction opening includes a small stylized Mesoamerican figure and ornamental motifs.
    The source’s page images are archival illustrations, not evidence of a particular depicted game event.
  fidelity_note: Printed pp6–8/PDF7–9 inspected as a continuous editorial introduction; statements about the
    fictional setting, publication instructions, simulated interface and future rule sections remain distinct.
framing: newsroom_neutral
headline: 'Fictional Shadowrun Second Edition Aztlan (FASA7213, FASA Corporation 1995), source.fasa-7213, printed
  pp6–8/PDF7–9: in-world document and unreliable-commentary framework'
summary: FASA Corporation’s fictional Shadowrun Second Edition Aztlan (FASA7213, 1995), printed pp6–8/PDF7–9,
  introduces the Aztlan/Aztechnology setting, warns that appended in-world comments can be incorrect or dishonest,
  identifies Second Edition lineage, and frames a fictional Shadowland/Ascending document interface. No Third
  Edition conversion is inferred.
