id: reference.aztlan.civil_war_shadowtalk_newsfaxday_edits_p15_20
record_type: reference
status: ingested
source: source.fasa-7213
printed_pages: 15-20
pdf_pages: 16-21
edition_scope: FASA Corporation, Aztlan (FASA7213, 1995), historical fictional Shadowrun Second Edition-era
  tabletop-RPG sourcebook; no inferred SR3 supersession.
content_class:
- attributed_claim
data:
  narrative_frame: The source interleaves Nicola Forberger’s fictional draft, tracked deletion/addition
    marks, named Shadowtalk comments, and a separate staged panel. Comments are assertions by fictional
    speakers, not sourcebook narrator facts.
  named_commentary:
  - speakers:
    - Jungle Cat
    - The Laughing Man
    - Lady of the Court
    - Umsundu
    pages: '15'
    claim_or_dispute: They contest whether Yucatán traditionalist agriculture reflects deprivation and
      manipulation, cultural practice, or ecological destruction; no single opinion becomes settled fact.
  - speakers:
    - Rhombus
    - Arctic White
    - Beowulf
    - Firelight
    pages: '15'
    claim_or_dispute: They dispute Forberger’s ideas about low-altitude vehicles, jungle flight, cenotes,
      and imagined rebel resistance. These are commentary and equipment references without standalone
      rules or numeric weapon statistics.
  - speakers:
    - Tilde
    - London
    - Jeni Fire
    - Media Watcher
    pages: 15-16
    claim_or_dispute: They speculate about censorship, editor decisions and newsFAXday ownership; London
      identifies newsFAXday as an Atlanta news/entertainment chain owned by Xpress Communications Corporation
      (XCC), while other posters allege Aztechnology influence and editorial bias. The record does not
      certify those allegations.
  - speakers:
    - Sangre
    - Pedro
    - Mujeres
    - Jinim
    - Lanza
    pages: 17-18
    claim_or_dispute: They give conflicting explanations for early violence, later weapon access and covert
      financing. The narrative cites multiple possible sources; no source independently proves them.
  - speakers:
    - Drover
    - Socio Pat
    - Staedtler
    - Matador
    pages: '18'
    claim_or_dispute: They debate the FDN/PAN coalition and VITAS outbreak; Staedtler’s descriptions of
      death tolls, cholera and dangerous city conditions are attributed claims.
  - speakers:
    - Archer
    - Puget Deb
    - Newt II
    pages: '19'
    claim_or_dispute: They openly dispute the objectivity of the edited 2035–2050 uprising account and
      the editor’s intervention.
  - speakers:
    - J-School Doctor
    - Meistersinger
    pages: '19'
    claim_or_dispute: They comment on Forberger’s unreliable language skills and her meeting with a fuel-station
      family; suggestions about the family’s motives are speculative.
  tracked_changes: Printed p19 strikes out the original label for the conflict and a previous characterisation
    of military action, replacing it with a more favorable government frame. The later printed passage
    is editor-added; the draft visibly preserves both editorial stages. The narrative should not be flattened
    to a single impartial history.
  source_mechanics: This is named Shadowtalk and editorial-fiction material; no exact tabletop mechanics
    on these pages.
framing: newsroom_neutral
headline: 'Fictional Shadowrun tabletop RPG, FASA Corporation Aztlan (1995, Second Edition; FASA7213),
