data:
  context: Fictional Shadowland-style discussion accompanying Carmen Hidalgo's government-and-politics
    essay; page and speaker attributions matter, and allegations are not editorially
    endorsed.
  claims:
  - speaker: Agent
    printed_page: 147
    claim: Mocks the Chamber of Deputies as largely inactive and ineffective; a critical
      opinion, not a numerical legislative rule.
  - speaker: Hangfire
    printed_page: 148
    claim: Claims that hired experts engage in party politics and dirty tricks and
      doubts opposition-party infighting changes much.
  - speaker: Low Ranger
    printed_page: 148
    claim: Disputes Hidalgo's assessment of the PRI, describing its leadership and
      funding as more durable; speculates, without substantiation, about support from
      other megacorporations.
  - speaker: FastJack
    printed_page: 148
    claim: Briefly asks Low Ranger why he was absent; this is dialogue rather than
      a political assertion.
  - speaker: Lindy Bop
    printed_page: 149
    claim: Questions the existence of external oversight for electronic election audits
      and then asks whether anyone discovers misconduct.
  - speaker: Hidalgo
    printed_page: 149
    claim: Sarcastically calls an Aztechnology-owned accounting firm the supposed
      election overseer; distinguishes her allegation from an impartial audit finding.
  - speaker: Fox
    printed_page: 149
    claim: Warns that a publicly available data trail can create misplaced confidence
      without demonstrable integrity checks, and urges political resistance as opinion.
  - speaker: Whole-in-the-Wall
    printed_page: 149
    claim: Recounts a proposed job to place unexplained code into an Aztechnology
      computer system; later interprets it as potentially revealing real election
      counts. The proposed purpose and mechanism remain the speaker's speculation;
      no working method is described here.
  provenance: printed147-149/PDF156-158; historical fictional Shadowrun Second Edition
    setting; not real-world political allegations.
headline: Named fictional Shadowtalk on Aztlan politics — FASA Aztlan 1995 (Second
  Edition, FASA7213), printed pp147-149/PDF156-158
summary: Source-attributed arguments and speculation about opposition parties, voting
  records, and claimed audit independence, explicitly separate from the political
  analyst's narrative.
