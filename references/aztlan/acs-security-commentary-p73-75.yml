source: source.fasa-7213
printed_pages: 73-75
pdf_pages: 74-76
edition_scope: FASA Corporation, Aztlan (FASA7213, 1995), fictional Shadowrun Second Edition-era tabletop-RPG
  sourcebook; historical provenance; no Third Edition conversion
content_class:
- attributed_claim
data:
  source: Named Shadowland commentators accompanying purported Knight Errant proprietary file, not verifiable
    real-world military/security facts.
  claims:
  - speaker: Captain Chaos
    pages: '73'
    claim: Introduces leaked Knight Errant security briefing; argues that Aztechnology security and
      Aztlan military units are structurally interconnected rather than fully separate.
  - speaker: Viviane
    pages: '73'
    claim: Warns that ACS acts as police throughout Aztlan, a fictional setting observation.
  - speaker: Thibault
    pages: '73'
    claim: Names Carmel Vega as the ACS managing director, Desert Wars veteran and former ORO expediter’s
      daughter.
  - speaker: Dobu
    pages: '73'
    claim: Notes overlap with earlier Corporate Shadowfiles presentation.
  - speaker: NiteSpawn
    pages: 73-74
    claim: Relates an in-world astral intrusion disrupted by paired watcher spirits followed by a powerful
      fire elemental; explicitly relates an encounter rather than a universal rule.
  - speaker: Essian
    pages: '74'
    claim: Speculates that the reported mana field is background count and could be deliberately generated
      to deter astral observers; this is not verified.
  - speaker: Argent
    pages: '74'
    claim: Estimates 1 percent of the overall fictional population has magical aptitude and roughly
      2 percent of ACS guards are magically capable; explicitly calls the second figure uncertain. Mentions
      anchored protective or detection magic prepared for nonmagical colleagues.
  - speaker: Libbie
    pages: '74'
    claim: Relates a failed fictional encounter with magically protected ACS guards; not proof of a
      standard loadout or universal spell effect.
  - speaker: Arclight
    pages: '74'
    claim: Alleges ACS uses adaptive/cascading IC and expert-system-driven constructs and relays unconfirmed
      rumors of Escher loopers and data worms sourced from Lone Star GridSec; do not elevate hearsay
      to a verified rules inventory.
  - speaker: Wild Bunny
    pages: '75'
    claim: Makes a sarcastic remark about ACS force and equipment.
  - speaker: Jameson
    pages: '75'
    claim: Describes elite-guard uniform differences and bearing from personal impressions.
  - speaker: Carter
    pages: '75'
    claim: Claims Seattle pyramid Leopard Guard detachment.
  - speakers:
    - Macky
    - Pyramid Watcher
    pages: '75'
    claim: Debate whether Leopard/Jaguar Guards are soldiers or security officers; Pyramid Watcher notes
      dual military appearance/functions but formal ACS classification.
  - speakers:
    - Victor
    - Wild Bunny
    - Gustav
    - Lady Sal
    pages: '75'
    claim: Disagree over the existence of Tir Tairngire Black Daggers; the source preserves unresolved
      disagreement rather than asserting the unit definitely exists or is mythical.
  - speaker: Dogbreath
    pages: '75'
    claim: Requests a comprehensible troop count rather than accepting battalion terminology.
  classification: Historical fictional commentary and allegations, not procedures for real security
    systems.
framing: newsroom_neutral
headline: 'Fictional Shadowrun tabletop RPG — FASA Corporation Aztlan (1995, historical Second Edition;
  FASA7213; source.fasa-7213), printed pp73-75/PDF74-76: Attributed ACS security anecdotes, magical
