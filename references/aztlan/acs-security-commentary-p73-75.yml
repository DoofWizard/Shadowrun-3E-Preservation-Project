summary: Published fictional tabletop-RPG source excerpt from FASA Corporation Aztlan (FASA7213, 1995,
  historical Second Edition), printed pp73-75/PDF74-76; Attributed ACS security anecdotes, magical estimates,
  and disputed elite-unit comparisons. The original fictional Knight Errant document, book narrator,
  named Shadowtalk speakers and uncertainty are kept distinct; no modern-edition conversion.
