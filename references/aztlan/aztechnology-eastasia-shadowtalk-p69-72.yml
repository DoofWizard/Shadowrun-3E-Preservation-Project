id: reference.aztlan.aztechnology_eastasia_shadowtalk_p69_72
record_type: reference
status: ingested
source: source.fasa-7213
printed_pages: 69-72
pdf_pages: 70-73
edition_scope: FASA Corporation, Aztlan (FASA7213, 1995), fictional Shadowrun Second Edition-era tabletop-RPG
  sourcebook; historical provenance; no Third Edition conversion
content_class:
- attributed_claim
data:
  scope: Named fictional Shadowland/board comments inserted beside East Asia Association material. Each
    allegation/opinion is not adopted as independent book-narrator fact.
  claims:
  - speakers:
    - Kevin Kelvin
    pages: '69'
    report: Warns that corporate operating procedures can vary substantially by geographical and industrial
      division.
  - speakers:
    - Elder God
    - Nuyen Nick
    pages: '69'
    report: Question whether biocomps should count as cybernetics or biotechnology; Nuyen Nick alleges undisclosed
      projects and doubts the association has strong industrial-espionage intelligence.
  - speakers:
    - fritz the Rat
    - Pyramid Watcher
    pages: '69'
    report: Discuss heavy-industry decline. Pyramid Watcher attributes it to hazardous factory investments
      in unstable lower-wage regions and alleges Aztechnology has shifted risk to second-tier firms while
      earning from process-control expert software and revenue-sharing licences.
  - speakers:
    - Nuyen Nick
    - Foster
    - KHB
    pages: '70'
    report: Contrast takeover tactics and allege some competitors reduce asset prices through attacks or
      executive killings; KHB explicitly disputes Foster’s normalization of such methods.
  - speakers:
    - Nagel
    - Hangfire
    pages: 70-71
    report: Nagel compares Aztechnology competitive tactics with a fictional Corporate Shadowfiles dossier;
      Hangfire claims the company uses internal dirty-tricks crews rather than contracting many shadowrunners,
      speculates about violent countermeasures and alleges friction with other AAA corporations.
  - speakers:
    - Nuyen Nick
    pages: '70'
    report: Argues the reported nearly 200-million-nuyen Komatsu response may have deterred later challengers;
      an opinion, not a proven return on investment.
  - speakers:
    - Bung
    - Hangfire
    - Silver Dowager
    - Markops
    pages: '71'
    report: Question whether peace with Mitsuhama will last; Silver Dowager relays a rumor of Lofwyr’s hostility
      toward Aztechnology leader Atzcapotzalco, and Markops alleges tensions with Telestrian Industries.
  - speakers:
    - Samwise
    - The Chromed Accountant
    - Panther
    pages: 71-72
    report: The Chromed Accountant argues Aztechnology is not uniquely worse than other megacorporations,
      citing comparable consumer goods and employee loyalty; Panther rejects the defense with a SysOp-deleted
      insult.
  - speakers:
    - Constanzia
    - Mugshot
    - La Sombre
    - Doc
    pages: '72'
    report: Debate whether the requested paranatural recruitment screening is a magical mind scan and whether
      it screens for insect spirits; La Sombre challenges alleged prior knowledge of the Universal Brotherhood,
      while Doc disputes that circumstantial knowledge proves awareness of insect spirits.
  - speakers:
    - Blunt Object
    - Argent
    pages: '72'
    report: Blunt Object recounts a coerced extraction assignment after a researcher refused an Ares employment
      offer, alleging Aztechnology guards killed the abducted researcher and several extraction-team members.
      Argent distinguishes the company’s comparatively rare involuntary extractions from assistance to rivals’
      staff who choose voluntarily to leave.
  editorial_note: Speaker allegations are bounded by their pages; references to fictional violence are retrospective
    plot reporting, not tactics or advice.
framing: newsroom_neutral
headline: 'Fictional Shadowrun tabletop RPG — FASA Corporation Aztlan (1995, historical Second Edition;
