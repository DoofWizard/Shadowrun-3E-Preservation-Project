data:
  claims:
  - speaker: Auntie Social
    page: 154
    claim: Calls attention to population, demographics, per capita income, poverty
      and megacorporate affiliation; asserts that statistics exclude undocumented
      people (SINless hordes).
  - speaker: Tozer
    page: 154
    claim: States that Tenochtitlán has average altitude above 3,000 meters (10,000
      feet); compares physiological difficulties with Denver and opines the city is
      worse.
  - speaker: Sydney
    page: 154
    claim: Claims Aztechnology controls city administration by appointment and influence;
      an in-world political opinion, not a description of real municipal government.
  - speaker: Klerk
    page: 154
    claim: Asks whether there is any city whose civic government is not at least somewhat
      corrupt.
  - speaker: Jimcrack
    page: 154
    claim: Identifies Mayor Simon Xaltepec as a retired Aztechnology wageslave, presented
      by the speaker as unsurprising.
  - speaker: Hoi
    page: 154
    claim: Introduces selected major precincts with socioeconomic and law-enforcement
      levels and says the selection focuses on the center of the large city.
  - speaker: SPD
    page: 154
    claim: Says the central-precinct list omits squatters’ areas further toward suburbs;
      also recounts adverse changes in formerly pleasant city districts.
  - speaker: Deborah
    page: 154
    claim: Recalls living in Mexico City in 2003 and challenges class descriptions
      of selected districts, citing formerly desirable housing; a personal recollection
      rather than proof of 2056 conditions.
  attribution_policy: Named fictional Shadowtalk remarks are indexed as claims and
    recollections; do not turn opinion into narration or merge speakers. Source identifies
    p154/PDF163.
headline: Fictional Tenochtitlán city commentary, FASA Aztlan FASA7213 (1995 Second
