data:
  source_status: Captain Chaos posts a fictional Shadowland introduction to a putative leaked working text. Assertions
    about the document, sources, political conflict and motivations are attributed to Captain Chaos, not certified
    by the book narrator or this archival record.
  speaker: Captain Chaos
  in_world_post_time: May 1, 2056, 12:00:10 (as printed; source-local notation 5-1-56)
  framing: He says an earlier large Shadowland post about Aztlan preceded this related document, alleges trouble and
    insurgency in the Yucatán, and says the people involved have not been able to present their side; he offers the
    document for readers or fictional player characters connected with either side to assess.
  proposed_provenance: He attributes access to Espectro (Ghost), whom he thanks; he says the text file apparently
    came from the editing/composition system at fictional newsFAXday in Atlanta but explicitly does not know how Espectro
    obtained it.
  named_people_and_roles:
    journalist: Nicola Forberger
    editor_in_atlanta: Diana Mlodzik
  editing_distinctions: Captain Chaos says the circulating text includes the journalist’s original feature about the
    Yucatán conflict plus a copy-editor’s tracked revisions; deleted passages are shown with strikethrough and editorial
    additions in boldface. Those typographic differences are part of the source’s staged in-world leak, not authorial
    verification.
  uncertainty: Captain Chaos describes the materials as apparently taken, does not independently verify the claimed
    access method, and presents an interested in-world perspective rather than an impartial ruling on the fictional
    civil war.
  illustration: The page contains a stylized small Mesoamerican-inspired running figure and a large decorative motif
    adjacent to the commentary. No numerical mechanics are introduced.
  pagination: This illustrated chapter prologue is physical PDF14, immediately after visibly numbered printed p12/PDF13
    and before the full-page chapter illustration at PDF15; its inferred printed position is p13 despite no numeral
    visible on this opener.
