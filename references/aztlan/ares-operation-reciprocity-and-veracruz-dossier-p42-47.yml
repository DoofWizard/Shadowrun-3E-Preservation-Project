  1995, Second Edition-era), printed pp42-47/PDF43-48. In-world corporate-source assertions,
  numeric outcome claims, named organizations and alleged conditions are explicitly
  attributed; no real-world tactical guidance is reproduced. The book’s institutional
  account, edited source file, named Shadowtalk allegations, and visual context are
  independently distinguished; not contemporary factual reporting or advice.
