data:
  document_scope: 'Fictional Shadowrun text labeled Ares Macrotechnologies Tactical
    Brief: Ensenada and Veracruz; Captain Chaos reports it was allegedly obtained
    from Ares data storage. Its factual assertions, characterizations and casualty
    assessments remain in-world corporate claims rather than independent military
    history.'
  provenance:
    file_header: Ares-1://html:/0202-Ensenada Operation Reciprocity
    security_link: Omega-335, 10/10/48
    editor: Captain Chaos identifies Espectro as the provider and explicitly urges
      skepticism of corporate writing.
  background:
  - period: Before early 2048
    account: The alleged corporate report describes Aztechnology and the Aztlan government
      nationalizing foreign corporate property while refusing Corporate Court jurisdiction;
      Aztechnology rejects court orders and threatens withdrawal.
  - period: Early 2048
    account: The Court creates a purported Pan-Corporate Security Committee with triple-A
      corporation representatives other than Aztechnology and authorizes a direct
      response aimed at demonstrating the consequences to Aztechnology of continued
      defiance.
  operation:
    name: Operation RECIPROCITY
    location: Ensenada, contested Aztlan/San Diego region, as represented by the in-universe
      dossier
    characterization: The fictional Ares report describes a coordinated corporate
      demonstration directed at Aztechnology-associated military assets, with elements
      from air and sea and multiple corporate participants. The reference preserves
      source attribution and reported outcomes without supplying actionable real-world
      attack sequencing or optimization.
    participants: Ares Macrotechnology, Fuchi Industrial Electronics, Mitsuhama Computer
      Technologies, Saeder-Krupp, Renraku Computer Systems, Shiawase and Yamatetsu
      are named as providing various forms of support or participation. The dossier
      distinguishes logistical support from direct combat involvement.
    fictitious_reported_results: The dossier claims about 95 percent of Aztlan interceptor
      forces were misdirected, a strike element incurred approximately 15 percent
      losses, and the Ensenada base’s military capacity was degraded by approximately
      10 percent. These numbers are corporate assertions in the narrative, not tabletop
      target numbers or real-world combat benchmarks.
    retaliation_and_settlement: The report says Ares delivered a 72-hour deadline
      linked to possible further corporate action; Aztlan/Aztechnology accepted a
      settlement approximately 12 hours before expiry.
  veracruz_settlement:
    period: '2048'
    compensation: The alleged settlement provided direct compensation to corporations
      whose assets were nationalized over the preceding four years, with transfers
      described as confidential.
    access_rules: Foreign megacorporations could operate in Aztlan only indirectly
      through locally majority-owned subsidiaries; the largest single shareholder
      must be Aztlaner, but need not possess outright voting control. An arms-length
      independence requirement governed related foreign shareholdings.
    company_example: Shadowtalk speaker Nguyen Nick—not the dossier narrator—separately
      claims Chalco Computer Systems used a 40% Aztlan government, 22% MCT North America
      and 20% HybriData arrangement; he alleges HybriData was indirectly owned by
      MCT Australasia, that a court rejected the arrangement, and that Aztechnology
      acquired the former assets at five cents on the dollar. These are commentary
      rather than verified contract terms.
  uncertainty_and_protection: Ares writers claim to have avoided broader civilian
    collateral harm and to have achieved strategic success; separate in-world posters
    dispute casualties, the site impact, motives and the authenticity of both corporate
    and Aztlaner accounts. No source rules, TN, dice pool, weapon damage code, availability
    or equipment statistics are supplied on these six pages.
