data:
  document_provenance: Captain Chaos introduces a fictional translated Aztlaner-Spanish briefing labeled
    Operation Libertad, says a machine translation by FTL Technologies of the Cheyenne Sioux Nation won
    selection, and explains italicized untranslated terms. Captain Chaos does not certify authenticity
    or the correctness of every translation.
  in_world_document: The briefing purports to address participants in a Yucatán rebellion, allocating
    them among named camps and zones. Its military language is an in-universe claim within a fictional
    tabletop source, not a real-world plan or operational instruction.
  named_camps:
  - Camp Entrañas (Spanish term discussed as “entrails”)
  - Camp Templo (“Temple”)
  - Camp Naranja (“Orange”)
  named_zones:
  - zone: Ghost
    status: The brief assigns coastal logistical significance and asserts increased Aztlan attention;
      Shadowtalk posters speculate that the name refers to Bahía de Espíritu Santo and coastal geography.
      Not verified by the source narrator.
  - zone: Lagos
    status: The brief describes conditions around Camp Templo and alleged technological/magical screening;
      a commentator speculates that lakes by Maya ruins near Tikal explain the zone name. Not independently
      located.
  - zone: Cathedral
    status: The brief links this zone to Point Polyphemus and an asserted Aztlan military facility; Tish
      speculates about Mérida, its cathedral, and a phased-array radar near Progreso. This remains a named
      commentator’s geographic hypothesis.
  named_shadowtalk:
  - speaker: Bourne
    comment: Suggests meanings and strategic implications of coded camp names; acknowledges that this
      is speculation.
  - speaker: Socio Pat
    comment: Warns that the Aztlan Freedom League, indigenous rebel groups, Orgu(l)lo, Catholic Action
      Front and other organizations should not be conflated merely by rhetoric or claimed affiliation.
  - speaker: Royston
    comment: Suggests possible interpretations of Templo, Entrañas and Naranja using local geography and
      translations; makes no source-verified identification.
  - speaker: Tish
    comment: Associates Zone Ghost with Bahía de Espíritu Santo, Lagos with a lake district around Tikal
      and Cathedral with Mérida/Progreso; offers hypotheses, not coordinates established by a narrator.
  - speaker: Argent
    comment: Notes the possibility that public speculation itself creates problems for clandestine actors;
      again this is a fictional reader’s remark.
  mechanics_review: The two pages contain an in-world briefing, names, political/geographic speculation
    and prose; no tabletop dice/TN/stat or equipment table is introduced. The source’s tactical prose
    is referenced as fiction, without reproducing real-world operational instructions.
