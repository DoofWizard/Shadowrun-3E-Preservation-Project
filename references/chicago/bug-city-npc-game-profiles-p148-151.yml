id: reference.chicago.bug-city-npc-game-profiles-p148-151
record_type: historical_tabletop_npc_statistics
status: source_reviewed
source: source.fasa-7117
printed_pages: 148-151
pdf_pages: 157-160
edition_scope: Historical Shadowrun Second Edition Bug City; suggested source statistics, no inferred SR3 supersession
content_class:
- equipment_stat
data:
  ratings_basis: Expanded Prime Runners Threat Ratings; standard-SRII averaging conversion preserved in reference.chicago.bug-city-npc-game-profiles-p146-147.
  hanna_uljaken:
    p: '148'
    pdf: '157'
    baseline: Corporate Secretary Contact, SRII p.205, but smarter, more agile, skilled and charismatic; numerical
      increases unspecified.
    focus: Single earring, low-level magical focus/spell lock enhancing Charisma; temporarily deactivated after
      Teller explained its astral-attack vulnerability.
    recommended_ratings:
      professional: 2
      combat_threat: 1
  melissa_truman:
    p: '148'
    pdf: '157'
    attributes: All ordinary Attribute Ratings 3, except Charisma 4 and Willpower 2
    skills: No appreciable or valuable skills before Zone creation; subsequent learning unspecified.
    recommended_ratings:
      professional: 1
      combat_threat: 1
  linda_hayward:
    p: '149'
    pdf: '158'
    type: Mantis spirit, as described starting on p.140
    force: Approximately 6
    recommended_ratings:
      professional: 4
      combat_threat: 6
  jerome_standish:
    p: '149'
    pdf: '158'
    statistics: All statistics, skills and possible powers/abilities left to gamemaster; possession of any powers
      is not established.
    recommended_ratings:
      professional: None
      threat: None
  catherine_cunningham:
    p: '150'
    pdf: '159'
    canonical_id: person.chicago.cathy_cunningham
    conditional_profiles:
      if_hermetic_mage: At least Grade 2 initiate; prefers air and fire elementals and uses powerful watchers as
        messengers and enforcers.
      if_not_hermetic_mage: Extensive cybernetic headware potentially supplying gigapulses of data storage and manipulation.
      possible_equipment: May retain encrypted headware communications capable of penetrating UCAS jamming; not
        confirmed.
    recommended_ratings:
      professional: 4
      combat_if_mage: 3
      combat_if_not_mage: 5
      magical_if_mage: 6
      magical_if_not_mage: 0
  king_vlad:
    p: '150'
    pdf: '159'
    canonical_id: person.chicago.king_vlad
    suggested_profile: Gamemaster sets statistics; probably street-samurai abilities, equipment, skills and attitude,
      or mercenary if that is too expensive. Extensive varied street experience supports high Combat Threat.
    recommended_ratings:
      professional: 4
      combat_threat: 9
  tamir_grey:
    p: '151'
    pdf: '160'
    traits: Physically weaker than most ghouls, but more intelligent and charismatic; normal human skills and strong
      street/ghoul knowledge.
    weapon: Expert shot with classic Ares Predator heavy pistol
    recommended_ratings:
      professional: 3
      combat_threat: 3
  blaine_hammond:
    p: '151'
    pdf: '160'
    traits: Strong as a troll, astral sight, master of armed and unarmed combat; tougher and smarter than most ghouls,
      most ordinary human skills, especially proficient with firearms and unarmed combat.
    limitation: Blindness associated with second-generation ghouls; compensates through other senses, without transplants
      or cybernetics. Difficulty targeting opponents farther than about 20 yards, depending on prevailing winds.
    recommended_ratings:
      professional: 4
      combat_threat: 5
  related_records:
