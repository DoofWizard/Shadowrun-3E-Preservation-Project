  - rule.chicago.bug_city.insect_reproduction_p139_142
  - world.chicago.bug-city-npc-biographies-p148-151
headline: Bug City NPC game profiles, pp.148-151
summary: Eight source-specific profiles with exact ratings, conditional builds and limitations.
