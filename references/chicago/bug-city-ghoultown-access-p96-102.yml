data:
  location: Cabrini Refuge / Ghoultown, former Cabrini Green, Chicago Containment Zone
  related_world_record: world.chicago.bug_city.ghoultown_p96_102
  scene_framing:
    printed_page: 102
    expectation: Human and metahuman outsiders may encounter a hostile reception because refuge residents have experienced persecution.
    listed_narrative_entry_relationships:
      - Becoming a ghoul as part of a refugee group's recruitment or community expansion.
      - Arriving with scarce resources needed by residents.
      - Sharing an adversary or goal with residents.
    rules_status: Narrative scenario premises, not mechanical tests, target numbers or eligibility rules.
  recruitment_theme:
    printed_page: 102
    source_account: The text portrays post-repeal ghoul solidarity alongside a recruitment initiative that spreads ghoul infection; it does not provide an infection test or a new disease rule on this page.
    moral_scope: Residents and outsiders are depicted as facing coercion, stigma and survival pressures; recruiting someone is not necessarily informed or voluntary.
  supplies_theme:
    printed_page: 102
    source_account: The refuge is comparatively well supplied but not self-sufficient, and shortages can make supplies a point of negotiation with outsiders.
    ethical_conflict: The text describes a trade in human remains and live captives, with a fictional example linking a dozen captives to about a week of access; this is scenario context, not a real-world procedure or a formal game price table.
    gangs_named: [Fleshmongers, Living Dead]
    cross_reference: Printed page 119 for those organizations.
  defenses_as_scenario_constraints:
    printed_pages: '101-102'
    spatial_context: Raised wall walkways, towers, rooftop observers and a fortified central roof shape an encounter at the refuge.
    astral_context: Dual-natured ghoul residents can perceive astral visitors, though few magicians are present to counter hostile spirits.
    mechanics_status: No new dice pools, target-number modifiers, equipment stat lines or numerical combat procedures introduced in this access subsection.
