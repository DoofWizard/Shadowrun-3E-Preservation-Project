data:
  section: Game Information; What Is Bug City?; Using Bug City; Gamemastering Bug City
  setting_role: The Chicago crisis is a major published change to the historical setting, while individual campaigns
    may selectively adopt its events.
  continuity_options:
  - Relocate a comparable insect-spirit outbreak to another familiar campaign location if the group does not want
    Chicago disrupted.
  - Adjust the timeline, starting with a first hive outbreak and quarantine, to fit an ongoing campaign's dates.
  - Reorder events and local consequences without treating the published scenario sequence as immutable for a home
    campaign.
  play_formats:
  - Outside runners undertake temporary missions inside the Containment Zone and must negotiate entry, events inside,
    and departure.
  - A parallel campaign follows residents or runners surviving inside Chicago using a separate group of characters.
  gm_focus:
  - Portray the isolation and scarce supplies as sustained constraints rather than endless combat scenes.
  - Treat the insect spirits, gangs, and warlords as recurring major factors but vary scenes to avoid repetitive
    encounters.
  - Keep ordinary Chicago residents visible as people with individual fears, needs, hopes, and relationships.
  - Make contacts with local havens or warlords consequential, not disposable interruptions.
  - Build escape from the Containment Zone as a long-term campaign objective and a choice involving other residents.
  future_setting_note: The 1990s publication explicitly leaves later political and military resolution open; it
    does not establish a future SR3 replacement rule.
headline: Bug City gamemaster guidance
summary: This historical source proposes alternative campaign scopes and continuity options, emphasizing residents,
  limited resources, local factions, and difficult exits.
