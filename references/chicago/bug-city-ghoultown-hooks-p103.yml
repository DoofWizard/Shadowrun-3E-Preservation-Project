data:
  setting: Ghoultown / Cabrini Refuge in the Chicago Containment Zone
  page_basis: Final portion of the Ghoultown section, before the Goose Island entry.
  approaches:
    - hook: Medical support
      framing: Because residents suffer a debilitating infection and medical supplies are scarce, an outsider offering medicine or qualified medical assistance may be welcomed at the hospital, with continued access dependent on the head nurse.
    - hook: Shared opposition
      framing: Residents oppose insect intruders and also face Humanis Policlub remnants and the anti-ghoul Volk; a visitor who demonstrates opposition to one of these groups may gain allies.
    - hook: Internal divisions
      framing: Ghoul nationalist hardliners seek separation and distinct cultural identity, while moderates favor coexistence with metahuman society. The distinction provides potential interlocutors and local tensions.
  mechanical_status: Scenario relationships only; the page supplies no new tests, target numbers, numerical modifiers or disease-resolution rules.
