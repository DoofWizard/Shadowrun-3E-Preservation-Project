data:
  anchor: Bug City printed 135-136 / PDF 144-145, INSECT SHAMANS and Increasing Potency
  pc_recommendation: The published gamemaster advice recommends against allowing player
    characters to follow insect totems, because the shaman increasingly prioritizes
    the alien hive/nest goals and may become an antagonist. This is advice, not a
    mandatory character-creation rule.
  potency_task_guidance: The gamemaster designs tasks according to the shaman’s aims;
    the players should have at least one opportunity to impede those aims. The book
    invites apparently arbitrary tasks to express insect motivations.
  source_examples_fictional_scenarios:
  - Disseminate articles making serious allegations about a polyclub or another group
    threatening the hive/nest.
  - Obtain a series of Neolithic artifacts from several collections, both public and
    private, for a proposed special enchantment.
  - Ensure a particular city block is emptied of residents for a week starting on
    a specified date; the adventure may involve persuasion, bribery, coercion or spirit
    possession.
  - Assemble a force of twenty spirit-possessed human workers for a project.
  continuity: This advice is historical fiction for tabletop adventure preparation,
    not real-world tactics.
headline: Gamemaster portrayal of insect totems
summary: Gamemaster guidance and adventure-task examples for insect shaman antagonists.
