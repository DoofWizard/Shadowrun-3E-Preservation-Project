data:
  ratings_basis: Expanded Threat Ratings from Prime Runners; standard SRII Threat Rating is the average of listed
    Threat Ratings, rounded up.
  kyle_teller:
    p: '146'
    pdf: '155'
    magic: Hermetic magician, self-initiated at about Grade 4
    spells: Some combat spells; primary focus investigation and detection
    spirits: Uses elementals and watchers as guards and patrols
    foci:
      spirit_rings: Four, one per elemental type; diamond for air, sapphire for water, ruby for fire, emerald for
        earth
      bracelets: Heavy silver/copper/orichalcum wire; right wrist detection spell focus, left wrist illusion spell
        focus
      power_focus: Coppery-gold amulet dominated by a large opal
      lost_weapon_focus: Egyptian-style ornate silver/orichalcum dagger, lost in the CZ, not located astrally; remains
        a direct link to Teller
    equipment: Custom headware for data collection and management; no model or numerical rating specified.
    recommended_ratings:
      professional: 4
      combat_threat: 4
      magical_threat: 7
  anne_ravenheart:
    p: '147'
    pdf: '156'
    magic: Combat mage, Grade 3 initiate
    cyberware: Substantial implants including basic Wired Reflexes and headware Tactical Computer; no numeric implant
      ratings specified.
    expertise: Highly skilled with most weapons; extensive varied tactical experience
    spells: Favors direct aggressive combat spells and transformation/damaging manipulation spells
    spirits: Rarely uses any kind
    recommended_ratings:
      professional: 4
      combat_threat: 6
      magical_threat: 6
  seeks_the_moon:
    p: '147'
    pdf: '156'
    type: Free ally spirit
    reference: Grimoire Second Edition pp.76-83
    force: 7
    spirit_energy: 2
    retained_ally_power: Sorcery only
    gained_free_spirit_powers:
    - aura masking
    - human form
    recommended_ratings:
      professional: 4
      combat_threat: 7
      magical_threat: 7
