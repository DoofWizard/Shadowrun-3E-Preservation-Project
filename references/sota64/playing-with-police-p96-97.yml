  police_campaign_reference: Shadowrun Companion p116
  encounter_guidance: The GM should make fictional police encounters challenging without
    forcing combat or eliminating a viable way out; escalation can overwhelm the party
    and disrupt the campaign.
  sinless_status: Within the fictional setting, a person without a SIN lacks legal
    rights before assignment of a criminal SIN. The source associates this and officers'
    concern about runners' superior capabilities with excessive force against captured
    runners.
  cop_contacts:
    reference: State of the Art 2064 p85
    access: Information and assets depend on the contact's actual job; street patrol
      knows local street conditions but ordinarily lacks investigative files.
    loyalty_limit: Police contacts are unlikely to disclose information that endangers
      other officers.
