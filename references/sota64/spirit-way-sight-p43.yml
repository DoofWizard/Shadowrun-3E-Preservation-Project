data:
  publication: {title: 'State of the Art: 2064', publisher: FanPro, catalog_number: FanPro25004, edition: Shadowrun Third Edition, chapter: The Path of the Adept, section: The Spirit Way, printed_page: 43, physical_pdf_page: 44}
  spirit_way:
    attribution: Elan, fictional in-world author and follower of the Spirit Way.
    sight: Elan describes every follower as possessing the ability to perceive the astral plane at will, and regards that ability as indispensable to pursuing the ideal of this path.
    physical_development: Elan says development of physical strength or health is not advocated or necessary for this way, unlike the Athlete or Warrior ways.
    scope: An attributed description of followers, not an independently specified character-creation prerequisite, power grant, or numerical test.
  masking_commentary:
    speaker: Fatima
    claim: Fatima reports that Elan is one of only three people she knows who can identify her as a mage despite her Masking; the other two were her mentors. She regards his Sight as exceptionally keen.
    scope: Individual fictional testimony; no automatic detection, new power, or replacement for a formal Masking test is established.
  dimensional_memory_commentary:
    author_claim: Elan attributes his unusually sharp physical sight to prolonged use of Sight and describes dimensional memorization as a developed faculty among many Awakened.
    contrary_claim: Logik reports that research into dimensional memory produced no conclusive evidence and was dismissed.
    scope: Contrasting fictional testimony; the separate published Three-Dimensional Memory power is not modified by these claims.
  game_information_boundary:
    printed_page: 60
    physical_pdf_page: 61
    related_record: rule.magic.sota64-adept-running-ways-p60
    interpretation: The formal Running Ways section describes ways as personal development guidelines; it does not specify a mandatory Spirit Way power purchase. Retain its optional Lost mechanics separately.
framing: newsroom_neutral
headline: 'Fictional Shadowrun Third Edition: Spirit Way Sight and commentary (FanPro25004, p43/PDF44)'
summary: 'Source-attributed path conditions and individual Masking and memory testimony, distinct from formal optional rules in Running Ways p60/PDF61 and published power rules.'
