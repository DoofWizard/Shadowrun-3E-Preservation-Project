  spirit_way:
    attribution: Elan, fictional in-world author and follower of the Spirit Way.
    sight: Elan describes every follower as possessing the ability to perceive the astral plane at will, and regards that ability as indispensable to pursuing the ideal of this path.
    physical_development: Elan says development of physical strength or health is not advocated or necessary for this way, unlike the Athlete or Warrior ways.
