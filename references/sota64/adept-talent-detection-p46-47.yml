data:
  publication: {title: 'State of the Art: 2064', publisher: FanPro, catalog_number: FanPro25004, edition: Shadowrun Third Edition, chapter: The Path of the Adept, section: The Athlete’s Way}
  xavier_exam:
    printed_page: 46
    physical_pdf_page: 47
    attribution: Sandi, fictional adept interviewee
    description: Tír Tairngire conducts extensive magical aptitude testing and uses its own version of the Dumas Test, the Xavier Exam.
    example: Sandi and Sam both report negative results during primary and secondary school despite later manifesting adept abilities.
  competing_explanations:
    printed_page: 47
    physical_pdf_page: 48
    mandrake: The Dumas Test is not perfectly accurate; some Talents go undetected. Mandrake suggests the twins were missed by the test.
    talon: Talon offers an alternative explanation. The Dumas Test and related tests were designed to detect active magical potential. In many adepts, Talent can remain dormant until their natural abilities are pushed to their limit and trigger its manifestation subconsciously. Talon describes this as more common among athlete adepts than other adepts.
  scope: These are in-world attributed observations and competing explanations, not an established test rating, numerical false-negative rate, universal awakening trigger, or new dice procedure.
framing: newsroom_neutral
headline: 'Fictional Shadowrun Third Edition: adept Talent detection conditions (FanPro25004, pp46-47/PDF47-48)'
summary: 'Xavier Exam identity, reported negative test results and the distinct attributed test-accuracy and dormant-Talent explanations.'
