content_class: [attributed_claim]
data:
  attribution: In-world article narrator Erwen, except the explicit comment by Silicon Mage.
  title_and_admission:
    printed_pages: [106, 107]
    ordinary_title: Awakened adherents generally gain the druid title and social precedence by virtue of their gift, with local variations; ordinary followers can be mundane or Awakened.
    high_circle_of_alba: The High Circle of Alba and several smaller British Isles groups hold that the druid caste should be limited to the magically gifted.
    hermetic_admission: Some Scottish and English circles admit hermetic druids conditional on adherence to the Celtic ethos.
    brittany: The Druidic Revival grants the title to both Awakened and mundane elders.
  ritual_participation:
    printed_page: 108
    leadership: In the Celtic rite the oldest druid leads regardless of rank.
    mundane_participation: Mundane followers sometimes participate as a sign of community ties; the passage does not confer magical ability.
    circle_affiliation: Most druids seek a circle even before initiation, not a universal prerequisite.
    wanderers: Some druids choose to remain outside circles; Silicon Mage states this is not limited to either branch.
    power_sites: The narrator describes ritual power sites as shared communal property of druids; new circles are almost always located at a conveniently situated power site, not invariably.
  scope_limit: These are attributed practices and institutional conditions, not new universal tests or numerical bonuses. Existing festival, conjuring and sensing mechanics remain in rule.magic.sota64-druids-p125-126.
framing: newsroom_neutral
headline: 'FanPro25004 State of the Art: 2064, SR3 fictional druid circle conditions, printed pp106–108/PDF107–109'
summary: 'Fictional druidic title and circle admission distinctions, ritual leadership and participation, affiliation and shared ritual-site conditions; no universal dice rule inferred.'
