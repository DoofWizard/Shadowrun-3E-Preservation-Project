headline: 'Fictional Link Clubs equipment and access — FanPro25004, pp138-139/PDF139-140'
summary: 'Source-local Shadowrun Third Edition interface conditions attributed to the original article and named fictional commentators, distinct from formal gear statistics or Matrix tests.'
data:
  section: Link Clubs
  article_author: Connie Connoisseur
  article_claims:
    venue_headset: 'The club offers a headset that receives wireless data from its Matrix node, uses a laser retinal display to overlay Matrix information in the wearer''s visual field, and includes earphones and microphone.'
    interclub_interaction: 'Linked venues use tridcam networks and holographic displays to let patrons interact with people in certain areas of other venues.'
    performance_channels: 'Performances from one club are simultaneously broadcast to others on different selectable channels.'
    virtual_access: 'The clubs connect to their own Matrix hosts; virtual visitors can transmit real-time icons and interact with physically present patrons.'
  named_commentary:
    - speaker: Glitch
      hardware_alternatives:
        direct_wireless: [headware radio, image link]
        rented_receiver: [datajack, image link, rented micro-sized wireless receiver]
      claim: 'The first configuration receives directly from the node; the second connects through the rented receiver.'
    - speaker: Neurosis
      claim: 'The sculpted hosts feature real-time trid of separate club rooms; virtual and physical attendees can interact.'
    - speaker: Glitch
      social_visibility: 'Users can display information they choose to make public and attach virtual notes visible to members of their customized peer network.'
  scope_limit: 'Venue-specific attributed interface capabilities and access conditions only. No general Matrix test, range, cost, rating or mandatory hardware beyond the described configurations is stated. Separate SOTA63 coffin club and sim-vironment rules are not replaced.'
