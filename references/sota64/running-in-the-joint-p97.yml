  temporary_setbacks: GM may keep prison-related character losses temporary rather
    than permanently remove augmentations or impair the character, unless permanent
    losses suit the group's preferred campaign.
  cyberware: Optional fictional prison deactivation rather than removal; later reactivation
    may form an adventure. No price, test or duration is specified.
  magic: Optional experimental fictional restraints or removable implants can suppress
    magical activity while allowing a magician to remain with the general prison population;
    no device statistics or mechanical resolution are given.
  starting_campaign: Characters may begin incarcerated with cyberware and magical
    abilities neutralized, or cyberware removed, and receive a fictional job offer
    in exchange for release.
  ongoing_campaign: GM may use corporate interest in skilled prisoners, or a player-driven
    prison escape storyline with a chance of success and subsequent consequences;
    no prescribed escape test or modifiers are supplied.
