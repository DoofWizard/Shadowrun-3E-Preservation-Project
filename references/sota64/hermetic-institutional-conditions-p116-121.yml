content_class: [attributed_claim]
data:
  actual_printed_pages: [116, 121]
  actual_pdf_pages: [117, 122]
  hermetic_druidism:
    attribution: In-world article narrator, printed p116.
    manifestation_names: [earth, sky, sea, lightning, fire]
    conventional_hermetic_elementals: [earth, air, water, fire]
    interpretation: Most in-world theorists regard the five names as distinctive manifestations of conventional elementals.
    affiliation: Membership in a New Druidic Movement inner circle, and therefore the movement, is nearly obligatory at Cambridge and Oxford.
    limitation: No elemental stat blocks or one-to-one mapping are provided; nearly obligatory does not mean compulsory in every case.
  christian_theurgy:
    attribution: In-world article narrator, printed p121; Magister separately reinforces the distinction.
    paradigm: Hermetic variant using Christian symbolism in place of pagan references.
    clerical_magicians: Churches require their own clerical magicians to follow theurgy.
    lay_believers: May follow or disregard their church guidelines; no universal requirement to adopt theurgy.
    german_catholics:
      attribution: Cain, in-world commentator, printed p121.
      exception_conditions: Magicians must belong to the clergy and practice theurgy exclusively for the reported exception to apply.
  limitation: Institutional and descriptive conditions within fictional Shadowrun; no new spellcasting test, conjuring statistics or universal initiation requirement is stated.
