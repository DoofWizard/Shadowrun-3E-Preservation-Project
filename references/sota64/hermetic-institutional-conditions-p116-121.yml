headline: 'FanPro25004 State of the Art: 2064, SR3 fictional hermetic conditions, pp116 and 121/PDF117 and 122'
summary: 'Source-specific fictional hermetic manifestations and near-mandatory university affiliation, clerical theurgy requirements, lay freedom and the separately attributed exception; no independent elemental statistics inferred.'
