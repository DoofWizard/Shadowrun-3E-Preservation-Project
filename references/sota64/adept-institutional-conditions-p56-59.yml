content_class: [attributed_claim]
data:
  scope: Named in-world organizational and venue conditions; not general adept prerequisites or resolution mechanics.
  conditions:
    jamil_islamyah:
      printed_page: 56
      attribution: Sayyid, in-world commentator
      class_group_size_minimum: 5
      class_group_size_maximum: 8
      leader: ulema
      composition: Includes both magicians and adepts.
      class_group_formation: Each new class forms a separate magical group.
      group_continuity: Groups rarely divide and generally undertake assignments together.
      teaching_return: Groups return to the monasteries as experienced teachers after losing too many companions; no numerical loss threshold is given.
      scope: Reported organization-specific class grouping, not a universal magical group size rule.
    sisters_of_eglantine:
      printed_page: 56
      attribution: In-world article narrator
      leadership: Exclusively adepts.
      volunteer_support: Nonmagical volunteers are recruited.
    alexa_group:
      printed_page: 57
      attribution: In-world article narrator
      award_eligibility: Scholarship and reward programs are restricted to adept students pursuing higher education.
      scope: Restriction concerns Alexa Group's sponsored awards, not membership in the rumored Songbirds group.
    nan_magical_institutes:
      printed_page: 58
      attribution: Siouxie Sue, in-world commentator
      scope: Several institutes, not all NAN institutions.
      teaching: Open access policy toward new advances; metamagic instruction incurs a high tutor fee rather than licensing the techniques.
      fee_amount: unspecified
    bellevue_grenadier_gallery:
      printed_page: 59
      attribution: Larissa, in-world commentator
      exhibit: Captive Auras by Lucas Albright
      admission: Gallery is reportedly attempting to charge astral visitors by warding the premises.
      status: Proposed or attempted, not confirmed operational.
      fee_amount: unspecified
  limitation: No additional dice tests, target numbers, fees, or universal restrictions are established by these passages.
framing: newsroom_neutral
headline: 'FanPro25004 State of the Art: 2064, SR3 fictional adept institutional conditions, pp56-59/PDF57-60'
summary: 'Named fictional organization-specific composition, award eligibility, tuition and proposed astral admission conditions, with the original scope and attribution retained.'
