content_class: [attributed_claim]
data:
  wiccan_coven:
    printed_page: 102
    attribution: Persephone, in-world author of the Wiccans subsection.
    customary_membership: Both Awakened and mundane adherents gather in covens and circles.
    customary_size_exclusive_upper_bound: 13
    scope: Traditional group size, not an enforced maximum for all magical groups.
  gardnerian_access:
    printed_page: 103
    attribution: In-world commentator Bookworm.
    hierarchy: Gardnerian covens have structured hierarchies; many secrets are restricted to initiates.
    hermetic_group_scope: In some countries, including Germany and the Czech Republic, covens also function as dedicated hermetic groups for Wiccan believers.
  dianic_coven_access:
    printed_page: 103
    attribution: In-world commentator Socio Pat.
    membership: Many Dianic covens admit only women, not all covens in the lineage.
    ritual_focus: Goddess; some radical groups exclude the God entirely.
  traditional_witch_apprenticeship:
    printed_page: 104
    attribution: Willow, in-world author of the Traditional Witchcraft subsection.
    customary_membership: In the European setting described, traditional witches are almost exclusively women; hereditary knowledge passes orally from witch to apprentice.
    rare_exception: Exceptions generally occur when no female heir is available and the line risks disappearing.
    scope: Described custom, not a universal gender restriction or additional character-creation rule.
  existing_rules: [rule.magic.sota64-neo-pagan-wicca-p122-124, rule.magic.sota64-traditional-witches-charms-p125]
framing: newsroom_neutral
headline: 'FanPro25004 State of the Art: 2064, SR3 fictional coven and apprenticeship conditions, printed pp102-104/PDF103-105'
summary: 'Source-attributed coven composition, customary size, initiatory access, lineage-specific membership and apprenticeship exceptions; no additional universal dice rule.'
