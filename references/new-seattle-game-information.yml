campaign_guidance:
  contacts:
    - "Named people throughout the source may be used as player-character contacts."
    - "Contacts should remain individualized people with their own lives, motives and attitudes rather than functioning only as information dispensers."
    - "Contacts can act as conduits for information, favors and adventure hooks; mishandling a contact relationship can affect a runner's reputation and wider contact network."
  government:
    - "Seattle campaign opportunities are framed at UCAS federal, metroplex and district-government levels."
  military:
    - "Military factions and jurisdictional rivalry can serve as employers, complications or investigation hooks."
  corporations:
    - "Corporate organizations and rivalries are presented as broad, reusable sources of jobs and conflicts beyond the specific corporations profiled in the book."
  syndicates:
    - "Organized-crime factions may employ runners against rivals or in internal disputes; the source points to Underworld Sourcebook and Mob War for deeper treatment."
  magical_groups:
    - "Magical groups can support long-running campaigns; player characters may join them or become involved in group rituals, rivalries and protection work."

