headline: 'Fictional tabletop RPG archive: Brainscan, FASA Corporation (2000), Shadowrun
  Third Edition, FASA7331/source.fasa-7331, printed pp37/physical PDF pp38 — Aftershock
  emergency response, contested blame, restoration and in-game stock outcome'
summary: Historical source-review record from the fictional Shadowrun SR3 campaign
  Brainscan (FASA Corporation, 2000, FASA7331/source.fasa-7331); printed pp37, physical
  PDF pp38. Scripted timeline and gamemaster guidance for fictional Seattle blackout
  aftermath; opposing in-world claims are not independently established; game economy
  scenario values kept exact.
data:
  section: Aftershock, printed p37/PDF38
  response:
    first_night: Lone Star has mobilized all available officers but is overwhelmed
      by alarm calls, traffic accidents, unrest and violence. Franklin Associates,
      DocWagon, CrashCart and emergency services cannot reach many scenes; some officers
      panic or use unnecessary force, while many attempt restraint.
    later: Governor Lindstrom calls up Metroplex Guard with Army elements in Joint
      Task Force Seattle; responders encounter disagreements over jurisdiction and
      command.
    after_24_hours: Army and Metroplex Guard declare a curfew after the power failure;
      anyone on streets after dark may be detained.
    after_48_hours: Electricity is restored to much of Seattle; lingering portions
      of Deus's viral programs cause localized brownouts for several weeks.
    longer_term: Campaign allows aftermath events to unfold for as much as one month
      after initial restoration, with broader social consequences.
  fictional_consequences: The source forecasts several hundred million nuyen of costs,
    dozens of people killed, hundreds more wounded, worsening racial relations and
    temporary suspension of the Renraku Arcology reclamation as troops are diverted.
  competing_attributed_claims:
  - speaker_group: Humanis Policlub advocates
    claim: They falsely/generalizingly blame Seattle's metahumans for the unrest and
      characterize them as uncontrolled.
    stance: prejudiced in-world propaganda; not narrator-established culpability
  - speaker_group: Metahuman activists
    claim: They attribute unrest to longstanding oppression by the human majority.
    stance: attributed in-world interpretation
  - speaker_group: Gaetronics and Shiawase Atomics
    claim: Each corporation accuses the other of fault, varying from negligence to
      sabotage.
    stance: mutually opposed attributed accusations, not source-proven cause
  gm_player_interpretation: If the fictional players bought Shiawase stock following
    Mr. Johnson's prediction in Light Meets Night, its value rises as Gaetronics struggles;
    the runners may be suspected but their contacts do not believe the accusation.
    The source says most observers in the setting will suspect Shiawase engineering
    despite the scenario's actual Deus-centered cause.
  stock_scenario:
    benchmark_peak_multiplier_of_original_value: 3
    gm_variation: The final rise depends on the campaign economy and could be higher
      than 3x.
    difficulty: Selling into the crisis is difficult because much of the Matrix is
      down. Brokers may refuse to buy, or may undercut as residents convert holdings
      to nuyen.
    reset_time: within one week of the shutdown after it becomes clear Shiawase cannot
      keep powering the city and Gaetronics returns on-line
    reset_value: original stock value
  content_category: Published fictional game scenario, not a real-world financial
    forecast or trading recommendation.
framing: newsroom_neutral
