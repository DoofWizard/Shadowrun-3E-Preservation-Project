  "data": {
    "chapter": "My Name Is Legion \u2014 Night Flight",
    "source_scope": "Original fictional Third Edition adventure timeline and gamemaster staging, FASA7331 Brainscan printed pp54-56/PDF55-57.",
    "timeline_as_suggested_by_gm": [
      "Runners are contacted by Toshi Akimura, meet him aboard his private Lear Platinum jet, and travel to New Orleans if not there already.",
      "They can perform legwork and meet a local decker for information on Olivia Marchand.",
      "Olivia Marchand and her grandmother Flora Rochambeau arrive aboard Cross Applied Technologies yacht on the Mississippi River.",
      "Runners arrange a proposed extraction while Overwatch deckers try to facilitate Marchand\u2019s escape; Flora insists on accompanying Olivia.",
      "The Seraphim pursue the runners, and Overwatch observes the team; after returning toward Seattle, Marchand experiences a loss of control when she summons a protective spirit."
    ],
    "source_narrator_vs_character_claims": "Akimura is an actual recruiter and intermediary for Deus, but knows only his own client chain; he suspects a Renraku executive seeks Cross Applied Technologies research, not Deus\u2019s true role or Marchand\u2019s mental condition. He does not knowingly describe the full scheme to the player characters.",
    "job_offer": "Toshi Akimura, a New Orleans fixer of considerable reputation, offers the fictional runners a paid extraction assignment involving Dr. Olivia Marchand, lead of Cross Applied Technologies Project Legion, while she is on a company yacht in New Orleans. He explains the project as a prototype distributed-decking interface and states that she is an important research scientist. The intended handoff and travel plan may depend on player acceptance.",
    "yacht_and_florida_context": "Marchand travels on a Cross Tech yacht from St. Louis down the Mississippi to New Orleans with grandmother Flora. Unlike the offer\u2019s apparent simplicity, Marchand experiences divided loyalties and her grandmother objects to separating the two.",
    "jet_presentation": "Akimura speaks to the runners in an upscale private jet; muscular guards lead them past a cargo compartment to an elegant meeting cabin with comfortable seating and a telecom setup. Akimura is a Eurasian man with neat dark-and-gray hair, close-fitting corporate clothing and a visible datajack. The runners may refuse; this opening is a GM scenario, not a completed event.",
    "source_scene_details": "After Akimura\u2019s message, a tabletop hologram portrays Dr. Marchand as a brown-skinned Creole woman with short dark hair, a white lab coat and a datajack. The source assigns her role in Project Legion. If the runners accept, the jet takes them to New Orleans.",
    "continuity": "The subsequent New Orleans section introduces Poison Lily, who had collected data for the intermediary\u2019s agents, and Remy Duchamps, who retained Lily\u2019s dataclip. Later revelations qualify Akimura\u2019s initial account rather than replacing it."
