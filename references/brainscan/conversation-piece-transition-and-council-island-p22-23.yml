  "data": {
    "section_heading": "Conversation Piece",
    "relationship_to_first": "After the substation run the characters contact Mr. Johnson/Steve Morris. He offers a more lucrative related job because the previous team failed; the GM may also use this as the transition when the first objective was not accomplished.",
    "in_world_story": "Morris says a different team botched a Council Island assignment and wants another team to complete it before sunrise. His narrative conceals his role in a larger planned blackout.",
    "pickup": "Morris supplies the fictional boathouse address 4529 S. Alaska St. at 54th for a staging meeting beside Lake Washington. The printed sign on the structure is Romaine Marina.",
    "target": "The fictional visiting Gaeatronics executive has an unguarded personal computer in bungalow 5 of Council Island Inn on the northwest side of Council Island. His identity is explicitly unimportant to the scenario.",
    "task": "Place the executable data file in the computer root directory and run it; the second file describes the hotel and room. Return to Morris after completion before the festival ends.",
    "previous_team": "The prior runners met resistance at the Council Island crossing; all were killed or taken into custody except their leader, decker Ace Gonriled, who escaped and contacted Morris.",
    "morris_on_failure": "Morris says the previously failed team was intercepted at a Council Island border checkpoint; Ace Gonriled alone escaped the island and returned to the Seattle sprawl. Morris advises that island border security may have intensified or completely closed the former entry point. The original narrator identifies Deus as the overarching fictional instigator.",
    "boat_reference": "The proposed transport is an Aztechnology Nightrunner; its statistics occur later, printed p26, and are not fabricated in this record.",
    "bodyguards": "Morris’s personal guards are temporary private-security hires who lack knowledge of the campaign plan. The book refers to the SR3 Street Samurai template, printed p76, rather than providing separate complete stats.",
