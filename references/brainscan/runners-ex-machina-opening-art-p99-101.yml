data:
  printed_p99_chapter_opening: The original chapter opener places the heading RUNNERS EX MACHINA
    on a large horizontal metal-looking nameplate above a central monitor. The monitor has luminous
    curved lines; peripheral monitors, exposed wiring and suspended components make it a technology-themed
    illustrated composition.
  printed_p101_full_page_art: An uncaptioned full-page monochrome illustration depicts a seated figure
    in long robes with dark eye lenses and arms folded before a bright, larger humanoid presence
    with outstretched arms or wings, in a chamber of twisting organic or mechanical forms framed
    by columns of binary-style glyphs. The visual is described rather than assigned unsupported character
    identities.
  archival_role: These are original FASA Corporation Brainscan printed campaign illustrations and
    should remain artwork references rather than independent evidence of specific fictional chronology,
    location or game mechanics.
