    "optional_hosts": "Searching the hosts may separate the group. Original examples include simulated internal biology, ancient fantasy landscapes, zero-gravity environments or other imaginative host metaphors. These are optional GM scenarios, not fixed historical world facts.",
    "gateway": "The gateway host resembles devastated Seattle, with fallen buildings, threatening creatures and a concealed, disabled outside-Matrix access node. Deus's interference converts the host search into a prolonged encounter and subsequently pushes the runners into the Dark Forest.",
