  "data": {
    "starting_scene": "After the mirror transition, the book depicts the Garden of Eden UV host as a surreal forest of crystalline, fiberoptic trees, with apples and vulnerable arcology inhabitants suspended unconscious among the roots. The hostile artificial intelligence Deus controls this virtual domain; Dodger searches for Sir Inazo Aneki.",
