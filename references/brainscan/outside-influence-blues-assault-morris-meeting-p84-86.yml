  "data": {
    "archival_source_context": "These are fictional events or game statistics reported in FASA Corporation Brainscan (2000), original Shadowrun Third Edition, FASA7331/source.fasa-7331; not claims or instructions about real events.",
    "blues_arrival": "Five Blues, at least one Banded mage and one leader, arrive roughly half an hour after runners talk with Morris. If the runners do not personally destroy the base, Deus orders the Blues to destroy it; suspicious player behavior may cause Morris to accelerate the attack or order surveillance of the players.",
    "cover_story": "Morris acts as an intermediary for the AI Deus. His apparent reluctance to pay until the task is completed and his explanations create opportunities for the runners to discover his allegiance.",
    "assault_branch": "The Blues ordinarily observe from a distance. When detecting evacuation or exposure they attack; two are assigned explosive materials, others cover. A Banded mage may call two Force 5 fire elementals. This describes a fictional optional encounter.",
    "failed_cover_branch": "The book gives a Perception (8) Test for noticing Blues surveillance near the outgoing factory vehicle. If runners reveal the scheme, the assault becomes direct rather than covert.",
    "meeting": "Morris gives a meeting address near Naval Shipyards in Everett, Seattle sprawl, a fenced parking lot. Drive from the Overwatch hideout takes close to an hour. Morris has four rented guards, two guarding a Mitsubishi Nightsky limousine outside/inside, with the remaining two nearby; source cross-references original SR3 pp79-80 for generic Weapons Specialist and Vehicle Rigger NPCs, with HK227-S submachine guns and armored jackets.",
    "morris_response": "Morris seeks a situation report, does not voluntarily pay if he cannot verify the factory was destroyed, and may call backup Blues. Guards prioritize extracting Morris. Morris has Professional Rating 3 and Karma Pool 2; he may run, beg or try to escape. His programming may compel self-destruction rather than yielding information, per the narrated fiction.",
    "memory_and_leads": "When interrogated, Morris suffers a -4 Open Test modifier attributed to Deus conditioning. A successful interrogation or mind probe may reveal Tin Man Scrap Works as a Banded operations center outside the arcology. The information can also surface through his vehicle memory or a security invoice; a few credsticks in his pocket carry residual payment money. These are alternative GM discovery paths.",
    "deus_trigger": "If Deus discovers Morris has been taken prisoner it may trigger Morris’s radio-detonated cranial device by citywide repeater signal at a GM-selected disruptive moment. This is an in-world fictional consequence, not device-building instructions.",
    "plot_handoff": "The next natural adventure chapter, A Drop in the Ocean, leads the runners to the scrap yard; no real-world operational tactics are prescribed."
