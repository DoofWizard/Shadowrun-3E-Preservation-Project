  "data": {
    "chapter": "My Name Is Legion \u2014 A Night in New Orleans",
    "setting": "An imagined twenty-first-century New Orleans where magic, Voodoo practice and Creole/Cajun influences coexist with corporate tourism; French Quarter and lakeshore scenes are part of the fictional source setting.",
    "narrator_established_story": "Poison Lily, a decker, gathered information on Cross Tech for Akimura\u2019s chain of intermediaries. The Seraphim agents tracked her; she was killed while escaping before Akimura could recover the data. Her boyfriend Remy Duchamps took Lily\u2019s dataclip; the Seraphim and Overwatch both seek him and the stolen records. The material is explicitly a fictional account of targeted killing, not factual allegations.",
    "remy_location": "Akimura identifies Remy and Lily\u2019s last known address: a dilapidated southern-gothic apartment building outside the French Quarter. He arranges a safe-house in a rundown lakeshore building.",
    "apartment": "Remy is absent. The bedroom window faces outside but is locked from inside; the apartment\u2019s drawers are emptied and furniture overturned, suggesting thorough ransacking. Dirty dishes, discarded containers, smoke and unsanitary smells are reported. Marguerite, an older Creole woman and property manager, dislikes Remy and Lily, calls them derogatory names, and could accept an in-game payment of approximately 100 nuyen to answer questions about visitors.",
    "seraphim_surveillance": "A Seraphim operative called Juliet Sienna observes from across the street using a laser microphone and cameras; she may follow runners without immediately harming them and could use the situation to gather additional faces. Her initial intention in this scene is surveillance and pursuit, not a confirmed attack.",
    "remy_search": "Possible fictional lead paths include questioning Remy\u2019s usual associates, obtaining credit-use data, magical tracking that respects the source\u2019s indoor limitations, and discovering BTL chips branded with the Brain Disco logo.",
    "brain_disco": "The source places Remy in the Brain Disco, a coffin-hotel/BTL parlor, after he sold Lily\u2019s datapayload to an unknown Matrix buyer (Overwatch\u2019s Dodger in narrator context, unknown to Remy). Remy retained Lily\u2019s physical chip, intended possible later resale, and is suffering from serious BTL dependence. The two proprietors are Stumpy and Bubba. During the proposed retrieval, Seraphim agents arrive and the GM can vary the intensity of the confrontation.",
    "contingencies": "If players fail to find Remy, the GM may have Akimura or another existing source contact supply his location. If the fictional pursuers become too strong, distracting events can provide an escape; the GM must not manufacture a mandatory massacre.",
    "art_provenance": "The original p58 image shows a stylized portrait of a disheveled figure; visual artwork, not independent factual evidence."
