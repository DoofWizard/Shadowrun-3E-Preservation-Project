data:
  intro: The chapter Aftermath follows the apparent defeat of Deus. The runners are
    dumped back into physical bodies and find themselves within an arcology still
    under crisis conditions.
  Renraku_cell: If the characters awaken on the 202nd floor, Sherman Huang, Vanessa
    Cliber, Cham and other Renraku loyalists seize the Mousetrap, do not intend to
    share credit, and present themselves as the heroes. Cliber’s group is described
    as willing to conceal involvement in Aneki’s death and kidnapping of a Renraku
    CEO.
  Aneki: The read-aloud text states Huang shoots Aneki’s corpse, and the group leaves
    Ronin’s body behind. This is an event in the scripted fictional scenario, not
    a real-world allegation.
  alternative_waking_site: Other runners may awaken in the zombie room, abandoned
    by other jacked-in victims, distressed by implanted cyberware and aware that captives
    elsewhere have begun to move.
  rescue_and_escape: Cliber’s group heads away with the Mousetrap, planning to contact
    Renraku and rendezvous with Red Samurai for extraction. Runners may seek the roof,
    ground-level exits, tunnels, pipes or escorted paths, or explore for records and
    equipment. The broader chaos makes pursuit difficult.
  ronin: Ronin remains connected and is initially uncertain why his body did not disconnect
    with the others; he may assist with arcology rescue efforts if the party remains.
  meta: The GM may allow alternative runner locations and story sequences. The book’s
    descriptions do not make these branching choices all simultaneously mandatory.
