data:
  underground_guard_encounter: The scenario has four weakened UCAS soldiers fleeing two Deus drone
    constructs toward the underground entrance. Drones are deliberately shepherding the soldiers
    to expose the tunnel. If the runners intervene, the drones may retreat through them; Deus wants
    Aneki captured and avoids unnecessary harm to him. About three minutes after fighting begins,
    an explosion seals the access tunnel.
  conditional_travel_encounters:
  - 'Chameleons: UCAS troops and Renraku Red Samurai exchange fire; participants may accuse the other
    side of masquerading as Banded, with the narrator leaving the truth conditional.'
  - 'Errant Children: children carry personal Doll drones and react variously to the runners. A Doll
    may accuse its child of distrusting the runners. Banded or spider drones may arrive if disturbances
    occur.'
  - 'Escapees: formerly captive residents argue, with conflict between groups. The runners can intervene
    without compromising their own mission.'
  - 'The Hunt: Blues and drones pursue one or two prisoners through offices. The encounter emphasizes
    avoiding exposure rather than prescribing attacks.'
  - 'The Trap: a floor collapses into a Deus testing-ground maze of suspended paths; the group must
    navigate it while hunted by constructs.'
  - 'The Morgue: body disposal near agricultural facilities, with a few ghouls present. The account
    is explicit that many deceased former captive residents are present.'
  - 'Blackout Zone: power, heat and ventilation are absent; hazards may include ghouls, oxygen-poor
    air, refugee victims from laboratories or altered civilians.'
  - 'Loose Critters: the AI’s seizure released animals and paranormal creatures from a zoo. Starving
    or displaced creatures may appear; source defers their statistics to the original Critters book.'
  resistance_followup: At level 199, the team meets Devon Eurich, Kiell Rauglos and four fighters,
    gets surveillance-free shelter, and can learn about the Whites and Cliber’s disputed motivations.
  gm_escalation_and_failure: Gamemaster options include extra magical barriers, security patrols,
    military attacks arriving earlier than expected or encounters adjusted for serious injuries.
    Keeping Aneki alive is explicitly important to the intended endgame, and the narrator allows
    extra medical facilities rather than mandatory failure.
