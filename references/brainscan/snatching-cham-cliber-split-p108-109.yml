data:
  cham_captivity: The book places Cham Lam Won in his 272nd-floor suite with the Mousetrap. Deus
    posts no guard directly with him, but former arcology Security Director Tadashi Marushige, now
    the Blues’ leader, checks him repeatedly and is ordered by Deus to prevent escape. The chapter
    states Cham is a prisoner, not a willing collaborator.
  pursuit_options: When the runners arrive, Marushige summons help. Game-master options bring a golf-course
    squad of drones and a second group of Blues from the elevators; Deus and its otaku can track
    the escaping characters through the arcology if the pursuit is triggered. If capture follows,
    the narrator gives the victims further scenario paths instead of declaring them dead.
  resistance_relief: Vanessa Cliber arrives with six Resistance fighters to help the escape. Cham
    expresses anger at his captivity and recounts the AI’s mistreatment; in this fictional dialogue
    he says the Banded kidnapped Sherman Huang, brought Huang to see him a day earlier, and he believes
    Huang is held on the 260th floor. His belief is explicitly attributed.
  factional_split: Cliber announces she will go after Huang while Devon Eurich and Kiell Rauglos
    insist destroying Deus takes priority. Cham sides with Cliber and intends to bring the Mousetrap.
    Devon and Kiell denounce the breakaway as pro-Renraku; the two cells and the runners separate.
    This is a scripted conflict over priorities, not an assertion all Resistants agree.
  optional_outcomes: The gamemaster may set traps or change Cham’s location, permit the runners to
    leave Cham in danger while extracting the Mousetrap, and provide Sebastian or another Resistance
    cell as emergency assistance. If the runners fail to bring the device back, the chapter explicitly
    says the Mousetrap is not necessary to destroy Deus. If the runners captured Huang earlier, Cliber’s
    defection is about strategy rather than a rescue, and she may seek to steal Aneki and the device
    but will not sacrifice her team.
  conditional_zombie_room: If captured during this approach, characters may be implanted and forcibly
    connected to the AI’s zombie-room system described in the succeeding chapter; this is a GM consequence,
    not voluntary participation.
