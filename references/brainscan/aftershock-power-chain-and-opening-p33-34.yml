summary: Historical source-review record from the fictional Shadowrun SR3 campaign
  Brainscan (FASA Corporation, 2000, FASA7331/source.fasa-7331); printed pp33-34,
  physical PDF pp34-35. Source-described fixed consequences of the previous fictional
  mission, illustrated opening scene, and optional crisis encounter framework; historical
  published campaign, not real infrastructure guidance.
data:
  section: Aftershock
  source_world_time: Following the completion of Light Meets Night; the evening or
    following night depending on the fictional party's schedule.
  plot_sequence:
  - order: 1
    event: In the fiction, the Gaetronics executive staying at Council Island Inn
      sends a staff message to the firm's main office and unknowingly launches Deus's
      first trace program.
  - order: 2
    event: The program traverses the Gaetronics Matrix environment and broadcasts
      a coded signal; when the Tacoma power substation connects for its periodic fictional
      data exchange, the other program combines with that signal and deletes itself
      and selected files, including its normal load-monitoring/overload-alert functions.
  - order: 3
    event: The substation begins drawing unsustainable power, causing protective shutdowns
      in other substations; Redmond's Shiawase Atomics plant initially feeds the grid
      but later overloads remaining stations.
  - order: 4
    event: Campaign setting specifies Seattle entering approximately forty-eight hours
      of widespread darkness, with extended social consequences.
  player_information: The source directs the GM to narrate evening streetlights and
    signage going out progressively, stalled vehicles and crowds, with only isolated
    corporate generators remaining visible; characters may come to realize this follows
    their mission.
  gm_guidance: Use or improvise crisis encounters based on the particular player-character
    histories and decisions; distinguish scripted blackout causation from optional
    incidents.
  pages:
    introduction_and_cause: 33/PDF34
    city_darkening_scene: 34/PDF35
