data:
  combat_circumstances: The two AIs fight while an animated forest, branches, vines,
    otaku, and IC constructs threaten player characters; fire set in the forest may
    spread, but the book describes the flames as a virus-like host erasure utility,
    not ordinary equipment.
  deus_options:
  - Alter localized gravity, including reversed direction or increased gravity.
  - Equip a tree with extreme water jets capable of putting out fires or disrupting
    characters.
  - Replace crawling insects with larger or multiplied hostile IC constructs.
  - Teleport one of Pax’s Whites behind or alongside a runner.
  - Create local traps, net traps, pits, or spike-like hazards in host terrain.
  - Conceal one or more runners within an opaque field of darkness, potentially followed
    by a see-through bubble.
  - Generate an IC construct that mimics a particular runner’s greatest fear.
  - Constrain a moving runner so that progress becomes impossible.
  - Cancel one of Megaera’s interventions.
  megaera_options:
  - Grant butterfly-like wings to one or more runners.
  - Turn a tree or vine segment against an otaku or IC construct.
  - Grant a runner a fictional fireball attack; numeric Damage Code is preserved separately
    in the rule_exact record.
  - Convert part of the forest into another self-contained environment such as swamp
    or fortified settlement.
  - Create multiple versions of a runner who can act for a temporary interval; numeric
    duration and injury alternatives are captured in the rule_exact record.
  - Bring a local weather storm of wind, freezing precipitation or hail that can move
    through the combat scene.
  - Restore a wounded or dying runner through surreal host regeneration.
  - Supply futuristic weapons, armor or other gear within the host.
  - Cancel or reverse one of Deus’s interventions.
  discretion: The book encourages dramatic twists appropriate to the group, but preserving
    its conditional language prevents treating these examples as mandatory events.
