data:
  original_subsections:
  - Conversation Piece
  - Sleaze Factor
  job_sequence: After reporting the first job to Morris, the player characters may
    agree to finish the compromised second job. Morris does not send the payload remotely;
    instead the runners receive one optical dataclip with two files at Romaine Marina
    boathouse, 4529 S. Alaska Street at 54th Street.
  fictional_second_job: The new objective is to enter Bungalow 5 at Council Island
    Inn while its Gaeatronics executive guest is absent at the Qatwas Festival and
    install a second file to the suite personal computer root directory. The files
    must be in place before sunrise. The first file is the payload; the second contains
    address and hotel information.
  earlier_team: A crew led by orc decker Ace Gonriled had been stopped at the Council
    Island checkpoint, panicked and fired; other members were captured or killed.
    Ace survived. He believes that the new runners may interfere with his chance to
    finish the assignment. Morris incorrectly assumes Ace left Council Island.
  Morris_agency_and_attribution: Morris calls his superior in the Deus-controlled
    organization but the player characters are likely to infer a Shiawase contact.
    His hired bodyguards are freelance and have no knowledge of his employer or Deus;
    use historic Shadowrun Companion p76 Street Samurai character statistics if needed.
  Council_Island_setting: The island is a Salish-Shidhe diplomatic jurisdiction rather
    than UCAS territory. Qatwas Festival lasts from sunset to sunrise. Heavy checkpoint
    scrutiny follows the earlier team firefight; most celebrants crowd the northeastern
    end, leaving the Council Island Inn shoreline quieter.
  original_map:
    printed_page: 24
    physical_pdf_page: 25
    subject: Council Island Inn map
    specific_symbols: Marked target bungalow X, piers/marina, beaches, restaurant,
      main hotel building, pool, parking, trails, driveway from I-90; the source artwork
      is not a claim about a real building.
  optional_gm_continuity: If the second job is declined, the gamemaster may run the
    later Aftershock campaign outcome anyway using other fictional runners; no second
    job completion is falsely claimed.
