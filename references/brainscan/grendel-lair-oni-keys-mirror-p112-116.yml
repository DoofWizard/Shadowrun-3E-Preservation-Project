    "topic": "Grendel's Lair, coerced oni villagers, keys and scenario passage into Garden of Eden",
    "setting": "In the original fictional campaign, runners encounter an ultraviolet Matrix host styled as a Japanese-medieval fantasy keep; Grendel is an IC-like guardian. Ronin and Aneki accompany the relevant virtual scenes.",
    "direct_matrix_alternative": "If the team attempts direct Matrix access, the GM uses SCIRE security descriptions and sheaf in Renraku Arcology: Shutdown pp78-79. Captured characters may be connected through involuntary datajacks or a less-invasive electrode alternative already described in prior pages; not elective surgery.",
    "red_oni": "Red oni force kidnapped virtual prisoners, described as real arcology residents trapped by Deus, into menial computing chores and other labor. They worship Aneki as a returning god-king and consider Ronin a traitor. The chieftain carries the blue key.",
    "blue_oni": "Blue oni coerce captive villagers into manipulative performances and abuse them. Their chieftain carries the red key; their attitudes toward Ronin and Aneki are the reverse of the red oni.",
    "victim_status": "The book identifies villagers as captive, exhausted and robbed of autonomy, not consensual employees. Fictional acts belong to the scenario, not real-world reporting.",
    "ways_to_play": "Optional GM branches include acquiring the keys through negotiation, stealth, hostage trade or conflict; alternatives may encourage rescuing prisoners and giving them agency.",
    "inner_tower": "The inner tower becomes organic and unsettling; victims are trapped in walls and the chamber contains a mirror. The narrator describes Grendel consuming Aneki and Ronin in the UV realm while ignoring the runners; it returns through the mirror.",
    "mirror_and_exit": "Player characters may pass through the fluid mirror into the Garden of Eden host. The GM can alternatively have captured party characters appear as peasant prisoners if necessary for inclusion.",
