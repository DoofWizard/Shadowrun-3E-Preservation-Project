  "summary": "Historical fictional tabletop-RPG source review of FASA's Brainscan (2000), source.fasa-7331, printed pp66-68/PDF pp67-69: Deus Banded handover, possession contingency, optional rescuers, aftermath and consequence branches.",
  "data": {
    "source_context": "All characters, organizations, locations and events below are fictional scenarios in FASA Brainscan original Shadowrun Third Edition. The text describes gamemaster options rather than real-world tactics or inevitable outcomes.",
    "chapter": "My Name Is Legion; The Exchange; Picking Up the Pieces",
    "optional_early_exit": "If characters' situation endangers Marchand or themselves before the handover, Toshi Akimura can call the player characters with an 'all clear' and a possible return to Seattle. Flora Rochambeau may use her own magical abilities covertly to help herself and granddaughter escape. These are optional GM interventions.",
    "scene_setup": "The runners arrive with the unwillingly detained Dr Olivia Marchand at 4126 Oak Street in the fictional Redmond Barrens and meet five of Deus's Banded: four Blues and one Green. The Green speaks; an unseen Akimura communicates by cellphone about payment arrangements. The meeting may occur immediately or later if the team arrives during daytime.",
    "banded_interaction": "Blue members have blue eyes but the Green's eyes are not green. The Banded congratulate the team for bringing Marchand, can transfer the agreed money at the runners' selected location, and offer prospects of subsequent work.",
    "involuntary_persona_and_possession": "Marchand's fear causes the Legion persona to lose control and the childlike Charlie persona to surface. Flora calls upon a Force 6 great spirit of Ogoun to protect her granddaughter; the spirit becomes twisted by Marchand's distress into an uncontrollable, dangerous loa possession. The possession does not imply Marchand has consented.",
    "fight_and_rescue_options": "The spirit-possessed Marchand first attacks the Banded, then threatens the runners. Player characters can fight or attempt banishment. Optional Seraphim working for Olivia, Overwatch working for Sisi, or rival Renraku operatives may arrive. Their motivations differ, and their intervention is never compulsory.",
    "scenario_debugging": "If the runners refuse the handover, the fictional Banded may attack and Flora can summon Ogoun to protect Marchand. Other GM variants include Flora's astral arrival or the manifestation of Olivia's latent magical ability.",
    "aftermath": "The published branching ending leaves the Banded dead, Deus aware of the events, and Marchand either dead or comatose in that specific path. If Flora lives, she seeks to bring her granddaughter's body home to New Orleans and may resent the characters. If Marchand survives, she may someday regain consciousness, though her mental state is uncertain. Akimura may commend the runners while saying the tragic outcome was not their fault. Overwatch may recognize their unwitting role, and surviving Seraphim Gabriel may hunt for who hired them.",
    "agency_and_certainty": "Akimura's statements are attributed to the fictional intermediary; optional rescues are GM scenarios, not canon outcomes; the handover and supernatural possession are coercive/involuntary, not Marchand's freely chosen actions."
  },
