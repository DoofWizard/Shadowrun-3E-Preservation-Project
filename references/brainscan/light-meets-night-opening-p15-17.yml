  "headline": "Fictional Shadowrun SR3 Brainscan (FASA Corporation 2000, FASA7331), printed pp15–17/PDF16–18: Light Meets Night setup",
  "summary": "Original FASA Shadowrun Third Edition Brainscan (source.fasa-7331) first adventure premise and opening scene from printed pp15–17/PDF16–18, separated into gamemaster-only background, planned fiction, optional play advice and an illustration.",
  "data": {
    "adventure_title": "Light Meets Night",
    "preparing_to_play": "The adventure tests stealth, discretion and trust; the book explicitly frames it as two linked covert jobs, with additional pay offered when they are completed quietly on the same night.",
    "first_job": "The runners are hired to place an apparently harmless monitoring program in a Gaeatronics power substation in eastern Tacoma. Their intermediary is Steve Morris, a Renraku employee posing as a Shiawase employee. The runners are told to avoid detection and report completion by midnight.",
    "second_job": "Morris later asks them to take over a separate job involving a Gaeatronics executive's Council Island Inn suite, because another team attempted the assignment and suffered losses at a Council Island security checkpoint.",
    "named_other_team_leader": "Ace Gonriled, who survives the failed earlier attempt and seeks to continue it.",
    "setting_and_festival": "Council Island is depicted as crowded for the Qatwas Festival, with additional visitors and heightened security.",
    "gamemaster_secret": "The source explicitly reveals Morris does not consciously know his orders are coming from Deus. He had been a familiar intermediary before being converted into a near-perfect Green Banded servant; specific audible/textual command codes make him comply, while he believes he is acting normally.",
    "story_consequences": "The two pieces of malicious program are harmless separately but, if combined, could cause the Seattle grid to go dark for forty-eight hours with subsequent sporadic outages. Deus's described intention is to distract UCAS forces from the arcology, induce disorder in Seattle, and buy time. This is only the fictional campaign premise, not usable computer-system instructions.",
    "opening_gamemaster_scene": "The runners meet a fixer called Dixie at the Palace of China in Tacoma before a 5 p.m. meeting with the self-styled Mr. Johnson (Steve Morris). The beginning of the read-aloud negotiation appears in the original published scenario. Subsequent mechanics and player actions on printed p18 and later are outside this record.",
    "important_attribution": "The characters initially believe the job is an ordinary paid job. Deus's involvement and Morris's altered agency are hidden from player characters and are explicitly privileged narrator/gamemaster knowledge.",
