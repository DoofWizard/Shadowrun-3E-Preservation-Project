    "characters": {
      "Huggins": "A desperate, exhausted low-level corporate technician with BTL dependence, fearful for his life and hiding his part in the theft. Under questioning he may disclose that Monty commissioned the original extraction; he fears retaliation and wants the device returned so he can be paid.",
