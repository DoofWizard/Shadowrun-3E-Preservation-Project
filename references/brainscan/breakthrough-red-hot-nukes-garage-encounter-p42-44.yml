    "branches": {
      "approach": "Player characters can negotiate with the Red Hot Nukes, attempt a stealthy approach subject to Perception and possible astral detection, or choose a confrontation; none is compulsory.",
      "suspicion": "If Grinder learns the runners seek a valuable technological item, the GM may make him demand access to it, a toll, disarmament of an in-game mine, or another demonstration. These are optional complications, not fixed events.",
      "combat": "The GM may introduce a confrontation with the Stilettos inside the garage or a clash between the rival gangs if the encounter escalates.",
      "inside_garage": "The second floor has a makeshift gang lounge. The third floor contains rubble and the body of Regis P. Doss; Huggins searches unsuccessfully for the missing SENSE device.",
