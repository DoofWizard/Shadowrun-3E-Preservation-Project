  "data": {
    "publication_context": "All details concern fictional Shadowrun Third Edition game events in Brainscan (2000). The mission is an optional tabletop encounter, not real-world instructions.",
    "earlier_pressure_options_p80": "If the party declines Overwatch, the GM may portray Overwatch calling in favors from Seattle contacts or targeting the runners with in-world hacker harassment. The source explicitly describes examples ranging from unexplained phone charges, slashed credit ratings and repossessed vehicles to falsified warrants, forged death certificates, or fake military enlistment; the source presents these as coercive acts by the fictional organization, not voluntary cooperation by the runners.",
    "scene_setup_p80": "The Line introduces the in-game encounter on Interstate 5: a three-vehicle military escort traveling toward Fort Lewis. The first scenario text portrays separate accidents involving three civilian vehicles that halt and block both traffic lanes. The runners can encounter the motorcade afterward. The game location is placed near Tacoma to give a fictional escape route, and the source does not specify guaranteed player success.",
    "escort_composition_p80": "The book establishes a single Ares Citymaster protected by two Ford Sentinel military-edition cars. The Ford Sentinels each have three soldiers as passengers plus a driver, with two of the soldiers in each car cybered; one soldier in the rear car is an army mage. The Citymaster is driven by a military rigger and carries two soldiers, two medics and eight rescued children, one of whom is the White Deus wants.",
    "encounter_responses_p80": "The lead Sentinel initially attempts to bypass the traffic blockage; if that fails, the convoy may reverse. Soldiers remain in the Sentinels and fire from the vehicles where practical, but leave if a vehicle is disabled or the Citymaster trapped. They may confront player characters on foot. A turret-mounted weapon with gel rounds protects the Citymaster; access doors are armored and locked. These are authored in-world choices for GM adjudication, not predictions of player tactics.",
    "reinforcement_and_escape_p81": "If attacked, the game convoy calls for help; Overwatch may interfere with communications, but civilian witnesses can also alert local authorities. In the scenario Lone Star and UCAS military responders may arrive; the text specifically names two Northrup Yellowjacket aircraft. The GM decides response timing. Overwatch warns via vehicle horn; a party that escapes may move through nearby fictional backstreets and contact Overwatch.",
    "children_status_p82": "The eight rescued children are sedated; several are bandaged and wounded, at least two have amputated limbs and disfiguring implants, and two have serious brain damage. All have datajacks, and the source says they sleep through the firefight. These injuries and sedation are involuntary conditions, not a claim they chose to participate.",
    "child_identity_and_parentage_p82": "The White is a thirteen-year-old boy lacking the outward tattoos and cybereyes normally associated with Banded. He is a recent conversion, has limited knowledge of Deus plans and was told by Deus that Renraku employees who were his parents remain in the Arcology, although the GM text says they were killed there. Do not infer that the boy knows the truth.",
    "optional_difficulty_and_outcomes_p82": "GM difficulty options include military escorts with additional defenses, unrelated civilians disrupting escape, a possible injured White, and an alternate unarmored Roadmaster if the Citymaster is too strong. If all children are extracted, Overwatch recommends leaving the others at a hospital near Fort Lewis; if the White dies, Ronin wants his body examined for implants, and Deus may still track it.",
    "handoff": "The next natural scene, The Sinker, begins later on printed p82 as the White is taken to the Overwatch hideout; record only the transition here, reserving its full source review for the next slice."
  },
