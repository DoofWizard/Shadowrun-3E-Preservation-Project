    "scene": "Blast from the Past / What's Up, Chummer? Steve Morris calls as a returning Mr Johnson after the earlier Palace of China meeting. He requests a team to strike a hidden research installation. Returning to the same restaurant meeting is a deliberate continuity cue.",
