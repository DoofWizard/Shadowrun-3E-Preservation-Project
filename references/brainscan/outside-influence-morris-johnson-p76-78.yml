    "false_person_of_interest": "If pressed, Morris supplies a chip picturing fictional Dr Evan Kincaid, a doctorate-holding researcher with interests in genetics, pediatrics and parabiology, formerly at Universal Omnitech through 2055, described in the source as working for Shiawase. His work on the fictional human-metahuman vampiric virus and children provides a plausible but false diversion; he is not the actual target of Morris's assignment.",
