data:
  fictional_awaiting_team: After the Hong Kong events, Overwatch’s supplied credentials facilitate
    transit; a youth associated with Overwatch receives the runners in Bellevue and escorts them
    to a relatively luxurious red-brick headquarters. The book depicts Ronin and Dodger joining a
    cluster of young otaku and introducing the final mission.
  in_world_ronin_briefing: Ronin says the team must get Aneki into the arcology and physically connected
    to an AEP host to deliver Deus’s kill codes. Overwatch claims Resistance contacts inside can
    find an access route; with Aneki’s mental state uncertain, reaching his cooperation is difficult.
    Ronin says UCAS military action against the facility’s reactor level could start within days,
    leaving limited time.
  access_routes_and_tradeoffs: The briefing favors the Ork Underground route to the arcology parking
    structure rather than attacking barricades or using a risky stealth approach from a nearby skyscraper.
    The text permits the runners to propose alternative methods and asks the gamemaster to treat
    credible plans seriously.
  optional_hooks: This planning interval is for player-character preparation, necessary gear, and
    relationships with Overwatch’s youth. The narrator says some youths look to the runners as possible
    heroes, while others will remain skeptical. Ronin is committed to organizing the operation and
    Dodger may retreat from duties to meet Megera.
  conditional_pursuit: The narrator recommends a developing Renraku search for Aneki and Huang, beginning
    with magical tracking and moving to contacts and bounty hunters if identities are discovered.
    Contacts may warn they are being watched and refuse to meet. Banded operatives may also arrive
    to seize Aneki, should the game develop that way.
  optional_refusal_outcomes: The gamemaster may permit reluctance or refusal by the runners. Ronin
    and Dodger attempt persuasion, then Overwatch may recruit substitutes; Renraku might recapture
    Aneki/Huang, or Banded might abduct them. Aneki is characterized as intermittently lucid rather
    than uniformly capable of self-directed planning; a suggested Control Thoughts spell is an optional
    GM device, not a compulsory action.
