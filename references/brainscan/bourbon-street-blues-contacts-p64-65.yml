    "chapter": "My Name Is Legion \u2014 Bourbon Street Blues",
    "scenario": "After the Queen of Babylon encounter, player characters try to leave New Orleans with Dr Marchand and her grandmother if Flora comes. They discover their local contacts unavailable and must arrange a route toward Seattle. The source stresses the characters\u2019 obligations to Marchand and Flora, and the risk of pursuit.",
    "akimura_conditional_offer": {
      "speaker": "Toshi Akimura, an intermediary, speaking over the phone after the runners call.",
      "admission": "He says he has lost Seraphim contacts, that they are tracking his agents, and that a direct meeting would endanger both parties.",
      "payment": "He offers half of the agreed pay immediately, with the remainder when the team reaches Seattle; he also supplies information on alternative contacts. This is a quoted fictional character offer, not proof payment has already occurred."
    },
    "contact_options": {
      "mafia": "Akimura can suggest New Orleans Mafia connections including fictional Sergeant Crew at the NOPS station on Loyola Avenue; characters might be directed to ask for Sergeant Crew. These contacts can propose later New Orleans jobs, such as gambling, vice or contraband-themed tabletop adventures.",
      "university": "Alternatively he directs them to the Tulane University Bookstore to ask for Clara, specifying graduate-level economics books and a prearranged credential exchange. This is fictional intrigue, not real-world advice.",
      "other_contacts": "The text also mentions the Draco Foundation, Creole communities, Caribbean telesma networks, corporations and local governments as sources of roleplaying hooks; no single faction has to rescue the party.",
      "smugglers": "An optional Caribbean-area adventure path involves a fictional crew transporting contraband goods and meeting a rival ship; see Target: Smuggler Havens. Not required in the Brainscan narrative."
    },
    "missing_grandmother_contingency": "If Flora dies or the runners refuse to bring her, she can remain an important factor in Marchand\u2019s fate under GM choices. The book allows a supernatural return/loas concept as optional fiction; it does not establish that a real person returned as a spirit.",
    "risk_and_agency": "Akimura explicitly warns the runners not to bring attention to themselves; Marchand may experience involuntary persona changes under stress. The group\u2019s fate depends on player action."
