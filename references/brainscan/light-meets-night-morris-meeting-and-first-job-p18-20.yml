  separately.'
data:
  adventure: Light Meets Night
  fictional_roles:
    Steve Morris: Unaware Renraku employee acting under programming imposed by the
      artificial intelligence Deus; represents himself to the player characters as
      a Shiawase agent and an ordinary Mr. Johnson.
    Dixie: Fixer who introduces the player characters to the job.
    Deus: Gamemaster-known source of the altered agent’s orders, not known to the
      runners or to Morris consciously.
  meeting: Palace of China, Tacoma, with a 5 p.m. appointment; an optical dataclip
    holds a text file and utility program. The book requires physically reaching the
    Gaeatronics substation computer, installing a file in its Power Monitoring subsystem,
    and reporting without leaving evidence by midnight; it explicitly says the system
    is not on the Matrix.
  morris_truth_and_deception: The only deception found by Analyze Truth is Morris
    allowing the team to believe he works for Shiawase. He truthfully refuses to identify
    his employer when directly pressed. He consciously lacks memories of his time
    in the Renraku arcology because those were erased, though nightmares may restore
    fragments.
  mind_probe_consent_and_conditions: The book says Morris becomes aware of a mind
    probe, asks the caster politely to stop, and abandons the meeting if subjected
    to persistent probing. Under a separate GM-only contingency, if Morris genuinely
    concludes his secret Deus control has been compromised, the conditioned character
    may shoot himself and end this adventure; this is a fictional non-player-character
    consequence, not player advice.
  location_and_scene: The Tacoma substation lies east of Highway 18 in a working-class
    area near a Little League baseball field. The facility appears largely empty;
    a Gaeatronics technician visits about half an hour daily. Approximately 75 spectators
    including an off-duty Lone Star officer attend the game, which ends around 11:30
    p.m. An eight-year-old child Tommy may arrive to retrieve a foul baseball; he
    reports overtly threatening people to the game.
  choice_and_continuity: Players may decline the job. The text states other fictional
    runners then fill in and the subsequent Aftershock blackout still occurs; the
    overall Brainscan campaign can continue. Optional pre-substation interruptions
    are suggestions, not mandatory events.
  physical_site_map:
    printed_page: 20
    pdf_page: 21
    visible_map_elements:
    - Baseball field immediately beside fence
    - single maglock gate and reader
    - perimeter fence and cameras
    - single small building with desk and two control panels
    - six converter-group symbols with three parallel pairs
    meaning: Original published floorplan as a visual reference, not an engineering
      diagram.
