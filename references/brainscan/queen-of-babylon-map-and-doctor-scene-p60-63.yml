    "illustration": "Original p62 Queen of Babylon map includes side profile, upper/lower deck outlines, numbered cabins, and key indicating doors, gun ports, stairs, windows and sliding doors. Map is illustrative game geometry, not evidence of an existing ship.",
    "scenario_choice": "The GM provides several fictional approach possibilities: by small boat, from beneath the water with appropriate game abilities/equipment, via air under fictional concealment spells, or by deception/skills. A game boat supplied by Akimura has a price of 90 percent of its Seattle value, subject to ordinary Negotiation rules. Boat, air and water approaches require play adjudication and exact aquatic/aircraft rules reside in Cannon Companion. Open Stealth Tests apply when characters climb on the yacht deck in one option.",
    "source_plot": "Overwatch may dispatch deckers and hired mercenaries who compromise the fictional yacht\u2019s autopilot and take it to a nearby cove. Their target is Marchand; they may disable crew and supply fake documentation to depart. This is a possible prepared adventure sequence, not a verified historical incident or real-world instruction.",
