headline: 'Fictional tabletop RPG archive: Brainscan, FASA Corporation (2000), Shadowrun
  Third Edition, FASA7331/source.fasa-7331, printed pp34-36/physical PDF pp35-37 —
  Aftershock optional blackout incidents and consequences'
summary: Historical source-review record from the fictional Shadowrun SR3 campaign
  Brainscan (FASA Corporation, 2000, FASA7331/source.fasa-7331); printed pp34-36,
  physical PDF pp35-37. Gamemaster scenario hooks, not mandatory chronology. Characters
  may choose how to respond to transport disruption, vulnerability, community harm
  and social unrest.
data:
  chapter: Aftershock
  general_guidance:
  - The campaign emphasizes that game character actions have consequences, potentially
    reaching player-character homes, associates and family.
  - Electric vehicles dependent on GridLink can stop in traffic while battery-operated
    vehicles may reach home; downtown monorail halts, trapping passengers several
    stories above ground.
  - Most residential and business backup generators cannot maintain normal operation;
    many alarms are configured to shut off when main power disappears.
  - Blackout responses differ between neighborhoods; vulnerable poorer 'Z-Zone' communities
    suffer disproportionate losses from lack of power and opportunistic crime, while
    corporations and residents may react with force or mutual protection.
  optional_encounters:
  - page: 34
    title: Hanging by a thread
    description: At a stranded monorail, a frightened teenager is exposed to a fatal
      fall when escaping commuters pry open a door; characters may intervene, and
      rescuing her can produce a contact through her family.
  - page: 34
    title: Damsel in distress
    description: A mother with five children is trapped at an intersection while six
      racist attackers threaten her; the players may intervene. The source presents
      the threat as coercive and not a voluntary interaction.
  - page: 36
    title: Rock and a hard place
    description: Characters encounter go-gangers' illegal game using property from
      a small repair shop while its owner prepares armed resistance; the setup could
      escalate into a firefight.
  - page: 36
    title: It's just an olive oil business, chummer
    description: Variant of the preceding hook in which the targeted storefront is
      an organized-crime front; the players can be trapped between crowds and armed
      organized-crime personnel.
  - page: 36
    title: Look out below!
    description: Outside a corporate building whose alarm is sounding uncontrollably,
      a vehicle blocks access; a frightened guard dog leaps or falls from an upper
      window, creating a danger for nearby characters.
  - page: 36
    title: The cupboards are bare
    description: Player-character homes may be looted, including computers and credentials;
      this can be a modest security problem or a larger personal-data consequence
      in the fictional story.
  agency: These are optional GM hooks; source does not establish that any happen to
    every party.
