data:
  chapter: Return of the Father / High Noon in Wan Chai. Overwatch requests the runners
    travel to Hong Kong to recover Inazo Aneki after Hiroshi’s information is recovered;
    Ronin and Dodger represent Overwatch.
  in_world_situation: Aneki is recovering following psychic reconstruction undertaken
    in Tibet and is accompanied by two Grade 4 Buddhist monk adepts. The rendezvous
    is a garden shrine behind Madame Kim’s simsense parlor in Wan Chai. Renraku is
    attempting the same recovery, and Deus’s Banded interfere; Sherman Huang of Renraku
    becomes a competing interested party.
  timing: The runners are told they have less than twenty minutes before a Renraku
    pickup. Overwatch supplies cover identities, permits and transport as a Yamatetsu
    security-detail pretext, plus remote and Matrix support. The emergency outbound
    vehicle is a private semiballistic aircraft returning to Seattle.
  optional_play: The GM may have the runners arrive first, intercept Huang and Aneki
    as they depart, or encounter two opposing teams. The book allows deception or
    force as distinct fictional game choices; player choice and the differing groups’
    agency must not be collapsed.
  setting: Madame Kim’s business has about 30 locked simsense booths and a concealed
    Buddhist garden; her husband is a protective bouncer. The private garden is a
    maintained Tantric Buddhist shrine for local worshippers, with concealment magic.
    A Force 10 ward and Force 6 Phantasm illusion are listed separately with exact
    magic mechanics.
  contact: Madame Kim gives arrivals directions to the rear garden when they ask for
    Aneki or claim to represent Renraku.
  period_context: This is gamemaster guidance in a fictional FASA RPG campaign, not
    practical travel, evasion or violent-action instructions.
