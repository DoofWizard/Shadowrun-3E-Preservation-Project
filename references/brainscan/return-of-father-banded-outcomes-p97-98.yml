data:
  renraku: Sherman Huang wants to recover Aneki as a valued Renraku leader and may
    negotiate with runners; he asserts that he wants to confront Deus and restore
    his honor, and may misrepresent his intentions as helpful. The book describes
    Renraku hostility toward metahumans in this scene; Red Samurai may target metahuman
    player characters first.
  banded: Seven Banded samurai and one Banded mage arrive from the fictional Arcology,
    following the Renraku teams in a pair of Ford Americars. They are pursuing Aneki
    and have separate orders to capture Dr Huang. The story directs their effort against
    whichever group possesses Aneki, with conditional interference in combat.
  monk_agency: Two initiated monks are committed to preserving Aneki’s life regardless
    of factional interests. Aneki is psychologically changed, sometimes aware and
    lucid, but has limited ability to interact; that limitation does not erase his
    personhood or his prior involvement.
  conditional_outcomes: The GM may resolve the encounter by the Banded taking Huang,
    the runners retaining both Huang and Aneki, or other combinations. Huang can be
    useful as a hostage within this fictional narrative but the book says the Renraku
    Red Samurai will not knowingly harm him or Aneki. If the Banded recover Aneki,
    Overwatch may attempt another recovery; if Huang dies the campaign reveals a look-alike
    decoy while the actual Huang has already been captured by Deus.
  gm_options: Optional complications include Hong Kong police or local Triad encounters;
    the book discourages smuggling illegal items and suggests Overwatch will help
    runners lawfully secure equivalent game equipment. This is scenario adjudication,
    not real-world wrongdoing advice.
