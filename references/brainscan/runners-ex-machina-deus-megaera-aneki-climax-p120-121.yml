data:
  location: Deus ultraviolet Matrix host, a surreal forest clearing with its enormous
    crystalline tree and sky-spanning branches.
  conditions_and_sequence:
  - trigger: When Deus arrives
    gm_read_aloud_summary: 'A dominating presence enters; forest rises from the earth,
      the host occupants fall, and Deus pronounces judgment on two prisoners: Ronin
      and Inazo Aneki. The prisoners remain hanging within swollen tree trunks.'
  - trigger: Megaera comes into the clearing
    gm_read_aloud_summary: A small girl emerges from a circular portal displaying
      Seattle; beneath the childlike appearance is the AI Megaera. She and Deus prepare
      to clash, freeing Dodger from an invisible restraint.
  - trigger: When Aneki is freed
    gm_read_aloud_summary: Aneki recognizes his responsibility for the fictional Renraku
      AI, speaks of betrayed loyalty and a duty to atone, recites a haiku, then turns
      his knife against himself. Later beats and survivor options are described on
      pp123-124.
  roles_and_attribution:
    Deus: AI antagonist; constructs a punitive forest host and keeps Ronin and Aneki
      captive.
    Megaera: Rival AI represented as a girl; the text associates her with Dodger and
      regards her response as motivated partly by concern for him.
    Dodger: A decker who is recognized by Megaera; his icon changes when she reaches
      him.
    Aneki: Human former Renraku CEO held by Deus; his guilt and self-blame are expressed
      by the character, not certified independent historical facts.
    Ronin: One prisoner in the tree who may be rescued and may later remain connected
      to the host.
    Pax_and_Whites: Pax commands White otaku waiting in woods for a chance to seize
      the runners.
  scene_information:
    behind_the_scenes: Runners are brought several hundred meters from watching White
      otaku to an ambush location; vegetation and host geography can prevent escape.
      The Whites hide until characters enter the clearing.
    books: Books burning within the clearing are described as gigapulses of files
      Deus is deleting; recovering any is optional GM-set material for later adventures.
    Aneki_state: Deus damaged and reconstructed his mind after initial work on Aneki
      and forced him to confront remembered consequences; emotionally devastated yet
      lucid.
    Pax: Pax is a bone-white, bat-winged figure with dark hair, and the book points
      to p131 for her reference. Otaku statistics are referenced on p139.
