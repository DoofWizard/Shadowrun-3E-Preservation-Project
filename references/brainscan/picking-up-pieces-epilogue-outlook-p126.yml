data:
  player_assumption_vs_reveal: Runners initially believe Deus destroyed and secured
    in the Mousetrap, which comes under Huang’s control; the narrator describes the
    truth as more complicated and points to the Epilogue printed p147.
  Renraku_reaction: Huang, Cham and Cliber may pursue and publicly blame the runners
    for crimes against Aneki if the players threaten their position, while the wider
    corporation continues to care about the arcology and its technological assets.
  Overwatch: Overwatch contacts the team after their escape. Ronin is missing, with
    later investigation unlikely to explain his location immediately.
  public_response: Renraku publicly claims the crisis was resolved without detailing
    exactly what transpired. The story anticipates corporate competition over the
    successor to Aneki and contradictory public rumors about the AI.
  humanitarian_and_long_term: The UCAS military and Renraku maintain prolonged relief
    efforts, even while refugees remain confined; the story notes slow search/rescue
    and heavy interest in Deus’s remnants.
  editorial_boundary: Rumor and publicity claims are attributed in-world; they are
    not represented as certain narrator-certified facts.
