    "source_context": "Published fictional SR3 gamemaster scenario, not operational advice; named in-world Overwatch statements are distinguished from background narration.",
    "scene_recruitment": "Ronin, speaking for Overwatch, calls the characters to an abandoned software company used as a Matrix gathering place; several young otaku and Dodger are present. He explains Overwatch learned from the Banded that one of Deus' Whites may be concealed among recently evacuated young people. The government vehicles will transfer them toward Fort Lewis.",
    "speaker_claims": "Ronin claims the military does not believe the recovered young people are dangerous, while Overwatch believes one is connected to Deus. He asserts the rescued children face a supervised debriefing or internment-like process; these are source-attributed fictional perspectives.",
    "moral_dilemma": "The runners are asked to intercept a military motorcade and extract a White while the otaku seek evidence and a means of fighting Deus. Overwatch emphasizes that the runners can act against Deus, but does not fully disclose its Banded intelligence source. Overwatch needs the runners' outside assistance and cannot easily pay them.",
    "site_and_timing": "The source locates the intended fictional encounter on Interstate 5 south of Tacoma en route to Fort Lewis, near Tacoma docks, before military reinforcement could arrive. This is a fictional plot location; do not treat it as instructions for real-world interception.",
    "scenario_turn": "For campaigns that included the SENSE scanner from Breakthrough (printed p38), the source allows its use in distinguishing the Banded child. A prototype may instead have been sold by Brisbie; that prior player choice materially affects the scene.",
    "gm_alternatives": "The GM may introduce unrelated street trouble, use characters from previous adventures, or increase pressure through social obligations. If runners refuse to work without payment, Overwatch may offer favors or game-world resources and may reluctantly produce a modest monetary payment. This remains a choice, not forced consent.",
    "later_scenario": "The story proceeds to The Line, a physical encounter with the transport, and The Sinker, involving an attempted lure of Overwatch by Deus."
