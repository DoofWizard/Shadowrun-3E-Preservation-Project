    "device_status": "The case Brisbie eventually sends down is a nonworking decoy with specifications; Brisbie privately retains the operational prototype. The apparent success is a narrator-established deception, not proof the player characters have the real device. Brisbie does not want to reveal the second prototype and prefers to study the real one.",
    "barter": {
      "initial_price_nuyen": 500,
      "preferred_payment": "Brisbie values unusual food, especially exotic foods hard to obtain in the Barrens, personal information or interesting rumors, and electronic gadgets. He is not interested in weapons, armor or simple shiny trinkets.",
      "other_payment": "He may accept promises of future favors; the GM controls how onerous they are.",
      "illustrative_price": "The source gives an example of goods worth 1,000 nuyen, a favor from each player character, or information twice as interesting or personal as the original offer.",
      "exchange": "When satisfied, Mustard uses the magical Magic Fingers spell to lift and lower the nonworking SENSE case and design specifications; before a deal, the empty case may be dropped and opened as a prank."
    },
    "optional_responses": {
      "negotiation": "The players may attempt to negotiate, trade, offer a favor, or otherwise convince Brisbie; the GM can make the exchange easier or harder.",
      "attack": "If players attack Mustard, Brisbie may use fictional magical effects to confuse them while the spirit escapes. He normally does not try to harm the players unless the spirit is wounded or his escape is endangered.",
      "escape": "Chasing the magically assisted shaman across Redmond rooftops is an optional challenge, not a required outcome.",
      "additional_encounter": "If the GM wants a more challenging ending, Red Hot Nukes may pursue the party and disrupt the exchange, but this is discretionary.",
      "potential_contact": "If characters treat Brisbie well, he may be retained as a contact in later sessions."
    },
    "editorial_attribution": "The source tells the GM that the party cannot truly recover the working prototype from this exchange as originally staged; the outcome should not be silently rewritten as a genuine recovery."
