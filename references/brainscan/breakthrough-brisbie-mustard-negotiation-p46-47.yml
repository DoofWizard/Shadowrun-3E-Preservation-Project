  "summary": "Historical fictional game-source preservation from FASA Corporation, Brainscan (2000), original Shadowrun Third Edition campaign, FASA7331/source.fasa-7331; no inferred conversion or supersession; printed pp46-47/physical PDF pp47-48. Optional fictional Brisbie and Mustard barter, the 500¥/1,000¥ values, deliberate decoy, spirit abilities, contact possibilities and no automatic violent outcome.",
  "data": {
    "fictional_scene": "Raven A-Go-Go, Breakthrough adventure, Shadowrun Third Edition campaign Brainscan (FASA Corporation, 2000). This is a GM scene, and its exact resolution depends on players.",
    "location": "2842 Fletcher Street, an abandoned four-story Municipal Courthouse — District 214, a few blocks from the garage. Brisbie watches from its rooftop or upper window.",
    "characters": {
      "Brisbie": "A Raven shaman and in-world trickster who accepted a commission to protect the Rusted Stilettos’ hideout but became interested in the SENSE case and moved the working prototype to his own possession.",
      "Mustard": "Brisbie’s ally spirit, Force 6, taking the appearance of a short round human with shaved head and a raven-in-flight skull tattoo. Mustard is the remote negotiator via telepathic connection to Brisbie."
