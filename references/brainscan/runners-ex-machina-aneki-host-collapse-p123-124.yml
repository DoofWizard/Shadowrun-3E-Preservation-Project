data:
  anecki_ownership_and_agency: The book portrays Aneki as coerced and psychologically
    manipulated by Deus, ashamed of his role in constructing the AI, and taking his
    own life by suicide with a weapon Deus supplied within the scenario. If Ronin
    has been freed, the narrator depicts him subsequently decapitating Aneki’s body
    with a sword. These are events within fictional Shadowrun storytelling, not real-world
    instructions.
  rescue_opportunities: Characters may reach Aneki by climbing the host tree, flying,
    or seeking support from the forest; otaku and IC obstruct them. Deus does not
    make reaching Aneki itself the final objective and may even facilitate it if a
    tree branch drops the prisoner.
  host_destruction: The source describes Aneki reciting a haiku and activating Deus's
    virtual kill codes through a programmed set of gestures and sounds; the code stored
    in Aneki’s AEP brainware takes effect. Deus's icon fractures, is dragged toward
    a collapsing black void, and consumes the UV host. Megaera is pulled into the
    collapse. The runner characters are expelled before the host's final destruction,
    with Ronin an exception described in the later aftermath.
  optional_extensions: The GM may expand the final confrontation into a series of
    linked UV hosts; the scene should remain challenging but success should be feasible.
    Alternative interventions are explicitly GM options, not canonical fixed outcomes.
