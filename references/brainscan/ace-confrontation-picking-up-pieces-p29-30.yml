  (FASA7331), printed 29-30/PDF30-31; all reported allegations and optional GM events
  are separated from narrator facts.
data:
  location: Bungalow 5 of the fictional Council Island Inn, during Qatwas Festival
    in the published Light Meets Night adventure.
  Ace_Gonriled: An orc decker who led the previous failed runner team and fears for
    his reputation after their defeat. The text states that he has already begun transmitting
    the mission payload from the target computer; the newly arrived team interrupts
    his work and the transfer must restart.
  alternative_reactions:
  - condition: Runners enter with drawn guns
    fictional_outcome: Ace shoots at the first one entering.
  - condition: Runners enter without drawn guns
    fictional_outcome: Ace points a silenced Ceska Black Scorpion machine pistol and
      orders them to submit; threatens to shoot if the first character does not obey.
  - condition: Runners attempt contact by talking through the door or by magic
    fictional_outcome: Ace hides behind the bed and waits with his firearm.
  narrator_guidance: The GM is instructed to improvise after the initial exchange
    using Combat Decker Sample Character p66 SR3. Ace is primarily concerned with
    completing his contract and defending his claim to payment, not with gratuitous
    violence.
  continuity: Morris pays out after the operation, unless the runners severely compromised
    one or both jobs. If Ace remains with them he also gets his fee. If they kill
    Ace, Morris refuses the higher payment for a quiet job when he learns the body
    was left on Council Island. The fictional grid blackout follows even though the
    protagonists do not know their role in precipitating it.
  award_karma:
    survive_run: 1
    threat_level: 1
    stay_undetected: 1 per mission
    warning: The book instructs the gamemaster not to award bonus Karma for unnecessary
      deadly fighting.
