data:
  chapter_subscene: The Enemy of My Enemy is a subscene of Runners Ex Machina. The party infiltrates
    the 272nd floor with a small Resistance team to recover Cham Lam Won and the Mousetrap. Cliber
    and Devon’s factional conflict remains relevant after the rescue.
  narrator_dialogue: In the original scripted scene, Devon attaches a dataline tap to the 272nd-floor
    security-door panel and invites a decker to enter the screamer subsystem to locate Cham.
  party_and_location: Ronin and Dodger stay back with Aneki to protect him; Devon, Kiell and other
    Resistance fighters accompany the assault. The Whites live near the 272nd floor and the gamemaster
    may use hostile magical or electronic surveillance on the approach.
  tracking_goal: Receivers built into the arcology’s architecture detect devices known as screamers.
    Cham’s own screamer ID is the search key for finding his last known doorway among the 272nd-floor
    suites. The source offers a decker route and says Devon can perform this search if none of the
    runners can.
