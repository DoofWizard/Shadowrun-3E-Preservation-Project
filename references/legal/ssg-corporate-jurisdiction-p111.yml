data:
  publication: {title: Sprawl Survival Guide, publisher: FanPro, catalog_number: FanPro10667, year: 2003, edition: Shadowrun Third Edition, source_id: source.fanpro-10667, source_pdf_sha256: b0855865c06b20f8c71251d45d980d54470990af656277f5b9ace9264a9e309f, printed_page: 111, physical_pdf_page: 112}
  attribution: Abigail Zoe Danvers, fictional in-world narrator
  corporation_tiers:
    A_and_below: Corporate security can arrest and temporarily hold a runner to determine what occurred, then remand the runner to municipal or federal law enforcement for subsequent adjudication and incarceration.
    AA_and_above: Extraterritorial corporations apply their own laws and procedures; the narrator describes the absence of recourse and the possibility of involuntary beating, torture, indenture or summary execution.
  jurisdiction: For both tiers, corporate security jurisdiction is limited to corporate property.
  qualification: The narrator describes local police generally objecting to corporate security leaving its territory, even in pursuit, and the reverse also applying; some police overlook corporate retaliation. This is not an absolute immunity or guaranteed police behavior.
  scope: Fictional corporate legal status categories, not numerical corporate attributes; no fixed corporate holding time, new test, or replacement of existing UCAS legal procedures is stated.
  canonical_reuse: [reference.corporate.corporate-download-framework, rule.ssg-ucas-legal-process-p40-42]
