id: reference.yotc.surge-overview
record_type: reference
name: "SURGE Overview"
domain: character
status: ingested
source: source.fanpro-10650
printed_pages: "22-41"
pdf_pages: "23-42"
definition:
  expansion: "Sudden Unexplained Recessive Genetic Expression"
  nature: "A metagenetic/metaphysical expression phenomenon producing sudden physical and sometimes magical traits in humans, metahumans, animals and plants."
  disease_status: "Not a disease, virus or contagious condition according to the source's medical framing."
  common_term_for_affected: "changeling"
timeline:
  first_documented_case: "4 September 2061"
  major_wave_begins: "10 September 2061"
  early_scale: "More than 200 reported cases worldwide on 10 September."
  source_projection: "Contemporary report projected expression ratio could reach roughly half of the eventual level by 1 January 2062 and slow to a trickle by August/September 2062; this is an in-setting forecast, not a guaranteed outcome."
population:
  estimated_trait_frequency: "Source report suggests fewer than 1 in 100 people possess the necessary traits, with admitted uncertainty."
  geographic_distribution: "Reported worldwide with no clear geographic concentration; some states may withhold data."
  susceptibility:
    - "Mundane humans described as most likely to express."
    - "Mundane metahumans are the second-largest susceptible group, with metatypes described as broadly affected."
    - "Awakened people are described as least affected overall, though Awakened humans appear more affected than Awakened metahumans."
    - "Age, gender and ethnicity were not found to be meaningful predictors in the cited research."
classification:
  class_one:
    description: "Incomplete or fractional expression of already-known metagenetic trait chains."
    examples:
      - pointed ears
      - tusks
      - horns
      - astral perception
  class_two:
    description: "Activation of older/unknown genetic chains producing coherent animal-like or other trait families."
    examples:
      - tails
      - vertically slotted eyes
      - functional gills
      - canine or ichthyic trait patterns
  class_three:
    description: "Mutated or otherwise unknown genetics; may involve single drastic traits or termination/nonviability."
    examples:
      - loss of body hair
      - unusual skin pigmentation
      - extra knuckle structures
scientific_hypotheses:
  favored_in_source:
    - "Ambient mana level has been gradually increasing and may have crossed a threshold sufficient to activate recessive/inactive metagenes."
    - "SURGE metagenes may require a higher mana concentration to activate than metagenes responsible for standard metahuman expression."
  alternatives:
    - "Retrovirus / engineered-vector theories are discussed but presented as speculative and poorly supported."
  uncertainty:
    - "The source repeatedly states that the genetics are poorly understood and many conclusions are provisional."
  inheritance:
    - "Whether SURGE traits breed true is unresolved in the source-period discussion; standard metatraits do not necessarily pass intact to offspring."
social_effects:
  - "Early cases trigger fear, riots, racial violence and emergency responses in multiple cities."
  - "Existing anti-metahuman movements exploit SURGE panic; metahuman groups sometimes retaliate or organize defense."
  - "Changeling support networks, clubs and commercial scenes emerge."
  - "The Draco Foundation is described as assisting displaced changelings with relocation/employment and medical adjustment."
named_social_context:
  rohit_talwar:
    organization: "Ork Rights Committee"
    event: "Killed 15 September 2061 while protecting a changeling from a human street gang."
  fractured_helix:
    type: "SURGE club"
    location: "Downtown Seattle"
    description: "Early changeling-centered venue that also admits non-changelings."
  digit:
    role: "changeling musician"
    trait_context: "extra finger on each hand; perfect pitch"
  noticia_nightcord:
    role: "changeling vocalist"
    trait_context: "altered vocal cords producing non-natural sonic qualities"
notes:
  - "Formal SURGE character-generation mechanics are intentionally deferred to the source's Game Information chapter."
  - "Narrative examples and medical theories are preserved as source-period claims, not treated as universal scientific fact."
sources:
  - {source: source.fanpro-10650, printed_pages: "22-35", pdf_pages: "23-36", relation: defines_context}
