african_shamanism:
  - "The source presents African shamanic practice as a distinct regional magical tradition rather than a direct transplant of North American or European practice."
  - "Clan or community identity can be associated with an animal patron, while individual practitioners may follow different personal totems."
  - "The source explicitly distinguishes a clan animal as a social/spiritual connection from a personal totem that grants game-relevant totem modifiers; no new numeric totem modifier is defined here."
  - "Anansi is identified as a common African totem translated in English as the American were associated with 'Spider'."
  - "Source examples of clan-associated animals include Lion, Cheetah, Cobra, Hyena and Jackal."

ancestor_spirits:
  - "Ancestor spirits are treated as spirits connected to deceased family/community members and are socially integrated into local magical practice."
  - "The source describes conjured spirits as intermediaries and mentions familiar Shadowrun spirit powers such as manifestation, searching and confusion; it does not define a new power list or replacement summoning procedure."
  - "Ancestor spirits are described as capable of warning or prophetic behavior in source anecdotes, but no new test, target number or formal prediction rule is supplied."

paranormal_ecology:
  - "The coastal region is described as supporting numerous Awakened plants and animals alongside ordinary wildlife."
  - "Examples named by the source include Awakened sharks, kraken, whales and mami wata."
  - "The source treats magical fauna and flora as regional setting resources and hazards rather than introducing new statistics in this subsection."

provenance_policy:
  - "Shadowland claims about spirits, reincarnation, mortality, magical causation and local belief remain attributed where the text presents disagreement."
  - "No numeric SR3 modifier, new spell, new spirit stat block, or new summoning test was found in printed pp.96-98."

