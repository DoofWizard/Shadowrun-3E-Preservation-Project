id: reference.new-seattle.downtown-access-security
record_type: reference
name: "Downtown Seattle access, Matrix and security procedures"
domain: setting
status: ingested
source: source.fanpro-10657
pages: "31-39"
pdf_pages: "32-40"

rules_bearing_items:
  downtown_street_enforcement:
    source_pages: {printed: 32, pdf: 33}
    facts:
      - "Conspicuous high-end protective or security-sensitive equipment draws rapid Lone Star attention in Downtown; ordinary concealed personal protection is treated more leniently."
      - "Carrying obvious specialist equipment associated with illegal activity, especially after dark, also increases corporate-security attention."
  corporate_host_access:
    source_pages: {printed: 32, pdf: 33}
    facts:
      - "Many important corporate hosts are isolated from the public Matrix and require access from a private/internal network."
  council_island_entry_and_jurisdiction:
    source_pages: {printed: "33-34", pdf: "34-35"}
    facts:
      - "Seattle and Lone Star lack jurisdiction on sovereign Salish-Shidhe Council Island."
      - "Entry uses controlled bridge/ferry routes and extensive screening."
      - "An extradition treaty with Seattle limits the island's value as guaranteed sanctuary."
      - "Medicine Hollow Lodge may be used by non-resident shamans with advance Grand Council permission."
      - "Authorized visitors may sometimes obtain passes for talismongering-material gathering in Salish-Shidhe territory."
  metroplex_records_host:
    source_pages: {printed: 34, pdf: 35}
    facts:
      - "Public records, including motor-vehicle records, are available to users presenting a valid SIN."
      - "The host emphasizes trace and alarm countermeasures rather than destructive IC."
      - "Detected intrusion can produce a rapid Lone Star response."
  private_meeting_security:
    source_pages: {printed: "35-37", pdf: "36-38"}
    facts:
      - "Dante's Inferno private rooms use white-noise systems and magical wards; the source-period price for a night in the Hell level is upward of 1,000 nuyen."
      - "Eye of the Needle private dining rooms use anti-surveillance systems and magical wards."
      - "Club Penumbra and Matchstick's provide secluded meeting space, though with less explicit technical protection."
  lone_star_reserve_facility:
    source_pages: {printed: 37, pdf: 38}
    facts:
      - "The Downtown Lone Star building includes twenty sub-basement levels of reserve vehicles, aircraft and security equipment, allowing escalation beyond ordinary patrol response."
  renraku_arcology_lockdown:
    source_pages: {printed: "37-38", pdf: "38-39"}
    facts:
      - "During the 2060 shutdown, normal Matrix access is offline."
      - "Entrances are sealed, automated security remains active and magical wards impede astral entry."
      - "The cause of the shutdown and several claimed unofficial access routes remain speculative in this source section."
  sea_tac_screening_and_host:
    source_pages: {printed: 38, pdf: 39}
    facts:
      - "Airport entry screening is designed to reveal concealed cyberware/restricted equipment and chemically detectable contraband."
      - "The airport host uses password controls, trace measures, intrusion logging and alarms."
      - "If intrusion is detected, the text expects immediate security response."
      - "Without an alarm, reservation, arrival/departure and passenger-list systems are among the accessible operational data."

notes:
  - "These are source-period access/security procedures and environmental constraints, not a claim that every later Seattle source uses the same conditions."
  - "No supersession is inferred; later rules or setting books may extend or alter individual procedures."
