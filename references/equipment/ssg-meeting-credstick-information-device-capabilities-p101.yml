data:
  publication: {title: Sprawl Survival Guide, publisher: FanPro, catalog_number: FanPro10667, year: 2003, edition: Shadowrun Third Edition, source_id: source.fanpro-10667, source_pdf_sha256: b0855865c06b20f8c71251d45d980d54470990af656277f5b9ace9264a9e309f, printed_page: 101, physical_pdf_page: 102}
  source_section: Life on the Run / The Plan
  attribution: Abigail Zoe Danvers, fictional in-world narrator
  context: Narrator describes equipment or team support for a fictional job meeting.
  alternatives_in_original_order: [portocomp, p-sec, phone, decker]
  qualification: The narrator suggests taking a portocomp if available, otherwise one of the other three alternatives. A decker is a character, not a device.
  stated_capabilities:
    credstick_check: Any one of the alternatives can check a credstick received as advance payment in the described meeting context.
    information: The alternatives can also store or send information received about the job.
  scope: The source does not assign a device rating, specific phone type, new test, storage size, or universal verification-reader or decking capability. Existing core and SSG credstick-reader procedures and cellular decking restrictions remain distinct.
