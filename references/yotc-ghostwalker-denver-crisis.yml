political_escalation:
  - "Sector militaries mobilize and the Treaty of Denver framework begins to break down."
  - "Aztlan airlifts troops; other sectors respond with their own forces."
  - "Travel, borders and smuggling routes are disrupted."
settlement_2062_01_27:
  council_vote:
    yes:
      - UCAS
      - Sioux
      - Pueblo
      - CAS
      - Ute
    no:
      - Aztlan
  terms:
    - "Ghostwalker recognized as guardian/protector and ultimate authority over Denver / Front Range Free Zone."
    - "Sector governments retain laws and day-to-day administration."
    - "Council of Denver continues but Ghostwalker has veto/final authority."
    - "Aztlan is expelled from Denver."
    - "Former Aztlan sector territory passes to CAS control."
    - "Treaty of Denver is to be rewritten without Aztlan and with Ghostwalker's status stated."
    - "National military forces are to be replaced by a joint Zone Defense Force."
nicholas_whitebird:
  role: "Ghostwalker's formal liaison to Council of Denver and wider world."
  authority: "Carries Ghostwalker's voice/authority and assists sector day-to-day coordination."
  offices:
    - "new Council Hall in the UCAS sector"
    - "additional office in the Sioux sector"
ghostwalker_public_statement:
  date: "2062-01-27"
  points:
    - "Claims Denver as an old home and his rightful place as guardian/protector."
    - "States Council and national sector governments continue under his governance."
    - "Defends removal of Aztlan and selection of CAS to take its former sector."
    - "Establishes Nicholas Whitebird as liaison."
    - "Creates a Matrix-based petition system through Denver Regional Telecommunications Grid."
    - "Requires petitioners seeking personal audience to provide a suitable gift."
speculation_not_asserted:
