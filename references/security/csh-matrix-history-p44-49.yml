data:
  chapter: Matrix Security
  opening:
    printed_page: 44
    scope: "Corporate Matrix security covers financial records, software, proprietary designs and other electronic assets."
    provider_attribution: "Knight Errant promotes its security deckers, IC and hardware as leading services, not verified comparative rankings."
  origins:
    printed_pages: "46-47"
    predecessor: "Late twentieth-century and early twenty-first-century government and corporate computer-security departments."
    major_incident_date: "February 8, 2029"
    event: "A previously unknown computer virus spread globally, disrupted systems and the Grid, prompting the UCAS president to order the multi-agency Echo Mirage effort."
    august_2029: "The team coordinated a cyberterminal-based response; four personnel are described as killed by lethal biofeedback during an eighteen-minute engagement."
    late_2031: "Echo Mirage reportedly eliminated the remaining concentration of virus code after developing improved software and cyberterminals."
    reported_original_team_size: 32
    reported_deaths_of_original_team: 25
    veterans_returned_to_private_employers: 4
    subsequent_lineage: "Corporate work derived cyberdecks, IC, associated hardware and firmware; cyberdecks became commercially available within five years."
  later_evolution:
    printed_page: 47
    issue: "Matsec divisions first protected electronic assets but assumed duties for connected building security as cameras, maglocks and alarms became networked."
    development: "Matrix-accessible controls, rising workload and unauthorized access concerns led to specialized technical divisions."
  security_riggers:
    printed_page: 48
    company: "CerebroTech (wholly owned subsidiary of Ares Security International)"
    first_experiments: "Late 2040s"
    source_technologies: [ASIST, Muscular_Signal_Transference, Vehicle_Control_Rigs]
    development: "Combined technologies produced closed-circuit simsense (CCSS) controlled by specialized security riggers."
    first_operational_year: 2050
    effect: "Dedicated riggers handled systems formerly controlled through corporate matrices; this is an architectural history, not proof of absolute resistance."
