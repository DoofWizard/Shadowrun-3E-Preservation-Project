summary: 'Source-reviewed historical fictional Matrix-security narrative from FASA
  Corporation’s Corporate Security Handbook (FASA7118, 1995), source.fasa-7118, original
  Shadowrun Second Edition, printed pp44–49/PDF45–50: details of the 2029 virus crisis,
  the narrator’s Echo Mirage chronology, early IC, the emergence of cyberdecks and
  matrix-connected site security, and CerebroTech’s CCSS security-rigger system. Source
  assertions retain their narrative attribution; no SR3 conversions.'
data:
  chapter: Matrix Security
  opening:
    printed_page: 44
    scope: Corporate Matrix security covers financial records, software, proprietary
      designs and other electronic assets.
    provider_attribution: Knight Errant promotes its security deckers, IC and hardware
      as leading services, not verified comparative rankings.
  origins:
    printed_pages: 46-47
    predecessor: Late twentieth-century and early twenty-first-century government
      and corporate computer-security departments.
    major_incident_date: February 8, 2029
    event: A previously unknown computer virus spread globally, disrupted systems
      and the Grid, prompting the UCAS president to order the multi-agency Echo Mirage
      effort.
    august_2029: The team coordinated a cyberterminal-based response; four personnel
      are described as killed by lethal biofeedback during an eighteen-minute engagement.
    late_2031: Echo Mirage reportedly eliminated the remaining concentration of virus
      code after developing improved software and cyberterminals.
    reported_original_team_size: 32
    reported_deaths_of_original_team: 25
    veterans_returned_to_private_employers: 4
    subsequent_lineage: Corporate work derived cyberdecks, IC, associated hardware
      and firmware; cyberdecks became commercially available within five years.
  later_evolution:
    printed_page: 47
    issue: Matsec divisions first protected electronic assets but assumed duties for
      connected building security as cameras, maglocks and alarms became networked.
    development: Matrix-accessible controls, rising workload and unauthorized access
      concerns led to specialized technical divisions.
  security_riggers:
    printed_page: 48
    company: CerebroTech (wholly owned subsidiary of Ares Security International)
    first_experiments: Late 2040s
    source_technologies:
    - ASIST
    - Muscular_Signal_Transference
    - Vehicle_Control_Rigs
    development: Combined technologies produced closed-circuit simsense (CCSS) controlled
      by specialized security riggers.
    first_operational_year: 2050
    effect: Dedicated riggers handled systems formerly controlled through corporate
      matrices; this is an architectural history, not proof of absolute resistance.
  source_detailed_2029_crisis:
    printed_page: 46
    virus_impact: The narrator dates the worldwide outbreak to 8 February 2029 and
      describes a then-unknown virus crashing innumerable computers, destroying stored
      data, and burning out hardware. Within the first quarter of 2029, governments
      toppled, the world economy nearly collapsed, and the interconnected Grid was
      shattered.
    government_response: The narrator says the UCAS president directed creation of
      the multi-agency Echo Mirage task force to contain and destroy the virus; conventional
      security specialists were overwhelmed by the psychological and psycho-physiological
      demands of combat in cyberspace.
    personnel_recruitment: Echo Mirage leadership recruited unusually skilled private-corporation
      data-processing personnel as those difficulties became apparent.
    august_engagement: By August 2029, improved cybertechnology enabled a coordinated
      assault. Eighteen minutes into engagement in cyberspace, four Echo Mirage members
      had died from virus-induced lethal biofeedback; surviving members found cyberterminal
      methods to defeat conventional computer security.
    early_ic_purpose: The source narrator credits subsequent corporations with developing
      first-generation intrusion countermeasure software for repelling matrix-interface
      intruders and helping contain future viruses, not merely protecting corporate
      files.
  echo_mirage_aftermath_detail:
    printed_page: 47
    closing_date: By late 2031, Echo Mirage had destroyed the last concentration of
      the virus code.
    source_reported_cost: The narrator reports billions of dollars spent, without
      treating that broad quantity as a precise currency figure.
    casualties: The source reports 25 deaths from the original 32-member Echo Mirage
      group, and four veterans returning to the corporate employers that had loaned
      them to the project.
    commercial_development: Within five years after the effort, cyberdecks became
      commercially available. The narrator traces commercial IC, cybersecurity hardware,
      firmware, and matrix security to the Echo Mirage development cycle.
  later_networked_security_pressure:
    printed_page: 47
    connected_devices: Closed-circuit video and trideo, access-control systems, maglocks,
      and alarms progressively became matrix-networked.
    workforce_shift: Matrix staff took on non-computer security responsibilities they
      were not originally trained to handle, and the added program frames and IC intended
      to ease the burden also slowed and sometimes overloaded corporate matrices.
    consequence: Intruders increasingly accessed technical security through company
      matrices, motivating efforts to isolate non-Matrix-related security functions.
  security_rigger_ccss_detail:
    printed_page: 48
    original_obstacle: CerebroTech found a decker-style ASIST interface too slow for
      real-time control of matrix-accessible external security because its programming
      layers introduced latency.
    combined_technologies: The source credits combining Muscular Signal Transference
      (MST) and Vehicle Control Rig (VCR) technologies with ASIST in the first closed-circuit
      simsense (CCSS) system.
    deployment: The first CCSS systems were operating by 2050; dedicated security
      riggers could direct a system much as vehicle riggers control vehicles.
    scope_and_limit: The account describes separating non-Matrix-related security
      controls from corporations’ matrices to reduce unauthorized matrix access, not
      removing every risk or guaranteeing secure operation.
  archival_provenance:
    publication_title: Corporate Security Handbook
    publisher: FASA Corporation
    publication_year: 1995
    catalog_number: FASA7118
