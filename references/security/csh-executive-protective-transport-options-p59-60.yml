headline: 'Fictional Shadowrun RPG archival supplement — FASA Corporation, Corporate Security Handbook (FASA7118, 1995), Second
  Edition, source.fasa-7118, printed pp59–60/PDF60–61: Knight Errant protective-service options'
summary: FASA Corporation’s fictional Shadowrun Second Edition Corporate Security Handbook (FASA7118, 1995), source.fasa-7118,
  printed pp59–60/PDF60–61. Knight Errant’s in-world narrator describes distinct executive-protection service options for lifestyle,
  technical, travel, magical and information safeguards, including alternative client-provided versus provider-provided transport
  and the minimum one specialist on every trip. This is source-period fictional service description, not mandatory SR3 mechanics.
data:
  narrator_and_source_period:
    attribution: Knight Errant executive-security provider narrator in a fictional tabletop RPG sourcebook
    printed_pages: 59-60
    pdf_pages: 60-61
  reducing_vulnerability:
    source_categories:
    - security awareness and lifestyle modification
    - physical and technical security measures
    - transportation security measures
    - magical security measures
    - information control
    - aggressive intelligence gathering
    scope: The provider differentiates these service categories after an individualized fictional threat review; it does not present
      a universal recipe or a dice-based game procedure.
  source_awareness_discussion:
    printed_page: 59
    subject_and_family: The narrator says a protected executive and family are briefed on the provider’s arrangements and may be
      asked to alter activities that create sources of leverage.
    qualifier: Examples in the original are judgments made by the fictional narrator; they do not establish misconduct by any real
      person.
  physical_and_technical_measures:
    printed_pages: 59-60
    location_scope: Knight Errant describes reviewing both the subject’s workplace and residence and revisiting protective arrangements
      as circumstances change.
    source_specified_examples:
    - physical-security and electronic-surveillance review of work and residence
    - telecommunications line-scrambling arrangements
    - continuous accompaniment by executive-protection specialists
    provider_vs_rule: These are the fictional provider’s listed offerings and do not give universal technical specifications or
      mechanical ratings.
  transportation_service_alternatives:
    printed_page: 60
    driver_options: The narrator distinguishes Knight Errant supplying its own qualified driver from training a driver supplied
      by the fictional client.
    vehicle_options: It distinguishes a provider-supplied armored vehicle from fitting armor to a client-supplied vehicle.
    stored_vehicle: The provider separately says it offers protected storage for the subject’s vehicle when that vehicle is not
      in use.
    trip_staffing: The source states that at least one executive-protection specialist accompanies the subject on every trip, distinct
      from the average three specialist positions in an entire team on printed p61/PDF62.
    travel_context: The source also discusses advance planning for trips involving the subject and family as part of the provider’s
      service model.
  magical_information_and_intelligence:
    printed_page: 60
    magic: The narrator presents magical defenses against astral threats, including spells, wards, elemental spirits and a security
      mage.
    information: The source emphasizes secrecy regarding daily schedules and travel itineraries.
    intelligence: Knight Errant claims to reassess threats, monitor signs of observation and, in extreme cases, contemplate pre-emptive
      action; a named Shadowtalk contributor contests the latter idea. Neither statement is a verified real-world fact or an instruction.
  mechanics_status: No new target-number or dice rule is specified in these two source pages. The minimum one escort is an exact
    fictional staffing condition, not a character-creation or encounter-generation rule.
  related_existing_records:
  - references/security/csh-executive-protection-guidance-p56-61.yml
  - references/security/csh-executive-protection-context-p54-61.yml
  supplement_rationale: Existing guidance captures continuous escort and one-specialist travel minimum, but does not preserve the
    stated alternative of a client-supplied or provider-supplied driver, provider-supplied or retrofitted armored vehicle, separate
    storage service, or specifically identified line-scrambling and workplace/residence protective-review examples.
