summary: 'FASA Corporation’s fictional Shadowrun Second Edition Corporate Security
  Handbook (FASA7118, 1995), source.fasa-7118, printed pp51–53/PDF52–54: source-reviewed
  Knight Errant advice on employee background inquiries, ongoing monitoring claims,
  screening limitations, investigative discretion, reference biases and specialist-hiring
  conflicts; historical provider assertions, not universal facts or SR3 mechanics.'
data:
  narrator: Knight Errant corporate reference
  background_checks:
    printed_pages: 51-52
    workforce: Recommend initial vetting, repeat investigation and case-specific review
      when material circumstances change.
    applicant_specificity: Provider says detailed reference, employment and credential
      review helps establish a fuller picture than identity-only screening.
    limitation: Narrator acknowledges inability to guarantee performance or prevent
      all subsequent misconduct.
    policy_balance: Source says highly specialized hiring needs can conflict with
      strict screening; tailored selection procedures may balance those needs.
  sensitive_workforce:
    printed_pages: 52-53
    observation: Narrator describes heightened scrutiny of employees handling valuable
      proprietary research and information.
    response: Counterintelligence reviews and protective briefings, not proof of wrongdoing
      by an identified employee.
    privacy_distinction: Reader commentary disputes practices such as intrusive personal
      monitoring; retain as commentary rather than universal narrator fact.
  security_awareness:
    printed_page: 53
    services:
    - instruction
    - scenario discussions
    - incident briefing
    - employee communications
    feedback: Text frames participation and reporting as intended outcomes, without
      prescribing any numerical game mechanic.
  source_reviewed_internal_investigations_p51:
    narrator_view: The fictional Knight Errant provider describes insider theft or
      assistance to outsiders as possible internal threats and advocates background
      inquiries, repeated checks of existing employees, loyalty checks, and investigations
      of known or suspected misconduct. These are source-era provider claims, not
      universal findings about workers.
    screening_limits: The provider expressly says neither initial honesty assessments
      nor other screening can ensure future honesty and says changes during an employee’s
      life can change behavior. These assertions do not establish any numeric test.
    intrusive_monitoring_claim: The in-world narrator presents continual surveillance
      and periodic reinvestigation as its theoretical strongest safeguard against
      insider risks. This is explicitly the provider’s claim, not an endorsement of
      such measures or a statement that they are mandatory.
    diligence_and_employee_trust: The provider instructs its own investigators to
      conduct inquiries with as much discretion as thoroughness permits to avoid making
      honest employees resentful or alienated. This stated tradeoff is distinct from
      any claim that affected employees consented.
  source_reviewed_screening_and_references_p52:
    specific_checks: The provider lists past employment and reference checks, financial
      and education records, and interviews with former supervisors, colleagues, neighbors
      and friends.
    potential_reference_bias: The provider notes that references supplied by an applicant
      may be close friends or favored former colleagues who could give biased accounts;
      this remains a source-era assumption, not a proven finding against an applicant.
    security_vs_specialist_hiring: The narrator says a client needing exceptionally
      specialized skills might hire an applicant personnel security considers a risk;
      Knight Errant describes tailored selection procedures designed to balance these
      conflicting priorities.
    claimed_warning_signs: The narrator lists unstable personal relationships, rapid
      job changes, falling salary, unexplained employment gaps, and unreliable recollection
      of supervisors or addresses as possible risk signals. These are the narrator’s
      claimed indicators, never a diagnosis or proof of wrongdoing.
  archival_provenance:
    publication_title: Corporate Security Handbook
    publisher: FASA Corporation
    publication_year: 1995
    catalog_number: FASA7118
    source_id: source.fasa-7118
