data:
  source_context:
    publication: Corporate Security Handbook
    publisher: FASA Corporation
    catalog_number: FASA7118
    publication_year: 1995
    game_lineage: Historical Shadowrun Second Edition-era tabletop game; not a Third Edition conversion
    section: Archetypes
    printed_pages: 121-124
    pdf_pages: 130-133
  assertion_boundaries: All direct sample voices are fictional exemplar character speeches. Commentary is the unnamed publication
    narrator, not documented real-world conduct. Exact statistics, cyberware, dice pools, contacts, cash, gear and game options
    remain separately recorded under rules/security.
  archetypes:
  - role: Freelance Executive Protection Specialist (Troll)
    printed_page: 121
    pdf_page: 130
    exemplar: The troll rejects the generic bodyguard label, identifies as an executive protection professional, and promises
      to keep the client alive and escape danger without injury when successful. He demands that the client follow his protection
      instructions.
    narrator: The publisher portrays him as an unusually dedicated professional rather than a thug or low-status gang member.
      He is prepared to risk his own life for a client; some fictional executive-protection specialists become closer to clients
      than relatives and can earn more than their clients.
  - role: Freelance Magical Security Consultant
    printed_page: 122
    pdf_page: 131
    exemplar: The male consultant claims to have worked as an astral intruder previously, and says that experience now informs
      his contracted defenses. He openly prioritizes payment over altruistic motives.
    narrator: A freelance expert designs and implements magical security systems, including traps to delay or stop intruders;
      the book presents growing demand and high fees as corporations learn the value of protecting magical security secrets.
  - role: Freelance Security Rigger
    printed_page: 123
    pdf_page: 132
    exemplar: The contractor emphasizes that sophisticated drones, maglocks, and CCSS hardware cannot compensate for an unskilled
      operator; he promises an assessment of a client’s system and detection coverage shortly after connecting.
    narrator: The book depicts this newer security role as controlling an integrated building system, from drones to maglocks,
      and as sometimes difficult to work with because of ego. The consultant supplies a deck, training and ability; all other
      hardware must be provided by the client.
  - role: Security System Design Engineer (Dwarf)
    printed_page: 124
    pdf_page: 133
    exemplar: The dwarf designer warns that expensive individual technology does not replace coherent overall security design,
      and that defects leave a site vulnerable. He asks clients to trust the designer but notes the risk of giving an insider
      detailed knowledge of system weaknesses.
    narrator: The book compares integrated system design to assembling a puzzle; its engineer tests, repairs, and redesigns
      security components. Because designers know internal system structure, the narrator says fictional adversaries may target
      them for kidnapping, extortion, bribery, or extraction.
