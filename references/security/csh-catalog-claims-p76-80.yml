data:
  source_period: Fall 2055
  provenance: Fictional in-world catalog commentary; statements are attributed and cannot override
    published rules.
  entries:
  - printed_page: 76
    pdf_page: 77
    speaker: New Nell
    timestamp: 21:19:12/12-05-55
    assertion: Asks whether CCSS allows a security rigger to sense a tripped alarm or tampering with
      a security device.
    certainty: question
  - printed_page: 76
    pdf_page: 77
    speaker: Shriven
    timestamp: 04:18:44/12-06-55
    assertion: Answers that alarms and clumsy tampering would be sensed; skilled tampering would not
      necessarily be detected.
    certainty: attributed technical opinion
  - printed_page: 76
    pdf_page: 77
    speaker: Nightfire
    timestamp: 05:54:47/12-07-55
    assertion: Disputes certainty of sophisticated security systems and argues that human senses and
      intuition could detect indications of expert tampering overlooked by automation.
    certainty: counterargument
  - printed_page: 76
    pdf_page: 77
    speaker: Jurgen
    timestamp: 05:21:04/12-09-55
    assertion: Claims CCSS-connected doors in a high-security facility allow passive tracking of movement
      while the rigger directs security officers or drones.
    certainty: in-world tactical inference
  - printed_page: 77
    pdf_page: 78
    speaker: Yuri
    timestamp: 04:34:12/12-02-55
    assertion: Complains that the rigger protocol emulation utilities are slow and expects a better
      alternative to exist.
    certainty: opinion
  - printed_page: 77
    pdf_page: 78
    speaker: Ignorant and Proud
    timestamp: 10:58:15/12-03-55
    assertion: Recalls a technically informed acquaintance attempting to explain the slowdown. The
      commenter uncertainly attributes it to interference or lack of a simsense-signal interface in
      the cyberdeck, and questions translation into symbolic output.
    certainty: secondhand speculation, expressly uncertain
  - printed_page: 77
    pdf_page: 78
    speaker: Connie Casualty
    timestamp: 22:08:54/12-05-55
    assertion: Criticizes the previous speaker for speculating without understanding the technical
      subject.
    certainty: critical opinion
  - printed_page: 77
    pdf_page: 78
    speaker: Ignorant and Proud
    timestamp: 18:02:50/12-06-55
    assertion: Objects to Connie Casualty’s criticism. States that the account name refers to two
      users sharing one account, one calling himself Ignorant and the other called Proud.
    certainty: account-identity claim and rebuttal
  - printed_page: 77
    pdf_page: 78
    speaker: Treasure Seeker
    timestamp: 11:39:08/12-07-55
    assertion: Characterizes the preceding commenters’ exchange as foolish or clownish.
    certainty: opinion
  - printed_page: 78
    pdf_page: 79
    speaker: Hangfire
    timestamp: 02:18:56/12-02-55
    assertion: Questions why Ares sells the System-Control Rig Emulator and speculates that a decker
      could use it to override a rigged security system.
    certainty: question/hypothesis
  - printed_page: 78
    pdf_page: 79
    speaker: Teague
    timestamp: 21:17:30/12-06-55
    assertion: States that Ares primarily markets SCRE as ICC backup. Claims some deployed systems
      integrate SCRE into a decker console and keep the emulation utility ready in console storage;
      if the security rigger becomes unavailable, a decker could take control in milliseconds and
      retain or maintain control until another security rigger arrives.
    certainty: attributed report, not independent system rule
  - printed_page: 78
    pdf_page: 79
    speaker: Loki
    timestamp: 05:24:14/12-07-55
    assertion: Suggests that shadowrunning teams could use the emulator as backup equipment if an
      operation becomes disorganized.
    certainty: hypothetical
  - printed_page: 79
    pdf_page: 80
    speaker: Gadfly
    timestamp: 09:20:18/12-02-55
    assertion: Sarcastically disputes diagnostics as the only purpose and implies unspecified alternative
      uses.
    certainty: sarcasm/opinion
  - printed_page: 79
    pdf_page: 80
    speaker: New Nell
    timestamp: 03:29:15/12-05-55
    assertion: Asks whether Gadfly was being sarcastic.
    certainty: question
  - printed_page: 79
    pdf_page: 80
    speaker: Taylor Tom
    timestamp: 20:52:28/12-06-55
    assertion: Explains that an ordinary rigger’s vehicle control rig cannot handle CCSS and other
      rigged security-system protocols, requiring a protocol emulation module and remote-control deck
      to operate those interfaces.
    certainty: technical interpretation
  - printed_page: 79
    pdf_page: 80
    speaker: Blackflash
    timestamp: 10:29:20/12-05-55
    assertion: Notes that encrypted systems also require the subsequent catalog module; criticizes
      the number of separate components.
    certainty: technical interpretation with opinion
  - printed_page: 80
    pdf_page: 81
    speaker: Davis
    timestamp: 20:29:18/12-01-55
    assertion: Asks whether encrypted internal security-system protocols affect performance.
    certainty: question
  - printed_page: 80
    pdf_page: 81
    speaker: Paolo Picasso
    timestamp: 23:18:38/12-04-55
    assertion: Claims that protocol encryption has no measurable performance impact at either endpoint.
    certainty: attributed assertion, not verified fact
  - printed_page: 80
    pdf_page: 81
    speaker: Zardoz
    timestamp: 04:21:54/12-05-55
    assertion: Hypothesizes that a sufficiently complex encryption algorithm could slow down a security
      system unless its equipment used custom cryptographic chips.
    certainty: speculation, not a mechanic
  - printed_page: 80
    pdf_page: 81
    speaker: Nightfire
    timestamp: 09:10:51/12-06-55
    assertion: Offers a sarcastic endorsement of Zardoz’s proposed performance-limiting approach.
    certainty: sarcastic reaction
  - printed_page: 80
    pdf_page: 81
    speaker: Weiner
    timestamp: 21:41:40/12-07-55
    assertion: Responds sarcastically to Zardoz’s idea.
    certainty: sarcastic reaction
