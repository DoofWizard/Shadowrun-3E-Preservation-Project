data:
  source_period: Fall 2055
  provenance: In-world catalog reader conversation. Statements, arguments and speculation are attributed, not independent
    setting or rules facts.
  entries:
  - printed_page: 76
    pdf_page: 77
    speaker: New Nell
    timestamp: 21:19:12/12-05-55
    assertion: Asks whether CCSS enables a security rigger to sense tripped alarms and attempts to tamper with equipment.
    certainty: question
  - printed_page: 76
    pdf_page: 77
    speaker: Shriven
    timestamp: 04:18:44/12-06-55
    assertion: Says that tripped alarms are certainly sensed; detectable tampering depends on its skill and conspicuousness.
    certainty: reply/opinion
  - printed_page: 76
    pdf_page: 77
    speaker: Nightfire
    timestamp: 05:54:47/12-07-55
    assertion: Counters that sophisticated automated equipment could miss subtle signs of tampering while human
      senses and intuition might recognize them.
    certainty: contested interpretation
  - printed_page: 76
    pdf_page: 77
    speaker: Jurgen
    timestamp: 05:21:04/12-09-55
    assertion: Claims that CCSS coverage of many devices at a high-security facility lets the rigger monitor movements
      passively while directing other personnel or drones.
    certainty: tactical inference
  - printed_page: 77
    pdf_page: 78
    speaker: Yuri
    timestamp: 04:34:12/12-02-55
    assertion: Complains that the emulation tools are slow and expects a better alternative.
    certainty: opinion
  - printed_page: 77
    pdf_page: 78
    speaker: Ignorant and Proud
    timestamp: 10:58:15/12-03-55
    assertion: Recalls an acquaintance attributing the slowdown to interference or lack of a suitable signal interface
      in the cyberdeck; suggests translation into a symbolic protocol could be unsuitable, but states uncertainty.
    certainty: secondhand speculation
  - printed_page: 77
    pdf_page: 78
    speaker: Connie Casualty
    timestamp: 22:08:54/12-05-55
    assertion: Criticizes the previous speaker for presenting speculation without technical understanding.
    certainty: opinion
  - printed_page: 77
    pdf_page: 78
    speaker: Ignorant and Proud
    timestamp: 18:02:50/12-06-55
    assertion: Acknowledges not knowing the answer and objects to the criticism.
    certainty: response
  - printed_page: 77
    pdf_page: 78
    speaker: Treasure Seeker
    timestamp: 11:39:08/12-07-55
    assertion: Remarks dismissively on the exchange between commenters.
    certainty: opinion
  - printed_page: 78
    pdf_page: 79
    speaker: Hangfire
    timestamp: 02:18:56/12-02-55
    assertion: Speculates that the SCRE could let deckers override a rigged security system, questioning Ares’s
      purpose in selling it.
    certainty: hypothesis/question
  - printed_page: 78
    pdf_page: 79
    speaker: Teague
    timestamp: 21:17:30/12-06-55
    assertion: Says the intended use is a backup for the ICC; claims a decker could assume or maintain security-system
      control rapidly if the security rigger were unavailable.
    certainty: attributed claim
  - printed_page: 78
    pdf_page: 79
    speaker: Loki
    timestamp: 05:24:14/12-07-55
    assertion: Suggests the emulator could also serve as backup equipment during a difficult operation.
    certainty: hypothesis
  - printed_page: 79
    pdf_page: 80
    speaker: Gadfly
    timestamp: 09:20:18/12-02-55
    assertion: Sarcastically questions the stated diagnostic purpose of the protocol module.
    certainty: sarcasm/opinion
  - printed_page: 79
    pdf_page: 80
    speaker: New Nell
    timestamp: 03:29:15/12-05-55
    assertion: Asks whether Gadfly’s remark was sarcastic.
    certainty: question
  - printed_page: 79
    pdf_page: 80
    speaker: Taylor Tom
    timestamp: 20:52:28/12-06-55
    assertion: Explains that a conventional system-control rig does not handle CCSS and other contemporary security
      protocols, so a security rigger needs the module and remote-control deck.
    certainty: technical interpretation
  - printed_page: 79
    pdf_page: 80
    speaker: Blackflash
    timestamp: 10:29:20/12-05-55
    assertion: Notes that an encrypted system also needs the following catalog module.
    certainty: technical interpretation
  - printed_page: 80
    pdf_page: 81
    speaker: Davis
    timestamp: 20:29:18/12-01-55
    assertion: Asks whether encryption of internal security-system protocols affects performance.
    certainty: question
  - printed_page: 80
    pdf_page: 81
    speaker: Paolo Picasso
    timestamp: 23:18:38/12-04-55
    assertion: Claims that encryption has no measurable performance impact at either end.
    certainty: contested claim
  - printed_page: 80
    pdf_page: 81
    speaker: Zardoz
    timestamp: 04:21:54/12-05-55
    assertion: Speculates that very complex encryption might slow systems that lack specialized cryptographic chips.
    certainty: hypothetical
  - printed_page: 80
    pdf_page: 81
    speaker: Nightfire
    timestamp: 09:10:51/12-06-55
    assertion: Offers a brief sarcastic response to the proposed slowdown tactic.
    certainty: sarcastic opinion
  - printed_page: 80
    pdf_page: 81
    speaker: Weiner
    timestamp: 21:41:40/12-07-55
    assertion: Also criticizes Zardoz’s proposal sarcastically.
    certainty: sarcastic opinion
