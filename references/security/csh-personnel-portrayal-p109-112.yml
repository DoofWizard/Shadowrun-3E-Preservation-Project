headline: 'FASA Corporation, Corporate Security Handbook (FASA7118, 1995): fictional Second Edition security-personnel
  voices, printed pp109-112/PDF118-121'
summary: 'Source.fasa-7118, historical fictional Shadowrun tabletop GM guidance: five role portrayals (mage, rigger,
  specialist, investigator and magical-security specialist), with in-world sample dialogue separated from the book
  narrator’s commentary and existing exact NPC statistics.'
data:
  source_context:
    publication: Corporate Security Handbook
    publisher: FASA Corporation
    catalog_number: FASA7118
    copyright_year: 1995
    world: fictional Shadowrun Second Edition-era game
    source_section: Security Personnel
    reviewed_printed_pages: 109-112
    reviewed_pdf_pages: 118-121
  format_and_authorship:
    in_world_quote_status: Each entry includes an anonymous exemplar role quotation and shorter dialogue examples,
      presented by the book as playable NPC characterization rather than independently observed historical incidents.
    commentary_status: Separate unnamed publication commentary offers gamemasters a typical interpretation of the
      role; statements about corporations and their personnel are part of the fictional setting.
    statistics_separate: Full attributes, skills, gear, spells, cyberware, and ratings remain in existing NPC stat
      blocks; the present record does not supplement or override them.
  portrayal_examples:
  - role: Executive Protection Mage
    printed_page: 109
    pdf_page: 118
    quoted_character_voice: The sample female mage regards preserving lives as nobler than defeating enemies; she
      denies seeking the combat-mage role but admits willingness to use force when necessary.
    short_dialogue_cues:
    - Suggests magical action to force opponents into visibility.
    - Impatiently advises someone to remain still while a protective ward is arranged.
    publication_commentary: The book depicts her as an executive-protection specialist expected to balance protective,
      detecting and offensive magic, while also providing immediate magical medical aid.
  - role: Executive Protection Rigger
    printed_page: 110
    pdf_page: 119
    quoted_character_voice: The sample male rigger rejects being dismissed as a chauffeur; safe and timely transport
      under fictional danger is central to his professional identity.
    short_dialogue_cues:
    - Describes a coordinated two-vehicle escort.
    - Reports a pre-checked helicopter landing zone and readiness to leave.
    publication_commentary: The book assigns transport coordination across armored vehicles, drones, air and water
      transport to this role; the rigger takes pride in safely moving the team and dislikes the chauffeur label.
  - role: Executive Protection Specialist
    printed_page: 110
    pdf_page: 119
    quoted_character_voice: The sample male specialist considers shielding the client his job and states that he would
      absorb injury to keep the client safe rather than chase a fight.
    short_dialogue_cues:
    - Abruptly orders the client or escort party to get down, move, and duck.
    publication_commentary: The book describes the specialist as the protective core of an executive team, prepared
      to sacrifice himself for a client, while portraying him as a dedicated, trained professional rather than a stereotypical
      macho bodyguard.
  - role: Investigator
    printed_page: 111
    pdf_page: 120
    quoted_character_voice: The sample male investigator refers to the fictional corporation treating employees as
      assets and probes whether an employee is now a liability.
    short_dialogue_cues:
    - Claims allegiance to the corporation, as opposed to necessarily earning the interviewee’s personal trust.
    - Asks for a more precise account of a person’s activities on a named earlier day.
    publication_commentary: The source depicts investigators using espionage, interviewing, interrogation, and information
      gathering for personnel-related inquiries; it warns a questioned employee that the investigator may already
      know more than he reveals.
  - role: Magical Security Specialist
    printed_page: 112
    pdf_page: 121
    quoted_character_voice: The exemplar specialist displays exaggerated pride in protective wards, treats them as
      superior works of magical skill, and has a boastful, prickly manner.
    short_dialogue_cues:
    - May resist work outside a narrow self-described specialty such as wards, monitoring, or conjuring.
    - Alternatively declares willingness to summon every available spirit to protect an assigned location.
    publication_commentary: The source calls these specialists magically adept security personnel with narrow technical
      specialties, frequently wards, astral monitoring, or conjuring; it portrays some as egotistical and difficult
      but valuable enough that other security personnel tolerate them.
  assertion_boundaries: The quoted voices, suggested dialogue and generalizations are fictional role-playing portrayals,
    not established biographies of distinct individuals or evidence about real-world occupations.
