summary: Source-reviewed fictional Knight Errant execsec team structure from FASA Corporation’s Shadowrun Second Edition-era
  Corporate Security Handbook (FASA7118, 1995), printed pp60–61/PDF61–62. Preserves individual magician, astrally perceiving
  adept, decker, rigger, and protection-specialist functions; distinguishes three riggers in every team from an average three
  EPS staff and the one-escort-per-trip minimum. Historical 2055 fiction, not real-world instructions or newly derived SR3
  mechanics.
