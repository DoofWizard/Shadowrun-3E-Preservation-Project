    source_id: source.fasa-7118
    edition_period: Shadowrun Second Edition, fictional setting period 2055
    printed_pages: 60-61
    pdf_pages: 61-62
    imprint: Printed p3/PDF4
  speaker_and_status:
    speaker: Knight Errant in-world corporate-security service narrator
    epistemic_status: Published in-world description of that fictional provider’s executive-protection teams; not a claim
      about actual protective services or a new rule system
    section: EXECSEC TEAM PERSONNEL
  team_structure:
    printed_page: 60
    composition_varies: The source says each fictional executive-protection team is tailored to its client’s needs.
    every_team_roles:
    - team leader
    - security magician
    - physical adept
    - decker
    - riggers
    - executive-protection specialists
    recruiting_description: The provider describes its members as extensively trained and carefully screened; many are said
      to have prior security or intelligence work and assignments protecting fictional corporate leaders, public officials,
      or other public figures.
  team_leader:
    printed_pages: 60-61
    function: Oversees the team and its coordination, serves as liaison to the protected person and other security providers,
      and is available to answer the subject’s questions about the program.
  security_magician:
    printed_page: 61
    primary_function: Provides spell defenses for the subject.
    additional_responsibility: Oversees the magical-security measures within the subject’s comprehensive protection program.
  physical_adept:
    printed_page: 61
    required_in_provider_account: The narrator says every Knight Errant execsec team includes a physical adept with astral
      perception.
    duties:
    - Works with the security magician as the team’s observer in astral space.
    - Acts as an advance scout to examine locations the subject will visit.
    - Helps coordinate security measures with other providers.
  decker:
    printed_page: 61
    function: Acts as the team’s information specialist.
    duties:
    - Checks and rechecks the protected client’s reservations and itineraries.
    - Monitors local police, fire/rescue, and air-traffic communications.
    - Conducts background checks.
    - Oversees communications and surveillance components of the execsec program.
    provider_equipment_claim: Knight Errant says its team deckers have state-of-the-art cranial decks; no numeric hardware
      rating is provided here.
  riggers:
    printed_page: 61
    exact_count_in_every_team: 3
    training: Trained in evasive and aggressive driving and piloting techniques.
    vehicles_at_disposal: The narrator says most such riggers have access to a fixed-wing or rotating-wing aircraft, an armored
      limousine or another passenger vehicle, and a cargo vehicle.
    additional_training: Advanced mechanical training permitting the riggers personally to repair these vehicles.
    provider_equipment_claim: The book’s provider says its execsec riggers carry state-of-the-art cranial remote-control decks,
      without listed numerical equipment ratings.
  executive_protection_specialists:
    printed_page: 61
    average_count_per_team: 3
    abbreviation: EPSs
    role: Form the foundation of the fictional execsec team and perform numerous smaller tasks maintaining the protection
      program.
    specializations: Many, but not necessarily all, have expertise in counter-surveillance or intelligence gathering.
    provider_equipment_claim: The provider describes cyber enhancements, extensive training with advanced communications and
      combat equipment, without specific statistics.
  related_travel_capabilities:
    printed_page: 60
    provider_description: Transportation support includes trained riggers for aggressive driving and piloting, emergency medical
      techniques, armed and unarmed combat, and counter-surveillance.
    other_source_conditions: The same chapter also says at least one EPS accompanies the client on each journey; the source
      distinguishes that travel minimum from the average team staffing count of three EPSs.
  numerical_distinctions:
    three_riggers: Every team, as described by the provider.
    three_executive_protection_specialists: Average team, not a rule requiring exactly three.
    one_escort_per_trip: Minimum one EPS during each journey, from the immediately preceding source page.
    no_mechanics_claim: These are fictional staffing counts and provider descriptions; this passage does not supply die rolls,
      target numbers, damage codes, prices, Availability, or SR3 conversions.
