data:
  source_period: 'Fall 2055'
  attribution_type: 'In-world reader comments; assertions and opinions are not independent world facts or rules.'
  entries:
  - printed_page: 72
    pdf_page: 73
    speaker: Wedge
    source_timestamp: '21:36:59/12-01-55'
    assertion: 'Suggests directing a visible spotting beam toward a target could create glare and impair that target’s aim despite revealing the location of the light.'
    certainty: 'tactical opinion; scenario, not verified outcome'
  - printed_page: 72
    pdf_page: 73
    speaker: Trueheart
    source_timestamp: '05:48:34/12-06-55'
    assertion: 'Disputes Wedge’s assumption; cites flare compensation and the absence of visible glare from active infrared and ultraviolet lights.'
    certainty: 'counterargument'
  - printed_page: 72
    pdf_page: 73
    speaker: Tech
    source_timestamp: '21:47:30/12-09-55'
    assertion: 'States from purported experience that infrared sources can overwhelm thermographic vision.'
    certainty: 'anecdotal claim'
  - printed_page: 72
    pdf_page: 73
    speaker: Lando V.
    source_timestamp: '11:35:08/12-11-55'
    assertion: 'Contends a visible light beam can temporarily blind a target only when aimed directly at the head; keeping the beam narrow may also reduce detection of the light source.'
    certainty: 'tactical opinion, not a rules modifier'
  - printed_page: 73
    pdf_page: 74
    speaker: Toad
    source_timestamp: '20:08:26/12-08-55'
    assertion: 'Regards the maglock offering as straightforward.'
    certainty: 'opinion'
  - printed_page: 73
    pdf_page: 74
    speaker: Squint
    source_timestamp: '00:07:51/12-12-55'
    assertion: 'Claims numerous runners were killed after underestimating apparently straightforward maglocks.'
    certainty: 'unverified in-world anecdote'
  - printed_page: 73
    pdf_page: 74
    speaker: Twenton
    source_timestamp: '11:08:25/12-12-55'
    assertion: 'Questions Squint’s reported outcomes and asks how they occurred.'
    certainty: 'question, no factual endorsement'
  - printed_page: 73
    pdf_page: 74
    speaker: Squint
    source_timestamp: '02:21:17/12-13-55'
    assertion: 'Challenges readers to identify Type II versus Type IV maglocks visually; suggests apparent similarity can lead to dangerous misclassification.'
    certainty: 'cautionary claim, not a mechanical identification test'
  - printed_page: 74
    pdf_page: 75
    speaker: Wraith II
    source_timestamp: '02:24:45/11-30-55'
    assertion: 'Criticizes the ICC design for combining magical and technological systems.'
    certainty: 'opinion'
  - printed_page: 74
    pdf_page: 75
    speaker: Nightfire
    source_timestamp: '22:35:51/12-01-55'
    assertion: 'Rebuts Wraith II by arguing that the security industry is catching up with runner capabilities.'
    certainty: 'opinion'
  - printed_page: 74
    pdf_page: 75
    speaker: Hangfire
    source_timestamp: '20:17:43/12-04-55'
    assertion: 'Welcomes the increased challenge; describes a hypothetical ICC infiltration to retrieve an item and depart, in contrast to familiar security work.'
    certainty: 'hypothetical bravado, not an event'
  - printed_page: 74
    pdf_page: 75
    speaker: Uncle Vanos
    source_timestamp: '02:57:34/12-06-55'
    assertion: 'Asks whether Hangfire is being sarcastic.'
    certainty: 'question'
  - printed_page: 74
    pdf_page: 75
    speaker: Findler-man
    source_timestamp: '03:54:26/12-08-55'
    assertion: 'Maintains that Hangfire is sincere.'
    certainty: 'opinion about another speaker'
  - printed_page: 75
    pdf_page: 76
    speaker: New Nell
    source_timestamp: '20:54:38/12-05-55'
    assertion: 'Asks whether direct fiber-optic images would allow a magician elsewhere in a building to see a spell target remotely.'
    certainty: 'question, not an established rules claim'
  - printed_page: 75
    pdf_page: 76
    speaker: Shriven
    source_timestamp: '03:54:29/12-06-55'
    assertion: 'Agrees that remote optical viewing could be useful for spell targeting but cites fuzzy or dim images, cable-length constraints, and missing thermographic and low-light capability as drawbacks.'
    certainty: 'in-world interpretation and limitations'
  - printed_page: 75
    pdf_page: 76
    speaker: Nightfire
    source_timestamp: '05:54:47/12-07-55'
    assertion: 'Counters that a security mage may rely on personal cybereyes rather than separate thermographic or low-light devices.'
    certainty: 'opinion/counterargument'
  - printed_page: 75
    pdf_page: 76
    speaker: Leanna
    source_timestamp: '23:59:42/12-08-55'
    assertion: 'Reports firsthand difficulty casting through an optical link, including achieving symmetry and maintaining the linkage. Says a security mage using the link may see and cast at a target, but that the target may have better odds of avoiding damage while the mage faces a greater chance of rupturing a blood vessel from the effort.'
    certainty: 'anecdotal interpretation, not a source-specified numeric modifier'
