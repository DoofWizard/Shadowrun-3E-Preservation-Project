headline: 'Fictional Shadowrun RPG source audit — FASA Corporation, Corporate Security Handbook (FASA7118, 1995), Second Edition,
  source.fasa-7118, printed p58/PDF59: Knight Errant executive-threat classifications'
summary: FASA Corporation’s fictional Shadowrun Second Edition Corporate Security Handbook (FASA7118, 1995), source.fasa-7118,
  printed p58/PDF59. The Knight Errant in-world narrator separately classifies potential sources of danger and four broad forms
  of executive-security threat; these are source-era provider descriptions, not independent factual claims about real people or
  new game rules.
data:
  speaker_and_context:
    speaker: Knight Errant in-world corporate-security narrator
    printed_page: 58
    pdf_page: 59
    epistemic_status: provider threat taxonomy as published in a fictional tabletop RPG, not a verified enumeration of actual offenders
  source_listed_potential_attackers:
  - Corporate-backed operatives
  - Government-backed operatives
  - Terrorists
  - Organized-crime figures
  - Professional criminals
  - Opportunists
  - Common street thugs
  provider_classification_principle: The fictional provider says an executive’s work and physical environment affect which potential
    attacker categories might be relevant; it also discusses motive and possible methods as separate subjects.
  source_listed_forms_of_threat:
  - category: blackmail
    source_distinction: Demand for money or valuable information under threatened exposure of a past criminal act or discreditable
      information.
  - category: unfriendly extraction
    source_distinction: Forcible displacement of a person to pressure them to break or change ties to an employer, distinct from
      a demand for ransom.
  - category: kidnapping
    source_distinction: Seizing and detaining a person for ransom, which the fictional narrator says can involve money or information.
  - category: assassination
    source_distinction: Targeted killing, classified separately from coercive threats or detention.
  - category: physical threats
    source_distinction: Direct attacks on the executive or family, which the fictional narrator links to coercion for information
      or business decisions.
  source_narrator_economic_comparison: The book’s narrator claims that a completed blackmail, extraction, or kidnapping episode
    may harm an employing corporation more than replacing an executive killed in an attack; that comparison reflects the fictional
    corporate narrator’s priorities, not a universal assessment.
  mechanical_audit: Printed p58/PDF59 contains no new numeric die tests, target numbers, weapon damage, equipment cost, availability
    or legal rating in this material.
  related_existing_records:
  - references/security/csh-executive-protection-context-p54-61.yml
  - references/security/csh-executive-protection-claims-p54-61.yml
  supplement_rationale: The earlier context record mentions broad hazards but does not explicitly retain the source’s government-backed
    versus corporate-backed actor split, common street thugs, or the distinction between hostile extraction and ransom kidnapping.
