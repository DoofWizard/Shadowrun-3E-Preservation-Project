summary: "Corporate personnel security, investigations, intelligence operations and employee awareness."
data:
  overview:
    printed_page: 50
    terminology: "Personnel security, abbreviated persec."
    scope: "Corporate protection directed toward employee-related risk, workforce information, internal investigations, intelligence and counterintelligence."
    source_perspective: "Knight Errant service narration, not neutral evidence that every company follows these practices."
  investigations:
    printed_pages: "51-52"
    selection: "Employee background screening, periodic renewed screening and investigations of suspected incidents."
    methods_described: "Employment and reference histories, educational and financial records, interviews with former supervisors, colleagues and associates."
    conflict: "Corporate demand for specialized technical qualifications can compete with personnel-risk screening recommendations."
    narrator_caveat: "The text explicitly says screening cannot guarantee employee honesty or later behavior; the narrator claims repeated monitoring can reduce risk."
    listed_indicators: ["relationship instability", "frequent job moves", "declining earnings", "employment gaps", "unexplained recent employment or address information"]
    qualifier: "Indicators represent the narrator's screening categories, not automatically true diagnoses or game mechanics."
  intelligence_and_counterintelligence:
    printed_pages: "52-53"
    narrator_distinction: "Personnel security supports information gathering about rival organizations and protection of its own workforce from rivals' information-gathering."
    activities: ["assessing organizational threats", "briefing staff on potential contacts", "interviewing employees after unusual circumstances", "reviewing which employees may be targeted"]
    source_perspective: "The provider claims its work is generally protective; readers dispute the boundary."
  security_awareness:
    printed_page: 53
    formats: ["seminars", "films", "programs", "briefings"]
    stated_goals: ["teach workplace security practices", "explain potential threats", "respond to security incidents", "maintain communications between staff and protection teams"]
    provider_position: "Knight Errant describes tailoring programs to client requirements."
  mechanical_audit:
    supplied_in_range: "No numeric SR3 tests, target numbers, damage codes, dice pools, character options or tables are presented in the reviewed pages."
