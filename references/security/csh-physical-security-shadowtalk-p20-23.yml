framing: newsroom_neutral
headline: 'Fictional Shadowrun Second Edition — FASA Corporation Corporate Security
  Handbook (FASA7118, 1995), source.fasa-7118, printed pp20–23/PDF21–24: attributed
  physical-security Shadowtalk claims'
summary: Nineteen independently source-reviewed in-world Shadowtalk comments concerning
  mechanical keys, injury-versus-capture debates, alleged corporate weapons and gas
  hazards, employee safety, and fictional guard-animal augmentation. Questions, sarcasm,
  hearsay and source-specific timestamp anomalies remain attributed and distinct from
  Knight Errant narration.
data:
  publication:
    title: Corporate Security Handbook
    publisher: FASA Corporation
    publication_year: 1995
    catalog_number: FASA7118
    source_id: source.fasa-7118
    fictional_property: Shadowrun tabletop role-playing game
    edition: Second Edition source period, not a new SR3 rule
    printed_pages: 20-23
    pdf_pages: 21-24
  epistemic_status: Named in-world Shadowtalk remarks and allegations, not publication
    narrator facts, observed real-world claims, or automatic game mechanics.
  claims:
  - printed_page: 20
    speaker: Houdini
    source_timestamp: 12:16:31/12-12-55
    statement: Humorously says the preceding discussion of mechanical locks interferes
      with a favorite trick; supplies no independent technical assertion.
  - printed_page: 20
    speaker: Whisper
    source_timestamp: 03:06:15/10-21-55
    statement: Challenges the assurance that employees will keep keys secret; alleges
      that an authorized key-holder could be coerced into disclosure by threats of
      severe harm, rather than describing freely given consent.
  - printed_page: 21
    speaker: Zeevo
    source_timestamp: 11:08:20/10-6-55
    statement: Objects that firing a miniature machine gun at an intruder is inconsistent
      with the provider’s claimed intention merely to incapacitate; rhetorical challenge,
      not a confirmed event.
  - printed_page: 21
    speaker: Careful Out There
    source_timestamp: 09:04:45/10-6-55
    statement: Alleges that corporations sometimes use sharp monowire netguns which
      may cause serious cuts, contesting Knight Errant’s depiction of supposedly harmless
      polymer-fiber nets; the claim is unverified.
  - printed_page: 21
    speaker: Snake
    source_timestamp: 11:09:56/9-30-55
    statement: Sarcastically imagines lethal responses by company personnel using
      monowire or laser weapons; this is criticism of the provider’s methods, not
      evidence of a particular use.
  - printed_page: 21
    speaker: Reality Czech
    source_timestamp: 12:50:24/10-1-55
    statement: Replies that corporations may prefer a living detainee for questioning;
      this claimed motive is distinct from the original lethal-use sarcasm and is
      not an established universal policy.
  - printed_page: 22
    speaker: Naderboy
    source_timestamp: 24:00:01/10-23-55
    statement: Sarcastically criticizes the claim that monowire injury can be excused
      by corporate legal resources; the unusual 24:00:01 timestamp is preserved as
      printed.
  - printed_page: 22
    speaker: GHW Bush
    source_timestamp: 22:03:05/10-24-55
    statement: Satirically advocates corporate productivity over litigation and workplace
      injury claims; satire attributed to this in-world commenter, not narrator or
      real-world factual guidance.
  - printed_page: 22
    speaker: Naderboy
    source_timestamp: 24:08:11/10-23-55
    statement: Disputes the provider’s description of gas-related harm as nonpermanent,
      arguing that impairment could cause lasting suffering; personal criticism, not
      a clinical finding.
  - printed_page: 22
    speaker: Ballybeg
    source_timestamp: 20:02:35/9-5-55
    statement: Recounts an unverified alleged corporate workplace anecdote about an
      exposed worker and a later fatal allergic reaction; expressly a speaker’s report,
      not confirmed effect or universal rule.
  - printed_page: 22
    speaker: Beavis II
    source_timestamp: 09:20:54/9-15-55
    statement: Jokes about allergy precautions in response to Ballybeg’s fatal-reaction
      anecdote; does not supply substantive medicine or game mechanics.
  - printed_page: 22
    speaker: Careful Out There
    source_timestamp: 12:55:42/9-16-55
    statement: Warns that reactions to a fictional sedating compound may depend on
      chemical identity; this is speculation, not a toxicity rating or recipe.
  - printed_page: 22
    speaker: U. Sinclair
    source_timestamp: 00:30:34/11-6-55
    statement: Sarcastically minimizes deaths of corporate workers while discussing
      bright-light and high-volume sound devices; character opinion, not evidence
      such harm is accepted policy.
  - printed_page: 22
    speaker: Rainbo
    source_timestamp: 01:00:20/11-8-55
    statement: Warns that working near higher-security operations may carry serious
      risks for ordinary employees despite assurances; interpretive concern, not narrator
      fact.
  - printed_page: 22
    speaker: Echo Mirage
    source_timestamp: 12:16:11/01-05-56
    statement: Jokes that computers have not replaced security personnel; comment
      follows the guard-staffing discussion and does not establish a technology rule.
  - printed_page: 23
    speaker: Zeevo
    source_timestamp: 06:15:48/12-22-55
    statement: Jokingly tells the security provider not to be overly proud of its
      guards; an in-world reaction, not a separate equipment or historical claim.
  - printed_page: 23
    speaker: Slag
    source_timestamp: 08:15:41/12-14-55
    statement: Questions whether cybernetic augmentation of guard animals is possible
      and says the idea was thought impossible; the statement is a question, not an
      established rule.
  - printed_page: 23
    speaker: Wraith II
    source_timestamp: 08:25:46/12-14-55
    statement: Alleges that multiple security providers have experimented with cybernetic
      guard-animal augmentation and claims these attempts made animals dangerously
      aggressive; unverified in-world report, not accepted universal animal rules.
  - printed_page: 23
    speaker: Dybbuk
    source_timestamp: 08:29:31/12-14-55
    statement: Responds that certain corporations might perceive the reported animal
      aggression as beneficial; speculative value judgment, not proof of use.
  mechanics_scope: No additional target numbers, game dice, injury ratings, animal
    statistics or tested effects are established by these remarks; separate earlier
    equipment records retain source numbers.
