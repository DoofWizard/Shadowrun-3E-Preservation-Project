summary: "Historical magical-security departments, protective technologies and system relationships."
data:
  overview:
    pages: "34-37"
    setting: "The Awakening challenged existing corporate protective systems. Organizations subsequently established specialist magical-security departments, and paired trained personnel with new technologies."
    provider: "Knight Errant describes a combined technological and magical program. Its comparative marketing claims are not independently established."
  protection_categories:
    pages: "36-40"
    barrier_spells: "Temporary sustained and permanent anchored forms are distinguished. Wards differ from physical barriers."
    vegetation: "Living walls use ivy, moss and engineered plants; induced systems vary in maintenance and expense."
    restraints: "Living nets and mesh are engineered biomaterial systems described for astral containment."
    optical_networks: "Fiber-optic observation links remotely located security magicians with protected locations; the narrator dates application to the late 2040s."
    airborne_bacteria: "BacteriTech, described as an Ares Security International subsidiary, supplies FAB and UV-responsive FAB-UV systems. Their physical and astral properties are discussed separately."
    biological_storage: "The book distinguishes storage-life requirements from post-release life expectancy."
  alarm_and_staffing:
    pages: "40-43"
    linked_spells: "Anchored detection and secondary magical effects are distinguished from conventional alarm devices."
    departments: [guards_and_wards, physical_defenses, research, special_assignments]
    personnel: "Mage and shaman roles are distinguished; the provider discusses watchers, elementals and nature spirits and their respective limitations."
  mechanics: "Quantitative attributes, precise conditions and claims are retained in separately classified records."
