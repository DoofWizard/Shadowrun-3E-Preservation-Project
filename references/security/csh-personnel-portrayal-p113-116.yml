summary: 'Source.fasa-7118, published fictional tabletop RPG reference, printed pp113-116/PDF122-125: sample voices and source-narrator
  descriptions for 5 security roles; existing mechanical NPC stat records remain separate.'
data:
  source_context:
    publication: Corporate Security Handbook
    publisher: FASA Corporation
    catalog_number: FASA7118
    publication_year: 1995
    game_lineage: Historical fictional Shadowrun Second Edition-era sourcebook; not a Third Edition rules conversion
    section: Security Personnel
    printed_pages: 113-116
    pdf_pages: 122-125
  editorial_distinctions: The named roles are generic fictional tabletop archetypes, not identified real individuals. Opening
    first-person speeches and QUOTES are sample character voices; COMMENTARY is the unnamed book narrator. Exact numerical
    NPC statistics remain in existing rules/security records.
  portrayals:
  - role: Magical Security Engineer
    printed_page: 113
    pdf_page: 122
    exemplar: An explicitly mundane researcher praises theory, physical science, practical experimentation, and understanding
      magic over simply casting spells; the voice wishes to counter magical attacks.
    sample_speech: The exemplar calls for repeated chart analysis and rebukes a colleague for treating a summoned spirit as
      a laboratory spectacle.
    narrator: Magical-security engineers are described as nonmagical scientists, sometimes mocked by spellcasters, who design
      both technical support for magicians (fiber-optic viewing systems) and magical countermeasures (bacterial containment
      grids).
  - role: Personnel Security Specialist
    printed_page: 114
    pdf_page: 123
    exemplar: The role voice denies being a spy, justifying investigation as maintaining a satisfied and loyal workforce.
    sample_speech: Sample internal surveillance questions concern an employee’s repeated doctor visits and two named employees’
      time together; these are fictional workplace observations, not verified incidents.
    narrator: The fictional perSec division handles routine background checks on applicants, employees and business associates,
      monitors work habits, and gives security clearances.
  - role: Security Commander
    printed_page: 115
    pdf_page: 124
    exemplar: A female veteran claims combat experience, earned authority and knowledge of how to fight criminal and runner
      groups.
    sample_speech: The exemplar orders subordinates to wait for her signal, sends a drone and two guards to an unresponsive
      sector, and rejects excuses after an unsuccessful tail.
    narrator: The commander is a scarred frontline survivor who directs all forces on patrol, interprets security as warfare,
      and is depicted as determined to win.
  - role: Security Decker
    printed_page: 116
    pdf_page: 125
    exemplar: A female Matrix defender boasts of fighting intruders within her own nodes, using violently aggressive virtual
      metaphors rather than a verified encounter.
    sample_speech: An example references black IC; another reports investigating a newly activated dummy terminal in a research
      area.
    narrator: The role monitors the company Matrix, its IC and defenses, checking for break-ins, internal anomalies, and internal
      usage.
  - role: Security Executive
    printed_page: 116
    pdf_page: 125
    exemplar: A male security director emphasizes protecting the fictional corporation, employee confidence and board understanding
      of security funding.
    sample_speech: The exemplar proposes strengthening magical barriers around Project T-771 in Warehouse 9 and, separately,
      proposes more checkpoints and guard animals instead of only buying a faster security rigger.
    narrator: Unlike most division colleagues, the executive has never served on the front line; his expertise is organization,
      budgets and boards, and he oversees allocating resources and responses to serious breaches.
