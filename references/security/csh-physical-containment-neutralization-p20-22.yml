headline: 'Fictional Shadowrun Second Edition — FASA Corporation Corporate Security
  Handbook (FASA7118, 1995), source.fasa-7118, printed pp20–22/PDF21–23: Knight Errant
  containment and neutralization descriptions'
summary: Source-reviewed archival reference to the fictional Knight Errant narrator’s
  distinction between detaining intruders and injuring them, including containment
  barriers, netguns, armed defenses, fictional incapacitating agents, light and sound;
  separate attributed speakers are not represented as narrator facts.
data:
  source_context:
    publication: Corporate Security Handbook
    publisher: FASA Corporation
    publication_year: 1995
    catalog_number: FASA7118
    source_id: source.fasa-7118
    property: Shadowrun fictional tabletop role-playing game
    edition: original historical Second Edition-era, set in 2055; no inferred Third
      Edition conversion
    printed_pages: 20-22
    pdf_pages: 21-23
    source_chapter: Physical Security — Containment and Neutralizing
  attribution: The book is a fictional in-world Knight Errant corporate-service presentation;
    claims about safety, legality, device performance and methods are attributed to
    that provider rather than established as independent real-world facts or game
    resolution rules.
  boundary:
    printed_p20: The source places containment and neutralization after its preceding
      physical-lock discussion; the latter is independently represented in the earlier
      broad physical-security record.
    distinct_goal: Containment delays or captures an intruder, whereas neutralization
      temporarily incapacitates or, in more severe measures, may inflict permanent
      injury or death. These different consequences must not be merged.
  containment_measures:
    printed_page: 21
    shutters: Knight Errant describes heavy steel or ballistic-composite shutters
      closing over doorways after sensors indicate a presence; the provider portrays
      them as delaying escape until personnel arrive, not as a guaranteed result or
      mechanical Test.
    netguns: The narrative describes overhead devices releasing strong polymer-fiber
      nets to immobilize intruders and distinguishes the claim that such confinement
      is intended not to injure from a reader’s separate allegation of serious harm.
      No damage rating, Strength Test or release timing is supplied.
    other_devices: Gun ports and laser mazes are described as additional options,
      with laser mazes commonly combined with other containment equipment.
  neutralization_measures:
    printed_pages: 21-22
    provider_distinction: The Knight Errant narrator describes some responses as temporary
      incapacitation and others as severe physical injury; the source does not describe
      all neutralization as nonlethal.
    laser_maze_risk: The narrator explicitly states that monowire mazes may permanently
      injure or kill, warns about disputes with surviving relatives and legal consequences,
      and presents purported favorable precedents as its own corporate position, not
      a legal determination.
    fictional_knockout_agent: The narrator calls sedating gas another option and claims
      some formulations act rapidly, with limited lingering effects; it separately
      describes circulation, affected-area size and personnel proximity as operational
      constraints. No recipe, concentration, delivery procedure, saving throw or damage
      statistic is supplied.
    safety_dispute: The claimed absence of lasting injury is contradicted by separately
      attributed reader accounts of medical harm and fatal allergic reaction. These
      allegations are not proof of universal outcome.
    light_and_sound: The provider also discusses bright lighting near cameras, deliberately
      flooding dark areas with light, and white-noise devices. Its text says these
      may disorient an intruder but also acknowledges risk to legitimate employees,
      particularly with high sound levels; no numeric thresholds are given.
  absence_of_mechanics: No target numbers, dice rolls, damage codes, precise gas quantities
    or purchase prices are printed in this subsection; these descriptions are historical
    in-world setting information, not newly authored SR3 mechanics.
