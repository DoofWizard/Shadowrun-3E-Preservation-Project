summary: 'Source-image-reviewed historical fictional sourcebook corrections: elemental sustaining alternative, ward passage distinctions, living restraint conditions, and detection-linked magical alarm scope. No automatic SR3 conversion.'
data:
  provenance:
    source_pdf_sha256: a956f6f4593e49073f3dc8c23af15f53095c8a436ea0af4ab80af3d0a9a59066
    narrator: Knight Errant fictional corporate account
    corrects_path: references/security/csh-magical-security-systems-p34-43.yml
    reviewed_prior_blob: 7b372e8873bdcef29be35bf48c6be295b9ac27fe
  barrier_sustaining:
    printed_page: 36
    pdf_page: 37
    source_fact: Some magicians can instruct an elemental to sustain a temporary barrier spell; the narrator considers this an inefficient allocation of spirit resources.
    canonical_gap: Prior barrier-spells role describes caster occupation but omits the stated elemental alternative.
    limits: No specific service cost, Force, dice modifier or Drain value is given here. Do not replace SR3 spirit-sustaining rules.
  wards:
    printed_page: 37
    pdf_page: 38
    source_fact: The narrator says wards prevent astral forms and spirits from passing and offer some protection against spells crossing them, without impeding physical counterattacks.
    canonical_gap: Prior ward scope omits explicit astral passage and physical counterattack distinctions.
  living_restraints:
    printed_page: 38
    pdf_page: 39
    source_fact: A living net's own mass pulls the enclosed astral form or spirit to the ground and immobilizes it; the narrator does not specify a separate anchoring requirement.
    operator_condition: The narrator describes an astrally perceiving wielder or ultraviolet bacteria with appropriate detection equipment as alternatives, qualified as almost always necessary for difficult aiming and use.
    canonical_correction: Replace the prior described-effect implication that the net is secured to the ground and the prior operation implication that astral perception is strictly required.
  linked_magical_alarms:
    printed_page: 40
    pdf_page: 41
    source_fact: A location-anchored detection spell activates its linked secondary spell or spells when it senses an intruder's presence. Secondary spells can affect a specific target or all targets in an area.
    canonical_correction: Prior architecture structure restricts the trigger to astral intrusion; the printed narrator does not specify that restriction. Detection-spell eligibility still depends on the spell used.
    limits: No universal detection target number or spell effect rating is supplied in this passage.
  source_review:
    source_images: [37, 38, 39, 40, 41]
    comparisons: Existing source-specific systems and equipment attributes reviewed; accepted 2,500-meter attributed claim and two-spell/one-link minimum retained by reference rather than duplicated.
    scope: Narrator description only. In-world comments remain separate. No full chapter closure or new SR3 rules claimed.
