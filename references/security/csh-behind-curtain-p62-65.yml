    claimed_origin: Mindfire says the passage came from a diary file taken without the diary owner's permission
      from a guard at an unnamed major corporation. Authenticity is not independently established.
  site:
    source_pages: 62-65
    name: unnamed major corporation research-and-development building
    restricted_facility: classified research laboratories and weapons laboratory
    control_center: Integrated Control Center (ICC)
  characters:
  - name: Max / Dr. Maximillian, Th.D.
    role: narrating night-shift magical security specialist employed by Knight Errant
    source_pages: 64-65
