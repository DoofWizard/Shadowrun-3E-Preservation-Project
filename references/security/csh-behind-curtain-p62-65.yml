  chronology:
  - time_24h: '22:30'
    page: 62
    event: At roll call, the captain warns personnel of an intelligence tip indicating an attempted entry into the
      research-and-development building that night. No suspects or specific method are identified.
  - time_24h: '23:00'
    page: 64
    event: The magical-security shift changes at the ICC. Max relieves the evening mage and starts a facility patrol.
  - time_24h: '23:04'
    page: 64
    event: Max reports temporarily deactivating the Bacterial Containment Grid in zones 1 through 5 for an astral
      patrol, then arranges for its reactivation.
  - time_24h: 01:17
    page: 64
    event: Eyes-in-Walls checks a Zone 3 perimeter indication with Drone 1 and records a false alarm.
  - time_24h: 02:00
    page: 64
    event: Max astrally checks building wards including secure laboratory areas and reports no apparent abnormality.
  - time_24h: 02:51
    page: 64
    event: Another Zone 3 indication is checked and recorded as a false alarm; Cray finds no unusual Matrix activity.
  - time_24h: 03:52
    pages:
    - 64
    - 65
    event: Cray reports a passive Matrix alert and checks the public-access and private-access SANs; the apparent
      public access attempt was unsuccessful.
  - time_24h: 04:21
    page: 65
    event: The perimeter alarm recurs; a maintenance note is left to review sensor sensitivity.
  - time_24h: 04:36
    page: 65
    event: A Bacterial Containment Grid trigger prompts heightened security. Max reports deployment of the grid
      in zones 1 through 3 and 5; Cray checks the Matrix and Eyes-in-Walls directs drones. The team investigates
      an actual unauthorized entry.
  systems_depicted:
  - pages: 64-65
    system: Bacterial Containment Grid (BCG)
    description: The vignette shows zone-specific disengagement during authorized astral movement and later activation
      in response to a facility alert. This is a fictional operational illustration, not a timing, Force or activation
      Test rule.
  - pages: 64-65
    system: watcher spirit
    description: Max calls Little Billy to watch for astral entrants and to activate an alarm in a contingency.
  - page: 64
    system: wards
    description: Max checks wards around laboratories during astral patrol.
  - pages: 64-65
    system: perimeter drones and sensors
    description: A security rigger investigates repeat Zone 3 alerts, including false positives, and responds after
      a confirmed entry.
  - page: 65
    system: Matrix access security
    description: A decker distinguishes attempted public-access SAN activity from access to a private SAN.
  - page: 65
    system: living bacterial barrier
    description: Max describes two-centimeter gaps within the walls and ceilings filled by astrally responsive organisms.
      One intruder is depicted as confined behind a barrier; the anecdotal description is not a universal mechanical
      specification.
  resolution:
    page: 65
    summary: Max encounters the elf intruder behind a living containment barrier, refuses to release the person
      and remains on duty pending further response. Other personnel continue the facility response.
    certainty: As narrated in an unverified dramatic account.
  visual_pages:
    printed_page_63: Full-page illustration of ICC personnel at work; no rules table or new printed mechanics.
