  premise; separate rules retain their exact mechanics.'
data:
  source_context:
    publication: Corporate Security Handbook
    publisher: FASA Corporation
    catalog_number: FASA7118
    copyright_year: 1995
    setting: fictional Shadowrun Second Edition-era tabletop roleplaying
    printed_page: 104
    pdf_page: 113
    section: 'Gamemaster Information: Fat Bacteria note; Defeating a Security System (Roleplaying and Combining
      Dice Rolls and Roleplaying)'
  fab_complexity_note:
    voice: unnamed publication gamemaster note
    recommendation: The book cautions that introducing FAB into the tabletop game adds conceptual complexity.
    condition: The GM note recommends using FAB only when both the gamemaster and all players fully understand how
      it works.
    distinction: This optional playability recommendation does not repeal the separate printed FAB game rules.
  security_scene_resolution_options:
    voice: book gamemaster guidance, not in-world testimony or an obligatory rule
    methods:
    - abstract skill-dice resolution
    - roleplayed scene resolution
    - a combination of dice and roleplaying
    dice_rules_separate: Exact dice tests and Overall Security Level requirements appear in the separately indexed
      rules/security/csh-gm-system-resolution-p104-105.yml.
    roleplay_option: The book says gamemasters may let players roleplay past systems or components rather than rely
      exclusively on abstract dice.
    high_security_qualification: The author notes that certain high-security devices, including FAB, can be almost
      impossible to bypass with dice alone in the game; narrative approaches may instead make sense.
    illustrative_narrative_hooks:
    - The fictional team might encounter a knowledgeable designer of the target security system.
    - An unhappy employee might appear in the scenario and become a possible point of entry.
    scenario_status: These are optional, hypothetical story hooks, not established events or universally successful
      methods.
  combining_methods:
    suggested_use_of_dice: The book recommends abstract dice for uncomplicated components and lower-security fictional
      locations.
    suggested_use_of_roleplay: It recommends more roleplaying when alarms are raised or the characters attempt entry
      into a higher-security site.
    table_priority: The book emphasizes an enjoyable process for the gamemaster and players rather than a mandatory
      single resolution style.
  fictional_corporate_capture_note:
    speaker: unnamed book gamemaster narrator
    claim: The book remarks that most corporations in the setting regard shadowrunners as assets to be captured
      rather than killed.
    stated_reason: A captured fictional shadowrunner may disclose more information to a corporation than a dead
      one.
    scope_and_certainty: Broad setting-level generalization made by the source narrator, not a statement about every
      corporation, every operation, or any real-world organization.
framing: newsroom_neutral
