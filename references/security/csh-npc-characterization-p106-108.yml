  source_section: Security Personnel, printed pages 106-108
  chapter_use:
    purpose: NPC descriptions and direct-character speech help the gamemaster portray security personnel as distinct characters.
    typical_department: A corporate security department in the fictional setting.
    stat_and_gear_context: Attributes and skills are specific profile values; equipment is usually left to gamemaster selection as appropriate.
    contact_reference: Shadowrun Second Edition, printed page 200.
  characterization_examples:
    executive_protection_adept:
      source_printed_page: 107
      character_voice: Presents protection as a matter of honor, experience, stealth, speed, and magical senses.
      interaction_cues:
      - Reconnoiters an area before permitting the escort party to enter.
      - Can express a strong intuitive concern without identifying its source.
      scenario_role: Specialist advance member of an executive-protection team; notices developments in physical and astral settings before the client arrives.
    executive_protection_decker:
      source_printed_page: 108
      character_voice: Treats information gathering and selective misinformation as parts of the fictional protection role.
      interaction_cues:
      - Reassures the client that logistical arrangements are complete.
      - Reports that requested information was obtained and specified information was deleted.
      scenario_role: Monitors the client's reservations, contacts, business matters, schedule, public access, and communication context.
      optional_behavior:
      - In the source's fictional portrayal, may plant misinformation.
      - May monitor police, rescue, and air-traffic communication frequencies.
  rules_status: Portrayal guidance is descriptive, not additional target numbers, modifiers, or equipment statistics.
  lineage: Source-specific NPC characterization; no inferred later-edition conversion or replacement.
