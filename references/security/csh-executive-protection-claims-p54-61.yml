framing: newsroom_neutral
summary: 'FASA Corporation, Corporate Security Handbook (FASA7118, 1995), fictional Shadowrun Second Edition, source.fasa-7118,
  printed pp54-61/PDF55-62: separately attributed, historically sourced Shadowtalk commentary on executive protection,
  coercion, privacy, corporate rivalry and liability.'
data:
  epistemic_status: attributed_in_world_commentary
  editorial_attribution: All entries are distinct statements or jokes by named fictional Shadowtalk participants,
    not confirmed narration or game rules.
  claims:
  - page: 54
    participant: Dreyfus
    timestamp: 04:26:13/11-11-55
    position: Questions whether corporations value employee welfare beyond the cost of death, injury, and replacement;
      this is the speaker’s skeptical interpretation of the fictional source’s company rationale.
  - page: 54
    participant: Bill B.
    timestamp: 02:16:54/11-12-55
    position: Responds that shareholder confidence, recruitment, corporate reputation, and profits—not personal
      concern—explain spending on executives and other employees.
  - page: 56
    participant: Ratboy
    timestamp: 13:35:56/11-12-55
    position: Says he has heard, without participating himself, allegations that some fictional corporations hire
      terrorists or criminals to harass competing corporations; he does not claim universal practice.
  - page: 56
    participant: Dreyfus
    timestamp: 12:23:43/11-13-55
    position: Asks whether such alleged proxy harassment would lead to outright warfare between corporations.
  - page: 56
    participant: Ratboy
    timestamp: 12:40:32/11-13-55
    position: Replies that he believes these extreme cases are uncommon, allegedly carried out by outside contractors,
      and not publicly acknowledged by firms embarrassed about insufficient protection; unverified in-world assertion.
  - page: 56
    participant: Dreyfus
    timestamp: 12:16:23/11-16-55
    position: Asks why Knight Errant’s claim to assume liability for its security personnel would reassure rather
      than frighten prospective clients.
  - page: 56
    participant: Emma Li
    timestamp: 12:20:24/11-16-55
    position: Alleges that at a Unicom–larger-manufacturer business meeting, security personnel were not warned
      a visiting vice-president would arrive late, mistook him for the fictional terrorist Rory O’Callaghan, rejected
      his identification and assaulted him; the larger company allegedly sued Unicom, resulting in a multimillion-nuyen
      settlement. This is an unverified participant account.
  - page: 56
    participant: Banacek
    timestamp: 16:23:10/11-18-55
    position: Responds sarcastically to Emma Li’s account by counseling politeness and answering questions posed
      by security personnel.
  - page: 56
    participant: Brainiac
    timestamp: 14:02:06/11-25-55
    position: Criticizes Knight Errant’s claimed offender database as potentially outdated, including intrusive
      personal dossiers, and sarcastically suggests that such information could appeal to illicit buyers; an in-world
      reader comment, not a verified database assessment.
  - page: 57
    participant: BeBop
    timestamp: 14:10:56/11-16-55
    position: Alleges that a group of fictional shadowrunners posing as a small security firm abducted Dr. Martin
      Wankov, a Mitsuhama Computer Technologies executive, during a Honolulu vacation after Knight Errant personnel
      subcontracted protection; this is the participant’s account, not an independently established fact.
  - page: 57
    participant: Bettina
    timestamp: 03:06:10/11-18-55
    position: Reports hearing that the same group allegedly used a skilled decker to insert fabricated security-firm
      credentials into Knight Errant’s database, after which Knight Errant personnel entrusted Wankov to the impostors;
      unverified secondhand allegation.
  - page: 57
    participant: Depraved in Des Moines
    timestamp: 05:15:36/11-22-55
    position: Jokes that he had not realized aspects of his private life might expose him to blackmail, in response
      to the book narrator’s discussion of executive vulnerabilities.
  - page: 57
    participant: Vesparius
    timestamp: 06:17:23/11-22-55
    position: Replies sarcastically that public knowledge of someone’s stigmatized private conduct leaves little
      concealed information to use as blackmail; the speaker is teasing the preceding commenter, not stating a general
      fact.
  - page: 57
    participant: S.
    timestamp: 10:17:30/11-22-55
    position: Alleges that an acquaintance profited by blackmailing a former senior Fuchi executive about sexual
      activity with a paid companion associated with the blackmailer’s friend; the allegation concerns extortion
      and paid sexual services, not a verified employment dispute.
  - page: 57
    participant: Krusader
    timestamp: 08:12:14/11-23-55
    position: Alleges that some fictional corporations furnish executives with corporation-approved female and male
      paid sex workers, both to limit external blackmail exposure and to retain leverage in salary negotiations;
      attributed in-world claim, not a universal policy.
  - page: 57
    participant: Bettina
    timestamp: 04:17:21/11-20-55
    position: Speculates that travel to unfamiliar destinations and small or complacent protection teams raise vulnerability
      for fictional executives, referring back to BeBop’s allegation; not a verified assessment.
  - page: 58
    participant: Arbeghast
    timestamp: 06:15:52/10-30-55
    position: Warns fictional shadowrunners that security analysts may infer patterns from repeated behavior even
      when individual acts appear obscure; speaker’s caution, not a game-rule procedure or real-world evasion guidance.
  - page: 58
    participant: Dreyfus
    timestamp: 03:16:33/11-02-55
    position: Questions how blackmail or kidnapping of an executive could inflict greater harm on an employer than
      the person’s death.
  - page: 59
    participant: Kommando
    timestamp: 03:24:36/10-02-55
    position: Responds with a hypothetical in which threats against a senior employee coerce disclosure of confidential
      software designs, acquisition plans, and strategic decisions, causing serious employer losses even while that
      employee lives; distinguishes coercion, disclosure, and corporate loss.
  - page: 59
    participant: Dreyfus
    timestamp: 03:31:10/11-02-55
    position: Replies that the preceding hypothetical is chilling; a brief reaction, not independent evidence.
  - page: 59
    participant: Lenny
    timestamp: 03:33:22/11-02-55
    position: Sarcastically characterizes the fictional corporate coercion described above as routine corporate
      business.
  - page: 60
    participant: Macfly
    timestamp: 07:24:16/11-05-55
    position: Claims associates tried to abduct a fictional Renraku researcher for ransom but encountered a purported
      Knight Errant protective ambush and were never heard from afterward; unverified account preserving the associates’
      attempted abduction and the alleged protective response.
  - page: 60
    participant: King E.
    timestamp: 09:25:10/11-19-55
    position: Alleges that Knight Errant executive-protection teams may preemptively kill people they suspect of
      planning attacks, and warns that publicly boasting about such actions draws the team’s attention; unverified
      in-world participant allegation, not a real-world recommendation.
  - page: 61
    participant: Mako
    timestamp: 11:12:31/11-29-55
    position: Emphasizes that Knight Errant executive-protection specialists are unusually capable and well-resourced
      fictional adversaries, rather than dismissible generic security personnel.
headline: 'Fictional tabletop-RPG archival record: FASA Corporation, Corporate Security Handbook (FASA7118, 1995),
  original Second Edition, source.fasa-7118, printed pp54–61/PDF55–62, source-reviewed executive-protection attributed
  claims'
