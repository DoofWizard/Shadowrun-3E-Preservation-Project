data:
  epistemic_status: attributed_commentary_not_established_setting_fact
  discussion:
    - {printed_page: 50, participant: Slag, timestamp: "09:06:45/11-29-55", position: "Disputes the provider's portrayal of employee protection as an entirely selfless practice."}
    - {printed_page: 50, participant: Papa, timestamp: "09:10:34/11-29-55", position: "Emphasizes the corporate interest underlying workplace protection."}
    - {printed_page: 51, participant: Suit, timestamp: "22:01:40/10-24-55", position: "Questions whether workplace investigations make reasonable distinctions between normal personal conduct and genuine organizational risk."}
    - {printed_page: 51, participant: Neuron Surfer, timestamp: "23:08:55/10-24-55", position: "Attributes some employer practices to extensive initial screening."}
    - {printed_page: 51, participant: Suit, timestamp: "23:13:56/10-24-55", position: "Alleges company oversight extends into employees' ordinary movements, communications and personal routines."}
    - {printed_page: 51, participant: Dark Justice, timestamp: "22:09:22/11-11-55", position: "Argues that repeated review may itself pressure a worker despite a lack of findings."}
    - {printed_page: 52, participant: The Chromed Accountant, timestamp: "10:34:56/12-01-55", position: "Describes a tension between standardized specialist recruitment and risk screening."}
    - {printed_page: 52, participant: The Chromed Accountant, timestamp: "11:16:45/11-29-55", position: "Questions the economics of misleading employment credentials."}
    - {printed_page: 52, participant: Socio Pat, timestamp: "18:32:09/11-28-55", position: "Criticizes treating private relationship changes as a risk indicator."}
    - {printed_page: 53, participant: Plus Ca Change, timestamp: "18:38:32/11-06-55", position: "Distinguishes voluntary conduct from action undertaken under third-party pressure, and argues this difference is overlooked."}
    - {printed_page: 53, participant: Whisper, timestamp: "11:03:20/11-30-55", position: "Questions whether some education programs prioritize conformity as well as workplace protection."}
    - {printed_page: 53, participant: Suit, timestamp: "20:13:45/12-01-55", position: "Reports institutional pressure to ask employees questions considered intrusive; not established as universal practice."}
