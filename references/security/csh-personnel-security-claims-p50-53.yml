summary: 'FASA Corporation’s fictional Shadowrun tabletop-RPG publication Corporate Security Handbook (FASA7118, 1995; historical Second Edition), source.fasa-7118, printed pp50-53/PDF pp51-54: attributed Shadowtalk on personnel oversight, fabricated credentials, skillsoft labor, alleged corporate coercion and employee privacy. Conditional claims, satire and consent distinctions remain explicit.'
data:
  epistemic_status: attributed_commentary_not_established_setting_fact
  discussion:
  - printed_page: 50
    participant: Slag
    timestamp: 09:06:45/11-29-55
    position: Responds sarcastically to the provider's claim that personnel security primarily protects employees; not an endorsement of the company.
  - printed_page: 50
    participant: Papa
    timestamp: 09:10:34/11-29-55
    position: Replies that personnel security protects employees chiefly for the corporation's own advantage, distinguishing corporate benefit from worker welfare.
  - printed_page: 50
    participant: Slag
    timestamp: 09:16:24/11-29-55
    position: Explicitly tells Papa that the earlier 'How noble' response was sarcastic, clarifying the speaker's intent.
  - printed_page: 51
    participant: Suit
    timestamp: 22:01:40/10-24-55
    position: Asks how corporations define alleged troublemakers; claims some investigate workers for taking personal time or leave, citing an in-world company picnic as a personal anecdote rather than established policy.
  - printed_page: 51
    participant: Neuron Surfer
    timestamp: 23:08:55/10-24-55
    position: Says most corporations avoid the extremity Suit describes because employers already conduct extensive applicant screening; represents a poster's claim, not universal fact.
  - printed_page: 51
    participant: Suit
    timestamp: 23:13:56/10-24-55
    position: Alleges personnel-security monitoring continues after hiring, tracking workplace movements, personal relationships, financial activity and daily routines; condemns the breadth of intrusive oversight.
  - printed_page: 51
    participant: BizWatcher
    timestamp: 20:57:03/11-11-55
    position: Uses pointed sarcasm portraying the corporation as a caring parent that would never harm its employees, mocking the provider's assurances.
  - printed_page: 51
    participant: Dark Justice
    timestamp: 22:09:22/11-11-55
    position: Argues that initiating an employee investigation without specific misconduct implicitly treats that worker as guilty until proven innocent; presented as the speaker's criticism.
  - printed_page: 52
    participant: The Chromed Accountant
    timestamp: 10:34:56/12-01-55
    position: Claims to have heard of a company giving mid-level technical workers high-level skillsofts for tasks not requiring creativity, favoring a more uniform skillset and comparing protection of skillsoft chips with protection of hundreds of engineers; attributed anecdote, not a published rules conversion.
  - printed_page: 52
    participant: Waki
    timestamp: 11:56:43/12-01-55
    position: Hypothesizes malicious tampering with a future skillsoft update as a means of disrupting a corporate technical workforce; an in-world speculative suggestion, not an observed incident.
  - printed_page: 52
    participant: Papa
    timestamp: 10:57:23/11-29-55
    position: Warns would-be infiltrators that personnel investigators examine identities, applicant records and acquaintances and may uncover fabricated credentials. The remark is fictional forum advice, not a validated real-world practice.
  - printed_page: 52
    participant: Slag
    timestamp: 11:00:30/11-29-55
    position: Disputes the difficulty of false employment histories and SINs in the fictional setting, arguing that available nuyen can procure fabricated records; this is the character's assertion.
  - printed_page: 52
    participant: The Chromed Accountant
    timestamp: 11:16:45/11-29-55
    position: Counters that convincing fabricated credentials can cost more than the prospective employment advantage, explicitly raising an economic limitation on the alleged approach.
  - printed_page: 52
    participant: Socio Pat
    timestamp: 18:32:09/11-28-55
    position: Criticizes the provider's inclusion of changing personal relationships as personnel-security risk indicators, including ordinary breakups.
  - printed_page: 52
    participant: Orwell
    timestamp: 20:18:29/11-02-55
    position: Alleges the provider's depiction of purely protective intelligence conceals corporate willingness to pursue whatever conduct advantages its clients while denying responsibility; an in-world criticism, not narrator confirmation.
  - printed_page: 53
    participant: Plus Ca Change
    timestamp: 18:38:32/11-06-55
    position: Contrasts a worker coerced into disclosing secrets under threats of harm to the worker's family with a worker who voluntarily sells information for payment; argues employers may treat both as equally culpable despite the coercion-versus-consent distinction.
  - printed_page: 53
    participant: Neuron Surfer
    timestamp: 15:58:34/11-13-55
    position: Offers extended satire about corporate handling of a disaffected but commercially valuable scientist 'Herr Dr. IQ' working on a Stuffer Shack Nuke-and-Serve Burritos formula; implies firms value continuing output over the employee's welfare and may use preemptive workplace pressure. This is an illustrative hypothetical, not a recorded real incident.
  - printed_page: 53
    participant: Papa
    timestamp: 16:25:46/11-30-55
    position: Describes perceived corporate incentives to unsettle disfavored employees through distrust and pressure rather than alleging a verified incident with a named victim.
  - printed_page: 53
    participant: Whisper
    timestamp: 11:03:20/11-30-55
    position: Claims some corporate security-awareness programs function as indoctrination into obedience to managers rather than neutral workplace education; this is a contested audience perspective.
  - printed_page: 53
    participant: Papa
    timestamp: 19:10:45/12-01-55
    position: Warns that apparently friendly security-awareness staff may also informally monitor employee conversation and report suspected dissent; an in-world claim, not a source-narrator universal fact.
  - printed_page: 53
    participant: Suit
    timestamp: 20:01:06/12-01-55
    position: Reports that workplace security staff are pressured to question employees on intrusive matters and maintain a so-called deviants list, illustrating the issue with questions about a colleague's advanced pregnancy and mundane office supplies; personal testimony not confirmed corporate policy.
  - printed_page: 53
    participant: Suit
    timestamp: 20:13:45/12-01-55
    position: Explains, in response to Slag's question, that refusing or even hesitating to perform such intrusive questioning would result in Suit being added to the employer's alleged deviants list; depicts explicitly coercive workplace pressure.
