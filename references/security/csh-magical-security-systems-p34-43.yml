summary: Fictional historical Second Edition source-reference information about Knight Errant barriers, FAB observation/restraint
  systems, and linked magical alarms; FASA Corporation, Corporate Security Handbook (FASA7118, 1995), source.fasa-7118,
  printed pp34–43/PDF35–44. Game-world narrator and in-world speakers are not conflated.
data:
  historical_context:
    printed_pages: 34-36
    intro: Awakening and astral approaches initially exposed limitations of conventional security; firms built dedicated
      magical security departments with paid specialists and adapted technological systems.
    client_statement: Knight Errant promotes a combined magical-personnel and technological approach; provider self-assessment,
      not a universal comparative fact.
  barrier_spells:
    printed_pages: 36-37
    categories:
    - temporary sustained
    - anchored permanent
    role: Block or constrain astral beings; sustained barriers occupy the caster while maintained; anchored spells
      require costly casting and are used at sensitive installations.
    other_roles:
    - reinforce walls and doors
    - contain intruders by restricting escape routes
    distinction: Ward and barrier restrictions must not be represented as new SR3 game mechanics.
    recasting_and_containment: The FASA7118 narrator, printed p37/PDF38, says barrier spells can be recast after
      damage or disruption to maintain a protected perimeter; their rapid erection may block or channel an intruder’s
      retreat. This describes the fictional source-period practice, not a Third Edition mechanical procedure.
    anchored_spell_tradeoff: 'The printed p37 narrator distinguishes efficient, flexible anchored barriers from
      their cost to casting magicians: casting depletes a magician’s power to some extent and may diminish long-term
      effectiveness. The source recommends such installations for the most security-sensitive sites.'
  wards:
    printed_page: 37
    scope: Protect against magical assault without physical substance; especially guard, weapon and sensor positions.
    limitation: May also restrict dual-natured paranimal patrols, which is a placement tradeoff.
  living_walls:
    printed_page: 37
    materials:
    - ivy
    - moss
    - clinging plants
    - engineered fungus
    production:
    - natural growth
    - induced growth
    - genetically engineered
    functions:
    - restrict astral passage
    - indoor walls and doorways
    - movable corridor panels
    maintenance: Some engineered plants require specific lighting or nutrients; relative cost is a constraint.
  living_restraints:
    printed_page: 38
    forms:
    - living net launched from specialized canister
    - living mesh stored and deployed as larger area barrier
    material: induced woven biomatter
    described_effect: Restricts astral movement; net surrounds target and is secured to ground; mesh can cover a
      room or a passage.
    operation: Requires an astrally perceiving operator for accurate deployment according to narrator; ultraviolet
      bacteria and detection equipment may assist.
    lifespan: Living net and mesh reportedly last only a few hours after removal from storage, without a numeric
      duration.
  fiber_optic_observation:
    printed_page: 38
    history: Knight Errant reports fiber-optic magical observation systems in use by late 2040s.
    effect: Links security mage to remote observed space for spellcasting through visual line of sight; not general
      Matrix connectivity.
  FAB:
    printed_pages: 38-40
    creator: BacteriTech, subsidiary of Ares Security International
    strain_1: Airborne engineered dense bacteria deployed from pressurized tanks into contained spaces as astral
      movement restraints.
    strain_uv: UV-responsive airborne bacteria move aside around astral forms, revealing movement under ultraviolet
      illumination.
    containment_net: Polymer tubes carrying FAB with a modified netgun provide a physical and astral restraint.
    storage: Pressurized tanks with built-in feeding vats sustain bacteria; deployed organisms survive only a few
      hours.
    deployment_limits:
    - variable reliability in mobile containers/sprayers
    - works best in controlled locations with little air movement
    - high maintenance cost
    claimed_mechanism: Reader disagreement about FAB's mechanism remains attributed commentary, not settled biology.
    strain_1_sensory_effect: The printed p39/PDF40 narrator says engineered airborne FAB restrains an astral being’s
      movement at sufficient density and also reduces its perception to some degree, without specifying numerical
      modifiers.
    strain_1_built_environment: The primary FAB strain is described as filling enclosed volumes including double-thick
      walls and ceilings surrounding a protected area, creating holding spaces for astral intruders; the narrator
      compares it with ivy barriers as more portable and less conspicuous.
    strain_uv_detection_conditions: The alternate UV-responsive strain glows under portable or wall-mounted ultraviolet
      lighting; it displaces around an astral form, allowing observers to infer the form’s movement. These are portrayed
      as detection conditions rather than automatic apprehension.
    containment_net_operator_modes: The p40/PDF41 narrator describes an astrally perceiving magician or adept detecting
      a target and deploying a FAB-filled polymer net; mundane guards who cannot perceive astral targets may use
      FAB-UV aerosol together with portable ultraviolet illumination for detection. No numeric accuracy or restraint
      test is supplied.
  magical_alarm_architecture:
    printed_page: 40
    structure: Anchored detection and linked secondary spells respond to detected astral intrusion.
    examples:
    - barrier spell
    - thunderclap auditory warning
    - area-effect stunball/stunblast
    note: No game target numbers, damage ratings, costs or spellcasting Test procedures appear in this section.
    minimum_components: The narrator describes a spell-based alarm arrangement as containing at least two anchored
      spells connected by at least one spell link; this is a source-specific historical claim, not a newly inferred
      SR3 minimum.
    conditional_trigger_and_effect: A location-anchored detection spell senses the presence of an intruder, then
      activates linked secondary effects. Possible distinct purposes are alerting personnel, creating an obstruction,
      or detaining/immobilizing the target until responders arrive; the examples are illustrative possibilities,
      not a universal mandated sequence.
headline: 'Fictional Shadowrun tabletop RPG — FASA Corporation Corporate Security Handbook (FASA7118, 1995), source.fasa-7118,
  Second Edition, printed pp34–43/PDF35–44: magical-security structures and systems.'
