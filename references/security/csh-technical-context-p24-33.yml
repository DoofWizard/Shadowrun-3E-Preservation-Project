data:
  attribution: Technical descriptions in the in-world Knight Errant handbook; promotional claims and reader
    commentary are stored separately.
  source_period: '2055'
  system_relationships:
    printed_pages: 24,31-32
    pdf_pages: 25,32-33
    technical_security_components:
    - alarms
    - access_control
    - surveillance
    - control_devices
    - trained_personnel
    matrix_control: Some providers use Matrix/computer monitoring and control.
    ccss: Closed-circuit simsense links a security control rig with site devices. The narration describes
      a security rigger as its primary operator.
    interfaces: Device signals become neuromuscular input; operator commands become electrical device
      signals.
    secondary_operator: Simlinks let secondary riggers monitor the primary operator sensory input and
      assist.
    illustration_terminology: The printed-p32 diagram labels operators Security Decker and Secondary Security
      Deckers; adjacent prose says security riggers. Preserve both source labels; no inferred rules correction.
  sensor_roles:
    printed_pages: 26-28
    pdf_pages: 27-29
    perimeter: Boundary or barrier monitoring; may substitute where physical barriers are impractical.
    area: Monitoring of rooms, corridors, warehouses and especially sensitive areas.
    proximity: Monitoring of particular objects or local areas; supplements perimeter/area coverage.
  access_control_role:
    printed_pages: 28-31
    pdf_pages: 29-32
    components:
    - maglocks
    - passes
    - biometric_recognition
    identity_and_movement: Systems identify authorized users and record movement; Knight Errant describes
      identifying unauthorized persons as their primary protective purpose.
    operational_tradeoff: Repeated unlocking and key sign-out requirements can interfere with normal employee
      work.
    visitor_limitation: Physical-key distribution and rekeying are impractical for visitor tracking; passes
      provide an alternative.
  relative_costs:
    printed_pages: 30-32
    pdf_pages: 31-33
    biometrics: Source describes greater cost than maglocks/passes, with claimed reliability and convenience
      benefits.
    ccss: Source describes high initial cost and reduced staffing needs across large sites.
    drones: Source describes route-constrained models as generally inexpensive, independent mobile models
      as most versatile and expensive.
  cross_references:
    printed_page: 26
    pdf_page: 27
    magical_alarms_printed_page: 40
    window_materials_section_printed_page: 18
  illustrations:
    printed_page_25: Technical-security illustration; no independent numeric game table.
    printed_page_31: Closed-circuit camera/controller/monitor topology.
    printed_page_32: CCSS topology including maglocks, alarms, drones, gun emplacements and simlinks.
    printed_page_33: Cyberware-screening illustration; no additional numeric statistics extracted.
