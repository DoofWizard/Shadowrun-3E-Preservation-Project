headline: 'Fictional Shadowrun Second Edition — FASA Corporation Corporate Security
  Handbook (FASA7118, 1995), source.fasa-7118, printed pp22–23/PDF23–24: guard personnel
  and guard-animal descriptions'
summary: Source-reviewed fictional Knight Errant corporate descriptions distinguish
  the protective role of human guards, relative costs and roles of augmented personnel,
  employee-screening limitations, and geese, dogs and paranormal animal handlers;
  do not treat marketing claims as independently proven facts.
data:
  source_context:
    publication: Corporate Security Handbook
    publisher: FASA Corporation
    publication_year: 1995
    catalog_number: FASA7118
    source_id: source.fasa-7118
    property: Shadowrun fictional tabletop role-playing game
    edition: original historical Second Edition-era, set in 2055; no inferred Third
      Edition conversion
    printed_pages: 22-23
    pdf_pages: 23-24
    source_chapter: Physical Security — Guards and Guard Animals
  narrator_position: The Knight Errant service narrator makes these claims from a
    corporate-provider perspective; its recommendations and comparative assertions
    are not universal facts, Third Edition rules, or independently verified real-world
    guidance.
  staffing:
    printed_pages: 22-23
    role: The in-world provider argues alarms, perimeter measures and barriers generally
      delay an intruder long enough for trained personnel to respond; it depicts trained
      human and metahuman guards as essential to the security plan.
    variety_and_cost: Guard capacities and cost vary, from unaugmented patrol staff
      to personnel with augmentation; a corporation with few on-site valuables may
      favor visible unaugmented guards while sites containing important equipment
      or data may choose costlier augmented guards.
    augmentation_examples: The source specifically mentions smartgun equipment, cyber-enhanced
      reflexes, tactile-computer implants and dermal plating, while discussing relative
      intimidation and reassurance effects rather than supplying item statistics.
    screening_limit: Knight Errant says screening can reduce but never eliminate the
      possibility that employees might be bribed or otherwise act disloyally. It expressly
      leaves a client’s staffing and ethics tradeoff to the client officers; no probability
      is supplied.
  guard_animals:
    printed_page: 23
    overview: The narrator describes ordinary and paranormal guard animals, alone
      or with metahuman handlers, as part of possible site protection. The text claims
      Knight Errant can provide species-selection advice.
    geese: Geese are depicted as noisy early-warning sentries and territorial animals
      which may pursue a perceived intruder.
    dogs: The provider names Doberman pinschers and German shepherds as fast runners;
      it contrasts large mastiffs with pit bulls and mentions training receptivity.
      These are source-period generalizations and not independently validated zoological
      statistics.
    combined_handler_role: The narrator observes that guard dogs have some sensory
      limitations and can be kept from panicking under fire by handlers; it adds that
      a magically trained handler may help an animal withstand fictional hostile magic.
    alleged_animal_augmentation: Whether corporations have experimented with cybernetically
      augmented animals is raised in a separate reader conversation; the narrator
      does not establish this as a standard service.
  game_fidelity: No new target numbers, animal stat blocks, augmentation costs, training
    Tests or species combat ratings are provided in these pages.
