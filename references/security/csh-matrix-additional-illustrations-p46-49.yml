data:
  original_publication: FASA Corporation, Corporate Security Handbook (FASA7118, 1995); fictional Shadowrun Second
    Edition corporate-security sourcebook.
  chapter: Matrix
  source_description: Direct visual inspection of the original cataloged PDF page images; each printed page number
    is visible in its page header.
  illustrations:
  - printed_page: 46
    pdf_page: 47
    format: inset_tall_panel
    visible_elements: Collage of several seated or crouching figures around computer terminals and angular circuitry,
      with an ornamental mechanical-looking pattern and larger faces at the upper edge.
    contextual_limit: An illustrative composition accompanying A History of Matrix Security; do not identify individuals
      or infer historical event details from the drawing.
  - printed_page: 47
    pdf_page: 48
    format: central_tall_panel
    visible_elements: An ornate spiraling circular device or labyrinth floats among small humanoid and machine-like
      figures, curving lines, and stylized electronic patterns.
    contextual_limit: The circuit and figures are symbolic and do not specify an in-game circuit schematic or mechanical
      instruction.
  - printed_page: 48
    pdf_page: 49
    format: left_tall_panel
    visible_elements: A disheveled seated person presses both hands toward the head amid cables, a large stylized
      head or mask with circular lenses, barcode-like marks, and dense wiring.
    contextual_limit: The artwork accompanies the security-rigger discussion; no literal participant identity, medical
      state, or CCSS rules should be inferred from the image alone.
  - printed_page: 49
    pdf_page: 50
    format: right_tall_panel
    visible_elements: A stylized armored rider on a dark horse carries a long upright pole or lance, with a draped
      banner above and geometric gridwork under the horse.
    contextual_limit: Fantasy-styled art on the matrix-security page; not evidence of actual horseback deployment
      by a fictional corporate unit.
  scope_limit: Visual references only; page illustrations do not themselves encode mechanical tests, target numbers,
    combat statistics or named testimony.
