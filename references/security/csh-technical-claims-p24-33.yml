id: reference.security.csh-technical-claims-p24-33
record_type: reference
status: ingested
source: source.fasa-7118
printed_pages: 24-33
pdf_pages: 25-34
content_class:
- attributed_claim
edition_scope: Second Edition; source-period 2055; historical reference, not an SR3 override
framing: newsroom_neutral
summary: Promotional and reader assertions reported in third person; allegations, hypotheticals and disputes
  remain attributed.
related_records:
- reference.gear.csh-technical-specifications-p26-33
data:
  claims:
  - printed_page: 24
    pdf_page: 25
    speaker: Knight Errant
    source_timestamp: undated chapter narration
    statement: Knight Errant promotes its technical-security service as leading-edge and unusually reliable.
      It credits CerebroTech patented closed-circuit simsense technology with rapid response and independence
      from the Matrix, and claims Matrix intruders cannot access that isolated system.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
    qualifiers: Promotional assertion; not a blanket invulnerability rule.
  - printed_page: 26
    pdf_page: 27
    speaker: Luddite
    source_timestamp: 20:18:36/11-29-55
    statement: Luddite argues that human ingenuity can overcome technological protection given sufficient
      time, without specialized equipment.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
  - printed_page: 26
    pdf_page: 27
    speaker: Edi-san
    source_timestamp: 20:32:44/11-29-55
    statement: Edi-san disputes that time will be available after alarms activate and drones respond,
      and endorses the practical value of technology.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
  - printed_page: 27
    pdf_page: 28
    speaker: Krome Kat
    source_timestamp: 18:31:46/12-11-55
    statement: Krome Kat alleges that subdued movement may be misclassified by air-pressure monitoring
      as ordinary environmental disturbance.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
    qualifiers: No target number, movement-rate limit or validated game procedure is supplied.
  - printed_page: 28
    pdf_page: 29
    speaker: Oke Doke
    source_timestamp: 18:44:21/12-11-55
    statement: Oke Doke expresses doubt that the preceding air-pressure-detector claim provides a practical
      escape from detection.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
  - printed_page: 28
    pdf_page: 29
    speaker: Masher
    source_timestamp: 19:01:11/12-11-55
    statement: Masher distinguishes sensor detection from software interpretation and argues that waveform-analysis
      quality varies greatly.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
    qualifiers: Reply to the Krome Kat/Oke Doke exchange, not a guaranteed capability.
  - printed_page: 28
    pdf_page: 29
    speaker: Witherspoon
    source_timestamp: 12:34:54/12-18-55
    statement: Witherspoon raises the risk that body-sensitive automated gun systems may also endanger
      employees.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
  - printed_page: 28
    pdf_page: 29
    speaker: Dybbuk
    source_timestamp: 13:02:33/12-18-55
    statement: Dybbuk replies that after-hours activation and briefing authorized personnel about sensor
      locations and limits can reduce that risk.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
    qualifiers: Attributed corporate practice, not proof every facility follows it.
  - printed_page: 28
    pdf_page: 29
    speaker: Tyro
    source_timestamp: 07:22:31/12-08-55
    statement: Tyro questions whether ordinary facility access is feasible given the described density
      of alarms.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
  - printed_page: 28
    pdf_page: 29
    speaker: Smart Shopper
    source_timestamp: 07:46:12/12-08-55
    statement: Smart Shopper reports a fixer outside Chicago offering a sneak suit said to mask an infrared
      signature.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
    qualifiers: Reported equipment identity and location retained; no equipment rating or verified performance
      supplied.
  - printed_page: 28
    pdf_page: 29
    speaker: Vox
    source_timestamp: 05:44:13/12-09-55
    statement: Vox argues that simultaneous alarms can exceed immediate response capacity.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
    qualifiers: Illustrates the claim with roughly one hundred alarms even at a small facility and at
      least a couple of minutes to inspect them all; these are estimates, not a defined response timer.
  - printed_page: 29
    pdf_page: 30
    speaker: K Dog
    source_timestamp: 13:41:56/12-13-55
    statement: K Dog alleges that employee monitoring also checks corporate loyalty and regards internal
      assistance as important to outside operations.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
    qualifiers: Comment begins on printed p28 and continues on p29.
  - printed_page: 29
    pdf_page: 30
    speaker: Delunidai
    source_timestamp: 10:08:24/12-4-55
    statement: Delunidai questions whether internal-Matrix access to maglocks is becoming obsolete.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
  - printed_page: 29
    pdf_page: 30
    speaker: Dybbuk
    source_timestamp: 15:30:21/12-10-55
    statement: Dybbuk says many corporations separate security from other systems and that large corporations
      commonly use security riggers rather than deckers, with different protocols.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
  - printed_page: 29
    pdf_page: 30
    speaker: Latch
    source_timestamp: 00:05:55/12-11-55
    statement: 'Latch limits Dybbuk claim by cost: some corporations retain Matrix-controlled systems
      with maglock connectivity.'
    epistemic_status: attributed_in_world_assertion_not_independent_fact
    qualifiers: Architecture-dependent counterclaim; not universal access or a Test procedure.
  - printed_page: 29
    pdf_page: 30
    speaker: Miz Liz
    source_timestamp: 11:43:10/12-17-55
    statement: Miz Liz points to maglock dependence on a physical power source as a vulnerability.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
  - printed_page: 29
    pdf_page: 30
    speaker: Arthur
    source_timestamp: 16:32:10/12-19-55
    statement: Arthur replies that locating and interfering with power infrastructure is constrained by
      protected placement, tamper alarms, wireless designs and specialized equipment needs.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
    qualifiers: Disputes the simplicity of Miz Liz claim; no real-world procedure reproduced.
  - printed_page: 30
    pdf_page: 31
    speaker: Whisper
    source_timestamp: 22:24:10/12-14-55
    statement: Whisper presents the maglock passkey as another access device outside the four ordinary
      key-authority categories.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
    qualifiers: No passkey statistics supplied here.
  - printed_page: 30
    pdf_page: 31
    speaker: Smythe
    source_timestamp: 01:04:40/12-15-55
    statement: Smythe cautions that opening a lock does not prevent the security rigger from detecting
      it and responding.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
  - printed_page: 31
    pdf_page: 32
    speaker: Whisper
    source_timestamp: 14:22:32/12-16-55
    statement: Whisper alleges that some corporations replace identification cards with implanted identification
      chips, using pressure or undisclosed procedures presented as employee medical care; the claimed
      purpose includes continued tracking after employees leave.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
    qualifiers: Allegation, not established setting fact. Lack of informed consent, employee relationship
      and tracking purpose are preserved without graphic detail.
  - printed_page: 31
    pdf_page: 32
    speaker: Slag
    source_timestamp: 11:25:36/12-21-55
    statement: Slag observes that biometric vital-sign checks undermine use of detached biological samples
      as credentials.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
    qualifiers: Neutral account of the authentication limitation; no graphic detail.
  - printed_page: 31
    pdf_page: 32
    speaker: Cheetah
    source_timestamp: 09:11:34/12-22-55
    statement: Cheetah raises magical control of an authorized guard as a different authentication risk.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
    qualifiers: Hypothetical magical scenario, not evidence that an event occurred or a spell rule.
  - printed_page: 33
    pdf_page: 34
    speaker: Kray
    source_timestamp: 22:31:45/12-22-55
    statement: Kray suggests that ordinary resealable packaging may impede chemical detection.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
    qualifiers: Unverified reader claim; no quantified effectiveness or equipment rule.
  - printed_page: 33
    pdf_page: 34
    speaker: The Panther
    source_timestamp: 08:13:22/12-17-55
    statement: The Panther disputes CCSS invulnerability, citing poor peripheral sensors, signal-integrity
      weaknesses on wired and wireless connections, and staffing reductions following expensive installations.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
    qualifiers: The couple-million-nuyen expenditure and nine-times-out-of-ten staffing claim are rhetorical
      estimates, not listed prices or dice probabilities. No operational instructions reproduced.
  - printed_page: 33
    pdf_page: 34
    speaker: Skeeznik
    source_timestamp: 10:21:55/12-17-55
    statement: Skeeznik argues that reliance on one security rigger creates a single-person dependency.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
  - printed_page: 33
    pdf_page: 34
    speaker: Kat
    source_timestamp: 18:30:21/12-19-55
    statement: Kat argues that unfamiliar operators may struggle to distinguish real incidents from glitches
      and false alarms in large systems.
    epistemic_status: attributed_in_world_assertion_not_independent_fact
    qualifiers: Operator experience matters in this claim; no skill threshold supplied.
  editorial_scope: Retains meaningful assertions and disagreements. Pure insults, decorative metaphors
    and non-informative banter are not treated as additional facts.
