id: reference.security.csh-magical-security-claims-p34-43
record_type: reference
status: ingested
source: source.fasa-7118
printed_pages: 34-43
pdf_pages: 35-44
edition_scope: FASA Corporation Corporate Security Handbook (FASA7118, 1995); fictional
  Shadowrun Second Edition, source-period 2055; no inferred SR3 conversion
content_class:
- attributed_claim
framing: newsroom_neutral
summary: 'Fictional FASA Corporation Corporate Security Handbook (FASA7118, 1995),
  source.fasa-7118, original Shadowrun Second Edition, printed pp34-43/PDF35-44: source-attributed
  magical-security Shadowtalk; later-page missing remarks restored without inferring
  SR3 conversion.'
data:
  epistemic_status: attributed_in_world_commentary_not_automatic_game_rules
  fidelity_review_state:
    printed_34_38: prior_25_claims_retained; original_pdf35_39_image_context_rechecked_for_continuity
    printed_39_43: independently_re_reviewed_against_pdf40_44_with_continuations_to_neighbor_pages;
      46 previously omitted distinct attributed_comments_restored
  claims:
  - page: 34
    speaker: BitRunner
    timestamp: 11:23:45/10-12-55
    statement: Disputes Knight Errant’s exaggerated portrayal of magical threats as
      corporate marketing; acknowledges astral scouting and magical concealment while
      stressing that astral scouting cannot read ordinary physical technical documents
      or manipulate viewed objects.
  - page: 34
    speaker: Hotrod
    timestamp: 12:55:32/10-13-55
    statement: Briefly expresses relief that the commentator is a rigger rather than
      a magician in light of the fictional security priorities.
  - page: 36
    speaker: Lady Sally
    timestamp: 10:34:48/11-23-55
    statement: Reports that selected Tir and Aztlan facilities use quickened magical
      lighting, which lacks mundane heat signatures and can signal interference when
      disrupted; secondhand in-world security account.
  - page: 36
    speaker: Magister
    timestamp: 02:15:33/12-11-55
    statement: Notes astral visibility of magical barriers and jokes about using that
      property to alert watchers; colloquial in-world observation, not a new test
      procedure.
  - page: 36
    speaker: Kubit
    timestamp: 04:55:44/12-13-55
    statement: Claims to improvise low-power watcher spirits as noisy alarms and describes
      their behavior humorously; an attributed personal anecdote, not formal rules.
  - page: 36
    speaker: Jax
    timestamp: 05:11:32/12-13-55
    statement: Responds that Kubit’s watcher practice is strange, without offering
      independent evidence.
  - page: 36
    speaker: Omen
    timestamp: 16:41:23/12-30-55
    statement: Reports an anecdote about unexpected magical barriers obstructing a
      fictional team, while observing that protective personnel must consider how
      barriers affect friendly movement; not an actionable recommendation.
  - page: 37
    speaker: Suedo King
    timestamp: 03:22:41/11-30-55
    statement: Claims firsthand experience anchoring spells and describes the work
      as demanding; this is a personal opinion about fictional magic.
  - page: 37
    speaker: Trevor
    timestamp: 06:44:23/12-01-55
    statement: Questions why the fictional corporation Aztechnology appears to employ
      anchored and quickened magic so frequently despite its alleged high burden.
  - page: 37
    speaker: Divine Fool
    timestamp: 07:10:43/12-01-55
    statement: Speculates, without supporting evidence, that Aztechnology found a
      way to shift the magical burden of anchored constructs to a different source.
  - page: 37
    speaker: Lingo Lizard
    timestamp: 21:43:12/12-15-55
    statement: Recounts an alleged fictional firefight in which a magician’s barrier
      delayed an opposing group while others repositioned; distinguishes participant
      anecdote from a game mechanic.
  - page: 37
    speaker: Hockney Puck
    timestamp: 22:00:12/12-15-55
    statement: Reports a similar alleged incident involving a shaman’s mana barrier
      limiting his team’s magician while hostile gunfire continued; fictional combat
      anecdote.
  - page: 37
    speaker: Abandano
    timestamp: 20:11:21/12-14-55
    statement: Complains sarcastically that magical wards require recurring expenditure
      to establish and maintain at high strength.
  - page: 37
    speaker: Hawkeye
    timestamp: 23:01:34/12-14-55
    statement: Concludes that powerful wards favor those with substantial fictional
      financial resources, responding to Abandano.
  - page: 37
    speaker: Whisperwoman
    timestamp: 19:21:33/12-17-55
    statement: Mocks the euphemistic phrase “induced” for specially grown barrier
      plants; playful criticism of terminology.
  - page: 37
    speaker: Conroy
    timestamp: 19:36:45/12-17-55
    statement: Jokes that a marketing department would prefer “induced” to the more
      overt wording “forced” in describing engineered plant growth.
  - page: 37
    speaker: Wobble
    timestamp: 22:31:54/12-17-55
    statement: Jokes about an office renovation whose living-wall fungus is intrusive;
      reaction to the source narrator’s discussion of engineered barriers.
  - page: 37
    speaker: Xanos The Great
    timestamp: 14:21:37/12-18-55
    statement: Anticipates that a fictional astral magician encountering a specially
      engineered living wall would be unhappy; reaction, not demonstrated rule.
  - page: 37
    speaker: Spammer
    timestamp: 15:35:16/12-18-55
    statement: Responds that many astral magicians, not just one, would dislike the
      living-wall protection; humorous rejoinder.
  - page: 38
    speaker: Mr. Mysterio
    timestamp: 16:22:34/12-20-55
    statement: Expresses disgust at the source’s fictional living-net restraint device
      rather than asserting an additional mechanic.
  - page: 38
    speaker: Amberus VI
    timestamp: 18:56:34/12-20-55
    statement: Asks for clarification of the source narrator’s imprecise “few hours”
      duration for stored living-net material, asking whether it is fewer than six.
  - page: 38
    speaker: Weiner Velt
    timestamp: 19:12:43/12-20-55
    statement: Answers speculatively that living-net material duration may depend
      on temperature and environment; does not establish a numeric rule.
  - page: 38
    speaker: Winter
    timestamp: 13:22:43/12-19-55
    statement: Claims from personal experience that living-mesh material burns readily;
      fictional eyewitness assertion, not a damage statistic.
  - page: 38
    speaker: Slog
    timestamp: 12:56:50/12-14-55
    statement: Asks whether ubiquitous fiber-optic networks would let fictional spellcasters
      reach remote locations through existing cables.
  - page: 38
    speaker: TechWiz
    timestamp: 13:01:53/12-14-55
    statement: Rejects that inference, saying magical fiber-optic systems require
      unenhanced natural light, cannot use image boosting, are limited to 2,500-meter
      cable runs, and employ prisms to switch feeds; attributed technical assertion,
      not an independently established SR3 conversion.
  - page: 39
    speaker: Magister
    timestamp: 04:28:33/12-22-55
    statement: Asserts that fictional astral passage through an opening requires a
      gap as large as the magician’s physical body; attributed magical-rule interpretation.
  - page: 39
    speaker: BitRunner
    timestamp: 01:05:45/12-21-55
    statement: Warns that corporate sites need not publicly identify all FAB-protected
      premises; in-world speaker assertion.
  - page: 39
    speaker: Rather
    timestamp: 02:11:32/12-22-55
    statement: Questions whether an astral form is truly never able to occupy the
      same space as living matter, continuing the preceding page’s claim; expresses
      doubt rather than an exception.
  - page: 39
    speaker: Magister
    timestamp: 02:35:42/12-22-55
    statement: Argues that astral passage through living material is possible only
      if that material can be physically bypassed without effort; his interpretation
      is conditional, not a demonstrated universal exception.
  - page: 39
    speaker: Palo Alto
    timestamp: 03:01:31/12-22-55
    statement: Asks whether a living ivy curtain bars an astral form because a physical
      body would have to exert even minimal effort to pass through it.
  - page: 39
    speaker: Magister
    timestamp: 03:07:52/12-22-55
    statement: Affirms Palo Alto’s interpretation without providing a separate test
      result.
  - page: 39
    speaker: Iopus
    timestamp: 04:21:45/12-22-55
    statement: Asks how large an opening an astral body would need to pass through
      a barrier.
  - page: 39
    speaker: Wraith II
    timestamp: 01:02:33/12-21-55
    statement: Questions how an astral scout would recognize a protected site containing
      the fictional FAB bacteria from outside, treating covert site protection as
      a practical uncertainty.
  - page: 39
    speaker: Dybbuk
    timestamp: 04:11:45/12-21-55
    statement: Says that FAB containment technology is difficult to maintain and expensive
      enough to be uncommon; this is the commenter’s economic assessment.
  - page: 39
    speaker: Mindfire
    timestamp: 05:56:35/12-21-55
    statement: Briefly warns that unexpected protective measures remain possible;
      a rhetorical reply to Dybbuk rather than independent technical evidence.
  - page: 39
    speaker: Weiner Velt
    timestamp: 21:13:45/12-15-55
    statement: Reports that FAB bacterial material smells strongly over considerable
      distance and is unpleasant around prolonged exposure; a fictional subjective
      account.
  - page: 39
    speaker: Orlando
    timestamp: 23:00:32/12-16-55
    statement: Claims the fictional BacteriTech firm recently faced several attempted
      intrusions and that none succeeded to his knowledge; a bounded and unverified
      in-world report.
  - page: 39
    speaker: Slag
    timestamp: 23:05:56/12-16-55
    statement: Speculates that unsuccessful BacteriTech intruders may have been magicians
      unable to enter astrally; this is a guess.
  - page: 39
    speaker: Orlando
    timestamp: 23:07:57/12-16-55
    statement: Counters Slag’s guess with a darker joke that astral visitors may have
      entered but been unable to leave; no factual outcome is established.
  - page: 39
    speaker: Turner
    timestamp: 12:16:31/12-18-55
    statement: Responds with dismay to the description of the fictional FAB-UV detection
      technique; makes no additional technical assertion.
  - page: 39
    speaker: Leezad
    timestamp: 11:56:33/12-24-55
    statement: Asks whether a projected magician whose astral form must return to
      the physical body within six hours could be kept in a FAB-filled enclosure long
      enough to prevent return; hypothetical, not an established outcome.
  - page: 39
    speaker: Slag
    timestamp: 12:10:35/12-26-55
    statement: Questions whether FAB is dual-natured and, if so, whether an astral
      being could affect or move the bacteria; an open magical-mechanics question.
  - page: 40
    speaker: Mindfire
    timestamp: 00:29:24/12-29-55
    statement: Speculates that FAB bacterial clustering may explain fictional astral
      containment, without claiming proof; speaker hypothesis.
  - page: 40
    speaker: Mr. Wizard
    timestamp: 23:04:56/11-07-55
    statement: Recounts a fictional incident involving chained magical detection and
      a malodorous secondary alarm effect; humorous participant anecdote, not universal
      game procedure.
  - page: 40
    speaker: Wraith II
    timestamp: 12:30:22/12-27-55
    statement: Asks if FAB genuinely has dual physical and astral properties and whether
      that explains its alleged effect.
  - page: 40
    speaker: BitRunner
    timestamp: 12:34:55/12-27-55
    statement: Doubts the corporation’s public explanation of FAB’s effect and suggests
      that it may be a publicity smokescreen; does not claim to know the true mechanism.
  - page: 40
    speaker: Wraith II
    timestamp: 23:34:15/12-28-55
    statement: Notes the apparent conflict between the FAB explanation and the understanding
      that astral beings cannot ordinarily affect physical beings; poses a question.
  - page: 40
    speaker: Grendel
    timestamp: 23:39:34/12-28-55
    statement: Suggests the physically tiny individual FAB organisms behave like a
      liquid, displacing around an astral form rather than being blocked; a commenter’s
      speculative analogy.
  - page: 40
    speaker: BitRunner
    timestamp: 23:45:12/12-28-55
    statement: Challenges Grendel by noting that tiny bacterial structures still have
      physical structure; a skeptical follow-up rather than a resolved rule.
  - page: 40
    speaker: Dybbuk
    timestamp: 00:23:12/12-29-55
    statement: Asks why ordinary ambient bacteria would not obstruct astral travelers
      if mere physical mass explained FAB’s effect; disputes the preceding explanation.
  - page: 40
    speaker: Slag
    timestamp: 02:23:45/12-31-55
    statement: Proposes a fanciful fictional FAB-delivery experiment against a detected
      astral magician, without demonstrating that the idea would work; the source
      gives no confirmed test.
  - page: 40
    speaker: Mindfire
    timestamp: 02:29:36/12-31-55
    statement: Rejects Slag’s idea because an astral projection lacks physical mass;
      argues that a net would need to surround the astral form rather than relying
      on ordinary projectile impact. This is an attributed interpretation of fantasy
      mechanics.
  - page: 40
    speaker: Whisper
    timestamp: 03:05:45/12-31-55
    statement: Adds a conditional qualification that the hypothetical effect may differ
      when a wall or floor is itself filled with FAB material.
  - page: 40
    speaker: Gadfly
    timestamp: 23:10:09/11-07-55
    statement: Reports unverified rumors of corporate magical alarms pairing anchored
      detection spells with damaging fire magic, dramatizing the presumed warning;
      not a verified security policy or a general rule.
  - page: 40
    speaker: Magicker
    timestamp: 23:22:01/11-07-55
    statement: Disputes Gadfly’s rumor as too hazardous to a corporation’s own staff
      and invokes the risk of an accidental trigger after hours; the comment begins
      on printed p40 and continues on p41.
  - page: 41
    speaker: Dybbuk
    timestamp: 12:09:56/11-12-55
    statement: Contests the narrator’s implication that many ward guards are merely
      spellcasting adepts, asserting that plenty are full-fledged magicians.
  - page: 41
    speaker: Whisper
    timestamp: 15:09:32/11-16-55
    statement: Claims that fiber-optic magical observation systems appeal primarily
      to hermetic magicians, making shaman practitioners uncommon in those operations;
      an in-world generalization.
  - page: 41
    speaker: Mindfire
    timestamp: 15:31:18/11-16-55
    statement: Argues that a nature spirit may not reliably recognize all authorized
      personnel without some pass or identification system, and notes that such credentials
      can be forged; the statement continues onto printed p42.
  - page: 42
    speaker: Whisper
    timestamp: 12:54:21/11-02-55
    statement: Jokes that ivy-covered research-and-development buildings indicate
      the corporation has a nature-friendly side, referencing living-wall magical
      defenses.
  - page: 42
    speaker: Wraith II
    timestamp: 13:34:32/11-04-55
    statement: Observes that ivy or moss barriers leave architectural gaps and says
      fictional sites also rely on watchers or spirits to notice astral intruders;
      a participant’s site-security claim, not new universal rules.
  - page: 42
    speaker: Wraith II
    timestamp: 06:50:20/11-23-55
    statement: Says hermetic magicians enjoy magical-security research posts but that
      the speaker has not seen shamans working in that role; limited personal observation.
  - page: 42
    speaker: Suit
    timestamp: 10:56:32/11-05-55
    statement: Describes a disconcerting encounter with a magical assistant to an
      investigator who appeared to verify the truth of the speaker’s answers; subjective
      anecdote.
  - page: 42
    speaker: Mindfire
    timestamp: 12:03:58/11-27-55
    statement: Claims corporate special-assignment mages are highly skilled and command
      substantial premiums for extended personnel-security work.
  - page: 42
    speaker: Toni
    timestamp: 10:22:56/11-23-55
    statement: Sarcastically calls “freewheeling” a corporate euphemism for making
      colleagues uncomfortable, responding to the narrator’s comparison of shamans
      and hermetic magicians.
  - page: 42
    speaker: Slag
    timestamp: 11:32:44/11-23-55
    statement: Asks why fictional corporations hire shamans if they seem poorly suited
      to rigid corporate security procedures.
  - page: 42
    speaker: Mindfire
    timestamp: 12:00:02/11-23-55
    statement: Replies that shamans may use nature spirits to guard astral and physical
      boundaries, but such spirits have independent personalities, so the speaker
      would rather work with an elemental; opinion, not an exclusive rule.
  - page: 43
    speaker: Whisper
    timestamp: 14:44:32/11-17-55
    statement: Argues that nature-spirit protection differs from hermetic magical
      protection and may vary with time of day; attributed speaker advice, not a fixed
      rules outcome.
  - page: 43
    speaker: Roving Rover
    timestamp: 23:02:34/11-31-55
    statement: Asks whether shamans could work at biomedical-research sites. The original
      printed timestamp uses the anomalous date 11-31-55, preserved verbatim.
  - page: 43
    speaker: Whisper
    timestamp: 24:10:30/11-31-55
    statement: Responds that Dog or Bear shamans would likely abhor biomedical research
      sites, with a caveat about toxic magicians. The printed 24-hour clock/date anomalies
      are preserved.
  - page: 43
    speaker: Roving Rover
    timestamp: 00:22:39/11-15-55
    statement: Asks humorously whether a fictional security site using geese as guard
      animals might also use a Goose shaman.
  - page: 43
    speaker: BitRunner
    timestamp: 01:12:58/11-15-55
    statement: Jokes that Goose shamans only live in the islands of Hawaiʻi; the claim
      is immediately disputed by another commenter.
  - page: 43
    speaker: Dybbuk
    timestamp: 03:46:10/11-15-55
    statement: Explains that the Hawaiian Goose or nēnē is not the same totem as the
      Goose discussed in the security example, comparing the distinction to Wolf versus
      Dog.
  - page: 43
    speaker: Roving Rover
    timestamp: 03:55:12/11-15-55
    statement: Asks whether security-trained barghests or hell hounds might have corresponding
      shamans, analogizing paranormal animals to ordinary guard animals.
  - page: 43
    speaker: Dybbuk
    timestamp: 04:33:43/11-15-55
    statement: Rejects that hypothesis as impossible, asserting that shamans cannot
      follow paranormal-animal totems; the interpretation is contested in the following
      dialogue.
  - page: 43
    speaker: Mindfire
    timestamp: 11:13:22/11-15-55
    statement: Challenges Dybbuk’s categorical rejection of paranormal-animal totems
      without supplying an alternative explicit rule.
  - page: 43
    speaker: Dybbuk
    timestamp: 11:15:22/11-16-55
    statement: Replies with a confused “Huh?”, rather than a substantive rebuttal
      to Mindfire.
headline: Fictional Shadowrun tabletop RPG reference — FASA Corporation Corporate
  Security Handbook (FASA7118, 1995), source.fasa-7118, Second Edition, printed pp34-43/PDF35-44;
  attributed Shadowtalk audit
