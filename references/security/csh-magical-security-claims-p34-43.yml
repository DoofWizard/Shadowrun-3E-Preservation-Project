status: ingested
source: source.fasa-7118
printed_pages: 34-43
pdf_pages: 35-44
edition_scope: FASA Corporation Corporate Security Handbook (FASA7118, 1995); fictional Shadowrun Second Edition,
  source-period 2055; no inferred SR3 conversion
content_class:
- attributed_claim
framing: newsroom_neutral
summary: 'Fictional FASA Corporation Corporate Security Handbook (FASA7118, 1995), source.fasa-7118, printed pp34-43/PDF35-44,
  Second Edition: separately attributed magical-security Shadowtalk; printed pp34-38 independently re-reviewed,
  pp39-43 pending further missing-comment audit.'
data:
  epistemic_status: attributed_in_world_commentary_not_automatic_game_rules
  fidelity_review_state:
    printed_34_38: re-reviewed_for_claim_coverage
    printed_39_43: five preexisting claims retained as preliminary; additional source claims remain to be audited
  claims:
  - page: 34
    speaker: BitRunner
    timestamp: 11:23:45/10-12-55
    statement: Disputes Knight Errant’s exaggerated portrayal of magical threats as corporate marketing; acknowledges
      astral scouting and magical concealment while stressing that astral scouting cannot read ordinary physical
      technical documents or manipulate viewed objects.
  - page: 34
    speaker: Hotrod
    timestamp: 12:55:32/10-13-55
    statement: Briefly expresses relief that the commentator is a rigger rather than a magician in light of the
      fictional security priorities.
  - page: 36
    speaker: Lady Sally
    timestamp: 10:34:48/11-23-55
    statement: Reports that selected Tir and Aztlan facilities use quickened magical lighting, which lacks mundane
      heat signatures and can signal interference when disrupted; secondhand in-world security account.
  - page: 36
    speaker: Magister
    timestamp: 02:15:33/12-11-55
    statement: Notes astral visibility of magical barriers and jokes about using that property to alert watchers;
      colloquial in-world observation, not a new test procedure.
  - page: 36
    speaker: Kubit
    timestamp: 04:55:44/12-13-55
    statement: Claims to improvise low-power watcher spirits as noisy alarms and describes their behavior humorously;
      an attributed personal anecdote, not formal rules.
  - page: 36
    speaker: Jax
    timestamp: 05:11:32/12-13-55
    statement: Responds that Kubit’s watcher practice is strange, without offering independent evidence.
  - page: 36
    speaker: Omen
    timestamp: 16:41:23/12-30-55
    statement: Reports an anecdote about unexpected magical barriers obstructing a fictional team, while observing
      that protective personnel must consider how barriers affect friendly movement; not an actionable recommendation.
  - page: 37
    speaker: Suedo King
    timestamp: 03:22:41/11-30-55
    statement: Claims firsthand experience anchoring spells and describes the work as demanding; this is a personal
      opinion about fictional magic.
  - page: 37
    speaker: Trevor
    timestamp: 06:44:23/12-01-55
    statement: Questions why the fictional corporation Aztechnology appears to employ anchored and quickened magic
      so frequently despite its alleged high burden.
  - page: 37
    speaker: Divine Fool
    timestamp: 07:10:43/12-01-55
    statement: Speculates, without supporting evidence, that Aztechnology found a way to shift the magical burden
      of anchored constructs to a different source.
  - page: 37
    speaker: Lingo Lizard
    timestamp: 21:43:12/12-15-55
    statement: Recounts an alleged fictional firefight in which a magician’s barrier delayed an opposing group while
      others repositioned; distinguishes participant anecdote from a game mechanic.
  - page: 37
    speaker: Hockney Puck
    timestamp: 22:00:12/12-15-55
    statement: Reports a similar alleged incident involving a shaman’s mana barrier limiting his team’s magician
      while hostile gunfire continued; fictional combat anecdote.
  - page: 37
    speaker: Abandano
    timestamp: 20:11:21/12-14-55
    statement: Complains sarcastically that magical wards require recurring expenditure to establish and maintain
      at high strength.
  - page: 37
    speaker: Hawkeye
    timestamp: 23:01:34/12-14-55
    statement: Concludes that powerful wards favor those with substantial fictional financial resources, responding
      to Abandano.
  - page: 37
    speaker: Whisperwoman
    timestamp: 19:21:33/12-17-55
    statement: Mocks the euphemistic phrase “induced” for specially grown barrier plants; playful criticism of terminology.
  - page: 37
    speaker: Conroy
    timestamp: 19:36:45/12-17-55
    statement: Jokes that a marketing department would prefer “induced” to the more overt wording “forced” in describing
      engineered plant growth.
  - page: 37
    speaker: Wobble
    timestamp: 22:31:54/12-17-55
    statement: Jokes about an office renovation whose living-wall fungus is intrusive; reaction to the source narrator’s
      discussion of engineered barriers.
  - page: 37
    speaker: Xanos The Great
    timestamp: 14:21:37/12-18-55
    statement: Anticipates that a fictional astral magician encountering a specially engineered living wall would
      be unhappy; reaction, not demonstrated rule.
  - page: 37
    speaker: Spammer
    timestamp: 15:35:16/12-18-55
    statement: Responds that many astral magicians, not just one, would dislike the living-wall protection; humorous
      rejoinder.
  - page: 38
    speaker: Mr. Mysterio
    timestamp: 16:22:34/12-20-55
    statement: Expresses disgust at the source’s fictional living-net restraint device rather than asserting an
      additional mechanic.
  - page: 38
    speaker: Amberus VI
    timestamp: 18:56:34/12-20-55
    statement: Asks for clarification of the source narrator’s imprecise “few hours” duration for stored living-net
      material, asking whether it is fewer than six.
  - page: 38
    speaker: Weiner Velt
    timestamp: 19:12:43/12-20-55
    statement: Answers speculatively that living-net material duration may depend on temperature and environment;
      does not establish a numeric rule.
  - page: 38
    speaker: Winter
    timestamp: 13:22:43/12-19-55
    statement: Claims from personal experience that living-mesh material burns readily; fictional eyewitness assertion,
      not a damage statistic.
  - page: 38
    speaker: Slog
    timestamp: 12:56:50/12-14-55
    statement: Asks whether ubiquitous fiber-optic networks would let fictional spellcasters reach remote locations
      through existing cables.
  - page: 38
    speaker: TechWiz
    timestamp: 13:01:53/12-14-55
    statement: Rejects that inference, saying magical fiber-optic systems require unenhanced natural light, cannot
      use image boosting, are limited to 2,500-meter cable runs, and employ prisms to switch feeds; attributed technical
      assertion, not an independently established SR3 conversion.
  - page: 39
    speaker: Magister
    timestamp: 04:28:33/12-22-55
    statement: Asserts that fictional astral passage through an opening requires a gap as large as the magician’s
      physical body; attributed magical-rule interpretation.
  - page: 39
    speaker: BitRunner
    timestamp: 01:05:45/12-21-55
    statement: Warns that corporate sites need not publicly identify all FAB-protected premises; in-world speaker
      assertion.
  - page: 40
    speaker: Mindfire
    timestamp: 00:29:24/12-29-55
    statement: Speculates that FAB bacterial clustering may explain fictional astral containment, without claiming
      proof; speaker hypothesis.
  - page: 40
    speaker: Mr. Wizard
    timestamp: 23:04:56/11-07-55
    statement: Recounts a fictional incident involving chained magical detection and a malodorous secondary alarm
      effect; humorous participant anecdote, not universal game procedure.
  - page: 43
    speaker: Whisper
    timestamp: 14:44:32/11-17-55
    statement: Argues that nature-spirit protection differs from hermetic magical protection and may vary with time
      of day; attributed speaker advice, not a fixed rules outcome.
headline: Fictional Shadowrun tabletop-RPG first-pass editorial correction — FASA Corporation Corporate Security
  Handbook (FASA7118, 1995), Second Edition, source.fasa-7118, printed pp34–38/PDF35–39; pp39–43/PDF40–44 later
  audit pending
