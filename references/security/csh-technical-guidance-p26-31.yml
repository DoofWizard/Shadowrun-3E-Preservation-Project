id: reference.security.csh-technical-guidance-p26-31
record_type: reference
status: ingested
source: source.fasa-7118
printed_pages: 26-31
pdf_pages: 27-32
content_class:
- campaign_guidance
edition_scope: Second Edition; source-period 2055; historical reference, not an SR3 override
framing: newsroom_neutral
summary: Provider recommendations retained as attributed campaign guidance, not promoted to mandatory
  mechanics.
related_records:
- reference.gear.csh-technical-specifications-p26-33
data:
  attribution: Recommendations presented by the in-world Knight Errant narrator; not compulsory game-resolution
    rules.
  planning:
    printed_page: 26
    pdf_page: 27
    assessment: The narrator recommends assessing incident frequency/type and existing personnel/perimeter
      protection to determine alarm coverage.
    budget_reference: The previously recorded ten-percent asset-value ceiling is the narrator rule of
      thumb, not an equipment price or mandatory rule.
    false_alarms: Drone observation by a security rigger is presented as a way to assess animal-triggered
      alarms.
  sensor_selection:
    printed_page: 27
    pdf_page: 28
    overlap: Overlapping motion-detector coverage addresses blind spots.
    microwave: The narrator recommends relatively low-traffic locations because coverage through walls/windows
      also creates false-alarm exposure.
    passive_infrared: Knight Errant recommends this type only when other motion detectors are unsuitable
      because of work, stored materials, construction, personnel or other life forms.
    air_pressure: Computer analysis of barometric changes is required by the described design; rigger
      monitoring is said to improve judgment.
    photoelectric: The source says metahuman vision and inexpensive visual enhancement reduced the advantage
      of invisible beams; some corporations prefer cheaper visible systems with decor-compatible colors.
  access_control:
    printed_page: 28
    pdf_page: 29
    provider_requirement: Knight Errant requires its corporate clients to maintain at least one access-control
      form at every site.
    provider_recommendation: Knight Errant recommends layered identification in sensitive areas, with
      weapon/cyberware detectors as possible additions.
  key_management:
    printed_page: 30
    pdf_page: 31
    placement: The narrator recommends high-security or low-traffic placement with careful monitoring.
    distribution: The narrator recommends limiting keys to a small, vetted set of employees where possible.
    sign_out: The narrator recommends sign-in/sign-out on that smaller scale rather than disrupting routine
      workplace movement.
    integration: The narrator recommends evaluating maglocks within the total security system, accounting
      for employee workflow.
  biometrics:
    printed_page: 31
    pdf_page: 32
    provider_recommendation: Knight Errant presents biological recognition as its preferred high-effectiveness
      access-control approach; claimed superiority is not an independently established comparison.
