data:
  attribution: "Knight Errant narrator; recommendations and service statements are not universal practice or game mechanics."
  scope:
    printed_pages: "56-58"
    risk_analysis: "Assessment of work, residence, travel, family and routine circumstances is described as necessary to individualize protective plans."
    client_consultation: "Provider notes that some clients see background review as intrusive and recommends establishing expectations in advance."
    evaluation: "Separately considers likely parties, stated motives and broad threat forms; these are narrative classification categories."
  protective_services:
    printed_pages: "59-60"
    awareness_and_lifestyle: "Provider describes briefing the principal and family about personal security and circumstances that may create leverage."
    physical_and_technical: "Source describes workplace and residential surveys, communications safeguards and protective personnel."
    travel: "Protective services extend to travel and transportation; source describes accompanying staff, vehicle capability and pre-trip risk assessment."
    magical: "Source describes ward, spirit, spell and magician support as additional protections against magic."
    information: "Provider emphasizes confidentiality of principal schedules and travel details."
    reassessment: "Service lead is described as meeting the principal and reviewing plan changes."
  personnel:
    printed_pages: "60-61"
    coordination: "Team leader is client liaison; magician, astrally perceiving adept, decker, riggers and general specialists have distinct duties."
    riggers_exact_count: 3
    average_EPS_exact_count: 3
    no_numeric_game_mechanics: "These are staffing counts, not dice pools, security ratings or mandatory encounter requirements."
  exceptional_claim:
    printed_page: 60
    narrator: "Knight Errant describes proactive responses in extreme circumstances as possible; a reader disputes the practice and its implications."
    clarification: "Do not convert a source-era provider statement into a universal standard or an instruction for real-world conduct."
