summary: FASA Corporation, Corporate Security Handbook (FASA7118, 1995), fictional Shadowrun Second Edition,
  source.fasa-7118, printed pp56-61/PDF pp57-62. The in-world Knight Errant provider describes escort staffing,
  executive lifestyle vulnerabilities, aggressive information-gathering, and a conditional claim of pre-emptive
  lethal action, distinct from forum commentary and not a mandatory game rule or real-world advice.
data:
  attribution: Knight Errant narrator; recommendations and service statements are not universal practice or
    game mechanics.
  scope:
    printed_pages: 56-58
    risk_analysis: Assessment of work, residence, travel, family and routine circumstances is described as
      necessary to individualize protective plans.
    client_consultation: Provider notes that some clients see background review as intrusive and recommends
      establishing expectations in advance.
    evaluation: Separately considers likely parties, stated motives and broad threat forms; these are narrative
      classification categories.
  protective_services:
    printed_pages: 59-60
    awareness_and_lifestyle: Provider describes briefing the principal and family about personal security and
      circumstances that may create leverage.
    physical_and_technical: Source describes workplace and residential surveys, communications safeguards and
      protective personnel.
    continuous_escort: The Knight Errant book narrator says executive-protection specialists accompany the
      fictional client at all times (printed p59/PDF60). This describes its provider practice, not a universal
      game requirement.
    travel: Protective services extend to travel and transportation; source describes accompanying staff, vehicle
      capability and pre-trip risk assessment.
    travel_minimum_escort: For each journey, at least one executive-protection specialist accompanies the fictional
      client, according to the Knight Errant book narrator (printed p60/PDF61); this is distinct from its average
      three-specialist team staffing on printed p61/PDF62.
    magical: Source describes ward, spirit, spell and magician support as additional protections against magic.
    information: Provider emphasizes confidentiality of principal schedules and travel details.
    reassessment: Service lead is described as meeting the principal and reviewing plan changes.
    source_narrator_lifestyle_examples_p59: The fictional Knight Errant provider says that excessive alcohol
      use, illegal drug or chip use, gambling, and what its 2055 corporate narrator calls "deviant sexual practices"
      may make a protected executive vulnerable to blackmail. It describes the principal changing such behavior
      as one possible voluntary response. The source-era provider label is attributed and is not a general
      conclusion about sexuality or a new game rule.
    aggressive_intelligence_distinct_domain_p60: The Knight Errant narrator separately names aggressive intelligence-gathering
      among its fictional executive-protection measures, along with continuous reassessment of possible threats.
      This is the provider’s stated service description, not independent validation or real-world direction.
  personnel:
    printed_pages: 60-61
    coordination: Team leader is client liaison; magician, astrally perceiving adept, decker, riggers and general
      specialists have distinct duties.
    riggers_exact_count: 3
    average_EPS_exact_count: 3
    no_numeric_game_mechanics: These are staffing counts, not dice pools, security ratings or mandatory encounter
      requirements.
  exceptional_claim:
    printed_page: 60
    narrator: In the printed p60/PDF61 Aggressive Intelligence-Gathering section, the fictional Knight Errant
      provider expressly states that in extreme cases its team may pre-emptively eliminate a potential threat.
      This is a historically attributed corporate claim about possible lethal conduct, not a universal fact,
      authorization, or instruction.
    clarification: The source does not present the claimed lethal response as a numeric game procedure; King
      E.’s adjacent Shadowtalk allegation is separately preserved in the attributed-claims record, and neither
      voice is treated as independent real-world guidance.
headline: 'Fictional Shadowrun Second Edition reference — FASA Corporation, Corporate Security Handbook (FASA7118,
  1995), source.fasa-7118, printed pp56–61/PDF57–62: Knight Errant attributed executive-protection descriptions.'
