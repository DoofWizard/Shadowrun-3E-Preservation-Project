summary: "In FASA Corporation's fictional Shadowrun tabletop-RPG Corporate Security Handbook (FASA7118, 1995, historical Second Edition), source.fasa-7118, printed pp48-49/PDF pp49-50, Knight Errant's in-world Matrix security sales narrative describes detection alerts, possible escalation, shutdown, legitimate-user warnings and node IC; not SR3 test mechanics."
data:
  provider: "Knight Errant; the account is marketing-related source narration."
  composition: "The source divides Matrix security into security deckers, intrusion countermeasures and hardware."
  assessment: "Provider describes site review, client consultation, recommended configurations and optional customization."
  staffing: "Provider offers dedicated security deckers or training for client staff."
  commissioning: "After installation, provider describes internal tests of the system and adjustments."
  security_operations: "Describes routine identification checks, security notification and possible containment or shutdown; these are in-world system functions, not specified game Test procedures."
  operational_sequence_p49:
    initial_patrol: "The provider's account assigns constant matrix patrols to roaming security deckers and white and access IC; this describes a fictional service, not an independent guarantee of detection."
    passive_alert: "A security decker or IC that detects a persona lacking required identification codes issues a passive alert."
    active_alert: "If further attempts to identify the persona fail, a security decker or IC raises an active alert; an IC-triggered active alert causes a monitoring security decker to investigate."
    response: "The security decker may attempt to detain the persona or call additional security deckers. The provider also describes possible activation of gray, blaster, killer or trap IC."
  shutdown_and_node_controls_p49:
    escalation: "If detention or repulsion fails, the responsible security decker may initiate a partial or total matrix-system shutdown; the choice depends on installed configuration and the detected node's security rating."
    intruder_effect: "The described shutdown dumps the intruder from the affected node or system."
    legitimate_user_handling: "Legitimate users receive an impending-shutdown warning and the system normally backs up their work first; the backup feature may be disabled for particularly sensitive nodes to permit more rapid shutdown."
    node_protection: "Knight Errant says its matrix team can supplement selected nodes with access, barrier or scramble IC."
  fictional_context: "FASA Corporation's published Shadowrun Second Edition Corporate Security Handbook (FASA7118, 1995), source.fasa-7118, printed pp48-49/PDF pp49-50; provider's source-period in-world claims, not real-world network-security instructions or an SR3 rules conversion."
  limitation: "Provider marketing does not prove universality or efficacy; technical ratings and numerical resolution are not supplied in this chapter range."
