summary: "FASA Corporation's fictional Shadowrun Second Edition Corporate Security Handbook (FASA7118, 1995), source.fasa-7118, printed pp54-61/PDF pp55-62: Knight Errant's in-world provider narrative distinguishes threats to corporate executives, protective planning, magical and Matrix services, and team staffing including three riggers and an average of three specialists. Sales claims, named Shadowtalk allegations and game rules retain separate attribution."
headline: "Fictional Shadowrun tabletop RPG historical record - FASA Corporation, Corporate Security Handbook (FASA7118, 1995), Second Edition, source.fasa-7118, printed pp54-61/PDF pp55-62: Knight Errant executive protection"
data:
  introductory_rationale:
    printed_pages: "54-56"
    provider_view: "The chapter describes executive personnel and their families as important and potentially vulnerable corporate assets; protection is presented as a service to clients and their workforce."
    threat_categories: [rival_corporations, ideologically_motivated_groups, organized_crime, opportunistic_criminals, professional_assailants]
    impact: "The narrator connects disruptions to operational continuity, shareholder confidence, recruiting and executive productivity."
  provider_position:
    printed_page: 56
    service: "Knight Errant promotes adaptive protection, technology and specially trained employees; it claims extensive offender records and assumes liability for its security staff."
    training: [armed_and_unarmed_combat, emergency_medical_practice, counter_surveillance, piloting_and_driving, communications, social_and_cultural_protocol]
    caveat: "Promotional comparisons and claims of universal capability are not independently verified."
  principles:
    printed_pages: "56-59"
    philosophy: "Source recommends advance identification and evaluation of risk, followed by measured protective planning."
    environment: [workplace, home, personal_contacts, travel_destinations]
    relationships: "The source treats research on an executive's work, surroundings and private relationships as relevant to protective planning."
    possible_threats: [blackmail, involuntary_removal, detention_for_demands, targeted_physical_harm]
    distinctions: "Coercive information demands, displacement from an employer, detention and direct injury are separate risk categories."
  protective_domains:
    printed_pages: "59-60"
    components: [security_awareness, physical_security, technical_security, transportation_security, magical_security, information_control, intelligence_assessment]
    context: "Descriptions concern Knight Errant procedures and service models; no combat statistics are provided in the reviewed range."
  team_roles:
    printed_pages: "60-61"
    leader: "Coordinates the service team and serves as liaison with the principal and other providers."
    security_magician: "Handles magical protective services."
    physical_adept: "Works with the magician; the source says the adept has astral perception."
    decker: "Coordinates information, travel and communications-related services; source says Knight Errant deckers have cranial decks."
    riggers: "Drivers and pilots; source says Knight Errant riggers have cranial remote-control decks."
    executive_protection_specialists: "General protective personnel with technical, communication and defensive training."
    exact_stated_team_counts:
      riggers_per_team: 3
      typical_executive_protection_specialists_per_team: 3
      magician_present: true
      physical_adept_with_astral_perception_present: true
      decker_present: true
      leader_present: true
    qualifier: "Knight Errant source-era staffing, not a player-character creation or encounter-generation rule."
  source_reviewed_role_details_p61:
    source_context: "FASA Corporation's fictional Shadowrun Second Edition Corporate Security Handbook (FASA7118, 1995), printed p61/PDF62; these are Knight Errant's stated team services, not universal or modern real-world procedures."
    security_magician: "The provider assigns the magician responsibility for spell defenses and oversight of every magical security measure in the client's executive-protection program."
    physical_adept: "The narrator says every Knight Errant team includes an astrally perceiving physical adept working with its magician; the adept serves as the team's advance scout of places the principal may visit and coordinates protective measures with other providers."
    decker: "The provider describes its decker as double-checking the client's reservations and itineraries, monitoring local police, fire and rescue, and air-traffic-control communications, conducting background checks, and overseeing protection-team communications and surveillance; the team decker has a cranial deck."
    riggers: "The narrator specifies three riggers per team trained in evasive and aggressive driving and piloting; collectively they have fixed- or rotating-wing aircraft, an armored limousine or other passenger vehicle, and a cargo vehicle. They have advanced mechanical training to perform repairs and cranial remote-control decks."
    executive_protection_specialists: "The provider gives an average of three specialists per team, describes many as having countersurveillance or intelligence-gathering expertise, and claims all carry modern cybernetic enhancements and advanced communications and combat equipment. The average is provider staffing, not a mandatory game rule."
