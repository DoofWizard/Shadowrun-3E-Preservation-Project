  claims:
    - {page: 44, speaker: Ivanhoe, timestamp: "03:16:28/11-09-55", statement: "Claims new defenses attract continued attempts by professional deckers and rejects the provider's suggestion of comprehensive protection."}
    - {page: 44, speaker: Lola T., timestamp: "06:12:18/11-10-55", statement: "Counters that hazardous Matrix responses create serious risks; estimates are rhetorical, not stated dice odds."}
    - {page: 46, speaker: Geekster, timestamp: "12:03:50/10-06-55", statement: "Asks whether the 2029 virus might have originated with earlier computer intruders; speculative historical attribution."}
    - {page: 46, speaker: Brainiac, timestamp: "12:15:45/10-06-55", statement: "Speculates the 2029 virus may have come from an organizational security project; no evidence supplied."}
    - {page: 47, speaker: Hairball, timestamp: "13:34:29/10-11-55", statement: "Credits Echo Mirage's participants rather than corporate sponsors for the virus response."}
    - {page: 47, speaker: BitRunner, timestamp: "03:14:36/10-12-55", statement: "Asserts that Damian Knight is Major David Gavilan, formerly associated with Echo Mirage; allegation not promoted to established fact."}
    - {page: 47, speaker: D., timestamp: "04:20:21/10-12-55", statement: "Challenges the theory's plausibility if it implies a long-running concealed identity."}
    - {page: 47, speaker: Doomstar, timestamp: "06:10:12/10-13-55", statement: "Suggests the alleged identity trail might be deliberate misdirection."}
    - {page: 48, speaker: Sutton, timestamp: "17:16:32/09-15-55", statement: "Warns that separated control systems still depend on human operators, and disputes invulnerability."}
    - {page: 49, speaker: The Professor, timestamp: "15:35:22/12-01-55", statement: "Claims Knight Errant uses Black Knight IC beyond the ordinary listed security-program families; reader assertion not source rule."}
    - {page: 49, speaker: Brainiac, timestamp: "20:31:22/12-01-55", statement: "Claims Black IC is not reserved exclusively for last-resort circumstances."}
