summary: In FASA Corporation’s fictional Shadowrun tabletop-RPG publication Corporate
  Security Handbook (FASA7118, 1995; historical Second Edition), source.fasa-7118,
  printed pp44-49/PDF pp45-50, distinct named in-world speakers debate Matrix security,
  Echo Mirage, and alleged wrongdoing. Attribution and uncertainties remain explicit;
  no Third Edition rules are inferred.
data:
  epistemic_status: attributed_in_world_commentary
  claims:
  - page: 44
    speaker: Ivanhoe
    timestamp: 03:16:28/11-09-55
    statement: Claims Knight Errant's Matrix defenses may catch amateurs but cannot
      prevent entry by a determined professional decker; says defensive innovations
      continually prompt new counters. This is the speaker's opinion, not a mechanical
      certainty.
  - page: 44
    speaker: Lola T.
    timestamp: 06:12:18/11-10-55
    statement: Counters that of a hypothetical hundred people attempting to defeat
      advanced IC, ninety-nine would die or experience severe brain injury; the numerical
      claim is rhetorical Shadowtalk advocacy, not a measured risk or dice mechanic.
  - page: 46
    speaker: Brainiac
    timestamp: 07:13:19/11-11-55
    statement: Notes that early computer intruders were called 'hackers' and alleges
      some penetrated national-defense systems and bank records with primitive home
      computers; source-period historical commentary, not verified individual events.
  - page: 46
    speaker: Geekster
    timestamp: 12:03:50/10-06-55
    statement: Speculates that pre-Matrix hackers may have created the worldwide 2029
      virus; the commenter offers no proof of origin.
  - page: 46
    speaker: Brainiac
    timestamp: 12:15:45/10-06-55
    statement: Suggests an unverified rumor that the 2029 virus originated in a corporate
      computer-security project that escaped control, observing the corporate recruits
      later used against it; speculative allegation, not source-narrator fact.
  - page: 47
    speaker: Einstein
    timestamp: 13:24:26/10-05-55
    statement: Disputes the corporate-protection narrative, claiming companies feared
      unauthorized decker access to their own systems and that black IC was among
      the first intrusion-countermeasure categories developed.
  - page: 47
    speaker: Hairball
    timestamp: 13:34:29/10-11-55
    statement: Rejects crediting corporations with saving the world from the virus,
      giving credit instead to Echo Mirage personnel who fought it.
  - page: 47
    speaker: BitRunner
    timestamp: 03:14:36/10-12-55
    statement: Alleges that Damian Knight is Major David Gavilan of the USAF, formerly
      an Echo Mirage commander who disappeared after the project ended; further suggests
      Knight Errant's public story about corporations defeating the virus conceals
      this alleged identity. Neither identity nor motive is established as narrator
      fact.
  - page: 47
    speaker: D.
    timestamp: 04:20:21/10-12-55
    statement: Questions why Damian Knight would continue concealing his history if
      the Knight/Gavilan allegation is true, and speculates that any continued concealment
      would imply more serious undisclosed circumstances.
  - page: 47
    speaker: Doomstar
    timestamp: 06:10:12/10-13-55
    statement: Proposes that the alleged Knight/Gavilan identity trail might be a
      deliberate diversion from Damian Knight's actual background.
  - page: 48
    speaker: Sutton
    timestamp: 17:16:32/09-15-55
    statement: Argues that moving non-Matrix functions out of corporate matrices may
      reduce vulnerability to decker intrusions but does not make them invulnerable;
      warns that a security rigger controlling them could be incapacitated or bribed.
  - page: 48
    speaker: Mad Doggy D.
    timestamp: 05:10:26/09-18-55
    statement: Relates an unverified story that an acquaintance participating in an
      intrusion at a Mitsuhama facility paid off the security rigger on duty and that
      security responses then failed to operate as expected. Says the rigger bragged
      to acquaintances and died the following week in what the speaker calls a tragic
      accident involving malfunction of the rigger's home simsense setup. The surrounding
      account invites suspicion but does not establish a cause or perpetrator of the
      death.
  - page: 49
    speaker: The Professor
    timestamp: 15:35:22/12-01-55
    statement: Claims Knight Errant uses an IC program called 'Black Knight' outside
      the ordinary listed program families and might deploy it either to hold a detected
      intruder for questioning or to inflict harm. This is an in-world poster's allegation,
      not a new numeric game rule.
  - page: 49
    speaker: Brainiac
    timestamp: 20:31:22/12-01-55
    statement: Claims Knight Errant security staff do not limit black IC to a last
      resort and often recommend black IC for clients' most sensitive nodes; this
      describes the poster's allegation, not confirmed universal policy.
  publication:
    title: Corporate Security Handbook
    publisher: FASA Corporation
    year: 1995
    catalog_number: FASA7118
    source_id: source.fasa-7118
    fictional_property: Shadowrun tabletop role-playing game
    edition_scope: Historical Second Edition setting, 2055; no inferred Shadowrun
      Third Edition conversion
    publication_verification: Printed p3/PDF4 copyright and imprint; original illustrated
      pp44-49/PDF45-50
