headline: 'Fictional Shadowrun Second Edition — FASA Corporation, Corporate Security Handbook (FASA7118, 1995),
  source.fasa-7118, printed pp36–38/PDF37–39: magical barrier and living-restraint qualifications'
summary: In FASA Corporation’s fictional tabletop-RPG Corporate Security Handbook (FASA7118, 1995, historical
  Shadowrun Second Edition), printed pp36–38/PDF37–39, the Knight Errant in-world narrator distinguishes caster-maintained
  Barrier Spells from spells sustained by elementals (called an inefficient use of spirits) and describes living-mesh
  outdoor camouflage use and living-net immobilization; these are source-era descriptions without new dice
  mechanics.
