data:
  publication:
    title: Corporate Security Handbook
    publisher: FASA Corporation
    catalog_number: FASA7118
    publication_year: 1995
    fictional_game: Shadowrun
    edition: Second Edition source-era
  authorial_perspective: The following statements are the in-world Knight Errant corporate narrator’s account,
    not independently demonstrated universal game rules.
  barrier_spell_maintenance_printed_p36:
    form: Temporary, sustained magical Barrier Spells are cast as needed in contrast with anchored installations.
    default_cost_to_operator: The Knight Errant narrator says continuous sustaining preoccupies the casting
      magician for the spell’s duration.
    distinct_alternative: The narrator also states that some magicians can order elementals to sustain these
      spells instead of maintaining the spell personally.
    qualified_resource_tradeoff: It explicitly calls delegated elemental sustaining an inefficient use of spirit
      assets, not an impossibility or a universal prohibition.
    mechanical_scope: No test, target number, dice pool, Force threshold, duration in rounds, or elemental
      service cost is given here.
  contrast_printed_p37: The same narrative separately describes permanent anchored barriers, whose casting
    may deplete magical power and reduce long-term effectiveness; it does not equate anchoring with elemental
    sustaining.
  living_restraint_deployment_printed_p38:
    net_effect: The source says a launched net surrounds an astral form or spirit and its mass draws the target
      to the ground, rendering the target wholly or nearly immobile; this is descriptive, with no game Test
      or numeric modifier supplied.
    operator_qualification: The narrator says such nets are hard to aim, generally require an astrally perceiving
      wielder or UV-sensitive FAB together with suitable UV detection equipment.
    mesh_indoor_outdoor_distinction: Living mesh normally covers larger spaces, including an entire room or
      passage, and the narrator also permits its fictional outdoor use together with conventional camouflage
      material to isolate an area.
    storage_distinction: Net and mesh biomatter remain viable only a few hours after removal from their storage
      containers; the narrator supplies no more precise number.
  source_review_scope: Source-review checked original printed pp36–38/PDF37–39 images and existing FASA7118
    magical-security systems, guidance, and claims records. This supplement preserves previously omitted qualifying
    alternatives and location conditions, rather than restating their complete content.
