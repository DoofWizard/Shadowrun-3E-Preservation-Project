  - printed_page: 112
    pdf_page: 121
    adjacent_role_heading: Magical Security Specialist
    visual_observation: The vertical panel shows a standing figure wearing a long
      coat and holding a round orb-like object at waist height against a marked background.
  - printed_page: 113
    pdf_page: 122
    adjacent_role_heading: Magical Security Engineer
    visual_observation: The vertical panel shows a short-haired man in light work
      clothing in profile, next to a vertical machine or display with a small plume
      of smoke.
  - printed_page: 114
    pdf_page: 123
    adjacent_role_heading: Personnel Security Specialist
    visual_observation: The portrait shows a bespectacled man in a jacket and necktie
      holding a compact firearm-like object across his midsection.
  - printed_page: 115
    pdf_page: 124
    adjacent_role_heading: Security Commander
    visual_observation: The vertical portrait shows a uniformed figure wearing a cap,
      holding a long gun at the left side in front of a dark doorway-like shape.
  - printed_page: 117
    pdf_page: 126
    adjacent_role_heading: Security Guard
    visual_observation: The portrait shows a large, closely shaven or bald man in
      a casual shirt and open jacket, seated or leaning with his hands near his waist.
  - printed_page: 118
    pdf_page: 127
    adjacent_role_heading: Security Mage
    visual_observation: The illustration depicts a man wearing a dark jacket over
      a shirt with multiple large circular symbols, standing against a textured background.
  - printed_page: 120
    pdf_page: 129
    adjacent_role_heading: 'Security Specialist: Animal Handler'
    visual_observation: A small separate illustration at the foot of the left column
      shows a seated or crouching pointed-eared canine in dark silhouette; it accompanies
      the animal-handler profile and is not a complete equipment statistic.
  archival_interpretation: These panels are visibly published illustrations accompanying
    fictional character and staff archetypes. The illustrations do not independently
    identify real persons, establish fixed in-world biographies, or alter game attributes,
    gear, tests, numerical modifiers or procedures. Existing distinct stat and roleplaying
    records retain those source-derived mechanics.
