summary: Source-reviewed, fictional Second Edition Knight Errant magical-security department and staffing guidance,
  FASA Corporation Corporate Security Handbook (FASA7118, 1995), source.fasa-7118, printed pp36–43/PDF37–44;
  provider characterizations and source-specific conditions kept separate from universal rules.
data:
  attribution: Knight Errant corporate narrative, not a universal rule.
  personnel_departments:
    printed_pages: 41-42
    divisions:
      guards_and_wards: Astral surveillance, wards, watcher and spirit services, remote observation.
      physical_defenses: Construction, inspection and maintenance of magical barriers and engineered vegetation.
      research: Joint magical and conventional technology research.
      special_assignments: Investigations, interviews, rapid-response support and executive protection.
  patrol_staffing:
    printed_page: 41
    minimum_magicians_per_shift: 2
    usual_Knight_Errant_teams:
    - 3
    - 4
    low_security_frequency: once or twice per shift
    high_security_frequency: more-or-less constantly
  personnel_tradeoffs:
    printed_pages: 37-42
    wards: Provider recommends concentrating costly installations in sensitive areas while coordinating with
      mundane systems and authorized paranimal movement.
    living_walls: Engineered growth and nutrient requirements increase service costs.
    watchers_elementals: Narrator distinguishes ease of summoning, number of services and time limits.
    nature_spirits: Some shamans use local nature spirits; source stresses the specialized skill and expense.
    shamans: Knight Errant characterizes hermetic magicians as more common in regimented corporate service.
    totems: Wolf, Dog, Snake and Bear are discussed in terms of perceived professional fit; they are source-era
      characterizations, not universal rules.
  magical_security_department_source_recheck:
    source_role: Knight Errant provider narrative in FASA7118 (1995), fictional Shadowrun Second Edition; descriptive
      staffing guidance, not independent Third Edition rules.
    guards_and_wards_p41:
      services: Narrator distinguishes astral patrols and wards, watchers, elementals, and nature spirits.
        Watchers and elementals provide only a limited number of services before disappearing; elementals are
        harder to summon.
      nature_spirits: Narrator describes nature spirits protecting a site astrally from sundown to sunup; a
        nature spirit attuned to a facility as a whole can notify its shaman about both physical and astral
        intruders anywhere inside.
      personnel_cost: Security shamans who can obtain suitable nature spirits are described as rare and expensive,
        and the instructions given to a spirit are presented as critical.
    physical_defenses_p42: The physical-defenses subdivision installs, inspects, and repeatedly tests astral
      barriers and anti-intrusion measures. Its physical adepts astrally scan protected perimeters for weak
      points and may help deploy barriers rapidly after a breach. Other personnel install and test living-wall
      constructions.
    research_p42: The research subdivision pairs corporate magical experts with mundane scientists trained
      in magical theory and develops and field-tests protective methods. Knight Errant depicts its research
      mages as academically qualified career thaumaturgists with substantial field experience, which its account
      calls unusual.
    special_assignments_p42: Corporate magical staff assist investigations, interviews, interrogations, fast-response
      teams, and screening of guests at important events. The book says executive-protection teams usually
      include a magician and a physical adept; staffing varies with client requirements.
    shaman_specializations_p42_43: Knight Errant treats Wolf- and Dog-totem security shamans as especially
      protective of territory and people; its text places Wolf more often at rural or remote sites and Dog
      more comfortably in suburbs and cities. It describes Snake- and Bear-totem shamans as more suited to
      protecting individuals than corporate premises, including executive-protection teams. These are source-period
      corporate characterizations, not universal or SR3 character rules.
  source_reviewed_sorcerer_adept_role_p41:
    original_context: "FASA Corporation's fictional Shadowrun Second Edition Corporate Security Handbook (FASA7118, 1995), printed p41/PDF42, Guards and Wards section of Knight Errant's in-world account."
    assignment: "The book's Knight Errant narrator says magicians responsible for monitoring its fiber-optic observation networks are often sorcerer adepts, who can cast spells but cannot themselves astrally project."
    distinction: "This described limitation distinguishes a sorcerer adept monitoring fiber-optic feeds from an astrally projecting patrol mage; it is a source-period role description, not an invented Shadowrun Third Edition character rule."
headline: 'Fictional Shadowrun tabletop RPG — FASA Corporation, Corporate Security Handbook (FASA7118, 1995),
  source.fasa-7118, Second Edition, printed pp36–43/PDF37–44: magical-security staffing and practice.'
