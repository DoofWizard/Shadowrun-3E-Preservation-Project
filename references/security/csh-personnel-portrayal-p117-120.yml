data:
  source_context:
    publication: Corporate Security Handbook
    publisher: FASA Corporation
    catalog_number: FASA7118
    publication_year: 1995
    game_lineage: Historical fictional Shadowrun Second Edition-era sourcebook; not a Third Edition rules conversion
    section: Security Personnel
    printed_pages: 117-120
    pdf_pages: 126-129
  editorial_distinctions: Opening speeches and QUOTES are illustrative fictional character voices. COMMENTARY is the book
    narrator describing archetypal roles, not a real-world case study. The present record does not alter existing NPC stats
    or turn hypothetical dialogue into canon incidents.
  portrayals:
  - role: Security Guard
    printed_page: 117
    pdf_page: 126
    exemplar: A guard acknowledges being the vulnerable first layer against intruders but hopes routine enforcement gives
      employees confidence and deters crime.
    sample_speech: The voice refuses entry without matching retinal scan, fingerprint, voiceprint and pass information, offers
      a sign-in request, and apologizes for a delay.
    narrator: Guards are the most visible and numerous fictional corporate physical-security members, generally assigned specific
      low-threat checkpoint and perimeter tasks with minimal initial training.
  - role: Security Mage
    printed_page: 118
    pdf_page: 127
    exemplar: A male site mage says protecting the site is his paid duty, rather than indiscriminate combat; he conditionally
      threatens to slow and capture trespassers for questioning rather than kill them himself, while expressly leaving their
      subsequent fate uncertain.
    sample_speech: The exemplar confirms wards and watchers are functioning, then orders that a captured but living intruder
      be taken to interrogation and the commander notified.
    narrator: The site mage establishes magical defenses and monitors astral paths while on duty.
  - role: Security Officer
    printed_page: 119
    pdf_page: 128
    exemplar: A male officer asserts responsibility for Warehouse 72-C and warns that anyone triggering a security wire there
      will be removed, regardless of identity or motive.
    sample_speech: The fictional officer gives a team briefing and calls for reinforcements during a confrontation.
    narrator: Officers manage complete security at a single location, answer to the security commander, commonly rise through
      the ranks, and navigate corporate office politics.
  - role: Security Rigger
    printed_page: 119
    pdf_page: 128
    exemplar: A female operator rejects the label of mere drone driver and says her system integrates cameras, locks, lighting,
      infrared beams, trip wires and drones.
    sample_speech: The exemplar reports an attempted door opening near the president’s suite, securing drones, and loss of
      two cameras in Sector B.
    narrator: The book calls this an integrated CCSS and rig operator who monitors and controls whole technical-security installations,
      including drone or gun emplacements; threats of force are part of fictional characterization.
  - role: Security Specialist - Animal Handler
    printed_page: 120
    pdf_page: 129
    exemplar: The handler explicitly says trained animals may kill and may struggle to distinguish friendly and hostile persons.
    sample_speech: Illustrative commands refer to controlling hounds, warning that a cockatrice is loose, and calling the
      commander after tracking dogs locate a trail.
    narrator: These specialists train and command mundane and paranormal security animals; some have also worked with rare
      cybered animals.
  - role: Security Specialist - Fast Response Officer
    printed_page: 120
    pdf_page: 129
    exemplar: The officer boasts of prompt armed deployment with a team against intruders.
    sample_speech: The fictional officer calls for surrounding Warehouse 12 in an Alpha Blue formation and characterizes intruders
      as professional combatants.
    narrator: The book describes elite SWAT-trained security personnel, usually affordable only to powerful megacorporations,
      deployed at short notice to engage intruders and explicitly described as not taking prisoners. This is in-world source
      description, not tactical guidance.
