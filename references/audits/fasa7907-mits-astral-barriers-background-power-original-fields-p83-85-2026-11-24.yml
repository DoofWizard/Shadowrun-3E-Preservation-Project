field_coverage:
  barriers: Dual nature, sight and crossing, physical anchors, spell and dispelling modifiers, blocked effects and self-range exceptions, mundane crossing, quickened spells, focus and character forced-crossing outcomes, dual beings, full Force retained, detection and notifications.
  background: Sources, five level criteria, nonstacking, persistence and Cleansing, both planes, assensing limitations, secret Magic TN 12 minus rating, all relevant test modifiers and Drain TN floor(rating/2).
  power: Site and line rating 1-5, fluctuating geography, per-turn dice allocation, no Drain relief, simultaneous users, Gathering Test dice, beneficial/negative/neutral aspects and GM determination.
exceptions:
  - Force-1 rounded-down forced-crossing threshold overlaps zero-success outcome; source gives no precedence.
  - Aspected power does not prescribe a universal enhanced penalty magnitude.
  - Mana Warps and Mana Surges follow these sections and are not covered by this audit.
