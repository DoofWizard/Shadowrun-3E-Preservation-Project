      character_creation: Priority A; ordinary adept purchase rules; minimum one Magical Power level; cost one point per level; six Spell Points per level at creation only; ordinary point expenditures; shamanic or hermetic choice.
      magical_skills: Sorcery and Conjuring; effective Magic equals Magical Power level; tradition-specific skill use and shamanic totem modifiers; ordinary adept powers unaffected by tradition.
