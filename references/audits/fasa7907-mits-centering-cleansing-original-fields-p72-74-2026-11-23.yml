findings:
  - natural_section: "Centering, printed pp72-74 / PDF73-75"
    existing_record: options/magic/metamagic-centering.yml
    status: exact_mechanical_fields_missing_from_current_summary
    missing_fields:
      - "Centering Skill is a Willpower-linked Active Magical Skill; its rating cannot exceed the associated creative skill."
      - "Only one creative skill is selected for Centering; it must be personally learned, not chipped; eligible uses require the creative activity to be physically possible."
      - "Centering uses a Free Action in the augmented magical action's phase; the Centering Test precedes the relevant magical tests; astral projection is excluded."
      - "For added Magical Skill Test successes, Centering uses that test's target number including modifiers; success bonuses are unusable if the ordinary Magical Skill Test has zero successes."
      - "The bonus-success mode requires astral perception."
      - "For Drain, Centering target number equals the intended magic's Drain Power; every 2 Centering successes add 1 Drain Resistance success, provided the Drain Resistance Test itself succeeds."
      - "For penalties, Centering uses the affected Magical Skill Test target number including modifiers minus initiation grade; every 2 Centering successes remove 1 point of target-number modifiers; never reduce below the base target number."
      - "Centering can serve an appropriate creative-skill geas and can accompany Exclusive magical actions as described."
      - "Adept Centering initially applies to Athletics and Stealth; subsequently one additional skill area can be learned per additional initiation grade, with its own permitted skills; astral perception is not needed for adept success-centering."
      - "Adept Centering can improve eligible nonmagical skill successes, reduce skill penalties, or assist Drain resistance from adept powers."
  - natural_section: "Cleansing, printed p74 / PDF75"
    existing_record: options/magic/metamagic-cleansing.yml
    status: exact_mechanical_fields_missing_from_current_summary
    missing_fields:
      - "Only temporary background count can be removed and the originating cause must first be removed; longstanding background count is not automatically eligible."
      - "Background count level eligible for Cleansing must be less than or equal to initiation grade."
      - "Sorcery Test target number is 2 times the background count level."
      - "Every 2 Sorcery successes reduce background count by 1."
      - "Drain is (background count level)D, resisted with Willpower."
      - "Cleansing consumes Combat Turns equal to 2 times the background count level and requires astral perception or projection."
      - "Cleansing can remove associated astral traces/signatures; assensing for information must occur before the attempt."
