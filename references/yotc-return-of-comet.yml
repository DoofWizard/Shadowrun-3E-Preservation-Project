id: reference.yotc.return-of-comet
record_type: reference
name: "Return of the Comet"
domain: world
status: ingested
source: source.fanpro-10650
printed_pages: "6-21"
pdf_pages: "7-22"
halley_context:
  orbit:
    period_years: "about 76"
    perihelion_2061: "January"
    visible_naked_eye: "September through late November 2061"
    return_pass: "March-April 2062"
  sixth_world_context:
    - "Comet passage coincides with the fiftieth anniversary of the Awakening."
    - "Public reaction ranges from scientific interest and commercial celebration to religious panic, apocalyptic movements and magical speculation."
    - "Main text remains skeptical that the comet itself directly causes ambient mana changes; shadowtalk/speculation is not promoted to fact."
probe_race:
  framing:
    - "Governments, universities, magical foundations and corporations sponsor research, but the most visible contest is a corporate probe race."
    - "Corporate competitors use orbital assets, launch infrastructure, sabotage and publicity to try to reach Halley's Comet first."
  major_contenders:
    Ares:
      probes: ["Gigas","Velox I","Velox II"]
      context: "Major orbital player; uses large established aerospace capability."
    Saeder_Krupp:
      probe: "Duccio"
      incident: "Destroyed shortly after launch when it entered an Ares anti-satellite weapon test zone; dispute settled through Corporate Court."
    Novatech:
      probe: "Whipple"
      launch_context: "Built aboard Camelot research station; supported by Novatech launch infrastructure."
      incident: "Veered drastically off course in August 2061 and missed the comet; Novatech attributed it to a glitch while rivals alleged sabotage."
    Proteus:
      probe_projects: ["Götterbote (reported/rumored)"]
      context: "Uses sea-based and partially submerged launch infrastructure; participation initially covert."
    Shiawase:
      probe: "Brahe"
      context: "Designed at Cairns; used proprietary nanotechnology for fuel/mass advantage."
      incident: "Launch attempt was hijacked by Cataclyst cultists, then destroyed."
    Shibata_Aztechnology_Federated_Boeing:
      probe: "Kepler"
      context: "Joint project intended to launch from the Spindle."
      incident: "Launch engine fire damaged the probe and delayed it beyond the first pass."
    Yamatetsu:
      probe: "Gagarin"
      context: "Launched from Svobodny Cosmodrome via Venus slingshot trajectory."
      incident: "Lost contact immediately before planned comet intercept in August 2061."
    Trans_Orbital:
      context: "Withdrew/conceded after accidents and delays."
    Hisato_Turner:
      context: "Withdrew/conceded after accidents and delays."
runner_use:
  - "Corporate shadow operations can focus on delaying or sabotaging rival probes, stealing telemetry, attacking launch infrastructure or protecting projects."
  - "Small schedule disruptions can materially change race outcomes, making runners valuable despite the lack of a separate numeric subsystem."
sources:
  - {source: source.fanpro-10650, printed_pages: "6-21", pdf_pages: "7-22", relation: defines_context}
notes:
  - "This chapter provides setting chronology and campaign context, not a new mechanical resolution system."
