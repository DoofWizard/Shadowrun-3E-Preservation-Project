headline: FanPro10667 SR3 fictional commercial transit technology and capability reference, printed pp63-67/PDF64-68
summary: Source-specific HSCT Mach upper bound, transport accessibility, rigger-operated rail and cruise services, automated bus services and passenger amenities; no universal combat Speed or new dice test.
data:
  attribution: In-world narrator Rancine
  air_p63_64:
    hsct_name: high-speed civilian transport
    hsct_speed_upper_bound_mach: 3
    seating_and_restrooms: The narrator describes international airline ergonomic compliance for over twenty years; facilities accommodate dwarfs, elves, humans, orks, trolls and racial variants.
    pilot_interface: Modern pilots are described as VCR-equipped, with rigger control over the aircraft and its internal facilities.
  rail_p65:
    vehicle_control: Most modern monorail and dual-rail trains are equipped for rigger control.
    multi_route_control: Some corporations hardwire rigger networks into tracks, allowing a single rigger to command several routes simultaneously.
    cargo_automation: Many cargo-only lines are described as fully automated, using drones for loading, autopilot trains and preprogrammed forklifts for unloading.
  cruise_p65:
    vehicle_control: Cruise ships are almost always rigger-controlled; riggers work in shifts, with drones maintaining the vessel continuously, and riggers control its facilities.
  bus_p66:
    booking_and_charging: Trips are booked and charged through the fictional Matrix; onboard shop purchases are charged automatically.
    vehicle_control: Most buses are operated remotely as drones, often by satellite; some services use passenger hovercraft instead.
  passenger_facilities_p67:
    usual_airliner_bus_train_amenities: [seatback tridphones, Matrix jackpoints, personal climate controls]
    extended_journeys: Simdecks are provided on extended journeys.
    cruise_amenities: Similar services plus pools, racquetball courts, casinos and live music.
  limits: The published narrative supplies qualified setting capabilities, not a universal vehicle model Speed rating, mandatory installation list, subscriber count, dice modifier or availability value. Preserve Mach units without converting to the vehicle combat Speed statistic.
