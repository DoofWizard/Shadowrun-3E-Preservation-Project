  "data": {
    "publication_context": "FICTIONAL published Shadowrun tabletop RPG adventure anthology Predator and Prey, FASA Corporation, copyright 1998, FASA7324, catalog source.fasa-7324, historical Second Edition, printed p17-19/PDF p18-20.",
    "scenario_setting": "After the basilisk incident near the fictional rainforest sample site, the gamemaster may play the three separated scientists’ ensuing encounters in any order. Escaping the basilisk without fighting does not automatically remove these possible scenes.",
    "fukuhara": "Dr. Fukuhara runs toward the kiwi site, stumbles into the territory of a male wyrd mantis, and—unless intercepted—may be threatened when a female mantis arrives. The published narration specifies that the female has come to feed on the doctor; the male and female first posture against each other. A rescue party arriving early may encounter the male before the female.",
    "sanders": "Dr. Sanders marks the trail but flees down a ravine of less than 25 meters, where a naga watches him. The source portrays the naga as curious and non-aggressive if approached peacefully. With more than four rescuers she flees; if threatened she may fight for one Combat Round and then flee. Sanders avoids sudden movement and may not call out even when help comes.",
    "al_mansour": "Dr. Al-Mansour fires at the basilisk for one Combat Round and seeks the Leticia guards, then leads them to the incident site. Subsequent battle noise may attract the guards even if the earlier gunfire did not.",
    "guards_and_mantises": "Guards hearing shots may seek to arrest the group when fighting is over. If they encounter wyrd mantises, they may cooperate in defeating them while seeking a bounty and may pressure the group into moving carcasses to Leticia. Their threatened accusations about illegal entry and slaughter of protected creatures are conditional fictional border-enforcement scenes, not mandatory established outcomes.",
    "naga_branch": "The source treats the naga as a protected creature within fictional Amazonia and describes divergent guard responses to the runners attacking the naga. Healing, feeding, calm stories or singing to the naga can be used by player characters as peaceful options; a dead naga instead creates a serious prosecution branch.",
    "bicho": "Bicho remains with the riverboat. If guards hear gunfire, the scientists return to find Dr. Al-Mansour in a confrontation with Bicho. Bicho’s stated intent to abandon the expedition had guards not interrupted is reported as his own explanation. The conflict is not framed as an instruction for real-world border operations.",
    "wrap_up": "The GM may reorder or omit individual creature encounters but is instructed to bring all three scientists back toward the expedition boat, including after a nonviolent basilisk evasion. If guards intervene, departure becomes mandatory. Additional gamemaster debugging addresses possible scientist deaths, unwanted fighting, and alternative nonviolent handling."
  },
