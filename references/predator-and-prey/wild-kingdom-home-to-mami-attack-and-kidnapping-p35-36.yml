    "publication_context": "FICTIONAL Shadowrun tabletop RPG adventure anthology Predator and Prey, FASA Corporation, 1998, FASA7324, source.fasa-7324; historical Second Edition; printed p35-36/PDF p36-37. All described characters and enterprises are invented-world subjects.",
    "encounter": "The fictional section 'Home to Mami' introduces mami wata as unusual awakened marine mammals, not human mermaids. The animals approach the Tangakwunu and use spearguns and Enhanced Quickness; the initial apparent motive is comic and confusing rather than an automatic total-party battle.",
    "hidden_plot": "Tan Tien Incorporated has arranged for Ewe pirates to use the mami wata as a distraction. While player characters face the animals, three pirates approach in a mini-submarine, cut the vessel with a monofilament saw, take Dr. Dicristofaro out of the soundproof compartment and leave with him. The narrator establishes an abduction; this is not a voluntary transfer by the scientist.",
    "optional_outcome": "If players detect the rescue/abduction before the submarine departs, they may intervene. If they prevent the abduction or make the seawater-entry unsafe, the GM may instead have Tan Tien take Dicristofaro from a PBT facility in Sekondi and hire the characters to recover him.",
