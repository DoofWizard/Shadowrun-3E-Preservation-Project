    "publication_context": "FICTIONAL published Shadowrun tabletop RPG adventure anthology Predator and Prey, FASA Corporation, copyright 1998, FASA7324, catalog source.fasa-7324, historical Second Edition, printed p23/PDF p24.",
    "scene": "After a fictional night camp the group has almost finished packing for a departure to Iquitos. Dr. Al-Mansour calls from the tent and reveals the bloodied body of Dr. Eiji Fukuhara, dead from events during the night. Al-Mansour accuses Bicho, the jungle guide, while other characters are still discovering the death.",
    "book_narrator_cause": "The scenario’s Behind the Scenes explanation attributes Fukuhara’s death to larvae from the Amazonian kiwi fruit in his pack: heat and motion hatched the insects, which entered his body. Dr. Al-Mansour had lost sleep and, in his distressed condition, blamed Bicho without knowing the actual cause.",
    "agency_and_violence": "Bicho is initially stunned by the accusation; the book provides an optional branch in which he fires at Al-Mansour unless prevented by player characters. An approaching fictional Riverine border patrol may hear shots and deploy guards. None of these branches is an established real-world event or a mandatory player action.",
    "choice_and_attribution": "The scenario says the runners must choose whether to flee with Bicho, accompany Dr. Al-Mansour, or remain to respond to the fictional border patrol. Al-Mansour and Bicho use hostile language and may fight each other; their claims remain in-world accusations, not independently established facts.",
    "departure_outcomes": "The source suggests a river route parallel to the border to avoid most of the patrol, but explicitly allows a fight or capture branch. A negotiated passage toward Iquitos or alternate river crossing may be used by the GM as fictional aftermath, not as real-world logistical advice.",
    "debugging": "For characters arrested in the fictional scenario, GGI may deny knowledge and the GM provides multiple escape or rescue hooks. If surviving scientists refuse to collect the kiwi specimens, the GM may transition straight to Homeward Bound; when the samples are abandoned and Al-Mansour is kept from retrieving them, the GM may instead skip to Picking Up the Pieces.",
    "survivors": "If Bicho returns to Iquitos alive, he goes to a bar rather than meeting the team again. Surviving scientists may return by passenger aircraft. The book does not require every scientist or guide to survive."
  },
