  "headline": "Picking Up the Pieces: published fictional aftermath, official account and consequences | FICTIONAL Shadowrun tabletop RPG | FASA Corporation, Predator and Prey (FASA7324, 1998), Second Edition-era, printed p70/PDF p71",
  "summary": "Source-reviewed campaign_guidance from FASA Corporation's fictional tabletop RPG adventure Predator and Prey (FASA7324, 1998; source.fasa-7324), printed p70/PDF p71; narrator, attributed speeches and alternate gamemaster outcomes are distinguished without edition conversion.",
  "data": {
    "source_context": "Published FICTIONAL Shadowrun tabletop roleplaying adventure Predator and Prey (FASA Corporation 1998, FASA7324, source.fasa-7324), historical Second Edition-era material; no Shadowrun Third Edition conversion. The scene and tabletop rule outcomes are not real events.",
    "source_narration": "Following the zoo encounter, the Johnson arrives alongside City Services, DocWagon, and Lone Star. The Johnson hears the runners' account and presents the characters as bystanders caught in events; injured runners receive care. The next day he says their suspicions about Disball were correct. The narrative's in-world official explanation treats Disball as a lone assailant, using security video and a diary describing a shamanic transformation. The book narrator separately establishes that the astral entity wrote those diary entries to frame Disball.",
    "consequences": "The book describes later scattered animal attacks throughout North America and investment in Parashield paranormal-animal control. Runners who killed zoo animals may face a lawsuit or publicity pressure; it describes numerous claims against the zoo's animal care, none reaching trial. It says runners will not receive the offered animal bounty for animals killed on zoo grounds because the zoo influences payment bureaucracy.",
    "optional_future_campaign": "The controlling entity may return as a recurrent fictional campaign threat; Parashield may market copied forms of its animal-control technology, producing further campaign events. These are prospective GM hooks, not confirmed later history. The book distinguishes the possessing astral entity from Disball, whose own knowledge and consent are not established as the source of the attacks."
