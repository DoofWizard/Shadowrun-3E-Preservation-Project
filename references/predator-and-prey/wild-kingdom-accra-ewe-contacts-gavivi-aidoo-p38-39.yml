  "data": {
    "publication_context": "Fictional Shadowrun tabletop RPG adventure Predator and Prey, FASA Corporation, 1998, FASA7324, source.fasa-7324, historical Second Edition, printed p38-39/PDF p39-40. In-world characters, organizations and events are invented.",
    "travel": "Player characters seeking the Ewe pirates go to Accra. The book describes optional jungle travel, old roads, travel by boat, and crossing war-era territory through fictional Fanti and Asante jurisdictions, but these are world-setting and optional scenario routes, not real travel guidance.",
    "local_contact": "In Accra, a Twi-Fanti-speaking pirate named Tetthe offers to introduce the players to the Aidoo clan. He has his own dispute with the Ewe pirates and requests a favor in exchange for the lead. The GM indicates some invitations to attack Aidoo rivals could be rejected by players without ending the adventure.",
    "gavivi": "The group can learn that pirate leader Gavivi Aidoo has a boat by the docks of the fictitious shantytown of Glidji, east of Accra. Aidoos are described as potentially useful for locating the rival corporation's research base.",
    "glidji": "The fictional Glidji community is close-knit. It includes Gavivi's family, with eight-year-old guards Ayete and Massan and thirteen-year-old daughter Accossi. This entry records their age, roles and family relationships without treating them as adult combatants.",
    "consent_agency": "Gavivi may exchange a location lead for materially sufficient aid to his family's dependents. The author's option to attempt kidnapping or threatening an inhabitant is described as coercive and harms trust; the source says close-knit residents defend one another. No violence is presented as an ethical endorsement.",
    "accossi": "Accossi knows that Tan Tien operatives took a kidnapped man upriver toward Mampong, but the book says she does not know that the man was Dr. Dicristofaro. Preserve this explicit knowledge limit.",
    "tan_tien": "The in-world company is said to offer jobs to skilled people abducted from elsewhere, a coercive employment pattern; the narrator describes a rumor of forced human trafficking rather than voluntary recruitment.",
    "art": "Printed p38/PDF39 contains a large grayscale image of armed, armored figures and local residents on a city street, alongside the Accra information."
