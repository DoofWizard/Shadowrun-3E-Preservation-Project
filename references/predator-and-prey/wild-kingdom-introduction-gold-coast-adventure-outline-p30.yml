  "data": {
    "publication_context": "FICTIONAL Shadowrun tabletop RPG adventure anthology Predator and Prey, FASA Corporation, 1998, FASA7324, source.fasa-7324; historical Second Edition; printed p30/PDF p31. All described characters and enterprises are invented-world subjects.",
    "premise": "The fictional adventure employs player characters as guards escorting Phoenix Biotechnologies' Caribbean cargo toward Sekondi. The narrator establishes that Dr. Albert Dicristofaro is secretly being transported by PBT for involuntary work in a locked shipboard room.",
    "opposition": "Tan Tien Incorporated, a competing fictional company, arranges for Ewe pirates to remove Dicristofaro from the ship. The pirates' use of mami wata to divert attention and their movement to a Tan Tien facility on the Volta River are GM-only plot information, not initial player-character knowledge.",
    "continuation": "After the loss is discovered, the fictional contact Amhadu Kourouma offers a return arrangement; the search can follow contacts into Asante territory, and player characters can encounter unusual animals and a later choice concerning Dicristofaro's freedom.",
    "game_guidance": "The author warns that the adventure may occupy much of a month of play and directs gamemasters to the historical Cyberpirates supplement for optional West African and maritime background. Creature descriptions, statistics and powers are referred to Gamemastering Critters from printed p74 of this anthology.",
    "region": "The fictional city of Sekondi is presented as a corporate haven in West Africa while other polities in the region are described as taking stronger positions against megacorporations. Do not treat the book's speculative politics as real-world reportage."
