data:
  source_context: Fictional Shadowrun tabletop adventure Predator and Prey (FASA Corporation,
    1998; FASA7324, catalog source.fasa-7324), historical Second Edition-era rules;
    no inferred Third Edition conversion. Printed pp42–43/PDF43–44.
  infiltration_conditions: The GM notes that physical or astral approaches draw different
    attention, with animal-associated detection and a security-rigger-operated gun
    tower. The source allows nonviolent deception as an alternate means of entry.
    These are fictional game scenario branches, not tactical advice.
  researcher_escape: The main narration establishes that anti-slavery activists inside
    Tan Tien had already helped Dr. Albert Dicristofaro escape several hours before
    the team arrived, by bringing him out to an escort team. The party finds his room
    locked but empty. A fictional management response includes an alarm and a headcount
    when he crosses the fence.
  economic_opportunities: The narrator describes salvaging trucks, research data,
    cybernetic animal implants and other objects for hypothetical in-game sale. This
    is a fictional loot possibility and not an instruction to steal or traffic in
    animals.
  gm_debugging: GM may adjust a hard confrontation by using contacts, a warning NPC,
    or fictional plot hooks that redirect players toward the chase. If players cannot
    fight the guards, the book may depict Dicristofaro leaving in a broken-down vehicle
    to initiate the following Forced March encounter. These are optional GM story
    branches, not established chronology for all campaigns.
  next_section: Forced March starts on printed p43/PDF44; its wilderness tracking
    mechanics require a separate rule record.
  attribution: Narrator-established events, in-world management activity, and optional
    encounter-design advice are distinguished.
