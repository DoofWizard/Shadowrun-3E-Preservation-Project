  "headline": "Fictional Shadowrun tabletop RPG — Animal Magnetism insect-house meeting and undercover Johnson branches | Predator and Prey, FASA Corporation, FASA7324 (1998), 2E-era, printed p54-56, PDF p55-57",
  "summary": "Archival narrative_context for Animal Magnetism insect-house meeting and undercover Johnson branches in FASA Corporation's fictional Shadowrun tabletop adventure Predator and Prey (FASA7324, source.fasa-7324), Second Edition-era, printed p54-56, PDF p55-57. Distinguishes published book-narrator facts, in-world speaker claims, optional GM outcomes and exact mechanics.",
  "data": {
    "source_context": "Fictional Shadowrun tabletop RPG adventure Predator and Prey; FASA Corporation (1998), FASA7324; source.fasa-7324; original Shadowrun Second Edition-era publication, no inferred SR3 conversion; printed p54-56, PDF p55-57.",
    "scene": "Animal Magnetism starts with an early-morning meeting in the insect house of Seattle's Woodland Park Zoo. The building contains dimly lit glass display cases and relatively few visitors; the characters are approached by a casually dressed, short-haired man with sunglasses and no obvious cyberware. The source intends his demeanor to suggest a police officer, although he claims to represent a victim's family.",
    "johnson_allegation": "The unnamed Johnson says a family wants the person responsible for paranormal animal attacks caught and punished, and claims access to nonpublic Lone Star leads. These are the fictional speaker's claims. In GM-only Behind the Scenes material, the source establishes that he is acting for Lone Star, not for the family as described.",
    "two_initial_leads": "He describes an incubus that allegedly caused a fatal traffic collision and suggests it may have been controlled by another party; the type of control—mechanical, chemical or magical—is unresolved. He also cites hospital reports of a strange paranormal dog pack in the Redmond Barrens. His preference is for the incubus investigation first, but the players may choose the order.",
    "investigation_support": "The Johnson provides supposed work orders, sewer maps and animal-behavior records, with a scheduled Shiawase Envirotech team near the indicated sewer access. He asks that the incubus be brought back intact and preferably alive; if other unusual animals appear, he claims an Envirotech team can retrieve those bodies.",
    "gm_motive": "The GM-only guidance explains that Lone Star is stretched thin by the paranormal incidents and is simultaneously trying to avoid diverting officers from organized-crime work, while Knight Errant gains publicity. His casual dress, posture, gestures and record/identity offers are intended as signs of Lone Star affiliation; he refuses to identify himself and offers short answers. He is not characterized as genuinely concerned for the runners' welfare.",
    "response_variants": "Players may refuse, negotiate, suspect an undercover police connection, accuse the Johnson, or provoke a confrontation. The GM guidance says he leaves immediately if confronted directly as a police officer; after the meeting he requests a five-minute head start and disappears into zoo crowds. The player characters then select which investigation to pursue. If attacked he tries to escape and may call on Lone Star contacts; these are contingent adventure outcomes, not events that must happen.",
    "next_section": "The next encounter, Fire in the Hole, begins at the bottom of printed p56/PDF57. That new sewer scene is not covered by this record."
  },
