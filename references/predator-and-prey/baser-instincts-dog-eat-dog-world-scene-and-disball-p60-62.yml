    "sections": [
      {
        "heading": "Tell It To Them Straight",
        "book_narrator": "At night in the Redmond Barrens, the runners see a homeless man pushing a cart. Two dogs, one black and one golden-retriever-sized, knock him down and drag him from the street. When the runners intervene, a gabriel hound impersonating the man changes from humanoid form toward canine form, announces the trap and a larger dog pack surrounds the runners. An aardwolf appears by a character's throat.",
        "character_vs_narrator": "The apparent victim is not established as an actual helpless human in this fictional encounter: it is the gabriel hound Disball uses as bait."
      },
      {
        "heading": "Hooks",
        "gm_option": "The Redmond Barrens should seem familiar and relatively safe to these characters before this ambush. Disball commands dogs remotely and moves his awareness among them. Dogs attack in tandem without normal barking or growling. Abandoned or critically wounded animals resume normal whining, wound licking, and attempts to escape. The book notes the controlled creatures can be dangerous and that the shadowrunners should need care rather than an indiscriminate attack."
      },
      {
        "heading": "Behind the Scenes",
        "book_narrator": "Regional dog attacks have been reported by residents and hospitals. Lone Star has not followed up: the source attributes this to the area's reputation and expected hostile residents. Contacts can narrow attacks to a four-block district; witnesses name a hell hound, perhaps a barghest, and much rarer species, while other reports are inaccurate or confused. Disball uses a proxy to scout and sends a gabriel hound to draw the characters into a dog-pack ambush."
      },
      {
        "heading": "Investigation and attribution",
        "book_narrator": "Many dogs have hindquarter tattoos indicating ownership by Parashield, Fort Lewis Zoo, or Blackstone's Zoo in Snohomish. Newsfax reports describe dogs missing from Blackstone's Zoo. Follow-up there reveals those animals were on loan from Fort Lewis, and low-level animal-license records identify Fort Lewis as owner of animals loaned to Blackstone's Zoo and other Parashield watch animals. Fort Lewis records connect them to Reginald Disball.",
        "attribution": "The in-world newsfaxes, zoo staff and animal-license records are sources of clues; confused street reports are not independently established creature identification."
      },
      {
        "heading": "Debugging",
        "gm_option": "If the dog ambush is too strong, reduce the pack, omit hiding members, or have some dogs break free of Disball's control. If it is too easy, introduce another wave. GM advice stresses giving the fight apparent scale without requiring an endless fight; options are alternatives rather than all canonical events."
      }
    ]
  },
