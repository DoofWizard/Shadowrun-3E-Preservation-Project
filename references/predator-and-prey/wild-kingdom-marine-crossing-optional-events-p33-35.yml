    "publication_context": "FICTIONAL Shadowrun tabletop RPG adventure anthology Predator and Prey, FASA Corporation, 1998, FASA7324, source.fasa-7324; historical Second Edition; printed p33-35/PDF p34-36. All described characters and enterprises are invented-world subjects.",
    "itinerary": "The fictional merchant vessel travels from Miami via Bermuda to Sekondi over twenty-two days; the book treats this as roughly three weeks of game time. The GM can select maritime encounters to expand the adventure or bridge into a Cyberpirates campaign.",
    "general_events": "Optional encounters include a fictional Atlantean Foundation megalodon expedition, twenty devil rats raiding stored food, a Caribbean League Navy identification patrol that becomes a pirate scenario, and a distress call from a downed light plane containing illicit cargo and victims of earlier events.",
    "plane_and_spirit": "The downed plane contains 500 kg of low-grade marijuana and two deceased armed men associated in the scenario with a fictional cartels dispute. The source describes a Nomad spirit still present and seeking a host, with its past violent effects on characters described as in-world supernatural narrative.",
    "bermuda_phenomena": "A Bermuda Triangle subset includes illusionary change of apparent coastline, historical apparitions, a purported distress call from U.S.S. Amphitrite, a giant saltwater serpent, an uncanny face in the waves that creates an urge to rescue a dead friend, and supernatural flying fish. Source attribution explicitly ascribes some perceptions to sea spirits.",
    "pirates_and_transfer": "At Bermuda the fictional fixer's contact Rain checks cargo and equipment. The GM may give JIHIH a spy disguised as Rain; detecting theft/damage can change the next scene. A new loading arrangement has not yet exposed Dicristofaro to the player characters.",
