    "publication_context": "FICTIONAL published Shadowrun tabletop RPG adventure anthology Predator and Prey, FASA Corporation, copyright 1998, FASA7324, catalog source.fasa-7324, historical Second Edition, printed p24/PDF p25.",
    "opening": "The fictional team flies in a Skytruck out of South America after collecting kiwi fruit samples; characters are tired and notice cargo packed behind them. The read-aloud opening establishes that the group hears scratching from behind the cargo door.",
    "book_narrator_cause": "Larvae concealed inside the collected fruit have matured into spider-like Awakened creatures. Approximately three spider-beasts per player-character runner emerge from packing crates, attack the cargo door, and try to reach live prey in the cabin.",
    "initial_events": "If someone opens the cargo door, the creatures spill out; the GM may call for Surprise Tests for the character at the door. The creatures are described as agile and persistent but not especially intelligent. The original scene references a separate creature-stat block on printed p85.",
    "conditional_danger": "The text explains that automatic vehicle controls or a player rigger may be in control of the Skytruck. Penetrating its hull can decompress the cabin; the pilot may attempt to keep control. Fictional player characters can instead open rear cargo doors to release creatures at altitude, subject to the printed tests.",
    "alternate_outcomes": "The gamemaster may adapt the encounter if players kept no kiwis on board. If a deceased or surviving scientist remains aboard, the original scenario permits a separate spider-beast-larva complication. After surviving or defeating the creatures, the team can return to Seattle.",
    "edition": "The original scenario refers to Rigger 2 aircraft control and its Skytruck statistics, preserving the published historical mechanical lineage."
  },
