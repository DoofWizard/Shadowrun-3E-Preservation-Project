  "data": {
    "publication_context": "FICTIONAL published Shadowrun tabletop RPG adventure anthology Predator and Prey, FASA Corporation, copyright 1998, FASA7324, catalog source.fasa-7324, historical Second Edition, printed p19-20/PDF p20-21.",
    "departure": "The fictional riverboat Golfinhão leaves Leticia amid border-guard gunfire. Bicho steers upriver and toward the Peruvian side; the company’s scientific team still seeks the elusive Amazonian kiwis and argues about continuing overland after abandoning the river route.",
    "outcomes": "The scene places player characters aboard a boat under fire. The scenario supplies an alternate path: if runners use magic or repairs to avert a vessel-grounding encounter, the gamemaster should adjust later encounters, but the expedition ultimately has to proceed on foot.",
    "creature": "The supposed waterlogged tree trunks are actually macareús, fictional Awakened caiman akin to the North American behemoth (the source cross-references printed p82). A female and several competing males were present during a mating dispute. The boat disturbs them; their first attacks target the hull, later possibly passengers.",
    "crew_reactions": "Bicho fires from the wheelhouse and steers toward the bank. Dr. Al-Mansour attempts to remove Dr. Sanders from danger, while Dr. Fukuhara alerts the crew to the damaged boat. The book explicitly instructs the GM not to require the deaths of Bicho or the scientists in this encounter, though wounds are possible.",
    "landing": "After the macareú is driven off or killed, the boat grounds near shore. Repairs require dry dock, and the expedition must hike for supplies and return toward Leticia or Iquitos. The scientists may insist that their work continue while Bicho seeks compensation for his ruined boat; the GM may calm this dispute or allow a confrontation.",
    "narrative_distinction": "The border dispute, creature damage, repairs, and expedition choices are third-person reporting of a fictional tabletop scenario; the text’s player-readaloud passages are not factual descriptions of modern Amazonia."
  },
