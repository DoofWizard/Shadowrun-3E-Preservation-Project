    "opening": "Following Forced March, the players return with or without Dr. Dicristofaro. The optional read-aloud describes him walking in the rain, an Awakened tracking bat overhead, railroad tracks and a communications warning from Kourouma.",
    "tracking": "The narrator describes a Tan Tien security rigger using a cybernetically augmented awnuma bavole as a scout; this bat is sent to monitor the party, not to attack. The rigger may locate the party at the old tracks and then send fictional mercenaries.",
    "scene_options": "The source proposes moving through dense forest, pursuing the narrow railroad corridor toward Sekondi, using a human-powered handcart, or staging a chase on an old coal train. Exact handcart and train resolution rules are preserved separately in the related rail-game-rules record.",
    "conditional_chase": "Mercenaries may arrive from parachutes, hovercar and locomotive. If the party flees by handcart or hops aboard the train, the GM may stage additional combat and the train's possible derailment. If the party takes a separate jungle route, the mercenary group may instead intercept them north of Sekondi, without a locomotive confrontation.",
    "safety_and_exit": "The railroad chase ends at or near the fictional Sekondi border, where Kourouma's assistance and local opposition to Tan Tien constrain mercenary pursuit. The result depends on the party's earlier decisions; a particular scene outcome is not fixed.",
