  "headline": "Fictional Shadowrun tabletop RPG — Fire in the Hole sewer expedition, staged encounters and afanc clues | Predator and Prey, FASA Corporation, FASA7324 (1998), 2E-era, printed p56-59, PDF p57-60",
  "summary": "Archival campaign_guidance of Fire in the Hole sewer expedition, staged encounters and afanc clues in the published fictional Shadowrun adventure Predator and Prey (FASA Corporation, FASA7324, source.fasa-7324, 1998), original Second Edition-era; printed p56-59/PDF p57-60. Narrator facts, in-world reports and optional GM outcomes are distinguished; all numbers remain exact.",
  "data": {
    "source_context": "Fictional tabletop RPG adventure Predator and Prey by FASA Corporation (1998), FASA7324, source.fasa-7324, original Shadowrun Second Edition-era; no implicit Third Edition conversion; printed p56-59/PDF p57-60.",
    "chapter_entry": "Fire in the Hole begins on printed p56/PDF57. The runners reach a Shiawase Envirotech work site at a city intersection. Technicians use supposed work orders as authority for entering the municipal sewer. Two workers in stained overalls prepare the party, issue a folding waterproof map and warn them of the conditions.",
    "technicians_and_evidence": "The two Envirotech technicians are described in gamemaster text as quirky employees with professional enthusiasm for the fictional incubus case; this is not proof they engineered or control the animal. At the entrance they arrange a coffin-sized refrigerated container for the specimen. Their comments imply familiarity with research on an incubus retrovirus and pre-cephalopod evolution.",
    "environment_and_order": "The sewers contain stagnant water and patched plascrete. The GM can use the Shiawase sub-grid map as a player handout and reorder encounters to build suspense. The printed sequence generally gives devil rat swarm, troglodytes, incubus and afanc, but the book permits mixing or adding encounters.",
    "devil_rat_encounter": "Numerous devil rats rush the characters, use Concealment and then ambush them. The published scenario positions the first swarm as an unsettling but relatively manageable fight, and suggests darkness, small-group attacks and surprise. Exact tests and numbers are extracted into a separate rule_exact record.",
    "troglodytes": "An adult and juvenile troglodyte are glimpsed moving away along a sewer passage; the book explicitly says they do not attack and killing them yields no gain. The scene acts as a misdirection after the rats.",
    "incubus_illusion": "The incubus deliberately manipulates the characters' perceptions: those affected may see an enormous monster and then misidentify their own companions as the threat. The GM text states that players may initially believe they are fighting a creature, when in fact the danger is their accidental fight with each other. These are in-fiction effects; original tests are preserved separately.",
    "incubus_true_state": "The real incubus is approximately one-quarter the apparent monster's size. It has fine-tuned Illusion effects in the scenario and is not, according to the narrator, currently under Dr. Disball's control. Stopping it can involve magic, the tranquilizing equipment provided by Envirotech, or finding and confronting the real animal.",
    "afanc_encounter": "On the party's return, an afanc rises from sewer water and tries to seize the incapacitated or dead incubus. The narrator describes a plastic shipping collar on the afanc bearing a Parashield barcode and dock number. The dock has no afanc when investigators arrive, but security records mention a recent escaped creature. The source directs further inquiry to Industrial Causes on printed p62; this is a campaign clue, not a real logistics instruction.",
    "handoff": "When players return to the entrance with the incubus, the technicians collect it in a refrigerated container, recover loaned equipment other than the antidote patches, and celebrate the acquisition."
  },
