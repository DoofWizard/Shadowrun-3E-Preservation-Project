    "source_scope": "The book describes the fictional Shadowrun world in the year 2059, three independent adventures sharing a theme of metahumans encountering Awakened creatures; locales include the Amazonian jungle and Seattle sewers.",
    "rule_dependencies": "The gamemaster is expected to know Shadowrun Second Edition (SRII); supplemental Grimoire Second Edition, Rigger 2 and Virtual Realities 2.0 are described as useful, not strictly required. The information is for the GM only.",
    "scene_components": "Each adventure starts with a fictional prologue and an introduction; most encounters use Tell It to Them Straight, Hooks, Behind the Scenes and Debugging, ending in Picking Up the Pieces. Player-facing descriptions are distinct from behind-the-scenes fiction and GM alternatives.",
    "success_tests": "The book expresses tests using the skill plus a target number in parentheses. Its example Sorcery (5) means a Sorcery test against Target Number 5. Success tables are cumulative: three successes grant entries for one, two, and three successes.",
    "game_master_options": "The story branches may be adapted to players; opposed NPC Threat and Professional Ratings are suggested, with Threat Rating dice taking the place of Dice Pools under SRII p187. A GM can adjust them to keep opposition appropriate. Encounter options, not canonical fixed events, are explicitly distinguished.",
    "supplemental_material": "Two appendices, Gamemastering Critters and Critter Powers, give creature description, statistics and powers for this book and later GM use. Cyberpirates is named as optional location background for Wild Kingdom."
