  "summary": "FICTIONAL published Shadowrun tabletop RPG adventure anthology Predator and Prey, FASA Corporation, copyright 1998, FASA7324, catalog source.fasa-7324, historical Second Edition, printed p4-5/PDF p5-6. Original page-image source review distinguishes fictional book narration, attributed character claims, optional game-master situations, and exact historical game mechanics.",
