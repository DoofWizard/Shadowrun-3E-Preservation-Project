  "headline": "FICTIONAL published Shadowrun tabletop RPG adventure anthology Predator and Prey, FASA Corporation, copyright 1998, FASA7324, catalog source.fasa-7324, historical Second Edition, printed p8-12/PDF p9-13. Southbound, Up Up and Away and arrival in Iquitos GM branches.",
  "summary": "FICTIONAL published Shadowrun tabletop RPG adventure anthology Predator and Prey, FASA Corporation, copyright 1998, FASA7324, catalog source.fasa-7324, historical Second Edition, printed p8-12/PDF p9-13. Original page-image source review distinguishes fictional book narration, attributed character claims, optional game-master situations, and exact historical game mechanics.",
  "data": {
    "publication_context": "FICTIONAL published Shadowrun tabletop RPG adventure anthology Predator and Prey, FASA Corporation, copyright 1998, FASA7324, catalog source.fasa-7324, historical Second Edition, printed p8-12/PDF p9-13.",
    "scene_start": "Southbound begins with a fictional fixer call and a meeting at Gravity Bar North at ten p.m. with Green Globe International representative Randall Pape. The source states Pape does not volunteer the plant’s full significance and permits characters to infer it from Dunkelzahn’s will.",
    "declared_assignment": "Pape describes a private botanical expedition to Iquitos, Peru and then across the invented Amazonian border. The three scientists aim to identify and collect a sample of a rare Brazilian kiwi. The runners are assigned protection and escort; the text distinguishes Pape’s claims from undisclosed stakes and GM information.",
    "route_and_party": "The transport is a Hawker-Ridley Skytruck leaving the Seattle-Tacoma region. Characters meet Dr Fukuhara (an elven ecologist), Dr Sanders (a human ethnobotanist), Dr Al-Mansour (an ork specializing in phytogeography), and Melissa (dwarf mechanic/pilot). After landing in Iquitos they meet Bicho, the local guide.",
    "interpersonal_dynamics": "Fukuhara is businesslike and the apparent leader; Sanders friendly and prone to distracting trivia; Al-Mansour polite but distant with a prior grievance; Bicho and Al-Mansour show immediate dislike and Bicho is suspicious toward metahumans. These are invented character portrayals not statements about real people.",
    "optional_branching": "The GM may allow a team rigger to pilot the Skytruck or assign Melissa instead; she otherwise stays in Iquitos until the return trip. GM hooks suggest roleplaying friction between the scientists and runners, choosing which information to reveal, and moving the group to the river journey after introductions. The opening outcome is not predetermined.",
    "scientist_briefing": "The expedition seeks actinidia amazonensis (Brazilian kiwi), portrayed as a much larger brown fuzzy fruit; the in-world botanists propose growing it domestically in the UCAS. Dr Sanders warns characters not to eat collected fruit because locals report possible hallucinogenic effects. These are character statements, not botanical facts about real plants."
