    "gamemaster_principles": [
      "The book distinguishes critters from nonplayer human characters: animal motives are often more immediate, including food, protection of territory or young, and fear. The GM may give critters individual intelligence and personality instead of treating them merely as temporary combat obstacles.",
      "Urban creatures can be territorial and aggressive in metahuman environments. Wild creatures are often less hostile to metahumans, though they may defend young or territory or attack when scared or hungry. The book treats both as broad generalizations with exceptions.",
      "A creature of Intelligence 3 may be a clever animal, not equivalently a human planner. Allow original published animal intelligence, tracking instincts, and decision-making to shape the encounter.",
      "Zoos, paranormal security firms, shippers, private owners, and illegal exotic-pet trade create plausible original Shadowrun setting explanations for creatures in urban areas. The book contrasts a herd passing a border crossing with a single unexpected individual in the Barrens."
