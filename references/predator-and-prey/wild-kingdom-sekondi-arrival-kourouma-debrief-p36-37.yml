    "secrecy": "During recruitment the true presence of Dicristofaro was concealed from the guards. Kourouma now tells them they were paid to safeguard the entire ship and argues they must return the scientist before the company will consider their job complete. This is his contractual position, not an independently established obligation of the player characters.",
