  "headline": "Fictional Shadowrun tabletop RPG — Baser Instincts adventure premise, urban predators and GM running advice | Predator and Prey, FASA Corporation, FASA7324 (1998), 2E-era, printed p52-54, PDF p53-55",
  "summary": "Archival campaign_guidance for Baser Instincts adventure premise, urban predators and GM running advice in FASA Corporation's fictional Shadowrun tabletop adventure Predator and Prey (FASA7324, source.fasa-7324), Second Edition-era, printed p52-54, PDF p53-55. Distinguishes published book-narrator facts, in-world speaker claims, optional GM outcomes and exact mechanics.",
  "data": {
    "source_context": "Fictional Shadowrun tabletop RPG adventure Predator and Prey; FASA Corporation (1998), FASA7324; source.fasa-7324; original Shadowrun Second Edition-era publication, no inferred SR3 conversion; printed p52-54, PDF p53-55.",
    "premise": "The Baser Instincts adventure places shadowrunners amid escalating encounters with paranormal animals in Seattle. The text intentionally leaves unclear whether a human organizer controls the animals or whether a more unusual influence is involved. Gamemasters are told to preserve uncertainty, player agency and the possibility of ambiguous motives.",
    "urban_predators": "For three nights before the player's engagement, the fictional Lone Star Paranormal Animal Control Division has received unusually many calls about dangerous paranormal creatures across Seattle, including escaped or newly sighted animals. A plasma creature shown on a KSAA recording remains at large in the scenario introduction. Public reaction includes press criticism of Lone Star, competing Knight Errant messaging, corporation-recovery activity and protest by environmental groups. These are depicted setting events and faction positions, not reports of real incidents.",
    "police_public_context": "Lone Star's head in Seattle, William Louden, publicly promises additional officers and an investigation. The press conference is interrupted by allegations about the force's organized-crime enforcement priorities. The narrator distinguishes these public controversies and in-world speaker claims from events the GM establishes.",
    "recruitment": "The Johnson presenting the initial assignment appears to be speaking for an animal-attack victim's family but in fact represents Lone Star. He has information concerning an incubus incident and a paranormal dog pack; subsequent investigation can point to Parashield, Inc., the importer/trainer of exotic animals and watch animals, whose imported animals reportedly come from the Fort Lewis Zoological Gardens. The name Dr. Reginald Disball appears across the animals' records.",
    "running_structure": "Running Baser Instincts instructs the gamemaster that Encounters One through Three may occur in any order with minor adjustments, and that Encounter Four can be presented early depending on discovered clues. Other adventures can be interleaved. Optional extra critters may come from this book's printed pp76-87 or Second Edition's Shadowrun rulebook pp221-238; do not treat that cross-reference as newly printed creature statistics in this page range.",
    "campaign_adaptation": "The published alternatives allow players to be Lone Star officers, Ares security personnel, members of a magical investigation group, or FBI Paranormal Affairs personnel. The author recommends retaining an urban setting where unexpected animal behavior contrasts with familiar metahuman dominance; adapting it to remote wilderness changes the intended effect.",
    "beginning_hook": "The characters receive an urgent fixer call to meet a Johnson. Possible inducements include access to new identities and cleaned records; these are scenario offerings, not established results. The next scene is Animal Magnetism at a public zoo."
  },
