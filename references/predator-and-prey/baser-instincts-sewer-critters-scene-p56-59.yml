  "data": {
    "source_context": "Fictional tabletop RPG Shadowrun published adventure Predator and Prey (FASA Corporation, FASA7324, 1998), source.fasa-7324, historical Second Edition-era; printed p56-59/PDF p57-60.",
    "entry": "A Shiawase Envirotech team meets the runners near a manhole, issues two Ares Squirt guns with DMSO/tranquilizer ammunition and an optional sewer map, and supplies equipment tailored to the catch-alive mission. The scene places characters in dim, moving wastewater and decaying tunnels.",
    "devil_rat_scene": "Small devil rats first surround the party amid echoes and poor visibility; the GM can vary the order and timing. The animals are numerous and may attack physically, then disperse when their group numbers diminish.",
    "troglodytes": "An adult and juvenile troglodyte briefly appear, with the larger apparently urging the smaller to flee. The narrator specifies they do not fight back if attacked and simply attempt to escape.",
    "incubus_illusion": "An incubus creates different hallucinations for separate characters, making some perceive their companions as the monster. The narrator establishes that the real incubus is much smaller than the illusion and is not controlled by Dr. Disball. The GM may resolve the mistaken fight by insight, a tranquilizer, capture of the actual creature or a direct attack disrupting the illusion.",
    "afanc": "The later afanc scene has a larger creature attempt to seize and eat the incubus. If it succeeds, the runners lose their capture objective. On the afanc's collar are a Parashield shipping barcode and dock identification, leading to a separate industrial-dock mystery.",
    "return": "The Shiawase technicians meet the party back at the sewer entrance with a winch and a freezer-sized holding container, take custody of the incubus, and ask to recover loaned equipment; antidote slap patches may be kept.",
    "certainty": "These are fictional scenario descriptions and optional branches; no single party outcome is assumed."
