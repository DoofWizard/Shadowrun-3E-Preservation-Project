        "heading": "Tell It To Them Straight",
        "book_narrator": "The Parashield regional sales and service center in an Ares-owned office park is the team's target after Parashield's local database apparently lacks a normal Matrix connection. The security seen outside appears less formidable than Knight Errant standard. Knight Errant nevertheless patrols every forty-five minutes."
      },
      {
        "heading": "Hooks",
        "gm_option": "Although the adventure should initially resemble an ordinary corporate infiltration, the GM should bring in unusual selectively bred critters; published advice says this is stronger than the earlier animal attacks and should not be conflated with actual-world facility procedures."
      },
      {
        "heading": "Approach and layout",
        "book_narrator": "The office park has a perimeter fence with razor wire and a break-detection function but is not electrified. Gates are shut at night. Parashield's two-story plascrete building has no ground-floor windows, upper windows not directly accessible without ladder/climbing gear, and a rear loading dock with three large doors and a separate smaller customer/personnel entry. It serves as a sales, veterinary, storage and recordkeeping site. The first floor is divided among animal containment/exhibition, veterinary clinic, and storage; upstairs are sales offices and record-bearing computers."
      },
      {
        "heading": "Animal area",
        "book_narrator": "The loading dock adjoins animal displays. Cages hold mundane Doberman pinschers and German shepherds and paranormal barghests, eyekillers and a sedated cockatrice. One door leads to veterinary space and another padlocked door to storage; stairs lead to offices. Two loose hell hounds inhabit this area, one hidden sleeping behind cages and another awaiting intruders. Two talis cats roam the office floor; these animals usually remain in housecat form and separate from one another, but transform when acting."
      },
      {
        "heading": "Executive office and records",
        "book_narrator": "An upstairs executive office is the only sales office with a door. A local terminal provides access to site records; these mention research initiatives and potential buyers. The source frames these leads as fictional future-adventure possibilities rather than established historical activities."
      }
    ]
