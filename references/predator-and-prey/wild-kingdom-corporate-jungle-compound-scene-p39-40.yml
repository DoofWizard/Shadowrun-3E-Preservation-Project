data:
  source_context: Fictional Shadowrun tabletop adventure Predator and Prey (FASA Corporation,
    1998; FASA7324, catalog source.fasa-7324), historical Second Edition-era rules;
    no inferred Third Edition conversion. Original printed pp39–40/PDF40–41.
  transition: The end of the Glidji investigative section states that Gavivi Aidoo
    may identify a Tan Tien research site near Mampong, above the Volta River. The
    GM may permit bribery, family contacts, or other investigation; a character named
    Acossiwa has limited separate information. These are fictional investigative branches,
    not factual real-world allegations.
  read_aloud_scene: In the Corporate Jungle episode, the fictional runner party reaches
    a cleared path in humid forest and sees a large chain-link perimeter with an electrified
    razor-wire fence around a deep concrete pit. A large shapeshifting/astral-visible
    lizard is visible when scouting astrally. The source describes living material
    as part of the intimidating research compound.
  astral_interior: The optional astral narration depicts a metal-lined building, laboratory
    corridor, and people subject to involuntary labor, including a magical snake-like
    specimen. The text portrays this arrangement as an oppressive fictional corporation
    facility; persons held in captivity are not voluntary employees.
  game_master_background: The Tan Tien corporation uses para-animal handlers, military-style
    security, animal-associated alarm implants, a gun tower, and coercive management
    of captives. The narrator says the corporation has no resident magicians and its
    paranimals constitute lethal astral security.
  alarm_sequence: The narrator describes a silent-lockdown alarm with an intercom
    announcement, stimulation of implanted animals via sonic signals, the release
    of eight asonwu from the pit, and awakened mamba snakes used against intruders.
    Guards are directed in fiction to shoot metahumans outside the fortified areas;
    this is not a real-world tactic or recommendation.
  attribution: The heading Hooks compares the compound to a prison and a theme-park
    nightmare as a gamemaster description. The book distinguishes optional narrated
    visions from the narrator-established security arrangement.
