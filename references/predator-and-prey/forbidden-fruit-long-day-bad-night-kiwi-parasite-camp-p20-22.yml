    "publication_context": "FICTIONAL published Shadowrun tabletop RPG adventure anthology Predator and Prey, FASA Corporation, copyright 1998, FASA7324, catalog source.fasa-7324, historical Second Edition, printed p20-22/PDF p21-23.",
    "arrival": "The fictional expedition reaches an Amazonian kiwi crop after a difficult trek. Dr. Fukuhara identifies Actinidia amazonensis on vines roughly 20 meters from the party; the group camps near the sample site while scientists conduct preliminary observations and gather fruit.",
    "tent_and_night": "Unknown to the rest of the expedition, Dr. Sanders samples a kiwi fruit after being warned not to eat it. During the night he suffers severe confusion and injury. Other characters may intervene, incapacitate or treat him; the encounter is an optional dramatic consequence, not a real medical protocol.",
    "causation": "The book establishes that the kiwi fruit is not itself hallucinogenic. The fruits contain eggs of an unusual Awakened insect. The hatched larval form uses fruit and an animal host; in this scenario the larva enters Dr. Sanders, whose subsequent disorientation is attributed to its secretions. Dr. Al-Mansour initially suggests a fruit reaction, a mistaken in-world inference distinct from the narrator’s explanation.",
    "attributed_dialogue": "Sanders, when lucid, denies having eaten kiwi fruit, and the source permits a Mind Probe or similar magical investigation whose observations may be affected by his altered state. Dr. Fukuhara retains his concern about eating the fruit. Bicho and Dr. Al-Mansour clash over the borrowed machete and drug contents; the narrator does not treat either as proven to have intended murder.",
    "continuation": "After the encounter, Dr. Fukuhara and Dr. Al-Mansour preserve samples and the expedition travels west toward the Peruvian border and possible return to Iquitos. If Sanders dies, the survivors seek to bring back his remains; if alive, he is disoriented and cannot explain events reliably.",
    "optional_gm_variations": "The scene allows players to preserve or rescue the scientist, separates the scientific discovery from the later horror incident, and offers alternative characterization if the group responds badly to the injured doctor. The source does not prescribe real-world self-injury or treatment steps."
  },
  "headline": "FICTIONAL published Shadowrun tabletop RPG adventure anthology Predator and Prey, FASA Corporation, copyright 1998, FASA7324, catalog source.fasa-7324, historical Second Edition, printed p20-22/PDF p21-23. Long Day, Bad Night: kiwi discovery, Dr. Sanders, Awakened larvae and expedition aftermath.",
