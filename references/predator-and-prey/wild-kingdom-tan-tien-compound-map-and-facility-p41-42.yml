data:
  source_context: Fictional Shadowrun tabletop adventure Predator and Prey (FASA Corporation,
    1998; FASA7324, catalog source.fasa-7324), historical Second Edition-era rules;
    no inferred Third Edition conversion. Printed pp41–42/PDF42–43.
  original_art: The original source contains a large top-down diagram headed Tan Tien
    Compound on printed p41/PDF42. This record catalogs the reference image and source
    labels, not a replacement image or real navigational map.
  map_key:
    '1': 6m perimeter fence, razor wire and electric
    1a: remotely controlled gate
    '2': 8m deep concrete pit
    2a: remotely controlled ladder
    '3': gun tower
    '4': vehicle lot (hovertrucks form apparent blocks)
    4a: fuel depot (three-story)
    4b: vehicle repair garage (one story)
    4c: potential blast radius
    '5': two-story wage-slave living quarters
    '6': three-story executive living quarters
    '7': recreation field
    '8': offices
    8a: power generators
    8b: lobby
    '9': research central
  site_population: The fictional compound houses sixty captive wage-slaves and thirty
    researchers in main quarters; eleven of the latter are abducted people like Dr.
    Dicristofaro. An additional forty managerial employees live in executive/security
    quarters.
  other_details: The vehicle lot has four GMC-Nissan hovertrucks (cross-reference
    to Rigger 2, printed p158). The exercise field contains one of twelve awakened
    green mambas, with six additional snakes elsewhere on grounds. The offices use
    Rating 4 card readers and armored-glass Barrier Rating 8 doors. Source section
    describes three camouflaging magical lizards in the lobby.
  source_attribution: These are invented locations and captions from the 1998 tabletop
    publication, not a claim that such a research complex exists.
