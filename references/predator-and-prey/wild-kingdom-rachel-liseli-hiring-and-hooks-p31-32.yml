    "publication_context": "FICTIONAL Shadowrun tabletop RPG adventure anthology Predator and Prey, FASA Corporation, 1998, FASA7324, source.fasa-7324; historical Second Edition; printed p31-32/PDF p32-33. All described characters and enterprises are invented-world subjects.",
    "encounter": "The player characters encounter fictional PBT representative Rachel Liseli at the Dillman Theater. She presents herself as a Johnson recruiting a dependable escort for ocean cargo; her cover name for the private screening is 'Raether'.",
    "disguise": "The source identifies Liseli as a PBT resources-adjustment developer and describes physical-disguise measures, video-recording and low-light cybereyes, and a changed visual appearance. Her purpose is to discourage identification by JIHIH spies, not necessarily to trick the runners about every aspect of the job.",
    "presentation": "Liseli is portrayed as ambitious and promotional; she describes the mission as secure cargo passage to Sekondi and attributes commercial stakes to its success. The GM background reveals she knows about the scientist's presence, even as her pitch conceals that fact from prospective guards.",
    "secrecy": "The source has Liseli ask whether recruits can preserve the shipment's destination and employer confidentiality. She supplies fictional manifest entries for products and controlled substances, while the true presence of Dicristofaro remains undisclosed.",
    "conditional_branches": "If the characters decline, Liseli can leave. Rudeness initially earns a warning; a violent scene can activate her fictional bodyguard Cheveyo (referenced in source book p49) and the possibility of his Remington 950. These are RPG event branches, not instructions for real-world harm.",
    "contract_context": "The runners are not initially told that the employer intends to force the scientist into involuntary experimentation, although the narrator explicitly states this in GM material."
