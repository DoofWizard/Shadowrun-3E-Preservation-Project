  "data": {
    "source_context": "Fictional Shadowrun tabletop RPG adventure Predator and Prey; FASA Corporation (1998), FASA7324; source.fasa-7324; original Shadowrun Second Edition-era publication, no inferred SR3 conversion; printed p51-52, PDF p52-53.",
    "fictional_setting": "The Baser Instincts opening is a dialogue-based scene at Paranormal Animal Control, Lone Star Substation 25, Seattle UCAS. Sergeant Victor Crocker exchanges reports with a receptionist between 11:45 p.m. and 2:58 a.m.; the dialogue and reports represent the fictional characters' knowledge, not independently verified descriptions of every animal.",
    "report_1145_pm": "Crocker is told of four calls so far, all concerning dogs. One patrol's purported hell hound turned out to be a black Labrador; forensic examination of another animal is pending. The receptionist reports that a purported creature escaped from a new Saeder-Krupp facility on Stewart; the company denies loss of guard animals and invokes corporate objections to investigation. Crocker mentions officers Rodgers and Chehy and a forthcoming commanders' meeting.",
    "report_1216_am": "Dispatch reports a devil-rat incident near a Renraku Arcology block, involving a victim able to place an emergency call and PAC unit 3; Crocker observes that such an incident is unexpected in that neighborhood.",
    "report_1232_am": "A traffic unit describes three fatalities at an intersection and four additional responders to the collision emergency. Witnesses characterize an unseen influence as an incubus and report a sense of longing; officers describe these as impressions rather than proven identification.",
    "report_124_am": "The receptionist reports a Saeder-Krupp Facility 3 animal-transport-license confrontation and a breakout around midnight; the report says two cockatrices escaped and their handlers were killed. Crocker orders patrol notification and preparation of a fast-response team, but all units are unavailable; PAC units 1, 4 and 7 are expected to be available within thirty minutes.",
    "report_226_am": "Homicide requests examination of a collapsed three-story building. The caller says demolition personnel found no explosives and suspect underground rockworm activity damaging support structures; this is an investigative hypothesis, not a confirmed cause. PAC 7 is assigned elsewhere and PAC 4 has a seriously injured officer.",
    "report_258_am_and_continuation": "At 2:58 a.m. the receptionist relays a Shore Patrol situation; the continuation on printed p52/PDF53 has Crocker requesting another fast-response team, asking patrol to identify and preserve the unknown animal after an incident, and eventually postponing the night-shift meeting. The scene establishes overtaxed PAC response capacity; no numeric game resolution is supplied by this opening dialogue."
