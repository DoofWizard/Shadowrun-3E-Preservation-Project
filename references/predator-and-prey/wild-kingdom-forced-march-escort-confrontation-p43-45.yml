  "summary": "Source-reviewed archival campaign_guidance record for the invented-world forced march encounter, coercion and branching outcomes passage of FASA Corporation's 1998 Predator and Prey (FASA7324; source.fasa-7324), original printed p43-45/PDF p44-46. Source narration, attributed claims, and optional GM branches are distinguished; game mechanics remain in original edition.",
  "data": {
    "source_context": "Fictional Shadowrun tabletop adventure Predator and Prey (FASA Corporation, 1998; FASA7324; source.fasa-7324), historical Second Edition-era mechanics and setting; no implicit Shadowrun Third Edition conversion. Printed p43-45, PDF p44-46.",
    "opening": "The source establishes that anti-slavery activists at Tan Tien helped Dr. Albert Dicristofaro escape before the player characters reached his room. Fictional escorts are leading him toward Burkina Faso; a trace can be obtained through Tan Tien's compound, Kourouma or investigation.",
    "encounter": "The published GM passage depicts a rain-soaked search, riverbank farming, fictional Awakened monkeys, and a subsequent armed confrontation. The escorts include a Fanti leader and companions, all wary of attempts to seize the scientist. A body of a monkey-like creature lies near the scene.",
    "motivation_and_agency": "The three escorts regard Dicristofaro's freedom from the coercive research corporation as paramount. Their prior connection to anti-slavery activity is established by the narrator. They resist an attempt to return him to captivity. Dicristofaro begs to avoid renewed enslavement; releasing him versus seizing him is an explicit player choice.",
    "optional_outcomes": "The GM may permit Dicristofaro to go free, in which case he thanks the characters and records their identities while the escorts decline to reveal safehouse locations. If the characters attempt to take him, the escorts engage in a team fight; Dicristofaro attempts to escape into the underbrush. If the party is badly injured, the escorts may offer Heal spells and first aid in return for release.",
    "gm_debugging": "If the trail cannot be found, the GM can use further tracking tests before a river crossing. If the party declines to recover Dicristofaro, the GM may have Tan Tien and PBT dispatch a further fictional mercenary squad; the suggested Mercenary archetype reference is SRII p58.",
    "source_attribution": "These are scenario-dependent fictional GM branches; the book's narration and character pleas do not establish a universal outcome."
