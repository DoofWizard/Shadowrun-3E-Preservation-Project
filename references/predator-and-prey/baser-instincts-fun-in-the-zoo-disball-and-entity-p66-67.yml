        "title": "Tell It To Them Straight",
        "book_narrator": "The runners find Reginald Disball at the Fort Lewis Zoological Gardens among primates and visitors. He gives an agitated public defense of his treatment of paranormal animals and describes the attacks as aberrations; those claims are Disball's own account, not independently established reality. His behavior changes as an astral entity controlling him manifests and speaks through him. The narrative describes a crowd, sudden animal attention and attack, and the characters' protective magical effects failing."
      },
      {
        "title": "Hooks",
        "gm_option": "Contrast apparently ordinary zoo school groups and tourists with increasingly strange animal behavior. The zoo is landscaped as a synthetic jungle, blending live vegetation with manufactured scenery and audio. Let characters glimpse Disball's tortured condition without offering a source-grounded excuse for the attacks, and distinguish possession from the host's agency."
      },
      {
        "title": "Behind the Scenes",
        "book_narrator": "The GM-facing narrative establishes that Disball is being controlled by an astral entity. It recognizes runners from a prior dog-pack encounter and intends to erase witnesses and ensure Disball dies, since his death makes the controlling entity's trail harder to trace. It releases paranormal animals to impede the runners, and some animals go on a stampede. Its intended target includes the zoo's behemoth pens and a baby juggernaut, with a threatened catastrophic attack on Seattle.",
        "gm_option": "The entity tries to create circumstances where the runners feel compelled to kill Disball to stop the rampage, but the GM text distinguishes the possessor's strategy from Disball's independent wishes. The chapter permits alternate creature attacks and staged confusion without asserting that every optional creature appears."
      },
      {
        "title": "Location and narrative chronology",
        "book_narrator": "Fort Lewis Zoo is near a UCAS military base; the source says visitors may retain weapons if their cover story and behavior are credible. Disball and the entity use three attack waves while pursuing the zoo's most dangerous exhibits.",
