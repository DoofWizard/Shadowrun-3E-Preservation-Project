id: reference.magic.target-awakened-lands-australian-dreaming
record_type: reference
name: "Target: Awakened Lands — Australian Dreaming and Outback Magic"
domain: magic
status: ingested
source_period: "2062"
source: source.fanpro-10651
printed_pages: "44-59"
pdf_pages: "45-60"
worldview:
  dreamtime:
    - "The source presents the Dreamtime as a primordial and timeless spiritual framework tied to creation, ancestral beings and the Land."
    - "It distinguishes the Dreamtime from an individual's Dreaming, which is a personal relationship to that spiritual order."
  people_and_land:
    - "Aboriginal magical practice is described as inseparable from community, ancestral obligations and place."
    - "Totemic beings are treated as ancestral creators and guardians rather than merely ordinary nature spirits."
koradji:
  role:
    - "Koradji are Aboriginal magical practitioners recognized through a totemic calling and initiation."
    - "The source frames initiation as entry into a personal Dreaming rather than a generic magical credential."
  initiation:
    - "The initiation narrative emphasizes ritual seclusion, instruction, ordeal and a lasting relationship with the practitioner's totem and community."
spirits_and_enchanting:
  - "Spirits of the Dreaming are presented through Aboriginal cosmology and relationships to ancestral beings and the Land."
  - "Australian enchanting traditions make use of local magical materials; formal game statistics are deferred to the Game Information chapter."
named_preparations:
  wuduaku:
    form: "Milky or viscous preparation applied to the tongue."
    described_use: "Associated with carrying songs or communication through the Dreamtime."
  kuman_nhepa:
    form: "Powder mixed with food or drink."
    described_use: "Associated with endurance and stamina, especially for hunters."
  altyerre:
    form: "Paste applied to the eyelids."
    described_use: "Associated with opening awareness of Dreamtime paths or spirit routes."
  rules_note: "This section gives descriptive uses only; no numeric effects, duration, availability or price are inferred."
outback_magic:
  song_lines:
    - "The source identifies Australian song lines as manifestations of mana lines and as routes or maps within Aboriginal magical practice."
    - "Some are described as aspected toward Aboriginal traditions."
  mana_storms:
    - "Outback mana storms can produce physical, magical and psychological phenomena and may have a calm eye."
    - "Their effects vary widely and are not assigned numeric resolution mechanics in this setting section."
  storm_wraiths:
    - "Storm wraiths are described as hostile spirit-like entities associated with mana storms."
    - "They may become physically tangible while materialized; their apparent strength is described as tracking the storm, but no statistics are supplied here."
  alchera:
    - "Alchera are recurring manifestations of landscape or structures that can appear and disappear and may disorient or displace people caught within them."
  uluru:
    - "Uluru is presented as a major sacred and magical location associated with powerful alchera and rumors of valuable magical materials."
links:
  related_reference:
    - reference.magic.target-awakened-lands-mana-phenomena
  formal_rules_deferred_to:
    - "Target: Awakened Lands Game Information pp.99-122"
notes:
  - "This record preserves source-period concepts and named preparations without promoting shadowtalk or rumor to confirmed fact."
  - "No numeric rule is inferred from descriptive prose."
