id: reference.magic.target-awakened-lands-mana-phenomena
record_type: reference
name: "Target: Awakened Lands Mana Phenomena Overview"
domain: magic
status: ingested
source: source.fanpro-10651
printed_pages: "5-13"
pdf_pages: "6-14"
mana_lines:
  definition: "Flows or streams of magical energy from one place to another through astral space."
  aliases:
    - dragon lines
    - song lines
    - dream lines
  access: "A magician in contact with a mana line on the physical or astral plane can tap it for increased magical power."
  appearance: "Varies astrally; may appear as brightening, rivers/tubes, rainbows, shimmering distortion waves or other perceptual forms."
  aspecting:
    - "Can be aspected toward particular magic, traditions, emotions, rituals or recurring human activity."
    - "Surges can temporarily disrupt or alter aspecting."
  mobility:
    - "New lines may appear and old lines disappear."
    - "Existing lines may shift, merge, split or change course."
  side_effects:
    - visual_or_auditory_hallucinations
    - unusual lights or auras
    - altered animal behavior
power_sites:
  definition: "Localized concentrations or pools of mana, sometimes linked to one or more mana lines and sometimes isolated."
  common_context: "Often associated with places of striking physical, emotional, religious or historical significance."
  behavior:
    - "Can experience mana-level surges/flares and attract spirits, astral entities, paranormal creatures and magically sensitive people."
    - "Typically stronger and more stable than surrounding mana, but still subject to fluctuations."
    - "May become aspected according to recurring users or activities."
mana_surges:
  definition: "Sudden random fluctuation in a local mana field affecting astral and physical planes."
  effects:
    - "Magic becomes less predictable and more dangerous."
    - "Spells/rituals may fizzle, pop off repeatedly, run out of control, change effective power, or otherwise misbehave."
    - "Effects primarily alter the magic itself rather than directly harming the magician, except through consequences of altered magic."
mana_flares:
  definition: "Predictable or semi-predictable increase in local mana density."
  benefits_and_risks:
    - "Magic becomes easier and temporarily more powerful."
    - "Some flares simply grant broad additional magical power."
    - "Uncontrolled flares may empower every magical effect in the area and make results hard to control."
    - "Possible backlash includes burnout/exhaustion and severe physical consequences."
mana_ebbs:
  definition: "Low-tide state in a mana field."
  effects:
    - "Available mana decreases."
    - "Magical effects require more effort and practitioners may have to draw more heavily on personal energy."
    - "Awakened beings and paranormal wildlife may avoid the affected area."
mana_storms:
  definition: "Serious, powerful, uncontrolled local mana disturbance; likened to a sudden powerful area-effect magical event accompanied by atmospheric disturbance."
  scale: "May range from roughly 50-100 meters to several kilometers in radius."
  behavior:
    - "May include winds, clouds and precipitation."
    - "Can briefly create persistent magical effects after passing."
    - "Effects are unpredictable and potentially destructive, ranging from altered combat magic to hallucinations, bodily transformation, madness, disease or disappearance."
astral_shallows:
  definition: "Area where the interface between physical and astral planes is thinned."
  effects:
    - "Astral things become visible/detectable from the physical world without astral perception."
    - "Phenomenon is usually temporary, from seconds to days, though longer examples exist."
    - "The source leaves open whether sufficiently thinned barriers could permit physical contact."
astral_constructs:
  definition: "Inanimate astral objects appearing spontaneously without intelligent agency; may correspond to physical objects, buildings, terrain or historical/emotional impressions."
  nature:
    - "Invisible/intangible on physical plane but solid/tangible to astral beings."
    - "Some can manifest visible physical-world appearances under certain conditions."
  materialized_constructs:
    - "Rare reports describe constructs becoming dual-natured/materialized and physically solid."
    - "The source treats Australian alchera as the best-known class, with scattered non-Australian reports after 2061."
astral_rifts:
  definition: "Localized weakening of the astral/physical interface related to but more extreme than a shallow."
  effects:
    - "Can permit physical beings to perceive and access the astral plane without normal astral projection, even mundane beings in some examples."
    - "Some rifts may connect astral space to one or more metaplanes."
  duration: "Usually rare and temporary, often hours."
  examples:
    - "Chaco Canyon Rift"
    - "Dunkelzahn Rift in DeeCee"
  caution: "Source reports severe and poorly understood consequences for beings caught in or passing through rifts."
links:
  formal_rules_deferred_to:
    - "Target: Awakened Lands Game Information pp.99-104"
