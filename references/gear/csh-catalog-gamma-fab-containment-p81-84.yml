data:
  source_period: Ares Catalog 2055, Fall 2055
  reference_scope: Fictional seller product entries and item statistics; vendor promises are source-attributed,
    not independently validated SR3 mechanics.
  items:
  - id: gamma-scopolamine
    printed_page: 81
    pdf_page: 90
    catalog_name: Gamma-Scopolamine
    seller: Ares Arms Chemical Division
    rating: 10D Stun
    speed: Immediate
    vector: Injected
    availability: 8/2 weeks
    cost_nuyen_per_dose: 300
    street_index: 3
    commercial_description: Seller markets an acetylcholine uptake-blocking chemical to immobilize targets;
      described as derived from Atropa belladonna (nightshade).
    links_to_rules:
    - rule.security.csh-gamma-fab-containment-effects-p81-84
    source_marketing_distinction: Fictional Ares seller presents the chemical as a purportedly nonpermanent
      way of incapacitating unauthorized personnel; separate signed reader comments dispute safety claims.
  - id: fab-1
    printed_page: 82
    pdf_page: 91
    catalog_name: Fat Bacteria, Strain 1 (FAB-1)
    seller: BacteriTech
    use_category: mobile living astral containment; source describes astral beings as intercepted by sufficiently
      concentrated FAB-1
    canister_pricing:
    - volume_m3: 50
      cost_nuyen: 3000
    - volume_m3: 500
      cost_nuyen: 25000
    - volume_m3: 5000
      cost_nuyen: 200000
    coolant_feeding_vat_pricing:
    - volume_m3: 50
      cost_nuyen: 2500
    - volume_m3: 500
      cost_nuyen: 20000
    - volume_m3: 5000
      cost_nuyen: 175000
    recharge_refill_discount_percent: 10
    street_availability: Not generally available on the street; Availability at gamemaster discretion
    shipping: Shipped in coolant/feeding vat transports
    use_limits: After removal from the feeding vat, FAB-1 begins dying immediately and cannot be reused; field
      testing described as minimal
    cross_reference: Fat Bacteria, Gamemaster Information, printed p.103
    links_to_rules:
    - rule.security.csh-gamma-fab-containment-effects-p81-84
    buyer_notice:
      controlled_testing_claim: BacteriTech claims stringent controlled testing while acknowledging minimal
        field testing.
      noncontained_deployment_notice: Seller strongly urges users of noncontained FAB-equipped countermeasures,
        specifically the Bacterial Containment Grid or FAB-UV Aerosol Devices, to contact BacteriTech as soon
        as the situation is under control.
      seller_response_promise: BacteriTech promises to send specially equipped debriefers and cleanup specialists
        to the customer site without charge.
      contained_product_return_notice: For a contained FAB product, identified as Astral Containment Devices,
        the seller asks that the used product be sent to BacteriTech as soon as possible.
      recharge_discount_percent: 10
      liability_disclaimer: BacteriTech disclaims responsibility for damages from the use or misuse of its
        product.
      source_kind: Fictional BacteriTech Buyers Note in FASA7118 printed p82/PDF91, distinct from independently
        verified rules.
  - id: fab-uv
    printed_page: 83
    pdf_page: 92
    catalog_name: Fat Bacteria, Ultraviolet (FAB-UV)
    seller: BacteriTech
    uv_aerosol_pricing:
    - volume_m3: 50
      cost_nuyen: 5000
    - volume_m3: 500
      cost_nuyen: 45000
    uv_freezer_pricing:
    - volume_m3: 50
      cost_nuyen: 10000
    - volume_m3: 500
      cost_nuyen: 50000
    source_release_lifespan_hours: approximately 3-4
    storage: Aerosol canisters shipped frozen, stored in sub-zero freezers until needed
    use_limits: Upon removal from freezer, bacteria begin dying and cannot be reused; 5,000 m3 canister has
      underbarrel mounting option on BacteriTech FAB-Netgun
    cross_reference: Fat Bacteria, Gamemaster Information, printed p.103
    links_to_rules:
    - rule.security.csh-gamma-fab-containment-effects-p81-84
  - id: bcg
    printed_page: 84
    pdf_page: 93
    catalog_name: Bacterial Containment Grid (BCG)
    suppliers: Ares Security International design engineers and BacteriTech magical security engineers
    component_pricing:
    - part: CerebroTech Computerized Release Control
      cost_nuyen: 5000
    - part: Pressurized Release Conduits
      cost_nuyen: 5000
    - part: FAB-1
      cost: See FAB-1 price list
    - part: Coolant/Feeding Vat
      cost: See FAB-1 price list
    - part: Construction Costs
      cost: Call for estimate/appointment
    - part: Portable Dispensers (50 m3)
      cost_nuyen: 7000
    conduit_requirement: One conduit required for each FAB-1 canister in the system
    street_availability: Not normally available on the street; Availability at gamemaster discretion
    links_to_rules:
    - rule.security.csh-gamma-fab-containment-effects-p81-84
    seller_service_scope: Fictional supplier offers site-specific design and installation consulting for size
      and budget, including subcontracted construction.
