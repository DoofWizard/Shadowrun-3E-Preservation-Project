headline: "Ares 2055 catalog: CCSS and rigging diagnostic equipment"
summary: Equipment specifications, forms, ratings and costs, retaining the additive +7,500¥ internal CCSS decoder price.
data:
  source_period: Fall 2055
  lineage: Second Edition source-period catalog equipment reference; no inferred replacement of Third Edition mechanics.
  printed_page_76_closed_circuit_simsense:
    printed_page: 76
    pdf_page: 77
    product: Closed-Circuit Simsense (CCSS)
    manufacturer: CerebroTech
    operator: trained security rigger
    system: security-system devices, surveillance/control devices, security drones
    function: CCSS-equipped devices report sensory status from the protected area, including opened doors, climbed fences and broken windows.
    rigger_view: Rigger receives sight and sound through networked surveillance/control devices and security drones.
    decoder_requirement: Install CCSS decoder in remote-control deck or security station and modify every security device for CCSS protocols.
    catalog_rows:
      - item: CCSS Decoder
        mount: External
        availability: 8/2 weeks
        cost_nuyen: 10000
        street_index: 3
      - item: CCSS Decoder
        mount: Internal
        availability: 12/3 weeks
        cost_nuyen: 7500
        cost_modifier_sign: "+"
        street_index: 3
      - item: CCSS Device Retrofit
        availability: N/A
        cost_expression: 25 percent of original cost
        street_index: N/A
      - item: CCSS Device
        availability: N/A
        cost_expression: +20 percent of original cost
        street_index: N/A
      - item: CCSS Drone/Vehicle Modification
        availability: N/A
        cost_nuyen: 1500
        street_index: N/A
    cross_reference: Closed-Circuit Simsense, Gamemaster Information p.102
  printed_page_77_protocol_emulation_utility:
    printed_page: 77
    pdf_page: 78
    product: Rigger Protocol Emulation Utility
    form: Cyberdeck program translating inputs and outputs to the protocols used by riggers, rigged systems and drones.
    protocol_ratings: Higher-rated versions include every protocol in lesser levels.
    size_mp_expression: (Rating × Rating) × 4
    availability: Varies by rating; see Utility Programs p.262, SRII
    cost: Varies by rating; see Utility Programs p.262, SRII
    street_index: Varies by rating; see Utility Programs p.262, SRII
    cross_reference: Utility Programs p.262, SRII
  printed_page_78_system_control_rig_emulator:
    printed_page: 78
    pdf_page: 79
    product: System-Control Rig Emulator (SCRE)
    manufacturer: Ares Security International
    function: Diagnostic interface between a cyberdeck and a rigged security system or remote-control deck that emulates a standard system control rig.
    external_form: Attached between cyberdeck and rigged security system or remote-control deck.
    internal_form: Installed inside cyberdeck.
    dependency: Requires Rigger Protocol Emulation Utility.
    catalog_rows:
      - item: System-Control Rig Emulator
        mount: External
        availability: 6/72 hrs
        cost_nuyen: 25000
        street_index: 2
      - item: System-Control Rig Emulator
        mount: Internal
        availability: 8/72 hrs
        cost_nuyen: 20000
        street_index: 2
  printed_page_79_protocol_emulation_module:
    printed_page: 79
    pdf_page: 80
    product: Rigger Protocol Emulation Module
    function: Enables rigger diagnostics of protocols including CCSS across modern rigged security systems and drones.
    external_form: Mounted inline between the rigger's system-control-rig dataport and device undergoing diagnosis.
    internal_form: Mounted inside remote-control deck; mandatory for remote systems.
    maximum_rating: 10
    rating_effect: Higher-rated modules hold more protocols in firmware.
    catalog_rows:
      - item: Rigger Protocol Emulation Module
        mount: External
        availability_expression: (Rating)/(Rating) days
        cost_expression_nuyen: 5,000 × Rating
        street_index: 2
      - item: Rigger Protocol Emulation Module
        mount: Internal
        availability_expression: (Rating + 2)/(Rating) days
        cost_expression_nuyen: 4,500 × Rating
        street_index: 2
  printed_page_80_decryption_module:
    printed_page: 80
    pdf_page: 81
    product: Rigger Decryption Module
    function: Cryptographic firmware for testing encryption of rigged security systems and drones; higher ratings contain more protocols.
    external_form: Mounted inline between rigger's system-control-rig dataport and device under diagnosis.
    internal_form: Mounted in remote-control deck; required for remote systems.
    maximum_rating: 10
    catalog_rows:
      - item: Rigger Decryption Module
        mount: External
        availability_expression: (Rating)/(Rating) days
        cost_expression_nuyen: 7,500 × Rating
        street_index: 2
      - item: Rigger Decryption Module
        mount: Internal
        availability_expression: (Rating + 2)/(Rating) days
        cost_expression_nuyen: 7,000 × Rating
        street_index: 2
