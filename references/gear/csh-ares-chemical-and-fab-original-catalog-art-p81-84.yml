    pdf_page: 93
    published_heading: BACTERIAL CONTAINMENT GRID
    observed_artwork: Monochrome angled view of an interior space with a checkered
      floor, parallel slanted features on one wall, and a row of round fixtures beside
      a central vertical panel. It is a product illustration, not an exact measured
      installation plan.
