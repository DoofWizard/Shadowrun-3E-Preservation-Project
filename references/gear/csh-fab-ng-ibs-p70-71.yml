headline: FAB-NG and IBS specifications
summary: Technical specifications for two catalog products.
data:
  source_scope: Ares Security International Fall 2055 catalog; printed p70/PDF71 FAB-NG;
    printed p71/PDF72 IBS
  lineage: Source-era reference, not an inferred Shadowrun 3E replacement.
  fab_ng:
    printed_page: 70
    pdf_page: 71
    manufacturer: BacteriTech in conjunction with Ares Arms
    designation: BacteriTech FAB-NG (Fat Bacteria Netgun)
    basis: Modified Williams Technologies netgun
    ammunition: Interconnected hollow polymer tubes filled with FAB-1 (Fat Bacteria,
      Strain 1)
    purpose: Can capture astral targets; see Fat Bacteria, Gamemaster Information
      pp103-104 for Special damage/effect
    trigger_sequence:
    - First trigger primes net by transferring FAB-1 from holding vat into net in
      firing position
    - Second trigger fires net
    primed_active_duration: six to eight hours
    reuse: Each net can be used only once
    sizes: Standard for human-sized or smaller; Large for large orks and trolls
    large_compatibility: Large launcher can fire both net sizes
    weapon_rows:
    - type: Standard
      conceal: 3
      ammo: 4(b)
      mode: SA
      damage: Special**
      weight: 4.5
      availability: 8/14 days
      cost_nuyen: 1500
      street_index: 4
    - type: Large
      conceal: 2
      ammo: 4(b)
      mode: SA
      damage: Special**
      weight: 5
      availability: 8/14 days
      cost_nuyen: 2500
      street_index: 5
    additional_net_shots:
    - type: Standard
      conceal: 7
      weight: 0.5
      availability: 8/14 days
      cost_nuyen: 300
      street_index: 4
    - type: Large
      conceal: 5
      weight: 0.75
      availability: 8/14 days
      cost_nuyen: 500
      street_index: 5
    feed_canister_required: true
    feed_canister_options:
    - cost_nuyen: 1000
      capacity: 4 standard nets
    - cost_nuyen: 1500
      capacity: 4 large nets
    mounting: May be drone-mounted
    accessories_allowed:
    - standard top-mounted
    - standard underbarrel-mounted
    accessories_disallowed:
    - barrel-mounted
  ibs:
    printed_page: 71
    pdf_page: 72
    name: Individualized Biometric Safety (IBS)
    manufacturer: Ares Arms
    mechanism: Specialized biometric identification reader on weapon grip linked to
      weapon internal safety
    registration: Weapon-owner palmprint image stored in non-reprogrammable firmware
    operation: On pickup, reader scans palm and compares against stored image; match
      releases safety, mismatch freezes safety on and prevents use
    compatibility: Fully compatible with most smartlink/smartgun technology
    pricing_rows:
    - type: IBS
      concealability: —
      weight: 0.1
      availability: 3/36 hours
      cost_nuyen: 2250
      street_index: 1.5
    - type: Cyber modification
      concealability: —
      weight: —
      availability: 3/36 hours
      cost_nuyen: 800
      street_index: 1.5
    ownership_transfer: Burn a new firmware optical chip
    blank_chip_cost_nuyen: 50
    blank_chip_programming: Computer repair shop or facility
    cyberarm_cyberhand: User must use cyber modification; cyberhand mounting contains
      pass-chip linked to weapon
