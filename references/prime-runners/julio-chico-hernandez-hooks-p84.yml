data:
  character: Julio "Chico" Hernandez
  heading: Hooks
  source_anchor:
    printed_page: 84
    pdf_page: 93
  branching_scenarios:
  - name: Patsy
    setup: Chico offers runners an apparently ordinary environmental assignment and
      poses as a wealthy young idealist. In fact he secretly arranges an attack that
      kills around two dozen innocent people and falsely attributes it to the runners.
    consequence: Runners have to discover Chico's deception and seek a confession
      or proof; a ferocious corporate response follows. Runners were recruited under
      false pretenses rather than knowingly agreeing to the attack.
  - name: Too close to the fan
    setup: Runners happen to be innocent bystanders, but Chico's corporate employers
      decide to use them as scapegoats after one of his actions.
  - name: Stop Chico
    setup: A corporate employee learns that their employer is contacting Chico, and
      contacts an environmental group seeking a meeting with its representative and
      the runners.
    turn: The corporate employee is killed on the way to the meeting, and the employer
      seeks to kill the runners as well.
    next_step: The runners investigate the employer's motive and internal information
      to discover the truth and halt attempts against them. Accessing the company's
      computer system is described as an in-game investigative plot, without a specific
      real-world procedure.
  - name: Runaway train
    setup: After Chico's mental condition worsens, two distinct corporate Johnsons
      approach the runners within an hour, both requesting that Chico be killed. They
      provide incompatible reasons and identify him under different names.
    consequence: Each corporation becomes suspicious of the runners' involvement with
      the other, and the source proposes that accidents involving the manufacturers
      can further escalate paranoia.
  - name: After the bomb has gone off
    setup: One of Chico's bomb attacks affects both the brother and the best friend
      of a corporate employee, producing involuntary organ donation as an aftermath.
    employer: That employee grows suspicious of his company's investigation and hires
      runners for further inquiry.
    discovery: The runners uncover evidence that their employer's own corporation
      contracted Chico to address its internal personnel power struggle.
    consequence: The corporation attempts to kill their employer and the runners.
      The runners still need one more piece of evidence before publicly disclosing
      their discoveries.
  - name: Bring Chico in alive
    setup: An activist group has accumulated enough information to establish Julio
      Hernandez's identity and asks the runners to capture him alive for questioning.
    opposition: Multiple corporate groups now consider Chico a liability and seek
      his death, while also targeting the runners.
  assertion_status: These are alternative fictional scenario hooks, not events all
    established to occur in the same campaign history.
