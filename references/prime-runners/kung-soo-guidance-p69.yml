data:
  subject: Kung Soo (Grandfather Soo)
  london_overground_context:
  - The narrator portrays Soo as exercising major influence over organized criminal
    activity in central London; runners seeking to affect that milieu may encounter
    his interests.
  - The narrator distinguishes his relative lack of interest in individual independent
    runners from his demand that competing organized operations acknowledge his authority.
  - The source notes his large landholdings and usual accompaniment by at least one
    son and two bodyguards; exact statistics are indexed separately.
  invitation_scenario:
    condition: Runners have information Soo wants, or their activity comes too close
      to Tong interests.
    presentation:
    - Soo may summon them to dinner at the Temple of the East; the source frames declining
      as dangerous, rather than requiring an absolute player choice.
    - The meal is luxurious and ostensibly uncompensated; urgent business might be
      raised afterward during tea, or no business at all may be discussed if Soo is
      merely evaluating the guests.
    - The narrator specifies that accepting his hospitality creates a felt debt that
      he may later invoke; this is a social scenario condition, not a numeric game
      mechanic.
  employment_scenario:
  - He may pay well for rare and valuable runner skills, while expecting loyalty,
    discretion, and obedience.
  - Alternatively he may hire unwitting runners to absorb responsibility for a Tong
    scheme; the possibility is conditional guidance, not a guaranteed event.
  source_section: Hooks continuation, printed p69/PDF p78; independent pseudonymous
    forum warnings are indexed as separately attributed claims.
