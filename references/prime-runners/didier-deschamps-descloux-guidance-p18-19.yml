data:
  character: Didier Deschamps-Descloux
  source_anchors:
  - printed_page: 19
    pdf_page: 20
    heading: Hooks
  - printed_page: 19
    pdf_page: 20
    heading: Notes
  optional_scenarios:
  - premise: Runners may find assignments protecting Tri-D Global sports clients.
    source_stakes: The source includes hired attackers, doping, sabotage, kidnapping,
      and other possible threats to those clients.
    certainty: Optional campaign employment, not an established event.
  - premise: Runners may become involved in conflict with criminal organizations by
      unknowingly associating themselves with Tri-D Global's illicit business.
    source_stakes: The source names yakuza and Mob rivals; it does not establish that
      any particular job necessarily triggers a confrontation.
    certainty: Hypothetical branch.
  - premise: A sports star who discovers Tri-D Global's criminal activities may seek
      extraction by runners.
    source_stakes: If an agent of Tri-D overhears the runners speaking with that athlete,
      the source contemplates the athlete being killed and the runners falsely accused
      of the killing.
    certainty: Conditional hypothetical, not a historical killing.
  - premise: An apparent rival of Tri-D may hire runners to investigate rumors of
      its criminal conduct.
    hidden_agency: The apparent rival is actually a Johnson working for Tri-D who
      is testing Tri-D's own security personnel.
    consequence: The source states Tri-D intends to have the runners killed after
      their investigation, whether it succeeds or fails.
    certainty: Optional deceptive-employer storyline; do not misattribute the hiring
      to a genuine rival agent.
  - premise: If Tri-D Global tries to acquire a sports team, competing interests may
      hire runners on opposing sides.
    source_stakes: Tri-D may employ both legitimate and illegal means, enlist runners
      to assist, or attempt to shift blame for its own employees' actions; those resisting
      the acquisition may separately recruit runners.
    certainty: Conditional acquisition scenario.
  entourage_in_source_notes:
    secretaries: Three or four, characterized as having limited secretarial skills.
    lawyers: Three.
    image_consultants: Two.
    advertising_personnel: A couple.
    bodyguards: Approximately a dozen samurai or runner types.
    clients_traveling_with_him: One or two.
    important_negative: The printed page says image consultants, NOT mage or magical
      consultants.
  presentation_and_reputation:
  - The source portrays Tri-D as highly image-conscious and fond of appearing on chat
    shows when traveling.
  - The source lists Tri-D branded designer clothing, perfume, jewelry and other accessories.
  - The source describes poorly paid labor in less-developed countries and notes that
    some manufacturing operations may be illegal, including harm to protected, endangered
    or sentient paranormal species; this is a qualified source claim, not a finding
    about every product.
  rules_boundary: Exact skill ratings, bioware modifiers and equipment are held in
    the linked historical Second Edition rule record, not changed by this campaign
    guidance.
  related_rules_record: npc.prime_runners.didier_deschamps_descloux.sr2_stats
  scenario_attribution: All hooks are optional gamemaster scenarios, not verified
    events in the setting chronology.
