data:
  character: Didier Deschamps-Descloux
  source_anchor:
    printed_page: 19
    pdf_page: 20
    headings:
    - Hooks
    - Notes
  optional_scenarios:
  - Runner teams may be hired as additional bodyguards or support staff for celebrity clients attending
    high-profile sports events.
  - A client athlete may seek discreet extraction after discovering troubling business relationships;
    the source treats potential intervention, betrayal, or later accusations as scenario branches, not
    historical events.
  - An in-world rival agent may contract runners to examine Tri-D Global’s security and later try to avoid
    paying them; this is a fictional employment and betrayal plot.
  - If Tri-D Global decides to acquire a team or new sports franchise, rivals may recruit runners for
    competition, publicity or reputational-conflict storylines.
  - The source includes a hypothetical attempt to shift responsibility for misconduct to outside contractors;
    this is an optional campaign complication.
  roleplaying_notes:
  - Tri-D travels with a conspicuous mixed entourage of legal, marketing, magical, administrative and
    security personnel; individual counts are captured in the historical profile.
  - The character is intensely image-conscious, demands branded merchandise, and favors public attention.
  - The GM may explore labor, sourcing, protected-species and corporate-entertainment ethics as claimed
    or hypothetical complications without assuming all claims are established.
  - Source includes no standalone new mechanical rule for these hooks; preserve his numeric skills, bioware
    bonuses and equipment in linked rule record.
  related_rules_record: npc.prime_runners.didier_deschamps_descloux.sr2_stats
  certainty: All hooks are optional scenario ideas, distinct from documented biography or rules.
