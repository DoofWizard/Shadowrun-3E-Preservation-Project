edition_scope: Historical Shadowrun Second Edition, FASA7116 Prime Runners (1994); not converted to SR3
content_class:
- attributed_claim
data:
  discussion_target: Erik Vernon Dreyfuss
  source_form: In-world online commentary, differing subjective assessments, not narrator-verified events
  comments_in_print_order:
  - speaker: Niney
    timestamp_as_printed: 13:00:67/10-02-55
    assertion_type: negative appraisal
    claims:
    - Derides Erik as socially awkward and incompetent in the field.
    - Acknowledges he can fund others, but believes participation alongside him is a costly condition.
    - Claims his inability to shoot makes him a liability in dangerous field encounters.
    certainty: speaker opinion; not narrator-proved
  - speaker: Crusher
    timestamp_as_printed: 17:51:22/10-03-55
    assertion_type: negative appraisal
    claims:
    - Says Erik's attempts at humor are poor.
    - Claims Erik wants acceptance to an irritating degree; describes a personal desire to strike him.
    certainty: speaker opinion and hostile rhetoric
  - speaker: Slater
    timestamp_as_printed: 21:20:34/10-07-55
    assertion_type: partial defense
    claims:
    - Believes Erik is acceptable company.
    - Compares Erik favorably with would-be New Jersey shadowrunners who think a torn leather jacket, a rusty .22 firearm,
      and skill at the fictional game Super Mario Nerds qualify them as shadowrunners.
    certainty: speaker opinion
  - speaker: Ig
    timestamp_as_printed: 07:07:21/10-09-55
    assertion_type: cynical response to Slater
    claims:
    - Observes Erik is wealthy and readily pays friends or colleagues.
    - Regards the relationship as an opportunity to use his generosity.
    certainty: speaker opinion
  - speaker: Trump
    timestamp_as_printed: 23:11:58/10-08-55
    assertion_type: opportunistic proposal
    claims:
    - Urges financially constrained runners to cultivate Erik socially and obtain introductions.
    certainty: speaker advice, not established future action
  ordering_caveat: Keep comments in source printed order; October 9 entry appears before October 8 entry; do not silently
    reorder or correct timestamps.
framing: newsroom_neutral
headline: Erik Vernon Dreyfuss — source-attributed reactions, historical Second Edition
summary: Five individually dated in-world opinions about Erik; Slater’s named comparison, the other voices’ assessments and
  their source ordering are preserved.
