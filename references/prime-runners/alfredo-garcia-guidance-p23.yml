data:
  source_heading: Hooks
  scope: Scenario possibilities for a game master, not universally established campaign
    events
  contact_use: A runner group that respectfully befriends Alfredo may gain a valuable
    London contact and access to overheard conversations involving socially prominent
    patrons, runners and Johnsons.
  club_owner: Gwendolyn Robinson
  ownership_and_recruitment:
    club_owner: Gwendolyn Robinson
    recruitment: She charmed Alfredo during a visit to Spokane and persuaded him to
      work at the Technicolor Yawn in London
    owner_trade: Imports Australian Aboriginal art and is beginning to import Native
      American art for a proposed Amerindian-themed club
  potential_conflict:
    law: The source proposes that Robinson violates export rules and also imports
      magical fetishes and talismans without knowing their character
    buyers: British magicians exploit her lack of knowledge in furtherance of illicit
      trade
    Alfredo_knowledge: Alfredo has only recently discovered the scheme
    Alfredo_reaction: He is angered by the treatment of Salish-Shidhe culture and
      disturbed by intimidating outsiders surrounding the owner
    concerns: He may act or demand action but worries about returning home if the
      bar closes
  adventure_direction: The player group may investigate, defend or advise the bar
    and deal with its outside pressures and cultural property issues; the text does
    not mandate one result.
  mechanics: No new standalone numeric procedure introduced by this Hooks section.
