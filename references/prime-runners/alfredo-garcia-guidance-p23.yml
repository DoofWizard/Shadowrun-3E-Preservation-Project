  scenario_scope: Historical in-world character hook as presented by the source narrator,
    not an actual contemporary event or a mandatory outcome for any campaign.
  contact_use:
    premise: Runners who befriend Alfredo Garcia respectfully can gain an excellent
      London contact.
    known_information: Alfredo overhears the small talk of London socialites, runners
      and Johnsons, and knows what the Technicolor Yawn's owner does outside ordinary
      club operations.
  owner_and_recruitment:
    owner: Gwendolyn Robinson
    recruitment: Robinson charmed the lonely Alfredo during a visit to Spokane; Alfredo
      then traveled to London to work at her bar.
    club: Technicolor Yawn in London
  trade_and_related_activities:
    artwork:
    - Robinson imports Australian Aboriginal art to decorate her current club.
    - She has begun importing Native American Indian art for a new Amerindian-themed
      club that is still only planned.
    export_law: The source narrator states Robinson breaches export laws in doing
      so; the source does not give statutes or jurisdictions.
    spell_goods: Robinson also imports spell fetishes and talismans for illicit sale
      to British magicians.
    customs_context: The source narrator describes British Customs & Excise as poor
      at distinguishing native art from magical fetishes.
    sale_and_use_of_profits: Robinson, not the buyers or customs officers, sells those
      goods illegally and uses her profits to finance various criminal activities;
      the source does not enumerate those activities.
    agency_guard: The source does not say Robinson is unaware of the nature of these
      goods, or that the magicians are exploiting her; neither assertion may be substituted
      for Robinson's stated agency.
  alfredo_awareness_and_dilemma:
    discovery: Alfredo has only recently learned about Robinson's activities.
    response: He is very angry that what he views as the cultural property of his
      Salish-Shidhe friends, among others, is being taken unfairly.
    observation: He has noticed unspecified unpleasant men in dark suits and sunglasses
      around Robinson recently; their identity and purpose are not established.
    competing_interests: He wishes to act or enlist action, but worries about how
      he would return home if the Yawn ceased operating.
    adventure_need: The source explicitly anticipates that he will need outside help,
      without specifying its form or a mandated resolution.
  mechanics: No standalone numerical mechanic is introduced by this Hooks section;
    Alfredo's attribute, spell and special-modifier rules are preserved in his separate
    statistics record.
