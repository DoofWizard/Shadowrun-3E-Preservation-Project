  consultant_role:
    possible_assignment: Roz can advise runners about the pre-Awakening spike children
      and other obscure magical subjects
    political_exception: The source says she may hesitate to reveal information about
      especially prominent people such as Lugh Surehand and Liam O'Connor
    expertise: She holds unusual knowledge about free spirits, summoning, and dealings
      with spirits
    contacts: She knows several free spirits in America and Europe
  astral_quest_scenario:
    offer: Roz can use her Astral Gateway power to help a magician undertaking a metaplanar
      journey
    condition: She expects Karma in return, for both herself and Carruthers
    consent: The magician or willing associates choose whether to enter the arrangement
    mechanics_reference: rules/prime-runners/roz-nuaru-stats-p50-51.yml
  long_term_relationship:
    premise: Roz may become an ongoing advisor and confidante of a runner team, not
      only a one-off consultation
    possible_organization: GM may introduce or develop an interconnected network of
      free spirits sharing related objectives
    optional_not_historical: The network and any resulting missions are suggestions
      rather than established in-world outcomes
  carruthers_portrayal:
    nature: Carruthers is an intelligent, calculating and manipulative cat rather
      than an ordinary animal
    background: The spirit's pact with Carruthers and his role as vessel for her Hidden
      Life are described in the notes
    presentation: Players may initially encounter Roz under her public human and Cat-shaman
      identity
    mechanics_reference: rules/prime-runners/carruthers-cat-stats-p50-51.yml
