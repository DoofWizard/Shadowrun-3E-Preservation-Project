  scenario_hooks:
  - Runners may hire her to conduct her own surveillance or join a paid surveillance assignment.
  - Her magic and investigative experience may support fictional distractions during a run and remote observation of restricted areas.
  - She expects a coherent mission plan and contingencies when accompanying runners and otherwise prefers to operate independently.
  - A story may feature Almodovar as the sole holder of information crucial to a current investigation, with details connected to her Cord Mutual history.
  - A campaign can posit that she stored documentary evidence somewhere for release if she died; Cord Mutual's concern about such evidence is posed as a hypothetical explanation, not an established event.
  - A hostile faction may also object to her latest investigation, potentially putting runners in conflict with that group.
  fictional_magic_and_behavior:
  - She favors Mask or Vehicle Mask for concealed direct approaches and Clairaudience or Clairvoyance for remote inquiry.
  - The source gives a cooperative/bribed guard as an example of a possible focus for Clairvoyance; this remains a game scenario example.
  - She avoids watcher spirits when possible because they are easy to notice and require costly ritual materials.
  - She dislikes dealing with spirits and chooses Shapechange only when no indirect or disguised method is available; her Stealth skill then remains relevant.
  - Improved Invisibility is her customary protection while making an approach and she uses detection spells according to the situation.
  - For fictional witness confusion or scene disruption, the source mentions masking, astral static and Chaotic World spells.
  - She usually asks for payment but may accept a grimoire containing useful spell variants at Force Ratings 6-8 in lieu of cash.
  personal_ties:
    daughter: Gloria
    childcare: Leaves Gloria with a female friend when on a run
    emergency_contacts: That friend can call people who knew Almodovar from her earlier CAS years if danger develops
    response_to_betrayal: The source warns of a severe reaction if runners betray her trust
  spellcaster_profile:
    grade: 3
    tradition: Hermetic order
    centering_ritual: Slow swaying dance performed without moving from her standing position; important for surveillance magic
