data:
  character: Juan Jesús Diaz
  source_anchor:
    printed_page: 17
    pdf_page: 18
    headings:
    - Hooks
    - Notes
  optional_scenarios:
  - Runners may encounter Diaz or other Dicemen in a street confrontation, an attempted robbery, a protection
    request, or a gang dispute; no encounter is established as a historical event.
  - A media company might hire runners to help keep Diaz safe and negotiate the rights to represent him,
    while Diaz may distrust corporate involvement.
  - The source proposes that rival chess interests, including an agent of the current UCAS/CAS champion
    or Grishkin, could try to interfere with his career; this is hypothetical.
  - A longer campaign can follow Diaz through the prospect of the 2058 world title match, with runners
    earning his trust and helping manage the growing pressures of celebrity.
  - For the proposed final twenty-four-game series the source imagines chess analysts, seconds, fashion
    and public-relations advisers, tutors, and a protective entourage; these are campaign ideas rather
    than required gameplay mechanics.
  - The source imagines opponents supported by wealthy European and corporate sponsors, enabling political
    and interpersonal plot complications.
  character_and_party_dynamics:
  - The notes recommend portraying Diaz as smart at chess, volatile, personally vulnerable, and capable
    of empathy rather than as an interchangeable gang antagonist.
  - Runners may need to win his trust rather than assume money or corporate status can control him.
  - His trusted fellow gang members are his usual companions; a GM may customize them for the campaign.
  separate_rules_reference: npc.prime_runners.juan_jesus_diaz.sr2_stats
  source_scope: Optional scenario material from a historical SR2 sourcebook; no assertion that any speculative
    event occurred.
