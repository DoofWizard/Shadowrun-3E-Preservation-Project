    sequence: PDF66 is an illustrated seven-character montage with name captions;
      PDF67-73 are seven larger portraits pairing an illustrative scene and inset
      with one attributed character speech panel each.
  montage_pdf66:
    row_one_names:
    - Ariel Almodovar
    - Martin de Vries
    - Jonty Geldenhuys
    row_two_names:
    - Susan Hands-as-Wings
    - McBean
    - Sukie Redflower
    - Michael James Sutherland
    artwork: Seven juxtaposed color character/action illustrations on a dark field,
      with names in small captions beneath each.
  individual_plates:
  - pdf_page: 67
    name_as_printed: Ariel Almodovar
    composition: Dark-haired, earring-wearing figure in blue outfit moving in a brick-lined
      alley, with a bright orange flash; small portrait inset under a purple sky.
  - pdf_page: 68
    name_as_printed: Martin de Vries
    composition: Dark-clothed, green-armored figure with long curved blade against
      a purple starry field with flying shadowy shapes; inset face glowing green.
  - pdf_page: 69
    name_as_printed: Jonty Geldenhuys
    composition: Blond figure wearing striking facial markings and pink visor, shown
      alongside a large armored/mechanical arm and hovering helmet-like object with
      glowing details; lower portrait inset.
  - pdf_page: 70
    name_as_printed: Susan Hands-as-Wings
    composition: Muscular dark-haired woman in a white tank top and loose dark trousers,
      smoking against an angular green background; lower smaller portrait with red
      cap.
  - pdf_page: 71
    name_as_printed: McBean
    composition: Severe figure with long pale hair, star-like cheek marking, dark
      clothing and a metallic object held low; close-up inset with a hood-like white
      hair silhouette.
  - pdf_page: 72
    name_as_printed: Sukie Redflower
    composition: Pale-haired figure with pointed ear and tinted eye protection against
      a green background in the inset; main dramatic figure amid vivid orange fire
      against dark blue and black forms.
  - pdf_page: 73
    name_as_printed: Michael James Sutherland
    composition: Blond suited figure with head-mounted augmentation beside a luminous
      green network-like motif; smaller close portrait against orange-red.
  provenance_guard: Descriptions identify visual motifs actually drawn in the original
