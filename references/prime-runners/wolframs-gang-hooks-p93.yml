data:
  name: Wolfram's Gang — campaign hooks
  source_anchors:
  - printed_page: 93
    pdf_page: 102
    heading: Hooks
  recurrent_opposition: The GM may use Wolfram and his two gang allies repeatedly
    against runner teams, replacing generic street-level opposition with recurring
    personalities; recurrence should be used judiciously.
  scenario_uses:
  - Gang hired as protective muscle by an opposing employer or syndicate.
  - Gang employed to locate or eliminate a person the runners are also searching for.
  - Gang members seize the very contact or person runners need, setting up ransom,
    rescue or confrontation.
  - An NPC may hire runners to fill an expertise gap for an operation; the gang is
    not particularly good at computers, for example.
  - A person with a sought-after skill may be forcibly detained and coerced into working
    for the gang; the scenario includes severe danger to that person after the gang
    gets what it needs.
  - GM may arrange a deceptive job offer from Wolfram or the gang so that the runners
    unwittingly support the gang.
  portability: The original setting is New York, but GM may move the encounter to
    another city with only minor adaptation.
  required_local_features: A workable base of operations such as a safe house, several
    personal refuges or bolt-holes (apartments, sewers, underground safe spots), plus
    a few regular haunts.
  encounter_design: The gang should not appear on every occasion the GM needs villains;
    use recognizable return appearances when consequential and unwanted by the PCs.
  party_skill_contrast: Three troll gang members may have difficulty with specialist
    technical tasks (source specifically mentions computers). A runner team can plausibly
    have such expertise.
  ending_note: The narrator warns that allowing the gang to recruit a runner can itself
    be dangerous; this is in-world scenario advice, not a real-world operational instruction.
  linked_ids:
