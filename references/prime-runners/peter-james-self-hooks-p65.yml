  optional_gamemaster_scenarios:
    observation_and_hospitality:
      fictional_behavior: Self regularly observes marginalized people at close range for writing material.
        The narrator says he asks few questions, but may purchase drinks, snacks or other refreshments while
        listening.
      possible_encounter: Runners from those communities can meet Self in the course of normal roleplaying;
        social interaction and his literary curiosity are not compulsive or mechanically resolved in the
        source.
    writer_block_escorts:
      premise: Self may have writer’s block, and his publishers may ask runners they trust to accompany
        him while he seeks firsthand impressions in unsafe fictional districts.
      campaign_role: The published hook suggests chaperoning him and coping with unpredictable fictional
        situations or hostile characters; this is optional GM guidance, not a historical event.
    suspicious_research_delay:
      premise: His third novel may be delayed because Self discovers a significant issue during his research.
      branch_corruption: One fictional scenario concerns a network of police corruption.
      branch_unconsented_experiment: Another alternative concerns a corporation testing a toxic or pathogenic
        agent on unsuspecting people in an impoverished community. The victims’ lack of awareness and consent
        is a significant premise, not ordinary voluntary medical treatment.
      two_characterization_options:
        romantic: Self engages runners to uncover evidence and bring those responsible to justice.
        cynical: Self seeks observations for his book and engages runners primarily to gather details while
          he watches the investigation.
      status: Alternate gamemaster inventions; the source does not claim either example has occurred as
        fixed canon.
