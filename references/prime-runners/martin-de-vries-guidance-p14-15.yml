data:
  character: Martin de Vries
  source_anchor:
    printed_page: 15
    pdf_page: 16
    section: Hooks
  optional_runner_scenarios:
  - De Vries may hire runners to attack another vampire or a magically controlled servant. Alternative
    contractors may include a Johnson, a vampiric pawn, or a representative of a European vampire
    group seeking his removal.
  - 'Attribution and deception matter: an employer who is a vampire may conceal that nature, leaving
    runners to discover it while a contract is underway.'
  - Runners may need heavy weaponry and/or explosives when confronting his enemies.
  - De Vries may act as a consultant for parties confronting vampires or related supernatural entities
    including banshees, bean sidhes, and broken bows.
  - Locating de Vries and convincing him to help can itself become a scenario, particularly if
    runners must navigate his existing enemies.
  - Magically trained runners might obtain a spell or two from him as compensation for work.
  - His researched theory of a hidden vampire society offers a possible astral/metaplanar campaign,
    with participation by the Ordo Maximus potentially complicating events.
  - If his unique Essence Focus is stolen, he may urgently try to recover it and offer almost any
    price.
  related_details:
    records_for_mechanics: npc.prime_runners.martin_de_vries.sr2_stats
    initiation_grade_in_related_rules_record: 3
    funding_resources: Original profile states wealthy family money supported his magical research.
    campaign_uncertainty: All hooks are optional scenarios, not historical events; the source does
      not establish the vampire society as a proven organization.
  references_as_printed:
  - Paranormal Animals of Europe (setting/game reference)
headline: Martin de Vries — campaign possibilities and vampire-related encounters
summary: Optional scenarios involving rival vampire factions, concealed employers, magical consultation
  and the stolen Essence Focus; these are prompts for play, not asserted events.
