data:
  character: Wolfram [Street Shaman]
  hooks:
  - Treat Wolfram as less likely to appear in the typical underground haunts frequented
    by Shoot-to-Kill or Hammerhead.
  - A Wolfram encounter is likelier at a corporate function or art gathering among
    similarly cultivated aesthetes and patrons.
  - His visits to gang associates’ rougher social venues are exceptions rather than
    his usual presentation.
  - 'Whatever his venue, he is protected: either personally armed or accompanied by
    several armed allies.'
