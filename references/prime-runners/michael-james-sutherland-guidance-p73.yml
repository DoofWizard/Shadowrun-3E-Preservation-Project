    - Hooks
    - Notes
  player_character_uses:
  - scenario: Employ Sutherland as an expert Matrix resource for a problem the runners
      cannot solve themselves.
    tradeoff: The narrator recommends a substantial fee and a reduction in the runners'
      available cash.
    boundaries: In the proposed scenario, Sutherland does not volunteer confidential
      information about his own prior commissions.
  - scenario: Ask Sutherland for professional introductions.
    possible_contacts:
    - A fixer supplying exceptional cyberdecks or utilities.
    - A fixer supplying cyberware, described as less likely.
    - A contact who may know how to locate a shadowclinic.
    certainty: Optional scenario contacts, not a fixed address, inventory, or guaranteed
      service.
  limits_of_assistance:
  - The narrator explicitly says Sutherland does not sell his personal cyberdecks
    or programs.
  - He does not accept commissions to customize decks or programs; player characters
    seeking that work must arrange it separately.
  - His role is as an expert or possible contact, not a means for runners to bypass
    the consequences of their own adventures by obtaining his private information.
  gamemaster_customization:
  - The source leaves additional program and equipment selection to the gamemaster,
    because Matrix/decking implementations vary between campaigns.
  - Other computer utilities may be added as needed, given his resources and professional
    contacts.
  - Exact smart-frame load, specialized programs and safety-system target-number modifiers
    are preserved in the independently existing rule_exact record rather than replicated
    as vague guidance.
