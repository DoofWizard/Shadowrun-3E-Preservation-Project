data:
  subject: Jonty Geldenhuys (Bounty Hunter)
  source_anchors:
  - {printed_page: 27, pdf_page: 28, heading: Hooks}
  - {printed_page: 27, pdf_page: 28, heading: Notes}
  scenario_options:
    protective_contract:
      premise: Runners may be hired to protect a person Jonty is tracking.
      player_choice: Source offers defending the threatened person or confronting Jonty before he reaches that person.
      status: Conditional GM hook, not a canonical confrontation.
    investigative_contract:
      premise: Jonty may employ runners for preliminary background investigations of a person he seeks.
      complication: At the midpoint, a team of assassins or bounty hunters may pursue those runners on instructions from an aggrieved former spouse of one of Jonty's prior victims.
      status: Optional twist; no actual job or confrontation is established.
    confidential_knowledge:
      source_claim: Jonty keeps meticulous private notes on sensitive places in headware memory and bank deposit boxes.
      possible_exchange: Runners might help him complete his present task to gain access to that knowledge.
      uncertainty: Source says he MAY have visited useful locations; it does not establish any particular vault or data contents.
  portrayal_and_rules_context:
    style: Source Notes describe his preference for stealth and a precise single-target encounter rather than heavy weapons or explosives.
    magic: Dislikes hiring a magician to inflict harm directly, but is said to have employed magicians to dispel magical barriers and protective enchantments.
    survival: His special Survival skill applies to harsh wilderness circumstances; examples of foraging, orientation and primitive fire-starting belong to the already preserved SR2 character stats record.
    transport: Has no listed permanent vehicle; source says he rents or borrows a vehicle as circumstances require, with or without a driver.
    source_rule_reference: rules/prime-runners/jonty-geldenhuys-stats-p26-27.yml
  caution: Hooks are authored possibilities for a fictional role-playing scenario; neither roles nor events are established as world history.
