data:
  character: Teachdiare
  source_anchor:
    printed_page: 90
    pdf_page: 99
    heading: Hooks
  portrayal: The source describes an extremely fast, stealth-focused fictional elven
    assassin, not a brute-force adversary.
  branches:
  - Runners may be tempted to hire Teachdiare for a fictional job when their target
    is otherwise unreachable; simply finding him can become a separate run.
  - Working with Teachdiare can draw attention from corporations hostile to him or
    seeking information about people who contact him, along with personal contacts
    of his victims.
  - The gamemaster may place Teachdiare in politics involving Tir na nÓg or Tir Tairngire,
    with a wide range of potential consequences for anyone associated with him.
  - As a nemesis, Teachdiare can be revealed as pursuing the player group because
    of a contract whose employer and rationale remain unknown; the story can center
    on discovering those facts, addressing mistaken identity, preventing the killing,
    or negotiating terms.
  - The source offers the possibility of an attack occurring at a significant future
    ceremonial date, allowing investigation and negotiation rather than automatic
    lethal outcome.
  assertion_status: These are hypothetical game scenarios, not confirmed occurrences
    in the setting.
