  campaign_roles:
  - Rigger or vehicle support character
  - Remote drone surveillance specialist
  - Drone and aircraft modifications
  - Preparation of explosive drones as fictional campaign equipment; no construction procedure is specified
  - Use of anti-aircraft missiles against fictional airborne vehicles; no operational procedure is specified
  - Vehicle repair, custom upgrades and B/R assistance
  - Fixer/contact in Salish-Shidhe, particularly Cascade lands
  geography_and_relationships:
    friendly_group: Cascade Ork tribe; the narrator says she has friends in high places and characterizes
      the tribe as perennial troublemakers in Salish-Shidhe lands.
    aversion: Strong dislike of elves; avoids travel through Sinsearach lands unless necessary
    political_risk: Working with Susan may place runner teams in the middle of Salish-Shidhe tribal politics.
  scenario_hooks:
  - actor: Council agents
    possibility: May try to frame Susan and accompanying runners for smuggling.
    distinction: Within the proposed scenario, the narrator says the smuggling accusation would be quite
      true for Susan, while the runners might merely be convenient scapegoats. This is the author’s conditional
      scenario description, not a documented completed prosecution.
  roleplay_notes:
  - Sensation-seeking bravery approaching fearlessness
  - Dark, dry sense of humor
  - Readily insults almost anyone for amusement, and this can and does get her into trouble occasionally;
    the source does not say installs in this sentence.
  - Capable of keeping a low profile around Knight Errant Security, Lone Star, and comparable authorities
  resources: Permanent facilities for all her Build/Repair skills and portable traveling kits; exact skill
    and equipment statistics are in separate p30-31 source-verified rules record.
