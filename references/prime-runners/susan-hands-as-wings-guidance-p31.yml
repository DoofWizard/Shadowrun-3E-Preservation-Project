  campaign_roles:
  - Rigger or vehicle support character
  - Remote drone surveillance specialist
  - Drone and aircraft modifications
  - Vehicle repair, custom upgrades and B/R assistance
  - Fixer/contact in Salish-Shidhe, particularly Cascade lands
  geography_and_relationships:
    friendly_group: Cascade Ork tribe; narrator says she has friends in high places
    aversion: Strong dislike of elves; avoids travel through Sinsearach lands unless
      necessary
    political_risk: Working with Susan may place runner teams in the middle of Salish-Shidhe
      tribal politics.
  scenario_hooks:
  - actor: Council agents
    possibility: May try to frame Susan and accompanying runners for smuggling.
    distinction: Narrator says smuggling accusations against Susan might be substantially
      true, while accusations against unrelated runners may be opportunistic false
      accusations.
  roleplay_notes:
  - Sensation-seeking bravery approaching fearlessness
  - Dark, dry sense of humor
  - Willingness to install unusual parts or modifications for the pleasure of technical
    work
  - Capable of keeping a low profile around Knight Errant Security, Lone Star, and
    comparable authorities
  resources: Permanent facilities for all her Build/Repair skills and portable traveling
    kits; exact skill and equipment statistics are in separate p30-31 source-verified
