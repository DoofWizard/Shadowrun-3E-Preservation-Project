    heading: Hooks
  character: Alice Adams
  scenarios:
  - A team seeking to keep its activity outside the media may encounter Adams investigating a related entertainment-sector organization; an interested party may retain the team to stop her inquiries.
  - Adams may develop a story about the runners, endangering their reputations and operational anonymity.
  - Her series on celebrities connected to political figures uncovers multiple individually innocuous facts that together suggest corruption in senior ranks of the Department of Business.
  - The department's security chief has contacted the FBI, and the story is at risk of suppression before Adams can publish it.
  - The Tattler's management refuses to support the political investigation and directs Adams to concentrate on celebrity and sexual scandals rather than political reporting.
  - Adams needs investigators she can trust to develop corroboration and a different publication willing to carry the story; the runners can become that investigative team.
  premise_qualifier: These are campaign possibilities rather than established outcomes; allegations must not be treated as proven corruption.
framing: newsroom_neutral
headline: Alice Adams campaign hooks
summary: Nonmandatory scenario premises involving journalism, reputation, and political disclosure.
