data:
  subject: Ren Martindale [Media Jock]
  anchors:
  - printed_page: 43
    pdf_page: 44
    section: Hooks
  campaign_uses:
  - option: Approach as a source or contact
    condition: The offered story must interest Martindale; he is described as approachable
      when the story is right.
    outcome: He can make the story public and potentially expose those being investigated.
  - option: Use publicity without identifying the informant
    condition: Martindale has the means to conceal a tipster while publicizing an
      investigation.
    risk: His protection generally depends on fully exposing the subjects; unresolved
      loose ends may permit retaliation against him or the contact.
  - option: Investigate a runner group from the inside
    condition: Martindale and cameraman Alfie Gash seek information about street life,
      including through accompanying a runner gang.
    outcome: Martindale may serve as an ongoing contact but can also investigate runners
      who turn out to have their own improper dealings.
  cross_reference: Ren Martindale historical statistics printed 42-43; Alfie Gash
    is his dwarf cameraman and colleague.
