  character: Julio "Chico" Hernandez
  scenario_options_as_printed:
  - hook: patsy
    premise: Chico hires characters under an apparent ecological-activist purpose. According to this proposed GM
      scenario, he causes a mass-casualty fictional incident while uninvolved characters are used as public scapegoats.
    outcome: Characters must investigate their hiring and clear their names; corporate reprisals raise the stakes.
  - hook: too_close_to_the_fan
    premise: A variation of the patsy scenario in which runners happen to be innocent bystanders rather than hired
      operatives; the employer frames them anyway.
  - hook: stop_Chico
    premise: A corporate employee discovers that their employer is contacting Chico and calls upon an activist organization.
      That person is then silenced, and the employer targets the player characters.
    investigation: Characters investigate the corporate computer system to uncover the reason and prevent further
      in-world attacks.
  - hook: runaway_train
    premise: Chico becomes unstable and various corporations want him permanently stopped. Two separate corporate
      intermediaries hire the runners for the same target under different names.
    uncertainty: The intermediaries offer incompatible explanations. Their employers also distrust the runners because
      of the competing approaches, escalating corporate suspicion and accidental conflict.
  - hook: after_the_bomb_has_gone_off
    premise: A corporate official recruits runners to investigate an atrocity that affected the official’s brother
      and close friend.
    reversal: The runners uncover evidence that their actual employer’s own company was involved in an internal
      power struggle; both the company and outside actors turn against the runners, who need independent evidence
      to disclose the truth.
  - hook: capture_alive
    premise: An activist organization that believes it has evidence of Chico’s identity wants him alive for questioning,
      while corporate interests want him eliminated and view the runners as another target.
  portrayal_and_logistics_notes:
  - In source-period campaigns Chico’s employers can provide almost any mission-relevant fictional equipment, including
    vehicles, and he travels with high-grade surveillance or counter-surveillance gear.
  - English and Mayan are stated to function as his first languages.
  - He uses appearance alteration, including cosmetic changes and weight shifts; the explicit plus/minus 18 kg source
    note and exact gear and adept mechanics are preserved in the linked rule record.
  game_mechanics_location: rules/prime-runners/julio-chico-hernandez-stats-p84-85.yml
  claim_guard: All hooks are conditional GM scenario variants. The mutually exclusive operations and secret corporate
    motives must not be recorded as established history.
headline: Julio "Chico" Hernandez — historical scenario alternatives and portrayal
summary: Six distinct optional GM hooks with conditional agency and mutually inconsistent accounts preserved.
