data:
  character: Giancarlo Baggio
  source_anchor:
    printed_page: 13
    pdf_page: 14
    heading: Hooks
  potential_scenarios:
  - Baggio could match the simsense characteristics of a favored star or supporting
    performer, although his schedule makes further routine work unattractive.
  - His interest in fame and public recognition leads him to appear at upscale media
    parties, fashion events and on city streets with a conspicuous entourage.
  - Runners might be engaged to protect him, to abduct him, to obtain his technical
    equipment, or to abduct the star Anna Silenzio; these are optional campaign premises,
    not historical occurrences.
  - Fuchi might employ runners posing as representatives of a rival corporation to
    frighten Baggio with a staged series of threats or attacks on his security team;
    explicitly a hypothetical game scenario.
  - His employer's competitor firms and other commercial groups may be interested
    in his augmented equipment and experimental transplexer work.
  - His personal whims, changing fashions and curiosity about rumor and street language
    can complicate work for hired protectors and investigators.
  - The source permits various runner interactions with a high-profile celebrity whose
    assets are attractive to competing commercial organizations.
  public_exposure:
    personal_guarding: Typically accompanied by fifteen heavily augmented human or
      elf samurai acting as bodyguards.
    media_presence: Frequent public appearances at upscale social and entertainment
      events.
    character_voice: Socially self-conscious, egotistical and eager to adopt new trends
      and slang.
  equipment_interest:
    simsense_device: Customized Truman Inner-1 Simth and related experimental recording/playback
      hardware.
    work_funding: Truman Technologies pays him and maintains close involvement while
      allowing operational latitude.
