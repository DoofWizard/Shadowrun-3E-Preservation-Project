data:
  name: Shoot-to-Kill — Hooks
  source_anchors:
  - printed_page: 97
    pdf_page: 106
    heading: Hooks
  scenario_characterization:
  - The GM-facing paragraph portrays Shoot-to-Kill as the most psychologically unstable
    member of the gang and very difficult to control.
  - She starts firing and acts violently before contracts or objectives have been
    completed.
  plot_hooks:
  - She repeatedly makes passes at various people, with a preference for dynamic,
    rugged and unstable individuals.
  - The source describes her as sometimes harassing runners while looking for somebody
    attractive; this can lead to conflict.
  - Such behavior may escalate into a dangerous confrontation if Hammerhead learns
    of it.
  - A runner in that position has reason to be concerned, because Hammerhead is the
    partner described in the profile.
  source_attribution: Narrator GM-facing Hooks paragraph on printed page 97, not the
    adjacent forum comments or NPC stat block.
