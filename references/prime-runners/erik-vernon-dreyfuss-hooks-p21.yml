    heading: Hooks and Notes
  character: Erik Vernon Dreyfuss
  scenario_hooks:
  - The source suggests runners might seek money for a job from wealthy Erik; he agrees
    generously on the condition that he accompany them, despite his limited practical
    ability.
  - Runners could leave Erik behind or use his financial support, but the source presents
    his enthusiasm and social awkwardness as sources of adventure complications.
  - His mother’s accountant closely monitors his trust fund; the accountant has financial
    contacts and favors hiring freelance security personnel if someone seems to be
    exploiting the trust fund.
  - The source proposes a crisis in which a piece of Erik’s unreliable equipment fails,
    while Erik believes he has rescued the runners.
  - The source explicitly gives gamemasters discretion over other equipment and when
    faulty equipment fails.
  cross_reference_rules_record: npc.prime_runners.erik_vernon_dreyfuss.sr2_stats
  content_status: Fictional possible campaign hooks, not confirmed chronology.
