data:
  subject: McBean [Exile]
  source_anchor:
    printed_page: 47
    pdf_page: 48
    heading: Hooks and Notes
  scenario_uses:
  - option: Historical information
    premise: Player characters may need information about historic Sixth World affairs
      or major political figures from before and during the Awakening; McBean may
      know significant unpublished details.
  - option: Locating the source
    premise: Finding McBean at his isolated residence is itself a potential obstacle
      for a team.
  - option: Persuasion and agency
    premise: Even after finding him, characters must persuade him to talk. His changing
      personal agenda, fears and preferences may be obstacles.
  - option: Adventure lead
    premise: McBean may possess unique testimony regarding an old matter, making him
      the hook for a scenario whose stakes depend on a specific piece of historic
      information.
  gm_roleplay_notes: The source encourages eccentric and unpredictable presentation,
    unusual metaphors, malapropisms, and an internally coherent but non-linear pattern
    of thought. Portrayal guidance is not an additional game resolution rule.
  historical_mechanics_link: Exact SR2 statistics, special Recent History skill and
    original equipment remain in rules/prime-runners/mcbean-stats-p46-47.yml without
    assumed SR3 conversion.
  status_note: All scenarios are optional fictional campaign premises, not established
    events or real-world advice.
