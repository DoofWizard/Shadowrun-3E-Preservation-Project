    heading: Hooks
  situation: Ossian’s band and commercial network are expanding; he is careful about his public reputation
    and seeks discreet, reliable allies. The page characterizes a perceived threat from the Rituals
    as serious.
  hooks:
  - topic: Personal protection
    premise: Ossian may seek trusted bodyguards while avoiding associates whose visible criminal reputation
      damages his street credibility.
  - topic: Janna Dream
    premise: Ossian seeks an independent, discreet inquiry into the reported death of Janna Dream;
      the source does not determine culpability.
  - topic: Kokura Biotech
    premise: Ossian is concerned about the corporation’s plans for recovery of an alleged quiet investment
      in Chrome Damage, without drawing unwanted media attention.
  - topic: Chrome Edge opening
    premise: Player characters might attend or observe the club’s New Year’s Eve opening celebration
      in Portland as a setting encounter.
  scenario_status: Historical fictional GM suggestions only; outcomes and disputed claims are not
    established.
