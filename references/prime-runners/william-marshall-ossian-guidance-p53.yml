    location: right column below in-world forum
  fictional_gm_options:
  - name: Visibly shadowy allies and street credibility
    premise: The source advises that Ossian wants friends, particularly visibly shadowy
      associates, because association with them would strengthen his credibility in
      the street scene. It does not say he avoids such allies.
    source_certainty: Source's optional campaign characterization, not a completed
      recruitment
  - name: Conditional bodyguards and biker image
    premise: If the Rituals' threats prove serious, Ossian may require bodyguards.
      He rides a large motorcycle and cultivates a renegade image but the published
      hook explicitly says he is not a go-ganger.
    condition: The Rituals' threat must be serious for this need to arise
    source_certainty: Conditional GM hook, not confirmation of the Rituals' involvement
      in an alleged death
  - name: Independent inquiry into Janna Dream
    premise: Ossian wants people to investigate the reported death of Janna Dream
      discreetly on his behalf, without the game text establishing a culprit.
    source_certainty: Fictional campaign premise, not a resolved account of who caused
      a death
  - name: Kokura Biotech investment and intentions
    premise: Ossian wants to learn how Kokura Biotech plans to recover its silent
      investment in Chrome Damage; he wishes to avoid drawing public attention or
      adverse media coverage toward himself.
    source_certainty: GM adventure motivation drawn from printed Hooks, separate from
      unverified in-world forum speculation
  - name: Chrome Edge New Year's Eve opening
    premise: The book suggests the player characters could attend or investigate Chrome
      Edge's official New Year's Eve opening party, described by the source as a prominent
      local event.
    source_certainty: Optional fictional scenario scene, not a real event announcement
