  possible_scenarios:
  - scenario: Doonan as source for difficult acquisitions
    conditions: A group first establishes contact; she may arrange an offshore exchange near Louisiana
      within 72 hours. Her heightened suspicion and security create danger if she suspects betrayal.
  - scenario: Doonan as intelligence contact
    conditions: Her former CIA connections may give her information about notorious criminals and other
      wanted figures in UCAS and CAS; persuading her to disclose it is risky.
  - scenario: Retaliation against former CIA colleagues
    conditions: She may seek runners to confront the former officer who arranged her mission; that officer
      might instead deceive them into another CIA operation, possibly endangering them with a hidden cortex
      bomb.
  gamemaster_notes:
  - The vessel is described as a bayou boat, with the Aztech Nightrunner the nearest reference craft;
    extra armaments and other inventory remain optional, not canonical starting equipment.
  - For characterization, the book proposes a broad-rimmed floppy hat, fitted jeans, a low voice, and a
    cynical, unforgiving manner.
