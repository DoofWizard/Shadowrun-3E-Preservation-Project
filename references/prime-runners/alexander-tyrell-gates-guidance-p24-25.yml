data:
  subject: Alexander Tyrell Gates / GM scenario and portrayal guidance
  source_anchor:
    printed_page: 25
    pdf_page: 26
    heading: Hooks and Notes
  potential_role: Can serve as an exceptionally capable fictional Matrix guide when persuaded to help runners
  narrated_capability: May intuitively navigate Microdeck research systems and other areas of the fictional Matrix,
    though some basic defenses remain troublesome
  motivation_constraint: Will act from curiosity and childlike interests; does not value adult data secrecy or practical
    objectives the same way runners do
  consequences: May enter an otherwise secure system to leave a visible mark while ignoring valuable information
  personal_vulnerability:
    life_stage: Still a child; has trouble with physical three-dimensional life and interpersonal expectations
    autonomy: May become withdrawn or unresponsive if an experience is distressing or unenjoyable
  corporate_parent:
    relationship: Page 24 names father Brian W. Gates III as Microdeck chairman; page 25 calls the father the second
      most powerful man at Microdeck; preserve this source contradiction without silently choosing an alternative
      father.
    reaction: A campaign encounter affecting Alex could draw strong personal and corporate response
    investment: The company has invested considerable resources in the Matrix environment that engages Alex
  gm_advice: Portray his unusual understanding without automatically granting unlimited success; the source provides
    a separate cumulative Hacking Pool numeric rule
  mechanical_cross_reference: rules/prime-runners/alexander-tyrell-gates-stats-p24-25.yml retains +4 curiosity and
    +2 Sensor-program dice bonuses, cumulative
  uncertainty: These are hooks and portrayal instructions for possible play; no runner-team meeting is established
    as canon
headline: Alexander Tyrell Gates / GM guidance
summary: Age-aware Matrix contact hooks, limitations, motivations and corporate response, distinct from exact SR2
  dice mechanics.
