data:
  subject: Taylor Kimball Pauline
  source_anchor:
    printed_page: 55
    pdf_page: 56
    heading: Hooks and Notes
  hooks:
  - Pauline can recur as an arranger presenting attractive contracts that later prove
    disappointing or dangerous, especially where he places his own commission ahead
    of runners' interests.
  - A GM can portray his loyalty to a corporate customer in a poorly organized assignment,
    allowing him to shift responsibility for a failed arrangement onto the participating
    runners.
  - Aggrieved runners may seek an accounting or redress, but Pauline is portrayed
    as difficult to find directly, with access usually through the contracting corporate
    client or chance.
  - Pauline may appease dissatisfied associates by offering a substantially better-paid
    follow-up assignment and initially advancing some of his own funds; the source
    notes he is likely to recover those costs from subsequent business.
  - In a major disagreement, Pauline can draw on multiple law-enforcement contacts
    and professional security support; the GM is cautioned to consider the consequences
    of indiscriminate reprisals by player characters.
  - A GM can allow Pauline to evade accusations or blame in order to challenge players
    who assume he is innocent merely because of an affable presentation.
  locations:
  - Small office in an undistinguished business block on the east side of Toronto.
  - Additional office in New York.
  - May prefer other public meeting places; standard offices are adequate where needed.
  distinction: These are conditional referee-facing scenario premises and portrayal
    notes, not independent proof of alleged outcomes or culpability.
