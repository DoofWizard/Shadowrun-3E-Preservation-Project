  campaign_uses:
  - premise: Runners whose private activity Ren Martindale might publicize may wish
      to contact Gash as Martindale's working partner.
    condition: Martindale considers their conduct worthy of investigation and possible
      broadcast.
  - premise: Gash may be able to take part in a competing runner-run investigative
      trid program, in an alternative to Martindale's broadcast.
    relationship: The published hook says Gash has links to the Brooklyn Mafia, although
      those links extend only to the lower echelons.
