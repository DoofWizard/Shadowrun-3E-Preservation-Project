    heading: Hooks
  possible_uses:
  - scenario: Recurring opposition
    details: GM can return the group periodically as adversaries rather than place
      them in every session; a crime-syndicate employer or sought-after contact may
      bring characters into conflict.
  - scenario: Lack of matching skills
    details: If the three core members lack required expertise such as computing,
      they may seek specialist subcontractors; player characters could be hired, coerced,
      or drawn into competing loyalties.
  - scenario: Gang targets a person important to the runners
    details: An important allied NPC may become a victim of the gang’s pursuit or
      an abduction plot; the outcome is contingent GM preparation, not established
      history.
  - scenario: Changing affiliations
    details: A character group might cooperate with Wolfram for an assignment, then
      discover a highly consequential mismatch of goals.
  - scenario: Portable locale
    details: The GM may relocate the gang away from New York to the campaign’s city,
      with a residence/base, personal hideouts, underworld-safe locations and familiar
      nightlife venues.
  - scenario: Use sparingly
    details: Repeated appearances should be timed for dramatic effect, when characters
      prefer not to face their antagonists.
  linked_source_personnel:
