      proposed_goal: Tadashi could hire the player characters to help seek revenge
        against the bodyguard.
      canon_status: Optional scenario, not proof of the anonymous forum allegation
        that Takemura caused Michiro Hiroshige's death; Tadashi is not reported dead.
    meeting_with_patron:
      premise: A runner group doing business with Keiji Hiroshige may meet Takemura.
      certainty_boundary: The source explicitly says Takemura is present when the
        runners meet the oyabun in person; a meeting itself is conditional.
