data:
  source_anchor:
    printed_page: 59
    pdf_page: 60
    heading: Hooks
  subject: Sukie Redflower
  source_roles:
  - Optional capable combat-mage mercenary when a player group needs magical firepower.
  - A potentially demanding ally whose personality and past associations introduce
    complications.
  optional_scenarios:
  - premise: Runners retain Sukie's services for a mission where spellcasting is in
      demand.
    conditional_outcome: Her professional reliability contrasts with the interpersonal
      difficulties her intensity may create.
  - premise: Earlier Salish-Shidhe connections and grievances become relevant during
      a campaign.
    source_elements:
    - The narrator says Sukie stole expendable spell fetishes during financial hardship,
      causing several people from her Salish-Shidhe past to hold grudges against her.
    - The narrator explicitly says someone in Salish-Shidhe has a contract out on Sukie.
    - The gamemaster may have pursuers appear halfway through a run; after the encounter,
      the runners can question Sukie, whose answers should further complicate the situation.
    conditional_outcome: The group may become involved in Salish-Shidhe political
      and personal disputes.
  - premise: Her spell list demonstrates that she has been adept at persuading
      other mages to teach her.
    conditional_outcome: Her personal contacts and professional relationships may
      connect the group to broader adventures.
  distinctions:
  - These are GM options, not guaranteed future events or mandatory adventure outcomes.
  - The book describes Sukie persuading teachers, not serving as a mentor to runners.
  - Exact attributes, spell ratings, spell locks, equipment and other rules are in
    the pre-existing historical stats record and are not replaced here.
  mechanics_reference: rules/prime-runners/sukie-redflower-stats-p58-59.yml
