id: source7116.erik-vernon-dreyfuss.guidance.p21
record_type: campaign_reference
status: reviewed
source: source.fasa-7116
printed_pages: '21'
pdf_pages: '22'
edition_scope: Historical Shadowrun Second Edition, FASA7116 Prime Runners (1994);
  not converted to SR3
content_class:
- campaign_guidance
data:
  hooks:
  - scenario: Runners request financing
    proposal: Erik may supply money from his personal resources but expects to join
      the hired team; he is not generally able to insist on participating if they
      refuse.
    conditional: Participants may attempt to exclude him because they view him as
      a liability; the narrator presents multiple possible responses rather than an
      obligatory result.
  - scenario: Poor field performance
    proposal: His new equipment does not confer practical competence; he may fumble
      his weapon under pressure and his jokes and overt friendliness may try companions’
      patience.
  - scenario: Unexpected assistance
    proposal: He may nevertheless be likable to tolerant characters, especially impoverished
      runners; his generosity can be an asset and an unanticipated useful action can
      redeem him during a crisis.
  trust_fund_complication:
    source_character: Erik’s doting mother’s unnamed accountant
    facts:
    - Accountant monitors trust disbursements carefully.
    - Unusual withdrawal attempts, such as a proposed high-value ransom, are likely
      to be noticed.
    - Accountant knows independent financial-sector contacts and tends to engage freelance
      security specialists to address such problems.
    certainty: Conditional scenario concern; does not establish that a kidnapping
      or extortion actually happened.
  faulty_equipment_guidance:
    authority: Gamemaster discretion
    assertions:
    - Some equipment, including the assault cannon, may be unreliable or counterfeit
      despite apparently authentic appearance.
    - Problems are best portrayed as intermittent and dramatically timed rather than
      obvious at first inspection.
    - The narrative suggests that a malfunction during a difficult run can be followed
      by Erik unexpectedly helping the team.
    no_fixed_check: Page states no mandatory numeric jam or failure test; do not invent
      one.
  notes_context:
  - Erik owns much sophisticated gear but lacks familiarity with its effective use.
  - His intense nervousness is handled by an exact game test in a separate rule_procedure
    record.
  source_page: 21
headline: Erik Dreyfuss — campaign guidance and hooks
summary: Source-faithful scenario possibilities, resource complications, optional
  equipment faults and redemptive contrast.
framing: newsroom_neutral
