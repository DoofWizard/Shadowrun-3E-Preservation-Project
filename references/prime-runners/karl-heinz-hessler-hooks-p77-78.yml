data:
  name: Karl-Heinz Hessler [Mage]
  source_anchors:
  - printed_page: 77
    pdf_page: 86
    heading: Hooks
  - printed_page: 78
    pdf_page: 87
    heading: Notes
  campaign_uses:
  - Runners in trouble may consult Hessler about obscure magical phenomena and free
    spirits; he can identify the names, identities and purposes of many free spirits.
  - The Glastonbury Zodiac is a potential portal to the metaplanes in Hessler’s studies.
    A gamemaster may develop a plot involving an astral quest to energize the portal,
    a hazardous opening, or aid in sealing it.
  - Organizations or characters interested in exploiting the site may include remnant
    Universe Brotherhood followers, insect shamans, cultists and misguided magical
    students. They may pursue Hessler because of his expertise.
  - 'Hessler is deliberately not a substitute for runner accomplishments: reserve
    his aid with situations the runners genuinely cannot handle.'
  - A protector nicknamed Merlin is left for the gamemaster to develop. Its statistics
    and role should suit the campaign, and it is portrayed as powerful.
  - The affiliation and purposes of Hessler’s magical order are deliberately unspecified
    and may be developed when useful for a campaign.
  roleplaying_guidance:
  - Portray Hessler as polite, quiet, measured, gracious and slow to judge others.
  - He is protective of books and lives in a deliberately archaic home that nevertheless
    has electricity; its library and grimoires are carefully safeguarded.
  - The Notes say guests who take books without permission tend to wander back
    within a few days to return them and then suffer brief amnesia and
    disorientation. They specify no test, precise duration, or explicit cause.
  - The source permits improvisation about his pre-2011 history; he may be far older
    than his official birth date suggests.
  - He normally avoids offensive spell use, with defensive use a distinct exception.
framing: newsroom_neutral
headline: Hessler campaign hooks — library protection and magical research
summary: Historical Second Edition GM guidance, including an attributed
  book-return phenomenon; no new game rules are inferred.
