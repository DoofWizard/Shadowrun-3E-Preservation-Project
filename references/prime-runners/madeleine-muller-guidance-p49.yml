data:
  subject: Madeleine Muller
  source_anchor:
    printed_page: 49
    pdf_page: 50
    heading: Hooks and Notes
  optional_scenarios:
  - name: Investigative support
    premise: Muller may employ runners for first-hand research she cannot personally
      undertake.
  - name: Protective duty
    premise: Muller may hire runners as bodyguards, with a possible threat to her
      safety as part of a scenario.
  - name: Rescue narrative
    premise: An optional plot can involve her captivity and runners assigned to recover
      her; neither the captivity nor rescue is established history.
  - name: Corporate media rivalry
    premise: With Muller considering expansion into American media, competing interests
      may hire runners to impede her investigation; the same runners might ultimately
      support her.
  - name: Targeted media companies
    premise: Corporations affected by Muller’s proposed takeovers may recruit runners
      for intelligence about her activities.
  - name: Information sought by rivals
    premise: A company opposed to another corporation under Muller’s scrutiny may
      want her investigative material. Muller might alternatively seek runner assistance
      herself.
  character_portrayal: The book stresses her unusually effective presence in social
    settings, regardless of a character’s sex or metatype; do not reduce this to unmechanical
    charisma alone.
  protected_mechanics_reference: The exact Willpower test at target number 10, augmented
    Charisma 10 and +2 test-target-number consequence throughout a social exchange
    are already preserved in rules/prime-runners/madeleine-muller-stats-p48-49.yml
    and are not modified or inferred to SR3.
  scenario_status: All Hooks are fictional gamemaster options, not canonical real-world
    instructions or historical outcomes.
