data:
  character: Richard Petrosian
  source_anchor:
    printed_page: 57
    pdf_page: 58
    heading: Hooks
  scenario_branches:
  - An obvious adventure is BU hiring the player team to locate Petrosian. Rival hired
    teams could simultaneously investigate and pursue the same target.
  - A Johnson claiming to act for Petrosian could employ runners to confront a BU
    retrieval team, as Petrosian believes BU was responsible for his wife’s death.
  - Petrosian may offer a copy of his headware memory to rescuers; this contains a
    design for an enhanced Level 4 tactical computer, referenced to ShadowTech page
    53.
  - The source estimates the advanced tactical computer design at around 3.5 million
    nuyen, motivating competition for access to the information.
  - One branch has runners return after a rescue only to find a second team has abducted
    Petrosian, necessitating additional investigation.
  - An alternate employment approach involves contact with Petrosian as a working
    street doctor, or through Ukrainian contacts testing the runners before arranging
    to engage them.
  - He may be encountered in Russian/Ukrainian communities in London, Paris, or New
    York, or among Turkish communities in Germany, London, New York or Marseilles,
    possibly while staying with his wife’s relatives.
  - If the party locates him, it must still locate an appropriate corporation willing
    to purchase the design while avoiding competing interested buyers.
  mechanics_cross_reference:
    subject: Level 4 tactical computer
    value_estimate_nuyen: 3500000
    source_cross_reference: ShadowTech p.53
    status: source-period context; not a new rules conversion
  branch_invariant: Every hook is an optional gamemaster scenario path, not confirmation
    that its fictional events occurred.
