data:
  character: Alexander Tyrell Gates
  source_anchor:
    printed_page: 25
    pdf_page: 26
    heading: Hooks and Notes
  scenario_uses:
  - A runner group might persuade Alex to assist with the Matrix, where he can guide
    them through a variety of areas, particularly Microdeck research sections.
  - The source suggests Alex may intuitively pass certain Matrix security systems,
    while ordinary basic defenses sometimes confound his unusual logic.
  - Alex is not motivated by the same secrets or stored data sought by adult deckers;
    he may enter a secure system simply to leave his name or create a minor prank
    and overlook valuable hidden information.
  - 'The game-master should treat Alex as a child with a child’s concerns: he may
    be awkward or nearly unresponsive in the physical world if unhappy, and may be
    ignorant of ordinary three-dimensional spaces and relationships.'
  - Interference with the boy could bring the attention of his father, a very powerful
    figure at Microdeck, and the company’s investment in Alex’s experimental Matrix
    playroom.
  mechanics_cross_reference:
    rules_record: npc.prime_runners.alexander_tyrell_gates.sr2_stats
    reason: The mechanical Hacking Pool bonuses from Notes are preserved exactly in
      the rules record, not diluted into campaign guidance.
  status_of_scenarios: Hypothetical player and GM hooks, not canonical events.
