  section_heading_as_printed: Hooks
  optional_fictional_game_master_uses:
  - The book suggests Wendall as a bounty hunter, private detective or unusually effective
    person-finder when fictional investigators cannot locate a missing person or identify
    the perpetrator of a crime. This is a potential scenario hook, not proof a given
    case occurred.
  - The characters may have difficulty making contact with him or persuading him to
    accept a case, even if a larger campaign depends on his participation, because
    he refuses work that does not suit him.
  - A GM can portray his obsessive methods and emotionally damaging investigations
    as a difficulty for the player characters, whose decisions may need to accommodate
    his altered behavior.
  - For a distinctive detective scenario, the text advises emphasizing Wendall's research
    into every available detail of a subject, including accounts from relatives and
    friends and re-enactment of traumatic incidents in their lives. These are fictional
    narrative devices and are not game-system resolution tests or real-world interrogation
    advice.
  accompanying_setting_notes:
    base: The fictional character retains a house in the southern swamps, containing
      a large assortment of hunting weapons, a marsh-skimmer hoverboat, a small powerboat
      and four large trained German shepherd dogs.
    away_from_home: Carries additional equipment, ammunition and weapons in his vehicle.
    cyberware_aversion: The source specifies Wendall has no cyberware and strongly
      rejects it, believing implanted technology would impair his psychological understanding
      of a person under investigation.
    character_reaction: The book says he responds very negatively to heavily cybernetically
      augmented samurai archetypes.
    source_mechanics_boundary: Exact weapon statistics, professional and threat ratings,
      vehicle and gear entries remain in the previously verified Shadowrun Second
      Edition rules record and are not generalized by this campaign guidance.
