data:
  name: Sherlock [Fixer]
  source_anchor:
    printed_page: 67
    pdf_page: 76
    headings:
    - Hooks
    - Notes
  campaign_hooks:
  - Sherlock may direct runners to employers but should not become an unlimited source
    of clues or employment.
  - The source suggests Sherlock may become an eyewitness who helps runners identify
    criminals when they are falsely accused.
  - He may become caught in a fictional Yakuza–organized-crime confrontation and draw
    attention from both sides, after which his clients could assist him.
  - He may recruit runners to enter places where orks would not be welcome.
  - The source suggests others might hire runners to find Sherlock if he has been
    kidnapped, because his memory and contacts are valuable.
  boundaries:
  - Sherlock does not ordinarily reveal or compromise his Fedpol associate, unless
    the source's unusually strong-surveillance hypothetical is used.
  - His highly detailed contacts and photographic recall are centered on DC; the source
    says he is less reliable elsewhere.
  - He does not supply black-market drugs or BTLs despite his general equipment contacts.
  related_mechanics: npc.prime_runners.sherlock_stats.sr2_rule_exact
  game_master_guidance:
  - Sherlock has mild allergy to certain food additives, eats vegetarian food, and
    avoids synthetic foods
  - The character is a fan of old detective films and often imitates a British accent
  provenance_note: The mechanics for availability target-number modifier, negotiated
    prices and media barter are held unchanged in the separate rules record.
