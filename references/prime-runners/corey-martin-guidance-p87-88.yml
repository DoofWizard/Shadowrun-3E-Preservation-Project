    heading: Notes
  premise: The GM may use Corey as a source-period character possessed by the shella,
    a spectral wendigo associated with the winter season; this fictional possession
    is a source narrative explanation rather than a real-world diagnosis.
  scenario_threads:
  - option: Pursuit and protection
    details: GM may place characters in a position where a bounty hunter, an ally,
      or a valuable contact becomes involved in Corey’s pursuit. The text specifically
      warns that Corey’s profile is extraordinarily hazardous.
  - option: Unwanted possession
    details: The frightened host may wish to escape the shella’s demands, and the
      spirit may attempt to change hosts when Corey resists. Characters can learn
      the conditional nature of possession.
  - option: Spirit’s weakness
    details: The entity is much weaker near new moon and strongest near full moon.
      Its inability to enter Corey around new moon may present a fantasy adventure
      opportunity.
  - option: Magical involvement
    details: A shaman or mage among the runners may become a target for attempted
      possession during a rare period when the spirit is outside Corey.
  mechanics_location: rules/prime-runners/corey-martin-stats-p87-88.yml
  status_boundary: All story options are conditional roleplaying adventure prompts;
    there is no historical assertion that the player characters experienced them.
