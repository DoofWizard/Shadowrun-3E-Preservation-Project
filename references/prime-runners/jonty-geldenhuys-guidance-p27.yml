    section: Hooks
  character: Jonty Geldenhuys
  scenario_options:
  - situation: Runners are hired to protect a person whom Jonty has been contracted
      to pursue.
    source_options:
    - They may defend the person directly in a confrontation.
    - They may instead attempt to confront Jonty before he encounters the protected
      person.
    agency_guard: The players choose their response; the source does not assert either
      event occurred.
  - situation: Jonty hires the runners to conduct preliminary inquiries about one
      of his intended targets.
    complication: Partway through the assignment, a grieving former spouse of someone
      Jonty previously killed employs multiple bounty hunters or assassins against
      Jonty’s collaborators, making the runners targets.
    certainty: Conditional GM scenario, not an established historical incident.
  - situation: Jonty has learned sensitive information about people and locations
      in earlier work.
    information_storage:
    - Notes and files concerning highly sensitive locations may be held in bank deposit
      boxes.
    - Additional notes may be stored in his headware memory.
    access_condition: The runners may gain useful intelligence by assisting him with
      his current work; access is not unconditional.
  editorial_boundary: These are source-authored fictional scenario hooks, not instructions
