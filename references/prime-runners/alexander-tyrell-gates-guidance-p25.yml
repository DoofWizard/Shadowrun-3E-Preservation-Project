data:
  source_heading: Hooks and Notes
  kind: Optional plot/play guidance; distinct from exact character stats
  possible_role: If persuaded, Alex can be an unusually capable guide for a runner
    team traversing the Matrix and Microdeck research areas.
  limits: His intuition can overcome barriers but not every system can be circumvented
    by his unconventional approach; advanced basic defenses may cause problems for
    companions.
  child_perspective: He remains a child, more interested in leaving mischievous traces
    and investigating curiosities than in adults’ priorities about secrecy, property
    or protected data.
  social_risk: Unhappy or overstimulated outside the Matrix, Alex may withdraw or
    become unresponsive; ordinary real-world contact is difficult for him.
  custodial_risk: His father is a powerful corporate executive who may react angrily
    to someone influencing his son; Microdeck has a major investment in Alex’s abilities.
  playability: Game master should model Alex as unusually intuitive rather than a
    generic adult professional; the Notes prescribe special numeric modifiers separately
    preserved in rules/prime-runners/alexander-tyrell-gates-stats-p24-25.yml.
  mechanical_lineage: The exact special rule is +4 dice to his Hacking Pool when something
    in the Matrix engages Alex’s curiosity, plus +2 dice to his Hacking Pool while
    he is using any Sensor program; these bonuses are cumulative. The existing rules/prime-runners/alexander-tyrell-gates-stats-p24-25.yml
    preserves this historical SR2 mechanic without conversion.
