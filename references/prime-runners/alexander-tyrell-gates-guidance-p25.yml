  kind: Optional plot/play guidance; distinct from exact character statistics
  possible_role: If a runner team persuades him to help, Alex can be a powerful guide
    through parts of the fictional Matrix, especially Microdeck’s research sections.
  limits: He can sometimes bypass security intuitively, but some basic defenses cause
    him much greater trouble because his unusual approach cannot circumvent them.
    The source does not call those basic defenses advanced.
  child_perspective: He remains a child with a child’s concerns and does not value
    secrets or information as adults do. The illustrative hook contrasts entering
    a secure location to write his name on a wall, then leaving its door open and
    data untouched, with actually obtaining the data for the team; it is not a completed
    adventure.
  social_risk: He has severe difficulty relating to the physical world, including
    streets, shops, open spaces and people. If someone wants him to do something he
    is not completely happy with, he may become totally unresponsive. The source does
    not attribute this conditional reaction to overstimulation.
  custodial_risk: The Hooks call him the child of Microdeck’s second most powerful
    man, without naming that man in that sentence, and predict serious objection to
    interference with the son and the company’s costly research investment. Page 24
    separately identifies Brian W. Gates III as chairman and father; do not substitute
    his uncle or invent a resolution of the ranking.
  playability: The gamemaster is invited to bend rules to reflect Alex’s unique intuitive
    capabilities rather than treating him as an ordinary adult decker. No quantitative
    bonus beyond the separately recorded special modifiers is supplied.
  mechanics_reference: rules/prime-runners/alexander-tyrell-gates-stats-p24-25.yml
  mechanical_lineage: The exact special rule is +4 dice to his Hacking Pool when something
    in the Matrix engages Alex’s curiosity, plus +2 dice to his Hacking Pool while
    he is using any Sensor program; these bonuses are cumulative. The existing rules/prime-runners/alexander-tyrell-gates-stats-p24-25.yml
    preserves this historical SR2 mechanic without conversion.
