data:
  source:
    printed_page: 84
    pdf_page: 93
    heading: Hooks
  scenarios:
  - name: Patsy
    events: Chico recruits runners under an apparent environmental activist mission
      and presents himself as an idealistic wealthy ally. Behind the scenes he stages
      an anti-property action that kills around two dozen uninvolved people and frames
      the runners. The runners must locate Chico and secure his testimony or proof.
      Corporate hostility becomes an obstacle.
    agency: Chico deceives the runners and causes the casualties; runners are framed,
      not willing participants in the harm.
  - name: Too close to the fan
    events: An alternative patsy story in which runners are innocent bystanders near
      Chico’s operation, but Chico’s corporate employers designate them as scapegoats
      nevertheless.
    agency: Runners are nonparticipants and are deliberately framed by a corporate
      employer.
  - name: Stop Chico
    events: A corporate employee learns that the company has contracted Chico and
      tries to stop him. The employee contacts an environmental group, arranging a
      meeting involving the employee, the runners and the group. The employee is killed
      en route, and the employer then seeks to eliminate the runners. The runners
      seek evidence within the company’s computers, discover why they are targets
      and stop further assassination attempts.
    agency: The employee attempts to resist Chico; runners are hired by threatened
      parties and later pursued.
  - name: Runaway train
    events: Chico becomes uncontrolled and at least two corporations seek his permanent
      removal. Two separate corporate Johnsons offer runners contracts naming Chico
      with incompatible explanations and aliases. The firms monitor the runners with
      suspicion, producing intercorporate paranoia.
    agency: Both Johnsons conceal important information; neither explanation is established
      without investigation.
  - name: After the bomb has gone off
    events: In the aftermath of Chico’s bombing, both the brother and the best friend
      of a corporate employee become involuntary organ donors. The employee questions
      the corporate investigation and hires runners to make further inquiries. The
      runners find that the same employer hired Chico to resolve an internal corporate
      power struggle described as disagreements over personnel placement. The employer
      attempts to isolate/discredit its own investigating employee. Runners must find
      independent evidence to make their findings public.
    agency: The affected individuals did not consent; the employer’s responsibility
      is the intended scenario revelation.
  - name: Bring him in alive
    events: Activists have evidence about the concealed Julio Hernandez identity and
      want him alive for questioning. Meanwhile corporate clients view him as expendable
      and pursue him, then target the runners.
    agency: Activists seek a live interview/interrogation; corporations attempt to
      eliminate evidence and witnesses.
  fidelity: These are optional GM plots and hypothetical outcomes, not claims that
    any of these six events actually occurred in setting canon.
