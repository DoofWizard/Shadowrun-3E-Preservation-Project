data:
  character: Hammerhead [Street Samurai]
  hooks:
  - Hammerhead’s size and volatility make social situations prone to conflict, particularly
    after drinking or when someone commits the perceived social insult of presenting
    pointed ears.
  - His mercenary and street-samurai career has left many unresolved rivalries. Player
    characters who have worked as mercenaries or street samurai may know him or encounter
    a past adversary tied to him.
