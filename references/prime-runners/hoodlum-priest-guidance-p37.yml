  subject: Hoodlum Priest
  setting: The Noose, Chicago, Shattergraves district
  optional_scenarios:
  - scenario: Street-gang conflict
    conditional_premise: Runners could become involved in an ongoing conflict between the Priest and followers and the Murphy’s Law gang.
    uncertain_outcome: Player decisions can affect that conflict and possibly local power relations; source does not establish a particular resolution.
  - scenario: Contacts with spirits
    conditional_premise: Runners may have to deal with ghosts; the Priest’s unusual preaching skill and relationship with spirits may become useful.
    mechanical_cross_reference: rules/prime-runners/hoodlum-priest-preaching-p36-37.yml; do not replace exact source tests.
  - scenario: Employ or accompany the Priest
    conditional_premise: Priest is interested in accompanying runners as extra help provided pay is adequate; he needs funds to repair Noose buildings and make them livable.
    agency: This is a proposed offer, not evidence of a completed assignment.
  - scenario: Large escort or distraction
    conditional_premise: His many followers could create a mass diversion or provide a large escort, but the source warns they lack adequate equipment.
    context: The narrator emphasizes these community members’ dignity, mutual aid and commitment rather than presenting them as disposable gang members.
  historical_context: The text raises the possibility of a change in Chicago’s local status quo without prescribing one.
  distinctions:
  - The four campaign possibilities are GM prompts, not canonically completed events.
  - Underlying Second Edition Preaching tests and modifiers remain in their separately preserved rule_exact record.
