    headings:
    - Hooks
    - Notes
  contact_role: Introduces custom cyberware and high-end augmentation contacts; clients
    need to locate him in Switzerland for direct dealings.
  scenario_examples:
  - premise: A client blames Kaminsky for a failed augmentation with disfigurement
      and seeks revenge.
    runner_role: He may hire runners as protective escorts; as a financial constraint
      he may offer beta-customized cyberware at a substantially reduced rate in exchange
      for help.
  - premise: Kaminsky could exploit his role as publisher of scientific research to
      conceal fictional corporate espionage.
    runner_role: Runner team protects a transfer in which stolen research information
      is passed between industrial corporate buyers; narrator posits a high payment.
  - premise: Headware storage and travel
    facts:
    - He stores sensitive information in headware memory
    - Refuses to download it except in person at the buyer’s location
    - Distrusts couriers
    - Refuses to fly because of his fear of aviation
    possible_route: An overland and ship journey from Europe through Santander and
      Central America, or the Trans-Siberian Railway toward Kamchatka and Japan.
    possible_antagonists:
    - Representatives of the research-owning corporation
    - Intermediaries attempting to acquire data without paying
    - Independent opportunists
    - Bandits or corrupt police on the travel route
    - Other unstable fictional antagonists
  roleplay_notes:
  - Insists on meeting counterparties face-to-face
  - Fear of flying makes doing business with him more difficult
  - Generally available by in-person contact in Switzerland
