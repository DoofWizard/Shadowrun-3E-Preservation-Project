data:
  name: Alfredo Garcia — Hooks
  source_anchors:
  - printed_page: 23
    pdf_page: 24
    heading: Hooks
  possible_contact: Runners who befriend Alfredo can benefit from his overhearing
    small talk by London high-society patrons, runners, and Johnsons; he is a good
    local information contact.
  setting: Technicolor Yawn, a bar in London managed by Gwendolyn Robinson.
  manager_and_recruitment: Robinson owns the charismatic club; she charmed Alfredo
    on a visit to Spokane, and he willingly relocated to work at her London bar.
  manager_business_as_source_describes:
  - Robinson imports aboriginal art from Australia to decorate the club.
  - She has recently begun importing Native American Indian art for a planned Amerindian-themed
    club.
  - The source says these imports breach export laws and include talismans or spell
    fetishes.
  - She sells the imported material illegally to British magicians and uses the profits
    to finance criminal activities.
  knowledge_asymmetry:
    alfredo: Only recently learned of the illegal business; is angry that cultural
      property of Salish-Shidhe and others is being exploited.
    robinson: Knows about and profits from the illicit imports.
    source_certainty: GM narrator presents these as scenario facts rather than attributed
      forum gossip.
  pressure_and_requests:
  - Alfredo has seen unpleasant men in dark suits and shades hanging around his manager.
  - He wants something done about the exploitation but worries he could lose his job
    and route home if the bar collapses.
  - Outside assistance, including a runner team, is likely to be sought; this is a
    GM scenario hook, not real-world guidance.
  roleplay_constraints:
  - He is naive but kind and honest; should not be patronized.
  - He can write notes, understands spoken requests and has very acute hearing.
  - He values sincere friendships; avoid treating his silence as a cognitive limitation.
  related_existing_stats_record: npc.prime_runners.alfredo_garcia.sr2_stats
  source_attribution: Printed page 23 Hooks and adjoining Notes; facts are in GM narrator
    voice, not forum posts.
