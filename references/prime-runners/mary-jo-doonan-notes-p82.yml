data:
  name: Mary Jo Doonan — GM Notes
  source_anchor:
    printed_page: 82
    pdf_page: 91
    heading: Notes
  optional_equipment_guidance:
    instruction: The GM may add other equipment to Doonan's listing as needed; this is discretionary guidance, not a fixed inventory.
    plausible_additions:
      - military-specification weapons
      - illicit pharmaceuticals
      - BTLs
    rationale: The source describes Doonan as a fixer of sorts.
  watercraft_guidance:
    description: Her boat is a battered but sturdy bayou swamp craft that does not readily match a printed Shadowrun watercraft archetype.
    closest_published_comparison: Aztech Nightrunner
    armament: GM discretion; no fixed boat armament is specified.
  portrayal_guidance:
    clothing_options:
      - floppy, broad-brimmed hat
      - tight-fitting jeans
    contrasting_impression: The source contrasts this outward styling with her toughness, comparing her unfavorably to a fragile person and positively to a swamp alligator.
    voice: Deep and resonant; the text attributes its sound to substantial bourbon and late-night cigarette use.
    demeanor:
      - tough and hard
      - highly cynical
      - little sense of humor
      - unforgiving
      - pragmatic
      - mean
  source_attribution: GM-facing Notes paragraph, not the neighboring stat block or the distinct in-world forum comment.
