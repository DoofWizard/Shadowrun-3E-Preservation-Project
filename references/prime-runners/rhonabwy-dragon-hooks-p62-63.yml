data:
  name: Rhonabwy [Welsh Great Dragon]
  source_anchors:
  - printed_page: 62
    pdf_page: 63
    heading: Hooks
  - printed_page: 63
    pdf_page: 64
    headings:
    - Hooks (continued)
    - Notes
  scenario_hooks:
  - Rhonabwy can use a free-spirit intermediary to hire runners for operations against
    a corporate or individual target he is scheming against.
  - Alternative operations can target a powerful elven faction in Tir Tairngire, Tir
    na nÓg, or the Zulu Nation, or may affect a non-elven metahuman group fighting
    for cultural preservation.
  - Ideally the agents do not initially realize the intermediary is working for Rhonabwy,
    and only discover this after multiple related assignments and investigations.
  - A target who opposes Rhonabwy, exemplified by Lofwyr, may later aid the runners
    to expose Rhonabwy's interests, creating shifting alliances.
  - Rhonabwy may pay agents with orichalcum, substantial nuyen, logistical support,
    magical aid, information or astral-quest assistance.
  - Rhonabwy's free spirit may use material obtained from a mage or shaman runner
    to threaten ritual sorcery if the campaign develops into open conflict; this is
    only an in-game possibility.
  - Confronting Rhonabwy or his opponents may end in a negotiated payment, magical
    items, information, or additional scenario work, not automatic combat.
  mythic_campaign_option:
    status: unconfirmed_in_world_legend
    claim: Rhonabwy and the Sea Dragon of Cardigan Bay may have fought an eternal
      magical struggle before the Sixth World; some identify them as the dragons from
      Arthurian tradition.
    gamemaster_discretion: May choose whether myth true; if true, a campaign could
      involve astral quest to an Arthurian metaplane and change Rhonabwy's influence.
  character_scene_hook:
    source_fact: Rhonabwy is enchanted by choral music and Welsh all-male choirs
    proposed_scene: May attend a choir concert while disguised in human form; a runner
      with exceptional Singing might become a protege or be recruited to protect/help
      him.
