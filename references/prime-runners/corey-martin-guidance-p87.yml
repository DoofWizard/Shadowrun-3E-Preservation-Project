data:
  character: Corey Martin
  source_anchor:
    printed_page: 87
    pdf_page: 96
    heading: Hooks
  fictional_premise: The source presents Corey as the host of a shella, an otherworldly
    spectral wendigo tied to freezing winter winds; the supernatural possession is
    an in-universe campaign explanation, distinct from the psychological theories
    in forum posts.
  background: According to the hook, when the fifteen-year-old Corey was freezing
    beside his dead motorcycle in a winter storm west of Portsmouth in February 2053,
    a shella entered his body and preserved his life. It continues to feed on victims
    and enhance his abilities.
  situational_rules_ref: See separate verified rules/prime-runners/corey-martin-stats-p87-88.yml
    for exact possession, powers, lunar timing, resistance and banishment tests; those
    mechanics are not replaced or summarized as rules in this guidance record.
  branching_campaign_hooks:
  - Corey may seek help removing the possessing spirit; prospective allies may distrust
    or refuse him, and assistance carries personal danger.
  - The character may enter player characters’ lives through a missing or endangered
    associate, or through a campaign involving one of his victims.
  - A shaman or mage travelling with player characters may become a prospective possession
    target when the spirit is temporarily outside Corey.
  - The spirit is aware of risks to itself and can abandon its host; Corey as host
    may not be aware of his danger when the spirit drives a feeding frenzy.
  setting_note: The hook states the character is currently staying in a squat on the
    north side of Detroit among other homeless orks and trolls, has little money and
    owns a deteriorated car bought with proceeds from victims. This is source-period
    setting fiction, not confirmation of an unchanging residence.
  narrative_claim_status: Alternative fictional GM hooks, not all simultaneously established
    historical outcomes.
