headline: 'Prime Runners: how the 41 NPC profiles are used'
summary: Second Edition GM reference conventions for reusable NPC statistics, motivations, rumors and campaign hooks.
data:
  source_anchors:
  - printed_page: 4
    pdf_page: 5
    section: Introduction
  - printed_page: 5
    pdf_page: 6
    section: Introduction
    page_art_only: true
  reference_scope:
    character_count: 41
    type: non_player_characters
    intended_rules_edition: Shadowrun Second Edition
    source_purpose: Profiles of notable figures for use as non-player characters in games.
    sample_campaign_roles:
    - obstacles or adversaries
    - potential future enemies
    - people the player characters pursue
    - people pursuing the player characters
    - sources of jobs and other employment
  profile_components:
  - complete game statistics as published for direct game use
  - birth date and place
  - nationality
  - metatype
  - current residence
  - physical characteristics
  - dominant personality traits and motivations
  - personal history and background
  - hooks suggesting campaign and adventure use
  gamemaster_adaptation:
  - Profiles are not fixed requirements; gamemasters may alter details to fit the campaign.
  - Example supplied in the introduction: Michael James Sutherland is described as an Englishman living in New York, but a
      gamemaster may move him to Seattle or New Orleans while retaining much of the character.
  - Hooks support incidental appearances, whole-adventure focus, or recurring characters.
  - NPC personalities, lifestyles and typical reactions are intended to make the cast distinct rather than mere numerical
    game statistics.
  - Information is presented as shadow-community knowledge; posted rumors and comments can be inaccurate, and the gamemaster
    determines the game-world truth.
  - Profiles are alphabetical except that working partnerships/groups may appear consecutively, with Hiroshige and Takemura
    named as an example.
  contemporary_cross_references:
  - Virtual Realities
  - Street Samurai Handbook
  - Shadowbeat
  - Shadowtech
  - The Grimoire, Second Edition
