data:
  name: Mary Jo Doonan — Hooks
  source_anchor: {printed_page: 81, pdf_page: 90, heading: Hooks}
  contact_for_illicit_goods:
    use: Possible runner contact for acquiring virtually any dangerous or illegal item in the game setting.
    delivery: Can identify someone able to carry the requested material by boat off the Louisiana coast within 72 hours.
    access_condition: Runners must first establish contact with Doonan and negotiate with her directly.
    surveillance: She monitors information circulating about her location and is suspicious of business contacts.
    risk: Her intelligence-service training makes her dangerous, particularly when she suspects a double-cross.
    vessel_risk: When aboard her watercraft she is even more guarded, and two large troll associates are described as strongly limiting confrontation.
  intelligence_contact:
    background: Her former CIA employment gave her knowledge of, or access to files concerning, many criminals, assassins, serial killers, and other notorious individuals in the UCAS and CAS.
    game_use: Runners might request information about dangerous adversaries.
    limitation: Finding her and persuading her to share intelligence may itself endanger the runners.
  cia_grudge_scenario:
    premise: She may resent an earlier CIA betrayal and want a particular person held responsible.
    delegation: Although she might not carry out the job personally, she can pay player characters to pursue that individual.
    deceptive_agency_tie: Once the runners begin, internal CIA conflicts can entangle them.
    counterclaim: Her former supervisor may claim to know the original responsible party and offer support; the GM guidance explicitly says the supervisor is lying.
    retaliation: The supervisor sends the runners back toward Doonan and may use an onboard cortex bomb to maintain their obedience.
    source_certainty: The grudge and hired-runner setup is a suggested hypothetical hook, not a documented historical event; the narrator directly identifies the supervisor's claim as deceptive inside that hook.
  related_existing_stats_record: npc.prime_runners.mary_jo_doonan.sr2_stats
  source_attribution: GM narrator's Hooks section; not the adjoining anonymous in-world comments, which have separate and varying evidentiary status.
framing: newsroom_neutral
headline: Mary Jo Doonan — historical campaign hooks and optional scenarios
