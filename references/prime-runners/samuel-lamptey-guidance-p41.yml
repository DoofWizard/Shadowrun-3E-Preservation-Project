  source_heading: Hooks
  character: Samuel Lamptey
  kind: optional game-master scenario, not established source-period historical event
  initial_roles:
  - Bodyguard
  - Chaperone
  - Stager of events to keep Lamptey happy
  scenario_conditional_sequence:
  - step: 1
    condition: If this example plot is selected
    claim: Seahawks defensive coordinator nicknamed 'Blubby' Ryan has accepted a bribe
      from the Buffalo Bills to target Lamptey.
    agency:
    - Buffalo Bills offers inducement
    - Ryan accepts and acts
    source_status: proposed scenario, not confirmed setting fact
  - step: 2
    claim: The Seattle offensive coordinator hires the player runner team to stage
      a convincing shadowrun for Lamptey.
  - step: 3
    claim: Ryan hires a separate runner team to kill Lamptey and the first runner
      group while they take part in the staged event.
    opposition: The second team is adversarial to both Lamptey and the player runners.
  - step: 4
    condition: If Lamptey and the first runners survive
    claim: Ryan sends additional assassins after the runner group so they cannot trace
      the first attackers to Ryan.
    agency: Ryan conceals his role by targeting potential witnesses.
  - step: 5
    claim: The adventure can continue to the Super Bowl itself, where a final airborne
      attack threatens Lamptey, the runners, and most of the Seahawks.
    threat_source: The scenario describes hostile attackers firing missiles from helicopters;
      this is a plot event, not real-world instructions.
  - step: 6
    condition: If the player runners survive
    claim: They can attend and experience the Super Bowl festivities, including crowd
      spectacle, vendors, eccentric commentary, freezing-weather fans, and showy halftime
      entertainment.
  mechanics:
    new_standalone_rules: false
  source_tone: Darkly comic, escalating, conditional game-master hooks; story beats
