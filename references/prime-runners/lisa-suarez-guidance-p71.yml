data:
  subject: Lisa Suarez (Talismonger)
  basic_contact: Lisa can be a talismanic supplier and appraisal contact for player
    characters; her independence and site visits create other optional stories.
  optional_ukraine_expedition:
    narrator_premise: Lisa believes she has located relics of an ancient civilization
      in southern Ukraine. During her last trip, local shamans and mages responded
      with hostility to her presence.
    next_step: She proposes bringing escorts, potentially the player characters, on
      a return expedition.
    complications: Indigenous magical practitioners may oppose further recovery; rival
      external parties may seek a coveted find. Possible examples suggested in print
      include operatives from Tir na nOg or Tir Tairngire, or insect shamans.
    gm_authority: The gamemaster invents the contested item's identity and history
      to suit the campaign; neither a particular recovered artifact nor the outcomes
      are established source-period history.
  optional_telesma_gathering:
    narrator_premise: Runners could accompany Lisa on expeditions closer to home to
      gather telesma and other enchanting materials; this option is contingent on
      her having learned to trust them.
    complications: Potential encounters include rival magical practitioners, paranormal
      animals in whose territory the group trespasses, and a corporate operation affecting
      an indigenous sacred site where local shamans seek assistance.
    certainty: Hypothetical adventure prompts, not claims that these incidents occurred.
  optional_idol_mystery:
    homage: The text explicitly invokes a Maltese Falcon-style scenario.
    triggering_event: On a stormy night a dying man reaches Lisa's apartment, leaves
      an idol wrapped in brown paper with her, and collapses; pursuers then search
      for the object.
    player_goal: Lisa asks runners to help protect her and determine the item's identity
      and how to dispose of it safely.
    balancing_instruction: The gamemaster should give the object a real advantage
      to a person possessing it or nearby, sufficiently important to justify threats
      and counterbalance possible hazards, rather than reducing it to a decorative
      object.
    associated_mechanical_example: The specific hypothetical Increase Attribute and
      Drain example is preserved in a separate single-class historical optional artifact
      record; it is not an existing canonical artifact statistic.
  textual_boundary: Each scenario is optional gamemaster guidance and does not establish
    a fixed event, standard scenario outcome, general game rule, or official artifact
    as historical fact.
