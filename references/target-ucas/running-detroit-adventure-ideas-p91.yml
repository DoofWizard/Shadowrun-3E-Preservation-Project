data:
  section: Game Information — Running in Detroit, Sample Adventure Ideas
  source_context: 'Original FASA Corporation Target: UCAS (FASA7214, ©1997), fictional Shadowrun Second Edition-era
    tabletop RPG, printed pp91/PDF pp92.'
  source_substance:
    scope: Five explicitly optional game-master plots, not established completed events. Preserve choice, coercion,
      deception and uncertain outcomes.
    Double_Agents:
      setup: Leonard Aurelius supervises a tightly secured rigger-control breakthrough; Damien Knight knows
        of the discovery and seeks credit through sabotage.
      conditional_action: Knight secretly hires runners to steal the prototype, substitute a defective lookalike,
        and deliver the genuine item. Ares security loyal to Aurelius anticipates them and corners the team.
      outcome: The trapped runners are given a coerced choice of making another fake for Aurelius or facing
        lethal consequences; the book leaves the decision and result open.
    Enemies_Within_Enemies_Without:
      setup: Raoul Gottschalk, Matrix designer, defected from Mitsuhama to Ares; Mitsuhama wants him back or
        dead and a 24-hour protection detail is hired.
      deception: Ares insider Frank Stein, connected with Laura O’Toole and hostile to Gottschalk, secretly
        arranges an assassination and frames the hired runners as an extraction team; the scenario says their
        names may never be cleared.
    The_Big_Gamble:
      actors: Don Leo McCaskill of Milwaukee assigns “Eggs” Milwaukee to undermine the casino of rival Don
        Roland “the Greek” Stephanopoulos; McCaskill seeks prestige within the Mafia Commission.
      choice: Player characters may become involved on either side or both; no fixed resolution is stated.
    Motor_City_Madmen:
      setup: Leonard Aurelius hires watchers for daughter Evelynn, lead guitar player of The Unholy Machine,
        without her knowing she is being watched.
      relationships: Evelynn is involved with Two-Chord Teddy of the Detroit Nightmares; the text places the
        gang near Oakland County and suggests Ares prototype demonstrations as game color.
    Run_for_the_Border:
      setup: Damien Knight pursues a grudge against Cross Applied Technologies and contracts runners to contact
        the Quebec Unite fringe and carry out fictional smuggling between Quebec and Windsor.
      frictions: Possible encounters include the First Canadians militia and Mafia control of Windsor docks;
        the material gives no real-world logistical or operational instructions.
