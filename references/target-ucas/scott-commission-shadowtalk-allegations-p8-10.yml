data:
  source_publication: 'FASA Corporation Target: UCAS (FASA7214, 1997), printed pp8–10/PDF9–11; separate Shadowtalk exchanges alongside
    DC Insider’s article.'
  claim_status: Speaker-specific in-world allegations/opinions; none automatically established as sourcebook fact.
  comments:
  - speaker: Findler-Man
    claim: Suspects Nadja Daviar might have arranged the assassination, pointing to her proximity to Dunkelzahn and alleged opportunity;
      no evidence shown.
    certainty: speculation
  - speaker: Fed Spook
    claim: Asserts FBI mages at hearings are using truth-sensing spells without witnesses’ consent, in contravention of the fictional
      UCAS Bill of Rights; a speaker allegation, not confirmed fact.
    certainty: alleged
  - speaker: Sabre
    claim: Alleges specialized sensors monitor blood-pressure and galvanic skin responses from across the hearing room without
      witnesses knowing.
    certainty: alleged
  - speaker: Druid Lass
    claim: Opposes unconsented truth-detection by government, calls spells imperfect and susceptible to evasion; an opinion and
      technical assertion in fictional-world commentary.
    certainty: opinion
  - speaker: Desiderata
    claim: Alleges FBI investigation has been used to pressure or intimidate underground organizations and summons members despite
      thin evidence; distinguishes the allegation from findings.
    certainty: alleged
  - speaker: DeeCeeIOT
    claim: Claims FBI searched the Illuminates of the New Dawn chapterhouse in DeeCee, catalogued artifacts and magical sites,
      and found no evidence of assassination involvement; describes threatened litigation.
    certainty: alleged
  - speaker: Legal Beagle
    claim: Warns the commission may be misused like earlier political inquiries, describes contempt powers and the risk of public
      stigma; political/legal commentary, not an adjudicated finding.
    certainty: opinion
  - speaker: Fade-Out
    claim: Defends the commission members as public servants doing their jobs and disputes comparisons to inquisitorial proceedings.
    certainty: opinion
  - speaker: RAM Adams
    claim: Argues real criminal investigators, not televised congressional hearings, will ultimately identify killers.
    certainty: opinion
  - speaker: Desiderata
    claim: Suspects investigation of the assassination could provide federal cover for gathering intelligence on insect spirits
      without ordinary legal constraints.
    certainty: speculation
  - speaker: Lone Gunman
    claim: Alleges, without proof, UCAS government conspirators arranged Dunkelzahn’s assassination and manipulated the subsequent
      investigation to eliminate political opponents; suggests Daviar served as a convenient nominee.
    certainty: unsubstantiated conspiracy theory
  - speaker: Skeptic
    claim: Challenges Lone Gunman to produce specific evidence for accusations rather than unsupported assertions.
    certainty: criticism
  - speaker: Captain Chaos
    claim: Permits speculation but tells commenters to share genuine evidence if available; moderator position, not support for
      the conspiracy.
    certainty: moderation
  - speaker: Scorpio
    claim: Reports being hired by Dunkelzahn campaign-security adviser Carla Brooks for a campaign surveillance assignment, later
      awakening in a VisionQuest laboratory following what Scorpio describes as a simulated run; wonders whether people in Dunkelzahn’s
      organization were studying him.
    certainty: first-person claim and speculation
  - speaker: Lone Gunman
    claim: Points to Brooks subsequently working for Daviar and speculates that rogue security teams with ties to the late dragon
      might have worked for Daviar or UCAS interests.
    certainty: unproven speculation
  source_commentary_boundary: These are separate voices from DC Insider’s article and from President Haeffner’s address, not a
    single canonical narration.
  forum_timestamp: Captain Chaos forum segment bears a 15 March 2058 transmission timestamp, distinct from the April transmission
    of Haeffner’s February speech; sources are separately attributed.
headline: 'FICTIONAL Shadowrun tabletop-RPG archival record — Named Shadowtalk reactions and allegations about the fictional Scott
  Commission | Target: UCAS, FASA Corporation, FASA7214 (1997, Second Edition-era), printed pp8-10/PDF9-11'
summary: 'Fictional tabletop-RPG source: Named in-world commenters dispute investigative powers, alleged FBI pressure, unconsented
  truth testing and rumors about insect spirits; the claims remain attributed and unresolved. Published in Target: UCAS, FASA Corporation
  (FASA7214, 1997, Second Edition-era), printed pp8-10/PDF9-11.'
framing: newsroom_neutral
