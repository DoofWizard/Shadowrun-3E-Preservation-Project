data:
  narrator_source_context: The author’s printed Introduction to FASA’s 1997 fictional Shadowrun tabletop-RPG sourcebook, not a contemporaneous factual government history.
  scope: 'Unlike a single-place sourcebook, Target: UCAS links Boston, Detroit and Chicago through changing United Canadian and American States circumstances following the death of President Dunkelzahn.'
  document_style: Framed as an electronic document from the fictional world, including scattered comments, questions and additions by game-universe readers.
  explicit_unreliability: The introduction warns that in-world contributors can be inaccurate, biased, misleading or dishonest; players should not automatically assume any such comment to be accurate, considered or true.
  game_master_scope: The source intentionally lets the gamemaster decide which of its in-world reported statements are true, misleading or false within an individual 2058 campaign.
  campaign_utility: Provides setting background and story hooks for Boston, Detroit and Chicago; the later Game Information chapter presents living costs, transportation information, local detail and optional adventures.
