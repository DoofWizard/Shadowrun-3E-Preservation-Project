data:
  publication_frame: FASA 1997 fictional Shadowrun internet-like Shadowland v2.1 splash pages, not real-world reporting or historical event confirmation.
  website_framing: A Word from Our Sponsor states that this Shadowland issue shifts from isolated stories toward broad developments following the events of the prior fictional year.
  back_stock:
    election_2057: The in-world library tile advertises Election 2057 and looks toward 2060.
    dunkelzahns_will: The Big D’s Will is offered as an archive link.
    underworld_sourcebook: The underworld sourcebook is a retrospective on the fictional criminal landscape in 2058.
  daily_special:
    highlighted_cities:
    - Boston
    - Detroit
    - Chicago
    time_context: Cities promoted as important to the 2058 Shadowrun setting.
    references:
    - Auburn Blight
    - Chicago Containment Zone
    - President Haeffner’s State of the Union address
    certainty: Promotional commentary; not independent evidence about real events.
  upcoming_publications:
  - Rigger 2
  - Cyberpirates
  page5_tiles:
  - tile: Astral Samplings
    claim: An absurd in-world rumor describes Jesus and Jerry Garcia seen floating above a South Dakota trailer park eating barbecue beef. The tile promotes accounts of astral phenomena and astral bugs from magic users associated with Operation Extermination.
    status: Rumor and satirical teaser; not a sourcebook narrator statement establishing a sighting.
  - tile: Them Wacky Elves
    claim: Claims that tensions are rising around Tir Tairngire and that its leader Lugh Surehand is increasingly defensive at the border.
    status: Shadowland rumor, not separately confirmed.
  - tile: Flavor of the Month
    claim: Highlights Renraku’s developments, Matrix gossip and a chat forum attributed to Zebart the Rusty.
    status: In-world community promotion and commentary.
  - tile: Miles Lives!
    claim: Claims that Miles Lanier, subject of conflicting death and identity rumors, personally appeared at a Renraku board-of-directors meeting.
    status: Rumor described by Shadowland teaser, not confirmed historical fact.
