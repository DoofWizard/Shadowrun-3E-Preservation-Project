data:
  section: Chicago — Oblivion’s End? chapter illustrations across original numbered
    prose pages
  source_context: 'Five illustrations in the 1997 FASA Corporation tabletop-RPG source
    Target: UCAS (FASA7214). These are images, not verified in-world documentary footage
    or gameplay stat blocks.'
  illustration_p71_pdf72: A large dark, rectangular image at the upper right depicts
    a solitary standing, coat-wearing figure viewed from behind beside a wall or threshold,
    with a small object on the floor. It appears within the Chicago Outbreak diary
    and forum section; the plate supplies no verified name, date, or rule statistics.
  illustration_p73_pdf74: A horizontally framed black-and-white drawing near the lower
    half shows a close view of a startled or terrified male-presenting face, mouth
    open, with a circular mechanical or organic shape to his left. It appears within
    the On Target broadcast transcript, without a caption establishing the figure’s
    identity.
  illustration_p75_pdf76: A small central black-and-white drawing amid the Operation
    Extermination BBS transcript depicts fictional armored figures and equipment,
    with vapor or smoke plumes and a small insect motif. This is a visual motif, not
    a mechanically detailed battle diagram.
  illustration_p76_pdf77: Near the lower right of the same BBS segment, a detailed
    drawing shows an armored vehicle or transport with several figures and a large
    attached apparatus. The accompanying fictional discussion is not a real-world
    vehicle specification.
  illustration_p77_pdf78: A central illustration depicts an insectlike or monstrous
    figure looming over a damaged urban vehicle or scene, with armed human figures
    nearby and insect motifs near the page bottom. The image provides atmosphere and
    no stats or attributed eyewitness certification.
  page_fidelity: Source review used original physical PDF page images 72, 74 and 76–78,
    corresponding exactly to printed pages 71, 73 and 75–77. No unnumbered Chicago
    p69 page is invented or credited.
