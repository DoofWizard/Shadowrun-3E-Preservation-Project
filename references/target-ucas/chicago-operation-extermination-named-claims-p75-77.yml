{"id":"reference.target_ucas.chicago.op_extermination_bbs_voices_p75_77","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"75-77","pdf_pages":"76-78","edition_scope":"Historical fictional Shadowrun tabletop-RPG sourcebook: FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era context; no inferred Third Edition mechanics.","content_class":["attributed_claim"],"data":{"section":"Chicago Operation Extermination: named resident interpretations and uncertainties","domino_elroy":"Domino identifies Knight Errant insignia on transport vehicles and reports tanker hoses and protected troops. Elroy calls the suits chemical protective equipment and later describes the troops as heavily armed. Neither voice asserts exact technical specifications.","max_valere":"Max attributes to Valere, a mage acquaintance, unusual astral activity involving magicians, spirits and elementals near the operation and a mysterious astral haze around material delivered by tankers. Max does not identify the substance with certainty and reports that Valere had not encountered a concentration of mages like this since MIT&T graduation. Max relays Valere's belief that whatever was in the lake water was repelling insects.","bernie_greylake":"Bernie says a team opened a warehouse and drew out insects, including a large queen, before air support reportedly killed the queen. Greylake questions whether water alone could explain the process and points out how much of the fighting Bernie cannot observe.","sleeper_globe_believer":"Sleeper reports helicopter-versus-wasp-spirit fighting near Grant Park and says helicopters were gaining ground. Globe cautions that the troops were taking heavy losses despite resisting. Believer points out that impossible-seeming events have occurred before. Keep these judgments as contemporaneous fictional claims.","interrupted_record":"The BBS transcript terminates without a definitive independent conclusion about extermination, full city control, or outcomes for all Chicago residents and creatures.","source_review_status":"Independently read original page images of FASA Corporation Target: UCAS (FASA7214; 1997), Second Edition-era fictional tabletop-RPG source; attributed claims are not real-world reporting."},"headline":"Fictional Shadowrun tabletop-RPG reference — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 75-77/PDF 76-78: Chicago Operation Extermination: named resident interpretations and uncertainties","summary":"Independently source-reviewed fictional tabletop-RPG publication context from FASA Corporation Target: UCAS (FASA7214, 1997; Second Edition-era), printed 75-77/PDF 76-78. Chronologically attributed eyewitness and debate voices in an in-world 22 February 2058 Chicago BBS log.","framing":"newsroom_neutral"}
