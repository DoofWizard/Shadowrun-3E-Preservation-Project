{"id":"reference.target_ucas.detroit_auburn_blight_voices_p58_60","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"58-60","pdf_pages":"59-61","edition_scope":"Historical fictional Shadowrun tabletop-RPG source, FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era setting; no inferred Third Edition mechanics.","content_class":["attributed_claim"],"data":{"section":"Named Shadowtalk claims concerning the Auburn Blight, pp58-60","voices":[{"speaker":"Lineman","claim":"Lineman credits the Detroit Nightmares' ability to adapt beyond their home field, compares them to the Tenochtitlán Volcanoes and says the Nightmares' greater discipline costs fewer penalties. The speaker alleges Ares Arms sometimes tests minor weapon improvements on the team while claiming these remain within Urban Brawl league rules."},{"speaker":"Au-N Boy","claim":"Au-N Boy asserts that Ares quietly sponsors the Nightmares, playing on a nickname linked to Damien Knight. The claim is disputed by another speaker."},{"speaker":"Errant Knight","claim":"Errant Knight denies that Knight or Ares directly sponsor the Nightmares in the manner alleged and argues that the superficial similarity of names is misleading. The poster casts Knight as sophisticated enough to avoid obvious publicity connections."},{"speaker":"The Green Machine","claim":"The Green Machine portrays the Blight as both a negative part of Knight's corporate Detroit and a source of inexpensive security recruits, reporting that desperate residents provide personnel for Knight Errant, HardCorps and clandestine employers."},{"speaker":"Greyhawk","claim":"Greyhawk alleges that astral space in parts of the Blight has become toxic owing to pervasive despair and that a circle of toxic street shamans is attempting to spread this contamination. The author fears Ares containment efforts will fail; these are in-world magical claims, not real-world environmental measurements."},{"speaker":"EdgeRunner","claim":"EdgeRunner says the Rusted Heart gang's leader displayed a talisman made of bent, rusty metal and claimed a toxic city spirit resembling wrecked cars welded into humanoid form. The claimed spirit's nature and magic are not corroborated by a narrator rules entry."},{"speaker":"Survivor@mw.milw.ucas","claim":"A conspiratorial speaker alleges insect spirits infiltrated the government and calls the Chicago containment crisis the beginning of a larger return, claiming General Yeats was one of them. This is not accepted as authoritative narration."},{"speaker":"Skeptic","claim":"Skeptic rejects the claim of a continuing government takeover, asserts that the major Chicago hives were exposed and destroyed and argues for reconstruction. The response is not made an absolute narrator guarantee."},{"speaker":"RedWing","claim":"RedWing reports hearsay that some insect shamans left Chicago after the Wall was established and may have spread to other cities; the speaker also links unexplained disappearances in Auburn to either criminal gangs, Greyhawk's toxic shamans or possibly insect activity, explicitly retaining uncertainty."}],"source_narration":"The book narrator states that several thousand people fled Chicago to Detroit after wider reports of the insect-spirit threat, increasing overcrowding in the Blight. The narrator reports prejudice against refugees, suspicions of infestation and accusations involving Dunkelzahn's death that contributed to mob killings of refugees during later riots. These are fictional historical events in this source, not assertions about real persons.","scope":"All identifiable speakers, denials, degrees of certainty and competing explanations are retained. No rules-bearing mechanics are extracted from these comments."},"headline":"Fictional Shadowrun tabletop RPG archive - FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition era), printed 58-60/PDF 59-61: Auburn Blight urban brawl, security, refugees and insect-spirit rumors","summary":"Source-reviewed fictional 2050s Detroit material from FASA Corporation's historical Second Edition-era Target: UCAS (FASA7214, 1997), printed 58-60/PDF 59-61. Narrator statements, named in-world claims and uncertainty are distinguished.","framing":"newsroom_neutral"}
