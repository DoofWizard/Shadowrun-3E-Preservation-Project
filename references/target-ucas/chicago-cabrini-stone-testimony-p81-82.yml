{"id":"reference.target_ucas.chicago.cabrini_stone_testimony_p81_82","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"source_pdf_sha256":"dc016e418a24fad63d56fba4f2f7f657cb1c0d995cdabd648ba9c6109e33f8f8","printed_pages":"81-82","pdf_pages":"82-83","edition_scope":"FASA Corporation's 1997 Target: UCAS (FASA7214) is a historical Shadowrun Second Edition-era fictional tabletop-RPG sourcebook. No inferred Third Edition conversion.","content_class":["narrative_context"],"data":{"section":"Chicago—Oblivion's End? / Cabrini Refuge; by fictional poster Stone; dated 2 March 2058.","self_description":"Stone identifies with the ghouls of Chicago, describes being confined behind the Wall, and rejects the portrayal of that population as uniformly monstrous. The writer contrasts personal experience of neighbors' suffering with wider society's prejudice.","tamir_grey_and_advocacy":"Stone credits Tamir Grey with giving hope and organization to the Cabrini Refuge, pursuing contact with the Metahuman Rights Coalition and obtaining support for Special Order 162. Stone says this briefly established rights before subsequent legal action reversed them. These events are framed as Stone's first-person retrospective claims.","fate_and_protest":"Stone says Tamir Grey was killed, says Knight Errant withdrew protection when angry crowds gathered outside the refuge, and describes lethal harm to ghoul residents without specifically naming Strain-III as the cause in Stone's own account. Other speakers separately attribute some ghoul deaths to Strain-III and dispute whether Grey died; the speaker's accusations are not narrator-confirmed.","agency_and_rights":"The testimony presents ghouls as people affected by discrimination, legal exclusion, disease, corporate security decisions and violence, rather than voluntary participants in their confinement or suffering.","source_status":"The post is an attributed in-world ghoul-rights testimony, not a sourcebook omniscient account. Its claim of Grey's death is contested elsewhere in the same section.","provenance_note":"Source-image reviewed in FASA Corporation's Target: UCAS (FASA7214, ©1997), printed pp81–82/PDF82–83."},"headline":"Fictional Shadowrun tabletop-RPG reference — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 81-82/PDF 82-83: Cabrini Refuge: Stone's account of Tamir Grey and ghouls' legal status","summary":"Independently source-reviewed reference to fictional FASA Corporation, Target: UCAS (FASA7214, ©1997), historical Shadowrun Second Edition-era tabletop-RPG fiction, original printed pages 81-82 and PDF pages 82-83. Cabrini Refuge: Stone's account of Tamir Grey and ghouls' legal status. Distinct speaker claims, stated uncertainty, and source chronology are preserved.","framing":"newsroom_neutral"}