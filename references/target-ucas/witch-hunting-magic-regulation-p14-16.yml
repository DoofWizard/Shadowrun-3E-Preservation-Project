data:
  source_publication: 'FASA Corporation Target: UCAS (FASA7214, 1997), printed pp14–16/PDF15–17.'
  article: Witch Hunting
  speaker: MissTick, fictional in-world Shadowland commentator; this critique is a partisan voice, not a neutral sourcebook
    rule statement.
  historical_attitudes: MissTick traces anti-magic prejudice through the Ghost Dance, the Chicago insect-spirit disaster and
    Dunkelzahn’s death; describes public portrayals of magic users as threatening or deceitful.
  policy_claims: MissTick argues that President Haeffner’s proposed Magical Security Task Force and corporate/private policing
    could intensify registration, licensing and restriction of magic users, magical items, spirit summoning and magical work.
    These are fears and forecasts rather than verified new mechanics.
  security_companies: The writer names Lone Star and Knight Errant among private security corporations advocating tighter
    magical controls, and alleges enforcement creates financial incentives for fines and detention.
  detention_allegations:
  - MissTick alleges detained magicians may be forced into masks that suppress vision, speech or concentration; these are
    invented-world claims about deprivation of autonomy, not voluntary equipment use.
  - The writer describes purported neurological restraint devices, drugging and abusive experimental programs in detention
    as rumor and fearful report, not an official sourcebook statement that every detainee is treated this way.
  - MissTick warns these risks may increase for people who lack valid System Identification Numbers (SINs); this is in-world
    legal/social commentary, not an established legal procedure.
  related_shadowtalk:
  - speaker: Legal Beagle
    position: Says the conditions described offer reasons for magician defendants to fear justice or imprisonment; opinion.
  - speaker: anonymous@no.where.com
    position: Alleges some jailed magicians are offered coercive “public service” work under corporate guardianship, sometimes
      with physical-control devices; the apparent choice is constrained and not free consent. Also alleges unusual experiments
      concerning Department of Paranormal Investigation detainees; rumor only.
  characterization_boundary: Distinguish imagined-world reports, the journalist’s inference and anonymous allegations; no
    passage directs actual law enforcement or real-world medical practice.
headline: 'FICTIONAL Shadowrun tabletop-RPG archival record — MissTick’s in-world “Witch Hunting” account of UCAS anti-magic
  policies | Target: UCAS, FASA Corporation, FASA7214 (1997, Second Edition-era), printed pp14-16/PDF15-17'
summary: 'Historical fictional-world reference from Target: UCAS, FASA Corporation (FASA7214, 1997, Second Edition era), printed
  pp14-16/PDF15-17: MissTick critiques fictional 2058 magic registration and policing, describing alleged coercive detention,
  magemasks and security-corporation incentives, with separate Shadowtalk testimony.'
