data:
  section: Running in Boston — Sample Adventure Ideas — Salvage (spans printed pp89–90).
  missing_person_hook: A fictional corporate executive and spouse hire runners to
    investigate their daughter Jennifer Tynes, an MIT&T magical-program student. She
    is one of six people who disappeared after nighttime T rides during the prior
    few weeks. In-world authorities initially attribute the disappearances to street
    violence; investigators find no stated motive for Tynes to leave voluntarily.
  discovered_pattern: The fictional team may discover all six missing individuals
    were magically active. Investigation leads through the Catacombs, where community
    residents initially withhold information and some of Mama’s Boys arrange a meeting
    with Mama.
  mama_exchange: Mama, characterized as an elderly fixer, offers to identify Tynes’s
    location only in exchange for a future favor, and declines to disclose why she
    considers Tynes important. The story does not establish that Tynes consented to
    disappear or participate in the perpetrators’ plans.
  warehouse_and_perpetrators: Mama directs the team to a ruined warehouse in the Rox
    used by Tamanous organleggers. They are not responsible for the original abductions,
    according to the scenario. The kidnapper is Mako, a toxic Shark shaman who inhabits
    its top floor and has been capturing magically gifted people; the book describes
    a coercive ritual-sacrifice scheme based on Mako’s deluded belief that their blood
    will cleanse toxins in Boston Harbor.
  victim_and_remains: The outline says Tamanous uses the remains of Mako’s victims
    after the killings. This is an explicit fictional victimization and exploitation
    scenario; it is not consensual donation or neutral “services.” The book does not
    provide instructions for the harmful acts.
  conditional_rescue: If the runners reach the warehouse before the planned midnight
    killing, they may rescue Jennifer Tynes; they face Tamanous organleggers, ghoul
    allies and Mako’s toxic spirits. The outcome is deliberately contingent on play,
    not an event established as having occurred.
  provenance_note: 'FASA Corporation, Target: UCAS, FASA7214 (©1997), historical Shadowrun
    Second Edition-era fictional tabletop-RPG source; printed pp89–90/PDF90–91; fictional
    abduction, coercion and ritual harm are described only as scenario facts.'
