data:
  section: Running in Boston — Sample Adventure Ideas — Bloody Spirits.
  hook: The optional fictional scenario begins with nearly a month of reported ghosts
    around sites of the Bloody Thursday riots in Southie. A Dunkelzahn Institute of
    Magical Research researcher seeks protection while investigating the apparent
    hauntings.
  hidden_situation: A shaman connected with the fictional Warpath extremist group
    creates magical illusions to keep strangers away from a gun-smuggling operation.
    The story also includes an arms transaction between Warpath and the Boston Mafia.
    These details are scenario revelations, not real-world operational directions.
  complication: After the group encounters harmless illusory apparitions, an apparently
    harmless phantom explosion can disturb actual riot ghosts. The book describes
    genuine spirits as being aggravated by magical activity and by a researcher’s
    investigation, with their psychokinetic abilities referenced to Shadowrun Second
    Edition p224. The resulting conflict may endanger the player characters and the
    fictional meeting parties.
  gm_contingencies: Whether the runners uncover the arms deal, survive the spirits
    and protect the researcher is conditional on play; the adventure outline does
    not establish an inevitable outcome.
  provenance_note: 'FASA Corporation, Target: UCAS, FASA7214 (©1997), historical fictional
    Shadowrun Second Edition-era RPG; printed p89/PDF90. Original uses an optional
    GM scenario format.'
