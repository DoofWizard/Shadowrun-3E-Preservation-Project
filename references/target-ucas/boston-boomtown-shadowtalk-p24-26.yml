  article: Boston — early corporate history and Crash-era attributed remarks
  status: These are named fictional Shadowtalk statements and rumors; they are not necessarily independently established
    by the narrator.
  chromed_accountant: Chromed Accountant argues Boston won ECSE relocation by offering major concessions, and claims the
    civic leaders were in crisis and promised the corporations almost anything for recovery.
  pirate: Pirate says rumors of ECSE relocating back to New York circulate but doubts a move because its cost would be immense;
    the statement is a prediction, not a scheduled relocation.
  son_of_liberty: Son of Liberty describes politicians accommodating corporate demands for revenue at the cost of worker-safety
    and equal-opportunity safeguards. This is the poster’s critical characterization.
  cyberman: Cyberman remarks that Matrix Systems of Boston became associated with the new cyberterminal market but later
    crashed in prominence; the post is a retrospective perspective.
  ben_hur: Ben-Hur repeats rumors that former Echo Mirage members entered the high-technology private sector and became
    wealthy developing cyberdeck technology. The association is explicitly rumor rather than a verified roster.
