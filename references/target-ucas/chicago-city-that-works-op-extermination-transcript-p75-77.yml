{"id":"reference.target_ucas.chicago.operation_extermination_transcript_p75_77","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"75-77","pdf_pages":"76-78","edition_scope":"Historical fictional Shadowrun tabletop-RPG sourcebook: FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era context; no inferred Third Edition mechanics.","content_class":["narrative_context"],"data":{"section":"Chicago: The City That Works! Operation Extermination in-world BBS transcript","editorial_source":"Captain Chaos introduces a selection of Chicago residents' postings, originally dated 22 February 2058 and lasting about eight hours, intended to present conflicting views of Ares' Operation Extermination. The selected transcript was forwarded to Shadowland on 1 April 2058 at 11:21:14 EST. The forum format and source edition matter: these are attributed fictional eyewitness accounts rather than verified battlefield chronology or player-facing tactics.","initial_observations":"Domino reports a landing near Oak Street Beach. Domino and Elroy describe personnel, helicopters, trucks and large tank vehicles with Knight Errant insignia, while participants disagree initially over the equipment and mission. Callahan fears another Knight Errant action; Tran hopes the corporation is finally addressing the insects. Domino and Elroy describe chemical protective suits, not radiation suits.","approach_to_buildings":"Domino sees teams dispersing into Chicago and vehicle formations moving along separate routes. Bernie says one team sprays fluid from a tanker onto an abandoned warehouse while armed personnel prepare outside. Max reports a similar discharge into a sewer. Max, relaying observations from mage acquaintance Valere, says the material appears to be unfiltered lake water with an unusual astral effect and may repel insect spirits. This is Valere's reported impression through Max, not an asserted chemical formulation or usable instruction.","conflict_reports":"Bernie reports insects emerging after a warehouse breach and then claims to see a large queen attacking the tanker. Later, Bernie describes helicopter intervention and reports the queen's destruction. Sleeper reports Yellowjacket helicopters fighting wasp spirits near Grant Park. Max says Valere observed an astral haze adhering to some of the creatures, and that despite substantial casualties among Knight Errant teams, the reported effect appeared to weaken the insects.","ending_and_caveats":"The collected dialogue ends with repeated END TRANSMISSION markers. The source does not give an independently verified casualty count, definitive eradication statement, or tabletop combat test, damage or target-number mechanic on these pages.","source_review_status":"Independently read original page images of FASA Corporation Target: UCAS (FASA7214; 1997), Second Edition-era fictional tabletop-RPG source; attributed claims are not real-world reporting."},"headline":"Fictional Shadowrun tabletop-RPG reference — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 75-77/PDF 76-78: Chicago: The City That Works! Operation Extermination in-world BBS transcript","summary":"Independently source-reviewed fictional tabletop-RPG publication context from FASA Corporation Target: UCAS (FASA7214, 1997; Second Edition-era), printed 75-77/PDF 76-78. Source-attributed Chicago eyewitness forum sequence describing Operation Extermination without reclassifying reports as verified mechanics.","framing":"newsroom_neutral"}
