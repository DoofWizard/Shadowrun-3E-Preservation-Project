data:
  section: Game Information — Running in Detroit, Local Color
  source_context: 'Original FASA Corporation Target: UCAS (FASA7214, ©1997), fictional Shadowrun Second Edition-era
    tabletop RPG, printed pp90-91/PDF pp91-92.'
  source_substance:
    scope: Optional game-master suggestions for fictional Detroit. These examples are prompts, not assertions
      that specific incidents must occur.
    aresville: 'Ares Macrotechnology headquarters culture permeates Detroit: Ares advertising, branded clothing,
      cars and Trideo programming give a campaign its local identity.'
    automobiles: Ford and GM cars dominate; the source suggests anti-foreign-car sentiments and possible fictional
      vandalism against characters driving foreign vehicles.
    people_mover: The downtown People Mover subway provides transport and possible settings for encounters,
      pursuit, or a fictional politically motivated extremist encounter; no particular attack is established
      as canon.
    chicago_refugees: The city has many Chicago refugees, and attitudes range from sympathy to hostility; games
      may portray differing treatment without endorsing prejudice.
    east_west: Locals refer to the East Side and West Side as navigation shorthand.
    landmarks: Greektown restaurants, the Theatre District, Opera House, sports arenas, Knight Plaza, and Ares
      headquarters are suggested encounter backdrops.
    underworld: Detroit Mafia is relatively powerful but must avoid Knight Errant surveillance. The Yakuza
      is scarcely present amid anti-Japanese sentiment. Seoulpa Rings and Triads are not as prominent as in
      Seattle; Detroit gangs and the Blight have differing street cultures including drag racers.
    numeric_rules: No novel TN, action economy, or equipment statistic is supplied in this local-color section.
