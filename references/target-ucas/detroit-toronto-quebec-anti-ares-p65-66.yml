{"id":"reference.target_ucas.detroit_toronto_quebec_anti_ares_p65_66","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Historical Second Edition-era Shadowrun fictional tabletop-RPG sourcebook; no assumed Third Edition mechanics"},"printed_pages":"65-66","pdf_pages":"66-67","edition_scope":"Historical fictional Shadowrun Second Edition-era setting, FASA Corporation Target: UCAS (FASA7214, 1997); no inferred Third Edition conversions.","content_class":["attributed_claim"],"data":{"section":"Detroit / Opportunities / Toronto–Québec Front and Anti-Ares Factions","toronto_quebec":"The narrator speculates that Damien Knight uses Ares resources to support separatist groups such as the True Canadians, including diverted corporate equipment and occasional specialist assistance, in actions around Toronto and Québec City. It does not establish Knight’s ultimate purpose. The guide also mentions allegations of attacks on transport suppliers and intelligence-gathering by these groups, without providing verified specifics.","toronto_quebec_shadowtalk":[{"speaker":"Errant Knight","claim":"Guesses Knight seeks to obstruct Cross Corp activity in Québec, and emphasizes that the guess is uncertain.","status":"in-world theory"},{"speaker":"DeeTee","claim":"Says information about the alleged backing could attract interest from buyers.","status":"named commentary"}],"corporate_rivals":"The narrator lists Saeder-Krupp, Mitsuhama and Fuchi as large fictional rivals of Ares whose agents might sponsor investigative shadow work. It also mentions Aztechnology, rival factions, organized-crime syndicates, eco-terrorist groups and neo-anarchists as possible opponents. This paragraph is a survey of fictional adventure sponsors, not a recommendation for real-world wrongdoing.","other_comments":[{"speaker":"Pyramid Watcher","claim":"C