  article: Family of Nations — speaker-attributed Tir, California and Seattle Shadowtalk
  editorial_rule: These are claims by named fictional Shadowland posters, not independently established setting facts.
  spike: Spike speculates that Prince Daviar’s appointment as vice president alarms some High Princes and could represent
    a Tir political factional split; this remains speculation.
  granite: Granite reports opposition to Prince Ehran in Beantown after his arrival and says Lugh Surehand and allies may
    seek his removal from the Tir council. The report is attributed rather than promoted to a confirmed leadership change.
  q_bert: Q-bert describes fear and simmering conflicts among human, ork, elf, troll, and dwarf communities in the Northern
    Crescent; this is the speaker’s observation.
  mountainclimber: MountainClimber suggests Tir forces should consider Hestaby’s previous intervention when weighing California
    ambitions. This is commentary about a possible future push.
  redleaf: Redleaf alleges the Ancients carry Tir goods from Portland and other border cities into Seattle via informal
    markets, and that some of their gains reach the Princes. The financial allegation is not asserted as a narrator-confirmed
    transaction.
  goat_girl: Goat Girl disputes the prediction of an imminent Tir takeover of Seattle, arguing that an earlier move would
    have occurred if the Princes intended annexation and that an independent Seattle provides trade benefits.
headline: 'FICTIONAL Shadowrun tabletop-RPG source reference — Family of Nations — speaker-attributed Tir, California and
