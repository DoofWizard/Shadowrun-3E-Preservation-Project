data:
  section: Running in Boston — Sample Adventure Ideas — Rate of Exchange.
  setup: A fixer or “Mr. Johnson” hires the fictional runner team to steal confidential
    account information from broker Tom Meadows at the East Coast Stock Exchange (ECSE).
    Meadows lives in a secure Beacon Hill apartment building with Knight Errant patrols.
  concealed_interests: The fictional employer represents Richard Villiers’s Boston
    interests, seeking leverage for Villiers’s personal corporate expansion. Neither
    the team nor its employer initially knows Meadows has been supplying inside stock
    information for months to a local Yakuza oyabun and receives protection from Yakuza
    bodyguards.
  complication: If the team obtains the account information, Yakuza hit teams may
    subsequently target the runners before the data are delivered. The scenario offers
    a conditional route for surviving characters to report the Yakuza connection to
    Villiers’s representative.
  possible_followup: Villiers may offer assistance or further investigation into purported
    Yakuza links with Japanese Fuchi interests; the book presents that as a possible
    follow-up, not a guaranteed or narrator-established conspiracy.
  provenance_note: 'FASA Corporation, Target: UCAS, FASA7214, ©1997, fictional Shadowrun
    Second Edition-era tabletop-RPG source; printed p89/PDF90. All activities are
    optional in-world adventure beats.'
