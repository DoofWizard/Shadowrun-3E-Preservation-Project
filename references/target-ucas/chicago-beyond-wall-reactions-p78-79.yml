{"id":"reference.target_ucas.chicago.beyond_wall_reactions_p78_79","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"source_pdf_sha256":"dc016e418a24fad63d56fba4f2f7f657cb1c0d995cdabd648ba9c6109e33f8f8","printed_pages":"78-79","pdf_pages":"79-80","edition_scope":"FASA Corporation's 1997 Target: UCAS (FASA7214) is a historical Shadowrun Second Edition-era fictional tabletop-RPG sourcebook. No inferred Third Edition conversion.","content_class":["attributed_claim"],"data":{"section":"Chicago—Oblivion's End? / Beyond the Wall; sourcebook Shadowtalk comments on the embedded corporal report.","skeptic_and_hobbes":"Skeptic asks whether the insect spirits are actually gone. Hobbes responds that President Haeffner would not have ended containment if serious danger remained, whether or not Ares or Knight Errant withdrew.","puck_and_yankee":"Puck questions Ares's abrupt withdrawal after investing in the campaign, especially without conclusive evidence that the insect spirits were eradicated. Yankee asserts that Knight cared mainly about his financial interests; this is an attributed suspicion, not a sourcebook-established motive.","birdwatcher_and_samm":"Birdwatcher counters that Knight has spent significant resources and may have another explanation. SamM claims Ares retained personnel and that Knight Errant personnel quietly helped suppress rioting; the alleged continuing presence is not verified by the account.","context_and_limits":"These voices are fictional Shadowtalk participants debating a reported operation, humanitarian treatment and corporate motives. Statements that Ares did or did not secretly retain troops are contradictory interpretations, not established facts.","provenance_note":"FASA Corporation, Target: UCAS (1997, FASA7214), printed pages 78–79/PDF 79–80; historical fictional Second Edition-era Shadowrun setting.","matador_yori_fiddler":"Yori alleges Detroit-based Ares could have a lakefront territorial or political ambition and speculates about Damien Knight dominating Chicago. Fiddler mocks the geographic premise, while Matador speculates that Knight's local relationships might facilitate any deployment. Keep the theories and rebuttals attributed rather than merged into a single account."},"headline":"Fictional Shadowrun tabletop-RPG reference — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 78-79/PDF 79-80: Beyond the Wall: disputed Ares motives, containment, and refugee claims","summary":"Independently source-reviewed reference to fictional FASA Corporation, Target: UCAS (FASA7214, ©1997), historical Shadowrun Second Edition-era tabletop-RPG fiction, original printed pages 78-79 and PDF pages 79-80. Beyond the Wall: disputed Ares motives, containment, and refugee claims. Distinct speaker claims, stated uncertainty, and source chronology are preserved.","framing":"newsroom_neutral"}