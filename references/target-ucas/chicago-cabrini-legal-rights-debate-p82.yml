{"id":"reference.target_ucas.chicago.cabrini_legal_rights_debate_p82","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"source_pdf_sha256":"dc016e418a24fad63d56fba4f2f7f657cb1c0d995cdabd648ba9c6109e33f8f8","printed_pages":"82","pdf_pages":"83","edition_scope":"FASA Corporation's 1997 Target: UCAS (FASA7214) is a historical Shadowrun Second Edition-era fictional tabletop-RPG sourcebook. No inferred Third Edition conversion.","content_class":["attributed_claim"],"data":{"section":"Chicago—Oblivion's End? / Cabrini Refuge discussion continuing on printed page 82.","emilio_reilly":"Emilio initially disparages Stone's essay. Reilly says Strain-III devastated part of Chicago's ghoul population as well as insect spirits and asserts GhoulTown became a ghost town, attributing a new militant Ghoul Liberation League as a reaction. These statements represent one fictional poster's assertions.","samm_nocode":"SamM claims the Metahuman Rights Coalition and an Empowerment Coalition support the ghoul community, while observing that ghoul legal recognition as metahumans is disputed. Nocode argues that a documented disease-based origin of ghoul transformation may improve their claim to rights, rather than an earlier belief that the condition was voluntary.","doc_scrivler_emilio":"Doc rejects a comparison with VITAS-3 illness, arguing that ghouls eat metahuman flesh. Scrivler answers that ghouls generally do not attack people to eat them and asserts that they need about one percent of body weight in metahuman flesh per month; Scrivler also cites a fictional Dunkelzahn-will payment promised for the first successful synthetic substitute and reports improving support after Tamir Grey's diaries. Emilio remains derisive. Each characterization and numerical dietary claim is attributed to the named fictional commentator, not adopted as verified real physiology.","spider_reilly_naysayer":"Spider alleges Tamir Grey survived and escaped after Ares had taken him and other ghouls into custody shortly before Operation Extermination, claiming Grey later appeared in Wisconsin. Reilly asks whether such custody amounted to kidnapping, while Naysayer doubts the story and suggests Grey may still have died. The alleged detention was not described as voluntary and remains an uncorroborated in-world claim. No claim of medical testing is established by these posts.","certainty_and_subject":"The source is a contentious fictional debate about ghoul personhood, social exclusion, alleged detention, disease, and political activism. Preserve the distinction between Stone's reported death of Grey and Spider's incompatible survival claim; do not recast any involuntary detention as consent.","provenance_note":"FASA Corporation's historical Shadowrun Second Edition-era sourcebook Target: UCAS (FASA7214, 1997), printed p82/PDF83."},"headline":"Fictional Shadowrun tabletop-RPG reference — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 82/PDF 83: Cabrini Refuge: conflicting Shadowtalk on ghoul casualties, advocacy, and Tamir Grey","summary":"Independently source-reviewed reference to fictional FASA Corporation, Target: UCAS (FASA7214, ©1997), historical Shadowrun Second Edition-era tabletop-RPG fiction, original printed pages 82 and PDF pages 83. Cabrini Refuge: conflicting Shadowtalk on ghoul casualties, advocacy, and Tamir Grey. Distinct speaker claims, stated uncertainty, and source chronology are preserved.","framing":"newsroom_neutral"}