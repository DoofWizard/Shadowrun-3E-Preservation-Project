data:
  source_publication: 'FASA Corporation Target: UCAS (FASA7214, 1997), printed pp16–18/PDF17–19.'
  article: Bugged
  primary_speaker: RAID-22, a fictional in-world Shadowland contributor.
  primary_claims:
  - RAID-22 contends the UCAS public now acknowledges the existence of insect spirits, and says the Universal Brotherhood
    concealed and maintained them; the author links the Brotherhood and insect spirits to the death of General Franklin Yeats
    during the campaign.
  - RAID-22 disputes the government claim that Ares Operation Extermination eliminated the insect-spirit problem in Chicago,
    asserting survivors remain and that the corporation withdrew after a selective campaign.
  - The author fears insect spirits could adapt, spread beyond the containment zone, and use camouflage or infiltration; these
    are fictional speculations, not real-world infestation claims.
  - RAID-22 reports that federal Paranormal Affairs investigators and Knight Errant Firewatch teams may be investigating insect-spirit
    incidents beyond Chicago; the report explicitly relies partly on word-of-mouth.
  related_posts:
  - speaker: Clean Gene
    claim: Counters that mantis spirits killed Yeats because he had worked with other insects in Chicago, not necessarily
      the cause assumed by RAID-22; disputed attribution.
  - speaker: Skeptic
    claim: Questions whether any insect spirit could have evaded the magical security surrounding a candidate for president.
  - speaker: WizWorm
    claim: Reports that some insect spirits can conceal themselves from astral inspection and superficially appear ordinary.
  - speaker: Fro
    claim: Confirms concern about Ares withdrawing and notes the military was reportedly left protecting corporate and airport
      facilities rather than the entire containment wall.
  - speaker: Alone
    claim: Speculates Damien Knight may have prioritized corporate interests when withdrawing Ares teams.
  - speaker: Granite
    claim: Rejects treating Ares’s withdrawal as extraordinary, calling it normal corporate opportunism.
  - speaker: Argent
    claim: Speculates about broader corporate magical-security operations and the fictional state’s anti-insect policy.
  - speaker: D-Con
    claim: Ridicules claims that impoverished residents would freely seek insect-spirit possession; opinion.
  - speaker: Grenadier
    claim: Argues some people may seek belonging or power even under harmful and degrading conditions; a social speculation
      rather than a proven universal motive.
  - speaker: Atom Ant
    claim: Posts from an account suggesting insider insect identification, but neither the persona nor its fictional status
      is verified in-world.
  - speaker: Captain Chaos
    claim: States that the Atom Ant account was closed and operators are investigating it; he says he does not yet know whether
      its posts were made by an insect shaman, a possessed person or an impersonator.
  thread_transmission: Captain Chaos moderation entry dated 16 March 2058 at 19:37:39 EST; not the date of every preceding
    alleged incident.
  illustration: Printed p17/PDF18 depicts armed security figures facing an insect-like creature amid ruins; illustrative fiction,
    not a documented encounter.
  coercion_note: Some speakers describe voluntary affiliation claims, but the source also references insect-spirit possession
    and its harmful consequences; no single claim is treated as universal consent or agency.
headline: 'FICTIONAL Shadowrun tabletop-RPG archival record — RAID-22 and Shadowtalk dispute Chicago insect-spirit and Ares
  cleanup claims | Target: UCAS, FASA Corporation, FASA7214 (1997, Second Edition-era), printed pp16-18/PDF17-19'
summary: 'Historical fictional-world reference from Target: UCAS, FASA Corporation (FASA7214, 1997, Second Edition era), printed
  pp16-18/PDF17-19: Fictional “Bugged” forum claims distinguish RAID-22’s assertions about the Universal Brotherhood and Ares
  withdrawal from rival explanations for General Yeats’s death and unverified conspiracies.'
