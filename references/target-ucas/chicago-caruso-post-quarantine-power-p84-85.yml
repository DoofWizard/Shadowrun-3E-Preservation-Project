data:
  section: Shadows of Oblivion, signed by Caruso, posted 24 March 2058; printed pp84–85.
  narrator_and_date: The fictional first-person account is explicitly credited to
    “Caruso” and posted on 24 March 2058. Caruso says they have worked inside the
    Containment Zone as an enforcer since the Wall went up, and describes changes
    after President Dunkelzahn ended the quarantine. Its observations retain Caruso’s
    speaker identity, rather than becoming unattributed sourcebook facts.
  catherine: Caruso says Catherine “The Terrible” Cunningham consolidated roughly
    50 percent of Chicago during the two-year quarantine through access to sophisticated
    technology and a cadre of magicians who helped against insect spirits. Caruso
    says Operation Extermination shattered her hold as some lesser warlords moved
    into her territory; claims she is besieged and has become paranoid are explicitly
    described as rumor or observation, not a settled psychiatric diagnosis.
  tom_nishio: Caruso describes Tom Nishio as a recent Chicago arrival who exploited
    the lack of organized black markets. Nishio allegedly brought capital and armed
    associates, set up along Lake Shore Drive and uses lake-borne shipments both for
    conveniences and for protection against neighboring, geographically isolated warlords.
    Nishio’s profits and rivalry are described in the fictional criminal-political
    setting, not as recommended activity.
  marcus_quinn: Caruso describes Marcus Quinn as a lower-ranking Chicago Mafia lieutenant
    stranded when the Wall appeared. During two years he formed a local Mafia position;
    after the quarantine he re-established contact with the McCaskill family in Milwaukee,
    reported Zone operations, and is said to be in favorable standing as the family
    considers returning to Chicago. Promotion and who will run postquarantine Chicago
    remain unresolved predictions.
  king_vlad: Caruso identifies King Vlad as an ork ruler in the northwest Zone who,
    after the quarantine, increased raids against neighboring warlords and gangs and
    allegedly crossed the Wall to raid relief stations and warehouses. Caruso says
    Vlad’s raiders have largely avoided harming ordinary people outside the Zone while
    frightening them; Nishio monitors Vlad, but the source does not establish a later
    war between them.
  provenance_note: 'FASA Corporation, Target: UCAS (FASA7214, ©1997), historical Shadowrun
    Second Edition-era fictional tabletop-RPG source; printed pp84–85/PDF85–86. Caruso’s
    24 March 2058 account, rumors and forecasts are attributed separately.'
