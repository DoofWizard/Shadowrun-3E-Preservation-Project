{"id":"reference.target_ucas.chicago.insiders_forum_reactions_p79_81","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"source_pdf_sha256":"dc016e418a24fad63d56fba4f2f7f657cb1c0d995cdabd648ba9c6109e33f8f8","printed_pages":"79-81","pdf_pages":"80-82","edition_scope":"FASA Corporation's 1997 Target: UCAS (FASA7214) is a historical Shadowrun Second Edition-era fictional tabletop-RPG sourcebook. No inferred Third Edition conversion.","content_class":["attributed_claim"],"data":{"section":"Chicago—Oblivion's End? / Insiders and immediate closing forum comments.","alexis_naysayer_chaos":"Alexis reacts with surprise that Zoned seems to like life in the Zone. Naysayer suggests, without evidence, that the poster could be an insect spirit. Captain Chaos asks commenters to moderate the quarrel; the source displays a deleted hostile message attributed to SysOp moderation.","nocode":"Nocode says the Zone shelters squatters, gangs, shadowrunners, insect spirits and other groups exploiting residents, and argues that government and corporations are slow to recover abandoned property. This is the commenter's assessment.","machiavelli_kitt_sage":"Machiavelli admires residents' self-reliance, while Kitt stresses that gangs and warlords can make ordinary residents afraid to leave home and require protection. Sage notes the anxiety may not be irrational if real dangers remain.","hobbes_winger_tservo":"Hobbes argues the Zone has acquired its own social economy and values and that physical barrier removal cannot rapidly undo emotional isolation. Winger notes Governor Colucci might retain the Wall to restrict troublemakers despite changes outside. Tservo compares this with possible attitudes toward Seattle's Barrens.","editorial_limit":"The named remarks represent conflicting fictional viewpoints on exclusion, fear, local militia control and prospects for recovery; they are not a settled narrator account of the Zone or evidence that all residents share Zoned's views.","provenance_note":"Original image inspection, Target: UCAS (FASA7214, 1997), printed pages 79–81/PDF 80–82."},"headline":"Fictional Shadowrun tabletop-RPG reference — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 79-81/PDF 80-82: Insiders: Shadowtalk dispute over the Zone's residents and social barriers","summary":"Independently source-reviewed reference to fictional FASA Corporation, Target: UCAS (FASA7214, ©1997), historical Shadowrun Second Edition-era tabletop-RPG fiction, original printed pages 79-81 and PDF pages 80-82. Insiders: Shadowtalk dispute over the Zone's residents and social barriers. Distinct speaker claims, stated uncertainty, and source chronology are preserved.","framing":"newsroom_neutral"}