{"id":"reference.target_ucas.chicago.on_target_bbs_claims_p72_74","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"72-74","pdf_pages":"73-75","edition_scope":"Historical fictional Shadowrun tabletop-RPG sourcebook: FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era context; no inferred Third Edition mechanics.","content_class":["attributed_claim"],"data":{"section":"Chicago On Target: Shadowtalk reactions to containment abolition and astral-agent harm","authorization_reactions":"G-Man says Knight Errant launched independently before federal approval; Machiavelli discounts the authorization dispute as less important than clearing the insects. Redfoot speculates that the president subsequently sought a politically acceptable outcome. These are in-world commentators, not confirmed administrative findings.","containment_and_ghoul_reactions":"G-Man argues Ares left Haeffner little practical choice once the corporation withdrew its support, and Spike disputes the official claim that the containment area was clean. Tservo and Phantom question what happened to ghouls; Phantom highlights that dual-natured people and other astral inhabitants could be harmed and accuses Ares of solving one threat by exposing others. Luther and Doc respond with sharply dismissive remarks about the ghoul deaths. Preserve the disagreement and the identification of those affected rather than treating their deaths as an incidental unspecified side effect.","public_propaganda_dispute":"Skeptic suspects an Ares-owned television outlet might be presenting a propaganda interview. Iceman defends the presenter's independence, citing her prior exposure of the Biggs Investment Scandal. Birdwatcher says board member Arthur Vogel would likely object to the ecological consequences. Other posters debate the state's prior attitude toward Cabrini ghouls and whether some survived.","uncertainty_note":"No poster's allegation in this record should be promoted into an omniscient source fact, and the claims about deaths, contamination, consent and public safety must remain specifically attributed.","source_review_status":"Independently read original page images of FASA Corporation Target: UCAS (FASA7214; 1997), Second Edition-era fictional tabletop-RPG source; attributed claims are not real-world reporting."},"headline":"Fictional Shadowrun tabletop-RPG reference — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 72-74/PDF 73-75: Chicago On Target: Shadowtalk reactions to containment abolition and astral-agent harm","summary":"Independently source-reviewed fictional tabletop-RPG publication context from FASA Corporation Target: UCAS (FASA7214, 1997; Second Edition-era), printed 72-74/PDF 73-75. Named in-world Shadowtalk disagreements about Operation Extermination, federal approval, ghouls, ecological harm and media framing.","framing":"newsroom_neutral"}
