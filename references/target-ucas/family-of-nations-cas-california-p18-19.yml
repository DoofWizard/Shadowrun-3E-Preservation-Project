data:
  source_publication: 'FASA Corporation Target: UCAS (FASA7214, 1997), printed pp18–19/PDF19–20.'
  article: The Family of Nations
  byline: People Watcher, fictional in-world Shadowland commentator; contested relations are described from that writer’s
    perspective.
  context: The commentator portrays President Kyle Haeffner’s North American diplomatic initiative as contested, with prior
    UCAS treatment of NAN, the CAS and California affecting negotiations.
  cas:
    separation: The Confederate American States (CAS) split from the UCAS; the commentator likens their rivalry to a family
      quarrel and states that military/territorial division occurred without a shooting war.
    north_virginia: The UCAS established a North Virginia buffer north of Richmond near DeeCee after Virginia’s secession;
      the source says the new state became sympathetic to the CAS and its people considered leaving the UCAS.
    deecee_unrest: The writer describes unrest and military intervention in DeeCee after North Virginia tensions; alleged
      threats of CAS invasion did not materialize in this account.
    assassination_aftereffects: After Dunkelzahn died, some DeeCee rioters blamed CAS interests, but CAS authorities avoided
      threatening military moves; Vice President Ivory McCabe attended the memorial in Atlanta.
    aztlan: The writer links the CAS’s northern diplomacy to economic difficulty and Aztlan pressure on Texas; a two-front-war
      prediction is not an established war.
  california:
    status: The California Free State (CFS) remains separate from the UCAS; election-era proposals contemplated renewed ties,
      but this article records no reunification.
    diplomacy: The author says bilateral relations remain tense despite tentative outreach and CFS strategic distance from
      the NAN.
    economic_interests: Californian BTL trafficking, Japanese corporate interests and the San Francisco technology economy
      are described as points of conflict or incentives for integration.
    foreign_occupation: The Japanese Imperial Forces and corporate allies are described as holding San Francisco, with consequences
      for possible UCAS–CFS diplomatic rapprochement.
    border_divisions: Californians near Tir Tairngire and other border disputes often prefer outside powers to stay out; anti-Aztlan
      arguments differ among factions.
  shadowtalk_status: Warhawk, Pyramid Watcher, Bull, Bayside, Golden Bear and Polo give conflicting forecasts about Aztlan,
    the CAS and California; these opinions are not settled geopolitical outcomes.
headline: 'FICTIONAL Shadowrun tabletop-RPG archival record — People Watcher on fictional UCAS relations with the CAS and
  California Free State | Target: UCAS, FASA Corporation, FASA7214 (1997, Second Edition-era), printed pp18-19/PDF19-20'
summary: 'Historical fictional-world reference from Target: UCAS, FASA Corporation (FASA7214, 1997, Second Edition era), printed
  pp18-19/PDF19-20: The “Family of Nations” article describes an uneasy UCAS–CAS border, North Virginia, Aztlan pressures
  and contested California diplomacy, keeping Shadowtalk predictions separate.'
