data:
  source_publication: 'FASA Corporation Target: UCAS (FASA7214, 1997), printed pp13–14/PDF14–15.'
  article: Law and Order
  speaker: SPD (named fictional in-world Shadowland writer); adjacent Daikoku Shadowtalk is separate attribution.
  historical_claim: SPD describes most UCAS metroplex governments as outsourcing police functions to private-security companies
    following changes in public funding; the federal government, SPD says, seeks similar private partnerships.
  organizations: SPD cites security companies such as Lone Star as potential contractors to federal authorities in place of local
    police agencies, while the FBI remains a government agency.
  district_types:
    Z_zones: Underpoliced or lawless enclaves described as havens for people marginalized by the city; private security contractors
      allegedly contain rather than eradicate crime.
    A_zones: Affluent, heavily defended districts from which Z zones are kept apart.
    city_examples:
      Seattle: the Barrens
      Boston: the Rox
      Chicago: the CZ (Containment Zone)
      Los Angeles: El Infierno
  incentive_argument: SPD contends lowest-bid security contracts and commercial incentives may favor visible patrols around wealthy
    zones and containment of poorer districts rather than equal law enforcement.
  seattle_comparison: SPD contrasts a sparsely policed Redmond Barrens example with Renton, where Lone Star might stop someone
    using an obviously intimidating weapon, question them, and demand SIN identification; these are hypothetical in-world illustrations,
    not practical advice.
  underlying_risk: The columnist warns that privatized enforcement can increase danger and unequal treatment for inhabitants of
    neglected districts.
  illustration: Printed p14/PDF15 contains a black-and-white illustration of uniformed armed guards confronting a person with raised
    hands, paired with this article; illustrative fiction rather than a separately documented event.
  shadowtalk:
    speaker: Daikoku
    statement: Warns SINless runners they may receive fewer protections if arrested by private security, distinguishing this alarmist
      comment from formal law.
  certainty: The entire narrative is SPD’s critical in-world commentary, not an independently verified real-world policing analysis.
headline: 'FICTIONAL Shadowrun tabletop-RPG archival record — Fictional UCAS private-security “Law and Order” commentary on A and
  Z zones | Target: UCAS, FASA Corporation, FASA7214 (1997, Second Edition-era), printed pp13-14/PDF14-15'
summary: 'Fictional tabletop-RPG source: The in-world SPD columnist describes privately contracted policing, segregated security
  zones, Seattle Barrens and Renton examples, including attributed criticism of profit incentives. Published in Target: UCAS, FASA
  Corporation (FASA7214, 1997, Second Edition-era), printed pp13-14/PDF14-15.'
