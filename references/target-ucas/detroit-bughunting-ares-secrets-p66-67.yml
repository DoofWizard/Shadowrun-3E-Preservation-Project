{"id":"reference.target_ucas.detroit_bughunting_ares_secrets_p66_67","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Historical Second Edition-era Shadowrun fictional tabletop-RPG sourcebook; no assumed Third Edition mechanics"},"printed_pages":"66-67","pdf_pages":"67-68","edition_scope":"Historical fictional Shadowrun Second Edition-era setting, FASA Corporation Target: UCAS (FASA7214, 1997); no inferred Third Edition conversions.","content_class":["attributed_claim"],"data":{"section":"Detroit / Opportunities / Bughunting, Big Two and Ares Secrets","narrator_bughunting":"The guide narrates that Ares and Knight Errant continue to investigate insect spirits and remaining hives in Chicago and North America, with Firewatch teams having acted before formal UCAS acknowledgment of the threat. The narrator frames possible fictional investigative or protective engagements arising from this setting. It notes a distinction between official UCAS government operations and Ares’s own initiatives.","bughunting_discussion":[{"speaker":"Ork N. Mann","claim":"Suspects further insect-spirit clearing jobs will be discreet freelance contracts rather than formally acknowledged Ares employment.","status":"named expectation, not established hiring policy"},{"speaker":"Knocker","claim":"Argues that avoiding a direct conflict with insect spirits is prudent because other kinds of fictional work exist.","status":"named opinion"},{"speaker":"Raid","claim":"Describes bughunting as a public service even when income is available.","status":"named ethical opinion"}],"automakers":"The guide calls Ford and GM Detroit’s “Big Two” automakers and says they and rivals seek competitive information about vehicle and drone designs. The source also mentions Chrysler-Nissan, UCAS and CAS organizations, Mitsuhama and other corporations as potential interested parties in fictional job opportunities; it does not provide mechanical vehicle specifications.","secrets":"The narrator frames Ares’s internal fragmentation as a source of undisclosed information. Examples include competing explanations of Knight’s origins, Nicholas Aurelius’s death, Knight’s relationship with Nadja Daviar and Gavilan Ventures, and secret corporate research. None of the theories is established by this lead list.","rumors":[{"speaker":"Silver Skater","claim":"Alleges that a fictional Ares shuttle manifest listed unusual magical supplies headed to an orbital platform, based on a claimed Matrix encounter and a secondhand magical opinion.","status":"named unverified rumor"},{"speaker":"Regent","claim":"Questions how Ares learned of insect spirits and what Dunkelzahn may or may not have told Knight.","status":"named speculative question"},{"speaker":"Dr. Destiny","claim":"Speculates Dunkelzahn may have foreseen events and involved Knight’s Nanosecond Buyout in a broader design; no foresight is independently established.","status":"named hypothesis"},{"speaker":"Prime Runner","claim":"Says undisclosed Chicago operations or Ares laboratory data might interest other fictional participants; does not confirm any particular finding.","status":"named speculation"}],"source_separation":"All unusual magical and corporate allegations remain explicitly uncertain. No operational directions for accessing any real systems are provided."},"headline":"Fictional tabletop Shadowrun archival record, FASA Corporation Target: UCAS (FASA7214, 1997, Second Edition era), printed 66-67/PDF 67-68 — Detroit bughunting and Ares secrets: attributed leads","summary":"Source-reviewed fictional 2058-era in-world narrative and tabletop scenario material from Target: UCAS, FASA Corporation (FASA7214, 1997, Second Edition-era), printed 66-67/PDF 67-68. Narrator context, named allegations and optional examples remain distinct.","framing":"newsroom_neutral"}
