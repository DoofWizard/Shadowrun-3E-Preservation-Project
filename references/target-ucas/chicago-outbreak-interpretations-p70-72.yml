akers are fictional in-world BBS commentators within FASA Corporation's Target: UCAS, not contemporary sources giving real scientific or public-health assertions.","source_review_status":"Independently read original page images of FASA Corporation Target: UCAS (FASA7214; 1997), Second Edition-era fictional tabletop-RPG source; attributed claims are not real-world reporting."},"headline":"Fictional Shadowrun tabletop-RPG reference — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 70-72/PDF 71-73: Chicago Outbreak: contested speculative links to Strain-III","summary":"Independently source-reviewed fictional tabletop-RPG publication context from FASA Corporation Target: UCAS (FASA7214, 1997; Second Edition-era), printed 70-72/PDF 71-73. Attributed and mutually disputed Shadowtalk hypotheses about a fictional lab diary and Strain-III Beta.","framing":"newsroom_neutral"}
