  "data": {
    "source_context": "FASA Corporation's fictional Shadowrun tabletop RPG book Target: UCAS (FASA7214, 1997, historical Second Edition era), printed 102/PDF 103.",
    "scope": "All six descriptions are optional GM hooks under 'ADVENTURE IDEAS' in the printed fictional source; they describe possible campaigns, not already-established historical facts.",
    "ideas": [
      {
        "name": "Ghouls R Us",
        "principal_parties": "Hank Perry, a former Mitsuhama employee; Mitsuhama retrieval executives; ghoul survivors in Cabrini Refuge",
        "setup": "Perry spent a year hiding from insect spirits, accepted refuge, voluntarily allowed himself to be infected with HMHVV and became a ghoul with diminished personality. Mitsuhama executives unaware of this hire runners to retrieve him because his headware holds valuable research data; the runners must contend with the surviving community."
      },
      {
        "name": "Smoking Gun",
        "principal_parties": "Rasa Namyr, presented as Empowerment Coalition activist but secretly a mantis spirit; Ares; player characters; a mantis hive",
        "setup": "Rasa obtains a video allegedly showing Ares' early Strain-III tests on restrained ghoul subjects. Ares first attempts to buy her silence and then sends a recovery team. She asks runners to guard her; her concealed purpose is to get the recording to a mantis hive. Conflict is between source-attributed factions, and the subject's restraint and coercion must not be rewritten as voluntary."
      },
      {
        "name": "Two Masters",
        "principal_parties": "Dunkelzahn Institute of Magical Research (DIMR), BacteriTech (Ares subsidiary), disguised Aztechnology agent, Knight Errant",
        "setup": "The DIMR offers runners a supposedly easy inquiry into neutralizing Strain-III's astral damage, requiring a BacteriTech incursion. Their representative is secretly working for Aztechnology and seeks research on manipulating astral space; a second DIMR team and facility security complicate the mission."
      },
      {
        "name": "Give the People What They Want / King Vlad the Destroyer",
        "principal_parties": "King Vlad and Chicago civilians",
        "setup": "King Vlad contracts runners through a purported private-security firm to retrieve goods actually destined as relief shipments, intending to control food and supplies and increase his political leverage. A parallel version hires the runners to defend shipments from Vlad's raiders, preserving the choice of opposing roles."
      },
      {
        "name": "Scraping the Sky",
        "principal_parties": "Legend Industries, a company employee named Mr. Johnson, a free wasp spirit, player characters",
        "setup": "A high-rise whose upper floors once served as a wasp-spirit hive was abandoned two years earlier. Runners hired to retrieve a satellite-linkup communications module discover the late queen's death freed a powerful insect spirit that claims those floors."
      },
      {
        "name": "Truth Hurts",
        "principal_parties": "Laura and missing husband John Packwell",
        "setup": "Laura hires runners to search the former Zone, where John had gone missing after a last company shuttle. The scenario's stated resolution is evidence that he is dead; the team must decide how to report this truth while facing hazards and competing factions."
      }
    ],
    "provenance_note": "FASA Corporation, Target: UCAS (FASA7214, 1997), historical Second Edition-era fictional tabletop source, printed p102/PDF103; no real-world advice or factual allegations concerning real people."
