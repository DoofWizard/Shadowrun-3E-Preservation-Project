  article: Boston — recent-events and exchange-security attributed Shadowtalk
  attribution: The following are named claims by fictional in-world Shadowtalk posters, not narrator-verified or instructions
    for real security systems.
  mcgruff: McGruff describes households and companies hiring private security and independent contractors, a speaker’s characterization
    of Boston’s contracting environment.
  beantown_baby: Beantown Baby alleges Knight Errant has Boston’s civil-security contract, claims Boston fell into debt
    to the company after 2052 disorder and later riots, and speculates the award might shift to Lone Star or Eagle Security.
    This is explicitly a rumor, not a confirmed contract termination.
  dvr8: DV8 alleges some private security companies contract independent operators to harass rivals’ customers or stage
    tests of security as a deceptive marketing tactic. This allegation is preserved as an attributed claim, without operational
    instructions.
  dybbuk: Dybbuk alleges some companies stage security tests against their own clients without informing deployed personnel;
    this remains a fictional poster’s critical report.
  errant_knight: Errant Knight describes a past informal understanding among ECSE corporations, Knight Errant and Boston
    criminal organizations as now deteriorating, with more conflicts since Dunkelzahn’s assassination.
  marcher: Marcher speculates some people knew about Dunkelzahn’s assassination in advance; the poster gives no proof and
    the record does not adopt the assertion.
  keynesian_kid_red_wraith: The Keynesian Kid describes the exchange building’s gothic architecture. Red Wraith describes
    layered Matrix security and an “access dilemma”; this is fictional source commentary, not a precise game rule or practical
    intrusion procedure.
  unattributed_exchange_comment: Another Shadowtalk comment claims the exchange is exceptionally sensitive to attempts to
    interfere with its systems. This is a fictional general warning, not a verified technical vulnerability.
