data:
  document_kind: In-world speech transcript provided by Shadowland editor Captain Chaos, not an objective report of historical
    U.S. politics.
  source_speaker: UCAS President Kyle Haeffner (fictional elected official); portions marked as audience applause in the original.
  source_publication: 'FASA Corporation Target: UCAS (FASA7214, 1997), printed pp7–8/PDF8–9.'
  source_framing:
    editorial_by: Captain Chaos
    speech_month: February 2058
    shadowland_transmission: 5 April 2058 at 23:11:09 EST
    date_distinction: Shadowland transmission time is not the speech date.
  address:
    assassination: Haeffner calls President Dunkelzahn’s assassination a grievous national loss, promises to seek the killers and
      sustain the late president’s hopes; these are the president’s statements of intention.
    social_policy: He advocates reconciliation between metahuman groups and citizens, endorses his predecessor’s SIN Registration
      Program, and invites citizens to rebuild civic trust; a political appeal rather than a verified equality outcome.
    international_policy: He reports diplomatic engagement with the Confederate American States, Seattle, Native American Nations
      and California, and presents eventual North American cooperation as an aspiration, not an achieved union.
    chicago: He announces the end of Chicago’s containment-zone quarantine, citing his meeting with Ares CEO Damien Knight, military
      chiefs and the Illinois governor. Haeffner says Ares’s Operation Extermination has been completed and that military personnel
      may stand down; these are his public claims about events in the fictional setting.
    post_chicago_security: He thanks Ares for assistance in Chicago and proposes continued investigation into the death of Dunkelzahn.
    magic_security_task_force: Haeffner announces a Magical Security Task Force under the Justice Department and Attorney General
      Mira Pantorelli, to involve the FBI, Knight Errant, Lone Star, the Dunkelzahn Institute of Magical Research, Tir Tairngire,
      Native American Nations and universities; its announced mission includes paranormal, astral and magical defenses.
    economic_policy: He attributes economic recovery to collaboration with the Corporate Council, businesses and Vice President
      Nadja Daviar and pledges further cooperation; the claim is presidential messaging.
    armed_forces: He praises military border defense and Chicago perimeter/rescue operations.
    civic_appeal: He asks residents to participate in rebuilding the UCAS and register with the government.
  certainty: This record reports a speech and promises, not independent verification that every announced action succeeded.
headline: 'FICTIONAL Shadowrun tabletop-RPG archival record — President Kyle Haeffner’s fictional 2058 UCAS State of the Union
  transcript | Target: UCAS, FASA Corporation, FASA7214 (1997, Second Edition-era), printed pp7-8/PDF8-9'
summary: 'Fictional tabletop-RPG source: Captain Chaos reproduces Haeffner’s February 2058 speech, transmitted on Shadowland 5
  April 2058: presidential claims about Dunkelzahn, Chicago, diplomacy, security and economic policy. Published in Target: UCAS,
  FASA Corporation (FASA7214, 1997, Second Edition-era), printed pp7-8/PDF8-9.'
