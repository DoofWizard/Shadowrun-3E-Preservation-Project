{"id":"reference.target_ucas.chicago.insiders_zoned_account_p79_80","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"source_pdf_sha256":"dc016e418a24fad63d56fba4f2f7f657cb1c0d995cdabd648ba9c6109e33f8f8","printed_pages":"79-80","pdf_pages":"80-81","edition_scope":"FASA Corporation's 1997 Target: UCAS (FASA7214) is a historical Shadowrun Second Edition-era fictional tabletop-RPG sourcebook. No inferred Third Edition conversion.","content_class":["narrative_context"],"data":{"section":"Chicago—Oblivion's End? / Insiders; by fictional poster Zoned, dated 1 March 2058.","grievance":"Zoned denounces celebratory claims that Ares 'rescued' Chicago, rhetorically threatens to throttle people thanking Ares, and blames Knight Errant, government containment, an Ares nuclear action, and abandonment of residents for two years. The post depicts Zone residents as living through institutional disregard; these are Zoned's in-world accusations and anger.","self_rule_and_outsiders":"Zoned says outsiders view inhabitants as criminals, desperate people, or insect spirits in disguise, and proposes leaving the Zone to residents who have survived it. This is explicitly a bitter, exclusionary stance by a character rather than an editorial endorsement.","later_followup":"On printed page 80, Zoned proposes that the strongest residents remain and says a group called the Howlers occupied an old Army watchtower, obtained heavy weaponry from Knight Errant sources while hunting bugs, and asserted local turf control. The post demands that other people stay clear; this is an account of armed turf control, not a general rule.","illustration":"Printed page 80/PDF81 includes a large black-and-white scene of several armed figures in the ruins near a large fractured wall or opening, amidst rubble. The art does not establish named identities for the illustrated figures.","speaker_and_publication":"Both the opening polemic and later Howlers account are posted by Zoned in the fictional Shadowtalk sourcebook; they are not narrator-confirmed or real-world political reporting.","provenance_note":"Original image inspection of FASA Corporation's Target: UCAS, printed pages 79–80/PDF 80–81."},"headline":"Fictional Shadowrun tabletop-RPG reference — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 79-80/PDF 80-81: Insiders: Zoned's account of defiant CZ self-rule","summary":"Independently source-reviewed reference to fictional FASA Corporation, Target: UCAS (FASA7214, ©1997), historical Shadowrun Second Edition-era tabletop-RPG fiction, original printed pages 79-80 and PDF pages 80-81. Insiders: Zoned's account of defiant CZ self-rule. Distinct speaker claims, stated uncertainty, and source chronology are preserved.","framing":"newsroom_neutral"}