data:
  section: Comments accompanying Caruso’s “Shadows of Oblivion” fictional post.
  cog_and_quasar: Cog alleges Catherine Cunningham was in league with insect spirits
    and that her fall proves it. Quasar responds that her possession of magic and
    operational success does not prove a conspiracy and challenges an escalating insinuation
    about Ares and the government. No alliance with insect spirits is established
    by the book in this exchange.
  lone_gunman: Lone Gunman asserts that authorities cannot hide the truth indefinitely,
    without providing new evidence.
  duckie: Duckie claims Nishio formerly competed in sumo wrestling and at one point
    approached 250 kilograms; Duckie adds hearsay that Nishio has since lost weight.
    These are poster-sourced biographical claims, not established medical facts.
  johnny_the_bug: Johnny the Bug uses a gangland prediction to argue that a Mafia
    figure, Don Roland “The Greek” Stephanopoulos of Detroit, may oppose Marcus Quinn’s
    interests in postquarantine Chicago. Johnny’s response to a misunderstanding clarifies
    his nickname’s use of “bug” is figurative; the supposed intervention is a prediction,
    not a recorded event.
  naysayer_and_sage: Naysayer describes continued insect spirits, gangs, warlords
    and ghouls in the Zone and characterizes remaining life as dangerous despite reopening;
    Sage replies with the recurring enigmatic line “Knows all, but tells less.”
  provenance_note: 'FASA Corporation, Target: UCAS, FASA7214, 1997, Shadowrun Second
    Edition-era fictional source; printed p85/PDF86; claims retain specific imaginary
    speaker attribution and uncertainty.'
