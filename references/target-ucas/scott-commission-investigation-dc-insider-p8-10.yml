data:
  source_publication: 'FASA Corporation Target: UCAS (FASA7214, 1997), printed pp8–10/PDF9–11.'
  article: The Scott Commission
  byline: DC Insider, fictional Shadowland in-world commentator
  scope: The Congressional Scott Commission examines President Dunkelzahn’s assassination in the UCAS fictional timeline, while
    the FBI performs most field investigative work.
  reported_early_clearances:
    people:
    - then–Vice President Kyle Haeffner
    - Vice President-apparent Nadja Daviar
    account: DC Insider says they testified, answered questions and convinced the commission that they lacked knowledge or involvement
      in the assassination; the text reports that outcome, not proof about all possible conduct.
  investigation_process: DC Insider reports the commission receives reports and evaluates evidence, while FBI agents interview
    leads; investigators have questioned leaders of at least a dozen political and underground organizations, with no clear evidence
    that those people caused the explosion.
  tips: The commission also considers many tips from members of the public claiming responsibility; DC Insider characterizes most
    as obvious false claims.
  public_expectations: According to DC Insider, the public often expects the commission to identify and punish the killer. The
    article says it is a legislative investigating committee tasked with confirming Haeffner and Daviar and reporting to Congress
    and the public, not an executive or judicial body.
  unconfirmed_rumor: DC Insider describes rumors, not confirmed events, that FBI investigators detained human-form insect spirits
    and suspect involvement in Dunkelzahn’s death; the FBI Thaumaturgy Division is described as researching insect spirits and
    insect shamans.
  historical_relation: Published as an in-world viewpoint in a fictional 2058 tabletop setting, not a claim about a real modern
    commission.
headline: 'FICTIONAL Shadowrun tabletop-RPG archival record — DC Insider’s account of the fictional Scott Commission and Dunkelzahn
  assassination inquiry | Target: UCAS, FASA Corporation, FASA7214 (1997, Second Edition-era), printed pp8-10/PDF9-11'
summary: 'Fictional tabletop-RPG source: DC Insider distinguishes a legislative commission from the FBI’s criminal investigation
  and describes testimony, surveillance and several unconfirmed lines of inquiry. Published in Target: UCAS, FASA Corporation (FASA7214,
  1997, Second Edition-era), printed pp8-10/PDF9-11.'
