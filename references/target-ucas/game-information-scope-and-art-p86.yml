data:
  section: GAME INFORMATION — introductory page for the Boston, Detroit and Chicago
    GM sections.
  publisher_guidance: The fictional tabletop sourcebook states that Boston and Detroit
    each receive Facts at a Glance, Getting In/Out, Cost of Living, local-color material
    and sample adventure ideas. These are presented as game-master resources describing
    fictional demographics, transport and costs, not real-world travel information.
  chicago_qualification: Because Chicago’s Containment Zone has been quarantined for
    the preceding two years, the book says ordinary population, transport and cost-of-living
    listings do not apply there. The separate Bug City sourcebook remains broadly
    usable for the fiction, supplemented here by considerations about Strain-III bacteria,
    free insect spirits and astral “Voids.”
  visual_reference: The printed p86 chapter opener includes a large black-and-white
    boxed illustration of three stylized figures with cyberpunk attire or modifications
    against a graffiti-covered subway setting. The source does not name the figures;
    no identities are assigned by this visual index.
  provenance_note: 'FASA Corporation, Target: UCAS (FASA7214, ©1997), historical Shadowrun
    Second Edition-era fictional tabletop-RPG source; printed p86/PDF87, including
    the actual illustration.'
