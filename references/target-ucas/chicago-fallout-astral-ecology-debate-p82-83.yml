{"id":"reference.target_ucas.chicago.fallout_astral_ecology_debate_p82_83","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"source_pdf_sha256":"dc016e418a24fad63d56fba4f2f7f657cb1c0d995cdabd648ba9c6109e33f8f8","printed_pages":"82-83","pdf_pages":"83-84","edition_scope":"FASA Corporation's 1997 Target: UCAS (FASA7214) is a historical Shadowrun Second Edition-era fictional tabletop-RPG sourcebook. No inferred Third Edition conversion.","content_class":["attributed_claim"],"data":{"section":"Chicago—Oblivion's End? / Fallout; posted 17 March 2058; transmitted by Captain Chaos on 1 April 2058 at 13:10:44 EST.","article_provenance":"Captain Chaos says the excerpt came from a University of Chicago student paper, first circulated on the fictional MagicNet and later included in the Shadowland document. The student author is unnamed; the argument is source-attributed rather than established laboratory or magical fact.","accusations":"The student condemns insect spirits, government quarantine, an Ares nuclear detonation, and an alleged Ares astral infection called Strain-III. The student argues corporate actions put the magical ecology of Chicago at risk without adequate concern for collateral effects.","ecological_concerns":"The paper claims the astral infection attacks magical beings, including spirits and elementals, and may destabilize Chicago's astral environment. It alleges that an expected decline in viability has not occurred after about two weeks and claims samples of the fictional infection still appear potent, suggesting a continuing background-count energy source.","forum_dispute":"Dori mocks the student's position. Scarecrow asks whether background count was neglected, Lone Gunman questions whether the omission was intentional, and Kitt wonders whether background-count depletion might eventually end the effect. Ivo asks where such energy would originate; Professor J answers that sustained strong emotion and trauma can replenish background count, while metaplanar energy may offer other possibilities. These are in-world magical explanations, not physical science.","illustration":"The right side of printed page 83/PDF84 shows a monochrome illustrated figure raising both hands beneath a swirling vortex with small suspended objects; it does not name or statistically define the figure.","source_limit":"Neither the student allegation that Strain-III continues indefinitely nor the forum theories of feeding and magical energy are verified independently by this fiction source. The discussion contains no new complete game-mechanics block.","provenance_note":"FASA Corporation, Target: UCAS (1997), source FASA7214, printed 82–83/PDF 83–84; historical Second Edition-era fictional sourcebook."},"headline":"Fictional Shadowrun tabletop-RPG reference — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 82-83/PDF 83-84: Fallout: University of Chicago student paper and debate on astral ecology","summary":"Independently source-reviewed reference to fictional FASA Corporation, Target: UCAS (FASA7214, ©1997), historical Shadowrun Second Edition-era tabletop-RPG fiction, original printed pages 82-83 and PDF pages 83-84. Fallout: University of Chicago student paper and debate on astral ecology. Distinct speaker claims, stated uncertainty, and source chronology are preserved.","framing":"newsroom_neutral"}