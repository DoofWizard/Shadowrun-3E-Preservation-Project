{"id":"reference.target_ucas.chicago.on_target_kirkpatrick_simmons_p72_74","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"72-74","pdf_pages":"73-75","edition_scope":"Historical fictional Shadowrun tabletop-RPG sourcebook: FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era context; no inferred Third Edition mechanics.","content_class":["narrative_context"],"data":{"section":"Chicago On Target broadcast transcript: competing official and advocate accounts","program_setup":"Captain Chaos republishes an in-world television transcript attributed to Holly Kazinsky's On Target program, transmitted to Shadowland on 1 April 2058 at 06:15:03 EST. The presenter interviews Commander Andrew Kirkpatrick of Knight Errant Security and Savannah Simmons of the Empowerment Coalition after President Haeffner announced the Chicago Containment Zone would be abolished. The presenter describes the Zone as lasting nearly two and a half years.","operation_authorization":"Kirkpatrick calls Operation Extermination a joint operation between UCAS Armed Forces personnel and specially trained Knight Errant strike teams. He says the purpose was clearing insect spirits from Chicago with technological and magical support, claiming federal authorization after evaluating risks. Simmons challenges the fairness and consequences of the Ares/government intervention. Shadowtalk poster G-Man later alleges Knight Errant acted without advance federal approval; the account does not adjudicate that dispute.","effectiveness_dispute":"Kirkpatrick says pre-operation projections estimated Strain-III Beta would be 95 percent effective, and preliminary field reports supported that estimate. He says Damien Knight recommended ending the cordon because it no longer threatened people outside. These percentages and assurances are claims in the broadcast, not independently confirmed game rules.","strain_description":"Kirkpatrick describes the fictional Strain-III Beta as an Ares/BacteriTech Fat Bacteria continuation, an astral entity that attaches to insect spirits and drains their magical energy, facilitating conventional assault. Simmons counters that it is not selective and can affect dual-natured and astrally active beings besides insect spirits; she specifically cites the ghoul population of Cabrini Refuge. Kirkpatrick concedes casualties and disputes her framing of the operation.","ecological_and_future_risk":"Simmons raises possible harm to allied or free spirits, paranatural wildlife, Lake Michigan elementals and Chicago ghouls, calling the intervention an ecological disaster. Kirkpatrick claims mundane residents face no danger, magicians can avoid astral perception/projection, and the agent would become dormant after it lost access to astrally active hosts, projecting clearing within weeks. The source presents these as contested character assertions rather than a scientific or mechanical specification.","broadcast_close":"Holly concludes by announcing further examination of the Empowerment Coalition and the metahuman rights movement, rather than resolving the disagreement.","source_review_status":"Independently read original page images of FASA Corporation Target: UCAS (FASA7214; 1997), Second Edition-era fictional tabletop-RPG source; attributed claims are not real-world reporting."},"headline":"Fictional Shadowrun tabletop-RPG reference — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 72-74/PDF 73-75: Chicago On Target broadcast transcript: competing official and advocate accounts","summary":"Independently source-reviewed fictional tabletop-RPG publication context from FASA Corporation Target: UCAS (FASA7214, 1997; Second Edition-era), printed 72-74/PDF 73-75. Attributed TV interview with Commander Kirkpatrick and Savannah Simmons, preserving claims, counterclaims, casualties, and projected efficacy.","framing":"newsroom_neutral"}
