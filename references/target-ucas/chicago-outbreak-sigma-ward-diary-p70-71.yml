{"id":"reference.target_ucas.chicago.outbreak_sigma_ward_diary_p70_71","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"70-71","pdf_pages":"71-72","edition_scope":"Historical fictional Shadowrun tabletop-RPG sourcebook: FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era context; no inferred Third Edition mechanics.","content_class":["narrative_context"],"data":{"section":"Chicago Outbreak: in-world diary dated 4 February 2058 and follow-up","diary_provenance":"The publication embeds a first-person journal entry dated 4 February 2058 at 22:43:12, introduced by fictional Shadowtalk poster Widow as an unusually classified file encountered by a friend during a data theft. It is an in-world account, not a book-narrator declaration that these events occurred independently of the account.","initial_event":"The unnamed security-rigger narrator reports that all the paranormal animal specimens in a laboratory Sigma Ward apparently died within roughly an hour while the narrator was monitoring security. No alarm or conspicuous intruder was seen. A female mage investigator interrogated the narrator and requested the security camera recordings for the preceding twelve hours.","security_review":"The investigator had the narrator replay footage recorded three hours before the anomaly. She asked about a still image of a black annis that seemed asleep in its cage at midnight. The rigger explained that the creature was nocturnal, but thermographic measurements shown at her request were about ten degrees above its normal temperature. At her further direction, readings for the other animals were also above their ordinary levels.","laboratory_follow_up":"The diary narrator says the specimens had been removed for autopsy. When the investigator entered the emptied ward, she visibly reacted and then called someone addressed as Tashkey, asking for a cleanup team and checks of the seals on the beta canisters. She described a possible cause of their problem and suggested the event might reveal results of a preliminary field test. None of those phone remarks is confirmed by narrator omniscience.","account_reliability":"The diary is relayed through Widow and the anonymous rigger and may reflect the participants' limited understanding or a deliberately planted file. Avoid treating a single account of a laboratory event as an authoritatively demonstrated cause of later Chicago events.","source_review_status":"Independently read original page images of FASA Corporation Target: UCAS (FASA7214; 1997), Second Edition-era fictional tabletop-RPG source; attributed claims are not real-world reporting."},"headline":"Fictional Shadowrun tabletop-RPG reference — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 70-71/PDF 71-72: Chicago Outbreak: in-world diary dated 4 February 2058 and follow-up","summary":"Independently source-reviewed fictional tabletop-RPG publication context from FASA Corporation Target: UCAS (FASA7214, 1997; Second Edition-era), printed 70-71/PDF 71-72. Source-presented first-person Sigma Ward diary and attributed uncertain beta-canister context, printed pp70–71/PDF71–72.","framing":"newsroom_neutral"}
