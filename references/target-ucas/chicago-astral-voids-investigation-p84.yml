data:
  section: Chicago—Oblivion’s End?; closing in-world report on astral Voids.
  reported_phenomenon: The fictional source report says magicians noticed dangerous
    astral “Voids” following Operation Extermination in Chicago’s Containment Zone.
    It characterizes them as near-lifeless, unusually dim regions of astral space
    that appear and disappear without an identified pattern, rather than as ordinary
    locales with background-count modifiers.
  hypothesized_cause: The report proposes that Strain-III depleted astral energy more
    severely than ordinary spellcasting and summoning, weakening the astral fabric
    faster than the metaplanes could replenish it. This causal explanation is presented
    as in-world analysis, not demonstrated real-world physics or an independently
    proven mechanic.
  risk_and_uncertainty: The report says shock and mental trauma have been reported
    by magicians encountering a Void, but explicitly says no deaths had been attributed
    to Voids as far as the reporter then knew. It warns that uncontrolled spread might
    threaten astral space beyond Chicago; that larger consequence is a speculative
    warning, not an established future outcome.
  university_response: The article reports that the University of Chicago thaumaturgy
    faculty recommended a governor-issued official warning, issued its own local warning,
    and joined researchers from nearby universities in studying the Voids. Dr. Howard
    Tierney, identified as an initiated hermetic magician and department chair, describes
    the study as seeking the Voids’ locations and cause so authorities can advise
    astral travelers.
  provenance_note: 'FASA Corporation, Target: UCAS, FASA7214 (©1997), historical Shadowrun
    Second Edition-era fictional tabletop-RPG sourcebook; printed p84/physical PDF85.
    All theories and warnings are reported as fictional in-world statements.'
