data:
  source_publication: 'FASA Corporation Target: UCAS (FASA7214, 1997), printed p20/PDF21.'
  article: The Family of Nations — Seattle and Native American Nations
  byline: People Watcher, fictional in-world Shadowland geopolitical commentary.
  seattle:
    autonomy: Seattle’s special UCAS status originates in the Treaty of Denver; the metroplex retains unusual privileges and
      votes in UCAS matters through Matrix networks.
    schultz: Governor Marilyn Schultz has negotiated security and telecom arrangements, including a Lone Star contract and
      Renraku grid upgrades; the writer says local leaders resist secession.
    political_pressure: Some residents and activists are reconsidering UCAS citizenship and advocating separation, while Schultz
      seeks re-election in 2058 and her long hold on office appears uncertain.
    economic_ties: The writer predicts improved relations between UCAS and NAN could reduce Seattle’s strategic importance
      and strain trade with Tir Tairngire; this is forecast rather than completed consequence.
    crime: SPD’s separate comment says Seattle syndicate rivalry may affect metroplex elections; speculative in-world allegation.
  native_american_nations:
    historical_background: Relations between the UCAS and Native American Nations are shaped by the fictional Great Ghost
      Dance, territory loss and the Treaty of Denver.
    mutual_deterrence: The writer describes protracted military training and intelligence gathering by both sides, while emphasizing
      that full war has not erupted.
    diplomacy: The author suggests the UCAS and Sovereign Tribal Council may soon open formal diplomatic relations after years
      of impasse. The projected opening is not a verified concluded treaty.
  shadowtalk_status: O-Verbbyte and SPD offer political predictions about Schultz and syndicates, explicitly separate from
    the bylined geopolitical narrative.
headline: 'FICTIONAL Shadowrun tabletop-RPG archival record — People Watcher on fictional Seattle autonomy and UCAS–NAN diplomacy
