{"id":"reference.target_ucas.echo_mirage_haeffner_gavilan_p51_52","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"51-52","pdf_pages":"52-53","edition_scope":"Historical fictional Shadowrun tabletop-RPG source from FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era setting; not Third Edition mechanics.","content_class":["narrative_context"],"data":{"section":"Detroit - The Kingmaker, Alice Haeffner and Echo Mirage","setting_narrator":"Squire recounts that Kyle Haeffner met his first wife Alice while he was a Boston lawyer and she was studying computer science at MIT&T. Alice later joined a secret U.S. government team of cybernetic computer hackers named Echo Mirage, trained to combat the Crash Virus.","team_history":"The narrator says Alice was declared dead by a military physician after Echo Mirage's first major engagement with the Crash Virus, and that the government communicated its condolences to her husband and family in Boston. After the virus's defeat, surviving members returned to civilian life and many disappeared behind government-created identities.","explicit_hypothesis":"Squire suspects that Major David Gavilan, Echo Mirage's team leader, became Damien Knight and used specialized computer expertise in the Nanosecond Buyout. He connects several other rapid fortunes to Echo Mirage personnel. These are Squire's suspicions, and Squire explicitly states he has no evidence proving the identity theory.","interpretive_claim":"Squire argues that if the unproved Gavilan-Knight identity were correct, Knight's prior connection to Alice would partly explain his proximity to Kyle Haeffner and potentially make Haeffner politically indebted to him.","commenters":[{"speaker":"FastJack","claim":"Observes that Echo Mirage's cyberdecks had capabilities against 2020s security infrastructure that later megacorporations sought to counter with intrusion countermeasures."},{"speaker":"Granite","claim":"Asks whether the Gavilan identity theory would make Knight the winner of corporate control."},{"speaker":"Fro","claim":"Suggests Gavilan/Ventures ownership could instead have been part of Dunkelzahn's plan to induce Knight to act."},{"speaker":"Winger","claim":"Questions why Haeffner and Knight would remain friendly if Knight had helped send Alice on a lethal mission."},{"speaker":"Turner","claim":"Counters that ordinary political ambition or leverage could explain their continued closeness, without claiming to prove either."}],"uncertainty":"No character-identity merger is stated as verified fact. Separate names, agency, professional relationships and theory certainty are retained."},"headline":"Fictional Shadowrun tabletop-RPG archive - FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 51-52/PDF 52-53: Detroit - The Kingmaker, Alice Haeffner and Echo Mirage","summary":"Independently source-reviewed historical fictional Shadowrun publication record from FASA Corporation's Target: UCAS (FASA7214, 1997), printed 51-52/PDF 52-53. Book-narrator statements, named in-world claims, and speculation remain distinguished.","framing":"newsroom_neutral"}
