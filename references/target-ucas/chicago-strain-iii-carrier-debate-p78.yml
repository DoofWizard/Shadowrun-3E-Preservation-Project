et: UCAS (FASA7214; 1997), Second Edition-era fictional tabletop-RPG source; attributed claims are not real-world reporting."},"headline":"Fictional Shadowrun tabletop-RPG reference — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 78/PDF 79: Chicago Strain-III Beta water-carrier debate after the operation","summary":"Independently source-reviewed fictional tabletop-RPG publication context from FASA Corporation Target: UCAS (FASA7214, 1997; Second Edition-era), printed 78/PDF 79. Contested fictional Shadowtalk explanations for why fluid was used in Chicago, printed p78/PDF79.","framing":"newsroom_neutral"}
