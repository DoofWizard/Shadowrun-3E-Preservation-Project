{"id":"reference.target_ucas.detroit_windsor_claims_p56","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"56","pdf_pages":"57","edition_scope":"Historical fictional Shadowrun tabletop-RPG source, FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era setting; no inferred Third Edition mechanics.","content_class":["attributed_claim"],"data":{"section":"Named Shadowtalk interpretations of Windsor in Target: UCAS","voices":[{"speaker":"Cutter","claim":"Cutter alleges that Detroit's Windsor casino trade is influenced by the Detroit Mafia, itself affiliated with Chicago's McCaskill family, and speculates that Roland 'The Greek' Stephanopoulos might attempt to increase his influence following upheaval in Chicago."},{"speaker":"Errant Knight","claim":"Errant Knight responds that local authorities limit organized-crime influence to low-visibility casino activity on Windsor's side of the river, and that Ares and Knight Errant respond forcefully if criminals become conspicuous in Detroit. The comment frames this as the speaker's defense of Ares control."},{"speaker":"RisingSon","claim":"RisingSon predicts that a weakened Chicago syndicate and a Detroit-Milwaukee opportunity might encourage a Mafia confrontation which could draw a UCAS Commission response; the forecast is not established as a completed event."},{"speaker":"Hazard","claim":"Hazard reports rumors that the First Canadians may have been behind an attempt to bomb the Federal Building in Detroit and may or may not work with the Quebec Unité movement; the source treats these as contested allegations, not established actions."},{"speaker":"Loon-E-Toon","claim":"Loon-E-Toon alleges that Ares covertly supplied stolen hardware to First Canadians activists, implying that Knight benefits from destabilizing Quebec and Cross Applied Technologies. No direct proof is supplied in the comment."},{"speaker":"Errant Knight","claim":"Errant Knight disputes the prior implied motive and instead blames Cross Applied Technologies' tariffs and Quebec-related UCAS trade restrictions for Knight's interest in the political instability. The poster also suggests Knight enjoys confronting Cross. This remains an in-world explanation, not a narrator-certified fact."}],"scope":"All entries are attribution-preserving third-person archival summaries of fictional forum comments; rumors, hypotheses and denials remain distinct."},"headline":"Fictional Shadowrun tabletop RPG archive - FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition era), printed 56/PDF 57: Windsor Mafia, First Canadians and corporate-rivalry commentary","summary":"Source-reviewed fictional 2050s Detroit material from FASA Corporation's historical Second Edition-era Target: UCAS (FASA7214, 1997), printed 56/PDF 57. Narrator statements, named in-world claims and uncertainty are distinguished.","framing":"newsroom_neutral"}
