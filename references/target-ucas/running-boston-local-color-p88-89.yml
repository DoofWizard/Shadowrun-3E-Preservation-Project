data:
  section: Running in Boston — Adventure Sources, Employers and Opponents; Local Color;
    State of the Art.
  gm_adventure_sources: The optional campaign guidance highlights ECSE brokerage operations,
    visiting executives, megacorporate research at Harvard and MIT&T, the Dunkelzahn
    Institute of Magical Research, witches of Salem, Warpath, the Knights of the Red
    Branch and environmental and political groups as possible fictional sources of
    plots or opposition. It suggests alliances or opposition among these groups without
    asserting every participant is involved in crime.
  setting_involvement: The guide contrasts high-security megacorporate enclaves around
    Route 128 and downtown, where unauthorized actions draw scrutiny, with the Rox
    and Catacombs, which it characterizes as less regulated; differences affect adventure
    tone, not an explicit numeric game modifier.
  local_color:
    ECSE: The East Coast Stock Exchange (ECSE) dominates Boston corporate life; the
      text suggests brokerage commuters, ECSE reports, terminals and stock market
      broadcasts as backdrops.
    Eurostyle: Boston’s European-flavored clothing, food and entertainment and the
      popularity of European magical traditions can be emphasized.
    Catacombs: Crumbling subway stations and sewer tunnels make a possible belowground
      location for meetings, exploration and intrigue.
    Irish_Eyes: The source describes the city’s Irish population as its largest ethnic
      group and fictional Tir na nÓg controversy as sources of anti-elf prejudice
      and political tension; it suggests depicting the Troubles and rival sentiments
      in games. The statements are fiction-set descriptors, not claims about present-day
      Boston residents.
    Elves: The guidance notes that some affluent Beacon Hill and Irish families include
      elves, even as particular fictional factions exhibit anti-elf prejudice. Discrimination
      is a plot context, not a recommended social stance.
    Landmarks: The source suggests Old North Church, the USS Constitution, the Boston
      Tea Party pier, ivy-covered Harvard buildings and Colonial-era history as possible
      encounter scenery.
    Boston_magical_traditions: The witches of Salem use a nature-magic tradition with
      the Idols Great Mother, Moon Maiden, Wild Huntsman and Horned God; the cited
      comparison is Germany Sourcebook p134. Some witches separately practice hermetic
      rites.
  local_magic: The text distinguishes university and corporate hermetic practitioners,
    relatively rare Boston shamans, wilderness shamans in New Hampshire and Vermont,
    rumored toxic shamans near the Rox and South Boston Harbor, and voodoun among
    some Rox tribes. “Rumored” status for toxic shamans is preserved.
  SOTA_guidance: The optional “State of the Art” paragraph points to Shadowrun Companion
    pp85–87. It suggests that Boston’s magical and Matrix R&D may advance available
    SOTA abruptly and can motivate games and adjustments to characters’ nuyen or Karma,
    but supplies no new explicit TN, modifier, dice pool, or numeric advancement procedure
    in this book.
