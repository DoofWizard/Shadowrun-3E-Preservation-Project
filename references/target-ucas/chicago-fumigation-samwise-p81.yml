{"id":"reference.target_ucas.chicago.fumigation_samwise_p81","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"source_pdf_sha256":"dc016e418a24fad63d56fba4f2f7f657cb1c0d995cdabd648ba9c6109e33f8f8","printed_pages":"81","pdf_pages":"82","edition_scope":"FASA Corporation's 1997 Target: UCAS (FASA7214) is a historical Shadowrun Second Edition-era fictional tabletop-RPG sourcebook. No inferred Third Edition conversion.","content_class":["attributed_claim"],"data":{"section":"Chicago—Oblivion's End? / Fumigation; by Samwise; dated 7 March 2058.","samwise_main_claim":"Samwise disputes claims that Ares eradicated the insect spirits. The post concedes that Operation Extermination killed numerous spirits but argues surviving ones may be weakened, concealed in frozen or abandoned hives, and capable of regrouping. Remains reportedly seen downtown are not proof of total elimination.","winsome_grym_tservo":"Winsome asks whether the alleged agent merely weakens the spirits. Grym answers that it could kill them eventually, while saying related decontamination would be hazardous and that in-world forces might simply wait for the weakened targets; Tservo objects to offering the megacorporation more ideas. These remarks are speculative in-setting assertions, not usable external procedures.","samwise_more_rumors":"Samwise claims insect spirits have grown subtler and reports unsubstantiated rumors about people affiliated with corporations, senior government offices, and a prominent election candidate. The speaker also recounts uncertain theories of insect spirits living after the queen's death or becoming free after a queen dies.","hal_greylake":"Hal speculates that human cultists could serve as a replacement for a hive's insects. Greylake treats this as disturbing conjecture. Neither speaker establishes the existence of a human-based insect-spirit hive.","evidence_boundary":"All cited claims come from fictional Shadowtalk and remain uncertain or disputed; the source does not give a verified census of surviving spirits, a confirmed political infiltration, or a real-world laboratory protocol.","provenance_note":"FASA Corporation, Target: UCAS, FASA7214 (1997), original printed 81/PDF82; historical Second Edition-era setting."},"headline":"Fictional Shadowrun tabletop-RPG reference — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 81/PDF 82: Fumigation: disputed insect-spirit survival and post-operation fears","summary":"Independently source-reviewed reference to fictional FASA Corporation, Target: UCAS (FASA7214, ©1997), historical Shadowrun Second Edition-era tabletop-RPG fiction, original printed pages 81 and PDF pages 82. Fumigation: disputed insect-spirit survival and post-operation fears. Distinct speaker claims, stated uncertainty, and source chronology are preserved.","framing":"newsroom_neutral"}