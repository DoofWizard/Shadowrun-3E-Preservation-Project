{"id":"reference.target_ucas.chicago.beyond_wall_ucas_corporal_p78_79","record_type":"reference","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"source_pdf_sha256":"dc016e418a24fad63d56fba4f2f7f657cb1c0d995cdabd648ba9c6109e33f8f8","printed_pages":"78-79","pdf_pages":"79-80","edition_scope":"FASA Corporation's 1997 Target: UCAS (FASA7214) is a historical Shadowrun Second Edition-era fictional tabletop-RPG sourcebook. No inferred Third Edition conversion.","content_class":["narrative_context"],"data":{"section":"Chicago—Oblivion's End? / Beyond the Wall; posted 28 February 2058; embedded transmission attributed to 1 April 2058 at 11:24:25 EST.","source_and_agency":"Captain Chaos introduces an account obtained from an unnamed acquaintance described as a UCAS military corporal stationed on the Containment Zone (CZ) Wall during Operation Extermination; the text is presented as that corporal's in-world testimony, not an omniscient or independently corroborated chronology. A subsequent short exchange credits Scarecrow and Captain Chaos for the post.","ares_activity":"The corporal recalls recurring reports of Ares sending people across the Wall. Knight Errant personnel on the corporal's section appeared not to know details and initially had ordinary guard duties; they were ordered to maintain the cordon during the sudden Ares operation. The account refers to engagements near Truman Tower between insect spirits and a Knight Errant Firewatch team, with fighting continuing while guards tried to keep traffic stopped.","withdrawal_and_command":"The corporal alleges Ares and Knight Errant withdrew after their operation, leaving a reduced force of UCAS Army regulars and National Guardsmen to uphold the blockade. The soldier says President Haeffner's State of the Union speech formally ended the blockade about twelve hours later; the statement is the soldier's remembered sequence.","exodus_and_resistance":"The account says at least a thousand people passed out of the zone on the first day and many more followed over the subsequent week. The narrator describes armed local hostility against refugees who might conceal insect spirits, with soldiers shielding those crossing; the narrator presents both the fear and the violence without confirming that refugees were infected or disguises.","remaining_isolation":"According to the corporal, relief workers participating in a governor's disaster program soon departed, private security and worried neighbors constrained entry, and many residents and authorities continued to avoid the zone; formal reopening did not end effective social isolation. The corporal expects reassignment and reports continued fear and neglect.","provenance_note":"This text represents an embedded fictional soldier's reported observations and judgments within FASA Corporation's Target: UCAS, printed pages 78–79, PDF pages 79–80, not independent verification of the described in-world events."},"headline":"Fictional Shadowrun tabletop-RPG reference — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 78-79/PDF 79-80: Beyond the Wall: a UCAS corporal's account of ending the Chicago blockade","summary":"Independently source-reviewed reference to fictional FASA Corporation, Target: UCAS (FASA7214, ©1997), historical Shadowrun Second Edition-era tabletop-RPG fiction, original printed pages 78-79 and PDF pages 79-80. Beyond the Wall: a UCAS corporal's account of ending the Chicago blockade. Distinct speaker claims, stated uncertainty, and source chronology are preserved.","framing":"newsroom_neutral"}