data:
  section: Chicago—Oblivion’s End?; named in-world forum comments on astral Voids.
  sage: Sage responds with the recurrent cryptic expression “Knows all, but tells
    less”; this is an attributed comment, not a sourcebook rule.
  gael: Gael reports that a friend nearly encountered several Voids in the CZ and
    likens their reversed-feeling background count to the foveae associated with Aztlan,
    asking whether the phenomena connect.
  doc: Doc says the effects are similar but not identical. Doc compares them to an
    experience of a magician who leaves the atmosphere for outer space and faces fatal
    or debilitating risks; the comparison is a poster’s analogy, not a new formal
    game mechanic.
  tervo: Tervo hypothesizes that Strain-III drained background count in the Containment
    Zone and that astral-energy conservation might link it to Voids. The poster explicitly
    calls this an explanatory possibility.
  professor_j: Professor J, using the address jjacobs@mitt.edu, cautions that conventional
    physical laws do not govern astral space and says further study is needed to assess
    dangers. The cited address is an invented-world source detail, not a contact recommendation.
  tanner_and_globe: Tanner comments that magically interested groups are researching
    Void causes and repair. Globe names MIT&T, magicians of Little Earth, the Dunkelzahn
    Institute of Magical Research, and the new government Magical Security Task Force
    as groups funding research or shadowruns, and claims they are acting independently.
  yori: Yori questions whether the effects will remain limited to Chicago or Strain-III.
  g_man: G-Man claims Knight Errant astral reconnaissance before Operation Extermination
    found the Sanctum established by Two-Spirits as the only Zone site without background
    count, and further claims that after the operation no one has heard from Two-Spirits
    and that the Sanctum is empty. These remain attributed in-world claims, not confirmed
    disappearance circumstances.
  provenance_note: 'FASA Corporation, Target: UCAS, FASA7214 (©1997), fictional Shadowrun
    Second Edition-era source; printed p84/PDF85. Every assertion belongs to its named
    fictional Shadowtalk speaker.'
