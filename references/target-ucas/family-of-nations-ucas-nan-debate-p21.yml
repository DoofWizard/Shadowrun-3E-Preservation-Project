  article: Family of Nations — continuing debate about UCAS and Native American Nations diplomacy
  rust_bucket: Rust-Bucket uses a derogatory reference to Native American nations, condemns President Haeffner for negotiations
    and expresses a violent threat against him. This is a hostile fictional speaker’s statement, not narrator endorsement
    or a verified threat event.
  captain_chaos: Captain Chaos interrupts the abusive exchange, explicitly tells commenters to behave, including Rust-Bucket,
    and an Alpha Protocol system-operations cutoff appears after a hostile reply. The visible time stamp identifies 14 March
    2058, 04:22:10 EST.
  dc_insider: DC Insider disputes Rust-Bucket’s characterization. The poster argues that Haeffner seeks peace with the Native
    American Nations so the UCAS can devote resources to domestic problems. The writer sees the NAN cold war as a drain,
    considers war with the CAS still possible, and speculates that closer CAS–Sovereign Tribal Council relations could threaten
    the UCAS if CAS and the NAN were to align in an Aztlan–Texas crisis.
  rust_bucket_followup: Rust-Bucket replies with continued distrust of the NAN; the rebuttal is attributed and does not
    establish the speaker’s assumptions as fact.
  claim_boundary: Speaker prejudice and predictions of conflict are preserved as attributed in-world rhetoric, not as factual
    claims about real-world peoples or current national diplomacy.
