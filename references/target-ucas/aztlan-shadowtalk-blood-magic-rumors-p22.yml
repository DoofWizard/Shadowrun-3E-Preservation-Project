  article: Family of Nations — separately attributed Aztlan Shadowtalk
  editorial_rule: Speaker statements and allegations are preserved as fictional in-world Shadowtalk, not verified events
    or instructions.
  findler_man: Findler-Man questions whether Haeffner’s promise practically protects unauthorized participants, and speculates
    about reactions by UCAS authorities. This is a poster’s political opinion.
  decker_del_sur: Decker del Sur calls the Draco Foundation bounty potentially enormous and characterizes the requested
    delivery as live capture; the poster comments on the difficulty and legal exposure without establishing a general gameplay
    rule or instructing a real-world action.
  wraith: Wraith reports that two magicians were deceived by a conventional magician posing as a blood mage and notes that
    the rewards do not quell anti-magician sentiment. The report is an attributed anecdote, not proven mechanics.
  rio_grande: Rio Grande asks what happened to Aztechnology CEO Juan Azcapotzalco after the dragon’s mysterious posthumous
    instructions and reports rumors that his televised appearances are synthetic.
  rat_dancer: Rat Dancer relays the claim that Juan had already died; Shining Brow speculates that Dunkelzahn’s gift may
    have been life rather than death. Neither theory is narrated as established fact.
