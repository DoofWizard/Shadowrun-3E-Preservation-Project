  "data": {
    "source_context": "FASA Corporation's fictional Shadowrun tabletop RPG book Target: UCAS (FASA7214, 1997, historical Second Edition era), printed 100-102/PDF 101-103.",
    "scope": "The Game Information chapter presents these campaign themes as optional premises which gamemasters may adapt. They are not guaranteed future canonical outcomes. Players are advised to avoid spoilers, and rumors and uncertainty should remain important.",
    "themes": [
      {
        "name": "Children of Oblivion",
        "premise": "Residents may choose to remain in the former Containment Zone while local warlords and gangs contest control after UCAS and Ares withdraw. Remaining insect spirits and relief workers also figure in possible play."
      },
      {
        "name": "Blackout",
        "premise": "With quarantine lifted, corporations and governments seek information about the Zone, missing technology, and Ares' secret Strain-III operations. The status of surviving insect spirits is disputed."
      },
      {
        "name": "Bug Hunt",
        "premise": "Surviving insect spirits are fewer yet subtler and may resist Strain-III. The fictional book introduces a Secret Hive beyond the Zone, where operatives, cults and cooperating metahumans might hide; an adventure can uncover an infiltrator among opponents."
      },
      {
        "name": "Rescue",
        "premise": "Runners can locate missing people or evacuate residents, but the text explicitly says some choose to stay or cannot leave. Locating a person, obtaining consent and moving a person against their wishes are not interchangeable."
      },
      {
        "name": "Ghoul Liberation League",
        "premise": "Some League members undertake militant actions while others work peacefully for recognition. Characters can aid or oppose particular operations; Blaine Hammond is described as more belligerent after the loss of moderate leader Tamir Grey."
      },
      {
        "name": "Strange Bedfellows",
        "premise": "Mantis spirits sometimes fight insect spirits alongside metahumans but pursue separate agendas and may use human hosts. The book cites the fictional adventures Dead Run and Casualties of War as related material."
      },
      {
        "name": "Damage Control",
        "premise": "Ares' mass Strain-III release produces magical, political and ecological concerns. Rival corporations and magical organizations study samples, lost facilities and astral Voids in and around the former Zone."
      }
    ],
    "edition_attribution": "All examples are optional gamemaster scenarios in FASA Corporation's 1997 Second Edition-era Shadowrun book Target: UCAS, not historical real-world events or converted Third Edition rules."
  },
