  source_voice: Speaker views and rumors are kept attributed, not promoted to sourcebook narrator facts.
  comments:
  - speaker: Paper Chaser
    pages: 106-107
    claim: Reports visitor pickpockets, aggressive street performances, car theft, and more serious evening street-gang
      threats. He identifies the Dolphins, Hothouse Weeds, Execution and Rat-trappers as notable names, and portrays
      outlying gangs as shifting political alliances and dangerous games. These are the poster’s interpretations and
      anecdotes.
  - speaker: Cooney
    pages: '107'
    claim: Questions the claim that walking can conveniently reach all points in Dublin’s center; recommends using the
      tram for longer trips.
  - speaker: Cleasaiche
    pages: '107'
    claim: Interprets Cooney’s walking/tram debate as unnecessary agitation.
  - speaker: De Selby
    pages: '107'
    claim: Advocates bicycles while joking they are vulnerable to being stolen, reflecting another speaker’s reported
      car theft problem.
  - speaker: Paper Chaser
    pages: '107'
    claim: Alleges that restrictions on driving indirectly benefited the O’Toole transport interests.
  - speaker: Cleasaiche
    pages: '108'
    claim: Recounts intentionally confusing city driving signs and blocked roads as a frustration.
  - speaker: De Selby
    pages: '108'
    claim: Responds to the car ban with a sarcastic appeal to an imagined religious justification for bicycles.
  - speaker: M O’S
    pages: '108'
    claim: Describes honking a horn while driving as especially insulting in local Irish culture.
  - speaker: Sinéad F
    pages: '109'
    claim: Says street posters and informal advertisements provide more useful events information than official channels.
  - speaker: Timmy
    pages: '109'
    claim: Commends perceived cleaner air in the capital.
  - speaker: Cooney
    pages: '109'
    claim: Implies public authorities and intelligence services continue monitoring residents despite reduced vehicle
      pollution.
  certainty: All reports are expressly attributed to fictional posters; no independent verification outside source imagery
    was inferred.
