    original_pdf_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
  speaker_claims:
  - printed_page: 22
    speaker: Cian Fear-Tearmainn
    assertion: Denies the fictional Ministry of the Interior has tapped more than a thousand vidphones per
      year despite acknowledging national-security activity. This is an in-world defense, not verified fact.
  - printed_page: 22
    speaker: Metal Mickey
    assertion: Challenges the reassurance by distinguishing the Ministry’s claimed authorized phone surveillance
      from unauthorized tapping. This is in-world skepticism.
  - printed_page: 23
    speaker: Taranis
    assertion: Describes unofficial EcoNet and CCD bulletin-board information sources, alleging that agencies
      and dissidents circulate material there. The characterization and reliability are those of this speaker,
      not the source narrator.
  - printed_page: 23
    speaker: Analyzer
    assertion: Claims culturally specific symbols on the Tír Matrix can disadvantage users unfamiliar with
      Tír culture, while noting symbolic meanings attached to nodes; this is interpretive commentary, not an
      added numerical game modifier.
  - printed_page: 23
    speaker: Analyzer
    assertion: Discusses the Rose of Tralee festival’s claimed £50,000 endowment and screening of contestants;
      the endowment and commentary are attributed to the speaker rather than asserted as independently verified.
  - printed_page: 24
    speaker: Taranis
    assertion: Alleges that in-world security personnel focus on fringe druid or arts workshops rather than
      every festival visitor; this is the speaker’s surveillance claim.
  - printed_page: 24
    speaker: Traveler
    assertion: Suggests an in-world business favor could secure inclusion in a Galway-bound corporate group;
      this is a character suggestion, not a verified official festival policy.
  - printed_page: 24
    speaker: Nikki the Greek
    assertion: Claims some festival visitors also engage in undisclosed commercial exchanges and alleges that
      the stated naval role around Tawin Island omits other activities; treated as the fictional speaker’s
      accusation.
  - printed_page: 24
    speaker: Sinéad F
    assertion: Criticizes the Yeats Summer School as presenting curated or inauthentic Gaelic cultural material;
      an attributed opinion rather than an objective assessment of the institution.
  narrator_vs_claim_boundary: The surrounding sourcebook describes communications systems and festivals as
    published fictional setting facts. These named commentaries remain allegations, opinions or suggestions
    with uncertain reliability.
