  idiom_notes:
  - expression: See me?
    source_meaning: Can introduce the speaker’s own account; the analogous opening see him? or see her? is presented
      as potentially derogatory or a warning.
  - expression: Funny enough
    source_meaning: Conversational opener for a surprising coincidence, unexpected occurrence or inappropriate outcome.
  - expression: 'On'
    source_meaning: Multiple contextual senses including fashionable, time, availability for work, agreement, functioning,
      and un- replacement in an invented colloquial usage.
  elliptical_thinking_examples_summarized:
  - A cat narrowly avoids being run over; a hypothetical comparison with a larger dog makes the accident sound certain.
  - A speaker promises to visit once a headache has cleared rather than stating a date.
  - An odd question about shoes compares a woman’s feet with smaller shoe size and mentions government subsidies.
  - An image comparing a mouth to a butcher’s cupboard signifies incessant talking.
  - A sleepless night is described indirectly by repeated trips to the bathroom.
