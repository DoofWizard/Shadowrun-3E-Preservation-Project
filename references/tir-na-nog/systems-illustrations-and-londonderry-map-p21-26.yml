    description: 'Wide monochrome streetscape across the upper part of the page: narrow cobbled lane, doors,
      street lamp, building sign reading ART-M-US STUDIOS and an artist signature/mark. No pictured figure
      identity established.'
  - printed_page: 23
    pdf_page: 24
    description: Tall central black-and-white illustration of a stylized Matrix console and keyboard surrounded
      by Celtic-knot motifs; central knot spiral and numerous labeled screen panels and cables. The source
      illustration is not itself a mechanical host test.
  - printed_page: 25
    pdf_page: 26
    description: Large lower-page monochrome street scene with a foreground adult in collared jacket and patterned
      sweater, two people close together at center, a crouched or seated figure near a sidewalk display, and
      shop buildings in background. No definitive character identities are labeled.
  - printed_page: 26
    pdf_page: 27
    description: 'Full-page graphic headed Londonderry: inset street map legend marking Protestant areas with
      white fill and Catholic areas with gray fill, layered over a stylized street confrontation showing a
      crowd and helmeted shield-bearing police. Map categories are the publication’s fictional-period cartographic
      labels, not a claim about contemporary demographics.'
