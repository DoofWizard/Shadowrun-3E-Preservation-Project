  - pdf: 34
    letter: A
    source_caption: The last official portrait of Liam O’Connor, circa 2041.
    description: Framed painted portrait of a dark-clad, pointed-eared male figure
      in ornate embroidered formal attire; the source assigns the historical fictional
      subject and approximate date; artist Rick Berry.
  - pdf: 35
    letter: B
    source_caption: A céilí band performs using magic to add to the impact of their
      art.
    description: Two performers with flutes and swirls of luminous material; magic
      is depiction and caption, not a printed game spell procedure; artist Janet Aulisio.
  - pdf: 36
    letter: C
    source_caption: 'Bolduedd’s, Dublin: Tir nightlife has an attitude all its own.'
    description: Four closely grouped nightlife patrons with expressive attire and
      body ornamentation; the caption names a fictional Dublin establishment; artist
      Janet Aulisio.
  - pdf: 37
    letter: D
    source_caption: Fomorians of the western boglands—a surprise on a dark night.
    description: Two monstrous horned figures with heavy limbs moving through a bog-like
      area; no creature stat block printed on plate; artist David Martin.
  - pdf: 38
    letter: E
    source_caption: Even in the Tir, evil toxic forces are at work.
    description: Grotesque supernatural figure with electrical imagery amid discarded
      electronics, tires and cabling; source identifies as toxic forces; artist Tony
      Szczudlo.
  - pdf: 39
    letter: F
    source_caption: Bridgit O’Toole, head of O’Toole Transport Systems, dressed for
      a féilla.
    description: Formal portrait of a smiling, red-haired, pointed-eared woman wearing
      fine jewelry and ceremonial attire; artist Rick Berry.
  - pdf: 40
    letter: G
    source_caption: The secretive Lady Brane Deigh, Queen of the Seelie Court.
    description: Painted three-quarter figure wearing richly decorated garments, gloves
      and a veil/head covering; visual title from source; artist Rick Berry.
  - pdf: 41
    letter: H
    source_caption: 'Tir na nÓg: a land of quiet mystery and secret power.'
    description: Woman-like robed fantasy figure on misty rocky terrain with distant
      landmarks, depicting a symbolic fictional landscape; artist Jeff Laubenstein.
