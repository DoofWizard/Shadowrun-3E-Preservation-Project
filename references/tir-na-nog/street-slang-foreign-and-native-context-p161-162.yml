  section: 'Street Slang: foreign borrowings and native usage'
  fictional_linguistic_setting:
    foreign_borrowings: The source characterizes the fictional Irish urban variety as borrowing Anglo-American
      expressions and altering, sometimes reversing, the meanings of selected North American slang. It
      flags three especially confusing terms.
    key_distinctions:
      whizz: American compliment for skill becomes an unfavorable judgment about quality in Tír usage.
      drek: Normally rubbish; sometimes an opposite meaning depending on context and pronunciation.
      pixie: An elf or aspects of the Tír political and social apparatus said to be under government influence
        or control.
    asterisk_rule: The printed list denotes street-only terms by an asterisk; unmarked expressions may
      occur in ordinary speech.
    derogatory_usage_is_source_labeled: true
