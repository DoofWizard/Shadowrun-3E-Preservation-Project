      speaker: "Anonymous and Taranis"
      page: 91
      claim: "Dispute the beliefs and significance of An Clochan rites."
    -
      speaker: "D O'Brady and Zeitguest"
      page: 91
      claim: "Offer different explanations for recluse and spirits near Rindow."
    -
      speaker: "Shannon"
      page: 91
      claim: "Recounts actual-world-history story of Lord Mountbatten's 1979 death as part of in-world historical commentary, not a new real-world allegation."
    -
      speaker: "D O'Brady"
      page: 91
      claim: "Alleges dangerous monster near Dromod and criticizes response by O'Flaherty chieftains."
    -
      speaker: "Mulligan"
      page: 92
      claim: "Suggests local seals linked to the Children of Lir myth may be shamans."
    -
      speaker: "Taranis"
      page: 92
      claim: "Questions the inscription on The Neale."
    -
      speaker: "Colm"
      page: 92
