  sites:
    -
      name: "An Clochan"
      county: "Galway"
      description: "Hut/gathering site west of Clifden with claimed spirit contact across ocean in distant Tir Tairngire; disputed by named speakers."
    -
      name: "Camfree"
      county: "Roscommon"
      description: "O'Connor inauguration and burial mound south of Rathcroghan, claimed mana locus and guarded by O'Connor-associated mages."
    -
      name: "Carrowkeel"
      county: "Sligo"
      description: "Site of mythic Tuatha de Danaan-Fomorian battle with ancestral rites; elves reportedly guard sacred dates."
    -
      name: "Castle of Rindow"
      county: "Roscommon"
      description: "Remnants of thirteenth-century castle with ivy-covered walls and woodland; speakers describe recluse and possible spirit threats."
    -
      name: "Croagh Patrick"
      county: "Mayo"
      description: "Christian pilgrimage mountain associated with St Patrick's reputed forty-day fast."
    -
      name: "Dunguaire"
      county: "Galway"
      description: "Restored sixteenth-century castle owned by human Lord Guaire O'Shaughnessy, hosting feasts and saga readings."
    -
      name: "Hill of Rathcroghan"
      county: "Roscommon"
      description: "Ancient royal burial hill associated with Queen Medb, part of guarded cairn lines."
    -
      name: "Inchagoill"
      county: "Galway"
      description: "Ancient religious site near Stone of Lugna, standing-stone ring and reportedly prized ogham stones for enchanting."
    -
      name: "Inishglora"
      county: "Mayo"
      description: "Island linked by local myth to Children of Lir turned into swans and later dying on shore."
    -
      name: "Keshcoran"
      county: "Sligo"
      description: "Annual Garland Sunday offerings to Lug and Cormac MacArt."
    -
      name: "Killronan"
      county: "Roscommon"
      description: "Holy well near Lough Meelagh associated with blind harper Turlough O'Carolan; annual August festival of music."
    -
      name: "Knock"
      county: "Mayo"
      description: "Shrine begun 1879; fictional source says a 2017 disclosure exposed original visions as a hoax, leading to fewer pilgrims."
    -
      name: "Knocknarea"
      county: "Sligo"
      description: "Queen Medb burial-site legend, magically reconfigured cairn field, claimed elven orders operating there."
    -
      name: "The Neale"
      county: "Mayo"
      description: "Ancient tomb with inscription myth 'gods go back to the year of the world 2994' whose archaeological age remains disputed."
    -
      name: "O'Dowd's Castle"
      county: "Sligo"
      description: "Mermaid sightings rumored at tower south of Inniscrone."
    -
      name: "Pallas Castle"
      county: "Galway"
      description: "Burke family castle under repair following fire; speaker Colm speculates on arson."
    -
      name: "Rockfleet Castle"
      county: "Mayo"
      description: "Home of Cathal Burke, elderly human head of Burke household; source describes his estrangement from most Danaan-mór elites."
    -
      name: "Sheebeg"
      county: "Leitrim"
      description: "Prehistoric mound traditionally linked to Finn MacCuill; research inconclusive."
    -
      name: "Turoe Stone"
      county: "Galway"
      description: "Carved standing stone outside Loughrea, associated with a moved site and weakened former power."
  attributed_shadowtalk:
