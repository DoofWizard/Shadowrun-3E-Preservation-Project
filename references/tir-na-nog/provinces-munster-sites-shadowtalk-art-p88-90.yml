  sites:
    -
      name: "Aghadoe Hill"
      county: "Kerry"
      description: "Local association with beauty; elven nobles use hill for weddings and betrothal announcements."
    -
      name: "Cahir Castle"
      county: "Tipperary"
      description: "Fifteenth-century Butler family seat on Suir island; Danaan councils convene there under security."
    -
      name: "Cape Clear"
      county: "Cork"
      description: "Narrator recounts 1631 pirate sack and captivity of O'Driscoll residents, followed by attributed comments on foreign contacts."
    -
      name: "Carrick-On-Suir"
      county: "Tipperary"
      description: "Butler ancestral mansion occupied by Cullen Butler and retinue; source reports unpopular indulgences."
    -
      name: "Castle Matix"
      county: "Limerick"
      description: "Earls of Desmond seat for literary Courts of Poetry, with a spring that local speakers claim affects poetic creativity."
    -
      name: "Doonbeg Fort"
      county: "Kerry"
      description: "Ancient stronghold above Dingle Bay; underground chambers and dolmens, attributed local magical danger."
    -
      name: "Glin Castle"
      county: "Limerick"
      description: "FitzGerald ancestral home; source reports Rhianna FitzGerald acquired it following violent duel with cousin, amid Danaan-mór factional controversy."
    -
      name: "Iniscealtra"
      county: "Clare"
      description: "Holy Island in Lough Derg hosts three-day festival by holy well near Lugnasa."
    -
      name: "Knockeen"
      county: "Waterford"
      description: "Dolmen traditionally linked to Déisi chieftain; narrator reports four elven mages performed Samhain ceremony in 2051, motives disputed."
    -
      name: "Lemaneagh Castle"
      county: "Clare"
      description: "Ancient O'Brien castle once associated with Red Mary, with dolmen of Poulabrone, Cahercommaun stone fort nearby."
    -
      name: "Lisdoonvarna"
      county: "Clare"
      description: "Annual Matchmaking Festival in September."
    -
      name: "Lismore"
      county: "Waterford"
      description: "Castle built 1185 by King John, recovered by Tir government in 2047, planned to pass to McCarthy family after renovations."
    -
      name: "Rock of Cashel"
      county: "Tipperary"
      description: "Munster royal seat associated with Brian Boru crowning in 977; steep rocky outcrop."
    -
      name: "St. Declan's Well"
      county: "Waterford"
      description: "Healing spring with stone chair and three beheaded stone crosses, basin and legendary cure stone."
    -
      name: "St. Molua's Oratory"
      county: "Clare"
      description: "Ruined Catholic church formerly on island in Shannon; moved uphill during hydroelectric works in 1929; rival groups seek restoration or replacement honoring Brian Boru."
  attributed_shadowtalk:
    -
      speaker: "R O'Brady"
      page: 88
      claim: "Describes wild men in the Boggeragh Mountains who prey on trespassers."
    -
      speaker: "Archer"
      page: 88
      claim: "Alludes to O'Driscoll foreign connections after Cape Clear account; Pádraig asks for elaboration."
    -
      speaker: "Sabre"
      page: 88
      claim: "Warns of alleged banshee Aibell, connected to the O'Brien tradition of Brian Boru."
    -
      speaker: "Traveler and R O'Brady"
      page: 88
      claim: "Contrast the appealing Iniscealtra celebration with risks of three days spent among spirits."
    -
      speaker: "M O'S, R O'Brady, Finn, Analyzer"
      page: 89
      claim: "Debate McCarthy, O'Kennedy and O'Brien disputed treasures and family relations; these are attributed allegations, not narrator-established fact."
    -
      speaker: "R O'Brady and Pádraig"
      page: 89
      claim: "Discuss elusive Keepers of Cashel and potential restoration of earlier treasures."
    -
      speaker: "Sinéad F"
      page: 89
      claim: "Relays anecdote of an evangelist unsuccessfully attempting a legendary stone trial."
    -
      speaker: "Moleman"
      page: 90
      claim: "Alleges the FitzGerald family controls and fortifies Youghal and imposes passes and resident displacement; claim appears only in attributed commentary."
