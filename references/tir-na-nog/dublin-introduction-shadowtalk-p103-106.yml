  speaker_comments:
  - speaker: Cooney
    printed_page: 103
    reported_position: Calls Niall’s presentation boosterish tourist-brochure rhetoric.
  - speaker: Traveler
    printed_page: 103
    reported_position: Questions the local usage of the word “crack” in Niall’s introduction.
  - speaker: Poguer
    printed_page: 104
    reported_position: 'Corrects the visitor’s misunderstanding: local Crack means liveliness, drinking, sociability
      and art, not a reference to drugs.'
  - speaker: De Selby
    printed_page: 104
    reported_position: Dismisses Dublin’s celebrated culture in a sardonic comparison to decay.
  - speaker: Metal Mickey
    printed_page: 104
    reported_position: Challenges De Selby’s dismissal by pointing to older Irish literary and artistic achievements.
  - speaker: Friday
    printed_page: 104
    reported_position: Answers with a caustic, contemptuous personal barb directed at De Selby.
  - speaker: Cooney
    printed_page: 104
    reported_position: Rejects what he regards as excessive theatrical posturing and invokes the “tick Paddy” owl insult.
  - speaker: Analyzer
    printed_page: 105
    reported_position: Disputes the reliability of official poverty and unemployment measures, particularly the narrow
      definition by which official government measures classify 6 percent of Dublin residents under poverty.
  - speaker: Friday
    printed_page: 105
    reported_position: Calls Mayor Finnegan a politically inept human non-Danaan figure, and says his departure would
      have political consequences.
  - speaker: Paper Chaser
    printed_page: 105
    reported_position: Alleges that Finnegan formerly worked as a servant for Interior Minister O’Molloy and that this
      connects him to national political control.
  - speaker: Paper Chaser
    printed_page: 106
    reported_position: Describes practical crime and visitor concerns, including pickpockets, car theft, tourist harassment,
      Liptens/Liptons performance-art incidents, and street gangs; these are attributed anecdotes rather than independently
      verified crime statistics.
  - speaker: Metal Mickey
    printed_page: 106
    reported_position: Ridicules Paper Chaser’s concern about Dublin’s confrontational culture.
  - speaker: Cian Fear-Tearmainn
    printed_page: 106
    reported_position: Calls for revisions to the cultural-heritage statute in response to allegedly abusive public performers.
  - speaker: Sinéad F
    printed_page: 106
    reported_position: Parodies the confrontational style of another participant.
  - speaker: Friday
    printed_page: 106
    reported_position: Responds in dark performance-art imagery to the debate about culture.
  speaker_certainty: All assertions are attributed to the named discussants and are not promoted into confirmed legal,
    economic or social facts.
