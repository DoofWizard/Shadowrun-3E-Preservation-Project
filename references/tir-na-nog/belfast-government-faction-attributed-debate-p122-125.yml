  source_context: Fictional Shadowrun-setting material from a published tabletop RPG.
    Distinguish book-narrator descriptions, in-world speakers’ allegations and speculation;
    no claims about real contemporary Belfast.
  genre: In-world Shadowland commentary attributed to named fictional posters; quotations
    and assertions are not independently established facts of the setting.
  speaker_posts:
  - speaker: Paisleyman
    printed_page: 122
    assertion: Religious purist defense of local elven supremacy; Jack subsequently
      challenges the speaker’s personal background. Treat as political rhetoric, not
      narrator fact.
  - speaker: Jack
    printed_page: 122
    assertion: Accuses Paisleyman of being an Alastian and having family ties to sheep-herding,
      against his claimed purity.
  - speaker: Analyzer
    printed_page: 122
    assertion: Invites readers removed from the conflict to consider arguments across
      sides while warning of inadequate information; another post argues disagreement
      itself reveals public uncertainty.
  - speaker: Paper Chaser
    printed_page: 122
    assertion: Alleges Garda crime figures are unreliable because serious crimes are
      not reported and some crimes are characterized as terrorism rather than ordinary
      offenses.
  - speaker: Paper Chaser
    printed_page: 122
    assertion: Accuses TRC of intrusive search, seizure, and surveillance measures
      beyond emergency regulations.
  - speaker: Terry L
    printed_page: 122
    assertion: Argues TRC military enforcement could be preferable to NURM street
      violence, a disputed comparison.
  - speaker: M O’S
    printed_page: 122
    assertion: Condemns the death penalty as a response to terrorist-inspired killings;
      the claim is polemical and alleges incidents involving detention and execution.
  - speaker: Cooney
    printed_page: 122
    assertion: Warns that provoking violence against URF/NURM could produce martyrs.
  - speaker: Cian Fear-Tearmainn
    printed_page: 122
    assertion: Denies that local security forces apply indiscriminate shoot-to-kill
      methods, calling their casualty rate low.
  - speaker: Jack O’Lantern
    printed_page: 123
    assertion: Speculates that unnamed Belfast Security Committee members include
      Danaan-mór princes.
  - speaker: Cooney
    printed_page: 123
    assertion: Sarcastically implies members of the O’Neill family have security influence.
  - speaker: unnamed interrupted account
    printed_page: 123
    assertion: Names Eoghan O’Neill as second son of the family and alleges he is
      an executive Security Committee member; the text is abruptly interrupted before
      completing a claim about his Path.
  - speaker: Moleman
    printed_page: 123
    assertion: Alleges TRC Reach Fuileach special units and combat mages exercise
      broad coercive powers in Belfast.
  - speaker: MacGuiness
    printed_page: 123
    assertion: Claims to be affiliated with the Cause, disputes TRC effectiveness,
      and describes members publicly disrupting official messaging. The historical
      text is political advocacy and does not independently establish the claimed
      activities.
  - speaker: Tommy Mac
    printed_page: 123
    assertion: Questions whether MacGuiness’s account is genuine; Cleasaiche replies
      that it could be fabricated.
  - speaker: Kev
    printed_page: 124
    assertion: Alleges Belfast residents sometimes submit crime reports to paramilitaries
      instead of official police.
  - speaker: Cleasaiche
    printed_page: 124
    assertion: Criticizes URF euphemisms for civilian killings and questions whether
      victims benefit from labels such as regrettable errors.
  - speaker: M O’S
    printed_page: 124
    assertion: Claims URF receives financial and cultural support at Glasgow Rangers
      football matches and criticizes the claimed British historical relationship.
  - speaker: Growler
    printed_page: 124
    assertion: Accuses NURM of racist killings of metahumans and alleges TRC indifference
      to those deaths.
  - speaker: Cian Fear-Tearmainn
    printed_page: 124
    assertion: Disputes Growler and cites January arrests of Sean O’Brien and Patrick
      Robinson with convictions on twelve murder counts; says TRC defenders pursue
      all murderers and terrorists.
  - speaker: Moleman
    printed_page: 124
    assertion: Claims media reports indicate an IVF schism between an even more aggressively
      racist tendency and a faction favoring cooperation with other groups.
  - speaker: Moleman
    printed_page: 125
    assertion: Suggests, without evidence, that the Spear of Trogan might be TRC Reach
      Fuileach personnel acting under false identities; this contrasts with the narrator’s
      explicit absence of witnesses.
