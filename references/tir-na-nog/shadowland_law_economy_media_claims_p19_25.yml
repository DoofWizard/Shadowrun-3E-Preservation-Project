  claims:
  - pages: '19'
    speaker: Cian Fear-Teammainn
    status: Named in-world partisan defense
    statement: 'Claims that national-interest petitions are rare and offers figures
      for TRC 2052 detentions/petitions: 54 petitions, 17 rejected; this is his cited
      figure, not independently corroborated statistics.'
  - pages: '19'
    speaker: Paper Chaser
    status: Named in-world allegation
    statement: Warns that applicants with prior convictions or inaccurate records
      may face legal-insurance charges as high as 10 times advertised prices.
  - pages: '20'
    speaker: Gleed
    status: Named in-world observation
    statement: Claims emergency vehicles arrive within ten minutes in major cities;
      not a guaranteed national response-time mechanic.
  - pages: '20'
    speaker: Analyzer
    status: Named in-world allegation
    statement: Claims public services can fail or be restricted in designated Special
      Regulation Zones of Ulster and north Connaught.
  - pages: '20'
    speaker: Cian Fear-Teammainn
    status: Partisan opinion
    statement: Defends the government health services in response to criticism.
  - pages: '20'
    speaker: Danny and Bloodbath
    status: Competing opinions
    statement: Disagree about social welfare, mental health and how the government
      treats disfavored residents; not narrator confirmation.
  - pages: '21'
    speaker: Analyzer
    status: Unverified interpretation
    statement: Suggests the national health system helps the government exercise social
      control.
  - pages: '21'
    speaker: Traveler
    status: Visitor opinion
    statement: Complains that affordable hotels may have poor equipment or amenities.
  - pages: '21'
    speaker: Sinead F
    status: Allegation
    statement: Warns of hotel telephone monitoring and loss of privacy.
  - pages: '21'
    speaker: Cian Fear-Teammainn
    status: Disagreement
    statement: Disputes assertions of blanket intrusive hotel surveillance.
  - pages: '22'
    speaker: Sinead F and Metal Mickey
    status: Political and street-level speculation
    statement: Debate police presence and visitor security limitations associated
      with city price information.
  - pages: '23'
    speaker: Taranis
    status: Unverified allegation
    statement: Suggests a nonstandard environmental activist network, EcoNet, offers
      access or alternatives to government Matrix infrastructure.
  - pages: '23'
    speaker: Scintillator
    status: Commercial solicitation within fiction
    statement: Advertises custom electronics and technical services; this is an in-world
      advertisement, not verified product availability.
  - pages: '23'
    speaker: Analyzer
    status: Technical interpretation
    statement: Notes Celtic/historical iconography in the Tir Matrix and contrasts
      it with standardized UMS imagery.
  - pages: '23'
    speaker: Analyzer
    status: Unverified estimate
    statement: Speculates about Rose of Tralee tourism crowds and an approximately
      50,000-punt endowment.
  - pages: '24'
    speaker: Sinead F
    status: Opinion
    statement: Criticizes official preference for highbrow cultural events and what
      she regards as exclusion of ordinary audiences.
  - pages: '24'
    speaker: Nikki the Greek
    status: Unverified allegation
    statement: Suggests festival trade traffic can conceal private distribution or
      smuggling; preserve as allegation, not proven commerce.
  - pages: '24'
    speaker: Traveler, Metal Mickey, Analyzer
    status: Separate in-world comments
    statement: Offer visitor reactions, law-enforcement warnings and event tips; none
