summary: Archival attributed_claim reference from the FICTIONAL Shadowrun sourcebook
  Tir na nÓg, published by FASA Corporation in 1993, FASA7211/source.fasa-7211, printed
  pp13–18 (physical PDF14–19). Reported sourcebook setting facts are distinguished
  from named in-world commentary; mechanical quantities remain source-period exact.
data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog: FASA7211
    source_id: source.fasa-7211
    edition: original and Second Edition Shadowrun-era sourcebook
    printed_pages: 13-18
    pdf_pages: 14-19
  section: Named Shadowland visitor and transport commentary; none of the following
    attributed claims is independently established by the book narrator merely because
    it appears in an in-world message.
  claims_by_printed_page:
  - page: 13
    speaker: Analyzer
    certainty: Personal editorial opinion
    claim: Responds to Niall O’Connor’s writing by offering the tourism-climate overview
      as a practical alternative for visitors.
  - page: 14
    speaker: Unidentified Shadowland interlocutors
    certainty: Contested reader views
    claim: Mock some government-managed travel conditions and O’Toole transportation
      dominance. Distinguish from narrator flight and ferry route tables.
  - page: 15
    speaker: Leech
    certainty: Named in-world allegation, not universal published fee schedule
    claim: Claims the implanted entry chip costs ¥5,000 to install and ¥3,000 to remove
      and is implanted close to a spinal ganglion.
  - page: 15
    speaker: Paper Chaser
    certainty: Named in-world allegation
    claim: Warns that permits and travel intentions may be used to restrict later
      destinations or journeys.
  - page: 15
    speaker: Metal Mickey
    certainty: Named in-world warning
    claim: Argues that attempting to bribe Garda or other officials can lead to detention.
  - page: 15
    speaker: Count Count
    certainty: Cryptic speculation
    claim: Alludes to a hidden Veil rather than supplying a documented public rule.
  - page: 15
    speaker: Crazy Maeve
    certainty: Political allegation
    claim: Criticizes what she depicts as a managed nationalist media narrative.
  - page: 16
    speaker: Torc Talk
    certainty: Unverified magical allegation
    claim: Describes a magical Veil and coastal constraints, claiming magical screening
      affects living creatures rather than technology; commentary contests this.
  - page: 16
    speaker: Fear-bratha
    certainty: Historical-language interpretation by named participant
    claim: Discusses archaic Irish currency terms including cumal, historically a
      designation for an enslaved woman; do not recast involuntary slavery as a voluntary
      service.
  - page: 16
    speaker: Cleasaiche and Siobhan Snakehead
    certainty: Responses/opinions
    claim: React to nationalist representations and currency commentary without establishing
      the disputed claims as official policies.
  - page: 16
    speaker: Sinead F
    certainty: Allegation
    claim: Claims official broadcaster influence and interference with other transmissions.
  - page: 17
    speaker: Paper Chaser
    certainty: Unverified market/patronage allegation
    claim: Alleges preferential transportation licensing for the O’Toole family.
  - page: 18
    speaker: Analyzer
    certainty: Allegation
    claim: Attributes rail ownership or control to the O’Tooles.
  - page: 18
    speaker: Cian Fear-Teammainn
    certainty: Direct disagreement with Analyzer
    claim: Counters that rail is administered by a public department rather than the
      O’Tooles.
  - page: 18
    speaker: Metal Mickey
    certainty: Allegation
    claim: Claims Transport Police officers patrol trains and discusses Mobmasters.
  - page: 18
    speaker: Mulligan
    certainty: Allegation
    claim: Warns of river police inspections and difficulties with charter journeys.
  source_fidelity_note: All assertions retain the named speaker and allegation status;
    none is adopted as real-world travel advice or proven account of actual Ireland.
  forward_status: Reviewed before FASA7212 Denver because its cataloged PDF cannot
    render; NOT an activated FASA7211 source, NOT contiguous page authorization, and
    does not advance Aztlan manifest/checkpoint.
framing: newsroom_neutral
