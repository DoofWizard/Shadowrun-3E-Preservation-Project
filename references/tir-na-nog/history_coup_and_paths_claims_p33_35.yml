data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: historical original/Second Edition compatibility
    printed_page_context: 33-35
    physical_pdf_context: 42-44
  claims:
  - p: 33
    speaker: Moleman
    claim: Accuses the O’Molloy family of having worked as assassins for British nobility,
      disputing the benign goodwill account; this is an in-world allegation.
  - p: 33
    speaker: Niall O’Connor
    claim: Attributes McGoldrick’s impeachment and subsequent transfer of power to
      Liam O’Connor’s political schemes, with Seamus O’Kennedy deployed as a popular
      spokesperson.
  - p: 33
    speaker: Terry L
    claim: Contends that Eamonn McCarthy was an ineffective puppet selected to be
      publicly replaced; it is political commentary, not proven personal motive.
  - p: 34
    speaker: Niall O’Connor
    claim: Alleges the Tir Republican Corps disguised propaganda operations as Ulster
      terrorist attacks; attributes the gradual constitutional seizure of influence
      to Liam O’Connor’s long planning, not to spontaneous popular consent.
  - p: 34
    speaker: Niall O’Connor
    claim: Believes Liam O’Connor was Walking a final spiritual Path and asserts he
      simply disappeared, without formally petitioning the Seelie Court; motives and
      current whereabouts remain unresolved.
  - p: 34
    speaker: Niall O’Connor
    claim: Suspects Danaan families anticipated Liam’s departure, bargained with Seamus
      O’Kennedy and John O’Molloy associates, and chose successors to avoid open family
      conflict; explicitly inference.
  - p: 35
    speaker: Traveler
    claim: Challenges Niall’s value-laden assessment of Tir society as objectively
      superior to outsiders.
  - p: 35
    speaker: Analyzer
    claim: Recognizes Niall’s awareness of his own prejudice, while highlighting the
      potential relevance of his account.
  - p: 35
    speaker: Niall O’Connor
    claim: Warns that certain Followers of the Paths identify other metatypes and
      races as inferior and might permit ethnic/racial persecution. The perceived
      doctrine and forecast are the dissident’s position, not narrator-endorsed real-world
      claims.
  - p: 35
    speaker: Cynic
    claim: Disputes Niall’s foreboding as apocalyptic overstatement.
  - p: 35
    speaker: Analyzer
    claim: Refers to Niall’s unpublished Paths file as a reason to investigate further;
      the complete claims of that file are not reproduced here.
  attribution_rule: Third-person source reporting distinguishes narrator allegations
    and named debate from established modern political facts.
  forward_status: Verified forward extraction during unresolved FASA7212 Denver source-integrity
