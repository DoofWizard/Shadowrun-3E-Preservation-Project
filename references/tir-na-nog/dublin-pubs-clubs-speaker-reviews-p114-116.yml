data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    publication_year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: Historical Shadowrun original/Second Edition-compatible material; not an inferred Third Edition conversion
    original_pdf_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: 114-116
    physical_pdf_pages: 123-125
  source_voice: Character posts in the 1993 fictional tabletop-book Shadowland corpus, not externally confirmed venue
    information.
  reviews:
  - speaker: M O’S
    venue: Archer’s
    claim: Describes mainstream, relatively inexpensive night dancing and social connections; repeats a self-described
      anti-non-elf entrance bias in listing, not an endorsement.
  - speaker: Narrator
    venue: Bar Flanagan
    claim: The source description highlights inexpensive lunches, seafood, potatoes, and a change from dining to nightlife
      and ceilidh dancing on Thursdays and Fridays.
  - speaker: Maire
    venue: Bloduedd’s
    claim: Claims a Welsh-interest club shares discriminatory attitude toward certain groups and speculates about particular
      affiliates; a speaker opinion rather than confirmed organization fact.
  - speaker: Cooney
    venue: Davy Byrne’s and Howl!
    claim: Associates Davy Byrne’s with Leopold Bloom and Joyce’s Ulysses, and ridicules Howl! and its claimed artistic
      ambitions.
  - speaker: Maire
    venue: EFG, Milligan’s and Moon
    claim: Criticizes EFG music as imitation English pop; says Milligan’s attracts young bands but is crowded and occasionally
      rowdy; describes Moon as a venue associated with secretive magicians.
  - speaker: Tommy Mac
    venue: Milligan’s
    claim: Jokes that one can be too old or too unimpressed with high-volume music; Cleasaiche separately warns that
      TRC watchers may be present.
  - speaker: Bokin’ Brian
    venue: Nesbitt & Enfield’s
    claim: Asserts that its dwarf managers maintain a selective non-elf clientele yet become loyal contacts after trust
      is gained; fictional social-identity discrimination reported without endorsement.
  - speaker: Maire
    venue: Rhythm Nation and Savoy
    claim: Says Rhythm Nation serves Dublin’s emerging Black-Irish population, with bright decor and a fashionable social
      scene; characterizes Savoy as elite youth nightlife.
  - speaker: Mulligan
    venue: Stag’s Head
    claim: Portrays the Stag’s Head as an affluent countryside-hunting and status-oriented meeting place.
  - speaker: Esprit de Corpse
    venue: McDermott’s
    claim: Says the bar attracts particular European social circles, offering an opinion about who visits rather than
      independently verifying membership.
  attribution_notice: A venue’s listing status, a speaker’s review, and allegations of discrimination or covert contacts
    remain separately identified.
