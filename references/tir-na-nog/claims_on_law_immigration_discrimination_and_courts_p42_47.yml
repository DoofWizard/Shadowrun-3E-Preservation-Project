headline: 'FICTIONAL Shadowrun tabletop RPG source: FASA Corporation Tir na nÓg (1993,
  FASA7211; historical original/Second Edition), source.fasa-7211; printed pp42-47/physical
  PDF51-56 — fictional speakers dispute law, punishment, emigration, discrimination
  and legal access'
summary: Source-reviewed fictional setting or game reference from Tir na nÓg, FASA
  Corporation, 1993, FASA7211/source.fasa-7211, printed pp42-47/physical PDF51-56.
  Distinguishes book-narrator claims, attributed in-world discussion and game-specific
