data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition_scope: historical Shadowrun original/Second Edition publication
    printed_pages: 42-47
    physical_pdf_pages: 51-56
  claims:
  - p: 42
    speaker: McGoohan
    claim: Alleges TRC may use privileged surveillance and bank records to prove claims
      against opponents; fictional social criticism, not a verified case.
  - p: 43
    speaker: Paper Chaser
    claim: Warns readers not to assume official weapons permits are realistically
      obtainable and describes enforcement restrictions; a character’s opinion, not
      legal advice.
  - p: 44
    speaker: Teague
    claim: Describes allegedly harsh cultural selection in immigration and social
      adjustment among applicants, distinguishing anecdote from the narrator’s policy
      text.
  - p: 44
    speaker: Paper Chaser
    claim: Alleges intrusive cultural and personal-screening procedures and a period
      of statelessness; these are unconfirmed as a universal practice.
  - p: 44
    speaker: Clan Fear-Tearmainn
    claim: 'Disputes Paper Chaser: claims more than 90% of probationers gain citizenship
      and defends selectivity.'
  - p: 44
    speaker: Leech
    claim: Speculates about unusual metatype expression and genetic/mana relationships
      in Tir, among expatriate populations; no causal genetic conclusion established.
  - p: 44
    speaker: Sinéad F
    claim: Reports a fine for polluting a stream in Tir, not established as an automatically
      applicable rule for all cases.
  - p: 44
    speaker: Paper Chaser
    claim: Claims Tir government copyright/heritage rules favor state economic interests;
      this is commentary distinct from narrator’s law description.
  - p: 45
    speaker: Sinéad F and Cleasaiche
    claim: Dispute cultural censorship of a fictional film’s violent and sexual imagery;
      source presents views on censorship rather than the film as factual evidence.
  - p: 45
    speaker: Paper Chaser
    claim: Reports protected cultural works list extends beyond Gaelic themes and
      includes satirical writing; not an exhaustive official catalog.
  - p: 45
    speaker: Metal Mickey
    claim: Alleges ritual-object licensing loopholes enable cheap imitations, a fictional
      commercial observation.
  - p: 45
    speaker: Paper Chaser and The Bog People
    claim: Debate emigration as capital control and reclamation of state-funded tuition
      or training costs; the tuition repayment idea is an allegation by Bog People,
      not described in narrator’s statute.
  - p: 45
    speaker: Julian Prancer
    claim: Expresses confusion about a fictional ban on Universal Brotherhood, an
      in-world opinion.
  - p: 46
    speaker: Skinner’s Rat
    claim: Alleges discriminatory hidden aptitude assessments bias employment toward
      elves.
    status: attributed allegation
  - p: 46
    speaker: Paper Chaser
    claim: Notes absence of affirmative action requirements despite formal anti-discrimination
      law; a commentator interpretation.
  - p: 46
    speaker: Siobhán Snakehead
    claim: Describes explicit anti-orc harassment toward a metatype target, recorded
      as hostility and discrimination by an in-world speaker, not a legitimate epithet
      or endorsed statement.
  - p: 46
    speaker: Analyzer
    claim: Calls the same discrimination overt rather than subtle.
  - p: 47
    speaker: Sinéad F
    claim: Criticizes sexist slang and attitudes and advocates against the male-centered
      political account.
  - p: 47
    speaker: Gumbling George, Cleasaiche
    claim: Dispute whether extraterritorial hazard law is acceptable; neither argument
      establishes its practical enforcement.
  - p: 47
    speaker: Paper Chaser, Tommy Mac, Sinéad F, Patriot
    claim: Disagree over whether the described legal system enables defendants to
      find adequate counsel and fund civil claims, with costs and government help
      contested.
  attribution_integrity: Allegations by commenters are not disguised as official policy;
    where government text and forum claim differ, the distinction is preserved.
  forward_indexing_note: Verified forward-unindexed record while predecessor FASA7212
    Denver remains source-integrity blocked. No source activation, authority to advance
    a main manifest, or page credit.
framing: newsroom_neutral
