  sites:
    -
      name: "Ballycastle"
      county: "Antrim"
      facts: "Coastal resort and Carrig-Usnach rock linked to Deirdre of the Sorrows and Children of Lir stories."
    -
      name: "Beaghmore"
      county: "Tyrone"
      facts: "Standing-stone circles aligned around a northeast axis pointing to midsummer sunrise; scholars once read them as astronomical timekeeper, but comments dispute this."
    -
      name: "Benaughlin"
      county: "Fermanagh"
      facts: "Hill with recently recut white-horse engraving; druid residents claim horse totem."
    -
      name: "Boa Island"
      county: "Fermanagh"
      facts: "Lough Erne island named for Badbha, ancient war-goddess; cemetery holds mysterious two-faced statue amid druidic worship lore."
    -
      name: "Carrickfergus Castle"
      county: "Antrim"
      facts: "Norman castle associated with Seamús Clatha McGuiness clan, medieval fair and Lughnasad celebrations."
    -
      name: "Castle Caldwell"
      county: "Fermanagh"
      facts: "Castle restoration by elven Duffy family, with unsettling rumors from speaker Sinéad F."
    -
      name: "Devenish Island"
      county: "Fermanagh"
      facts: "Old church and monastic remains; human biblical and Danaan traditions competing over ancient stones."
    -
      name: "Donegal Castle"
      county: "Donegal"
      facts: "O'Donnell family square-towered castle since sixteenth century."
    -
      name: "Doe Castle"
      county: "Donegal"
      facts: "Near Carrigart; associated with MacSwineys, MacDonnells and O'Neills, now held by MacDonnell relative."
    -
      name: "Dunclana Mourna"
      county: "Antrim"
      facts: "Legend places Finn MacCuill and poet Oisin's home below cliffs; marked low mound remains."
    -
      name: "Dunseverick Castle"
      county: "Antrim"
      facts: "Dál Riada historic fortress, rebuilt by O'Neill family after ancient road of Tara resurfaced during Awakening."
    -
      name: "Fiddlestone"
      county: "Fermanagh"
      facts: "Annual late-June fiddlers' festival; legend holds famous eighteenth-century fiddler's ghost offers musical talent for a price."
    -
      name: "Giant's Causeway"
      county: "Antrim"
      facts: "Basalt column formation; narrator says post-Awakening area has grown and gained height; legends link to Finn MacCuill, ceremonies and magical forces."
    -
      name: "Giant's Ring"
      county: "Down"
      facts: "Chambered grave amid grass embankment six kilometers south of Belfast; local human groups disturbed rituals without violence."
    -
      name: "Glenaan"
      county: "Antrim"
      facts: "Stone circle connected to Oisin; guarded by Duffy family-associated mages and druids."
    -
      name: "Glenarm Castle"
      county: "Antrim"
      facts: "Ancient MacDonnell earls' seat, clan disputes with O'Neills."
    -
      name: "Grianan of Aileach"
      county: "Donegal"
      facts: "Hillfort with triple concentric ramparts, former O'Neill seat damaged in 1101; local legend of buried sleeping heroes."
    -
      name: "Hanging Rock"
      county: "Fermanagh"
      facts: "Limestone caves with folkloric underground warrens and no reliable corroboration of paranormal creatures."
    -
      name: "Kilroot"
      county: "Antrim"
      facts: "Commentator Gully links local ruined church to Jonathan Swift and commemorative Baby Eaters celebration."
    -
      name: "Knockmany"
      county: "Tyrone"
      facts: "Cairn of Aine, Queen of Oriel, with carved concentric circles and other designs; nearby Clogher village stands on Rathmore former royal grounds."
    -
      name: "Shane's Castle"
      county: "Antrim"
      facts: "O'Neill clan castle with legendary Black Head talisman; clan line linked to artifact."
    -
      name: "Tullaghoge Rath"
      county: "Tyrone"
      facts: "O'Neill crowning place, throne smashed by British Lord Deputy Mountjoy in 1595, family Loughry House nearby."
    -
      name: "White Island"
      county: "Fermanagh"
      facts: "Ruined church has eight mysterious statues; six Christian, one unfinished and an eighth sheela-na-gig female exhibition carving; origin disputed."
  attributed_shadowtalk:
    -
      speaker: "Moleman"
      page: 97
      claim: "Alleges Protestant paramilitary activity at Ballykelly and a government SRZ near army base."
    -
      speaker: "CDF"
      page: 97
      claim: "Counters Beaghmore astronomy account with in-world claim of ancient magical power."
    -
      speaker: "Griswold"
      page: 97
      claim: "Alleges Fermanagh is home to Fomorians, dangerous freshwater creatures and escaped burrowing beavers."
    -
      speaker: "Sinéad F"
      page: 98
      claim: "Alleges Castle Caldwell Duffy relatives display unusual physical powers and cyberware and that something strange occurs there."
    -
      speaker: "Sinéad F"
      page: 98
      claim: "Accuses Seamus O'Donnell of violent cruelty and hints people have disappeared in Donegal Castle dungeons; these are unverified in-world allegations, not established narrator fact."
    -
      speaker: "R O'Brady and Magister"
      page: 98
      claim: "Debate Giant's Causeway's changing magical formation and dangers; Magister warns against treating its power casually."
    -
      speaker: "Paisleyman"
      page: 98
      claim: "Threateningly jokes future Giant's Ring rituals might become violent; statement is separate from narrator reporting no past violence."
    -
      speaker: "R O'Connor"
      page: 99
      claim: "Says Hanging Rock has no reliable paranormal observations despite legend."
    -
      speaker: "Cleaseaiche"
      page: 99
      claim: "Warns young visitors away from Hanging Rock."
    -
      speaker: "Mulligan"
      page: 99
      claim: "Relays ominous clan talisman lore about Shane's Castle."
