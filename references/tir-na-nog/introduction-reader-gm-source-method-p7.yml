data:
  publication_provenance:
    title: Tir na nÓg
    publisher: FASA Corporation
    catalog_number: FASA7211
    copyright_year: 1993
    source_id: source.fasa-7211
    printed_page: 7
    pdf_page: 8
    game: Shadowrun historical fictional tabletop role-playing game
  narrator_source_scope:
    setting: Fictional transformed Ireland, named Tir na nÓg or Tir, within Shadowrun.
    sections_described:
    - history
    - culture
    - law
    - politics
    - economics
    - crime
    - major cities
    - setting marvels
    maps: Maps of fictional provinces and counties and of Dublin and Belfast; also describes magical power
      lines.
  game_master_rules_scope:
    ways_and_paths: The book warns its Tir-specific occult game system may destabilize game balance and
      recommends that gamemasters study it before use.
    gamemaster_section: Contains game information for using the sourcebook in a Shadowrun adventure, including
      Tir druids, paranormal animals, weapons and equipment.
    slang_section: End-of-book notes compare Tir slang with North American slang.
  source_and_claim_attribution:
    presentation: Setting material is framed as an in-world electronic document with reader postings.
    reader_comment_status: Comments from fictional characters may corroborate, extend, correct, or contradict
      the apparent main text; the book explicitly warns these participants are not always accurate.
    principal_narrator_caveat: The primary fictional source for Tir information is also characterized
      as one biased source, not necessarily an objective observer.
    gm_discretion: Gamemasters may decide for their own games which in-world statements are true, misleading
      or mistaken; do not promote commentary automatically into canon.
  real_world_distinction:
    scope: The authors state the setting treatment is not serious commentary about actual Ireland and
      no offense is intended.
  edition_and_companions:
    compatibility: The book explicitly states it works with both original and Second Edition Shadowrun
      rules.
    optional_related_books:
    - The Grimoire
    - The Grimoire, Second Edition
    - Tir Tairngire
    - The London Sourcebook
    qualification: These books are helpful supplemental references, not required to use Tir na nÓg.
  forward_status: Reviewed as independent candidate for future authorized FASA7211 transition; presently
    unindexed and grants zero contiguous printed-page progress.
framing: newsroom_neutral
