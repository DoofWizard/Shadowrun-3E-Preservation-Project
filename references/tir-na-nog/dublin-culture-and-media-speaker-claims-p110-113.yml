  comments:
  - speaker: Cooney
    printed_pages: '111'
    claim: Alleges heritage restrictions led some museums to conceal exhibits officials consider unacceptable, while
      private contacts can lead to access.
  - speaker: Traveler
    printed_pages: '111'
    claim: Jokes about possible illicit museums, interrogating Cooney’s statement rather than establishing such venues
      exist.
  - speaker: Paper Chaser
    printed_pages: '111'
    claim: States ticket scalpers bulk-purchase seats for Abbey/Olympia/Gala shows and resell at inflated prices; separately
      says the Fíld Center delayed because contracting elven-only labor left dangerous and dirty labor to humans and
      other metahumans, leading to disputes and sabotage. These are poster claims.
  - speaker: Siobhan Snakehead
    printed_pages: '111'
    claim: Derides interest in avant-garde theatre.
  - speaker: De Selby
    printed_pages: '111'
    claim: Defends theatrical work as an indirect way to tell truths, framed as a viewpoint.
  - speaker: Paisleyman
    printed_pages: '111'
    claim: Disclaims having a say on the Gallery Éireann art debate.
  - speaker: Paper Chaser
    printed_pages: '112'
    claim: Describes official gambling licensing and an illegal-gambling enforcement unit, while alleging unlicensed
      operators and sports betting support extremist groups.
  - speaker: Anonymous
    printed_pages: '112'
    claim: Alleges enforcers sometimes physically injure illegal bookmakers and asserts unlicensed gambling finances
      groups opposed to the state; no narrator confirmation.
  - speaker: Galway Bob
    printed_pages: '112'
    claim: Attributes an underground adult entertainment trade to the city and warns clients of danger in lower-class
      districts; this is an in-world observation, not an endorsement or real-world guidance.
  - speaker: Cooney
    printed_pages: '113'
    claim: Mocks junior minister Kieran Fitzgerald and claims he is only interested in celebrity proximity.
  - speaker: Bokin’ Brian
    printed_pages: '113'
    claim: Prefers limited but watchable broadcast channels under Kieran Fitzgerald over earlier sensationalist shows.
  - speaker: Paper Chaser
    printed_pages: '113'
    claim: Describes a 2048 high-court decision under which owning broadcast reception equipment remained permitted but
      operating it was forbidden; alleges foreign broadcasts continue.
  - speaker: Tommy Mac
    printed_pages: '113'
    claim: Alleges Hammer Party projected unsanctioned satellite broadcasts around Europe during a FÚ-TV Tour and says
      the TRC stopped their fourth Cork concert; presenter claims the musicians and Lipton Group created the satellite
      program and the case was dismissed after public outcry.
  - speaker: Sinéad F
    printed_pages: '113'
    claim: Praises the underground performance publication Inflame for reviewing local drama and poetry and discreet
      distribution at fringe performances.
  - speaker: Cian Fear-Tearmainn
    printed_pages: '113'
    claim: Warns that possessing the underground Inflame newspaper allegedly violates the Tír cultural heritage laws.
  no_external_inference: Exact speaker categories and uncertainty remain confined to the fictional published discussion.
