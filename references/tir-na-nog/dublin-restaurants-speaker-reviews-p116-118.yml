    printed_pages: 116-118
    physical_pdf_pages: 125-127
  source_voice: All opinions and allegations belong to named fictional sourcebook posters, not to authoritative narrator
    description or present-day guidance.
  reviews:
  - speaker: Gorb Monster
    venue: Bananas
    claim: Praises the restaurant’s lively decor and traditional Tír/Irish dishes, and calls it a social meeting place.
  - speaker: Maire
    venue: Byrd’s
    claim: Criticizes the venue as pretentiously intellectual and mocks its references to literary theory.
  - speaker: Maire
    venue: The Captain’s
    claim: Condemns the seafood preparation and claims people seeking Dublin underworld contacts socialize there.
  - speaker: Bokin’ Brian
    venue: El Mocambo
    claim: Says adventurous cuisine attracts young professionals and people seeking prestigious company.
  - speaker: Bokin’ Brian
    venue: Fat Paddy’s
    claim: Identifies it as a reasonably priced eatery popular among trolls.
  - speaker: Fondler
    venue: Monaghan’s Grill
    claim: Describes the restaurant as favored by media personnel and alleges off-record gossip is exchanged when drinks
      encourage disclosure.
  - speaker: Gorb Monster
    venue: Old Liffey Steps
    claim: Says Irish humans who identify with the Keepers of Our Land frequent the restaurant and asserts the chef is
      especially skilled with venison.
  - speaker: Cleasaiche
    venue: Old Liffey Steps
    claim: Rejects a preceding rumor as false, stating the chef is merely a shepherd.
  - speaker: Taranis
    venue: Woodward & Bean’s
    claim: Calls the clientele educated literary figures and suggests it is useful for discussing Irish cultural affairs
      with contacts.
  - speaker: Maire
    venue: Zoviet
    claim: Praises the Soviet-themed restaurant’s changing menu and dumplings while using sardonic stereotypes.
  - speaker: Gorb Monster
    venue: Woodward & Bean’s
    claim: Claims its patrons are discerning readers and know their wines; self-mocking.
  speaker_vs_narrator: No allegation of covert business, identity affiliation or restaurant quality is promoted to a
    verified real-world fact.
