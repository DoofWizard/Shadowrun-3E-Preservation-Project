      description: "Full-page monochrome framed night landscape with a slender ragged pole-like figure in tall grass below a crescent moon, hills and dense hatching; no named identity printed."
  sites:
    -
      site: "Ballaghmore Castle"
      county: "Laois"
      facts: "Former FitzGerald fort; known for a sheela-na-gig stone carving representing a woman exposing her genitals, treated by some visiting couples as a fertility symbol."
    -
      site: "Bannow"
      county: "Wexford"
      facts: "Norman-era coastal settlement gradually swallowed by shifting sands; narrator reports rumors that druids hasten the sand movement."
    -
      site: "Browne's Hill Dolmen"
      county: "Carlow"
      facts: "Described as the Tir's largest capstone dolmen and a magical focus; tradition says stones weigh over one hundred tonnes. See Cairn Lines, printed p100."
    -
      site: "Clonmacnoise"
      county: "Offaly"
      facts: "548-founded monastery by Shannon, historic pilgrimage; Order of Sylvester administers ruins and tourist destination; celebration linked to St Ciaran's feast September 12."
    -
      site: "Donnelly's Hollow"
      county: "Kildare"
      facts: "Tradition associates clearing with Donnelly's 1815 boxing victory over George Cooper, and illegal modern wrestling and boxing."
    -
      site: "Dunganstown Castle"
      county: "Wicklow"
      facts: "Eoghan O'Byrne is rebuilding a family seat six miles south of Wicklow; used for O'Byrne political gatherings and heavily secured."
    -
      site: "Dunmore Cave"
      county: "Kilkenny"
      facts: "Cave chambers seven miles north of Kilkenny; narrator recounts a Viking raid killing nearly a thousand people, and local ghost/water-spirit traditions."
    -
      site: "Durrow"
      county: "Offaly"
      facts: "Relics of seventh-century monastery and illuminated Book of Durrow remain at a cross, stones, well."
    -
      site: "Ferbane"
      county: "Offaly"
      facts: "Peat bog landmarks include ruined buildings, churches and ancient stones."
    -
      site: "Glendalough"
      county: "Wicklow"
      facts: "Seven old churches and a monastery in two-lake valley; hermits inhabit ruins and rumors place Fomorians nearby."
    -
      site: "Graiguenamanagh"
      county: "Kilkenny"
      facts: "Duiske Cistercian abbey and ancient church; burial figures and local legends."
    -
      site: "Hill of Allen"
      county: "Kildare"
      facts: "Legend names seat of Finn MacCuill; geometric earthworks form nine-mile equilateral triangle with Naas and Knokcaulin."
    -
      site: "Kells"
      county: "Kilkenny"
      facts: "Medieval monastery largely founded atop earlier pagan site."
    -
      site: "Kilkenny Castle"
      county: "Kilkenny"
      facts: "Butlers of Ormonde fortress built 1195; prominent Butler branch resides."
    -
      site: "Leap Castle"
      county: "Offaly"
      facts: "Restored by O'Carroll family; reputation as haunted by two dozen ghosts is presented as local belief."
    -
      site: "Motte Stone"
      county: "Wicklow"
      facts: "Glacial boulder above Avoca, linked in tradition to ancient giant; part of cairn lines."
    -
      site: "Punchestown"
      county: "Kildare"
      facts: "23-foot standing stone and burial chamber within racecourse grounds."
    -
      site: "Rath of Mullaghmast"
      county: "Kildare"
      facts: "Stone Age fort west of Ballitore, site of 1597 massacre; local legend alleges periodic ghost of Garret Óg FitzGerald."
    -
      site: "Reban Castle"
      county: "Kildare"
      facts: "Thirteenth-century ruins over older Ptolemy-mapped site; narrated leshy gathering and rumors of guarding unknown object."
    -
      site: "Slieve Bloom"
      county: "Laois"
      facts: "Glendine Gap and Wolftrap Mountain described as ancient, mana-rich sites; Munster Road crosses range."
    -
      site: "Woodenbridge"
      county: "Wicklow"
      facts: "Gold prospects under Croghan Mountain and NSGchemical facility; chemical spillages reportedly yellowed valley grass."
  attributed_shadowtalk:
    -
      speaker: "Traveler"
      printed_page: 85
      claim: "Questions how a dolmen weighing more than one hundred tonnes could have been moved."
    -
      speaker: "Taranis"
      printed_page: 85
      claim: "Evades the question of the dolmen's origin."
    -
      speaker: "M O'S"
      printed_page: 85
      claim: "Claims will-o'-wisps at Ferbane festivals signify spirits and selection for a dance."
    -
      speaker: "Mulligan"
      printed_page: 85
      claim: "Dismisses the festival claim with a hostile joke."
    -
      speaker: "Leech"
      printed_page: 85
      claim: "Comments that bare-knuckle fights persist in rural areas."
    -
      speaker: "Mulligan"
      printed_page: 86
      claim: "Claims the cross-legged knight effigy at Graiguenamanagh rises and walks intermittently."
    -
      speaker: "Taranis"
      printed_page: 86
      claim: "Attributes power at Hill of Allen to demolished nineteenth-century folly."
    -
      speaker: "Mr. Manchester"
      printed_page: 86
      claim: "Jokes that Leap Castle ghosts are due to government bounty on banshees."
    -
      speaker: "Mulligan"
      printed_page: 86
      claim: "Alleges a group of eleven hermetic elves is mapping Slieve Bloom underground caves using elementals."
    -
      speaker: "Slater"
      printed_page: 86
      claim: "Responds skeptically to Mulligan's proposed disguise."
    -
      speaker: "Michael"
      printed_page: 86
      claim: "Attributes environmental damage to NSGchemical and expresses concern over future prospectors."
