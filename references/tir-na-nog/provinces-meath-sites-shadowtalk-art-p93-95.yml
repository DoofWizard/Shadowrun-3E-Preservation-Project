  places:
    -
      name: "Annaghmakerrig House"
      county: "Monaghan"
      facts: "Former Sir Tyrone Guthrie residence, now Bardic School operated by Order of Brigid; sculpture, marble interior and strong security; acceptance prestigious."
    -
      name: "Athlone"
      county: "Meath"
      facts: "O'Connor castle guarding Shannon River ford and links between Meath and Connaught."
    -
      name: "Brugh na Boinne"
      county: "Meath"
      facts: "At least fifteen passage graves, notably Newgrange, Knowth, Dowth; burial sites under O'Connor family jurisdiction; visitors must obtain special permit from Lord Diarmuid O'Connor."
    -
      name: "Clough Ougter"
      county: "Cavan"
      facts: "Ancient O'Reilly castle later transferred as marriage settlement in 2052 between Tuam O'Connor and Raine O'Reilly; in-world O'Connor stronghold."
    -
      name: "Cooley"
      county: "Louth"
      facts: "Sacred landscape and elven pilgrimage sites connected to the Táin Bó Cúailnge."
    -
      name: "Finn MacCuill's Fingers"
      county: "Cavan"
      facts: "Standing stones on Shantemon Hill; earlier Breffni coronation site; no remaining source-described magical power."
    -
      name: "Hill of Tara"
      county: "Meath"
      facts: "Heavily controlled, requires permit from Lord Diarmuid O'Connor, including personal consent for viewing or touching the Liahl Fail stone; frequent touching has eroded its surface."
    -
      name: "Inchcleraun"
      county: "Longford"
      facts: "Island at north of Lough Ree; Fergas and Queen Medb legend, marked stone and pilgrim destination."
    -
      name: "Kells"
      county: "Meath"
      facts: "Cormac MacArt-associated seat and early Saint Columba-linked Christian history; restored castle is an O'Molloy residence."
    -
      name: "Killeshandra"
      county: "Cavan"
      facts: "Festival of the Lakes each June includes music, dancing, children's fest and boat racing."
    -
      name: "Lough Derravaragh"
      county: "Meath"
      facts: "O'Dunn family lands and High Steward's seasonal seat; Children of Lir swan legend."
    -
      name: "Slane Castle"
      county: "Meath"
      facts: "Built 1780; residence of Foreign Secretary Samuel O'Kennedy, near Slane druidic festival hill."
  attributed_shadowtalk:
    -
      speaker: "Cullen J"
      page: 94
      claim: "Accuses elven wardens of fatally shooting human trespassers at Dun a Rí and closing formerly open parkland."
    -
      speaker: "M O'S"
      page: 94
      claim: "Disputes Cullen J's framing and claims those killed committed deer poaching, destroyed O'Kennedy beech trees, and resisted arrest while armed."
    -
      speaker: "Stumbler"
      page: 94
      claim: "Argues the Liahl Fail's claimed power rests in sacred and emotional symbolism rather than a unique physical stone; explicitly speculative magical interpretation."
    -
      speaker: "R O'Brady"
      page: 95
      claim: "Discusses rival O'Kennedy and O'Connor demands that the Tir's spiritual capital be at Uisneach or Tara."
    -
      speaker: "Cooney"
      page: 95
      claim: "Mocks the dispute."
    -
      speaker: "Analyzer"
      page: 95
      claim: "Presents the rivalry as reflecting uncertainty over the governing families' roles and comments that R is a woman."
  other_site_claims:
    -
      site: "Dun a Rí"
      county: "Cavan"
      status: "Disputed elven restriction of former public park; claims of fatal shootings disputed by named speakers, with no narrator resolution."
    -
      site: "Uisneach"
      county: "Meath"
      status: "Separate competing claim as spiritual and government power center argued for by O'Kennedy faction; not settled by this excerpt."
  artwork:
    -
      printed_page: 93
      physical_pdf_page: 102
      description: "Large black-and-white drawing of carved upright stone monument amid grass, showing knotwork and banded spiral motifs."
    -
      printed_page: 95
      physical_pdf_page: 104
      description: "Large framed black-and-white vertical drawing of tall standing stone with jagged high top against stylized sky and ground."
  forward_status: "Verified source-reviewed forward record; not indexed as authoritative contiguous source coverage."
