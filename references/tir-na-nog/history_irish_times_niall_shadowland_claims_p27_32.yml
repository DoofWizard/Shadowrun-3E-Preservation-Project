data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog: FASA7211
    source_id: source.fasa-7211
    edition: original and Second Edition Shadowrun-era sourcebook
    printed_pages: 27-32
    pdf_pages: 28-33
  chapter: HISTORY — Niall O’Connor’s contested political narration, fictional Irish
    Times editorial, and Shadowland debates.
  niall_author_role: Niall O’Connor (of Meath), an exiled fictional Sidhe dissident
    and self-identified partisan, is explicit narrator. His assessments about responsibility,
    ethnic politics, ecological claims and secret plans must not be flattened into
    objective history.
  selected_claims:
  - printed_pages: 27–28
    speaker: Niall O’Connor
    kind: first-person historical interpretation
    statement: Attributes Ireland’s modern conflicts to partition, repression, rival
      nationalisms and British/Republican political choices; declares a personal interest
      in how Danaan rule emerged.
  - printed_pages: 28–29
    speaker: Niall O’Connor
    kind: source-period alternate-history account
    statement: Ascribes VITAS, transformations and social polarization to competing
      political efforts during the Awakening; his population figures are presented
      in separate timeline record with values intact.
  - printed_pages: '29'
    speaker: In-world Irish Times editorial, dated 17 September 2011
    kind: fictional publication viewpoint within the story
    statement: Portrays some societal response to elven and dwarven children in a
      religiously traditionalist and discriminatory rhetoric; the quoted hostility
      represents an in-world editorial position, not a factual judgment on metatypes
      or contemporary people.
  - printed_pages: '29'
    speaker: Moynihan
    kind: hostile partisan response
    statement: Expresses anti-elven prejudice in a way other characters challenge;
      preserve the target and direction of the bias as an allegation, not as an endorsed
      description.
  - printed_pages: '29'
    speaker: Cebha
    kind: political or moral rejoinder
    statement: Argues for restraint rather than wholesale blame or retaliation amid
      elven/metahuman disputes.
  - printed_pages: '29'
    speaker: Analyzer
    kind: named fictional commentary
    statement: Comments skeptically on reported narratives of government action and
      popular religious explanations; does not independently establish motives.
  - printed_pages: 30–31
    speaker: Niall O’Connor
    kind: partisan reconstruction
    statement: Depicts Liam O’Connor and Republican factions as maneuvering toward
      institutional control; maintains a distinction among Official and Provisional
      wings, government agencies, and security personnel.
  - printed_pages: '31'
    speaker: Shadowland participants, various
    kind: disputes/observations
    statement: Offer competing interpretations of IRA membership, elven politics and
      public scandals; positions should not be treated as a single agreed community
      view.
  - printed_pages: 31–32
    speaker: Niall O’Connor
    kind: allegation of coordinated political scandal management
    statement: Claims certain scandals and their disposition were used to accelerate
      reform and centralize Danaan influence, tying elements to Liam O’Connor and
      Seamus O’Kennedy. The underlying percentages, allegation, and purported intent
      remain distinct.
  - printed_pages: '32'
    speaker: Niall O’Connor
    kind: historical ideological account
    statement: Describes the institutional Catholic Church’s reactions to Awakening/metatypes
      in fictional history and a decline in religious support after scandals, including
      accusations of coerced exploitation and a bishop’s suicide; not a claim about
      actual present-day clerics.
  not_real_world_reportage: All Shadowrun geopolitical projections after 1993 are
    invented; any real names or historical inspirations remain source-specific narrative,
    not evidence of those individuals’ later actions.
  forward_status: Reviewed before FASA7212 Denver because its cataloged PDF cannot
    render; NOT an activated FASA7211 source, NOT contiguous page authorization, and
    does not advance Aztlan manifest/checkpoint.
framing: newsroom_neutral
