  source_voice: Named in-world allegations are NOT narrator-confirmed services or advice about actual retailers.
  comments:
  - speaker: Zeitguest
    venue: Brendan’s
    claim: Praises its range of fine wine near the Four Courts, while noting wealthy corporate and legal customers.
  - speaker: Moleman
    venue: Éireann-Tír Tours
    claim: Says Brigid O’Toole can arrange complex trips and permits but insinuates coercive favors and high prices;
      claimed confidential arrangements are not independently verified.
  - speaker: Cleasaiche
    venue: Plunkett’s
    claim: Calls it a toy shop with novelty goods and rumors of potential runner contacts, with no factual assertion
      that the proprietor knowingly facilitates illicit activity.
  - speaker: Paper Chaser
    venue: Sharkey’s Fine Books
    claim: Approves its book collection while criticizing the proprietor’s unwillingness to sell modern electronic cataloging
      technology.
  - speaker: Taranis
    venue: Tighe’s
    claim: Alleges a public artifact shop conceals commissioned talisman work through Hermetic Services and that state
      agents impersonate clients; a poster’s contested claim, not an endorsed practice.
  - speaker: O’Brien
    venue: Tighe’s
    claim: Warns of recent Garda crackdowns and describes risk of engagement with black-market traders, emphasizing that
      strangers face suspicion.
  policy: Alleged wrongdoing or coercion remains differentiated from consensual ordinary commerce; no actionable real-world
    guidance.
