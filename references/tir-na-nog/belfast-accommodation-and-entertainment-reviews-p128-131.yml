data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: Historical original/Second Edition-compatible; no inferred Third Edition
      conversion
    source_pdf_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: 128-131
    physical_pdf_pages: 137-140
  source_context: All entries below summarize attributed fictional Shadowland posts,
    not narrator-verified business facts. Descriptions of sectarian prejudice, coercion
    and violent crime are historical Shadowrun fiction, not contemporary allegations.
  reviews:
  - speaker: Cooney
    printed_page: 128
    venue: Europa Hotel
    claim: Alleges repeated explosions and bomb scares at this hotel; is sharply critical
      of its suitability for visitors.
  - speaker: M O’S
    printed_page: 128
    venue: Europa Hotel
    claim: Suggests that authorities monitor wealthy guests who can afford Europa
      accommodation.
  - speaker: Anonymous
    printed_page: 128
    venue: Hartsglen Hotel
    claim: Says the cheap-hotel proprietor sells guns and fulfills requests; refuses
      to confirm whether a guest has ever stayed there.
  - speaker: Cooney
    printed_page: 128
    venue: McBride’s
    claim: Identifies it as a low-question accommodation option and alleges the manager’s
      father was kidnapped by NURM and never recovered despite the family’s efforts.
  - speaker: M O’S
    printed_page: 128
    venue: The Rowan Lodge
    claim: Claims it is a Protestant-run hotel and possible TRC front, advising against
      its use; Slievan replies that locals consider it genuine.
  - speaker: Pale James
    printed_page: 130
    venue: La Dolce Vita
    claim: Calls the establishment a high-priced French restaurant hit by one bombing
      but portrayed as comparatively safe; uses a safety judgment, not an objective
      guarantee.
  - speaker: Cooney
    printed_page: 130
    venue: La Dolce Vita
    claim: Alleges senior occupation-security figures have patronized the restaurant;
      Barry C retorts.
  - speaker: Tommy Mac
    printed_page: 130
    venue: The Eglantine Tavern
    claim: Calls it a student hangout and implies access to BTL chips; Cooney corrects
      his wording and mocks his discretion.
  - speaker: Máire
    printed_page: 130
    venue: Midnight and Black
    claim: Describes a post-Gothic clientele, dark novelty cocktails and customers’
      careful handling of dangerous wartime remnants in the venue.
  - speaker: Shaz
    printed_page: 130
    venue: Moral Turpitude
    claim: Praises the dance bar, bass-heavy music and its repeatedly interrupted
      operating history; Cooney responds with a disparaging remark about the reviewer.
  - speaker: Tommy Mac
    printed_page: 130
    venue: Opening Shortly
    claim: Mockingly describes the unfinished decor, trestle tables, ladders and visibly
      uncomfortable staff.
  - speaker: Deb
    printed_page: 131
    venue: Opening Shortly
    claim: Disagrees, praising the new venue after school breaks; Cleasaiche jokes
      about the previous poster’s question.
  - speaker: Anonymous
    printed_page: 131
    venue: Paddy’s Bar
    claim: Describes the tavern as hardline Protestant and alleges NURM members periodically
      demand money or intimidate patrons.
  - speaker: Moleman
    printed_page: 131
    venue: Stephenson’s
    claim: Says government clerks and officials patronize the restaurant and criticizes
      the owner’s elite associations.
  - speaker: Moleman
    printed_page: 131
    venue: The Union Inn
    claim: Claims this UUPP social headquarters has exceptional physical security,
      exclusionary admission practices and private meetings with visitors of diverse
      origins; the activity behind closed doors remains unknown.
  - speaker: Kev
    printed_page: 131
    venue: Apples & Pears
    claim: Notes weekend dancing and live bands, including Hammer Party, reportedly
      signed to a recording contract.
  - speaker: Leech
    printed_page: 131
    venue: Zhivago’s
    claim: Describes a mixed clientele including college professors, artists, sex
      workers, corporate secretaries and possible hermetic mages and deckers; the
      group identities are a speaker observation, not certified.
  - speaker: Padraig
    printed_page: 131
    venue: Halloran’s Car Parts
    claim: Alleges the proprietors can arrange local paramilitary muscle for violent
      work while selling ordinary automobile parts; this is a fictional insinuation,
      not instructions to recruit anyone.
  - speaker: GG
    printed_page: 131
    venue: Kelly’s
    claim: Claims a guarded basement workshop conducts extensive surgery and cybernetic
      repairs; the speaker does not know how entrance is gained.
  - speaker: Growler
    printed_page: 131
    venue: Rowney & McGill
    claim: Says Phil Knighton sells ironware, tools and household goods and knows
      local ork and dwarf communities.
