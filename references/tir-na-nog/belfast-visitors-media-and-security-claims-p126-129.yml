data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: Historical original/Second Edition-compatible; no inferred Third Edition
      conversion
    source_pdf_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: 126-129
    physical_pdf_pages: 135-138
  source_context: Fictional Shadowrun-setting material from a published tabletop RPG.
    Distinguish book-narrator descriptions, in-world speakers’ allegations and speculation;
    no claims about real contemporary Belfast.
  genre: In-world Shadowland messages and named responses, distinguished from the
    sourcebook narrator.
  speaker_posts:
  - speaker: Moleman
    page: 126
    claim: Warns that patrol security ratings can fluctuate sharply after dark.
  - speaker: Billy Whiteside
    page: 126
    claim: Describes street-gang competition for territory and intimidation in West
      Belfast; this represents a gang member’s self-interested boast, not endorsed
      guidance.
  - speaker: M O’S
    page: 127
    claim: Names Whitesiders, 8-Balls, Lovers, Stormriders, Orange Sword, Paisley
      Boys, Potato Junkies, Firing Squad and Murphys in connection with neighborhood
      violence.
  - speaker: Cooney
    page: 127
    claim: Sarcastically criticizes how visible security barriers and checks affect
      pedestrians.
  - speaker: Growler
    page: 127
    claim: Says Belfast has no metro because insurgents would attack it; the allegation
      is not independently established.
  - speaker: Cooney
    page: 127
    claim: Claims ordinary Belfast visitors struggle to obtain permits without wealth
      or major corporate contracts.
  - speaker: Slievan
    page: 127
    claim: Defends forceful TRC policing while conceding harsh treatment; his comment
      contrasts others’ criticism.
  - speaker: M O’S
    page: 128
    claim: Says a NURM bombing of the tourist office, motivated by claims about elven
      employment, caused temporary relocation from 53 Castle Street to 45 Castle Street,
      with plans to reopen in spring 2055.
  - speaker: Traveler
    page: 128
    claim: Questions the danger of Belfast emergency medical treatment.
  - speaker: M O’S
    page: 128
    claim: Answers that the city’s humor is dark and the hospitals have extensive
      injury experience.
  - speaker: Cooney
    page: 128
    claim: Complains the Europa Hotel is repeatedly damaged and evacuated following
      bomb scares.
  - speaker: M O’S
    page: 128
    claim: Suggests that authorities monitor well-off Europa Hotel guests.
  - speaker: Cooney
    page: 128
    claim: Offers allegations about an abducted innkeeper associated with McBride’s;
      the in-world account is incomplete and not confirmed.
  - speaker: M O’S
    page: 128
    claim: Suspects Rowan Lodge is Protestant-aligned and may be a TRC-related front;
      Slievan counters that it is legitimate.
  - speaker: Slievan
    page: 129
    claim: Argues visitors can find Belfast culture and nightlife despite conflict.
  - speaker: Cooney
    page: 129
    claim: Contradicts that optimistic assessment and cites attacks on residents.
  - speaker: Mahoney
    page: 129
    claim: Mentions abandoned Entries locations and suggests some locals can help
      visitors find unconventional goods or services.
  - speaker: Slievan
    page: 129
    claim: Claims a URF attack outside Linenhall Tavern killed 37 civilians and injured
      nearly 50 deaf children, and alleges the Belfast Telegraph shifted focus to
      a school-textbook issue rather than the bombing. This is explicitly a speaker
      allegation, not certified casualty data.
  - speaker: Cleasaiche
    page: 129
    claim: Responds to criticism by describing government restrictions and underground
      political opposition.
