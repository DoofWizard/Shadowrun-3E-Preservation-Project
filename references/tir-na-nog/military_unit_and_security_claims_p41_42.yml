  claims:
  - speaker: Cleasaiche
    printed_page: 41
    allegation: Initially stereotypes Reach Fuileach members as ceremonial, then faces
      other commentary contradicting that claim.
  - speaker: Unattributed discussion adjoining Cleasaiche
    printed_page: 41
    allegation: Claims the elite unit uses enhanced equipment, visual recognition
      gear, artificial augmentation, specialized security measures and post-mortem
      booby traps; reported as fictional speaker claims without validating technical
      feasibility or operational details.
  - speaker: Torc Talk
    printed_page: 41
    allegation: Alleges foreign intelligence services acquire equipment from this
      elite force.
  - speaker: Padraig
    printed_page: 41
    allegation: Answers the unit discussion with frustration, without independent
      confirmation.
  - speaker: Cleasaiche
    printed_page: 42
    allegation: Claims about 75 percent of regular Tir army are human, that family
      contacts influence service and that rank-and-file soldiers are comparatively
      expendable.
  - speaker: JAFO
    printed_page: 42
    allegation: Reports magic is integrated across military command levels and imagines
      elementals being present even around an air-force squadron.
