  - speaker: Slater
    printed_page: 59
    claim: Describes Gaeatronics data icon as pine decorated with shamrock shapes;
      alleges EcoSat hosts contain aggressive traps.
  - speaker: Slater
    printed_page: 60
    claim: Characterizes Armaments Éireann-Tír Matrix host as Red-11, with a fist-and-flames
      logo and extremely powerful security; this is a character’s game-world rating,
      not a newly invented conversion.
  - speaker: Tommy Mac
    printed_page: 60
    claim: Speculates about artists and spirits at McCarthy forest studio; invokes
