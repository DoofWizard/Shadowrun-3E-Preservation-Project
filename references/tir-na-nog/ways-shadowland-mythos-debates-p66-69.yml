data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: Historical Shadowrun original/Second Edition-compatible publication,
      not a Third Edition conversion
    file_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: 66-69
    physical_pdf_pages: 75-78
  forum_claims:
  - speaker: Professor Keel
    printed_pages: '66'
    certainty: in-world contested account
    claim: Says the movement Walking to the Light emerged in 2018 and claims its credited
      author James Michael Killearn may never have existed; describes mystery surrounding
      its origin. He does not provide independent proof of the author’s nonexistence.
  - speaker: Terrence
    printed_pages: '66'
    certainty: speculation
    claim: Proposes that the apparent new spiritual movement originated from memories
      of prior incarnations, and that the credited author had Walked the Paths before.
  - speaker: Mickey
    printed_pages: '66'
    certainty: accusation
    claim: Rejects the movement as a fraudulent religious claim; this is a named character’s
      polemic, not source narrator fact.
  - speaker: Tommy Mac
    printed_pages: '67'
    certainty: scholarly challenge
    claim: Notes that the sixth verse is absent from traditional Celtic accounts and
      says elven scholars claimed to discover it at the University of Galway in 2038;
      his question about convenience is skeptical commentary.
  - speaker: Ehran the Scribe
    printed_pages: '68'
    certainty: personal declaration
    claim: Condemns the Tuatha as deceitful and selfish, and explicitly rejects the
      notion that souls survive bodily death or reincarnate. His objection is presented
      as dissent from Danaan teachings.
  - speaker: The Big “D”
    printed_pages: '68'
    certainty: skeptical rhetorical reply
    claim: Challenges the claim that belief or thought alone creates the existence
      of its object.
  - speaker: Cynic
    printed_pages: '68'
    certainty: skeptical challenge
    claim: Asks for evidence instead of accepting in-world spiritual doctrine as demonstrated
      truth.
  - speaker: Leech
    printed_pages: '68'
    certainty: counterargument
    claim: Questions claims of mythic forms and argues rapid changes in awakened creatures
      may have alternative explanations, invoking differences among dragons, merrow
      and flame jackals; does not establish a general biological law.
  - speaker: Kent
    printed_pages: '68'
    certainty: skeptical comment
    claim: Questions the benevolence claimed for Danaan treatment of other people.
  - speaker: Sinéad F
    printed_pages: '68'
    certainty: sarcastic commentary
    claim: Challenges the idea that human stewardship and elven return create an equitable
      reciprocal relationship.
  - speaker: Teague
    printed_pages: '69'
    certainty: speculation
    claim: Suggests unusual human family members might have been influenced by hypnosis,
      chip implants or related fictional technologies; no evidence is established.
  - speaker: Analyzer
    printed_pages: '69'
    certainty: interpretation
    claim: Argues that altered Irish geography after the Awakening could have influenced
      inhabitants’ beliefs, while expressly posing a question rather than proving
      the religious account.
  - speaker: Kaneda
    printed_pages: '69'
    certainty: challenge
    claim: States that fictional banshees are infected elves carrying HMVV, and disputes
      the explanatory claim that banshees are reborn with karmic debt.
  - speaker: Analyzer
    printed_pages: '69'
    certainty: interpretation
    claim: Characterizes some Tír Tairngire elves as spiritually imitative without
      calling them morally evil.
  - speaker: Froud
    printed_pages: '69'
    certainty: wordplay
    claim: Makes a brief comic wordplay on the term “unseelie.”
  - speaker: Zeitgeist
    printed_pages: '69'
    certainty: speculation
    claim: Suggests a minority of Tír Tairngire elves may count as genuine spirits
      and refers to possible covert inter-Tír relations.
  - speaker: Ehran the Scribe
    printed_pages: '69'
    certainty: personal theory
    claim: Presents an exile interpretation in which Tír Tairngire elves are fallen
      spirits excluded from the Northern Islands; this does not establish canon on
      other people’s spiritual identities.
  editorial_distinction: Every item is an attributed statement within a fictional
    Shadowland discussion, separate from sourcebook narrator belief summaries and
    from factual claims about real religions or ethnic groups.
  forward_status: Verified forward source-review record, not indexed or credited as
    contiguous source authorization.
framing: newsroom_neutral
