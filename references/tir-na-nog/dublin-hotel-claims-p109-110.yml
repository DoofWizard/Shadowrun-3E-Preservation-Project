  source_voice: These are individual fictional Shadowland reviews, rumors, or put-downs; they are not narrator-established
    claims about real lodging establishments.
  reviews:
  - speaker: Bokin’ Brian
    venue: The Angel House
    pages: '109'
    claims: Disparages tourist-oriented decorative souvenirs and religiously themed merchandise while recounting a local
      story about the proprietor’s donkey; satirical tone.
  - speaker: Gorb Monster
    venue: Dublin International
    pages: '109'
    claims: Calls it a functional international luxury hotel, criticizes its hot-water reliability and otherwise praises
      food.
  - speaker: Paper Chaser
    venue: Dublin International
    pages: '109'
    claims: Alleges the hotel has unusually sophisticated Tír intelligence surveillance equipment and is controlled by
      the O’Toole interests; not independently confirmed.
  - speaker: Traveler
    venue: Flathail (Majestic)
    pages: '109'
    claims: Mocks the luxury property for dated decoration and allegedly inept service.
  - speaker: Tommy Mac
    venue: Jacob House
    pages: '109'
    claims: Characterizes a cheap former wine warehouse hostel as a friendly home for local students, artists and travelers.
  - speaker: Dolke
    venue: Jacob House
    pages: '109'
    claims: Asks whether hostel inhabitants trade in illicit BTL chips, explicitly phrased as an unconfirmed rumor.
  - speaker: Bokin’ Brian
    venue: Jacob House
    pages: '109'
    claims: Rejects Dolke’s rumor as uninformed stereotyping of unconventional people.
  - speaker: Sinéad F
    venue: Leitrim Lodge
    pages: 109-110
    claims: Accuses the owner of refusing accommodation to non-elves and states that inexpensive living attracts students;
      the allegation concerns fictional discriminatory behavior and is not a real-world hotel claim.
  - speaker: Rabid
    venue: Leitrim Lodge
    pages: '110'
    claims: Criticizes the owner’s supposed anti-human bias.
  - speaker: Finn
    venue: Leitrim Lodge
    pages: '110'
    claims: Challenges Rabid by invoking discrimination against humans and elves and threatening executions rhetorically;
      kept as an attributed retort.
  - speaker: Slater
    venue: Mount Herbert Lodge
    pages: '110'
    claims: Alleges Mr. Casey’s rooms can help a visitor avoid state scrutiny or persuade the housekeeper with payment
      or intimacy; a fictional rumor rather than verified covert service.
  - speaker: Sinéad F
    venue: Restezeee
    pages: '110'
    claims: Derides the cheap property’s clientele and sanitation.
  - speaker: Zeitguest
    venue: Restezeee
    pages: '110'
    claims: Says certain people deliberately pose as destitute to conceal commodity deals there.
  - speaker: Slaine
    venue: Saxon Hotel
    pages: '110'
    claims: Alleges the hotel was removed from a tourist-office listing after mismanagement, and mentions unnamed contacts
      with personal-protection products.
  source_integrity: Distinct statements and rumor/uncertainty preserved; no claim of independent confirmation.
