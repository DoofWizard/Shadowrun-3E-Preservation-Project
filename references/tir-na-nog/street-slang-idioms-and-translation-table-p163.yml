  idioms:
  - phrase: See me?
    meaning: As a first-person opening, generally introduces an anecdote; in a third-person “See him/her?”
      opening it can be disparaging.
    certainty: source-described general usage; not universal
  - phrase: Funny Enough
    meaning: Signals an improbable, unexpected, or oddly timely juxtaposition.
    certainty: source-described example
  - phrase: 'On'
    meaning: Context-dependent expression, ranging from fashionable through questions of time/availability
      to negative statements; the source also notes optional on- as a variant of un-.
    certainty: source gives several competing senses
  - phrase: elliptical thinking
    meaning: Indirect, metaphorical or sideways verbal turns whose literal meaning and intended message
      differ.
    certainty: examples are illustrative not factual scenarios
