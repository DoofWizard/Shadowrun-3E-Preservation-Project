  niall_oconnor:
    speaker: Niall O’Connor of Meath
    speaker_role: Self-identified Sidhe of Tara and political dissident within fictional Shadowrun Ireland;
      the following is his contested first-person account, not a neutral narrator’s independently established
      history.
    population_claim_p9: Says fewer than four million inhabitants live in Tir na nÓg, known also as Ireland,
      Éire, or the Emerald Isle; presents the island as disproportionately influential following the fictional
      Awakening.
    diaspora_claim_p9: Says millions overseas claim ancestry in Tir, with descendants in the American
      nations, Australia, New Zealand, Azania, Britain and elsewhere; attributes past migration to oppression
      under Normans, Britons, and earlier landowners.
    political_claim_p9: As a dissident son of Clan O’Connor of Meath, alleges that Danaan Family conspiracies
      and secrecy deny liberties to the people, naming elves, dwarfs, orks, trolls, and humans as equally
      deserving of those liberties.
    elven_ruling_class_p9: Criticizes the alleged doctrine of an elven ruling class, contending that its
      asserted moral superiority enables oppression; urges his countrymen to challenge complacency. These
      are Niall’s opinions, not settled world facts.
    land_and_awakening_p9_p10: Says Tir residents claim primacy over Tir Tairngire in naming their homeland
      the Tir, arguing the older Irish island was transformed by the Awakening; refers to elven children
      born during the era of Unexplained Genetic Expression.
    society_and_history_p10: Depicts the transformed fictional Ireland as a country with inherited artistic
      and religious traditions, environmental beauty and changed social order.
    family_and_dissent_p10: Describes being born and raised among his clan and the Sidhe of Tara, learning
      their views, then encountering humans, orks and other people while living away from his home; reports
      changing his views after these experiences.
    risk_and_authorial_purpose_p10: Says his writing places him in danger, describes the Tir Republican
      Corps as charged with protecting Tir from perceived enemies, and alleges that some in that force
      have placed a bounty on him; his aim is to reveal both achievements and concealed conditions in
      Tir to outsiders.
    linguistic_policy_p10: Explains that formal court Eireann-sperethiel is not ordinary daily speech
      for most locals; dialects of Irish Gaelic, other Gaelic forms, and slang vary, and he anglicizes
      many terms for readers whose first language is English while inviting linguistic corrections.
  shadowland_commentary:
  - printed_page: 10
    participant: Sinead F
    epistemic_status: Named in-world reader opinion
    substance: Mockingly calls Niall an idealist insulated from the realities facing ordinary people;
      contrasts picturesque landscapes with deprivation, and recommends attention to Dublin and Belfast
      street conditions.
  - printed_page: 10
    participant: Cian Fear-Teammainn
    epistemic_status: Named in-world partisan reply
    substance: Defends Tir’s social achievements, portrays opponents as troublemakers, and advocates vigilance
      for the homeland; not a neutral confirmation of Niall’s claims.
  - printed_page: 10
    participant: Tommy Mac
    epistemic_status: Named in-world rejoinder
    substance: Mocks Cian’s argument and his reported institutional loyalty, suggesting an interest in
      presenting the opposition’s side.
  - printed_page: 11
    participant: Analyzer
    epistemic_status: Named in-world editorial commentary
    substance: Notes that Niall’s perspective is also biased and invites skeptical reading of his account
      in light of other views.
  - printed_page: 11
    participant: The Pogue Mahone Collective
    epistemic_status: Self-reported editorial intervention
    substance: Claims the group added material about Dublin and Belfast street life and local slang to
      Niall’s document; this is an admitted in-world addition, not part of Niall’s original single-author
      testimony.
  - printed_page: 11
    participant: Captain Chaos
    epistemic_status: In-world archive-editor explanation
    substance: Describes assembling and cleaning an electronic file, with a recovered sequence, timestamp
      and linguistic/correction problems; the archive text may have editorial interventions.
  - printed_page: 11
    participant: Captain Chaos
    epistemic_status: In-world archive-editor clarification
    substance: Explains differing local and internationally formatted posting dates, adjustments to slang
      and Gaelic spellings, and omission of a large quantity of hostile repetitive material; distinguishes
      editorial changes from statements made by Niall.
  source_reliability: The book’s printed p7/PDF8 introduction explicitly states both the primary fictional
    source and associated Shadowland commentary can be biased or incorrect; preserve this distinction
    across all assertions.
  source_status: Verified forward reference only behind unreadable cataloged Denver source FASA7212; not
    indexed as authorized Pass B contiguous progress.
