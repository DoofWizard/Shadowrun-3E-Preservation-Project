headline: 'Fictional Shadowrun RPG, FASA Corporation Tir na nÓg (FASA7211, 1993), original/Second Edition-compatible,
  source.fasa-7211, printed pp9–11/PDF10–12: Niall O’Connor and named Shadowland allegations.'
summary: FASA’s 1993 fictional Tir na nÓg sourcebook presents Niall O’Connor’s disputed first-person opening
  about imagined Ireland and separate named Shadowland comments, including acknowledged editorial intervention;
  claim certainty and original/Second Edition provenance preserved.
