  - speaker: Tommy Mac
    pages:
    - 52
    - 53
    claim: Expresses anti-clerical cynicism, later alleges an artist’s magic-related
      incident; retain as subjective posts.
  - speaker: Father Dan
    page: 52
    claim: Calls for judging individual behavior rather than blanket condemnation
      of Catholic and Protestant faiths.
  - speaker: Analyzer
    page: 52
    claim: Claims druids avoid publicity and media proselytization, are uneasy about
      elven Earth Theses; this is a commentator report, not a universally established
      fact.
  - speaker: Zeitgeist
    page: 52
    claim: Mocks one independent hermetic organization and its Oscar Wilde-themed
      performance magic.
  - speaker: Taranis
    page: 53
    claim: Says to avoid toxic magicians and characterizes associated dangers in-world.
  - speaker: Gazza’s Ghost
    page: 53
    claim: Alleges the Tir intelligence service supplies some information to international
      eco-terrorists opposing toxic activity.
  - speaker: Siobhan Snakehead
    page: 53
    claim: Counterclaims about previous anti-toxic action and challenges overly rosy
      descriptions of Tir institutions.
  - speaker: Poguer
    page: 53
    claim: Responds with alleged details of a violent prior raid on dissidents, not
      narrator verified.
