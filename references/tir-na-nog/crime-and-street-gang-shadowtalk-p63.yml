  - speaker: Siobhan Snakehead
    claim: Reports that a recent bombing was claimed as a mistake and a purported
      apology was issued; insists victims were not the intended targets. Speaker narrative,
      not independently established chronology.
  - speaker: Zeitgeist
    claim: Ridicules the claimed apology and calls the attack a bombing of 21 people;
      preserves disagreement over intent and casualties.
  - speaker: Poguer
    claim: Argues that the mentioned illicit BTL chips are poor-quality and unreliable;
      attributed observation, not procurement advice.
  - speaker: Belfast Cabbie
    claim: Comments caustically on alleged re-education of captured gang members.
  - speaker: Metal Mickey
    claim: Alleges re-education of a person with the wrong metatype can become dehumanizing
      and punitive forced work. Attribution and coercion retained.
  - speaker: Dead Meat
    claim: Describes the named gangs Ballincollig Bastards, Waterford Kristals and
      Shannon’s Squeezeheads, while warning that camaraderie and apparent tolerance
      are conditional.
