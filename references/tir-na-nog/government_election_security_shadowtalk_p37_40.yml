data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: historical original/Second Edition compatibility
    printed_page_context: 37-40
    physical_pdf_context: 46-49
  claims:
  - p: 37
    speaker: Ludovic K
    position: Implying senators must vote as desired by the powerful taoiseach to
      retain their offices.
  - p: 38
    speaker: Paper Chaser
    position: Alleges Tir law restricts voting to people educated to age 24 and declares
      a voting minimum age of 24; this is a Shadowland claim beyond the narrator’s
      initial universal-suffrage description.
  - p: 38
    speaker: Belfast Cabbie
    position: Voices a hostile reaction to people excluded from suffrage; the discriminatory
      sentiment is a character’s statement, not archival endorsement.
  - p: 38
    speaker: Moleman
    position: Claims business and cultural elites control most senators, including
      37 of 55 identified as elves, using subsidies and heritage policy to protect
      entrenched interests.
  - p: 38
    speaker: Poguer
    position: Alleges the Minister of Arts and Culture Gerry O’Brien’s role affects
      education and supports the insider term Flanaganning, then illustrates it with
      an attributed scandal involving junior Minister Patrick Flanagan.
  - p: 38
    speaker: Paper Chaser and Sinéad F
    position: Debate the extremely limited practical power of local representatives
      despite their ability to ask questions and the delay in written replies.
  - p: 39
    speaker: Cleasaiche
    position: Ridicules Fianna Fáil as aligned with an elite, and Fine Gael as ineffective;
      critiques are partisan in-world remarks.
  - p: 39
    speaker: Kyle One
    position: Responds to Niall’s criticism by predicting militant Ulster factions,
      the UUPP and associated groups, are a revolutionary threat, not an established
      future fact.
  - p: 39
    speaker: Sinéad F
    position: Warns that the right to cultural participation entails respect for artistic
      heritage and could create enforcement consequences, as speaker opinion.
  - p: 40
    speaker: Slater
    position: Speculates about private access to Social Benefit Registry information
      and profitability of Environment Registry programs and the TRC, not independently
      documented admissions.
  - p: 40
    speaker: Skinny Puppy
    position: Says Tir government computer security features sculpted Matrix interfaces,
      an in-world technical observation.
  - p: 40
    speaker: Hooligan
    position: Contrasts Garda policing in Donegal with more forceful TRC control in
      Ulster, based on in-world firsthand commentary.
  - p: 40
    speaker: Torc Talk
    position: Claims TRC combat magicians may be deployed to Ulster flashpoints and
      have significant magical capability; no exact game combat statistics stated.
  - p: 40
    speaker: Slater
    position: Describes the Ministry of Interior Netwatch Division as enforcing computer
      boundaries; it is a character allegation rather than a tested procedure.
  forward_status: Verified forward extraction during unresolved FASA7212 Denver source-integrity
    block; does not activate FASA7211, authorize contiguous pages, or modify the completed
    FASA7213 manifest/checkpoint.
