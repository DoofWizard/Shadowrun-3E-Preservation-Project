id: reference.magic.australian-insect-spirits
record_type: reference
name: "Australian Insect-Spirit Ecology"
domain: magic
status: ingested
source_period: "2062"
source: source.fanpro-10651
printed_page: 119
pdf_page: 120
urban_hives:
  - "Urban insect-spirit activity commonly appears as small hives led by insect shamans or as free insect spirits left after larger hives were destroyed."
  - "Urban insect shamans are often described as Australians of European extraction or foreign shamans who encountered insect totems in the Outback."
  - "The most common urban insect totems named are Ant and Wasp, which adapt well to buildings and underground areas."
  - "Urban hives operate covertly, increase their spirit population and may eventually attempt to summon a queen."
free_insect_spirits:
  - "May pursue independent agendas ranging from coexistence and trickery to predation."
  - "May oppose insect shamans or hives because an insect shaman can learn a free insect spirit's true name and enslave it."
  - "Nearby hives can trigger metahuman bug hunts that also threaten independent insect spirits."
outback_hives:
  - "All insect totems except Cockroach are described as active in the Outback."
  - "Outback conditions are harsh for flesh-form spirits because suitable hosts are scarce."
  - "Insect hives can provide effective shelter from mana storms, sometimes drawing unsuspecting travelers into danger."
  - "Koradji and Aboriginal tribes have occasionally communicated or cooperated with insect hives where mutual survival interests align."
  - "The source emphasizes that insect spirits understand their dependence on metahuman hosts, creating occasional pragmatic alliances."
rules_reference:
  - "Use insect-spirit rules beginning on Magic in the Shadows p.127."
sources:
  - {source: source.fanpro-10651, printed_page: 119, pdf_page: 120, relation: defines_ecology}
notes:
  - "This page adds Australian ecology and campaign context rather than replacing core insect-spirit mechanics."
