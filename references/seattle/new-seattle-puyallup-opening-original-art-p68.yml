  visible_content: Elevated perspective across a sparsely vegetated, worn urban neighborhood.
    Clustered low and mid-rise blocklike buildings with small dark window openings
    stand beside cracked streets and fenced areas; several abandoned-looking vehicles
    and a utility pole appear in the foreground, with distant hills and additional
    buildings behind them.
  page_layout_and_attribution: The drawing appears above the Puyallup heading and
    a separate lower-left comment attributed to Jaxon; the adjacent main Puyallup
    narrator prose describes fictional historical events. Those textual assertions
    are not silently inferred from the drawing.
  interpretation_limit: No individual in the scene is identified by the artwork, and
    the damaged buildings or vehicles are not assigned dates, causes, factions, or
    game mechanics. This is a visual-reference record rather than a replacement for
    the already accepted Puyallup world_fact and attributed-claim records.
