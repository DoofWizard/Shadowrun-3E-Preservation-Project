headline: Archival world facts from fictional Shadowrun Third Edition tabletop sourcebook
  New Seattle (FanPro10657, FanPro LLC corrected Third Printing 2001), security-rating
  institutional descriptions, printed p110/PDF111
summary: Third-person preservation of the sourcebook narrator's fictional Seattle
  law-enforcement and neighborhood descriptions for ratings AA, A, B, C/D, E and Z
  on printed p110/PDF111. The game's exact response timing, force composition and
  procedural conditions remain in the separately accepted rules record.
data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_work_credit: FASA Corporation (1999)
    context: Fictional tabletop-RPG sourcebook, not a description of real law-enforcement
      policy
  heading: Game Information — Dealing with the Law — Security Ratings (continuation)
  fictional_city: Seattle metroplex
  book_narrator_descriptions:
    AA:
      typical_neighborhood: High-lifestyle areas and businesses that purchase constant
        coverage without the full around-the-clock deterrent provisions of rating
        AAA.
      coverage: Patrol coverage operates 24 hours daily but is less frequent than
        AAA; astral patrols are irregular and security-trigger systems may be present.
        Drones or spirits may guard some properties instead of people.
      investigation_and_status: The narrator says complaints receive thorough investigation,
        though often less quickly than under AAA, and an AA assignment is regarded
        as promotional.
    A:
      typical_neighborhood: The narrator assigns most of the metroplex to rating A
        and associates it with the largest share of middle-lifestyle residents.
      coverage: Regular street patrols but relatively infrequent astral, drone or
        security-rigger patrols because of limited personnel; police action is largely
        call-and-response.
      community_reporting: PanicButton booths, neighborhood-watch groups and other
        local organizations report suspected crimes frequently. The narrator associates
        this with false alarms and slower response.
    B:
      typical_neighborhood: Primarily industrial parks, office complexes, and suburban
        manufacturing areas that have coexisted with middle-class residential districts
        since the 1960s.
      in_world_characterization: The source calls these comparatively attractive targets
        for fictional shadowrunners and describes specialized Lone Star coverage;
        exact response personnel are indexed separately as tabletop rules.
    C_and_D:
      shared_context: Low-lifestyle versions of A and B; C corresponds to residential
        neighborhoods and D to business zones.
      coverage: Infrequent patrols and poorly maintained PanicButton booths; the narrator
        reports that policing tends to be reactive rather than preventative.
      narrator_assessments: The narrator describes hostile local attitudes toward
        law enforcement, complaints about insufficient investigation of crimes against
        businesses, and officers seeking to advance to other postings.
    E:
      typical_neighborhood: Squatter- and Street-lifestyle areas described by the
        narrator as slums.
      institutional_disparity: 'The source portrays the discriminatory treatment of
        people without System Identification Numbers: Lone Star does not normally
        assign patrols or preventive attention to these neighborhoods.'
      response_context: The fictional authority is depicted as responding principally
        to complaints by valid-SIN callers or to events threatening adjacent higher-priority
        neighborhoods. Specific response conditions and force composition remain in
        the separate rule record.
      attribution_boundary: The narrator reflects the setting's dehumanizing institutional
        prejudice toward SINless residents. This is not an endorsement or a factual
        assessment of real people.
    Z:
      typical_neighborhood: Z-Zones are portrayed as outside ordinary policing, divided
        into factions or tribes with no normal functioning law-enforcement presence.
      institutional_policy: The sourcebook narrator says the authority emphasizes
        containment of the zone rather than ordinary prevention or investigation within
        it.
      conditional_entry: The text describes exceptional entry when necessary to pursue
        an investigation and treats such entries as exceptionally hazardous; the exact
        fictional force template is separately indexed.
      jurisdiction_note: This is fictional tabletop source-era setting history, not
        contemporary Seattle geography or policing.
