    relationship: companion_optional_GM_guidance_only
    exact_timing_modifiers_trigger_conditions_covered_in: existing_rule_record
    does_not_amend_existing_table: true
    rule_lineage: Original Shadowrun Third Edition page 111; no edition conversion
      or new numeric rules are inferred
