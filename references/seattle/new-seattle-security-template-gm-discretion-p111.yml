summary: Source-reviewed archival report of optional gamemaster decisions accompanying
  the published Shadowrun Third Edition Seattle Security Template, printed p111/PDF112.
  This stores GM advice separately from the existing exact timing and response-mechanics
  table.
data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_work_credit: FASA Corporation (1999)
    context: Fictional tabletop-RPG sourcebook, not a description of real law-enforcement
      policy
  section: Game Information — Security Template and Security Template Notes
  guidance_type: Optional tabletop gamemaster adjudication, not narrator-established
    security events
  original_gm_principles:
  - topic: dramatic_role
    book_advice: The book presents the response of law enforcement as an optional
      gamemaster obstacle for shadowrunner characters; the gamemaster can determine
      whether and how reinforcements intervene in a fictional encounter.
  - topic: simulation_vs_play
    book_advice: The printed template's timing is described as unrealistic. The source
      advises the gamemaster to use it to shape encounters and narrative consequences,
      rather than to present an accurate simulation of real response operations.
  - topic: scope_and_jurisdiction
    book_advice: The table can be applied to Lone Star or another fictional public
      law-enforcement organization. Corporate security is separately managed by the
      corporation when characters enter corporate property, with different fictional
      responses.
  - topic: application
    book_advice: For a particular scene, the gamemaster selects the appropriate area
      security rating and uses the table and cumulative Initiative Pass results, then
      may adjust results to fit the intended campaign situation.
  - topic: event_semantics
    book_advice: The section distinguishes detection of an incident, an initial observation
      or scouting response, patrol arrival, successive reinforcements and continuing
      response. It does not treat detection and arrival as the same event.
  - topic: conditional_components
    book_advice: The source allows the gamemaster discretion where a security-rigger
      may or may not be available and when further reinforcements are sent; the exact
      stated probabilities, triggers, arrival intervals and force makeup are preserved
      in the separate rules record.
  relationship_to_exact_mechanics:
