framing: newsroom_neutral
data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    edition: Shadowrun Third Edition
    catalog_number: FanPro10657
    printing: Corrected Third Printing (2001)
    original_publication: FASA Corporation (1999)
    context: Fictional Seattle in a published tabletop role-playing game; the posts
      are in-world character accounts, not real-world reporting.
  source_section: Downtown Seattle / Neighborhoods
  attribution_policy: Statements signed by in-world speakers are recorded as claims,
    observations or speculation by those speakers, distinct from the adjacent descriptive
    book narrator and from mechanics.
  posts:
  - speaker: SPD
    printed_page: 32
    pdf_page: 33
    form: signed first-person section introduction
    claims:
    - SPD says they have lived in Seattle all their life and remember its period before
      the metropolitan reorganization.
    - SPD observes that longtime inhabitants are becoming fewer, and regards Downtown
      as the gathering point for much of the city's activity.
    - SPD presents the guide as an insider's description and playfully acknowledges
      the tendency to reminisce.
    epistemic_status: first-person recollection and commentary, not a quantified population
      study
  - speaker: FastJack
    printed_page: 32
    pdf_page: 33
    form: named in-world Shadowland comment
    claims:
    - FastJack cautions that carrying a cyberdeck or other equipment associated with
      illicit activity on Downtown streets, particularly at night, can draw attention
      from corporate security.
    - FastJack states that corporations protect important host systems by disconnecting
      them from the public Matrix and permitting access only through private local
      telecom grids (PLTGs) or corporate intranets within their premises.
    epistemic_status: in-world speaker's security observations; not a sourced real-world
      procedure or a numeric game-rule test
  - speaker: Feng
    printed_page: 32
    pdf_page: 33
    form: named in-world Shadowland comment
    claims:
    - Feng alleges that Triad groups have recently extended their presence into the
      fictional International District, where the population includes a substantial
      Chinese community.
    - Feng says the yakuza leader Shotozumi is concerned by the incursion and has
      ordered his associates to suppress Triad activity in the area.
    - Feng claims that Triad activity has made progress despite that response because
      local residents and businesses, like the yakuza, tend not to discuss their business
      affairs.
    epistemic_status: attributed account of alleged rival syndicate activity, not
      a narrator-certified future outcome
  - speaker: The Wizard of 'Trix
    printed_page: 33
    pdf_page: 34
    form: named in-world Shadowland comment
    claims:
    - The speaker praises University Way ("the Ave") in the University District for
      lore shops including University Lore and the Blue Moon.
    - The speaker says the avenue also has outlets selling electronics, computers,
      software and skillchips, including products useful to shadowrunners, sometimes
      among linguasofts and college tutorial materials.
    epistemic_status: speaker's marketplace appraisal and observation
  - speaker: Nuyen Nick
    printed_page: 33
    pdf_page: 34
    form: named in-world Shadowland comment
    claims:
    - The speaker describes Council Island as the Salish-Shidhe Council's foreign
      embassy and sovereign enclave within fictional Seattle, and claims that metroplex
      authorities and Lone Star have no jurisdiction on the island.
    - The speaker notes an extradition treaty with Seattle while claiming that contacts
      at the Council's diplomatic lodge could still provide sanctuary in particular
      circumstances.
    - The speaker speculates that corporations and people within the metroplex government
      want information from the Grand Council Lodge and ambassador's office and would
      pay for it.
    epistemic_status: legal/jurisdictional claims and speculation by a named fictional
      speaker, distinct from the book's narrator account of access control
  - speaker: Black Eagle
    printed_page: 33
    pdf_page: 34
    form: named in-world Shadowland comment
    claims:
    - Black Eagle describes Medicine Hollow Lodge on Council Island as among the best
      shamanic lodges in the fictional Seattle region and says its totem poles honor
      the Salish and other Council tribes' spirits and totems.
    - The speaker states that non-resident shamans may sometimes use the lodge for
      their magical work if they secure permits in advance from the Grand Council
      Lodge and make unofficial payments to obtain discretion.
    - The speaker alleges that paid access to Council territory can sometimes be arranged
      for gathering talismongering materials and characterizes the island as a source
      of those materials.
    epistemic_status: attributed claims and conditional possibilities within a fictional
      magic system, not guaranteed permissions or a real-world access guide
  fidelity_notes:
  - The six signatures on these two source pages are retained individually, including
    the introductory byline SPD.
  - FastJack's security observations, Feng's reported conflict, and Nuyen Nick's alleged
    sanctuary are not converted into omniscient narrator facts.
  - Conditional permissions and unofficial payments in Black Eagle's account remain
    distinct from ordinary approved entry.
  - The already accepted Downtown neighborhood world-fact record covers separate narration
    and is not reproduced here.
headline: 'Fictional Shadowrun Third Edition tabletop sourcebook: FanPro LLC New Seattle (FanPro10657), corrected Third Printing (2001), printed pp32-33/PDF33-34 — six attributed Downtown Seattle speakers'
summary: 'Source-reviewed named fictional commentary by SPD, FastJack, Feng, The Wizard of ''Trix, Nuyen Nick and Black Eagle, preserving first-person observations, allegations, conditions, uncertainty and speaker attribution; no assertion about contemporary real Seattle.'
