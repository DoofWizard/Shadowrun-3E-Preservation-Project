  visible_content: Steep upward view of a monumental court entrance and high walls,
    with a broad stairway approaching a pointed, ornamental doorway and large dark
    robed or hooded statue-like figures framing the approach. The scene is predominantly
    dark at the top and brightly lit around the entrance and steps.
  accompanying_narrator_context: The neighboring fiction-setting text identifies the
    Metroplex Supreme Court at Spring Street and 5th Avenue and describes two six-meter-high
    statues of hooded, robed Justices flanking its entrance. Those address and statue
    measurements come from the adjacent printed narration, not from measuring the
    illustration.
