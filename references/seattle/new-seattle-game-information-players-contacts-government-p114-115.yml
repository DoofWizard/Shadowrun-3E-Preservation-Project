data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    source_context: This is a fictional tabletop role-playing game sourcebook and
      guidance for optional gamemaster scenarios, not real-world operating advice.
  guidance:
    book_narrator_framework: The Using the Players section presents fictional Seattle
      power brokers as potential recurring game contacts, patrons, opponents, or sources
      of campaign events rather than as fixed player-character resources.
    people_and_contacts:
    - The text names corporate executives, powerful fixers, politicians, power brokers,
      watchers, magicians, powerful spirits and Awakened creatures among figures who
      can involve fictional shadowrunners in their plans.
    - Contacts may be people already described in the book, including gang members,
      employees of corporations, residents of the Barrens, and politicians or their
      staff. The gamemaster is advised to treat each contact as a person with an independent
      home, goals, motives, attitudes and life.
    optional_gm_scenarios:
    - A contact may ask for a favor in return for earlier help.
    - A contact may disclose information that should have remained confidential and
      seek protection from the consequences; the text offers this as a fictional scenario
      seed, not a reported event.
    government_context:
    - The narrator distinguishes UCAS federal institutions, Seattle metroplex government
      and local district governments.
    - UCAS federal agencies have an interest in local Seattle developments; the source
      identifies the FBI, NSA and CIA as potential in-world participants in deniable
      fictional assignments.
    - The metroplex government, including governor, senate, cabinet and United Corporate
      Council, provides campaign conflict opportunities, and local political candidates
      and factions can seek help involving their rivals.
    optional_government_hooks:
    - Governor Lindstrom is depicted as interested in the fate of predecessor Marilyn
      Schultz; this interest is presented as potential fiction-based adventure material.
    - A proposed optional story has shadowrunners hired by metroplex officials to
      investigate a Renraku arcology, while other political factions seek dirt on
      rivals.
    attribution_boundary: The heading describes gamemaster-facing possibilities. An
      example, hypothetical motive or optional hiring premise is not proof that the
      fictional event occurred in sourcebook chronology.
    protected_mechanics: This guidance passage introduces no mandatory dice procedures,
      target numbers or equipment statistics; it does not convert historical edition
      rules.
