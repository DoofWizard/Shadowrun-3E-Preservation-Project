    "historical_account": [
      "The account contrasts the yakuza's professed honor, duty and aid to disadvantaged people with criminal exploitation, explicitly criticizing the contradiction.",
      "Kiku dates Seattle yakuza growth to the turn of the century alongside Japanese corporations and Pacific Rim trade, initially serving Japanese sectors, then expanding into rival territory and conflict with the Mafia.",
      "After losses and a cease-fire around 2031, new Korean recruits rebuilt the organization; Akira Watada's Japan-based Watada-rengo imposed loyalty restrictions on Korean officers, creating resentment.",
      "The source dates a purge of Korean leaders to 2043. Some survivors became the Seoulpa Rings. Watada installed Hanzo Shotozumi to rebuild a traditionally Japanese-led Seattle yakuza structure.",
      "Under Shotozumi the yakuza expanded into Seattle markets and challenged the Mafia, until the Mafia installed James O'Malley. Following O'Malley's death in 2057 it further expanded.",
      "Shotozumi eventually declared local independence from Akira Watada's Japanese organization, creating the Shotozumi-rengo. Watada objects but no current retaliatory assassination attempt is reported in the source period."
    ],
