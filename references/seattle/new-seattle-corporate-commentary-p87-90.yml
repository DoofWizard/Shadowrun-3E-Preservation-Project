data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_copyright: FASA Corporation (1999)
    world: Shadowrun fictional Seattle Metroplex; these are not current real-world corporations or business claims
  section: The Corporate Sector / named in-world commentary
  editorial_separation: All statements below are attributed to fictional in-world poster handles; they are not established
    by the sourcebook narrator. Hypotheses, rumors, disagreement and lack of certainty are retained.
  named_in_world_posts:
  - page: 87
    speaker: Ronin
    claim: Explicitly does not establish that Brian Gates IV is otaku; conditionally suggests any such status would
      come from an outside faction recognizing his potential, not his father’s wishes, and asks which faction he
      might serve.
  - page: 87
    speaker: The Dead Deckers Society
    claim: Reports PRC’s Matrix host is not especially strong in isolation but its expert staff deckers monitor
      it around the clock; says PRC retains telecommunications records and customer troubleshooting information.
      A follow-on post describes the staff’s ability to gather useful competitive intelligence.
  - page: 87
    speaker: Smiley
    claim: Alleges PRC’s operation of the Seattle LTG allows it to capture and analyze substantial communications
      data before the intended recipient receives it, despite encryption and data security; the assertion is not
      narrator-confirmed espionage.
  - page: 87
    speaker: Brother Data
    claim: Challenges Smiley’s theory, arguing strong encryption is not immediately deciphered, gathered traffic
      becomes outdated, surreptitious spying would threaten PRC’s government contract, and PRC could not monitor
      all metroplex communications; allows that occasional opportunistic information could arise.
  - page: 88
    speaker: Firewatcher
    claim: Claims the Tir princes own five percent of Telestrian Industries, keep leverage over it, and sometimes
      Tir agents including Paladins and Ghosts use the corporation’s Seattle presence for travel and a safe haven;
      this is a poster assertion.
  - page: 88
    speaker: Wolf
    claim: Reports internal Telestrian-family struggles resembling Fuchi factional conflict on a smaller scale and
      says Sean Telestrian is using his Seattle vice-presidency to improve his position.
  - page: 88
    speaker: Archangel
    claim: Claims Telestrian biotechnology works on gene-splicing/recombinant DNA, while a Neurotech subsidiary
      explores brain-structured biotechnology computing; speculates the team may aim to model a “superior” elven
      brain.
  - page: 88
    speaker: FastJack
    claim: Reports a story that UniOil once used a dragon security chief named Haesslich, who disappeared; allegedly
      a truck-mounted heavy operation hauled something from water to the compound. FastJack guesses the dragon might
      have died but explicitly warns this remains unproved and a body would not guarantee death.
  - page: 88
    speaker: Farsee
    claim: Says Universal Omnitech and Telestrian compete sincerely in biotechnology and pursue developments by
      smaller Biogene, New Dawn and Phoenix Biotech.
  - page: 88
    speaker: The Smiling Bandit
    claim: Claims Universal Omnitech investigates enhancement of metahuman physiology, genes associated with magical
      aptitude, and possible biological substitutes for ghoul dietary needs; the comment is an attributed in-world
      research allegation, not a confirmed product.
  - page: 89
    speaker: Errant Knight
    claim: Claims Dunkelzahn acquired VisionQuest from Ares years earlier and speculates Damien Knight may seek
      to reacquire it from Holly Brighton; expressly anticipates conflict rather than reporting a completed acquisition.
  - page: 89
    speaker: Data Bear
    claim: Speculates VisionQuest may possess experimental files involving Dunkelzahn’s own dragon simsense recordings
      and non-invasive neural links for Matrix/simsense use; acknowledges the documents’ existence and usefulness
      are uncertain.
  - page: 90
    speaker: Galahad
    claim: Reports Ares’ building security system experiences intermittent false alarms and outages, speculates
      a virus or Cross Corp involvement, and says Ares privately increases guards during system repairs.
  - page: 90
    speaker: The Dead Deckers Society
    claim: Claims Ares’ modest local office Matrix host contains shipment schedules and contractor records and is
      linked to its PLTG; describes layered protection around sensitive information.
  - page: 90
    speaker: Miss Tick
    claim: Describes rumored magical defenses in Aztechnology Pyramid, with watcher spirits and possibly guard elementals
      of different kinds; does not turn the poster’s description into a verified encounter table or rule.
  - page: 90
    speaker: Silicon Mage
    claim: Notes unverified rumors of blood-magic rituals inside the Aztechnology Pyramid, disputes the roof as
      a credible location, and speculates that any such activity would be concealed in lower levels; no ritual is
      established as fact.
  - page: 90
    speaker: The Dead Deckers Society
    claim: Describes the Aztechnology downtown Matrix host as a stylized counterpart of the pyramid, with an outer
      public host and a more guarded private host holding valuable data; reports links to the Aztechnology PLTG
      and Tenochtitlán.
