  section: Around Town / Everett
  claims:
  - speaker: Bezerkley
    printed_page: 49
    claim: Speculates that the UCAS carrier group stationed at Everett would stage
      any future campaign against California or to remove Japanese forces from San
      Francisco.
  - speaker: Findler-Man
    printed_page: 49
    claim: Disagrees, arguing UCAS cannot readily maintain control of Seattle and
      is unlikely to attempt a California campaign.
  - speaker: Nuyen Nick
    printed_page: 49
    claim: Describes Federated-Boeing housing as a heavily monitored, company-controlled
      gated environment whose apparent free benefits bind employees to company commerce
      and restrict independence.
  - speaker: The FB Insider
    printed_page: 49
    claim: Argues Federated-Boeing treats its employees as a protected strategic asset
      against industrial rivals including Ares, Mitsuhama, Sikorsky-Bell and Saeder-Krupp;
      presents company-provided benefits and protection as part of corporate security.
  - speaker: The Dead Deckers Society
    printed_page: 49
    claim: Says the Federated-Boeing Matrix host holds aircraft design specifications,
      but that its employee-housing administrative database is a more practical information
      source about corporate personnel.
  - speaker: Nuyen Nick
    printed_page: 49
    claim: Alleges Bicson developed a drug called Cybertram to alleviate systemic
      shock and immune effects from cyber-implantation; speculates Cross Biomedical
      purchased Bicson to keep the drug proprietary after it failed to reach market.
  - speaker: The Keynesian Kid
    printed_page: 49
    claim: Challenges the claim that Cross would deliberately withhold a commercially
      valuable medical product.
  - speaker: Doc Slash
    printed_page: 49
    claim: Claims participation in secret Cybertram field testing at an Everett body
      shop. According to Doc Slash, patients experienced reduced post-implant trauma
      but developed dissociative dementia, entered comas and died. This is a fictional
      in-world allegation, not a real medical finding.
  - speaker: Doc
    printed_page: 49
    claim: Suggests the Cybertram effects described by Doc Slash resemble fictional
      cybermancy and proposes a possible connection to immersion and countermeasure
      systems, as speculation.
  - speaker: Argent
    printed_page: 50
    claim: Suggests that Lucien Cross may have asked the same question about Bicsons
      experimental medical research.
  - speaker: Holly, Wood & Vine
    printed_page: 50
    claim: Claims Dadson Vision produces Cal-hot simsense chips and BTLs, which the
      post identifies as illegal, and distributes them through yakuza contacts; says
      many young performers recruited by Dadson end up appearing in sexually explicit
      simsense material or worse.
  - speaker: SPD
    printed_page: 50
    claim: Alleges Dadsons California investors are associated with yakuza factions,
      while its Seattle studio has dealings with local gangs, including the Kabuki
      Ronin.
  - speaker: Social Adept
    printed_page: 50
    claim: Says Everett street gangs are concentrated downtown, that go-gangs and
      thrill gangs work for syndicates, and that smuggling is a major activity via
      the northern border or shoreline.
  - speaker: SPD
    printed_page: 50
    claim: Claims the Kabuki Ronin distribute California simsense products and work
      for California-based yakuza interests, complicating the local Mafia rivalry;
      suggests Don Ciarniello has not yet fully mobilized against them.
  - speaker: Edge
    printed_page: 50
    claim: Warns that the Scatterbrains allegedly perform dangerously harmful stunts
      under the guise of comedy, naming acid attacks on people and hallucination-inducing
      squirt-gun pranks. These are unverified in-world speaker allegations, not narrator-established
      events.
  - speaker: Holly
    printed_page: 50
    claim: Suggests the Scatterbrains have a hidden warehouse or other base near the
      Everett docks and speculates about their relationship with the Kabuki Ronin.
framing: newsroom_neutral
