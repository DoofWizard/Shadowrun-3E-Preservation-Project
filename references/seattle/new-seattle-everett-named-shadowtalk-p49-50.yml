summary: Fictional Shadowland commenters interpretations of Everett corporations,
  experimental medicine, entertainment and gangs are documented as attributed in-world
  commentary, not independent narrator facts or real-world medical assertions.
data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
