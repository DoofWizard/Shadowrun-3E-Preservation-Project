  section: Around Town / Everett
  claims:
  - speaker: SeaLowe
    printed_page: 47
    claim: The Salish-Shidhe patrols Everett northern shorelines; many small boats
      engage in smuggling and illicit military activities; Deception Pass is heavily
      patrolled by Salish-Shidhe gunboats.
  - speaker: Smiley
    printed_page: 48
    claim: The yakuza have established a bunraku brothel just south of Casino Corner
      as a foothold; the Mafia want it shut or appropriated. Smiley says the yakuza
      are paying the Ciarniello family and claims informants can earn by selling operational
      information to Don Ciarniello.
  - speaker: Connie Connoisseur
    printed_page: 48
    claim: The Mafia attacked the Rubber Suit roughly six times in the past few years;
      in the latest drive-by shooting fifteen people died, about half yakuza; Connie
      predicts escalation between the Mafia and yakuza.
  - speaker: Neon Leon
    printed_page: 48
    claim: Disputes Connies interpretation, alleges Connie is allied with the Choson
      Ring and seeks an anti-yakuza alliance between the Everett Mafia and the Seoulpa
      organization.
  - speaker: Cracker
    printed_page: 48
    claim: UCAS authorities refused the Aztechnology ship Tezcatlipoca permission
      to dock at the Everett shipyard for repairs because UCAS regulations prohibit
      corporate warships using federal facilities. Cracker says the ship left after
      the confrontation.
  - speaker: Nightrunner
    printed_page: 48
    claim: Alleges Aztechnology had deployed undersea microdrones around the yards
      to monitor UCAS Navy activity, transmitted data via Aztechnology satellites,
      and the Navy later identified and disabled them.
  - speaker: Cap'n Silver
    printed_page: 48
    claim: Claims UCAS naval shipyards attract surveillance by Salish-Shidhe operatives,
      California Free State actors and a fictional Japanese imperial organization;
      reports an FBI spy-ring arrest allegedly involved selling UCAS secrets.
