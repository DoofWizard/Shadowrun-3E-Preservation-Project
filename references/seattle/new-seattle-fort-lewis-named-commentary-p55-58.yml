  - world.seattle.new_seattle_fort_lewis_simulator_mcchord_zoo_p56_58
  distinctions:
  - The source separates assertions attributed to twelve named commenters from narrator
    descriptions of security authorities, syndicate operations, troop rotations, facilities
    and zoo breeding.
  - Hearsay, rumors, political interpretations, possible future Mafia action and conditional
    facility access remain distinguished from confirmed publication setting facts.
  - No fixed game TN, dice pool, damage code, acquisition price, or equipment-stat
    line is stated by these commenters.
