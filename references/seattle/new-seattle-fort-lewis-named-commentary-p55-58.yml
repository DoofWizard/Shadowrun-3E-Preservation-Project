data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_copyright: FASA Corporation (1999)
    fictional_context: Invented-world character posts in a fictional tabletop role-playing-game
      sourcebook; not real-world allegations about institutions or people.
  section: Around Town / Snohomish close / Fort Lewis
  provenance:
    exact_printed_pages:
    - 55
    - 56
    - 57
    - 58
    exact_pdf_pages:
    - 56
    - 57
    - 58
    - 59
  source_attribution: Named marginal Shadowland speaker statements, differentiated
    from the book narrator, illustrated artwork and reported historical setting facts.
  named_comments:
  - speaker: Nuyen Nick
    printed_page: 55
    topic: Edmonds Instruments and competing aircraft-industry contracts
    claims:
    - Nick says he has heard that Edmonds Instruments is obtaining lucrative AresSpace
      contracts that could improve its competitive position against Federated-Boeing.
    - He suggests Federated-Boeing wants to discover what its AresSpace competitor
      is planning; he does not establish that Federated obtained the information.
    epistemic_status: Hearsay and speculation about fictional corporate relationships.
  - speaker: Social Adept
    printed_page: 55
    topic: Snohomish gangs
    claims:
    - The speaker describes relatively few local gangs in Snohomish but portrays those
      present as either metahumans offering mutual protection against anti-metahuman
      hostilities or human groups targeting metahuman residents.
    - The speaker says each side regards itself as protecting its community and likens
      the factions to vigilantes; this is a speaker generalization, not an exact membership
      count.
    epistemic_status: Attributable social interpretation, distinct from security-grade
      table.
  - speaker: Legal Beagle
    printed_page: 55
    topic: Military and civilian criminal jurisdiction
    claims:
    - The commenter states that Fort Lewis is a federal installation and alleges that
      a person charged with a crime occurring there will face UCAS federal court rather
      than a Metroplex district court.
    epistemic_status: Named fictional legal interpretation; distinct from narrator
      account of jurisdictional disputes.
  - speaker: SPD
    printed_page: 56
    topic: Off-post courtesy patrols
    claims:
    - SPD reports that General Colloton ordered routine Military Police courtesy patrols
      in off-post neighborhoods frequented by soldiers and describes Lone Star as
      viewing the arrangement as a violation of its jurisdiction.
    - The speaker says Lone Star regards that complaint as justified, while the military
      considers its patrols preventive; the narrator independently reports the tension.
    epistemic_status: Speaker explanation of a jurisdictional dispute rather than
      a new legal ruling.
  - speaker: Smiley
    printed_page: 56
    topic: Bigio syndicate and UCAS military response
    claims:
    - Smiley alleges that the UCAS Army has increased pressure on the Bigio-associated
      Mafia around Fort Lewis and that Bigio leadership has been unsettled.
    - The speaker says Mafia bosses were displeased by how conspicuously the affair
      unfolded and that their Commission directed Don Bigio to clean up the situation
      personally.
    - Smiley speculates that continued trouble could prompt the Mafia to reunite separated
      families and reclaim territory previously lost to competing organizations.
    epistemic_status: Alleged internal syndicate communications and contingent future
      possibility, not a narrator-certified completed reunification.
  - speaker: Hangfire
    printed_page: 56
    topic: Urban Combat Simulator access
    claims:
    - Hangfire says UCAS sometimes allows friendly governments or corporate personnel
      to train at the Urban Combat Simulator.
    - The speaker asserts Ares Arms uses the facility to field-test new projects and
      mentions Fuchi personnel and Renraku Red Samurai as previous users.
    - Hangfire says corporate visitors are currently excluded in connection with corporate
      conflict and expresses uncertainty about how long the restriction will last.
    epistemic_status: Named in-world commentary about arrangements and a present restriction;
      no independently stated numerical rules.
  - speaker: Wychek
    printed_pages:
    - 56
    - 57
    topic: Opposition Force training and rumors
    claims:
    - The commenter says Metroplex Guard opposition-force personnel running the simulator
      sometimes employ shadowrunners to act as more realistic opponents.
    - Wychek reports an unverified rumor that military participants have occasionally
      supplied real ammunition rather than training blanks in those exercises.
    epistemic_status: Commentator assertion and explicit hearsay; no real-world instructions
      or game-rule damage modifiers.
  - speaker: Oolon Coluphie
    printed_page: 57
    topic: Political implications of troop rotations
    claims:
    - The speaker accepts that the simulator provides Army training and readiness
      but argues that regular federal troop rotations also keep a visible UCAS military
      presence in Seattle.
    - The speaker interprets this as a reminder to local politicians of where their
      political allegiance is expected to lie.
    epistemic_status: Political interpretation by an in-world speaker, not a proven
      hidden state motive.
  - speaker: Little Brother
    printed_page: 57
    topic: Spacefleet HQ simulator systems
    claims:
    - Little Brother characterizes Spacefleet HQ as extremely secure and claims access
      is limited to personnel holding Top Secret or higher clearance.
    - The speaker alleges Military Police protect facility entrances with live ammunition
      and that the simulator virtual-machine links are loaded with black IC.
    epistemic_status: Claim about fictional military and Matrix security; no numerical
      combat, test or ICE statistics provided.
  - speaker: Josie Cruise
    printed_page: 57
    topic: McChord Air Field RE-24C deployment
    claims:
    - Josie Cruise says access to McChord has become considerably more restricted
      since UCAS introduced RE-24C surveillance aircraft with advanced electronic
      and visual monitoring systems.
    - The speaker says UCAS authorities seem increasingly sensitive about outsiders
      examining operations at the installation.
    epistemic_status: Named observer interpretation, distinct from narrator aircraft-unit
      counts.
  - speaker: Wyld Hunt
    printed_page: 57
    topic: Fort Lewis Zoological Gardens restricted areas
    claims:
    - Wyld Hunt says most areas are public but claims some closed sections require
      military status or high-security research clearance.
    - The speaker describes patrols and sentry guns and mentions unconfirmed rumors
      about what is contained inside restricted areas.
    epistemic_status: Speaker account with expressly unverified hidden-area rumors.
  - speaker: Ursa Major
    printed_page: 58
    topic: Fort Lewis Zoological Gardens animal breeding
    claims:
    - Ursa Major calls the zoo a leading breeder of paranormal animals, particularly
      golden unicorn, cockatrice and phoenix.
    - The speaker speculates that military guard animals account for a comparatively
      high share of the district population listed as other.
    - Ursa Major alleges outside groups and foreign governments have tried without
      success to discover the zoo secret, including a failed kidnapping of one of
      roughly three hundred handlers.
    epistemic_status: Speaker evaluation and allegations, not a narrator-confirmed
      kidnapping or official census.
  related_accepted_world_facts:
