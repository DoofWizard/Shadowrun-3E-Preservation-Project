data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    game_edition: Shadowrun Third Edition
    printing: corrected Third Printing (2001)
    format: fictional tabletop role-playing-game setting sourcebook
  provenance:
    printed_pages: 47-50
    physical_pdf_pages: 48-51
    original_page_images_reviewed: true
    source_pdf_sha256: 837fd681bd6cbe822c902f57c9dc55ecd2d33084d21e363dfa3bc7925cfa4f97
  section: Around Town / Everett / Everett named Shadowland commentary
  reference:
    claim_type: Named in-world Shadowland statements concerning the fictional Everett
      district; narrator-asserted facts, allegations and uncertain theories remain
      distinct.
    named_claims:
    - speaker: Sealawe
      printed_page: 47
      topic: Border shoreline patrols
      claim: The poster says Salish-Shidhe patrols cannot monitor every northern cove
        or inlet and claims small craft transport contraband along the coast and rivers;
        states Deception Pass is watched by Salish-Shidhe gunboats. This reflects
        a named fictional speaker, not independently verified routes.
    - speaker: Smiley
      printed_page: 48
      topic: Casino Corner Mafia–yakuza dispute
      claim: Alleges the yakuza gained local access by opening a buraku-brothel near
        Casino Corner, while Mafia interests have not closed or seized it because
        its operators sell them information about yakuza business; this is not narrator-certified
        ownership.
    - speaker: Connie Connoisseur
      printed_page: 48
      topic: Rubber Suit attacks
      claim: Claims the Mafia struck the Rubber Suit roughly six times in recent years,
        including an automatic-weapons drive-by that killed fifteen people, approximately
        half allegedly yakuza; interprets the continuing confrontation as escalating.
    - speaker: Neo Leon
      printed_page: 48
      topic: Rubber Suit attack attribution
      claim: Disputes Connie’s Mafia attribution and claims the Choson Ring attacked
        to push yakuza out of Everett; speculates about Don Vincent seeking an alliance
        with the Choson Ring and against yakuza.
    - speaker: Cracker
      printed_page: 48
      topic: Naval-yard UCAS–Salish-Shidhe relations
      claim: Describes a past dispute when an Aztechnology warship sought naval-yard
        repair access; claims the yard commander rejected its demand under UCAS restrictions
        and the encounter ended without a major incident.
    - speaker: Nightrunner
      printed_page: 48
      topic: Naval-yard surveillance speculation
      claim: Claims Aztechnology’s apparent interest was monitoring UCAS vessels using
        small underwater surveillance vehicles before the devices were discovered.
        The speaker offers no verified narrator corroboration.
    - speaker: Cap’n Silver
      printed_page: 48
      topic: Naval intelligence allegations
      claim: Claims Japanese interests and Salish-Shidhe monitor Everett shipyards
        and that the FBI uncovered a fictional intelligence ring there allegedly selling
        UCAS information to Japanese parties.
    - speaker: Berkeley
      printed_page: 49
      topic: California reconquest conjecture
      claim: Speculates the Seattle battlegroup would serve as a staging point if
        UCAS leaders tried to reintegrate California or dislodge Japanese military
        forces from San Francisco.
    - speaker: Findler-Man
      printed_page: 49
      topic: California reconquest disagreement
      claim: Rejects Berkeley’s likelihood estimate, saying UCAS has too much difficulty
        maintaining Seattle to consider reunification with California.
    - speaker: The Dead Deckers Society
      printed_page: 49
      topic: In-world decker slogan
      claim: Offers the short ironic motto “In Kibo We Trust” after a remark about
        obtaining Federated-Boeing employee information. This is banter rather than
        a sourced account of the database.
    - speaker: Nuyen Nick
      printed_page: 49
      topic: Federated-Boeing company housing and controls
      claim: Characterizes Boeingville corporate housing as restrictive; alleges resident
        entry checkpoints and company-coded credential checks, company schools and
        stores, and compensation that can be spent within the corporation.
    - speaker: The FB Insider
      printed_page: 49
      topic: Federated-Boeing personnel security
      claim: Argues that corporate housing and benefits double as security, protecting
        Federated-Boeing specialists from recruitment, extraction or other corporate
        competitors. Separately claims the factory Matrix host contains sensitive
        aircraft designs.
    - speaker: Nuyen Nick
      printed_page: 49
      topic: Bicson Cybertram development
      claim: Alleges Bicson developed an experimental drug called Cybertram for implant
        procedures, aiming to reduce shock and immune responses; claims it did not
        reach the market despite trials and suggests Cross acquired the firm to obtain
        the drug.
    - speaker: The Keynesian Kid
      printed_page: 49
      topic: Cybertram commercial viability
      claim: Challenges Nick’s theory, asking why a lucrative drug would be withheld
        from the open market and suggesting a commercial release would generate substantial
        money.
    - speaker: Doc Slash
      printed_page: 49
      topic: Cybertram clinical trial recollection
      claim: Claims personal involvement in secret field testing toward fictional
        FDA approval. Reports a decline in initial implant trauma but severe mental
        symptoms, dissociation and eventual comas or death among recipients; alleges
        Bicson withheld these adverse outcomes from press reporting.
    - speaker: Doc
      printed_page: 49
      topic: Cybertram and fictional cybermancy hypothesis
      claim: Suggests the described mental symptoms resemble cybermancy, speculating
        Cybertram might be used with an IMS unit or other fictional cybermancy safeguards;
        not a proven drug indication or real medical advice.
    - speaker: Argent
      printed_page: 50
      topic: Cross acquisition motive
      claim: Wonders whether Lucien Cross considered the same Cybertram possibility
        when buying Bicson; a question rather than verified intent.
    - speaker: Holly, Wood & Vine
      printed_page: 50
      topic: Dadson media distribution allegations
      claim: Alleges Dadson manufactures illegal BTL chips in Seattle as well as legal
        simsense; claims yakuza-linked distribution of the programming and recruitment
        of young talent into exploitative media work. These are attributed allegations
        rather than narrator-established facts.
    - speaker: SPD
      printed_page: 50
      topic: Dadson distribution and Seattle yakuza split
      claim: Claims Dadson was backed by yakuza interests in California, but Shotozumi
        conflict with Watada-rengo eliminated an earlier Seattle distribution arrangement;
        claims the studio now relies on other local gangs, including the Kabuki Ronin,
        amid competing yakuza loyalties.
    - speaker: Social Adept
      printed_page: 50
      topic: Everett gang performance
      claim: Makes a brief theatrical quip before the Red Rovers entry; no independent
        factual assertion is supplied.
    - speaker: SPD
      printed_page: 50
      topic: Kabuki Ronin relationships
      claim: Says the Kabuki Ronin still perform work for Californian Japanese yakuza
        and distribute Cal merchandise and BTL chips through the Dadson/Syndicate
        network, creating friction with Don Ciarniello’s Mafia at Casino Corner; predicts
        confrontation despite current restraint.
    - speaker: Edge
      printed_page: 50
      topic: Scatterbrains conduct
      claim: Describes the Scatterbrains as unpredictable pranksters, alleging they
        spray acid and use hallucinogen-filled squirting toys; a cautionary in-world
        anecdote, not narrator-certification or an instruction.
    - speaker: Holly
      printed_page: 50
      topic: Scatterbrains hideout rumor
      claim: Speculates the Scatterbrains occupy a warehouse near the docks and that
        they and the Kabuki Ronin have avoided open fighting, perhaps because their
        interests align.
    limits: Attribution and uncertainty are retained. None of these claims is a real-world
      criminal operation, medical advice, military intelligence or future historical
      assertion.
