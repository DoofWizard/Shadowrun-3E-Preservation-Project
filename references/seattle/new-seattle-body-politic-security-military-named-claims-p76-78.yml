rvoyance and telekinesis to locate and defuse explosives."},{"speaker":"Serena","printed_page":77,"claim":"The speaker says the Dips administer Seattle's magical licenses under UCAS rules and that possible loss of a license pressures lawful magicians to comply."},{"speaker":"Holly","printed_page":77,"claim":"The speaker contrasts public acceptance of Lone Star as a seemingly civic police force with Knight Errant's reputation as a private corporation, despite the former also being a corporation."},{"speaker":"Digger","printed_page":78,"claim":"The speaker refers to Dunkelzahn's will rewarding effective nonlethal weapons and predicts rivalry between Lone Star and Ares Arms over new prototypes."},{"speaker":"TacFire","printed_page":78,"claim":"The speaker believes Colonel O'Neil resents General Colloton's superior rank and quietly hopes the general suffers an embarrassing command failure, while avoiding direct confrontation."},{"speaker":"Genetic","printed_page":78,"claim":"The speaker calls Humanis recruitment from the Metroplex Guard an open secret, alleges some senior officers and NCOs belong, and says Colonel O'Neil may have encouraged officers to overlook certain irregularities while not being a member himself."},{"speaker":"Skye","printed_page":78,"claim":"The speaker says neither Colonel O'Neil's side nor Humanis is happy with Colloton's purge and claims both seek ways to undermine her."},{"speaker":"Potemkin","printed_page":78,"claim":"The speaker reports that recent divisions within the United Corporate Council disrupted an earlier emergency arrangement allowing the Metroplex Guard to borrow corporate wage mages."},{"speaker":"X-Star","printed_page":78,"claim":"The speaker alleges the Lone Star Dips filed astral-space jurisdiction complaints against General Colloton's incoming federal magicians."}],"provenance_note":"All claims are attributed fictional in-world commentary and are not established real-world allegations; narrator reporting is indexed separately.