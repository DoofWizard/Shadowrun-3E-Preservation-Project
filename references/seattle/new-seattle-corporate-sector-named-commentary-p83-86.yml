headline: Attributed corporate-sector commentary from the fictional Shadowrun Seattle sourcebook
summary: Source-reviewed fictional Shadowrun Seattle publication material in FanPro LLC New Seattle, FanPro10657,
  Third Edition, corrected Third Printing (2001), printed pp83-86/PDF pp84-87; narrator statements and named speaker
  claims are kept distinct.
data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_copyright: FASA Corporation (1999)
    world: Fictional Seattle Metroplex of Shadowrun, not real-world business reporting
  section: The Corporate Sector / named in-world speaker posts
  editorial_separation: Every entry is attributed to its named in-world poster, not adopted as a confirmed sourcebook
    narrator fact; speaker certainty, allegations and explicit uncertainty remain distinct.
  claims:
  - printed_page: 83
    pdf_page: 84
    speaker: Sneaky Pete
    reported_or_alleged_claim: UCC members and associates can trade favors to advantage Council lobbyists, rather
      than conducting disputes openly; this is speaker commentary, not a council rule.
  - printed_page: 83
    pdf_page: 84
    speaker: Digger
    reported_or_alleged_claim: Kenneth Brackhaven has influential friends and financially supports Governor Lindstrom;
      a rumor says Brackhaven seeks influence behind the governorship, not a proven appointment.
  - printed_page: 84
    pdf_page: 85
    speaker: Smiley
    reported_or_alleged_claim: Kenneth Brackhaven directly or through holding companies contributed to the campaigns
      of at least six district mayors, including Lindstrom’s Downtown mayoral campaign, across political parties;
      Smiley interprets this as a pursuit of influence.
  - printed_page: 84
    pdf_page: 85
    speaker: Hood
    reported_or_alleged_claim: Kenneth Brackhaven’s public philanthropy, political conduct and private reputation
      suggest conflicting motives, so Hood declines to settle on a definitive personal agenda.
  - printed_page: 84
    pdf_page: 85
    speaker: Enyov
    reported_or_alleged_claim: DSI uses deckers to locate obscure market information and sometimes hires runners
      to obtain secure data; Matrix transfer can be intercepted, so the speaker describes dangerous courier work.
  - printed_page: 84
    pdf_page: 85
    speaker: Nuyen Nick
    reported_or_alleged_claim: Jessica Sirianni grew up in Redmond and rose through Federated-Boeing despite opposition;
      the speaker depicts her recent management as highly aggressive.
  - printed_page: 84
    pdf_page: 85
    speaker: Deep Green
    reported_or_alleged_claim: Gaeatronics covertly supports eco-terrorist attacks on competing energy companies
      to help it expand; this is an in-world accusation and is not adopted as a narrator-established fact.
  - printed_page: 85
    pdf_page: 86
    speaker: Valerie Valkyrie
    reported_or_alleged_claim: Global has spent more than a decade developing artificial-personality templates based
      on simsense and skillsoft technology. The speaker claims the chip can impose a different personality, including
      a modeled famous person, on its user.
  - printed_page: 85
    pdf_page: 86
    speaker: Argent
    reported_or_alleged_claim: A simulated elite-soldier personality or skill set does not provide the user with
      the physical fitness to perform those feats; the speaker qualifies an imagined application, not an advertised
      product statistic.
  - printed_page: 85
    pdf_page: 86
    speaker: Brother Data
    reported_or_alleged_claim: Global may be developing neural mapping that copies personality, memories and skills
      into a chip; the speaker speculates about the necessary holomatrix compression.
  - printed_page: 85
    pdf_page: 86
    speaker: Kamikage
    reported_or_alleged_claim: Global contracts with Eagle Security and uses voice and retinal access checks plus
      onsite guards/scanners at offices and laboratories, with relatively few automated defenses; this is a named
      commenter’s report.
  - printed_page: 85
    pdf_page: 86
    speaker: Weaver
    reported_or_alleged_claim: Global sometimes deploys unusual simsense-influenced expert systems or psychotropic
      IC on its computer network. The speaker speculates the staff may be testing new security software.
  - printed_page: 86
    pdf_page: 87
    speaker: Fern
    reported_or_alleged_claim: Ingersoll Aquaculture collaborates with Aqua Arcana and Florida-based marine biotech
      firms on bioengineered krill and marine species, and on bacteria and plants intended to clean polluted waterways;
      speaker report.
  - printed_page: 86
    pdf_page: 87
    speaker: Deep Green
    reported_or_alleged_claim: I&B facilities along the Snohomish River harm the local ecosystem and a Universal
      Omnitech acquisition will worsen conditions; speaker accusation and prediction, not a sourcebook narrator
      certainty.
  - printed_page: 86
    pdf_page: 87
    speaker: Janey
    reported_or_alleged_claim: MegaMedia employment can provide invitations to high-profile Seattle social gatherings,
      though such events may be corporate promotions; speaker commentary.
  - printed_page: 86
    pdf_page: 87
    speaker: Nuyen Nick
    reported_or_alleged_claim: The Gates family has longstanding computer expertise and the current Microdeck leadership
      may take advantage of competitors’ difficulties to recruit staff or acquire research; speaker interpretation,
      not verified corporate actions.
  - printed_page: 86
    pdf_page: 87
    speaker: Digital Dawg
    reported_or_alleged_claim: Microdeck allegedly undertook actions against Fuchi’s former research operations
      before Renraku gained control; the speaker says more such activities may follow.
  - printed_page: 86
    pdf_page: 87
    speaker: The Dead Deckers Society
    reported_or_alleged_claim: Microdeck’s Matrix host is reportedly complex, relies on unusual non-lethal intrusion
      defenses and substantial staff deckers, and rarely uses lethal black IC; the speaker also makes a threat about
      misuse of its staff skills.
  - printed_page: 86
    pdf_page: 87
    speaker: Donner
    reported_or_alleged_claim: The current CEO’s twelve-year-old son Brian Gates IV is reportedly a very capable
      computer user and may be prepared to inherit leadership; the speaker’s speculation must not be treated as
      verified succession.
  - printed_page: 86
    pdf_page: 87
    speaker: Red Wraith
    reported_or_alleged_claim: The speaker alleges, without confirmation, that Brian Gates IV is an otaku and that
      other executives’ children may also be otaku; the lack of confirmation is explicit.
framing: newsroom_neutral
