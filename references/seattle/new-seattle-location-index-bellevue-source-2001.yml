summary: The original published FanPro LLC, New Seattle (FanPro10657), 2001 corrected
  Third Printing of a Shadowrun Third Edition fictional tabletop-RPG sourcebook; original
  work copyright FASA Corporation 1999. lists 25 fictional Bellevue sites by venue
  category, printed location/address, description and occasional internal page reference.
  This is a book-index transcription in third-person reference style, not a list of
  real locations.
