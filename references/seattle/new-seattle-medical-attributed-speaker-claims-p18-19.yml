  and claims regarding fictional hospitals, interests and rival syndicates. No claim
  is adopted as established fact solely because a named speaker makes it.
data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: corrected Third Printing (2001)
    fictional_source_context: Fictional tabletop RPG city sourcebook; all names and
      allegations describe the invented Shadowrun 2060 Seattle, not current medical
      facilities or real people.
  provenance:
    source_id: source.fanpro-10657
    original_pdf_sha256: 837fd681bd6cbe822c902f57c9dc55ecd2d33084d21e363dfa3bc7925cfa4f97
    printed_pages: 18-19
    physical_pdf_pages: 19-20
    original_page_images_reviewed_independently: true
  source_section: Welcome to Seattle — Medical Facilities
  named_in_world_statements:
  - speaker: Doc U-Dub
    printed_page: 18
    claim: Nightengale’s Body Parts formerly belonged to Fuchi and now serves Novatech
      and Richard Villiers contacts. The comment claims advanced cyber-modification
      and privileged customer access; it is speaker testimony, not narrator-sourced
      ownership verification.
  - speaker: Nuyen Nick
    printed_page: 18
    claim: Some Seattle General doctors allegedly divert body parts to Yakuza-linked
      dealers, including trade through Fast Freddie’s Surgery and the First Nations
      gang. The commenter expresses concern about criminal market demand and rivalry;
      these remain attributed accusations.
  - speaker: Doc-U-Dub
    printed_page: 18
    claim: Humana Hospital is described by this speaker as Shiawase-owned with an
      employee clinic offering advanced cyber modifications and occasional service
      for outside special customers.
  - speaker: Doc-U-Dub
    printed_page: 18
    claim: Travis Memorial is reported to integrate conventional medicine with magical
      healing; magical healers consult physicians and the comment reports favorable
      results.
  - speaker: Doc Falt
    printed_page: 18
    claim: The commenter attributes difficulties for Travis Memorial’s proposed expansion
      to paperwork and regulations introduced by the Canadian-American Medical Association
      (CAMA) and Lone Star, while discussing malpractice concerns.
  - speaker: Doc Falt
    printed_page: 18
    claim: A Snohomish comment alleges widespread corruption and unlawful trade in
      human body parts by local hospitals. It is a general accusation from a speaker,
      not a finding about every named facility.
  - speaker: Doc-U-Dub
    printed_page: 19
    claim: The commenter alleges Tamanous has entered the Redmond organ trade in competition
      with Yakuza groups, claims its product is aggressively marketed as higher-quality,
      and speculates on how Yakuza leaders may respond; prediction remains speculative.
  - speaker: Green Ripper
    printed_page: 19
    claim: The commenter identifies Dr. Edison Olszewski, administrator of Hollywood
      Hospital, and alleges he was dismissed from MCT after helping an injured adversary.
      The speaker describes the resulting hostility to MCT; the story is an attributed
      recollection.
  attribution_rule: Separately signed comments are claims made by the named in-world
    Shadowland speakers, distinct from the textbook narrator’s hospital listings and
    allegations.
  mechanics: No tabletop test or medical treatment mechanics introduced by the reported
    comments.
