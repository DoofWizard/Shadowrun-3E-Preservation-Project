    original_copyright: FASA Corporation (1999)
    fictional_context: Named commentators in the published fictional Shadowrun tabletop-RPG
      Seattle setting; not real-world demographic or meteorological evidence.
  section: Welcome to Seattle / Fast Facts / The Weather
  attribution_rule: These statements have in-world speakers and are not identical
    to the book-narrator weather and census assertions recorded elsewhere.
  signed_statements:
  - speaker: Captain Chaos
    printed_page: 14
    pdf_page: 15
    timestamp_as_printed: Transmitted 12 August 2060 at 12:34:55 (EST)
    statements:
    - In a signed opening comment, Captain Chaos says public databases are amusing
      but complains that many summarize or rephrase original material in a dull or
      misleading way.
    - He says he does not intend simply to repackage that material, preferring a more
      audience-conscious account; the expression is editorial opinion, not a claim
      about every database.
    epistemic_status: First-person editorial viewpoint signed by an in-world character.
  - speaker: People Watcher
    printed_page: 14
    pdf_page: 15
    statements:
    - The speaker claims the metroplex government estimates roughly 30,000 residents
      in the other category, mostly ghouls and exotic metatypes; this is a named comment,
      not the authoritative six-part population-percentage table.
    - The speaker argues that the estimates omit critters that officials do not regard
      as sentient and jokes that the population of devil rats may outnumber all the
      other residents.
    epistemic_status: Commentator paraphrase of alleged government estimate, plus
      speculation and exaggeration; not an independently verified census.
  - speaker: Thunder Dancer
    printed_page: 16
    pdf_page: 17
    statements:
    - Thunder Dancer attributes much of Seattle weather that the speaker considers
      unusual to magical effects, specifically claiming that fallout from the Great
      Ghost Dance permanently altered Pacific Northwest weather patterns.
    - The speaker describes unusual storms and unreliable conditions near the Cascades,
      particularly in tribal territory, and alternatively proposes powerful free storm
      spirits as a possible cause.
    - The speaker says certain spirits can affect weather for considerable distances
      and warns of a few such beings nearby, without offering a mechanical spell effect
      or quantified game modifier.
    epistemic_status: A named in-world supernatural explanation and uncertainty, not
      a sourcebook-certified real-world meteorological assertion.
  source_class_boundaries:
  - Source-narrator Seattle population, commuting figures and regional geography on
    p14 are already preserved in a world-fact record; this record does not duplicate
    their authority.
  - The weather section cites Woppler the Weatherman for its descriptive prose; that
    attribution is distinct from the Thunder Dancer signed opinion.
  - The illustration of a Renraku tower on printed p15 is already separately preserved,
    and the narrator travel data on pp16-17 is in an existing world-fact record.
