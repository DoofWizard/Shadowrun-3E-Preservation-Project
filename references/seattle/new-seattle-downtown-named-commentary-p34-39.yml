data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_copyright: FASA Corporation (1999)
    scope: Fictional tabletop role-playing-game Seattle, not contemporary real-world
      Seattle.
  section: Downtown Seattle / named Shadowland commentary
  provenance:
    printed_pages: 34-39
    physical_pdf_pages: 35-40
    source_page_images_reviewed: true
  reference:
    claim_type: In-world Shadowland posts; named speakers’ assertions, speculation
      and editorial opinions are not narrator-established facts.
    named_claims:
    - speaker: Smiley
      printed_page: 34
      topic: Jon Moses succession
      claim: The speaker speculates Moses may be replaced by Laura Drywell or a more
        uncompromising advocate, and suggests the post may only be vacated voluntarily
        or by other means; neither is established as a future event.
    - speaker: Ridge Runner
      printed_page: 34
      topic: Council Island factions
      claim: The speaker alleges Makah and Crow factions have been moving increasingly
        powerful weapons through Bellevue while claiming to protect themselves; Lone
        Star allegedly blocked one transfer, and speaker wonders whether an internal
        takeover or anti-NAN display was intended.
    - speaker: The Dead Deckers Society
      printed_page: 34
      topic: Metroplex records
      claim: The fictional hacker commenter says Metroplex Records offers public access
        to Motor Vehicle files for SIN holders (including apparently authentic or
        forged credentials) and warns of extensive nonlethal trace ICE and Lone Star
        pursuit if unauthorized access is detected; in-world commentary, not real-world
        instructions.
    - speaker: X-Star
      printed_page: 35
      topic: FBI and Lone Star
      claim: The speaker complains that jurisdictional infighting between FBI and
        Lone Star lets syndicates continue business.
    - speaker: Spook
      printed_page: 35
      topic: CIA activity
      claim: The commenter alleges CIA offices in the Federal Building and dispersed
        safehouses, and states Seattle is a base for UCAS intelligence personnel active
        in other nations.
    - speaker: Lady Tsuna
      printed_page: 35
      topic: Penumbra patrons
      claim: The commenter says Penumbra patronage has declined as corporate/metroplex
        security patrols near the arcology increased, yet the club remains a source
        of gossip.
    - speaker: Connie Connoisseur
      printed_page: 35
      topic: Dante’s Inferno private rooms
      claim: The commenter sarcastically questions claims of privacy and the value
        of the special paid floor.
    - speaker: Night Dancer
      printed_page: 35
      topic: Dante’s Inferno illicit dealings
      claim: The speaker alleges illicit chip deals, secret passwords for vice establishments,
        prostitution deals and similar negotiations take place discreetly at the club,
        and says Mafia and yakuza figures enforce their own standards there.
    - speaker: Zapper Weisman
      printed_page: 37
      topic: Eye of the Needle prestige
      claim: The commenter calls invitations to the restaurant a mark of elite influence
        and suggests guests should impress hosts to receive future invitations.
    - speaker: Dante the Man
      printed_page: 37
      topic: Gynt and social connections
      claim: The speaker identifies Gynt as the Eye of the Needle’s owner, describes
        him as well-connected and repeats an unverified rumor that Gynt befriended
        late Mafia leader Don James O’Malley.
    - speaker: Porky
      printed_page: 37
      topic: Renraku arcology Matrix
      claim: The speaker alleges rare intermittent arcology Matrix signals and that
        the data traffic is insufficient to reveal internal events; describes inaccessible
        normal entry links.
    - speaker: Captain Chaos
      printed_page: 38
      topic: Renraku arcology event forum
      claim: The commenter directs fellow fictional posters to a Renraku shutdown
        discussion and dates the post 31 August 2060, 12:00:21.
    - speaker: Renraku Fox
      printed_page: 38
      topic: Arcology shutdown inquiry
      claim: The speaker alleges Renraku Security commander Kansayaku Masaru Shirokawa
        has hired local shadowrunners to investigate the locked-down arcology; this
        is an in-world claim, not proof of an assignment.
    - speaker: The Dead Deckers Society
      printed_page: 38
      topic: Airport host systems
      claim: The speaker states that Sea-Tac’s Matrix host uses passwords, trace ICE
        and other security, though the speaker asserts the host monitors data more
        to control access than immediately arrest intruders; this is fictional commentary
        and not game mechanic with a printed TN.
    - speaker: Jaxon
      printed_page: 38
      topic: Airport security
      claim: The speaker reports increased airline-terminal vigilance and says airport
        jokes involving threats trigger intrusive questioning; in-world anecdote.
    - speaker: Social Adept
      printed_page: 38
      topic: Downtown gang estimates
      claim: The writer estimates more than three hundred gangs citywide and stresses
        that gang territories and memberships change frequently; this is not a verified
        count.
    - speaker: Findler-Man
      printed_page: 39
      topic: Halloweeners and arcology
      claim: The commenter speculates the gang might know access routes into the arcology
        and that Slash-and-Burn is unusually preoccupied with revenge against Renraku.
    - speaker: Doc-U-Dub
      printed_page: 39
      topic: Disassemblers and Tamanous
      claim: The speaker alleges the Disassemblers are Tamanous’s front line in Seattle
        and that Tamanous equips the gang with better gear and strengthens channels
        for selling body parts; this is attributed rumor, not narrator-confirmed fact.
  source_review_limits: In-world named speakers’ conjectures are preserved as claims
    rather than established source-narrator facts. Pervo and D Vixen brief airport
    reactions are expressive interjections, not additional factual assertions.
framing: newsroom_neutral
