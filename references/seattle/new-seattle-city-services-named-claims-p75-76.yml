data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    printing: Corrected Third Printing (2001)
    game: Shadowrun Third Edition
    original_copyright: FASA Corporation (1999)
  section: The Body Politic — source commentary accompanying City Services
  claim_count: 7
  named_source_comments:
  - speaker: Doctor Spin
    printed_page: 75
    pdf_page: 76
    subject: Lindstrom’s media behavior
    attributed_assertion: The speaker describes Lindstrom as skilled in handling news
      media and says his acceptance speech after election as governor occurred in
      front of a statue of his father outside Metroplex Hall.
    certainty: named in-world claim or speculation, not independently verified
  - speaker: Findler-Man
    printed_page: 75
    pdf_page: 76
    subject: Schultz information allegation
    attributed_assertion: The speaker alleges Lindstrom offers substantial payment
      for information about what happened to Governor Schultz in the Renraku arcology
      and even more for assurances Schultz will not return.
    certainty: named in-world claim or speculation, not independently verified
  - speaker: Nuyen Nick
    printed_page: 75
    pdf_page: 76
    subject: Franklin insurance response allegation
    attributed_assertion: The speaker alleges Franklin Associates responds more quickly
      to insured than uninsured sites, says there has been no successful lawsuit over
      the disparity, and calls the insurer’s advertised enhanced response a protection
      racket.
    certainty: named in-world claim or speculation, not independently verified
  - speaker: Findler-Man
    printed_page: 75
    pdf_page: 76
    subject: Sanitation commissioner allegation
    attributed_assertion: The speaker alleges Sanitation Commissioner Richard Cary
      is beholden to the Mafia, which sometimes uses sanitation contacts to conceal
      evidence of deceased individuals.
    certainty: named in-world claim or speculation, not independently verified
  - speaker: Rimmer
    printed_page: 75
    pdf_page: 76
    subject: Power-generation permit allegations
    attributed_assertion: The speaker contends Shiawase would seek more electrical
      business but NAN authorities refuse new plants on their territory, Seattle authorities
      prevent additional fusion plants, and Shiawase experiments with geothermal taps
      at Hell’s Kitchen without sufficient capacity.
    certainty: named in-world claim or speculation, not independently verified
  - speaker: Dana
    printed_page: 76
    pdf_page: 77
    subject: Interdependent power contractors
    attributed_assertion: The speaker states Gaeatronics makes most electricity while
      Shiawase Atomics maintains the grid that delivers it; each corporation seeks
      more control and the relationship produces internal conflict.
    certainty: named in-world claim or speculation, not independently verified
  - speaker: Josie Cruise
    printed_page: 76
    pdf_page: 77
    subject: Vehicle tracking claim
    attributed_assertion: The speaker alleges Mitsuhama Computer Technologies could
      access vehicle-tracking resources for autopilot-equipped vehicles once integrated
      with the Grid-Guide system, and explicitly warns fictional shadowrunners about
      this potential.
    certainty: named in-world claim or speculation, not independently verified
