data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: corrected Third Printing (2001)
    nature: Published fictional tabletop roleplaying game setting, not present-day Seattle or real-world
      advice.
  provenance:
    printed_pages: 69-72
    pdf_pages: 70-73
    original_page_images_reviewed: true
  section: 'The Barrens: Puyallup named Shadowland commentary; not narrator facts'
  named_comments:
  - page: 69
    speaker: Smiley
    claim: Alleges that Mafia and yakuza groups use metahumans as expendable labor without admitting
      them into senior ranks.
  - page: 69
    speaker: Ridge Runner
    claim: States that Seoulpa rings recruit metahumans and cites their gaining influence in Carbonado
      through ties to Cascade Ork smuggling.
  - page: 69
    speaker: The Dead Deckers Society
    claim: Describes limited Puyallup Matrix infrastructure and reports valuable, well-defended syndicate-host
      data; includes a personal caution, not narrator rules.
  - page: 70
    speaker: Rave
    claim: Praises Underworld 93’s music programming and describes the manager Al Castanzo as musically
      discerning.
  - page: 70
    speaker: Smiley
    claim: Claims Underworld 93’s operator pays the yakuza for protection and warns about starting
      trouble there.
  - page: 70
    speaker: Nightrunner
    claim: Claims Carbonado mine tunnels extend beneath a border and are used in illicit movement;
      treats the assertions as commentary, not actionable directions.
  - page: 70
    speaker: Watcher-of-Stars
    claim: Reports shamans using the Hell’s Kitchen landscape for vision-quests and searching for
      naturally occurring ritual materials.
  - page: 70
    speaker: Electron Glider
    claim: Claims a tourist helicopter operator can be persuaded to land in isolated portions of
      Hell’s Kitchen; this is an in-world allegation.
  - page: 70
    speaker: Ridge Runner
    claim: Claims syndicate competition in Loveland extends across the Fort Lewis border, and alleges
      hired gang interference.
  - page: 71
    speaker: Smiley
    claim: Alleges Puyallup officials answer chiefly to criminal syndicates rather than city or corporate
      government, including violent reprisals against dissent.
  - page: 71
    speaker: Conspi-I-See
    claim: Speculates that Tir Tairngire actors may covertly use Tarislar as a channel for exiles
      and smuggling; multiple interpretations are presented, not established.
  - page: 72
    speaker: Rigger X
    claim: Reports Black Rains ties with Cascade Orks and tunnel storage networks, and mentions their
      permitting outsiders to hide there.
  - page: 72
    speaker: Mist
    claim: Describes mutual contempt between the Princes and Ancients, including disagreement about
      status and relative respect.
  - page: 72
    speaker: The Dead Deckers Society
    claim: Praises the Reality Hackers’ electronic parties.
  - page: 72
    speaker: Burning Chrome
    claim: Claims Reality Hackers profit from physical theft of isolated computer hardware and dataslats.
  - page: 72
    speaker: Impact
    claim: Claims the Reality Hackers broke with the yakuza after being targeted in an operation
      against Pacific Rim Communications and speculates about later Seoulpa ties.
  source_controls: Each statement remains attributed, including speaker rumor and speculation. No
    comments are presented as real-world guidance or independently established sourcebook narrator
    fact.
