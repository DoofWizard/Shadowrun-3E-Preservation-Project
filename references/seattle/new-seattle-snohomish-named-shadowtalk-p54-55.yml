data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: corrected Third Printing (2001)
    nature: Fictional cyberpunk tabletop role-playing game sourcebook; not a report
      about present-day Seattle.
  provenance:
    printed_pages: 54-55
    physical_pdf_pages: 55-56
    original_page_images_reviewed: true
    section: Snohomish named in-world Shadowland commentary
  claims:
  - speaker: Paranaturalist
    printed_page: 54
    report: The speaker expresses concern that different aquaculture ecosystems are
      being introduced into the Snohomish River without joint stewardship; their competing
      uses may produce environmental harm or exhaust its resources.
    certainty: In-world environmental concern/prediction, not established narrator
      conclusion.
  - speaker: Condor
    printed_page: 54
    report: The speaker says a shaman calling himself Dancing Reed has attempted to
      close aquaculture businesses by calling river spirits to damage pens and sending
      river critters to eat crayfish and other crops; several affected aquaculture
      corporations are offering rewards for his arrest and capture.
    certainty: Named in-world speaker report; the identity and actions are not independently
      established by the narrator.
  - speaker: Galen
    printed_page: 54
    report: The speaker repeats a contrary rumor that Dancing Reed is not a shaman
      but a free river spirit of the Snohomish River trying to clear its banks and
      capable of multiple forms.
    certainty: Explicit in-world hearsay that disputes Condor's purported identity.
  - speaker: Smiley
    printed_page: 54
    report: The speaker alleges that agriculture corporations are buying farms to
      expand, using threats and strong-arm tactics against unwilling sellers, while
      farmers cooperate and hire outside security, including shadowrunners.
    certainty: Named in-world allegation about land coercion and defensive responses,
      not a narrator-verified conclusion.
  - speaker: The Dead Deckers Society
    printed_page: 54
    report: The speaker characterizes the local Matrix systems as mainly agricultural
      and aquacultural, typically Green or Orange systems with basic IC protecting
      employee records and schedules; Society Farms' speculative genetically engineered
      super-tomato plans are offered as a rare example of valuable data, while Edmonds
      and VisionCrafters are said to have more valuable information and correspondingly
      stronger security.
    certainty: Named in-world evaluation; system colors are period-setting technical
      classifications, not verified statistics.
  - speaker: Nuyen Nick
    printed_page: 55
    report: The speaker says Edmonds Instruments may be receiving profitable AresSpace
      contracts that could strengthen it against Federated-Boeing, while Federated
      wants advance knowledge of Ares' plans.
    certainty: Introduced by the speaker as information heard, not independently established.
  - speaker: Social Adept
    printed_page: 55
    report: The speaker describes Snohomish gangs as relatively few, consisting in
      part of metahuman groups that intimidate locals while protecting themselves
      from anti-metahuman hostility, and in part of human vigilante-style groups seeking
      to assault metahumans and exclude them from their homes. The speaker explicitly
      attributes prejudiced language about metahumans to those human groups.
    certainty: An attributed assessment of locally competing intimidation and protection
      practices; no narrator confirmation or endorsement of the groups' rhetoric.
