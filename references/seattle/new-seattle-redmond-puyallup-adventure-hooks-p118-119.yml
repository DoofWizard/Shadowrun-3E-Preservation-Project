      "redmond": [
        "An optional mystery in the Plastic Jungles begins with unexplained deaths and frightened locals. The book leaves the cause open, suggesting an interested corporation, a toxic shaman or other protector figure, or a discovery involving mutated/paranormal vegetation.",
        "A proposed conflict has Gaeatronics hiring runners to recover experimental isotopes stolen from a shipment. Gaeatronics suspects Shiawase Atomics, but the scenario reveals that eco-terrorists it hired are loyal to a toxic shaman called Burning Bones and may have dangerous plans for the isotopes.",
