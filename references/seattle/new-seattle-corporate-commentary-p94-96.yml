headline: Named in-world corporate commentary — fictional Shadowrun New Seattle sourcebook
summary: 'FanPro LLC, New Seattle, FanPro10657, Shadowrun Third Edition corrected Third Printing (2001),
  printed pp94-96/PDF95-97: source-attributed fictional shadowtalk, speculation and advice, not verified
  real-world allegations or narrator-established corporate facts.'
data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_publication_copyright: FASA Corporation (1999)
    nature: Fictional tabletop RPG sourcebook describing an invented Seattle Metroplex and corporations
  section: The Corporate Sector / in-world shadowtalk
  speaker_attributed_claims:
  - speaker: Hood
    printed_page: 94
    subject: Novatech
    claim: Asserts that William Ager, formerly Fuchi’s “resources adjuster,” was hired by Novatech in
      Seattle to coordinate a black-operations division and hire shadowrunners, and warns about Ager’s
      racism and use of contractors.
    certainty: named in-world speaker assertion, not independently established by narrator
  - speaker: Mick the Quick
    printed_page: 94
    subject: Novatech
    claim: Suggests corporate reconstruction and reorganization offer opportunities for opportunists to
      exploit potential security lapses.
    certainty: speculative in-world commentary
  - speaker: The Dead Deckers Society
    printed_page: 94
    subject: Novatech Matrix
    claim: Describes Novatech’s distributed Matrix defense and advanced ice as formidable, referring to
      psychotropics, party IC and measures designed to impair intruders’ cyberdecks.
    certainty: in-world technical assessment
  - speaker: Renraku Fox
    printed_page: 94
    subject: Renraku leadership
    claim: Portrays Seattle acting director Tadashi Marushige as a determined corporate troubleshooter
      undertaking a punitive campaign following Renraku’s prior setbacks.
    certainty: in-world characterization of intent
  - speaker: Renraku Fox
    printed_page: 94
    subject: Fuchi-related corporate rivalry
    claim: Claims a shadow conflict between the Novatech compound downtown and Renraku’s Bellevue compound,
      involving Samantha Villiers’s interest in former Fuchi research data, Renraku’s desire to keep acquired
      material, and changing access credentials.
    certainty: named in-world claim and forecast, not established narrator fact
  - speaker: The Dead Deckers Society
    printed_page: 94
    subject: Renraku Matrix
    claim: Characterizes Renraku Seattle Matrix security as especially defensive and describes cascading
      security responses involving multiple Renraku security deckers.
    certainty: in-world technical assessment
  - speaker: Cybermouse
    printed_page: 94
    subject: Renraku systems
    claim: Advises a discreet approach to possible Renraku system weaknesses during recovery from the
      arcology shutdown.
    certainty: in-world advice/speculation, not a verified vulnerability
  - speaker: Geeker
    printed_page: 95
    subject: Saeder-Krupp
    claim: Claims Lofwyr’s local agents secretly hire shadowrunners for varied operations, corporate intelligence
      and influence concerning other corporations, public officials, media figures and criminals; motives
      are not presented as proved.
    certainty: named speaker’s allegation and speculation
  - speaker: Air-Wisp
    printed_page: 95
    subject: Shiawase
    claim: Claims Shiawase uses informants, watchers and industrial spies to detect threats and warns
      against interacting with apparent operatives.
    certainty: named in-world security allegation
  - speaker: Lex Talionis
    printed_page: 95
    subject: Shiawase and Fuchi
    claim: Claims Shiawase seeks Fuchi employees, material and data while disputing former Fuchi assets
      with Novatech and Renraku; notes that competing claims have yet to be resolved by the Corporate
      Court.
    certainty: named speaker’s claim; legal status as reported, not verified real-world fact
  - speaker: Winger
    printed_page: 96
    subject: Shiawase and Gaeatronics
    claim: Claims Shiawase Atomics wants part of Seattle’s power market but encounters building regulations,
      while implying Gaeatronics enjoys favorable local connections.
    certainty: speaker allegation and insinuation, not narrator-confirmed favoritism
  - speaker: The Dead Deckers Society
    printed_page: 96
    subject: Shiawase Matrix
    claim: Claims Shiawase is using older Fuchi ice and repairing/upgrading its Matrix defenses; contrasts
      trace-and-deck-damage defenses with more lethal ones.
    certainty: in-world technical assessment
  - speaker: Cherry Blossom
    printed_page: 96
    subject: Wuxing and Triads
    claim: Predicts Wuxing’s expanding Seattle trade and a new MPCP chip may bring Triad operations into
      rivalry with established megacorporate interests and speculates about a temporary alignment with
      the new Shotozumi-rengo yakuza.
    certainty: forecast and alleged prospective alliances, not established outcomes
  - speaker: Finder-Man
    printed_page: 96
    subject: Yamatetsu
    claim: Speculates that Seattle division head Mary Luce may seek alliances with Wuxing and Novatech
      as Yamatetsu adjusts to new leadership.
    certainty: in-world forecast, not an established agreement
  editorial_note: Sourcebook speaker posts, including speculation and operationally phrased rhetoric,
    are historical fictional RPG commentary; the actual reported category and qualified certainty of each
    claim are retained, not endorsed.
status: ingested
