data:
  publication_context: 'Fictional tabletop RPG archival source: Missions, FASA Corporation,
    copyright 1996, FASA7325, original Second Edition, source.fasa-7325, printed pp10,11,12/PDF
    pp11,12,13.'
  source_review_scope: Statements below report this fictional published source; scenario
    options are hypothetical game-master branches, not historical assertions or real-world
    advice.
  fictional_scenario: Leopard’s Den is an optional investigatory encounter at the
    fictional Solomon Arms hotel, a four-story building where Tanner keeps a third-floor
    suite. These cited pages do not independently establish the hotel’s neighborhood.
    The original describes the hotel as modestly maintained, with a clerk and other
    residents.
  scene_entry: The suite is locked and initially empty. Inside it appears recently
    occupied but disordered; no overt struggle is apparent. A telecommunications terminal
    can contain Tanner’s undisclosed local notes, including the suspected gang patients’
    aliases and the clinic communications number.
  investigation_limit: The published source explicitly treats the patient list as
    a weak investigative lead because identities are uncertain and multiple false
    matches can waste in-game investigation time. The scenario encourages game masters
    to direct attention back toward Cuca or Tanner instead of pretending the names
    prove membership.
  possible_tanner_return: Tanner can return after the players search. Surveillance
    choices determine which characters notice him or which observers he detects. On
    identification via an obscure Kansas City Chiefs code phrase, he recognizes fellow
    Lone Star officers and describes his delayed investigation as surgical recovery.
    His responses remain erratic because of undisclosed conditioning.
  command_and_agency: The fictional narrator states that clinic staff monitor Tanner
    through an implanted two-way radio. Dr. Cuca initially gives conflicting instructions,
    then reorients Tanner toward an encounter arranged with the gang. Tanner does
    not know the implant is influencing his behavior and cannot accurately recognize
    what the clinic has done to him; optional results depend on player actions.
  game_master_variants: If the players instead go to Dr. Cuca’s shop, the printed
    adventure directs them to the Chez Cuca scene; if they accompany Tanner to a staged
    meeting, it directs them to Whose Side Are You On?; Matrix investigators are directed
    to Decking the Doctor. These are optional branching fictional scenes, not prescriptions
    for real-world behavior.
  consequence: The game-master guidance warns that attacking Tanner and causing his
    injury may produce in-game disciplinary consequences from the Lone Star organization;
    these outcomes are conditional on player choices, not established narrative history.
