data:
  publication_context: FICTIONAL Shadowrun tabletop RPG alternate-history adventure
    source Missions (FASA7325), FASA Corporation (1996), original Shadowrun Second
    Edition, catalog source.fasa-7325, printed p52/PDF53.
  narrative_classification: The publication invents this NASA/Mars/Veil history for
    a Shadowrun tabletop adventure. References to real NASA and the United States
    are fictional alternate-history worldbuilding, NOT documented real-world events.
  prologue_august_18_2057:
    setting: In the story, Dr. Robert Zeus is an older Matrix user in Houston Public
      Square in 2057.
    sequence: Zeus reads a sensational news report concerning Dunkelzahn’s Last Will
      and Testament. He recognizes two of three reproduced photographs as material
      he believed remained secret, experiences alarm, and fears those responsible
      will seek him out.
    certainty: This is an authored fictional dramatic prologue; his predictions of
      retaliation are fears, not established subsequent events.
  adventure_introduction:
    player_roles: 'A fictional AresSpace security team investigates mysterious Mars
      photographs appearing in Dunkelzahn’s will, with an optional reference to Portfolio
      of a Dragon: Dunkelzahn’s Secrets p35.'
    campaign_conflict: The game author describes layers of secrecy and sabotage surrounding
      a government Mars mission, a later cover-up, and deliberate sabotage of a mission
      launched by the characters’ employer AresSpace.
    source_function: The printed text previews a fictional conspiracy and dangers
      to player characters; it does not establish any real NASA history.
  fictional_background_2001_2011:
    year_2001: Within this fictional alternate chronology, NASA-sponsored remote Mars
      probes take digital recordings from August through October 2001, including pyramid-like
      formations and a large unidentified skeleton.
    fictional_coverup: The fictional narrator says NASA researchers withheld the findings
      and, under US Department of Defense direction, a covert agency called Veil planned
      a classified human expedition; this is not an allegation about actual NASA or
      the US government.
    operation_discovery: After approximately ten years of covert preparation and spending,
      NASA and Veil launched fictional Operation Discovery with eight explorers; the
      astronauts landed in July 2011 and gathered samples from the purported formations.
    december_24_2011: Five months into the mission, on 24 December 2011, the main
      cabin malfunctioned and the spacecraft crashed on Mars. Three of eight crewmembers
      survived, returning to Earth in a command capsule with most samples. This is
      a fictional game-setting claim, not an actual spaceflight or historical casualty
      report.
  source_boundary: Printed p53 is a separately illustrated page of four fictional
    Mars photographs and caption metadata, not part of the same prose record.
