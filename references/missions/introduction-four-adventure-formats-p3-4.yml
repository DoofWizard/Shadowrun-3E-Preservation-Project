data:
  publication_context: 'Fictional tabletop RPG archival source: Missions, FASA Corporation,
    copyright 1996, FASA7325, original Second Edition, source.fasa-7325, printed pp3,4/PDF
    pp4,5.'
  source_review_scope: Statements below report this fictional published source; scenario
    options are hypothetical game-master branches, not historical assertions or real-world
    advice.
  setting_and_audience:
    story_year: 2058 in the fictional Sixth World
    book_form: Four alternate-campaign adventures in which player characters need
      not be ordinary shadowrunners. The suggested group size is four to six varied
      characters.
    cross_reference: 'Shadowrun Companion: Beyond the Shadows, Alternate Campaign
      Concepts starts printed p110.'
  distinct_campaign_roles:
  - adventure: Under the Influence
    player_role: Lone Star police detectives seeking an exceptionally cybered street
      gang, with an undercover detective at risk.
  - adventure: Malpractice
    player_role: DocWagon security staff accompanying an EMT team.
  - adventure: 'Mission: Mars'
    player_role: AresSpace security personnel or a media team examining Mars photographs
      associated with Dunkelzahn’s Portfolio of a Dragon and the will.
  - adventure: King of the Mountain
    player_role: UCAS military Special Forces assigned to investigate a fortified
      mountain base operated by a delusional magical-army leader.
  approach: The original narrator describes hybrid decision-tree and linear adventure
    structures; game masters may change events, provide additional choices and adapt
    the outline rather than require predetermined outcomes.
  published_structure:
    prologue: Fictional introductory story that establishes atmosphere and is not
      automatically an account observed by the player characters.
    introduction: Private game-master background and setup.
    encounter_parts:
    - Tell It to Them Straight is player-facing scene text, adjusted to match earlier
      decisions and the point of encounter.
    - Hooks are gamemaster suggestions for scene imagery, sensory detail and emotional
      tone.
    - Behind the Scenes is gamemaster-only underlying sequence, clues, maps, consequences
      and NPC game statistics.
    - Debugging offers optional ways to redirect a derailed storyline rather than
      compulsory actions.
    ending: Picking Up the Pieces discusses outcomes, Karma and unresolved story questions.
  preparation: Game masters are encouraged to tailor opponent capabilities and published
    NPC Threat Ratings to the party, rather than assume all groups have the same power;
    this is game balance guidance, not an alteration of the source’s printed statistics.
