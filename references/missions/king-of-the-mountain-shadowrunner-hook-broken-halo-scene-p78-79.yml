    "optional_shadowrunner_contract": "The end of the alternate recruitment setup depicts a fictional UCAS military recruiter: payment can be extraordinarily high; money, equipment, and a clean reputation may be offered in return for a risky secret mission. The book also allows harder pressure, including abducting player characters, holding relatives as leverage, or placing player characters under arrest or confinement. These are explicitly optional coercive fictional plot devices, NOT voluntary recruitment or recommended real-world conduct.",
