    "broken_halo_scene": "The fiction starts at 04:51 local time; Heartbreaker broadcasts that the C-260 has reached an Arctic storm while traveling at 80 kph. The aircraft cannot continue safely, and team members must jump with their packs. Fictional commander Heartbreaker tells participants to rendezvous at parachute signal boxes after landing; gear is cast out from the aircraft.",
