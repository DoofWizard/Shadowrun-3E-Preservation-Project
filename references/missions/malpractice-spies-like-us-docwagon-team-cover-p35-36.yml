    "liz_yamato_briefing": "In the fictional episode Liz Yamato delivers characters to 83rd Street Clinic, instructs them to maintain TRP cover during two weeks of work, gather evidence about a possible information seller from Expert Team Three, and not expose her investigation. She says a captured mole is not useful dead and promises to provide security if necessary. She also indicates their cover SINs will be credited for the two weeks of pay.",
    "arrival_story": "A DocWagon Citymaster drops the team off at approximately 2113 hours. Clinic displays EMT-only signage and, while the characters enter, a crisis dispatch launches Team Eight from the vehicle bay. The dispatched call is fictional ambulance 178-03 at 48th and Crawford; the entry is an atmospheric scene rather than an instruction for real dispatch.",
