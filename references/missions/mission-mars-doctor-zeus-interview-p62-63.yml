      "expectation": "Zeus anticipates callers linked to the photos, probably UCAS CIA or Veil.",
      "photographs": "He recognizes both NASA probe photos from Dunkelzahn's will.",
      "mission_science": "He and now-deceased scientists were assigned to debrief Operation Discovery astronauts and examine Martian samples.",
      "sample_details": "Samples allegedly included fragments of the skeletal and pyramidal remains and surface footage; they were stored below an abandoned missile silo beneath Hoffmann farm, Kansas.",
      "project_cydonia": "Zeus says Project Cydonia's failure had nothing to do with AresSpace and he does not believe MUFON tampered with Cydonia data; he suspects Veil sabotage despite acknowledging no evidence. This belief is his, not an independently established book fact in the scene.",
