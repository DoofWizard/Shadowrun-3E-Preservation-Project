    "enemies": "The source makes surviving Fenmore a possible long-term adversary. He may use military or other contacts against the team; if exposed, his Power rises if the military tries to conceal its involvement; if he learns the team members’ actual names, Knowledge increases. The GM may instead make an escaped associate an adversary. These are fictional tabletop scenario hooks.",
