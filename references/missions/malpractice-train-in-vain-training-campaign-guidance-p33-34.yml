    "entry_and_contact": [
      "Under the original adventure’s default branch, Bob directs the player characters to a rendezvous at the fictional Redmond DocWagon clinic; a dwarf woman who identifies herself as Morphine is actually Liz Yamato, Bob’s DocWagon Internal Security Division contact.",
      "Liz uses the DocWagon Citymaster to take the player characters to an apparently abandoned warehouse west of the fictional Federated Boeing Shipyards at Renton for rapid Temporary Response Personnel training.",
      "The game book frames Liz’s urgent training and her assignment to expose an information leak in Expert Team Three as fictional story events; the possible mole’s identity is not established by the training scene itself."
    ],
    "training_options": [
      "The printed optional campaign version for established DocWagon employees begins with Liz Yamato rather than Bob’s initial recruitment. If player characters ask why Bob enlisted them, the adventure directs the gamemaster to skip to the acceptance section, ignoring the shadowrunner employment framing.",
      "The gamemaster may run regular drills, one of the optional encounters in Sleepless in Seattle (p42), or an invented training scenario; an alternative is an older Virtual Training System version accessed through standard virtual-reality helmets and gloves, with a possible optional datajack hookup.",
      "The training period is described as two days for this mission, unusually shorter than the standard three weeks for TRPs. Its purpose is to keep the characters’ cover convincing while they investigate the fictional theft.",
      "Liz supplies cover SINs and relevant equipment, explains DocWagon procedures, observes suspicious actions, and reminds the characters to remain inconspicuous and to report evidence. The narration states she has no reason to trust them with all details.",
      "For DocWagon newcomers, the book suggests playing the training sequence; for experienced DocWagon characters, it may be skipped. Liz offers pointers to former paramedics to explain new team duties."
