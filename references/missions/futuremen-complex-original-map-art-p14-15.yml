  source_review_scope: Statements below report this fictional published source; scenario
    options are hypothetical game-master branches, not historical assertions or real-world
    advice.
  printed_p14_pdf15_map: Original diagram titled FUTUREMEN COMPLEX AND SURROUNDINGS
    depicts Cafe do Amazonia, MindSound Music and Kennedy’s Cheap Electronics above
    the nine-numbered-room underground compound; a small room 1A, marked doorways,
    a marker for mage station M, and X-marked door positions are visible. The map
    is source artwork, not an inferred geographically precise exterior plan.
  map_room_numbers: 1 surgery, 1A supplies, 2 recovery, 3 observation, 4 Cuca’s office,
    5 ready room, 6 Powell’s office, 7 storage entrances, 8 guard room, 9 command
    center.
  printed_p15_pdf16_illustration: Original large monochrome uncaptioned art shows
    an elaborate top-hatted figure holding a sphere, several armed figures and abstract
    energy or effects in an interior setting; the image occupies the upper part of
    the printed page above original NPC statistics.
  source_limits: Neither uncaptioned artwork nor map establishes the names of depicted
    figures beyond explicit captions or map labels. No game stat is inferred from
    visual appearance.
