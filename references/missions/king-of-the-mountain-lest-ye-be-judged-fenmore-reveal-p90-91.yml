  "headline": "FICTIONAL Shadowrun tabletop RPG adventure Missions, FASA Corporation (1996), FASA7325, original Shadowrun Second Edition, catalog source.fasa-7325, printed pp90-91/PDF pp91-92. Lest Ye Be Judged: Fenmore reveal, coercive history, and negotiation branches.",
  "summary": "FICTIONAL Shadowrun tabletop RPG adventure Missions, FASA Corporation (1996), FASA7325, original Shadowrun Second Edition, catalog source.fasa-7325, printed pp90-91/PDF pp91-92. Neutral archival reporting of a fictional tabletop adventure; original rules, in-world claims, and GM options are distinct.",
  "data": {
    "publication_context": "FICTIONAL Shadowrun tabletop RPG adventure Missions, FASA Corporation (1996), FASA7325, original Shadowrun Second Edition, catalog source.fasa-7325, printed pp90-91/PDF91-92.",
    "scene": "After Archangel Michael falls, the fictional supernatural heaven illusion dissolves into ordinary furnished surroundings. Flame and smoke theatrics reveal former UCAS Colonel Lawrence Fenmore, the organizer behind the Fort Ross compound. His claims that he has surrendered and meant to care for the girls are character statements, not facts necessarily endorsed by the book.",
    "fenmore_claims": "Fenmore claims that the magical girls were rejected by religious families, that he offered a home and training, and that the UCAS should support his plan. He wants continued access to Fort Ross, UCAS support and protection, and future military employment for the girls. These rationalizations appear in Fenmore’s dialogue and are contradicted by discoveries described on p91.",
    "documented_abuses": "The GM narration states that the staff were instructed to abduct children, not merely recruit volunteers. After searching original records, characters learn that the project is approximately six years old; girls of multiple metatypes and countries were taken, many do not know their parents, and the children were subjected to psychological and magical conditioning and forced sterilization. Medical examinations or records corroborate the sterilization. The children are traumatized and cannot readily recall their former lives when controlling magic fades. These source-established coercive abuses must not be mistaken for consensual schooling or protective treatment.",
    "military_intent": "Fenmore’s plans describe a controlled magical army directed against magically strong rival nations and specifically name Tir and Aztlan. He views the children as military resources. UCAS personnel are recorded as prepared to receive the children, but the story leaves its longer-term military handling open and raises doubts about their institutional goals.",
    "gm_outcomes": "Characters may negotiate with Fenmore, kill him, or defer the matter to UCAS authorities. Fenmore attempts to gain favorable reporting and escape and can mobilize his guards if the negotiations fail. Players may inspect journals and records and decide whether to protect or evacuate the children. These are optional tabletop story branches, not present-day legal, military or child-welfare advice.",
    "separation": "Book-narrator facts about abduction and sterilization, Fenmore’s self-exculpatory statements, and player/GM choice branches are separate. Characters might not know the full details until a source-described investigation."
