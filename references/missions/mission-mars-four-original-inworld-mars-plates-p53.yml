data:
  publication_context: FICTIONAL Shadowrun tabletop RPG alternate-history adventure
    source Missions (FASA7325), FASA Corporation (1996), original Shadowrun Second
    Edition, catalog source.fasa-7325, printed p53/PDF54.
  layout: Four rectangular grayscale, image-like panels arranged two-by-two, each
    with a distinct printed caption and overprinted in-world metadata.
  top_left:
    fictional_imprint: ARES Space / Project CYDONIA / System T 2111.03 (Sub Route)
      / Node Destroyed / December 8, 2042 / Crimson clearance only / Destroy if compromised
    depiction: A rover-like vehicle framing a rocky horizon; a small disc-shaped apparent
      object in the sky.
  top_right:
    fictional_imprint: ARES Space / Project CYDONIA / System T 2111.03 (Sub Route)
      / Node Destroyed / December 8, 2042 / Crimson clearance only / Destroy if compromised
    depiction: A similar rover view with a distinct hovering or rotor-like aerial
      object near the sky.
  bottom_left:
    fictional_imprint: NASA Sentry Probe / Alpha Test / August 8, 2001 / Alpha Blue
      Priority / Top Secret Clearance / Destroy if compromised
    depiction: Fictional rocky Martian panorama, pyramidal structures toward the horizon
      and a large skeletal structure in foreground.
  bottom_right:
    fictional_imprint: NASA Security Probe / Zeta Test / October 27, 2001 / Alpha
      Blue Priority / Top Secret Clearance / Destroy if compromised
    depiction: Overhead crater-strewn terrain with angular/pyramidal shapes in a monochrome
      simulated orbital frame.
  source_guard: These are illustrations/photos printed as story props in a fictional
    tabletop RPG and must not be represented as actual classified NASA or AresSpace
    source material.
