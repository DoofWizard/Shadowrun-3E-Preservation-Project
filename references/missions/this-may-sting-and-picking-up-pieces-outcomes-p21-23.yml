  section: 'Under the Influence: This May Sting a Little; Picking Up the Pieces'
  source_story_context: The player-character investigators, potentially with Lone
    Star support, are directed toward Dr. Cuca after uncovering his role in the Futuremen
    project; the scenario distinguishes wanting to arrest him alive from a character
    seeking revenge for Tanner or another officer.
  player_facing_branching:
  - The gamemaster may allow an overwhelming-force arrest demand, a direct confrontation,
    or another roleplayed approach; use map and character statistics in Chez Cuca,
    printed pp14–15, which are earlier in this publication.
  - Lone Star may provide a Fast Response Team, a combat mage or GridSec decker; whether
    the investigators have these allies depends on their prior choices and requests.
  - Characters who escaped the ambush or defeated the Futuremen travel approximately
    ten minutes from the ambush to Cuca’s clinic. Any requested backup is assumed
    to arrive around the same time for the example timeline.
  - If characters call for immediate police assistance, arriving deckers and/or an
    astral mage may disrupt the default events.
  - The timing below is deliberately flexible; the gamemaster may delay Powell’s command
    if the characters need sufficient time to follow up clues or capture Cuca.
  - The shutdown may accelerate if company personnel notice uniformed Lone Star officers,
    causing the data transfer or explosives to occur before the default sequence.
  - Optional further complications include an additional Lone Star reinforcement wave,
    seeing Lindy escape in a departing truck, or returning Futuremen survivors who
    complicate an attempted arrest.
  in_world_personnel_priorities: Renraku manager Marcus Powell prioritizes eliminating
    evidence linking the project to Renraku, preserving research records, then removing
    equipment and evacuating staff. This ordering is part of the fictional scenario,
    not practical guidance.
  post_scenario_outcomes:
  - If investigators arrive before the facility is cleared, they may arrest Cuca and
    Powell and collect evidence; a convincing prosecution may depend on what remains.
  - Lone Star officers Captain Burns and others may commend successful investigators,
    even as Cuca and Powell dispute responsibility and Renraku publicity disavows
    the two as individual renegades.
  - The text allows a longer legal dispute lasting months and possible convictions;
    none of those optional future outcomes is fixed canon.
  - Even if evidence is lost, Futuremen activity ceases for a time, Tanner and other
    gang survivors may obtain removal of their unwanted cyberware, and Renraku could
    reopen work in a different city later.
  - Lone Star may independently investigate officer conduct. If Tanner dies—particularly
    at the characters’ hands—investigators may face reprimands or murder charges depending
    on in-world circumstances. The characters may also answer for unlawful entry,
    harm to civilians, or damage to property.
  - The book states that the seized equipment and cyberware may instead be directed
    to Lone Star Research and Development or Psychology Division for study, despite
    the official evidence vault being its usual destination; the source describes
    institutional interest in countering conditioning, not willing participation by
    the original test subjects.
  remaining_uncertainty: Character choices, live evidence, legal findings, research
    resumption and future disciplinary sanctions are all conditional scenario branches
    rather than mandatory outcomes.
