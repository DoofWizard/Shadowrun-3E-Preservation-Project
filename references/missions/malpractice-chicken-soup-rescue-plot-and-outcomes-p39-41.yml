    "source_context": "Fictional tabletop role-playing game: Missions (FASA7325), FASA Corporation (1996), original Shadowrun Second Edition adventure collection, catalog source.fasa-7325. Printed pp39–41/PDF40–42.",
    "scenario": "Malpractice / Chicken Soup, an invented tabletop adventure rescue of people from a fictional cockatrice warehouse.",
    "original_emergency_call": "Expert Team Three receives a fictional plea from Gloria Tanaka, who reports her husband Peter Barnsworth works for Parashield Incorporated, a company that trains and sells security paralimals. She attributes a cage-handling paperwork mix-up to their warehouse management and says cockatrices were released and attacked or incapacitated staff. She reports people on crates and other workers lying on the floor; she believes the animals were tranquilized for transport, but the sedation is wearing off. She asks responders not to injure the cockatrices and cites Parashield’s claimed 200,000¥ training investment for each animal. These assertions belong to the named fictional caller and are not verified outside the in-world adventure.",
    "rescue_dilemma": "The fictional scenario asks player characters to rescue clients and as many others as possible while subdued cockatrices regain movement. The book explicitly presents loss of nonclient workers as a possible tragic result if the players cannot save everyone; this is conditional GM narrative, not a mandated outcome.",
    "gm_background": "The GM-only narrator reveals a fictional yakuza group intended to raid what it believed to be a nearby weapons-shipment warehouse. After a diversion involving the fictional Knight-Errant guards and altered warehouse manifests, one disguised participant changed the cockatrice cage control program; opening the cages coincided with the planned strike and incapacitated employees. The operation turned into an armed conflict between the yakuza and fictional security guards elsewhere in the dock complex. This is narrative causation in a published adventure, not real-world advice.",
    "rescue_team": "Seth Palatine instructs TRP player characters to enter because paramedics are at risk. Viv and Seth ride in the rear compartment; Shawn drives. Gordon objects but Seth asks for a Crisis Response Team. Gloria Tanaka and another worker are atop crates, Peter Barnsworth and a warehouse manager are on the floor and are the two fictional DocWagon clients, and the other workers are nonclients. The story identifies eight incapacitated people on the warehouse floor: Peter Barnsworth and the warehouse manager are DocWagon clients, and the other six are nonclient workers.",
    "named_outcomes": "As narrated if the players save people, Gordon ultimately climbs crate stacks and helps carry a wounded nonclient out while taking a Serious Stun wound. A responding CRT transports nonclients to Seattle General and the clients are returned to the 83rd Street Clinic. The book also offers debugging for failure: character injury or damage from provoking the animals, legal/corporate repercussions for destroying Parashield cockatrices, and possible DocWagon discipline; these are conditional plot options.",
    "agency_and_consents": "The people incapacitated by cockatrices and the animal sedation are involuntary or outside their control. The player characters independently choose rescue tactics; neither a corporation’s financial claim nor the GM’s default scenario authorizes harming people or animals in reality."
