    "hooks": "The source frames the jump as a sudden arctic storm after an initially calm flight. Heartbreaker and Wonder Woman are established as fictional military commanders with contrasting personalities; Heartbreaker is manic and the latter is more restrained.",
    "three_crates": "The team divides parachute-equipped supplies into three crates. The fictional GM says one holds snowmobiles and long-distance communications, another contains tents and clothing, and food is distributed among all three. Two crates are carried away into the surrounding mountains by the storm; the remaining crate’s heat signal fades as it sinks into snow. The distinct crate contents and distances matter to the GM decision.",
    "choice": "The party cannot realistically reach all crates; saving the tents may sacrifice communications and snowmobiles. The scenario treats making a harsh choice under stress as the point of the encounter, not a recover-all puzzle.",
