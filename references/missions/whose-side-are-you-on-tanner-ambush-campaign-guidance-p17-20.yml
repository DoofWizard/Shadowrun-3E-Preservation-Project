    "scene_title": "Whose Side Are You On?",
    "opening_p17": "Tanner leads the characters toward what he describes as a meeting with a contact near a deserted warehouse district. The narration then reveals a planned Futuremen ambush, in which Tanner is complicit and realizes he may also be endangered.",
    "alternate_p17_p18": "The adventure permits the game master to relocate the confrontation when character choices diverge, including at the music shop, clinic, or Tanner's apartment; it is not a fixed historical event. The source recommends modifying Futuremen mix and difficulty to suit the player party.",
    "book_narrator_p18": "In the fictional scenario, Dr. Cuca organizes an ambush to stop the investigation, while Tanner may become expendable. The Futuremen receive remote instructions from technicians rather than exercising independent tactical judgment.",
    "character_agency_p19": "The source frames several player-character options, including attempts to exploit delayed responses, seek emergency police aid, use fictional magical means, or investigate whether the Futuremen can understand orders in Amazonian Portuguese. These are optional game branches, not guarantees of outcome.",
    "reinforcements_p19_p20": "The author describes optional Lone Star patrol, Fast Response Team, and Department of Paranormal Investigations involvement depending on player-character requests and in-game timing; their exact game statistics and dice intervals are preserved in the separate rules record.",
    "debugging_p20": "The author cautions that the encounter may overwhelm player characters. Suggested game-master adjustments include altering Futuremen strength, changing responder arrival timing, allowing injuries instead of fatal outcomes, and furnishing evidence that links the fictional doctor to the group. The hypothetical conclusion may lead to This May Sting a Little.",
