  "headline": "FICTIONAL Shadowrun tabletop RPG Missions, FASA Corporation (1996), FASA7325, original Second Edition, catalog source.fasa-7325, printed pp73-74/PDF pp74-75. King of the Mountain: fictional Fire From Heaven prologue, Fenmore and Fort Ross history.",
  "summary": "FICTIONAL Shadowrun tabletop RPG Missions, FASA Corporation (1996), FASA7325, original Second Edition, catalog source.fasa-7325, printed pp73-74/PDF pp74-75. Archival third-person reference treatment of fictional in-world narrative and optional GM choices, preserving agency and attribution.",
  "data": {
    "publication_context": "FICTIONAL Shadowrun tabletop RPG Missions, FASA Corporation (1996), FASA7325, original Second Edition, catalog source.fasa-7325, printed pp73-74/PDF pp74-75.",
    "prologue": "The fictional prologue describes Elizabeth Moonstraw as a bruised young captive subjected to threats and coercive interrogation by two men. She withholds information concerning her aircraft delivery from the Trans-Polar Aleut territory, and the captors seek identities and information about a mountain installation.",
    "magical_event": "Moonstraw invokes religious language and the City of God. The story depicts a prepared, anchored magical explosion that kills her interrogators; she vanishes from the scene. These are fictional events, not real-world operational instructions.",
    "fort_ross": "The Shadowrun alternate-history 2029 Computer Crash erased the location of Fort Ross, a partially built United States nuclear and biological warfare shelter in the Alaskan range. In 2051 Colonel Lawrence Fenmore discovers surviving paper records and takes possession of the hidden base.",
    "fenmore": "The source identifies Fenmore as a former Humanis Policlub member who appropriates apocalyptic Christian and Archangel Michael imagery for an extremist personality cult and a private armed group.",
    "kidnapping_and_coercion": "The narrator explicitly says Fenmore and thirty-five other adults abduct magically active girls, raise and train them against their will as soldiers, and ultimately plan to attack Tir Tairngire or Aztlan. This is kidnapping and involuntary indoctrination, not voluntary recruitment.",
    "rangers": "After a girl under captivity triggers an anchored spell that kills herself and interrogators, the UCAS sends Army Rangers to the site, Mountain 9347, who do not return.",
    "campaign_setup": "The characters are UCAS Special Forces investigating the apparently occupied mountain. A blizzard forces an early drop, loss of communications and supplies; the fortress contains illusions, visions and traps. The adventure does not establish whether Fenmore's claims are true outside its fictional setting."
