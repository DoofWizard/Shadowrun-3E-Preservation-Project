  "data": {
    "source_context": "Fictional published tabletop role-playing game: Missions (FASA7325), FASA Corporation (1996), original Shadowrun Second Edition. Catalog source.fasa-7325. Printed pp36–39/PDF37–40.",
    "scene": "At the fictional clinic, Team Three receives a call for ambulance 844-01, crisis on Thomas and Fairview. The original adventure has medics and TRPs respond in a DocWagon Citymaster to a fictional gunfight involving fleeing shadowrunners and Lone Star patrol officers.",
    "background": "The GM-only narrator presents a fictional shadowrunning team that broke into a Lone Star facility and acquired evidence of embezzlement. Their decker was attacked by black IC before copying all files, escaped with dump shock and injuries, and was pursued by two Patrol-One vehicles in a running exchange of fire. The team abandoned its shot-out vehicle and fled on foot rather than surrendering. The corrupt director of the fictional facility has ordered four officers to shoot the fleeing team under a resisting-arrest pretext regardless of whether anyone resists; this is the attributed in-world illicit motive, not a factual statement about real policing.",
    "initial_confrontation": "The fictional client Onizuka and her wounded team are trapped near a wrecked van and two patrol cars. The scene has DocWagon personnel attempt to render aid while Lone Star officers take positions. Viv and Gordon bring medical gear, Seth monitors the scene, and Shawn operates the Citymaster.",
    "option_one": "In Option One, I Fought the Law, a Lone Star officer attempts an arrest, threatens the player characters and seeks to provoke a violent response so the security service can intervene. The officer may issue explicitly prejudicial insults against a metahuman character; the book does not present those as the narrator’s ethical approval. The player characters can negotiate via DocWagon’s contractual and procedural commitments, or may choose to resist, changing the consequences. The temporary Etiquette test is separately preserved as rule_exact.",
    "option_two": "In Option Two, Cross-Eyed & Painless, the fictional shadowrunners attempt to use the Citymaster and its crew as mobile cover; depending on GM/player choices they may attempt to seize the vehicle, threaten but do not intend to shoot hostages, and seek the decker’s transfer to a street doctor. Lone Star officers may become convenient temporary allies of the player characters against the shadowrunners if those officers look likely to lose; the shadowrunners may instead become contacts of the characters who help them. Outcomes depend on wounds and escalation.",
    "campaign_conditions": "The book advises that DocWagon-employed player characters are expected to respect fictional corporate procedures; attacking Lone Star officers, negligently losing the covered client, or appearing complicit in a carjacking may cause penalties and jeopardize their cover. GM decisions determine whether the undercover mole investigation survives.",
    "attribution_and_uncertainty": "All arrests, attacks, attempted hostage threats, team tactics and corruption are invented-world narration or explicit optional game-master branches; no scenario outcome is asserted as obligatory.",
    "conditional_outcomes_exact": [
      "The fictional officer confrontation escalates if player characters shoot or attack Lone Star personnel, which breaches DocWagon jurisdiction and permits the officers to attack the Citymaster and assisting player characters.",
      "The scenario says Lone Star officers retreat if the decker has been killed or if three of their number take a Serious wound or greater.",
      "The original option allows player characters to assist the shadowrunners but may cause lasting employment and cover repercussions, including if the covered client dies or the Citymaster is stolen due to their actions.",
      "Without provocation, attacking the shadowrunning group creates the same adverse employer consequences as attacking the Lone Star officers."
    ]
  },
