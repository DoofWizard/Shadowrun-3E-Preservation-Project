  "summary": "FICTIONAL Shadowrun tabletop RPG adventure Missions, FASA Corporation (1996), FASA7325, original Shadowrun Second Edition, catalog source.fasa-7325, printed pp87/PDF pp88. Neutral archival reporting of a fictional tabletop adventure; original rules, in-world claims, and GM options are distinct.",
  "data": {
    "publication_context": "FICTIONAL Shadowrun tabletop RPG adventure Missions, FASA Corporation (1996), FASA7325, original Shadowrun Second Edition, catalog source.fasa-7325, printed p87/PDF88.",
    "established_scene": "The four fictional students Abigail, Wendy, Flora, and Katrina, described by the source as two human and two elf girls aged approximately twelve to fourteen, attend a hermetic shop class and attempt an enchantment for parchment-scroll fetishes. They sing to center themselves while reducing the Drain of their Personal Physical Shapechange spells. The girls have been told to flee and alert the compound if they encounter outsiders.",
    "physical_and_astral_observations": "Their uniforms resemble angel costumes associated with the preceding supernatural visions, but no one girl matches an individual angel. Characters who harm the apparent doves discover they were transformed children; characters using magical perception can identify dissipating magical auras, and a physical examination shows abdominal incision scars. The original source does not explain the causes of these scars here.",
    "conditional_encounter": "The girls try to escape using magically produced mist, invisibility, levitation, illusory doubles, or similar effects. Captured girls refer to Archangel Michael and may be frightened by questioning. Escaped girls alert others. The classroom includes unfinished magical components, Christian devotional imagery, and separate lists labeled Nice and Naughty indicating which girls have or have not done well in recent classes.",
    "agency_and_coercion": "These are minors trained within Michael and Fenmore's fictional City of God, not volunteers in a real program. The source describes magical conditioning and grooming for assigned roles and explicitly separates the military's stated objective of protecting the children from unresolved suspicion of its motives.",
    "gamemaster_guidance": "The source directs the GM to emphasize mystery and uncertainty instead of immediately explaining the girls' transformation or the Archangel's identity. It does not present violence toward the children as an advisable solution."
