data:
  publication_context: FICTIONAL Shadowrun tabletop-RPG adventure Missions (FASA7325),
    published by FASA Corporation (1996), original Second Edition; catalog source.fasa-7325;
    printed pp54-56/PDF pp55-57.
  source_role: These are game-master instructions and adventure possibilities within
    a fictional campaign, not real-world security guidance.
  plot_chain:
    start: The optional scenario begins with Benjamin Steele briefing an AresSpace
      Security team in Houston on Dunkelzahn’s three Mars photographs and giving leads
      on NASA’s 2001 probe, Operation Discovery and Project Cydonia.
    discovery_leads: Possible leads include retired Lieutenant Colonel James Yavin,
      the lone living astronaut; scientist Dr. Robert Zeus, who studied Mars samples;
      and Karl Xavier of Astrotech Industries, once a Cydonia investigator and a key
      saboteur.
    zeus_attack: When the player characters meet Dr. Zeus, the written plot has a
      Veil sniper assassinate him and attempt to kill the characters; this is an authored
      scenario event, not an instruction or real event.
    xavier_choice: Xavier can reveal information about his role in Cydonia sabotage
      and may be persuaded to give the player characters a copy of his original data
      to protect himself from former Veil colleagues.
    haggard_silo: At the fictional storage facility in Haggard, Kansas, the characters
      can discover the Operation Discovery capsule, Mars samples, original NASA 2001
      data including unreleased footage, and Veil’s original Cydonia copy. A Veil
      cleanup team is also present to eliminate evidence and the player characters.
    endgame: Surviving characters report to Steele in Houston, and AresSpace chooses
      to keep the story quiet to preserve its relationship with the UCAS government
      rather than publish the discoveries.
  draco_foundation_option:
    source: The Draco Foundation may assist player characters who stall or are stuck;
      a fictional agent can contact them directly or indirectly and nudge the investigation.
    limit: The GM determines the agent’s actions and appearance. This is explicitly
      optional help, not a compulsory protagonist or established event; the text encourages
      players to solve the mystery themselves.
  running_mission_mars:
    players: Designed for 3–5 characters, with investigations favored over firefights.
      Computer and Corporate/Political Etiquette skills are especially useful; a decker
      helps but is not required.
    locations: Primarily Houston, Texas (NASA former site and AresSpace HQ); a meeting
      in western Kansas for the Tales of Hoffman sequence. AresSpace transports agents
      to Kansas and provides a car on arrival; a company car is available as needed.
    team_type: Special Operations Division of AresSpace Security, a fictional corporate-security
      group that can employ combat personnel, deckers, and magicians. Their work includes
      intra-corporate reputation management and competition, as well as investigative
      assignments.
    presentation: AresSpace agents generally wear business suits (possibly armored);
      bulky body armor is not acceptable as regulation office wear and conspicuous
      cyberware is unusual.
    character_creation: The original Second Edition scenario suggests a group with
      no more than one metahuman, most likely an elf or dwarf rather than an ork or
      troll; players must assign Priority C or higher to Skills, and every character
      should have at least two Knowledge Skills to reflect education. The characters
      have salaries sufficient for a Middle lifestyle. These are published setting/campaign-creation
      instructions, not real-world demographic facts.
    alternatives: 'The GM can instead use shadowrunners investigating for AresSpace,
      a rival corporation, the Draco Foundation, journalists from a pirate trid station,
      or a UCAS team concealing or exposing the story. Reassigning the cleanup team
      and core motivations may require substantial plot changes; the text references
      Smile, You’re On Camera! (p114) and Trained to Be Ghosts (Shadowrun Companion:
      Beyond the Shadows p115).'
  boundary: The source next moves to the Investigations briefing and detailed success/mechanics
    tables; these are separately extracted.
