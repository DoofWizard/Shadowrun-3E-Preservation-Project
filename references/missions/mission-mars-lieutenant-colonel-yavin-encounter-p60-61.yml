data:
  publication_context: FICTIONAL Shadowrun tabletop-RPG adventure Missions (FASA7325),
    FASA Corporation 1996, original Shadowrun Second Edition, catalog source.fasa-7325,
    printed pp60-61/PDF pp61-62.
  scope: All persons, NASA/spacecraft events and CAS/UCAS locations are fictional
    Shadowrun campaign continuity, not true historical assertions. Quoted dialogue
    is a GM scenario script, not verified real speech.
  character_and_location:
    identity: Lieutenant Colonel James Yavin, retired Air Force pilot, surviving astronaut
      and member of fictional Operation Discovery.
    personal_profile: At the scenario date Yavin is 75 years old, thin with gray hair
      and slight build, cynical, jaded and embittered. He is originally from Texas,
      served with the US Air Force/NASA and later joined the CAS Air Force after southern
      secession. He retired roughly 20 years earlier.
    home: He lives at Ellington Air Force base near Houston. His home contains Air
      Force/NASA memorabilia and photos of Yavin with spacecraft including a NASA
      shuttle and a large Saturn-V-like rocket.
  base_entry_options:
    scheduled_visit: If contacted in advance, Yavin meets the characters and arranges
      for guards to admit them.
    unscheduled_visit: Unannounced AresSpace employees must give a credible explanation
      to guards without excessive assignment details; guards record names and license
      numbers, then check IDs and license after the visit.
    adverse_outcome: False identification can lead guards to block departure or detain
      visitors for CAS Military Police; source suggests one phone call each and release
      the next day if they contact Steele. Antagonizing the guards or Yavin may cost
      information or access.
  yavin_information:
    expectation: Yavin expects officials to investigate after photos surface in Dunkelzahn’s
      will; he fears agents from UCAS CIA or Defense.
    photos: He recognizes the two NASA probe photographs.
    operation: He was among eight astronauts of Operation Discovery, the secret manned
      mission to Mars.
    crash: He states that December 24, 2011, a main-capsule malfunction caused a crash
      on Mars, killing five inside; Yavin and two others returned in the command ship
      with stone and bone samples. The other two astronauts later died.
    awakening: Yavin believes the mishap may be connected to great dragon Ryumyo’s
      appearance on Earth signaling the Awakening at nearly the same time, but explicitly
      allows that the timing could be coincidence. This is Yavin’s hypothesis, not
      a source narrator-confirmed causal link.
    finance: Yavin says the mission cost NASA billions and contributed to the agency’s
      financial failure, followed by AresSpace’s 2016 buyout.
    zeus: Dr. Robert Zeus was among the scientists who debriefed the astronauts and
      studied samples and equipment; Yavin knows only that Zeus lives in or near Houston
      and says they have not communicated for over 30 years.
