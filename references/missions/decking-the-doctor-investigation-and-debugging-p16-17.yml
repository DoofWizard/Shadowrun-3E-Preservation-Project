    "section": "Under the Influence / Decking the Doctor / Debugging",
    "opening_p16": "The adventure offers a branch for a player-character or NPC decker to examine the Futuremen system once the characters know MindSound Music and Cuca's connected business; the decker can act while other characters investigate the shop. A party traveling away with Tanner proceeds instead to Whose Side Are You On?; the hotel visit refers back to Leopard's Den.",
    "fictional_research_leads_p16": "The player characters can obtain the project LTG number from Tanner's telecommunications system, the in-world datanets, a Shadowland contact with knowledge of the relevant businesses, or through an optional Lone Star GridSec inquiry. Cuca might instruct Tanner not to reveal the number if he suspects he is about to give it away.",
    "host_disguise_p16": "Host A resembles the front music business, and the Host B storefront computers contain records that might appear inconsistent with their nominal business. The true project records are concealed behind a connection in the Control subsystem to Host C. Host C's iconography resembles a tropical beach, with datafiles depicted as beach bags and security IC as lifeguards.",
    "optional_gm_debugging_p17": "The text advises a game master that a capable player decker can discover useful clues, while inadequate decker skill may encounter significant fictional IC. GridSec, if called in as an alternative, may be reluctant to prioritize the request and may return incomplete leads, steering characters toward further investigation of the physical shop.",
