data:
  publication_context: FICTIONAL Shadowrun tabletop-RPG adventure Missions (FASA7325),
    published by FASA Corporation (1996), original Second Edition; catalog source.fasa-7325;
    printed pp56-58/PDF pp57-59.
  source_role: Instructions here are optional tabletop GM scenario framing; neither
    in-world rumors nor adversarial characters are claims about real NASA/US government
    activity.
  tell_it_to_them_straight:
    setting: The characters report to Steele in the AresSpace Security “Briefing Room,”
      where the lighting dims and three Mars photographs from Dunkelzahn’s will are
      projected. Two images are labeled NASA; the third is from AresSpace Project
      Cydonia.
    hooks: Steele directs agents to examine two secret mission threads—the 2001 NASA
      probe and the apparently failed 2042 AresSpace mission—and untangle a layered
      cover-up. This is adventure framing, not settled player-character knowledge.
  steele_briefing:
    public_history: Steele recounts AresSpace’s 2016 purchase of NASA, rumors of files
      not transferred for claimed national-security reasons, and Project Cydonia’s
      2042 failure.
    in_world_assessment: Steele suspects, but cannot prove at briefing, that NASA’s
      photographs and Cydonia’s data share a hidden connection, that Cydonia material
      was tampered with, and that former Defense Department personnel (now UCAS) still
      conceal related data. These are expressly Steele’s suspicions.
    mission_orders: Steele orders investigators to follow leads, including UCAS Defense
      if necessary, and determine the connections and truth; he has contacted the
      Draco Foundation about the images.
    resources: The scenario gives agents passcodes to access Project Cydonia files,
      discretionary mission funds of exactly 100,000 nuyen, company-arranged transportation,
      and whatever remains of that budget as a bonus after successful completion.
  getting_started:
    topics: The legwork starts with the 2001 NASA probe and Project Cydonia; either
      can lead to Operation Discovery.
    sources: The three source categories are AresSpace records and contacts, UCAS
      government sources, and independent contacts such as Shadowland.
    contact_process: Using contacts requires the relevant Etiquette Test; when no
      suitable listed contact is available, use Friend of a Friend rules from Shadowrun
      Companion p63.
    success_tables: The source organizes available information by topic and source;
      printed p59 gives detailed success-tier tables, preserved separately.
  nasa_lead_narrative: NASA publicly released little data about the fictional 2001
    expedition. AresSpace files may contain probe employee accounts and former NASA
    workers’ theories. UCAS systems may contain more classified records. Independent
    contacts may report unverified rumors; each category is distinct from narrator-established
    events.
  cydonia_lead_narrative: According to the fictional scenario, Cydonia probe data
    were sabotaged; internal and independent sources may initially attribute responsibility
    incorrectly to MUFON, while other evidence supports hidden original recordings
    and Karl Xavier’s involvement.
  operation_discovery_lead_narrative: The secret manned expedition involves Karl Xavier,
    Lt. Col. James Yavin and Dr. Robert Zeus. The fictional source says no one at
    Ares Macrotechnology knows Operation Discovery from internal records. UCAS files
    and contacts are the designated lead sources.
  boundary: The published Matrix host and investigation success-threshold mechanics
    on printed pp57–59 are separately preserved in rules records.
