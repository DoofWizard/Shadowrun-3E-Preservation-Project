  "headline": "FICTIONAL Shadowrun tabletop RPG, Missions, FASA Corporation (1996), FASA7325; original Shadowrun Second Edition, catalog source.fasa-7325, printed pp80-82/PDF pp81-83. Winter Wonderland mountain approach, missing Rangers, and angelic visions.",
