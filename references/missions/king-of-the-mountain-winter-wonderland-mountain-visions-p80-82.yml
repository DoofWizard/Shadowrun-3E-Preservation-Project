  "data": {
    "publication_context": "FICTIONAL Shadowrun tabletop RPG, Missions, FASA Corporation (1996), FASA7325; original Shadowrun Second Edition, catalog source.fasa-7325, printed pp80-82/PDF81-83.",
    "winter_wonderland": "The fictional team wakes after the storm in darkness, snow, and vast empty terrain. As the party travels toward a mountain, the book directs the GM to narrate unusual isolation and characters’ difficulty judging distance/time.",
    "missing_soldiers": "A Perception-based discovery reveals remains of four people, two humans and two orks. The book identifies them as UCAS Army Rangers sent by a fictional Department of Defense on a previous exploratory mission. Their equipment froze or was lost in a blizzard, and they were separated from tents and gear.",
    "recoverable_items": "The remains have plastic-coated dog tags. Nearby lie a couple of Colt Manhunters and Colt M22A2s with all clips expended, plus a few bars of high-protein food; their missing supply crates are not recovered here.",
    "banshee": "On the ascent, characters encounter a derelict GMC Banshee panzer. The narrator says its engine and airframe cannot be repaired after a storm. It had been returning after a food drop; the text identifies its rigger as Casey Green, who has a certified credstick for 5,000 nuyen, from which the players may infer recent payment, not an established bribe. The vehicle contains tightly sealed bags of garbage used as insulation.",
    "visions": "Three apparently angelic young girls appear as hallucination-like figures during the approach, discouraging the team. The GM-only explanation identifies them as astral forms of human mages sent from the fictional City of God to find Casey Green and convey warnings; they initially withhold their nature from players. The magic/masking question must remain distinct from the players’ uncertain perceptions.",
    "conditions": "If the astral girls become noticed or pursued they return to their bodies in the mountain. The GM says they flee when player characters initiate aggression; no mission authorization to harm them exists. Heartbreaker is specifically characterized as reluctant to tolerate a fight.",
    "tone": "This is a supernatural mystery and survival scene in a fictional RPG, not real-world survival advice."
  },
