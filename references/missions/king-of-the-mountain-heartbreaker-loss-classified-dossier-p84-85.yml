    "publication_context": "FICTIONAL Shadowrun tabletop RPG, Missions, FASA Corporation (1996), FASA7325, original Shadowrun Second Edition, catalog source.fasa-7325, printed pp84-85/PDF85-86.",
    "facility_history": "The GM-only narrative describes the fictional Fort Ross complex as damaged by decades of flooding, earthquakes, freezing and thawing. Original U.S. containment areas, walls, and ceilings were damaged; older containment artifacts bear warning signs. Archangel Michael and the fictional City of God use part of the old location.",
    "heartbreaker": "The story directs a dramatic loss of the fictional commanding officer Heartbreaker to sentry defenses after entry. The book frames his death as a plot turning point and the remaining team must decide without his guidance; it does not imply players have consent to lose their character.",
    "classified_folder": "After Heartbreaker’s death his belongings include half a dozen classified mission papers. The papers discuss Colonel Fenmore, Archangel Michael, and attempts to investigate or infiltrate Fort Ross. In-world intelligence names City of God, Magical Apocalypse, Archangel, and The Chosen. The materials are fictional classified reports, and players/characters may have lacked this information earlier.",
    "orders_and_coercion": "The dossier says Heartbreaker had orders to kill Colonel Fenmore and Archangel Michael. It additionally directs the fictional team not to damage property or harm innocent people. These are distinct instructions and qualifications in the story; the books’ GM discussion notes the Army wants to protect the young girls rather than injure them.",
    "optional_branches": "The GM may obscure the dossier with tears and damage, or treat missing information as a mystery. If the characters use extreme force or remain in a public fight, the fiction describes magical resistance and likely failure of the mission. A quiet escape route or avoidance of violence is a separate optional storyline.",
    "uncertainty": "The book separately reports a likely Army leak but does not resolve whether Fenmore is innocent or manipulated; players’ suspicion is not a confirmed authorial finding.",
    "source_scope": "Original fictional military adventure characterization, not real-world personnel or action guidance."
