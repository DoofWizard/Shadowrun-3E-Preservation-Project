data:
  publication_context: 'Fictional tabletop RPG published source: Missions, FASA7325,
    FASA Corporation (1996), original Shadowrun Second Edition fictional tabletop
    RPG adventure collection; catalog source.fasa-7325; printed pp26,28/PDF27,29.'
  chapter: Malpractice introduction and campaign framing, excluding the ongoing TRP
    Program section on printed p28
  adventure_premise: A former fictional DocWagon paramedic hires player characters
    to uncover a mole supplying medical records and DNA data to an outside group.
    The player characters take temporary roles on a DocWagon High Threat Response
    team; the source presents the group behind the data requests as an ongoing campaign
    antagonist rather than an established real-world entity.
  gamemaster_options:
  - Adventure can be set in Seattle or relocated to any major city served by DocWagon;
    another mobile healthcare company may be substituted when desired.
  - Player characters may be existing DocWagon employees; otherwise Elizabeth Yamato
    recruits and uses the Temporary Response Personnel program to integrate a team.
  - Characters can be ordinary player-created DocWagon paramedics using historical
    Shadowrun Companion p112, or shadowrunners hired to serve temporarily; preserve
    these as options, not universal requirements.
  - The scenario introduces High Threat Response team life, response constraints and
    street rescue situations, contrasted with ordinary shadowrunning objectives.
  - An adversary may recur in later campaigns; book directs GM to an optional Enemy
    system in Shadowrun Companion pp71–75.
  - The publication provides a single-page option or a broader DocWagon campaign;
    neither alternative is the fixed setting canon.
  time_and_context: The source places TRP staffing creation in late August 2057, after
    rising public demand; discussion begins on printed p28 and continues beyond this
    slice.
  historical_book_cross_references:
  - Shadowrun Companion pp110–113 for supporting rules about DocWagon life
  - Shadowrun Companion p112 for building DocWagon characters
  - Neo-Anarchist’s Guide to Real Life pp41–47 for additional DocWagon background;
    explicitly not required
  - Shadowrun Companion pp71–75 for future Enemy option
