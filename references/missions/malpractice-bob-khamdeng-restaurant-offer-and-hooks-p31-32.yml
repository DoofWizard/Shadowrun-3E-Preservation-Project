data:
  publication_context: 'Fictional tabletop-RPG publication: Missions (FASA7325), FASA
    Corporation (1996), original Shadowrun Second Edition tabletop RPG adventure collection;
    publisher FASA Corporation; catalog/source source.fasa-7325; printed pp31,32/PDF32,33.'
  chapter: 'Never Deal with the Dragon: Tell It to Them Straight, Hooks, Behind the
    Scenes'
  scene: The text suggests fictional player characters meet Bob Khamdeng, also called
    Morphine, at You Should Not Eat So Much!, a public family restaurant overlooking
    Pier 60. A child named Ricky and his protective mother provide social context;
    bystanders in business attire watch the unusually dressed runners. Bob wears an
    old “Sonics in 53!” shirt and orders food for the group, emphasizing an inconspicuous
    public meeting.
  dialogue_and_attribution: The book supplies second-person read-aloud script and
    Bob’s in-character narration. Bob says he once worked as a DocWagon paramedic;
    alleges Brown attempted to recruit him to supply private patient DNA and medical
    histories; says he rejected the offer, was later the only survivor of a staged
    HTR response, and left his old life. These are Bob’s fictional in-character statements,
    with underlying author prologue recorded separately.
  recruitment_terms:
    objective: Find which of four Expert Team Three paramedics is selling patient
      information to Brown; optionally identify Brown’s associates.
    cover: Temporary Response Personnel in DocWagon with Liz Yamato in Internal Security
      providing orientation and contact; team forms an Expert Team Three rotation.
    duration: Four weeks maximum to finish according to the quoted offer.
    compensation: New SIN and registered DocWagon Platinum contract valid two years
      for each player character; fictional wages about 1,000 nuyen per week, plus
      company food and housing during duty. Bob offers an additional 15,000 nuyen
      total to divide if the mole can be proven to DocWagon.
    planning: Bob wants the group ready in two days; source notes he will not raise
      the stated pay.
  behind_scenes: 'The source says Bob has avoided common fixers to avoid rumor, and
    will use the restaurant to establish initial contact. A contact of the player
    characters receives a message from Morphine: he will be at the eatery in two days
    at 1210 hours. He discusses ordinary topics while observing how the players behave.
    If they accept, he directs them to meet Liz Yamato outside the DocWagon Clinic
    in Renton at a Citymaster marked 264-10 and mentions a code-name alluding to the
    “Sonics” discussion.'
  variation: The gamemaster can portray player characters as uncomfortable in a public
    family eatery; Bob may withhold identity/details until the offer is accepted.
    The scene and optional results are not fixed events for the setting.
