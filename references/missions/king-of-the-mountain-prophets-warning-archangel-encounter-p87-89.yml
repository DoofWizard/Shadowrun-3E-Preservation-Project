  "headline": "FICTIONAL Shadowrun tabletop RPG adventure Missions, FASA Corporation (1996), FASA7325, original Shadowrun Second Edition, catalog source.fasa-7325, printed pp87-89/PDF pp88-90. The Prophet's Warning celestial encounter and source-attributed GM outcomes.",
  "summary": "FICTIONAL Shadowrun tabletop RPG adventure Missions, FASA Corporation (1996), FASA7325, original Shadowrun Second Edition, catalog source.fasa-7325, printed pp87-89/PDF pp88-90. Neutral archival reporting of a fictional tabletop adventure; original rules, in-world claims, and GM options are distinct.",
  "data": {
    "publication_context": "FICTIONAL Shadowrun tabletop RPG adventure Missions, FASA Corporation (1996), FASA7325, original Shadowrun Second Edition, catalog source.fasa-7325, printed pp87-89/PDF88-90.",
    "apparition": "As the fictional military team approaches the City of God, guards confront it, music begins, and a six-winged golden-robed figure wielding a fiery sword appears. The character claims religious authority and demands repentance. The scene is scripted as a startling apparition, not a claim that a historical angel exists.",
    "narrator_explanation": "The source's GM narration establishes that Michael, who controls the City of God compound, deploys spells and theatrical effects. In astral form he follows intruders, then returns to his bedroom; its environment is disguised by a Quickened Landscape spell as a heavenly room. He sits behind a Quickened Mask illusion and has six loyal Alphas defending him. The girls have been trained to believe he is the archangel.",
    "forces_and_population": "The facility houses thirty-three soldiers, ten magically active guards or teachers, two riggers and one decker, eleven additional soldiers who teach, five with high-grade cybernetics, four who communicate with Fenmore, and three doctors. The source separately describes 152 magically active girls ages eleven through twenty, with its individual magical-specialty counts preserved in the associated exact-rule record.",
    "encounter_agency": "The guards work cooperatively to protect the girls and use explosive grenades only as a last resort because Fenmore wants to protect the walls. Magical instructors and Alphas defend Michael. The text emphasizes that the children have been conditioned to support his religious interpretations. Characters can surrender or fight; the GM may adjust combat challenge, but the girls and guards are non-player fiction, not real people.",
    "surrender_coercion": "If player characters surrender, Michael accepts them and subjects them to months of forced confinement, psychological and magical indoctrination, torture and starvation. His stated conditions later include coerced surgical castration or sterilization and enforced religious conformity, with possible forced teaching duties. These are source-described abusive fictional threats and coercion, not voluntary medical treatment or recommended conduct.",
    "optional_outcomes": "The source gives the GM discretionary encounter difficulty, potential further UCAS special-forces conflict and the character dilemma of following Heartbreaker's orders versus preserving Michael for possible military use. It reports Michael may be physically more vulnerable after losing his disguise. Choices and hypothetical outcomes remain distinct from events guaranteed to occur.",
    "speaker_attribution": "Statements about being an angel, divine power, and religious authority are Michael's in-world claims; the source explicitly distinguishes the fictional character's stagecraft and magical protections."
