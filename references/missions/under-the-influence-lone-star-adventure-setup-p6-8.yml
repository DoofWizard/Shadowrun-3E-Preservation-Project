data:
  publication_context: 'Fictional tabletop RPG archival source: Missions, FASA Corporation,
    copyright 1996, FASA7325, original Second Edition, source.fasa-7325, printed pp6,8/PDF
    pp7,9.'
  source_review_scope: Statements below report this fictional published source; scenario
    options are hypothetical game-master branches, not historical assertions or real-world
    advice.
  published_role: Under the Influence casts the players as Lone Star detectives seeking
    Sgt. Franco Tanner, an undercover operative who vanished while investigating a
    cyber-enhanced street gang in downtown Seattle.
  narrator_ground_truth: The source says the Futuremen are a small, unusually disciplined
    gang whose members use advanced cybertechnology and conduct precisely coordinated
    actions before dispersing; Tanner located several underground body shops and followed
    links to Dr. Cuca.
  concealed_plot: The narrator identifies Dr. Cuca as part of a Renraku project that
    created the Futuremen using covert implants and conditioning of multiple individuals
    who accepted discounted cyberware without knowing of the hidden behavioral devices.
    The group’s members are directed to gather, act and disperse without subsequently
    remembering their actions. Tanner is conditioned during the investigation and
    unintentionally becomes one of them, while Renraku eventually discovers he is
    a Lone Star officer and directs him against colleagues.
  player_knowledge: At the adventure opening, the player characters do not know Renraku’s
    concealed involvement; their investigation begins with Tanner missing, and the
    published scenario allows different clues and outcomes depending on decisions.
  optional_play_styles:
  - A one-shot using police officers generated under Shadowrun Companion character
    rules, with optional additional Good Karma when appropriate.
  - An established Lone Star campaign can assign investigators, Paranormal Investigation
    mages, or other divisions including a high-risk Tactical/SWAT team.
  - If the players prefer ordinary shadowrunners, the gamemaster can have Lone Star
    hire external investigators because internal staff have not solved the case.
  - The setting can be relocated from Seattle, substituting a local security corporation
    or police department for Lone Star when necessary.
  recommended_party: The author recommends a team with at least one magician; a decker
    is useful but not essential.
  game_master_note: The scenario is explicitly non-linear, and its narrator warns
    game masters to understand NPC motivations and allow the players’ actions to change
    event order.
