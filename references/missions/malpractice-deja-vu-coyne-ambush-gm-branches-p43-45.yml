  "headline": "Fictional tabletop RPG source: Missions (FASA7325), FASA Corporation (1996), original Shadowrun Second Edition; catalog source.fasa-7325; printed pp43,44,45/PDF44,45,46. Déjà Vu optional ambush with trapped child, fictional Brown conspiracy and aftermath.",
  "summary": "Fictional tabletop RPG source: Missions (FASA7325), FASA Corporation (1996), original Shadowrun Second Edition; catalog source.fasa-7325; printed pp43,44,45/PDF44,45,46. Déjà Vu optional ambush with trapped child, fictional Brown conspiracy and aftermath. Original Second Edition fictional publication contents, source-reviewed and not presented as real events.",
  "data": {
    "publication_context": "Fictional tabletop RPG source: Missions (FASA7325), FASA Corporation (1996), original Shadowrun Second Edition; catalog source.fasa-7325; printed pp43,44,45/PDF44,45,46.",
    "trigger": "During return from the previous encounter, or if the wrong person is accused, Brown discovers that his secret operation is threatened; this optional scenario is designed to disorient and endanger player characters, not to guarantee their deaths.",
    "reported_call": "An elf child, Salthili Truan, is said to be injured at the Spring Lakes Apartments construction site in Renton. The dispatcher information is intentionally sparse and includes an alleged fall and irregular heartbeat. The purported wealthy family is part of the lure; the source distinguishes the apparent emergency from Brown’s actual staging.",
    "arrival": "The skeletal worksite, a drainage ditch and a narrow dirt bridge limit the Citymaster route; the player characters can see the small body and are invited to doubt or investigate the circumstances.",
    "gm_reveal": "Brown kidnaps the boy from school, keeps him unconscious and restrained until the ambush, then drops him from the fourth floor. The source describes nonconsensual endangerment and the urgency of reaching the child. Brown also manipulates DocWagon Response Team Allocation to divert calls to Expert Team Three.",
    "attack": "Fictional hired operatives occupy the nearby structure, pipes and girders. Brown’s tactical plan places rockets near the Citymaster to force it into the ditch; five armed operatives and Brown’s escape by car are separate events. The attacker intends to kill or silence the team; characters attempt to save the child and survive.",
    "child_outcome": "The child can be reached and revived if the paramedics reach him within the published seven-turn limit; otherwise the book states that the child dies.",
    "after_action": "Players who preserve cover return to DocWagon, report to Liz, and can investigate Brown through follow-up clues. A successful Interrogation test of a captured operative can reveal the meetup and two blue Superkombi vans. Direct pursuit of Brown requires GM-designed scenes.",
    "optional_guidance": "The gamemaster may substitute APDS ammunition, switch the LAWs for Ballista launchers, alter operative skill based on difficulty, or run the scene with the team unaware of an earlier ambush.",
    "source_attribution": "Events are a fictional scenario and gamemaster options; actor, target, consent and condition of outcomes remain distinct."
  },
