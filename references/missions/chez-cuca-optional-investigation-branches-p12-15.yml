data:
  publication_context: 'Fictional tabletop RPG archival source: Missions, FASA Corporation,
    copyright 1996, FASA7325, original Second Edition, source.fasa-7325, printed pp12,13,14,15/PDF
    pp13,14,15,16.'
  source_review_scope: Statements below report this fictional published source; scenario
    options are hypothetical game-master branches, not historical assertions or real-world
    advice.
  opening: Under the Influence offers Chez Cuca as an optional investigation at the
    music shop concealing the doctor’s clinic. The game master can show ordinary music
    stock and office behavior while maintaining hints that the clerk and clinic are
    not what they seem; this is published adventure presentation, not real-world conduct
    advice.
  entry_and_cover: Depending on the player characters’ stated identity, Lindy may
    treat them as prospective patients, delay access, or ask questions about Tanner.
    In-game investigation can reveal that MindSound Music, an electronics shop and
    a cafe conceal an interconnected fictional site.
  limited_view: Cuca may accompany visitors into surgery and recovery spaces but withhold
    the project’s command and observation rooms; the document presents multiple ways
    for characters to suspect the hidden nature of the facility. His descriptions
    are in-world statements potentially at odds with the narrator’s facts.
  responsive_branches: A party that started at the clinic can investigate Tanner’s
    hotel later. A decker may instead examine the project network using Decking the
    Doctor; a party travelling with Tanner toward the later meeting uses Whose Side
    Are You On?. The narrative allows scenario relocation and event-order changes.
  security_and_outcomes: The author allows player choices ranging from observation
    to confrontation, with possible fictional security response. The Debugging paragraph
    notes that a direct armed intervention or attempt to obtain a police search warrant
    may fail or provide advance warning; this is gamemaster outcome guidance, not
    a deterministic historical event.
  substance_separation: All numerical tests, character statistics, spells, gear codes,
    maglocks and timings from these pages are preserved independently in the exact-mechanics
    record for this section.
