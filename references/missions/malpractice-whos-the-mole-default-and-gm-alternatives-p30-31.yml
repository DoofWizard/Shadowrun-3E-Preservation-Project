  chapter: Who’s the Mole?
  source_default_reveal: The published default GM solution identifies Shawn Ferrer,
    a longtime fictional DocWagon employee and Expert Team Three paramedic, as Brown’s
    mole. He can obtain patient DNA samples without teammates noticing and transfers
    those to Brown. The source specifies his unaltered standard working pattern.
  backstory_and_coercion: Brown investigated Ferrer after recruiting him following
    presumed death of Bob Khamdeng. Ferrer is a dwarf who underwent cosmetic surgery
    to present as human (referenced Human-Looking Flaw, Shadowrun Companion p32).
    Brown first considered using knowledge of the surgery to blackmail Ferrer but
    instead promised to help restore his desired original human appearance once the
    outside group completed its research. Ferrer consented to Brown’s request for
    confidential patient genetic data under that promise; this does not imply DocWagon
    clients consented to release of records. The source reports the data transfer
    continued for about three years.
  gm_choice: Gamemasters are explicitly free to replace Ferrer as mole. Alternative
    suspects include Gordon (Brown may threaten exposure of Gordon’s stimulant habit
    and sale of equipment to fund it), Viv (Brown may falsely promise the data will
    cure VITAS-3 and appeal to her compassion), and Seth (might assist without knowing
    who Brown is or caring about his aims). The gamemaster could make all four complicit.
    These are optional hypothetical story alternatives, not canonical established
    actions of those people.
  organization_mystery: 'Brown’s employer is deliberately unspecified for GM tailoring:
    possible major megacorporate competitor, secret UCAS project, or cult of mantis
    spirits are provided as alternatives. It might offer money, power, BTLs or favors
    and exploit the candidate’s secret. No single sponsor is fixed.'
  source_crossref: Shadowrun Companion p32 Human-Looking Flaw; Threats sourcebook
    suggested as possible crossover.
