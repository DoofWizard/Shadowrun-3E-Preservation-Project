  editorial_method: 'First-pass page-image-reviewed FICTIONAL Shadowrun tabletop RPG
    archival reporting: sourcebook-narrator assertions are separated from named fictional
    commentators, uncertain hearsay, and optional GM scenarios. No Third Edition conversion
    or real-world instruction is inferred.'
  speaker: Unattributed Shadowland file narrator, not an independently verified historical
    actor
  setting: The account places a fictional Dog-totem shaman in the Fremont Peak/Santa
    Rita area. It says he had publicly opposed agribusiness pesticide and land practices
    before the corporations acquired the small farms.
  reported_coercion: The narrator alleges corporate employees forcibly removed him
    from a protest, harassed his home and family, repeatedly attempted arson, damaged
    property, and killed his dog. His wife reportedly left with their child following
    escalating harassment.
  reported_aftermath: The story says the shaman suffered psychological deterioration;
    an arrest effort failed, a corporate building burned in a fire attributed by unnamed
    workers to magic, and staff later abandoned local land as plants decayed.
  reported_magic: The narrator describes a later supernatural fire and the deaths
    of livestock or animals but does not present independent proof of magical causation.
    The continuation specifically reports dead animals with injuries rather than stating
    the shaman was observed killing them.
  attitude_to_communes: The speaker says the shaman later opposed restoration communes
    as a new alleged provocation to agribusiness rather than supporting them.
  additional_responses:
  - speaker: Buster Brown
    printed_page: 77
    claim: Reports animal deaths, including signs resembling claw marks, without a
      verified perpetrator.
  - speaker: Roscoe
    printed_page: 77
    claim: Reports hearsay that other toxic shamans are drawn to the area.
  status_of_account: In-world rumor, accusation, and supernatural anecdote, not confirmed
    by the publication as ordinary real-world fact.
