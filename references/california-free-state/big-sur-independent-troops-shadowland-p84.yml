    narration, named in-world claims, and optional game scenarios remain separate;
    not real-world advice.'
  speaker_accounts:
  - speaker: Santa Maria
    claim: Credits the Sons of Liberty with coming to help a family-owned truck farm
      against waterjackers; says this protection mattered to family survival.
  - speaker: Elspiper
    claim: Relates an unconfirmed story that Major Samuel Hackett asked the UCAS Joint
      Chiefs of Staff to send troops into Big Sur to eliminate waterjackers and was
      ignored; Elspiper also relays alleged wording from the message, without direct
      authentication.
  - speaker: Silver Sammy
    claim: Expresses frustration with Elspiper's purportedly pro-US message; this
      is a reaction rather than an independent corroboration.
  - speaker: CalGirl
    claim: Alleges Captain Frances Hobbs receives resources or payments from Grania
      O'Malley to ignore pirate activity; neither direct evidence nor narrator confirmation
      is supplied.
  narrator_uncertainty: The narrator specifically notes rumors of Hobbs being paid
    by O'Malley and says no convincing evidence has been produced.
