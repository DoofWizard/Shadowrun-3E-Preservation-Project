  editorial_method: 'First-pass page-image-reviewed FICTIONAL Shadowrun tabletop RPG
    archival reporting: sourcebook-narrator assertions are separated from named fictional
    commentators, uncertain hearsay, and optional GM scenarios. No Third Edition conversion
    or real-world instruction is inferred.'
  speakers:
  - name: Lucas
    pages: '77'
    claim: Questions the safety of seafood grown in heavily polluted Monterey Bay.
  - name: Green Girl
    pages: 77,79
    claim: Condemns aquaculture pollution and describes Aqua Arcana's boat fleet in
      a separate comment; both are identified in-world opinions.
  - name: Aleph
    pages: '77'
    claim: Says aquaculture fish are unappetizing; this is a consumer reaction rather
      than a laboratory finding.
  - name: Walrus
    pages: '77'
    claim: Alleges merrow clans attack aquaculture pens and cause worker deaths, disputing
      accounts that accidents are unavoidable.
  - name: Aqua Vitae
    pages: '77'
    claim: Claims the polluted Bay is a dangerous place and speculates about hazards
      to corporate employees.
  - name: Save Our Seas
    pages: '77'
    claim: Describes the group's efforts to work with activists against marine pollution
      and solicits support in a fictional in-world statement.
  - name: Krok
    pages: '78'
    claim: Makes a humorous comment about the scale of Kalamari's giant seafood.
  - name: Bebop
    pages: '78'
    claim: Reports odd things washing ashore and hearsay about Kalamari genetics research.
  - name: Skeptic
    pages: 78-79
    claim: Questions stories of sea monsters and disputes another commentator's claim
      about Aqua Arcana's magical owners.
  - name: Winkelman
    pages: '78'
    claim: Claims to have seen an unexplained fishlike creature near Salinas River
      beach; the anecdote is not verified.
  - name: Coast Guard
    pages: '79'
    claim: Alleges a violent merrow attack on a platform before the treaty was communicated
      to employees.
  - name: Mageboy
    pages: '79'
    claim: Responds that employees harmed merrow and that establishing the agreement
      and calming tensions took months.
  - name: Corp Watcher
    pages: '79'
    claim: Says Aqua Arcana's employee ownership is genuine and mentions reported
      different magical traditions among owners; reports are not proof of those identities.
  - name: TridVid
    pages: '79'
    claim: Speculates, without confirmation, about the identity or type of Aqua Arcana's
      founders.
  - name: Inquiring Mind
    pages: '79'
    claim: Spreads unverified rumors of financing through underwater treasure-seeking.
  - name: Bay Lady
    pages: '79'
    claim: Mentions Aqua Arcana contracts with Kalamari and Save Our Seas.
