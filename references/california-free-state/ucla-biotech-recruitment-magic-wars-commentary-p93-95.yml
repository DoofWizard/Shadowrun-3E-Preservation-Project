  editorial_method: Reference reporting of a fictional tabletop-RPG sourcebook, distinguishing named
    sourcebook contributors, narrator statements, attributed in-world Shadowland assertions, and optional
    game material; no real-world claims or Third Edition conversion.
  named_shadowland_posts:
  - speaker: Student Prince
    printed_page: 93
    claim: Remarks that the fictional medical school has expanded and Thaumaturgy buildings appear
      worn, while the campus is otherwise recognizable; explicitly challenges the description of magical
      institutional conflict.
  - speaker: Outtatown
    printed_page: 93
    claim: Expresses surprise about the reported institutional Magic Wars; offers no confirming evidence.
  - speaker: ResidentSlave
    printed_page: 93
    claim: Says research includes biotechnology and cyberware in the fictional UCLA system; this is
      speaker commentary, not an equipment-stat entry.
  - speaker: Coed
    printed_page: 93
    claim: Alleges a Shiawase–Yamametsu recruitment rivalry and reports that some third- and fourth-year
      biotechnology students disappeared after corporate recruiting meetings. Cites incompatible rumors
      about graduate Chandra Patel—including flight, voluntary employment, corporate detention and
      a fantastical alternative—without deciding which, if any, is true. Do not collapse rumored abduction
      or coercion into a confirmed voluntary job.
  - speaker: Medico
    printed_page: 93
    claim: Alleges that a fictional firm called DocWagon recruits UCLA medical interns through hazardous
      emergency-work placements in disadvantaged neighborhoods, describing initiation-like practices;
      this is a named accusation, not medical advice.
  - speaker: Daredevil
    printed_page: 94
    claim: Claims UCLA production laboratories offer opportunities to steal early simsense or trideo
      releases; this is an in-world allegation and not procedural guidance.
  - speaker: DoggyDog
    printed_page: 94
    claim: Alleges that local university magic-related conflicts altered physical nature spirits and
      elementals in addition to astral conditions. The broader cause and effects are the poster’s
      contested speculation.
  - speaker: Ecoboy
    printed_page: 95
    claim: Adds a separate brief claim about toxic shamans in Coast Town and the Harbor Barrens; the
      source does not establish their role in UCLA’s academic rivalry.
  narrator_source_boundary: Little Lulu’s Magic Wars account, including anecdotal injuries and her
    claim of no fatalities to date, is retained separately as her reported narrative rather than upgraded
    to objective historical certainty.
