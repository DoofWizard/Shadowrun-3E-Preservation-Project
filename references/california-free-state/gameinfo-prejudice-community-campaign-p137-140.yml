    "editorial_context": "Independently reviewed original scanned pages of a fictional Shadowrun tabletop RPG sourcebook. Narrator statements, individually signed in-world claims, and optional game-master guidance are distinguished; not real-world accounts.",
    "chapter_scope": "The FASA fictional Shadowrun Game Information chapter explains GM/player-adjudicated themes and encounter backgrounds rather than prescribing real-world conduct.",
    "prejudice": "The authors explicitly say they do not endorse prejudice. They advise the gamemaster to treat it as an optional roleplaying issue and avoid making the game so hostile that characters cannot participate; Humanis Policlub, Native Californian and opposed metahuman gangs are hypothetical setting examples, not an assertion that all members behave the same.",
    "local_governance": "The book suggests that weak statewide government allows local officials or strongmen to dominate individual towns; the GM can decide who leads and what biases occur town by town.",
    "gypsy_bands": "The historical source uses the term gypsy bands for itinerant mixed-race communities of the Northern Crescent. It describes bartering, annual travel routes, and opposition from some settled communities, and speculates about presence of shamans, mages, deckers and former mercenaries. The book says deckers often lack modern equipment or satellite connections; this is fiction-period terminology, not a general claim about real Roma.",
    "anasazi": "The book labels fictional Mojave nomads Anasazi, depicting secretive spiritual bands whose members compete but collectively protect Mojave lands. It distinguishes shamanic adept and Warrior Way affiliations, low incidence of cyberware, trade/barter and specialized magical plant formulas, and refers GMs to Awakenings and Grimoire II. This is fictional terminology, not a factual description of ancestral Puebloans.",
    "water_wars": "The chapter presents water distribution as a Shadowrun plot topic with fictional supply vehicles and area-dependent market prices; prices are captured in separate exact mechanic record.",
    "corporate_research": "The fiction describes numerous loosely protected California R&D installations and suggests dangerous fictional site-related adventures; no practical directions for real-world intrusion are provided."
