  editorial_method: 'First-pass page-image-reviewed FICTIONAL Shadowrun tabletop RPG
    archival reporting: sourcebook-narrator assertions are separated from named fictional
    commentators, uncertain hearsay, and optional GM scenarios. No Third Edition conversion
    or real-world instruction is inferred.'
  speakers:
  - name: Silversammy
    printed_page: 80
    claim: Questions whether Grania secured her base with military force after California
      Secession.
  - name: Histobuff
    printed_page: 80
    claim: Claims the former military base was abandoned and Grania took control without
      fighting, then repelled later rivals; this is an in-world account.
  - name: Corp Watcher
    printed_page: 80
    claim: Notes the lack of reliable public records on Grania's background or supposed
      Tír shipping connections.
  - name: Hazeldean
    printed_page: 81
    claim: Claims Grania was Anna Smythe, a wealthy shipping-family daughter who became
      a pirate after joining a political club, but this identity is not confirmed.
  - name: Lyta
    printed_page: 81
    claim: Contradicts Hazeldean and says Anna Smythe died in a publicized industrial
      protest; describes alleged suppression of coverage without independent verification.
  - name: Earp
    printed_page: 81
    claim: Claims Grania was Grace Tallchief, a Salish-Shidhe NooTka-Irish mixed-heritage
      dwarf whom the speaker knew personally. This directly conflicts with Hazeldean's
      Anna Smythe story.
  - name: Skeptic
    printed_page: 81
    claim: Mocks Earp's personal-account assertion rather than verifying either identification.
  - name: Mr. Tusk
    printed_page: 81
    claim: Speculates that Grania uses a magical ability to make people disappear;
      contested by Mageboy.
  - name: Mageboy
    printed_page: 81
    claim: Disputes the magical disappearance claim as technically implausible in
      the setting.
  - name: Pasquale
    printed_page: 81
    claim: Speculates that Grania feeds disfavored people to a supernatural creature;
      no corroboration is supplied.
  - name: Reality Czech
    printed_page: 81
    claim: Disputes the most extreme rumors and claims some former employees can be
      found alive elsewhere after receiving warnings.
  - name: Lord Jim
    printed_page: 81
    claim: Disputes Reality Czech for major internal wrongdoing, claiming senior former
      employees die rather than escape.
  source_status: Mutually contradictory allegations are not consolidated into a true
    identity or accepted fact of violence.
