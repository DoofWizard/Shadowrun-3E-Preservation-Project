    printed_pages: eight unnumbered color art plates between printed pp80 and 81
    physical_pdf_pages: 80-87
  plate_catalog:
  - pdf_page: 80
    printed_page: null
    source_caption_topic: Opening title plate
    art_reference: Illustrated opening title for Scenes from the California Free State;
      depicts people in small boats against an enormous tentacled marine creature
      in a coastal setting. Caption emphasizes danger in the California Free State.
  - pdf_page: 81
    printed_page: null
    source_caption_topic: Surf City Bistro, Venice Beach
    art_reference: Restaurant scene with metahuman figures outside a mirrored SURF
      CITY sign; caption identifies Surf City Bistro, Venice Beach, and treats social
      commentary playfully.
  - pdf_page: 82
    printed_page: null
    source_caption_topic: Spirits of Man
    art_reference: Two illustrated fictional human figures in layered outdoor clothing
      stand near ghostlike or spirit figures. Printed caption describes Romani-identified
      shamans conjuring Spirits of Man to protect their tribe. This reports the historical
      book caption, not a factual claim about real people.
  - pdf_page: 83
    printed_page: null
    source_caption_topic: Anasazi wilderness
    art_reference: Sunlit Southwestern desert scene with an armored traveler carrying
      two implements, a vehicle and other figures among rock formations. Caption characterizes
      survival with an Anasazi reference; this is an imagined fictional scene, not
      an ethnographic assertion.
  - pdf_page: 84
    printed_page: null
    source_caption_topic: Yak attack
    art_reference: Dark city scene with large horned figures and glowing yellow-green
      arcs in combat against a person in dark clothing; the caption labels it Yak
      attack.
  - pdf_page: 85
    printed_page: null
    source_caption_topic: Lost Mine
    art_reference: Cavern tableau of an adventurer holding a lantern confronting luminous
      spectral figures and skull-like features. Caption describes mountain spirits
      guarding the secrets of the Lost Mine.
  - pdf_page: 86
    printed_page: null
    source_caption_topic: Toxic shaman near Salinas
    art_reference: Illustrated magical apparition of green vapor/spirits rising from
      contaminated ground around human figures. Caption explicitly attributes this
      as a toxic shaman conjuring a toxic spirit at a fictional chemical-dumping location
      near Salinas. It supplies no game stats.
  - pdf_page: 87
    printed_page: null
    source_caption_topic: Hestaby propaganda illustration
    art_reference: Illustrated dragonlike entity perched on rock beneath a moon. A
      faux archive attribution reads Humanis Policlub Archives, 2057. Caption calls
      the depiction an artist’s impression of Hestaby and uses hostile rhetoric. Treat
      that bias as the fictional in-world publisher’s perspective; it does not establish
      Hestaby’s conduct or identity beyond an attributed portrayal.
  editorial_boundary: This is a reference index of original color art and in-world
    editorial captions in a fictional tabletop RPG book. The images and credited fictional
    speakers are not independent factual or mechanical rules assertions. Historical
    quoted group labels remain historical descriptors, not modern assertions about
    actual people.
