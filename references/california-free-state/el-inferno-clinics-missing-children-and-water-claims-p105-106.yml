  editorial_method: Third-person sourcebook reference reporting of the fictional tabletop RPG. Source
    narration, named Shadowland allegations and optional scenarios are not conflated; no real-world
    claims or inferred SR3 conversions.
  named_shadowland_posts:
  - speaker: Angeleno
    p: 105
    claim: Notes that in El Inferno some neighborhoods may be relatively worse than others despite
      chronic hardship.
  - speaker: BlackJack
    p: 105
    claim: Recommends a fictional lodging site called Pierson Place in Gardena run by Nolly, with
      a claim about available informal goods; this is a character tip, not a factual real-world listing.
  - speaker: Spider
    p: 105
    claim: Counters that Pierson Place is associated with petty theft, and claims the Hope and Glory
      coffin hotel is under influence of a local Dragon tong. The statements contradict the preceding
      recommendation.
  - speaker: WizKid
    p: 105
    claim: Says the fictional Hospitalers maintain free rotating clinics in El Inferno, an in-world
      counterpoint to municipal neglect.
  - speaker: Down but not Out
    p: 106
    claim: Reports doubts about whether corporate sponsors accept liability for rashes or other injuries
      caused by test products and presents research accounting as ambiguous, not informed participant
      consent.
  - speaker: Firestarter
    p: 106
    claim: Names Amalgamated Studios, Aztechnology, Farmberger Human Survey, Kalamari Foods, Saeder-Krupp
      and Yamatetsu as possible project sponsors while explicitly saying the list is incomplete and
      partly unconfirmed.
  - speaker: DirtyAngel
    p: 106
    claim: Asks why Boromaker is not on the listed sponsor roster; no confirming proof.
  - speaker: Witness
    p: 106
    claim: Reports rumors of children disappearing from project housing, with unknown circumstances
      and no bodies identified; serious allegation remains unverified.
  - speaker: Danny Boy
    p: 106
    claim: Claims the Chimneysweeps gang acquired expensive new cycles about when children were said
      to disappear and speculates about corporate funding; no causal proof.
  - speaker: Sevenup
    p: 106
    claim: Alleges that corporations employ local gangs as armed project-block guards and permit coercive
      force against inhabitants; not a standard official police arrangement.
  - speaker: Lizard
    p: 106
    claim: Describes unequal city water distribution, with affluent enclaves receiving priority over
      El Inferno housing; personally interprets system hierarchy.
  - speaker: Blood Prince
    p: 106
    claim: Claims a gang called the Reclamation Crew recovers water from richer areas and redistributes
      it to residents, sometimes extending access by one or two hours a day.
  - speaker: Curious George
    p: 106
    claim: Asks why Los Angeles has grown despite limited freshwater availability; a question, not
      a fact.
  - speaker: Jade
    p: 106
    claim: Claims Central Valley irrigation and NAN-controlled Colorado River flow limit Los Angeles
      water sources and that cold-fusion reactors produce little water; the claim is source-period
      speculation.
  - speaker: Jack
    p: 106
    claim: Describes household gray-water recycling and filtering to reduce waste while noting some
      residents are unable or unwilling to use it; no technical procedure is provided.
  source_limit: Do not turn suspected abducted children, coercive testing, uncertain corporate sponsorship
    or attributed police behavior into unquestioned narrator facts.
