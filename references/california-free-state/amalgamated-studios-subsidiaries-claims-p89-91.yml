    physical_pdf_pages: 96-98
    source_pdf_sha256: 92c64cbc95dbea565ac6e099bb662a03a2764e97964001a459502bc97321e9a4
  editorial_method: 'Fictional Shadowrun tabletop-RPG archival account: sourcebook
    narration, named in-world claims, and optional game scenarios remain separate;
    not real-world advice.'
  shadowland_claims:
  - printed_page: 89
    speaker: FFFixer
    claim: Alleges AS security personnel and police are screened for sober, controllable
      behavior and unlikely to permit drug use in the workplace; does not establish
      a game mechanic.
  - printed_page: 90
    speaker: Trivia Buff
    claim: 'Supplies a lineup of named AS companies: Taylor Satellite Services (TSS)
      under Cyrus Taylor, Pegasus Productions under Steve Greenleaf, E.T. Studios
      under Ford Clements, WorldVision under Robin Taylor, and MagicMind under Darin
      Levinhoff; additionally names Galaxy, Global, LivingWord Productions, Concert
      Sims and other smaller studios. Describes TSS as news, Pegasus as trideo dramas,
      E.T. as action trideo, WorldVision as news, and MagicMind as simsense.'
  - printed_page: 90
    speaker: Masters and Trivia Buff
    claim: Masters asks who controls AS; Trivia Buff replies that no one knows, contradicting
      any assumed named single chief executive.
  - printed_page: 90
    speaker: Daredevil
    claim: 'Comments on commercially valuable creative talent, corporate extraction
      risk, and the high fee for a Hollywood-and-Oak hiring hall: 100 nuyen per month.
      This is a stated in-world price, not a game-rules stat block.'
  - printed_page: 90
    speaker: Capra
    claim: Claims that former TSS employee Hayden Green was left alive but severely
      mentally incapacitated after interest in moving to Affiliated Artists; portrays
      this as suspected retaliation by AS. The alleged injury and coercion are explicitly
      retained as a fictional allegation, not voluntarily accepted care.
  - printed_page: 90
    speaker: Whistler
    claim: Speculates that Cyrus Taylor lives in Montecito and is rarely seen at the
      TSS offices.
  - printed_page: 91
    speaker: Working Girl
    claim: Reports WorldVision head Robin Taylor's relationship to Cyrus Taylor and
      studio gossip about her associates; this is sourced speaker comment rather than
      narrator-confirmed family history.
  - printed_page: 91
    speaker: Trivia Buff and Daredevil
    claim: Discuss Pegasus manager Steve Greenleaf and MagicMind manager Darin Levinhoff.
      Daredevil alleges a series of fatal attempts to extricate Logan St. James from
      a long exclusive contract at MagicMind; the allegations are not independently
      verified.
  - printed_page: 91
    speaker: Working Girl
    claim: Describes an invitation-only Aerie club within AS property where access
      is tightly controlled and negotiations occur.
  claim_limit: All named business affiliations, injuries, affiliations, prices and
    allegations above are expressly sourced to in-universe Shadowland speakers.
