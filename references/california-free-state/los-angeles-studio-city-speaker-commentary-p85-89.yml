  editorial_method: 'Fictional Shadowrun tabletop-RPG archival account: sourcebook
    narration, named in-world claims, and optional game scenarios remain separate;
    not real-world advice.'
  named_interventions:
  - printed_page: 85
    speaker: Captain Chaos
    claim: Introduces Urban Critter as the source of the Los Angeles chapter account
      and distinguishes his perspective from additional forum responses.
  - printed_page: 85
    speaker: Local Yokel and UCLAer
    claim: Local Yokel warns visitors about the city; UCLAer disputes the severity,
      and Local Yokel challenges how much of the city UCLAer actually sees.
  - printed_page: 86
    speaker: Stoker
    claim: Describes extensive layered corporate enclave security at Mulholland Drive,
      including surveillance and a reported earth elemental; it is presented as a
      participant observation, not a verified equipment specification.
  - printed_page: 86
    speaker: Hitman
    claim: Alleges an electrically charged underground wire mesh beneath Studio City
      to deter tunneling.
  - printed_page: 87
    speaker: Slicer
    claim: Alleges wealthy residents sometimes retain shadowrunners as status-symbol
      bodyguards; also discusses constructed environmental ornamentation in Studio
      City.
  - printed_page: 87
    speaker: Working Girl
    claim: Describes decorative wall masonry and other deliberate concealment of Studio
      City's separation from poorer Los Angeles neighborhoods.
  - printed_page: 88
    speaker: Snooper
    claim: Disputes Winona Flying Horse's stated Native American background, asserting
      her real name is Winifred Ernst from New Jersey. This is an attributed allegation
      about a fictional performer, not a verified identity correction.
  - printed_page: 88
    speaker: Wystan
    claim: Names Cinnabar Carter as a possible rival to Winona Flying Horse.
  - printed_page: 88
    speaker: Diamond Jim
    claim: Claims affluent residents in Bel Air and the Palisades rebuilt opulent
      houses on cliffs after a 2045 tsunami.
  - printed_page: 88
    speaker: Working Girl and Jade
    claim: Describe an environment of social competition and gossip at entertainment
      parties. Jade names the fictional Sunset Serenade at 6523 Sunset near Vine as
      a meeting place and warns that patrons object to business activity there.
  - printed_page: 89
    speaker: LAAngel and Whistler
    claim: Discuss short-term decision-making in Los Angeles and reported stimulant
      consumption in Studio City creative industries.
  provenance_limit: This record attributes individual fictive Shadowland posts rather
    than adopting them as authorial facts. No security-bypass or illicit operations
    are provided.
