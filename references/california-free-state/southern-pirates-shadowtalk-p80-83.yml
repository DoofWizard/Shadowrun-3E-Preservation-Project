  claims:
  - name: Water Rat
    pages: 80,83
    claim: Describes armed confrontation between freetraders and property scouts,
      and later speculates Grania may have funded Paco to divert Monday.
  - name: Little Jack
    pages: 80,83
    claim: Claims waterjackers use quick aircraft to raid clean waterways and later
      remarks on the escalating pirate feud.
  - name: Smee
    pages: '83'
    claim: Predicts Paco intends to overthrow Captain Monday.
  - name: Rex
    pages: 82-83
    claim: Spreads unverified stories about Monday's unusual pet, disputes the security
      of his residence, and speculates about Grania's support of Paco.
  - name: Father Thyme
    pages: '82'
    claim: Doubts the alleged magical link between Monday and his bird.
  - name: Pug
    pages: '82'
    claim: Gives a highly detailed but unverified description of Monday's unusual
      mansion and its security.
  - name: Mean Machine
    pages: '82'
    claim: Proposes the possibility of attacking Monday's residence; no practical
      instructions or confirmation of the target are supplied.
  - name: Locke
    pages: '83'
    claim: Disputes one theory of Paco's finances and claims some military equipment
      came from the Sons of Liberty.
  - name: Hazeldean
    pages: '83'
    claim: Claims Paco and Grania are romantically connected and that she funded Paco's
      break from Monday; this is not confirmed.
