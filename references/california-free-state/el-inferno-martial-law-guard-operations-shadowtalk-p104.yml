  editorial_method: Third-person sourcebook reference reporting of the fictional tabletop RPG. Source
    narration, named Shadowland allegations and optional scenarios are not conflated; no real-world
    claims or inferred SR3 conversions.
  named_shadowland_posts:
  - speaker: Storyteller
    claim: Characterizes the 2046 fictional invasion as an election-driven political rehearsal and
      invites readers to consult additional source accounts; interpretation, not narrator-certified
      motive.
  - speaker: LAPD
    claim: Claims border checkpoints contain metal detectors, chemical sniffers, firing systems and
      night-access restrictions. Elsewhere the same contributor alleges police patrols work with a
      coercive paramilitary group called Citizens for a Sane Society that assaults metahumans and
      dissidents; all are named source allegations, not instructions or independently verified facts.
  - speaker: Firestarter
    claim: Reports that police enter El Inferno in heavily equipped groups of roughly twenty officers
      plus two commanders and speculates about additional duty pay.
  - speaker: Jihadeen
    claim: Openly advocates lethal collective repression of neighborhood inhabitants; this is an attributed
      fictional expression of discriminatory hostility, not an endorsed proposal.
  - speaker: Danny Boy
    claim: Attributes the government’s final abandonment of Los Angeles to its failure to collect
      taxes and to the 2046 military defeat, as speaker interpretation.
  editorial_boundary: The rumored 2023 antiserum hoard and alleged election fraud are not upgraded
    into factual causation. Coercion, discriminatory violence and documented sourcebook casualty numbers
    retain their respective narrator-versus-poster status.
