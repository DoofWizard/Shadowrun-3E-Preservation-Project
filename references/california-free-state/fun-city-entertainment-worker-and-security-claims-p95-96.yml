  editorial_method: Reference reporting of a fictional tabletop-RPG sourcebook, distinguishing named
    sourcebook contributors, narrator statements, attributed in-world Shadowland assertions, and optional
    game material; no real-world claims or Third Edition conversion.
  named_shadowland_posts:
  - speaker: Outtatown
    printed_page: 95
    claim: Responds to the Orange County location description with amusement, without making a substantial
      new factual claim.
  - speaker: FunGuy
    printed_page: 95
    claim: Reports that entry fees include food, lodging and entertainment and that tourist tickets
      carry admission dates and times. These are an in-world informant’s assertions.
  - speaker: Unattributed in-world commentary continuing onto p96
    printed_pages: 95-96
    claim: Claims Fun City’s production facilities use strong security, costumed employees and misleading
      appearance of guards; distinct from detailed game mechanics or instructions.
  - speaker: NotAmused
    printed_page: 96
    claim: Describes being confronted by a disguised armed staff member while visiting; a speaker
      anecdote, not a verified encounter.
  - speaker: AnonyMouse
    printed_page: 96
    claim: Alleges low wages, crowded worker housing, long hours and reprisals against complaints
      by workplace security. Specific exploitative and coercive working conditions are retained as
      allegations.
  - speaker: Dogbreath
    printed_page: 96
    claim: Reports more positive experiences of being employed in a Fun City animal costume and interacting
      with children; this account does not negate AnonyMouse’s accusations.
  - speaker: Tourist
    printed_page: 96
    claim: Lists attractions maintained by Virtual World Disney, including Hometown USA, Final Frontier,
      AdventureEscape, CritterCorral, ToonTown and the Quarter.
  - speaker: Denny
    printed_page: 96
    claim: Says the California Virtual World Disney operation resisted takeover by Amalgamated Studios
      and remains the one part of Fun City outside Amalgamated ownership; this is the named poster’s
      interpretation.
  - speaker: Slicer
    printed_page: 96
    claim: Reports that Frontier Print Shoppe is operated by an elf called Terry Braun and allegedly
      produces false wanted posters and other fabricated documents; this is a fictional allegation,
      not a method.
  - speaker: AnonyMouse
    printed_page: 96
    claim: Claims an operator called Doc Denton runs a specialty shop behind Denton’s Apparel at State
      and Ball, and repeats missing-person rumors without proof.
  - speaker: Doc Denton
    printed_page: 96
    claim: Responds that some former patients might have survived with earlier treatment, while also
      acknowledging that medical interventions may fail. This does not verify AnonyMouse’s missing-person
      allegations.
  source_limit: All above are printed fictional forum contributions, including conflicting employment
    experiences, unverified disappearance allegations and commentary about property rights. No independent
    corroboration or mechanics are supplied.
