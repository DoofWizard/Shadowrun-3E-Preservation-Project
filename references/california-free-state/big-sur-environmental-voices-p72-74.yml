  speakers:
  - name: Captain Chaos
    printed_page: 72
    claim: Introduces the fictional Big Sur file as supplied by a Silent Runner and
      cautions readers to judge the account.
  - name: Green Girl
    printed_page: 74
    claim: Condemns corporate agribusiness for abandoning long-term environmental
      damage after extracting profits.
  - name: Coast Guard
    printed_page: 74
    claim: Describes sickly mutated plants, yellowish air, depleted soil and a polluted
      landscape from purported first-hand observation; those observations remain a
      named in-world account.
  - name: SkareKrow
    printed_page: 74
    claim: Expresses doubt that ordinary farmers could restore extremely contaminated
      Big Sur land unaided.
  - name: BlackStone
    printed_page: 74
    claim: Reports unconfirmed gossip that transplanted druidic magicians assist the
      communes, while explicitly admitting uncertainty.
  - name: Green Girl
    printed_page: 74
    claim: Contradicts BlackStone and asserts that Tír elves instead provide the magical
      support as part of a political relationship with the communes; this is her contested
      attribution.
