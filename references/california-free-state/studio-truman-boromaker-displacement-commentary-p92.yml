  named_shadowland_posts:
  - speaker: DirtyAngel
    printed_page: 92
    claim: Calls Skogan an effective fixer and alleges she can obtain confidential personnel information
      for rival executives, with anonymous payment; this is a fictional in-world offer, not advice.
  - speaker: GBS
    printed_page: 92
    claim: Claims wealthy Chicago newcomers have crowded the enclosed Westside/Mulholland districts
      while original Los Angeles residents have little ability to relocate. The poster criticizes
      restrictions on property acquisition near elite compounds and describes forced displacement
      as an expected outcome; these are the speaker’s assessments.
  - speaker: Lurker
    printed_page: 92
    claim: Alleges that wealthy new residents or their corporate allies have hired forces to attack
      or burn poorer blocks surrounding the compounds, displacing prior residents, and that redevelopment
      follows. The source frames this as an in-world allegation rather than an established sourcebook
      fact.
  source_note: The preceding narrator paragraph about Boromaker and Brilliant Genesis cites fictional
    Variety reporting; speculation about a later merger remains contingent, not a completed acquisition.
