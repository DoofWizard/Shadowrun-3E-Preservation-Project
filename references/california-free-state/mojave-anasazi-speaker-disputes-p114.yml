      {
        "speaker": "Lawrence",
        "report": "Claims some bands regard themselves as custodians of limited freshwater springs; alleges that outsiders who take water without permission may face detention, demands for money, food, weapons, ammunition, or vehicles, and possibly lethal violence. Says bands demand tribute and sometimes attack convoys."
      },
      {
        "speaker": "Maj. Minor",
