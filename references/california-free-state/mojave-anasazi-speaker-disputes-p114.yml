        "report": "Asks who the historic Anasazi were, separately from claims about fictional contemporary desert bands."
      },
      {
        "speaker": "Histobuff",
        "report": "Offers a fallible recollection that the historic group inhabited the Southwest and later died out; the source labels this a speaker's memory, not an independently verified ethnographic statement."
      },
      {
        "speaker": "Comanchero",
        "report": "Says multiple contemporary fictional bands distrust one another, so outsiders allied with one band may face hostility from others; warns against treating them as one political body."
      },
      {
        "speaker": "D. Bunker",
        "report": "Argues that trade with t-bird smugglers near the Ute Nation could supply the bands with weapons, challenging the idea that their practices are unique."
      },
