data:
  publication:
    fictional_publication: California Free State
    publisher: FASA Corporation
    catalog_number: FASA7209
    edition: historical original/Second Edition Shadowrun
    source_id: source.fasa-7209
    printed_pages: 77-79
    physical_pdf_pages: 76-78
    source_pdf_sha256: 92c64cbc95dbea565ac6e099bb662a03a2764e97964001a459502bc97321e9a4
  editorial_method: Historical fictional tabletop-RPG reference reporting; book narrator,
    named Shadowland speakers, and optional gamemaster possibilities are distinguished.
    No Third Edition conversion is implied.
  voices:
  - p: 77
    speaker: Lucas
    claim: Questions whether seafood farms can exist amid Monterey Bay contamination.
  - p: 77
    speaker: Green Girl
    claim: Confirms contaminated fish farms from her standpoint, challenges consumer
      expectations, and later questions profit-driven corporate behavior.
  - p: 77
    speaker: Aleph
    claim: Says the reported fish products make them reluctant to eat those fish.
  - p: 77
    speaker: Walrus
    claim: Alleges intelligent merrow have attacked fish pens and that at least ten
      workers died in incidents corporations classify as accidents.
  - p: 77
    speaker: Aqua Vitae
    claim: Argues the region’s aquatic pollution creates danger to workers and suggests
      conditions attract Awakened species; also notes unverified stories about company
      pressure to conceal losses.
  - p: 77
    speaker: Save Our Seas
    claim: Opposes corporate exploitation of Monterey Bay and identifies its environmental
      campaign presence.
  - p: 78
    speaker: Krok
    claim: Jokes about unusually large genetically engineered seafood.
  - p: 78
    speaker: Bebop
    claim: Alleges Kalamari’s public product list is incomplete and relays rumors
      about strange specimens near the coast.
  - p: 78
    speaker: Skeptic
    claim: Expresses disbelief in the purported sea monsters.
  - p: 78
    speaker: Winkelman
    claim: Reports an alleged close encounter with a very large marine creature near
      the Salinas River beach; another named claim, not a confirmed critter type.
  - p: 79
    speaker: Coast Guard
    claim: Challenges the claim of a stable merrow settlement, referencing a deadly
      reported platform confrontation.
  - p: 79
    speaker: Mageboy
    claim: Counters that the conflict arose from platform workers trapping merrow
      despite the settlement and says conditions later calmed.
  - p: 79
    speaker: Corp Watcher
    claim: Claims Aqua Arcana may be genuinely employee-owned, and alleges its owners
      include a Porpoise shaman, an Orca shaman, and an elemental adept; separately
      lists a modest boating fleet.
  - p: 79
    speaker: Newt II
    claim: Uses the ownership account to challenge an anti-corporate generalization.
  - p: 79
    speaker: TriadVid
    claim: Reports an uncorroborated porpoise owner called Flipper.
  - p: 79
    speaker: Skeptic
    claim: Dismisses the porpoise-owner story.
  - p: 79
    speaker: Green Girl
    claim: Says Aqua Arcana earns fees from shipping contracts including Tír-connected
      routes.
  - p: 79
    speaker: Inquiring Mind
    claim: Relays a rumor that startup funds came from underwater treasure expeditions;
      explicitly says evidence is lacking.
  - p: 79
    speaker: Bay Lady
    claim: Says the company contracts with Kalamari and Save Our Seas.
  status: Named fictional forum statements remain attributed and occasionally contradictory;
    none are offered as verified real-world evidence.
