  editorial_method: 'Fictional Shadowrun tabletop-RPG archival account: sourcebook
    narration, named in-world claims, and optional game scenarios remain separate;
    not real-world advice.'
  named_shadowland_claims:
  - speaker: Hazeldean
    assertion: Claims O'Malley is Anna Smythe, youngest daughter of cruise-line owner
      Marcus Edward Smythe, formerly an Astoria-area Greenie political activist and
      now assisted by old Greenie associates.
  - speaker: Lyta
    assertion: Disputes Hazeldean by claiming Anna Smythe died during a protest at
      a Telestrian Industries facility near Eugene, and that her father suppressed
      attention to the death.
  - speaker: Earp
    assertion: Disputes both accounts and identifies O'Malley as Grace Tailfeather,
      a mixed Salish-Sidhe woman with one dwarf parent, who earlier operated independently
      around Salish; later comments concern a purported personal encounter and a high-security
      corporate research installation. The publication supplies this as disputed speaker
      testimony, not established identity.
  - speaker: Skeptic
    assertion: Makes a skeptical, personally suggestive reply to Earp's proposed first-hand
      account; the exchange does not authenticate the identity.
  - speaker: Mr. Tusk
    assertion: Alleges O'Malley uses a spell that disassembles people.
  - speaker: Mageboy
    assertion: Explicitly disputes the existence of such a spell.
  - speaker: Pasquale
    assertion: Reports a rumor that she feeds victims to a pet wendigo.
  - speaker: Reality Czech
    assertion: Challenges the fatality rumors and says former employees have been
      observed doing business in Los Angeles, Denver and elsewhere; alleges she warns
      them not to return to Big Sur.
  - speaker: Lord Jim
    assertion: Disputes Reality Czech's reassurance and alleges significant offenders
      are killed.
  narrator_risk_description: 'The narrator says O''Malley pays skilled jammers generously
    and retaliates harshly against incompetence or betrayal: relatively minor incidents
    may leave participants injured, while major offenders reportedly disappear. The
    narrator expressly declines to settle whether they are killed or expelled. These
    outcomes are not represented as voluntary employment departures.'
