  editorial_method: Third-person sourcebook reference reporting of the fictional tabletop RPG. Source
    narration, named Shadowland allegations and optional scenarios are not conflated; no real-world
    claims or inferred SR3 conversions.
  named_shadowland_posts:
  - speaker: Reality Czech
    p: 97
    claim: Cautions in-world visitors about unreliable local contacts; the commenter does not establish
      a game mechanic.
  - speaker: DirtyAngel
    p: 97
    claim: Describes the fictional Bonaventure Hotel at 409 Figueroa Street as an upscale conference
      site, including a claimed 35 floors and more than 1,400 rooms; mentions a suggested gratuity
      to underpaid service staff.
  - speaker: Angeleno
    p: 97
    claim: Suggests the El Pueblo historic monument as a public meeting place and gives cross streets
      Alameda, Arcadia, Spring and Macy; these are in-universe local tips without a procedural mechanic.
  - speaker: Lord Byron
    p: 97
    claim: Describes the fictional Affiliated Artists arcology Screening Room, Yoshi’s restaurant,
      and the Rainbow’s End and Gilded Lily casinos as venues, including personal comments on cost
      and attendance.
  - speaker: LAPD
    p: 98
    claim: Alleges a group called the Barbers attacks cyberware users near the Downtown periphery
      and sells removed cyberware. The coercion and injuries are reported as a named fictional allegation,
      not a verified citywide pattern.
  - speaker: Hispaniard
    p: 98
    claim: Accuses security patrols of abandoning accused offenders deep within the Barrens, with
      potential fatal outcomes; source-specific attributed allegation.
  - speaker: Angeleno
    p: 98
    claim: Portrays East LA working people as exhausted by economic hardship and therefore less likely
      to challenge power.
  - speaker: Mazemind
    p: 99
    claim: Describes the Puente Hills Maze beneath Whittier College as associated with underground
      ork spaces and a local social event called Night of Rage; not an independently mapped dungeon.
  - speaker: Hispaniard
    p: 99
    claim: Identifies Rosita Hernandez’s inexpensive Los Molinos boarding house and an intimidating
      adult crew dubbed El Niños; a named in-world review, not verified property records.
  - speaker: Maria
    p: 99
    claim: Suggests Chico Chavez at La Cocina on Garfield and Washington as a local Spanish-speaking
      contact; speaker’s local knowledge only.
  - speaker: Byteman
    p: 99
    claim: Claims Lockheed research facilities conduct organic and hydrofoil research and are difficult
      to penetrate due to advanced counterintelligence; this is a fictional allegation, not technical
      instructions.
  editorial_limit: Each statement is identified to a printed Shadowland poster; sensitive injuries,
    agency and conditional allegations remain explicit.
