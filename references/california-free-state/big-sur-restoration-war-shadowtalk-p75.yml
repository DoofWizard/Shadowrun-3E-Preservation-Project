  editorial_method: 'First-pass page-image-reviewed FICTIONAL Shadowrun tabletop RPG
    archival reporting: sourcebook-narrator assertions are separated from named fictional
    commentators, uncertain hearsay, and optional GM scenarios. No Third Edition conversion
    or real-world instruction is inferred.'
  speakers:
  - name: Pug
    claim: Claims to have served in an early corporate attack, describes a violent
      magical defense, and says his employer abandoned survivors; his account of specific
      casualties and tactics is first-person in-world testimony.
  - name: Marlowe
    claim: Disputes profit as the main current motive, arguing both sides increasingly
      fight out of revenge.
  - name: Inquiring Mind
    claim: Speculates that TerraFirst and Oakland metahuman resistance, rather than
      only Tír elves, may support the farm communes, without establishing why.
  - name: Snoop
    claim: Alleges Sierra Inc. disguises funding of the communes as ordinary fundraising.
  - name: Backpacker
    claim: Disputes that Sierra Inc. finances violent eco-terrorism and says the group
      campaigns through environmental politics.
  - name: Farmer Joe
    claim: Rejects the label eco-terrorist and says participants are defending their
      homes and land.
  - name: Rex
    claim: Notes that both sides hire shadowrunners and suggests people accept those
      jobs to escape city life temporarily.
  - name: Dazed and Confused
    claim: Reports widespread shifting alliances, corporate and farm violence, and
      anti-metahuman hostility; views this as a confused and highly dangerous conflict.
  - name: Zack
    claim: Warns about fictional toxic spitting spiders, describing alleged venom
      effects; the source does not specify a new mechanical stat block on this page.
