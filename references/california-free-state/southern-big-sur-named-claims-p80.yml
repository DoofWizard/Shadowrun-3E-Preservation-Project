  editorial_method: Historical fictional tabletop-RPG reference reporting; book narrator,
    named Shadowland speakers, and optional gamemaster possibilities are distinguished.
    No Third Edition conversion is implied.
  voices:
  - speaker: Curious George
    p: 80
    claim: Asks what corporations are seeking by scouting the southern coast and jokingly
      speculates about media location shoots.
  - speaker: Water Rat
    p: 80
    claim: Alleges some companies seek private retreats and others send armed scouts
      and surveyors; recounts opposition from freetraders.
  - speaker: Little Jack
    p: 80
    claim: Warns that low population density and waterjackers can lead to sudden conflict
      over freshwater; provides opinion, not geographic coordinates.
  - speaker: Silver Sammy
    p: 80
    claim: Asks how Grania O’Malley obtained Vandenburg air base and whether military
      force was involved.
  - speaker: Histobuff
    p: 80
    claim: Says the former UCAS military vacated the base during Secession; suggests
      Grania took it over and that competitors failed to displace her.
  - speaker: Corp Watcher
    p: 80
    claim: Calls attention to the unverified family-connection allegations about O’Malley
      and Oakforest.
  uncertainties: The main narrator’s speculation about Grania’s Tír Tairngire background,
    former name, shipping company history and possible relation to Oakforest remains
    marked as rumor rather than accepted genealogical fact.
