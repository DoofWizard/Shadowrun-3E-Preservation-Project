  editorial_method: 'Fictional Shadowrun tabletop-RPG archival account: sourcebook
    narration, named in-world claims, and optional game scenarios remain separate;
    not real-world advice.'
  commentator_accounts:
  - pages: 82
    speaker: Rex
    claim: Alleges the bird on Monday's shoulder is an engineered miniature eyekiller
      with electrical capabilities and a magical link that lets Monday monitor it.
  - pages: 82
    speaker: Father Thyme
    claim: Questions the proposed magical-link component because the alleged creature
      is not recognized by him as Awakened.
  - pages: 82
    speaker: Pug
    claim: Describes Monday's large Morro Bay estate near Point Buchon, its ship-bow
      facade, extensive one-way or bullet-resistant glass, and neighborhood security;
      much is an eyewitness account accompanied by conjecture about spells.
  - pages: 82
    speaker: Rex
    claim: 'Contradicts a supposed successful attack on Monday by Paco: alleges formidable
      antiaircraft protection and describes an unrelated Fresno corporate executive
      as the actual antagonist, followed by O''Malley''s investigation and cooperation
      among rivals.'
  - pages: 83
    speaker: Hazeldean
    claim: Alleges Grania funded Paco and asserts an earlier romantic connection and
      common political-club history; the narrator does not substantiate the allegations.
  - pages: 83
    speaker: Water Rat
    claim: Claims Grania provided Paco financing and military-specification equipment
      originating with Kalamari Incorporated.
  - pages: 83
    speaker: Locke
    claim: Directly contests Water Rat and attributes Paco's funds to resale of Monday's
      goods and equipment provided by a contact in the Sons of Liberty.
  - pages: 83
    speaker: Rex
    claim: Speculates that Grania may be deliberately keeping rival Monday and Paco
      in balance to protect her profits.
  source_distinction: Each account is a named fictional Shadowland statement, not
    a narrator-certified conclusion.
