  editorial_method: Third-person sourcebook reference reporting of the fictional tabletop RPG. Source
    narration, named Shadowland allegations and optional scenarios are not conflated; no real-world
    claims or inferred SR3 conversions.
  named_shadowland_posts:
  - speaker: Angeleno
    p: 100
    claim: Alleges the Steppin’ Wulfs brutally injure people and are driven by consumption of flesh;
      graphically explicit conduct is recorded in neutral reference terms without instructions.
  - speaker: Harbor Rat
    p: 100
    claim: Attributes the gang’s unusual behavior to a toxic shaman leader; disputed with other named
      posts.
  - speaker: Reality Czech
    p: 100
    claim: Challenges the claim that every dangerous person is magically influenced and later questions
      whether a hotel truly respects privacy.
  - speaker: Angel
    p: 100
    claim: Repeats a rumor that corporations pay the Steppin’ Wulfs for access to sections of the
      Barrens.
  - speaker: Salamander
    p: 100
    claim: Recommends an in-world Sheraton Hotel at 333 South Figueroa as meeting accommodation, while
      explicitly refusing to guarantee confidentiality.
  - speaker: CalGirl
    p: 100
    claim: Describes the fictional Queen Mary liner moored at Long Beach Harbor as a tourist destination.
  - speaker: Catseye
    p: 100
    claim: Says Venice Beach and nearby beaches are sheltered from floating waste and crowded with
      performers.
  - speaker: Daredevil
    p: 100
    claim: Speculates the difference in water quality is related to a desalination plant; separately
      alleges wealthier residents obtain clean water through other routes.
  - speaker: eCo
    p: 100
    claim: Claims an off-limits contaminated zone might have suffered hidden reactor damage in 2028,
      while admitting the leak is not confirmed; alleges corporate dumping to the area.
  - speaker: Travelin’ On
    p: 102
    claim: Expresses disbelief that cold-fusion plants could create such pollution.
  - speaker: Nuke
    p: 102
    claim: Speculates that plutonium or other old weapons-grade material powered experimental reactor
      installations; the story is unproven in-universe.
  - speaker: Ross Roberts
    p: 102
    claim: Argues that the green coloration cannot stem from Cherenkov radiation and disputes a radioactive
      ocean explanation; this is not a scientific ruling outside the fictional scene.
  - speaker: Doctor Bugs
    p: 102
    claim: Instead claims a mildly radioactive phosphorescent fungus caused Green Tide, describing
      anecdotal reports of increasing fungal populations in cockroaches.
  - speaker: Eyes Right
    p: 102
    claim: Alleges ownership records related to the station vanished, with blame directed toward Pacific
      Foods; not narrator-confirmed.
  - speaker: Outtatown
    p: 102
    claim: Asks why the better-known DocWagon service does not provide health care to Coast Town residents.
  - speaker: Local Yokel
    p: 102
    claim: Says poor residents cannot afford DocWagon contracts, directly contesting its practical
      accessibility.
  - speaker: WizKid
    p: 102
    claim: Claims the Hospitalers conduct informal medical procedures using second-hand or donated
      supplies and provide emergency services despite serious funding constraints.
  epistemic_boundary: Named in-universe claims and competing hypotheses remain attributed; the book’s
    narration is separately recorded. Do not upgrade disappearance, radiation or gang-magic theories
    to confirmed source facts.
