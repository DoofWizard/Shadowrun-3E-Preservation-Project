data:
  publication:
    fictional_publication: California Free State
    publisher: FASA Corporation
    catalog_number: FASA7209
    edition: historical original/Second Edition Shadowrun
    source_id: source.fasa-7209
    printed_pages: 72-77
    physical_pdf_pages: 71-76
    source_pdf_sha256: 92c64cbc95dbea565ac6e099bb662a03a2764e97964001a459502bc97321e9a4
  editorial_method: Historical fictional tabletop-RPG reference reporting; book narrator,
    named Shadowland speakers, and optional gamemaster possibilities are distinguished.
    No Third Edition conversion is implied.
  editorial_opening:
    p: 72
    speaker: Captain Chaos
    claim: Introduces a recovered Silent Runner file with a critical framing about
      the region; commentary is a file introduction, not independent confirmation.
  voices:
  - p: 74
    speaker: Green Girl
    claim: Blames corporate agricultural pollution for long-term environmental and
      community damage; later disputes a different forum account about the farmers’
      outside magical aid.
  - p: 74
    speaker: Coast Guard
    claim: Offers a vivid first-person description of contaminated air, soil, unusual
      vegetation, and regional hazardous conditions; reports are observational claims,
      not scientific measurements.
  - p: 74
    speaker: Skarekrow
    claim: Asks how a handful of people could restore the land when corporations allegedly
      had not.
  - p: 74
    speaker: BlackStone
    claim: Explicitly marks a rumor unverified while suggesting displaced druidic
      magicians assist the reclaimers.
  - p: 74
    speaker: Green Girl
    claim: Counters that elves from the Tír provide the farmers’ magical help, and
      says secrecy reflects local anti-elf sentiment.
  - p: 74
    speaker: Watchman
    claim: Suggests the corporations sought to avoid adverse publicity from environmental
      organizations, including Sierra Inc.
  - p: 75
    speaker: Pug
    claim: Claims firsthand participation in an unsuccessful corporate attack on the
      reclaimers, reporting magical defenses, losses, inadequate evacuation, and hazardous
      creatures.
  - p: 75
    speaker: Marlowe
    claim: Claims both sides are motivated by revenge and refuse to withdraw.
  - p: 75
    speaker: Inquiring Mind
    claim: Speculates that Tír elves, TerraFirst!, and Oakland metahuman resistance
      advisers may be helping farmers, and asks what each might gain.
  - p: 75
    speaker: Snoop
    claim: Alleges Sierra Inc. covertly channels gear and magical material to communes
      through donations.
  - p: 75
    speaker: Backpacker
    claim: Disputes Snoop, saying Sierra Inc. lobbies and maintains parks rather than
      funding armed groups.
  - p: 75
    speaker: Farmer Joe
    claim: Rejects an eco-terrorist description of the commune defenders, emphasizing
      farmland and environmental politics.
  - p: 75
    speaker: Rex
    claim: Says both sides employ runners and describes occasional temporary escape
      work from a hostile urban environment.
  - p: 75
    speaker: Dazed and Confused
    claim: Describes competing corporate, commune, Tír and anti-metahuman activists
      and says allegiances are complicated.
  - p: 75
    speaker: Zack
    claim: Reports large toxic spitting spiders that eject fluid with incapacitating
      effects; gives anecdotal severity and speed, not published critter mechanics.
  - p: 76
    speaker: XenoBio
    claim: Asks whether the toxic spiders hunt together; no answer is established.
  - p: 76
    speaker: Zack
    claim: Says he hopes the spiders do not hunt in groups, then recounts a reported
      history of a Dog shaman near Fremont Peak/Santa Rita whose family was harassed
      after protests, whose dog was killed, and who allegedly retaliated with magical
      fires before later criticizing the communes.
  - p: 77
    speaker: Buster Brown
    claim: Claims to have inspected the aftermath of a deadly magical attack on a
      commune and alleges victims and livestock suffered internal injuries; the perpetrator
      is not established by this speaker.
  - p: 77
    speaker: Roscoe
    claim: Reports a rumor that other toxic shamans are drawn to Big Sur.
  source_status: These are fictional named Shadowland opinions, rumors, and eyewitness
    claims. Conflicting accounts of Tír elves and displaced druids, Sierra Inc. financing,
    and the alleged shaman’s motives are intentionally unresolved.
