treaty_of_denver:
  signed: "25 January 2018"
  source_pages: "10-12"
  provisions:
    - "Cedes most western North American lands to Native American Nations for independent states."
    - "Recognizes the Sioux, Pueblo, Salish, Ute, Algonkian, Athabaskan, Trans-Polar Aleut and Tsimshian nations."
    - "Establishes the Sovereign Tribal Council as a collective international body with delegated duties."
    - "Provides a ten-year relocation period for US and Canadian citizens not eligible for NAN citizenship."
    - "Requires reserved lands for residents who remain in NAN territory without citizenship eligibility."
    - "Establishes Seattle as a US extraterritorial extension on Mercer Island, which is ceded to the Salish Council and renamed Council Island."
    - "Establishes the Council of Denver to govern and divide the Front Range Free Zone among the named signatories."
  notes:
    - "Seattle and Denver implementation details are explicitly outside the chapter's main scope."

internal_divisions:
  summary: "The treaty grouped tribes into larger nations based on geographic location and compatible traditions rather than allocating every tribe a sovereign state, creating lasting inter-nation and intra-nation disputes."
  named_tensions:
    - "Ute and Pueblo land-rights dispute"
    - "Tsimshian and Salish-Shidhe hostility"

relocation_and_citizenship:
  - "Eligibility rules varied by nation; most adopted genetic testing rather than relying only on documentary genealogy."
  - "Some pre-existing non-tribal residents were grandfathered into provisional or later citizenship, but policy varied by nation."
  - "The treaty included a ten-year relocation-assistance period."
  - "Anglo reservations are autonomous enclaves within NAN territory and vary widely in security, Matrix access and political culture."

notes:
  - "All facts are source-period 2062 framing unless the source explicitly dates an earlier event."
  - "Shadowtalk allegations are not treated as verified facts."

