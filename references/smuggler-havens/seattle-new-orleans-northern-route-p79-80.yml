headline: 'Fictional Shadowrun tabletop-RPG historical account — FASA Corporation,
  Target: Smuggler Havens (FASA7215, 1998, Second Edition-era), printed pp79–80/PDF80–81:
  Yeager’s Northern Route'
summary: 'Attribution-preserving reference to Yeager’s fictional Seattle–St. Louis–New
  Orleans Northern Route in FASA Corporation’s Target: Smuggler Havens (FASA7215,
  1998, Second Edition-era), printed pp79–80/PDF80–81. Route names, markets, organizations,
  limitations and uncertainty belong to Yeager’s narrative.'
data:
  account_attribution:
    speaker: Yeager
    identification: Introduced by Captain Chaos on printed p79 as a veteran smuggler
    claim_status: In-world first-person testimony; the publication does not independently
      verify every observation.
  route_labels:
    overall: Seattle to New Orleans
    northbound_or_southbound:
    - The Northern Route
    - The Southern Route
    northern_to_st_louis: Big Sky
    return_toward_seattle: Long Weekend
  route_overview:
    printed_page: 79
    account: Yeager characterizes the Seattle–New Orleans passage as a major corridor
      with two principal route families. The Northern Route travels by way of Spokane,
      Minneapolis and the Mississippi River area to St. Louis, from which the account
      continues toward New Orleans.
  stops_and_facilities:
    printed_pages: 79–80
    account: Yeager singles out the Sioux Nation border near Bismarck, North Dakota,
      and the Yellowstone area as locations important to his fictional route. He identifies
      Lady Jane’s repair stop near the Sioux/UCAS border, reporting that a Sioux patrol
      destroyed her earlier t-bird, that she subsequently operated as a capable mechanic
      and that her business traded in repairs, parts, fuel and sometimes unconventional
      wares. These are Yeager’s assertions, not verified third-party facts.
  cargo_markets:
    printed_page: 80
    account: He describes southbound Pacific Rim novelty goods, magical trinkets and
      telesma, experimental corporate items, and northbound Caribbean, African and
      South American products and magical merchandise. He also credits Cascade orks
      with profitable uranium transport and information contacts, and says Mafia-linked
      families move controlled substances, fenced property and intelligence relating
      to kidnapping victims; the latter is alleged coercive wrongdoing, not consensual
      transport.
  relative_difficulty:
    printed_page: 80
    account: Yeager portrays the central plains as monotonous, Sioux territory as
      presenting border risk, and the route through UCAS territory as easier than
      Sioux territory. He claims weather and broad open land alter the risks.
  terrain:
    printed_page: 80
    account: The account contrasts forest and hills around Seattle and the Rocky Mountains
      with the flatter country near Minneapolis and the Mississippi corridor, including
      the river and its tributary valleys. Yeager remarks that winter can obstruct
      parts of the river passage.
  vehicles_and_cargo:
    printed_page: 80
    account: The character contrasts road vehicles, boats, trucks, t-birds, VTOL craft,
      and ATVs as fictional transport categories. He says cargo volume, concealment,
      winter preparation and attention from fictional patrols affect the choice, and
      contrasts conspicuous military-style hardware with ordinary transport.
  named_operators:
    printed_page: 80
    account: Yeager names the Ancients street gang and Mafia networks as principal
      participants; he also names Memphis, St. Louis, Davenport, Minneapolis and Detroit
      as connected markets or stops, and mentions Mafia and other operators buying
      transport services.
  opposition:
    printed_page: 80
    account: He associates risk with the Sioux Nation boundary, the UCAS military
      presence and regional border forces. His description is anecdotal and includes
      his expectation that the quiet interior corridor can become dangerous at political
      boundaries.
  editorial_scope: These claims document the fictional 2059 setting. They do not instruct
    anyone to smuggle goods, avoid real authorities or harm people.
