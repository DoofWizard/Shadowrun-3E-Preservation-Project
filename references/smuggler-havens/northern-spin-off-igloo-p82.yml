summary: 'Source-attributed fictional travel and market observations for the Igloo
  northern spin-off, told by Yeager in FASA’s Target: Smuggler Havens (FASA7215, 1998,
  historical Second Edition-era), printed p82/PDF83. This is not a modern real-world
  route advisory.'
data:
  source_heading: The Northern Spin-Offs
  speaker: Yeager, the in-world first-person smuggler narrator introduced on printed
    p79
  route_name: The Igloo
  route_description: Yeager describes a fictional northern branch linking Minneapolis,
    Duluth and Thunder Bay, and then heading north along the Lake Superior area toward
    Waskaganish in Algonkian-Manitou Council territory. He frames Waskaganish as isolated
    and oriented toward goods arriving from the north.
  stops: His account describes the Thunder Bay area as a place where vehicle repairs
    and contacts are accessible, and describes smaller settlements in the region as
    additional contacts. The source’s broader conversational reference to routes toward
    Iceland is retained as Yeager’s statement rather than asserted geographical certainty.
  goods: Yeager mentions guns, cyberdecks, basic necessities and electronics; he says
    uplink-related electronics can command higher prices in this fictional market.
  difficulty: He treats weather, harsh conditions, border patrols, Great Lakes piracy
    and imprudence by operators as serious concerns, with winter potentially increasing
    both prices and risk.
  terrain: Yeager characterizes the far northern terrain as frozen tundra, suggesting
    that summer conditions are easier for road travel.
  vehicles: He groups VTOL vehicles, t-birds and ATVs with this route and acknowledges
    the Great Lakes water option, but describes the Igloo primarily as a land-oriented
    branch.
  named_riggers:
    Nordic Queen: A named operator whom Yeager says works from Duluth and has substantial
      regional contacts.
    Purple People Eater (PPE): A Minneapolis-associated operator whom Yeager describes
      as connected with Mafia activities.
  opposition: Yeager associates the route with Great Lakes pirates, especially following
    the events in Chicago, and says Québec border restrictions are more difficult
    than much of the northern corridor.
  provenance: Original printed p82/PDF83. All route characterizations are attributed
    to the published fictional narrator.
