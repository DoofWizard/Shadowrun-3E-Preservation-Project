data:
  section: Game Information — Adventure Ideas for land-based campaign travel, printed
    pp109–110
  fictional_context: Three optional in-world Shadowrun tabletop RPG scenario hooks;
    no narrated real-world incident or guidance.
  quick_recovery:
    source_start_printed: 109
    employer: A fictional Cascade ork group hires player characters to accompany a
      cargo run from Seattle toward Denver.
    assigned_vehicles: The GM scenario says two Ford-Canada Bison vehicles are provided,
      one principally for cargo and one for characters and additional load.
    hazard_revelation: One shipment includes a sealed box of uranium. The narrator
      describes radiation danger and potential contamination if the box is opened
      or damaged; the characters may initially be unaware.
    antagonist: Fictional stealthy go-gangers called the Red Rovers, who try to capture
      the vehicle while the team is distracted.
    pursuit_and_obstacle: The attackers create a fictional road-warrior-style diversion
      at a narrow bridge, leaving characters to attempt to reach the stolen vehicle
      by another route.
    aftermath: The team finds attacked gang members and learns that a Bison was driven
      off. Wyverns, a nomadic Wichita tribal caravan, and Ute security forces further
      complicate the situation.
    ethical_and_agency_distinctions: The suggested tribal travelers do not necessarily
      know what is concealed in the cargo. Risk from the uranium is separate from
      malicious intent; the group may need medicines and supplies while the players
      consider their options.
    gm_discretion: Optional encounter, not a factual historical report; it supplies
      no universal character attribute or fixed game target number.
  arch_enemies:
    source_start_printed: 109
    initial_job: A fictional Mr. Johnson offers player characters a paid security
      escort for a shipment of rigger equipment to St. Louis.
    deception: At a nominal handoff, impostors appear as the fixer and entourage and
      the expected authentication response is absent.
    player_choice: The players can recognize an inconsistency and react rather than
      being forced to surrender the goods.
    subsequent_request: If the team escapes and meets its true contact, the employer
      says the merchandise was intended for the missing real fixer and may ask them
      to recover it.
    certainty: Optional GM adventure premise on printed p109 through the opening of
      p110, not a completed in-world event.
  underworld_railroad:
    source_start_printed: 110
    speaker_and_request: A man calling himself Traction asks characters in Detroit
      to accompany a road shipment to Milwaukee, supposedly on behalf of an underworld
      party.
    true_identity: He is Donny McAlister, presented as a fictional Mafia subordinate
      of Don Leo McCaskill of Milwaukee, fleeing Don Roland “the Greek” after embezzlement.
    misrepresentation: Donny falsely claims skilled rigger status despite lacking
      the promised cyberware and ability; his cargo is actually boxes of bricks rather
      than valuable merchandise.
    pursuit: His rivals and authorities create dangerous fictional encounters, including
      a bounty and a staged vehicle search that threatens characters. These threats
      are optional narrative complications.
    bounty_nuyen: 40000
    character_agency: The hired characters are misled by Donny. They may choose to
      pursue real payment, leave him, seek another resolution, or expose him rather
      than being obliged to perform his false commission.
    authorship: Presented as a fictional game-master scenario, not a claim about actual
      organized crime.
  rules_status: No new fixed combat, damage, dice-pool or security TN statistics appear
    in these adventure narratives; the separate p109 and p110 tables have their own
    records.
