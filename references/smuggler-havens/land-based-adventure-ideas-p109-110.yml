data:
  section: Game Information — Adventure Ideas for land-based campaign travel, printed pp109–110
  fictional_context: Three optional in-world Shadowrun tabletop RPG scenario hooks; no narrated 
    real-world incident or guidance.
  quick_recovery:
    source_start_printed: 109
    employer: A fictional Cascade ork group hires player characters to accompany a cargo run from 
      Seattle toward Denver.
    assigned_vehicles: The GM scenario says two Ford-Canada Bison vehicles are provided, one principally
      for cargo and one for characters and additional load.
    hazard_revelation: One shipment includes a sealed box of uranium. The narrator describes radiation 
      danger and potential contamination if the box is opened or damaged; the characters may initially 
      be unaware.
    antagonist: Fictional stealthy go-gangers called the Red Rovers, who try to capture the vehicle 
      while the team is distracted.
    pursuit_and_obstacle: The attackers create a fictional road-warrior-style diversion at a narrow 
      bridge, leaving characters to attempt to reach the stolen vehicle by another route.
    aftermath: The team finds attacked gang members and learns that a Bison was driven off. Wyverns, a 
      nomadic Wichita tribal caravan, and Ute security forces further complicate the situation.
    ethical_and_agency_distinctions: In this optional fiction scenario, a nomadic Wichita Amerind group 
      takes possession of the Bison after the wyverns attack the Red Rovers. The Wichita travelers are 
      sorting through the boxes but have not yet found the sealed uranium; their awareness cannot be 
      presumed. The source separately says the group needs medicines and basic supplies and the player 
      characters may bargain or choose another response.
    gm_discretion: Optional encounter, not a factual historical report; it supplies no universal 
      character attribute or fixed game target number.
    cargo_inventory_from_source: The game-master scenario identifies most of the cargo as firearms no 
      larger than heavy pistols, without ammunition, plus a sealed box containing uranium; this is 
      fictional plot cargo rather than an equipment stat block.
    discovered_cargo_hazard: Opening or damaging the sealed uranium box can contaminate the locality and
      injure people through radiation exposure in the scenario; the game book gives no numerical 
      radiation-resolution statistic here.
    regional_community_detail: The tribal travelers are Wichita Amerinds; the in-world narrator 
      describes potential need for medicine and supplies, and separately describes Salt Lake City as a 
      Mormon-controlled city with strict anti-gun laws. These are setting claims within the optional 
      scenario, not contemporary descriptions.
  arch_enemies:
    source_start_printed: 109
    initial_job: A fictional Mr. Johnson offers player characters a paid security escort for a shipment 
      of rigger equipment to St. Louis.
    deception: At a nominal handoff, impostors appear as the fixer and entourage and the expected 
      authentication response is absent.
    player_choice: The players can recognize an inconsistency and react rather than being forced to 
      surrender the goods.
    subsequent_request: If the characters escape the impostor handoff and contact the actual Mr. 
      Johnson, the employer first asks them to find the intended fixer and deliver the shipment; if they
      lost the goods, he asks them to recover the shipment. On printed p110, after they learn the 
      intended fixer has been killed, Johnson directs them to sell to the highest bidder. Those are 
      successive conditional events, not a single obligatory retrieval order.
    certainty: Optional GM adventure premise on printed p109 through the opening of p110, not a 
      completed in-world event.
    intended_fixer_fate: The intended St. Louis fixer has already been killed when the runners try to 
      contact him; the book describes that discovery as a change in the optional scenario.
    fictional_cargo_specifics: Fictional cutting-edge rigger equipment includes remote-control decks, 
      decryption modules, signal amplifiers, and vehicle-adaptation black boxes. The game narrator 
      describes a haul worth hundreds of thousands of nuyen, without a fixed payout or equipment price 
      table.
    employer_retention_offer: Johnson may offer the party a small percentage to preserve loyalty after 
      the intended fixer is found dead; no precise percentage is specified.
    rival_factions_and_agency: The St. Louis underworld becomes contested; named fictional syndicates 
      include Yakuza and Triads, with offers to recruit, purchase from, or attack the party. A surviving
      team might become prominent in the city’s trade, but this is optional GM story guidance rather 
      than an established outcome.
  underworld_railroad:
    source_start_printed: 110
    speaker_and_request: A man calling himself Traction approaches characters in Detroit, says he is a 
      smuggler from California whose competition wrecked his vehicle, and requests an escort for boxes 
      of supposed cargo to Milwaukee. He offers to fund a suitable vehicle if the party lacks one; his 
      stated explanation is deceptive.
    true_identity: He is Donny McAlister, described by the fictional narrator as a Mafia subordinate of 
      Don Leo McCaskill of Milwaukee, fleeing after having ripped off Don Roland “the Greek” in Detroit.
      The source does not specify an embezzlement mechanism.
    misrepresentation: Donny falsely portrays himself as a competent rigger. The fictional narrator 
      explicitly says he has a datajack, but may pretend his other cyberware is broken or that he lacks 
      the necessary vehicle skill if asked to rig; his deficient technical knowledge and vocabulary will
      become apparent. The supposed cargo is actually boxes of bricks.
    pursuit: Within this optional fictional scenario, acquaintances may recognize Donny, and his rivals,
      bounty hunters and corrupt police may pursue the party. The source says associates of Don Roland 
      have arranged an APB against both Donny and the player characters’ vehicles. A law-enforcement 
      stop could lead to a vehicle search and arrests; if arrested, the players face the explicitly 
      described danger of being shot under an alleged “attempting to escape” rationale. These are 
      optional scenario risks, not a narrated historical event or a fixed game mechanic.
    bounty_nuyen: 40000
    character_agency: The hired characters are misled by Donny. They may choose to pursue real payment, 
      leave him, seek another resolution, or expose him rather than being obliged to perform his false 
      commission.
    authorship: Presented as a fictional game-master scenario, not a claim about actual organized crime.
    cargo_and_payment_conditions: The boxes are filled with bricks, and Donny attempts to maximize the 
      fictionally supposed value of their cargo by accepting all available vehicle capacity. If 
      characters consider turning him in for the 40,000-nuyen bounty, Donny may make extravagant 
      counteroffers; they retain choices about cooperation and payment.
  rules_status: No new fixed combat, damage, dice-pool or security TN statistics appear in these 
    adventure narratives; the separate p109 and p110 tables have their own records.
headline: 'FICTIONAL Shadowrun tabletop-RPG archival reference — FASA Corporation, Target: Smuggler Havens
  (FASA7215, 1998, historical Second Edition era), printed pp109–110/PDF110–111: optional land-journey adventure
  scenarios and conditions'
summary: 'Source-reviewed third-person account of three optional FASA Corporation Shadowrun game-master scenarios
  in Target: Smuggler Havens (FASA7215, 1998, Second Edition era), printed pp109–110/PDF110–111. It distinguishes
  source narrator facts, fictional character deceptions and optional player outcomes; no inferred Third Edition
  mechanics.'
