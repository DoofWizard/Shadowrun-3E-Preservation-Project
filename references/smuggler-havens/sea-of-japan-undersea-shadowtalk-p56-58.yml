data:
  source_context: 'Fictional forum replies to Soju’s Sea of Japan report in FASA Corporation,
    Target: Smuggler Havens (FASA7215, copyright 1998), historical Shadowrun Second
    Edition-era tabletop sourcebook, printed pp56–58/PDF57–59. P57/PDF58 is an illustration;
    responses appear on printed pp56 and 58. Claims about corporations, sabotage and
    maritime activities are preserved as attributed allegations.'
  posts:
  - printed_page: 56
    speaker: Larkspur
    claim: Says Shiawase and Mitsuhama are among corporations pressuring Yamatetsu;
      Fuchi and Renraku are more occupied with disputes against each other.
  - printed_page: 56
    speaker: Pentecost
    claim: Notes that the undersea bases require supply deliveries and cannot presently
      meet Dunkelzahn’s self-sustaining-community criterion.
  - printed_page: 56
    speaker: Gorai@asem.tams.md.jp
    claim: Criticizes Japan’s attitude to agricultural self-sufficiency and says Yamatetsu
      trade sanctions worsened food prices despite Japan’s limited farmland.
  - printed_page: 56
    speaker: Metsuke
    claim: Suggests Yamatetsu combines marine biology research and aquaculture partly
      to portray alleged corporate interference as interference with food security.
  - printed_pages: 56,58
    speaker: Black Salmon
    claim: Reports a TerraFirst! eco-activist attack on a Renraku fish farm involving
      released mercury and extensive environmental contamination; adds that biologists
      estimate at least another four years before the habitat recovers. This is an
      in-world report, not verified real-world news.
  - printed_page: 58
    speaker: No Compromise
    claim: Alleges the mercury incident was orchestrated by Shiawase and framed on
      TerraFirst! eco-activists to conceal toxic waste dumping in deep-sea trenches;
      this is a contested allegation.
  - printed_page: 58
    speaker: Sierra Scout
    claim: Reports government environmental fines and warns that Yamatetsu may incur
      costs if it neglects waste disposal and environmental regulations.
  - printed_page: 58
    speaker: Woo
    claim: Claims a Wuxing inspection-team member was a geomancer sent to study local
      geothermal and mystical conditions around Saotome AquaDomes.
  - printed_page: 58
    speaker: Ryan
    claim: Says Shiawase’s wave and geothermal power stations deliver less than one-fifth
      of Japanese electricity demand.
  - printed_page: 58
    speaker: Aware
    claim: Warns about the reported cultural and environmental consequences of fusion
      reactors but does not give a playable rule.
  - printed_page: 58
    speaker: Metsuke
    claim: Reports a Shiawase geothermal plant near Nagato went offline during peak
      demand after an attack involving a minibus with minitorpedoes; says Shiawase
      investigators suspected Yamatetsu paid the attackers.
  - printed_page: 58
    speaker: Toshiro
    claim: Counters that Shiawase allegedly staged the incident with its own personnel
      posing as a Yamatetsu representative, attempting to frame Yamatetsu; the plan
      supposedly failed when the purported organizer was exposed.
  - printed_page: 58
    speaker: Sauvix
    claim: Questions Toshiro’s source and suggests the post might be Yamatetsu public
      relations.
  - printed_page: 58
    speaker: Attila the Hyun
    claim: Says abandoned offshore oil and gas rigs create bases for maritime criminal
      groups, citing the Korean Park Dyun Woo’s group and a claimed subsequent Japanese
      Navy interdiction.
  - printed_page: 58
    speaker: Scavenger
    claim: Adds that some crews use abandoned rigs for cargo caches with hazardous
      animals left as guards.
  rules_review: The posts contain no formal game checks, target numbers or equipment
    stat lines; mentioned minitorpedoes and facilities have no mechanical quantities
    or stat blocks in this range.
