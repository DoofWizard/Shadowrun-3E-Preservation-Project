data:
  section: Into Aztlan
  route_name: The End Run
  narrative_voice: In-world fictional reporter Yeager; subjective assessments and disputed events
    are explicitly attributed.
  fictional_geopolitical_setting: The Aztlan spur is described as branching off the Denver approach,
    through Pueblo Corporate Council territory and the Confederate American States and across
    the Aztlan boundary. Yeager mentions Santa Fe, San Angelo, Austin, San Antonio, Monterrey,
    Querétaro, Tenochtitlan and Antanzio in this fictional geography.
  mentioned_locations:
  - name: Midnight Caverns
    source_description: A smuggler-operated cave community south of Pueblo with vehicle maintenance.
      Yeager names Barkley, a dwarf mechanic, for his repair expertise.
  - name: Castle Creek
    source_description: A settlement between San Angelo and Austin, near the CAS–Aztlan border;
      Yeager attributes the camp’s organization and military surplus to Colonel Dwane Markinson,
      a retired CAS Army officer. He repeats claims that Aztlan forces have attempted attacks,
      while offering no independent proof.
  - name: Antanzio
    source_description: A fictional population center near Tenochtitlan described by Yeager as
      a gateway to the Yucatán rebel region. He says the Aztlan government tried to destroy or
      erase the city from official maps and that residents still remain.
  trade_actors_and_types: Yeager attributes southbound movements of weapons, cyberdecks, programs,
    electronics and military goods to fictional smuggling groups. He distinguishes return movements
    of refugees, magical materials, natural drugs, information and other goods; he also reports
    that live blood mages are transported as a traded category, which the record does not presume
    to be voluntary or lawful. The source does not assert that every refugee is coerced or that
    every named participant consents.
  risk_assessment: Yeager calls the route the most dangerous in North America and describes an
    approximately 3,000-kilometer transit across four national territories. He refers to Aztlan
    military forces, magical threats, blood magic, and human sacrifice as risks in his fictional-world
    account; these are attributed observations and allegations, not real-world findings.
  aircraft_and_terms: Yeager associates the corridor with t-birds and other LAVs, describes strong
    radar defenses, and specifically references ECCM and ECD at SOTA levels without supplying
    exact new equipment ratings, costs, or numeric bonuses.
  named_riggers_and_people:
  - name: Rapier
    account: A female pilot whom Yeager associates with the route.
  - name: Ryan Blanchard
    role: gunner and tactician
    affiliation: Rapier’s crew
  - name: Pete Gordani
    role: rigger
    affiliation: Rapier’s crew
  - name: Krista Freid
    role: magical support
    affiliation: Rapier’s crew
  - name: Nightwind Brothers
    members:
    - Strider
    - Chase
    account: Yeager says the Nightwind Brothers, Strider and Chase, operate a converted Aguilar
      attack helicopter and specialize in transporting people across the fictional Aztlan border.
      He adds that, for a substantial additional fee, they will venture far into the Yucatán for
      extraction or drop-off assignments; the described service is conditional rather than routine,
      and neither the narrator nor this record establishes blanket consent of transported people.
  uncertainty_and_opposition: Yeager cites military and customs patrols and incompatible political
    interests at border territories. His personal experiences, danger assessments, and reported
    border incidents remain attributed rather than authoritatively proven.
  provenance_note: The introduction appears on printed p87/PDF88; the named crews, attributed
    risks and route opposition continue through printed p88/PDF89.
  fictional_border_conditions_as_reported:
    pueblo_cas: Yeager characterizes the Pueblo–CAS boundary as comparatively smooth on this particular
      route, not as an absolute rule for all crossings.
    cas_aztlan: He describes the CAS–Aztlan boundary around Austin as mined, heavily patrolled
      and militarily tense, with both sides on alert; his testimony and secondhand reports must
      not be promoted to verified real-world security facts.
    degree_of_certainty: Yeager interleaves personal recollection with reports from other smugglers
      and qualified speculation; the record preserves that distinction.
