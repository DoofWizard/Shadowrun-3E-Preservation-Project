data:
  section: Fictional in-world Shadowland v3.0 sponsor screen and news board
  source_map: PDF5 is positioned after printed p3/PDF4; PDF6 precedes printed p6/PDF7.
    Pages lack visible printed folios and are provisionally mapped as printed pp4–5.
  narrative_attribution: These are stylized, in-world Shadowland editorial and news-board
    statements in a fictional Shadowrun tabletop setting, not independently verified
    book-narrator facts or a real online publication.
  pdf_5_sponsor_screen:
    heading: A Word from Our Sponsor
    attributed_editorial_claim: The fictional Shadowland voice reports intensified
      corporate rivalry and portrays smugglers and pirates as exploiting companies’
      competing priorities; it encourages its imagined readers to take up the topic.
    back_stock_catalogue:
    - Underworld Sourcebook
    - 'Target: UCAS'
    - Rigger 2
    - Cyberpirates
    daily_special_teaser: The imagined site introduces a feature on fictional New
      Orleans, Vladivostok, land and maritime transport routes, and underwater corporate
      sites.
    coming_soon:
    - New Seattle
    - Magic in the Shadows
    - Corporate Download
    website_style: Depicts the fictional Shadowland v3.0 portal with navigation, archive
      and media links.
  pdf_6_news_screen:
    in_world_date_display: 02.32.11
    headlines:
    - title: Renraku Bites the Bullet
      attributed_reporting: >-
        The fictional news board reports that Fuchi prevailed after a high-stakes Corporate Court emergency meeting. Miles Lanier reportedly resigned from Renraku, surrendered to Fuchi security on industrial-espionage charges, and sold all his Renraku stock at depressed prices, substantially reducing Renraku share value. Separate recent allegations concerned database glitches and Renraku failing to keep up with its own newly released technology.
      certainty: Fictional in-world news-board account and allegations, not independently
        proven real-world events.
    - title: Bad Blood
      attributed_reporting: >-
        The fictional news board describes escalating low-intensity megacorporate conflict and new firms joining it. Lucien Cross reportedly narrowly escaped death in a purported aviation accident the preceding week. The board separately reports that Yamatetsu’s Tokyo headquarters was bombed, allegedly by Alamos 20K, before Yamatetsu had finished relocating to Vladivostok. Responsibility is an in-world allegation rather than established narrator fact.
      certainty: A source-attributed news-board claim, including allegations of a
        bombing and responsibility; not a narrator-confirmed historical fact.
    - title: Wu Who?
      attributed_reporting: >-
        The fictional board says Wuxing gained prominence after the figure called the Big Wyrm died. It portrays Wuxing as pressuring Japanese megacorporations across the Pacific Rim, with Yamatetsu as an ally, and as almost finished organizing second-tier Pacific Rim firms into the Pacific Prosperity Group. Questions about Triad magic, a dragon and immortal elves are expressly speculative, not confirmed explanations.
      certainty: In-world speculation and corporate commentary.
    - title: Meet the New Don
      attributed_reporting: >-
        The fictional news board says the Commission selected Maurice “The Butcher” Bigio as the new Seattle Mafia don rather than Rowena O’Malley. It states that Mafia leaders faced this choice after newly united Yakuza clans took remaining Mafia holdings. The Yakuza were reportedly anxious after having claimed independence from Japanese oyabun. These are in-world news statements, not independently verified historical facts.
      certainty: Attributed fictional Shadowland news and commentary, not an independent
        book-narrator endorsement.
  source_rules_status: No independently stated tabletop game procedure, statistic
    or numeric mechanics; all material is an attributed fictional news-board presentation.
