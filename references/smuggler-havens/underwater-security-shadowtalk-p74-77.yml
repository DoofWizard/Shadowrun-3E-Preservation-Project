headline: 'Fictional Shadowrun tabletop RPG source record — FASA Corporation, Target:
  Smuggler Havens, FASA7215 (1998, Second Edition-era), printed pp.74-77/PDF pp.75-78:
  Underwater Security: separately attributed Shadowtalk claims'
summary: 'Historical published-fiction reference from FASA Corporation’s Target: Smuggler
  Havens (FASA7215, 1998, Shadowrun Second Edition-era), printed pp.74-77/PDF pp.75-78.
  Retains each named speaker and the distinction between reported fiction, contested
  sonar or magical claims, and unverified firsthand anecdotes.'
data:
  section: Underwater Security, by Undertow — reader Shadowtalk and commentary
  claims:
  - printed_page: 74
    speaker: Cutty Sark
    claim: Blue-spectrum cameras fitted with low-light imaging are claimed to transmit
      through seawater up to 200 meters and, with amplification, to produce a sharp
      monochrome image of the scanned area up to 500 meters; presented as commentator
      assertion, not a printed game stat.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 75
    speaker: Man-a-T@spq-n5.son.net
    claim: States that artificial underwater lighting generates heat that attracts
      barnacles, coral, anemones, starfish and other marine life; claims maintenance
      divers may have to clean organisms off lights after about a week.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 75
    speaker: Cutty Sark
    claim: Claims ultrasonic active sonar covers only a few meters in air but several
      hundred meters under water; describes its use for detecting metahuman-sized
      targets and its limitations for large ships or vehicles beyond 400 meters.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 75
    speaker: Moray
    claim: Claims fish and other sea creatures generate distracting sonar signatures
      and may conceal a swimmer in acoustic clutter.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 75
    speaker: Trevor
    claim: Asserts that a Silence spell could easily spoof sonar.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 75
    speaker: Man-a-T@spq-n5.son.net
    claim: 'Disputes Trevor’s proposed spell effect: claims that active sonar also
      expects echoes from terrain and that a Silence effect may create a conspicuous
      gap rather than concealing the subject.'
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 75
    speaker: Yukon Cornelius
    claim: Claims Farm-the-Sea has trained dolphins and some smaller orca species
      as watchdogs; says dolphins carry transponders that report sensor data and aggressive
      orcas may pursue metahumans.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 75
    speaker: The Smiling Bandit
    claim: Claims Universal Omnitech engineered octopuses for some Renraku underwater
      facilities in the Sea of Japan; when disturbed, these creatures allegedly produce
      black ink and a sonar-detectable high-pitched squeal that alerts security.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 75
    speaker: Chess@ka.tx.cas
    claim: Claims Aztechnology deploys cybernetically augmented sharks near an offshore
      pyramid by Galveston, fitted with wired reflexes, dermal armor, titanium teeth
      and other augmentations; reports they are difficult to control and can disable
      an armed minisub. These are in-world allegations.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 76
    speaker: Moray
    claim: Claims aquacologies particularly favor the Ares Sentinel PN-series armed
      security drone, a monorail-mounted underwater adaptation of the aboveground
      Sentinel P, with a small-caliber mounting point.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 76
    speaker: Cutty Sark
    claim: Explains that the source’s term free-ranging drone is limited by a broadcast
      transmitter area; claims loss of carrier signal outside its assigned area disconnects
      the vehicle and triggers a fallback stop, with some return-to-area programming.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 76
    speaker: The Ancient Mariner
    claim: Remarks that fire and air elementals cannot manifest underwater, but may
      still serve as astral watchdogs and assist with combat and detection spells;
      attributes the distinction to astral activity rather than physical manifestation.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 76
    speaker: Nereid@aso.pn.bcl.ct
    claim: Claims many underwater wagemages dislike cramped deep facilities yet enjoy
      astral patrols; offers this as opinion on working conditions rather than a system
      rule.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 77
    speaker: Cutty Sark
    claim: Says diving bells and submarine bays are open to underwater pressure and
      their air space does not itself confer normal atmospheric pressure; describes
      decompression risk.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 77
    speaker: Aegis
    claim: Notes that underwater explosions can cause hydrostatic shock, as a disputed
      security consideration in the fictional setting.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 77
    speaker: Gitmo Gus@cmot.cuba.cl
    claim: Argues that explosive intrusion at a chamber can affect connected underwater
      spaces; contrasts airlock and bulkhead resilience. This is an in-world scenario
      assertion, not an operational instruction.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 77
    speaker: Halibut@nap26.vn.ss.nan
    claim: Claims certain facilities may lock down an alarmed chamber and keep captured
      people detained for interrogation instead of simply flooding it; preserves the
      coercive detention category.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 77
    speaker: Grip
    claim: Makes a graphic threat involving mutilation and using blood to attract
      sharks in a hypothetical underwater encounter; this is an attributed hostile
      comment, not a recommended act.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  - printed_page: 77
    speaker: Wu Pi@tsuen.hk
    claim: Reports an alleged failed extraction from a Renraku aquacology off the
      Philippines, with an alarm and a rapid response by armed Red Samurai; framed
      as testimony, not narrator-confirmed history.
    epistemic_status: in-world named-commenter assertion; not independently established
      by narrator
  editorial_rule: Speaker-attributed opinion, allegations, counterclaims and anecdotes
    are never presented as narrator facts. Claims about threats, detention and violent
    acts remain categorized rather than euphemized away; none is real-world guidance.
  cross_references:
