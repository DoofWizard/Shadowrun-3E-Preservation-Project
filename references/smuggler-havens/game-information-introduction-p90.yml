data:
  section: Game Information
  source_form: Authorial game-master-facing fiction and rules-preview text rather
    than in-world Yeager or Shadowtalk dialogue.
  regional_content: The introduction names New Orleans, Vladivostok, undersea sites
    and land smuggling routes as campaign settings. For New Orleans and Vladivostok
    it explicitly announces Facts at a Glance, Getting In/Out, Cost of Living, local-color
    elements and sample adventure ideas.
  underwater_rules: The source says subsequent pages provide rules for living and
    surviving in underwater communities, whose expansion is linked to incentives in
    Dunkelzahn’s will and to corporate investment.
  vehicle_rules_and_lineage: The source explicitly describes additional t-bird rules
    for overland routes as supplements to, not replacements for, the published rules
    in Rigger 2. This is historical Second Edition-era lineage, not an implicit Shadowrun
    Third Edition conversion.
  mechanical_scope_of_page: Printed p90 itself gives an overview and chapter structure;
    no target number, die pool, numerical modifier, equipment statistic, explicit
    cost, or procedure appears on this introduction page. Subsequent pages must receive
    independent deep mechanical review before any rule records can be authorized.
  publisher_context: 'FASA Corporation, Target: Smuggler Havens (FASA7215, 1998),
    historical Second Edition-era material.'
