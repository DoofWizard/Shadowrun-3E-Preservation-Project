data:
  source_review_context: 'Fictional Shadowrun tabletop source: FASA Corporation, Target:
    Smuggler Havens (FASA7215, 1998), historical Shadowrun Second Edition-era tabletop
    RPG sourcebook; source.fasa-7215, printed pp62-65/PDF pp63-66. In-world report
    by Mal-de-Mer; narrator text and named forum replies remain differentiated.'
  context: These are named fictional forum replies within Mal-de-Mer’s North Atlantic
    chapter, not independent confirmed real-world facts.
  claims:
  - page: 62
    speaker: Hacktic
    claim: Identifies The Hague as a data haven and black-information meeting point
      in the Netherlands.
  - page: 62
    speaker: TDC@archnet.rpi.edu
    claim: Explains Draco Foundation award requirements as fully submerged and self-sustaining,
      and argues that Proteus’s partly above-water structures failed both criteria.
  - page: 63
    speaker: Marquis de Lignes@cgbn.minitel.fr
    claim: Claims IFMU intends a Baltic Sea aquacology and alleges Renraku Europa
      has plans off Malta; presents the latter as a rumor.
  - page: 63
    speaker: Gryff
    claim: Says the Draco Foundation visit was the first public viewing of a Proteus
      arkoblock, that employees sign ten-year employment contracts limiting departure,
      and that their first release is expected late 2063.
  - page: 63
    speaker: Skeptic
    claim: Observes that employees must leave sometime and questions the claim of
      a self-sustaining arcology.
  - page: 63
    speaker: Walzer
    claim: Asks whether any runner has undertaken a job inside a Proteus AG arkoblock;
      offers no assertion of firsthand access.
  - page: 63
    speaker: Grid Reaper
    claim: Reports encountering an unusually hostile and heavily encrypted Proteus
      matrix host, and says it was seen while trying to access a Proteus satellite.
  - page: 63
    speaker: Shockwave Sie
    claim: Says a team prefers hijacking the supply ships because direct entry is
      very hard, and relays interest in the cargo rather than an actual completed
      entry.
  - page: 63
    speaker: Grid Reaper
    claim: Asserts a Proteus satellite photographed two arkoblocks, without verifying
      its intelligence.
  - page: 64
    speaker: Sandmann@f-n.pro.de
    claim: Reports no solid leads after events on May 5 involving temporary closure
      of Proteus headquarters and alleged fighting with AG Chemie personnel and at
      least one dragon.
  - page: 64
    speaker: Nachtmusik
    claim: Claims a draconic participant was killed in the failed hostile takeover,
      while admitting limited recollection and uncertain involvement.
  - page: 64
    speaker: Spade
    claim: Speculates whether Aztechnology East might be connected; another comment
      dismisses the conjecture.
  - page: 64
    speaker: Matrix-dancer@sova.sc.co.de
    claim: Asks whether human genetic experiments fit the corporation’s described
      business model; the question itself is not verified evidence.
  - page: 65
    speaker: Sandmann@f-n.pro.de
    claim: Describes the 2056 Genera scandal as allegations from documents attributed
      to a Green Cell faction, including unethical genetic experimentation on humans
      and shipments from other firms; says subsequent investigation did not produce
      positive proof of outside involvement because much evidence was destroyed.
  - page: 65
    speaker: Seh Grün
    claim: Expresses fear that Proteus arcology water-purification plants may produce
      dangerous or toxic effects; the concern is personal inference.
  mechanics_review: Forum commentary contains no mechanical modifiers or new game
    equipment statistics.
