nate some local magical-material markets.","certainty":"local market opinion"},{"speaker":"Maya","printed_page":25,"claim":"Says Red Tower prefers to keep its meetings hidden from outsiders.","certainty":"speaker characterization"},{"speaker":"Rasputin Magekin","printed_page":25,"claim":"Identifies Le Tour Rouge as a Red Sect and alleges its Petro practitioners avoid daylight.","certainty":"unverified classification/allegation"},{"speaker":"Maman Sangre","printed_page":25,"claim":"Declares that her group follows a superior path of power and disparages other voudoun practitioners.","certainty":"self-description and polemic, not authorial endorsement"},{"speaker":"D. Bunker","printed_page":25,"claim":"Mocks the more frightening description of Red Sects.","certainty":"satirical reaction"},{"speaker":"Social Adept","printed_page":25,"claim":"Challenges a blanket demonization of voudoun, comparing it to other traditions and disputing sensational portrayals.","certainty":"critical rebuttal"},{"speaker":"Mama D","printed_page":25,"claim":"Acknowledges harmful factions in the setting while rejecting the idea that such factions define all practitioners.","certainty":"contextual rebuttal"},{"speaker":"Proud Trog","printed_page":26,"claim":"Challenges the implication that metahumans are inherently dangerous or naturally drawn to destructive magic.","certainty":"critical challenge"},{"speaker":"Mama D","printed_page":26,"claim":"Claims Petro practice attracts relatively more metahumans and notes the source narrator Doc Cane says some have suffered serious prejudice; distinguishes Doc’s characterization from a blanket accusation.","certainty":"speaker argument, not population proof"}],"attribution_rule":"Retain Impact’s allegation, Rasputin Magekin’s classification, the sect leader’s polemic and rebuttals as separate fictional-speaker statements; do not turn disagreement into narrator-established facts."},"headline":"Fictional attributed shadowland debate about new orleans voudo