pdf_pages: 40-42
edition_scope: 'Original FASA Corporation Shadowrun Target: Smuggler Havens (FASA7215,
  ©1998), historical Second Edition-era fictional setting; no inferred Shadowrun Third
  Edition conversion'
content_class:
- attributed_claim
data:
  attribution_policy: All named forum posts are fictional sourcebook commentary. Assertions
    are not real-life advice or verified zoological/historical facts, and rumors about
    paranormal beings remain unverified.
  comments:
  - printed_page: 39
    speaker: Woppler the Weatherman
    claim: Explains taiga as northern coniferous forest and compares it to an evergreen
      rain forest.
  - printed_page: 39
    speaker: Yarovit@usys.vladnet.ru
    claim: Attributes a dramatic leopard and tiger population rebound to poaching
      profits and deteriorating state enforcement. In this fictional account, says
      they were off the Endangered Species List by 2037 and the Threatened Species
      List by 2041; reports individual cats attacking domestic animals and approaching
      roads and clearings. This chronology remains Yarovit’s assertion.
  - printed_page: 39
    speaker: Ahotnik@guam.krz.ru
    claim: Claims many nearby tiger and leopard shapeshifters coexist with other animal
      shifters, perhaps reflecting a tolerant metahuman community.
  - printed_page: 39
    speaker: Urdul@irk.tenset.ru
    claim: Speculates without proof that increased tiger populations coincided with
      the Siberian uprising and that some shapeshifters are political agents.
  - printed_page: 40
    speaker: Rassoodok@usys.vladnet.ru
    claim: Dismisses shapeshifter conspiracy stories as rumors.
  - printed_page: 40
    speaker: Mick the Irish ...
    claim: Claims the folklore creature Baba Yaga appears as an elderly one-eyed flesh-eating
      woman in remote forests at night; this is a paranormal legend in the fictional
      setting, not a confirmed creature stat block.
  - printed_page: 40
    speaker: Ethnocentrixy
    claim: Comments that folkloric forest-crone tales are found in multiple cultures
      and suggests European origins.
  - printed_page: 40
    speaker: Nerpa@irk.tenset.ru
    claim: Describes the lake’s powerful aura and a rich Siberian northshore magical
      ecosystem; contrasts this with pollution from logging and industry on the Russian
      southern shore.
  - printed_page: 40
    speaker: Beastmaster
    claim: Reports Awakened reindeer and humped horses, argues some may be spirits
      or shifters, and says wealthy trophy hunters have disappeared while searching
      for rare creatures.
  - printed_page: 40
    speaker: Wulf
    claim: Says each local elk herd is led by an Awakened Grandfather Elk whose influence
      protects both herd and territory. Wulf adds that Russians believe Siberian shamans
      can actually speak with these Grandfathers and states he is inclined to agree;
      the belief and his endorsement remain attributed.
  - printed_page: 40
    speaker: Nerpa@irk.tenset.ru
    claim: Reports that some magicians speculate Olkhon Island may be a power site
      for conjuring spirits; the theory has not been tested because of combat nearby.
  - printed_page: 40
    speaker: Golomyanka@ude.tenset.ru
    claim: Alleges military units from both Russia and Siberia disappeared after attempting
      to land on Olkhon Island; the source does not independently verify those claims.
  - printed_pages:
    - 40
    - 41
    speaker: Blade
    claim: Recounts an alleged drone-supported mercenary landing on Olkhon Island
      amid a local snowstorm. Says a camp sentry froze solid, then shattered after
      a collision with the drone; the camp’s thermal signatures vanished, the narrator
      lost drone control and briefly saw an apparently luminous pale woman. This remains
      a named eyewitness-style fictional account without an associated freezing rule.
  - printed_page: 41
    speaker: Gusli@pry.tenset.ru
    claim: Recounts encountering a Siberian raiding party and an Evenk shaman while
      traveling north of Lake Baykal in the fictional setting. Gusli says his own
      fireball killed or disabled many of the Siberians, while the shaman apparently
      survived using spell defense. A glancing grenade-shrapnel hit then struck the
      shaman; the summoned mountain spirit unexpectedly turned against the shaman
      and afterwards attacked Gusli’s group, incapacitating about three members before
      Gusli banished it. The text does not describe Gusli’s spell being reversed and
      supplies no new spellcasting rule.
  - printed_page: 41
    speaker: Rabid
    claim: Warns that Siberian firebirds are dangerous near the Barguzin cliffs.
  - printed_page: 41
    speaker: Coven Queen
    claim: Says Siberian firebird feathers are valuable magical telesma, but warns
      against selling them in Russia because local spellworms regard them as cursed
      and believe their users suffer bad luck and unexplained accidents. This is an
      attributed superstition, not an actual price or mechanical drawback.
  - printed_page: 41
    speaker: Valenskaia
    claim: Describes rural domovoi household-spirit beliefs and cautions that locals
      may dislike disruption of their household rituals.
  - printed_page: 41
    speaker: Nerpa@irk.tenset.ru
    claim: Says Buryat residents know their local geography and could serve as guides
      despite their distance from the Russian-Siberian conflict.
  - printed_page: 41
    speaker: Shadowslayer
    claim: Speculates humorously whether regional Buddhist monasteries house martial-arts
      societies.
  - printed_page: 41
    speaker: Bung
    claim: Dismisses Shadowslayer’s speculation as a video-game-influenced fantasy.
  mechanics_review: None of the speaker claims contains an independently specified
    test, target number, game statistic, spell cost, or equipment availability; statements
    that sound rule-like are retained as named fictional anecdotes, never invented
    mechanics.
headline: 'Fictional Shadowrun setting — Taiga wildlife, Lake Baykal and Barguzin
  named Shadowtalk; FASA Corporation, Target: Smuggler Havens (FASA7215, ©1998), Second
  Edition-era; printed pp39-41, PDF pp40-42'
