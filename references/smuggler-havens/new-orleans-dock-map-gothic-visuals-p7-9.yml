    publication_credit_source: Printed p3/PDF4 lists multiple illustrators. A signature on the p7 illustration reads PRESCOTT; the credit list includes Steve Prescott, but no unsupported attribution is assigned to the other images.
  printed_page_7:
    physical_pdf_page: 8
    heading: "NEW ORLEANS: THE BIG EASY"
    visual_description: >-
      A framed black-and-white night harbor scene accompanies Captain Chaos's introductory post.
      A hat-wearing foreground figure has a large fleur-de-lis insignia on the sleeve.
      A vessel, harbor cargo and distant buildings appear behind the figure.
    context_distinction: The dock illustration is not the full-page gothic montage on printed p9.
  printed_page_8:
    physical_pdf_page: 9
    visual_kind: regional_cartographic_inset
    printed_title: New Orleans and Vicinity
    labeled_geography:
      - Mississippi River
      - Baton Rouge
      - Lake Maurepas
      - Lake Pontchartrain
      - Lake Borgne
      - New Orleans
      - Houma
      - Brenton Sound
      - Gulf of Mexico
    displayed_route_numbers:
      - "10"
      - "12"
      - "23"
      - "90"
      - "190"
    description: >-
      North-oriented regional reference map with highways, waterways and adjacent settlements;
      these are printed map labels rather than quantified travel or skill-test rules.
  printed_page_9:
    physical_pdf_page: 10
    visual_kind: full_page_fantastical_city_illustration
    description: >-
      A full-page monochrome city montage shows gothic and winged sculptural forms,
      grotesque and stylized figures, surrounding architecture and dramatic shadowed forms.
      The scene is an illustration, not a narrated or independently verified Shadowrun event.
    text_continuity: The City and Its People text on printed p8 continues on printed p10 after this illustrated page.
  mechanics: None of these images supplies a target number, test, dice pool, damage rating or equipment statistic.
