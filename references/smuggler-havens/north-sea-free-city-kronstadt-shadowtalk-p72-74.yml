data:
  source_context: 'Fictional Shadowrun tabletop RPG source from FASA Corporation,
    Target: Smuggler Havens (FASA7215, 1998), historical Second Edition-era; source.fasa-7215.
    Printed pp72-74/PDF pp73-75. Narrative assertions and named Shadowtalk posts are
    separate.'
  posts:
  - page: 72
    speaker: Blank
    claim: Speculates whether the 2034 Kronstadt rebels had magical support or external
      aid, rather than accepting the published account of Russian withdrawal as sufficient.
  - page: 72
    speaker: Nucleus
    claim: Cites a separate Vladivostok source rumor about suitcase nuclear weapons
      allegedly used as leverage against Russian authorities; explicitly framed as
      rumor.
  - page: 72
    speaker: Kropotkin
    claim: Rejects the nuclear-weapon rumor, suggesting the rebels succeeded through
      determination while Russia could not sustain another extended war.
  - page: 73
    speaker: Socio Pat
    claim: Says parts of the city practice direct democracy and resource sharing;
      other factions use their own structures, and any effort to impose centralized
      control faces resistance.
  - page: 73
    speaker: Natasha
    claim: Describes a local informal favor economy involving medical care, drug supplies,
      information and goods, and warns visitors who do not reciprocate favors may
      face hostility.
  - page: 74
    speaker: Jagdpanther
    claim: Alleges that Argus is the secret service of the MET 2000 mercenary corporation
      and maintains a confidential Kronstadt office; suspects its agents do more than
      seek contracts or recreational destinations. Jagdpanther states that MET 2000
      is technically a public corporation with strong German Alliance ties, leading
      local people to regard Argus as a revived German spy service and making it
      unwelcome. These are attributed allegations and local perceptions, not
      independently established narrator facts.
  - page: 74
    speaker: KonWatch
    claim: Points out that IFMU and Proteus have substantial financial holdings in
      MET 2000.
  - page: 74
    speaker: Peet
    claim: Alleges intelligence agents monitor training camps associated with Grünen
      Zellen and Rote Zora in the region, possibly to identify future militants.
  - page: 74
    speaker: Rand
    claim: Claims Kronstadt and Berlin mutually support one another as autonomous
      zones, with weaker links to Hamburg and the Free State of Königsberg.
  attribution_guard: The competing nuclear claims are mutually inconsistent attributed
    remarks and must not be merged into one fact. Other speculative espionage, state
    and faction assertions remain attributed.
