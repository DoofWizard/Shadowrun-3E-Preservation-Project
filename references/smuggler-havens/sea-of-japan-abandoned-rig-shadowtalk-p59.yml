data:
  source_context: 'End of Soju’s Sea of Japan section, FASA Corporation, Target: Smuggler
    Havens (FASA7215, copyright 1998), historical Shadowrun Second Edition-era tabletop
    sourcebook, printed p59/PDF60: named in-world Shadowtalk replies preceding the
    Ports of Call heading. Claims are opinions or rumors, not narrator-established
    events.'
  posts:
  - printed_page: 59
    speaker: Bung
    claim: Jokes about whether a sunken-treasure marker is recorded as a large X on
      a GPS display.
  - printed_page: 59
    speaker: Kim
    claim: Claims an abandoned oil rig between Vladivostok and Hokkaido is used as
      an independent dock and repair base but is effectively operated by Yakuza. Reports
      second-hand rumor of an infestation of dangerous creatures there and says another
      observer intended to investigate.
  - printed_page: 59
    speaker: Li Choi Fat
    claim: Disputes Kim, alleging that the supposed Yakuza facility is actually a
      United Nations intelligence sting.
  - printed_page: 59
    speaker: Net Trawler
    claim: Alleges surviving Beppu Data Haven sysops escaped after a corporate raid,
      installed surviving data units on an abandoned rig with power restored, and
      are seeking an ocean-floor fiber-optic line for a direct Matrix feed.
  rules_review: Original printed p59/PDF60 includes no dice, target numbers, equipment-stat
    block or gameplay procedure; GPS and Matrix references are setting references.
