data:
  source_review_context: 'Fictional Shadowrun tabletop source: FASA Corporation, Target:
    Smuggler Havens (FASA7215, 1998), historical Shadowrun Second Edition-era tabletop
    RPG sourcebook; source.fasa-7215, printed pp66-68/PDF pp67-69. In-world report
    by Mal-de-Mer; narrator text and named forum replies remain differentiated.'
  claims:
  - page: 66
    speaker: Shockwave Sie
    claim: >-
      Alleges the name Rote Zora has been revived by radicals within the Mütter-Erde political club and its feminist society, and that their first action concerned BuMoNa, described as Germany's counterpart to DocWagon, over a program of forced sterilization of ork and troll women in Frankfurt. This is the named speaker's allegation, not a narrator-established account of a real event.
  - page: 67
    speaker: Drake@z144.trap1.acpnet.uk
    claim: Compares the Green Cells decentralized organization to pirate networks,
      and says members exchange practical maritime experience.
  - page: 67
    speaker: Archangel
    claim: >-
      Argues that leaderless anarchist cell organization has a history reaching from the Revolutionary Cells (RZs) through TerraFirst! to the Animal Liberation Front (ALF), that close associates may act on shared principles without formal membership, and that untrusted associates have greater infiltration risks. This is an in-world speaker's historical and strategic comparison, not sourcebook rules or real-world advice.
  - page: 67
    speaker: Clash
    claim: Claims better-connected cells communicate via underground sheets, Matrix
      access and private communications, and that a few organize training camps; presented
      as in-world commentary not instructions.
  - page: 67
    speaker: Ingrid
    claim: >-
      Alleges Germany's Bundesamt für innere Sicherheit (BIS, Federal Office for Internal Security) infiltrates Green Cells and sends Grenzschutzgruppen (GSG) teams after them; accuses GSG of killing some suspects they could have arrested. These are a named speaker's allegations, not independently established narrator facts.
  - page: 67
    speaker: Clausen
    claim: Claims nominal fake Green Cells may be used for reputation attacks and
      says an apparent Zeta-ImpChem-backed disinformation campaign has inflated their
      public profile.
  - page: 67
    speaker: Antifa
    claim: Warns that far-right extremists have independently adopted some leaderless-cell
      rhetoric; this is a political comparison, not a claim that Green Cells belong
      to those groups.
  - page: 67
    speaker: Irkestrøm@bo.benn.dk
    claim: >-
      Reports Eva Susinka's bid for a coordinated Steering Committee and her alliances with Russian submarine pirates. Separately claims visitors from the North American environmental groups Save Our Seas and TerraFirst! were seen in Kiel speaking with Susinka, but acknowledges uncertainty about why they came and merely suspects they sought access to something Susinka controlled.
  - page: 67
    speaker: Deep Green
    claim: Speculates that North American and European environmental groups differ
      in the size of their corporate targets.
  - page: 68
    speaker: Libby
    claim: Asks the difference between GreenWar and Green Cells, prompting an attributed
      historical explanation by Ecotope.
  - page: 68
    speaker: Ecotope
    claim: >-
      Contrasts the earlier GreenWar with Green Cells: says GreenWar was much larger about ten years earlier, more international in reach, centrally organized from Germany, and included members with discriminatory overpopulation beliefs that blamed victims instead of corporations and governments. The speaker says toxic shamans split GreenWar, reducing its effective strength. Describes Green Cells as social ecologists who connect environmental damage to oppression and social control; mentions former ALF participants moving to TerraFirst! and vice versa, and occasional cooperation among eco-activist groups. These are Ecotope's attributed characterizations, not narrator-confirmed history.
  - page: 68
    speaker: 2D
    claim: Questions why radical eco-activists use the Matrix if they oppose technology.
  - page: 68
    speaker: Unnatural
    claim: Replies that many Green Cells are not primitivists, but distinguish emancipatory
      technology from tools of mass control; he contrasts their approach with the
      Klabauterbund.
  mechanics_review: Speaker claims contain no exact dice target numbers or rules for
    carrying out real-world sabotage; retain as fictional claims only.
