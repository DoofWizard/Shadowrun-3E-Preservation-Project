data:
  source_review_context: 'Fictional Shadowrun tabletop source: FASA Corporation, Target:
    Smuggler Havens (FASA7215, 1998), historical Shadowrun Second Edition-era tabletop
    RPG sourcebook; source.fasa-7215, printed pp66-68/PDF pp67-69. In-world report
    by Mal-de-Mer; narrator text and named forum replies remain differentiated.'
  claims:
  - page: 66
    speaker: Shockwave Sie
    claim: Reports that a recent revived Rote Zora group targeted a medical company
      over an alleged compulsory sterilization program targeting ork and troll women.
      This is the speaker’s accusation, not verified by the chapter narrator.
  - page: 67
    speaker: Drake@z144.trap1.acpnet.uk
    claim: Compares the Green Cells decentralized organization to pirate networks,
      and says members exchange practical maritime experience.
  - page: 67
    speaker: Archangel
    claim: Argues that cells can be formed by people sharing principles without formal
      memberships, making infiltration harder; he supplies commentary rather than
      binding rules.
  - page: 67
    speaker: Clash
    claim: Claims better-connected cells communicate via underground sheets, Matrix
      access and private communications, and that a few organize training camps; presented
      as in-world commentary not instructions.
  - page: 67
    speaker: Ingrid
    claim: Alleges internal-security services attempt to infiltrate or entrap independent
      cells, and accuses one border-security unit of killing suspects it could have
      arrested; the book offers this as an attributed allegation.
  - page: 67
    speaker: Clausen
    claim: Claims nominal fake Green Cells may be used for reputation attacks and
      says an apparent Zeta-ImpChem-backed disinformation campaign has inflated their
      public profile.
  - page: 67
    speaker: Antifa
    claim: Warns that far-right extremists have independently adopted some leaderless-cell
      rhetoric; this is a political comparison, not a claim that Green Cells belong
      to those groups.
  - page: 67
    speaker: Irkestrøm@bo.benn.dk
    claim: Reports Eva Susinka’s steering efforts and claims she has acquired influence
      through Russian submarine pirate connections. Later says some North American
      environmental activists visited Kiel, but says the visitors’ objective was unclear.
  - page: 67
    speaker: Deep Green
    claim: Speculates that North American and European environmental groups differ
      in the size of their corporate targets.
  - page: 68
    speaker: Libby
    claim: Asks the difference between GreenWar and Green Cells, prompting an attributed
      historical explanation by Ecotope.
  - page: 68
    speaker: Ecotope
    claim: Describes GreenWar as previously larger, centrally directed and internally
      weakened by toxic shamans, contrasted with Green Cells’ social-ecology emphasis
      and occasional cooperation with other activist groups.
  - page: 68
    speaker: 2D
    claim: Questions why radical eco-activists use the Matrix if they oppose technology.
  - page: 68
    speaker: Unnatural
    claim: Replies that many Green Cells are not primitivists, but distinguish emancipatory
      technology from tools of mass control; he contrasts their approach with the
      Klabauterbund.
  mechanics_review: Speaker claims contain no exact dice target numbers or rules for
    carrying out real-world sabotage; retain as fictional claims only.
