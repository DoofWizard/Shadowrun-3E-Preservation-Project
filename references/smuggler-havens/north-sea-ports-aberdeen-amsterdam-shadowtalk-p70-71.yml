data:
  source_context: 'Fictional Shadowrun tabletop RPG source from FASA Corporation,
    Target: Smuggler Havens (FASA7215, 1998), historical Second Edition-era; source.fasa-7215.
    Printed pp70-71/PDF pp71-72. Narrative assertions and named Shadowtalk posts are
    separate.'
  posts:
  - page: 70
    speaker: McNair@zygo.skrsn.uk
    claim: Calls Moira Lammant-MacRanald the informal Aberdeen pirate queen, asserting
      her influence over the docks and allegiance of Braveheart Fleet and Sea Claymores;
      warns rival pirates about operating in her territory.
  - page: 70
    speaker: Donalbain@trap1.apcnet.uk
    claim: Says Moira is a troll and many MacRanald clan members are metahuman, and
      claims Aberdeen is almost 65 percent metahuman. Describes the Campbell clan
      of the Scottish Wild Lands as powerful and hostile toward metahumans, and relays
      a street rumor that Moira pays extra for cargo seized from Campbell-owned
      freighters.
  - page: 70
    speaker: Broton@talluch.unet.uk
    claim: Identifies Aberdeen as a minor port trafficking exotic paracritters and
      magical material from the Scottish Wild Lands.
  - page: 70
    speaker: Alistair
    claim: Claims Celtic druids oppose the seizure of material from their sacred groves
      and may respond with powerful Awakened magic.
  - page: 70
    speaker: Phantom
    claim: Reports an Aberdeen route to Silicon Glen and clandestine dealings in Matrix
      deck resources, software and hardware, while speculating about industrial espionage;
      the identities and intentions of involved megacorporate sources are not confirmed.
  - page: 70
    speaker: Gremlin
    claim: Warns that Integrated Weapons Systems, identified by the speaker as a British
      military contractor, tests experimental equipment on unfamiliar submersibles
      near Aberdeen.
  - page: 71
    speaker: Hansje@helix.nl
    claim: Says high-intensity California hots simsense chips may be used legally
      in the Netherlands but not in neighboring Britain and France; attributes frequent
      North American supplier flights to this distinction.
  - page: 71
    speaker: Link
    claim: Claims the Helix Data Haven is unusually valuable to Amsterdam runners
      seeking paydata, scans and European references; describes a possible pro-European
      bias.
  - page: 71
    speaker: Jonkeer@ngln.ib.nl
    claim: Alleges that an unidentified corporation hires runners in Amsterdam to
      dispose of people using engineered proteans, and that previous teams did not
      return. This is an alarming anonymous Shadowtalk job warning, not a verified
      incident or game instruction.
  attribution_guard: Legal status, corporate conduct and casualties are source speaker
    claims where a speaker is named; no anonymous claim is upgraded to established
    fact.
