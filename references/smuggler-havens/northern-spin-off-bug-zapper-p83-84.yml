data:
  speaker: Yeager, the fictional first-person route narrator introduced on printed p79
  route_name: The Bug Zapper
  former_name: The Godfather
  basic_route: Yeager identifies a branch between Minneapolis and Chicago, describing Eau Claire,
    the Wisconsin Dells, Tomah and Madison as notable regional places, with conditions fundamentally
    changed by the Chicago Containment Zone.
  stops_and_venues: He refers to rural hideaways and counterculture venues near Eau Claire and
    the Dells, to Tomah as a commercial service stop, and to Merv’s House of Sin as a significant
    Midwest adult-entertainment venue. These descriptions are the narrator’s in-world claims.
  trade_claims: Yeager claims the fictional Containment Zone has extreme demand for ordinary food
    and other commodities, illicit entertainment and assorted contraband. He warns of violent,
    nonconsensual organ-taking from outsiders, using the image of a few bullets as a price for
    their organs; the source does not say that living people are being sold as merchandise in
    this passage. He also mentions claimed trade in stones and other debris marketed as authentic
    Bug City souvenirs or telesma, expressing skepticism about some purported special properties.
  zone_authority_and_access: Yeager says Ares has withdrawn from the fictional Chicago Containment
    Zone, allowing easier access than before, while the UCAS government still controls O’Hare
    Airport, which he calls a major military hub. These are attributed 2059 in-world conditions,
    not contemporary facts or game statistics.
  historical_change: He portrays this corridor as comparatively easy before the containment wall,
    but substantially less traveled and more dangerous following the containment of Chicago. A
    past Chicago Mafia patron is said to have disappeared behind the wall; the routes and criminal
    networks allegedly fragmented afterward.
  difficulty: The account contrasts former profitability with the present risks of the Containment
    Zone, opportunistic intermediaries and rumors of surviving insect-related threats.
  terrain: Yeager reports usable roads and hilly Wisconsin countryside before the Chicago urban
    corridor.
  vehicles: He discusses cargo trucks and formerly familiar highway access, characterizing armed
    or conspicuous vehicles as a source of heightened security attention in the fictional setting.
  named_operators: Yeager mentions the Chicago Don who once financed runs, the Milwaukee Mafia,
    Detroit’s Don Roland (The Greek) and the Green Bay route as competing factors after Chicago’s
    containment.
  opposition: He describes the UCAS military presence, Milwaukee mob competition and residents
    or conditions of the Chicago Containment Zone as hazards, distinguishing these from the more
    conventional earlier border risks.
  boundary_note: The next separate Southern Route, named the Big Dance, begins at the bottom of
    printed p84/PDF85. Its substantive body continues on later pages and is NOT included in this
    record.
  provenance: Original printed pp83–84/PDF84–85. Character testimony remains distinct from book-narrator
    facts or GM options.
  named_in_world_venues_and_comparative_assessments:
    tamir_grey_commemoration: Yeager reports that a counterculture community near Wisconsin Dells
      gave a ceremonial “Seat in Waiting” to Tamir Grey, whom he identifies as a ghoul from Chicago;
      the meaning of the honor is left uncertain in Yeager’s telling (printed p83). This is attributed
      fictional narration, not an independently established event.
    tomah_and_fort_mccoy: Yeager locates Tomah near Fort McCoy, reports a short-rest service stop,
      and describes nearby military-surplus and equipment trade associated with Fort McCoy (printed
      p83). These are source-period fictional claims, not present-day commercial advice.
    don_roland_and_mccaskill_rivalry: Yeager claims that the Detroit Mafia figure Don Roland,
      called “the Greek,” actively promotes the Green Bay corridor to deprive Milwaukee’s McCaskill
      family of trade. The source presents this as Yeager’s explanation of the fictional rivalry,
      not a neutral claim that both routes are equally supported (printed p84).
