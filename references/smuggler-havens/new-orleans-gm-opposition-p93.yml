data:
  section: Running in New Orleans / The Opposition
  source_voice: Authorial game-master guidance, not a factual report about real-world
    New Orleans.
  corporate_opposition: The source says many famous Shadowrun megacorporations have
    minimal permanent presence; smaller petrochemical and entertainment businesses
    may employ or oppose a fictional adventuring party, while visiting executives
    may supply episodic corporate targets.
  organizational_opposition: Organized in-world groups include Mafia, Zobop, local
    krewes and corporate or government agents; fictional market rivalries are potential
    plot hooks, not universal facts about all actors.
  magical_encounters: Optional GM hooks include voudoun cults, insect shamans, vampires,
    ghosts and ghouls; the text also mentions the Vieux Carré and surrounding bayous
    as supernatural adventure settings.
  explicit_cross_references:
  - Underworld Sourcebook
  - Mob War! adventure set
  - 'Smoke and Mirrors (Target: Smuggler Havens printed p24)'
  - Shadowrun Companion p119 (magical campaign)
  nonmechanical_scope: This subsection offers GM scenario themes but no independent
    target number, dice pool, or damage mechanic; the environmental Background Count
    rules begin separately under The Environment.
