data:
  source_context: 'In-world forum posts embedded in Kosak’s fictional Vladivostok
    underworld survey in FASA Corporation, Target: Smuggler Havens (FASA7215, copyright
    1998), historical Shadowrun Second Edition-era tabletop sourcebook. Each claim
    below is assigned to its printed speaker; rumors, opinions and disputed accounts
    are not silently promoted to narrator-established fact.'
  posts:
  - printed_page: 52
    speaker: Prinz Cortio@arbnetz.ffm.de
    claim: Argues that the Mafia is the only major syndicate without a Vladivostok
      foothold; considers its European reach insecure as the Vory expand and says
      establishing a Pacific Rim family would be difficult.
  - printed_page: 52
    speaker: Zmei@prm.tenset.ru
    claim: Claims a 2046 Vory internecine war broke out after tzar Viktor Artrovskiy
      killed rival tzar Aleksandr Putorin, allowing Triads and Seoulpa Rings to consolidate
      territory during the next two years.
  - printed_page: 52
    speaker: Tangara@prm.tenset.ru
    claim: Says Yunggart smuggling revenue leads Byelmodin to tolerate that faction
      despite Kovalenka’s denunciations of trade with Siberians.
  - printed_page: 52
    speaker: Bogatyr@aspw.zsu.ru
    claim: Relays rumors that Kovalenka secretly disrupts Yunggart smuggling runs
      using anonymous reports to UGB Border Guards and MVD Interior Army; notes that
      Yunggart has accused her and she denies it.
  - printed_page: 52
    speaker: Bogatyr@aspw.zsu.ru
    claim: >-
      Bogatyr separately relays a suggestion that Brugar Yunggart may not be fully
      in control of his own faction, without presenting this rumor as established fact.
  - printed_page: 53
    speaker: Twang
    claim: Questions Beppu Data Haven’s disappearance and recalls it had never been
      very stable.
  - printed_page: 53
    speaker: Fastjack
    claim: Claims repeated crashes at Beppu Data Haven for roughly two years preceded
      a corporate strike team hitting its physical Beppu, Japan facility; describes
      the haven as less reliable than Denver Nexus, Singapore or the Hague.
  - printed_page: 53
    speaker: Trixter
    claim: Reports a rumor that the Beppu attack involved a joint megacorporate force
      because its principal sysop, described as a dwarf, was connected to a Terra
      First! crew.
  - printed_page: 53
    speaker: Kobo
    claim: Claims more than half of Beppu’s mainframes, servers and storage survived
      and were being moved by boat while their sysops sought a new location.
  - printed_page: 54
    speaker: Zmei@prm.tenset.ru
    claim: Argues the Vory are mostly disinterested in high-tech crime except the
      profitable BTL market, which the Seoulpa Rings fill as a specialty.
  - printed_page: 54
    speaker: Peri Stroika
    claim: Says Triad intermediaries clash with Brugar Yunggart’s faction, which runs
      some inland smuggling routes and prefers not to pay intermediaries.
  - printed_page: 54
    speaker: Zmei@prm.tenset.ru
    claim: Says the Yakuza are reconsidering their effort to establish themselves
      because rival syndicates and the Yamatetsu spotlight put pressure on them; this
      is the poster’s opinion.
  - printed_page: 54
    speaker: Chiun@wots.xna.ko
    claim: Disputes that the Yakuza are the Seoulpa Rings’ main problem; citing alleged
      police sources, says the Rings account for four of every five Yakuza operatives
      killed in Vladivostok and that they have offered services to the Vory against
      Yakuza members.
  - printed_page: 54
    speaker: Novichok@prm.tenset.ru
    claim: Says Yakuza opened an early foothold in the 1990s and were driven out after
      Vladivostok closed in 2009; speculates that present attempts reflect revenge,
      despite opposition from several competing factions.
  - printed_page: 54
    speaker: Tomashi@voks.zp.ru
    claim: Describes the kawaru-gumi as residents, often metahuman, who provide local
      municipal services and retain Yakuza cultural practices but try not to provoke
      the Vory; considers them distinct from conventional Japanese syndicates.
  - printed_page: 54
    speaker: Tomashi@voks.zp.ru
    claim: >-
      Tomashi adds that many kawaru-gumi metahumans from Japan had fled after
      goblinization: some were children of Yakuza members who underwent the change
      in adolescence or later and left Japan rather than face forced relocation to
      Yomi. Tomashi distinguishes those arrivals from the group's larger community
      of Japanese and non-Japanese resident metahumans recruited by the changed Yakuza.
  rules_review: Posts on printed pp52–54/PDF53–55 are fictional forum commentary.
    No quantified tabletop mechanics are printed in these posts.
