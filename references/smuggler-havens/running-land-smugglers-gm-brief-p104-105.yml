headline: 'FICTIONAL game sourcebook archival reference — Target: Smuggler Havens,
  FASA Corporation, FASA7215 (1998; Second Edition era), printed 104-105/PDF 105-106;
  Running Land Smugglers, Land vs Sea, Long Haul, Local Law, and Borders'
summary: 1998 FASA Corporation fictional Shadowrun tabletop-RPG publication, source
  FASA7215, printed 104-105/PDF 105-106; Running Land Smugglers, Land vs Sea, Long
  Haul, Local Law, and Borders. Historical game mechanics are recorded as published,
  or GM scenarios remain distinctly optional; no Shadowrun 3E conversion.
data:
  source_section: Game Information — Running Land Smugglers (beginning p104), continuing
    p105
  source_mode: Fictional tabletop game-master commentary and in-world generalizations,
    not real smuggling guidance; all events hypothetical.
  land_vs_sea:
    narrator_comparison: FASA sourcebook contrasts relatively routine and prearranged
      overland fantasy-campaign runs with more involved fictional sea-based piracy,
      retrieval and resale; source says the land-run pace depends on speed, schedule
      and avoiding trouble.
    genre_guidance: Gamemaster is urged to expand overland trips into adventures with
      local color and interpersonal complications rather than simple delivery chores.
    deal_and_risk_distinction: The fictional source narrator states that land-route
      delivery normally has a prearranged purchaser, whereas its maritime-piracy comparison
      describes obtaining cargo before identifying a buyer. It characterizes discretion,
      arrival on time and avoiding trouble as the land courier’s concerns; these are
      narrator generalizations, not game mechanics or real-world advice.
  the_long_haul:
    geographic_scope: Seattle-to-New Orleans fictional Shadowrun route through continental
      North America.
    travel_time_authorial_approximation: Source gives Seattle-to-Minneapolis as potentially
      a couple of days and Minneapolis-to-New Orleans another two or three, possibly
      faster for a rigger; descriptive scenario timings, not vehicle statistics.
    team_consequences: Characters’ errands, backgrounds, contacts, and disagreements
      may create side stories and delays at small towns.
    rigger_persona_generalization: The author describes fictional riggers as frequently
      protective of their vehicles and reluctant to let others drive, while traveling
      companions may seek stops for shopping, tourism or personal contacts. These
      are optional roleplaying hooks, not compulsory behavior or numeric rules.
  charisma_persona_and_bribes:
    fictional_world_observation: Local popularity, generosity, favors and the appearance
      of deference affect how fictional town residents react. The book attributes
      these views to a narrator and gives no game TN or fixed numeric modifier.
    gamemaster_framing: Use reactions of fictional residents, rumors, fear, generosity,
      and resentment to create interpersonal roleplaying. No real-world bribery advice
      is being supplied.
    small_town_distinctions: 'The narrator offers varied and contradictory fictional
      local reactions: hospitality, suspicion, opportunistic extortion, resentment,
      fear, or attempts to recruit outsiders; a person’s prior reputation and relations
      may matter. The book presents illustrative roleplaying possibilities, not standardized
      mechanics or endorsement.'
  the_law:
    reported_patterns: Fictional rural police may be motivated by local loyalties
      and reputation; some imagined authorities prefer fines, jail, and reparations
      to escalation; military responders sometimes intervene when fictional runs become
      violent.
    certainty: These are sourcebook scenario possibilities and colloquial broad claims,
      not universal factual rules or a license to evade legal action.
    source_distinctions_of_agency: The fictional narrator distinguishes some local
      officers who see themselves as protective and fair from petty despots and corrupt
      officers. Their responses may range from warnings, reparations, fines, brief
      detention and gossip to requests for support from larger security organizations.
      No universal procedure or fixed target number is specified.
    small_town_memory: The book describes some rural communities as remembering a
      visiting character’s public misconduct for years, irrespective of whether that
      character left the area. This is setting commentary and possible GM characterization,
      not an imposed consequence.
  the_borders:
    fictional_risk: The book describes stronger fictional military patrols and high
      danger at Sioux, Aztlan and Tir boundaries; other jurisdictions such as UCAS/CAS
      can be described as comparatively open, while Denver is described as exceptionally
      intrusive.
    gamemaster_discretion: Source explicitly says the GM controls response level and
      narrative outcomes; no exact Security Rating or legal multiplier given on these
      pages.
    source_assessment: The book warns that the characters’ choice of fictional borders,
      statuses, and publicity affects consequences; presented as literary/gameplay
      characterization, not actual operating advice.
    heaviest_named_patrols:
    - Sioux Nation
    - Aztlan
    - Tir Tairngire
    occasional_deliberate_non_interception_claim: The source narrator alleges that
      fictional border forces sometimes permit an individual passage to cultivate
      a mistaken perception of weakness before a broader later crackdown. This is
      an occasional in-world claim, not a guaranteed result, a roll modifier, or advice.
    sin_status_and_personhood: The source contrasts comparatively open UCAS/CAS borders
      with the fictional legal jeopardy of a person lacking a System Identification
      Number (SIN). The book characterizes such an individual as legally nonexistent
      and vulnerable to abuse, including experimental restraint devices. This is the
      source’s fictional legal-world characterization, not a real-world legal statement
      or a universal game-rule test.
    denver_jurisdictional_distinctions: For Denver, the book distinguishes obtaining
      the correct travel papers at official checkpoints, suspicious border guards,
      and crossing between different sectors. It describes a conditional possibility
      of conflict between pursuing authorities and guards in a neighboring sector;
      it expressly also allows the latter to stop, detain, or ignore the travelers
      rather than automatically helping them.
  publication: 'Target: Smuggler Havens, FASA Corporation (1998), FASA7215, Shadowrun
    Second Edition-era, printed pp104–105/PDF105–106.'
  source_review_note: Independent original-page review of FASA7215 printed pp104-105
    (physical PDF105-106), 29 October 2026, restored source narrator generalizations,
    occasional claims, SIN-status distinction and Denver jurisdictional contingency.
    Existing scenario travel-time approximations retained; no real-world guidance
    or SR3 conversion.
