data:
  source_section: Game Information — Running Land Smugglers (beginning p104), continuing p105
  source_mode: Fictional tabletop game-master commentary and in-world generalizations, not real
    smuggling guidance; all events hypothetical.
  land_vs_sea:
    narrator_comparison: FASA sourcebook contrasts relatively routine and prearranged overland fantasy-campaign
      runs with more involved fictional sea-based piracy, retrieval and resale; source says the
      land-run pace depends on speed, schedule and avoiding trouble.
    genre_guidance: Gamemaster is urged to expand overland trips into adventures with local color
      and interpersonal complications rather than simple delivery chores.
  the_long_haul:
    geographic_scope: Seattle-to-New Orleans fictional Shadowrun route through continental North
      America.
    travel_time_authorial_approximation: Source gives Seattle-to-Minneapolis as potentially a couple
      of days and Minneapolis-to-New Orleans another two or three, possibly faster for a rigger;
      descriptive scenario timings, not vehicle statistics.
    team_consequences: Characters’ errands, backgrounds, contacts, and disagreements may create
      side stories and delays at small towns.
  charisma_persona_and_bribes:
    fictional_world_observation: Local popularity, generosity, favors and the appearance of deference
      affect how fictional town residents react. The book attributes these views to a narrator and
      gives no game TN or fixed numeric modifier.
    gamemaster_framing: Use reactions of fictional residents, rumors, fear, generosity, and resentment
      to create interpersonal roleplaying. No real-world bribery advice is being supplied.
  the_law:
    reported_patterns: Fictional rural police may be motivated by local loyalties and reputation;
      some imagined authorities prefer fines, jail, and reparations to escalation; military responders
      sometimes intervene when fictional runs become violent.
    certainty: These are sourcebook scenario possibilities and colloquial broad claims, not universal
      factual rules or a license to evade legal action.
  the_borders:
    fictional_risk: The book describes stronger fictional military patrols and high danger at Sioux,
      Aztlan and Tir boundaries; other jurisdictions such as UCAS/CAS can be described as comparatively
      open, while Denver is described as exceptionally intrusive.
    gamemaster_discretion: Source explicitly says the GM controls response level and narrative outcomes;
      no exact Security Rating or legal multiplier given on these pages.
    source_assessment: The book warns that the characters’ choice of fictional borders, statuses,
      and publicity affects consequences; presented as literary/gameplay characterization, not actual
      operating advice.
  publication: 'Target: Smuggler Havens, FASA Corporation (1998), FASA7215, Shadowrun Second Edition-era,
    printed pp104–105/PDF105–106.'
