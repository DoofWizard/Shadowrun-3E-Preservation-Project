data:
  source_section: Game Information — Undersea Adventure Ideas; two fictional optional game-master
    scenarios
  source_status: Story options for GMs and fictional-world plots, not real historical incidents
    or guides to illegal activity.
  hook_me_up:
    starting_page: 103
    fictional_employer: Mitsuhama offshore installation (MCT), with a hired crew that acts under
      cover of scheduled tech work.
    setup: An offshore operation temporarily restores power and Matrix links to an abandoned connected
      rig; gamemaster describes an aerial transfer to a rendezvous and transfer aboard underwater
      Mitsuhama sleds.
    task: Player characters keep corporate security from noticing the technicians while the technicians
      analyze an installation; the team does not perform the installation work.
    twist: Merrow living beneath the facility accuse the team of poisoning or causing the death
      of merrow members. Investigation finds a forgotten research section containing toxic research
      containers, one of which was damaged; merrow threaten to prevent the team leaving until the
      spill is addressed.
    possible_consequences: A clean-up response, approaching corporations, and Save Our Seas may
      complicate matters. These are proposed in-fiction consequences, not verified real events.
    agency_and_causation: The merrow accusation does not establish runners intentionally poisoned
      the site; the adventure reveals accidental damage to old research material.
  back_door:
    starting_page: 104
    scenario: An anonymous Johnson recruits characters to enter a Proteus AG undersea arcoblock
      from its automated supply submarine, inspect experimental domes and obtain research details.
    fictional_institutional_facts: The optional scenario describes a company allegedly subjecting
      unwilling metahuman victims to medical experimentation on radiation, vacuum, decompression,
      cold, cyberware/augmentation and crossbreeding. These abuses are fictional allegations within
      the adventure; the victims are not volunteers and consent is not implied.
    conflict: Security drones, sub inspections, and corporate security create obstacles in the imagined
      adventure, while Green Cells activists demand data acquired from the project.
    distinct_agency: The hired runners are investigators/operatives. The captive experimental subjects
      are unwilling victims; the Green Cells are a separate activist group and may threaten coercive
      retaliation if denied information.
  historical_provenance: 'FASA Corporation, Target: Smuggler Havens (FASA7215, 1998), printed pp103–104/PDF104–105;
    historical Shadowrun Second Edition-era campaign scenarios.'
