headline: 'FICTIONAL Shadowrun tabletop RPG archival record — FASA Corporation, Target:
  Smuggler Havens (FASA7215, 1998, Second Edition era), printed pp103–104/PDF104–105:
  Hook Me Up and Back Door GM scenarios'
summary: 'Source-reviewed fictional tabletop GM scenario record from FASA Corporation''s
  Target: Smuggler Havens (FASA7215, 1998, historical Second Edition), printed pp103–104/PDF104–105.
  Maintains named craft and places, distinct merrow accident causation, anonymous-client
  intermediary, captive victims'' lack of consent, and conditional Green Cells threats;
  no SR3 conversion.'
data:
  source_section: Game Information — Undersea Adventure Ideas; two fictional optional
    game-master scenarios
  source_status: Story options for GMs and fictional-world plots, not real historical
    incidents or guides to illegal activity.
  hook_me_up:
    starting_page: 103
    fictional_employer: Mitsuhama offshore installation (MCT), with a hired crew that
      acts under cover of scheduled tech work.
    setup: An offshore operation temporarily restores power and Matrix links to an
      abandoned connected rig; gamemaster describes an aerial transfer to a rendezvous
      and transfer aboard underwater Mitsuhama sleds.
    task: Player characters keep corporate security from noticing the technicians
      while the technicians analyze an installation; the team does not perform the
      installation work.
    twist: Merrow beneath the facility accuse the team of poisoning their home and
      causing multiple merrow deaths. The GM reveals a forgotten underwater research
      living module with toxic materials in liquid and gaseous form; an exploring
      merrow, not one of the runners, accidentally breached an old container. The
      merrow demand that the characters halt the leak and secure the module before
      leaving.
    possible_consequences: A clean-up response, approaching corporations, and Save
      Our Seas may complicate matters. These are proposed in-fiction consequences,
      not verified real events.
    agency_and_causation: The merrow accusation does not establish runners intentionally
      poisoned the site; the adventure reveals accidental damage to old research material.
    named_underwater_craft_and_lineage: The optional scenario calls the transport
      Mitsuhama Anago underwater sleds and cites Cyberpirates printed p178; the title
      is preserved as historical edition-specific equipment identification, not a
      new stat block.
    installation_configuration: The abandoned rig has an above-water component attached
      to an ocean-floor framework by a complex support structure; the hired technicians
      temporarily restart power and Matrix communications to the retired site. The
      player characters protect their work while the technicians conduct the analysis.
    merrow_causation_and_agency: The scenario explicitly identifies an exploring merrow
      as having accidentally damaged a container in the abandoned underwater research
      living module, releasing material into the sea. Merrow blame the runners for
      deaths among their people, but the accident is not attributed to the runners.
      The merrow demand that the leak be stopped and the living module secured before
      they allow the group to leave.
    conditional_external_complication: The text says that if the characters fail to
      notify Mitsuhama of cleanup needs and word spreads, the fictional Save Our Seas
      organization may learn of the incident and intervene; this consequence is conditional.
  back_door:
    starting_page: 104
    scenario: A reputable fixer representing an anonymous Johnson asks the players
      to travel through an automated supply submarine to a fictional Proteus AG underwater
      arcoblock, examine lower research domes and return with project information;
      the story is optional and does not narrate a completed operation.
    fictional_institutional_facts: The optional scenario describes a company allegedly
      subjecting unwilling metahuman victims to medical experimentation on radiation,
      vacuum, decompression, cold, cyberware/augmentation and crossbreeding. These
      abuses are fictional allegations within the adventure; the victims are not volunteers
      and consent is not implied.
    conflict: Security drones, sub inspections, and corporate security create obstacles
      in the imagined adventure, while Green Cells activists demand data acquired
      from the project.
    distinct_agency: The hired runners are investigators/operatives. The captive experimental
      subjects are unwilling victims; the Green Cells are a separate activist group
      and may threaten coercive retaliation if denied information.
    speaker_correction: The published GM scenario says a reputable fixer representing
      an anonymous client approaches the runners; the unknown Johnson does not directly
      recruit them in the narrated setup.
    site_and_infiltration_context: The optional site is a Proteus AG facility in fictional
      Bremen. A previous Draco Foundation inspection exposed a possible route using
      an automated supply sub. The brief asks for information on the undersea project's
      structure, power, sustainability, funding and especially its research facilities;
      Proteus inspects incoming submarines at both ends.
    involuntary_subjects_and_factual_specificity: The scenario describes a dozen comatose
      metahuman subjects, drugged and fitted with skill slots for experimentation.
      The text explicitly calls them unwilling victims. Research examples include
      claimed immunization to radiation, vacuum and depressurization, and extreme
      cold; proposed cyberware for air tanks, bone replacement and magnetic limbs;
      and research into crossbreeding metahumans or duplicating paranormal-animal
      abilities. These are fictional abuses alleged by the source scenario, not real-world
      or proven medical results.
    green_cells_interception_and_conditions: On the team's way back to a Bremen meeting
      with the Johnson, Green Cells representatives say they learned of the run through
      a Draco Foundation contact and seek the retrieved information. They may buy
      or trade for it, but threaten nonlethal coercive force, including magic and
      the named game setting devices tasers and squirt weapons, if the runners refuse.
      The conflict is optional GM material, not an actual confrontation or consent
      by the captive subjects.
    fictional_inspection_and_corporate_interest: The narrator says Proteus AG drew
      closer attention from other corporations after its attempt to claim Dunkelzahn's
      prize; the Draco Foundation learned about the undersea site during a tour. These
      are claims in an optional story premise.
  historical_provenance: 'FASA Corporation, Target: Smuggler Havens (FASA7215, 1998),
    printed pp103–104/PDF104–105; historical Shadowrun Second Edition-era campaign
    scenarios.'
