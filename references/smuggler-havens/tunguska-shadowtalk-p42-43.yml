data:
  context: The following are distinct, fictional Shadowtalk speakers’ comments on
    the Tunguska region in FASA7215; conspiracy theories, jokes and autobiographical
    claims are never promoted into established historical facts.
  posts:
  - printed_page: 42
    speaker: Roswell
    claim: Argues the Tunguska explosion must have been nuclear, claiming its energy
      was five megatons. This conflicts with the narrator’s over-forty-megaton description
      and is framed as Roswell’s speculation.
  - printed_page: 42
    speaker: Skeptic
    claim: Counters Roswell by pointing out that the incident took place in 1908 before
      nuclear fission technology was available.
  - printed_page: 42
    speaker: Roswell
    claim: Replies by asking who said the explosion came from a Russian nuclear weapon.
  - printed_page: 42
    speaker: Hubble
    claim: 'Reports what he calls the scientific best-guess hypothesis: an asteroid
      or comet fragmented in an airburst over Tunguska, after which its core split
      into four bodies that impacted Earth. Hubble also attributes unusual subsequent
      biomass growth, mutations along the object’s trajectory and magnetic-field disturbances
      to the event; these are his in-world reported investigations, not established
      narrator facts or game mechanics.'
  - printed_page: 42
    speaker: The Laughing Man
    claim: Jokes that an attempt to redirect the celestial object into orbit went
      wrong rather than a deliberate drop toward Earth.
  - printed_page: 42
    speaker: Orange Queen
    claim: Responds to the Laughing Man with a dismissive joke about the incident
      almost waking her from a nap.
  - printed_page: 43
    speaker: Miner 2049er
    claim: Reacting to possible orichalcum deposits, asks excitedly how to get to
      Tunguska.
  - printed_page: 43
    speaker: Nerpa@irk.tenset.ru
    claim: Tells Miner 2049er that Tunguska is roughly an 1,100-kilometre journey
      north of Irkutsk, with no ordinary roads or trails, and in the fictional setting
      is situated amid the Siberian–Russian conflict and Awakened Siberian predators.
      This is a named in-world commenter’s caution, not current travel guidance or
      a route procedure.
  - printed_page: 43
    speaker: Polecat
    claim: Disputes the ore story, claiming the Russian UGB deliberately circulates
      it to divert smugglers and Siberians from other operations. No verification
      of this motive is supplied.
  rules_review: No formal blast, magical-material pricing, mining, travel, or combat
    mechanics are stated in these comments; numerical claims are attributed in-world
    historical or geographic assertions.
