data:
  source_context: 'Named in-world forum commentary accompanying Ports of Call in FASA
    Corporation, Target: Smuggler Havens (FASA7215, copyright 1998), historical Shadowrun
    Second Edition-era tabletop sourcebook, printed pp60–61/PDF61–62. All allegations,
    opinions and second-hand stories are explicitly ascribed to their fictional posters.'
  posts:
  - printed_page: 60
    speaker: Yongmang@pu.pakchung.ko
    claim: Argues Korean pirates near Pusan are patriotic and tend to raid Japanese
      and Chinese vessels rather than Korean vessels, partly because Japan–Korea historical
      grievances shape preferences.
  - printed_page: 60
    speaker: Blowfish
    claim: Claims Japanese crews around Tsushima frequently target Korean ships, and
      advances a speculative allegation that Korean naval authorities tacitly tolerate
      Korean pirates countering the Japanese crews to avoid direct international disputes.
  - printed_page: 60
    speaker: Yang
    claim: >-
      Claims that pirates operating near Pusan have strong ties to Korean Seoulpa
      Rings, naming the Kohung and Saegu Rings. Says Paksona leads the Saegu Ring
      with at least 145 Koreans, possibly twice that number, and attributes organized
      pirate-smuggling operations, extensive use of drones, skilled deckers and
      practical control of Pusan LTG to that Ring.
  - printed_page: 60
    speaker: Byeong-suk@wo.sunpak.ko
    claim: Describes ruined quarters of postwar Wonsan and says destroyed buildings
      and artillery damage remain decades after the conflict.
  - printed_page: 61
    speaker: Scissor Girl
    claim: Warns Japanese men against Wonsan brothels, citing residual hostility from
      the Japanese occupation of Korea. This is an in-world claim about adult sex-work
      establishments and historical resentment, not a generalization about real Korean
      women.
  - printed_page: 61
    speaker: Scavenger
    claim: >-
      Alleges Wonsan's black market sells Siberian critter parts, Manchurian telesma,
      Japanese military technology, Philippine biotechnology, Malaysian cyberdecks,
      Korean paydata and Tibetan prayer fans. Hyperbolically warns that purchasers
      have to kill a half dozen goons who try to rob them, calling the market out of
      control; this remains speaker testimony, not established game-world transaction
      mechanics.
  - printed_page: 61
    speaker: Kyungsang@pyo.sunpak.ko
    claim: Claims Wonsan pirate groups attack Korean shipping as well as Japanese
      and Russian shipping, unlike the purportedly more nationalistic Pusan crews.
  - printed_page: 61
    speaker: Blowfish
    claim: Alleges Japanese corporations pay Wonsan maritime crews to attack Korean
      commercial rivals or underwater projects, and portrays those pirates as unusually
      ruthless.
  - printed_page: 61
    speaker: Chiun@wots.xna.ko
    claim: Says some Ch’ongjin crews ship Manchurian magical goods to Vladivostok
      and Petropavlovsk and that Seattle Triads create a market for bootleg magical
      goods; offers an explanation for why Russian crews are less involved.
  - printed_page: 61
    speaker: The Flying Canadian
    claim: Claims Ch’ongjin pirates often operate independently of Seoulpa Rings syndicates,
      hiding from them when pressured and returning after enforcement pressure subsides.
  - printed_page: 61
    speaker: Chorlin Zoombatta@chj.awns.ne.ko
    claim: >-
      Reports that Ch'ongjin smugglers and some Wonsan pirates primarily use
      submarines and minisubs retained from the previous communist regime. He says
      that regime used submarines to insert commandos behind the lines in South Korea
      and Japan, and that many vessels became available after North Korea fell.
  - printed_page: 61
    speaker: Mancuso
    claim: >-
      Claims that submerged vessels are hard for other submarines to detect and
      nearly impossible for surface ships to find. Because the IJN dominates the
      fictional Sea of Japan, Mancuso considers submarines the only way local
      smugglers and pirates obtain substantial freedom of movement; no numeric
      detection modifier is stated.
  rules_review: Posts contain no explicit Shadowrun rolls, submarine performance tables
    or target-number modifiers; speaker claims are not converted into game mechanics.
