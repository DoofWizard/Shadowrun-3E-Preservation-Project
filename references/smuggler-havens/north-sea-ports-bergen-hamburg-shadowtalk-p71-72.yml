data:
  source_context: 'Fictional Shadowrun tabletop RPG source from FASA Corporation,
    Target: Smuggler Havens (FASA7215, 1998), historical Second Edition-era; source.fasa-7215.
    Printed pp71-72/PDF pp72-73. Narrative assertions and named Shadowtalk posts are
    separate.'
  posts:
  - page: 71
    speaker: Dread Pirate Roberts
    claim: Reports signs of non-pirate inhabitants in Bergen fjords, including small
      fishing canoes and abramon-lobster traps, speculating that a reclusive dwarf
      settlement may live there.
  - page: 71
    speaker: Jacques
    claim: Claims Green Cells receive assistance from shapeshifters near Bergen; alleges
      AG Chemie and other companies have experienced each-uige-related attacks.
  - page: 71
    speaker: Boris
    claim: Claims the Russian Vory v Zakone have a foothold in Bergen, supply outlaw
      petroleum trade and have infiltrated the private police firm Wolverine Security.
  - page: 71
    speaker: Roland von Bremen
    claim: Reports Klabauterbund squats in Hamburg, some functioning as cafes, bars
      or social centers.
  - page: 71
    speaker: Mork
    claim: Warns that Nationale Aktion militants attack some squats and metahuman/anarchist
      meeting places; describes clashes with occupants and Knight Errant.
  - page: 71
    speaker: Fahrenheit
    claim: Alleges Jyhad X members and allied street groups operate in Hamburg drug
      markets and target opponents; maintains the allegation as the named speaker's
      claim.
  - page: 71
    speaker: Boris
    claim: Describes a Vory-versus-Jyhad clash with several dozen civilian casualties
      and suggests Orthodox Church involvement, expressed as a possibility rather
      than a narrator fact.
  - page: 72
    speaker: Dom
    claim: Speculates about religious escalation involving a creator-idol worshipper
      and a possible Second Coming; no event is established.
  - page: 72
    speaker: Shockwave Sie
    claim: Claims the Yakuza remains a dominant Hamburg syndicate but faces competition
      and that a feminist group known as Die Sie torched proposed bunraku brothels;
      says the Yakuza leadership may retaliate. This is attributed in-world commentary,
      not narrator-confirmed action.
  - page: 72
    speaker: Austen
    claim: Claims the Klabauterbund controls the Hamburg underground clean-water trade,
      perhaps through corporate ties or purification.
  - page: 72
    speaker: Roland von Bremen
    claim: Replies that a company named WasserKraft, partly Fuchi-owned, is responsible;
      says Klabauterbund supporters have influence through Dieter Arkona's major shareholding
      and speculates about pressure on Arkona.
  - page: 72
    speaker: Caramon
    claim: Claims islands belonging to the elven Duchy of Pomorya west of Hamburg
      provide havens for pirate and ecological activists; names Duke Jaromar Greif
      in Saßnitz and praises efforts to clean polluted coasts.
  attribution_guard: Hate-group ideology, criminal allegations, arson, casualties,
    and purported corporate control are not converted from Shadowtalk into established
    narrator facts.
