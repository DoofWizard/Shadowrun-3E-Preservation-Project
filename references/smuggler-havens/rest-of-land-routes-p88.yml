headline: 'FICTIONAL tabletop-RPG archive — FASA Corporation, Target: Smuggler Havens
  (FASA7215, 1998, Shadowrun Second Edition-era), printed p88/PDF p89: The Rest of
  the Routes — five named branches'
summary: Published fictional Shadowrun sourcebook reference for The Rest of the Routes
  — five named branches, printed p88/PDF p89, FASA Corporation, 1998 (FASA7215; historical
  Second Edition era). Statements attributed to Yeager are in-world claims, not real-world
  instructions or automatically omniscient setting facts.
data:
  section: The Rest of the Routes
  narrative_voice: Yeager’s in-world annotated list; routes are fictional Shadowrun
    setting claims, not current border or logistics advice.
  branches:
  - name: The Twister
    region: Texas
    described_specialization: Yeager describes a guns and firearms-trade corridor;
      he contrasts old Chicago/Detroit sources with subsequent Caribbean League supply
      through St. Louis.
  - name: The Daisy Eater
    region: Seattle and Tir Tairngire
    described_specialization: Yeager recounts land-based movement near North Bend
      and Coos Bay becoming constrained after the Tir border was closed. He distinguishes
      sea-port methods from occasional remaining land access and reports that the
      Ancients gang may retain contacts.
  - name: Highway 1
    region: East Coast urban corridor, described with Cleveland and Atlanta as endpoints
    described_specialization: Yeager depicts a long-standing Mafia-associated transport
      network spanning various cities. He distinguishes his claims about Detroit weapons,
      New York miscellaneous goods, Boston people and information, Atlanta chips and
      cyberware, and southern ports carrying drugs, Caribbean alcohol and telesma.
      The bare category “people” does not establish their consent or coercion.
  - name: Water Sports
    region: California Free State and coastal ports
    described_specialization: Yeager says California traffic is mainly by water and
      describes circulation among Los Angeles, Las Vegas, Denver, Tir, and Seattle.
      He asserts that Yakuza organizations dominate the San Francisco/Bay Area market;
      this remains his in-world claim.
  - name: The Pipeline
    region: Seattle toward Tsimshian, formerly called Alaska
    described_specialization: Yeager reports a northbound exchange of luxury goods,
      electronics and food, and a return flow involving metals, pelts, telesma and
      other local products; he mentions oil and fish exports in the region.
  no_new_mechanics: No dice tests, new item stat blocks, prices, damage codes, Availability,
    legality, or game-specific modifiers appear in the source list on printed p88.
