data:
  heading: Running in New Orleans
  classification: Optional fictional tabletop game-master setting guidance and scenario prompts, not real-world
    directions.
  the_opposition:
  - The sourcebook portrays major familiar megacorporations as relatively small local presences, with petrochemical
    and entertainment concerns providing additional corporate interests; visiting executives may supply optional
    campaign hooks.
  - The narrated setting includes Mafia groups, the Zobop, Mardi Gras krewes, corporate figures and government
    agents; the game master may select among these as fictional employers or opposition in scenarios.
  - The Underworld Sourcebook and Mob War! adventure are given as optional genre/campaign inspirations; the book
    directs magical campaign designers to its Smoke and Mirrors section (printed p24) and Shadowrun Companion
    p119.
  - Optional magical encounters may involve houngans, ghosts, vampires, ghouls, insect shamans and bayou critters;
    these are fictional creatures and story hooks.
  the_environment:
  - New Orleans has humid, hot summers; rain and damp seasons may affect fictional characters wearing heavy armor/coats
    and vulnerable gear including cyberdecks and electronics.
  - Festivals and common local voudoun practice are linked to variable astral background count (separately preserved
    as exact rules).
  - Spirits and awakened swamp creatures may be included in fiction, using creatures sourced from Paranormal Animals
    and Predator & Prey rather than ungrounded new statistics.
  source_cross_references:
  - Underworld Sourcebook
  - Mob War!
  - Shadowrun Companion (printed p119)
  - Smoke and Mirrors (printed p24)
  - Paranormal Animals
  - Predator & Prey
