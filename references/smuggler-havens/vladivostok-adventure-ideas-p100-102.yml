headline: 'FICTIONAL tabletop-RPG archival source correction — FASA Corporation, Target:
  Smuggler Havens (FASA7215, 1998, Second Edition era), printed pp100–102/PDF101–103:
  optional Vladivostok scenarios, source certainty and agency'
summary: 'Source-reviewed FASA Corporation fictional Shadowrun game-master scenarios
  in Target: Smuggler Havens (FASA7215, 1998; historical Second Edition), printed
  pp100–102/PDF101–103. Distinguishes a rumored ship sinking from the narrator’s anchored-vessel
  account, undercover UGB coercion, possessed characters’ agency, and optional outcomes;
  no Third Edition conversion.'
data:
  section: Game Information — Vladivostok Adventure Ideas
  source_mode: Explicit optional scenarios for a gamemaster, not established historical
    events or real-world instructions.
  here_kitty_kitty:
    starts_printed_page: 100
    scenario: Vladivostok talisleggers hire player characters to accompany a five-day
      Siberian telesma-gathering expedition; an apparently harmless old woman is described
      in the scenario as a baba yaga who attempts to lure isolated victims. Two purported
      talisleggers are undercover UGB operatives who use the expedition to gather
      information about smuggling and to abduct a Siberian tiger shapeshifter for
      interrogation and experiments.
    sequence_and_agency: On day four the two operatives set an ambush; alerting the
      tiger enables escape; later a pack of wolf shapeshifters threatens the group
      and may sabotage its vehicles. The abducted shapeshifter is not a consenting
      participant, and internal group dissent complicates escape.
    old_woman_hazard_and_agency: In the optional fictional scenario, an apparently
      harmless cloaked old woman is a baba yaga that attempts to isolate and kill
      party members to eat them. The runners can notice her recurring appearances
      and choose how to respond; the source does not establish that she necessarily
      succeeds.
    UGB_operatives_actual_purpose: The two talisleggers are disguised UGB operatives;
      their assignment is both to collect information about regional smuggling and
      kidnap a Siberian tiger shapeshifter for involuntary questioning and experimentation.
      The fictional UGB suspect Siberians are using shapeshifters as spies and saboteurs.
      The tiger is alerted by the players approaching the site, so the planned capture
      may fail.
  toxic_dreams:
    starts_printed_page: 100
    setting: Docks in Vladivostok, Petropavlovsk, or another fictional regional port.
      A damaged small vessel arrives, a mortally injured dwarf hands over a GPS device
      and dies.
    named_parties:
    - Ajax (dwarf smuggler)
    - Micronaut (vessel)
    - MVD (fictional authority)
    - UGB (fictional authority)
    reports_and_allegations: Rumors identify Ajax as member of the Micronaut’s crew.
      Its recently planned Seattle voyage, the cargo’s nature, and claims of sinking
      by Russian/Japanese navy are **rumors**, not confirmed story facts.
    in_world_cause: The Micronaut hid from naval patrol near toxic Rudnaya Pristan;
      a toxic water spirit used Desire Reflection and Influence on the crew, leading
      to conflict over imagined loot. One remaining dwarf crew member has an imposed
      hallucination/conviction about flesh-form bug spirits, while the spirit escalates
      divisions.
    potential_interested_parties: MVD and UGB are fictional authorities; Ajax’s friends,
      opportunists, rivals and other parties seek the GPS coordinates. The game master
      may have the runners locate the listing ship at anchor near Rudnaya Pristan,
      not a confirmed sunken wreck.
    ship_not_sunk_narrator_fact: Although port gossip alleges that the vessel Micronaut
      was attacked and sunk by the Russian or Japanese navy, the optional scenario
      establishes that the ship is still anchored, listing slightly, in toxic Rudnaya
      Pristan. The crew had hidden there from a naval patrol. Gossip about a wreck
      must not be treated as a confirmed sinking.
    MVD_response_and_disputed_testimony: If runners remain at the docks after the
      dying dwarf Ajax gives them his GPS, MVD officers arrive for questioning; if
      they depart quickly, people seek the coordinates. Ajax begins to describe an
      attack and sinking but cannot finish his account before dying, which does not
      establish his claim as true.
    survivor_and_spirit_control: One dwarf crew member, a woman, remains aboard. The
      narrator says a toxic water spirit used Desire Reflection and Influence to turn
      crew members against one another over nonexistent loot. The survivor is influenced
      to perceive newcomers as flesh-form bug spirits, which she fears. Other interested
      parties may reach the location later.
  knock_knock_land_shark:
    starts_printed_page: 101
    setup: A kawaru-gumi (metahuman Yakuza) agent hires the player characters to find
      a missing large troll associate; a Vory gang claims the troll assaulted a gambling
      den and attempted to assassinate fictional tsarina Kovalenka.
    hidden_cause: In the optional scenario a Yakuza Shark shaman cast a possession
      spell on the troll and manipulates soldiers in opposing syndicates to trigger
      violence between Vory and kawaru-gumi.
    continuation: A rigged restaurant meeting is attacked by a heavy truck carrying
      flammable material; the Vory driver was briefly possessed.
    investigative_clue: A person under possession can abruptly enter a frenzied combat
      state, collapse, then awaken unable to recall events. These are fictional magic
      rules and GM story cues, not a real-world diagnosis.
    contested_identity_and_agency: The fictional kawaru-gumi soldier describes his
      missing partner as a large troll of Japanese origin. Vory members allege the
      troll harmed a gambling establishment and tried to kill their fictional tsarina;
      the source scenario reveals that a Yakuza Shark shaman had possessed the troll.
      The allegations are not evidence of the troll’s voluntary intent.
    escalation_and_testimony_clue: A Yakuza Shark shaman uses possessions of soldiers
      to foster conflict among Vory, kawaru-gumi, Triads and Seoulpa Rings. While
      runners meet the kawaru-gumi oyabun at a restaurant, a heavy truck carrying
      flammable material crashes into the building; the Vory driver was temporarily
      possessed and the magician disengaged at the last moment. A witness may identify
      the spellcaster’s pattern when a previously possessed person enters a sudden
      rage, loses consciousness, and later recalls nothing.
  publication_and_pages: 'FASA Corporation, Target: Smuggler Havens (FASA7215, 1998),
    printed pp100–102/PDF101–103; optional GM scenarios; historical Second Edition
    setting.'
