data:
  section: Game Information — Vladivostok Adventure Ideas
  source_mode: Explicit optional scenarios for a gamemaster, not established historical events
    or real-world instructions.
  here_kitty_kitty:
    starts_printed_page: 100
    scenario: Vladivostok talisleggers hire player characters to accompany a five-day Siberian
      telesma-gathering expedition; an apparently harmless old woman is described in the scenario
      as a baba yaga who attempts to lure isolated victims. Two purported talisleggers are undercover
      UGB operatives who use the expedition to gather information about smuggling and to abduct
      a Siberian tiger shapeshifter for interrogation and experiments.
    sequence_and_agency: On day four the two operatives set an ambush; alerting the tiger enables
      escape; later a pack of wolf shapeshifters threatens the group and may sabotage its vehicles.
      The abducted shapeshifter is not a consenting participant, and internal group dissent complicates
      escape.
  toxic_dreams:
    starts_printed_page: 100
    setting: Docks in Vladivostok, Petropavlovsk, or another fictional regional port. A damaged
      small vessel arrives, a mortally injured dwarf hands over a GPS device and dies.
    named_parties:
    - Ajax (dwarf smuggler)
    - Micronaut (vessel)
    - MVD (fictional authority)
    - UGB (fictional authority)
    reports_and_allegations: Rumors identify Ajax as member of the Micronaut’s crew. Its recently
      planned Seattle voyage, the cargo’s nature, and claims of sinking by Russian/Japanese navy
      are **rumors**, not confirmed story facts.
    in_world_cause: The Micronaut hid from naval patrol near toxic Rudnaya Pristan; a toxic water
      spirit used Desire Reflection and Influence on the crew, leading to conflict over imagined
      loot. One remaining dwarf crew member has an imposed hallucination/conviction about flesh-form
      bug spirits, while the spirit escalates divisions.
    potential_interested_parties: Fictional authorities MVD and UGB, friends of Ajax, opportunists
      and other factions seek the GPS coordinates. The scenario anticipates that player characters
      may pursue the wreck.
  knock_knock_land_shark:
    starts_printed_page: 101
    setup: A kawaru-gumi (metahuman Yakuza) agent hires the player characters to find a missing
      large troll associate; a Vory gang claims the troll assaulted a gambling den and attempted
      to assassinate fictional tsarina Kovalenka.
    hidden_cause: In the optional scenario a Yakuza Shark shaman cast a possession spell on the
      troll and manipulates soldiers in opposing syndicates to trigger violence between Vory and
      kawaru-gumi.
    continuation: A rigged restaurant meeting is attacked by a heavy truck carrying flammable
      material; the Vory driver was briefly possessed.
    investigative_clue: A person under possession can abruptly enter a frenzied combat state,
      collapse, then awaken unable to recall events. These are fictional magic rules and GM story
      cues, not a real-world diagnosis.
  publication_and_pages: 'FASA Corporation, Target: Smuggler Havens (FASA7215, 1998), printed
    pp100–102/PDF101–103; optional GM scenarios; historical Second Edition setting.'
