headline: 'Fictional Shadowrun tabletop-RPG historical account — FASA Corporation,
  Target: Smuggler Havens (FASA7215, 1998, Second Edition-era), printed pp82–83/PDF83–84:
  Yeager’s Ares Screw route'
summary: 'Source-attributed record for the Ares Screw, formerly the French Connection,
  in FASA Corporation’s Target: Smuggler Havens (FASA7215, 1998, historical Second
  Edition-era), printed pp82–83/PDF83–84. Yeager’s claims about actors and fictional
  border conditions remain attributed.'
data:
  speaker: Yeager, the in-world route narrator introduced on printed p79
  route_name: The Ares Screw
  former_name: The French Connection
  route_description: In Yeager’s account this branch leads from Minneapolis through
    Green Bay to Detroit, with water or road variants around the Great Lakes, and
    extends via Toronto, Ottawa and Massena near the St. Lawrence border across from
    Cornwall.
  organizations_and_places: Yeager describes Massena as Mafia-controlled with vice
    and gambling businesses, and presents the Québec border and Montréal area as significant
    institutions and markets in this invented setting.
  named_contacts: He mentions the Québec facility Haven, reported as a stop for equipment
    or contacts; a Québec RTG contact he calls LaLuxe; and the Detroit Don Roland,
    nicknamed The Greek, whom he links to Mafia properties in Toronto and Ottawa.
    Their existence and roles are recorded as Yeager’s assertions.
  goods: The described fictional market includes Ares weapons, low-end electronics
    and Matrix programs, chips, drugs, exotic entertainment, telesma, critters, European
    merchandise and corporate items. He also mentions a demand associated with Cross
    Technology and extraction operations; no claim of consent is implied in forced
    or illicit activities.
  difficulty: Yeager claims that Québec border officials respond harshly to unauthorized
    crossing, that Mafia and other organized operators influence trade, and that different
    portions of the Great Lakes corridor have different risk levels.
  terrain: The account distinguishes road, Great Lakes water and St. Lawrence approaches,
    with rougher inland areas and hazardous water conditions in some seasons.
  vehicles: He compares road vehicles, hovercraft and boats as fictional transit categories
    and says t-birds tend to attract attention. He also associates water traffic near
    Québec with frequent inspections.
  named_operators: The account attributes control over important traffic to Detroit
    Mafia families; it contrasts their power with smaller independents and references
    rivalry involving Knight and Cross.
  opposition: Yeager lists Great Lakes pirates, Québec border patrols,
    competing Mafia-related crews, Ares-hired independents, and UCAS and Québec
    enforcement as fictional threats. He describes Québec Seaway border patrol
    craft as European-produced variants of the GMC Riverine and a hovertruck
    resembling Lone Star's Swooptruck. For land patrols he names the Appaloosa
    Light Scout and Chrysler Nissan Patrol-1, and he says military response may
    include Yellowjackets or Wasps. These are Yeager's attributed equipment and
    conditional encounter observations, not published vehicle stat blocks.
  provenance: Original printed pp82–83/PDF83–84; this record preserves the narrator’s
    claims and their subjective certainty.
