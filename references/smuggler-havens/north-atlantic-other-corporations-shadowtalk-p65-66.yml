data:
  source_review_context: 'Fictional Shadowrun tabletop source: FASA Corporation, Target:
    Smuggler Havens (FASA7215, 1998), historical Shadowrun Second Edition-era tabletop
    RPG sourcebook; source.fasa-7215, printed pp65-66/PDF pp66-67. In-world report
    by Mal-de-Mer; narrator text and named forum replies remain differentiated.'
  claims:
  - page: 65
    speaker: Digi-talisman@ing.thd.ac.de
    claim: Says expansion into space makes sense for an aquatechnology firm given
      hostile-environment engineering but expresses it as technical opinion.
  - page: 65
    speaker: They Call Him Keynes@f-n.pro.de
    claim: Remarks that Proteus’s space activity is a potential competitor to Ares
      Space.
  - page: 65
    speaker: KonWacht
    claim: Speculates that Yamatetsu and Saeder-Krupp could join competition in space
      launches.
  - page: 65
    speaker: Brøtbør@nsao.ne.no
    claim: Comments that harsh Northern winter storms favor submerged oil rigs over
      exposed surface work.
  - page: 65
    speaker: Hermsgervørden@nsao.ne.no
    claim: >-
      Claims AG Chemie uses submarine tankers to carry petroleum from its offshore rigs to refineries in Norway and Germany. The speaker says Norwegian Sea winter conditions rule out many surface tankers and some waters are too deep for pipelines, making tankers an easier target for pirates than rigs or pipelines. Says the corporation invests in escort submarines to protect its underwater tanker fleet. These are attributed claims, not narrator-certified fleet inventory.
  - page: 65
    speaker: Jurgen Wigg@apwx.ne.no
    claim: Warns of paranormal deep-water threats to undersea workers, mentioning
      large leviathans and megalodons, with an unverified report that a megalodon
      damaged a hunter submarine.
  - page: 66
    speaker: Gretchen
    claim: Criticizes the chemical industry for polluting and then studying its own
      toxic waste.
  - page: 66
    speaker: Shellfish
    claim: Alleges Zeta-ImpChem investigates corrosive substances, including toxic
      exposure risks to its opponents; this is not a verified game mechanic.
  - page: 66
    speaker: Rabid
    claim: Claims both rival firms offer unusually high prices for live mutant paracritters;
      this is an attributed claim, not a cataloged game price.
  - page: 66
    speaker: Rubycon@umbranet.it
    claim: Argues GestE joint ventures typically leave nominal local partners in charge
      while IFMU retains substantive control through money and technical expertise.
  - page: 66
    speaker: Bung
    claim: Replies with a general observation that whoever controls capital controls
      the deal.
  - page: 66
    speaker: Spelunker
    claim: Speculates there may be something other than useful ore below the Baltic
      seabed where IFMU operates.
  mechanics_review: Forum speculation and non-quantified alleged prices are not evidence
    of numeric rules or codified nuyen costs.
