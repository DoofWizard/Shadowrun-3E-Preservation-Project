summary: 'Archival description from the 1998 fictional Shadowrun sourcebook Target: Smuggler Havens
  (FASA Corporation, FASA7215), printed 102-103/PDF 103-104: Running underwater adventures and
  corporate port briefings. Published narrator statements and optional fictional GM scenarios
