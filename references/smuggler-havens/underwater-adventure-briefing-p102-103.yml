summary: 'Source-reviewed third-person report of fictional setting and optional GM
  scenarios in FASA Corporation''s Target: Smuggler Havens (FASA7215, 1998, historical
  Second Edition), printed pp102–103/PDF103–104. It distinguishes the fictional narrator''s
  claims, unproven WinterNight suspicion, and hypothetical competitor actions; no
  SR3 conversion.'
data:
  section: Game Information — Running an Underwater Adventure, Ports of Call, Situational
    Briefing
  mode: Game-master campaign guidance and fictional setting, not proven real-world
    economics or instructions.
  undersea_adventure_structure: Use Off the Deep End (starts printed p55) for setting;
    compare Cyberpirates for piracy and smuggling. The source advises that characters
    require plausible underwater transportation, commonly a submarine, and suggests
    local legwork via nearby ports rather than effortless direct travel from a home
    city.
  ports_of_call: Ports are starting points for intelligence gathering, provisioning,
    and local color. They may also be staged as bases for piracy or shadowrunning
    in foreign lands.
  dunkelzahn_legacy:
    source_lineage: 'Portfolio of a Dragon: Dunkelzahn’s Secrets p32 (will)'
    sponsor: Draco Foundation (fictional entity)
    offer_nuyen: 5000000
    eligibility: First person or organization to establish a self-sustaining undersea
      city with 100 or more residents.
    source_status: The narrator states no settlement has qualified; likely sites are
      too small or not self-sufficient.
    gm_choice: Gamemaster can arrange a storyline involving corporate attempts to
      claim the reward or hinder competitors.
    competing_organizational_motives: The published narrator suggests that a megacorporation
      might regard public-relations prestige as a motive beyond the 5,000,000-nuyen
      prize, while a smaller corporation might seek the prize to recoup development
      costs and repay investors. These are campaign possibilities, not established
      results.
    player_intervention_options: The game master may let player characters help a
      claimant or hinder another claimant; the book does not designate any actual
      successful claimant.
  sea_of_japan:
    claimed_setting: Yamatesu had consolidated undersea aquaculture/research sites
      to meet the fictional reward criteria, but Yuri Shibanokuji’s elevation to director
      and headquarters move to Russia disrupted the plan.
    other_actors:
    - Shiawase
    - Mitsuhama
    conflict: Companies competing for marine research and undersea holdings; Korea
      is the scene of much of the fictional contest.
    source_lineage: Blood in the Boardroom, Yamatesu track.
    yamatesu_proposal: The narrator says Yamatesu had been consolidating numerous
      small underwater aquaculture and marine-biological research stations into one
      prospective aquacology to qualify for the Draco Foundation reward; the proposed
      project was interrupted, not completed.
    attributed_competition_and_agency: The source proposes that Shiawase and Mitsuhama
      would attempt to acquire or steal Yamatesu's underwater secrets and holdings
      during disruption, while Yamatesu tries to retain them. These are GM-suggested
      future conflicts, not affirmed completed transfers.
    korea_campaign_context: The narrator says the struggle would be set mainly in
      Korea because runners from Korean ports can operate there more easily than in
      the more stratified society of Imperial Japan; this is period fictional setting
      characterization.
  north_atlantic:
    corporate_actor: Proteus AG
    opposition: Ecological militants, pirates, and competing parties, with separate
      possible allegations of WinterNight infiltration.
    account: The source describes undersea holdings, public relations, and possible
      clashes over corporate interests; any unnamed future confrontations are campaign
      possibilities.
    proteus_premature_filing_and_claim: The book's narrator claims Proteus AG came
      closest to establishing the first undersea community and would have met the
      Draco Foundation prize conditions except for certain technicalities. Its premature
      filing for the award is said to have drawn competitors seeking to discover and
      copy Proteus technology. This is an in-world narrator assessment, not confirmation
      the prize was awarded.
    klabauterbund_departure_and_uncertainty: The narrator says the Klabauterbund had
      largely withdrawn from the area amid internal turmoil, possibly caused by infiltration
      by the apocalyptic WinterNight group. The infiltration is explicitly conjectural.
    motives_and_scenario_opportunities: The source distinguishes environmental activists'
      more complex agenda from the money-seeking motives it ascribes to many pirates;
      corporate drilling interests are also described. Potential hired work in smuggling,
      espionage, piracy and bounty hunting remains optional GM campaign material.
  printed_pdf_provenance: Printed p102/PDF103 and beginning of p103/PDF104, historical
    FASA7215 game-master material.
