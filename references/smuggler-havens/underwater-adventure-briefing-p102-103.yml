data:
  section: Game Information — Running an Underwater Adventure, Ports of Call, Situational Briefing
  mode: Game-master campaign guidance and fictional setting, not proven real-world economics or
    instructions.
  undersea_adventure_structure: Use Off the Deep End (starts printed p55) for setting; compare
    Cyberpirates for piracy and smuggling. The source advises that characters require plausible
    underwater transportation, commonly a submarine, and suggests local legwork via nearby ports
    rather than effortless direct travel from a home city.
  ports_of_call: Ports are starting points for intelligence gathering, provisioning, and local
    color. They may also be staged as bases for piracy or shadowrunning in foreign lands.
  dunkelzahn_legacy:
    source_lineage: 'Portfolio of a Dragon: Dunkelzahn’s Secrets p32 (will)'
    sponsor: Draco Foundation (fictional entity)
    offer_nuyen: 5000000
    eligibility: First person or organization to establish a self-sustaining undersea city with
      100 or more residents.
    source_status: The narrator states no settlement has qualified; likely sites are too small
      or not self-sufficient.
    gm_choice: Gamemaster can arrange a storyline involving corporate attempts to claim the reward
      or hinder competitors.
  sea_of_japan:
    claimed_setting: Yamatesu had consolidated undersea aquaculture/research sites to meet the
      fictional reward criteria, but Yuri Shibanokuji’s elevation to director and headquarters
      move to Russia disrupted the plan.
    other_actors:
    - Shiawase
    - Mitsuhama
    conflict: Companies competing for marine research and undersea holdings; Korea is the scene
      of much of the fictional contest.
    source_lineage: Blood in the Boardroom, Yamatesu track.
  north_atlantic:
    corporate_actor: Proteus AG
    opposition: Ecological militants, pirates, and competing parties, with separate possible allegations
      of WinterNight infiltration.
    account: The source describes undersea holdings, public relations, and possible clashes over
      corporate interests; any unnamed future confrontations are campaign possibilities.
  printed_pdf_provenance: Printed p102/PDF103 and beginning of p103/PDF104, historical FASA7215
    game-master material.
