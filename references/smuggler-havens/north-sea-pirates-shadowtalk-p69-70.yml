data:
  source_context: 'Fictional Shadowrun tabletop RPG source from FASA Corporation,
    Target: Smuggler Havens (FASA7215, 1998), historical Second Edition-era; source.fasa-7215.
    Printed pp69-70/PDF pp70-71. Narrative assertions and named Shadowtalk posts are
    separate.'
  posts:
  - page: 69
    speaker: Svendge@dn.fst.oslo.no
    claim: Most smuggling is short-haul over one or two borders, but a few long-haulers
      move magical goods from the Trans-Polar Aleut Council, especially Iceland and
      the North Cape. Winter conditions limit the season.
  - page: 70
    speaker: Pelops@is.fus316.net.uk
    claim: Rumor alleges one or two Akula crews use old uranium-fission-powered boats,
      possibly Oscar-class missile submarines; the poster regards even this as an
      old seafarers tale.
  - page: 70
    speaker: Triton@trap1.apcnet.uk
    claim: Rejects outright dismissal of Oscar-class submarine rumors, noting their
      large reconstructed cargo holds and double hulls could suit clandestine freight
      and withstand torpedo impacts; this is one speaker's conjecture, not narrator-confirmed
      fleet composition.
  - page: 70
    speaker: Long John
    claim: Attributes the Marauders' functional ships and vehicles to dwarf and human
      riggers and technicians on the crew; disputes the notion that elven mystique
      alone explains their success.
  attribution_guard: Rival Oscar-class, nuclear-powered and other submarine claims
    are forum speculation and remain separate from the narrator's explicit absence
    of confirmed Akula nuclear submarines.
