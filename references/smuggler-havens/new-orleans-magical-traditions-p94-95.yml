data:
  section: Running in New Orleans / Voodoo
  source_voice: Historical fictional Shadowrun sourcebook discussion of its setting-specific
    magical traditions, not independent real-world ethnography or a claim that magic
    exists.
  voudoun: Source contrasts the Haitian-based tradition in Awakenings with the New
    Orleans fictional setting, which the text says draws on French/Spanish European
    and Native American shamanic traditions; New Orleans houngans are portrayed as
    somewhat more public than counterparts elsewhere while concealing sensitive work.
  history_of_enslavement: The book expressly links multiple magical traditions of
    this fictional setting to the forced transatlantic transport and enslavement of
    Africans; this is not rewritten as voluntary migration or consensual cultural
    exchange.
  santeria: The source describes enslaved Africans in Spanish-controlled regions combining
    inherited practices with the Catholic religious traditions imposed by enslavers.
    It identifies Orishas as spiritual figures; practitioners as santeros and santeras;
    Yoruba as liturgical language; and casa as a ritual meeting-house. The text places
    the practice in the Caribbean, South America and other areas with large Hispanic
    populations.
  candomble_umbanda_quimbanda: In its fictional regional classification, Candomblé
    is compared with Santeria and associated with Portuguese rather than Spanish terminology;
    Umbanda is said to have Hindu and Buddhist influence; Quimbanda is compared with
    the Petro tradition in Awakenings p129. The book calls the latter a route to “bad
    magic”; that is a source-attributed evaluative characterization, not an asserted
    fact about real belief systems.
  second_edition_lineage: The book directs use of the same fictional loa, possession
    and related magic mechanics from Awakenings pp120–131 across its listed traditions;
    this is an explicit historical source reference, not a fabricated Third Edition
    conversion.
