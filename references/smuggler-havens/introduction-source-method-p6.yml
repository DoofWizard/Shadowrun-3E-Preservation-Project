summary: 'Source-indexed orientation to FASA Corporation''s published fictional Shadowrun
  setting supplement Target: Smuggler Havens (FASA7215, 1998), source.fasa-7215, printed
  p6/PDF7. The introduction identifies its regional subjects, the fictional-document/Shadowtalk
