data:
  source_voice: The introduction is presented as an editorial framing statement for
    a fictional-world document, not as an omniscient proof of every in-world post.
  highlighted_city_settings:
  - New Orleans in the Confederate American States (CAS), presented as a Gulf and
    Caribbean trade and smuggling center.
  - Vladivostok in Russia, presented as a port linked to the Sea of Japan and a post-Siberian
    political and commercial setting.
  thematic_scope:
  - Undersea communities and experimental undersea facilities, including competing
    interests in their development.
  - Seaborne piracy and smuggling activity across the North Atlantic and the Sea of
    Japan.
  - Land-based routes across North America from the Seattle region toward New Orleans.
  - Campaign uses include ports, shadowrunner travel, and regional factions; a gamemaster
    information chapter contains game-specific material separately.
  document_epistemology:
  - The book says some marginal comments are attributed to characters within its game
    universe and may correct, supplement or contradict the main account.
  - Its introduction explicitly warns that those reader comments may be inaccurate,
    untruthful or biased.
  - The main source narrative likewise draws on sources with their own perspectives;
    player groups and gamemasters determine local application.
  stated_relationship_to_other_book: The source suggests Cyberpirates as an optional
    campaign context, but explicitly says it is not necessary to use this supplement.
  game_mechanics: No independent target numbers, tests, modifiers, equipment statistics
    or conversion rule appear on this introductory page.
  source_specific_introduction_context:
    new_orleans: >-
      The book narrator identifies New Orleans as North America’s principal smuggling port of call and emphasizes its limited megacorporate presence, nightlife, and Awakened swamps.
    vladivostok: >-
      The narrator describes Japanese, Korean and Chinese metahuman exiles as a cause of Vladivostok’s cultural diversity, which inspired Yamatetsu’s relocation. The Russian military, secret police, Vory v Zakone and boat-based smugglers also feature in the setting.
    undersea_sites: >-
      Experimental aquaspheres and underwater communities are linked to corporate competition around Dunkelzahn’s will; the narrator says their isolation makes them potential fictional holding sites for loot or hostages or use as trading ports.
    land_route_destinations: [Aztlan, Denver, Tir Tairngire, Québec]
    game_information_boundary: >-
      The introduction points to separate end-of-book game information containing campaign hooks, scenario materials and game rules; this page itself states no dice tests, target numbers, modifiers, or equipment statistics.

