data:
  context: Attributed fictional forum commentary about the Russian Pacific Fleet at
    printed p51; intentionally separate from the neighboring book narration and not
    presented as verified military information.
  posts:
  - printed_page: 51
    speaker: Saako@usys.vladnet.ru
    claim: Reports that Russia’s Pacific Fleet is chiefly preoccupied with Japanese
      naval activity, normally leaving maritime smugglers to the UGB unless a surface
      exercise or naval patrol is under way.
  - printed_page: 51
    speaker: October Red
    claim: Warns that Russian antisubmarine crews may misidentify illicit-submersible
      traffic as Japanese military submarines, describing the risk as a hearsay hazard
      rather than codified game mechanics.
  - printed_page: 51
    speaker: The Flying Canadian
    claim: Claims patrol aircraft and radar coverage in the region are inconsistent
      due to deteriorating infrastructure, while pilots continue to encounter airspace
      restrictions. The source provides no published evasion target number.
  - printed_page: 51
    speaker: Hangfire
    claim: Alleges that the Pacific Fleet retains a brigade of special-operations
      naval personnel, including combat swimmers, airborne assault specialists and
      a minisubmersible infiltration group. He additionally claims an otherwise concealed
      training island somewhere within Amursky Bay or Peter the Great Bay; these
      are his uncorroborated claims, not part of the narrator's established Naval
      Infantry force specification.
  rules_review: Forum commentary supplies no formal aircraft detection TN, ship/mini-sub
    statistics, combat procedures, aircraft cost, mission duration, or mechanical
    reconnaissance rule.
