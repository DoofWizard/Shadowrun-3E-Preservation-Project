- attributed_claim
data:
  context: Named fictional Shadowtalk posts in FASA7215; allegations, personal anecdotes
    and conjecture are not established as narrator facts or mechanics.
  posts:
  - printed_page: 45
    speaker: Ramius
    claim: Warns that waters north of Kamchatka can contain Russian naval submarines
      that sometimes surface near smugglers, and that northbound routes through the
      Arctic toward Scandinavia or Québec risk interception; presents this as practical
      in-world hearsay.
  - printed_page: 45
    speaker: Icefin
    claim: Claims a Japanese submarine sank the Coastal Wizard in the Sea of Okhotsk
      while it was participating in raids against Japanese freighters and connected
      to a pro-Japanese argument by UGB personnel; says Russia and Japan publicly
      avoided escalating the incident.
  - printed_page: 45
    speaker: Jungle Cat
    claim: Says Japanese anti-piracy crews in the region are not the only hazards
      and recounts conflict between Japanese whalers and eco-activist crews; speculates
      that Awakened killer whales now act against whaling ships.
  - printed_page: 46
    speaker: Carousel
    claim: Claims that Petropavlovsk merchants are an efficient place for smugglers
      to sell goods because traders from Vladivostok, Japan and Korea circulate through
      the town, though locals may offer less than standard nuyen value.
  - printed_page: 46
    speaker: Major
    claim: 'Recounts an alleged magical incident in the Valley of Geysers: fire near
      an unusual moss patch exposed an aggressive magically active entity, and a summoned
      firebolt produced a very large explosion. It is an anecdote, not a spell or
      explosion damage rule.'
  - printed_page: 46
    speaker: Sinsk
    claim: Relays stories of ember-like creatures near volcanoes that supposedly enter
      burning timber and can animate a tree or wooden building briefly; the source
      provides no formal critter statistics.
  - printed_page: 46
    speaker: Petrov@p-k.tenset.ru
    claim: Relays a disputed account that the Valley of Geysers is the dwelling of
      a powerful entity associated with or guarding elemental and nature spirits;
      adds that a minority interprets the supposed entity as a dragon.
  rules_review: None of these posts provides formal creature statistics, spell damage,
    firearm rules, equipment prices, target numbers or other printed game-resolution
    values.
