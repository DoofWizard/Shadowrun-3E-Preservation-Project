data:
  context: Named fictional Shadowtalk posts in FASA7215; allegations, personal anecdotes
    and conjecture are not established as narrator facts or mechanics.
  posts:
  - printed_page: 45
    speaker: Ramius
    claim: >-
      In his fictional regional commentary, reports that Russian naval submarines enter and leave facilities outside Petropavlovsk, but distinguishes them from legitimate civilian undersea freighters crossing Arctic waters toward Scandinavia and Québec and service craft supplying offshore oil and geothermal operations. He says the Russian Navy does not automatically attack every sonar contact, while advising caution.
  - printed_page: 45
    speaker: Icefin
    claim: >-
      Alleges that Japanese attack submarines monitor Russian submarine facilities and movements. Describes a Japanese submarine sinking the Coastal Wizard, a pirate submarine on a Vladivostok-to-Seattle smuggling passage, after the Wizards' reported raids against Japanese freighters the previous year. Says the incident caused a significant international dispute between Russia and Japan and argues that its occurrence in international waters left Japan within its rights; all particulars remain Icefin's claims.
  - printed_page: 45
    speaker: Jungle Cat
    claim: >-
      Describes eco-activist crews ramming and destroying Japanese whaling ships in the fictional setting, notes that nearly all Japanese whalers now have Imperial Japanese Navy escorts, and reports that whales themselves have begun resisting the whalers. These are the speaker's claims, not independent facts.
  - printed_page: 46
    speaker: Carousel
    claim: Claims that Petropavlovsk merchants are an efficient place for smugglers
      to sell goods because traders from Vladivostok, Japan and Korea circulate through
      the town, though locals may offer less than standard nuyen value.
  - printed_page: 46
    speaker: Major
    claim: >-
      Recounts a fictional visit to the Valley of Geysers with a guide following a possible mineral-telesma lead. Major says the party was ambushed by people he could not identify with certainty as bandits or cultists; he attempted a firebolt against someone he thought was a magician, but a much larger fireball resulted and its magical Drain knocked him unconscious. The anecdote supplies no numerical spell, explosion or Drain mechanic.
  - printed_page: 46
    speaker: Sinsk
    claim: >-
      Reports rumors of embracers, described as strange gorilla-like creatures drawn to fire, near the Kamchatka volcanoes. Separately recounts personally encountering a salamander fire spirit in the Valley of Geysers; says it appeared to guard something and threatened him only as he approached one particular spring field. The speaker does not assert a formal creature statistic or confirmed protective motive.
  - printed_page: 46
    speaker: Petrov@p-k.tenset.ru
    claim: Relays a disputed account that the Valley of Geysers is the dwelling of
      a powerful entity associated with or guarding elemental and nature spirits;
      adds that a minority interprets the supposed entity as a dragon.
  rules_review: None of these posts provides formal creature statistics, spell damage,
    firearm rules, equipment prices, target numbers or other printed game-resolution
    values.
