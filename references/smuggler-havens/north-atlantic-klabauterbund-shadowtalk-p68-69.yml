data:
  source_review_context: 'Fictional Shadowrun tabletop source: FASA Corporation, Target:
    Smuggler Havens (FASA7215, 1998), historical Shadowrun Second Edition-era tabletop
    RPG sourcebook; source.fasa-7215, printed pp68-69/PDF pp69-70. In-world report
    by Mal-de-Mer; narrator text and named forum replies remain differentiated.'
  claims:
  - page: 68
    speaker: Wuzzel@pgkf.hh.de
    claim: >-
      Claims that in 2058 the Klabauterbund went to war with and virtually wiped out the Danish pirate group Ice Warriors, whose members were said to carry extensive cyberware and advanced 'smart' anti-ship weapons. The outcome and characterizations are the named speaker's report, not an independently established narrator fact.
  - page: 68
    speaker: Edelweiss
    claim: >-
      Suggests the Ice Warriors may have betrayed Klabauterbund members during a joint run, transferred allegiance to AG Chemie, and violently attacked a Klabauterbund group, and that these alleged acts might explain the later conflict. The speaker offers a conjectured motive and allegations, not a narrator-certified account.
  - page: 68
    speaker: Hierophant@ac.uni-hd.de
    claim: Speculates that some high-ranking members may be toxic magicians and warns
      that symbolic links to a polluted North Sea might affect magical practices.
      The suspicion is not a demonstrated fact.
  - page: 68
    speaker: Witt@pgkf.hh.de
    claim: Says Klabauterbund leaders and members have recently fallen silent or disappeared
      from public view, and speculates about internal division.
  - page: 68
    speaker: BitBert
    claim: Repeats an unverified conspiracy rumor that Winterknight infiltrated the
      Klabauterbund and that some members withdrew to identify supposed infiltrators.
  - pages: 68-69
    speaker: Shockwave Sie
    claim: Says magic practitioners in the group know paranormal critters, and warns
      Winterknight would face opposition if a rumored attack were real; this is not
      confirmed evidence of an attack.
  mechanics_review: Rumors about weapons and magical abilities have no source-printed
    statistics on the reviewed pages.
