summary: Published fictional Shadowrun sourcebook reference for St. Louis to New Orleans
  — The Gauntlet / The Throat, printed pp86-87/PDF pp87-88, FASA Corporation, 1998
  (FASA7215; historical Second Edition era). Statements attributed to Yeager are in-world
  claims, not real-world instructions or automatically omniscient setting facts.
data:
  section: St. Louis to New Orleans
  route_name: The Gauntlet, also called the Throat
  narrative_voice: Yeager’s in-world first-person survey and reported statements,
    not a real-world route guide.
  description: Yeager says north and south long-distance branches converge at St.
    Louis after Chicago ceased functioning as a major corridor. He frames the Mississippi
    River and nearby land/air travel between St. Louis and New Orleans as interconnected
    settings.
  fictional_stop:
    name: Family Inn
    location: Mississippi–Arkansas river confluence
    physical_description: An itinerant formation of four to ten connected barges,
      with repair and dry-dock facilities. Yeager reports a 10–25 percent cost premium
      compared with ordinary street prices for its services and says the barge operators
      may provide temporary repairs. His source does not identify the owner.
  commodity_and_civic_claims: Yeager describes varied commercial cargo from numerous
    North American regions, widespread local enforcement, and municipal gangs. He
    attributes city-level power struggles and precarious marketplace arrangements
    to his own observation; UCAS and CAS jurisdictions are depicted as cooperating
    to keep the Mississippi functioning.
  terrain_and_creature_claim: Yeager recounts seeing an enormous creature emerge from
    the Mississippi-region swamps, and compares it with a troll weighing approximately
    250 kilograms. It remains his reported encounter, not an established biological
    or mechanical stat block.
  transportation_and_people: The account treats the river as a major transport artery;
    mentions ATVs, cargo haulers, river barges and t-birds and differentiates the
    latter as raising CAS security concern. No gear stat line or vehicle rating appears
    in this passage.
  notable_rigger:
    name: Huck Finn
    vessel: Grand Old Dame
    description: Yeager describes Huck as operating a conspicuous pleasure-style riverboat;
      rumors question whether Huck stopped smuggling, and Yeager explicitly does not
      resolve the uncertainty.
  opposition: Yeager recounts possible pressure from gangs, fixers, local police and
    other actors, while describing regional tensions and the possibility of violent
    encounters as in-world risks; he does not offer a settled inventory of actual
    real-world threats.
  source_range_note: Starts mid printed p86/PDF87 and continues into printed p87/PDF88,
    ending before Into Aztlan.
