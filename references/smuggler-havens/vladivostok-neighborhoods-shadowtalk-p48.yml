  context: Two named fictional Shadowtalk posts located within Polecat’s Khasan Coast
    neighborhood account at printed p48, distinguished from the narrator’s location
    descriptions.
  posts:
  - printed_page: 48
    speaker: Yarovit@usys.vladnet.ru
    claim: Reports that despite slum urbanization in the Khasan area, families may
      retain domovoi house spirits and offer them bits of food, milk or beer in exchange
      for keeping homes tidy and protected.
  - printed_page: 48
    speaker: The Flying Canadian
    claim: Reports local “bee farms” at the coast involving large Siberian bees and
      says a keeper used illusion magic to conceal a bird, thereby drawing it back
      from the caller. The account is an anecdote rather than a published ritual or
      spell rule.
  rules_review: The source provides neither creature statistics nor a formal illusion
    spellcasting test, target number or range for these anecdotes.
