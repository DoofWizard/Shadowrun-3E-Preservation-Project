edition_scope: 'Original FASA Corporation Shadowrun Target: Smuggler Havens (FASA7215,
  copyright 1998), historical Second Edition-era fictional setting; no inferred Shadowrun
  Third Edition conversion'
content_class:
- attributed_claim
data:
  context: Named in-world Shadowtalk commentary accompanying Petrov’s fictional Vladivostok
    police and security account, preserved as claims rather than narrator facts; names
    and uncertainty are explicit.
  posts:
  - printed_page: 49
    speaker: Ruble L
    claim: Questions a rumored UGB-related corporation agreement and asks what concessions
      Yamatesu and Wuxing could have made; presents suspicion rather than a verified
      transaction.
  - printed_page: 49
    speaker: Fallen Angel
    claim: Suggests that Cross Applied Technologies’ Seraphim might be active within
      the UGB as a means of opposing its corporate rivals; framed as a conjecture.
  - printed_page: 49
    speaker: AK
    claim: Observes that some National Soviet Reconstructionists appear to be changing
      their position on metahumans, and alleges the emergence of an anti-metahuman
      faction in the NSR.
  - printed_page: 49
    speaker: Novichok@prm.tenset.ru
    claim: Connects the UGB Border Guard’s influence to participation in conflict
      against Siberian forces, and later claims former security personnel from the
      CIS era were driven out or disappeared under the new regime.
  - printed_page: 49
    speaker: Svidrigailov@pry.tenset.ru
    claim: Argues that the Border Guard is stretched thin by conflict with Siberians,
      making territorial patrol coverage less comprehensive than official rhetoric
      suggests.
  - printed_page: 49
    speaker: Tease
    claim: Raises questions about the Russian nuclear arsenal and perceived limited
      disarmament despite official announcements; the post expresses concern, not
      an independently verified inventory.
  - printed_pages: 49-50
    speaker: Bung
    claim: Repeats a story that older Russian nuclear weapons were destroyed, misplaced,
      stolen or taken by security officials before renewed controls; treats it as
      a circulating rumor rather than established fact.
  - printed_page: 50
    speaker: Frequent Flyer
    claim: Jokes about vanished CIS-era officers in response to Novichok’s story;
      does not provide independent evidence.
  - printed_page: 50
    speaker: Red Eye
    claim: Claims an aggressive new nuclear-security regime and reports couriers bypassing
      secure communications to carry important messages; source does not supply an
      operational procedure.
  - printed_page: 50
    speaker: Pereplut@usys.vladnet.ru
    claim: Explicitly rejects an absolute portrayal of MVD investigators as corrupt
      and says some MVD precincts investigate within Russian legal boundaries, while
      acknowledging exceptions exist.
  - printed_page: 50
    speaker: Jaxon
    claim: Criticizes the existence of multiple Russian military/security forces,
      calling the apparent duplication excessive.
  - printed_pages: 50-51
    speaker: Glennarry
    claim: Explains that the public and rank-and-file often respect the Red Army more
      than the Interior Army, linking this perception to mandatory service and the
      Interior Army’s role in repression.
  - printed_page: 51
    speaker: Droud
    claim: Describes competition among the MVD Interior Army, Red Army and UGB Border
      Guard over recruits, missions and prestige, with repercussions for factional
      politics.
  - printed_page: 51
    speaker: Muramets@apcb.suz.ru
    claim: Reports interservice friction along the Siberian front and suggests it
      disrupts enforcement against smugglers; presented as in-world testimony, not
      verified operational advice.
  - printed_page: 51
    speaker: Stainless
    claim: Responds to Petrov’s allegations about ethnic/racially motivated MVD independents
      by saying they resemble Human Nation supporters; this is the poster’s comparison.
  rules_review: These fictional opinions and disputed reports provide no numeric legal/combat
    modifiers, attributes, weapon statistics, exact surveillance tests, game prices
    or Availability values.
