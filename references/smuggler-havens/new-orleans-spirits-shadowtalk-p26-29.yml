{"id":"reference.smuggler-havens.new-orleans-spirits-shadowtalk-p26-29","record_type":"reference","status":"ingested","source":"source.fasa-7215","printed_pages":"26-29","pdf_pages":"27-30","edition_scope":"Original FASA Corporation Shadowrun Target: Smuggler Havens (FASA7215, ©1998), historical Second Edition-era setting context; not a Shadowrun Third Edition conversion","content_class":["attributed_claim"],"data":{"frame":"Fictional source commentary on spirits, zombies, ghouls, HMHVV, and bayou shamans in FASA7215 pp26–29. Disputed classifications remain attributed to named Shadowland handles.","claims":[{"speaker":"Taylor","printed_page":26,"claim":"Suggests Mardi Gras crowds supply emotional astral energy that can amplify magic and pose risks.","certainty":"speaker theory"},{"speaker":"Wiz Kid","printed_page":26,"claim":"Argues festival background activity helps conceal ritual magic.","certainty":"in-world observation"},{"speaker":"Rasputin Magekin","printed_page":26,"claim":"Describes Toussaint as a free spirit celebrating with humans and taking metahuman forms; recounts an apparent materialization of old-style coins.","certainty":"anecdote, not game statistics"},{"speaker":"Tommy Dre","printed_page":26,"claim":"Describes Mal, a free spirit in the French Quarter whom Toussaint calls 'brother' (without an explained kinship), shifting into varied human or metahuman forms; says its gifts and coins are counterfeit or cursed, and Mal sometimes takes the guise of an elven woman named Malice in pit fights.","certainty":"attributed character description"},{"speaker":"Gator Boy","printed_page":26,"claim":"Jokes that Malice is an ex-partner and warns others away.","certainty":"personal quip, not a source fact about species"},{"speaker":"Golddigger","printed_page":27,"claim":"Says some ghosts and specters attach to particular objects or places and claims destroying or cleansing that anchor can release them.","certainty":"anecdotal magical-world interpretation, not an exact playable spell rule"},{"speaker":"Yoshi","printed_page":27,"claim":"Yoshi recounts that a krewe captain sought revenge for his brother's death by targeting a rival krewe leader and was killed by runners. The rival leader subsequently died, and the captain's krewe suspected and killed the runners. Yoshi says some instead believe the dead captain's ghost accomplished his original revenge. He also warns that the spirit of a magician killed on a run might return in astral form. He does not say the runners were paid for the captain's death; the haunting remains an in-world rumor.","certainty":"rumor and anecdote"},{"speaker":"D-Con","printed_page":27,"claim":"Alleges runners were motivated by greed in the story of the dead gang leader.","certainty":"accusation"},{"speaker":"Walker","printed_page":27,"claim":"Rejects D-Con's dismissal and reports street rumors that the bereaved krewe is seeking unusually capable magically skilled runners for a possible ghost-hunting assignment. Walker does not claim another faction hired the original runners.","certainty":"counter-rumor"},{"speaker":"Saint Expedie","printed_page":27,"claim":"Recalls local warnings about graveyard tour groups and creatures at St. Louis Cemetery No. 1.","certainty":"folklore"},{"speaker":"Magister","printed_pages":"27-28","claim":"Says magically animated corpses are different from HMHVV-infected living vampires and ghouls, challenging the claim that all are undead.","certainty":"speaker’s in-world scientific distinction"},{"speaker":"Decker del Sur","printed_page":27,"claim":"Speculates some zombies are ritual puppets while others may be animated by a summoned spirit beyond a practitioner’s continued control.","certainty":"competing supernatural hypothesis"},{"speaker":"Walker","printed_page":27,"claim":"Claims a freed spirit in an animated corpse may retain its own powers; disputes an unequivocal zombie classification.","certainty":"unverified supernatural speculation"},{"speaker":"Jaxom","printed_page":27,"claim":"Objects that the label free zombie contradicts his definition of undead.","certainty":"speaker objection"},{"speaker":"Tommy Dre","printed_pages":"27-28","claim":"Alleges the Zobop-linked figure Old Bones is a powerful self-directed zombie and uses that exception to contest a universal definition of zombie.","certainty":"in-world claim about a named figure"},{"speaker":"Doc","printed_page":28,"claim":"Reports that ghouls were once thought to constitute a metahuman race like orks and trolls, but more recent observations show ghouls can transmit HMHVV to otherwise unaffected metahumans. Mentions a theory that dormant HMHVV existed in some pre-Awakening humans, later activated and became transmissible; the proposal remains a speculative in-world hypothesis.","certainty":"proposed medical theory in fiction, not a verified universal rule"},{"speaker":"Buzz","printed_page":28,"claim":"Challenges Doc’s theory with an analogy that would equate metahuman lineages and infection; it is a question, not an established claim.","certainty":"skeptical question"},{"speaker":"Iron Cross","printed_page":28,"claim":"Iron Cross proposes killing fictional ghouls and clandestinely transporting their remains somewhere that would pay a bounty. This is an in-world character's remark, not a rule specifying a bounty amount or any real-world advice.","certainty":"speaker speculation, not a published game bounty price"},{"speaker":"Tiger","printed_page":29,"claim":"Describes an encounter with a corpselight and warns about its alluring drain of magical life force.","certainty":"eyewitness claim and supernatural anecdote"},{"speaker":"Delta Green","printed_page":29,"claim":"Challenges portrayal of all eco-shamans as toxic, asserting some oppose pollution and clean up contaminated sites.","certainty":"critical rebuttal"},{"speaker":"Sandbagger","printed_page":29,"claim":"Alleges sabotage of flood levees by some extremists and disputes benign portrayals of every eco-shaman.","certainty":"speaker allegation, no universal claim"},{"speaker":"Grande Flamme","printed_page":29,"claim":"Asserts local shamans keep toxic activity limited in the surrounding bayous.","certainty":"speaker assertion"},{"speaker":"Solo","printed_page":29,"claim":"Alleges mosquito insect spirits operate in the bayous near New Orleans under a mosquito shaman calling himself Needle. He suspects the group is linked to recent fictional disappearances and seeks living hosts for its spirit young; he reports that an encounter drove his investigative team away, while an employer called Mr. Johnson declined to send it back. All are Solo’s uncorroborated in-world allegations.","certainty":"unverified supernatural and crime allegation"},{"speaker":"Spirit-Dancer","printed_page":26,"claim":"Recalls summoning a city spirit amid New Orleans Mardi Gras celebrations and reports that the spirit manifested in an unusually elaborate festival guise before assisting him. He attributes the event to charged local astral conditions.","certainty":"fictional eyewitness account, no exact Force or spell statistics"},{"speaker":"Ryu Duval","printed_page":29,"claim":"Adds that corpselights have reportedly led careless smugglers into fatal accidents in the swamp; claims some recovered victims displayed unsettling fixed smiles. This remains an attributed in-world anecdote.","certainty":"fictional reported encounter"},{"speaker":"Magister","printed_page":29,"claim":"Agrees that astral travel into the bayous presents particular dangers because of swamp spirits, ghosts and other hazards, in contrast to city astral work. It is a character's caution rather than a new SR2 or SR3 movement rule.","certainty":"fictional character viewpoint"},{"speaker":"Delta Queen","printed_page":26,"claim":"Responds to a question about spirits feeding on emotional energy by comparing it to the energizing effect of a concert crowd, without asserting literal blood-drinking.","certainty":"speaker analogy"},{"speaker":"Proud Trog","printed_page":26,"claim":"Objects to a perceived insinuation that orks or other metahumans are naturally drawn to wrongdoing, calling that an unfair portrayal of innocent people; this is a named in-world objection to Doc Cane's preceding discussion.","certainty":"critical response"},{"speaker":"Mama D","printed_page":26,"claim":"Defends Doc Cane by distinguishing an alleged higher proportion of metahuman practitioners of Petro and voudoun from an inherent metahuman disposition. She says some practitioners have grievances against oppressive humans, while chastising those who conflate that context with a claim about all metahumans.","certainty":"attributed counterargument"},{"speaker":"Curious George","printed_page":26,"claim":"Questions whether Doc Cane's depiction of spirits gaining strength from human emotion means spirits literally feed on those emotions.","certainty":"speaker question"},{"speaker":"Curious George","printed_page":26,"claim":"Challenges Delta Queen's concert-crowd analogy by asking what evidence excludes spirits consuming emotions and how anyone can be certain about spirits' capabilities.","certainty":"skeptical question"},{"speaker":"Loki","printed_page":28,"claim":"Argues that vampires and banshees' apparent ability to move and think while surviving through draining living essence makes them 'undead' under his personal definition; he presents a classificatory viewpoint, not an HMHVV rule.","certainty":"in-world interpretation"},{"speaker":"Gardener","printed_page":28,"claim":"Counters that ordinary living creatures also consume other life to survive, so needing nourishment does not by itself establish undead status.","certainty":"in-world rebuttal"},{"speaker":"Lucian","printed_page":28,"claim":"Criticizes impressionable people who seek HMHVV infection through romanticized vampire myths, and alleges that some vampires exploit their naivete, using deception in spreading infection; this is the named fictional speaker's warning, not evidence about real-world disease.","certainty":"attributed warning"},{"speaker":"Adam","printed_page":28,"claim":"Asks where ghouls fit in the classification debate, recalling that they had been considered a metahuman race.","certainty":"speaker question"},{"speaker":"Doc","printed_page":28,"claim":"Responds that ordinary metahuman populations have shown no retroviral infection mechanism analogous to HMHVV; separately hypothesizes that New Orleans' high local HMHVV incidence may relate to hot swamp ecology and a high astral background, and asks for observations to test the proposal. The regional explanation is explicitly tentative.","certainty":"fictional medical hypothesis"}],"source_scope":"Different speakers disagree on undead classification, ghost phenomena, magical ecology and fictional pollution politics. This is not real-world medical, spiritual or tactical advice."},"headline":"Fictional attributed shadowland disagreements about spirits, ghouls and bayou magic — FASA Corporation, Target: Smuggler Havens (FASA7215, ©1998), fictional Shadowrun tabletop RPG, Second Edition-era historical setting; printed pp26-29/PDF27-30","summary":"Source-reviewed fictional attributed Shadowland disagreements about spirits, ghouls and bayou magic from FASA Corporation, Target: Smuggler Havens (FASA7215, ©1998), fictional Shadowrun tabletop RPG, Second Edition-era historical setting, source.fasa-7215, printed pp26-29/PDF27-30. In-world narrators and named commenters retain their own levels of certainty; there is no implied Third Edition mechanics conversion.","framing":"newsroom_neutral"}