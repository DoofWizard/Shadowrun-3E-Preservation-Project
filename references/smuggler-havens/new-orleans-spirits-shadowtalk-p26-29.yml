{"id":"reference.smuggler-havens.new-orleans-spirits-shadowtalk-p26-29","record_type":"reference","status":"ingested","source":"source.fasa-7215","printed_pages":"26-29","pdf_pages":"27-30","edition_scope":"Original FASA Corporation Shadowrun Target: Smuggler Havens (FASA7215, ©1998), historical Second Edition-era setting context; not a Shadowrun Third Edition conversion","content_class":["attributed_claim"],"data":{"frame":"Fictional source commentary on spirits, zombies, ghouls, HMHVV, and bayou shamans in FASA7215 pp26–29. Disputed classifications remain attributed to named Shadowland handles.","claims":[{"speaker":"Taylor","printed_page":26,"claim":"Suggests Mardi Gras crowds supply emotional astral energy that can amplify magic and pose risks.","certainty":"speaker theory"},{"speaker":"Wiz Kid","printed_page":26,"claim":"Argues festival background activity helps conceal ritual magic.","certainty":"in-world observation"},{"speaker":"Rasputin Magekin","printed_page":26,"claim":"Describes Toussaint as a free spirit celebrating with humans and taking metahuman forms; recounts an apparent materialization of old-style coins.","certainty":"anecdote, not game statistics"},{"speaker":"Tommy Dre","printed_page":26,"claim":"Relates tales of Mal, another French Quarter free spirit, its relationship to Toussaint, disruptive jokes, and its fights with an elven woman named Malice.","certainty":"attributed character description"},{"speaker":"Gator Boy","printed_page":26,"claim":"Jokes that Malice is an ex-partner and warns others away.","certainty":"personal quip, not a source fact about species"},{"speaker":"Golddigger","printed_page":27,"claim":"Says some ghosts and specters attach to particular objects or places and claims destroying or cleansing that anchor can release them.","certainty":"anecdotal magical-world interpretation, not an exact playable spell rule"},{"speaker":"Yoshi","printed_page":27,"claim":"Recounts a revenge-seeking ghost of a killed gang leader reportedly suspected of attacking runners.","certainty":"rumor and anecdote"},{"speaker":"D-Con","printed_page":27,"claim":"Alleges runners were motivated by greed in the story of the dead gang leader.","certainty":"accusation"},{"speaker":"Walker","printed_page":27,"claim":"Disputes D-Con’s explanation and says rumors suggest a different faction hired the runners; this is not confirmed.","certainty":"counter-rumor"},{"speaker":"Saint Expedie","printed_page":27,"claim":"Recalls local warnings about graveyard tour groups and creatures at St. Louis Cemetery No. 1.","certainty":"folklore"},{"speaker":"Magister","printed_pages":"27-28","claim":"Says magically animated corpses are different from HMHVV-infected living vampires and ghouls, challenging the claim that all are undead.","certainty":"speaker’s in-world scientific distinction"},{"speaker":"Decker del Sur","printed_page":27,"claim":"Speculates some zombies are ritual puppets while others may be animated by a summoned spirit beyond a practitioner’s continued control.","certainty":"competing supernatural hypothesis"},{"speaker":"Walker","printed_page":27,"claim":"Claims a freed spirit in an animated corpse may retain its own powers; disputes an unequivocal zombie classification.","certainty":"unverified supernatural speculation"},{"speaker":"Jaxom","printed_page":27,"claim":"Objects that the label free zombie contradicts his definition of undead.","certainty":"speaker objection"},{"speaker":"Tommy Dre","printed_pages":"27-28","claim":"Alleges the Zobop-linked figure Old Bones is a powerful self-directed zombie and uses that exception to contest a universal definition of zombie.","certainty":"in-world claim about a named figure"},{"speaker":"Doc","printed_page":28,"claim":"Speculates that ghouls arise when dormant HMHVV reactivates and suggests newly transformed ghouls may infect other people.","certainty":"proposed medical theory in fiction, not a verified universal rule"},{"speaker":"Buzz","printed_page":28,"claim":"Challenges Doc’s theory with an analogy that would equate metahuman lineages and infection; it is a question, not an established claim.","certainty":"skeptical question"},{"speaker":"Iron Cross","printed_page":28,"claim":"Raises the possibility of capturing ghouls to collect a bounty.","certainty":"speaker speculation, not a published game bounty price"},{"speaker":"Tiger","printed_page":29,"claim":"Describes an encounter with a corpselight and warns about its alluring drain of magical life force.","certainty":"eyewitness claim and supernatural anecdote"},{"speaker":"Delta Green","printed_page":29,"claim":"Challenges portrayal of all eco-shamans as toxic, asserting some oppose pollution and clean up contaminated sites.","certainty":"critical rebuttal"},{"speaker":"Sandbagger","printed_page":29,"claim":"Alleges sabotage of flood levees by some extremists and disputes benign portrayals of every eco-shaman.","certainty":"speaker allegation, no universal claim"},{"speaker":"Grande Flamme","printed_page":29,"claim":"Asserts local shamans keep toxic activity limited in the surrounding bayous.","certainty":"speaker assertion"},{"speaker":"Solo","printed_page":29,"claim":"Alleges frightening insect-spirit activity linked to disappearances in the region and recounts a team leaving the area.","certainty":"unverified supernatural and crime allegation"}],"source_scope":"Different speakers disagree on undead classification, ghost phenomena, magical ecology and fictional pollution politics. This is not real-world medical, spiritual or tactical advice."},"headline":"Fictional attributed shadowland disagreements about spirits, ghouls and bayou magic — FASA Corporation, Target: Smuggler Havens (FASA7215, ©1998), fictional Shadowrun tabletop RPG, Second Edition-era historical setting; printed pp26-29/PDF27-30","summary":"Source-reviewed fictional attributed Shadowland disagreements about spirits, ghouls and bayou magic from FASA Corporation, Target: Smuggler Havens (FASA7215, ©1998), fictional Shadowrun tabletop RPG, Second Edition-era historical setting, source.fasa-7215, printed pp26-29/PDF27-30. In-world narrators and named commenters retain their own levels of certainty; there is no implied Third Edition mechanics conversion.","framing":"newsroom_neutral"}
