data:
  section: Game Information — Running Land Smugglers; final three campaign-advice
    subsections on printed p106
  fictional_context: Optional game-master scenario construction and in-world character
    stakes, not factual real-world practices.
  wild_cards:
    theme: The book says game-master-designed travel can encounter unfamiliar rural
      and remote characters and challenges beyond the urban sprawl.
    examples:
    - survivalists
    - fictional paracritters
    - free spirits
    - dragons and wyverns
    - gangs
    - outsiders
    - ghoul communities
    - vampire covens
    - magical hermits
    - military maneuvers
    - corporate sites absent from the player map
    corporate_agribusiness: The fictional narrator describes corporate agricultural
      enclaves, guarded industrial-scale factory farming, and their risk of exposure
      to unwanted passers-by.
    toxic_waste: The GM may describe isolated fictional toxic-waste dumping locations
      away from surveillance and public attention.
    roleplaying_intent: Build different character-driven roadside encounters; the
      book states that different runs and locations should feel distinct, not identical
      repeated journeys.
  failure:
    basic_outcome: The source says failing a delivery or its contractual conditions
      can lead to loss of fictional pay, even if cargo reaches a place improperly
      or too late.
    severities:
    - contractual delivery shortfall
    - cargo theft or substitution
    - damaged reputation and reduced contacts
    - character capture
    - character death
    fictional_cargo_theft: A fictional fixer or patron may retaliate against or demand
      recovery from the person who loses or double-crosses a shipment; the game-master
      can use the ensuing mystery and journey as a plot hook.
    certainty: These are source-narrated narrative possibilities, not obligatory mechanics
      or universal outcomes.
  smuggling_to_everyone:
    scenario_flexibility: The book explicitly invites the game master to invent journeys
      beyond its illustrated established routes and fictional cities, depending on
      campaign story needs.
    fictional_trade_examples: Examples include food and vegetables transported toward
      Anchorage, or water-based voyages toward Los Angeles amid conflicting in-world
      factions.
    scope: Fictional worldbuilding examples only, not instructions for actual unlawful
      transport or commerce.
  mechanics: No standalone numeric rule, table, TN, or damage statistic printed in
    these three prose subsections.
