data:
  source_context: 'Fictional Shadowland announcement by Captain Chaos on the opening
    page of Off the Deep End in FASA Corporation, Target: Smuggler Havens (FASA7215,
    copyright 1998), historical Shadowrun Second Edition-era tabletop sourcebook,
    printed p55/PDF56, transmitted 01 July 2059 at 20:28:35 EST. These are source-period
    in-world reports and questions, not actual corporate or maritime news.'
  speaker: Captain Chaos
  transmission: 01 July 2059, 20:28:35 (EST)
  reported_developments:
  - fact: Captain Chaos recalls a prior Shadowland piracy compilation and says new
      reports about major developments around underwater cities and operations have
      arrived.
  - fact: He recounts Dunkelzahn’s five-million-nuyen prize for developing underwater
      cities, noting that the dragon died two years earlier and that the prize remains
      a source of corporate interest.
  - fact: He says Yamatetsu had consolidated Japanese underwater aquacology projects
      but that its board moved headquarters from Japan into Russia; plans to pursue
      the award have been delayed as corporate priorities change.
  - fact: He says Proteus AG, a previously obscure European corporation, filed for
      the five-million-nuyen prize; the Draco Foundation rejected the claim on technical
      grounds. The narrator regards the company’s progress as surprising and worth
      watching.
  editorial_note: The page introduces rival underwater facilities, maritime competition
    and the following chapter; its musings are not standalone stat rules or instructions.
  rules_review: Printed p55/PDF56 includes a fictional prize value of 5,000,000¥ as
    a world fact, not a game equipment price; no dice pools, target numbers or other
    game mechanics appear.
