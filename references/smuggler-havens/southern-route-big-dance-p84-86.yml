summary: Published fictional Shadowrun sourcebook reference for The Southern Route
  — The Big Dance, printed pp84-86/PDF pp85-87, FASA Corporation, 1998 (FASA7215;
  historical Second Edition era). Statements attributed to Yeager are in-world claims,
  not real-world instructions or automatically omniscient setting facts.
data:
  section: The Southern Route
  route_name: The Big Dance
  narrative_voice: Yeager, fictional first-person 2059 Shadowland account; route evaluations
    and reports are attributed to him.
  basic_route_description: Yeager describes a southern alternative between Seattle
    and New Orleans via Spokane, Salish-Shidhe territory, Idaho Falls, Ute territory,
    Denver, the Great Plains, St. Louis, and the final New Orleans segment. He presents
    the Rocky Mountain corridor and Sioux/UCAS/Pueblo borders as difficult; these
    are fictional political borders and reported route conditions, not contemporary
    travel guidance.
  denver_historical_context: The route through Chicago ceased to be the main channel
    after the Chicago Containment Zone. Yeager says the older Chicago system and its
    underworld arrangements collapsed after the disappearance of Don O’Malley behind
    the containment wall; he describes the subsequent change in distribution through
    Denver and southern approaches.
  named_stops:
  - name: Daniel
    location: Sioux territory on the Green River
    account: Described as a small break location; Yeager mentions an unverified rumor
      that Sioux government personnel use its trade infrastructure, but says he does
      not trust the rumor.
  - name: Maybell
    location: Ute territory, Yampa River by the Little Snake River
    account: Yeager favors its situational information about weather and military
      activity; he identifies this as his experience, not a verified universal fact.
  - name: Last Chance Chicken Roost
    location: Denver
    account: Yeager names it a hub for pilots and contacts. The proprietor is Denver
      Virgin, whom he describes as not a virgin; the associated Chief Flies at Night
      is an Owl shaman. Yeager describes a commemorative photo tradition and capable
      mechanics and suppliers.
  reported_commerce: Yeager distinguishes outbound urban electronics, weapons, sims,
    simchips and BTLs from return trade in telesma, other NAN rarities, livestock
    and animals; he says Denver markets attract a broad variety of goods. These are
    fictional-world economic claims, not advice.
  terrain_and_aviation: Yeager reports alpine weather, varied mountainous and plains
    terrain, and high surveillance near Denver; he describes GPS and t-birds as central
    to the route and contrasts them with surface vehicles or other low-altitude aircraft.
    No source stat line or target number is given in these pages.
  difficulty_and_opposition: Yeager rates this among the most difficult North American
    routes after the Aztlan corridor. He attributes threats to Sioux patrols, UCAS
    and Pueblo security forces, the Omaha military complex, Mafia rivalries and heavily
    defended Denver approaches; his assessment is not presented as universal GM fact.
  notable_pilots:
  - name: Eddie R.
    alias_source: Uses the name of Eddie Rickenbacker, the World War I American fighter
      ace
    account: Yeager calls Eddie R. the oldest active rigger on this corridor; describes
      him as an event organizer and a regular at the Last Chance Chicken Roost.
  - name: Right Stuff
    account: Yeager describes this pilot as a hotshot from Ute country with numerous
      hidden stops and contacts.
  scope_and_precision: Historical fictional setting-reference route, without actual
    GM game modifiers, quantified tests, cargo values, prices or Third Edition mechanics
    on pp84–86.
