summary: >-
  Source-reviewed attributed remarks about discrimination, smuggling-market
  reputation and Mafia employment from the fictional Shadowrun tabletop
  supplement Target: Smuggler Havens, published by FASA Corporation (FASA7215,
  1998, source.fasa-7215; printed pp14-15/PDF15-16). In-world speaker allegations
  and satire are kept distinct from Toshi Akimura's narrator claims and actual-world events.
data:
  continuity:
    page_14: The opening Shadowtalk comments on printed p14 continue the preceding p13 discussion of metahuman social acceptance, before the separate NOPS section begins.
    page_15: The named comments on printed p15 accompany the opening goods-and-vice material and Crescent City Mafia discussion, not the preceding NOPS allegations.
  speaker_claims:
    - speaker: KnightMare
      printed_page: 14
      report: Questions whether a few days of temporary tolerance during Mardi Gras can offset years of rejection; this is personal opinion, not measured community sentiment.
      certainty: Attributed rhetorical comment.
    - speaker: Face
      printed_page: 14
      report: Describes a Black ork named Brick who allegedly enters establishments hostile to orks, presents himself politely until mistreated, then causes a disturbance before security removes him; Face interprets this as Brick challenging racism. The anecdote is not independently verified.
      certainty: Attributed anecdote, not narrator-certified behavior.
    - speaker: PoBoy
      printed_page: 14
      report: Alleges that Councilman Rainier D'Arcy, described as an elf, visibly reacted with disdain to an ork child during a staged campaign visit to a homeless shelter; PoBoy interprets the politician's conduct as prejudice, not a demonstrated legal finding.
      certainty: In-world allegation about a fictional officeholder.
    - speaker: Sun King
      printed_page: 14
      report: Reports experiencing little harassment while frequenting tourist-oriented parts of the French Quarter; identifies himself as a troll. Delta Angel replies humorously rather than proving a broader trend.
      certainty: Subjective experience, not a citywide demographic claim.
    - speaker: Delta Angel
      printed_page: 14
      report: Jokes that bystanders might be afraid of Sun King, without presenting an independently verified explanation.
      certainty: Satirical reply.
    - speaker: Muddy Waters
      printed_page: 15
      report: Warns that a fictional employer or Johnson may object to unapproved extra cargo; this is character commentary about the preceding smuggling discussion and is not game procedure or real-world advice.
      certainty: Fictional trade opinion, no target number or modifier.
    - speaker: Clean Gene
      printed_page: 15
      report: Reacts skeptically to the illicit businesses listed by Toshi Akimura, questioning the narrator's self-description as an ordinary businessman.
      certainty: Attributed skeptical remark, not independent accusation.
    - speaker: Godfather
      printed_page: 15
      report: Claims Mafia employment can pay better than some corporate jobs and entails continued organizational loyalty and protection; the speaker's praise is personal advocacy, not an established universal employment rule.
      certainty: In-world opinion.
    - speaker: Skylark
      printed_page: 15
      report: Replies that Mafia members cannot simply leave when dissatisfied and may face fatal retaliation for trying; this is the speaker's contrasting fictional-world claim.
      certainty: Attributed warning, not verified consequence in every case.
  interpretation: These comments belong to a published fictional setting; the separate NOPS discussion is preserved in its own source-reviewed Shadowtalk record.
  mechanics: No printed dice test, target number, weapons statistic, or equipment cost is supplied by these comments.
framing: newsroom_neutral
