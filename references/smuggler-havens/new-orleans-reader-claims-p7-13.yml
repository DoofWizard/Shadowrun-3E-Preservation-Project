id: reference.smuggler-havens.new-orleans-reader-claims-p7-13
record_type: reference
status: ingested
source: source.fasa-7215
printed_pages: 7-13
pdf_pages: 8-14
edition_scope: FASA Shadowrun fictional sourcebook (1998), historical in-world Shadowtalk
  and narrator claims; no SR3 conversion inferred
content_class:
- attributed_claim
headline: 'Attributed fictional Shadowrun New Orleans commentary — FASA Corporation,
  Target: Smuggler Havens (FASA7215, 1998), printed pp7–13/PDF8–14'
summary: 'Named in-world speakers and their unverified or disputed comments about
  the fictional city in FASA Corporation''s Shadowrun tabletop supplement Target:
  Smuggler Havens (FASA7215, 1998; source.fasa-7215), printed pp7–13/PDF8–14. The
  speakers'' assertions are separated from Toshi Akimura''s narrator claims and are
  not presented as real-world observations.'
data:
  editorial_entry:
    printed_page: 7
    speaker: Captain Chaos
    claim: Introduces Toshi Akimura as a local guide, states that New Orleans is widely
      regarded as a CAS smuggling center, and invites additional reader information.
    certainty: In-world editorial introduction and solicitation, not universal confirmation.
  local_economy:
    printed_pages: 10-11
    speaker: Captain Chaos
    claim: Speculates that the CAS authorities may tolerate New Orleans' informal
      economy because of the financial benefits; explicitly identifies that inference
      as opinion.
    certainty: Stated personal conjecture, not established government policy.
  Cross_Applied_Technologies:
    printed_page: 11
    speaker: Laffite
    claim: Reports circulating suspicions about friction between Toshi Akimura and
      Cross Applied Technologies, with no substantiating incident established in this
      passage.
    certainty: Attributed rumor, not canonical proof of wrongdoing.
  regional_travel:
    printed_pages: 11-12
    speaker: Swamp Rat
    claim: Prefers shallow-water boats and swamp buggies to hovercraft for certain
      bayou conditions and recounts difficulty in wetlands travel.
    certainty: In-world first-person experience, not an equipment-stat or movement-modifier
      rule.
  bayou_navigational_comment:
    printed_page: 11
    speaker: Nowhere Girl
    claim: Says local terrain and waterways can change and that local guides and detailed
      area knowledge matter for navigation.
    certainty: Attributed local perspective, not a defined game skill test.
  Louisiana_local_courts:
    printed_page: 12
    speaker: Bayou Babe
    claim: Offers a skeptical opinion about local court impartiality.
    certainty: Character opinion, not factual proof of judicial conduct or legal advice.
  New_Orleans_local_connections:
    printed_page: 12
    speaker: Duked Out
    claim: Claims personal or social connections can affect how certain local disputes
      are handled.
    certainty: Attributed anecdote, not an independently verified procedural rule.
  occult_bayou_discussion:
    printed_page: 13
    speakers:
    - Swamp Rat
    - Fisher
    - Magister
    claims:
    - Swamp Rat recounts a nocturnal bayou experience involving unusually large and
      possibly supernatural activity without asserting definite identification.
    - Fisher repeats rumors about unfamiliar swamp-associated creatures and spirits.
    - Magister suggests a supernatural explanation, not a confirmed identification.
    certainty: Contrasting subjective accounts and speculation in the fictional Shadowrun
      setting.
  community_attitudes:
    printed_page: 13
    speakers:
    - Aunt NOLA
    - Jongoleur
    claims:
    - Aunt NOLA describes prejudice and political tensions regarding metahuman residents
      in the city; these are the speaker's perceptions, not a uniform population census.
    - Jongoleur states that Mardi Gras temporarily blurs ordinary social divisions
      and disguises identities, without establishing that all conflict ceases.
    certainty: Two named in-world reader perspectives.
  nonverbatim_method: These are paraphrases of published fictional statements, not
    contemporary allegations about actual people or universal game mechanics.
framing: newsroom_neutral
