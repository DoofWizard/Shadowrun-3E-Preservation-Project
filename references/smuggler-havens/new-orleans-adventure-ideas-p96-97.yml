data:
  heading: Adventure Ideas — Crescent City
  status: All three examples are optional fictional game-master scenarios; no event is asserted as canon history
    or offered as practical real-world advice.
  mafia_zombies:
    characters: Pamela Rodenbush; the Mossino Mafia family; Dona Kozlowski; Don Carlo “Silverhand” Mossino; the
      Zobops.
    initial_setup: A representative of the Mossino family hires fictional runners to get a bio-sample from Pamela
      Rodenbush to establish her parentage. The family wants to understand whether she is an heir to Dona Kozlowski.
    complication: Pamela disappears before the team reaches her. Dona Kozlowski and the Mossinos suspect the runners
      (and possibly one another).
    later_status: Pamela appears a week later lifeless, distracted and exhibiting signs that she may be an animated
      dead or biological zombie.
    competing_motives: Don Carlo hopes to remove Pamela from the Mafia succession; Dona Kozlowski wants the biological
      heiress restored; the Zobops want to damage the Mafia internally.
    player_dilemma: The source leaves who is responsible and whether Pamela can be cured open to game-master determination;
      the faction choice risks enmity.
  rebel_with_a_cause:
    characters: An arms dealer using the name Santiago; Aztlan rebel contacts; Aztechnology agents.
    initial_setup: An optional fictional job involves escorting a shipment of weapons down the Mississippi to
      the outskirts of New Orleans for a meeting with a contact supporting rebels in the Yucatan; Santiago accompanies
      the crew.
    reversal: Aztechnology is conducting a sting operation; its agents kill Santiago and seek to track the equipment
      to its source.
    alternate_outcomes: The runners may try to protect the rebel contact, avoid capture, cooperate with Aztechnology
      at reputational cost, or arrange a separate transaction; the book does not establish a single outcome.
  voodoo_moon:
    characters: Unnamed dying houngan; the specter La Malice; historical unnamed plantation owner; enslaved victims.
    initial_setup: The runners traverse fictional Louisiana bayous to meet an elderly houngan at an old manor
      threatened by swamp encroachment.
    historical_coercion: The scenario says the former plantation mistress possessed magical ability and forcibly
      extracted occult secrets from enslaved people knowledgeable about voudoun. This coercion is explicitly source-attributed
      and not recast as voluntary teaching.
    supernatural_premise: Her specter La Malice remains active. The dying houngan wants the runners to obtain
      an anchor from a nearby graveyard so he can banish the specter before his death.
    optional_rewards: Silver and gold coins, antiquities, family heirlooms, possibly a magical item or two at
      GM discretion.
    power_and_opposition: The source describes the specter La Malice as equal in power to a Force 6 free spirit with Spirit Energy
      2 and Sorcery, and says she controls a pack of ghouls living in the bayou and uses them to attack the
      runners. These are optional fictional game-master encounter specifications, not real-world threats.
