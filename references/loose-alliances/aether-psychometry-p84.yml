headline: 'Loose Alliances (FanPro25006, FanPro, SR3), fictional Shadowrun printed/PDF p84: reported exceptional psychometry-like talent'
data:
  publication: {title: Loose Alliances, publisher: FanPro, edition: SR3, catalog: FanPro25006}
  speaker: Elijah, fictional chapter narrator (byline printed/PDF p72)
  subject: Aether, individual fictional adept
  reported_initiation: Uninitiated
  reported_astral_perception: Capable
  reported_talent: Apparently innate aptitude resembling psychometry, for examining artifacts, people and places.
  reported_temporal_reach: Elijah believes she can receive impressions from places thousands of years old, exceeding what he describes as the normal few-decades barrier.
  uncertainty: Elijah explicitly does not know how the apparent exception works.
  lineage: State of the Art 2063 (FanPro10664) printed pp49-50/PDF50-51 specifies initiation and astral perception prerequisites and an impression-age target-number table with increases for additional decades, not a hard maximum age. The later account of this individual is not an amendment to that table or a general initiation exception. Compare option.magic.metamagic-psychometry.
  scope: No test, target number, cost, technique acquisition method or universal temporal limit is specified for this individual.
