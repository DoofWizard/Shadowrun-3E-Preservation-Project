headline: 'Loose Alliances (FanPro25006, FanPro, SR3), printed/PDF pp75-76: fictional surveying capabilities, magic limitations and diving proficiency'
data:
  publication: {title: Loose Alliances, publisher: FanPro, edition: SR3, catalog: FanPro25006}
  elijah:
    survey_methods: [geomagnetism, georadar, geoconductivity, electric induction]
    composite_imaging: Field computers combine readings for detailed subsurface imaging; most sensors can be carried by drones.
    magic_limitations:
      astral_projection: Limited through solid earth.
      earth_spirits_and_elementals: Unable to distinguish natural and constructed formations after thousands of years.
      detection_spells: Generally little better for that task.
      exceptions: Strong magical auras or astral distortions can make magical assistance valuable; dowsing and sensing are described as useful.
    submerged_sites: Limited visibility, buoyancy, underwater hazards and equipment limits complicate excavation; underwater archaeologists and excavators need diving proficiency, especially at depth.
  goblin_boy: Reports use of magicians to examine auras and catalogue finds, and spirits to assist with excavation, water diversion and weather protection.
  warentester: Describes fictional Eyes-Through-Walls 3D and Seismotron equipment for locating concealed spaces and cautions about possible security sensor activation.
  scope: In-world qualitative claims, not a new spell rule, equipment stat block, numerical depth limit, specified minimum skill rating or automatic success.
