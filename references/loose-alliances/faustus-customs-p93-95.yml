headline: 'Fictional Shadowrun reference, Loose Alliances (FanPro25006, FanPro, SR3), printed/PDF pp93-95: Dr. Faustus Society recruitment and customs'
data:
  publication: {title: Loose Alliances, publisher: FanPro, edition: SR3, catalog: FanPro25006}
  narrator: Marcel Black, fictional contributor
  recruitment:
    pages: '93-94'
    practice: Agents recruit talented young men on streets and at universities; the society sponsors study circles and selects the strongest candidates from them.
  initiation:
    page: 94
    obligation: An oath of service including a promise to help new mages begin their studies.
    secrecy: Warlock claims members must not repeat the oath to outsiders.
  admission_discrepancy:
    page: 94
    prohibition: Warlock reports a prohibition on female members.
    exception: She-devil reports rare admission of women who demonstrate exceptional ability and finance themselves.
    scholarship: She-devil says none of the few admitted women has received a society scholarship.
  employment:
    page: 94
    expectation: University thaumaturgy or lucrative corporate research employment.
    income_contribution: Bylaws require members to contribute an unspecified portion of income to fund scholarships and other society activities.
  patron_loyalty:
    page: 95
    speaker: Devil's Paw
    claim: Acting against AG Chemie Europa in any capacity is considered taboo.
  hiring_assistance:
    page: 95
    speaker: Prof. M
    condition: A fellow Faustian applies for a position at the member's company.
    expectation: The member is expected to help the applicant secure employment.
  scope: Attributed fictional customs and conflicting accounts, not an additional universal stricture, guaranteed scholarship or job, or quantified income levy. Formal p155 dues and hermetic eligibility remain separate.
