headline: 'Fictional Shadowrun reference, Loose Alliances (FanPro25006, FanPro, SR3), printed/PDF p93: Golden Acorn admissions and training'
data:
  publication: {title: Loose Alliances, publisher: FanPro, edition: SR3, catalog: FanPro25006}
  organization: Golden Acorn Society
  claims:
    - speaker: Marcel Black
      school: Open membership; class participation requires payment of dues.
      magical_group: Admission involves multiple challenges; being an adept is advantageous. The first challenge requires defeating the lowest-ranked member of the order in a duel. Black could not establish the other challenges.
      training: Initiates must attend Chan's weekly dojo training. On school grounds members must wear the traditional uniform and obey higher-ranking members. Initiated members teach the school's classes; class fees support school and order.
    - speaker: Arlo
      second_challenge: Follow a subject selected by Chan for one entire day without being noticed; society members follow the applicant in turn. Detection by the subject means failure.
    - speaker: Dancer
      rank: Non-Awakened members participate in the hierarchy; a mundane black belt may outrank a new initiate, but the speaker expects the initiate eventually to surpass the mundane.
  scope: Attributed fictional admission and training conditions; no dice pool, target number or fee amount specified here. Formal group eligibility and strictures are separate on pp154-155.
