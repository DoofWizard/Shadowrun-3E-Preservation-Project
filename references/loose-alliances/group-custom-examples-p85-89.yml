headline: 'Loose Alliances (FanPro25006, FanPro, SR3), fictional Shadowrun printed/PDF pp85-89: attributed admission, stricture and patron examples'
data:
  publication: {title: Loose Alliances, publisher: FanPro, edition: SR3, catalog: FanPro25006}
  narrator: Marcel Black, fictional contributor
  admission:
    page: 85
    examples:
      - {group: Society of Archmagi, speaker: Marcel Black, claim: Shamans are not admitted.}
      - {group: Bonesetters, speaker: Marcel Black, claim: An ork seeking healing instruction was refused because the group restricted membership to humans; Black reports a concealed Humanis sponsorship and affiliation.}
      - {group: Cross-sponsored group, speaker: Kham, claim: Admission is difficult for an employee of Yakashima.}
      - {group: Shamans of Shasta, speaker: Kham, claim: Prior affiliation with Children of the Dragon precludes admission.}
    possible_screening: Ability demonstrations, background and reference checks, or magical mind scans; some groups recruit rather than accept applicants.
    avatar_consultation: {page: 86, speaker: Magister, claim: Some groups consult their avatar before admitting members.}
  black_admission_example:
    page: 86
    group: Illuminates of the New Dawn
    sponsor: Member in good standing
    number_of_tests: 2
    tests: [Written examination, Practical demonstration of magical ability]
    practical_condition: Black reports having to demonstrate control and finesse rather than relying on his usual Powerball spell.
    scope: Personal admission account; no numerical target, cost or universal test prescribed.
  faustus_promotion:
    page: 86
    speaker: Hierophant
    claim: Association with shadowrunners is reported to lower a member's promotion priority, not to cause expulsion.
  jane_stricture_example:
    page: 87
    speaker: Marcel Black
    violation: Jane gave magical assistance to a non-Wiccan despite her coven's stricture.
    required_remedy_reported: The coven told Jane that taking a geas was the only remedy.
    scope: A reported individual demand, not a generally required remedy for stricture breaches.
  changed_customs:
    page: 88
    knights_of_rage: {speaker: Marcel Black, former_requirement: Membership in a London street gang, change: Requirement dropped after Celedyr became involved.}
    united_talismongers_association: {speaker: Winterhawk, claim: The association reportedly added an oath of silence after several members were arrested on suspicion of talislegging.}
  shasta_patron:
    page: 89
    speaker: Marcel Black
    patron: Hestaby
    reported_obligations: [Oath of loyalty, Annual pilgrimage to Hestaby's home on Mount Shasta]
  lineage: Formal joining, resources, group link and strictures remain governed by Magic in the Shadows pp62-68; avatars are addressed there on p69. These fictional accounts provide group-specific examples rather than additional dice tests or automatic consequences.
