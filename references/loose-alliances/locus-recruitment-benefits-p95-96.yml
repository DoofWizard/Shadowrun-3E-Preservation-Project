headline: 'Fictional Shadowrun reference, Loose Alliances (FanPro25006, FanPro, SR3), printed/PDF pp95-96: Locus Elementum recruitment and employment'
data:
  publication: {title: Loose Alliances, publisher: FanPro, edition: SR3, catalog: FanPro25006}
  narrator: Marcel Black, fictional contributor
  screening:
    page: 95
    subjects: [Prospective members, Subcontractors, Clients]
    method: Renraku computer checks.
    qualification: Black warns readers to expect a Red Samurai visit if a file is flagged.
  admission:
    page: 95
    condition: Applicants are accepted only if they can perform a major service for the group.
    examples: [Publishing innovative magical research, Devising a new spell formula, Acquiring a rare or highly valuable magical item]
  structure:
    page: 95
    disciplines: [Hermetic, Shamanic, Somatic adept, Wuxing]
    leadership: Each discipline has a steward directing projects related to its tradition.
  employment_terms:
    page: 96
    speaker: The Chromed Accountant, fictional commentator
    ownership: Inventions and discoveries made by Locus employees while on payroll belong to Locus and thus Renraku.
    royalties_or_personal_credit: None for those inventions or discoveries, according to the commentator.
    reported_benefits: [Personal platinum company credstick, Unlimited travel funding, Complete healthcare coverage, Access to top-level magic facilities, Access to enchanting and research facilities]
  scope: Attributed fictional recruitment and employment practices; formal stipend, facility ratings and strictures remain in the separate p155 group option. No new screening test, service price or resource rating specified here.
