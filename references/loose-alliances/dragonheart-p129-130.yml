data:
  publication: {title: Loose Alliances, publisher: FanPro, edition: SR3, catalog: FanPro25006}
  talon:
    page: 129
    reported_type: Ancient power focus
    reported_compatibility: Works equally well for hermetics and shamans.
    reported_bonding: No bonding required for this particular artifact.
    reported_limit: Talon believes it was not designed for metahuman use and that only a handful of people have sufficient magical mastery to use it.
  half_elven:
    page: 130
    reported_effect: Attributes Mercury's Awakening to the artifact.
    reported_perception: Magically active individuals near it can sense its power.
    reported_disposition: Disappeared soon after Mercury's transformation.
  uncertainty:
    page: 129
    speaker: Bonez
    claim: The identity of the heart left to Mercury and whether he retains it are uncertain.
  lineage: Magic in the Shadows pp46-47 permits scenario-specific unique enchantments; these later attributed properties are not a general focus rule or an established supersession. Other Dragonheart-specific source lineage remains unadjudicated.
  scope: No quantified Force, test, distance, mastery threshold or reproducible Awakening procedure is given; no general bonding exception is established.
