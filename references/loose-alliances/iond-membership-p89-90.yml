headline: 'Loose Alliances (FanPro25006, FanPro, SR3), fictional Shadowrun printed/PDF pp89-90: IOND membership, obligations and access'
data:
  publication: {title: Loose Alliances, publisher: FanPro, edition: SR3, catalog: FanPro25006}
  narrator: Marcel Black, fictional contributor
  magical_membership: Hermetics only; members are expected to endorse magocratic progressivism as part of their oath of service.
  outer_order:
    page: 89
    approximate_supporters: 3000
    membership: Predominantly non-Awakened supporters; significant social or economic power is now key to admission.
    former_requirement: Membership in the New Century Party was formerly required but is no longer required.
    dues: Described as exorbitant, without a specified amount.
    honorary_ranks_for_non_awakened: [Novitiate, Minerval, Magistrate]
  inner_order:
    page: 89
    estimated_members_range: [500, 700]
    mentor: A Magistrate is assigned as mentor to a newly admitted mage; initiates belong to mentor circles.
    restricted_access: Certain basement rooms in the mansion are accessible only to members accepted as a true Illuminatus.
    higher_mysteries_ranks: [Lesser Illuminatus, Master Illuminatus, Magus]
    material_link: Black reports that he is no longer bound by his oath but that the order retains a material link that could be used against him if he speaks.
  obligations:
    page: 90
    oath: Members pledge priority to magical science, the organization over family or friends, and secrecy.
  scholarships:
    page: 90
    speaker: BethSheba
    claim: International scholarship fund covers educational costs for nearly three dozen hermetic students each year.
  annual_meeting:
    page: 90
    speaker: Scarlet Rat
    claim: Yearly meeting for the entire Inner Order sets policies and recognizes new initiates.
  lineage: Magic in the Shadows p68 gives a formal example profile with 500 worldwide members, a maximum of 12 per circle and monthly dues of 200 nuyen. Loose Alliances p154 explicitly refers to that profile, allows non-Awakened members and specifies ideological support. The later attributed estimates and unspecified Outer Order dues are retained separately without replacing the earlier formal statistics.
  scope: Attributed fictional organizational practices, not an additional universal admission test, quantified Outer Order dues, automatic scholarship entitlement or replacement of formal strictures.
