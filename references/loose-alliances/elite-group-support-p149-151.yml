headline: 'Loose Alliances (FanPro25006, FanPro, SR3), fictional Shadowrun pp149-151/PDF149-151: elite-group campaign affiliation and resource guidance'
data:
  publication: {title: Loose Alliances, publisher: FanPro, edition: SR3, catalog: FanPro25006}
  elite_groups:
    printed_page: 149
    ordinary_affiliation: Runners are unlikely to be members; they may instead act as agents or intermediaries, sometimes without knowing the ultimate sponsor.
    conditional_support_examples: [background information, contacts, difficult-to-obtain equipment, shadowclinic time]
    trusted_team: Experienced and qualified teams may gain an in-house position or a retainer, with access to the employer's resources and an expectation of availability when needed.
    tradeoff: Loyalty to a sponsor can expose the team to rival interests; support can be withdrawn and a sponsor may treat outside agents as expendable.
    source_cross_reference: "Mr. Johnson's Little Black Book, Running High-Level Campaigns, printed p118/PDF119."
    related_guidance: reference.mjlbb.high-level-campaign-guidance-p118-119
    related_creation_option: option.mjlbb.high-level-creation-p119
  aristocrats_cabal:
    printed_page: 151
    affiliation: Characters may work as agents or sympathizers for particular families or alliances. Full membership is unlikely, although a character may be related to a family or be a minor noble.
    employment: The book describes honor, loyalty and talent as valued and earning respect as a basis for continued, profitable but potentially dangerous employment.
    fixed_qualification_or_payment: null
  scope: Discretionary fictional campaign arrangements; no fixed fee, guaranteed equipment ownership, numerical entry threshold or independent test is prescribed.
  related_general_support: option.la.organizational-contact-support-p136-138
