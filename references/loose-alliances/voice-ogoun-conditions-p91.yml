headline: 'Fictional Shadowrun reference, Loose Alliances (FanPro25006, FanPro, SR3), printed/PDF p91: Voice of Ogoun membership obligations'
data:
  publication: {title: Loose Alliances, publisher: FanPro, edition: SR3, catalog: FanPro25006}
  speaker: Marcel Black, fictional contributor
  membership:
    belief: Voudoun
    required_conditions:
      - Members must not speak ill of the head houngan.
      - Members promise to follow the head houngan's leadership.
      - Members must not disrespect their parents.
      - Members must not commit adultery.
      - Members must not slander fellow houngans.
  worship_services: Houngans and mambos must hold services for non-Awakened believers.
  initiatory_hierarchy: Initiates are equal in rank except for the head houngan, who outranks the others.
  reported_discipline:
    speaker: White Hat, fictional commentator
    trigger: Violation of any one of the Five Conditions.
    claim: White Hat alleges that the other members torture violators before expelling them from the group.
  scope: Attributed fictional practices of the Voice of Ogoun, not an additional universal magical stricture or prescribed damage rule. Formal p154 options for both factions remain separate.
