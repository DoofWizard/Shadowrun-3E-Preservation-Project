data:
  publication_context: 'Original FASA Corporation (1994) fictional Shadowrun Second
    Edition-era tabletop role-playing sourcebook Denver: The City of Shadows, FASA7212/source.fasa-7212,
    printed pp48-49, nominal PDF pp49-50.'
  section: Shadowland speaker posts on the Denver Free Zone Administrative Branch,
    Council, VAT, income tax and national tax interpretation
  claims:
  - speaker: Hauberk
    printed_page: 48
    date_as_printed: 12:35:13/5-29-55
    claim: The fictional Shadowland poster characterizes the Administrative Branch
      as an autonomous, self-perpetuating bureaucracy that prioritizes its own survival
      and growth; this characterization is an in-world opinion rather than narrator-established
      motive.
  - speaker: Billiam
    printed_page: 48
    date_as_printed: 00:03:00/6-1-55
    claim: Billiam argues that administrative autonomy has prevented national interests
      from undermining the Free Zone infrastructure and speculates that the original
      treaty commission intended that result.
  - speaker: Honey
    printed_page: 48
    date_as_printed: 06:55:21/6-6-55
    claim: Honey angrily criticizes the subcommittee for failing to prevent the bureaucracy
      from expanding while taxes fund the salaries and expenses of more functionaries.
  - speaker: Lennox
    printed_page: 48
    date_as_printed: 23:50:18/6-7-55
    claim: Lennox explains his interpretation that the subcommittee may de-SIN an
      employee deemed partisan, but otherwise lacks power to interfere in appointments
      or job performance when the partisan criteria are not met; this is an attributed
      institutional interpretation.
  - speaker: Ragnarok
    printed_page: 48
    date_as_printed: 03:50:57/5-29-55
    claim: Ragnarok calls taxation theft, expressing an in-world political judgment.
  - speaker: Eagle
    printed_page: 48
    date_as_printed: 03:05:56/5-31-55
    claim: Eagle sarcastically suggests that the authorities cannot enrich themselves
      without taxing the citizenry; the rhetorical remark is not a neutral endorsement
      of taxation.
  - speaker: Libbie
    printed_page: 48
    date_as_printed: 09:01:37/5-28-55
    claim: Libbie expresses surprise that Shadowland participants would pay taxes.
  - speaker: Kwan the Oppressor
    printed_page: 48
    date_as_printed: 10:00:31/5-28-55
    claim: Kwan maintains that the 10 percent VAT is embedded in ordinary legitimate
      purchases and expenses, citing food, rent and utilities; even people without
      a SIN who may avoid income tax still pay sales-related taxes. The examples are
      attributed commentary.
  - speaker: Watchdog
    printed_page: 48
    date_as_printed: 11:04:50/6-7-55
    claim: Watchdog says some sellers include VAT in their posted price and others
      add it at checkout; alleges some sellers do both and calls such double charging
      unlawful. The narrator separately states that failure by a business to charge
      VAT is a felony, which is not the same claim.
  - speaker: Billiam
    printed_page: 49
    date_as_printed: 02:39:58/6-8-55
    claim: Billiam offers a fictional vehicle-price example for the Volkswagen
      Elektro Triwheel Commuter listed at 7,200 nuyen in the Pueblo Sector with
      720 nuyen VAT, for a total of 7,920 nuyen. He says the same model would
      list for 8,000 nuyen in Seattle; his Seattle figure is attributed hearsay,
      not narrator-established pricing.
  - speaker: Zinger
    printed_page: 49
    date_as_printed: 10:41:32/6-8-55
    claim: Zinger makes a sarcastic nostalgic reference to an earlier eight percent
      sales tax; the remark does not change the narrator-established Free Zone VAT
      rate.
  - speaker: Bean Counter
    printed_page: 49
    date_as_printed: 16:10:52/5-27-55
    claim: Bean Counter claims that UCAS and CAS nationals may owe their home-country
      taxes later because income earned in the Free Zone is deferred rather than exempt
      for those states; his hypothetical million-nuyen earnings example uses the separate
      15 percent RTS income tax. This remains a named commentator interpretation,
      not a narrator-established treaty exception.
  - speaker: Crystal
    printed_page: 49
    date_as_printed: 06:08:05/6-1-55
    claim: Crystal says readers without SINs likely do not pay the Free Zone income
      tax and therefore need not be concerned; the remark is a fictional speaker assertion,
      not an official exemption.
  - speaker: Honest-As-the-Day-Is-Long
    printed_page: 49
    date_as_printed: 00:03:45/6-5-55
    claim: The speaker responds that some Shadowland users do have SINs and that presenting
      oneself as an honest business person can confer advantages, including through
      paying taxes and VAT registration; a stated personal strategy, not an authoritative
      tax rule.
  attribution_notes: The original pp48-49 give fourteen individually signed posts,
    including Crystal and Honest-As-the-Day-Is-Long. Distinguish every named speaker
    from the printed book narrator and from the separate statutory tax record.
framing: newsroom_neutral
headline: 'Fictional Shadowland tax and bureaucracy speaker claims in FASA Corporation
  Denver: The City of Shadows (1994, Shadowrun Second Edition, FASA7212), printed
  pp48–49/PDF49–50'
summary: 'Source-reviewed attributed claims from the 1994 fictional Shadowrun Second
  Edition tabletop RPG Denver: The City of Shadows (FASA Corporation, FASA7212/source.fasa-7212),
  printed pp48–49/PDF49–50. Preserves all fourteen signed posts, including Crystal
  and Honest-As-the-Day-Is-Long, corrects Eagle and Lennox attribution details and
  keeps Watchdog commentary separate from the narrator’s VAT felony classification.'
