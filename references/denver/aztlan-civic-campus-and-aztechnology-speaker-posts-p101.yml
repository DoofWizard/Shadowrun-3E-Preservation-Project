data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212; source.fasa-7212),
    fictional Shadowrun Second Edition-era tabletop sourcebook (1994), original printed
    p101/PDF p102; not a Third Edition conversion.'
  section: Aztlan Sector — named Shadowland comments on Council Guard, Capitol, Conservatory,
    campus, Teocalli and Aztechnology headquarters
  named_shadowland_speaker_statements:
  - speaker: Chip Doctor
    type: political allegation
    claim: Claims Aztlan uses the explanation of tiered Council security duties to
      station Aztechnology Corporate Security Force commands around the Council Guard
      as an outer perimeter, thereby applying psychological pressure to Council members;
      this is the speaker’s interpretation, not a narrator-verified policy.
  - speaker: Lennox
    type: historical reminiscence and regret
    claim: Describes the previous Capitol building as important architecture; claims
      its dome was made from real gold contributed by Colorado miners, with the gold
      removed around 1950 and replaced by a new layer, and laments the building’s
      demolition. The speaker does not explain where the removed gold went.
  - speaker: Trip
    type: unanswered question
    claim: Asks what happened to the removed historic Capitol gold; does not assert
      a destination.
  - speaker: Margeson
    type: building-security allegation
    claim: Claims the new State Capitol basement holds most Council Administrative
      Branch computing resources and is very heavily guarded; no building plan or
      verified security rating is given.
  - speaker: Miller
    type: reported botanical properties
    claim: Claims some Conservatory plants have pharmaceutical properties, including
      intoxicating and poisonous substances, and reports acquaintances among magicians
      and shamans who say some specimens have magical uses. These are fictional sourcebook
      allegations, not real-world botanical advice.
  - speaker: Caligula
    type: inference
    claim: Infers that the claimed properties of Conservatory plants might explain
      a recent security increase, without independently confirming its purpose.
  - speaker: Lennox
    type: local nickname
    claim: Says high fences around Anáhuac University led locals to nickname it “Stalag
      Aztechnology”; this is an attributed derogatory nickname, not its official title.
  - speaker: Firelight
    type: personal observation and interpretation
    claim: Describes the Aztec Teocalli at map location 52 as a temple on the former
      St. Thomas Seminary grounds near the Intercity 25 crossing into the CAS Sector.
      Reports a roughly 25-story visible structure with more levels beneath, an exposed
      flat upper platform and a downward path to the interior; conjectures that it
      serves multiple Aztec deities rather than only one. Reports a friend who abruptly
      departed while astrally perceiving the site, claiming the experience was painful.
  - speaker: Firelight
    type: report of architecture and unverified attacks
    claim: Places the Aztechnology Building (map location 53) on the old Denver Country
      Club site near University and Speer, describes it as roughly 50–60 stories high
      and extending west almost to Cherry Creek, with a sandstone base, copper-and-gold
      glazing, at least four rooftop helipads, and heavy protection. Reports several
      apparent attacks, including one alleged missile impact on the 32nd floor, and
      suggests newly installed rooftop laser anti-missile equipment whose effectiveness
      nobody has yet tested to the speaker’s knowledge. These remain attributed claims
      and contain no precise game combat or defensive ratings.
  epistemic_scope: All listed statements are voiced by named fictional speakers. The
    original page distinguishes questions, rumors, conjecture, reported recollections,
    subjective assessments and narrator-established sites.
