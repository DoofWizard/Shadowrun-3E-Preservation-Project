  section: CAS Sector speaker commentary on borders, defenses and demographics
  named_in_world_claims:
  - speaker: Peter Trilanka, CAS Office of Industrial Security
    printed_page: 102
    claim: Warns prospective visitors away from the sector using hostile language;
      this is a named in-world statement rather than publication narrator fact.
  - speaker: Trajan
    printed_page: 104
    claim: Criticizes downtown boundary alignment and says the CAS perimeter is too
      long to defend effectively.
  - speaker: Lennox
    printed_page: 104
    claim: Dismisses committee-driven boundary decisions; the comment follows Trajan’s
      question about demarcation geometry.
  - speaker: Boskone
    printed_page: 104
    claim: States from personal experience that CAS security personnel do not hesitate
      to use attack-trained dogs.
  - speaker: unnamed commenter within page
    printed_page: 104
    claim: Alleges advanced sensors and landmines on the CAS–Pueblo border and describes
      a small buried acoustic-detection air-defense device. This is attributed fictional
      speculation, not established equipment data, a rules procedure or implementation
      guidance.
  - speaker: Daryl
    printed_page: 104
    claim: Calls the alleged devices Underground-to-Air Missiles, or UAMs.
  - speaker: Trisha
    printed_page: 104
    claim: Questions whether the preceding UAM account is credible.
  - speaker: Zak
    printed_page: 104
    claim: Adds speculative claims about the missiles’ aerial pursuit behavior and
      limitations.
  - speaker: Pal
    printed_page: 104
    claim: Suggests a defensive recognition-code distinction in the speculative UAM
      conversation; this is not narrator-confirmed or playable game-mechanics instruction.
  - speaker: Urquart
    printed_page: 104
    claim: Responds skeptically to Pal’s statement.
  - speaker: Link
    printed_page: 104
    claim: Believes CAS lacks adequate magical and astral border-defense presence.
  - speaker: Moraya
    printed_page: 104
    claim: Disputes Link’s implication that the situation is static.
  - speaker: Firelight
    printed_page: 104
    claim: Argues that elite magical defensive resources may be assigned to the border
      even when not obvious to observers.
