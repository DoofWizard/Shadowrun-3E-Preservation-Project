data:
  publication_context: 'Published fictional tabletop RPG sourcebook Denver: The City
    of Shadows (FASA Corporation, 1994; FASA7212 / source.fasa-7212), historical Shadowrun
    Second Edition-era source material. Printed pages and physical PDF pages are distinguished;
    no Third Edition conversion is asserted.'
  section: Named in-world Shadowland remarks on prices, management, immigration and
    security
  named_speakers:
  - page: 92
    speaker: Lori
    claim: Questions why particular cross-border ammunition price differences arise,
      speculating about tariffs that treaty provisions apparently prohibit.
  - page: 92
    speaker: Sutcliffe
    claim: Counters that market structure, firm pricing decisions and access costs
      produce cross-border price differences despite nominal free-trade rules.
  - page: 93
    speaker: Scourge
    claim: Alleges Francisco Valdez previously associated with a Medellín drug cartel
      and is older than his appearance suggests, attributing his appearance to cosmetic
      procedures; the book does not establish these claims as biography.
  - page: 93
    speaker: Talbot
    claim: Rejects Scourge’s allegations and describes Valdez as a respectable businessman.
  - page: 93
    speaker: Grimtooth
    claim: Characterizes the corporate judiciary and lawmaking as unaccountable to
      residents.
  - page: 93
    speaker: Bronco
    claim: Reports extensive street-level security patrols as his observation.
  - page: 94
    speaker: Marg
    claim: Suggests that recognized corporate job sponsorship generally requires Aztechnology
      participation.
  - page: 94
    speaker: Bridge
    claim: Notes that hiring an employee without required immigration status is also
      a felony.
  - page: 94
    speaker: Kerry
    claim: Warns that formal resident-alien status gives work authorization, not citizenship
      rights.
  - page: 94
    speaker: Groucho
    claim: Claims travel passes are issued for tightly specified durations.
  - page: 95
    speaker: Lobo
    claim: Disputes the effectiveness of hand-held ID checks against centralized account
      checks; this is a commentator’s opinion, not a documented system specification.
  - page: 95
    speaker: Scrag’em All
    claim: Alleges civilian fatalities from security use of force and disputes officers’
      accountability.
  - page: 95
    speaker: First Date
    claim: Responds that an officer must establish just cause; source presents competing
      opinions.
  - page: 96
    speaker: Dino
    claim: Offers a competing assessment of burden of proof following security use
      of force.
  - page: 96
    speaker: Gibson
    claim: Claims paranormal critters support inspections at crossing points.
  - page: 96
    speaker: Hardwired
    claim: Characterizes chip and drug restrictions as corporate market control rather
      than only public safety.
  - page: 96
    speaker: Toaster
    claim: Points to laws concerning unlicensed distribution of drugs and chips and
      corporate commercial interests.
  - page: 96
    speaker: Quinn
    claim: Questions the source’s claim that the sector tolerates the trade despite
      harmful products.
  - page: 96
    speaker: HQ
    claim: Speculates about corporate manipulation through local simsense and pharmaceuticals,
      alleging commercial motives without proof.
  - page: 96
    speaker: Lola
    claim: Dismisses the preceding mind-control allegation as recurring paranoia.
  - page: 96
    speaker: Tal Gillgalad
    claim: Mentions an Aztlan-sector liquor named Xtabantun and provides personal
      tasting commentary.
  - page: 97
    speaker: Doc Ock
    claim: Claims illicit clinics operate in the sector; neither location nor services
      are verified by the narrator.
  commentary_warning: None of these attributed Shadowland allegations is converted
    to narrator-established fact. Chronology, contradictions and speakers are retained.
headline: 'Fictional FASA Shadowrun Second Edition-era Denver sourcebook (FASA7212),
  printed pp92–97/PDF pp93–98: Named in-world Shadowland remarks on prices, management,
  immigration and security'
summary: 'Archival attributed_claim record independently reviewed against original
  printed pp92–97 (PDF pp93–98) of FASA Corporation’s fictional 1994 Denver: The City
  of Shadows (FASA7212); distinctions among narrator facts, attributed in-world statements
  and optional play material remain explicit.'
