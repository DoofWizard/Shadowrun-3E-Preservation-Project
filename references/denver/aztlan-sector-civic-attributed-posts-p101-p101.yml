data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212; source.fasa-7212),
    a 1994 historical Second Edition-era Shadowrun fictional tabletop RPG sourcebook'
  original_printed_pdf_page_map: 101/102
  section: Distinct named Shadowland speaker claims, not omniscient narrator facts
  attributed_claims:
  - speaker: Chip Doctor
    claim: Questions whether Aztechnology placement around the Council Guard influences
      councillors psychologically; treats the claim as his interpretation.
  - speaker: Lennox
    claim: Says the old Capitol was historically gilded and alleges the 2048 replacement
      cost the city heritage; separately compares high fences around Anahuac University
      to a penal training camp.
  - speaker: Trip
    claim: Questions the destination of the removed Capitol gold; does not establish
      theft.
  - speaker: Margeson
    claim: Claims the new Capitol basement houses the Administrative Branch computer
      resources and is heavily guarded.
  - speaker: Miller
    claim: Attributes pharmaceutical and purported magical uses to selected Conservatory
      plants and associates; this is a speaker assertion, not a universal mechanic.
  - speaker: Caligula
    claim: Associates security upgrades with the Conservatory without showing independent
      proof.
  - speaker: Firelight
    claim: Discusses alleged attacks on the Aztechnology Building and speculative
      rooftop countermeasures; these remain attributed fictional-world claims.
  - speaker: Lennox
    claim: Describes an Aztec Teocalli near St. Thomas Seminary (map location 52)
      and expresses uncertainty about its rituals and religious significance.
  distinctions:
  - Report speculation explicitly as speculation, preserve each speaker, and do not
    infer that their tactical/security allegations are independently confirmed.
