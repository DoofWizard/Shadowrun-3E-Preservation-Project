data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    published fictional Shadowrun Second Edition-era tabletop-RPG sourcebook; source.fasa-7212;
    no inferred Third Edition conversion.'
  source_context: Historically published in-world fictional setting information; narrator
    facts, attributed Shadowland posts, and hypothetical examples are distinct.
  extraction:
    source_status: Attributed dated fictional Shadowland bulletin-board claims; posts
      conflict and are not sourcebook narrator certainties.
    posts:
    - speaker: Bonkers
      date_printed: 6-3-55
      assertion: Suggests repair of unused airport stations as a hypothetical.
    - speaker: Tenmace
      date_printed: 6-3-55
      assertion: Speculates that UCAS closed off visible subway exits after inactive
        airport platforms.
    - speaker: Darwin
      date_printed: 6-1-55
      assertion: Claims train control software returns the train to Union Station
        rather than entering abandoned western tunnels.
    - speaker: Bronwyn
      date_printed: 6-7-55
      assertion: Rejects the idea of taking obsolete tracks into the west tunnel.
    - speaker: Argent
      date_printed: 6-10-55
      assertion: Observes that stealth and subtlety matter more than power in the
        fictional border environment; Har­d­esty explicitly disagrees then Argent
        concedes in banter.
    - speaker: Little Al
      date_printed: 5-27-55
      assertion: Claims Outer Boundary fence systems do not physically stop a sufficiently
        high-speed flying vehicle.
    - speaker: Firelight
      date_printed: 5-29-55
      assertion: Claims sensor systems monitor breaches even where fences lack electrical
        current; also describes patrol aircraft including Wasps and Yellowjackets.
    - speaker: Gund
      date_printed: 5-30-55
      assertion: Reports encountering an energized fence near the UCAS/Sioux crossing
        and later describes a fatal contact there. This is a first-person claim, not
        a universal energized-fence specification.
    - speaker: Racer X
      date_printed: 6-2-55
      assertion: Offers a hypothetical high-speed transit claim of 300 kph across
        a 30-meter trench in about half a second.
    - speaker: Kargad
      date_printed: 6-3-55
      assertion: Claims weather spirits and astral observers patrol portions of the
        fictional boundary.
    - speaker: Lara
      date_printed: 6-11-55
      assertion: Attributes a frightening border incident to an unexplained psychic
        effect, citing a UCAS report; Samizdata disputes the implication.
    - speaker: El Coyote
      date_printed: 6-5-55
      assertion: Disputes that all sections of the Outer Boundary are continuously
        guarded and asserts the existence of unofficial entry routes; not presented
        here as actionable guidance.
    - speaker: Log One
      date_printed: 6-5-55
      assertion: Claims portions of the border use unpredictable terrain to deter
        passage.
    - speaker: Rec
      date_printed: 6-7-55
      assertion: Identifies retired Sioux Wildcats as possible demarcator personnel,
        emphasizing that treaty restrictions do not imply absence of risk.
    - speaker: Neddy
      date_printed: 5-23-55
      assertion: Raises Treaty prohibition against coercive interference with people
        just outside a sector; legal claim is attributed.
    - speaker: Derek
      date_printed: 6-10-55
      assertion: Calls out megacorporate extraterritorial jurisdiction separate from
        political sectors.
    - speaker: Johnny Z
      date_printed: 5-19-55
      assertion: Estimates that 30–40 percent of a given sector’s fictional population
        works in another sector; this is a named unverified estimate.
framing: newsroom_neutral
