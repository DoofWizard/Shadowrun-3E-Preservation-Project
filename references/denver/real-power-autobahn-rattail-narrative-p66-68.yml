data:
  publication_context: 'Historical fictional tabletop-RPG sourcebook Denver: The City
    of Shadows, FASA Corporation (1994), FASA7212 / source.fasa-7212, Shadowrun Second
    Edition-era original; printed/PDF page pairs preserve historical source mapping
    without Third Edition conversion.'
  section: 'Running the Autobahn: Rat Tail’s first-person in-world memoir'
  attribution: Rat Tail is an explicitly named fictional runner narrating a first-person
    account, introduced by Crystal. These recollections and claims are character voice,
    not universal authorial rules, and do not supply contemporary actionable guidance.
  narrative_account:
  - printed_page: 66
    summary: Crystal introduces Rat Tail as the invited first-person speaker on the
      fictional t-bird Autobahn. Rat Tail characterizes older operations as increasingly
      hazardous because of rising technological expense, escalating electronic interference/countermeasure
      competition, and the financial disadvantage faced by independent operators.
  - printed_page: 66
    summary: Rat Tail recalls an ECM suite that cost about one tenth of a t-bird five
      years previously, and says a colleague’s newly commissioned aircraft spent nearly
      half its cost on countermeasure electronics; these are in-world first-person
      estimates, not published game prices or mechanical equipment tables.
  - printed_page: 67
    summary: 'Rat Tail describes the hazards of high-speed fictional aircraft runs:
      narrow terrain, interdiction, rivals, accidents, and uncertainty about other
      parties’ knowledge. The prose discusses rehearsal and situational awareness
      but is not reproduced as a procedural evasion guide.'
  - printed_page: 67
    summary: A named commenter, Lulu, asserts that early t-bird fliers face high mortality
      in their first runs, gives approximate odds by experience bracket, and warns
      that experience does not eliminate risk; these are speaker estimates, not dice
      mechanics.
  - printed_page: 67
    summary: Rat Tail distinguishes learning from direct experience and misleading
      second-hand route intelligence, presenting a cautionary in-world story about
      route compromise and unwanted encounters.
  - printed_page: 68
    summary: The subsequent page contains a large original illustration with travelers
      on uneven terrain and a flying craft above; brief named posts discuss alleged
      public routes, with mutually disputed reliability.
  speaker_estimates:
    ECM_suite_share_of_tbird_price_five_years_prior: about 10%
    colleague_new_tbird_share_cost_of_countermeasure_electronics: almost half
    editorial_classification: historical character voice, not numerical game-rule
      price table
