data:
  publication: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994), fictional Shadowrun Second Edition-era tabletop RPG source.'
  context: 'The fictional UCAS Sector section, printed pp140-142/PDF141-143; printed p141 is a map. The book narrator and boxed statistics appear in a separate world_fact record.'
  attributed_posts:
  - {printed_page: 140, speaker: EyeBall, source: 'IntraZone Online, REF# 7629-b182', assertion: 'A named local citizen expresses hostility toward NAN territorial claims and urges active political resistance; this is the fictional speaker’s opinion, not book-narrator endorsement.'}
  - {printed_page: 140, speaker: Bender, timestamp: '17:18:28/5-23-55', assertion: 'Mocks the illogic of non-contiguous sectors and bureaucratic border committees, referring to other comments in the Sioux Sector.'}
  - {printed_page: 142, speaker: Kris, timestamp: '23:20:41/5-26-55', assertion: 'Describes the north Aurora UCAS border as eerie because the old wall foundation and adjacent cleared exclusion areas remain visible; attributed first-person observation.'}
  - {printed_page: 142, speaker: Drek, timestamp: '15:26:45/5-29-55', assertion: 'Alleges specially altered German shepherd security dogs cannot bark and speculates about increased aggression; this is an unverified in-world allegation, not established narrator technology.'}
  - {printed_page: 142, speaker: Rhino, timestamp: '08:21:12/5-31-55', assertion: 'Criticizes reliance on silent dogs and speculates that surveillance gaps during darkness and sensor disruptions could admit trespassers; the comments are not a verified breach report.'}
  - {printed_page: 142, speaker: Vox, timestamp: '13:40:18/5-31-55', assertion: 'Asks why patrols sometimes arrive shortly after dogs discover an intruder, questioning whether an alarm mechanism exists.'}
  - {printed_page: 142, speaker: Derek, timestamp: '10:36:51/6-1-55', assertion: 'Alleges dog collars detect attempted barking via muscle/nerve activity and transmit location and video to guard stations; explicitly a forum account rather than confirmed security system.'}
  - {printed_page: 142, speaker: Tyger Trainer, timestamp: '11:00:51/6-1-55', assertion: 'Suggests that canine pulse and breathing sensors could inform handlers rather than bark sensors; an alternative speculation, not established rule.'}
  - {printed_page: 142, speaker: Walks Fast, timestamp: '14:38:04/6-1-55', assertion: 'Claims UCAS patrols use watcher spirits and minor elementals to notice intruders and notify guards or dogs; a named character allegation, not publication-narrator confirmation.'}
  - {printed_page: 142, speaker: Firelight, timestamp: '02:17:27/6-3-55', assertion: 'Declines to comment on the preceding allegation about magical watchers; the statement neither confirms nor denies it.'}
  - {printed_page: 142, speaker: Garvey, timestamp: '12:33:44/5-26-55', assertion: 'Criticizes the UCAS preference for armed drones over surveillance-only vehicles; opinion rather than quantitative equipment rule.'}
  qualification: 'Discussion of local statistics starts at the bottom of printed p142 and continues beyond this inspected bounded range; no claims are extrapolated from the unseen continuation.'
