data:
  publication_context: 'Published fictional tabletop-RPG sourcebook Denver: The City
    of Shadows, FASA Corporation, 1994, FASA7212, historical Shadowrun Second Edition-era
    material (source.fasa-7212); printed/PDF pages are original source page mapping,
    not a conversion to Third Edition.'
  section: Shadowland attributed posts on civic contractors, communications encryption,
    public broadcasting and private media
  named_in_world_claims:
  - speaker: Billiam
    page: 54
    claim: Condemns an earlier speaker’s proposal to deprive an entire neighborhood
      of water to pressure a target, and voices extreme disapproval; this is opposition,
      not an endorsed plan.
  - speaker: Darknight
    page: 54
    claim: Challenges the Council’s decision to give Renraku control over Denver telecommunications.
  - speaker: Oz
    page: 54
    claim: 'Proposes two explanations for the Renraku choice: the council members
      may not have considered the consequences, or the council judged a megacorporation
      the only operator capable of doing the work. Interprets the Free Zone’s unusually
      strong communications-encryption demand as relevant.'
  - speaker: Puget Deb
    page: 54
    claim: Suggests Seattle must be even higher than Denver in prevalence of encrypted
      communications.
  - speaker: Argent
    page: 54
    claim: Disagrees with the Seattle comparison on a per-capita basis, alleges that
      typical Denver cellular and telecom users employ encryption chips or scramblers,
      and attributes the prevalence to paranoia.
  - speaker: Roscoe the Head
    page: 54
    claim: Alleges Renraku (Denver) uses a Cray-Atari X-50 supercomputer to strip
      encryption from messages it considers potentially interesting.
  - speaker: Shot House Flower
    page: 54
    claim: Delivers a metaphor about a rapidly changing underground youth-media trend,
      characterizing it as repetitive and temporary.
  - speaker: Twiddle
    page: 54
    claim: Expresses confusion about the preceding metaphor.
  - speaker: FastJack
    page: 54
    claim: Explains the metaphor as Renraku’s continuing attempts to add Matrix programs
      and IC against Nexus users, who relocate in the virtual network when challenged;
      this is attributed commentary, not an authoritative technical procedure.
  - speaker: Pietr
    page: 54
    claim: Asks what kinds of media the Monitoring Office deems inappropriate.
  - speaker: Layton
    page: 54
    claim: Claims the Monitoring Office disallows media that ridicules or reduces
      the authority of the Administrative Branch, illustrating this with television
      comedy.
  - speaker: HiJinx
    page: 54
    claim: Suggests, as an in-world hypothetical, that a viewer could access blocked
      entertainment via a pirate feed from a Matrix node beyond the monitors’ jurisdiction;
      the source calls it a pirate feed, not a private feed.
  - speaker: Dictator
    page: 54
    claim: Responds that most Free Zone residents would not recognize a pirate transmission
      and so are not the audience being censored.
  - speaker: Vaporware
    page: 55
    claim: Alleges authorities seek to keep residents uninformed and focus on controlling
      people who will accept their influence; presented as in-world independent-news
      advocacy, not narrator-established institutional motive.
  - speaker: Pietr
    page: 55
    claim: Replies that Vaporware’s statement is lurid.
  - speaker: Sterling
    page: 55
    claim: Disparages the production quality, news value and educational content of
      the government-managed Free Zone Voice trideo service.
  - speaker: JJ
    page: 55
    claim: Distrusts the Rocky Mountain Post and even pirate newscasters, observing
      that every broadcaster has its own political or editorial bias.
  - speaker: Hugh M
    page: 55
    claim: Claims pirate broadcasters repeatedly change channels and locations as
      monitors discover and stop their feeds, and points readers toward an in-world
      Shadowland reference for further discussion; no real-world operational instruction
      is given.
headline: Named in-world Denver media, encryption and censorship commentary — FASA7212,
  printed 54–55/PDF 55–56
summary: 'Fictional Shadowland speaker claims and rebuttals from FASA Corporation’s
