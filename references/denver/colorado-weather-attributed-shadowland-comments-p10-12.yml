data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    published fictional historical Shadowrun Second Edition-era tabletop-RPG setting,
    source.fasa-7212; no inferred Shadowrun Third Edition conversion.'
  source_role: Fictional Shadowland message-board exchange, distinguish named speakers
    from the reference narrator.
  attributions:
  - speaker: Link
    printed_datetime: 13:41:44/5-18-55
    printed_page: 10
    claim: 'Corrects interpretation of the Datafacts table: its FRFZ population refers
      to the entire Denver area, including Boulder, Colorado Springs, and intermediate
      territory; criticizes the shared treaty and uses fictional telecom RTG abbreviations
      for individual sector systems, including Sioux NA/SIO, Pueblo NA/PUE, Ute NA/UTE,
      UCAS NA/UCAS-WE, Aztlan NA/AZ-NO, CAS NA/CAS-TX.'
  - speaker: Ranger
    printed_datetime: 18:32:08/5-22-55
    printed_page: 10
    claim: Jokes that routing places part of Denver in Texas; presented as banter,
      not official jurisdiction.
  - speaker: Leo
    printed_datetime: 05:45:39/5-31-55
    printed_page: 10
    claim: Replies to Link/Ranger that the sector political situation and routing
      warrant reading historical information.
  - speaker: Tambor
    printed_datetime: 17:04:52/5-31-55
    printed_page: 10
    claim: Describes the cost of calling across the nearby Ute/Pueblo boundary due
      to differing routing, even within proximity.
  - speaker: Top Shot
    printed_datetime: 17:04:52/5-31-55
    printed_page: 10
    claim: Dismissive retort to Tambor, not a narrator fact.
  - speaker: Nimby
    printed_datetime: 11:22:34/5-26-55
    printed_page: 11
    claim: Questions whether fast low-altitude fictional aircraft really take mountain
      routes.
  - speaker: Little Al
    printed_datetime: 19:49:53/5-27-55
    printed_page: 11
    claim: Responds that fictional radar and visible aircraft trails make extreme
      low-altitude desert travel dangerous; contrasts desert and mountain routes and
      ground surveillance.
  - speaker: Broncomaniac
    printed_datetime: 15:17:03/6-1-55
    printed_page: 11
    claim: Mocks Seattle weather in comparison with Denver sunshine.
  - speaker: Woppler the Weatherman
    printed_datetime: 23:48:54/6-1-55
    printed_page: 11
    claim: Disputes simplistic 300 sunshine days and distinguishes days with no rain.
  - speaker: Smirnoff
    printed_datetime: 12:21:13/5-19-55
    printed_page: 11
    claim: Smirnoff claims one alcoholic drink at altitude feels like one and a half
      at sea level; suggests adjustment after some weeks and describes a common anecdotal
      shift in tolerance, not official medical or game-mechanical guidance.
  - speaker: MedMan
    printed_datetime: 02:27:22/5-20-55
    printed_page: 11
    claim: Claims high-altitude alcohol effects extend to other narcotics; in-world
      anecdote, not real-world advice.
  - speaker: Todd
    printed_datetime: 08:39:42/5-20-55
    printed_page: 11
    claim: Claims enhanced lung volume from fictional bionics lessens his altitude
      effects; anecdote, not a rule.
  - speaker: Morlock
    printed_datetime: 15:36:12/5-22-55
    printed_page: 12
    claim: Speculates that fictional spellcasters may tire more from magic at the
      city’s lower oxygen partial pressure; not stated as a confirmed game modifier.
  - speaker: Leo
    printed_datetime: 20:17:32/7-4-55
    printed_page: 12
    claim: Leo describes high-country July snow and rapid temperature changes, contrasting
      hotter city conditions. The source names a city temperature above 35 C one week
      and approximately 24 C the next, as an in-world anecdote.
  - speaker: Firelight
    printed_datetime: 10:18:59/7-5-55
    printed_page: 12
    claim: Cites past storms and regional weather records to support Leo’s observations.
  attribution_rule: These claims are from named fictional commentators and retain
    uncertainty; none supersede published game mechanics.
framing: newsroom_neutral
