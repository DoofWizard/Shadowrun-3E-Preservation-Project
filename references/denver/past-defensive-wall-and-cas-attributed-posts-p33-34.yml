  extraction:
    posts:
    - speaker: Eagle Feather
      claim: Claims NAN spies knew in advance about Weiss's decision in Washington.
      status: Allegation, not narrator-verified advance knowledge.
    - speaker: Moraya
      claim: Asks why NAN actors failed to prevent construction.
      status: Question, not factual assertion.
    - speaker: Laserlight
      claim: Attributes Aztlan's refusal to join a tribal quorum to spite toward the other bloc members.
      status: Partisan attributed opinion.
    - speaker: Rage
      claim: Claims an orbital relay used in Weiss's address functioned as a surveillance platform over
        Denver.
      status: Attribution is not independently confirmed by the source narrator.
    - speaker: Froner
      claim: Notes older wall remnants still visible though subsequent borders shifted in 2034–2035.
      status: Attributed physical observation.
    - speaker: Puget Sounder
      claim: Questions the source's account of militarized Free Zone areas in light of treaty prohibitions.
      status: Source discussion, not a definitive rule exception.
    - speaker: Lang
      claim: Replies that armed civilian consultants rather than legally commissioned military forces
        maintained the status quo.
      status: Attributed interpretation of the prohibition.
    - speaker: Randolph
      claim: Argues the sixth council member transformed governance into shifting deadlocks and six zones
        of influence; considers the political body ineffective.
      status: Attributed critique.
    - speaker: Leo
      claim: Offers speculative alternatives for future tribal subdivision and, separately, recounts hostility
        to Texas linked to the historic Battle of La Glorietta Pass.
      status: Discussion and historical allegations, not independently confirmed territorial claims.
  editorial_review_notes: No speaker's opinion is promoted to certain publication narrator fact; 2055
    timestamps preserved as available in original page images.
