data:
  publication_context: 'Published fictional tabletop-RPG sourcebook Denver: The City
    of Shadows, FASA Corporation, FASA7212/source.fasa-7212, original Shadowrun Second
    Edition-era text, printed pp63-66/PDF pp64-67; not an SR3 conversion.'
  section: 'The Real Power — Smuggling and T-Bird Runs / Markets: attributed Shadowland
    comments'
  named_posts:
  - speaker: Gray Ghost
    type: geographical interpretation
    claim: Describes the Rocky Mountains as the fictional “Autobahn” and argues that
      both Denver’s geography and the mountain range make it a trade hub; uses a hypothetical
      comparison with a city located far out of alignment.
  - speaker: Confused in Cincinnati
    type: terminology question
    claim: Asks for the meaning of “shadow trader,” describing uncertainty about the
      jargon rather than making a narrator-level assertion.
  - speaker: Misty B
    type: illustrative hypothetical
    claim: Contrasts the fictional Joe the Jammer example of transporting designer
      drugs from Aztlan toward a Sioux market with Roberta the Rodder transporting
      human-growth-hormone pharmaceuticals from Hermosillo to an Aztlan customer,
      distinguishing goods lawful at the intended destination from goods restricted
      in jurisdictions crossed en route. This is an in-world trade-and-law illustration,
      not a recommendation or a statement that Roberta was detained.
  - speaker: Mainliner
    type: in-world assertion
    claim: Alleges that Pueblo is permissive toward certain imports entering Aztlan,
      while traffic leaving Aztlan faces different enforcement. The speaker presents
      it as personal understanding, not an official legal rule.
  - speaker: Ink
    type: skeptical challenge
    claim: Questions whether licensed cargo operators engaged in Free Zone trade necessarily
      deserve the fictional most-wanted reputation claimed in the conversation.
  - speaker: Helen Wheels
    type: speculation and response
    claim: >-
      Helen Wheels, a named fictional Shadowland speaker, contrasts high margins on
      restricted goods with routine legal cargo, while noting that commercial carriers
      often need proper licensing and t-bird light attack vehicles may be classified
      as military or security-class vehicles subject to further restrictions. She
      speculates that border authorities view unapproved t-bird crossings as suspicious
      regardless of whether the cargo is legal. These are attributed opinions and
      descriptions of fictional law, not the book narrator establishing universal rules.
  - speaker: Juko
    type: market interpretation
    claim: Notes that legal goods are often shipped because sector-to-sector price
      differences, for example prices of cyberdecks in the Sioux Nation versus elsewhere,
      can outweigh local markup and conventional distribution.
  - speaker: Toné
    type: first-person trade claim
    claim: Claims to handle “California hot” simsense recordings manufactured around
      Cheyenne and shipped through the fictional Free Zone to UCAS buyers; compares
      the financial appeal of existing routes with direct cross-border shipping. This
      is the speaker’s account, not a confirmed narrator fact.
  - speaker: Lialla
    type: qualified report
    claim: Reports a limited fictional market in cyberdecks from the Pueblo Sector,
      while stressing that the Free Zone sometimes exports such equipment.
  - speaker: Rosencrantz
    type: dismissive assertion
    claim: Claims cyberdecks in the Denver Data Haven are assembled by its operators
      and are not commercial exports; characterizes some as superior and others as
      junk.
  - speaker: Firelight
    type: skeptical challenge
    claim: Questions Rosencrantz’s export implication and the plausibility of a Nexus-based
      commercial assembly line for otaku.
  attribution_boundary: All posts are in-world character claims, questions, hypothetical
    examples or speculation from the fictional 2055 discussion; they do not establish
    real-world claims, trade practices or physical routes.
framing: newsroom_neutral
