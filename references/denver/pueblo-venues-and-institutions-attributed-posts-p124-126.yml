data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    historical Shadowrun Second Edition-era fictional tabletop RPG sourcebook'
  source_pages:
    printed: 124-126
    pdf: 125-127
  section: Named fictional Shadowland opinions, allegations and disputes about Pueblo
    sites
  claims:
  - speaker: Captain Chaos
    page: 124
    claim: Introduces the Pueblo venues list as compiled from local contributors.
  - speaker: Loom
    page: 124
    claim: Alleges the Compri Hotel excludes visibly undesirable guests despite the
      narrator’s stated no-racial-bias listing.
  - speaker: Skrip
    page: 124
    claim: Describes the Compri common room’s theatrical mist partitions; an observer
      claim.
  - speaker: Viva
    page: 124
    claim: Alleges the Compri’s mist also contains suspended microbes and that partition
      arrangement can be changed electronically; speaker claim, not verified technical
      fact.
  - speaker: FastJack
    page: 125
    claim: Praises Golden Days Inn’s private electronic storage protections.
  - speaker: Rage
    page: 125
    claim: Credits Joseph Kraik’s former corporate processing experience and marketing
      for the hotel’s appeal.
  - speaker: Wanda
    page: 125
    claim: Reports an anecdote about a scorched carpet section at the Raintree Inn.
  - speaker: BRC
    page: 125
    claim: Alleges David Vass was a former shadowrunner called Mustang and associates
      the inn’s decline with his marriage.
  - speaker: Voyager
    page: 125
    claim: Disputes the assumption that Vass has abandoned his earlier life and asserts
      his wife was killed by Ares personnel; unresolved fictional allegation.
  - speaker: Mungo Jerry
    page: 125
    claim: Challenges Voyager’s allegation by questioning the claimed Ares motive;
      unresolved.
  - speaker: Capricorn
    page: 125
    claim: Alleges Kathy Logan’s financial ties to the Red Dragon Triad and covert
      activities; not a proven narrator fact.
  - speaker: Pablo Fiasco
    page: 125
    claim: Suggests sector president Juanita Iglala visits Tablelands without visible
      human guards and expresses concern.
  - speaker: Allan
    page: 125
    claim: Claims that a spirit named Diaz accompanies Iglala and may be romantically
      connected; explicitly speculative.
  - speaker: Hammer
    page: 126
    claim: Reports the Rattlesnake Grill’s live music and clientele.
  - speaker: Grunt
    page: 126
    claim: Alleges its owner George Mandel can provide illegal cyberdecks, software
      and information contacts; not a narrator-certified service.
  - speaker: Direx
    page: 126
    claim: Makes a personal anecdotal comment about Mandel.
  - speaker: Wonk
    page: 126
    claim: Claims Hard Target patron Slash trades in illegal BTLs and controlled substances;
      fictional allegation, not fact.
  - speaker: Lennox
    page: 126
    claim: Interprets Lakewood Correctional Institution as diverting former inmates
      onto Denver streets.
  - speaker: Hawthorne
    page: 126
    claim: Alleges rumors of sensory-simulation punishment experiments at Lakewood;
      not treated as verified.
  - speaker: Sylvie
    page: 126
    claim: Rejects Hawthorne’s allegations as baseless rumor.
  - speaker: Maus
    page: 126
    claim: Calls for investigating the alleged activities in Wing 5.
  - speaker: Featherstone
    page: 126
    claim: Says security at Fort Logan looks primarily electronic.
  - speaker: Compex
    page: 126
    claim: Claims Fort Logan staff are concerned about patients departing without
      permission.
  - speaker: Gorgon
    page: 126
    claim: Dismisses earlier rumors of mind-control experiments at Fort Logan as recurring
      unreliable stories.
  source_position: All claims remain third-person reports about fictional persons
    and institutions; contradictory claims and coercion allegations are kept attributed
    and unresolved.
