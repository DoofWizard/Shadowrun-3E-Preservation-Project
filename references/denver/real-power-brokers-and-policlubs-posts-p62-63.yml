  section: Named Shadowland claims on Triad leadership, brokers, Humanis and Unity
  named_in_world_claims:
  - speaker: Blackstone
    printed_page: 62
    certainty: question
    attribution: Questions which magical traditions the Triad mages follow.
  - speaker: Tom
    printed_page: 62
    certainty: opinion
    attribution: Argues that formal hermetic/shamanic distinctions may be limited
      ways of understanding fictional magic.
  - speaker: Ess Ess Ell
    printed_page: 62
    certainty: claim
    attribution: Asserts to Tom that totems and Snake are real within their fictional
      magical worldview.
  - speaker: Niklaus
    printed_page: 62
    certainty: allegation
    attribution: Alleges Denver Triads have close organizational relationships with
      Asian parent groups and face disciplinary consequences for mistakes.
  - speaker: Wendy
    printed_page: 62
    certainty: allegation
    attribution: Alleges the Red Dragon Triad local leader is a female eastern dragon
      who often uses a human form and the name Choi-Mu; presented as a named rumor,
      not a book-narrator fact.
  - speaker: Wong
    printed_page: 62
    certainty: allegation
    attribution: Claims Choi-Mu is a vassal to the eastern great dragon Lung.
  - speaker: Viper
    printed_page: 62
    certainty: question
    attribution: Questions how Wong could know Choi-Mu's alleged status.
  - speaker: Dot
    printed_page: 62
    certainty: dispute
    attribution: Challenges the narrator's multibillion-nuyen information-brokerage
      estimate.
  - speaker: Demosthenes
    printed_page: 62
    certainty: comment
    attribution: Offers a brief personal response distancing himself from that estimate.
  - speaker: Fnord
    printed_page: 62
    certainty: question
    attribution: Asks if information brokerage is driven by proximity to the Nexus.
  - speaker: Drew
    printed_page: 62
    certainty: claim
    attribution: Answers Fnord affirmatively.
  - speaker: Ost
    printed_page: 62
    certainty: question
    attribution: Requests a clarification of what information brokerage means and
      later questions whether it is simply a large decker community.
  - speaker: Kong
    printed_page: 62
    certainty: explanation
    attribution: Separates raw data from monetizable intelligence and describes a
      broad array of fictional broker services, including data analysis, paid information
      delivery and illicit hacking-related activities; an in-world description, not
      operational guidance.
  - speaker: Silicon Tagger
    printed_page: 62
    certainty: opinion
    attribution: Argues Denver has unusually strong information-broker community,
      competition, and young A-list participants; remarks on average age.
  - speaker: Rage
    printed_page: 62
    certainty: opinion
    attribution: Agrees that competition distinguishes Denver's brokers.
  - speaker: Eight Eighty-Eight
    printed_page: 62
    certainty: question
    attribution: Questions whether fourteen-year-olds would carry implanted datajacks.
  - speaker: Neon Warrior
    printed_page: 63
    certainty: correction
    attribution: Challenges the inference that young brokers must have implanted jacks.
  - speaker: Tek
    printed_page: 63
    certainty: opinion
    attribution: Compares status among young brokers to culture-bound status seeking.
  - speaker: Trilobite
    printed_page: 63
    certainty: claim
    attribution: Asserts that young otaku may use datajacks and calls the Nexus a
      major location.
  - speaker: Drang
    printed_page: 63
    certainty: opinion
    attribution: Compares the young Denver warez community's solidarity, dress and
      jargon to gang subcultures.
  - speaker: Warez Dood
    printed_page: 63
    certainty: opinion
    attribution: Dismisses Drang's characterization.
  - speaker: Fast Jack
    printed_page: 63
    certainty: opinion
    attribution: Calls the network and brokerage work a religious-like commitment
      for some participants.
  - speaker: Acolyte
    printed_page: 63
    certainty: opinion
    attribution: Reflects on the metaphysical identity of the community without an
      objective book claim.
  - speaker: Black Isis
    printed_page: 63
    certainty: first_person_experience
    attribution: Poetically describes a personal spiritual experience in a digital
      landscape; not evidence of real-world divine powers.
  - speaker: Teowynn
    printed_page: 63
    certainty: cross_reference
    attribution: Recommends an earlier in-world file Razing the Sprawl for historical
      context of extremist political groups.
  - speaker: Soldier of Fortune
    printed_page: 63
    certainty: question
    attribution: Questions what he considers an intolerant generalization about Unity
      sympathizers.
  - speaker: Jackie
    printed_page: 63
    certainty: speculation
    attribution: Speculates about whether a change in Humanis attacks in Chinatown
      preceded violence between the fictional Humanis and Unity organizations and
      suggests a possible motivation; not verified chronology.
