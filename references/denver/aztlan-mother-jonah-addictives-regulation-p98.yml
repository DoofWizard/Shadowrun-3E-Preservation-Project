data:
  publication_context: 'Denver: The City of Shadows, fictional Shadowrun tabletop-RPG
    sourcebook, published by FASA Corporation in 1994, FASA7212/source.fasa-7212;
    historical Second Edition-era setting; printed p98/PDF99.'
  original_section: Addictives
  source_voice: Mother Jonah's bylined in-universe report, “We're from the Government
    and We're Here to Help You,” begins on printed p93 and continues through this
    closing subsection on printed p98. These assertions are her account, not independently
    corroborated real-world laws or rules.
  mother_jonah_attributed_claims:
  - printed_page: 98
    claim: Mother Jonah identifies the category “addictives” in the fictional Aztlan
      Sector as hot simsense chips, BTLs, and drugs.
  - printed_page: 98
    claim: She characterizes ordinary possession of addictives for personal use as
      a minor misdemeanor, but distinguishes conduct involving especially dangerous
      examples such as 2XS chips, which she presents as an exception.
  - printed_page: 98
    claim: She portrays the fictional corporate security response to distribution
      as far harsher than that to ordinary personal possession, making an explicit
      exception for people protected by Aztechnology's own corporate establishment.
  - printed_page: 98
    claim: She alleges that unauthorized sellers of chips and drugs commonly disappear,
      with their bodies rarely recovered; this is the named fictional article author's
      account, not an independently verified sentence, a quantified statistic, or
      a procedural instruction.
  original_speaker_boundaries: Do not conflate Mother Jonah's Addictives report with
    the separate Rage comment immediately above it on p98, or with the following Places
    of Interest article explicitly attributed to Roving I. Rage's assertion is already
    covered by an existing named-commentary record; the hotels and venue text is separately
    indexed. This record is not an additional numeric rule or legal-punishment chart.
