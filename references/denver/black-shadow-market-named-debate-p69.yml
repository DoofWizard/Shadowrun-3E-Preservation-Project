headline: 'Source-corrected signed Black and Shadow Market discussion — fictional FASA Corporation Denver:
  The City of Shadows (FASA7212, 1994, Shadowrun Second Edition), printed p69/PDF70'
summary: 'Eight attributed in-world speakers’ claims and replies in FASA Corporation’s fictional Shadowrun
  Second Edition-era Denver: The City of Shadows (FASA7212/source.fasa-7212), printed p69/PDF70. Corrects
  Miss T/narrator attribution and Prospero’s fatal Pueblo incident allegation while preserving Sam’s dispute
  over official intent.'
data:
  publication_context: 'Published fictional tabletop-RPG sourcebook Denver: The City of Shadows, FASA
    Corporation, FASA7212/source.fasa-7212, original Shadowrun Second Edition-era text, printed p69/PDF70;
    not an SR3 conversion.'
  section: The Real Power — Black and Shadow Markets; printed p69
  named_posts:
  - speaker: Miss T
    type: extended interpretation
    reported_statement: Miss T describes the fictional black market as handling goods illegal or stolen
      at their destination. She contrasts the shadow market, handling goods legal at the point of sale
      but carried through other nations where they are prohibited, or destined for countries where they
      are prohibited. The speaker argues that this distinction is more meaningful than the difference
      between smuggler and shadow trader, although outsiders seldom distinguish the two types of market.
      The book’s separate unsigned paragraphs about sector condemnation, enforcement and economic tolerance
      are narrator material and are not part of Miss T’s signed post.
  - speaker: Sam
    type: qualified disagreement
    reported_statement: Disputes the suggestion that any nation actively encourages shadow traders, distinguishing
      toleration or deliberate non-interference from affirmative support.
  - speaker: Prospero
    type: historical anecdote and interpretation
    reported_statement: Prospero alleges a fictional incident in which Sioux Wildcats pursued a shadow
      trader’s t-bird into Pueblo territory and Pueblo security forces killed the Wildcats to a man while
      defending the t-bird. Prospero interprets the incident as evidence of active protection of the trader;
      Sam disputes whether protection was intended. The account is an in-world allegation, not an independently
      verified narrator fact.
  - speaker: Sam
    type: rebuttal citing an in-world report
    reported_statement: Responds that Pueblo authorities acted against what their own report described
      as an incursion by armed foreign forces, rather than setting out to protect the trader; acknowledges
      that protecting the trader may have been a consequence without conceding that as official intent.
  - speaker: McCarty
    type: epistemic challenge
    reported_statement: Questions whether intentions can be determined simply by relying on a government
      report.
  - speaker: Legal Beagle
    type: legal question and speculative interpretation
    reported_statement: Legal Beagle questions how a sector could prosecute a shadow trader carrying goods
      lawful in the sector of current presence when the alleged offense occurred in another jurisdiction.
      The fictional speaker speculates that rival corporations may object to a competitor, or that separate
      local business-licensing violations might apply. Legal Beagle explicitly distinguishes the shadow
      market from smuggling; these are in-world legal arguments, not narrator-confirmed law or real-world
      legal advice.
  - speaker: Moore
    type: contested allegation
    reported_statement: 'Moore alleges the fictional Aztlan Sector both facilitates and interdicts shadow-market
      activity: sometimes Aztechnology provides security to certain shadow traders, and at other times
      authorities conduct bloody sweeps against gray-market operators. Moore says the official response
      cannot be predicted with certainty. These are the speaker’s claims, not independently established
      government practice.'
  - speaker: Chichén
    type: speculation
    reported_statement: Suggests the Aztlan authorities’ selectivity may reflect varying interests in
      who profits and who suffers from a given market segment, while accepting the motives are not directly
      established.
  attribution_boundary: The eight signed entries are fictional in-world Shadowland opinions, legal questions,
    allegations and rebuttals. Miss T’s post ends before the separate unsigned publication-narrator economic
    discussion, indexed as world.denver.black_shadow_markets_narrator_context_p69. Sam disputes intent
    in the Pueblo incident. No real-world legal or policing assertion follows.
