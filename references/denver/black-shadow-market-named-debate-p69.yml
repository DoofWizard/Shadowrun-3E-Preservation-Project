summary: 'An attributed fictional discussion distinguishing black markets, cross-sector
  shadow markets and contested official responses, as published by FASA Corporation
  in Denver: The City of Shadows (FASA7212/source.fasa-7212, Shadowrun Second Edition-era),
  printed p69/PDF70. Claims and allegations are not independently narrator-confirmed.'
data:
  publication_context: 'Published fictional tabletop-RPG sourcebook Denver: The City
    of Shadows, FASA Corporation, FASA7212/source.fasa-7212, original Shadowrun Second
    Edition-era text, printed p69/PDF70; not an SR3 conversion.'
  section: The Real Power — Black and Shadow Markets; printed p69
  named_posts:
  - speaker: Miss T
    type: extended interpretation
    reported_statement: Argues that the fictional black market trades unlawful goods
      regardless of the destination, while the shadow market handles goods lawful
      at the point of sale that crossed an intermediate jurisdiction where they were
      illegal or where carriage was otherwise prohibited. Miss T characterizes both
      as consumer-facing parts of the Free Zone’s wider informal trade networks. Claims
      each national sector publicly condemns black markets and stages enforcement
      sweeps while in practice allocating different resources to them; alleges governments
      are less aggressive toward shadow trade when it supports the local economy.
      Miss T describes the distinction as more meaningful than the distinction between
      smuggler and shadow trader, and does not claim official permission to trade.
  - speaker: Sam
    type: qualified disagreement
    reported_statement: Disputes the suggestion that any nation actively encourages
      shadow traders, distinguishing toleration or deliberate non-interference from
      affirmative support.
  - speaker: Prospero
    type: historical anecdote and interpretation
    reported_statement: Raises an alleged incident in which Sioux Wildcats pursued
      a fictional shadow trader’s t-bird into Pueblo territory and Pueblo security
      allegedly handed the Wildcats over to an individual. Prospero interprets the
      response as active protection of a shadow trader; this interpretation is disputed
      by Sam.
  - speaker: Sam
    type: rebuttal citing an in-world report
    reported_statement: Responds that Pueblo authorities acted against what their
      own report described as an incursion by armed foreign forces, rather than setting
      out to protect the trader; acknowledges that protecting the trader may have
      been a consequence without conceding that as official intent.
  - speaker: McCarty
    type: epistemic challenge
    reported_statement: Questions whether intentions can be determined simply by relying
      on a government report.
  - speaker: Legal Beagle
    type: legal question and speculative interpretation
    reported_statement: Questions how a fictional sector could prosecute shadow traders
      for carrying goods lawful within that sector when an alleged offense occurred
      in another jurisdiction. Notes that other local violations, such as licensing
      rules, could be relevant and that business competition could invite corporate
      hostility. Explicitly distinguishes black markets from the cross-sector category
      of shadow trade.
  - speaker: Moore
    type: contested allegation
    reported_statement: Claims the fictional Aztlan Sector sometimes protects particular
      shadow traders through Aztechnology and sometimes stages severe crackdowns on
      other gray-market operators. Does not identify independent substantiation.
  - speaker: Chichén
    type: speculation
    reported_statement: Suggests the Aztlan authorities’ selectivity may reflect varying
      interests in who profits and who suffers from a given market segment, while
      accepting the motives are not directly established.
  attribution_boundary: All entries are attributed in-world Shadowland commentary,
    legal hypotheses, anecdotal reports and disagreements. Miss T’s extended discussion
    is a named speaker’s argument, not an omniscient book-narrator exposition. No
    specific real-world legal or policing proposition follows.
