data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    historical Shadowrun Second Edition-era fictional tabletop RPG sourcebook'
  source_pages:
    printed: 120-122
    pdf: 121-123
  section: Separated named fictional Shadowland claims regarding Pueblo corporate
    governance, entry screening and justice
  claims:
  - speaker: Reid
    page: 120
    claim: Characterizes the Zuni as conservative and Hopi as more disruptive; speaker
      generalization, not narrator-certified demographics.
  - speaker: Arclight
    page: 120
    claim: Disputes the byline’s statement about tribal share of the Corporate Council.
  - speaker: Royston
    page: 120
    claim: Describes a perceived informal exclusion of Anglos and other non-Amerinds;
      an attributed perspective.
  - speaker: Talon
    page: 120
    claim: Comments on corporate executive behavior and sector wealth.
  - speaker: Rage
    page: 120
    claim: Suggests the regional computing and data infrastructure is extremely advanced.
  - speaker: Cyn
    page: 120
    claim: Judges the unusual shareholder voting system functional.
  - speaker: Scavenger
    page: 120
    claim: Makes an unverified political allegation regarding Juanita Iglala’s history
      and her enemies.
  - speaker: Hersh
    page: 120
    claim: Asks whether Iglala was formerly a hitwoman; no independent verification.
  - speaker: Firelight
    page: 120
    claim: Offers a retort about the fictional Aztlan Sector.
  - speaker: Rhodes
    page: 121
    claim: Claims the latest corporate share price is 8,500 nuyen, differing from
      the byline’s earlier 8,252 nuyen quote.
  - speaker: Randy
    page: 121
    claim: Questions the speed and completeness of a visitor’s background check.
  - speaker: Monitor
    page: 121
    claim: Claims the initial travel check is a selective spot-check and alleges additional
      verification if a flag arises; warns of prosecution for falsified information.
  - speaker: Hatchetman
    page: 122
    claim: Describes former corporate security personnel subsequently employed by
      Pueblo Security Enterprises and characterizes the group as paramilitary; an
      attributed evaluation.
  - speaker: Consuelo
    page: 122
    claim: Questions whether magical tribunal members can inspect the accused’s memories.
  - speaker: Lam
    page: 122
    claim: Offers a sarcastic rejoinder.
  attribution_boundary: Named claims are preserved as in-world commentary; rumors
    about real people or actual current legal systems are not asserted.
