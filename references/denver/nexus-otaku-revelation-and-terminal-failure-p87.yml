data:
  publication_context: 'Fictional tabletop RPG historical sourcebook Denver: The City
    of Shadows, FASA Corporation (1994), FASA7212/source.fasa-7212, original Shadowrun
    Second Edition-era narrative; not converted to Third Edition. Printed p87 corresponds
    to physical PDF p88.'
  section: The Nexus — closing anonymous otaku revelation, attributed Shadowland exchange
    and fictional connection failure
  speaker_sequence:
  - order: 1
    speaker: FastJack
    source_page: 87
    assertion: Offers to arrange an exchange for Bash and asks Perri to participate.
  - order: 2
    speaker: Perri
    source_page: 87
    assertion: Says Perri is present but notices at least half a dozen additional
      listeners; later asks whether the hidden group includes Anthony and Edge.
  - order: 3
    speaker: Bash
    source_page: 87
    assertion: Objects to Perri asking about the others; becomes angry at FastJack,
      repeats an insult, and later reacts with surprise when the identity of a concealed
      participant becomes an issue.
  - order: 4
    speaker: FastJack
    source_page: 87
    assertion: Claims to use a CODE pause/resume action to isolate Perri from the
      other listeners, assuring her they cannot contact her for that moment; later
      invites Perri to continue.
  - order: 5
    speaker: Shiva
    source_page: 87
    assertion: Initially compliments FastJack for the isolation; repeatedly asks who
      taught the otaku to use their Channels and whether the speaker can demonstrate
      the claimed practice.
  - order: 6
    speaker: Bitter Edge
    source_page: 87
    assertion: Uses the label Wonder-face; claims that the group represents the Synthesys,
      the Great Work of the Mental Machine, the Virtual Intellect and techno-shamans
      who herald the WorldMind. Later states that the one who taught them is among
      the listeners, without identifying the participant.
  - order: 7
    speaker: Perri
    source_page: 87
    assertion: Says some otaku do not need cyberdecks or program carriers; rejects
      the idea that this involves ordinary headware, active storage, programs, MPCP
      or personas, instead proposing an internal sim-sense translator and simple digital
      impulse converter. Says the Matrix reacts to their intended action. These are
      explicitly a named in-world speaker’s claims, not independently demonstrated
      hardware specifications or game rules.
  - order: 8
    speaker: Bitter Edge
    source_page: 87
    assertion: Claims the group has found the Truth and Deep Resonance, that electrons
      follow Complex Forms, and that the otaku have been taught to command them through
      Channels. This is attributed fictional cyberspace/spiritual language, not a
      real-world claim of supernatural command.
  - order: 9
    speaker: Cap’n Kluge
    source_page: 87
    assertion: Rejects Bitter Edge’s claims first with an exclamation and later characterizes
      the connection as unsound or discontinuous.
  - order: 10
    speaker: Anthony ANSI
    source_page: 87
    assertion: Asks why traditions recognize Great Spirits of Man, Air, Forest and
      Mountains but no Spirits of the Machine. Later denies needing conventional instruction,
      stating that the group only needed the truth to be shown and made clear.
  - order: 11
    speaker: Bitter Edge
    source_page: 87
    assertion: Tells Shiva to ask the unidentified participant who showed the group
      how to show what it claims, saying the participant is now among them.
  - order: 12
    speaker: Bash
    source_page: 87
    assertion: Responds with an increasingly fragmented and garbled statement immediately
      before the terminal reports repeated integrity failures.
  fictional_system_failure_sequence:
  - order: 1
    event: Bash’s printed message becomes typographically corrupted and partly unreadable;
      it cannot responsibly be interpreted as additional dialogue.
  - order: 2
    event: KEY INTEGRITY FAILURE
    sequence_ids:
    - RM239
    - RM240
    - RM241
    - RM242
  - order: 3
    event: FAILURE SOURCE — Denver
    source_ids:
    - DVMI-OpHazard I
    - DVMI-OpHazard II
    - DVMI-OpHazard III
    - DVMI-OpHazard IV
  - order: 4
    event: TERMINAL FILE CORRUPTION
  - order: 5
    event: CONNECTION LOST
  - order: 6
    event: FILE MAINTENANCE VERIFIED
    printed_check_token: aa920
  - order: 7
    event: REMAINDER OF FILE IS VERIFIED
  - order: 8
    event: CONTINUE? (Y/N)?
  scope_and_attribution: The page contains a fictional in-world message-board dispute,
    a purported revelation and a fictional terminal failure. The anonymous presence
    is not identified in the text; the event does not establish an actual intrusion,
    an independently verified AI manifestation, or any mechanically complete game
    test. Printed failure codes and sequence are original source details, not a procedure
    to execute.
