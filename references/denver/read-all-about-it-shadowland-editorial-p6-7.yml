data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    fictional historical Shadowrun Second Edition tabletop-RPG sourcebook; source.fasa-7212,
    not a Third Edition conversion.'
  opening_quotation:
    speaker: C. R. Mudgeon, described as a longtime Denver citizen
    source_role: Department of Tourism advertising slogan contest entrant, REF# HYP-456z636
    assertion: Denver—Look No Further (you cannot see over the Rockies anyway).
    certainty: attributed slogan from fictional setting, not narrator-established
      tourism fact
  editorial_narrator:
    speaker: first-person Shadowland introduction, subsequently attributed to Maria
      Dancer (Crystal), Assistant SysOp, Denver Data Haven
    claims:
    - The introduction contrasts Denver’s multi-cultural visitor-guide image with
      its Shadowland editor’s contention that different cultures there frequently
      compete or clash.
    - The editor describes Denver as a place where fortunes are won and lost and where
      each sector’s security consultants, freelance aircraft operators and business
      competitors create serious hazards.
    - The editor says Treaty City sectors have different political arrangements, security
      levels and practical navigation hazards, citing Five Points and the Trap as
      examples.
    - The editor attributes heightened attention to immigration and officials’ treatment
      of out-of-plex runners, contrasting it with other cities.
    - The files are compiled from multiple sources to give prospective visitors an
      overview of local territory, explicitly presented as information offered by
      the Shadowland community.
    source_status: in-world editorial testimony and warnings, not independently certified
      objective geography or real-world guidance
  seattle_shadowland_exchange:
  - speaker: Captain Chaos, Seattle Shadowland SysOp
    post_datetime_as_printed: 11:48:39/5-17-54
    claim: Introduces the Denver files for Seattle readers, says local comments were
      reviewed and adapted for the Seattle context, warns of errors and disclaims
      liability.
  - speaker: Leo
    post_datetime_as_printed: 04:03:42/5-18-54
    claim: Warns that the Denver information rapidly becomes outdated and urges caution
      about assuming unchanged conditions.
  - speaker: Broncomaniac
    post_datetime_as_printed: 15:09:58/6-1-54
    claim: Responds that he does not intend to return from Seattle to Denver.
  source_illustration:
    printed_page: 7
    physical_pdf_page: 8
    description: Black-and-white line illustration of an angular futuristic vehicle
      flying over a mountainous approach toward an elevated Denver skyline and fortified
      urban structures; occupies the top portion of the page.
