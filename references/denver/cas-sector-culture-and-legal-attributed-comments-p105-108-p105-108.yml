data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212; source.fasa-7212),
    a 1994 historical Second Edition-era Shadowrun fictional tabletop RPG sourcebook'
  original_printed_pdf_page_map: 105-108/106-109
  section: Attributed Shadowland/CAS-sector commentary separated from sourcewriter
    claims
  attributed_claims:
  - speaker: Ryker
    claim: Asks why many orks and elves have emigrated from the CAS Sector.
  - speaker: Damn Yankee
    claim: Offers a prejudicial explanation for emigration; this is his allegation,
      not an accepted demographic cause.
  - speaker: People Watcher
    claim: Disputes Damn Yankee’s simplistic prejudice and notes the interesting similarity
      in dwarf and troll population proportions.
  - speaker: Socio Pat
    claim: Alleges residents compete to appear more relaxed and that this culture
      has social costs.
  - speaker: Norris
    claim: Advises personal connections rather than reputation as a way to be accepted
      socially or professionally.
  - speaker: Shoehorn
    claim: Compares CAS job-network culture to Portland.
  - speaker: Rhodes
    claim: Attributes expensive cyberdeck prices to technological depression and location
      of suppliers.
  - speaker: Alf
    claim: Accuses Knight Errant of corruption.
  - speaker: Duo
    claim: Credits Cuthbertson with replacing an entrenched senior security executive.
  - speaker: Hammer
    claim: Remarks approvingly on reform, and elsewhere comments on license acquisition;
      these are speaker opinions.
  - speaker: Gator
    claim: Questions the legality of an appointed sector manager instead of an elected
      assembly representative.
  - speaker: Wango
    claim: Claims the appointed government continues under an exceptionally long transitional
      condition.
  - speaker: Rage
    claim: Offers a speculative explanation of the CAS immigration process.
  - speaker: Twilight
    claim: Responds sarcastically about unauthorized entry.
  - speaker: Mongoose
    claim: Describes hostile treatment by immigration officials based on experience.
  - speaker: Birdman
    claim: Asserts unauthorized travelers may be expelled from the sector.
  - speaker: Party Animal
    claim: Claims beer prices in the sector are low.
  - speaker: Dark
    claim: Describes Knight Errant personnel as dangerous based on reputation.
  - speaker: Knight Lightning
    claim: Attributes particular investigative practices to Knight Errant Matrix personnel.
  - speaker: Varilight
    claim: Claims Knight Errant acquired ex-military equipment legally; not narrator
      verification.
