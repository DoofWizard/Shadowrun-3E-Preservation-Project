  section: Bobby E CAS-ville article, currency context and named responses
  article:
    writer: Bobby E
    title: LIVIN’ FREE IN CAS-VILLE
    printed_page: 105
    assertions:
    - The author portrays CAS Sector as culturally Southern, with food, sociability
      and a relaxed local manner, while acknowledging its troubles.
    - The author advises networking with people locally before proposing paid work,
      and contrasts sector social expectations with those of Seattle.
    - The author states CAS dollars alone are official legal tender; in-world people
      may nevertheless prefer nuyen. At the article’s time, the reported official
      exchange rate approaches 1 nuyen = 4.75 CAS dollars and varies by day. The author
      expresses CAS-market costs in nuyen for comparison.
  other_named_claims:
  - speaker: Ryker
    claim: Claims many orks and elves emigrated from the CAS Sector after UCAS-CAS
      separation.
  - speaker: Damn Yankee
    claim: Attributes that migration to anti-metahuman hostility in the South; this
      is the speaker’s allegation, not settled narrator attribution.
  - speaker: People Watcher
    claim: Objects to a single-factor explanation and notes an asserted demographic
      coincidence involving dwarfs and trolls.
  - speaker: Socio-Pat
    claim: Contrasts CAS leisure expectations with consumer status competition elsewhere.
  - speaker: Norris
    claim: Emphasizes social introductions and trust-building for professional relations
      in the CAS Sector.
  - speaker: Shoehorn
    claim: Compares that social pattern to Portland.
  - speaker: Voyageur
    claim: Claims shifting local trends make the account unstable over time.
