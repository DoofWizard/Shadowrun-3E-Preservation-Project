        "source_timestamp": "17:19:58/5-20-55",
        "statement": "Introduces a claimed explanation of how the Sioux Nation and UCAS acquired non-contiguous sectors and says the Denver council had originally imagined downtown as a common open bazaar even after the United States established an autonomous sector. In Aesop's account, the Treaty of Richmond split the UCAS autonomous sector and fragmented the native sector; wall removal and a rough square drawn on a digital city map produced a proposed neutral commercial hub, but the outline was not intended as precise borders. Fencing and surrounding nations' disagreements turned the rough outline into a practical boundary. Aesop says the council then abandoned much of the open-hub plan, partly because other nations feared the area would facilitate smuggling, illegal immigration, and terrorism, and because valuable downtown property made full extraterritorial status unworkable. He claims Sioux and UCAS spokespeople offered to administer the land; the council allocated approximately half to each nation and told their governments to define their demarcators.",
