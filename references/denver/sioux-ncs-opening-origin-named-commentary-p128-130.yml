      },
      {
        "speaker": "Carley",
        "printed_page": 130,
        "source_timestamp": "20:38:00/5-20-55",
        "statement": "Asks why only two nations assumed control and whether the other nations also sought a portion of the downtown area.",
        "certainty": "question, not an assertion of motive"
      },
      {
        "speaker": "Aesop",
        "printed_page": 130,
        "source_timestamp": "18:01:57/5-21-55",
        "statement": "Responds that he believes other nations anticipated an ongoing administrative burden and declined the territory; he further speculates that Sioux and UCAS councils now regret taking responsibility.",
        "certainty": "expressly marked personal belief and speculation"
