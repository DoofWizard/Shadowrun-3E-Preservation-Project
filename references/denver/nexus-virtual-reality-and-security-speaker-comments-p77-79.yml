data:
  publication_context: 'Fictional tabletop RPG sourcebook Denver: The City of Shadows,
    FASA Corporation (1994), FASA7212/source.fasa-7212, original Shadowrun Second
    Edition-era setting, no inferred SR3 conversion. Original printed page labels
    correspond to physical PDF folios one greater.'
  section: Named Nexus virtual-environment and security claims
  named_claims:
  - speaker: Penny Wise
    page: 77
    timestamp: 02:01:38/5-23-55
    claim: Expresses surprise that key operators remain at the Nexus physical site.
  - speaker: Brainiac
    page: 77
    timestamp: 09:56:07/5-25-55
    claim: Suggests geographic dispersion protects against disasters, war, and sustained
      interruption; does not identify an actual attack.
  - speaker: FastJack
    page: 77
    timestamp: 01:00:15/5-19-55
    claim: Calls the Nexus a privileged switching center of the Shadowland datanet,
      and says data available at one node might take much longer to retrieve from
      distant nodes; an explanation of fictional network architecture.
  - speaker: Jaron
    page: 77
    timestamp: 01:11:38/5-23-55
    claim: Speculates that important operators stay on-site to retain personal control
      of the network rather than entrust it to subordinates.
  - speaker: Crix
    page: 77
    timestamp: 11:05:43/5-23-55
    claim: Argues key personnel are protected on-site to reduce exposure to coercion,
      leaks, and interference; points to risks to systems management if an operator
      went missing.
  - speaker: Raiko
    page: 78
    timestamp: 09:04:27/5-21-55
    claim: Describes unusually high visual detail at low system load and reduced detail
      at high load as a subjective user experience.
  - speaker: Knob
    page: 78
    timestamp: 17:26:28/5-23-55
    claim: Describes Nexus cyberspace as fully sensory and bidirectionally interactive.
  - speaker: Tril
    page: 78
    timestamp: 09:24:48/5-23-55
    claim: Remarks the aesthetic presentation looks intentionally distracting.
  - speaker: Din
    page: 78
    timestamp: 06:16:07/5-25-55
    claim: Finds the black-hole motif ominous and beautiful and imagines patterns
      in its seemingly chaotic flow.
  - speaker: Bobbi J
    page: 78
    timestamp: 19:58:29/6-3-55
    claim: Asks what kind of information can be accessed through the Nexus.
  - speaker: Rebecca
    page: 78
    timestamp: 18:34:09/6-4-55
    claim: Claims Nexus routing affords access to Shadowland and other affiliated
      private havens, describing a 2053 incident involving a decker called Tapeworm
      and a Monobe Corporation system as an anecdote. Does not establish a general
      right to access private systems.
  - speaker: Silver Surfer
    page: 78
    timestamp: 06:01:17/6-5-55
    claim: Argues the value of Nexus information grows through correlations among
      separate data rather than volume alone; describes it as a correlation machine.
  - speaker: Red Wraith
    page: 79
    timestamp: 23:43:54/5-21-55
    claim: Asserts the Egg used layered independent systems for protection prior to
      the fictional Crash and that such separation afforded early warnings.
  - speaker: Lara
    page: 79
    timestamp: 11:33:40/5-19-55
    claim: Expresses doubt that the Denver Data Haven is actually in independent private
      hands.
  - speaker: Crackerbox
    page: 79
    timestamp: 14:14:03/5-25-55
    claim: Claims to have seen highly effective Gateway SAN defenses and describes
      a failed probe as a personal experience, not a formally verified performance
      measurement.
  - speaker: Rage
    page: 79
    timestamp: 02:02:46/5-26-55
    claim: Challenges Crackerbox’s decision to test a gateway.
  - speaker: Firelight
    page: 79
    timestamp: 20:19:12/5-27-55
    claim: States Nexus hardware, firmware and ice are frequently revised and individually
      customized.
  - speaker: Crystal
    page: 79
    timestamp: 06:25:32/5-14-55
    claim: Says public architectural maps of the Nexus are unreliable because its
      architecture changes.
  - speaker: Bash
    page: 79
    timestamp: unknown
    claim: Disputes Crystal’s attempt to control the discussion and asserts an intent
      to delete inappropriate board material; the book does not provide a usable timestamp.
  - speaker: FastJack
    page: 79
    timestamp: 01:00:15/5-19-55
    claim: Describes layered gateway SANs in a fictional illustrative exchange, claiming
      visitors should be checked and that alarms lead to defensive responses. This
      is a named speaker’s account, not a universal game procedure.
  - speaker: St. Michael
    page: 79
    timestamp: 02:39:37/5-20-55
    claim: Claims gateway chokepoints may keep dormant defensive ice separate from
      the central processing workload.
  - speaker: Wong
    page: 79
    timestamp: 04:57:48/5-20-55
    claim: Adds that some chokepoints may be deliberately configured at low security
      to impede certain overloaded decks.
  source_note: Speaker impressions, reported incidents and numerical security ratings
    are not automatically canonical game stat blocks; numeric ratings separately preserved
    verbatim in protected record.
