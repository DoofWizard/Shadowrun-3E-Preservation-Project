data:
  publication_context: 'Fictional tabletop RPG sourcebook Denver: The City of Shadows, FASA
    Corporation (1994), FASA7212/source.fasa-7212, original Shadowrun Second Edition-era setting,
    no inferred SR3 conversion. Original printed page labels correspond to physical PDF folios
    one greater.'
  section: Named Nexus virtual-environment and security claims
  named_claims:
  - speaker: Penny Wise
    page: 77
    timestamp: 02:01:38/5-23-55
    claim: Expresses surprise that key operators remain at the Nexus physical site.
  - speaker: Brainiac
    page: 77
    timestamp: 09:56:07/5-25-55
    claim: Suggests geographic dispersion protects against disasters, war, and sustained interruption;
      does not identify an actual attack.
  - speaker: FastJack
    page: 77
    timestamp: 01:00:15/5-19-55
    claim: Calls the Nexus a privileged switching center of the Shadowland datanet, and says
      data available at one node might take much longer to retrieve from distant nodes; an explanation
      of fictional network architecture.
  - speaker: Jaron
    page: 77
    timestamp: 01:11:38/5-23-55
    claim: Speculates that important operators stay on-site to retain personal control of the
      network rather than entrust it to subordinates.
  - speaker: Crix
    page: 77
    timestamp: 11:05:43/5-23-55
    claim: Speculates that if key Nexus operators were kidnapped and interrogated, codes and
      encryption keys could be replaced rapidly but their knowledge of architecture, chokepoints,
      and agreements on access to other havens could not be changed so quickly. Crix presents
      this as a hypothetical explanation for physically protecting key operators, not a report
      of an actual abduction.
  - speaker: Raiko
    page: 78
    timestamp: 09:04:27/5-21-55
    claim: Describes unusually high visual detail at low system load and reduced detail at high
      load as a subjective user experience.
  - speaker: Knob
    page: 78
    timestamp: 17:26:28/5-23-55
    claim: Describes Nexus cyberspace as fully sensory and bidirectionally interactive.
  - speaker: Tril
    page: 78
    timestamp: 09:24:48/5-23-55
    claim: Remarks the aesthetic presentation looks intentionally distracting.
  - speaker: Din
    page: 78
    timestamp: 06:16:07/5-25-55
    claim: Finds the black-hole motif ominous and beautiful and imagines patterns in its seemingly
      chaotic flow.
  - speaker: Bobbi J
    page: 78
    timestamp: 19:58:29/6-3-55
    claim: Asks what kind of information can be accessed through the Nexus.
  - speaker: Rebecca
    page: 78
    timestamp: 18:34:09/6-4-55
    claim: Claims Nexus routing affords access to Shadowland and other affiliated private havens,
      describing a 2053 incident involving a decker called Tapeworm and a Monobe Corporation
      system as an anecdote. Does not establish a general right to access private systems.
  - speaker: Silver Surfer
    page: 78
    timestamp: 06:01:17/6-5-55
    claim: Argues that correlated information is more valuable than isolated data and describes
      the Nexus as a correlation machine. In the speaker's explicit value illustration, doubling
      the volume of accessible data more than doubles its value, with the speaker characterizing
      this as double giving four times value and triple giving nine times value. These are the
      commentator's conceptual examples, not official Second Edition game mechanics or validated
      measurements.
  - speaker: Red Wraith
    page: 79
    timestamp: 23:43:54/5-21-55
    claim: Claims the Egg's protective separation existed before the fictional Crash, and that
      the Crash virus would have had to reach and infect intermediary systems, alerting their
      operators and giving central sysops time to disconnect their systems. This is Red Wraith's
      fictional historical explanation rather than a confirmed narrator account.
  - speaker: Lara
    page: 79
    timestamp: 11:33:40/5-19-55
    claim: Expresses doubt that the Denver Data Haven is actually in independent private hands.
  - speaker: Crackerbox
    page: 79
    timestamp: 14:14:03/5-25-55
    claim: Claims to have seen highly effective Gateway SAN defenses and describes a failed
      probe as a personal experience, not a formally verified performance measurement.
  - speaker: Rage
    page: 79
    timestamp: 02:02:46/5-26-55
    claim: Challenges Crackerbox’s decision to test a gateway.
  - speaker: Firelight
    page: 79
    timestamp: 20:19:12/5-27-55
    claim: States Nexus hardware, firmware and ice are frequently revised and individually customized.
  - speaker: Crystal
    page: 79
    timestamp: 06:25:32/5-14-55
    claim: Says public architectural maps of the Nexus are unreliable because its architecture
      changes.
  - speaker: Bash
    page: 79
    timestamp: unknown
    claim: Disputes Crystal’s attempt to control the discussion and asserts an intent to delete
      inappropriate board material; the book does not provide a usable timestamp.
  - speaker: FastJack
    page: 79
    timestamp: 01:00:15/5-19-55
    claim: Describes layered gateway SANs in a fictional illustrative exchange, claiming visitors
      should be checked and that alarms lead to defensive responses. This is a named speaker’s
      account, not a universal game procedure.
  - speaker: St. Michael
    page: 79
    timestamp: 02:39:37/5-20-55
    claim: Claims gateway chokepoints may keep dormant defensive ice separate from the central
      processing workload.
  - speaker: Wong
    page: 79
    timestamp: 04:57:48/5-20-55
    claim: Adds that some chokepoints may be deliberately configured at low security to impede
      certain overloaded decks.
  source_note: Speaker impressions, reported incidents and numerical security ratings are not
    automatically canonical game stat blocks; numeric ratings separately preserved verbatim
    in protected record.
