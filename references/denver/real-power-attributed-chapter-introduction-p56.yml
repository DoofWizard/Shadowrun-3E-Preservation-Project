  section: THE REAL POWER opening
  named_in_world_claims:
  - speaker: Studs A. Poole
    claim: In a specifically credited IntraZone Online statement (REF# 0292:1717),
      boasts that he can provide a new transit or resident pass to a sector by the
      following day, contrasting this with a months-long official process; his self-advertisement
      is not a narrator-certified capability.
  - speaker: Youchai
    claim: Introduces himself to the Free Zone readership as a mailman-like person
      who delivers what he is asked for. Says Crystal commissioned a commentary on
      the Denver shadow world. Deliberately declines to disclose what he receives
      in return, so the source does not establish payment, its kind, or its amount.
  - speaker: Youchai
    claim: Characterizes the Council as unable to impose law on the Zone despite trying,
      and attributes the Zone’s continued survival to the goodwill of powerful shadow-world
      participants. This is his stated interpretation, not the book narrator’s independent
      finding.
  - speaker: Youchai
    claim: Claims legitimate intersector trade is nearly impossible because signatory
      nations quarrel, individual sector markets are too small for mass shipments,
      a multi-sector market bloc is impractical, and overlapping regulations prevent
      it; these are in-world economic claims rather than rules or exact game mechanics.
  - speaker: Youchai
    claim: Describes ubiquitous sidewalk, back-alley and under-the-counter vendors
      of food, sims, microtronics, clothing, entertainment or a good time, and spiritual
      comfort, often at bargain prices. Attributes Denver’s subsistence to this shadow
      economy and asserts that the Council chooses to overlook it because the system
      needs it.
  - speaker: Youchai
    claim: Closes the chapter introduction by saying he has been asked to speak about
      economics and affects an unusually civil tone for the readers; this characterization
      remains his own voice.
