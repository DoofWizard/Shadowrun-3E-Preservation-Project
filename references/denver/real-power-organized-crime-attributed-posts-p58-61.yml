  section: Named Shadowland claims on Zone Economics, Mafia, Yakuza, Gangs and Triads
  narrator_section_structure: The fictional book narrator divides the shadow economy
    into organized crime, smuggling, and the shadow market. This is publication
    narration, not a statement made by Youchai.
  named_in_world_claims:
  - speaker: D Based
    printed_page: 58
    certainty: question
    attribution: Questions whether sector bans on imports contradict treaty restrictions
      on tariffs; poses an unresolved legal criticism.
  - speaker: Margaret Mary
    printed_page: 58
    certainty: opinion
    attribution: Argues in response that the Treaty was designed not to infringe signatory
      self-determination, including the option of outlawing particular goods.
  - speaker: Youchai
    printed_page: 58
    certainty: aside
    attribution: Makes a self-deprecating aside about a borrowed passage explaining
      economic distinctions; attribution is to this speaker, not an anonymous book
      narrator.
  - speaker: The Blue Parrot
    printed_page: 58
    certainty: opinion
    attribution: Sarcastically links the Free Zone criminal market to the many unaffiliated
      individuals operating there; argues independent providers dominate some smuggling
      and contraband activities.
  - speaker: Iato
    printed_page: 58
    certainty: opinion
    attribution: Disputes the impression that established crime syndicates would passively
      tolerate the competing criminal organizations they choose to contest.
  - speaker: Road Runner
    printed_page: 59
    certainty: first_person_allegation
    attribution: Claims a previous yakuza effort to organize independent t-bird
      runners ended when local operators captured the would-be organizers; according
      to Road Runner, some were killed in the confrontation, while survivors were
      abandoned far from home and left to walk back if they could. This is the
      speaker's account, not a narrator-confirmed incident.
  - speaker: Warez Dood
    printed_page: 59
    certainty: opinion
    attribution: Boasts that technologically adept independent information brokers
      outpaced older syndicates in the market.
  - speaker: Kristen
    printed_page: 59
    certainty: question
    attribution: Challenges Warez Dood's jargon and asks for a translation.
  - speaker: Demeter
    printed_page: 59
    certainty: question
    attribution: Questions the Mafia gambling discussion because gambling is legal
      in the Free Zone.
  - speaker: Maverick
    printed_page: 59
    certainty: opinion
    attribution: Replies that legality varies by sector and by types of betting or
      related activities, making the premise of uniform legality inaccurate.
  - speaker: Curious Yellow
    printed_page: 59
    certainty: question
    attribution: Questions how Mafia pornography business could coexist with their
      avoidance of illegal chips.
  - speaker: Feeling Old
    printed_page: 59
    certainty: comment
    attribution: Says physical media remains part of the fictional pornography market
      despite simsense products.
  - speaker: Ifo
    printed_page: 59
    certainty: comment
    attribution: Expresses surprise at the persistence of physical media.
  - speaker: CharBroil
    printed_page: 59
    certainty: allegation
    attribution: Alleges Mafia families have tried to influence senior Administrative
      Branch personnel and UCAS/Aztlan official subbranches but have achieved limited
      success.
  - speaker: Morlock
    printed_page: 59
    certainty: question_and_allegation
    attribution: Questions whether Mafia families truly lack influence, citing alleged
      continuing mafia-associated gambling businesses and the persistence of the Warrens;
      offers suspicions, not proven institutional responsibility.
  - speaker: Sherman
    printed_page: 59
    certainty: allegation
    attribution: Describes the violence around Colorado Springs as a turf fight between
      Mafia and yakuza over illegal gambling; this remains his account.
  - speaker: Kirumi
    printed_page: 59
    certainty: allegation_and_prediction
    attribution: Speculates that the Golden Triangle and Red Dragon Triads have
      set aside earlier hostilities to cooperate against the yakuza. According to
      the speaker, the conflict so far concerns competing distribution arrangements
      and higher payments to middlemen; the warning that violence might follow
      is a prediction, not an established event.
  - speaker: Tiramisu
    printed_page: 60
    certainty: allegation
    attribution: Reports alleged sniper attacks on Red Dragon Triad higher-ups and
      an explosion at the home of influential local yakuza member Kasigi Toda that
      killed Toda's wife and two children while Toda was absent; this is Tiramisu's
      allegation rather than an independently established source-narrator fact.
  - speaker: Arclight
    printed_page: 60
    certainty: opinion
    attribution: Questions whether the information-broker market is already tightly
      controlled by independent decker groups.
  - speaker: Nyx
    printed_page: 60
    certainty: allegation
    attribution: Claims some local yakuza act as intermediaries for the California
      Free State and Japanese government; no independent authentication in the passage.
  - speaker: Trey
    printed_page: 60
    certainty: question
    attribution: Questions the extent of government leverage over yakuza if Nyx's
      report is accurate.
  - speaker: Jesse
    printed_page: 60
    certainty: question
    attribution: Asks whether Seoulpa Rings should be included among other organizations
      in Denver.
  - speaker: Hammer
    printed_page: 60
    certainty: claim
    attribution: Says no Seoulpa Rings operate in the Free Zone; this is a named in-world
      assertion.
  - speaker: Aramis
    printed_page: 60
    certainty: question
    attribution: Questions why fictional street gangs would accept bodyguard work
      given their reputed toughness.
  - speaker: Moraya
    printed_page: 60
    certainty: opinion
    attribution: Rejects Aramis's assumption about gang toughness, alleging that
      young members rely on group size, weapons and tracking gear for intimidation
      but may retreat when confronted away from those supports. This is a hostile
      in-world speaker's opinion, not a game tactic or objective assessment.
  - speaker: Bloodaxe
    printed_page: 60
    certainty: disputed_speculation
    attribution: Observes Godz membership is disproportionately elven, notes speculation
      linking them to Ancients, and explicitly says evidence does not establish that
      the rumor is true.
  - speaker: Lone Wolf
    printed_page: 61
    certainty: speculation
    attribution: Speculates the Cutters may have the largest part of Free Zone arms
      trading, suggesting a 5 percent share while noting uncertainty.
  - speaker: Paolo
    printed_page: 61
    certainty: question
    attribution: Questions what accounts for the rest of Free Zone arms traffic if
      Lone Wolf's estimate were true.
  - speaker: Nash
    printed_page: 61
    certainty: claim
    attribution: Responds that many separate private operators divide the rest of
      the market.
  - speaker: Hex
    printed_page: 61
    certainty: speculation
    attribution: Speculates that conflicts between the Hong Kong and Taiwan chip
      suppliers and Ute manufacturers could escalate into a broader chip-market
      conflict; cites recent disputes but does not establish that a war has begun.
  - speaker: Loree
    printed_page: 61
    certainty: opinion
    attribution: Questions why buyers would choose imported chips from Hong Kong
      over allegedly safe, dependable Ute-made products, and disparages the imported
      alternatives. This is the speaker's asserted preference and claim.
  - speaker: Keef
    printed_page: 61
    certainty: opinion
    attribution: Acknowledges a reported improvement in Hong Kong products but
      still says the speaker would not choose them when alternatives exist.
  - speaker: Time Out
    printed_page: 61
    certainty: correction
    attribution: Corrects another speaker's description of the Triads as having only
      recently diversified.
  - speaker: Zaki
    printed_page: 61
    certainty: opinion
    attribution: Dismisses the Triads' hired jammers as low-quality operators
      willing to work for them, while making an insulting generalization about
      their motives; this is Zaki's evaluation, not a narrator-established fact.
  - speaker: Veda
    printed_page: 61
    certainty: opinion
    attribution: Disputes oversimplification about Triad reliance on magic and says
      groups select magical or technological approaches according to circumstances.
