  "data": {
    "publication_context": "Fictional tabletop role-playing sourcebook Denver: The City of Shadows, FASA Corporation (1994), catalog FASA7212, source.fasa-7212; original Shadowrun Second Edition-era setting with no implicit Third Edition conversion.",
    "section": "STAYING HEALTHY; PUTTING OUT THE FIRE; commentary on original printed pages 49, 51, 52",
    "source_treatment": "The following are statements of named fictional Shadowland commentators rather than the publication narrator's established facts. The page-image dialogue format presents posted handles and in-world timestamps.",
    "claims": [
      {
        "speaker": "Canuck",
        "printed_page": 49,
        "claim": "Questions the Council's early assertion that centrally managed healthcare was unnecessary by invoking people unable to afford commercial hospital services."
      },
      {
        "speaker": "Sherman",
        "printed_page": 49,
        "claim": "Alleges that the 2039 healthcare infrastructure resolution served the private sector interests of some Council members and administrators, including those employed in signatory sectors that had not prioritized healthcare. The narrator does not certify the alleged motive."
      },
      {
        "speaker": "Shane",
        "printed_page": 49,
        "claim": "Directs readers seeking DocWagon operating procedures and equipment descriptions to a separate in-world publication, Neo-Anarchists' Guide to Real Life, rather than supplying statistics in this section."
      },
      {
        "speaker": "Rolf",
        "printed_page": 51,
        "claim": "Remarks that a traveler should avoid being injured inside either of the two non-contiguous enclaves; this is speaker advice in the fictional setting."
      },
      {
        "speaker": "Lois",
        "printed_page": 51,
        "claim": "Claims Aztlan Sector authorities require an armed sector observer on certain DocWagon medical-response vehicles entering their area, ostensibly to monitor whether crew members engage in activities beyond emergency response."
      },
      {
        "speaker": "Inca Spirit",
        "printed_page": 51,
        "claim": "Attributes Aztlan's heightened restrictions to three past occasions on which smugglers or runners used ambulances for unauthorized sector entry."
      },
      {
        "speaker": "Wrench",
        "printed_page": 51,
        "claim": "Counters Inca Spirit with an alleged more recent incident in which runners commandeered a DocWagon Stallion, crossed into the Aztlan Sector by misleading the medical-response monitoring system and killed an Aztlan official alleged to have been observing the ambulance. Claims authorities subsequently put remotely activated destructive charges in visiting medical vehicles, tied to monitoring or locator equipment. This describes an invented-world allegation, not an engineering procedure or endorsed activity."
      },
      {
        "speaker": "Meister",
        "printed_page": 51,
        "claim": "Responds with hostility to Aztlan authorities; the statement offers no separately verified technical information."
      },
      {
        "speaker": "Tympanum",
        "printed_page": 51,
        "claim": "Offers a hypothetical major fire in the CAS Sector near Park Hill and Stapleton, distinguishing nearby stations at East 40th and York, Hoffman Heights and Commerce City, and claims that even urgent cross-sector assistance follows the sector station chain unless special circumstances intervene."
      },
      {
        "speaker": "Firelight",
        "printed_page": 51,
        "claim": "Claims firefighters may find it easier to cross sector borders than medical responders, and that national officials enforce comparable rules while acknowledging that firefighters may have an urgent reason to carry staff and equipment through a checkpoint."
      },
      {
        "speaker": "Encarta",
        "printed_page": 52,
        "claim": "Reports that firefighters experience fewer crossing-point inspections than DocWagon teams and speculates that sector authorities are more personally familiar with large fires than medical-support requests; this is a named commentator's inference."
      },
      {
        "speaker": "Bongo",
        "printed_page": 52,
        "claim": "Accuses some people of deliberately starting destructive fires, including at elder-care homes and hospitals, to exploit the resulting emergency response and cross-border movement."
      },
      {
        "speaker": "Probe",
        "printed_page": 52,
        "claim": "Alleges that Phoenix Fire Management has begun arming its firefighters after repeated incidents involving arsonists targeting firefighters when they arrive. The claim is attributed, not narrator-confirmed."
      }
    ],
