data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    historical Shadowrun Second Edition-era fictional tabletop RPG sourcebook'
  source_pages:
    printed: 116-119
    pdf: 117-120
  section: Named fictional Shadowland replies about Pueblo borders and monitoring;
    separate from narrator facts
  claims:
  - speaker: Toad-Man
    page: 116
    claim: Questions the claimed efficiency of Pueblo Corporate Council governance
      and alludes to high casualty costs.
  - speaker: Trajan
    page: 116
    claim: Says Fort Carson lies in Pueblo territory and suggests its nominal military
      status is dubious.
  - speaker: Alexei
    page: 116
    claim: Asks Trajan to explain the slang term “doggies.”
  - speaker: Memnos
    page: 118
    claim: Questions whether airborne animals could trigger the border detection systems.
  - speaker: Rage
    page: 118
    claim: Describes hypothetical linked alerts, filtering, and software detection;
      a speaker explanation rather than validated system design.
  - speaker: Luke
    page: 118
    claim: Expresses skepticism that the system could be so efficient.
  - speaker: Zak
    page: 118
    claim: Adds a claim about aerial detection and response.
  - speaker: Trixy
    page: 118
    claim: Questions whether invisibility magic would defeat the claimed monitoring.
  - speaker: Darla
    page: 118
    claim: Claims magical watchers are also stationed at the boundary.
  - speaker: Dog
    page: 118
    claim: Reports rumors of a Seattle-developed astral-observing drone and Pueblo
      purchases; neither is narrator-certified.
  - speaker: Tom
    page: 119
    claim: Disputes the feasibility of the rumored Witchsight technology.
  - speaker: Rhodes
    page: 119
    claim: Praises Pueblo affluence and its council’s economic reach; explicitly an
      in-world opinion.
  - speaker: Snake
    page: 119
    claim: Expresses disparagement toward residents using slurs, not adopted as editorial
      voice.
  - speaker: Lincoln
    page: 119
    claim: Responds skeptically to Snake.
  - speaker: Sol
    page: 119
    claim: Advises that Snake not return.
  - speaker: Hammer
    page: 119
    claim: Dismisses part of the restricted-equipment commentary.
  - speaker: Sturm
    page: 119
    claim: Questions whether gyro-mounts fall under restrictions.
  editorial_boundary: These are separate attributed, often sarcastic fictional comments;
    speculative weapons and surveillance assertions remain alleged and are not operational
    instructions.
