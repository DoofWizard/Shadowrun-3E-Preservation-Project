data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994), a published fictional
    Shadowrun Second Edition-era tabletop role-playing sourcebook, catalog source.fasa-7212; no inferred
    Third Edition conversion.'
  extraction:
    posts:
    - speaker: Abraxas
      date_display: 5-19-55
      claim: Describes a nine-day mid-2017 city blockade with military airlifts, severe civilian supply
        shortages, unrest and violence, recalling being thirteen at the time.
      status: Fictional participant recollection; not proof that all described events occurred exactly
        as asserted.
    - speaker: Robson
      date_display: 5-20-55
      claim: Doubts that merely nine days of shortage could yield Abraxas's account.
      status: Explicitly disputes Abraxas's account.
    - speaker: Larry
      date_display: 5-21-55
      claim: Defends the account as plausible given uncertain blockade duration, household panic buying,
        depleted food supplies and neighbors refusing help.
      status: Counterargument, not an independently established casualty or duration count.
    - speaker: MixMaster
      date_display: 6-2-55
      claim: Suggests that boundary reinterpretation accompanied the post-Ghost-Dance withdrawal.
      status: In-world interpretation of border maneuvers.
    attribution_rule: Do not merge disputed participant perspectives into the book narrator's authoritative
      timeline.
  editorial_review_notes: Preserves 2055 speaker attribution, uncertainty and the difference between a
    claimed nine-day blockade and narrator chronology.
framing: newsroom_neutral
