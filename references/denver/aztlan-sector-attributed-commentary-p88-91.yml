data:
  publication_context: 'Published fictional tabletop RPG sourcebook Denver: The City of Shadows
    (FASA Corporation, 1994; FASA7212 / source.fasa-7212), historical Shadowrun Second Edition-era
    source material. Printed pages and physical PDF pages are distinguished; no Third Edition conversion
    is asserted.'
  section: Named Shadowland and attributed cultural/economic debate
  named_in_world_speaker_statements:
  - page: 88
    speaker: Carlos Ensanada
    claim: The introductory sector epigraph satirizes outsiders’ assumptions about Aztlan violence.
      It is an attributed remark, not a factual admission.
  - page: 88
    speaker: Lock’n’Load
    claim: Characterizes sector development as high-rise with no rural or low-density districts,
      and comments on important local sites.
  - page: 90
    speaker: Rage
    claim: Comments critically on boundary security systems and later challenges another speaker’s
      defense of those systems; comments are not established design specifications.
  - page: 90
    speaker: Trasher
    claim: Alleges that autonomous perimeter defenses exist and describes their separate nature
      from Matrix-linked infrastructure; this is a named fictional speaker’s operational claim,
      not narrator confirmation.
  - page: 90
    speaker: API
    claim: Describes the fictional sentry weapons as lethal in rebuttal to the previous discussion.
  - page: 90
    speaker: Donjon
    claim: Challenges the official figures, estimates approximately 600,000 residents rather than
      the printed Datafact’s 393,000, alleges exclusion of SINless residents from official counts,
      and advances a discrimination interpretation of the demographics.
  - page: 90
    speaker: Nikkel
    claim: Disputes Donjon’s unsupported SINless and racial-demographic inferences, emphasizing
      lack of evidence rather than validating official figures as perfectly accurate.
  - page: 90
    speaker: Hammer
    claim: Speculates about Nikkel’s motives; this is not established biographical evidence.
  - page: 90
    speaker: Mentor
    claim: Replies that prejudice against some metatypes could account for Nikkel’s stated view;
      the response is speculative.
  - page: 91
    speaker: Jolly Jumper
    claim: Contrasts Aztlan Sector corporate culture with tourist stereotypes of Central American
      culture.
  - page: 91
    speaker: Teri
    claim: Describes how the sector’s residents wear clothing, jewelry and accessories reflecting
      Aztec, Maya and Inca influences; in a separate reply to Cyn’s objection to a business-card
      generalization, qualifies that the described card-exchange behavior does occur sometimes,
      though not generally. The two posts remain attributed to Teri.
  - page: 91
    speaker: Vlad
    claim: Notes that the bylined article's Central American cultural imagery is selective in the
      fictional Aztlan Sector; specifically says traditional Mayan tribal regalia does not appear
      there and the 'back-to-the-land' movement among North American tribes is not well regarded.
      This is Vlad's in-world counterpoint, not independently verified universal law.
  - page: 91
    speaker: Cyn
    claim: In the first post, disputes Señor Spud’s claim of a routine exchange of business-card
      data among acquaintances, calling it unrepresentative. In a later separate post replying to
      Carlyle, argues that the fictional sector’s government 'privileges' extend equally to sentient
      astral entities, and comments that apparent street pedestrians could be human or an astral
      manifestation; both views remain attributed to Cyn, not narrator facts.
  - page: 91
    speaker: Carlyle
    claim: Responds critically to the bylined claim that fictional Aztlan law grants astral beings
      rights, alleging that citizens have only government-granted 'privileges' that authorities
      may rescind. The criticism is Carlyle's fictional assertion, not the narrator's established
      constitutional rule.
  - page: 91
    speaker: Sabado Sam
    claim: Alleges that converting Aztlan pesos into any other currency, including nuyen or dollars,
      is unlawful even within the sector. Firelight subsequently disputes the categorical formulation
      and distinguishes two forms of peso. This is a named speaker's claim, not a generalization
      by the book narrator.
  - page: 91
    speaker: Firelight
    claim: Corrects Sabado Sam's blanket claim about illegal peso exchanges by distinguishing the
      fictional non-convertible Aztlan peso from a 'convertible peso' that may be legally traded/exchanged,
      but only through the Aztlan government or Aztechnology; argues this division permits official
      control of who conducts currency dealings. This is Firelight's named in-world explanation,
      not a real monetary rule.
  - page: 91
    speaker: Ernie
    claim: Mentions an unofficial exchange market for pesos; not narrator-verified policy.
  certainty_note: Statements are fictional dated Shadowland postings distinct from narrator statements
    and the May 2055 printed Datafact.
headline: 'Fictional historical Shadowrun Second Edition-era source Denver: The City of Shadows
  (FASA Corporation, 1994; FASA7212/source.fasa-7212), printed pp88–91/PDF89–92: named in-world
  demographic, cultural, citizenship and currency commentary'
summary: 'Original-image reviewed FASA7212 fictional tabletop source, printed pp88–91/PDF89–92:
  source-faithful correction of the named speaker attributions, omitted Carlyle, Cyn, Sabado Sam
  exchanges and the convertible/non-convertible peso distinction; narrator claims and named commentary
  remain separate.'
