data:
  publication_context: 'Published fictional tabletop RPG sourcebook Denver: The City
    of Shadows (FASA Corporation, 1994; FASA7212 / source.fasa-7212), historical Shadowrun
    Second Edition-era source material. Printed pages and physical PDF pages are distinguished;
    no Third Edition conversion is asserted.'
  section: Named Shadowland and attributed cultural/economic debate
  named_in_world_speaker_statements:
  - page: 88
    speaker: Carlos Ensanada
    claim: The introductory sector epigraph satirizes outsiders’ assumptions about
      Aztlan violence. It is an attributed remark, not a factual admission.
  - page: 88
    speaker: Lock’n’Load
    claim: Characterizes sector development as high-rise with no rural or low-density
      districts, and comments on important local sites.
  - page: 90
    speaker: Rage
    claim: Comments critically on boundary security systems and later challenges another
      speaker’s defense of those systems; comments are not established design specifications.
  - page: 90
    speaker: Trasher
    claim: Alleges that autonomous perimeter defenses exist and describes their separate
      nature from Matrix-linked infrastructure; this is a named fictional speaker’s
      operational claim, not narrator confirmation.
  - page: 90
    speaker: API
    claim: Describes the fictional sentry weapons as lethal in rebuttal to the previous
      discussion.
  - page: 90
    speaker: Donjon
    claim: Challenges the official figures, estimates approximately 600,000 residents
      rather than the printed Datafact’s 393,000, alleges exclusion of SINless residents
      from official counts, and advances a discrimination interpretation of the demographics.
  - page: 90
    speaker: Nikkel
    claim: Disputes Donjon’s unsupported SINless and racial-demographic inferences,
      emphasizing lack of evidence rather than validating official figures as perfectly
      accurate.
  - page: 90
    speaker: Hammer
    claim: Speculates about Nikkel’s motives; this is not established biographical
      evidence.
  - page: 90
    speaker: Mentor
    claim: Replies that prejudice against some metatypes could account for Nikkel’s
      stated view; the response is speculative.
  - page: 91
    speaker: Jolly Jumper
    claim: Contrasts Aztlan Sector corporate culture with tourist stereotypes of Central
      American culture.
  - page: 91
    speaker: Teri
    claim: Observes that clothing and accessories reflect Central American influences
      in the Aztlan Sector.
  - page: 91
    speaker: Vlad
    claim: Challenges cultural generalizations and notes restrictions on some tribal
      cultural displays.
  - page: 91
    speaker: Cyn
    claim: Disputes generalization about corporate etiquette while agreeing that such
      exchanges sometimes occur.
  - page: 91
    speaker: Firelight
    claim: Argues that the peso’s restricted convertibility lets the fictional Aztlan
      authorities control exchange; this is a posted analysis.
  - page: 91
    speaker: Ernie
    claim: Mentions an unofficial exchange market for pesos; not narrator-verified
      policy.
  certainty_note: Statements are fictional dated Shadowland postings distinct from
    narrator statements and the May 2055 printed Datafact.
headline: 'Fictional FASA Shadowrun Second Edition-era Denver sourcebook (FASA7212),
  printed pp88–91/PDF pp89–92: Named Shadowland and attributed cultural/economic debate'
summary: 'Archival attributed_claim record independently reviewed against original
  printed pp88–91 (PDF pp89–92) of FASA Corporation’s fictional 1994 Denver: The City
  of Shadows (FASA7212); distinctions among narrator facts, attributed in-world statements
  and optional play material remain explicit.'
