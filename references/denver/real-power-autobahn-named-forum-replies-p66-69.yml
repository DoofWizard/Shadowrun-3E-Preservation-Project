data:
  publication_context: 'Historical fictional tabletop-RPG sourcebook Denver: The City
    of Shadows, FASA Corporation (1994), FASA7212 / source.fasa-7212, Shadowrun Second
    Edition-era original; printed/PDF page pairs preserve historical source mapping
    without Third Edition conversion.'
  section: Named Shadowland posts on Autobahn risk and border-policy disputes
  named_in_world_claims:
  - speaker: Crystal
    printed_page: 66
    claim_type: narrative_introduction
    summary: Introduces an invited runner Rat Tail as a contributor and notes their
      lack of first-hand expertise.
  - speaker: Toshiro
    printed_page: 66
    claim_type: opinion
    summary: Urges independent operators to organize and pool resources to keep up
      with technological costs.
  - speaker: Zak
    printed_page: 66
    claim_type: skeptical_response
    summary: Doubts Toshiro’s suggestion.
  - speaker: Nguyen
    printed_page: 66
    claim_type: allegation
    summary: Insinuates Toshiro has a family relationship with a yakuza boss, with
      no verification.
  - speaker: Kris
    printed_page: 67
    claim_type: criticism
    summary: Criticizes Rat Tail’s seeming hypocrisy about defensive armament and
      alludes to heavy weapons on his fictional aircraft.
  - speaker: Rat Tail
    printed_page: 67
    claim_type: first_person_claim
    summary: Replies that his fictional aircraft has been configured for different
      sorts of contracts; no mechanical equipment statistic is established by this
      remark.
  - speaker: Lulu
    printed_page: 67
    claim_type: unverified_risk_estimate
    summary: Estimates that about one in six new t-bird operators die in their first
      five runs, roughly one in sixteen during runs six through fifteen, about one
      in fifty after extended experience, and warns of an approximate one-in-three
      rate of fatal mistakes once overconfident at twenty-plus runs; the speaker’s
      numbers are not verified population statistics or dice odds.
  - speaker: Cargo Cult
    printed_page: 68
    claim_type: unverified_claim
    summary: Lists several routes that some members call public-domain and associates
      them with experienced fictional runners; not an official map or guaranteed safety
      assessment.
  - speaker: Yogi
    printed_page: 68
    claim_type: opinion
    summary: Disputes the usefulness of public-domain routes, asserting they are overcrowded.
  - speaker: Bald Weasel
    printed_page: 68
    claim_type: opinion
    summary: Compares heavily monitored public routes to an exposed approach; rhetorical
      exaggeration, not an exact security map.
  - speaker: Firelight
    printed_page: 68
    claim_type: allegation
    summary: Claims some Denver brokers sell information about military presence,
      assignments and movement; assertion about fictional black-market intelligence,
      not a method for obtaining it.
  - speaker: Wizzer The Fox
    printed_page: 69
    claim_type: question
    summary: Asks for an explanation of Free Zone border defense.
  - speaker: Chain Gun
    printed_page: 69
    claim_type: in_world_explanation
    summary: Offers a broad fictional overview of layered border-security responses
      and interception assets; military procedures and evasion technique are not reproduced.
  - speaker: Sam
    printed_page: 69
    claim_type: disagreement
    summary: Rejects the claim that governments actively encourage unofficial markets,
      distinguishing passive non-enforcement from official participation.
  - speaker: Prospero
    printed_page: 69
    claim_type: allegation
    summary: Cites an alleged Sioux-to-Pueblo border incident and characterizes Pueblo
      response as protection of a trader.
  - speaker: Sam
    printed_page: 69
    claim_type: counterclaim
    summary: Disputes Prospero’s conclusion, saying Pueblo officials described their
      response as defense against armed intrusion into sovereign territory, regardless
      of incidental protection of a trader.
  - speaker: McCarty
    printed_page: 69
    claim_type: question
    summary: Questions reliance on official reports when interpreting the governments’
      motives.
