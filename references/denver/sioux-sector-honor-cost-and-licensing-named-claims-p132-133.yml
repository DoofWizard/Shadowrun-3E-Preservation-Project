data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (1994, FASA7212/source.fasa-7212),
    published fictional Shadowrun Second Edition-era tabletop-RPG sourcebook; no Third
    Edition conversion.'
  source_pages:
    printed: 132-133
    pdf: 133-134
  section: Sioux Sector named in-world commentary on social norms, prices, product
    restrictions, and fictional legal designate claims
  speaker_claims:
  - speaker: Major
    printed_page: 132
    source_timestamp: 02:48:56/6-2-55
    statement: Responds to a discussion of Sioux social honor and ritual; says outsiders
      unfamiliar with local cues may mistake assertive behavior for an imminent physical
      threat, while the individual confronting them might be bluffing, withdraw, or
      use force. Major says the speaker has personally been subjected to this behavior.
    certainty: speaker report and conjecture, not publication-established universal
      behavior
  - speaker: Smedman
    printed_page: 132
    source_timestamp: 22:18:51/5-23-55
    statement: Claims Sioux Sector residents are more easily angered than Sioux Nation
      residents because frequent encounters with Free Zone outsiders who do not share
      their worldview encourage defensiveness and overreaction.
    certainty: attributed social generalization
  - speaker: Firelight
    printed_page: 132
    source_timestamp: 12:13:14/4-07-55
    statement: Criticizes the preceding apologist framing of harmful attitudes and
      says their own prior comments offer reality checks that Major does not provide.
    certainty: named speaker critique, not adjudicated narrator fact
  - speaker: Hammer
    printed_page: 132
    source_timestamp: 23:03:38/6-2-55
    statement: Uses a hyperbolic warning to discourage installing Sioux-manufactured
      headware, responding to the narrator’s note that sector-produced headware is
      poor.
    certainty: attributed personal opinion, not a mechanical statistic
  - speaker: Lamont
    printed_page: 133
    source_timestamp: 09:08:11/5-28-55
    statement: Calls the fictional corporate-security legal-designate exception a
      potential loophole; alleges that an authorized security designation can allow
      lawful ownership of a T-bird LAV at roughly twice the black-market Seattle price,
      and argues that lawful ownership protects against formal confiscation.
    certainty: attributed speculative interpretation of fictional law, not a purchasing
      guide
  - speaker: Blackbeard
    printed_page: 133
    source_timestamp: 11:47:19/5-29-55
    statement: Qualifies Lamont’s reassurance about seizure of lawful property by
      saying the claimed protection holds only for legal confiscation; does not affirm
      immunity from unlawful seizure.
    certainty: attributed counterclaim
  attribution_boundary: All six items are explicitly named in-world Shadowland comments
    from the fictional sourcebook. Numeric pricing rules and narrator-established
    policy are archived separately. No speaker assertion is independently asserted
    as real-world law or conduct.
