  section: Named CAS Sector commentary on costs, government, permits and laws
  named_in_world_posts:
  - speaker: Dooley
    printed_page: 106
    claim: Questions the reported 450% Seattle price of a Sony CYT-360 cyberdeck.
  - speaker: Rhodes
    printed_page: 106
    claim: Attributes high cyberdeck prices to CAS-based distributors and the sector’s
      technologically depressed economy.
  - speaker: All
    printed_page: 106
    claim: Alleges Knight Errant’s prior command had a serious corruption reputation.
  - speaker: Duo
    printed_page: 106
    claim: Claims Bianca Cuthbertson won a contest with Damien Knight and forced him
      to retreat from a previous position.
  - speaker: Hammer
    printed_page: 106
    claim: Compliments Bianca’s law-and-order policies but suggests economic concerns
      remain.
  - speaker: Gator
    printed_page: 106
    claim: Asks why the sector does not have a congressional representative per 150,000
      citizens.
  - speaker: Wango
    printed_page: 106
    claim: Claims the appointed-manager form of government is repeatedly described
      as transitional despite a long continuation.
  - speaker: Freeflight
    printed_page: 107
    claim: Questions reliance on the CAS national immigration process for entry to
      the Free Zone sector.
  - speaker: Rage
    printed_page: 107
    claim: Speculates that centralizing entry processing in Atlanta reduces cost and
      deters disfavored migrants; the stated intent is not narrator-confirmed.
  - speaker: Twilight
    printed_page: 107
    claim: Suggests that unauthorized entry may be comparatively easier; this is commentary,
      not actionable advice.
  - speaker: Mongoose
    printed_page: 107
    claim: Claims work visa screening in the sector is especially intrusive.
  - speaker: Birdman
    printed_page: 107
    claim: Reports consequences if a traveler lacks valid paperwork, including expulsion;
      identifies this as an in-world claim.
  - speaker: Hammer
    printed_page: 107
    claim: Alleges sector weapons permits are easy to obtain and criticizes document
      reliability.
