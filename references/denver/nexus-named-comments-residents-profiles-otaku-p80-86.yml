data:
  publication_context: 'Fictional tabletop RPG sourcebook Denver: The City of Shadows,
    FASA Corporation (1994), FASA7212/source.fasa-7212, original Shadowrun Second
    Edition-era setting, no inferred SR3 conversion. Original printed page labels
    correspond to physical PDF folios one greater.'
  section: Attributions concerning Nexus physical plant, senior figures, and otaku
    debate
  speaker_claims:
  - speaker: FastJack
    page: 80
    timestamps:
    - 10:19:44/5-21-55
    - 17:54:41/5-21-55
    - 18:02:32/5-21-55
    claim: Says security architecture is continually modified; begins to describe
      possible physical access to Nexus but others interrupt him, and later says access
      through physical I/O is easier than via gateway controls. This is character
      dialogue, not an endorsed tactic.
  - speaker: Alice
    page: 80
    timestamp: 04:38:00/5-29-55
    claim: Says the old site is dirty and decrepit despite apparent protection, criticizing
      the inhabitants’ neglect of housekeeping.
  - speaker: Lorax
    page: 80
    timestamp: 10:01:55/5-29-55
    claim: Agrees the physical site is in poor condition.
  - speaker: Garvey
    page: 80
    timestamp: 22:29:38/6-1-55
    claim: Suggests inhabitants prioritize datanet concerns over physical cleanup
      as a value judgment.
  - speaker: Dark
    page: 80
    timestamp: 09:03:52/5-26-55
    claim: Claims remotely controlled heavy machine-gun placements reinforce the site,
      without formal stat blocks.
  - speaker: Wailer
    page: 81
    timestamp: 21:55:45/5-25-55
    claim: Believes astral magical protection at the site is minimal; this is an attributed
      supernatural observation in the fictional setting.
  - speaker: Spook
    page: 81
    timestamp: 03:04:56/5-26-55
    claim: Describes dense ivy on the compound buildings and speculates it screens
      the site from astral observers in fictional magical terms.
  - speaker: Rico
    page: 82
    timestamp: 16:11:15/5-28-55
    claim: Suggests the site’s collection of old cars creates a strong physical obstacle
      even for trained personnel.
  - speaker: Hangfire
    page: 82
    timestamp: 19:56:13/5-28-55
    claim: Disputes Rico’s assessment, claiming a sufficiently large military assault
      could overcome the obsolete vehicles and fences.
  - speaker: Hammer
    page: 82
    timestamp: 09:06:40/5-26-55
    claim: Claims gate defenders are supported by armed remote systems elsewhere on
      the property; not narrator-established.
  - speaker: Priest
    page: 82
    timestamp: 19:32:52/6-1-55
    claim: Describes an approved visitor's limited hospitality at the fictional Nexus compound,
      including a blindfolded transport in a humvee. This anecdotal statement is separate from
      Priest's later reply to Droud on p82 disputing the proposed identification of Shiva.
  - speaker: Priest
    page: 82
    timestamp: 20:10:28/5-29-55
    claim: Rejects Droud's identification of Shiva and comments that Shiva's effort to obscure
      his identity has worked. Priest does not supply the true identity; the source presents
      this as a contradictory in-world response.
  - speaker: Byrne
    page: 82
    timestamp: 06:34:42/6-1-55
    claim: Asks for clarification of the term otaku.
  - speaker: HoloByte
    page: 82
    timestamp: 12:24:18/6-1-55
    claim: Directs Byrne to the book’s later discussion of otaku.
  - speaker: Droud
    pages: 82-83
    timestamps:
    - 13:50:46/5-24-55
    - 13:51:57/5-24-55
    - 13:57:13/5-24-55
    claim: On printed p82, identifies Shiva as Gennedy Polemov and alleges Polemov was a prominent
      participant in the early Glasnet data network before the Soviet (Dis)Union government
      reasserted control; Glenngary contradicts that identity on the same page. On printed p83,
      alleges Cap'n Kluge, working for Fuchi in New York, continued investigating a hostile
      penetration of Fuchi's own datacore after supervisors ordered him to stop; discovered
      one division of Fuchi was targeting another; told inappropriate people; and departed the
      Fuchi enclave just ahead of a corporate assassin. Droud characterizes it as another manifestation
      of the Villiers-Yamagata feud. All these are the fictional speaker's disputed claims,
      not book-narrator verification.
  - speaker: Glenngary
    page: 82
    timestamp: 17:41:29/5-24-55
    claim: Contradicts Droud’s identification of Shiva, saying Polemov was executed
      in 2048.
  - speaker: Quenton
    page: 83
    timestamp: 23:43:30/5-26-55
    claim: Contrasts Bash’s temperament with Shiva’s precision; offers opinion, not
      corroborated diagnosis.
  - speaker: Hermes
    page: 83
    timestamp: 07:00:56/5-27-55
    claim: Calls Bash unkind.
  - speaker: Riley
    pages: 83-84
    timestamps:
    - 04:15:44/5-26-55
    - 04:18:19/5-26-55
    claim: Speculates that Shiva recruited Tom Kwan and estimates Spirit’s age; both
      points are attributed opinion.
  - speaker: Jose
    page: 84
    timestamp: 14:37:51/6-6-55
    claim: Asks about a figure called Mitch associated with the Nexus.
  - speaker: Tarquin
    page: 84
    timestamp: 18:50:26/6-6-55
    claim: Says Shiva made a remark suggesting a watcher called Mitch; explicitly
      asks if Mitch might be another system operator.
  - speaker: Sopwith
    page: 84
    timestamp: 21:23:14/6-6-55
    claim: Interprets Mitch as a deceased original EFF founder and spiritual patron
      figure; a contested in-world interpretation.
  - speaker: Crown
    page: 84
    timestamp: 22:58:50/6-6-55
    claim: Reports a subjective feeling of unseen observation by Mitch while using
      the Nexus.
  - speaker: Flash
    page: 84
    timestamp: 01:26:17/6-7-55
    claim: Attributes Crown’s experience to paranoia.
  - speaker: Scrip
    page: 84
    timestamp: 01:57:23/6-7-55
    claim: Calls Mitch a Nexus artificial intelligence that correlates network data,
      as an alternative explanation.
  - speaker: Buck
    page: 84
    timestamp: 02:09:46/6-7-55
    claim: Disagrees with Scrip and describes Mitch as a personality uploaded from
      an EFF-era founder; a disputed fictional cyberspace account.
  - speaker: Disjoint
    page: 84
    timestamp: 04:26:34/6-7-55
    claim: Questions whether the competing Mitch stories refer to the same figure.
  - speaker: Arclight
    pages: 84-86
    claim: Comments that otaku-like social groups extend beyond Japan; later theorizes
      that adults are developing exceptionally skilled young deckers, finds the children
      alienating, and alleges that former otaku are part of specialized deck research.
      These remain one person’s opinions and claims.
  - speaker: Holly
    page: 84
    timestamp: 15:19:21/5-26-55
    claim: Questions whether present-day dependent Matrix users differ materially
      from the original otaku.
  - speaker: Trans-fad
    page: 85
    timestamp: 11:11:11/11-11-11
    claim: Jokes that Shiva is treated as a deity while supposedly denying the status.
      Timestamp appears anomalous in the printed source and is preserved without correction.
  - speaker: Knowbot
    page: 85
    timestamp: 03:31:56/5-26-55
    claim: Claims early cyberdeck experience can make children exceptionally skilled
      netrunners; unsupported extrapolation, not a quantitative game progression rule.
  - speaker: Catherine
    page: 85
    timestamp: 12:48:43/5-28-55
    claim: Explicitly calls the otaku community’s separation from parents, child datajack
      surgery and upbringing child abuse; argues young children cannot adequately
      understand or consent to the consequences and condemns the possible exploitation.
      The accusation is preserved, not euphemized.
  - speaker: Duggles
    page: 85
    timestamp: 17:03:22/5-28-55
    claim: Replies cynically that Denver may not be a civilized society; does not
      refute Catherine’s concerns.
  - speaker: Travis
    page: 85
    timestamp: 23:42:38/5-28-55
    claim: Counters that some otaku came from desperate street conditions with neglect
      and exploitation and now receive food, shelter, companions and education. This
      is his defense of the environment, not proof that there was no coercion or that
      the surgery was ethically sound.
  - speaker: Anson
    pages: 85-86
    claim: Questions who recruits the otaku and what happens when they grow older.
  - speaker: Karilee
    page: 86
    timestamp: 12:58:09/6-2-55
    claim: Describes the children’s unusual cyberdeck technologies as powerful, based
      on observations of Haven prototypes; not verified equipment statistics.
  - speaker: Fleming
    page: 86
    timestamp: 13:11:09/6-4-55
    claim: Argues that otaku should not be dismissed as ordinary children because
      of their distinctive worldview; an opinion.
  - speaker: Trilobite
    page: 86
    timestamp: 17:20:25/6-5-55
    claim: Suggests older information brokers may be former otaku.
  - speaker: Tid
    page: 86
    timestamp: unreadable/question marks in the printed post
    claim: Posts a deliberately cryptic aside invoking Slash, Bernard, 'flat folk', and dinosaurs;
      its referents are not established by the publication and the original signature contains
      an unreadable/question-mark timestamp.
  - speaker: Doomster
    page: 86
    timestamp: 11:04:49/5-30-55
    claim: Disputes the idea of older otaku maintaining the same status; proposes that people
      who become less adaptable, prefer settling down, or tolerate the status quo are excluded
      by other otaku psychologically rather than physically. This is a named commentator's characterization,
      not an established narrator rule.
  - speaker: Perri, FastJack, Bash, Shiva, and Spirit
    page: 86
    timestamp: redacted in original printed exchange
    claim: Exchange a short disputed conversation about whether to disclose an unexplained
      matter; Bash and Spirit insist it is too early, while Shiva refers to something
      inexplicable. The source never discloses what that matter is, so it is not identified
      here.
  editorial_note: Speaker assertions about identities, alleged misconduct, physical attacks,
    cyberware consent, artificial intelligence and hidden information are distinct from established
    narrator biography and from each other. No real-world tactics or claims about actual people
    are implied. The contested Shiva identity and Cap’n Kluge corporate-conflict backstory are
    specifically Droud’s allegations; Priest disputes Droud, and the source does not resolve
    the identity.
headline: 'Fictional FASA Shadowrun sourcebook Denver: The City of Shadows (1994, FASA7212,
  SR2 era), Nexus named speakers, printed pp80–86/PDF pp81–87'
summary: 'Archival fictional tabletop reference from FASA Corporation''s Denver: The City of
  Shadows (1994, FASA7212/source.fasa-7212), original Second Edition-era printed pp80–86/PDF
  pp81–87; preserves speaker attributions, conflicting identities, timestamps, and consent-versus-coercion
  debates.'
