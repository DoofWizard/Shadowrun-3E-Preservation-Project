data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    historical Shadowrun Second Edition-era fictional tabletop RPG sourcebook'
  source_pages:
    printed: 128-131
    pdf: 129-132
  section: Sioux sector borders and society, named in-world claims
  source_role: 'Attribution-only registry: named speakers in the published fictional
    Shadowland discussions; statements are not independently asserted as historical
    fact.'
  named_claims:
  - speaker: Arthur Windsign
    printed_page: 128
    claim: Jokes that Shadowland discussion makes the whole Sioux Nation sound like
      former Wildcat personnel.
  - speaker: Bender
    printed_page: 128
    claim: Says the non-contiguous areas symbolize the arbitrary layout of present-day
      fictional Denver.
  - speaker: Aesop
    printed_page: 130
    claim: Describes a council allocation of roughly half a disputed downtown common
      Hub to Sioux and the other half to UCAS; later speculates other nations declined
      an enclave because of expected administrative problems.
  - speaker: Carley
    printed_page: 130
    claim: Questions why only the Sioux and UCAS received the contested non-contiguous
      districts.
  - speaker: Pal
    printed_page: 130
    claim: Reports an unverified allegation concerning Sioux purchases of fictional
      border-defense mines from CAS.
  - speaker: Doggie
    printed_page: 130
    claim: Offers a separate and unverified claim about defective military identification
      features in border equipment; no real-world implementation instructions are
      provided.
  - speaker: Converse
    printed_page: 131
    claim: Asserts that some civilian Sioux security patrols are former Sioux Special
      Forces Wildcats and describes them as spiritually observant.
  - speaker: Firelight
    printed_page: 131
    claim: Questions stereotypes about mages and makes a separate claim about patrol
      flexibility along the border.
  - speaker: Hatchetman
    printed_page: 131
    claim: Claims sensor-equipped drones and surveillance technology supplement human
      border patrols.
  - speaker: Hamish
    printed_page: 131
    claim: Claims to identify some patrol drones as Sikorsky-Bell Microskimmers.
  - speaker: Jingo
    printed_page: 131
    claim: Alleges a Wildcat modification of scout vehicles, including weapons mountings;
      attributed rather than verified.
  - speaker: Hardesty
    printed_page: 131
    claim: Questions the comparatively high share of trolls in the Sioux Sector.
  - speaker: Holy
    printed_page: 131
    claim: Remarks that trolls are more common in Tir Tairngire and Tir na nÓg, elves
      predominate there, and that there is no established explanation for these in-world
      demographic patterns.
  - speaker: Milikin
    printed_page: 131
    claim: Says the Sioux Nation exports wheat, software and targeted subviral plagues,
      whereas the sector does not produce wheat.
  - speaker: Monkeywrench
    printed_page: 131
    claim: Suggests the sector is unusually dependent on outside food shipments compared
      with other sectors except Aztlan.
  - speaker: Atlanta
    printed_page: 131
    claim: Disputes the implication that any sector is close to economic self-sufficiency.
  - speaker: Socio Pat
    printed_page: 131
    claim: Compares hostile-seeming exchanges to pecking-order behavior, not simply
      random aggression.
  claims_versus_narrator: Publication narrator facts are separately archived in the
    Sioux sector geographic and economy world_fact record.
