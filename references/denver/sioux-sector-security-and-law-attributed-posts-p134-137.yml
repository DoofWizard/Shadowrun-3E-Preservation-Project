  section: Named Sioux Sector laws and institutional allegations in fictional Shadowland
    commentary
  named_source_claims_not_narrator_facts:
  - speaker: Hatchetman
    printed_page: 134
    claim: Claims carry of small concealable hold-out firearms is also unlawful and
      cites an official justification about destabilizing concealability.
  - speaker: Chuckie
    printed_page: 135
    claim: Questions the designation of legally permitted weapon classes.
  - speaker: Puffing Billy
    printed_page: 135
    claim: Claims tobacco is a controlled substance and purchase requires a government-approved
      outlet.
  - speaker: Tinit
    printed_page: 135
    claim: Alleges special ritual permits for shamans to order tobacco; further claims
      public tobacco use meets severe social opposition.
  - speaker: Gravis
    printed_page: 135
    claim: Complains about non-smoking norms in the sector.
  - speaker: Rocker
    printed_page: 135
    claim: Offers a skeptical story about ESSI early personnel and capability.
  - speaker: Keith
    printed_page: 135
    claim: Claims some ESSI operatives previously served in the Sioux Wildcat special
      forces.
  - speaker: Masura
    printed_page: 135
    claim: Describes claimed ESSI protective gear and combined-force equipment, including
      an attributed fictional scenario; the archive does not endorse real-world implementation.
  - speaker: Krait
    printed_page: 135
    claim: Alleges that corruption can influence judiciary-council decisions and that
      attorneys cost considerably more than typical casework.
  - speaker: Hatchetman
    printed_page: 136
    claim: Claims people avoiding certain licenses will not want their personal information
      disclosed to security entities.
  - speaker: Carson
    printed_page: 136
    claim: Interprets the severe Class C cyberware penalties and compares them to
      UCAS sector punishments.
  - speaker: Slicer
    printed_page: 136
    claim: Calculates an especially large potential fictional penalty by assuming
      each unlicensed program or its backup counts independently.
  - speaker: Rage
    printed_page: 136
    claim: Rebuttal that other discussants should take the stated penalties seriously.
  - speaker: Nova
    printed_page: 137
    claim: Alleges that drug dealers have sometimes been executed; distinguish this
      allegation from the two separate narrator examples on p137.
  narrator_example_distinction: Printed p137 narrates an example dealer fined 20,000
    nuyen and jailed for a year in 2053, contrasted with a user receiving four years
    for possession of a single 2XS chip; these are examples, not general fixed penalties.
  source_context: All claims are attributed to invented characters in a fictional
    Shadowrun Second Edition era published sourcebook.
