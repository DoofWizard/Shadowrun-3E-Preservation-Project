data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994), fictional Shadowrun Second
    Edition-era tabletop RPG sourcebook'
  source_pages:
    printed: 134-137
    pdf: 135-138
  section: Fictional Shadowland comments attributed to individual named in-world contributors; not narrator assertions.
  named_source_claims_not_narrator_facts:
  - speaker: Hatchetman
    printed_page: 134
    claim: Says even small concealable hold-out firearms cannot legally be carried, and attributes this to an official
      rationale that widespread carrying of readily concealable weapons would be destabilizing.
  - speaker: Chuckie
    printed_page: 135
    claim: Questions the recurring 'legal designates' exception for permitted weapons or equipment and calls it
      a loophole.
  - speaker: Puffing Billy
    printed_page: 135
    claim: Claims tobacco is a controlled substance in the Sioux Sector and that cigarette purchases require government-licensed
      outlets.
  - speaker: Tinit
    printed_page: 135
    claim: Claims shamans may obtain a special license to order tobacco in bulk by telephone if they can document
      ritual use. Also says public smoking attracts strong social disapproval, with a risk of angry confrontation
      if the smoker refuses to stop.
  - speaker: Gravis
    printed_page: 135
    claim: Complains that the Sioux Sector operates as a broadly non-smoking environment.
  - speaker: Rocker
    printed_page: 135
    claim: Recalls ESSI's early policing as involving overweight, exhausted former police officers who preferred
      telling people how to find doughnuts rather than taking vigorous action; presented as the speaker's reminiscence,
      not narrator history.
  - speaker: Keith
    printed_page: 135
    claim: Alleges that a substantial proportion of ESSI personnel were once Sioux Special Forces Wildcats, and
      describes a fictional traffic-enforcement encounter on Highway 85 involving a female officer with a Wildcat
      tattoo.
  - speaker: Masura
    printed_page: 135
    claim: Describes ESSI's purported normal gear as light armor and submachine guns, with heavier armor, medium
      machine guns and an assault cannon when expecting a serious incident. Further alleges that ESSI employs coordinated
      armed teams, ground personnel, Citymaster vehicles, Yellowjacket air cover and summoned bound spirits; contends
      that ESSI publicly denies being military. These are in-world claims, not real-world tactical directions.
  - speaker: Krait
    printed_page: 135
    claim: Alleges a bribed Sioux Sector judge can be influenced to a greater extent than a UCAS judge, while bribing
      a judge in Sioux territory is expensive. The speaker is discussing the expense of influencing judges, not
      the price of retaining attorneys.
  - speaker: Mungo Jerry
    printed_page: 135
    claim: Sarcastically calls the impending criminal-offense table's predictions 'wild-assed guesses,' challenging
      their reliability rather than asserting alternative numerical values.
  - speaker: Hatchetman
    printed_page: 136
    claim: Says license applicants may be deterred because a Class B or C cyberware application exposes their background
      to ESSI, the Bureau of Civil Enforcement, and other parties able to read the licensing database.
  - speaker: Carson
    printed_page: 136
    claim: Interprets the Class C cyberware table as imposing one year in custody for unlicensed possession in Sioux
      Sector, contrasting it with ten years in the UCAS Sector; adds that using such gear while undertaking a major
      run would be more serious. These are the fictional speaker's reading, not a replacement for the exact table.
  - speaker: Slicer
    printed_page: 136
    claim: Calculates an aggregate hypothetical 750,000 nuyen fine and 30 years of imprisonment if an unlicensed
      cyberdeck and each separate illegal utility program (including backup copies) are charged individually; his
      calculation is a personal hypothetical, not a sourcebook rule or fixed penalty.
  - speaker: Rage
    printed_page: 136
    claim: Rebuts Slicer's joking tone, treating the severe consequences as a warning against carelessness.
  - speaker: Nova
    printed_page: 137
    claim: Alleges that drug dealers are occasionally executed in the Sioux Sector; the assertion is attributed
      to Nova and is not narrator confirmation of a universal sentence.
  source_accuracy_boundary: Narrator-described laws, population data and exact penalty tables appear in separate
    world/rule records; individual speakers’ remarks remain separately attributed. These statements are fictional
    1994 publication content and not contemporary law or real-world guidance.
  narrator_example_distinction: On printed p137, narrator illustrates non-fixed Controlled Substances penalties
    with a fictional dealer fined 20,000 nuyen and jailed one year in 2053, compared with a fictional user jailed
    four years for a single 2XS chip early in 2055. The cases demonstrate varying outcomes, not an exact universal
    schedule.
