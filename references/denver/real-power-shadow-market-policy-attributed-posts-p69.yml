  section: 'Black and Shadow Markets: attributed policy disputes'
  named_in_world_claims:
  - speaker: Miss T
    printed_page: 69
    claim_type: explanation
    summary: Explains the difference between black and shadow markets by goods’ destination
      legality, intermediate jurisdiction, and the fact that the two types of trading
      are closely related.
  - speaker: Sam
    printed_page: 69
    claim_type: disagreement
    summary: Says that overlooking shadow markets does not mean governments actively
      encourage or support them.
  - speaker: Prospero
    printed_page: 69
    claim_type: allegation
    summary: Offers an alleged border incursion as a counterexample, interpreting
      Pueblo troops’ response as active protection of a cross-border trader.
  - speaker: Sam
    printed_page: 69
    claim_type: counterclaim
    summary: Counters that Pueblo officials claimed they were reacting to an armed
      intrusion, not intending to protect an unofficial trader.
  - speaker: McCarty
    printed_page: 69
    claim_type: question
    summary: Challenges the inference that an official account reliably establishes
      the government’s intent.
  - speaker: Legal Beagle
    printed_page: 69
    claim_type: legal_opinion
    summary: Argues that carrying goods legal in the destination sector need not constitute
      an offense there simply because an earlier jurisdiction prohibited them, but
      notes other local commercial violations could still apply; a fictional in-world
      opinion, not real-world legal advice.
  - speaker: Moore
    printed_page: 69
    claim_type: allegation
    summary: Alleges the Aztlan Sector both tolerates selected shadow-market traffic
      and periodically stages violent enforcement raids against unofficial commerce;
      these are speaker allegations rather than independently verified policy.
  - speaker: Chichén
    printed_page: 69
    claim_type: speculation
    summary: Speculates authorities may have selective interests behind uneven crackdowns,
      without specifying proven motives or endorsing violence.
