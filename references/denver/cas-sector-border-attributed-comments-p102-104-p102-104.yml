  section: Speaker comments on CAS boundaries and security
  attributed_claims:
  - speaker: Peter Trilanka
    context: Quoted CAS Office of Industrial Security IntraZone Online excerpt
    claim: Dismissive sector-opening warning to visiting shadowrunners; represents
      his stated viewpoint, not narrator guidance.
  - speaker: Trajan
    claim: Mocks the irregular downtown sector lines and questions the effectiveness
      of long border fencing.
  - speaker: Lennox
    claim: Attributes the unusual downtown jurisdictional boundaries to committees.
  - speaker: Boskone
    claim: Personally portrays CAS dogs as especially aggressive; does not establish
      a universal game statistic.
  - speaker: Daryl
    claim: Claims knowledge of specialized fictional perimeter weapons; speculative
      security commentary, not operational instructions.
  - speaker: Trisha
    claim: Responds critically to Daryl’s account.
  - speaker: Zak
    claim: Disputes the practicality of the described devices.
  - speaker: Pal
    claim: Alleges a security-transponder code exists; it is an in-world rumor, not
      an externally verified system.
  - speaker: Urquart
    claim: Remarks on the impracticality of the preceding discussion.
  - speaker: Link
    claim: Asserts astral/magical border defense is insufficient.
  - speaker: Moraya
    claim: Disagrees with Link, saying conditions are changing.
  - speaker: Firelight
    claim: Argues elite magical personnel need not be stationed at every guard post.
