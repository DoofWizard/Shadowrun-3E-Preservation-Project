data:
  publication_context: 'Published fictional tabletop-RPG sourcebook Denver: The City
    of Shadows, FASA Corporation, FASA7212/source.fasa-7212, original Shadowrun Second
    Edition-era text, printed p69/PDF70; not an SR3 conversion.'
  section: The Real Power — Running the Autobahn, closing named commentary at the
    top of printed p69
  named_posts:
  - speaker: Wizzer The Fox
    type: open question
    reported_statement: Asks how the fictional sector-border opposition responds and
      requests an explanation; poses no independent factual assertion.
  - speaker: Chain Gun
    type: claimed in-world security description
    reported_statement: Responds by describing the border-security network as a “layered”
      response. Claims that the invented defense includes sensors, manned stations,
      ground and aerial patrols, including autonomous sensors within the border area.
      According to this speaker, identification of a crossing causes other resources
      to concentrate locally and airborne interception tends to be favored over ground
      pursuit against fictional LAVs. Chain Gun also claims that some illegal aircraft
      operators use their own jammers in layers so pursuing patrols may be diverted;
      this is character-level commentary about an invented encounter, not verified
      world fact or a procedure supplied for real-world evasion.
  attribution_boundary: Both contributions are named character posts; the defensive
    account belongs to Chain Gun, not the book narrator. No numeric RPG rule, actual
    security configuration, real-world route, or specific operational parameters are
    established.
