data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212/source.fasa-7212), fictional
    Shadowrun Second Edition-era tabletop-RPG sourcebook, printed p69/PDF p70'
  section: 'The Real Power: Black and Shadow Markets — attributed Shadowland debate'
  named_posts:
  - speaker: Miss T
    source_timestamp: 13:19:42/6-10-55
    stance: definition and relative significance
    attributed_claim: Miss T distinguishes the fictional black market (illegal or stolen goods) from the
      shadow market (goods legal in the sector of sale but transported through other nations where illegal,
      or destined for nations where prohibited). She says this distinction is more meaningful than the
      difference between smugglers and shadow traders, although outsiders rarely distinguish the markets.
  - speaker: Sam
    source_timestamp: 14:40:31/5-28-55
    stance: qualified objection to alleged official encouragement
    attributed_claim: Sam disputes the implication that signatory nations actively encourage shadow traders
      or the shadow market. He distinguishes governments turning a blind eye from active participation,
      and claims that nations generally will at most ignore shadow-market activity.
  - speaker: Prospero
    source_timestamp: 19:00:34/5-28-55
    stance: counterexample alleging protection
    attributed_claim: Prospero cites an alleged incident in which Sioux Wildcats chased a t-bird into
      Pueblo territory and Prospero alleges Pueblo security forces killed all the pursuing Wildcats while
      protecting the shadow trader’s t-bird. He interprets the incident as active protection, rather than
      proving the official motive independently.
  - speaker: Sam
    source_timestamp: 11:29:37/5-29-55
    stance: response contesting intent
    attributed_claim: Sam replies that Pueblo security forces were responding to an illegal incursion
      into Pueblo sovereign territory by armed foreign invaders, citing what he describes as the Pueblo
      incident report. He concedes the response may have had the effect of protecting the shadow trader,
      but disputes that such protection was the intended purpose.
  - speaker: McCarty
    source_timestamp: 20:45:20/5-29-55
    stance: challenge to evidence
    attributed_claim: McCarty questions whether the government’s reported intent can be inferred from
      its own official incident report; this is a challenge to Sam’s evidence, not an independently verified
      account.
  - speaker: Legal Beagle
    source_timestamp: 23:15:37/5-29-55
    stance: jurisdictional analysis and speculation
    attributed_claim: Legal Beagle questions how a sector can legally prosecute a shadow trader when the
      goods carried are not illegal in the sector currently entered, and argues that an act defined as
      a crime in another jurisdiction is not automatically a crime in the current one. The speaker speculates
      that competitors or local business-licensing rules might create separate disputes or offenses, but
      explicitly distinguishes the shadow market from smuggling.
  - speaker: Moore
    source_timestamp: 09:27:18/6-1-55
    stance: counterexample concerning Aztlan Sector
    attributed_claim: 'Moore alleges that the fictional Aztlan Sector both facilitates and interdicts
      shadow-market activity: sometimes Aztechnology provides security for shadow traders, and at other
      times authorities stage violent sweeps against gray-market traders. Moore presents these as inconsistent
      official actions and says the response cannot be predicted confidently.'
  - speaker: Chichén
    source_timestamp: 07:57:03/6-3-55
    stance: interpretation of motives
    attributed_claim: Chichén responds that one can often infer who stands to be harmed or benefit from
      a particular gray-market segment, and speculates that the Aztlan actors have their own reasons;
      this remains a named speaker’s interpretation, not an established explanation of government intent.
  attribution_boundary: All eight posts are signed claims, questions, descriptions, interpretations, or
    speculation by fictional in-world Shadowland speakers; they are not publication-narrator statements,
    verified real-world events, or procedural advice. The unsigned narration between Miss T and Sam is
    separately indexed as world.denver.black_shadow_markets_narrator_context_p69.
headline: 'Source-corrected fictional Shadowland market debate — FASA Corporation Denver: The City of
