  section: The Nexus opening and attributed Shadowland comments
  speakers:
  - name: Show Dog
    venue: IntraZone / REF# BVDF-2029-202a
    printed_page: 70
    claim: In a poetic opening epigraph, imagines the Nexus containing immense quantities
      of information and asks what it would feel like to experience all of it; the
      passage is rhetorical speculation, not a measured property.
  - name: Lara
    timestamp: 11:26:33/5-19-55
    printed_page: 70
    claim: Asks who the people behind the Nexus are and calls the identity question
      particularly important.
  - name: Chevalier de la Infer
    timestamp: 02:10:17/5-20-55
    printed_page: 70
    claim: Responds that all people and their utterances, actions, hopes and fears
      are behind it; characterizes the network as gathering information for understanding
      and a coming event called the Shaping. This is the named speaker’s sweeping
      interpretation, not an established narrator fact.
  - name: Avrotech
    timestamp: 10:15:29/5-21-55
    printed_page: 70
    claim: Posts an invocation of the Bright One as a brief attributed message without
      a clear independent factual assertion.
  attribution_policy: Do not merge the competing explanations of who controls the
    Nexus into a confirmed identity or merge named users into the narrator.
