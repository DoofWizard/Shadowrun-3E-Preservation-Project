data:
  publication_context: 'Fictional tabletop-RPG publication: FASA Corporation, Denver:
    The City of Shadows (FASA7212, 1994), historical Shadowrun Second Edition-era
    sourcebook, printed p127/PDF p128.'
  source_scope: Fictional in-world Shadowland posts on printed p127 within the Fort
    Carson section. Named speaker statements, speculations, and jokes are not presented
    as independently verified narrator facts.
  section: Pueblo sector, Fort Carson discussion
  narrator_vs_commentary: The publication narrator independently describes the reservation
    history; this record indexes the attributed comments, including uncertain allegations,
    corrections and sardonic exchanges. The existing world_fact record separately
    covers the narrator account.
  named_in_world_posts:
  - speaker: Backlash
    printed_page: 127
    mode: personal_recollection
    claim: Recalls early Colorado Springs suburbs around Fort Carson, US military
      families living nearby, Navy Seabees and combat engineers clearing or demolishing
      neighborhoods for a military security zone during the fictional Indian Wars;
      frames it as a personal recollection and disputes the earlier description of
      the surrounding area as unimportant.
  - speaker: Moraya
    printed_page: 127
    mode: unverified_claim
    claim: Claims that a series of bombs also exploded at the Air Force Academy around
      the time of the Fort Carson withdrawal, leaving little of use; the comment does
      not establish the allegation as a narrator-confirmed event.
  - speaker: Huahine
    printed_page: 127
    mode: correction_of_uncertain_claim
    claim: Challenges Moraya’s wording, saying that although similar rumors were heard
      at the Academy, it supposedly was not all destroyed; the speaker explicitly
      preserves uncertainty.
  - speaker: Cyn
    printed_page: 127
    mode: sarcastic_rebuttal
    claim: Responds to the narrator’s “civilian” Pueblo Security Enterprises designation
      with the sarcastic retort “Civilian, my lily-white hoop,” disputing how civilian
      the organization really is.
  - speaker: Trojan
    printed_page: 127
    mode: paraphrase_and_inference
    claim: Characterizes the personnel as still military “doggies underneath the uniform,”
      despite the civilian designation; this is the commenter’s interpretation.
  - speaker: Larkspur
    printed_page: 127
    mode: question
    claim: Questions why the Pueblo authorities retained the Fort Carson name after
      the installation was decommissioned, calling the original name that of a US
      military base.
  - speaker: Ripper
    printed_page: 127
    mode: explicit_guess
    claim: States that the speaker does not know the reason but guesses that retaining
      the Fort Carson name is a Pueblo taunt directed at UCAS, invoking the old US
      occupation as a political reminder; suggests the insult would differ if the
      location were renamed Fort Cibola.
  - speaker: The Laughing Man
    printed_page: 127
    mode: enigmatic_opinion
    claim: Responds that the actual explanation is simultaneously simpler and more
      complex, suggesting names possess power and renaming a place can diminish that
      power; offers no further substantiation.
  - speaker: Canticle
    printed_page: 127
    mode: dismissive_interjection
    claim: Reacting to The Laughing Man’s post, asks who invited him; the comment
      offers no independent factual assertion.
  - speaker: Dreamer
    printed_page: 127
    mode: dismissive_interjection
    claim: Questions why The Laughing Man would care about this matter; the comment
      offers no independent factual assertion.
  editorial_boundaries: All names and statements above belong to fictional game-period
    Shadowland speakers in the published FASA source. Claims of explosives, military
    conduct and supposed political motives remain attributed; the archive does not
    adopt them as externally proven facts.
