data:
  publication_context: 'Fictional tabletop RPG historical sourcebook Denver: The City
    of Shadows, FASA Corporation (1994), FASA7212 / source.fasa-7212; original Shadowrun
    Second Edition-era setting, not converted to Third Edition. Printed folios are
    cited with their actual one-higher physical PDF pagination.'
  section: Named Shadowland rumors and disputes about the Crash, the Egg, the Data
    Haven
  speakers:
  - speaker: The Big “D”
    printed_page: 74
    timestamp: 02:10:19/5-19-55
    claim: Responds fearfully to FastJack’s quoted Saeletra message; offers no independent
      evidence about its provenance.
  - speaker: Firelight
    printed_page: 74
    timestamp: 10:20:17/5-20-55
    claim: Questions FastJack’s age and account of downloading the old message in
      2011.
  - speaker: FastJack
    printed_page: 74
    timestamps:
    - 19:51:29/5-21-55
    - 22:09:45/5-24-55
    claim: Says he was twelve in 2011 and used an old Mac Firestorm from an uncle’s
      basement to retrieve the message; says his modified deck still uses the original
      processor. Replies to other speakers who tease him about the machine.
  - speaker: Magister
    printed_page: 74
    timestamp: 05:28:39/5-22-55
    claim: Jokes that FastJack values his old hardware; no separate historical evidence.
  - speaker: Stomper
    printed_page: 74
    timestamp: 11:14:32/5-20-55
    claim: Speculates that a group called Anarchy Now! may have been involved with
      the virus behind the Crash.
  - speaker: Junko
    printed_page: 74
    timestamp: 20:16:13/5-21-55
    claim: Rejects Stomper’s idea as implausible based on the purported group’s limited
      capacity.
  - speaker: Red Wraith
    printed_page: 74
    timestamp: 23:07:08/5-21-55
    claim: Offers an unverified theory that the Crash virus was a government or corporate
      computer-warfare weapon that escaped control.
  - speaker: Roger Dodger
    printed_page: 74
    timestamp: 02:20:09/5-22-55
    claim: Suggests instead that the virus was a mutated search program; the competing
      explanation is not established.
  - speaker: Captain Chaos
    printed_page: 74
    timestamp: 09:53:22/5-22-55
    claim: Closes the debate and directs future discussion to a separate special-interest
      group, describing unusually high activity in the thread.
  - speaker: FastJack
    printed_page: 74
    timestamp: 00:55:17/5-19-55
    claim: Clarifies that some independent systems suffered Crash virus damage and
      recurrent lower-level difficulties despite the general survival narrative.
  - speaker: Turner
    printed_pages: 74-75
    timestamp: 02:18:23/5-19-55
    claim: Presents a speculative story that Echo Mirage deliberately disappeared
      with important data and hardware rather than simply being thanked by government
      authorities.
  - speaker: Biv
    printed_page: 75
    timestamp: 16:03:19/5-19-55
    claim: Compares the independent Egg network to a chaotic network distinct from
      the public Matrix and asserts that separating the networks protects the smaller
      system from the Matrix’s collapse.
  - speaker: Finnigan
    printed_page: 75
    timestamp: 13:47:00/5-24-55
    claim: Says Seattle’s Shadowland branch descends from an earlier independent board
      founded in Vancouver and relocated to Bellevue in 2003.
  - speaker: Twang
    printed_page: 75
    timestamp: 02:19:28/5-21-55
    claim: Expresses disbelief that government offers to buy the former Academy site
      would simply disappear from Pueblo records.
  - speaker: Firelight
    printed_page: 75
    timestamp: 10:27:30/5-21-55
    claim: Agrees with Twang’s suspicion that missing bids are unlikely to be accidental.
  - speaker: Loober
    printed_page: 75
    timestamp: 09:20:18/5-22-55
    claim: Reacts skeptically to the narrator’s note that the council supposedly had
      no idea who monitored the land.
  - speaker: Awed in Akron
    printed_page: 75
    timestamp: 08:20:18/5-22-55
    claim: Expresses surprise at the claim that the Data Haven archives extensive
      traffic.
  - speaker: Firelight
    printed_page: 75
    timestamp: 20:19:20/5-22-55
    claim: Expresses disbelief, without additional evidence, at the Data Haven’s breadth.
  - speaker: Norris
    printed_page: 76
    timestamp: 00:38:29/5-29-55
    claim: Questions why states and megacorporations have not attacked the Data Haven
      if they oppose its activity, arguing its loss would still harm shadow networks.
  - speaker: Lara
    printed_page: 76
    timestamp: 11:30:20/5-10-55
    claim: 'Offers two unconfirmed explanations for why the Denver Nexus remains
      undisturbed. First, she suggests surviving Shadowland nodes might retaliate
      against an attack by releasing a Doomsday virus into the Matrix; she expressly
      leaves unestablished whether anyone possesses or contemplates using such a
      virus, and treats the perceived possibility as a deterrent. Second, citing
      the cost of maintaining the datanet, she speculates that a megacorporation
      may be secretly funding it and suggests Fuchi as her own conjecture, not as
      a confirmed sponsor.'
  - speaker: Suvanne
    printed_page: 76
    timestamp: 12:42:58/5-19-55
    claim: Calls Lara’s funding theory paranoid.
  - speaker: Toshikazu
    printed_page: 76
    timestamp: 12:59:39/5-19-55
    claim: Questions whether Lara’s alleged sponsorship scenario should be considered
      sufficiently suspicious; rhetorical, not confirmation.
  - speaker: Turner
    printed_page: 76
    timestamp: 04:08:29/5-24-55
    claim: As a possible connection to Lara’s sponsorship theory, points out
      that the person the fictional source calls the 'nominative head' of the
      Echo Mirage project is now CEO of Ares Macrotechnology; the post does not
      establish that Ares sponsors the Nexus.
  - speaker: Firelight
    printed_page: 76
    timestamp: 20:01:15/5-26-55
    claim: Speculates that Pueblo’s deal with the Nexus explains why the
      Pueblo Corporate Council maintains what Firelight calls the best government
      datanetwork in the world, with intrusion countermeasures and protocols
      exceeding those of other governments; this superlative and the suggested
      causal connection are the speaker's unverified claims.
  - speaker: Cray
    printed_page: 76
    timestamps:
    - 10:35:36/5-20-55
    - 09:55:17/5-25-55
    claim: Says the Hague haven is smaller than Singapore’s and Singapore’s
      smaller than Denver’s; mentions unsubstantiated talk of a UK data haven
      in Manchester that would surpass Denver. In a later post, disputes the
      prospect of a wholly separate independent shadow Matrix by arguing that
      physical transmission media, such as fiber or satellite channels, remain
      necessary. Both statements are the named speaker's claims.
  - speaker: Rod the Mod
    printed_page: 76
    timestamp: 16:03:23/5-22-55
    claim: Mentions an emerging Japanese haven in Beppu and repeats unverified
      reports that it might reach around 15 percent greater size than Singapore’s
      haven, while still remaining smaller than Denver’s Nexus.
  - speaker: FastJack
    printed_page: 76
    timestamp: 02:24:22/5-23-55
    claim: Says he distrusts the new Beppu haven because he believes its systems crash
      frequently; a subjective comparison.
  - speaker: Barnsley
    printed_page: 76
    timestamp: 04:28:05/5-25-55
    claim: Asks whether emerging haven systems could become a globally separate network;
      this is a possibility posed for discussion, not an established formation.
  editorial_note: Speakers differ in identity, timeframe and degree of certainty;
    none of these observations should be turned into established narrator facts or
    instructions. Exact mechanics are not present on these pages.
headline: 'Fictional Shadowrun tabletop RPG: Denver: The City of Shadows (FASA
  Corporation, 1994, FASA7212, Second Edition-era), named-speaker theories of
  the Nexus and Data Haven, printed pp74-76/PDF pp75-77'
summary: 'Archival attributed_claim record of the fictional sourcebook Denver: The
