data:
  publication_context: 'Published fictional tabletop RPG sourcebook Denver: The City
    of Shadows (FASA Corporation, 1994; FASA7212 / source.fasa-7212), historical Shadowrun
    Second Edition-era source material. Printed pages and physical PDF pages are distinguished;
    no Third Edition conversion is asserted.'
  section: Named Shadowland comments about Aztlan venues and Denver Council Hall
  named_shadowland_speaker_statements:
  - page: 98
    speaker: Rage
    claim: Claims possession of certain illegal cyberdecks leads to long or possibly
      indefinite imprisonment. This is a speculative observation, not exact statutory
      mechanics.
  - page: 98
    speaker: Doric
    claim: Claims the Burnsley Hotel restaurant uses sound-masking devices at its
      booths and reports building renovations.
  - page: 98
    speaker: Morlock
    claim: Alleges hotel management archives confidential business-meeting recordings
      and passes them to Aztechnology security; source narrator does not confirm the
      accusation.
  - page: 98
    speaker: Luke
    claim: Claims manager Ernesto Conger has close connections with Aztechnology.
  - page: 98
    speaker: Morlock
    claim: Emphasizes the Days Inn is one of the few in-sector hotels open to a wider
      clientele.
  - page: 98
    speaker: Monkey-Man
    claim: Jokes that, given his apparently antagonistic relationship with Aztechnology
      ("the Big A"), staying at the Days Inn would be like a "Days End"; he does not
      establish any personal or corporate link to hotel management.
  - page: 98
    speaker: Ginko
    claim: Speculates that the Days Inn attracts people hoping to avoid corporate
      scrutiny by blending into the clientele, an allegation distinct from narrator
      facts.
  - page: 99
    speaker: Gopher P.
    claim: Offers a positive opinion of Chinampas food while describing its unusual
      preparation.
  - page: 99
    speaker: Ptolomy
    claim: Describes Chinampas as formal and catering primarily to Aztechnology staff;
      suggests its back rooms serve as meeting places.
  - page: 99
    speaker: Ric
    claim: Recommends the venue to people seeking dealings with Aztechnology and claims
      owner Maceaultin is a fixer with corporate contacts.
  - page: 100
    speaker: Carla
    claim: Says local shadowrunners generally avoid the Serpent’s Feather because
      of the company they would encounter.
  - page: 100
    speaker: Eight Eighty-Eight
    claim: Claims the Serpent’s Feather serves as a setting where fixers bargain with
      other fixers.
  - page: 100
    speaker: Sport
    claim: Notes that Ricardo Valdez is listed as manager, then alleges that the actual
      owner of the Serpent’s Feather is a feathered-serpent entity called Coyolxauhqui.
      The claim concerns an alleged separate owner rather than asserting that the
      named manager is the creature; it remains an unverified fictional Shadowland
      allegation.
  - page: 100
    speaker: Hammer
    claim: Interprets Sport’s alleged Valdez identity and describes a supposed rivalry
      with Aztechnology and Aztlan authorities; this remains unverified speaker commentary.
  - page: 100
    speaker: Phiber Optik
    claim: Alleges Council Hall border administration may be manipulated to harass
      a rival Council representative.
  - page: 100
    speaker: Tron
    claim: Presents a clearly hypothetical emergency closure of Council Hall by the
      Aztlan Sector manager, explicitly adding that it has not happened.
  - page: 100
    speaker: Ross
    claim: Alleges the Council Guard draws personnel from signatory national security
      forces and sarcastically questions their cohesion.
  - page: 100
    speaker: Toshikazu
    claim: Challenges the effectiveness of Council Guard coordination and alleges
      internal disputes; no independent narrator confirmation.
  - page: 100
    speaker: Colin
    claim: Questions the point of a security force for Council representatives.
  - page: 100
    speaker: Petey
    claim: Suggests political extremists or protesters may target symbolic officials,
      and comments on why visible protests can create backlash; attributed political
      analysis, not operational advice.
  - page: 100
    speaker: Alamo
    claim: Makes a speculative remark about Council Guard factions potentially provoking
      conflict; it is not a report of a past incident.
  editorial_certainty: Fictional in-world speaker assertions retain their attribution
    and conditionality; narrator facts, allegations, jokes, and hypothetical not-happened
    events must remain distinct.
headline: 'Fictional FASA Shadowrun Second Edition-era Denver sourcebook (FASA7212),
