  section: Distinct attributed venue commentary and conflicting reputation statements
  claims:
  - speaker: Moraya
    claim: Disputes ability to identify shamans by appearance at the Melbourne Hotel.
  - speaker: Talismonger
    claim: Alleges Gordon Letson discriminates against apparent Amerind visitors;
      not an accepted hotel policy fact.
  - speaker: Carnival
    claim: Makes an irreverent remark about Letson.
  - speaker: Wryter
    claim: Claims Letson is himself a shaman and conceals family background; speculative,
      not established identity.
  - speaker: Shabir
    claim: Links the Stouffer’s lower occupancy to the airport being in another sector.
  - speaker: Sharon
    claim: Criticizes Stouffer’s service quality.
  - speaker: Tomtom
    claim: Counters that remark with a sardonic joke.
  - speaker: Billabong
    claim: Endorses the Stouffer’s lounge for food and rest during airport transfers.
  - speaker: Dean
    claim: Criticizes Regency Tech Center’s physical condition.
  - speaker: VJ
    claim: Proposes splitting a large Regency room among friends to reduce costs.
  - speaker: Iris
    claim: Warns that local crime makes the Regency trick riskier than described.
  - speaker: Victoria
    claim: Suggests Grassroots’ favorable newspaper review may reflect a family relation.
  - speaker: Triumph
    claim: Questions the restaurant reviews.
  - speaker: PJ
    claim: Asks why Grassroots is rarely victimized despite lax security; establishes
      no cause.
  - speaker: Sevrin
    claim: Offers to investigate PJ’s unanswered question.
  - speaker: Ringo
    claim: Alleges Goodfriends proprietor Brett Mitchell trades in stolen goods and
      weapons; a rumor, not established guilt.
  - speaker: Keruni
    claim: Warns Rock Solid visitors against talking business.
  - speaker: Hammer
    claim: Alleges Elizabeth Grimes formerly operated in the shadows under the name
      Black Heart; not narrator-certified.
  - speaker: Pittman
    claim: Connects the Tech Center economic decline to cultural/market shifts after
      the Awakening.
  - speaker: Darla
    claim: Calls the Tech Center a gang-dominated area with substantial vacancy.
  - speaker: Frazier
    claim: Warns of danger at Ketring Park after dark.
  attribution_policy: Do not promote venue speaker allegations into the book-narrator
