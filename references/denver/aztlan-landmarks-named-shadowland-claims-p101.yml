  section: Named Shadowland observations about Aztlan Sector landmarks
  named_in_world_claims:
  - speaker: Chip Doctor
    subject: Council Hall security
    claim: Claims Aztechnology corporate security commands form an outer perimeter
      around the Council Guard and alleges the Aztlan government uses this arrangement
      to exert psychological or political advantage.
  - speaker: Lennox
    subject: former Capitol Building
    claim: Says the old Denver Capitol was historically gold-domed, alleges the original
      gold was donated by miners, and criticizes the 2048 replacement.
  - speaker: Trip
    subject: former Capitol gold
    claim: Asks what happened to the historical dome gold; no answer is established
      in this post.
  - speaker: Margeson
    subject: new Capitol basement
    claim: Alleges most Administrative Branch computer resources are in the new building’s
      basement, with high security.
  - speaker: Miller
    subject: Cheesman Conservatory
    claim: Alleges particular plants have pharmaceutical properties and that unnamed
      magical practitioners use some plants; no specifics are established as narrator
      facts.
  - speaker: Caligula
    subject: Conservatory
    claim: Infers that the facility’s security was recently upgraded.
  - speaker: Lennox
    subject: Anáhuac University
    claim: Reports locals call the fenced school Stalag Aztechnology.
  - speaker: unattributed paragraph in printed page
    subject: Aztec Teocalli (Map Location 52)
    claim: Locates a purported Aztec Temple on old St. Thomas Seminary grounds near
      the CAS border, describes it as about 25 stories with many more subterranean
      floors, and notes uncertainty about religious practices and alleged magical
      effects experienced by an unnamed observer.
  - speaker: Firelight
    subject: Aztechnology Building
    claim: Alleges several attacks in recent months, the most serious involving a
      missile that struck the 32nd floor, and reports recently installed rooftop short-range
      anti-missile laser systems not yet demonstrated in use; these are fictional-world
      claims, not real security guidance.
