  section: CAS Sector original full-page printed border/map illustration
  source_art_facts:
  - Printed page 103 is a full-page, monochrome original CAS Sector map, not a later
    edition reinterpretation.
  - The map displays an irregular shaded CAS sector amid Denver roads and numbered
    map-location markers, with a prominent “CAS Sector” label below.
  - Visible numbered route references and locality labels include Highway 70, 225,
    Intercity 25, 85, 83 and Highway 470; the outline spans urban Denver and a wider
    southern portion of the region.
  interpretive_limit: The printed illustration is a schematic setting-sector map;
    markers and shading do not independently establish game rules, combat modifiers
    or real-world border advice.
