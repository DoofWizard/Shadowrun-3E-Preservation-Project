  section: THE REAL POWER full-page artwork
  original_artwork_observations:
  - The source prints a full-page black-and-white illustration under its POWER navigation
    tab. A large dark panel surrounds a white-bordered rectangular scene; this is
    printed fictional artwork, not a photograph or reported real-world event.
  - In the upper right of the central picture a figure reclines while smoking a cigar.
    A second, foreground figure appears from the waist down, wearing high-heeled shoes
    and holding a knife by the leg. The lower right of the composition contains several
    drawn long firearms arranged together.
  - Triangular decorative symbols appear above and below the framed scene. The image
    carries no printed game-stat table or combat-resolution rule.
