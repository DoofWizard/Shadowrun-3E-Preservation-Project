data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994), fictional Shadowrun Second
    Edition-era tabletop RPG sourcebook'
  source_pages:
    printed: 133-134
    pdf: 134-135
  section: Fictional Shadowland comments attributed to individual named in-world contributors; not narrator assertions.
  named_claims:
  - speaker: Cree Warrior
    printed_page: 133
    claim: Alleges that the Sioux, Crow, Navajo, Hidatsa, and Arapaho have council seats, whereas Cree and Plains
      Chippewa are excluded even though the latter two account for approximately 8 percent each of Sioux Nation
      population. Says two of the five largest groups have approximately 10 percent each, cites the last census
      as 31,995,000 people, and argues the representation cutoff denied the Cree and Plains Chippewa seats by fewer
      than one-third million people; demands a change to the membership criteria.
  - speaker: E Pluribus
    printed_page: 133
    claim: Sarcastically asks whether the council should be expanded to twenty tribal representatives (or however
      many groups belong to the Sioux Nation), then argues national-government-style political gridlock and divergent
      interests would worsen decision-making; calls the national Sioux government corrupt.
  - speaker: Cree Warrior
    printed_page: 133
    claim: Responds simply by accusing E Pluribus of lying; the rebuttal is a separate statement, not proof that
      the allegations were false.
  - speaker: Gardner
    printed_page: 133
    claim: Alleges that the Sioux Sector council and its bureaucracy are even more corrupt than their Sioux Nation
      counterparts.
  - speaker: Cree Warrior
    printed_page: 133
    claim: Challenges an anonymous commentator to repeat their alleged lies face-to-face, characterizing anonymous
      commentary as dishonorable.
  - speaker: Nobrusco
    printed_page: 133
    claim: Replies that Cree Warrior's personal challenge sounds like hypermasculine intimidation or bullying.
  - speaker: Holly
    printed_page: 134
    claim: Explains that the stated single five-year term applies separately to each council; a Sioux Sector chief
      who distinguishes themselves may subsequently be appointed to the Sioux Nation council.
  - speaker: Logos
    printed_page: 134
    claim: Says many runners cannot prove the requisite tribal descent and that a Sioux Sector residence application
      asks for a SIN and evidence the applicant has not been convicted of a major felony; distinguishes the speaker's
      claims from narrator-established eligibility.
  - speaker: Artisan
    printed_page: 134
    claim: Sarcastically questions the previously reputed militarization of Sioux borders by asking whether saying
      'please' now removes all border barriers; this is a skeptical question, not affirmative proof of unrestricted
      entry.
  - speaker: USR
    printed_page: 134
    claim: Replies that officials still inspect a credstick with SIN, current citizenship information, medical information
      and criminal records, and may verify those details by cross-checking databases; disputes the idea that entry
      is as simple as a polite request.
  - speaker: Guard
    printed_page: 134
    claim: Argues that established immigration procedures should be followed, rather than circumvented.
  - speaker: Tully
    printed_page: 134
    claim: Warns that official resident status does not exempt a returning traveler from border checks when arriving
      in Sioux territory from elsewhere.
  - speaker: Blue Doctor
    printed_page: 134
    claim: Comments skeptically that extending a travel pass 'on request' still entails another credstick payment,
      credential cross-checks, and what the speaker considers a convincing explanation for a longer visit.
  - speaker: Harlan
    printed_page: 134
    claim: Alleges that Sioux customs and immigration officials are corrupt and that some border guards accept hard-currency
      bribes, using the speaker's street slang; this is an unverified in-world allegation, not advice.
  - speaker: Morlock
    printed_page: 134
    claim: Adds the qualification that the misconduct Harlan alleges occurs only sometimes, not inevitably on every
      crossing.
  source_accuracy_boundary: Narrator-described laws, population data and exact penalty tables appear in separate
    world/rule records; individual speakers’ remarks remain separately attributed. These statements are fictional
    1994 publication content and not contemporary law or real-world guidance.
  council_narrator_distinction: On printed p133, book narration identifies five chiefs representing Sioux, Crow,
    Navajo, Hidatsa and Arapaho and distinguishes those facts from named critics of council membership. Printed
    p134 describes separate immigration and official residence processes. These narratorial claims are not themselves
    new rules in this record.
