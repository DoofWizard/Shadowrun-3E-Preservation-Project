data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    historical Shadowrun Second Edition-era fictional tabletop RPG sourcebook'
  source_pages:
    printed: 133-134
    pdf: 134-135
  section: Named Shadowland statements disputing Sioux council and immigration policy
  named_claims:
  - speaker: Cree Warrior
    printed_page: 133
    claim: Alleges the two omitted tribes, Cree and Plains Chippewa, each hold roughly
      8 percent of the nation’s population and were excluded despite the population
      ratio; cites a last-census figure of 31,995,000 inhabitants for the Sioux Nation
      and proposes changing council representation.
  - speaker: E Pluribus
    printed_page: 133
    claim: Rejects enlarging the council on the ground of political paralysis and
      disparages the Sioux Nation government as corrupt.
  - speaker: Cree Warrior
    printed_page: 133
    claim: Disputes E Pluribus’s characterization of Sioux national governance.
  - speaker: Gardner
    printed_page: 133
    claim: Alleges that the sector council and its bureaucracy are even more corrupt
      than Sioux Nation counterparts.
  - speaker: Holly
    printed_page: 134
    claim: Interprets the term limit as allowing a chief to serve once on the sector
      council and separately once on the national council.
  - speaker: Logos
    printed_page: 134
    claim: Questions the practicality of ancestry verification and says a felony-conviction
      screen applies to some applications.
  - speaker: Artisan
    printed_page: 134
    claim: Challenges the claim that the sector is extremely militarized, presenting
      its entry procedures as permissive.
  - speaker: USR
    printed_page: 134
    claim: Explains that border checks may involve identity, citizenship and criminal-record
      information and may impose delays.
  - speaker: Guard
    printed_page: 134
    claim: Insists that people should comply with established immigration procedures.
  - speaker: Tully
    printed_page: 134
    claim: Warns that holding Official Resident status does not exempt a visitor from
      separate border inspection when returning from elsewhere.
  - speaker: Blue Doctor
    printed_page: 134
    claim: Skeptically describes the time-extension requirements and associated charges.
  - speaker: Harlan
    printed_page: 134
    claim: Alleges a corrupt immigration system that sometimes accepts illicit inducements.
  - speaker: Morlock
    printed_page: 134
    claim: Qualifies the preceding allegation as intermittent rather than universal.
  attribution_caveat: These are separate, named in-world statements printed in the
    fictional publication. They are not narrator-established facts, instructions,
    or claims about current real-world Sioux governance.
