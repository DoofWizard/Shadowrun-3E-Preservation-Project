  section: Named speakers on trade markets, law and supply differences
  named_in_world_claims:
  - speaker: Gray Ghost
    printed_page: 64
    claim_type: metaphor
    summary: Uses the Rockies and Denver’s location as a figurative hub for the Free
      Zone’s international smuggling market and calls the area the Autobahn.
  - speaker: Confused in Cincinnati
    printed_page: 64
    claim_type: question
    summary: Asks for an explanation of the term shadow trader.
  - speaker: Unattributed explanatory forum reply
    printed_page: 64
    claim_type: anonymous_explanation
    summary: Defines a shadow trader broadly as someone handling illegally routed
      or restricted goods and distinguishes traders from smugglers according to law
      at destination; speaker identity is not printed in the captured passage.
  - speaker: Misty B
    printed_page: 65
    claim_type: in_world_hypotheticals
    summary: Supplies Joe the Jammer and Roberta the Rodder as contrasting imagined
      legal scenarios, distinguishing prohibited destination goods from goods legal
      at destination but restricted en route; does not establish real people or offer
      practical shipment directions.
  - speaker: Mainliner
    printed_page: 65
    claim_type: allegation
    summary: Claims authorities in Pueblo and Aztlan show different attitudes to shadow
      traders, including uneven treatment of inbound versus outbound traffic; a speaker
      assertion, not independently established policy.
  - speaker: Tink
    printed_page: 65
    claim_type: question
    summary: Questions why otherwise lawful carriers often appear alongside wanted
      criminals.
  - speaker: Youchai
    printed_page: 65
    claim_type: in_world_narration
    summary: Explains through the publication narrator’s voice that the Free Zone
      is undersupplied by conventional marketing channels and that goods legally available
      may nevertheless be moved through unofficial channels.
  - speaker: Helen Wheels
    printed_page: 65
    claim_type: opinion
    summary: Says some lawful-goods journeys still attract scrutiny due to fictional
      aircraft categories and licensing; gives her interpretation of how officials
      perceive unconventional transport.
  - speaker: Juko
    printed_page: 65
    claim_type: claim
    summary: Claims large sector price differences and informal markups can make unofficial
      trade economically worthwhile even for products legal in the destination.
  - speaker: Toné
    printed_page: 66
    claim_type: first_person_allegation
    summary: Claims participation in fictional California-hot simsense-chip distribution
      through Ute/UCAS/Free Zone markets, including an in-world business rationale;
      only the attribution, market identities, and disputed legality are archived,
      not a logistics procedure.
  - speaker: Liliad
    printed_page: 66
    claim_type: allegation
    summary: Alleges there is a limited but profitable market for cyberdecks departing
      the Pueblo Sector.
  - speaker: Rosencrantz
    printed_page: 66
    claim_type: allegation
    summary: Claims some of those decks are made by Denver Data Haven programmers
      or assemblers, disputing the implication of ordinary commercial manufacture.
  - speaker: Firelight
    printed_page: 66
    claim_type: disagreement
    summary: Doubts that significant quantities of Nexus-assembled cyberdecks are
      exported.
