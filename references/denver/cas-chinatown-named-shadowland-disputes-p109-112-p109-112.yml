data:
  publication_context: 'Published fictional tabletop RPG sourcebook Denver: The City
    of Shadows (FASA Corporation, 1994, FASA7212 / source.fasa-7212), historical Shadowrun
    Second Edition-era setting; printed pages are one below physical PDF page numbers;
    no Third Edition conversion is inferred.'
  original_printed_pdf_page_map: 109-112/110-113
  section: Chinatown attributed bulletin-board disputes
  claims:
  - speaker: Captain Chaos
    claim: Introduces the Chinatown material as a selection from a fictional SMV sociology
      paper with local bulletin-board reactions; says the material is available only
      in abridged form, and solicits other commentators. He does not independently
      certify the other posts.
  - speaker: Ralphie
    claim: Rejects the narrator's migration history, alleging Chinese immigrants were
      spies sent to obtain American technology for China. Later alleges mind control
      and violence by the Chinatown community. His uncorroborated claims and anti-Chinese
      slurs are presented solely as a hostile in-world commenter's views.
  - speaker: Gopher P.
    claim: Rebukes Ralphie's racist allegations, later says Chinatown friends have
      rescued him during dangerous runs, and recommends visits for food while warning
      against intrusive questions. These are his own reports and recommendations.
  - speaker: Holly
    claim: States that some excessive information may be transmitted through the Matrix
      to mainland China by expatriates, while speculating that concern for family
      members might explain it; does not endorse Ralphie's conspiratorial certainty.
  - speaker: Styles
    claim: Alleges the CAS tried to eliminate Chinatown leaders and that assailants
      suffered serious casualties; Li Chen explicitly disputes a planned assault.
      The claim is not certified by the book narrator.
  - speaker: Li Chen
    claim: Disputes Styles' allegation of a planned attack, describing CAS-Chinatown
      confrontations as minor misunderstandings. Later replies to Rhonda, advances
      his own hierarchical and exclusionary claims about Chinatown community and metahumans,
      condemns Humanis propaganda, and directs curious visitors to Travel Guy. His
      arguments remain attributed, not narrator fact.
  - speaker: Tex
    claim: Accuses Li Chen of lying and betrayal. The accusation is uncorroborated,
      and Li Chen is not treated as disproved by its mere publication.
  - speaker: Rhonda
    claim: Ridicules the aggressive forum posturing, asks Li Chen what became of his
      confrontation with Tex, and reacts skeptically to another commenter's fixation
      on food.
  - speaker: Reefer
    claim: Asks how a minority community could settle differences with members of
      Humanis after the narrated riots, providing the immediate context for Cain's
      reply; Reefer does not advocate the violent suggestion.
  - speaker: Cain
    claim: Responding to Reefer's question about Humanis, Cain proposes mutilating
      the opposing Humanis members by severing their fingers one at a time and forcing
      them to eat the fingers until they agree, then falsely characterizes this as
      an ancient East Asian custom. This is the fictional commenter's proposed coercive
      violence and ethnic stereotype, not an established event, Chinatown practice,
      or narrator-endorsed course of action; it is not a threat directed at Chinatown
      residents.
  - speaker: Travel Guy
    claim: Condemns Cain's violent comment for bringing shame on the community and
      offers to explain Chinatown's actual history and culture to interested people.
      He does not endorse Cain's statement.
  - speaker: Soldier of Fortune
    claim: Forecasts geopolitical consequences from Chinese developments in awakened
      magic and technology, references personal claims from a Hong Kong trip, and
      later speculates Li Chen may be a neuro-sleep-damper user. These are guesses,
      not verified setting facts.
  - speaker: Healey
    claim: Questions whether Li Chen monitors the bulletin-board service continuously
      based on response timing; this is a question, not proof of deception.
  - speaker: Nemo
    claim: Remarks that the thread has become excessively long, without offering an
      independent claim about Chinatown.
  attribution_policy: Keep publication-narrator chronology distinct from named posters'
    claims, speculation, stereotype, proposed violence, direct denials and questions.
headline: 'FASA Corporation (1994) Denver: The City of Shadows (FASA7212), fictional
  Shadowrun Second Edition-era Chinatown attributed bulletin-board disputes — printed
  109-112/PDF 110-113'
summary: 'Fictional Shadowland discussion from FASA Corporation’s Denver: The City
  of Shadows (1994, FASA7212, source.fasa-7212), Shadowrun Second Edition-era, printed
  pp109–112/PDF pp110–113. Preserves explicit opposing accounts and attributes Cain’s
  suggestion of coercive mutilation to Cain alone, not to Chinatown residents or to
  the narrator.'
