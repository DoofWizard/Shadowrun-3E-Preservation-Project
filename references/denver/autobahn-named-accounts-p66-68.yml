data:
  publication_context: 'Published fictional tabletop-RPG sourcebook Denver: The City
    of Shadows, FASA Corporation, FASA7212/source.fasa-7212, original Shadowrun Second
    Edition-era text, printed pp66-68/PDF pp67-69; not an SR3 conversion.'
  section: The Real Power — Running the Autobahn, from the opening on printed p66
    through the closing named comments on p68
  speakers:
  - speaker: Crystal
    assertion_type: editorial introduction
    reported_statement: Introduces the fictional t-bird pilot Rat Tail as a guest
      commentator on the Autobahn. Crystal says the group lacks reliable information
      about the chosen topic, not that every detail is independently verified.
  - speaker: Rat Tail
    assertion_type: first-person pilot narrative and judgment
    reported_statement: Describes an intense, hazardous fictional t-bird-pilot career,
      claims nearly ten years flying the Denver runs, and says competition, rapidly
      rising electronic-countermeasure costs and sophisticated border defenses make
      independent operators’ work progressively harder. He advises selecting reliable
      aircraft and crew, reflects on varying weapon/sensor configurations and fictive
      route preparation, and warns about overconfidence, unreliable bought route intelligence
      and unpredictable obstructions. These are his in-world views, not a published
      game-resolution rule or real-world flight instructions.
  - speaker: Rat Tail
    assertion_type: quantified anecdote, not rule
    reported_statement: Claims that around five years before the discussion an ECM
      suite cost approximately 10 percent of a t-bird’s value, whereas current counter-countermeasure
      electronics can account for almost half the price of a newly commissioned craft.
      Elsewhere he calls civilian GPS accuracy about plus-or-minus 5 meters for his
      fictional example; these are speaker claims rather than edition-wide prices,
      equipment statistics or tests.
  - speaker: Kris
    assertion_type: sarcastic counterexample
    reported_statement: Teases Rat Tail over allegedly mounting a 125mm railgun from
      a main battle tank on his aircraft and modifying the craft’s drones into combat
      roles; Rat Tail replies that it was a cheap purchase and points to occasional
      jobs beyond cargo transfer.
  - speaker: Lulu
    assertion_type: unverified in-world hazard estimates
    reported_statement: 'Gives claimed t-bird novice fatality odds: about one in six
      within the first five runs, about one in sixteen for runs six through fifteen,
      about one in six for runs sixteen through twenty-two, and roughly one in fifty
      after extensive experience. Lulu also says over twenty runs brings a one-in-three
      chance of dying in a t-bird fire. These claims are not a game rule or actuarial
      fact and are not reconciled into a single empirical rate.'
  - speaker: Toshiro
    assertion_type: proposal and opinion
    reported_statement: Advocates a fictional pilots’ association to share resources
      for independent operators in response to escalating technical costs; frames
      it as an opinion, not as an established organization.
  - speaker: Zak
    assertion_type: derisive response
    reported_statement: Responds sarcastically to Toshiro’s call for organization.
  - speaker: Nguyen
    assertion_type: personal taunt
    reported_statement: Accuses Toshiro of performative sincerity and makes a personal
      taunt; this is not supported evidence of family ties.
  - speaker: Cargo Cult
    assertion_type: alleged conventional route names
    reported_statement: Claims some fictional “public-domain” flight routes known
      to veteran jammers include Ho Chi Minh Trail, Route Pack One, Route 66 and Yellow
      Brick Road.
  - speaker: Yogi
    assertion_type: commentary
    reported_statement: Mocks the assertion that the named widely known routes remain
      useful by claiming they are too crowded.
  - speaker: Bald Weasel
    assertion_type: assertion and analogy
    reported_statement: Claims the allegedly public routes are crowded with other
      users and military forces, comparing evasive transit on them to walking through
      crowded urban streets while unseen.
  - speaker: Firelight
    assertion_type: in-world market observation
    reported_statement: Alleges that some fictional fixers sell information about
      military listening stations, patrol schedules and assignments, characterizing
      it as expensive but generally accurate. This is a named speaker’s claim about
      the invented setting, not real-world sourcing guidance.
  editorial_boundary: All in-world speaker accounts are attributed and qualified.
    This record preserves asserted quantities and terminology without treating them
    as actual real-world operational advice, verified safety statistics, exact equipment
    game mechanics or narrator-established facts.
