        "attribution": "alleges concealed Ares-supplied Underground-to-Air Missiles along portions of the fictional CAS-Pueblo border and offers a warning about their alleged detection and pursuit capabilities; this is not established narration or real-world advice"
      },
      {
        "speaker": "Trish",
        "page": 104,
        "attribution": "reacts incredulously to Daryl's claims about the missiles and their prospects for flight"
