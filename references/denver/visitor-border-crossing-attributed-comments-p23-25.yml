data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    published fictional Shadowrun Second Edition-era tabletop-RPG sourcebook; source.fasa-7212;
    no inferred Third Edition conversion.'
  source_context: Historically published in-world fictional setting information; narrator
    facts, attributed Shadowland posts, and hypothetical examples are distinct.
  extraction:
    source_status: These are invented-world Shadowland poster statements, neither
      modern factual border policy nor practical advice.
    posts:
    - speaker: Hopalyte
      printed_page: 23
      claim: Compares checkpoint metal and chemical scans with intrusive screening;
        characterizes additional examinations in sarcastic language.
    - speaker: Blackstone
      printed_page: 23
      claim: Claims magic users inspect unusual magical items and may separately question
        those carrying foci or fetishes.
    - speaker: Firelight
      printed_page: 23
      claim: Disputes that every checkpoint is staffed by such magic users; this explicitly
        contradicts Blackstone’s broad formulation.
    - speaker: Remember Haiti
      printed_page: 23
      claim: Says the imaginary sectors’ screening templates disproportionately flag
        orks and trolls, criticizing racial discrimination.
    - speaker: Armband
      printed_page: 23
      claim: Expresses a racist counterclaim; this is attributed prejudice, not an
        endorsed narrator fact.
    - speaker: Monk
      printed_page: 23
      claim: Mentions a sector-level appeals process after improper inspection or
        refusal, but doubts meaningful satisfaction.
    - speaker: Wu
      printed_page: 24
      claim: Describes involuntary cyberware control-circuit restraints on some weaponized
        augmentations; states that other equipment can lead to denial of entry.
    - speaker: OK
      printed_page: 24
      claim: Rejects a forced implant restraint; Wu replies that authorities may withhold
        legal admission.
    - speaker: Firelight
      printed_page: 24
      claim: Alleges some devices malfunction or remain in test mode; alleges changing
        software states through Matrix connections, without establishing a universal
        access vulnerability.
    - speaker: Top Shot
      printed_page: 24
      claim: Calls attention to the regular software updating of checkpoint equipment.
    - speaker: Z Bart
      printed_page: 24
      claim: Claims border staff have coercive authority to disassemble inspected
        vehicles and need not reassemble them.
    - speaker: Widowmaker
      printed_page: 24
      claim: States that female travelers experience gender-based harassment; attributed
        source assertion.
    - speaker: Lew
      printed_page: 25
      claim: Claims officials confiscate vehicles associated with smuggling; Legal
        Beagle responds that the sectors disagree about which goods constitute contraband.
    - speaker: Trisha
      printed_page: 25
      claim: Claims customs sometimes omit inspection of known routine deliveries.
framing: newsroom_neutral
