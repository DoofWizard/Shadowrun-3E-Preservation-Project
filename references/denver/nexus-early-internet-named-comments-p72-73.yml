data:
  publication_context: 'Fictional tabletop RPG historical sourcebook Denver: The City
    of Shadows, FASA Corporation (1994), FASA7212 / source.fasa-7212; original Shadowrun
    Second Edition-era setting, not converted to Third Edition. Printed folios are
    cited with their actual one-higher physical PDF pagination.'
  section: Named Shadowland discussion of Internet and early Matrix history
  named_speaker_claims:
  - speaker: Firelight
    printed_page: 72
    timestamp: 21:36:14/5-23-55
    claim: Expresses discomfort with the personalities behind the Nexus and an unexplained
      feeling about them; does not provide corroboration.
  - speaker: Pop
    printed_page: 72
    timestamp: 20:05:46/5-18-55
    claim: Questions how early network users could have been tracked given limited
      technological security; the speaker’s skepticism is not a book-narrator conclusion.
  - speaker: FastJack
    printed_page: 72
    timestamp: 00:45:59/5-19-55
    claim: Argues that early Internet pioneers used anonymity and message-forwarding
      arrangements, including blind-distribution nodes, false-trace worms and microcode plasmids; contrasts
      this with later Matrix systems. The post is an attributed historical claim,
      not an operational procedure.
  - speaker: FastJack
    printed_page: 72
    timestamp: 00:47:43/5-19-55
    claim: Alleges that the United States National Security Agency exploited its influence
      over DES and promoted the standard while alternative encryption products eventually
      spread.
  - speaker: FastJack
    printed_page: 72
    timestamp: 00:49:51/5-19-55
    claim: Remarks that government efforts to restrain electronic communications succeeded
      to a frightening degree.
  - speaker: Finnigan
    printed_page: 72
    continued_page: 73
    timestamp: 13:33:50/5-24-55
    claim: Claims the government pushed universities and network operators toward
      shutting or policing Internet infrastructure, using continuing support as leverage.
  - speaker: FastJack
    printed_page: 73
    timestamp: 01:10:12/5-19-55
    claim: Claims old Shadowland access was reached by penetrating named commercial
      communication-provider networks and that routing changed regularly.
  - speaker: Rage
    printed_page: 73
    timestamp: 00:03:34/5-19-55
    claim: Challenges the asserted sophistication of early Shadowland defenses.
  - speaker: FastJack
    printed_page: 73
    timestamp: 01:13:45/5-19-55
    claim: Responds that comparable technical methods dated back to the late 1980s
      in the fictional account.
  - speaker: FastJack
    printed_page: 73
    timestamp: 01:16:45/5-19-55
    claim: Reproduces a message said to have been found on Shadowland in 2011 from
      Saeletra, dated 12-24-11 with routing error B092, greeting readers returning
      to the network. He interprets this as potentially significant to Awakening-related
      mysteries.
  scope: Every item above is attributed to a fictional Shadowland poster; historical-sounding
    security, legal and technological assertions are not independently authenticated
    real-world facts.
