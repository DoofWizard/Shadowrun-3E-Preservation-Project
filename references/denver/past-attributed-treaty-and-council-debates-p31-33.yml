data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994), a published fictional
    Shadowrun Second Edition-era tabletop role-playing sourcebook, catalog source.fasa-7212; no inferred
    Third Edition conversion.'
  extraction:
    posts:
    - speaker: Bower
      claim: Argues other governments prudently waited to see which side would prevail before recognizing
        the NAN states; lists risk of alienating either party.
      status: Attributed geopolitical interpretation.
    - speaker: The Chromed Accountant
      claim: Questions whether the commission's tax-cap system could prevent economic pressure through
        later fiscal levies.
      status: Opinion and criticism.
    - speaker: The Keynesian Kid
      claim: Claims the commission rapidly raised income and value-added taxes to their treaty maxima
        with an almost unanimous vote.
      status: Attributed account of commission vote, not stated as independently documented tally.
    - speaker: Hangfire
      claim: Claims claimant governments kept heavily armed civilian security contractors and advisors
        inside the Free Zone as a workaround to military restrictions.
      status: Attributed allegation about the purported civilian status of armed personnel.
    - speaker: Zoomy
      claim: Claims combat aircraft were held near Peterson rather than legally stationed in the city.
      status: Attributed allegation about circumvention.
    - speaker: Hammer Damaged
      claim: Makes an unsuccessful effort to display the claimed treaty document.
      status: Forum conversational exchange, not a source of treaty text.
    - speaker: Loree
      claim: Comments that U.S. authorities allegedly exploited a legal opening in the Treaty of Denver
        for almost twenty years.
      status: Attributed view.
    - speaker: Olivia
      claim: Disputes calling the three nations' joint voting behavior ethnic solidarity.
      status: Attributed disagreement.
    - speaker: Lucy Wu
      claim: Attributes the tribal voting bloc to recent war with the United States and their mutual distrust;
        observes Aztlan's regional difference.
      status: Attributed historical interpretation.
  editorial_review_notes: Sourceboard comment labels and status retained; neither military-rule loopholes
    nor hostile remarks are endorsed.
framing: newsroom_neutral
