data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    published fictional Shadowrun Second Edition-era tabletop-RPG sourcebook; source.fasa-7212;
    no inferred Third Edition conversion.'
  source_context: Historically published in-world fictional setting information; narrator
    facts, attributed Shadowland posts, and hypothetical examples are distinct.
  extraction:
    crossing_discussion:
      narrator: The 2055 Shadowland discussion presents a community of independent
        intersector transportation intermediaries known as coyotes, distinguished
        by sectors served, trustworthiness, prices and whether they transport people
        or goods.
      example: A fictional intermediary called Dutch specializes in Aztlan-sector
        passage, refuses large loads and groups, and does not claim coverage of every
        sector.
      claimed_payment:
        speaker: Magister
        date_printed: 6-5-55
        single_sector_low_quote_nuyen: 2500
        reputable_service_quote_nuyen: 10000
        certainty: A named speaker’s price estimates, not endorsed market rates or
          practical procurement guidance.
      possible_abuse: Some commenters allege that false documents, corrupt officials,
        or unofficial underground routes are offered; the source also warns about
        exploitation, deception, and danger. These are in-world accounts, not recommended
        instructions.
      named_claims:
      - speaker: Zil
        claim: Reports rumors of sector security agents posing as transport intermediaries.
      - speaker: Lennox
        claim: Says he has heard the same rumors; no verification is offered.
      - speaker: Argent
        claim: Warns against entrusting consequential movement to unknown intermediaries.
      - speaker: Third Man
        claim: Mentions concealed under-border infrastructure as a rumor or first-person
          claim, without operational detail.
    extradition_framework:
      narrator: The book describes intersector extradition cooperation as inconsistent
        and subject to ongoing Treaty interpretation. Crimes are assessed under laws
        of the sector in which the suspect currently resides, not necessarily the
        requesting sector.
      comparisons: The narrator contrasts Ute and Sioux cooperation in certain cases
        with other sectors’ resistance; it compares universally prohibited conduct
        with goods illegal only in some sectors.
      named_claims:
      - speaker: SPD
        claim: 'Describes three hypothetical approaches: abandonment of a complaint,
          covert forced return for trial, or retaliation; these are described as extra-legal
          fictional possibilities, not endorsed lawful process.'
      - speaker: Pyramid Watcher
        claim: Accuses Aztlan of more effective covert rendition; allegation unconfirmed.
      - speaker: Pammy
        claim: Accuses Sioux officials of using former Wildcats in alleged covert
          enforcement; the post explicitly says officials publicly deny any knowledge.
      - speaker: Valerie
        claim: Warns that megacorporate extraterritorial jurisdiction and opportunistic
          interpretations make extradition unpredictable.
