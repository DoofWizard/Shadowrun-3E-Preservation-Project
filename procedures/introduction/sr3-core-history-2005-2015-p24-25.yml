    voice: Continuation of the fictional Captain Chaos first-person source-era historical
      account; narrator allegations and interpretations retain attribution.
    excluded_separate_sidebar: The boxed Disasters-R-Us date-and-damage list on p25
      is a distinct factual-table/sidebox source obligation, not exhausted by this
      main-text chronicle.
  source_period_chronology:
    japan_2005_2006: The narrator describes a Japanese corporate-backed conflict in
      2005 involving Korea, a failed North Korean missile launch in 2006, and the
      proclamation of the Japanese Imperial State; he links subsequent influence to
      fictional microwave-power satellites. These are source-world events, not current
      geopolitics.
    vitas_2010: The original chronicle says Virally Induced Toxic Allergy Syndrome
      (VITAS) first appeared in India in 2010 and, by the end of that year, had claimed
      roughly one quarter of the fictional world’s population; the source portrays
      severe discriminatory and violent social responses.
    metahuman_births_2011: The speaker dates the widespread appearance of elf and
      dwarf infants in human families to 2011, known in the original game as Unexplained
      Genetic Expression (UGE), and frames it as an early manifestation of the Awakening.
    ryumyo_2011: The speaker dates the first public appearance of the great dragon
      Ryumyo near Mount Fuji to 24 December 2011, alongside claims about Daniel Howling
      Coyote’s escape and his later role in the formation of the Native American Nations.
    magic_changes_2011: The narrator describes a series of mana storms, changed landscapes
      and sacred sites as fictional signs of magic returning, without specifying any
      dice pool, TN or game environment modifier in this passage.
    dunkelzahn_2012: The source dates Dunkelzahn’s public appearance near Cherry Creek
      Lake in Denver to 27 January 2012 and attributes an extended interview to Holly
      Brighton; this is historical in-world reporting rather than a mandatory dragon
      encounter.
    nation_states_2014_2015: The narrator dates the announced formation of the Native
      American Nations to 2014 and the Mexican political renaming to Aztlan in 2015;
      he separately alleges a close relationship between the new Aztlan government
      and fictional ORO Corporation, making that political evaluation explicitly speaker-attributed.
  rules_boundary:
    independent_mechanics: No standalone character-creation prerequisite, combat procedure,
      Force level, test difficulty, dice-pool calculation, damage effect or mandatory
      magic ability is printed in the reviewed main prose.
    scope: Only the historical narrative body of pp24-25 is covered; the p25 boxed
      disaster chronology and surrounding pp23/26 onward remain distinct source-class
      audits.
