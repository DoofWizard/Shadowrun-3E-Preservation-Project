    source_images: Original printed pp24-25/PDF25-26 rendered and directly visually
      inspected from newly reacquired SHA-verified 345-page scan prior to baseline
      freeze; original p23/PDF24 is a full-page illustration, not inferred missing
      narrative text.
    fidelity: Publisher, edition, original fictional-world framing and the in-world
      speaker’s uncertainty and opinions retained. Dates, names and the roughly one-quarter
      VITAS world-population statistic are source-qualified. No real-world medical/political
      assertion or invented playable rule.
