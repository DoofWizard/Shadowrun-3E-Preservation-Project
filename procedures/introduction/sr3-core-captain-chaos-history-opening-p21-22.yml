    original_image_review: Original PDF page images for printed pp21-22/PDF22-23 were
      independently rendered and read directly from the freshly reacquired 345-page
      original FASA7001 scan before baseline freeze.
    speaker_certainty_and_agency: All contentious historical events are clearly attributed
      to Captain Chaos as in-world speaker; the source’s allegation of corporate involvement
      and the uncertainty around missile non-impact remain qualified. Coercive treatment
      is not euphemized as voluntary relocation.
    no_rule_invention: The reviewed pages contain setting rhetoric and fictional history,
      not new game tests or numeric mechanics; no supersession or real-world assertions
      are invented.
