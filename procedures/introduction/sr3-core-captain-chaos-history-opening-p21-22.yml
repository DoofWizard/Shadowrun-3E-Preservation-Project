  attributed_author_and_context:
    speaker: Captain Chaos
    voice: First-person in-world historical commentary, with editorial judgments,
      questions and attributed uncertainty rather than an omniscient rule narrator.
    role: The speaker identifies himself as the sysop of Shadowland, a Seattle next-generation
      BBS associated with the Denver Data Haven information-exchange nexus.
    reason_for_history: He describes the board as a place where runners share experiences
      and information, and proposes a historical account to explain the fictional
      Sixth World to its users.
  source_period_setting_claims:
    corporations_and_runners: The speaker depicts multinational megacorporations as
      influential over world institutions, and describes shadowrunners as individuals
      who accept paid off-channel assignments in that fictional corporate world.
    inequality_and_magic: He emphasizes disparities in access to technology, guarded
      wealth, damaged urban environments and the return of magic; these are the character’s
      evaluative observations, not mandatory tabletop effects.
    shiawase_decisions: The speaker dates two fictional U.S. Supreme Court decisions
      to 1999 and 2001. He describes the first as supporting Shiawase corporate armed
      protection and the second as establishing broad corporate extraterritorial rights.
      He separately suggests possible corporate involvement in a prior incident without
      presenting that suggestion as proven.
    resource_rush_and_saim: The account places the fictional Resource Rush after the
      Shiawase decisions and describes corporate acquisition of reservation land and
      resources, resistance by the Sovereign American Indian Movement (SAIM), and
      an escalation involving the U.S. Shiloh launch facility in Montana.
    lone_eagle_incident: The account names the Lone Eagle incident and describes a
      threatened missile confrontation, a response by U.S. forces and missiles that
      did not strike. The narrator explicitly says the reason for the non-impact remains
      unknown and discusses competing interpretations; no explanation is adopted as
      established truth.
    fictional_2009_legislation: The speaker describes the fictional Re-Education and
      Relocation Act as a discriminatory U.S. policy enacted in 2009 and alleges coercive
      confinement and mistreatment of Native Americans. These are attributed in-world
      historical claims, not statements about actual U.S. policy.
  classification_and_limits:
