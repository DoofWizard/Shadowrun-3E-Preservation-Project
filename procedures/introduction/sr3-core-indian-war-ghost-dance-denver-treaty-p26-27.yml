  reported_fictional_sequence:
  - stage: Sovereign Tribal Council claim and ultimatum
    narrative: The Native American Nations coalition, led by the Sovereign Tribal
      Council, claims all of North America and orders non-Native people to depart
      on threat of severe magical punishment.
    qualification: The narrator says the ultimatum uses the label Anglos broadly to
      encompass non-Native people of many ancestries; these are the fictional coalition’s
      coercive demands rather than agreed legal entitlement.
  - stage: Redondo Peak and Los Alamos
    narrative: The source says Redondo Peak in New Mexico erupts and buries Los Alamos;
      Howling Coyote thereafter broadcasts from a nearby Zuni reservation, claiming
      to have invoked Mother Earth to punish those who forsook her.
    qualification: The invocation is Howling Coyote’s attributed claim; the story
      does not require the archival record to establish a real magical causal mechanism.
  - stage: Sixth Air Cavalry Battalion and uprising
    narrative: The Sixth Air Cavalry Battalion departs Fort Hood, Texas within an
      hour of the broadcast and is destroyed by sudden violent tornadoes. The narrator
      identifies this as the beginning of a fictional NAN guerrilla war.
  - stage: 2016 American leadership and expulsion policy
    narrative: The narrator portrays President Garrety and his successor William Jarman
      as hostile to Native American people. In 2016 William Springer kills Garrety,
      and Jarman, previously vice-president, takes office and issues Executive Order
      17-321 calling for extermination of Native American tribes; Congress subsequently
      ratifies it as the Resolution Act of 2016.
    qualification: This coercive and murderous policy is a book-narrated fictional
      political atrocity, not a real-world decree, endorsement or instructions.
  - stage: Great Ghost Dance and catastrophic eruptions
    narrative: Howling Coyote responds with supernatural action and his followers,
      later described as Native Americans throughout the continent, undertake the
      ritual called the Great Ghost Dance. The narrator says it raises magical power;
      uncanny weather disrupts American military bases and supply facilities. On August
      17, 2017, Mount Hood, Mount Rainier, Mount St. Helens and Mount Adams erupt.
    qualification: These are original fictional-source claims and narration, not independently
      demonstrable real-world causal facts or tabletop spell/ritual mechanics.
  - stage: 2018 Treaty of Denver negotiation
    narrative: In 2018 leaders of the United States and Canada meet the NAN in Denver.
      Aztlan joins the discussions after gaining a seat on the Sovereign Tribal Council
      in exchange for assistance and havens for NAN forces. The treaty is negotiated
      over three months.
  - stage: Territorial Treaty of Denver provisions
    narrative: The Treaty of Denver recognizes NAN sovereignty over most of western
      North America and establishes reservations for nontribal residents and corporations.
      It retains Seattle as an extraterritorial extension of its governments and most
      of California under United States control. Denver becomes the Treaty City under
      joint administration by the signing parties.
    qualification: The narrator remarks that the arrangement pleases few and describes
      a fictional later smuggling environment; not a new travel, trading or customs
      game rule.
