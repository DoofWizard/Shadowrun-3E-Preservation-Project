id: procedure.matrix.system-operation
record_type: procedure
name: "Matrix System Operation"
domain: matrix
status: ingested
effective: {status: current, source: source.sr3-core, page: 214, basis: defines}
purpose: "Perform an authorized or unauthorized task on a Matrix grid/host/subsystem."
prerequisites: ["Matrix access","appropriate operation/utility"]
inputs: ["operation","target subsystem","Computer Skill","Hacking Pool","utility","system ratings"]
stages:
  - {id: choose, name: "Choose Operation", test_or_action: "Select the desired operation and its target subsystem/action type.", outputs: ["operation profile"]}
  - {id: test, name: "System Test", test_or_action: "Resolve the System Test against the target subsystem rating.", outputs: ["operation successes","Security Test/tally consequences"]}
  - {id: duration, name: "Resolve Duration", test_or_action: "Apply Free/Simple/Complex or ongoing/monitored duration rules.", outputs: ["completion timing"]}
  - {id: effect, name: "Apply Operation", test_or_action: "Apply operation-specific effects.", outputs: ["system change/data/control result"]}
outcomes: ["successful operation","failed operation","security escalation"]
links:
  uses: [rule.matrix.system-test]
  requires: []
  produces: []
  modified_by: []
sources:
  - {source: source.sr3-core, page: 214, relation: defines, note: "System Operations / Interrogations / Ongoing Operations"}
  - {source: source.sr3-core, page: 215, relation: extends, note: "Operation descriptions"}
  - {source: source.sr3-core, page: 219, relation: extends, note: "Additional operations and uploads"}
notes:
  - "Specific operations should be represented as child records where later supplements add/modify them."
