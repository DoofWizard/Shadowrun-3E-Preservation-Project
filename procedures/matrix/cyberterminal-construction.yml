id: procedure.matrix.cyberterminal-construction
record_type: procedure
name: "Cyberterminal Construction"
domain: matrix
status: ingested

effective:
  status: current
  source: source.matrix
  page: 52
  basis: extends

purpose: "Construct or upgrade cyberterminal/cyberdeck components."

prerequisites:
  - "appropriate tools/parts"
  - "Computer B/R skill or permitted defaults as specified"

inputs:
  - "component design"
  - "target cyberterminal/MPCP context"
  - "software and hardware requirements"

stages:
  - id: design
    name: "Design"
    test_or_action: "Cyberterminal Design Knowledge test where required"
    outputs: ["design result and possible later-test/time modifiers"]
  - id: software
    name: "Software"
    test_or_action: "Programming Test where software is required"
    outputs: ["component software"]
  - id: cook
    name: "Cook"
    test_or_action: "Cook Test where encoded software is required"
    outputs: ["programmed optical code chips"]
  - id: installation
    name: "Installation"
    test_or_action: "Component-specific Installation Test"
    outputs: ["installed component"]

outcomes:
  - "functional component or upgraded cyberterminal when all required stages succeed"

