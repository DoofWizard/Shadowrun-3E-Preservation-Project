pdf_pages: "148-149"
edition_scope: SR3
content_class: [rule_procedure]
effective: {status: current, source: source.mm, page: 147, basis: defines}
purpose: Resolve bioware installation and removal and replacement body parts in the fictional tabletop rules.
prerequisites: []
inputs: [bioware or body part, recipient, planned options]
stages: []
outcomes: [bioware installed or removed, organ or limb transplanted, rejection or Stress on failure]
data:
  separate_surgery_test_per_bioware_item_and_replacement_part: true
  may_follow_trauma_surgery: true
  options:
    negative: [Bio Index Gain, Fragility (bioware only), Sensitive (bioware only), Surgical Stress]
    positive: [Bio Index Reduction, Bio Index Slot, Nanosurgery, Rugged]
  install_bioware:
    target_number: 5
    prerequisite: implant available
    failure: implanted item rejected; character cannot heal and takes 1 additional Physical damage box per day until it is removed
  remove_bioware:
    target_number: 4
    recovers_bio_index: false
    permanent_implant_stress_points: 1
    replacement_part: usually required
    failure: implant remains, gains 1 Stress Point and must make a Stress Test
  transplant_organ_or_limb:
    target_number: 5
    replacement_sources: [another person, cloned spare]
    failure: transplanted part rejected; character cannot heal and takes 1 additional Physical damage box per day until it is removed
