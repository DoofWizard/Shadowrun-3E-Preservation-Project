id: procedure.surgery.operation
record_type: procedure
name: Surgical Procedure
domain: surgery
status: ingested
source: source.mm
printed_pages: "144-145"
pdf_pages: "145-146"
edition_scope: SR3
content_class: [rule_procedure]
effective: {status: current, source: source.mm, page: 144, basis: defines}
purpose: Resolve the diagnosis, planning, test and results of a fictional tabletop surgical procedure.
prerequisites: [appropriate medical provider, required medical skills and equipment]
inputs: [procedure type, patient profile, surgeon skills, Surgical Threshold, options, facility and equipment]
stages:
  - {id: diagnosis, name: Diagnosis and Profiling, test_or_action: Establish or consult medical profile, outputs: [patient profile]}
  - {id: plan, name: Planning and Preparation, test_or_action: Create ordered Procedural List, outputs: [Procedural List]}
  - {id: surgery, name: Surgical Test, test_or_action: Resolve successes and Surgical Threshold, outputs: [procedure result]}
  - {id: recovery, name: Postoperative Recovery, test_or_action: Apply procedure-specific wound and recovery rules, outputs: [postoperative state]}
outcomes: [failed procedure, successful procedure with negative or neutral or positive options]
data:
  procedural_list:
    negative_options_required: 2
    results_by_successes:
      "0": failure
      "1": success with both negative options
      "2": success with second negative option only
      "3": success with neither negative option
      "4": success with first positive option
      "5+": success with two positive options and one more per extra success up to limit
    surgical_threshold:
      test_type: open-ended Success Test
      base_threshold: Procedure base target number
      option_modifiers: Cumulative as options are reached in order.
      stopping_condition: If highest test result fails modified Threshold, current and subsequent options are not achieved even with successes remaining.
    multiple_procedures: Allowed in one session; later procedures become harder.
  medical_profile:
    purpose: Assess general health and magical activity, identify risks and Type O transplant matches.
    required_for: Platinum or super-platinum medical-care contract including implant detection.
    facility: medical shop or facility
    base_time_hours: 48
    test: Medicine
    target_number: 4
    extra_successes: May shorten base time.
    patient_presence_fraction: 0.25
    specialized_profile: GM may require one for certain procedures or options.
    expiration: Profile is time-sensitive because physiology changes, including new implants and wounds.
links: {uses: [entity.skill.biotech, rule.surgery.surgical-test, procedure.surgery.planning], requires: [procedure.surgery.find-provider], produces: [], modified_by: [option.surgery.surgical-options]}
sources:
