  planning_time_multipliers: {alphaware: 2, betaware: 4, deltaware: 8, cultured_bioware: 6, nanoware: 4, each_positive_option: Threshold Modifier}
  medicine_test:
    base_target_number: 4
    modifier_per_positive_option: 1
    successes: May reduce base planning time.
  surgical_data_size_mp: Twice the base time including modifiers.
