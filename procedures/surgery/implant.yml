id: procedure.surgery.implant
record_type: procedure
name: Implant Surgery
domain: surgery
status: ingested
source: source.mm
printed_pages: "146-147"
pdf_pages: "147-148"
edition_scope: SR3
content_class: [rule_procedure]
effective: {status: current, source: source.mm, page: 146, basis: defines}
purpose: Resolve installation, removal, repair and upgrades of fictional cyberware.
prerequisites: []
inputs: [implant, procedure type, implant grade, planned options]
stages: []
outcomes: [implant installed or removed, Stress repaired, upgrade, failure effects]
data:
  cybermancy: {target_number: special, reference: M&M p55 Less Than Zero}
  install:
    target_number: 4
    grades: all
    starting_characters: Advanced surgery rules do not apply to pregame implants.
    post_trauma: Basic or alpha grade only unless contingency arrangements were filed beforehand.
    used_implant_chance_percent: 50
    used_implant_condition: Post-trauma patient in illegal care or street-doc care, or in legal care lacking SIN or funds.
    failure: Implant is installed but rejected; no healing and 1 additional Physical damage box per day until removed.
    nanoware: Fixed nanoware and nanite facilitator implants require Nanosurgery option.
  remove:
    target_number: 3
    essence_restored: false
    permanent_implant_stress: 1D6 divided by 2
    failure: Implant stays installed, gains 1D6 divided by 2 Stress and makes a Stress Test.
  repair_stress:
    target_number: 3
    minimum_successes: 3
    success: Remove 1 Stress Point; higher Biotech Skill doctor required for remaining Stress.
    failure: One Stress Point becomes permanently unrepairable.
    post_trauma_allowed: false
  repair_failure:
    target_number: 4
    minimum_successes: 3
    success: Restore function and reduce Stress Points to 6 (Serious level).
    failure: One Stress Point becomes permanently unrepairable.
    post_trauma_allowed: false
  upgrade:
    target_number: 4
    removal_required: false
    cost_and_essence_cost: Upgraded implant total minus old implant total, respectively.
    failure: No upgrade; implant gains 1 Stress Point.
    post_trauma_allowed: false
  options:
    negative: [Essence Cost, Fragility, Obvious, Sensitive]
    positive: [Concealed, Essence Reduction, Essence Slot, Nanosurgery, Redundancy, Remove Stress Point, Rugged]
