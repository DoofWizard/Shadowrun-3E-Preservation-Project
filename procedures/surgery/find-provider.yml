id: procedure.surgery.find-provider
record_type: procedure
name: Find Medical Provider
domain: surgery
status: ingested
source: source.mm
printed_pages: "140-144"
pdf_pages: "141-145"
edition_scope: SR3
content_class: [rule_procedure]
effective: {status: current, source: source.mm, page: 143, basis: defines}
purpose: Locate a medical provider with capabilities appropriate to a fictional character's desired treatment or surgery.
prerequisites: [need for medical care]
inputs: [contacts, desired surgery or treatment, implant grade, legality, Etiquette, provider rating]
data:
  search:
    test: Etiquette
    base_target_number: 4
    minimum_successes: 1
    modifiers:
      appropriate_contact: {fixer_government_official_or_organlegger: -1, medical_professional: -2}
      provider_sought: {corporate: 2, private: 1, illegal: -1, public: -2, clinic: 0, hospital: 2}
      surgery_type: {cosmetic: -1, implant: 1, therapeutic: 0, transimplant: 1, trauma: 0, nanosurgery: 2}
      implant_grade: {basic_cyberware: 0, alpha_or_basic_and_cosmetic_bioware: 2, beta_or_cultured_bioware: 4, delta: 8, nanoware: 4}
      legality: {legal: -1, paralegal_or_class_A: 0, security_or_class_B: 1, military_or_class_C: 2}
      per_extra_required_skill: 1
    contact_applicability: Nonmedical contacts must be relevant to the requested provider. Medical professionals always provide the medical-contact modifier.
    worked_example:
      provider: illegal clinic
      surgery: implant
      grade: alphaware
      legality: security grade
      modifiers: [-1, 1, 2, 1]
      total_modifier: 3
    contact_example: A city official may know public medical centers but is not useful for finding a black clinic.
    standard_skills: [Biotech, Medicine]
    nanosurgery_definition: A surgery that uses the nanosurgery option (M&M p150).
    rating_and_time: Use the provider ratings table in rule.surgery.provider-ratings.
    extra_successes: Extra successes may reduce search time by dividing time by successes or increase medical gear rating by one per success, maximum 6.
    cap_note: The source gives a cap of 6 on this increase despite listing a base rating of 8 for delta-equipped providers; no reduction of a higher base rating is inferred.
    staff_skills: Resolve each attending skill independently according to rule.surgery.provider-ratings.
  access:
    trigger: A fictional character requests an exception to provider regulations or special consideration.
    test: Etiquette
    base_target_number: medical_center_rating
    modifiers: Applicable Medical Search and SR3 Social Modifiers Table (p94) plus GM situational modifiers.
    fictional_payment_modifier:
      threshold_fraction_of_service_cost: 0.10
      target_number_modifier: -2
      condition: In the game, offering at least the printed compensation threshold generally grants this modifier.
    failed_test: The provider refuses. The GM may allow an Intimidation or other coercion attempt, with the possibility of referral to the authorities.
    conditions: Provider may require identification, payment, lawful service, corporate credentials or scrip, patient records, reporting, or samples.
  provider_access_conditions:
    corporate:
      usual_clientele: [corporate employees, corporate citizens]
      credentials: corporate ID and SIN required; fictional source also permits convincing forged credentials
      payment: many accept only corporate scrip
      employee_care: usual access to trauma and implant treatment
      outside_clientele: access may be negotiated with a corporate Johnson
      equipment_and_services: may be sole source of some implants or procedures; alpha-grade or better gear and more skilled doctors more likely
      emergency_service: some offer equivalent service at higher cost and slower response
      jurisdiction: many AA and AAA corporate facilities have extraterritorial status; local implant laws need not apply within their own jurisdiction
      privacy: corporation knows implant and procedure details; possible sample retention, unwanted implantation, or use of the character to test experimental procedures or devices; consent for testing not specified
    docwagon:
      jurisdiction: extraterritorial clinics
      confidentiality: patient location and records generally confidential
      extradition: generally acknowledges requests from Lone Star and other corporate security organizations
    private:
      eligibility: selected clientele; provider may select sectors or criteria
      exceptions: meeting criteria, doing a favor or payment may obtain access
      skill_quality: generally above public providers; provider's particular purpose may conflict with character goals
    public:
      access: generally open but lack of funds or SIN may delay or cause denial
      ordinary_wait: at least several hours unless situation is dire
      payment: some procedures require advance payment
      emergency_service: no high-threat response; ambulance or EMT encountering combat withdraws and contacts police
      jurisdiction: subject to local laws
      service_bias: source describes variable treatment priority based on race and class
      quality: generally average; privately operated public sites tend to be more professional than government sites
    black_clinic:
      access: illegal medical centers, usually specialize in illegal goods and procedures; many do not offer legal services
      identification_or_SIN_required: false
      advance_payment_required: true
      equipment_and_services: high-end facilities may have resources for advanced procedures; usually have connections for used implants and replacement organs
    scope_note: Qualitative fictional provider conditions affect access and service availability; no extra numerical modifiers inferred beyond the separate Medical Search and Emergency Care tables.
outcomes: [provider secured, search or access fails]
links:
  uses: [entity.skill.etiquette, rule.surgery.provider-ratings]
  requires: []
  produces: []
  modified_by: []
sources:
  - {source: source.mm, pages: "140-142", relation: defines, note: Medical Providers / provider access conditions}
  - {source: source.mm, page: 143, relation: defines, note: Non-Emergency Medical Care / Medical Search Table}
  - {source: source.mm, page: 144, relation: clarifies, note: Medical Ratings Table / Getting in the Door}
notes: []
headline: "FASA7126 Man & Machine (FASA Corporation, 1999, fictional Shadowrun Third Edition tabletop rules), printed pp140-144/PDF141-145: Finding Medical Providers"
framing: reference_exact
summary: "Provider-specific fictional access restrictions and the original non-emergency medical search example supplement the existing search and access procedure."
