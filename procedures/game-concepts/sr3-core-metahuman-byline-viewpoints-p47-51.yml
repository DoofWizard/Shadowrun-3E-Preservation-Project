  source_headings_and_byline_claims:
  - heading: Dwarfs
    speaker: Thaddeus
    source_role: trid pirate and sometime decker
    printed_pages: 47-48
    pdf_pages: 48-49
    stance: A dwarf character directly describes everyday height-related obstacles,
      mockery and a defensive subculture, as personal experiences rather than universal
      species traits.
    claims:
    - Thaddeus describes built environments sized for taller people, while also describing
      advantages in reach-limited spaces and cramped movement.
    - He reports a social habit of others treating dwarfs as children despite the
      book speaker identifying dwarfs as adults at age eighteen.
    - He attributes a defensive or confrontational reputation among some young dwarfs
      to repeated condescension and stereotyping, not an innate species rule.
    - He says some dwarf families live in basements or caverns because enclosed spaces
      feel comfortable; he notes that cheap rents may also contribute.
    - He rejects a guaranteed species-wide aptitude for mechanics, math or science
      and treats claimed biological explanations as speculative and stereotype-driven.
    certainty: Named first-person viewpoint, including conjecture and reported social
      experiences; not mandatory game rules.
  - heading: Elves
    speaker: Rowena
    source_role: rigger
    printed_pages: 48-49
    pdf_pages: 49-50
    stance: An elf character disputes flattering and hostile generalizations about
      elven beauty, privilege, culture and belonging.
    claims:
    - Rowena disputes that all elves are wealthy, attractive, gifted or socially accepted,
      describing poor and ordinary elves as well as pressure created by unrealistic
      expectations.
    - She describes prejudice from both non-elves and other elves, including treatment
      of people who do not match a fashionable elven ideal.
    - She observes that elven political homelands and migration have produced tensions
      for elves who remained elsewhere, while explicitly refusing to generalize all
      elven motives.
    - She reports rumors portraying elves as secret controllers of society and does
      not endorse these rumors as established facts.
    certainty: Personal account, social commentary, speculation and attributed rumors;
      no confirmed conspiracy or universal elven capacity.
  - heading: Humans
    speaker: Jason
    source_role: street samurai
    printed_pages: 49-49
    pdf_pages: 50-50
    stance: A human character contrasts historical majority privilege with prejudice,
      visibility and loss of assumed social centrality.
    claims:
    - Jason frames the humans-as-default historical comparison as producing advantages
      in everyday goods, design and public familiarity.
    - He describes human history and institutions as well known to the fictional world’s
      people while recognizing that the same default status has marginalized other
      metahuman groups.
    - He describes encounters with anti-human prejudice and places where humans are
      the minority, rather than saying every human is similarly affected.
    - He rejects the assumption that all human individuals are interchangeable and
      describes mutual resentment and contested rights.
    certainty: One speaker’s personal and historical interpretation; not a source-wide
      social modifier or moral rule.
  - heading: Orks
    speaker: Stella for Star
    source_role: mage
    printed_pages: 49-50
    pdf_pages: 50-51
    stance: An ork speaker explains how size, public fear, Goblinization-era stigma,
      discrimination and voluntary communal organizing shape some ork experiences.
    claims:
    - Stella says orks are numerous yet socially disrespected, and reports others
      fearing ork size and tusks.
    - She disputes generalized assumptions about ork nocturnal habits, inherent violence,
      intelligence and occupational capability.
    - She traces part of current prejudice to Goblinization and reports rejection
      by family and employers, including some people entering informal survival networks
      under economic pressure.
    - She says ork communities have responded with mutual protection, cultural development
      and efforts toward political recognition; her account distinguishes those efforts
      from criminal caricatures.
    - She describes varied preferences for assimilation or cultural autonomy, without
      asserting that all orks support a separate nation.
    certainty: First-person source-era interpretation; includes reported stereotypes,
      social aspirations and historical narrative rather than compulsory ork behavior.
  - heading: Trolls
    speaker: Daniel
    source_role: Bear shaman
    printed_pages: 50-51
    pdf_pages: 51-52
    stance: A troll speaker disputes assumptions that physical size or tusks imply
      limited intelligence or violence, and reports practical barriers and social
      exclusion.
    claims:
    - Daniel notes physical size, tusks and speech/accent stereotypes, and explicitly
      rejects the inference that trolls are unintelligent.
    - He describes widespread difficulties with small vehicles, desks, public seating,
      retail spaces and workspaces designed for smaller people.
    - He reports employment and housing discrimination, including landlords demanding
      disproportionate security deposits out of concern for property damage.
    - He contrasts wilderness traditions, urban troll life and deliberate stereotype-performance,
      emphasizing that trolls are not a homogeneous social group.
    - He describes how caricatures of trolls as strong but unintelligent can shape
      paid work and personal treatment.
    certainty: Personal experience, critique and qualified cultural reporting; not
      an inborn intelligence, combat or access modifier.
