  optional_character_development_guidance:
    biography: The original narrator invites a player to write a biographical sketch
      of their fictional character to connect the components of that character's background
      and experience; this is characterization advice, not a mandatory new mechanical
      creation stage or a specific dice test.
    gamemaster_participation: The narrator encourages telling the gamemaster as much
      as practical about the character's background and using the character-creation
      process to develop an individualized character rather than worrying exclusively
      about rules, priorities, and numbers.
    race_and_magic_history: The source invites a player whose fictional character
      is metahuman, a mage, or a shaman to consider how ancestry or magical ability
      affected that character's life and social experiences; it does not assign a
      universal bonus or penalty based on the suggested biography.
    source_suggested_questions:
    - Whether the character grew up in a predominantly human, ork, or Seattle ork
      community and how that background shaped their self-description.
    - Whether a magic-capable character practices a particular tradition or is affected
      by experiences involving Drain or an ancestor's magic.
    - Whether the character's examples of magical ability and family reactions are
      elements of the player's proposed backstory rather than fixed events established
      for every character.
  adjacent_original_rules_reused_not_resubmitted:
    condition_monitor: The p46 Physical and Stun Damage Tracks and incapacity description
      refer forward to the existing Condition Monitor rules, including original p124
      and later damage/healing material; no duplicate box count is created here.
    karma: The p46 introductory distinction between Good Karma and Karma Pool and
      its rough award guidance is handled by accepted original p242-248 Karma records;
      this guidance record does not introduce a competing award formula.
    lifestyle: The p46 lifestyle and monthly-money continuation explicitly points
      to original p239; the indexed p239-241 lifestyle rules remain authoritative.
    neighboring_metahumanity: The distinct Captain Chaos attributed text and narrator's
      metahuman social observations at p46 are not reclassified as character-creation
      rules by this record, and may be treated in their own source-claim class if
      required.
