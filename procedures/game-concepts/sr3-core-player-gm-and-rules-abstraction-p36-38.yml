  narrator_guidance:
    division_of_roles: The rulebook says players control their main fictional characters,
      while the gamemaster controls the other characters and events, describes situations,
      and adjudicates outcomes with rules and judgment.
    shared_experience: The narrator frames the game as cooperative storytelling and
      shared adventure rather than a competition between players and the gamemaster.
    character_sheet: The narrator describes the Character Record Sheet as a guide
      to a character’s abilities, possessions, appearance and other information, and
      asks participants to use their descriptions and the dice-based game rules to
      resolve fictional actions.
    abstract_model: The book expressly characterizes its rules as abstractions of
      a fictional world, not a literal model of every real-world event or individual
      action.
    gm_discretion: The narrator asks participants to apply common sense and consider
      extenuating circumstances when a rules outcome seems poorly suited to a specific
      situation. This is discretionary adjudication guidance, not an automatic replacement
      of a stated Target Number or procedure.
    player_experience: The narrator invites players to adapt or change the game when
      a rule does not fit their campaign, without asserting a specific numerical modifier.
