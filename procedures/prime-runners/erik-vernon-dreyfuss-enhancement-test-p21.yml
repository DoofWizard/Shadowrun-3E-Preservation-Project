data:
  character: Erik Vernon Dreyfuss
  source_subsection: Notes
  printed_page: 21
  activation_rule:
    trigger: Attempt to employ personal enhancements during a conflict situation
    examples_in_source:
    - combat
    - tough negotiating on the street and similar confrontations
    test_attribute: Willpower
    test_target_number: 6
    test_designation: Willpower (6) Test
    success_condition: Successful test is required to employ his skillsofts.
    scope_exceptions: Narrator explicitly extends the special nervousness rule even
      to wired reflexes; do not exempt them.
    consequence_when_not_successful: The enhancement cannot be relied upon to function
      correctly under pressure.
    notes: Source sets no separate threshold for different types of enhancement and
      does not instruct conversion to SR3.
  fictional_cause: Erik’s nervous autonomic reaction overwhelms the consistency of
    his cybernetic enhancements.
  source_page: 21
headline: Erik Dreyfuss — Willpower (6) special enhancement rule
summary: Exact fictional RPG conflict-triggered Willpower test, prerequisites and
  wired-reflexes exception preserved.
