      "In the fictional setting, the narrator asserts that many security companies hold licenses to use lethal force in self-defense, explicitly qualifying that this is not true of all security providers. It also describes larger corporations with extraterritorial powers and their own internal rules; these are in-world publication claims, not real-world legal advice.",
      "The narrator leaves the level of security-system detail to the gamemaster; it explicitly permits a less complicated game to resolve a run through dice rather than detailed individual obstacles."
