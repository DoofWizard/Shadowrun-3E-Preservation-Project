    "source_narrator_observations": [
      "The rulebook narrator describes security as a common element of the fictional 2060s, affecting corporations, households, small businesses, criminal groups and shadowrunners; it presents many organizations as having some protective system rather than asserting universal identical defenses.",
      "The narrator offers game masters information for making fictional security challenges more believable, complex and entertaining, including circumstances where characters explain how they attempt a fictional task instead of relying only on a die roll.",
      "Some combinations of fictional security subsystems are described as so difficult that overcoming them may be impossible without magic; the narrator explicitly allows situations where characters should avoid attempting to enter, rather than requiring every obstacle to have a mechanical solution.",
