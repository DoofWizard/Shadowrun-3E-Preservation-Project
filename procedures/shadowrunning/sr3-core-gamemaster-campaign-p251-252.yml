  section: 'Shadowrunning: gamemaster techniques and tips for less successful Shadowruns'
  narrator_guidance:
  - The book presents player characters as adventure protagonists and asks the gamemaster
    to challenge them while recognizing role-playing alongside dice outcomes.
  - The book recommends considering player interests in mission design, inviting character
    histories and using players’ own stated aims to develop subsequent fictional adventures.
  - The narrator recommends maintaining running campaign notes, named character and
    NPC profiles, maps and references; it also suggests listening for important details
    players contribute.
  - The narrator recommends familiarity with rules without demanding memorization,
    with screens and written adventure notes available as aids.
  - 'It frames consistent fair play as a shared goal: the GM should neither gratuitously
    punish characters nor make the game trivially easy. If optional or changed rules
    are introduced, all participants should understand and agree to them, and the
    change should be applied consistently.'
  - The GM knows facts unavailable to fictional NPCs; the narrator cautions against
    letting NPC actions rely on out-of-character secrets, abilities or plans.
  - The narrator asks for believable NPC and critter motivations, rather than treating
    all opposition as mindless antagonism.
  - The source presents adaptation to unexpected player choices and imaginative solutions
    as preferable to rigidly refusing actions not expressly anticipated by the rules.
  - For a dramatic challenge, the GM may use discretion about fictional capture, defeat,
    hospitalization or an exceptionally unlucky die roll, but the passage is guidance
    rather than a guarantee of character survival or a binding rules override.
  - The book recommends geographic displays for neighborhoods and encounter sites,
    and reusable NPC dossiers that record capabilities and relationships.
  source_distinctions:
    narrator_versus_option: The recommendations are the published rulebook narrator’s
      discretionary gamemaster advice, not numeric tables or player-independent rules.
    consent: The book expressly asks that players understand and agree when the gamemaster
      changes the rules.
    in_world_scope: Fictional characters, organizations and threats are used as illustrative
      RPG scenarios; no described event is a real-world allegation.
