  - printed: 317
    speaker: FASA7001 Seattle chapter narrator
    subject: Hanzo Shotozumi and Japan-based Yakuza leaders
    certainty: present_announcement_with_future_threat
    claim: The narrator says Seattle oyabun Hanzo Shotozumi recently declared independence
      from Japan-based leaders and describes the possibility of a future shadow conflict,
      not a completed or certain war.
  - printed: 317
    speaker: FASA7001 Seattle chapter narrator
    subject: Triad BTL-chip commerce and local rivalries
    certainty: source_narrator_report
    claim: The fictional source describes Triads including Yellow Lotus, Eighty-Eights
      and Octagon competing with the Yakuza and Mafia in contraband chip markets,
      and describes cheaper Hong Kong knockoffs as a cause of increased market friction;
      no numeric BTL prices or mechanics are specified.
  - printed: 317
    speaker: FASA7001 Seattle chapter narrator
    subject: Seoulpa Ring origin and alliances
    certainty: narrated_historical_context
    claim: The original narrator links formation of the fictional Seoulpa Rings to
      the 2040s Yakuza purge of Korean members, portraying the rings as multiple less
      centralized groups with changing relationships, not a single command structure.
  - printed: 318
    speaker: FASA7001 Seattle chapter narrator
    subject: Cutters gang and source-reported recruitment
    certainty: narrated_rebuilding_intention
    claim: The original account says the Seattle Cutters branch had nearly been destroyed
      and is recruiting to recover prior numbers and strength; it does not claim the
      recovery has already succeeded.
  - printed: 318
    speaker: FASA7001 Seattle chapter narrator
    subject: Ancients and Merlyns gang affiliations
    certainty: source_period_characterization
    claim: The narrator describes the Ancients as a North American elven go-gang with
      cross-border rackets and the Merlyns as a magic-using gang operating almost
      exclusively for the Mafia; these are in-world source allegations and not instructions.
