  source_attributed_assertions:
  - printed: 316
    subject: Seattle corporate competition
    speaker: FASA7001 Seattle chapter narrator
    certainty: narrator_characterization
    assertion: The fictional narrator characterizes the metroplex as fertile ground
      for corporations competing through covert hired teams, but does not say any
      specific rivalry has a universal mechanically fixed result.
  - printed: 316
    subject: Cross Applied Technologies, Ares Macrotechnology, Nicholas Aurelius and
      Damien Knight
    speaker: FASA7001 Seattle chapter narrator
    certainty: narrator_forecast_and_rivalry
    assertion: The book identifies Nicholas Aurelius as the son of Leonard Aurelius
      and sworn enemy of Ares leader Damien Knight; it forecasts that the Knight-Aurelius
      rivalry is likely to drive indirect competition and shadowrunner hiring to interfere
      with the rival firm.
  - printed: 316
    subject: Mitsuhama Computer Technologies and rivals Renraku/Fuchi
    speaker: FASA7001 Seattle chapter narrator
    certainty: narrator_interpretation_of_opportunity
    assertion: The narrator says the damage Renraku and Fuchi suffered in a recent
      fictional corporate conflict presents Mitsuhama an opportunity in computing
      and electronics, and characterizes Mitsuhama as showing signs of taking it;
      the predicted outcome is not established.
  - printed: 316
    subject: Novatech Incorporated and Richard Villiers
    speaker: FASA7001 Seattle chapter narrator
    certainty: forecast_and_rumor
    assertion: The original narrator forecasts Novatech may expand substantially beyond
      its current Seattle position and separately labels reports that it hires shadowrunners
      to advance its interests as rumor.
  - printed: 316
    subject: Renraku Corporation Seattle Arcology
    speaker: FASA7001 Seattle chapter narrator
    certainty: narrated_ongoing_intent
    assertion: The book reports Renraku working to regain control of its arcology
      after an unexplained shutdown, not that the recovery had already succeeded.
  - printed: 317
    subject: Shiawase Corporation division disputes
    speaker: FASA7001 Seattle chapter narrator
    certainty: narrator_characterization_and_confidentiality
    assertion: The narrator describes frequent internal fighting among Shiawase divisions
      as generating opportunities for hired shadowrunner teams; it separately characterizes
      planned Seattle projects as highly secret rather than published confirmed launches.
  - printed: 317
    subject: Wuxing Incorporated and rival Japanese megacorporations
    speaker: FASA7001 Seattle chapter narrator
    certainty: narrator_projection
    assertion: The narrator describes Wuxing as hiring rapidly, expanding its Seattle
      headquarters and challenging Japanese rivals; it speculates that some competitors
      would welcome its downfall, without reporting that Wuxing had already been destroyed
      or that each rival had acted.
  - printed: 317
    subject: Yamatetsu Corporation local hiring
    speaker: FASA7001 Seattle chapter narrator
    certainty: narrated_current_policy_and_conflict
    assertion: The original narrator reports Yamatetsu recruiting metahumans in Seattle
      after relocating its global headquarters to Vladivostok, and characterizes resulting
      opposition among conservative employees as internal struggle, not an explicit
      game modifier.
