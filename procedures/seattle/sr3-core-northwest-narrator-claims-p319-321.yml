  - printed: 319
    subject: Salish-Shidhe Council electric-power relationship
    certainty: conditional_in_world_economic_consequence
    source: FASA7001 Seattle chapter narrator
    assertion: The narrator characterizes the fictional council as a significant Seattle
      power supplier and speculates that loss of its support could cripple the city;
      no enacted cut-off, test or damage modifier is established.
  - printed: 320
    subject: Cascade Crow proposals concerning Seattle
    certainty: proposed_and_rejected
    source: FASA7001 Seattle chapter narrator
    assertion: The source attributes proposed expulsion of outsiders and territorial
      seizure of Seattle to some Cascade Crow advocates, while stating the council
      had not accepted those proposals; a takeover is not treated as completed.
  - printed: 320
    subject: Cascade Ork corridor and Vancouver shipping activity
    certainty: narrator_allegations_and_optional_contacts
    source: FASA7001 Seattle chapter narrator
    assertion: The fictional narrator describes smuggling and illicit cargo activity
      along the Cascades and Vancouver shipping networks and suggests Cascade Ork
      contacts could appear in campaign stories; it does not specify a mandatory scenario
      or practical route instructions.
  - printed: 320
    subject: Tsimshian minority treatment and resistance movements
    certainty: narrator_account_with_named_group_allegations
    source: FASA7001 Seattle chapter narrator
    assertion: The book describes oppression and forced servitude imposed on Haida
      and Kwakiutl minorities and attributes militant/terrorist activities to named
      fictional resistance groups Haida National Front and Long House Brotherhood;
      these are the narrator claims rather than independently verified assertions.
  - printed: 321
    subject: Tsimshian official bribery
    certainty: explicit_rumor
    source: FASA7001 Seattle chapter narrator
    assertion: The narrator explicitly treats government officials taking profits
      from contraband shipping as rumor, not a universal proved fact about each official.
  - printed: 321
    subject: Tir Tairngire border security and possible control of Seattle
    certainty: border_rumor_and_political_speculation
    source: FASA7001 Seattle chapter narrator
    assertion: The narrator reports highly guarded fictional Tir borders and describes
      paranormal creatures among guards as a rumor; it separately presents fears of
      a Tir takeover of Seattle as speculation, not an actual transfer of government.
  - printed: 321
    subject: Portland as a border trade and campaign setting
    certainty: narrated_context_not_fixed_rule
    source: FASA7001 Seattle chapter narrator
    assertion: The book describes Portland as a special Tir border/trade zone with
      modified martial law and a military tribunal, and portrays shadow-business opportunities
      as optional background rather than guaranteed mission outcomes or playable modifiers.
