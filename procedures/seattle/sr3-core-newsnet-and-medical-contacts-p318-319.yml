  source_specific_optional_campaign_uses:
    fictional_medical_access:
      context: The narrator says most legitimate Seattle hospitals require proof of
        a valid SIN, while some clinicians and separate informal clinics may overlook
        that restriction. It presents care at these establishments as a risky character
        choice, not a guaranteed outcome.
      scope: Optional setting/GM consequence, not a new test, fixed surcharge or treatment
        bonus.
    independent_information_network:
      potential_character_work: The source presents investigative leads, reporting
        and source-gathering as possible fictional assignments for runners, including
        capable decker characters seeking information in corporate or government hosts.
      qualified_rumor: The original narrator calls it a rumor that an IIN bureau chief
        maintains a slush fund and hires runners in response to threats against the
        organization; it does not establish that allegation as an independently verified
        fact.
      agency: Freelance protagonists may accept or decline such work; no standing
        obligation is imposed by the source.
    newsnet:
      qualified_payment_claim: The narrator says NewsNet is rumored to pay well for
        particularly desirable stories and leads, but supplies no fixed payout or
        success test.
      source_risk: The narrator reports tension between investigative reporting and
        corporate interests and warns that sources may face consequences; it is a
        fiction-world risk, not a mandatory character penalty.
    ksaf:
      mystery_hook: The source describes a small independent Seattle broadcaster whose
        access to breaking stories seems unusually fortunate; the narrator says the
        cause of its advance knowledge is unknown.
      limit: No paranormal cause, reliability rating, game test or investigative solution
        is established.
    trid_pirates:
      setting_option: The narrator describes unofficial recordings and unauthorized
        broadcasts, including purportedly illicit material, as possible fictional
        news and entertainment context.
      limit: The text provides no new mechanics, compulsory character behavior or
        real-world instruction for conducting unlawful broadcasts.
  source_and_canonical_reuse:
    accepted_world_fact: world/seattle/sr3-core-medical-newsnet-p318-319.yml
    distinction: The accepted world_fact record already preserves named institutions
