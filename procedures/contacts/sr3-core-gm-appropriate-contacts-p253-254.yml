    heading: Appropriate Contact Restrictions
  source_narration:
    role: The book describes contacts as NPCs offering fictional information, introductions,
      equipment and services as well as ongoing campaign relationships.
    relationship: Contacts can have independent lives, preferences and affiliations.
      The GM may roleplay encounters with different personalities, instead of treating
      every successful test as an automatic unrestricted disclosure.
    knowledge_vs_disclosure: The rulebook distinguishes what a contact knows from
      what that contact chooses to reveal; contacts may be reluctant to compromise
      their affiliations or their relationship with other groups.
    circumstances: The book suggests that a contact meeting place and time depend
      on the NPC role, personality and current circumstances rather than a universal
      mandatory encounter setting.
  appropriate_contact_restrictions:
    premise: Players must select a fictional source plausibly connected to the type
      of information sought, even if they have a contact capable of a general Etiquette
      Test.
    source_examples:
    - A police contact may know a precinct rumor but not necessarily confidential
      corporate technical projects.
    - A corporate contact may know company activities and local security, while a
      street contact may know local gangs, street activity or rumor.
    gm_discretion: The source advises the gamemaster to judge relevance by the contact
      profession and access; it gives examples, not a universal new penalty, information
      guarantee, or extra rule table.
