  fleshing_out_contacts:
    gm_option: The source encourages the gamemaster to create individual backstories
      and mannerisms for recurring contact NPCs; this is roleplaying guidance, not
      a required test or fixed number of background details.
    independence: Contacts have their own lives, personal interests, affiliations
      and relationships; they may request a favor from the player character rather
      than exist solely to supply game information.
    roleplay_effect: Contact knowledge and willingness to share remain distinct; personality
      and circumstances may influence a fictional exchange without an invented universal
      die modifier.
  playing_contacts:
    optional_character_roles:
    - helpful acquaintance
    - mentor or instructor
    - friend
    - enemy or competitor
    - dupe
    - in-world mole or traitor
    - secret agent
    - relative or godparent
    gm_use: The source suggests the gamemaster can treat recurring contacts as rounded
      NPCs with background and statistics, using their relationships to produce recurring
      campaign opportunities.
    information_risks: The source allows contacts to be unwilling, pressured by other
      fictional parties or mistaken; apparent information may be unreliable. These
      are optional fictional plot circumstances, not an automatic change to the accepted
      contact-level, Etiquette or loyalty dice rules.
    specialization: Contacts know different kinds of information according to profession
      and interests; inappropriate contact specialization need not yield useful answers
      even when a character asks.
    unexpected_introductions: The source suggests minor contacts may unexpectedly
      introduce important story events or connections, without guaranteeing a particular
      result.
  favor_for_a_friend:
    source_situation: The gamemaster may present a contact asking player characters
      to perform a favor rather than supply paid information. The characters may explore
      such an invitation as a voluntary campaign hook.
    reciprocal_relationship: Favors may develop personal relationships and create
      adventures outside the ordinary employer-pays-team pattern; helpful contacts
      may later ask for riskier favors, with no fixed frequency or price stated.
    player_agency: The examples offer story possibilities; they do not compel players
      to accept a contact request, declare a trap, or impose a mandatory mechanical
      reward.
  sample_contact_use_guidance:
    sample_roles:
    - Bartender
    - Fixer
    - Mechanic
    - Mr. Johnson
    - Talismonger
    - Technician
    source_notes: The six original sample archetypes provide suggested fictional services,
      meeting contexts and similar social roles in addition to their printed game
      statistics. Their numeric Attributes, Initiative, Karma Pool/Professional Rating,
      skills and cyberware are separately preserved in options/contacts/sr3-core-sample-contact-npc-statblocks-p257-259.yml
      and are not reasserted here.
    optional_examples:
    - Bartender can supply neighborhood rumors, introductions, a place to meet or
      private conversation.
    - Fixer can match runners with fictional employment and equipment or information
      contacts, with the source noting a possible fee or cut.
    - Mechanic can provide fictional vehicle repair, modification and spare-part connections.
    - Mr. Johnson serves as a generic fictional hiring intermediary and may know pertinent
      project or employer information; this is a role, not a historical individual.
    - Talismonger can source fictional magical goods, information and introductions
      among practitioners.
    - Technician can supply repair and electronics information or specialist connections.
  sample_characters_as_contacts:
    scope: The p259 closing paragraph proposes that otherwise distinct sample NPC
      concepts such as a bounty hunter, hit man or terrorist might become contacts
      under unusual fictional relationship circumstances.
    conditions: The gamemaster is encouraged to give such an NPC a plausible past
      connection or shared event with a player character; this is optional campaign
      story context, not an automatic affiliation or real-world recommendation.
    information_limit: Their fictional work or affiliations may constrain useful information;
      no new contact-level bonus, gear-statistic, or involuntary character relationship
      follows from this paragraph.
