  gm_guidance:
    rule_description_scope: The book presents the subsequent spirit and dragon power
      mechanics as gamemaster guidelines, not an absolute exhaustive specification
      of every fictional paranormal adversary's abilities.
    fictional_opponent_uncertainty: The book advises that player characters should
      not automatically know the capabilities of each paranormal opponent; a particular
      spirit or dragon power may function somewhat differently in an individual encounter.
    uncertainty_as_storytelling: The book explicitly describes such uncertainty as
      useful to game drama; this is advice for fictional adjudication, not an extra
      dice roll or target-number modifier.
    elemental_nature_spirit_consistency: The source differentiates frequently summoned
      elementals and nature spirits, whose powers are described in greater detail,
      and recommends keeping their power behavior as consistent as possible rather
      than arbitrarily changing it in every encounter.
    optional_status: No new fixed statistic, damage code, universal species restriction,
      or compulsory monster mutation is created; the exact numeric and ordered game-resolution
      elements remain governed by their separately indexed core power records.
