  "purpose": "Design a firearm from a base frame, design options and eligible modifications.",
  "prerequisites": [
    "gunsmithing facility for a from-scratch design; a shop can cover some tasks only when equivalent fabrication/testing resources are otherwise available"
  ],
  "inputs": [
    "base frame",
    "design options",
    "eligible modifications"
  ],
  "stages": [
    {
      "id": "frame",
      "name": "Select a Frame",
      "test_or_action": "Choose a base frame and inherit its baseline statistics, FCU and DPV.",
      "outputs": [
        "frame baseline"
      ]
    },
    {
      "id": "options",
      "name": "Add Design Options",
      "test_or_action": "Apply eligible design-only options and their DP/FCU/weight/concealability effects.",
      "outputs": [
        "option-adjusted design"
      ]
    },
    {
      "id": "mods",
      "name": "Add Modifications",
      "test_or_action": "Apply eligible customization modifications during design; Full-Auto Conversion and Sawed-Off Shotgun Barrel are not design-stage options.",
      "outputs": [
        "finished specification"
      ]
    },
    {
      "id": "cost",
      "name": "Determine Final Cost",
      "test_or_action": "Total frame DPV + option DP + modification DP and multiply by mark-up factor 5 for nuyen cost.",
      "outputs": [
        "final DPV",
        "final price"
      ]
    }
  ],
  "outcomes": [
    "new firearm design"
  ],
