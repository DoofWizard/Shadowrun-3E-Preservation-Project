    "tooling"
  ],
  "stages": [
    {
      "id": "test",
      "name": "Build Test",
      "test_or_action": "Cased ammunition: TN equals Availability number and Base Time equals Availability time. A successful test produces 10 rounds.",
      "outputs": [
        "successes"
      ]
    },
    {
      "id": "successes",
      "name": "Spend Successes",
      "test_or_action": "Use successes either to divide Base Time (round down) or reduce cost by 5% per success (round down), not below 50%; recovered own casings can reduce cost another 2% per success.",
      "outputs": [
        "time or cost"
      ]
    },
    {
      "id": "caseless",
      "name": "Caseless Adjustments",
      "test_or_action": "Caseless ammunition requires a shop, adds +2 TN and cannot be reduced below 75% cost.",
      "outputs": [
        "completed ammunition"
      ]
    }
  ],
  "outcomes": [
    "10 rounds on success",
    "on failure, ammunition-cost materials are lost and a fresh kit is required"
  ],
