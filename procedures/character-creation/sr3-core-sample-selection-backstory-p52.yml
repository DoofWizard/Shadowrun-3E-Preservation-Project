  optional_character_selection_guidance:
    character_concept: The book invites players to develop a desired character concept
      before using its creation rules, including broad choices of character role or
      specialism.
    two_starting_routes: A player may use one of the published pregenerated sample
      characters, or construct an original player character using the chapter's subsequent
      rules.
    newcomer_qualification: The book presents a pregenerated sample character as potentially
      more convenient for a new player; it does not require this choice.
    original_creation_qualification: Building a player character from scratch takes
      more time but lets the player develop an individual character according to the
      established creation rules.
  sample_characters_as_examples:
    listed_range: The printed introduction points to sample characters on pp65–80.
    description: The examples illustrate recognizable fictional character types rather
      than an exhaustive or mandatory list of legal player character concepts.
    provided_details: The source says sample characters provide fictional background
      and descriptions, race, Attributes, gear (including cyberware where applicable),
      spells where applicable, and suggestions for roleplaying.
    personalization: The narrator encourages players to adapt personality and background
      details rather than treating the example archetypes as exclusive requirements.
    associated_record_sheets: End-of-book sample character record sheets correspond
      to the sample characters and supply equipment, contacts, lifestyle and dice-pool
      details for use in play.
