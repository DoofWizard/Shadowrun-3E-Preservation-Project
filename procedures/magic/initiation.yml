id: procedure.magic.initiation
record_type: procedure
name: Initiation Procedure
domain: magic
status: ingested
effective:
  status: current
  source: source.mits
  page: 58
  basis: extends
purpose: Increase an Awakened character's initiation grade and gain the associated game benefits.
prerequisites:
- Full magician, aspected magician or adept.
- Sufficient Karma.
inputs:
- desired new grade
- self-initiation or group initiation
- whether an ordeal is undertaken
- chosen initiation benefit
stages:
- id: cost
  name: Determine Karma Cost
  test_or_action: Multiply 5 plus desired grade by the applicable initiation multiplier, rounding down.
  outputs: [Karma cost]
- id: ordeal
  name: Complete Ordeal if chosen
  test_or_action: Complete the selected ordeal before gaining the grade.
  outputs: [reduced Karma multiplier when successful]
- id: initiate
  name: Gain Grade
  test_or_action: Complete initiation and apply the chosen benefit.
  outputs: [new initiation grade, chosen benefit]
outcomes:
- Increase initiation grade and gain the grade-dependent astral benefits.
- Apply exactly one of the three initiation choices.
