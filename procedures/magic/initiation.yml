data:
  initiation_process:
    eligible_character_types: [full magician, aspected magician, adept]
    modes: [self-initiation, group initiation]
    grade_sequence: First initiation grants grade 1; each subsequent initiation increases grade by 1.
    timing: GM determines duration and activities apart from specified ordeal and metamagic-learning requirements; character's path guides activities; some time must elapse after acquiring the required Karma before another initiation.
    avatar: Each group and self-initiated character has its own avatar, which should participate in the process.
  benefits:
    first_grade_full_magician: Access to metaplanes.
    choices_per_grade: 1
    choice_table:
    - {choice: learn_metamagic, magic_gain: 1, learn_technique: true}
    - {choice: alter_signature, magic_gain: 1, alter_signature_attempt: true}
    - {choice: shed_geas, magic_gain: 0, geasa_removed_maximum: 1}
    magic_limit: Magic may increase above 6 through initiation.
    adept_power_points: Each additional Magic point grants 1 Power Point for purchasing powers.
    shed_geas: Removes one geas from an existing Magic point instead of gaining a new Magic point for that grade.
  astral_benefits:
    astral_reaction_bonus: initiation grade
    astral_pool_dice: initiation grade
    eligible_tests: Tests on the astral plane or metaplanes except Magical Skill Tests; explicitly includes Astral Combat Tests even when Sorcery is used, and Astral Perception Tests.
    refresh: Standard dice-pool refresh rules.
  alter_signature:
    test: Magic Test
    target_number: 6 + new initiation grade + prior failed signature alteration attempts
    extra_dice: Karma only
    minimum_successes: 2
    success: Altered signature prevents recognition based on the old signature.
    failure: Retain existing signature; retry only on a subsequent initiation, with cumulative +1 target number per failure.
    incompatible_choices: Learning a new metamagical technique or shedding a geas for this grade.
  karma_cost:
    base: 5 + desired grade
    rounding: down
    multipliers:
      self_without_ordeal: 3
      self_with_ordeal: 2.5
      group_without_ordeal: 2
      group_with_ordeal: 1.5
    examples:
      grade_1: {self_without_ordeal: 18, self_with_ordeal: 15, group_without_ordeal: 12, group_with_ordeal: 9}
      grade_2: {self_without_ordeal: 21, self_with_ordeal: 17, group_without_ordeal: 14, group_with_ordeal: 10}
framing: reference_exact
headline: 'Fictional Shadowrun Third Edition procedure: Initiation (FASA7907, printed 57-58/PDF 58-59)'
