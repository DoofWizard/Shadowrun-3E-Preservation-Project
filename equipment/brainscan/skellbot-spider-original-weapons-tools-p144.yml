headline: Fictional Shadowrun Third Edition Brainscan (FASA Corporation, 2000; FASA7331/source.fasa-7331),
  printed p144/PDF145 — Skellbot and Spider robot weapons, tools, and original equipment
  statistics
summary: 'Source-indexed original game equipment from fictional FASA Brainscan (2000),
  Shadowrun Third Edition FASA7331/source.fasa-7331, printed p144/PDF145: Skellbot
  claw, bite, recoil gyro and Spider tools/autosofts. These are tabletop game statistics,
  not actual robotic equipment specifications.'
data:
  scope: Exact Skellbot and Spider game equipment lines from original FASA Brainscan
    printed p144; general construct drone table and behavior are separately preserved.
  skellbot:
    fictional_role: Recently fielded human-sized skeleton-shaped machine used by Deus
      as troops, prison guards, and bodyguards for important Banded; the book portrays
      it as relatively slow but highly mobile.
    arm_strength: '6'
    recoil_compensation: Built-in gyroscopes provide 3 points of recoil compensation,
      comparable in-game to a cyberarm gyromount in Man & Machine p36.
    autosofts_exact:
    - Clearsight 2
    - Implant Weaponry 3
    - Sharpshooter 3
    weapon_lines_exact:
    - Claws [6M]
    - Bite [6M, -1 Reach]
    - Any appropriate melee or ranged combat weapons
    source_attribution: All numeric attack properties above are original fictional
      game ratings from the Skellbots paragraph and weapon list, rather than a modern
      rule conversion.
  spider:
    fictional_role: Maintenance and construction construct whose ellipsoid body carries
      four to twelve flexible spiderleg arms fitted with different tools; original
      printed dimensions say approximately 2.5 meters tall and across.
    arm_strength_default: '4'
    arm_strength_variant: 8 for some arms
    tools_list_as_reported:
    - knives
    - saws
    - grippers
    - nailguns
    - hammers
    - other tools
    tool_attack_rule: Attacks use the tool currently mounted; the arms’ length grants
      +1 Reach.
    built_in_toolkit: Electronic toolkit
    autosofts_exact:
    - Implant Weaponry 3
    - Numerous Technical skill autosofts (including electronics, computer B/R, and
      similar skills)
    weapons_line_exact: Various tool weapons, depending on drone.
    source_attribution: Original in-world Spider construct descriptions and game properties,
      not engineering directions.
  cross_source_lineage: Man & Machine p36 is a historical in-game gyromount reference;
    Brainscan uses original Third Edition rules. The common drone-stat table appears
    separately on Brainscan p144.
framing: reference_exact
