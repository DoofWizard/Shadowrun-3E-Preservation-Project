    "original_source_cross_references": {
      "table_reach_definition": "Reach is a weapon's length; a character with greater Reach than an opponent receives the relevant combat target-number benefit (source points to Combat p121).",
      "table_damage_definition": "For melee weapons except the monofilament whip, Power derives from the wielder's Strength plus the printed value; the letters L/M/S/D denote Damage Level (source points to Combat p114).",
      "shock_glove": "The source's narrative states that striking with shock gloves reduces initial impact damage to (STR - 1)M and delivers an additional 7S Stun electrical effect; eight discharges are available before a one-hour recharge. See source's Shock Weapons p124.",
      "personal_whip": "The source discusses whip entanglement as an Open Test option, in which the strongest rolled result is the target number for the victim's Strength Success Test to free themselves. This is not an attack with ordinary damage; refer also to accepted rule.combat.whip-entanglement.",
      "monofilament_whip": "Preserve the separate canonical rule.combat.monofilament-whip mishap and resistance rules from p275; the market table here does not replace them.",
      "projectile": "The original p276 text refers impact-projectile weapon ranges and bow minimum Strength to Combat p117; Crossbows have Light, Medium and Heavy versions with different Strength minima.",
      "firearms_transition": "The next source heading, FIREARMS, begins on printed p276; this record covers only the tables named above, not firearm tables in subsequent pages.",
      "combat_axe_integrated_point": "Original printed p275/PDF284 describes the Combat Axe as a tungsten alloy axe with a spring-loaded thrusting point concealed in its handle; the paragraph states no separate activation action or damage modifier.",
      "forearm_snap_blades_integrated_deployment": "Original printed p275/PDF284 describes three blades mounted in a forearm sheath, extendible and retractable via muscle-movement commands; the paragraph assigns no separate action cost.",
      "survival_knife_integrated_supplies": "Original printed p276/PDF285 specifies the survival knife handle contains a small compass, micro-lighter, night-glow stick and trauma patch (cross-reference printed p305); these are source-described integrated contents, not an additional free purchase of four separate items.",
      "crossbow_cocking_configuration": "Original printed p276/PDF285 states Light crossbows are hand-cocked, whereas Medium and Heavy crossbows use a built-in side-wheel gear to aid re-cocking; no extra modifier or reloading action time is supplied by this paragraph."
