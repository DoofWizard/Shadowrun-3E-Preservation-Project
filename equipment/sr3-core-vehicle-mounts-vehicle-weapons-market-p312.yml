  vehicle_weapon_availability_legality_street_index: The FASA7001 source explicitly
    assigns vehicle-grade weapon Availability, Legality Code, and Street Index to
    gamemaster determination; these are not fixed market cells.
  source_notation:
    recoil_compensation: The original mount table renders -1/2 for fixed mounts and
      turrets, and 2 for the pintle mount. Preserve the ambiguous literal without
      interpreting a new modifier.
    water_cannon_quotes: Quotation marks around the Water Cannon type, ammunition,
      and mode cells are in the original table, and retained in the strings.
    source_internal_conflict: Original p307/PDF316 narrative describes the Water Cannon
      as always autofiring ten shots per action while the p312/PDF320 table prints
      "SA". Both claims are source-supported and the conflict is not silently resolved.
