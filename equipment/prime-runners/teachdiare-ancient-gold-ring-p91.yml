data:
  item: Teachdiare's gold ring engraved with Celtic runes
  bearer_in_source: Teachdiare
  source_anchor: {printed_page: 91, pdf_page: 100, heading: Notes}
  reported_age: Approximately 4000 BCE (source dates the engraved ring, without independent dating evidence).
  function: Magical hypnosis and concealment of the bearer's presence from an affected sentient target.
  use_procedure:
    action_cost: Complex Action
    facing_requirement: The bearer must face the target.
    maximum_range_meters: 20
    targets_per_combat_turn: One sentient target
    resistance_test: Opposed Willpower Test, with target testing against Teachdiare (or an appropriately bound later user).
    target_resistance_threshold: At least 3 net successes by the target are needed to avoid the effect; fewer than 3 net successes result in hypnosis.
    successful_effect: The target forgets that the bearer is or was present and fails to perceive the bearer's presence, including through technical detection such as an infrared detector.
    end_condition: The effect ends when the bearer leaves.
    returning_to_target: On a later encounter the effect does not persist; the bearer must renew it on the spot.
    breaking_action: Any aggressive act by the bearer against the affected target breaks the effect unless the bearer renews it.
  acquisition_and_bonding:
    eligible_user: Any magically active character who binds the ring.
    bonding_cost_karma_points: 24
    other_values: The source does not give a market price, Availability, or legality rating for the ring.
  distinctions:
    - The threshold is at least three NET successes scored by the target, not a general target number and not successes by the bearer.
    - The item is a reusable magical artifact with defined action, range, target limit, resistance, ending conditions, and bonding cost; none should be inferred from SR3 rules.
  related_existing_character_record: rules/prime-runners/teachdiare-stats-p90-91.yml
