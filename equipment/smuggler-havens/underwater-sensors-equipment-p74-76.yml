data:
  subsection: Underwater Security / Surveillance Systems and Security Patrols
  scope: Descriptive capabilities and environmental limits for fictional underwater
    settlements; the narrative provides no dice pools, target numbers, prices, or
    standard Shadowrun equipment-stat table in these subsections.
  narrator_assertions:
  - printed_page: 74
    system: conventional camera, thermographic scanner, motion detector
    finding: Described as ineffective underwater; currents impair thermographic and
      motion sensing, and water absorbs infrared emissions.
    infrared_effective_range_meters:
      less_than_or_equal_to: 4
      text: water absorbs infrared beyond four meters
  - printed_page: 74
    system: underwater visual cameras
    finding: Light attenuation restricts cameras, especially at very deep installations.
    low_ambient_light_depth_meters:
      greater_than: 200
      description: Below 200 meters ambient daylight is described as no brighter than
        early evening.
    no_sunlight_depth_meters:
      about: 1000
      description: Below 1,000 meters sunlight is said not to penetrate, leaving pitch
        black conditions.
    artificial_light_effective_distance_meters:
      up_to: 200
      description: Artificial lighting is described as effective only up to 200 meters
        from its source.
  - printed_page: 75
    system: passive sonar
    finding: Sound propagates much faster underwater than in air; the section says
      passive sonar can detect metahuman intruders from as far away as one kilometer.
    reported_detection_distance_meters:
      up_to: 1000
    claim_status: source narrator setting assertion, not a game-test statistic
  - printed_page: 75
    system: security patrol equipment
    finding: Diving exposure, decompression and expensive minisubs constrain underwater
      human patrols.
    ordinary_scuba_exposure_minutes:
      less_than: 40
      text: normal scuba equipment limits underwater exposure to less than 40 minutes
        in the source narrative
  - printed_page: 76
    system: unmanned patrol drones
    finding: The source describes cable-linked drones and free-ranging remote drones;
      free-ranging areas depend on signal reception, with relay transmitters deployed
      to provide redundant retransmission.
    limit_categories:
    - fuel
    - reception capability
  attributed_numeric_claims_cross_reference: reference.target_smuggler_havens.underwater-security-shadowtalk-p74-77
  historical_rules_lineage: No implied SR3 rule replacement, sensor Rating, stealth
    test or TN.
