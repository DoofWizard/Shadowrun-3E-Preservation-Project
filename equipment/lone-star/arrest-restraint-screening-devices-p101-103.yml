data:
  publication:
    title: Lone Star Sourcebook
    publisher: FASA Corporation
    catalog: FASA7115
    year: 1994
    setting: fictional Shadowrun tabletop role-playing game
    edition: historical original/Second Edition-era FASA sourcebook; not converted
      to Shadowrun Third Edition
  review_scope:
    printed_pages: 101-103
    pdf_pages: 109-111
    original_source_images_reviewed: true
    content_class: equipment_stat
  source_treatment: The section is an in-world 2054 security-equipment catalog; preserve
    listed fictional prices, restrictions, functions, conditions and limits without
    treating it as current product documentation or actionable real-world technique.
  devices:
  - name: Plastic Strip Restraints
    quantity: 10 per package
    cost_nuyen: 3
    description: Flexible high-density plastic restraints described for wrists or
      ankles.
  - name: Handcuffs
    cost_nuyen: 40
    description: Conventional metal or high-density plastic restraint cuffs.
  - name: Containment Manacles
    cost_nuyen: 2500
    restricted: true
    description: Fictional robust wrist or leg restraint with a clamping mechanism
      that applies harmful pressure if cybernetic razors, spurs or similar integrated
      weapons are extended; its bodily-injury capacity is a source-described function,
      not advice.
  - name: Pulse Cuffs
    cost_nuyen: 1800
    restricted: true
    description: Fictional conductive-polymer restraints deliver a mild current described
      as immobilizing restrained limbs and disabling cyberware located in those limbs;
      the source also characterizes the sensation as severely painful. These conditions
      persist while worn.
    power_duration_hours: 6–8
    power: Self-contained rechargeable supply; catalog says officers can recharge
      at Lone Star precinct headquarters.
  - name: Headjammer
    cost_nuyen: 1200
    price_modifier: plus sign printed after amount (1,200+)
    description: Fictional head-mounted device intended to jam an implanted cellular
      telephone or radio and cause painful feedback through such implants.
  - name: Jackstopper
    cost_nuyen: 100
    solvent_cost_nuyen: 10
    description: Fictional dummy connector for chipjacks or datajacks using a quick-bonding
      material; the text says special resin solvent can remove the obstruction and
      implies medical or technical assistance may be required.
  - name: Magemask
    cost_nuyen: 200
    white_noise_max_db: 90
    description: Fictional hood-like restraint obscuring sight and speech, with a
      breathing provision and optional white-noise generator for magical captives;
      catalog says nostrils remain uncovered.
  - name: Skilltwitchers
    cost_nuyen: 200
    restricted: true
    description: A chip-like fictional device sends an interfering signal to a captive’s
      skillwires while connected. The text says it is also paired with Jackstopper
      technology in some cases.
  - name: Blood Tester
    cost_nuyen: 300
    results_under_minutes: 1
    description: Handheld test tool for blood alcohol, drugs, compounds and hormone
      enhancement indicators, with blood type, Rh factor, HLA antigen and related
      blood data also described.
  - name: DNA Scanner
    cost_nuyen: 1500
    description: Handset-sized fictional scanner compares a sample in a tray against
      the unit’s stored DNA records; source distinguishes direct suspect checks from
      crime-scene samples that are preserved for forensic-lab analysis.
  - name: Cyberware Scanner
    cost_nuyen: 5000
    description: Portable microprocessor, fold-out display and sonic/magnetic scanning
      wand detect and display cyberware characteristics. Non-organic components are
      described as easier to detect than organic or vat-grown parts. Advanced Alpha-
      and Beta-level cyberware includes organic masking that makes detection harder.
      The text also describes larger related systems in some North American airports.
  scope_limit: Catalog text presents fictional items and nuyen prices. No target numbers,
    dice pools, damage code or item Availability ratings are supplied in this passage;
    “restricted” is preserved where explicitly printed.
headline: Fictional arrest-restraint and screening equipment — FASA Lone Star Sourcebook
