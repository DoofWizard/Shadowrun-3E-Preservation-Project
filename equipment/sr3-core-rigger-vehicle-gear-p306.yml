  interface_procedures:
    datajack_port: Enables neural vehicle control via datajack but is insufficient
      for a person with a VCR; without a VCR it provides +1 to the driver’s Reaction
      for Vehicle Tests and vehicle combat.
    remote_control_gear: Permits vehicle data reception/transmission over a rigger
      network for drone use. Requires Sensor Rating ≥1; adaptation grants vehicle
      Pilot Rating 1 and consumes no cargo space.
    vehicle_control_gear: An in-vehicle black box translates machine code into neurological
      stimuli and vice versa; a VCR user may rig the vehicle. Requires a datajack
      port or remote-control gear and vehicle Sensor Rating ≥1. Consumes 1 Cargo Factor
      and 10 kg Load.
    remote_control_deck: Portable deck for controlling vehicles over a radio link,
      subject to jamming and conditions; hitcher jacks, displays, and intercom are
      referenced as accessories.
    remote_control_eccm: Functions as ECCM for a rigger remote deck against interference
      and jamming; cross-reference Electronic Countermeasures, printed p138.
    military_vehicles_legality: The gamemaster determines the Legality Code for fictional
      military and security vehicles; the table does not give a fixed code.
