      "opticam": "Records images as video; one minute of recorded video uses 1 Mp in game.",
      "protective_covers": "Discretionary additional one point of Impact armor for eye area; one-way reflective covers add 100 nuyen in game.",
      "flare_compensation": "Eliminates vision target-number modifiers for glare in the game's stated conditions.",
      "vision_magnification": "May modify target numbers by range as imaging scopes do (original printed p110); optical systems in ordinary eyes have Concealability Rating 9, while the book says other forms are generally undetectable without biotech examination.",
