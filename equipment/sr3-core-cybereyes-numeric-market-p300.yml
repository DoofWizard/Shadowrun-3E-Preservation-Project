      "eye_cyber_replacement": "The fictional source normally replaces both eyes; replacements can accept up to 0.5 Essence of further enhancement without further Essence loss.",
      "cyber_replacement_base_vision": "Base replacement corresponds to standard 20/20 sight; the book notes that a character with replaced eyes loses biological low-light or thermographic ability unless reinstalled cybernetically.",
