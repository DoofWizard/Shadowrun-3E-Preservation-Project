iew.*"],"limitations":"Source-verified table-cell correction; does not establish completion of entire Street Gear chapter or game-engine test readiness."}},"notation":"A printed dash is not numeric zero. The original table gives the Kit a Weight of 5 kilograms, not .5; no decimal point precedes the 5. The specialized-tool multiplier applies to listed base cost, not a separate labor fee.","original_page_prose_context":{"facility":"Immobile due to heavy machinery.","kit":"Portable collection of basic repair gear.","shop":"Transportable in a large van or small truck.","specialist_cost":"Electronics, computers and cyberware require specialized tools at three times basic listed costs; vehicle tools are twice basic costs."},"original_table_title":"TOOLS","publication":{"catalog_number":"FASA7001","edition":"Third Edition","kind":"published fictional tabletop role-playing game","original_pdf_sha256":"7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914","physical_pdf_page":297,"printed_page":288,"publisher":"FASA Corporation","source_id":"source.sr3-core","title":"Shadowrun, Third Edition"},"rows":[["Kit","3","5","5/48 hrs",500,"2"],["Shop","-","-","8/72 hrs",5000,"3"],["Facility","-","-","14/7 days",100000,"4"]]},"edition_scope":"Published original FASA Corporation Shadowrun, Third Edition FASA7001 fictional tabletop Street Gear tools, printed p288/physical PDF297.","framing":"reference_exact","headline":"Correct FASA Corporation Shadowrun, Third Edition (FASA7001) fictional tabletop p288/PDF297 repair Kit Weight from 0.5 kg to original 5 kg; preserve Shop and Facility values.","id":"equipment.sr3-core-build-repair-tools-market-p288","pdf_pages":"297","printed_pages":"288","record_type":"equipment","source":"source.sr3-core","status":"source_reviewed","summary":"Corrected source-image-verified original fictional FASA7001 repair tools table: a Kit weighs 5 kg, not the previously indexed 0.5 kg; other three-row market figures and specialized multipliers are unch