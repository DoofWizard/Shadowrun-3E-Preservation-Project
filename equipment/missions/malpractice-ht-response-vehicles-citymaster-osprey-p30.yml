data:
  publication_context: 'Fictional tabletop-RPG publication: Missions (FASA7325), FASA
    Corporation (1996), original Shadowrun Second Edition tabletop RPG adventure collection;
    publisher FASA Corporation; catalog/source source.fasa-7325; printed pp30/PDF31.'
  scope: Exact fictional SRII setting vehicle statistics in Missions FASA7325 printed
    p30; preserve historical vehicle schema and no inferred SR3 conversion.
  context: The Hugues WK-2 Stallion workhorse was phased out in fall 2056 in favor
    of the Osprey II. Modified Citymasters used by HTR teams are 2055 versions; on
    31 December 2057 half the Citymasters are 2055 models, the rest are standard models
    from Neo-Anarchist’s Guide to Real Life p98. GM uses 2055 model in adventure.
  large_team_adjustment: If HTR plus TRP player character party exceeds maximum of
    five extra seats (a group of six or more), assign two vehicles with two nonplayer
    characters per vehicle. If no PC rigger to drive the second vehicle, DocWagon
    provides one; use SRII rigger archetype p59 with Biotech 4 and piloting skill
    rating 6 in the assigned vehicle.
  vehicles:
  - model: Modified Citymaster (2055)
    Handling: 4/10
    Speed: 35/140
    Body: 5
    Armor: 6
    Signature: 2
    APilot: 4
    Seating: twin bucket seats
    Access: 2 standard + 1 rear hatch
    Economy: 11 km/liter
    Fuel: IC/500 liters
    Storage: 28 CF in storage compartments
    rear_medical_area: Physically separate from driver; accommodates two medical attendants
      caring for two patients and four fold-down seats for extra team members or passengers.
    turret: Driver compartment turret with twin light machine guns [LMG, 1000 rounds,
      full-auto, 5S Stun], loaded with gel rounds. Use one-half recoil modifiers due
      to hardpoint mounting.
  - model: Osprey II
    Handling: 5
    Speed: 190/380
    Body: 3
    Armor: 3
    Signature: 2
    APilot: 3
    Seating: twin bucket seats
    Access: 1 + 1 modified rear access
    Economy: 3 km/liter (VTOL economy 1 km/liter)
    Fuel: IC/600 liters
    Storage: 6 CF storage + 6 CF cargo
    Landing/Takeoff Profile: VTOL/VSTOL
    rear_medical_area: Rear compartment separate from driver; contains gear and room
      for two attendants and two patients, and three fold-down seats when not cramped.
    hardpoints: Two hardpoints, usually with M107 GP heavy machine guns loaded with
      gel rounds [HMG, 1000 rounds, full-auto, 8S Stun]. Other game weapons may be
      mounted for particular fictional situations.
  published_reference: Modified Citymaster compared against Neo-Anarchist’s Guide
    to Real Life p98; HTR driving NPC references Shadowrun Second Edition rigger archetype
    p59.
