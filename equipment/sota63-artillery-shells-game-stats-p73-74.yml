  variant_rules:
    anti_personnel: Apply the SR3 p116 flechette ammunition rules when resolving this
      fictional shell.
    anti_vehicle: Use the SR3 anti-vehicle ammunition rules; no new conversion formula
      is supplied in these pages.
    high_explosive: The book presents the standard fictional explosive shell as a
      baseline choice.
    icm:
      affected_area_radius_m: 20
      game_effect: Each target inside the stated fictional area receives the shell’s
        printed damage code.
    dp_icm:
      affected_area_radius_m: 20
      game_effect: All targets receive the same printed game damage code; vehicles
        do not reduce Power or Damage Level for this hit but use their full Armor
        rating.
    jammer:
      source_page: 73
      rating: 4
      flux: 8
      effect_scope: In the tabletop rules, the shell affects standard radio communications,
        sensors and remote-control networks within its computed zone.
      radius_formula_as_printed: (2D6 meters × Gunnery Test successes) + 10 meters
      other_transmissions: Systems outside the fictional effect zone are unaffected.
      cross_references:
      - SR3 Jammers p291
      - SR3 Electronic Countermeasures p138
    seeker:
      game_effect: Uses a target-designation system for indirect fire; apply Cannon
        Companion p99 indirect-fire rules.
      inheritance: Damage and blast remain those of the underlying shell, as indicated
        by As round table cells.
    solar:
      flash_duration_minutes: 5
      vision_tests_target_number_modifier_at_reference_distance: 8
      tn_modifier_change_per_10_meters: −1 per 10 meters from the fictional impact
        point
      flare_compensation_initial_reduction: 2
      tn_modifier_reduction_per_combat_turn: 2
      bright_area_radius_m: 100
      direct_view_glare_visibility_modifier: 4
      direct_view_glare_with_flare_compensation: 2
      illumination_duration_minutes: 5
      source_scope: Visibility and test effects for tabletop gameplay only.
    smoke:
      smoke_cloud_radius_m: 30
      duration_minutes: 4
      effect: Obscures standard vision; consult Cannon Companion p106 smoke modifiers.
    smoke_ir:
      smoke_cloud_radius_m: 30
      duration_minutes: 4
      effect: Fictional infrared variant also obscures thermographic vision.
  table_notation:
    dash: Original printed dash, not numeric zero.
    special: Source directs resolution to special rules.
    as_round: Use the base-shell entry rather than invent independent values.
    seeker_modifiers: Leading plus signs are additions to the base round’s printed
      values, including Availability and Street Index.
