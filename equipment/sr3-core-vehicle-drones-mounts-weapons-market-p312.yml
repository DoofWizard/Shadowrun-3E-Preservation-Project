  weapon_table_qualifiers:
    gm_determines: The original page gives the gamemaster discretion to determine
      Availability, Legality Code and Street Index for vehicle-grade weapons.
    water_cannon_discrepancy: The p312 tabular Mode field is expressly "SA" while
      original printed p307/PDF316 says that the fictional Water Cannon ALWAYS fires
      in autofire mode at 10 shots/action, with no recoil. Preserve this in-source
      discrepancy rather than choose which governs code.
    vehicle_mount_recoil_compensation: Preserve literal -1/2 code for mounts as printed;
      mechanical interpretation follows p307 weapon mount section, and later Rigger
      3 may explicitly refine values.
    autonav_blank_symbol: Autonav in each four printed drone stat rows is an em dash
      rather than numeric 0; represented as null, not inferred.
  lineage_links:
    SR3_vehicle_mount_rules: Printed p307/PDF316, original basic weapon mount procedure;
      compare to already normalized rules/vehicles/weapon-mounts.yml with source.r3
      later Rigger 3 rules pp135-142.
    supersession: Historical SR3 core values; no implicit replacement or conversion
      to a later game edition.
