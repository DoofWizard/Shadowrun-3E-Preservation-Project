data:
  publication: {title: ShadowBeat, publisher: FASA Corporation, catalog_number: FASA7109, year: 1992}
  autosynth_p93: Responds to live musical input and programmed parameters; accompaniment may also be composed in advance.
  mixer_p94: Normally one output per connected amplifier, but fewer speaker arrays can suffice; multiple outputs permit sound movement between arrays.
  sampler_p94:
    inexpensive_typical_channels: [8, 16]
    optical_chip_capacity_limit: null
    note: Standard optical chips of any capacity can store recordings in the sampler; no separate numerical sampler storage ceiling is printed.
  polycorder_p94: Cheap units accept MiniCD only; more typical dual-media units read and write discs and encode chips directly.
  speaker_p95: Driving a speaker above its rating damages it beyond use in short order; the source supplies no damage roll or exact time.
  worked_example_p95:
    average_controller_nuyen: 1000
    average_eight_voice_slave_nuyen: 1300
    printed_total_nuyen: 2300
    qualification: The printed total equals controller plus slave; if read as slave-only it differs from the formula. Preserve all figures and do not treat 2300 as the slave price.
