data:
  publication: {title: ShadowBeat, publisher: FASA Corporation, catalog_number: FASA7109, year: 1992}
  supplements: [equipment.shadowbeat-simsense-gear-legacy-p97-98, rule.shadowbeat-simsense-output-storage-legacy-p79-80]
  simrig_p97:
    baseline_tracks: sensory only
    full_x_tracks: sensory and emotive
    storage_output_examples: [CD, headware memory, optical memory chip input/output module]
  simth_p97:
    home_example_additional_interfaces: [operator monitor jack, control keyboard]
    studio_examples: [Yamaha 95000, Fuchi Kosmos]
    studio_peripheral_examples: [sense patch injectors, track enablers]
    studio_output_recording: Experience samplers record the simsynth output.
  enablers_and_samplers_p97_p98:
    patch_injector_local_storage: Some lower-cost models contain a few hundred Mp; the source gives no exact capacity.
    signal_peak_controller: For commercial production in the fictional setting, the controller modulates the final signal delivered to the experience sampler to comply with limits on intensity, fluctuation and areas stimulated simultaneously. No numerical threshold is specified here.
    experience_sampler_output_media: Both Dir-X and ACT samplers may output to digital or optical media.
  sense_decks_p98:
    typical_personal_format: ACT
    theatrical_format: Dir-X
    home_dual_format_qualification: Some expensive personal decks support both ACT and Dir-X.
    theatrical_distribution: Multiplexer feeds an optical cable network to seat receivers; some establishments are experimenting with direct signal broadcast.
    perspective_compatibility: Older decks are generally monoPOV; polyPOV decks are increasingly available in all price ranges.
    portable_ACT_signal: Limited output; tabletop and rack-mount units have more versatile circuitry, stronger power supplies and cleaner signals. The original supplies no universal numerical modifier.
  lineage_note: Original 1992 capabilities only; native SR3 prices, range rules and playback eligibility remain separately governed by the indexed SR3 records.
