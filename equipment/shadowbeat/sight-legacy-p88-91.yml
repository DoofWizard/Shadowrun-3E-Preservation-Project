{"id":"equipment.shadowbeat-sight-legacy-p88-91","record_type":"equipment","status":"source_reviewed","source":"source.fasa-7109","printed_pages":"88-91","pdf_pages":"97-100","edition_scope":"FASA Corporation ShadowBeat (1992), original 2E-era fictional tabletop media equipment; not native SR3","content_class":["equipment_stat"],"headline":"ShadowBeat original media equipment statistics and camera modifiers","summary":"Original fictional camera, accessory, trideo editing and broadcasting gear market rows, rating limits, and equipment-specific Pix Test effects.","data":{"publication":{"title":"ShadowBeat","publisher":"FASA Corporation","catalog_number":"FASA7109","year":1992},"camera_prices_nuyen":[["Fuchi VX2200",1000],["Fuchi VX2200C",1300],["Sony HB500",2200],["Sony CB5000",2700],["AZT Micro20",2500],["AZT Micro25",3200],["Bionome Tridlink Adapter",700]],"camera_rules":{"all_listed":"Automatic low-light adjustment and selectable thermal imaging; manual camera requires at least one hand, cybercam can use datajack or camgoggles and compatible controllable base.","VX2200":"MiniCD storage only, no direct offboard or transmitter connection; mounted Impact -2. VX2200C is tridlinked version.","HB500":"Manual remote control with universal mounting bracket; lens diameter 6 cm, length 8 cm, storage adds 3 cm; direct external storage or live output. CB5000 is cyber version.","Micro20":"4 x 3 x 2 cm, requires Micro30 base for hands-free operation; camera and base Concealability 8. Micro25 is cyber version.","Bionome":"Manual camera datajack control adapter."},"mounts":[["Kodak GAC-25 shoulder",200,0,"Manual only; either shoulder"],["Cinema Products Steadicam shoulder",1800,4,"Left/right specific"],["Cinema Products Steadicam chest",1800,4,"Manual/cyber input"],["Cinema Products Steadicam head",1800,4,"Helmet or head brace"],["AZT Micro30 wrist",2200,2,"Micro20 series; motion only"],["AZT Micro30 chest",2200,2,"Micro20 series; motion only"]],"mount_rule":"Steadicam offsets motion/combat and violent movement penalties up to 4, Micro30 offsets motion up to 2; not an unconditional positive Impact addition.","camgoggles":[["Fuchi I-C-U",400,2,"Binocular view through camera"],["Zeemandt Luxor",700,1,"Monocular simultaneous own/camera view"],["Sekrit Sistemz No-Sho",1000,null,"Ordinary glasses appearance; no numeric TN penalty printed"]],"camgoggle_TN_scope":"Non-filming activities only; requires wearing controller, no datajack needed.","cyberoptic_rows":[["Eyecrafters Opticam Package",20000,"5"],["Dr. Spott Smartcam Implant",10000,"2"],["Smartcam Link",2500,"5"],["Smartcam Adapter",1500,null]],"essence_notation":"Source image p91 prints Essence 5, 2 and 5 respectively, without visible decimal points. Preserve as printed; potential legacy typography or erratum unresolved, not normalized to 0.5/0.2 or native SR3 costs.","smartcam_rule":"+2 Pix Impact with implant for tridlinked camera; +1 if using camgoggles or datajack without implant. Adapter fits manual or cybercamera. Cyberoptic package includes camera, hi-res magnification, low-light/thermographic options and memory/datajack output.","transmitter_links":{"columns":["type","unsecured_nuyen","secured_nuyen","range_km","concealability"],"rows":[["Short-haul",4000,6000,2,6],["Long-haul",6000,9000,50,null],["Uplink",1000,1500,null,null]],"qualifiers":"Short-haul portable; long-haul approximately 50 km and not effectively concealed; uplink nonportable with 1 m dish. Built-in or external, secured version requires compatible receiver. Fictional game ranges only."},"editing_devices":[["Vertex Netsynth Tridmixer",8000,0,null],["Fuchi Holo-Edit 7200",10000,1,null],["Sony TFX-10000 Imaging Generator",13000,3,500]],"editing_columns":["name","nuyen","skill_or_dice_add","dedicated_memory_Mp"],"editing_qualification":"Holo-Edit adds 1 effective skill and can convert flat images to 3D; Sony adds 3 dice; Vertex no bonus. Do not add both skill and dice for same effect.","fictional_pirate_gear_market":{"rows"