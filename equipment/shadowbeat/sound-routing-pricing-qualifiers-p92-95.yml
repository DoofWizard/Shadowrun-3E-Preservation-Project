data:
  publication: {title: ShadowBeat, publisher: FASA Corporation, catalog_number: FASA7109, year: 1992}
  supplements: [equipment.shadowbeat-sound-legacy-p92-96, equipment.shadowbeat-sound-configuration-qualifiers-p93-95]
  instrument_pricing_p92:
    complexity_factors: [size, moving parts, construction difficulty, sound range]
    common_north_america: Instruments ordinarily used in orchestras or popular bands.
    rare: Includes instruments specific to other cultures, historical instruments and instruments made to a musician's custom specification. Rarity is local, not intrinsic.
  sound_routing_p93_p94:
    professional_synth_minimum_voices: 8
    cellular_connections: Signal-locked digital radio links with checksum protection; physical cable connections, mainly sheathed optical cable, remain available if the radio connection is unreliable.
    direct_digital_recording_destinations: [CD transport, optical storage chip, SAN for Matrix recording]
    sampler_playback: Stored recordings may be combined, played individually or across multiple channels; multiple signals may be mixed into one output.
    mixer_example: {electric_instruments: 2, synth_systems: 3, vocalists_each_with_microphone: 2, required_input_channels: 7}
    manual_sampler_example_cm: {channels: 32, length: 160, width: 50, height: 10}
  instrument_cost_examples_p95:
    cheap_common_acoustic_guitar: {base_nuyen: 50, complexity: 3, total_nuyen: 150}
    fine_common_acoustic_guitar: {base_nuyen: 5000, complexity: 3, total_nuyen: 15000}
    average_common_electric_guitar: {base_nuyen: 500, initial_complexity: 3, adjusted_complexity: 2, total_nuyen: 1000}
    club_amp_and_speaker_array: {total_nuyen: 1400, cellular_price_increase_percent: 50, cellular_total_nuyen: 2100}
    synth_upgrade: Existing electric-guitar speakers can be reused for the synth system; the previously registered controller and slave pricing example remains unchanged.
    custom_extras: The standard instrument calculation excludes custom construction, ornate casings and special effects; the source suggests roleplaying and Negotiation Tests for bargaining over extras, without a numerical modifier.
  venue_equipment_p95: Most concert halls and sports arenas already have speaker arrays and mixers; this is a typical venue feature, not a guaranteed entitlement.
