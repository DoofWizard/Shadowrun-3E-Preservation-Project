data:
  section: Game Information — COST OF LIVING — Boston and Detroit, sourcebook table.
  table_basis: All entries are percentage ranges of standard Seattle prices, not fixed
    nuyen prices. The book explicitly states that these are going black-market prices
    and fluctuate with current conditions.
  boston_percentage_of_standard_seattle_cost:
    Weapons: 100–200
    Ammunition: 100–200
    Explosives: 120–200
    Accessories: 100–200
    Armor: 100–130
    Security/Communication Devices: 80–100
    Survival Gear: 100–150
    Electronics: 80–120
    Cyberware: 80–200
    Magical Equipment: 60–110
    Vehicles: 100–120
  detroit_percentage_of_standard_seattle_cost:
    Weapons: 70–130
    Ammunition: 90–200
    Explosives: 90–200
    Accessories: 90–200
    Armor: 100–120
    Security/Communication Devices: 90–110
    Survival Gear: 100–150
    Electronics: 100–150
    Cyberware: 80–200
    Magical Equipment: 100–180
    Vehicles: 60–100
  source_exception: Chicago does not receive an equivalent cost-of-living table in
    this chapter because the Containment Zone’s circumstances differ; the book directs
    readers to Bug City for Chicago.
