data:
  published_source:
    title: Sprawl Survival Guide
    publisher: FanPro
    catalog_id: FanPro10667
    edition: Shadowrun Third Edition
    source_kind: fictional tabletop-RPG sourcebook
    printed_pages:
    - 118
    - 119
    - 120
    - 121
    physical_pdf_pages:
    - 119
    - 120
    - 121
    - 122
  section: Game Information / Gear / The Home Telecom Terminal / Street Dataterms
  publication_scope: The book presents these as devices in the fictional Shadowrun
    setting; the equipment summary does not specify executable real-world telecommunications
    configurations.
  home_telecom:
    role: The source describes the household telecom as the entertainment center,
      household control interface and network hub, also called the trid or terminal.
    form_factors:
    - wall-mounted
    - tabletop
    - recliner chair integrated
    typical_components:
    - name: trideo receiver
      function: receives HDTV and trid via broadcast, Matrix feed or satellite dish,
        and supports AM/FM broadcast radio
    - name: flatscreen display
      function: ranges from small plasma/compact pullout display to wall-size screens;
        accepts holographic or video feeds from receiver, telephone, cyberterminal
        or attached device
    - name: holoprojection unit
      function: projects three-dimensional trid images ranging from desktop scale
        to life-size cubic area
    - name: acoustic speakers
      function: distributed audio speakers, optionally with microphones for voice
        control
    - name: vidphone
      function: telephone receives and transmits voice and trid through a fictional
        Matrix account; speaker/voice-command mode is typical and headsets or handsets
        offer privacy
    - name: computer
      function: controls household functions and connected appliances; the source
        lists Matrix jackpoint, chip and CD reader, credstick slot and keyboard/mouse/VR-glove
        peripherals; supports fictional tortoise-mode Matrix access
    - name: fax
      function: scanner, color printer and copier in one
    - name: wireless node
      function: links telecom to wireless appliances, devices and home features
    optional_additions:
    - cyberterminals
    - simdecks
    - satellite dishes
    - extra access stations/display units
    wireless_node_typical_flux_rating_options:
    - 0
    - 1
    fictional_basic_telecom_matrix_host:
      security_color: Blue
      security_value: 4
      ACIFS_in_source_order: 8/8/6/6/6
      IC: one Probe, Rating 2
      qualification: The book calls this a minimum equivalent for a basic telecom
        computer and explicitly allows the gamemaster to substitute other systems.
    multiuser_support: The published description permits concurrent residents to use
      entertainment, communication and household controls.
  public_street_dataterm:
    forms:
    - wall alcove
    - freestanding street terminal
    - chair/booth terminal
    fictional_access_infrastructure: Source describes Matrix jackpoint, low-end tortoise
      computer, display, speakers, fax, chip and CD reader, wireless access node,
      and local-grid managed public MSP accounts.
    user_booth_maglock_rating: 4
    booth_barrier_rating: 8
    credstick_reader_typical_rating: 1
    anti_tamper_system_rating: 6
    distribution: The source describes common access in higher-security neighborhoods,
      less frequent and poorly maintained units in lower-security areas; A and AA
      neighborhoods can offer holoprojection and low-end cyberterminals.
    host_security_sheaf_reuse:
      canonical_id: rule.matrix.ssg-dataterm-host-sheaf-p120
      canonical_path: rules/matrix/ssg-dataterm-host-sheaf-p120.yml
      status: separately source-reviewed; do not double-count the printed-p120 Dataterm
        Host Table.
  source_grounded_examples_unrun:
  - scenario: typical_public_credstick_reader
    source_rating: 1
  - scenario: public_terminal_anti_tamper
    source_rating: 6
  - scenario: fictional_basic_telecom_matrix_host
    source_security: Blue-4
    source_IC: Probe-2
  code_readiness: Numeric table fields source-reviewed; consumer implementation and
    game-engine tests not run.
framing: reference_exact
