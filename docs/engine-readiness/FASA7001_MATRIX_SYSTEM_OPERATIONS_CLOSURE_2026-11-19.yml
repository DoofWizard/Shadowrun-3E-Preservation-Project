    original_assertions: "Ongoing elapsed seconds convert by 3 seconds/Combat Turn with source six-/seven-second John upload timing alternatives retained; three named ongoing operations. Monitored operations require Free Action each Initiative Pass, interrupted monitoring aborts and needs System Test restart; five named monitored operations. Analyze Host Complex Control/Analyze gives one fact per net success or all at seven; Analyze IC Free, Analyze Icon Free Control TN minimum 2, Analyze Security Simple includes newly accrued tally, Analyze Subsystem Simple detects special defenses, Control Slave Complex Slave/Spoof may require average Computer and B/R or Knowledge skill for specialist process."
    canonical:
      - {path: "rules/matrix/sr3-core-interrogation-analysis-operations-p214-215.yml", blob: "8b2ef0b38fc5e9f2dd4a2f989af38fb45ce0dfff", commit: "8134b280e17ed6803db4a250171ca0e556b4673f"}
    exact_missing_field: null
  - heading: "Printed pp216–217: Decrypt, Download, Edit and Locate operations"
    original_assertions: "Decrypt Access/File/Slave Simple with correct subsystem and prerequisites; Download Data Read/Write Simple ongoing, optional GM damaged-file reconstruction (full Mp/downloaded Mp)×2 days and pertinent data ratio, original 100/10=20-day/10-percent example; Edit File direct small edits versus upload+insert, same-host copy two System Tests, header authentication Control versus Masking(Files) alert hours, tamper detection and GM backup discretion; Edit Slave Complex monitored. Graceful Logoff Access/Deception Complex with Track Rating TN condition, Locate Access Node specificity +1/0/-1, Locate Decker open-ended Sensor with Sleaze, Locate File index and specific lead, Locate IC no extra Sensor, Locate Slave Index/Analyze Complex with three successes, Logon to Host Access/Deception Complex and tally."
