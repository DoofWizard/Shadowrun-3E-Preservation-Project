section_obligations:
  - heading: "Printed p214: IC classifications, System Operations overview and Interrogations"
    original_assertions: "White IC targets icon only; Gray IC targets deck/utilities with persistent consequences; Black IC targets decker. Each System Operation binds a System Test/subsystem, utility, and Free/Simple/Complex Action; GM may create additional operations. Repeated interrogation accumulates successes, default five to locate (GM may set alternative); question specificity gives signed +1, +2, -1 or -2 TN; unavailable requested data revealed after at least three successes; a located item may only be pointer to another host."
