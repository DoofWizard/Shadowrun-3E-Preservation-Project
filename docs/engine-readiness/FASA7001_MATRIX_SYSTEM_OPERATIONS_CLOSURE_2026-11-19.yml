    original_assertions: "Upload Data Files/Read-Write Simple ongoing; source deck storage, automatically creates new file, must use Edit File to alter existing, cannot upload utilities (Swap Memory instead). Operational utilities require active memory and original source code to modify a program; nine named utility multipliers: Analyze 3, Browse 1, Commlink 1, Deception 2, Decrypt 1, Read/Write 2, Relocate 2, Scanner 3, Spoof 3; named System Operations and target-number effects retained."
