  - heading: "Printed pp218–219: grid logons, comcalls, monitoring, inactivity and Swap Memory"
    original_assertions: "Logon LTG Access/Deception Complex with typical 1D3×5-minute failed-attempt memory and alternative jackpoint restart; Logon RTG independent Access test and RTG/LTG shared tally. Make Comcall Files/Commlink Complex monitored, tests for linked participants, license exception, +100 nuyen per caller/minute; taps/scanners/commcode tests and opposed Device Rating as separately indexed. Monitor Slave Simple monitored. Null Operation Control/Deception Complex and escalating host Security Value +0/+1/+2/+4 by strict elapsed intervals, extra +1 per additional 12 hours with optional GM cap; Selena 12-second +1 and seven-minute +2 GM examples with discretionary three-minute IC appearance. Swap Memory Simple no skill test, Free Action unload prerequisite; Tap Comcall Special/Commlink Complex monitored, Index/Control/Files tests, 1 Mp/minute storage, repeated Decrypt +2 TN, dataline scanners one success each with no RTG tally."
