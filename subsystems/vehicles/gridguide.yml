  "rules": [
    "GridGuide sensor suites use Sensor 1 and include a transponder antenna, directional radar and video camera.",
    "GridGuide transponders operate at Flux 1 and receive/record active vehicle broadcasts.",
    "The system monitors traffic load, routes around congestion/incidents, meters parking, automates traffic violations and can prioritize/reroute for emergency vehicles.",
    "Coverage quality varies by district; poorly maintained low-security zones may have intermittent or no GridGuide coverage.",
    "GridGuide can be jammed because transponder signals are weak; electronic deception can feed false transponder data.",
    "A compromised GridGuide host can Locate/Monitor/Edit vehicle data; if no GPS fix is available, physical location can be determined via Triangulate. A vehicle on autonav may be redirected through Control Slave.",
    "GridGuide hosts are normally high-security Matrix systems because traffic manipulation can cause severe physical consequences."
