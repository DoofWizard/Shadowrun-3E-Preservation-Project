  "rules": [
    "Security Value consists of Technical Rating 1-10 plus Vigilance Code (Blue/Green/Amber/Red). Technical Rating measures sophistication and serves as the target number for intrusion/system-adjustment tests and as the rating of the security rigger's remote-control deck for EW purposes.",
    "Vigilance Code governs alertness and intrusion difficulty: Blue requires 1 success, Green 2, Amber 3, Red 4 on relevant access steps.",
    "CCSS uses hardwired communications and therefore is not vulnerable to ordinary MIJI unless the attacker first obtains a physical/hardwire access path.",
    "Security rigger can directly perceive/control components through simsense, jump into drones or rooms/corridors, and receives automatic alerts from system triggers.",
    "When a security rigger assumes the system body, standard VCR Initiative bonuses apply; dice pools are normally unavailable except Karma Pool until the rigger jumps into a specific drone/room/corridor, at which point normal applicable pools return.",
    "An intruding rigger who gains access also receives VCR Initiative bonuses and may use Task Pool (not Control Pool) for encryption/protocol-adjustment steps; Control Pool is usable in rigger combat."
  ],
