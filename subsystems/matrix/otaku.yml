participants:
  - "otaku characters"
  - "otaku tribes"

character_creation:
  - "Otaku may be created with the Priority or Point systems."
  - "Priority-system otaku reserve Priority A for otaku status and do not allocate Magic."
  - "Point-system otaku pay a dedicated Building Point cost and do not purchase Magic."
  - "Otaku use modified physical/mental Attribute limits and have skill restrictions appropriate to the source framework."
  - "Computer is mandatory at a high starting rating; channel skills are acquired separately."
  - "Resources primarily determine tribal resources rather than ordinary personal wealth."

living_persona:
  - "Otaku access the Matrix through a living persona rather than a cyberterminal persona."
  - "Living-persona values derive from Mental Attributes under the source's formulas."
  - "Otaku are treated as operating with hot-ASIST-equivalent Matrix access."
  - "Otaku receive a bonus to Detection Factor and System Familiarity tests."

channels:
  - "Access, Control, Index, Files and Slave channels act as skill-based counterparts to operational utilities."
  - "Channel specializations can emulate individual operational utilities."

complex_forms:
  - "Complex forms serve the functions of offensive, defensive and special utilities."
  - "Their creation, rating and size use otaku-specific rules rather than ordinary software rules."

sprites:
  - "Otaku may create sprites as autonomous helpers under the chapter's frame-like rules."

paths:
  cyberadept: "Applies a bonus to effective complex-form ratings."
  technoshaman: "Reduces target numbers when using channels."

tribes:
  - "Otaku normally belong to tribes with shared resource levels and resonance wells."
  - "Joining or founding tribes has Karma and roleplaying requirements."
  - "Tribal resources affect housing, shared gear and purchasing access."

submersion:
  - "Submersion raises an otaku's grade and grants one echo per grade."
  - "Submersion requires access to a resonance well and increasing Karma expenditure."
  - "Echoes may be incremental or static."
  echoes:
    - "Improved I/O Speed"
    - "Improved Hardening"
    - "Improved MPCP"
    - "Improved Persona"
    - "Improved Reaction"
    - "Daemon Summoning"
    - "Ghosting"
    - "Info Sortilage"
    - "Neurofilter"
    - "Overclock"
    - "Resonance Link"
    - "Switch"
    - "Traceroute"

fading:
  - "Beginning at age 21, otaku can no longer gain submersion grades."
  - "Annual Fading Tests can remove grades/echoes and eventually all otaku abilities."
  - "Lost abilities from Fading cannot be regained."

sources:
  - {source: source.matrix, pages: "133-146", relation: defines, note: "Otaku"}
notes:
  - "AI-created otaku are described as special cases and are not recommended as ordinary player characters."
