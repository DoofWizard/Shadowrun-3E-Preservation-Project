id: procedure.matrix.cybercombat
record_type: procedure
name: "Cybercombat"
domain: matrix
status: ingested
effective: {status: current, source: source.sr3-core, page: 222, basis: defines}
purpose: "Resolve combat between personas/IC in the Matrix."
prerequisites: ["hostile Matrix icons/personas/IC"]
inputs: ["Matrix Initiative","persona ratings","utilities/IC ratings","Hacking Pool","host Security Code"]
stages:
  - {id: initiative, name: "Matrix Initiative", test_or_action: "Determine Matrix combat order.", outputs: ["initiative order"]}
  - {id: maneuver, name: "Combat Maneuver", test_or_action: "Optionally resolve positioning/evasion/parry/other maneuvers.", outputs: ["maneuver modifiers"]}
  - {id: attack, name: "Resolve Attack", test_or_action: "Make the applicable icon/IC attack test using utility/program ratings and persona attributes.", outputs: ["attack successes"]}
  - {id: damage, name: "Resolve Icon Damage", test_or_action: "Apply IC/icon damage rules and Condition Monitor effects.", outputs: ["icon/persona condition"]}
  - {id: security, name: "Apply Security Consequences", test_or_action: "Apply IC/security tally/alert consequences where relevant.", outputs: ["updated security state"]}
outcomes: ["icon damaged/crashed","decker damaged/disconnected","combat continues"]
links:
  uses: [rule.matrix.matrix-initiative, rule.dice-pools.hacking-pool]
  requires: []
  produces: []
  modified_by: []
sources:
  - {source: source.sr3-core, page: 222, relation: defines, note: "Cybercombat / Cybercombat Sequence"}
  - {source: source.sr3-core, page: 223, relation: extends, note: "Initiative and actions"}
  - {source: source.sr3-core, page: 224, relation: extends, note: "Combat maneuvers"}
  - {source: source.sr3-core, page: 226, relation: extends, note: "Resolving attacks / icon damage"}
notes: []
