id: procedure.magic.learning-spells
record_type: procedure
name: "Learning Spells"
domain: magic
status: ingested
effective: {status: current, source: source.sr3-core, page: 180, basis: defines}
purpose: "Learn a spell formula at a chosen Force."
prerequisites: ["access to a compatible spell formula or teacher","tradition-compatible instruction/material"]
inputs: ["spell formula","desired Force","Sorcery","teacher/instruction where used","Karma"]
stages:
  - {id: acquire, name: "Acquire Formula", test_or_action: "Obtain a usable formula/teacher appropriate to the magician's tradition.", outputs: ["learning source"]}
  - {id: learn, name: "Learning Test", test_or_action: "Make the required Sorcery/learning test at the target number based on spell Force and circumstances.", outputs: ["learning successes"]}
  - {id: cost, name: "Pay Karma", test_or_action: "Spend required Good Karma for the learned spell.", outputs: ["known spell"]}
outcomes: ["spell learned at the selected Force","failed/delayed learning"]
links:
  uses: [entity.skill.sorcery, rule.skills.instruction]
  requires: []
  produces: []
  modified_by: []
sources:
  - {source: source.sr3-core, page: 180, relation: defines, note: "Learning Spells / Limited Spells"}
notes:
  - "Limited spells trade restrictions for easier learning/lower costs as defined by the core rules."
