mechanical_coverage:
  demon_rat: All eight stats, initiative, attacks, four powers, sunlight weakness, separate 1-in-6 chances, swarm size threshold and behavior.
  glomoss: Force cap, dual nature, astral-only Magic Sense, water requirement, inability to act astrally, alarm triggers and approximate glow duration.
  horned_bear: All eight stat slots, initiative, two damage codes, Reach, two powers, physical or astral entry trigger, single opponent ritual, any-wound withdrawal, victory departure, nonexhaustive violation condition and enhanced response.
  night_manta: All eight stat slots, distinct Initiative and Reaction, attack, four powers including venom damage and speed, dual nature and typical surprise behavior.
  sangre_del_diablo: All eight stat slots, Initiative, five powers, sludge Engulf reference, Compulsion-to-Engulf behavior. Source heading variant retained in supplement.
  shambler: All eight stat slots, initiative, attack, four powers, sunlight weakness, prey handling sequence, Body-to-armor conversion, reproduction threshold, per-four armor modifiers, hardening over hours and two-month maturation.
