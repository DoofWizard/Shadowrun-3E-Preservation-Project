mechanical_coverage:
  availability: September 2061 discovery and mid-2062 depletion of known deposits including unexploited deposits.
  refining: Ordinary raw-metal refining dissolves the material; treat as refined and use circulation. Successful Enchanting (Alchemy) test at three times raw-unit count. Each 20-gram raw unit produces one 10-gram radical unit.
  artificing_and_bonding: Two natural units provide a minus-one Enchanting modifier or reduce bonding Karma by one; the comparison with one synthetic unit is retained.
  black_market: Approximate prices of 25000 nuyen per raw unit and 50000 per refined unit.
  identification: Successful Parageology (6) or suitable Knowledge skill, or at least five Assensing successes.
