mechanical_coverage:
  p149_150: Spirit identity, Force attributes, unknown true names, involuntary metaplanar return restriction, daily astral Force loss and zero-Force destruction.
  p151_astral: Vessel anchor, countdown resumption, detection and barrier modifiers, Spirit Energy arrival/cap/use, Karma gifts and advancement, conjuring prohibition, banishment and reinhabitation lockout, discretionary Karma Pool, optional powers and weakness.
  p151_powers: Deathly Aura type/action/range/duration and three effects, resistance/recovery, masking requirement; Inhabitation type/action/range/duration, manifestation and materialization distinction, eligible vessels.
  p152_tables: All ten Inhabitation target numbers and all nine age rows across four Corpse Attributes columns checked against the canonical revision.
  p152_procedures: Force test and retry costs, dual nature, physical versus mental attributes, targeting, racial abilities, forced exit, minimum attributes, old versus new damage, implant exceptions, decay, ritual link.
  p153: Reinhabitation modifier, living-body search and recovery, maintenance, immediate corpse eligibility after death, implant access and exclusions; Karma Drain type/action/range/duration, contact, opposed test, both Karma ratios, permanence, damage and knockdown test.
