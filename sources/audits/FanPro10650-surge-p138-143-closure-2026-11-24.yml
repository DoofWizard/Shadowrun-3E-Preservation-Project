mechanical_coverage:
  p138: Existing and new character eligibility, discretionary application and timing, all seven SURGE Test modifier entries, Essence rounding/exclusions, Karma prohibition, fee, severity rolls and optional reroll.
  p139: Selection and incompatible-effect handling; Altered Eye Color, Altered Skin Coloration, Astral Hazing, Bio-Rejection, Chronic Osteocuspus, Critter Spook and Cyclops.
  p140: Cyclops continuation, Dual Natured, Feathers, Pointed Ears, Scales, Slow Healer, Third Eye, Tusks, Unusual Hair, Vestigial Tail, nine imported negative effects, Astral Sight.
  p141: Claws or Talons, Dermal Deposits, Fangs, Feline Eyes, Gills, Goblinization, High Frequency Hearing, Horns, Improved Scent and Taste, Long Tail, Low Frequency Hearing, Marsupial Pouch.
  p142: Both 16-row random effect tables including subrolls, Natural Venom, Prehensile Tail, Resistance to Disease and Resistance to Poisons.
  p143: Retractable Claws, Satyr Legs, Thermographic Vision, 18 imported positive effect entries, social interaction, custom effects and NPC applicability.
