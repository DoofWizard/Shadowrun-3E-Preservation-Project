  - "TOC routed before ingestion. Introduction explicitly states Genetech updates Shadowtech, Soldiers of Fortune updates/expands Fields of Fire, and Keeping the Rabble Out updates/expands Corporate Security Handbook; supersession will only be recorded where specific rules text justifies it."

