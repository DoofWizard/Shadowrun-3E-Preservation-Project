notes:
  - "2026-11-22 distinct original-page directed reconciliation: Keeping the Rabble Out pre-Game-Information printed pp79-94/PDF80-95 original imagery and 24 current indexed source-specific blobs matched. The original 130-page FanPro10664 PDF passed actual preservation_method verify-source with source_pdf_hash_verified. No new distinct numerical game rule or source correction demonstrated; prior p83 and p90 corrected semantics reused. Scoped administrative audit references/audits/sota63-keeping-rabble-out-p79-94-original-directed-coverage-2026-11-22.yml committed at 4bc051f1c0c15178605070c806e5d44de98e1690, exact blob 0173ee100c3d40d2890617243c8d8f368e5d7372. This is directed coverage rather than verbatim narrative certification; whole source remains ingesting and global Denver p45/PDF46 checkpoint unchanged."
  - "2026-11-22 original-image source correction for FanPro State of the Art: 2063 (Shadowrun Third Edition, FanPro10664), printed p83/PDF84: Knight Errant's fictional Doors catalogue describes a single-body stainless 16-gauge steel frame, whereas the accepted record had said stain-resistant. Only data.fictional_corporate_catalogue.doors[2] in references/sota63/physical-security-doors-hvac-p83.yml was corrected. Actual source SHA verification, independent corrected baseline/candidate review, stage/prepare, ordinary Contents write, exact readback, confirm and recovery inspection verified. Semantic commit ca2859ff827965f82db29226985424fac571b992, new blob 8ac06ef46c2d588b08d4baae6c1ef912f5f95e14; preceding blob 4b6175b8b817dccaff223746f872083c253532a2 retained in history. No new page authorization or source-wide certification."
  - "2026-11-22 original-image source correction for FanPro State of the Art: 2063 (Shadowrun Third Edition, FanPro10664), printed p90/PDF91: Faisal's separately attributed in-world FAB strain III claim uses UCAS, not UCSA. Only data.attributed_shadowland_commentary[speaker=Faisal].claim in references/sota63/magical-security-products-p90-91.yml was corrected. Source PDF SHA verified and independent corrected baseline/candidate review completed; stage/prepare, ordinary GitHub Contents write, exact blob readback, confirm and recovery inspection verified. Semantic commit 42909077a3e2e555cb91fc7650c4703fa43e418f, new blob d1130e8dbeba6cbff984aa3c05fd34e3930cd32e; preceding accepted blob fd51be1d12f3f521f790527bb30b1145aacc7ea2 retained in history. No new page authorization or source-wide certification."
  - "Original printed p79/physical PDF80 is the illustrated Keeping the Rabble Out chapter opening; Soldiers of Fortune ends at printed p78/PDF79. The provisional chapter routing 54-80/81-104 was corrected from visually reviewed original page images; this is routing only, not authorization of coverage."
  - "Sequential deep scan completed through printed p.53 / PDF p.54, finishing Charmed Life: New Metamagic. Symbolic Linking, symbolic-link foci, Severing, reverse ritual links, Psychometry, supremacy-duel mechanics, Absorption, Filtering, geomantic imprinting, Dowsing and Astrology were normalized with printed/PDF provenance. The source imagery shows Soldiers of Fortune begins on printed p.54 / PDF p.55, so the routed chapter boundary was corrected from the earlier provisional range."
  - "Deep extraction completed for Genetech Game Information printed pp.25-30 / PDF pp.26-31. General genetech costs/timing, prenatal modification, ritual-link effects, cyberware/bioware compatibility, gene therapy, rejuvenation, phenotypic alteration, environmental microadaptation, direct protein synthesis, DNA masking/scanners, immunization, protective agents, gamma-anthrax and Ebola Plus were normalized with tables and provenance."
  - "TOC routed before ingestion. Introduction explicitly states Genetech updates Shadowtech, Soldiers of Fortune updates/expands Fields of Fire, and Keeping the Rabble Out updates/expands Corporate Security Handbook; supersession will only be recorded where specific rules text justifies it."

