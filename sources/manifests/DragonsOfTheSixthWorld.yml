status: complete
notes:
  - "Pending normalization range printed pp.24-34 / PDF pp.26-36 has been fully normalized: Draco Foundation mandate/governance, seven-member board, offices/resources, shadow assets, drake asylum, and major nation/corporate/organization/dragon relationships are now durable. Both Dragons pending ranges are resolved; source normalization is complete."
  - "Pending normalization range printed pp.7-23 / PDF pp.9-25 has been fully recovered and normalized into compact provenance-bearing records covering the Sixth World dragon timeline, taxonomy/biology, lifecycle/reproduction, culture/communication/hoards/lairs, servants, and the source's non-mechanical dragon-magic overview. Shadowtalk-only claims remain explicitly reported rather than asserted."
  - "Sequential source scan completed through printed p.200 / PDF p.202, the end of Game Information before the index. Printed pp.191-200 are primarily dragon agenda, ally/enemy and campaign-use guidance; no additional standalone numeric mechanics were found beyond the already normalized Game Information inserts. Source is not complete: opening pp.7-23 and Draco Foundation pp.24-34 remain explicit normalization obligations."
  - "Deep Game Information scan completed through printed p.190 / PDF p.192. Aden's p.187 material is campaign guidance; the Celedyr/Ghostwalker material adds rules-bearing Earth Magic, dracobot stat blocks, Transys Neuronet megacorporate/asset ratings, Knights of Rage NPC guidance, and Spirit of Denver force/energy guidance, all normalized with provenance."
  - "Deep rules extraction completed through printed p.186 / PDF p.188, covering drakes and Draco Foundation campaign mechanics. True and bred drake stat lines, powers, transformation/astral rules, implant effects, player-character costs/requirements, and the Foundation NPC power-level guidance were normalized with exact provenance."
  - "Deep rules extraction completed through printed p.182 / PDF p.184 in Game Information. This source explicitly states that differences from the SR3 core dragon material are the most recent/official treatment, so these records mark updates only where this chapter supplies changed or expanded rules. Dragon type stat lines, great-dragon modifiers, Karma, Dragonspeech, Innate Spell, Metahuman Form, Twist Fate, dragon magic, cyberware/bioware, Matrix access, ranged modifiers, flight and vehicle-combat rules were normalized with provenance."
  - "Sequential directed scan completed through printed p.174 / PDF p.176, finishing A Nest of Serpents. The section's named great/adult dragons were normalized into a provenance-bearing catalog, including status/type and the major role supplied by this source. This range is setting/entity material; no standalone player-facing numeric rule block was introduced."
  - "Sequential directed scan completed through printed p.154 / PDF p.156, finishing Ryumyo's profile. Ryumyo, his Yakuza network and the Ring of Fire dragon-line material were normalized. The dragon-line passage is a setting-specific extension/clarification of aspected mana, not a replacement for the Magic in the Shadows aspected-power rule."
  - "Sequential directed scan completed through printed p.142 / PDF p.144, finishing the Rhonabwy and Sea Dragon paired profile. Both dragons, their Welsh loci and the Silver Songbird reference were normalized with provenance. No standalone numeric rule block was introduced in this range."
  - "Sequential directed scan completed through printed p.131 / PDF p.133, finishing Masaru's profile. Masaru, the Huk and the Philippine revolutionary world-state were normalized, along with a compact provenance-bearing agent/resource network. No standalone numeric rules block was identified; references to adept, changeling, astral, magical-tradition and free-spirit capabilities remain linked descriptive facts rather than invented mechanics."
  - "Sequential directed scan completed through printed p.118 / PDF p.120, finishing Lung's profile. Lung, the Red Dragon Triad, the Four Coins of Luck reference, and the Sichuan/Leshan locus were normalized with provenance. No standalone numeric rules block was identified in this range; metamagic and geomancy references remain references to existing systems rather than inferred replacements."
  - "Sequential directed scan completed through printed p.106 / PDF p.108, finishing Lofwyr's profile. Lofwyr and Saeder-Krupp were normalized with provenance. The range discusses corporate, political and intelligence influence but does not present a standalone game-rule block or numeric mechanical replacement."
  - "Sequential directed scan completed through printed p.93 / PDF p.95, finishing Hualpa's profile. Hualpa, Amazonia and the Amazonian Awakened were normalized with provenance. The range is setting/world material and introduces no standalone mechanical replacement or numeric rules block."
  - "Sequential directed scan completed through printed p.82 / PDF p.84, finishing Hestaby's profile. Hestaby and the Mount Shasta locus were normalized with provenance. The range references existing power-site and cleansing-metamagic concepts but does not present a standalone rules replacement or new resolution mechanic."
  - "Sequential directed scan completed through printed p.69 / PDF p.71, finishing Ghostwalker's profile. Ghostwalker, the Zone Defense Force, the Church of the Dragon Reborn and the Council of Denver were normalized with provenance; no standalone game-rule block was identified in this range."
  - "Sequential directed scan completed through printed p.58 / PDF p.60, finishing Celedyr's profile. Celedyr, Transys Neuronet and the Knights of Rage were normalized with provenance; no standalone rules block was identified in this range."
  - "Sequential directed scan completed through printed p.45, finishing Aden's profile. A concise named-dragon entity record was added; speculative material remains attributed rather than asserted."

