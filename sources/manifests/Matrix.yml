notes:
  - "Sequential deep scan completed through printed p.75. New operational, special, offensive and defensive utilities were normalized as a catalog and linked to subsystem.matrix.utilities; advanced uses/options for existing SR3 utilities were preserved as an extension. Programming begins on p.76."
  - "Sequential deep scan completed through printed p.67. Cyberterminal Construction pp.52-67 reuses procedure.matrix.cyberterminal-construction and adds durable rules for partial builds, hardwiring/upgrading, salvage, mismatched MPCP-bound components, implanted/cyberlimb terminals, and custom-designed terminal pricing. Utilities begins on p.68."
  - "Sequential deep scan completed through printed p.51. Grids and Hosts extends topology with modern connection types, RTG/LTG/PLTG and satellite-grid behavior; ultraviolet-host, paydata and archaic-system mechanics were normalized as distinct canonical records. Cyberterminal Construction begins on p.52."
  - "Sequential deep scan completed through printed p.41. Accessing the Matrix adds jackpoint and wireless-link values, MSP/passcode/account/datatrail behavior, system iconography/reality-filter interaction, Matrix movement and tortoise-mode rules."
  - "Sequential deep scan completed through printed p.29. Matrix World pp.7-16 is primarily setting/context; pp.17-29 add neural-interface, ASIST, speed-option, ICCM, transmission/multiplexing, Matrix-user special-case and Matrix Addiction mechanics. Existing Hacking Pool and SOTA records were reused and extended with Matrix provenance."
  - "The introduction states that Matrix expands the decking/Matrix rules in SR3."
  - "It also describes itself as a compilation of material from earlier/out-of-print and previous-edition books. Specific supersession is recorded per rule, not assumed globally."
