notes:
  - "Sequential deep scan completed through the end of Matrix. Autonomous Programs pp.147-159 were normalized as a subsystem covering semi-autonomous knowbots and true AIs. Printed pp.160-171 are consolidated RTG, system-operation, utility, programming, IC, cyberdeck/component, jackpoint and search reference tables; following record sheets/end matter add no new mechanics. Matrix deep ingestion is complete."
  - "Sequential deep scan completed through printed p.146. The Otaku chapter was normalized as a dedicated subsystem covering creation, living personas, channels, complex forms, sprites, paths, tribes/resources, submersion/echoes and the Fading. Autonomous Programs begins immediately afterward."
  - "Sequential deep scan completed through printed p.132. System Tricks pp.117-123 were normalized as topology/security/decker extensions; Information Searches pp.124-132 extend existing Matrix legwork with structured Computer searches, Matrix social rules and contact archetypes. Otaku begins on p.133."
  - "Sequential deep scan completed through printed p.116. Matrix adds six IC types plus advanced IC use/programming/crash rules, then extends security tallies, host shutdown, subsystem variation, random sheaf generation, constructs, grid security and security-decker handling. System Tricks begins on p.117."
  - "Sequential deep scan completed through printed p.103. New system operations and advanced applications of SR3 operations were normalized as a child-operation catalog under procedure.matrix.system-operation. Intrusion Countermeasures begins on p.104."
  - "Sequential deep scan verified through printed p.94. Programming pp.76-94 was fully reviewed; the existing core programming procedure remains valid, while detailed normalization of program options, command sets, autonomous-program structures, infection-related code, and purchased-program handling is deferred as pending.matrix.range-76-94 because the richer connector payload was rejected."
  - "Sequential deep scan completed through printed p.75. New operational, special, offensive and defensive utilities were normalized as a catalog and linked to subsystem.matrix.utilities; advanced uses/options for existing SR3 utilities were preserved as an extension. Programming begins on p.76."
  - "Sequential deep scan completed through printed p.67. Cyberterminal Construction pp.52-67 reuses procedure.matrix.cyberterminal-construction and adds durable rules for partial builds, hardwiring/upgrading, salvage, mismatched MPCP-bound components, implanted/cyberlimb terminals, and custom-designed terminal pricing. Utilities begins on p.68."
  - "Sequential deep scan completed through printed p.51. Grids and Hosts extends topology with modern connection types, RTG/LTG/PLTG and satellite-grid behavior; ultraviolet-host, paydata and archaic-system mechanics were normalized as distinct canonical records. Cyberterminal Construction begins on p.52."
  - "Sequential deep scan completed through printed p.41. Accessing the Matrix adds jackpoint and wireless-link values, MSP/passcode/account/datatrail behavior, system iconography/reality-filter interaction, Matrix movement and tortoise-mode rules."
  - "Sequential deep scan completed through printed p.29. Matrix World pp.7-16 is primarily setting/context; pp.17-29 add neural-interface, ASIST, speed-option, ICCM, transmission/multiplexing, Matrix-user special-case and Matrix Addiction mechanics. Existing Hacking Pool and SOTA records were reused and extended with Matrix provenance."
  - "The introduction states that Matrix expands the decking/Matrix rules in SR3."
  - "It also describes itself as a compilation of material from earlier/out-of-print and previous-edition books. Specific supersession is recorded per rule, not assumed globally."
