notes:
  - "Sequential reconciliation completed through printed p.269, covering Spirits and Dragons. Existing SR3 spirit-power/combat canonical records were reused; the missing SR3 elemental/nature-spirit roster, dragon types, and named great-dragon references were added as entities. Street Gear begins on p.270."
  - "Sequential reconciliation completed through printed p.259, covering Contacts. Existing legwork, Matrix searching, contact levels and loyalty records were verified; sample contact archetypes were added as reusable example entities. Spirits and Dragons begins on p.260."
  - "Sequential reconciliation completed through printed p.252. Karma/advancement, Karma Pool uses, NPC professionalism, and disease/toxin mechanics were already represented by canonical SR3 records; pp.251-252 are gamemastering guidance with no additional reusable mechanics requiring new records."
  - "Sequential reconciliation completed through printed p.241. Perception was corrected to the source's team formula (average Intelligence + one die per member); missing physical/technical security, fencing-loot, and SIN/credstick mechanics were normalized; existing maglock, weapon-detection, and lifestyle canonical records were reused."
  - "Repository reconciliation confirms the Matrix chapter is already normalized through printed p.230: topology/access, System Ratings, deck/persona ratings, System Tests, Security Tally/sheaves/alerts, utilities, Matrix Initiative, System Operations, Cybercombat, and IC. Source verification places Running in the Shadows at printed p.231; resume there without duplicating the Matrix chapter."
  - "Repository canonical records and the ingestion ledger establish that core concepts, character creation, Skills, Combat, Vehicles/Drones, and the core Magic baseline have already been normalized. The earlier architecture-phase note was stale and has been reconciled."
  - "Sequential continuation resumes at the Matrix chapter, printed p.199 (PDF p.208); completed earlier chapters are not being rescanned wholesale."
