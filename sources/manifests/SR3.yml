  - "Spirits and Dragons through printed p.269 were previously reconciled, including baseline spirit and dragon entities."
  - "Contacts through printed p.259 were previously reconciled; existing legwork, Matrix searching, contact levels and loyalty records were verified."
  - "Advancement and gamemastering material through printed p.252 was previously reconciled against existing canonical records."
  - "Running in the Shadows through printed p.241 was previously reconciled, including perception, physical/technical security, fencing-loot and identity mechanics."
  - "The core Matrix chapter through printed p.230 is already represented by canonical records and is not being duplicated."
  - "Earlier core chapters covering concepts, character creation, skills, combat, vehicles/drones and magic are already represented by canonical records."

