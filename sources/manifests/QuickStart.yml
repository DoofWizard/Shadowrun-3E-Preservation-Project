  - "Sequential scan completed through printed p.64. Printed pp.38-39 finish cyberware/cyberdeck/biotech/vehicle reference material; pp.40-55 contain Prototype Envy and its reusable GM/perception/security/Karma mechanics; pp.56-64 contain the eight sample characters. The final back cover adds no rules. Quick Start ingestion is complete."
  - "Sequential scan completed through printed p.37, covering Quick Start magic (Drain, traditions, astral perception/assensing, Sorcery, spell resistance/effects, Conjuring/spirits and sample spells) plus the opening Street Gear, armor, electronics, surveillance/security, survival gear, and cyberware sections."
  - "The source explicitly describes its rules as distilled from Shadowrun, Third Edition. Quick Start mechanics are therefore preserved as a bounded introductory ruleset and are not assumed to replace full SR3 rules."
  - "The PDF is an image-only scan. The worker uses page-image inspection and bounded OCR for extraction; printed-page provenance is retained."
  - "Printed pp.1-7 are introductory/setting material and add no mechanically distinct reusable rules."
  - "Sequential scan completed through printed p.27, covering core tests, character-number concepts, Quick Start Action Pool, skills/defaulting, Initiative/combat, ranged/melee and Matrix combat, damage, and healing."
