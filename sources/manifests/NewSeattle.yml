notes:
  - "Sequential deep scan completed through printed p.119 / PDF p.120. Game Information pp.108-119 was read in full. rule.security.seattle-security-response-template and reference.new-seattle-game-information were normalized. The formerly pending Lone Star loadout p112 and law-enforcement archetypes pp113-114 are now source-reviewed and independently confirmed as noncontiguous semantic records in the supplement register; no new source-page boundary authorization is implied. The Location Index begins on printed p.120 / PDF p.121."
  - "Sequential directed scan completed The Seattle Underworld through printed p.107 / PDF p.108. Mafia, yakuza, Triad, Seoulpa-ring and major-gang organization profiles were read sequentially with source-period provenance; shadowtalk speculation was kept separate. A richer organization-catalog normalization payload was rejected by the connector, so preserve pending.newseattle.underworld-p97-107 until fully normalized. Game Information begins on printed p.108 / PDF p.109."
  - "Sequential directed scan verified The Corporate Sector through printed p.96 / PDF p.97. The p.82 corporate-economy overview and p.83 United Corporate Council were normalized. Corporate profiles, facilities, security systems and Matrix/security implications on pp.83-96 were fully read with provenance, but the richer normalization payload was rejected by the connector; preserve pending.newseattle.corporate-profiles-p83-96 until fully normalized. The Seattle Underworld begins on printed p.97 / PDF p.98."
  - "Sequential directed scan verified The Body Politic through printed p.81 / PDF p.82. Government structure/officeholders, district mayors, city-service contractors, emergency and Grid-Guide implications, security-provider jurisdiction, magical-policing and military deployment, policlubs, and foreign relations were all read with page provenance. Rich normalization was rejected by the connector, so preserve pending.newseattle.body-politic-p73-81 until fully normalized. The Corporate Sector begins on printed p.82 / PDF p.83."
  - "Sequential directed scan completed through printed p.72 / PDF p.73, finishing the Seattle Districts chapter. Ork Underground access/smuggling context; Redmond and Puyallup at-a-glance statistics and Lone Star ratings; Body Mall 10-20% cyber-mod price reduction; district Matrix/security context; reusable sites; and Barrens gang profiles were normalized with printed/PDF provenance. Unverified shadowtalk was kept separate from source-period facts. The next section, The Body Politic, begins on printed p.73 / PDF p.74."
  - "Sequential directed scan completed through printed p.57 / PDF p.58, covering Renton, Auburn, Snohomish and Fort Lewis. District at-a-glance statistics, Lone Star/security ratings, Knight Errant training-academy security, major corporate/military facilities, gang/faction context, McChord surveillance restrictions, Urban Combat Simulator security, and Fort Lewis Zoological Gardens access controls were normalized with provenance."
  - "Sequential directed scan verified Everett through printed p.50 / PDF p.51. Detailed normalization remains pending as pending.newseattle.everett-p47-50 because the connector rejected the richer payload. The next semantic slice begins with Renton on printed p.51 / PDF p.52."
  - "Tacoma bounded slice verified from printed p.44 through the Tacoma material ending in the left column of printed p.47 / PDF pp.45-48. Captured Tacoma at-a-glance statistics and Lone Star ratings; Crying Wall public-access/ticket and Ork Underground notes; Tacoma factory/corporate Matrix-host guidance (factory hosts Green/Orange, stronger protection for production controls, high-end corporate hosts); Federated-Boeing Metalworks checkpoint/key-card/24-hour security; and Tacoma gang/faction context. Rich normalization was rejected by the connector, so preserve pending.newseattle.tacoma-p44-47 until fully normalized. Everett begins on the same printed p.47 and is the next semantic slice."
  - "Sequential directed scan completed through printed p.43 / PDF p.44, finishing Bellevue. The verified pp.40-43 range includes Bellevue at-a-glance statistics and Lone Star ratings, Gates Casino source-period context, Cavilard Research Center access/ID/cold-vault procedures, and the 405 Hellhounds/Lake Acids/Leather Devils/Nova Rich profiles. Rich normalization was rejected by the connector; preserve pending.newseattle.range-p40-43 until the verified details are fully normalized. No standalone numeric combat stat block was found in this range."
  - "Sequential directed scan completed through printed p.39 / PDF p.40, finishing Downtown Seattle. The full pp.31-39 detail range was verified, including Downtown statistics, Lone Star neighborhood security ratings, jurisdiction/access notes, Matrix/security behavior, source-period venue/security details and named gang/faction context. Rich normalization payloads were rejected by the connector; preserve pending.newseattle.range-p31-39 until the verified details are fully normalized. No standalone numeric combat stat block was found in this range."
  - "TOC routed from printed pp.2-3 / PDF pp.3-4. Printed page numbers map to PDF page +1 across the opening pages."
  - "Game Information begins on printed p.108 and is the primary deep-extraction range; earlier chapters remain sequentially directed-scanned so embedded rules/stat blocks are not skipped."

