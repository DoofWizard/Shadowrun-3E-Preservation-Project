notes:
  - "Sequential directed scan completed The Seattle Underworld through printed p.107 / PDF p.108. Mafia, yakuza, Triad, Seoulpa-ring and major-gang organization profiles were read sequentially with source-period provenance; shadowtalk speculation was kept separate. A richer organization-catalog normalization payload was rejected by the connector, so preserve pending.newseattle.underworld-p97-107 until fully normalized. Game Information begins on printed p.108 / PDF p.109."\n  - "Sequential directed scan verified The Corporate Sector through printed p.96 / PDF p.97. The p.82 corporate-economy overview and p.83 United Corporate Council were normalized. Corporate profiles, facilities, security systems and Matrix/security implications on pp.83-96 were fully read with provenance, but the richer normalization payload was rejected by the connector; preserve pending.newseattle.corporate-profiles-p83-96 until fully normalized. The Seattle Underworld begins on printed p.97 / PDF p.98."\n  - "Sequential directed scan verified The Body Politic through printed p.81 / PDF p.82. Government structure/officeholders, district mayors, city-service contractors, emergency and Grid-Guide implications, security-provider jurisdiction, magical-policing and military deployment, policlubs, and foreign relations were all read with page provenance. Rich normalization was rejected by the connector, so preserve pending.newseattle.body-politic-p73-81 until fully normalized. The Corporate Sector begins on printed p.82 / PDF p.83."\n  - "Sequential directed scan completed through printed p.72 / PDF p.73, finishing the Seattle Districts chapter. Ork Underground access/smuggling context; Redmond and Puyallup at-a-glance statistics and Lone Star ratings; Body Mall 10-20% cyber-mod price reduction; district Matrix/security context; reusable sites; and Barrens gang profiles were normalized with printed/PDF provenance. Unverified shadowtalk was kept separate from source-period facts. The next section, The Body Politic, begins on printed p.73 / PDF p.74."\n  - "Sequential directed scan completed through printed p.57 / PDF p.58, covering Renton, Auburn, Snohomish and Fort Lewis. District at-a-glance statistics, Lone Star/security ratings, Knight Errant training-academy security, major corporate/military facilities, gang/faction context, McChord surveillance restrictions, Urban Combat Simulator security, and Fort Lewis Zoological Gardens access controls were normalized with provenance."
  - "Sequential directed scan verified Everett through printed p.50 / PDF p.51. Detailed normalization remains pending as pending.newseattle.everett-p47-50 because the connector rejected the richer payload. The next semantic slice begins with Renton on printed p.51 / PDF p.52."
