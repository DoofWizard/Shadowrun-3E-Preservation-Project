notes:
  - "Rigger 3 is treated as the SR3-era vehicle/rigging expansion. Exact replacements of Rigger 2 or SR3 core mechanics are recorded individually."
  - "Sequential deep scan completed through printed page 21. Reusable mechanics from control/safety systems, autonav, transponders, GridGuide, remote vehicle access, vehicle identity hacking, and termination chips are normalized; pp.7-10 and 19-21 were setting/context without additional reusable mechanics."
  - "Sequential deep scan completed through printed page 29, covering rigger character skills/options, dice pools, VCR effects, ASIST backlash, implant/cybermancy/magic interactions, and maintenance/overhead."
  - "Sequential deep scan completed through printed page 40, covering sensor upgrades/dead zones, ED/ECD, sonar and thermoclines, remote-network infiltration, MIJI, Signal Condition Monitors, and network recovery/reconnect/reboot."
  - "Sequential deep scan completed through printed page 44, covering remote-control networks, subscriber lists, hardwired decks, multiple-rigger networks, BattleTac IVIS, Pilot ratings, autosofts, robots/Adaptation Pool/prime directives, and drone dump-shock clarifications."
  - "Sequential deep scan completed through printed page 50, covering CCSS security systems, Security Value/Vigilance, active security-rigger perception/actions, hardwire access, decryption/protocol adaptation, rigger combat, and decker access restrictions."
  - "Sequential deep scan completed through printed page 60, covering ship-scale attributes/crews, terrain/weather, ramming/grounding/boarding, Naval Weapon Control Networks, naval damage and damage control, sinking/repair, ship-scale magic/domains, submarine depth/terrain, underwater drones, torpedoes, and underwater vehicle combat."
  - "Sequential deep scan completed through printed page 71, covering special vehicle attributes, Stress, lifting/pulling/overload, trailers/rail vehicles, mechanical arms/legs, air-cushion vehicles, aircraft/NOE/takeoff/landing, LAVs, semiballistics, and suborbitals."
  - "Sequential deep scan completed through printed page 85, capturing the explicitly optional Advanced Rules package: variable fuel/fuel grade, optempo, quality factors, subsystem damage, alternate mixed combat/collisions/sensor tests, electronic footprint, missile-lock breaking, pre-programmed drone commands, backup channels/cranial-deck server mode, and advanced EW."
  - "Sequential deep scan completed through printed page 101, ingesting New Toys vehicle weapons, missiles/torpedoes, snake-eyes riggingware, cyberdeck/remote-control accessories, autosofts, and miscellaneous vehicle-control/counter-pursuit equipment as reusable canonical entities/options."
  - "Sequential deep scan completed through printed page 121, normalizing the Vehicle Design construction system: chassis selection, power plants, DPV/markup/cost/Street Index/Availability, factory-only design options, Cargo/Load constraints, facilities and robot-option categories."
  - "Sequential deep scan completed through printed page 142, normalizing the Vehicle Customization process plus engine, control-system, protective-system, Signature and weapon-mount modifications."
  - "Sequential deep scan completed through printed page 155, completing Vehicle Customization with electronic systems, ECM/ECCM/ED/ECD and sensor/sonar tables, specialized sensor/EW installs, and general accessories. Vehicle Lists begin on p.156."
  - "Sequential deep scan completed through printed page 157, normalizing Vehicle List acquisition guidance for rare and non-commercial vehicles plus the printed vehicle-field/code legend. Vehicle catalog entries begin on p.158."
  - "Sequential deep scan completed through printed page 160, ingesting the first Vehicle List catalog entries: ATV, chopper, off-road and racing bikes, scooters, and skiffs. Speedboats begin on p.161."
  - "Sequential deep scan completed through printed page 162, adding speedboats, sport cruisers, water scooters, and yacht catalog entities with printed variants and statistics. Cars begin on p.163."
  - "Sequential deep scan completed through printed page 171. The previously partial pp.167-171 vehicle-list gap was reconciled and missing sports-car, tractor, heavy/medium transport, ambulance and van entities were added without duplicating already-normalized catalog entries. Drones begin on p.172."
  - "Sequential deep scan completed through printed page 177, ingesting crawler, mini-blimp, skimmer, trailer, fixed-wing/rotary/vectored-thrust UAV and initial walker drone catalog entries. p.178 was consulted only to finish walker stat lines that spill across the page break; Fixed Wing Aircraft proper resumes at p.178."
  - "Sequential deep scan completed through printed page 184, ingesting fixed-wing aircraft, ultralights, hovercraft, attack helicopters, autogyros, cargo helicopters, and tilt-wing aircraft. p.185 was consulted only to finish tilt-wing stat lines that spill across the page break; utility-helicopter catalog resumes at p.185."
  - "Sequential deep scan completed through printed page 193, finishing the narrative vehicle catalog with utility helicopters, ships, submarines/undersea craft, vector-thrust craft, zeppelins, rail vehicles, semiballistics and suborbitals. Power-plant/chassis reference tables begin on p.194."
  - "Power Plant Table ingestion completed through printed page 195, preserving the full Battery and Chemical Rocket tables and the Diesel table (continued into p.196). p.196 was consulted only to finish Diesel rows; Electric Fuel Cell remains the next active table."
  - "Power Plant Table ingestion completed through printed page 198, preserving Electric Fuel Cell and Gasoline numeric design tables in addition to the earlier Battery/Chemical Rocket/Diesel records. Jet Turbine begins on p.199."
  - "Power Plant and Chassis reference appendices completed through printed page 205, preserving exact numeric construction tables as structured canonical references. Printed pp.206-207 are blank vehicle/remote-control record sheets and p.208 is the back cover; they add no new mechanics."
  - "Rigger 3 deep ingestion is complete."
