notes:
- FanPro10662 is a distinct revised-edition rules source, not an in-place replacement
  of FASA7910; only original-source-proven revised edition differences may be registered
  following ordinary transaction gates.
- Initial nonactive source-specific provenance admission only; leave existing Denver
  main manifest/checkpoint, prior books, historical source registries, and original
  edition mechanical lineage unchanged.
- Revised p58/PDF60 still prints the same ship-damage-control repair-time formula as
  FASA7910; a separate errata proposal is not original-page-certified. Preserve
  the ambiguity and do not silently change the original mechanical rule.
- Revised p74/PDF76 retains a worked-example/general-test mismatch regarding
  Vehicle Test successes and coasting distance; source fields are preserved
  separately and engine interpretation is unresolved.
- Revised vehicle list original printed pp163-168/PDF165-170 compared directly to historical FASA7910 same printed pp163-168. Three separate equipment-stat records were prepared, committed with exact Git byte readback, confirmed and source-indexed; only differing fields recorded, no global contiguous advancement.
- Revised subcompact and medical transport Vehicle List printed pp169-170/PDF171-172 independently image-compared to historical FASA7910 original pages. Only source-demonstrated different fields were added with actual transaction confirmation and noncontiguous indexing; printed Availability dash preserved as unresolved rather than zero.
