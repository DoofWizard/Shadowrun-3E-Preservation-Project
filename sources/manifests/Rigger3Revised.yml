  later_review_note_2026_11_23: Original revised pp79,89-91,93 and historical FASA7910
    matching printed pages independently image-reviewed; four distinct mechanical corrections
    staged, prepared, committed, exactly read back, and confirmed before source indexing.
  later_review_note_2026_11_23_design: Original FanPro10662 and FASA7910 printed pp112-113,120 independently
    image-reviewed; design-point example, class Availability modifiers, and medical workspace
    table rows separately prepared, exact-byte committed, transaction-confirmed and indexed.
    Availability minimum 2/24 literal retained as ambiguous without inventing engine-ready units.
  later_review_note_2026_11_23_customization: Original FanPro10662 and FASA7910 printed pp129-132 independently image-reviewed for control-system modification multipliers, ablative armor price and availability, installation-test requirements, and concealed armor Handling condition. Two distinct mechanical records completed prepare, ordinary exact-byte Contents write/readback and real confirmation. Only discrete edition differences indexed; not a whole-section or global completion claim.
  later_review_note_2026_11_23_sonar_tires: Original FanPro10662 and FASA7910 pp148 and pp154-155 directly image-reviewed; original revised sonar table design-point values and new flat-tire damage, resistance, Crash, Handling and Speed rules each confirmed through prepare, ordinary Contents exact readback, real gate confirm and recovery inspection. Only these two distinct mechanical records are newly indexed; no global page credit or whole-source closure.
  later_review_note_2026_11_23_vehicle_list_p160: Original FanPro10662 printed p160/PDF162 and historical FASA7910 printed p160/PDF160 independently compared from page images for three scooters/skiffs. Source-specific numerical differences passed prepare, ordinary Contents exact readback, actual confirm, and recovery inspection; no contiguous source advancement or whole-list completeness asserted.
  later_review_note_2026_11_23_vehicle_list_p162: Original FanPro10662 printed p162/PDF164 and historical FASA7910 printed p162/PDF162 independently compared for Riverine, AME, and Watersport table fields. Source-specific changed values completed prepare, ordinary GitHub Contents exact readback, gate confirmation and recovery inspection. No whole Vehicle List completion claim.
  later_review_note_2026_11_23_vehicle_list_p171_172: FanPro10662 original printed pp171-172/PDF173-174 and historical FASA7910 printed p171/PDF171 independently compared by original images. Only genuine source-printed changed cells and Power Space notations registered after baseline/candidate prepare, ordinary exact Contents commit/readback, actual confirm and recovery inspection. Revised van table reflows across two printed pages; unreviewed drone fields and full-book completion unclaimed.
  later_review_note_2026_11_23_vehicle_list_p172_175_drones: FanPro10662 revised original pp172-175/PDF174-177 compared directly against historical FASA7910 crawler, mini-blimp, skimmer and trailer catalog pp173-175/PDF173-175. Ten source-demonstrated model differences with eleven changed fields in original numeric tables source-reviewed and accepted through independent baseline/candidate prepare, normal exact Contents write/readback, gate confirm and recovery inspect. Reflowed page positions did not create duplicate canon; no whole Vehicle List or global completion asserted.
  later_review_note_2026_11_23_vehicle_list_p176_178_uav: FanPro10662 revised original pp176-178/PDF178-180 and historical FASA7910 original printed pp176-178/PDF176-178 independently original-image compared for named fixed-wing, rotary-wing and vectored-thrust UAV models. Ten model groups and thirty-two exact numeric/unit changes were staged, prepared, ordinary committed with matching complete-byte readbacks, actually confirmed and recovery-inspected. Only differing original-source numeric cells or explicit printed unit codes are indexed; remaining Vehicle List and whole-book certification not claimed.
  later_review_note_2026_11_23_hover_rotor: Original FanPro10662 revised hovercraft printed pp182-183/PDF184-185 and rotorcraft pp183-184/PDF185-186 were independently image-compared by matching models against FASA7910 original pp181-184/PDF181-184. Two new equipment-stat records were prepared, exact Contents committed, read back, actually confirmed, recovery-inspected, and source-indexed. Historical Hovertruck p181 SI/Availability cells remain literal source-layout ambiguities; no global contiguous page credit or whole-book claim.
  later_review_note_2026_11_23_tilt_utility: FanPro10662 revised original printed pp185-186/PDF187-188 directly compared by model to FASA7910 original printed pp184-186/PDF184-186. Seven tilt-wing and utility helicopter groups contain source-demonstrated changes including DocWagon patient-space notation, airframe ratings, cost and Availability dashes. Exact candidate committed and read back, prepared/confirmed/recovery-inspected before index; unknown Availability remains literal and no global page credit is claimed.
  later_review_note_2026_11_23_vector_handling: Original revised FanPro10662 printed p191/PDF193 and historical FASA7910 printed p191/PDF191 Vehicle List images were directly compared by matching model row. Ares Lobo LAV, GMC Banshee, and GMC Harpy Scout revised Handling differences were independently source reviewed, staged, prepared, committed through ordinary Contents, exactly read back, actually confirmed and recovery inspected. Audit references/audits/r3-revised-vector-thrust-handling-p191-source-transaction-2026-11-23.json; no contiguous advancement.
  later_review_note_2026_11_23_aohana_frigate_ammo: Original revised FanPro10662 printed p187/PDF189 and historical FASA7910 printed p186/PDF186 ship-description images directly compared for Shiawase Aohana-Class Frigate. Light Naval Gun ammunition revised from 500 to 400 rounds, retaining 16 CF. Independent first-pass source/editorial review, stage, prepare, ordinary Contents exact-byte write/readback, actual confirm and recovery inspection verified. Audit references/audits/r3-revised-aohana-frigate-ammo-p187-original-transaction-2026-11-23.json; historical original and Denver boundary unchanged.
  later_review_note_2026_11_23_special_vehicles: FanPro10662 revised printed p193/PDF195 original image and FASA7910 historical printed pp192-193/PDF192-193 independently compared by matching model rows; Bergen tractor chassis and Availability plus fourteen paired Grande Concorde/SV250 semiballistic statistics preserved as original printed differences after baseline/candidate stage, preparation, ordinary exact GitHub Contents write/readback, actual gate confirm and recovery inspection. The historical source remains unchanged and no global page credit is claimed.
  later_review_note_2026_11_23_jet_sports_car: FanPro10662 revised original printed p199/PDF201 Jet Turbine Cars table image compared to FASA7910 historical original p199/PDF199. The revised Sports Car row is genuinely absent from the historical original Jet Turbine table. Its exact Load, Speed, Acceleration, Signature, Fuel, Economy, Design Points and blank People Space cells were reviewed, independently baseline/candidate staged, prepared, ordinary committed, exactly read back, actually confirmed and recovery-inspected before source indexing. No unreviewed rows or contiguous page credit claimed.
  later_review_note_2026_11_23_chassis_reference: Original revised FanPro10662 Vehicle Chassis Table pp202-204/PDF204-206 independently image-compared to historical FASA7910 pp202-204/PDF202-204. Three distinct equipment-stat records capture chassis capacity, literal rail/trailer signature and drone CF/sensor fields. Each passed independent source/editorial baseline-candidate review, actual stage/prepare, ordinary Contents write with exact-byte readback, gate confirm, and recovery inspection before indexing. Source reflow and unchanged fields do not count as new mechanics; no global contiguous advancement or whole-book certification.
  later_review_note_2026_11_23_submarine_p205: Original revised FanPro10662 printed p205/PDF207 and historical FASA7910 printed p205/PDF205 independently visually compared. Revised submarine chassis table adds complete rows for Attack Submarine, Bathyscaph and Boomer; historical original chassis table lacks those three rows although corresponding vessel types occur in earlier historical power-plant tables. Original values were independently reviewed and committed through actual source SHA verify, baseline/candidate stage/prepare, ordinary Contents write and matching readback, gate confirm and recovery inspect. Printed p206-207 forms and p208 final artwork were also viewed without claiming unique new mechanics. No global page credit or full revised-book completion.
  later_review_note_2026_11_23_fixed_wing_p179_180: Original revised FanPro10662 printed pp179-180/PDF181-182 independently compared against FASA7910 original printed pp178-179/PDF178-179, allowing for page reflow. The revised aircraft table includes two new airliner entries Hawker-Ridley HS-895 Skytruck and Lockheed C-260 Transport, and original jet fighter A. Halcon and B-D-M EFA have source-verified economy, load, cost and launch-control differences. Both distinct equipment-stat records passed actual source verification, independent baseline/candidate review, stage/prepare, ordinary Contents creates with exact readback, gate confirm, recovery inspection and subsequent source-specific indexing. No global page credit, entire Vehicle List closure or engine-ready inference.
  later_review_note_2026_11_23_fuel_cell_ultralight: FanPro10662 revised p197/PDF199 and historical FASA7910 p197/PDF197 original page images independently compared. Electric Fuel Cell Ultralight Speed Start and Maximum entries are source-printed 10/15 and 10/60 versus historical 15 and 75. Literal slash notation preserved without inferred mode or engine conversion. Candidate passed actual source SHA verify, independent baseline/candidate review, stage/prepare, ordinary exact Contents readback, gate confirm and recovery inspect before source-specific indexing. No contiguous page credit or full-book claim.
