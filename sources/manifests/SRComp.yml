notes:
  - "Sequential deep scan completed through the end of Shadowrun Companion. Alternate Campaign Concepts on pp.109-129 were normalized as campaign references; gang-campaign mechanics on pp.120-124 were captured as an optional subsystem; the five Seattle gang profiles on pp.124-129 preserve the source's explicit supersession statement. Printed p.130 is a consolidated actions reference, followed by record sheets, index and end matter with no additional mechanics requiring normalization."
  - "Sequential deep scan completed through printed p.108. Running the Game is primarily gamemastering/adventure-design guidance; the reusable Baseline Shadowrun Payment Table on p.100 was normalized as a reference record, while descriptive plot advice was not duplicated."
  - "Sequential deep scan verified through printed p.91. The Advanced Rules chapter is already represented by canonical optional-rule records covering Karma/nuyen exchange, favors and markers, Karma-pool variants, Team Karma, Prime Runner scaling, general SOTA, and retirement; no duplicate records were created."
  - "Sequential deep scan completed through printed p.78. Contact upkeep/network/enemy mechanics reuse existing canonical records; the sample contact archetypes on pp.73-78 were added as a compact catalog. Advanced Rules begins on p.79."
  - "Sequential deep scan verified and normalized through printed p.78. The Contacts and Enemies chapter is represented by contact upkeep/improvement, FOF networking and leak rules, special contacts, Shadowland research, contact knowledge/disclosure, enemy construction, and reusable sample-contact records."
  - "Printed p.61 is full-page art and contains no rules text."
  - "Sequential deep scan verified through printed p.58. Existing canonical records cover part of this range; detailed normalization for newly identified material remains pending because the current connector rejected the richer payload."
  - "Sequential deep scan verified through printed p.43. The optional alternate-character section was fully reviewed; detailed normalization for that range is deferred because the current connector rejected the richer payload."
  - "Sequential deep scan verified through printed p.31. Existing canonical records cover the mechanically reusable material in this range, so no duplicate records were created."
  - "Sequential deep scan verified through printed p.31. Character-concept guidance is descriptive; the optional point-based design system on pp.13-15 and Edges/Flaws framework on pp.15-31 are already represented by option.character-creation.point-based-design, subsystem.character.edges-flaws, and rule.character.edges-flaws-balance, so they were reused rather than duplicated."
  - "Rules are treated as additive/optional unless the text explicitly replaces or supersedes SR3."

