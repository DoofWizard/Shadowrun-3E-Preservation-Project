notes:
  - "Weapon/equipment entities are separated from combat rules and modifiers so CC additions can extend existing SR3 records cleanly."
  - "Sequential deep scan completed through printed page 84, including firearm design frames/options, customization workflow/modifications, ammunition manufacture, and mine/mortar manufacture."
  - "Sequential deep scan completed through printed page 93, adding the optional Advanced Melee Combat package, combat options, martial-arts styles/maneuvers, and character-conversion procedure."
  - "Sequential deep scan completed through printed page 112, covering two-weapon combat, armor degradation/repair, camouflage and cover, fire/incendiaries, weapon holding, indirect fire, rate-of-fire clarification, missile combat, parachuting, strength-based recoil, searching/suppressive fire, grenade return, Small Unit Tactics, skill additions, and underwater activity/combat/magic."
  - "Reference appendix audited through printed page 126. Printed pp.113-114 range/linked-attribute tables were captured as canonical reference records; pp.115-126 equipment tables were treated as consolidated validation/reference for the entities and acquisition statistics already ingested from the body text rather than duplicated as new entities."
  - "Character/combat record sheets following printed p.126 are reference aids and add no new mechanics."
