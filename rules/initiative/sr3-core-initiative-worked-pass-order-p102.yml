  wound_examples:
  - character: Dave
    wound: Moderate
    wound_initiative_modifier: -2
    first_pass_initial_score: 22
    after_immediate_damage_score: 20
    second_pass_score: 10
    third_pass_score: 0
    third_pass_eligible: false
    source_explanation: Wound is applied in first pass after Dave acts; he loses his third pass because
      his score reaches zero.
  - character: Sharon
    wound: Moderate
    wound_initiative_modifier: -2
    first_pass_initial_score: 18
    injury_before_first_action: true
    score_after_damage: 16
    first_pass_position: After Rich (17) instead of before, because GM Goon 2 acts before Sharon and inflicts
      the wound.
  damage_rule:
    preexisting_wounds: Subtract applicable wound modifiers from the Initiative Score whenever Initiative
      is rolled.
    midturn_wounds: Apply wound modifier to current Initiative Score immediately on taking the wound;
      may change ordering or remove later passes.
    already_acted_pass: Taking damage after acting in a pass does not grant an additional action in that
      pass.
  initiative_ties_source_order:
  - Character with highest Initiative Score in the first Initiative Pass goes first
  - Highest adjusted Reaction
  - Highest unaugmented Reaction
  - Roll 1D6 repeatedly until no longer tied
