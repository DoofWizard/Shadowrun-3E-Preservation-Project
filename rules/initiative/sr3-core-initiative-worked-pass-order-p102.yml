  purpose: Original-published numeric worked example exercising initiative-pass ordering and changes due
    to wounds, for deterministic tabletop resolution and source-validated engine tests.
  initiative_pass_procedure:
    first_pass: Resolve characters in descending Initiative Score, each eligible character acting once.
    each_subsequent_pass: Subtract 10 from all remaining Initiative Scores; resolve only scores greater
      than 0 in descending order.
    termination: End the Combat Turn after no score remains greater than 0; reroll Initiative for the
      next Combat Turn.
    no_negative_score_action: A character with Initiative Score 0 or lower gets no action in that pass.
