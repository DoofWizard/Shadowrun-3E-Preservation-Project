data:
  publication:
    title: Shadowrun, Third Edition
    publisher: FASA Corporation
    edition: Third Edition
    catalog_number: FASA7001
    source_id: source.sr3-core
    nature: published fictional tabletop role-playing game rules
    source_pdf_sha256: 7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914
    printed_pages:
    - 246
    - 248
    physical_pdf_pages:
    - 255
    - 257
    intervening_pdf_page_256: printed p247 is illustration, not a mechanics page
  source_section: Beyond the Shadows / Karma Pools; re-rolling failures; avoiding
    an oops; Open Tests; buying additional dice; buying successes; extended actions;
    optional Hooper-Nelson Rule; optional Hand of God
  core_karma_pool:
    earned_karma_to_pool_conversion:
      human: 1 additional Karma Pool point per 10 total Karma earned
      nonhuman: 1 additional Karma Pool point per 20 total Karma earned
      cross_reference: Original core Karma progression discussed at printed p242,
        reiterated at p246; these are historical Third Edition character rules.
    refresh_timing: Unlike ordinary action dice pools, Karma Pool does not automatically
      refresh each Combat Turn. Gamemaster determines the refresh interval, often
      a narrative scene, session, about 24 game hours or another appropriate interval.
    burning: Permanently burned Karma Pool points are removed from the pool and do
      not refresh.
  reroll_failures:
    eligible_dice: Only dice that failed in the original test; any die that has become
      a success may not be re-rolled.
    first_reroll_pool_cost: 1
    second_reroll_additional_cost: 2
    third_reroll_additional_cost: 3
    cumulative_costs_first_second_third:
    - 1
    - 3
    - 6
    subsequent_retries: Each further reroll costs one more Karma Pool point than the
      previous reroll; cannot assume a fixed total if more retries occur.
  avoid_rule_of_one:
    pool_cost: 1
    condition: All dice in a test show 1 (an oops, Rule of One).
    effect: Reduces the disastrous consequence to an ordinary failed test.
    restriction: Does not allow rerolling the oops dice; no additional Karma Pool
      points may be spent to reroll those failed dice.
  open_tests:
    effect: Spend Karma Pool to reroll Open Test dice.
    cost_sequence_per_rerolled_die:
    - 1
    - 2
    - 3
    cumulative_costs_first_second_third:
    - 1
    - 3
    - 6
    repeat: Each further rerolled die costs the next increment.
  buy_additional_dice:
    base_cost_of_first_die: 1
    additional_cost_of_second_die: 2
    additional_cost_of_third_die: 3
    cumulative_costs_first_second_third:
    - 1
    - 3
    - 6
    maximum_dice_bought: At most the applicable skill or Attribute Rating currently
      being used, excluding dice drawn from other pools.
    resolution: Purchased dice roll normally; these expenditures are not described
      as permanent burn.
  buy_successes:
    pool_points_burned_per_added_success: 1
    prerequisite: The test already achieved at least one natural success before purchased
      successes are added.
    permanent: These points are permanently burned from the pool and do not refresh.
  extended_actions:
    allocation: Assign Karma Pool points to the Skill Test when a long-duration extended
      action first begins, even when the Skill Test takes place only at the end.
    refresh_exception: Allocated Karma Pool does not refresh until that extended action
      finishes.
    scope: Applies to long activities such as fictional Matrix utility creation, spell
      research and enchanting.
  optional_hooper_nelson_rule:
    gamemaster_choice: Entirely optional rule; not a universal default.
    effect: Burn one Karma Pool die permanently to reduce target number by 1.
    recommended_minimum_starting_target_number: 12
    target_number_floor: 8
    source_distinction: Book recommends not using this optional technique unless the
      target number is 12 or higher; floor is 8 if enabled.
  optional_hand_of_god:
    gamemaster_option: Optional one-time dramatic survival rule for a character facing
      otherwise certain death.
    requirement_minimum_unspent_karma_pool_points: 1
    cost: Spend the entire current stock of both Good Karma and Karma Pool at once.
    frequency: One use per character, ever.
    after_effect: No Karma remains until new Karma is earned.
    meaning: An in-game GM adjudication option, not a real-world claim.
  related_canonical_coverage:
    karma_award_guidance: rules/advancement/sr3-core-karma-award-numeric-guidance-p244.yml
    training: options/training/sr3-core-simple-training-gate-p245-246.yml
    no_claim: Does not assert full Beyond the Shadows chapter or entire FASA7001 book
      is normalized.
