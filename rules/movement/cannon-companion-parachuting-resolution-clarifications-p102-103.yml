content_class: [rule_exact]
headline: Parachuting resolution clarifications
framing: reference_exact
data:
  publication: {title: Cannon Companion, publisher: FASA Corporation, catalog_number: FASA7908}
  extends: procedure.movement.parachuting
  tabletop_rules:
    applicability: mechanical descent control; magical descent is excluded; uncontrolled falls use SRComp p47
    low_altitude_jump_initial_height: less than 500 meters
    halo_signature_reference: Cannon Companion p104, Signature of Biological Forms
    primary_test_count: one
    minimum_target_number: 2
    surplus_success_allocation: player chooses accuracy or landing damage resistance
    failed_reserve_test: survival may require GM invocation of Hand of God (SR3 p248)
    table_example_discrepancy:
      printed_rule: below minimum opening altitude modifier +1 per 250 meters
      printed_example: standard jump reserve attempt at 360 meters, base TN 6, additional modifier +2, final TN 8
      interpretation: preserve printed example separately; no generalized rounding correction inferred
