      "Flux ratings of active transmitters",
      "Electronic Warfare"
    ],
    "outputs": [
      "Footprint rating",
      "modified Signature"
    ],
    "steps": [
      "Footprint = sum Flux of all active transmitters (radios, RC decks, sensors, ECM, etc.) ÷10, rounded to nearest whole number.",
      "Subtract Footprint from target number of tests against vehicle/device Signature.",
      "Reduce Footprint: Complex Action, Electronics (Electronic Warfare) vs TN Footprint+4; Task Pool may add up to skill. Each success reduces total Flux by 1; attempts are cumulative but each attempt after first gets +2 TN.",
      "All-1s result doubles vehicle total Flux and recalculates Footprint."
    ]
