resolution:
  summary: "Rigger 3 adds passive and active sonar rules. Passive sonar depends on target-generated sound and Sonar Signature; active sonar emits a ping and uses the detecting vessel's Sonar rating against the target's Sonar Signature."
  inputs:
    - "Sonar rating"
    - "target Sonar Signature"
    - "mode"
    - "range/modifiers"
  outputs:
    - "contact quality and identification detail"
