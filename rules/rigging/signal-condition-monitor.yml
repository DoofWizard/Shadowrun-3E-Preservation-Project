  "resolution": {
    "summary": "Each remote-network channel tracks MIJI degradation on a 10-box Signal Monitor. Degradation levels impose escalating TN penalties and can sever the channel.",
    "inputs": [
      "net MIJI successes",
      "channel"
    ],
    "outputs": [
      "degradation level",
      "TN modifiers",
      "channel status"
    ],
    "steps": [
      "Each net MIJI success fills 1 Signal Monitor box on the targeted channel.",
      "Light degradation applies +1 TN; Moderate +2; Serious +3 to actions governed by that channel.",
      "When all 10 boxes fill, the channel is disengaged/lost and its carrier signal is severed."
    ]
  },
