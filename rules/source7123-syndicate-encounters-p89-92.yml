id: rules.source7123.syndicate-encounters
record_type: rule_reference
status: ingested
source: source.fasa-7123
printed_pages: "89-92"
pdf_pages: "91-94"
content_class:
  - rule_exact
  - campaign_guidance
framing: newsroom_neutral

mafia:
  npc_ratings:
    - "Typical street-level made men should be Equal to the player characters in ability (Shadowrun Companion p.84)."
    - "The gamemaster may occasionally include a Superior NPC."
  contacts:
    - "Use Contact Behavior, Shadowrun Companion pp.60-66, including Wrong Party modifiers."
  enemies:
    - "Jobs involving family business may create Enemies under Shadowrun Companion pp.71-75."

yakuza:
  npc_ratings:
    - "At any meeting with the player characters, include one Superior character for every two player characters; the rest of the group is Equal."
    - "Inferior-rated Yakuza rarely appear in situations that might turn dangerous."
    - "In any confrontation with the Yakuza, at least one Superior NPC is a physical adept and one is a mage of some sort."
    - "If only one Yakuza operative is Superior, that operative is a physical adept."
    - "If player characters become deeply involved enough to face an oyabun's personal security or honor guard, all such opponents are physical adepts; the highest-ranked guards are Superhuman, the majority Superior, and the rest Equal."
  cyberware_grade:
    - "Cybered Yakuza always start with alpha-level cyberware, but most have betaware."
    - "Deltaware is given only to special agents."
  contacts:
    - "Use Contact Behavior, Shadowrun Companion pp.60-66, including Wrong Party modifiers."

triads:
  npc_ratings:
    - "Initial contact through Triad-affiliated gangs is usually Inferior or Equal to the player characters."
    - "If the Triad sends its own troops, the player characters may meet someone who might be Superior."
    - "In any open conflict with the Triads, a physical magician will be among their opponents."
    - "For every two player characters, the opposing Triad group also includes a mage or shaman as well as a physical adept; each is Equal or Superior to the player characters."
    - "Superhuman-rated physical adepts and physical magicians tend to join a battle only if they must and should therefore be rare."
  contacts:
    - "Use Contact Behavior, Shadowrun Companion pp.60-66, including Wrong Party modifiers."
  enemies:
    - "Triad Enemies use the Enemies guidance in Shadowrun Companion pp.71-75."

seoulpa_rings:
  npc_ratings:
    - "Ring-affiliated gangs use the gang rules in Shadowrun Companion pp.121-125."
    - "A player-character group may encounter an Inferior gang in one situation and a Superior gang in another."
  contacts:
    - "Use the Contact Knowledge Table, Shadowrun Companion p.69, to determine how much a gang/street contact knows."

sources:
  - {source: source.fasa-7123, printed_pages: "89-92", pdf_pages: "91-94", relation: rule_reference}
