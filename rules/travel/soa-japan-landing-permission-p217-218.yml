data:
  publication: {title: Shadows of Asia, publisher: FanPro, edition: SR3, catalog: FanPro25007}
  entry:
    visa: Normally obtained before entry at an embassy, consulate or corporate office.
    exception: International shipping and flight crew with travel credentials have city access.
    landing_permission: Required for free movement in cities in addition to a visa; issued by immigration.
    medium: State-certified identity stick.
    stored_fields: [residence status, entry port, arrival date]
    residence_status_effect: Determines allowable activities and stay duration.
  passes:
    sightseeing: {duration_days: 15, scope: nationwide, renewable: true, prevalence: most common}
    departure: {duration_days: 3, scope: Between one port and a neighboring port in the same or adjacent prefecture.}
    shore: {duration_hours: 72, eligibility: Transit passengers, scope: Vicinity of originating port.}
    corporate_dispensation: {duration: no stated limit, scope: nationwide, status: treated as a citizen of issuing corporation, relative_forgery_cost: highest}
