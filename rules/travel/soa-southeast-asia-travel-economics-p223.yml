headline: 'Fictional Shadowrun tabletop RPG: Shadows of Asia (FanPro, FanPro25007, SR3), printed/PDF p223 — Southeast Asian travel and ID rules'
framing: reference_exact
data:
  publication: {title: Shadows of Asia, publisher: FanPro, edition: SR3, catalog: FanPro25007}
  visas:
    normal_requirement: Most regional countries with constitutional governments.
    issue_locations: [embassy or consulate abroad, immigration on arrival]
    tourist: {duration_months: 3, average_cost_nuyen: 40}
    work: {duration_years: 1, cost_nuyen: 100, requires: corporate or government sponsorship}
    no_foreign_representation: [Dayak Council, Kashin state, Yunnan]
    pattani_embassies: [Bangkok, Kuala Lumpur]
    vietnam_and_laos: Processing can be lengthy; expedited fees are mentioned without a numerical amount.
    philippines: Issued through Japanese embassies.
    new_guinea: IDs governed by Australian government in the setting.
  game_economics:
    restrictions: International or lower standards for cyberware, weapons and magic.
    customs_bribe_rule_of_thumb_percent_of_item_value: 5
    fake_id_cost_multiplier: 0.5
    fake_id_cost_reference: Shadowrun Third Edition p239
  identity_and_payment:
    credstick_readers: Tourist zones and Japanese enclaves in the Philippines; usually payment only except Kuala Lumpur, Manila and Singapore.
    other_payment: Paper notes and coins.
    regional_sin_equivalents: [Javanese Republic, Malaysia, Thailand, Vietnam]
    typical_local_id: Basic identity smartcard, otherwise paper documents; high-tech centers may exceed international standards.
    foreign_acceptance: Rare outside Southeast Asia, restricting international travel for regional natives.
    filipino_identification: Limited issuance of ID and travel documents by Imperial prefecture.
    external_id_upgrade: Through megacorporation or foreign embassy, with corporate sponsorship and justification required for embassy processing.
    extraterritorial_employees: In most regional nations, citizens employed by extraterritorial corporations receive standard corporate SIN and ID automatically.
