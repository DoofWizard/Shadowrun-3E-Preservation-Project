headline: FanPro25002 SR3 p234 (PDF235) — Tir na nOg fictional visitor visa rules
summary: The game specifies visitor visa costs, duration and documentation for its fictional nation.
data:
  section: Tir na nOg / Getting In-Out
  visitor_visa:
    cost: {amount: 50, currency_printed: "£", interval: week of stay}
    maximum_validity_days: 28
    qualification: Visitor visas are described as the easiest visa type to obtain.
  legal_entry_documentation:
    - valid current passport
    - visa from the Tir Office of Placements
    - evidence of purpose of visit obtained from a Tir embassy or consulate in the country of origin
    - complete medical history and medical insurance receipts
    - Legal Insurance Fund payment receipts
    - permits for controlled or illegal items such as cyberware or weapons
  travel_qualification: Air travel is the most popular legal route; Aer Lingus is the sole operating airline with some exclusive partner arrangements.
  magical_boundary_reference: The Veil, same source p236; existing record rule.soe.tir-veil-p236.
  scope_limit: These are fictional game-world requirements, not present-day travel advice; the printed price uses the pound sign, and no exchange or partial-week rounding rule is given.
