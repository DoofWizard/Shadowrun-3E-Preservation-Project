id: rules.source7123.alternate-underworld-campaigns
record_type: character_option
status: ingested
source: source.fasa-7123
printed_pages: "97-101"
pdf_pages: "99-103"
content_class:
  - character_option
  - rule_exact
  - campaign_guidance
framing: newsroom_neutral

mafia_campaign:
  character_creation:
    - "Mafia made men have no special character-creation requirements."
    - "The gamemaster may insist that characters possess dermal sheathing (Cybertechnology p.28) to cover any cyberware."
    - "Do not use the More Metahumans option when creating a group of made men."
    - "The gamemaster may require the group to share the same ethnic background or the same Mafia family."
    - "The gamemaster may assign the Day Job Flaw because made men have jobs; players may balance this Flaw with an Edge if desired."
  karma_and_departure:
    - "The campaign works best with the amoral-campaign and favors-and-markers concepts (Shadowrun Companion pp.78-79)."
    - "The gamemaster may award Karma according to whether characters follow orders and the Mafia's own definition of honorable behavior."
    - "A character or group leaving the Family automatically receives the Hunted Flaw with no corresponding Edge (Shadowrun Companion p.33)."

yakuza_campaign:
  character_creation:
    - "Most starting Yakuza characters are unlikely to have tattoos; tattoos, like Karma, honor and respect, must be earned."
    - "Do not use the More Metahumans option for West Coast Yakuza groups."
    - "For East Coast Yakuza groups in the UCAS and CAS, metahuman members are more likely; most East Coast metahuman Yakuza receive the Human-Looking Edge at no cost (Shadowrun Companion p.32)."
  karma_and_departure:
    - "The campaign works best with the amoral-campaign and favors-and-markers concepts (Shadowrun Companion pp.78-79)."
    - "The gamemaster may decide Karma works best if characters follow orders and act honorably according to Yakuza traditions."
    - "A character or group attempting to leave automatically receives the Hunted Flaw with no corresponding Edge (Shadowrun Companion p.33)."

triad_campaign:
  character_creation:
    - "Triad starting characters begin as Sze Kau, or 49s, for the Triad they choose to belong to."
    - "The gamemaster may allow the player characters to be their own gang."
    - "Before initiation into the Triad's ranks, the gamemaster may decide the player characters know only the 432-ranked operative of their Triad; after initiation they meet the person next in rank above the 432."
    - "At least half of the player characters in a Triad group must be magically active."
    - "Mundane Triad characters with cyberware tend to invest heavily in dermal sheathing (Cybertechnology p.28) to cover it."
  karma_and_departure:
    - "The campaign works best with the amoral-campaign and favors-and-markers concepts (Shadowrun Companion pp.78-79)."
    - "The gamemaster may decide Karma works best when player characters follow Triad orders."
    - "A character or group trying to leave automatically receives the Hunted Flaw with no corresponding Edge (Shadowrun Companion p.33)."

seoulpa_campaign:
  character_creation:
    - "Use the gang-creation rules on Shadowrun Companion pp.121-124."
    - "The main difference from a typical gang is that the gang leader also represents the gang in its relationship with the Seoulpa Rings."
  karma:
    - "Karma should be awarded according to the rules on Shadowrun Companion p.123."

law_enforcement_campaign:
  reference:
    - "Rules for playing law-enforcement characters are referenced at Shadowrun Companion pp.117-119."
    - "The criminal-organization rating system on Underworld Sourcebook p.94 may also be used as a campaign tool for law-enforcement or corporate-security games."

sources:
