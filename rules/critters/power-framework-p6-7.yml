data:
  publication: {title: Critters, publisher: FASA Corporation, catalog_number: FASA7002, edition: Shadowrun Third Edition}
  supplements: catalog.critters.powers
  gm_discretion: Individual critter powers can vary; summoned elementals and nature spirits should have consistent effects.
  state_pairs:
    purely_astral_and_purely_physical: neither can affect the other by powers
    astral_and_dual: mana powers only
    physical_and_dual: mana or physical powers
    physical_power_requires: physical presence of user and target
    mana_power_astral_requirement: user can perceive the astral plane
  action:
    automatic: continuously active without attention or effort
    exclusive: cannot use while using or sustaining another power; stop sustaining the other effect first
  range:
    printed_general_classes: [LOS, Touch, Self]
    targeting: follows spell targeting rules
    target_count_per_action: 1
    target_count_exception: individual power descriptions may override
    nature_spirits: effects limited to their domain
  duration:
    instant: effect begins and ends in the same action; consequences may persist
    sustained: no effort or cost, no target number penalty, no disruption from damage, no continuing LOS requirement; nature spirit effects cease when targets leave its domain
    simultaneous_sustained_maximum: Essence
    permanent: sustain for specified time before effect becomes permanent
    special: duration determined by other factors in the power description
    always: continuously active automatic power, generally Self range
  relationship: Preserves existing duration categories and sustaining limit; adds missing targeting, action and duration conditions without replacing individual power definitions.
framing: reference_exact
headline: 'Critters (FASA7002), pp6-7: power framework'
summary: 'Fictional tabletop rules: targeting, exclusive and automatic actions, duration and sustaining exceptions.'
