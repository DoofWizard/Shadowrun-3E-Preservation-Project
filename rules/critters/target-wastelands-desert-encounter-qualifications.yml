headline: FanPro10653 Target Wastelands SR3 fictional desert creature encounter qualifications, printed pp119-120 / PDF pp120-121
data:
  source_title: "Target: Wastelands"
  publisher: FanPro
  extends: catalog.critters.target-wastelands-desert
  encounter_qualifications:
    black_wasp: Awakened black wasps also hunt animals other than their usual trapdoor spider prey, paralyzing hosts for larval infestation.
    dancing_white_lady: Ambushes from sand burrows with trapdoors; rolls away when threatened. Nearby individuals sometimes target larger prey together.
    sand_chameleon: Larger individuals sometimes target larger animals, including metahumans.
    sandworm: Tunnels through sand dunes; attracted by vibrations from pedestrians or vehicles and may attack from beneath the sand. Reports of specimens dozens of meters long are unconfirmed.
  scope_note: These source-described encounter behaviors do not specify new tests, modifiers, or changes to the published creature statistics.
