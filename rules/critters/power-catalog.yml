id: catalog.critters.powers
record_type: reference
name: "Critters Power Catalog"
domain: critters
status: ingested
source: source.critters
pages: "6-14"

framework:
  same_state_requirement: "Power user and target must share an astral/physical state; mana powers can cross to astral targets only when the user can perceive/interact astrally, while physical powers require physical presence."
  action_classes: [complex, simple, free, automatic, exclusive]
  range_classes: [LOS, touch, self, special]
  duration_classes: [instant, sustained, permanent, special, always]
  sustained_limit: "A critter may simultaneously sustain a number of powers equal to Essence."
  sustained_behavior: "Innate sustained powers impose no sustaining target-number penalty, are not disrupted by damage, and normally do not require continued line of sight; nature-spirit domain limits still apply."

