  scorpyrine:
    combined_attack: One claw and stinger attack against a single target per Complex Action; resolve claw first. On claw success, hold target and sting at TN -2.
    escape: Quickness (4) Test; failure gives subsequent attacks TN -2 and Power +2 until freed.
    venom: GM may increase lethality according to toxic substances.
  sea_leech:
    after_release: One Stun box per Combat Turn until successful Biotech (10), Heal or Treat.
    death_while_attached: Remains attached and blood-loss damage continues until removal and wound closure.
    assisted_removal: Opposed Strength Test against leech; success frees target, causes two Stun boxes and requires Damage Resistance Test against leech Strength without armor.
  sea_serpent_freshwater:
    attributes: {body: '12/1', quickness: 4x3, strength: 7, charisma: null, intelligence: '1/3', willpower: 3, essence: 6, reaction: 3}
    initiative: 3 + 1D6
    attacks: 5S with +1 Reach
    shared_power: Enhanced Physical Attributes (Quickness twice per day for Essence D6 turns)
  shapeshifter:
    eagle_sky_spirit_tests_bonus_dice: 1
    warek_weaknesses: [Allergy (Gold Severe), Vulnerability (Gold)]
    animal_form_attributes: {body: A+2, quickness: '(A+1)x(A+1)', strength: A+2, charisma: null, intelligence: '3/4', willpower: 3, essence: 6, reaction: 6}
    animal_form_initiative: A + 2D6
    animal_form_attacks: (A + 1)(A)
    animal_form_reference: A denotes normal animal attributes on p19, with printed modifiers; some types have individual special abilities.
    magical_skills: Some have Magical Skills; particularly common in eagle, fox and seal forms, uncommon in bear, tiger and wolf forms as described.
  shasta_deer:
    omitted_power_options: [Movement (Self Running only), Silence]
