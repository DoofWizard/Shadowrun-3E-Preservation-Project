      - ['Dog, Small', '1', '4(x4)', '1', '-', '2/4', '2', '6', '4', '4+1D6', '3L,-1 Reach']
      - [Elephant, '15/3', '3(x4)', '40', '-', '3/3', '3', '6', '3', '3+1D6', '10D,+1 Reach']
