edition_scope: SR3
content_class: [rule_exact]
data:
  publication: {title: Critters, publisher: FASA Corporation, catalog_number: FASA7002, edition: Shadowrun Third Edition}
  individual_variation:
    typical_size_and_weight: adult specimen
    possible_larger_percent: '10-30'
    possible_smaller_percent_source_notation: '60-75 percent for gender-size differences'
    physical_and_mental_attributes_max_above_average_percent: 50
    minimum_attribute_fraction_of_average: 0.5
    minimum_exception: sick or injured specimen
    invariant_fields: [Essence, Reach, Attack Type, Movement Multiplier, Damage Modifiers]
    powers_may_vary: true
    random_size_roll: 2D6
    size_table:
      columns: [roll, size_change_percent, physical_attribute_adjustment]
      rows:
        - ['2', -50, null]
        - ['3-4', -20, null]
        - ['5-7', 0, null]
        - ['8-9', 10, '+1 to random Physical Attribute']
        - ['10-11', 20, '+2 to random Physical Attribute; apply to one or two Attributes']
        - ['12', 50, '+5 to random Physical Attribute; apply to one or more Attributes']
    null_adjustment: none specified by table
  statistics_key:
    B: Body rating; second value when present is both ballistic and impact armor.
    Q: Quickness rating; second value is running multiplier; alternate movement multiplier is listed in Notes.
    S: Strength
    C: Charisma applies only to intelligent creatures capable of social interaction.
    I: First rating for Intelligence Tests and spell resistance; second rating for Perception Tests.
    W: Willpower
    E: Essence; A indicates a spirit primarily in astral space; Z indicates a dual being; variable Essence is a rating range.
    R: Reaction for physical attacks.
    INIT: Reaction plus Initiative dice; printed p19 also states Initiative limits Combat Pool dice used in one Combat Phase.
    Attacks: Damage Code is physical unless specified otherwise; Humanoid entries can use weapons and ordinary character combat rules, with unarmed damage (STR)M Stun; listed Reach adjustments apply.
  normal_critters_table:
    columns: [name, B, Q, S, C, I, W, E, R, INIT, Attacks]
    rows:
      - [Bat, '1', '5(x4)', '0', '-', '1/5', '1', '6', '6', '6+1D6', '2L']
      - [Bear, '9/1', '4(x3)', '9', '-', '2/4', '2', '6', '5', '5+1D6', '6S,+1 Reach']
