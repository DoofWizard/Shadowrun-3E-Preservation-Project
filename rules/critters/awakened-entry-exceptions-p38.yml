data:
  publication: {title: Critters, publisher: FASA Corporation, catalog_number: FASA7002, edition: Shadowrun Third Edition}
  supplements: catalog.critters.l-z
  nimues_salamander:
    attributes: {body: 1, quickness: 3x2, strength: 0, charisma: null, intelligence: '1/2', willpower: 2, essence: 6Z, reaction: 2}
    initiative: 2 + 1D6
    magical_drain:
      range_meters: Essence x 2
      test: Opposed Test of creature Essence against caster Magic Rating.
      result: If creature wins, reduce spell Force by net successes; caster resists Drain at original full Force.
      duration: 1D6 hours
      eligible_powers: [Enhanced Physical Attributes (any), Magical Guard (Self Only), Movement (Self Only)]
      cap: After all three have been increased, further spell draining grants no additional increases.
  nomad:
    possession: At melee range, oppose nomad Essence against target Willpower; each net nomad success fills one Mental Condition Monitor box. Full monitor means possession instead of unconsciousness.
    recurrence: Every 2D6 hours repeat the opposed test. On a nomad win the host enters its compulsive attack state; Essence Drain applies to creatures killed by the host.
    division: At Essence 18, divides into two nomads with Essence 9 each.
    blocked_compulsion_duration: 2D6 minutes if host is prevented from killing, then apparent normality returns.
    spellcasting_modifier: +1 to all target numbers while in this state; spellcasting remains possible.
    force: Equals Essence, minimum 9, no maximum; GM may roll any number of dice, recommended 2D6.
    astral_initiative: F + 20 + 1D6
  nosferatu:
    omitted_powers: [Essence Drain (Permanent and Temporary), Fear, Immunity (Age and Pathogens and Poisons), Infection, Influence, Magical Skills, Regeneration]
    attribute_inheritance: Retains most character Attributes, with listed ratings as minima; minimum Essence 7.
framing: reference_exact
headline: 'FASA7002 Critters: pp37-38 omitted magical creature mechanics'
summary: Original fictional Shadowrun Third Edition tabletop rules for Nimue's Salamander, Nomad and Nosferatu from Critters, FASA Corporation, FASA7002, printed and PDF pp37-38.
