data:
  publication: {title: Critters, publisher: FASA Corporation, catalog_number: FASA7002, edition: Shadowrun Third Edition}
  corrects_source_profiles_in: catalog.critters.powers
  entries:
    noxious_breath:
      profile: {type: physical, action: Complex, range: Touch, duration: Instant}
      resistance: greater of Willpower or Body against (Essence)S Stun; armor and dermal plating ineffective; respirator reduces Power by 2 and stages down one level
    paralyzing_touch_howl:
      profile: {type: physical, action: Complex, range: 'Touch or LOS', duration: Special}
      touch: any touch including zero-damage unarmed attack reduces Quickness by creature Essence for 2D6 minutes; reductions accumulate; zero Quickness prevents movement
      negative_quickness: Willpower Test every minute against creature Essence to maintain breathing; failed test stops breathing and death in 1D6 minutes unless effect ends first or first aid applied
      howl: affects targets able to hear; opposed Essence versus Willpower; 1 net success activates effect; attacking into or out of Silence spell field reduces Power by spell Force
    pestilence:
      profile: {type: physical, action: Auto, range: Touch, duration: Instant}
      trigger: contact, wounds or bodily-fluid exchange; Body Test against creature Essence + 2, GM may adjust for situation and infectiousness
      outcomes: failure infects; 1 or 2 successes may still cause illness or unusual effects; default VITAS-3 (SR3 p251) unless individual entry specifies otherwise
    petrifying_gaze:
      profile: {type: physical, action: Complex, range: LOS, duration: Sustained}
      test: eye contact triggers opposed Intelligence versus Essence; greater creature successes petrify; can sustain up to Essence victims
      recovery: victim may attempt only another opposed test each turn to break effect; creature death restores victims; magician may dispel as Petrify spell (SR3 p184) at Force equal to creature Essence
      damage: petrified Barrier Rating equals Body; injuries take effect immediately upon reversion; chips and breaks become Light or Moderate wounds, severe cracking or shattering causes major Physical injury or missing limbs
    possession:
      profile: {type: mana, action: Complex, range: Special, duration: Special}
      eligibility: defeated astral opponent with physical body, or willing host regardless of astral travel ability; spirit chooses when to depart unless banished (SR3 p189)
      attributes: host retains knowledge and skills and gains spirit skills; add spirit Force to all Physical Attributes; replace Mental Attributes with spirit values; unwilling host adds 2 to all test TNs
      termination: Deadly Physical damage to host expels unharmed spirit to astral form; banishing disrupts spirit rather than killing it; mana spells affect spirit, physical spells affect host body only
      departure: host resists (Force)D Stun using Willpower
    psychokinesis:
      profile: {type: physical, action: Complex, range: LOS, duration: Sustained}
      effect: Strength and Quickness equal Essence; analogous to Magic Fingers (SR3 p197)
    regeneration:
      profile: {type: physical, action: Auto, range: Self, duration: Always}
      trigger: check spine or brain injury when single or cumulative damage reaches Deadly; roll 1D6; dies on 1, or 1-2 for massive tissue damage; otherwise normal penalties for current Combat Turn, damage disappears at start of next
      weapon_foci: Deadly or cumulative Deadly reached with focus damage requires Essence Test against twice focus Force; zero successes kills, at least one permits Regeneration Test
