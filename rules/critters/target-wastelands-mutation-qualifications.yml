headline: Fictional mutant critter option and drawback qualifications
data:
  source_title: "Target: Wastelands"
  publisher: FanPro
  extends: rule.critters.target-wastelands-mutation
  options:
    paranormal_ability_maximum: 1
    paranormal_ability_mutation_index_cost: 3
    paranormal_ability_essence: Resolve this added ability with normal Essence, irrespective of current Mutation Index.
    enhanced_senses: Options are those under Enhanced Senses in SR3 p263.
  drawbacks:
    selection: Gamemaster guideline, not a mandatory minimum; aim for one drawback per two Mutation Index points.
    physical_flaws: Appropriate Physical Flaws from Shadowrun Companion p19 may be chosen.
    immunity_and_healing: Apply the reduced immunity and longer healing times associated with Bio Index in Man and Machine p77.
  paranormal_mutants:
    loss_of_essence_based_powers: At Mutation Index equal to Essence, none of the Essence-based paranormal powers may be used.
    maximum_index: Essence; a higher index is not an allowed ordinary mutant configuration.
    astral_beings: Purely astral beings cannot mutate, but may become toxic.
  source_example:
    species: lynx
    mutation_index_progression: [1.2, 2.2, 3.85, 4.25, 5.25]
    final_strength: 6
    qualification: Example configuration, not a universal species profile.
