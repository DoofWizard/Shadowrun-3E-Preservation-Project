id: rule.critters.target-wastelands-mutation-qualifications
record_type: rule
status: ingested
source: source.fanpro-10653
printed_pages: "113-114"
pdf_pages: "114-115"
edition_scope: SR3
content_class: [rule_procedure]
framing: reference_exact
headline: Fictional mutant critter options and example, FanPro10653 SR3 printed 113-114 PDF 114-115
data:
  source_title: "Target: Wastelands"
  publisher: FanPro
  extends: rule.critters.target-wastelands-mutation
  options:
    paranormal_ability_maximum: 1
    paranormal_ability_mutation_index_cost: 3
    paranormal_ability_essence: Resolve this added ability with normal Essence, irrespective of current Mutation Index.
    enhanced_senses: Options are those under Enhanced Senses in SR3 p263.
    common_bioware_abilities: [adrenal pump, chemical gland, digestive expansion, metabolic arrester, muscle augmentation, pain editor, pathogenic defense, trauma damper]
  drawbacks:
    selection: Gamemaster guideline, not a mandatory minimum; aim for at least one drawback per two Mutation Index points.
    physical_flaws: Appropriate Physical Flaws from Shadowrun Companion p19 may be chosen.
    immunity_and_healing: Apply the reduced immunity and longer healing times associated with Bio Index in Man and Machine p77.
    weakness_example: Dietary Requirement (Critters p14).
  paranormal_mutants:
    loss_of_essence_based_powers: At Mutation Index equal to Essence, none of the Essence-based paranormal powers may be used.
    maximum_index: Essence; a higher index is not an allowed ordinary mutant configuration.
    power_effect_roll: 1D6
    astral_beings: Purely astral beings cannot mutate, but may become toxic.
  source_example:
    species: lynx
    mutation_index_progression: [1.2, 2.2, 3.85, 4.25, 5.25]
    steps:
      - {ability: muscle augmentation, levels: 4, mutation_index_increment: 1.2}
      - {ability: Body, points: 1, mutation_index_increment: 1}
      - {abilities: [adrenal pump level 1, trauma damper], combined_mutation_index_increment: 1.65}
      - {ability: synaptic accelerator, levels: 1, mutation_index_total: 4.25}
      - {ability: Body, points: 1, mutation_index_increment: 1}
    final_strength: 6
    qualification: Example configuration, not a universal species profile.
