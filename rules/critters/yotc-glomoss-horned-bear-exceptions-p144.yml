  glomoss:
    cannot_actively_affect_astral_targets: true
    glow_duration: several minutes after sensing magical activity
    astral_trigger_scope: [foci, spells, spirits, astrally perceiving magicians, astrally projecting magicians]
    trigger_scope_note: Any magical activity on the astral plane can trigger the glow; the listed cases are examples.
    duration_precision: No exact minute count is specified.
  horned_bear:
    single_opponent_challenge: If one opponent accepts the ritual challenge, the bear fights in melee with claws sheathed, inflicting Stun damage only.
    withdrawal: If the bear receives any wound, it withdraws and leaves the intruders alone.
    victory: The bear expects its opponents to leave its territory immediately or once they regain consciousness.
    scope: These are the ritual challenge conditions; the already recorded violation exception remains applicable.
