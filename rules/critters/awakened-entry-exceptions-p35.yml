  lesser_thunderbird:
    reaction_printed: 46
    interpretation: Retain the unusual printed Reaction 46 separately from Initiative 6 + 1D6; no inferred correction.
    lightning_bolt_secondary_effect:
      test: Gamemaster rolls 2D6 against Object Resistance Rating minus 1 for objects in the spell area.
      light_damage_exception: No electronic equipment affected when spell damage code is Light.
      threshold: The subsequent sentence says the roll must exceed Object Resistance Rating; preserve both formulations without resolving the discrepancy.
      result: Affected electronic equipment permanently loses one rating level; rating 1 equipment is destroyed.
      cyberdeck: A connected decker is dumped and the deck loses one MPCP Rating; gamemaster selects affected program.
      cyberware: Make one roll per character with cyberware; if successful, randomly select affected piece.
    death_effect: 6L damage within 3 meters.
  loup_garou:
    peak_cycle: Four to six days out of every 28; parenthetical statistics apply during this period.
  man_of_the_woods:
    domain_limit: May leave its domain but cannot use its powers outside its territory.
