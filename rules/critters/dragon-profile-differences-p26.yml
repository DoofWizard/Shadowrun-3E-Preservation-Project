    - Common powers, individually observed powers and line-of-sight telepathy
  shapechanging_qualification: Some great dragons can take human or metahuman form; the source does not establish that all dragons or all great dragons can do so.
  supersession: The Awakened Critters chapter states that its creature statistics and powers supersede previously published information. Retain both source-specific readings; do not edit FASA7001.
