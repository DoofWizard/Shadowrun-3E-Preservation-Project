  supplements: subsystem.critters.weaknesses-mutation-toxicity
  allergy:
    general_trigger: The fictional critter normally experiences the reaction only
      while exposed to the substance or condition.
    examples:
    - sunlight
    - ferrous metals
    - objects of religious significance
    - plastics
    - pollutants
    religious_object_qualification: Such allergies appear psychosomatic in the source.
    moderate_additional_condition: Contact is painful; the creature often withdraws;
      prolonged contact causes an allergic reaction.
    severe_threshold: Even the slightest contact triggers the reaction and Physical
      damage.
  essence_loss:
    eligibility: Only humans and metahumans affected by HMHVV may have this weakness.
    initial_essence: Essence possessed before transformation.
    innate_essence: none
    ordinary_monthly_loss: 1
    rate_exception: Some lose Essence faster; few lose it more slowly.
    zero_essence: Death follows within days or possibly hours; during that interval
      the creature behaves as a starving predator seeking fresh Essence.
  vulnerability:
    ordinary_recovery: Recover from injury caused by the vulnerable substance at the
      ordinary rate.
    regeneration_exception: Injury penalties from the vulnerable substance last only
      until the start of the next Combat Turn; damage then heals under Regeneration
      (p13).
    example: A wooden weapon with Damage Code 2L becomes 2M against a creature vulnerable
      to wood.
