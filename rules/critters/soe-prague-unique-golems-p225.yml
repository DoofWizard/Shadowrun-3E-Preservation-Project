    B: '12/4'
    Q: '2 x 2'
    S: 'F + 8'
    C: F
    I: F
    W: F
    E: FZ
    R: F
  initiative: 'F + 1D6'
  attack: {damage_code: '(STR + 6)S', reach_modifier: 1}
  pools: {Combat: '(F + 1) / 2'}
  powers: [Fear, Guard, Hardened Armor, Magical Guard, Search]
  notation: FZ is preserved as printed; no extra interpretation or pool rounding instruction is supplied by this stat block.
  source_uncertainty: The identity or nature of the spirits in these unusual golems is speculative in the source.
