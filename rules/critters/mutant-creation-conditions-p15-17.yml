data:
  publication:
    title: Critters
    publisher: FASA Corporation
    catalog_number: FASA7002
    edition: Shadowrun Third Edition
  supplements: subsystem.critters.weaknesses-mutation-toxicity
  characteristic_selection: The gamemaster selects which of the listed characteristics
    apply to a mutant.
  size:
    typical_larger_percent_source_wording: 50 to 200 percent larger
    more_than_twice_normal_size: unusual, although larger examples are possible
    smaller_than_normal: possible but uncommon
    interpretation: Preserve both printed expressions; do not silently convert the
      first into a multiplier or reconcile the apparent wording tension.
  physical_characteristic_options:
  - bone deposits or misalignment
  - mange
  - albinism
  - missing armor or exoskeletal plating
  - extra appendages, usually useless
  - missing appendage
  enhanced_examples:
  - Strength
  - Body
  - low-light vision
  - thermographic vision
  paranormal_examples:
  - Astral Perception
  - Corrosive Saliva
  - Corrosive Secretions
  - Fear
  - Pestilence
  - Venom
  mutant_paranormal:
    same_creation_guidelines_as_mundane: true
    balance_caution: Extra care is needed with beings that primarily exist astrally
      or have metahuman-level Intelligence.
    distinction_from_toxic: Mutant paranormal creatures are mentally unstable in the
      fictional game and seldom behave as normal specimens of their species.
  printed_bear_example:
    fields:
    - B
    - Q
    - S
    - C
    - I
    - W
    - E
    - R
    - INIT
    - Attacks
    ordinary:
    - 9/1
    - 4x3
    - '9'
    - '-'
    - 2/4
    - '2'
    - '6'
    - '5'
    - 5+1D6
    - 6(S) Physical, +1 Reach
    mutant:
    - 9/1
    - 4x3
    - '9'
    - '-'
    - 1/2
    - '2'
    - '1'
    - '5'
    - 5+1D6
    - 6(S) Physical, +1 Reach
    essence_costs:
      albinism: 1
      corrosive_secretions: 3
      size_twice_normal: 1
    effective_essence_for_essence_based_power: 6
    damage_resistance_example_source_notation: twice the Bear’s Essence of 6L
    qualification: The sentence combines Essence and damage notation; retain it without
      inferring an alternative formula.
    damage_resistance_example_condition: The mutated bear hits an unarmored character.
  ordinary_mutant_behavior: The source describes fictional mutant animals as often
    attacking without provocation, rarely retreating, generally solitary, and aggressive
    even toward their own species; normal creatures tend to avoid them.
