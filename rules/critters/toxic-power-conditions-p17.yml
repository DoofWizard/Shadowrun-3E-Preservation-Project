id: rule.critters.toxic-power-conditions-p17
record_type: rule
status: reviewed
source: source.critters
printed_pages: '17'
pdf_pages: '17'
edition_scope: SR3
content_class:
- rule_exact
data:
  publication:
    title: Critters
    publisher: FASA Corporation
    catalog_number: FASA7002
    edition: Shadowrun Third Edition
  supplements: subsystem.critters.weaknesses-mutation-toxicity
  eligibility: Construct from an existing paranormal animal; gamemaster selects its
    characteristics and powers.
  initial_toxic_power_essence_cost: 0
  power_table:
    primary:
    - Blindness
    - Compulsion
    - Confusion
    - Sludge Engulf
    - Enhanced Physical Attributes
    - Enhanced Senses
    - Fear
    - Noxious Breath
    secondary:
    - Animal Control
    - Binding
    - Corrosive Saliva
    - Corrosive Secretions
    - Immunity to Poisons
    - Magic Sense
    - Pestilence
    - Venom
    related_source: The later Target Wastelands record rule.critters.target-wastelands-toxic-critters-domains
      contains equivalent list entries; this is the original FASA7002 table provenance,
      not an additional cumulative power list.
  unlimited_use_exception: Replacing a normal paranormal power with a toxic power
    removes the need for toxic hibernation to replenish that replaced power.
  weakness_qualification: The text specifies Severe Allergy to purified water or purified
    air as the toxic critter's only weakness.
  example:
    base: nova scorpion
    extra_combat_pool_dice: 1
    resultant_essence: 5
    primary_power: Confusion
    primary_uses: 5
    secondary_power: Animal Control
    secondary_uses: 2
    retained_standard_powers:
    - Concealment
    - Venom
  observed_behavior_qualification: Toxic critters with Animal Control may cooperate
    briefly with other members of their species; the association normally ends when
    the creature's objective is met.
  mutation_overlap: The source says no mutant toxic critters had been observed at
    its in-world date; this is not a prohibition on later SR3 optional rules.
framing: reference_exact
headline: 'FASA7002 Critters: Toxic critter power table and conditions'
summary: Fictional Shadowrun Third Edition tabletop rules, Critters (FASA Corporation,
  FASA7002), source.critters printed pp17/PDF17; supplements the earlier normalized
  subsystem with original-source mechanical gaps.
