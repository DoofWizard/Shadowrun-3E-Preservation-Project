data:
  publication: {title: Critters, publisher: FASA Corporation, catalog_number: FASA7002, edition: Shadowrun Third Edition}
  supplements: catalog.critters.l-z
  specter:
    astral_tests: Use Force for all tests in astral form.
    anchor: While its anchor exists, immune to banishing; can be disrupted in astral combat, returning after 28 minus Force days.
    domain_powers: Restricted to its haunted place.
    force: Minimum 6, no maximum.
    astral_initiative: F + 20 + 1D6
  spitting_pike:
    body_strength_by_length_m: {up_to_1: [1, 1], between_1_and_2: [2, 2], between_2_and_3: [4, 3]}
    over_3_m: Add 1 Body and 1 Strength per half-meter; caps 7 and 6 respectively.
    bite_damage_by_length_m: {up_to_2: 4M, between_2_and_3: 5M, between_3_and_4: 6M, over_4: 8M}
    spit_range_meters: Essence x 2
    evade: Opposed Quickness Test using pike Essence as TN; use Essence + 1 when distance in meters is less than pike Essence.
    engulf_condition: Only targets already affected by its corrosive saliva.
  stonebinder:
    petrifying_spit: Ranged Combat Test; if not completely dodged, one extremity or body area affected as Petrifying Gaze. GM selects area based on circumstances and attack angle.
    armor: Normal armor ineffective; full chemsuit protects.
    head_hit: Immediately fatal in game.
    spread: Every six hours to next adjacent area unless successful Willpower or Body (8) Test; cyberlimbs and prosthetics unaffected and may halt spread.
  storm_dolphin:
    omitted_powers: [Movement, Weather Control]
    sonar_interference: Significant artificial sonar within 250 meters causes +2 TN on dolphin Perception Tests.
    sonic_projection: Distorts sonar within Essence x 20 meters; increase sonar detection Success Test TN, amount not printed.
    quickness_multiplier: Swimming.
  stymphalian:
    ranged_damage: 4L
    ranges_meters: {short_max: Essence, medium_max: Essence x 2, long_max: Essence x 4, extreme_max: Essence x 6}
    sonic_weakness: Loud noise may inflict 3L and cause flight on failed Willpower (4) Test.
framing: reference_exact
