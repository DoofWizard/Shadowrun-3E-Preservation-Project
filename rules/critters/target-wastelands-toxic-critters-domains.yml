id: rule.critters.target-wastelands-toxic-critters-domains
record_type: rule
name: "Target: Wastelands Toxic Critters and Domains"
domain: critters
status: ingested
effective: {status: source_specific, source: source.fanpro-10653, pages: "114-115", pdf_pages: "115-116", basis: defines}
toxic_critters:
  eligibility: "Only Awakened critters become toxic; physical or dual-natured paranormal critters may also be mutants."
  power_uses:
    primary: "Essence uses"
    secondary: "Essence / 2 uses, rounded down"
    recovery: "Regain one use of each toxic power per hour in a toxic domain."
    replacement: "A regular paranormal power may be replaced by a toxic power for unlimited use."
  primary_powers: ["Blindness","Compulsion","Confusion","Engulf (Sludge)","Enhanced Physical Attributes","Enhanced Senses","Fear","Noxious Breath"]
  secondary_powers: ["Animal Control","Binding","Corrosive Saliva","Corrosive Secretions","Immunity (Poisons)","Magic Sense","Pestilence","Venom"]
  potency: "At gamemaster discretion a toxic critter may have Potency; add Potency to Essence for resolving its powers and grant one additional secondary toxic power per Potency point."
  potency_loss: "Potency may be lost in the same general way as for toxic shamans."
  drawbacks:
    - "Severe Allergy to purified air and water."
    - "Physical alterations and an astral signature that reveals the toxic nature with one or more Assensing successes unless masked."
domains:
  rule: "Only toxic shamans can summon toxic spirits; other magicians cannot summon nature spirits while inside a toxic domain."
  crossing: "Existing spirits able to cross domain lines may enter, though they may be reluctant."
  subtypes:
    desolate: "Favours Fear and Pestilence."
    irradiated: "Favours a radiation-themed aura; Guard may protect against radiation; toxic shamans may summon toxic Spirits of the Flames."
    poisoned: "Favours powers associated with contaminated environments, including corrosive effects or Venom."
    sterile: "Favours Desire Reflection, Influence and Noxious Breath rather than corrosive powers."
links:
  uses: []
  affects: []
  modified_by: []
  interacts_with: [rule.hazards.target-wastelands-radiation]
