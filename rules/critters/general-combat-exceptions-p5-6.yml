id: rule.critters.general-combat-exceptions-p5-6
record_type: rule
status: reviewed
source: source.critters
printed_pages: '5-6'
pdf_pages: '5-6'
edition_scope: SR3
content_class: [rule_exact]
data:
  publication: {title: Critters, publisher: FASA Corporation, catalog_number: FASA7002, edition: Shadowrun Third Edition}
  supplements: subsystem.critters.core
  dual_beings:
    astral_perception_cannot_be_disabled: true
    vulnerable_on_both_planes_continuously: true
    projection_physical_body: enters a trance
    projected_astral_attributes: derive from Mental Attributes as for an astrally projecting character
    astral_combat_initiative_without_projection: standard Initiative
    astral_combat_pool_without_projection: ordinary Combat Pool plus normal physical Attributes, not the Astral Combat Pool
  spirits:
    astral_form: treated as an astrally projecting character
    material_form: treated as a dual being
    material_body_requires: Materialization power
  combat:
    unlisted_initiative_dice: determine using standard Initiative rules
    damage_resistance: standard Damage Resistance Tests
    action_capability_uncertain: gamemaster determines capability from published creature information
    attack_combat_pool_cap_p5: Reaction
    separate_p19_initiative_cap: retained in rule.critters.statistic-reference-tables; no precedence inferred
    ordinary_combat_pool_rules_apply: true
  pools:
    astral_combat_pool: standard rules for projecting characters, in addition to formula already in subsystem.critters.core
    spell_pool: standard Spell Pool rules
    karma_pool: standard character Karma Pool rules; SR3 NPC Karma guidance p248
  existing_fields_reused: [dual-plane actions, plus-two astral perception exemption, projecting Initiative plus twenty, Combat Pool formula and split Intelligence choice, astral and Spell Pool formulas, Karma Pool size and power restriction, cyberware behavior check and implant adjustments]
framing: reference_exact
headline: 'Critters (FASA7002), pp5-6: general combat exceptions'
summary: 'Fictional tabletop rules: dual-being, spirit, Initiative, damage-resistance and dice-pool exceptions supplement the existing core record.'
