headline: FanPro Shadows of Europe (FanPro25002), Shadowrun Third Edition fictional faerie design, printed pp221-222 / PDF222-223
summary: "Original faerie section: 36 possible powers, nine Critters examples, design discretion, two signature powers and optional domain effects; existing power definitions retained."
data:
  section: Faeries
  classification: Faeries are not confined to Europe; the book describes metatypes, metavariants, paranormal critters, elemental, nature and man spirits, occasional free spirits, and forms not fitting conventional classifications.
  design: GM selects statistics and abilities freely, including unconventional or nontraditional faerie types; not all faeries have the characteristic powers.
  characteristic_powers:
    fading: The source describes disappearance from physical and astral planes into unknown metaplanes; the GM should use this sparingly because fighting or capturing such creatures is extremely difficult, while recurring appearances are practical.
    glamour: Alters perception, creates illusions, confuses others, conceals the faerie and changes perceived terrain.
    mechanics_reference: Critters p10; use existing rule.critters.power-entries-p10 rather than redefining either power. The destination in Critters is unspecified; the metaplanar description is this source's account.
  examples_from_critters: [Bean-Shidhe, Domovoi, Each-Uisge, Knockers, King Frost, Baba Yaga, Man-of-the-Woods, Leshy, Sprites]
  possible_powers:
    - Accident
    - Aid (Sorcery)
    - Animal Control
    - Animal Form
    - Astral Gateway
    - Aura Masking
    - Binding
    - Concealment
    - Confusion
    - Desire Reflection
    - Divination
    - Dispelling
    - Enhanced Physical Attributes
    - Enhanced Senses
    - Engulf
    - Essence Drain
    - Fading
    - Fear
    - Glamour
    - Guard
    - Hypnotic Song
    - Immunity (Control Manipulations, Normal Weapons)
    - Influence
    - Magical Guard
    - Magical Skills
    - Magic Sense
    - Mimicry
    - Mist Form
    - Movement
    - Personal Domain
    - Search
    - Shadow Cloak
    - Storm
    - Three-Dimensional Movement
    - Wealth
    - Weather Control
  encounter_options: GM may make faeries dangerous opponents, nuisances, helpful beings (especially after a favor), or hostile creatures that regard metahumanity as a threat and may abduct children or commit other fictional fairy-tale atrocities.
  domains:
    ownership: Faeries may possess guarded domains similar to spirit domains.
    possible_associations: [alchera, astral gateways, astral shallows, other magical phenomena]
    intruder_outcomes: [confusion, deception by Glamour, Engulf, transport to a faerie realm on another metaplane]
    reference: Target Awakened Lands pp99-103 and 113-114 for optional rules; use existing mana phenomena and alchera records without creating additional tests or fixed ratings.
