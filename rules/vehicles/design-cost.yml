  "resolution": {
    "summary": "Vehicle price is derived from DPV, chassis mark-up and market classification.",
    "inputs": [
      "DPV",
      "chassis mark-up factor",
      "vehicle class"
    ],
    "outputs": [
      "nuyen cost",
      "Street Index",
      "Availability"
    ],
    "steps": [
      "Adjusted design points = DPV × chassis Mark-Up Factor. GM may add roughly 1-3 to mark-up for unusual/prototype/experimental one-off designs.",
      "Base nuyen cost = adjusted design points ×100.",
      "Street Index base: standard vehicle 1; luxury 2; security-grade 2; military-grade 3+. Ambulance/medical specialty +0.5; specialty non-combat vehicle +1.",
      "Availability number/base time derives from Vehicle Cost ÷20,000, rounded up. Minimum Availability/base time is 2/24; GM may declare certain large/military vehicles simply unavailable to ordinary buyers."
    ]
  },
