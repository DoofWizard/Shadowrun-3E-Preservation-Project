headline: FanPro10662 p80/PDF82 optional integrated vehicle combat qualifications
summary: Original fictional tabletop game qualifications to the existing integrated vehicle combat option.
framing: reference_exact
data:
  publication:
    title: Rigger 3 Revised
    publisher: FanPro
    catalog_number: FanPro10662
    edition: Shadowrun Third Edition
    source_pdf_sha256: 88c3670ad4f39efebb1ee0545c222e4153bc4a5e1114e138e063e4f845a36909
  existing_option:
    id: option.vehicles.integrated-standard-combat
    path: options/vehicles/integrated-standard-combat.yml
    blob: e9793a6eb9a2ca9addce3250f5ed72db49293cb9
  optional: true
  ranged_dodge:
    control_pool_eligible: A rigger jacked into a vehicle or directly controlling a drone may roll a Dodge Test using Control Pool.
    direct_control_requirement: A vehicle or drone without direct control by a jacked-in or rigged pilot cannot make a Dodge Test, subject to the separate robot exception.
    robot_exception: A robot may dodge using Adaptation Pool only if programmed to avoid danger and it recognizes the danger.
  melee:
    eligible_targets: Vehicles or characters riding vehicles, within melee engagement distance.
    vehicle_counterattack: false
    resolution: The vehicle cannot counterattack and takes the full melee attack, subject to ordinary vehicle damage rules.
  optional_ramming:
    eligibility: In the fictional game, the vehicle can move into contact with a vehicle, character or barrier.
    ignored_modifiers:
    - Maneuver Score
    - speed
    target_may_dodge: Characters and vehicles targeted by the maneuver may attempt to dodge.
    damage_basis: Use the standard impact damage calculation with Movement Rate as equivalent speed.
  other_vehicle_actions: Use standard vehicle rules for other actions, including Sensor Tests and electronic warfare.
  scope: Preserve the existing movement-rate formulas, Vehicle Test and Complex Action, general ranged combat, melee restriction and optional maneuver exclusion without duplicating them. All conditions are fictional game resolution only.
