    - Armor
  vehicle_body:
    describes: Relative vehicle mass and resistance to punishment from weapons or high-speed driving.
    weapon_mount_capacity: Each hardpoint installed uses two Body Rating capacity points; each firmpoint uses
      one.
    body_three_example: Body 3 vehicle can use one hardpoint plus one firmpoint, or three firmpoints.
    source_cross_reference: Original printed p307 gives additional mount rules.
  weapon_damage_to_vehicles:
    body_reduction: For normal weapon attacks against a vehicle, halve attack Power, rounding down, and reduce
      Damage Level by one step.
    anti_vehicle_munitions_exception: The one-level damage reduction does not apply to anti-vehicle ammunition.
    original_example: The fictional Ares Predator normally inflicts 9M but against a vehicle its attack is
      4L after normal vehicle reductions.
    low_power_consequence: Attacks ordinarily doing Light damage may not affect vehicles because the ordinary
      damage level reduction removes the damage.
    special_armor_sequence: Vehicle Armor is hardened. A weapon with Power modified by the vehicle resistance
      reduction, but not by burst/autofire, equal to or below Armor Rating is completely deflected.
    armor_3_threshold: Armor 3 deflects a normal weapon whose original Power is 6 or lower, as the source illustrates.
    after_penetration: If modified Power exceeds Armor, Armor Rating reduces that Power, as ballistic or impact
      armor does; example Predator original 9M -> vehicle-adjusted 4L -> Armor 3 -> 1L.
    collision_exception: Armor offers no protection against collision impact damage.
  relationship:
    generic_damage: rule.vehicles.damage
    original_mount_numeric: rule.vehicles.sr3-core-original-mounts-p307
    original_weapon_damage_cross_reference: Original printed p149
    original_collision_cross_reference: Original printed p145
  source_limits:
  - This preserves the original vehicle versus weapon sequence, not a later Rigger 3 conversion.
  - No separate unprinted anti-vehicle munition numeric exception is invented.
