summary: 'Original FASA7001 example: Flux6 +4 elevation -0.5 encryption -1.5 ECCM
  = Flux8 and 20 km; jammer Flux10 vs Sensor8 yields 4 versus 2 successes, then ECCM4
  versus ECM3 cancels one, Signature4→5.'
