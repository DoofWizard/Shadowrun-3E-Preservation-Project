headline: Fictional Shadowrun spacecraft control qualifications (FanPro Target Wastelands, FanPro10653, SR3, 2002, pp128-129 / PDF129-130)
data:
  source_title: "Target: Wastelands"
  publisher: FanPro
  page_128:
    vehicle_rules_scope: Apply to close maneuvers near stations or on celestial surfaces; handle long-distance transit narratively.
    direct_earth_surface_to_moon_or_lagrange_points: Commercially nonviable due to fuel requirements and unavailable as direct trips under the stated travel scheme.
  page_129:
    suborbital_transit: A suborbital craft in the midst of a long-distance run cannot be engaged in vehicle combat.
    attitude_change:
      duration_seconds: 15
      duration_combat_turns: 5
      additional_maneuver_score_modifier: -10
      applies_at: Beginning or ending a long-distance run, during the attitude and pitch change.
    braking_exception: The spacecraft deceleration limit does not apply to ground vehicles operating on a surface with gravity.
    speed_modifiers: Other ordinary modifiers remain in effect despite the exception to Speed or Acceleration Stress, including +1 to Vehicle Tests before the stated greater-than-1.5-times-Speed threshold.
    travel_table_asterisk: The LEO-to-LEO 1D6-hour and GEO-to-GEO 2D6-hour entries depend on destination or may be determined randomly.
