    reuse: Retain its setup_breakdown eligibility, base time, storage fraction, cost, per-minute reduction cost, maximum CF multiplier and Load reduction without duplicate application.
  prose_minimum_remaining_time: floor(base_setup_breakdown_minutes / 2)
  labeled_maximum_improvement: floor(base_setup_breakdown_minutes / 2)
  conflict:
    distinct_quantities: The prose minimum remaining time and the separately labeled maximum time reduction have the same rounded expression but apply to different quantities.
    derived_check_not_a_published_example: Base time is twice Body plus one minute; for an odd base time, subtracting the labeled maximum improvement leaves one minute more than the prose minimum.
    disposition: Retain both limits as printed, without inventing precedence or silently rounding either expression differently.
  edition_relationship: Preserve a revised-source qualification missing from the earlier normalized record; no claim of historical edition difference.
