    headings:
    - Signature
    - Autonav
    - Pilot
    - Sensor
    - Cargo Factor
    - Load
    - Seating
    - Entry Points
    - Special Vehicle Ratings
  signature:
    game_use: Target number for sensor and missile to-hit tests and susceptibility to electromagnetic or thermal
      detection.
    not_for: Does not measure susceptibility to laser/microwave target designators; conventional ranged-combat
      rules apply to such devices.
    human_size_biological_form_signature: 6
  autonav:
    normal_role: Vehicle collision avoidance and navigation assistant; cannot autonomously fire vehicle weapons.
    driving_test_bonus: Autonav Rating adds that many dice to noncombat Driving Tests.
    combat_maneuvers: Autonav hinders driver in combat maneuvering; see original Vehicle Actions printed p141
      for the separate mechanic.
    rating_1: Basic radar and ultrasonic proximity detection; maximum for motorcycles.
    rating_2: Self-navigation and traffic-control grid communication.
    ratings_3_4: Includes GPS and off-road navigation with map chips.
    rating_4_extra: Can program its own routes.
  pilot:
    when_used: Drone decision-making rating, allowing execution of increasingly complex commands.
    skill_substitution: When not controlled by a rigger, substitute Pilot Rating for the rigger relevant skill
      for required tests under source circumstances.
    command_cross_reference: Original Issuing Commands p157.
  sensor:
    game_systems:
    - target detection
    - target identification
    - target tracking
    - radio transponders for positioning and GPS
    autonav_minimum: Vehicles with an autonav system automatically have Sensor Rating 0 or greater.
    dice: Sensor Rating supplies the base number of dice for vehicle Perception Tests; may add dice to some
      gunnery tests (p152).
    cross_references:
    - Sensor Tests printed p135
    - Sensor-Enhanced Gunnery printed p152
  cargo_and_seating:
    cargo_factor_volume_m3: 0.125
    one_cargo_factor_space: Cube half a meter on each side.
    load_unit: Kilograms; ordinarily excludes passenger weight except unusual circumstances.
    unoccupied_bucket_seat_load_kg: 100
    unoccupied_bench_seat_load_kg: 150
    seating_code: Ordered numeral sequence indicates seating arrangement.
  special_ratings:
    ecm: Electronic countermeasure systems interfere with remote control and sensors and raise vulnerability
      by Signature changes for particular gunnery tests.
    eccm: Counteracts ECM and may reduce the Power of jamming attempts against a drone.
    flux: Determines remote-control/sensor/electronic warfare effective ranges and electronic warfare resistance
      dice.
    maneuver_score: Variable vehicle combat positioning rating based on type, current speed, terrain and results
      of a driver Open Test; see printed p138.
  relationship:
    generic_vehicle_attributes: rule.vehicles.attributes
    later_autonav_extension: rule.vehicles.autonav
    sensor_testing: rule.vehicles.sensor-tests
  source_limits:
  - Record states exact original core definitions and numerical values only; later Rigger 3 GPS/Autonav refinements
    are separate lineage.
  - Printed p133 headings and cross-references are not taken to certify the later procedures fully normalized.
