    medium: Original fictional cyberpunk tabletop game publication
  original_pages:
  - printed: 134
    physical_pdf: 135
    headings:
    - The Driving Test
    - Driving Test Modifiers Table
    - Driving Test Modifiers Table Key
  test:
    action_cost: One Complex Action for a difficult vehicle maneuver.
    skill_roll: Use the appropriate Vehicle Skill.
    base_target_number: Vehicle Handling Rating; apply relevant modifiers from the table.
    noncombat_autonav_dice: When autonav is switched on and vehicle is not in combat, add Autonav Rating dice
      to Driving Tests.
    rigger_control_pool_dice_limit: If driving a rigged vehicle, may use Control Pool dice up to the relevant
      Vehicle Skill Rating.
  modifier_table:
  - condition: Unfamiliar Vehicle
    tn: 1
  - condition: Non-Stressful Situation
    tn: -1
  - condition: Stressful Situation
    tn: Gamemaster discretion, typically +1 to +3
  - condition: Large Vehicle of Type
    tn: 2
  - condition: Very Large Vehicle of Type
    tn: 3
  - condition: Bad Weather
    tn: 2
  - condition: Terrible Weather
    tn: 4
  - condition: Open Terrain
    tn: -1
  - condition: Normal Terrain
    tn: 0
  - condition: Restricted Terrain
    tn: 1
  - condition: Tight Terrain
    tn: 3
  - condition: Action Performed During Combat
    tn: 2
  - condition: Non-Rigger Driving Using Datajack
    tn: -1
  - condition: Rigger in Control
    tn: Subtract Vehicle Control Rig Rating; double this reduction during combat
  conditions_and_exceptions:
    large_vehicle_of_type: Size modifier relative to usual vehicles driven with that Vehicle Skill; Gamemaster
      chooses size classification.
    weather: Bad means ordinary adverse weather; terrible includes exceptionally severe weather.
    terrain: Terrain type depends on operating environment; normal land is countryside and winding roads, restricted
      suburban/wooded/hilly, tight includes fog or darkness where stated.
    combat_action: The +2 modifier applies to standard vehicle maneuver performed under gunfire/combat; a successful
      test does not guarantee evasion. Allocated Control Pool dice cannot resist damage. Exempt actions counted
      as vehicle combat maneuvers under printed p141.
    datajack_without_control: Apply -1 when controlling vehicle through datajack but without control rig, or
      when rigger operates vehicle not adapted to rigger control; do not use Control Pool.
    rigger_in_control: VCR rating reduces target number when driving character has vehicle control rig and
      vehicle is adapted; reduction doubles in combat.
  examples_and_cross_refs:
    original_example_continues_p135: Example on next page computes Handling 5 + Large 2 + Bad Weather 2 - VCR1
      = target number 8.
    general_cross_ref: Vehicle Combat printed p138; Vehicle Actions printed p141.
  source_limits:
  - This normalizes original SR3 p134 table and key, not rules from later Rigger 3.
  - GM discretion for stressful situations is not silently converted to a universal +2.
