  rules_section: Electronic Countermeasures and Counter-Countermeasures
  original_mechanics:
    ecm_scope: ECM affects vehicle sensor lock-on and electronic waves; it does not directly stop individuals firing
      weapons at a vehicle.
    ecm_opposed_success_contest:
      jammer_dice: ECM equipment Flux Rating
      jammer_target_number: Opposing vehicle Sensor Rating
      defender_dice: Defending sensors Flux Rating
      defender_target_number: Jammer ECM Rating
      success_comparison: If jammer wins, increase target vehicle Signature by net jammer successes; if defender
        wins, no jamming and Sensor Test may continue.
    action_timing:
      contested_ecm_test: Occurs outside the Combat Turn sequence and is not an action for either character
      toggle_ecm_eccm: Switching ECM/ECCM on or off is Simple Action
    multiple_ecm: For one vehicle use only the highest ECM result, not cumulative totals; for one jammer affecting
      multiple sensor-equipped targets, compare one jammer ECM roll against each defender vehicle Sensor Rating
      as described.
    eccm_countermeasure:
      counter_jammer_dice: Counterjammer ECCM Rating
      counter_jammer_target_number: Opponent ECM Rating
      jammer_dice: Jammer ECM Rating
      jammer_target_number: Opponent ECCM Rating
      resolution: Each net success from counterjammer cancels one net success from preceding ECM contest; do not
        treat electronic shielding as automatic immunity.
    worked_example_reference: The book gives an ECM Rating 3 / Flux 10 vs Sensor Rating 8 / Flux 8 example with
      Signature increment of +2, followed by ECCM Rating 4 and net mitigation of 1.
  scope_and_lineage:
    reuses: rule.vehicles.sensor-tests defines resulting target Signature use
    exclude: Original SR3 tabletop numerical opposed roll, not a real-world jamming procedure
