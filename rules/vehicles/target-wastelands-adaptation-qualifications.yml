headline: Hostile-environment vehicle design qualifications
data:
  source_title: "Target: Wastelands"
  publisher: FanPro
  extends: [rule.vehicles.target-wastelands-hostile-environment-adaptation, rule.hazards.target-wastelands-polar-game-information, rule.hazards.target-wastelands-desert-hazards]
  snowmobile: In the vehicle design system, motorcycle design options, modifications and restrictions apply, except remote operation does not require Motorbike Gyro-stabilization.
  ski_skids:
    flight: Retraction may be unavailable; a ski-equipped aircraft cannot fly supersonically unless the skis were included in its original design.
  stress_precedence:
    general_page_132: Matching new-design quality factor or existing-vehicle adaptation kit removes additional harsh-environment Stress.
    conflict: The specific polar rule on p123 and ordinary desert rule on p117 instead reduce the rate to one Stress Point per week; the running-vehicle sandstorm rule on p117 specifies one per day with matching adaptation. The original text gives no explicit precedence; retain each source statement and require adjudication before selecting an effective rate.
