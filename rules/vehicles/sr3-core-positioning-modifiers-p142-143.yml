  rules_section: Vehicle Positioning Test and Modifiers
  original_mechanics:
    action_type: Positioning is a Complex Action allowing vehicle a superior tactical placement or to approach a
      precise point.
    test: Appropriate Driving Skill tested against vehicle Handling Rating; apply Positioning Modifiers; successes
      add to Driver Points during the NEXT Combat Turn and improve future Maneuver Score.
    target_number_modifiers:
    - condition: Vehicle exceeds Speed Rating
      modifier: 1
    - condition: Autonav active
      modifier: + Autonav Rating
    - condition: Open terrain
      modifier: -1
    - condition: Normal terrain
      modifier: 0
    - condition: Restricted terrain
      modifier: 1
    - condition: Tight terrain
      modifier: 3
    - condition: Driver has compatible VCR implant
      modifier: '- (VCR Rating x 2)'
    precision_stop: For a stop at a particular location, the Positioning Test successes x vehicle Acceleration Rating
      is the possible travel distance in meters; if less than distance required to reach location, positioning attempt
      fails.
    timing: Successes are recorded and added to next-turn Driver Points before next Maneuver Score is finalized,
      not immediate free movement beyond published distance.
  scope_and_lineage:
    reuses: rule.vehicles.maneuver-score and rule.vehicles.driving-test
    exclude: Does not replace GM discretion over terrain and target location
