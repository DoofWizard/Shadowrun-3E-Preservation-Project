  rules_section: Sensor Tests and Results
  original_mechanics:
    test_procedure:
      passive_rigger: Roll Intelligence dice as standard Perception Test with appropriate modifiers; gamemaster
        chooses passive or active use
      passive_drone: Use Pilot Rating instead of Intelligence
      active_sensor: Roll dice equal to vehicle Sensor Rating against target number equal to target Signature, plus
        Sensor Test modifiers
      successes: Interpret using published Sensor Tests Results Table; gamemaster may choose whether test is appropriate
    sensor_test_target_number_modifiers:
    - condition: ECM in use
      modifier: Variable; Electronic Countermeasures printed p138
    - condition: ECCM in use
      modifier: Variable; Electronic Countermeasures printed p138
    - condition: Direct uninterrupted line of sight
      modifier: -2
    - condition: Urban setting
      modifier: 1
    - condition: Fog, smog, precipitation
      modifier: 1
    - condition: Restricted terrain
      modifier: 1
    - condition: Concealed by nature spirit
      modifier: + spirit Force Rating
    - condition: Tight terrain
      modifier: 2
    - condition: Sensing vehicle damaged
      modifier: + current Damage Modifier; original damage table printed p147
    - condition: Concealed by illusion spell
      modifier: Variable; individual spell description; resistance test if applicable
    sensor_test_results:
    - successes: 0
      result: No contact
    - successes: 1
      result: Basic contact; detect target, distance, direction of travel, speed and general type (building/aircraft/ground
        vehicle/life form); no more detailed identification
    - successes: 2
      result: General contact; general subtype (radar dish/helicopter/hovercraft/dragon, etc.)
    - successes: 3
      result: Positive contact; specific type or model (as source examples)
    - successes: 4+
      result: Identify distinguishing features relative to other members of its type
    passive_active_modes: Active tests can warn of vehicles/objects and use vehicle Sensor dice; a rigger may also
      perceive through visual feeds as passive Perception test.
  scope_and_lineage:
    reuses: rule.vehicles.sensor-tests for descriptive test overview; new record closes only exact p136 table/results
      numerics
    exclude: Do not claim these conditions universally override Sourcebook-specific spells or Electronic Countermeasure
      rolls
