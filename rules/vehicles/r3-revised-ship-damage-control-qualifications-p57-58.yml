data:
  publication: {title: Rigger 3 Revised, publisher: FanPro, catalog_number: FanPro10662, edition: Shadowrun Third Edition, source_pdf_sha256: 88c3670ad4f39efebb1ee0545c222e4153bc4a5e1114e138e063e4f845a36909}
  existing_damage_control: {id: procedure.vehicles.ship-damage-control, path: procedure/vehicles/ship-damage-control.yml, blob: 54f71eaaa230ce75e8b6f70cdc6eb1619d6be763}
  game_team_eligibility:
    crew_not_assigned_to_weapons_or_combat_related_support_may_stand_ready: true
    test_actor: controlling player
    existing_team_size_skill_and_bonus_dice: reuse existing SR3 procedure
  result_limit:
    original_reduction_limit: one Damage Level through damage-control measures
    source_fidelity: The original does not state the historical normalized floor of one Light naval level in this passage. Do not treat the two statements as equivalent or invent a new cumulative reset rule.
  time_expression:
    parenthetical_formula: base time divided by successes
    later_printed_formula: Build/Repair Test successes divided by treatment time
    units_as_stated: uninterrupted minutes
    disposition: Preserve both conflicting printed expressions; existing base-time-over-successes normalization remains recorded, no independent erratum inferred.
  existing_table: reuse Light, Moderate and Serious target numbers and times, combat and submarine modifiers, bonus dice, zero-success lockout, and serious interruption rule without duplication
  existing_flooding: reuse intervals and successful test stopping further damage without restoring original damage
  scope_limit: Fictional tabletop team eligibility, test actor, source limits and arithmetic wording only; no real-world damage-control or repair procedures, no historical edition difference inferred.
