  original_discrepancies:
    racer_tire_price_arithmetic:
      calculated_base_plus_tires_nuyen: 211200
      printed_total_nuyen: 214950
      difference_nuyen: 3750
      treatment: Preserve the printed table cost, printed narrative prices and independent arithmetic check; no invented adjustment.
    unusual_mark_up: The example adds 0.5 despite the general unusual-design modifier range of 1 to 3 on p113. No general range amendment inferred.
    availability: The example tables retain 2/2 days and 11/11 days respectively; the general p113 class adjustments of +6 and +4 are not reflected explicitly in these table entries. Preserve both presentations without declaring an exception.
    features_layout: The first Other Features line on p114 follows the racer table but precedes the transition to the racer narrative; it names Electronics Port without radio, Pintle Mount, Ring Mount and Roll Bars. The p112 modification example assigns those items to the Light Strike Vehicle. Preserve the placement uncertainty rather than treating them as additional racer features.
