headline: FanPro10662 Revised vehicle design Availability modifiers for luxury, security and military
  classes
summary: Rigger 3 Revised printed p113/PDF115 extends Vehicle Cost availability calculation with
  class-specific modifiers to both Availability rating and base days; historical FASA p113 has no
  class modifier list.
data:
  original_source_pages:
    printed: '113'
    physical_pdf: '115'
    section: Vehicle Design / Calculating Availability
  general_base_rule:
    availability_rating_formula: Vehicle Cost in nuyen divided by 20000, rounded up
    base_time_days: Same number as initial Availability rating
    minimum_availability: 2
    minimum_base_time_literal: 24 (as printed after slash in 2/24)
    printed_minimum_shorthand: 2/24
    interpretation_note: Preserve the printed 2/24 notation without silently resolving its 24-hour/day
      unit against the general time-in-days sentence.
    special_showroom_discretion: Gamemaster may change base time for vehicle on showroom floor, but
      rare
  revised_class_modifiers_add_to_both_availability_and_base_time:
    luxury: 4
    security: 6
    military: 10
  exception_or_boundary:
    availability_above_30_out_of_player_reach: Most large military ships, aircraft carriers, and
      suborbitals may exceed reach; book says simply not within players reach
    strict_purchase_prohibition_not_asserted: true
  historical_comparison:
    original_source_id: source.r3
    original_printed_page: 113
    nonstandard_class_modifiers_absent_in_original: true
    historical_original_can_assign_no_availability_at_gm_discretion: true
  canonical_lineage:
