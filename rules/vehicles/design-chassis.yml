  "resolution": {
    "summary": "The chassis is the structural template that establishes the vehicle category, fixed Body/Hull and many starting values and design limits.",
    "inputs": [
      "chassis type"
    ],
    "outputs": [
      "starting ratings",
      "allowed options",
      "mark-up factor"
    ],
    "steps": [
      "Body/Hull is fixed by chassis and cannot be improved directly; other ratings may be raised by design options or lowered without reducing DP unless a rule specifically grants CF/Load back.",
      "All manned vehicles require at least one driver seat.",
      "Chassis categories include bikes, boats, cars, fixed-wing aircraft, hovercraft, rotorcraft, ships, submarines, vectored-thrust aircraft and special vehicles.",
      "Special-vehicle examples include anthroform drones, barges, locomotives/rail cars, mini-blimps, semiballistics, suborbitals, trailers, walker drones and zeppelins.",
      "Chassis tables define maximum Cargo Factor, Load, Speed/Acceleration/Handling improvements, entry-point limits and other subtype restrictions."
    ]
  },
