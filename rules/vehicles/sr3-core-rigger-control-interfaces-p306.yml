content_class:
- rule_procedure
headline: 'Fictional tabletop RPG Shadowrun Third Edition (FASA Corporation FASA7001)
  printed p306/PDF315: vehicle-interface installation and rigger control rules'
summary: 'Original published Shadowrun Third Edition fictional vehicle and remote-control
  rule procedures: neural datajack and rigger adaptation distinctions, required Sensor
  rating, effects on Reaction and Pilot, costs, Cargo Factor and Load, and remote-control
  deck/ECCM functions.'
data:
  publication:
    title: Shadowrun, Third Edition
    publisher: FASA Corporation
    catalog_number: FASA7001
    edition: Third Edition
    source_id: source.sr3-core
    printed_page: 306
    physical_pdf_page: 315
    source_pdf_sha256: 7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914
    genre: published fictional cyberpunk tabletop role-playing game
  original_section: Street Gear / Vehicle Control Adjustments and Rigger Gear
  vehicle_interfaces:
    datajack_port:
      function: The original game describes direct neural control for a driver with
        a datajack; this alone is insufficient to let a Vehicle Control Rig interface
        with the vehicle.
      reaction_modifier_for_vehicle_tests_and_vehicular_combat: 1
      cost_nuyen: 2500
      motorcycle_cost_nuyen: 5000
      cargo_factor_consumed: 1
      load_kg_consumed: 15
    remote_control_gear:
      function: The installed vehicle interface receives and transmits game data from
        a rigger remote-control network, allowing the vehicle to act as a drone.
      minimum_vehicle_sensor_rating: 1
      pilot_rating_granted: 1
      cost_nuyen_formula: 2,500 × vehicle Body Rating
      cargo_factor_consumed: 0
    vehicle_control_gear_rigger_adaptation:
      function: The source calls this the rigger adaptation, a black-box translation
        between vehicle machine code and a character's neural interface for use with
        a Vehicle Control Rig.
      required_interface_any_of:
      - datajack port
      - remote-control gear
      minimum_vehicle_sensor_rating: 1
      cost_nuyen: 2500
      cargo_factor_consumed: 1
      load_kg_consumed: 10
  remote_rigger_accessories:
    remote_control_deck:
      function: A portable deck provides a radio link for the fictional rigger to
        operate a vehicle at a distance.
      interference: The original game states the radio link can suffer jamming and
        atmospheric interference.
      accessory_interfaces:
      - hitcher jacks
      - screen displays
      - intercom
    remote_control_eccm:
      function: Countermeasure device protects a rigger's remote-control deck against
        fictional game interference and jamming.
      source_cross_reference: Original Electronic Countermeasures, printed p138; this
        source p306 does not state a new numerical ECCM test procedure.
  ground_vehicle_qualifications:
    autonav: The original source describes Autonav as a limited self-guidance system
      that follows programmed maps, reacts to its surroundings and may stop for unforeseen
      obstacles; no fixed roll or duration is given in this page's descriptive paragraph.
    watercraft_aircraft: The original source supplies general vehicle setting descriptions;
      it does not define new target-number modifiers for those categories here.
    military_security_vehicle_legality: The gamemaster, rather than a universal fixed
      code in this paragraph, determines game Legality Codes for military and security
      vehicles.
  related_accepted_original_core:
    vehicle_mounts: rule.vehicles.sr3-core-original-mounts-p307
    drone_baseline: rule.vehicles.sr3-core-drone-autopilot-default-gear-p307
    market: equipment.vehicles.sr3-core-rigger-vehicle-gear-market-p306
  editorial_review:
    evidence: The original cataloged FASA7001 scan (verified SHA-256) printed page
      306, physical PDF page 315 was reviewed visually against the original Rigger
      and Vehicle Gear table and paragraphs. This receipt is an editorial source-review
      record, not proof that source-wide fidelity or engine readiness has been established.
