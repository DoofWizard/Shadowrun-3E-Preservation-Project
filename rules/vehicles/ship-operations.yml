    "summary": "Rigger 3 adds naval terrain/weather categories plus ship-scale ramming, grounding and boarding procedures.",
    "inputs": [
      "vessel class",
      "terrain",
      "weather",
      "Hull/Bulwark",
      "maneuver result"
