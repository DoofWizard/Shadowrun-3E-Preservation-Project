resolution:
  summary: "Vehicle weapons are fired with Gunnery using either manual or sensor-enhanced gunnery. Manual gunnery broadly follows ranged-combat rules with vehicle-specific modifiers; sensor-enhanced gunnery uses vehicle sensors and target Signature with sensor/gunnery modifiers."
