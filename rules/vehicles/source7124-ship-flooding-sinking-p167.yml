flooding:
  trigger: "Moderate or greater damage from a single attack"
  surface_vessel: "+1 Condition Monitor box every 15 minutes"
  submarine: "+1 Condition Monitor box every 5 minutes"
  stop_condition: "successful leak-plugging damage-control action"
  leak_team_success: "stops further flooding damage but does not reduce existing ship damage"

sinking:
  trigger: "Condition Monitor completely filled"
  time_to_sink_minutes: "4D6 - 9"
  result_zero_or_less: "sinks at end of current Combat Turn"
  systems_while_sinking: inoperative
  riggers: "dumped when sinking begins; dump shock applies"
  character_actions: "non-vehicle actions only"
  submerged_character_requirement: "use underwater breathing gear, hold breath, or use drowning rules"
  submarine_air_rule: "the interval from beginning to end represents remaining crew air; going under means available air is exhausted"

