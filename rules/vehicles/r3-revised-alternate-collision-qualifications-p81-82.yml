  optional: true
  replaces_core_scopes:
  - {heading: Ramming, printed_page: 143}
  - {heading: Vehicle Damage From Impact, printed_page: 145}
  - {heading: Vehicle-Pedestrian Collisions, printed_page: 148}
  test_qualifications:
    ramming_test: Reuse the SR3 p143 game test and applicable modifiers.
    positioning: The gamemaster may require a successful Positioning Test for a selected collision type.
    damage_resistance: Standard game resistance tests; spending Control Pool dice is optional.
    vehicle_collision_crash_test: Both vehicles require immediate Crash Tests, with driver and vehicle damage modifiers.
    barrier_collision_crash_test: The vehicle still makes a Crash Test following game barrier damage resolution.
  rounding:
    collision_power: up
    t_bone_post_collision_speed: down
  body_comparison_table_boundary:
    printed_light_row: Exactly twice the other vehicle Body as literally stated in the table.
    worked_example: The fictional example applies Light when Body 5 is compared to Body 2, and explains that the former is more than twice the latter.
    disposition: Preserve the original table wording and example interpretation separately; the table does not explicitly enumerate the greater-than-twice case.
  pedestrian_game_condition:
    crash_test_exemption: The rule states that a vehicle does not need a Crash Test after striking a metahuman.
    per_turn_count_limit: vehicle Body Rating
    inherited_unless_clause: The printed prose does not make the exemption conditional on falling below the per-turn count limit; the worked example separately contains a conditional crash reference.
    disposition: Do not infer an automatic Crash Test threshold or resolve the example wording into a new general rule.
  scope: Fictional RPG test applicability and typed rounding only; existing collision formulas, speed changes and equivalent Body values are referenced, not duplicated. No historical edition change inferred.
