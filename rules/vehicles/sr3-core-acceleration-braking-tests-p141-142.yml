  rules_section: Vehicle Accelerating and Braking
  original_mechanics:
    action_type: Accelerating or braking is a Complex Action during Vehicle Combat; driver changes speed.
    test: Driving Test using appropriate Vehicle Skill, base target number equal to vehicle Handling Rating plus
      Accelerating/Braking modifiers.
    target_number_modifiers:
    - condition: Vehicle Maneuver Score exceeds opponent score by 10 or less
      modifier: -2
    - condition: Vehicle Maneuver Score exceeds opponent score by more than 10
      modifier: -4
    - condition: Opponent Maneuver Score exceeds vehicle score by 10 or less
      modifier: 2
    - condition: Opponent Maneuver Score exceeds vehicle score by more than 10
      modifier: 4
    - condition: Vehicle fleeing more than one pursuing vehicle
      modifier: +1 for each additional pursuer
    - condition: Vehicle exceeds its Speed Rating
      modifier: 1
    - condition: Vehicle autonav active
      modifier: + Autonav Rating
    - condition: Open terrain
      modifier: -1
    - condition: Normal terrain
      modifier: 0
    - condition: Restricted terrain
      modifier: 1
    - condition: Tight terrain
      modifier: 3
    - condition: Driver has compatible vehicle control rig implant
      modifier: '- (VCR Rating x 2)'
    successful_test_speed_delta: Vehicle Acceleration Rating multiplied by successes; add for acceleration or subtract
      for braking.
    maximum_speed: No vehicle may exceed its Speed Rating multiplied by 1.5.
    crash_exception: A vehicle decelerating by more than 4 x Acceleration Rating must make a Crash Test.
    pursuit_ramming_window: If pursuing vehicle speed increase is at least 2 x distance separating it from target,
      it can ram the vehicle or pedestrian on controlling player next available action.
    table_key: Relative Maneuver Score is compared to chased/pursuing vehicle; use highest opposing score when more
      than one opponent is involved. Switching autonav on or off costs a Simple Action; free if rigger jacked into
      vehicle.
  scope_and_lineage:
    reuses: rule.vehicles.driving-test and rule.vehicles.maneuver-score, plus numeric score table printed p140
    avoid: Do not merge original SR3 procedure with later Rigger editions
