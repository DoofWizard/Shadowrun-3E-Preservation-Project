      "Virtual-dashboard/captain's-chair control treats backlash as Stun; directly rigged control treats it as Physical.",
      "If vehicle/drone takes Serious or Deadly electrical damage, the operator resists backlash only, not the ordinary damage-transfer effect from vehicle damage."
