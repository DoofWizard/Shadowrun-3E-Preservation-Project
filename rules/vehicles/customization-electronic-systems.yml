  "resolution": {
    "summary": "Rigger 3 supplies design-time and retrofit specifications for drone software interfaces, BattleTac receivers, ship CCSS integration, sensor/EW suites, communications ports and specialized detection systems.",
    "inputs": [
      "vehicle",
      "electronic system",
      "rating",
