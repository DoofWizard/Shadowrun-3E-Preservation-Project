headline: FanPro10662 pp78-79 optional subsystem repair and applicability qualifications
summary: Supplemental fictional tabletop game cost, rounding and applicability bindings for the existing optional subsystem damage rule.
framing: reference_exact
data:
  publication:
    title: Rigger 3 Revised
    publisher: FanPro
    catalog_number: FanPro10662
    edition: Shadowrun Third Edition
    source_pdf_sha256: 88c3670ad4f39efebb1ee0545c222e4153bc4a5e1114e138e063e4f845a36909
  existing_rule:
    id: rule.vehicles.subsystem-damage
    path: rules/vehicles/subsystem-damage.yml
    blob: 3f6eb3aae6393000987a9d2a05609fc220b1d8ae
  optional: true
  aggravated_body:
    serious_fraction_basis: original Body value
  armor_defeating_hit:
    simultaneous_armor_degradation: Both optional rules may apply at the gamemaster's discretion.
  engine:
    rounding: Round down the resulting Acceleration, Speed and Load Ratings for Light, Moderate and Serious subsystem damage.
    repair_base_cost:
      basis: vehicle base cost plus engine customization cost
      Light: 0.3
      Moderate: 0.3
      Serious: 0.6
      Deadly: 0.6
  fuel_tank:
    repair_base_cost:
      basis: original vehicle cost
      Light: 0.1
      Moderate: 0.1
      Serious: 0.3
      Deadly: 0.3
  passenger_compartment:
    power_rounding: round down
  rigger_control_box:
    resistance_test_damage_type: Physical
  target_acquisition_system:
    unaffected_weapon_category: Weapons classified by the game as non-smart.
    repair_base_cost:
      basis: original Parts Cost of sensor system multiplied by number of damage boxes
      multiplier: 0.10
  turret:
    multiple_turrets: The gamemaster may select the damaged turret when more than one is installed.
  scope: Existing Body and Armor values, engine rating factors, fuel-loss rates, Handling modifiers, damage resistance Power formulas and severity effects remain in their existing rule. No historical edition change inferred. All numerical values refer only to fictional RPG stats and currency.
