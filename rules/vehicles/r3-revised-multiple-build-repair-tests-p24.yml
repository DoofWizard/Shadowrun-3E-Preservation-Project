id: rule.vehicles.r3-revised-multiple-build-repair-tests-p24
record_type: rule
status: source_reviewed
source: source.fanpro-10662
printed_pages: '24'
pdf_pages: '26'
edition_scope: FanPro Rigger 3 Revised, Shadowrun Third Edition, FanPro10662, fictional tabletop RPG
content_class: [rule_exact]
headline: FanPro10662 fictional SR3 vehicle multiple Build/Repair test conditions p24/PDF26
summary: Original p24 qualifies tasks requiring several Build/Repair skills; keep the existing generic Build/Repair and vehicle installation rules.
framing: reference_exact
data:
  publication: {title: Rigger 3 Revised, publisher: FanPro, edition: Shadowrun Third Edition, catalog_number: FanPro10662, source_pdf_sha256: 88c3670ad4f39efebb1ee0545c222e4153bc4a5e1114e138e063e4f845a36909}
  application: Vehicle installation or repair task requiring tests with more than one Build/Repair skill.
  required_test_success: all
  partial_success_retry:
    condition: One required Build/Repair test succeeds and another fails.
    failed_test_may_be_repeated: true
    target_number_increment_per_subsequent_test: 1
    original_target_number_restoration: Player character increases the relevant Build/Repair skill.
  base_time_reduction: Combine successes generated by all required tests when reducing the base time.
  disastrous_failure: If any required test yields all ones, the entire task attempt fails disastrously.
  related_skill_eligibility: Electronics or Computer Build/Repair may be needed in addition to Vehicle Build/Repair for particular vehicle components; the specific task determines the required skills.
  existing_bindings:
    - {path: procedures/vehicles/customization.yml, blob: bada741417e60202ff90a486a605fbb8fd48d3d0, relation: Preserve the already recorded requirement for all installation tests to succeed.}
    - {path: procedures/skills/build-repair-use.yml, blob: 48bc107212034a83b8f5f8e5cbc1d79dad4ec9b9, relation: Retain generic Build/Repair test and time resolution.}
    - {path: rules/skills/sr3-core-build-repair-tn-time-p95.yml, blob: 562119e3bd86574a35f14f9819296823514a6ea7, relation: Retain existing core target-number and time mechanics.}
