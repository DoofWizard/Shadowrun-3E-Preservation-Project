headline: Rigger 3 Revised (FanPro10662), FanPro, fictional Shadowrun Third Edition vehicle market classes, printed p113/PDF115
summary: Preserve discretionary Street Index adjustment and the printed luxury, security-grade and military-grade classification qualifications.
framing: reference_exact
data:
  publication:
    title: Rigger 3 Revised
    publisher: FanPro
    catalog_number: FanPro10662
    edition: Shadowrun Third Edition
    source_pdf_sha256: 88c3670ad4f39efebb1ee0545c222e4153bc4a5e1114e138e063e4f845a36909
  street_index_discretion: GM may adjust the Street Index for an individual vehicle as appropriate.
  luxury:
    basis: Higher-quality raw materials and additional production care; a built-to-order or otherwise owner-customized vehicle may also qualify.
  security_grade:
    criterion: Vehicle includes components with a Legality rating other than Legal.
    typical_context: Usually built to an ordering agency's specifications and unavailable for public purchase; ordinary vehicles may be adapted for security or police use.
    fictional_enforcement: Vehicles lacking proper identification or apparently operated by non-security personnel are likely to be stopped by the authorities, not automatically stopped by a stated test.
  military_grade:
    typical_sale_channel: Highly restricted; usually sold by military contractors.
    authorization: Government or corporate authorization required for purchase, design and manufacture of most military vehicles.
    legal_public_purchase: Not legally purchasable by the general public.
