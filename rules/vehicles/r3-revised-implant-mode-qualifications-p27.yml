id: rule.vehicles.r3-revised-implant-mode-qualifications-p27
record_type: rule
status: source_reviewed
source: source.fanpro-10662
printed_pages: '27'
pdf_pages: '29'
edition_scope: FanPro Rigger 3 Revised (FanPro10662), Shadowrun Third Edition
content_class: [rule_exact]
headline: FanPro10662 original fictional tabletop rigging implant mode qualifications, p27 PDF29
summary: Clarify the specific Boosted Reflexes restriction, Simrig compatibility, remote piloting skillsoft restrictions and fictional smartlink game prerequisites.
framing: reference_exact
data:
  publication: {title: Rigger 3 Revised, publisher: FanPro, catalog_number: FanPro10662, edition: Shadowrun Third Edition, source_pdf_sha256: 88c3670ad4f39efebb1ee0545c222e4153bc4a5e1114e138e063e4f845a36909}
  section: Rigging and Other Implants
  historical_rule: {id: rule.vehicles.rigging-implant-interactions, path: rules/vehicles/rigging-implant-interactions.yml, blob: 2e6969fc78dec6c82b9dc921956c88a117433cb6}
  reflex_boosters:
    specific_incompatibility: Boosted Reflexes
    scope: The original separately excludes ordinary physical reflex bonuses while rigging. The specifically named implant incompatibility must not be widened to all reflex boosters based on this paragraph.
    core_reference: {path: rules/cyberware/sr3-core-boosted-reflexes-incompatibility-p300.yml, blob: c05fe2702501f5d40983bbb04589bd89052d012e}
  simrig:
    may_be_implanted_with_vcr: true
    playback_during_vcr_rigging: prohibited
  skillwire_remote_piloting:
    skillwires_allowed: false
    activesofts_allowed: false
    distinction: The existing virtual-dashboard manual driving exception is unchanged; remote piloting is not that exception.
  smartlink_game_prerequisites:
    vcr_substitutes_for: [eye display, simsense rig components]
    vcr_handles: rigger-to-vehicle I/O connection
    vehicle_requires: smartlink integration kit
    fictional_vehicle_weapon_requires: smartgun adapter
  interpretation_limit: Reuse inherited cerebral booster, general reflex bonus, direct control, manual dashboard, knowsoft and datasoft conditions. No unreviewed historical printed-edition inference.
