  race_car_example:
    original_gasoline_sports_car: {starting_acceleration: 10, maximum_acceleration: 18, starting_speed: 160, maximum_speed: 270}
    smart_materials: {design_points: 100, maximum_acceleration: 21, maximum_speed: 311, maximum_load_kg: 299, street_index_delta: 1, cumulative_design_points: 295}
    acceleration_purchase: {from: 10, to: 21, increase: 11, design_points_per_point: 25, design_points: 275}
    speed_purchase: {from: 160, to: 311, increase: 151, design_points_per_point: 2, design_points: 302}
    both_purchases_design_points: 577
    cumulative_design_points: 872
    source_label_conflict: The later worked-example sentences call 10 and 160 the original maxima; the earlier power-plant example labels them starting ratings and gives maxima of 18 and 270. Preserve the printed purchase arithmetic without changing either label or general maximum rules.
