data:
  publication:
    title: Shadowrun, Third Edition
    publisher: FASA Corporation
    edition: Third Edition
    catalog_number: FASA7001
    source_id: source.sr3-core
    source_pdf_sha256: 7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914
    medium: Original fictional cyberpunk tabletop game publication
  original_pages:
  - printed: 135
    physical_pdf: 136
    headings:
    - Sensors
    - System Components and Sensor Ratings
    - Image Transmissions
    - Active and Passive Sensors
    - Sensor Tests
  sensor_component_ratings:
    rating_0:
    - rangefinders
    - ultrasonic proximity detectors
    - laser proximity detectors
    rating_1:
    - proximity detectors
    - rangefinders
    - video (not trideo) cameras
    - basic radar
    - signature recognition software
    - low-light and telescopic magnification
    ratings_2_to_4: Include Rating 1 components and thermographic imaging.
    ratings_5_and_above: Include all earlier components and flare compensation.
    magnification_rating_multiplier: 50
    magnification_rule: All sensor systems provide magnification equal to sensor Rating times 50.
  image_transmissions_and_recording:
    min_rating_to_transmit_or_record: 1
    audiovisual_megapulses_per_minute: 2
    audio_only_or_video_only_megapulses_per_minute: 1
    recorded_image_quality_enlargement_multiplier: 20
    recorded_enlargement: Sensor Rating times 20 magnification before image quality is lost.
    realtime_image_enlargement_multiplier: 50
    realtime_enlargement: Sensor Rating times 50; shown by source example Rating2 permits 100x real-time and
      40x recorded.
    memory_requirement: Onboard storage requires memory or computer; chip recording requires recording hardware;
      remote transmit requires remote linkup.
    image_type: Two-dimensional video images, not trideo.
  sensor_modes:
    passive: Image/pattern recognition, generally 120–180 degree field; detection effectiveness depends on
      character attentiveness.
    active: Object detection and 360 degree coverage.
    thermographic: May be passive or active, chosen under gamemaster adjudication.
    passive_components:
    - listening devices
    - video cameras
    - thermographic imaging
    - low-light enhancement
    - magnification
    - noise filtering
    - audio dampening
    - flare compensation
    active_components:
    - rangefinders
    - proximity detectors
    - radar
    - thermographic imaging
  gameplay_test_reference:
    test_type: Rigger makes Passive or Active Sensor Test to notice or detect object in range; chosen by component
      and purpose.
    passive_example: Image or pattern recognition from a video feed.
    sensor_test_details: Rules continue onto following printed page 136; do not claim the success table is
      contained entirely on p135.
  reused_canon:
  - rule.vehicles.sensor-tests
  - rule.vehicles.attributes
  source_limits:
  - Original edition-specific Sensor ratings and recording numbers; not a Rigger 3 sensor-gear conversion.
  - No real-world surveillance guidance is intended; these are original fictional-game statistics.
