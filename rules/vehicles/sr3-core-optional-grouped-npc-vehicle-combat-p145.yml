  original_source:
    printed_page: 145
    physical_pdf_page: 146
    section_heading: MULTIPLE VEHICLE COMBAT
  option_scope:
    optional_gamemaster_choice: The gamemaster may group two or more non-player-character
      vehicles cooperating toward the same goal; grouping is not required.
    vehicle_group_condition: Two or more cooperating NPC vehicles, such as two patrol
      cars in the original fictional example.
    exclusions: The original does not mandate pooling unrelated vehicles, all vehicles
      in an encounter, or all player-operated vehicles.
  grouped_resolution:
    group_die_roll: The gamemaster may make a single die roll for the entire cooperating
      NPC vehicle group rather than separate individual vehicle rolls.
    maneuver_score_vehicle_selection: When determining the group Maneuver Score, use
      the statistics of the fastest vehicle in the group.
    numerical_target_modifier: Modify all Vehicle Test target numbers by 1 for each
      additional vehicle in the group.
    modifier_sign: Apply the number advantage as a target-number bonus or penalty
      depending on which side makes the test; do not apply one unconditional sign
      to both sides.
    original_three_versus_one_example:
      grouped_vehicles: 3
      solitary_opposing_vehicles: 1
      additional_vehicles: 2
      grouped_positioning_test_target_number_modifier: -2
      solitary_vehicle_test_target_number_modifier: 2
      example_scope: The published three-vehicle group gets -2 for a Positioning Test
        against one car, while that solitary car receives +2 on its Vehicle Tests
        due to being outnumbered.
  source_scope_limits:
  - This is an optional simplified gamemaster group-roll procedure, not an alteration
    to standard separate vehicle combat where grouping is not chosen.
  - Only the Maneuver Score explicitly uses the fastest group vehicle statistics;
    do not infer that every statistic in every other procedure is replaced.
  - The separate original passenger first-Initiative-Pass timing on this page remains
    governed by already accepted canonical vehicle turn rules.
