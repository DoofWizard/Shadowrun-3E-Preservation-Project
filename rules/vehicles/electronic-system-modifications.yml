    ],
    "affects": [
      "subsystem.vehicles.customization"
    ],
    "modified_by": [],
    "interacts_with": [
      "subsystem.drones.remote-control-network"
    ]
  },
  "sources": [
    {
      "source": "source.r3",
      "pages": "142-146",
      "relation": "defines",
      "note": "Electronic Systems through Electronics Ports and common-electronics CF table"
    }
  ],
  "notes": [
    "These pages primarily add design/customization costs and installation requirements; they do not silently replace the earlier operational EW/autosoft rules."
  ]
}
