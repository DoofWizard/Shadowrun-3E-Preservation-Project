{
  "id": "rule.vehicles.stress",
  "record_type": "rule",
  "name": "Vehicle Stress",
  "domain": "vehicles",
  "status": "ingested",
  "effective": {
    "status": "current",
    "source": "source.r3",
    "page": 62,
    "basis": "defines"
  },
  "scope": {
    "applies_to": [
      "vehicles/drone performance beyond ordinary limits"
    ],
    "excludes": [
      "Body 0 drones for intentional stress dice"
    ]
  },
  "resolution": {
    "summary": "Stress represents accumulated wear. It can be deliberately incurred for performance, generated by hard use or botches, cause system failures, and be reduced only by maintenance overhaul.",
    "inputs": [
      "Stress rating",
      "Body/Hull",
      "Driving Test",
      "load/speed",
      "maintenance"
    ],
    "outputs": [
      "Stress Points",
      "system failure",
      "extra dice"
    ],
    "steps": [
      "New vehicles normally start Stress 0; used vehicles may start higher.",
      "Exceeding Speed rating incurs 1 Stress Point; speed may be pushed up to 1.5× rating before other limits.",
      "Hard deceleration >4× Acceleration requires Crash Test; if Body exceeds successes, subtract successes from Body to determine Stress Points.",
      "Carrying/pulling excessive load causes ongoing Stress under overload/hauling rules.",
      "Before a Driving Test, character may intentionally take Stress to add dice 1-for-1. Stress intentionally inflicted in one action cannot exceed Body; treat Hull vehicles as Body 10; Body 0 drones cannot do this.",
      "Stress Rule of One: when number of 1s on a Driving Test equals/exceeds Vehicle skill, incur 1D6 Stress.",
      "On failed Driving Test, GM may roll 2D6 Stress Test; if result < Stress rating, a major system fails and Crash Test is required.",
      "If Stress reaches at least twice Body, a Stress Rule-of-One event automatically causes a major system failure.",
      "Maintenance overhaul in vehicle facility: B/R TN = Stress+2; every 2 successes remove 1 Stress. Base time 8 work-hours per Stress removed. Stress can never be reduced below 1 after a vehicle has ever gained Stress. Parts cost 50 nuyen per Stress removed plus labor."
    ]
  },
