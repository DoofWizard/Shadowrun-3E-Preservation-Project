  design_option_scope:
    printed_page: 114
    selected_during_vehicle_design_only: true
    available_for_vehicle_customization: false
    qualification: This applies to the Vehicle Design Options section; it does not prohibit the separately described vehicle modifications that may be installed during design or customization.
  extra_entry_points:
    printed_page: 115
    permitted_operations: [add entry points, subtract entry points, change entry point type]
    arrangement_statement: Original prose describes no general limit to the number, type or configuration of entry points, while directing common-sense review of proposed extra entry points.
    maximum_improvement_statement: The same heading gives a specific maximum on additional entry points, Body divided by 2 rounded up or Hull multiplied by 2 for vehicles with hulls.
    resolution: Preserve both source statements and the distinction between total and additional entry points. Do not infer unrestricted additional entry points or a new numerical maximum for subtraction or type changes.
