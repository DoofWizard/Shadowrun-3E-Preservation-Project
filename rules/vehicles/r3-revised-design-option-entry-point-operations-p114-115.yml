      binding: Reuse the existing zero Design Point cost and the general cargo and load restrictions; the historical normalized scope says unless separately allowed, which is not stated for this section on revised p114.
    - record: rule.vehicles.r3-revised-design-functional-improvements-p114-116
      path: rules/vehicles/r3-revised-design-functional-improvements-p114-116.yml
      blob: cba3b9cd609e3e107314c888b7d76eec5ccf7c40
      binding: Reuse the already indexed rounding, unusual-arrangement discretion and physical feasibility requirements; no second independent cost or maximum is added.
