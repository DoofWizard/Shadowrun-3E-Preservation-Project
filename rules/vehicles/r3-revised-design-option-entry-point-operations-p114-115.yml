headline: Rigger 3 Revised (FanPro10662), FanPro, fictional Shadowrun Third Edition design option eligibility and entry point operations, printed pp114-115/PDF116-117
summary: Preserve the design-only section boundary and all three entry-point operations, with the general arrangement statement separate from the additional-point cap.
framing: reference_exact
data:
  publication:
    title: Rigger 3 Revised
    publisher: FanPro
