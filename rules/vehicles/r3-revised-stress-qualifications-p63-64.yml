data:
  publication: {title: Rigger 3 Revised, publisher: FanPro, catalog_number: FanPro10662, edition: Shadowrun Third Edition, source_pdf_sha256: 88c3670ad4f39efebb1ee0545c222e4153bc4a5e1114e138e063e4f845a36909}
  existing_stress: {id: rule.vehicles.stress, path: rules/vehicles/stress.yml, blob: 86f955d9ddab2eefc4f84edcf2283f59d162fd8e}
  initial_rating:
    all_new_vehicles: 0
    used_vehicle: gamemaster determines the exact initial rating; it may be higher
  overload:
    maximum_cargo_as_multiple_of_load_rating: 2
