  stress_rule_of_one:
    reuse_existing_stress_threshold: true
    after_rule_of_one_increase_at_or_above_existing_threshold:
      major_system_selected_by: gamemaster
      driver_crash_test_required: true
  discretionary_test:
    gamemaster_may_call_stress_test_whenever_vehicle_running: true
  example:
    body: 3
    control_pool_dice_available: 0
    intentional_stress: 3
    additional_driving_dice: 3
    first_stress_test_result: 4
    first_stress_test_causes_system_failure: false
    stress_before_rule_of_one: 3
    ones_rolled: 5
    car_skill: 5
    rule_of_one_d6_result: 4
    resulting_stress: 7
    automatic_system_failure: true
  scope: Tabletop game-state qualifications only; retain existing speed, deceleration, intentional dice and overhaul formulas. No historical original-edition difference inferred.
