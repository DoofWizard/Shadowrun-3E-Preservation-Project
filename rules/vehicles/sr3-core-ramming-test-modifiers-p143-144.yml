  rules_section: Vehicle Ramming Tests and Modifiers
  original_mechanics:
    action_type: Ramming is a Complex Action using a vehicle against another vehicle, pedestrian or barrier.
    prerequisite: Target must be closer than the ramming vehicle Acceleration Rating; otherwise close gap with acceleration
      and test eligibility for next action.
    test: Driver makes Ramming Test with appropriate Vehicle/Driving Skill against base TN equal to vehicle Handling
      Rating plus modifiers; success means collision.
    target_number_modifiers:
    - condition: Ramming vehicle Maneuver Score exceeds target by 10 or less
      modifier: -2
    - condition: Ramming vehicle Maneuver Score exceeds target by more than 10
      modifier: -4
    - condition: Target Maneuver Score exceeds rammer by 10 or less
      modifier: 2
    - condition: Target Maneuver Score exceeds rammer by more than 10
      modifier: 4
    - condition: Vehicle exceeds Speed Rating
      modifier: 1
    - condition: Vehicle autonav active
      modifier: + (Autonav Rating + 2)
    - condition: Open terrain
      modifier: -1
    - condition: Normal terrain
      modifier: 0
    - condition: Restricted terrain
      modifier: 1
    - condition: Tight terrain
      modifier: 2
    - condition: Driver has compatible VCR implant
      modifier: '- (VCR Rating x 2)'
    collision: Both ramming vehicle and target make Damage Resistance Tests for collision; if rammer damaged, controlling
      player must make Crash Test.
    collision_power: Absolute difference of speeds / 10, rounded UP to nearest whole number; source next directs
      reducing collision damage Power by ramming vehicle Body Rating multiplied by successes in Ramming Test.
    damage_level: Determine level from original Impact Damage Levels Table printed p147; do not infer numeric row
      values from p143.
    minimum_tn: Standard Shadowrun TN rules apply; original example on p144 resolves 3 - 8 = -5 to final TN2 because
      TN cannot be below 2.
  scope_and_lineage:
    reuses: existing vehicle impact/crash numerical records pp147-148; this record supplies exact maneuver modifiers,
      not duplicated collision stat tables
    exclude: No physical-world vehicle collision advice; fictional tabletop dice mechanics only
