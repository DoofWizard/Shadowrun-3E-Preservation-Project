  seal_repair:
    printed_page: 132
    moderate_or_greater: Such damage cannot be sealed without work on the vehicle.
    qualification: This sentence specifies neither a repair equipment category nor a repair test; do not derive a mandatory shop from it alone. Retain independently sourced general vehicle repair rules.
  life_support:
    printed_page: 133
    supported_space: Sealed vehicle cabin or cockpit.
    scope: Supplies oxygen and basic climate control in that space; reuse the existing ten person-hours per CF capacity and existing design and customization specifications.
