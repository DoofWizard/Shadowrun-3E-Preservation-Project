data:
  publication: {title: Rigger 3 Revised, publisher: FanPro, catalog_number: FanPro10662, edition: Shadowrun Third Edition, source_pdf_sha256: 88c3670ad4f39efebb1ee0545c222e4153bc4a5e1114e138e063e4f845a36909}
  existing_pull_test: {id: procedure.vehicles.pull-test, path: procedure/vehicles/pull-test.yml, blob: 7cc887f667b258c4ddccd5f026a63852a8465225}
  short_distance:
    distance_km: {operator: lt, value: 0.5}
    failed_test:
      object_not_lifted_or_pulled: true
      still_incurs_stress_and_applicable_side_effects: true
  condition_categories:
    bad:
      ground: [muddy roads, moderate rolling slopes, comparable terrain, adverse rain or snow on otherwise level terrain or dirt roads]
      aircraft: [moderate crosswinds, snow, rain, other precipitation]
      boats_pulling_barges_or_floating_objects: [rough moderately choppy water]
    terrible:
      ground: [mud pits, quicksand, steep cliffs, marshes, flooded terrain, adverse weather worsening normally bad terrain]
      any_terrain: [blizzards, severe thunderstorms, weather produced by great nature spirit Storm power]
      aircraft: [severe storms, gale-force winds, rushing vertical air drafts]
      boats: [storm-tossed waves]
  modifier_qualifications:
    stuck_object:
      applies_when: partially rooted or buried in ground
      gamemaster_sets_modifier_by_depth: true
      example_axle_deep_in_mud: 1
      example_halfway_buried_in_soft_earth: 4
    pulling_without_rollers:
      applies_to: ground vehicle dragging an object without rolling support
      gamemaster_may_waive_on_sufficiently_slick_surface: true
    braced_vehicle:
      applies_to: ground vehicle braced against slipping
      bracing_combat_turns: 1
      removing_braces_combat_turns: 1
      vehicle_immobile_while_braced: true
  long_distance:
