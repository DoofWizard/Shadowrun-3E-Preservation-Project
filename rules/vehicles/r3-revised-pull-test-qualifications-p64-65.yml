    gamemaster_stress_test_also_required: true
    pull_test_normally_required: false
    gamemaster_may_require_initial_pull_test_to_start_movement: true
  scope: Fictional tabletop procedure; retain existing Load caps, Body Tests, printed target numbers, side-effect modifiers and acceleration rules without duplicating the table. The source uses strict less-than and greater-than half-kilometer boundaries; exact equality is not assigned here. No historical original-edition difference inferred.
