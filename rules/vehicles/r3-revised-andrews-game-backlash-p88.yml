headline: FanPro10662 p88/PDF90 ANDREWS fictional tabletop ASIST backlash correction
summary: Preserve the original revised-edition game Damage Level, affected character and triggering state without rewriting historical normalization.
data:
  publication: {title: Rigger 3 Revised, publisher: FanPro, catalog_number: FanPro10662, edition: Shadowrun Third Edition, source_pdf_sha256: 88c3670ad4f39efebb1ee0545c222e4153bc4a5e1114e138e063e4f845a36909}
  existing_entity: {id: entity.weapon.an-edq-12-andrews, path: entities/weapons/an-edq-12-andrews.yml, blob: 8b8d9881894b42861de8f5e9da99c6c8e36d3da1}
  game_backlash:
    trigger: A character jacked into or directly controlling a game vehicle or missile when it is struck by the fictional ANDREWS beam.
    damage_type: Physical
    power: 4 plus the character's VCR implant rating
    damage_level: D
    reference: ASIST Backlash, printed p27
  source_fidelity: The historical normalized entity note instead gives Damage Level L and describes a directly rigged operator struck by the beam. The revised original expressly gives D and the controlled vehicle or missile as the struck game entity. Preserve the historical note; no claim about the FASA7910 printed original.
