  "name": "Mechanical Arms and Legs",
  "domain": "vehicles",
  "status": "ingested",
  "effective": {
    "status": "current",
    "source": "source.r3",
    "page": 66,
    "basis": "defines"
  },
  "scope": {
    "applies_to": [
      "vehicles/drones with mechanical arms or legs"
    ],
    "excludes": []
  },
  "resolution": {
    "summary": "Mechanical appendages use dedicated skill limits, vehicle Handling and Body for manipulation/melee, while legged vehicles use character-style movement/combat.",
    "inputs": [
      "Mechanical Arm Operation",
      "Handling",
      "Body",
      "Walker skill"
    ],
    "outputs": [
      "manipulation/melee/movement result"
    ],
    "steps": [
      "Arm manipulation uses Mechanical Arm Operation vs TN = vehicle Handling; a directly controlling rigger may add Control Pool up to skill rating; autonomous drone may use Pilot instead.",
      "When another skill is used through an arm, make that Skill Test plus Mechanical Arm Operation (or Pilot) against Handling. Skill successes are capped by arm-operation/Pilot successes. Without Mechanical Arm Operation, default to Reaction or Walker.",
      "Arm melee uses Mechanical Arm Operation as Combat skill. For each Handling point above 3, add +1 TN. Attack effective Power/Strength = Body×Body unless arm modified for higher Strength.",
      "Legged vehicles use normal walking/running and character-combat rules instead of vehicle combat. Listed Speed is walking speed; running speed = Speed×2.5.",
      "Legged-vehicle kick uses Walker as Combat skill; +1 attack TN per Handling point above 3. Pilot must immediately Crash Test +2 to avoid falling.",
      "Mechanical-arm base Strength equals vehicle Body² and lifting capacity is Strength×20kg. Strength enhancement may never raise the limb above 10×vehicle Body. Mechanical arms may use cyberarm accessories except the M&M Strength/Quickness enhancements; mechanical-arm accessory cost is half the standard cyberarm version with the same Availability/SI.",
      "Design: arm cost Body×100 DP; Strength enhancement points 1-3 cost 60×Body DP per point, 4+ cost 75×Body per point; 2 CF; Load reduction Strength×10kg. Retrofit: arm parts Body×10,000 nuyen; Strength enhancement points 1-3 cost 5,000×Body per point, 4+ cost 6,000×Body; Availability 4/4 days(SI1); vehicle facility; 40h Cybertechnology B/R(6); 4 CF; Load reduction Strength×10kg."
    ]
  },
