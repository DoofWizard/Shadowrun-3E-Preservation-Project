data:
  publication: {title: Rigger 3 Revised, publisher: FanPro, catalog_number: FanPro10662, edition: Shadowrun Third Edition, source_pdf_sha256: 88c3670ad4f39efebb1ee0545c222e4153bc4a5e1114e138e063e4f845a36909}
  rating_2:
    mapped_route: With a standard map chip, may follow any mapped route on terrain not classified as rough; availability of chips for major urban areas is not a restriction of the route to urban terrain.
    rough_terrain_condition: Terrain on which off-road penalties apply. Reuse the existing doubled relevant target numbers and collision-avoidance limitation.
  rating_4:
    terrain_eligibility: Urban and off-road terrain provided appropriate map chips are available.
    route_planning: May plan its own route when given destination instructions, and revise its programmed route to the next most appropriate route when local conditions warrant the change.
