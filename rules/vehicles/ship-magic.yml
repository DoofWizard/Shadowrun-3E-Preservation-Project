    "steps": [
      "Combat spell target number against ship = Object Resistance 8 + (Hull×2) + Bulwark. Elemental manipulation target number remains 4 per ordinary rules.",
      "Combat spells reduce Damage Level by Hull steps. Elemental manipulations reduce Damage Level by Hull+1 steps; if below Light, no effect.",
      "Elemental manipulation Power is divided by (Bulwark+1), round down; if result <2 round up to 2; then resolve normal Damage Resistance.",
      "Spirit attacks otherwise work normally; Immunity to Normal Weapons applies against naval weapons as usual.",
      "A sufficiently occupied large ship may count as a hearth domain encompassing interior and space above decks up to highest point. Above decks simultaneously remains sea/sky domain.",
      "Being a domain grants no special protection; ship-conjured hearth spirits are ordinary hearth spirits. Ships can also accumulate Background Count."
    ]
  },
