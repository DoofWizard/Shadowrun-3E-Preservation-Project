    "summary": "Ship scale modifies spell effectiveness, while sufficiently occupied ships can form hearth domains.",
    "inputs": [
      "spell type",
      "Hull",
      "Bulwark",
      "spirit/domain state"
    ],
    "outputs": [
      "spell damage",
      "domain interaction"
