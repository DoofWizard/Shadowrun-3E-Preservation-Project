  rules_section: Vehicle Maneuver Score, Points Tables and Turn Sequence
  original_mechanics:
    maneuver_score:
      formula: Vehicle Points + Terrain Points + Speed Points + Driver Points
      purpose: Temporary relative tactical advantage during each Vehicle Combat Turn; recalculated each turn
      pedestrian: Maneuver Score = Quickness if interacting with a vehicle
    vehicle_points:
    - type: Car/Pickup Truck
      points: 0
    - type: Fighter Jet
      points: 20
    - type: Heavy Truck
      points: -5
    - type: Helicopter
      points: 5
    - type: Hovercraft
      points: 2
    - type: HSCT/Suborbital
      points: 15
    - type: Large Airplane
      points: -5
    - type: LAV/T-bird
      points: 10
    - type: Limousine/Light Truck/Van
      points: -3
    - type: LTA/Zeppelin
      points: -10
    - type: Motorcycle
      points: 5
    - type: Racing Boat
      points: 5
    - type: Semiballistic
      points: -25
    - type: Small Airplane
      points: 0
    - type: Small Motorboat
      points: 0
    - type: Sports Car
      points: 3
    - type: Tracked Vehicle
      points: -3
    - type: Tractor Trailer
      points: -7
    - type: Train/Monorail
      points: -10
    - type: Ultra-light Aircraft
      points: 10
    - type: Yacht
      points: -10
    terrain_points:
    - terrain: Open
      points: 0
    - terrain: Normal
      points: -2
    - terrain: Restricted
      points: -4
    - terrain: Tight
      points: -10
    speed_points: Vehicle speed in meters per Combat Turn / 10, round DOWN.
    driver_points: Appropriate Vehicle Skill Open Test; add highest individual die result as Driver Points. Players
      may allocate Control Pool dice to this Open Test; allocated dice unavailable for other use until refreshed.
    turn_sequence:
    - step: 1
      action: Determine starting distance and speed (only first Combat Turn); stopped/parked/idling speed 0; GM
        decides starting NPC speeds/distances and may decide incapacitated driver vehicle speed
    - step: 2
      action: Determine Vehicle, Terrain and Speed Points to form partial Maneuver Score
    - step: 3
      action: Allocate Control Pool dice to Driver Points Open Test
    - step: 4
      action: Determine Driver Points via Open Test and final Maneuver Scores; GM rolls for NPCs
    - step: 5
      action: Determine driver/passenger/pedestrian initiative
    - step: 6
      action: Characters act by initiative, resolve actions
    - step: 7
      action: Determine speed, distance and terrain changes; new terrain effects at this stage
    - step: 8
      action: Begin new Combat Turn; all Dice Pools for drivers, passengers and pedestrians refresh; speeds/distances
        carry forward to step 2
    initiative_conditions: Rigged-vehicle Reaction and Initiative dice bonuses apply only to riggers jacked into
      and driving compatible vehicles; boosted and wired reflexes, physical adept ability increases and magic do
      not apply for drivers when determining Initiative. Non-rigger driving via datajack port receives +1 Reaction.
      Passenger actions delayed until after driver first Initiative Pass.
  scope_and_lineage:
    reuses: rule.vehicles.maneuver-score descriptive formula and procedure. Exact numeric p140 tables newly source-normalized
    exclude: Do not infer per-turn positional bonuses not stated on original pages
