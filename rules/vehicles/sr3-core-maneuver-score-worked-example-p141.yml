  source_interpretation:
    all_dice_notation: Lists the printed example die outcomes for the Vehicle Skill Open Test, including rerolling
      a 6, not a general-purpose random roll guarantee.
    control_pool: Rigger X commits four of seven dice to this test, leaving three for other purposes in the Combat
      Turn; non-rigged cruisers receive none.
    scoring_formula: Vehicle Points + Terrain Points + floor(Speed meters/Combat Turn / 10) + highest accumulated
      Open Test die result.
    result_scope: Original table example calculates Maneuver Scores before the characters roll for Initiative; it
      does not predetermine winners of the encounter.
