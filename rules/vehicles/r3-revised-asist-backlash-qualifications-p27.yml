headline: FanPro10662 fictional tabletop ASIST backlash resistance and control-mode qualification, p27 PDF29
summary: Preserve the Willpower Test, conditional VCR rating and remote-drone adjustment, and original worked game example without replacing the inherited backlash rule.
framing: reference_exact
data:
  publication: {title: Rigger 3 Revised, publisher: FanPro, catalog_number: FanPro10662, edition: Shadowrun Third Edition, source_pdf_sha256: 88c3670ad4f39efebb1ee0545c222e4153bc4a5e1114e138e063e4f845a36909}
  section: ASIST Backlash
  inherited_rule: {id: rule.vehicles.asist-backlash, path: rules/vehicles/asist-backlash.yml, blob: 3cc698028dc013a76b4e8ab9ecc3e86a98d4b554}
  resistance_test: Willpower Test
  power_qualification: Apply the existing base Power plus the character's VCR rating if applicable, not only for direct rigging. Reduce that Power by 2 when the character controls a drone by remote control.
  mode_qualification: Remote control of a drone and direct control of its actions can coexist; the printed example treats direct control through the remote system as Physical backlash. Virtual-dashboard and captain's-chair modes use the inherited Stun rule.
  worked_example:
    incoming_game_damage_code: 6D
    dodge_successes: 2
    damage_resistance_successes: 2
    vehicle_damage_level: M
    vcr_rating: 2
    power_before_remote_modifier: 6
    power_after_remote_modifier: 4
    backlash_game_damage_code: 4S
    backlash_damage_type: Physical
  interpretation_limit: Reuse the existing trigger, naval adjustment and no-duplicate-transfer conditions; no claim of a difference from the unreviewed FASA7910 printed original.
