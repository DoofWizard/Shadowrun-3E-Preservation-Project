    "editorial_scope": "Optional gamemaster selections for fictional mutated Shadowrun creatures in an original Second Edition-era sourcebook; neither real-world biological claims nor real-world instructions.",
    "original_option_categories": [
      {
        "category": "Size Change",
        "source_guidance": "Most fictional mutant critters are 50 percent larger to twice normal species size; greater than twice is unusual, and a few are smaller than normal."
      },
      {
        "category": "Physical Deformities",
        "source_guidance": "Examples include skeletal/bone anomalies, mange and albinism, as well as absent armor/exoskeleton plating, extra usually useless appendages, and rare missing appendages. Examples of bone changes include external deposits on legs, arms, skull or spine, misaligned interior bones, arched spine, disproportionate limbs and altered skull shape. Mange may affect skin or fur; albinism may involve very light/white skin and pink or red eyes."
      },
      {
        "category": "Enhanced Attributes and Abilities",
        "source_guidance": "Some fictional mutants gain Strength or Body; others acquire low-light vision or thermographic vision absent from their normal species."
      },
      {
        "category": "Paranormal Abilities",
        "examples_from_source": [
          "Astral Perception",
          "Corrosive Saliva",
          "Corrosive Secretions",
          "Dismissal",
          "Pestilence",
          "Venom"
        ],
        "qualification": "The printed examples are possibilities, not an exhaustive list and not a fixed package of powers."
      }
    ],
