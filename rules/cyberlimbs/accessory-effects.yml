    additional_difficult_ground_tn_modifier: 1
    dodge_test_tn_modifier: 1
    restricted_combat_or_crowded_terrain:
      test: Athletics (Skating)
      target_number: 5
      timing: end of each Combat Turn in which the character moves
      failure: fall prone
    extend_or_retract_action: Complex
  direct_neural_interface:
    printed: 38
    entities: [entity.cyberware.direct-neural-interface, entity.cyberware.direct-neural-interface-adaptation]
    control_requires_adapted_device: true
    external_adapted_devices: controllable via datajack
