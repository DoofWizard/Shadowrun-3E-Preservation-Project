  outputs: [test modifiers, movement rates, action costs, accessory restrictions]
data:
  cyberarm_gyromount:
    printed: 36
    entity: entity.cyberware.cyberlimb-cyberarm-gyro-mount
    recoil_reduction: 3
    supported_weapon_size_maximum: light machine gun
    eligible_installations: [full cyberarm, articulated arm]
    concealability_change_inactive: -1
    concealability_change_active: -6
  cyberhand_safety:
    printed: 37
    entity: entity.cyberware.cyberhand-safety
    matching_code: safety inactive
    nonmatching_code: safety active
    encryption_rating: 8
    change_owner: new firmware chip for the fictional game item
    blank_chip_cost_nuyen: 50
    programming_facility: computer repair shop or facility
  cyberholster:
    printed: 37
    entity: entity.cyberware.cyberholster
    eligible_installations: cyberlimbs only
    eligible_weapon_classes: [holdout pistol, light pistol, heavy pistol, machine pistol, taser]
    detection_test_tn_modifier: 2
    ready_or_quick_draw_action: Simple
    ready_cross_reference: SR3 p107
    ecu_includes_holstered_item: true
  kid_stealth_legs:
    printed: 37
    entity: entity.cyberware.kid-stealth-legs
    obvious_only: true
    both_legs_must_match: true
    running_multiplier_change: 1
    human_example_running_rate: Quickness times 4
    kick_power_bonus: 2
    jumping_athletics_extra_dice: 1
    jumping_cross_reference: SRComp p47
