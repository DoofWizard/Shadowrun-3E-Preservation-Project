pdf_pages: '36-40'
edition_scope: SR3
content_class: [rule_exact]
effective: {status: current, source: source.mm, page: 36, basis: defines}
scope: {applies_to: [fictional cyberlimb accessories in the tabletop game]}
resolution:
  summary: Apply the individual accessory game effects below. Purchase statistics remain in the linked existing item entities.
