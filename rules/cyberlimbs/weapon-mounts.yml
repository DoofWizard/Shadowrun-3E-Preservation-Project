data:
  general:
    printed: 40
    eligible_installations: [cyberlimb, cybertorso]
    activation: DNI implant or manual trigger
    smartlink_condition: game item must be smartgun-equipped and mount linked via router to smartgun link
    maximum_items_per_mount: 1
    retractable_extend_or_retract_action: Simple
    external_ammunition_pod: {cost_nuyen_excluding_ammunition: 10, game_capacity_rounds: 50, maximum_simultaneous_pods: 1}
    social_interaction_cross_reference: M&M p48
  external:
    printed: 40
    entities: [entity.cyberware.weapon-mount-external, entity.cyberware.weapon-mount-retractable]
    hands_free: true
    attach_or_detach_action: Complex
    eligible_game_weapon_classes: [light pistol, heavy pistol, machine pistol, submachine gun]
    nonintuitive_aiming_tn_modifier: 2
    recoil_reduction: 0
  tracking:
    printed: 40
    entities: [entity.cyberware.weapon-mount-tracking, entity.cyberware.weapon-mount-retractable-tracking]
    inherits_external_rules: true
    automatic_tracking_condition: linked target designator system
    marked_target_bonus: laser sight bonus; not smartlink bonus
    recoil_reduction: 0
  articulated_arm:
    printed_pages: '40-41'
    entities: [entity.cyberware.weapon-mount-articulated-arm, entity.cyberware.weapon-mount-articulated-arm-retractable]
    inherits_tracking_rules: true
    firing_area_degrees: 360
    source_qualification: descriptive text specifies a dead spot behind the head; game effects state 360-degree coverage
    eligible_game_weapon_classes: light weapons up to and including light machine gun
    recoil_reduction: 3
    additional_modifier: laser sight modifiers
