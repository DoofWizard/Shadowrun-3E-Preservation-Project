scope: {applies_to: ["external, retractable, tracking and articulated cyberlimb weapon mounts"]}
resolution:
  summary: "Cyberlimb and cybertorso mounts support different classes of weapons and recoil behavior. Tracking mounts can follow targets automatically when linked appropriately, retractable mounts require deployment actions, and articulated mounts provide a wide firing arc. Mount type determines ECU, concealment and supported weapon classes."
