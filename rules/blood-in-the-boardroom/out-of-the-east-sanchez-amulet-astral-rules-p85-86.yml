data:
  source_context: Fictional Shadowrun tabletop role-playing game, Blood in the Boardroom,
    FASA Corporation (1999), FASA7327; original Third Edition-era published setting/adventure
    reference. Independently inspected original cataloged printed/PDF page images;
    these are optional scenarios, in-world facts, or exact fictional game mechanics,
    not contemporary factual allegations or real-world advice.
  section_context: Out of the East
  section: What’s in a Name? / Sanchez’s amulet, effect and special status, pp85–86
  object: Unique green-stone amulet on a broken silver chain, given to Craig Sanchez
    by Dunkelzahn. This is a unique fictional magical item in the historical Shadowrun
    game source.
  effect: Makes the wearer’s aura look nondescript. A heavily cybered wearer may appear
    unaugmented in the astral plane.
  numeric_equivalence:
    initiate_grade: 5
    magic_rating: 11
    comparison: Treat as if a Grade 5 initiate with Magic Rating 11 were deliberately
      masking the wearer’s aura.
  bonding: No bonding required.
  protections: Cannot be dispelled, attacked astrally, or grounded through, unless
    the gamemaster elects otherwise.
  barrier_exception: Does not prevent the wearer from passing through astral barriers.
  related_detection: On printed p85, the item conceals the bearer’s aura, can make
    a mundane person’s aura look generic, and masks its own aura when worn by a living
    person.
  lineage: Original historical Third Edition-era published source rule. No later edition
    conversion inferred.
  attribution: Exact fictional tabletop-RPG mechanics, not a claim that astral phenomena
    occur in the real world.
