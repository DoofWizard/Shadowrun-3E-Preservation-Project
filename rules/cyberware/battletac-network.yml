resolution:
  summary: "BattleTac links a master component to receiver components and continuously shares tactical data, maps, unit status, target information and requests. Networked units can receive Small Unit Tactics and Initiative-related benefits, and compatible drone networks can exchange BattleTac information through the required interfaces."
