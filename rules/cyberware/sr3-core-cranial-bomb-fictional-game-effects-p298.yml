  original_fictional_game_categories:
    kink_bomb: The rulebook describes a fictional localized implant that can cause
      specific harm or damage to internal cyberware; it supplies no separate numeric
      Damage Code for this category.
    microbomb: The source presents the fictional microbomb as an implant intended
      to kill its bearer; it supplies no distinct numbered Damage Code for this variant.
    area_bomb: The source presents the fictional area variant as harming both its
      bearer and characters nearby, with purchasing Power and Damage Level ranges
      stated below.
    optional_source_trigger_description: The published in-world narrative includes
      remote, timed and sound-recognition trigger possibilities, but does not supply
      a construction recipe or a distinct game test for those trigger classes.
    other_location_description: The narrator allows the fictional headware category
      to appear at other body locations without stating an independent game Essence
      or Damage modifier in this paragraph.
