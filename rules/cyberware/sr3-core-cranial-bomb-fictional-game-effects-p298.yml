    minimum_power_rating: 3
    maximum_power_rating: 8
    allowable_damage_level_range: Moderate through Deadly (M through D) as original
      game Damage Level notation
    printed_blast_falloff: Subtract 1 from game Power for each meter of distance;
      the source gives -1/m in this paragraph.
    no_generalization: Do not apply this particular p298 range or falloff automatically
      to other fictional explosives or unrelated categories; keep their independently
      published formulas.
