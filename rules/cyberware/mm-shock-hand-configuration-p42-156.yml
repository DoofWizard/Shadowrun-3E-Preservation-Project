headline: 'FASA7126 printed pp42-43,156: Shock Hand placement, activation and charge/mode fields'
summary: 'Original SR3 tabletop mechanics: Shock Hand uses contact-activated electric pads, is rechargeable after twelve uses, permits specified alternative extremity mounts, and has a dash (not a firearm mode) in the equipment table. Existing item stats are reused.'
