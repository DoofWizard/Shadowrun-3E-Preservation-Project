id: rule.cyberware.move-by-wire
record_type: rule
name: Move-by-Wire System
domain: cyberware
status: ingested
source: source.mm
printed_pages: '30-31,154'
pdf_pages: '30-31,155'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: Move-by-Wire — SR3 bonus tables and Stress consequences
summary: Fictional tabletop game rules from FASA7126 Man & Machine Cyberware, FASA Corporation, 1999, SR3, printed pp30-31,154/PDF30-31,155.
effective: {status: current, source: source.mm, page: 30, basis: defines}
scope: {applies_to: ['characters with move-by-wire cyberware']}
resolution:
  summary: Apply rating bonuses, mandatory extra actions, accumulating Stress and conditional complications.
  inputs: [move-by-wire rating, elapsed time, Stress, Willpower]
  outputs: [attribute and initiative bonuses, extra actions, Stress, complications]
  steps: []
links: {uses: [rule.damage.stress-points, rule.damage.stress-test], affects: [], modified_by: [], interacts_with: [rule.initiative.initiative]}
sources:
  - {source: source.mm, pages: '30-31', relation: defines, note: Bonuses and automatic Stress tables and game effects}
  - {source: source.mm, page: 154, relation: defines, note: Purchase rows}
notes: []
data:
  bonuses:
    - {rating: 1, quickness: 1, reaction: 2, initiative_d6: 1, athletics_dice: 1, stealth_dice: 1, stress_interval_months: 6}
    - {rating: 2, quickness: 2, reaction: 4, initiative_d6: 2, athletics_dice: 2, stealth_dice: 2, stress_interval_months: 4}
    - {rating: 3, quickness: 3, reaction: 6, initiative_d6: 3, athletics_dice: 3, stealth_dice: 3, stress_interval_months: 2}
    - {rating: 4, quickness: 4, reaction: 8, initiative_d6: 4, athletics_dice: 4, stealth_dice: 4, stress_interval_months: 1}
  quickness_bonus_counts_for_reaction: false
  extra_actions:
    rating_3: [end of first Initiative Pass]
    rating_4: [end of first Initiative Pass, end of second Initiative Pass]
    mandatory: true
    held_action_expiry: beginning of character's next Combat Phase
    subsequent_initiative_pass: subtract 10 normally
  incompatibility: other Reaction or Initiative enhancing cyberware or bioware
  reflex_trigger_allowed: false
  can_turn_off: false
  stress:
    points_per_interval: 1
    stress_test_required: true
    applies_to: [Quickness, Reaction]
    removal: therapeutic surgery only
  tle_x:
    trigger: each time character takes Stress
    test: {attribute: unaugmented Willpower, tn_formula: rating x 2}
    failure: TLE-x
    important_social_situations: {charisma_modifier: -1, charisma_based_skills_modifier: -1}
    dangerous_or_tactically_crucial_at_gm_discretion: {perception_tn_modifier: 2, initiative_modifier: -2, reaction_modifier: '-1D6'}
    treatment: {procedure: Correct Failure therapeutic surgery, base_tn: 8, second_surgery_tn_modifier: 2, maximum_procedures: 2, permanent_afterwards: true}
    chronic_cases: GM may reduce Social Skills and Charisma for further complications.
    acute_seizure:
      condition: Moderate or worse wound while in combat or other conflict
      test: {attribute: Willpower, tn: 6}
      failure_damage: 6M
      seizure_duration_combat_turns: 1D6 x 10
      subsequent_unconsciousness_minutes: fresh 1D6 x 10
  ccss:
    trigger: Move-by-Wire fails or Quickness or Reaction fails in part due to Stress
    test: {attribute: unaugmented Willpower, tn_formula: rating x 2}
    failure: catastrophic clonic seizure syndrome
    effects: involuntary functions continue; voluntary action unavailable and awareness severely limited
    implant: permanently dysfunctional and must be removed
    long_term: GM may reduce Quickness, Intelligence and/or Willpower; full recovery possible but severe lasting impairment also possible.
  purchase_rows:
    - {rating: 1, essence: 2.5, cost_nuyen: 250000, availability: '8/10 days', street_index: 2.5, legality: 3P-CC}
    - {rating: 2, essence: 4, cost_nuyen: 500000, availability: '12/20 days', street_index: 3, legality: 3P-CC}
    - {rating: 3, essence: 5.5, cost_nuyen: 1000000, availability: '18/30 days', street_index: 3, legality: 3P-CC}
    - {rating: 4, essence: 7, cost_nuyen: 2000000, availability: '20/45 days', street_index: 3.5, legality: 3P-CC}
