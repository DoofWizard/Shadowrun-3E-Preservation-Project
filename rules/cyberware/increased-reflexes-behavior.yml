headline: Effects of Increased Reflexes
summary: FASA7126 Man & Machine, FASA Corporation (1999), Shadowrun Third Edition tabletop RPG, printed and PDF p45.
effective: {status: current, source: source.mm, page: 45, basis: extends}
scope:
  applies_to: [characters with wired reflexes or other cybernetic reflex enhancements]
resolution:
  summary: The GM may invoke a Perception Test when a reflex-enhanced character perceives a threat, including a mistaken threat.
  inputs: [Perception, Initiative enhancement, situation]
  outputs: [possible involuntary response]
  steps:
    - At GM discretion, make a Perception Test in a perceived-threat situation.
    - Increase its target number by 1 for each extra 1D6 of Initiative bonus.
    - Failure produces a reflexive response chosen by the GM.
    - For a particularly destructive response, the character may make a Willpower Test against the original unmodified Perception target number to prevent the action.
data:
  initiative_bonus_die_TN_modifier: 1
  willpower_test_TN: unmodified Perception Test target number
  use_frequency: sparingly at GM discretion
  example_triggers: [unexpected stranger, sudden threatening motion, violent motion in a crowd]
  possible_responses: [take cover, push a suddenly moving person down, draw and fire a gun]
