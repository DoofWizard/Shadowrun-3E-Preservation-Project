headline: FASA Corporation Shadowrun Third Edition FASA7001 fictional datajack interface
  and headware-memory access conditions, printed p298/PDF307
summary: The original Third Edition tabletop rulebook describes fictional datajack
  inputs/outputs, access to headware memory, and separate knowsoft, datasoft, and
  activesoft prerequisites. Previously accepted chip, skillwire and market rules are
  reused without duplication.
