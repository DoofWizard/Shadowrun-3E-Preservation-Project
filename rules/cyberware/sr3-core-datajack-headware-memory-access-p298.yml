    publication_kind: published fictional cyberpunk tabletop role-playing game
  source_heading: Street Gear / Headware / Datajack
  original_fictional_game_rules:
    input_output_scope: The book permits standard datajacks to input or output data
      to compatible fictional cyberware and equipped devices.
    named_equipped_devices:
    - cyberdecks
    - remote-control decks
    - vehicles with datajack ports
    direct_interface_result: With the requisite game-device port, the character may
      mentally interface with the named gear to manipulate it or issue commands; this
      paragraph does not specify a new universal Test, target number or action cost.
    headware_memory_access: A datajack permits the character to mentally access compatible
      implanted headware memory.
    software_download_to_memory: The source permits the contents of fictional software
      chips to be downloaded through the datajack into headware memory.
    knowsoft_condition: A knowsoft cannot be accessed through a datajack without a
      knowsoft link.
    datasoft_condition: A datasoft cannot be accessed without an available display
      link or image link.
    activesoft_condition: An activesoft cannot be accessed without installed skillwires.
    incoming_data_output: Data arriving through a datajack from an equipped fictional
      system may in turn be directed to a display link, image link, or headware memory.
    implant_position: The source describes common implant positions for deckers and
      riggers as fictional character-design context; it does not prescribe a new mandatory
      location, modifier, or character-creation limitation.
