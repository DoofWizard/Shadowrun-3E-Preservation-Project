scope: {applies_to: ["optiscan links and compatible optical devices"]}
resolution:
  summary: "An optical scanning link transfers data through an infrared optical beam rather than radio. It requires line of sight, is disrupted by obscurants, and can link to compatible datajack or external optical devices through the required interface."
  inputs: ["line of sight", "compatible transmitter/receiver", "environmental obscurants"]
  outputs: ["successful or failed optical data link"]
