id: rule.cyberware.mm-essence-distinction-p7
record_type: rule
status: source_reviewed
source: source.mm
printed_pages: '7'
pdf_pages: '7'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7126 Man & Machine — Essence distinctions for implants and injury
summary: FASA Corporation, 1999, Man & Machine Cyberware, fictional Shadowrun Third Edition tabletop RPG, printed p7/PDF7; the developer's stated game-rule distinctions, not real-world medical claims.
data:
  ordinary_surgery:
    incision_or_removal_of_damaged_body_part_alone_causes_essence_loss: false
    like_for_like_flesh_replacement_causes_essence_loss: false
    ordinary_non_neural_implants_cause_essence_loss: false
    examples: [bone pins, hip replacements, pacemakers]
  cyberware:
    essence_loss_on_implantation: true
    amount_varies_by_grade: true
    distinguishing_feature: non-natural implant connected to neural pathways and communicating with the brain
  other_causes:
    can_cause_essence_loss: [Deadly wound, incompetent medical care, addiction]
    qualification: Not all surgery or injury causes Essence loss; apply the specific game rules for these events.
  other_augmentations:
    bioware_essence_loss: false
    nanites_essence_loss: false
    qualification: These statements address bioware and nanites themselves, not the Essence cost of associated cyberware.
