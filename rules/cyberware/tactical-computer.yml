resolution:
  summary: "A tactical computer combines multiple sensory inputs and tactical software to improve combat decision-making. Each sense requires a dedicated or generic input port and an appropriate tactical-sense program. Every two usable senses increase the tactical rating, which can provide Combat Pool dice and Small Unit Tactics benefits subject to the source's limits."
