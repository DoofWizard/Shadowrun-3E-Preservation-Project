printed_pages: '11-12,14'
pdf_pages: '11-12,14'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7126 Man & Machine — cyberware classification and power-source distinctions
summary: Source-specific category and operating-power reference for the fictional Shadowrun Third Edition tabletop RPG, FASA Corporation, 1999, Man & Machine Cyberware, printed/PDF pp11-12 and explicit p14 exception.
data:
  classification:
    basis: location and function
    categories: [headware, bodyware, cyberlimbs]
    headware:
      criterion: installed in the head
      subcategories: [senseware, matrixware, riggerware, communications, brainware]
      senseware: [eye modifications, ear modifications, nasal modifications, chemical analyzers, weapons installed in sensory openings]
      senseware_multiple_options_in_one_procedure: true
      matrixware_primary_examples: [datajacks, cerebral cyberdecks]
      riggerware: rigger remote control deck and access in a cranial interface
      communications_examples: [radio, telephone]
      brainware: miscellaneous headware including memory, advanced processors and tooth compartments
    bodyware:
      criterion: cyberware outside the head, apart from the separate cyberlimb classification
      includes: [central nervous system messaging devices, move-by-wire, wired reflexes, bone restructuring, body plating, cybertorsos, devices installed in cyberlimbs]
    cyberlimbs:
      distinct_classification: true
      reason: many different devices can be incorporated into a limb
      storage_compartments_possible: true
      essence_cost_context: high due to neural connections to the brain
  power_sources:
    normal_supply: neural bioelectricity from the body
    redistribution: fictional conductive neural pathways maintained by nanotechnology transfer power within the body
    essence_hypothesis: The narrator reports that some fictional researchers hypothesize a connection between altered biochemistry from power redistribution and Essence reduction; no additional numeric modifier is established.
    exception: The basic eye laser system on p14 explicitly uses rechargeable batteries; do not infer that every cyberware accessory is battery-free.
  numeric_effects_added_by_this_context: false
