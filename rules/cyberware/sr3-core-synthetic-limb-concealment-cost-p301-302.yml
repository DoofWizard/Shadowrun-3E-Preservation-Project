  section: Street Gear / Cyberware / Cyberlimbs / synthetic cyberlimb concealment
    and modification pricing
  source_descriptions:
    limb_appearances: The original game describes an obvious metal-looking prosthesis
      and a more natural-looking synthetic cyberlimb as distinct styles.
    modification_qualification: Obvious cyberlimbs can be enhanced openly, whereas
      added modifications to synthetic limbs are harder to conceal; the source provides
      distinct concealment and cost consequences.
    social_interaction: The printed p301 paragraph refers cyberware visibility and
      social reaction to its separately published Cyberware and Social Interaction
      rules (p93), not to a new universal social modifier in this subsection.
  synthetic_cyberlimb_concealment:
    base_rating_reference: The accepted original printed p303/PDF312 LIMBS market
      table independently lists Concealability 8 for a Synthetic Cyberarm/Leg; that
      numeric market row is reused without resubmission.
    clothing_bonus_to_concealability: 3
    clothing_bonus_sign: +
    clothing_condition: The source adds 3 to a synthetic cyberlimb's Concealability
      Rating when the limb is covered by clothing.
    installed_modifications: The original states that implants can modify the synthetic
      limb's Concealability; this p301 passage does not supply a single universal
      numeric penalty for every implant.
    exclusion: The +3 clothing bonus is not asserted for an obvious cyberlimb lacking
      a Concealability Rating or as a universal modifier to other implanted equipment.
  synthetic_cyberlimb_upgrade_price:
    increase_percent_of_listed_modification_price: 50
    cost_multiplier: '1.5'
    application: Each modification added to a synthetic cyberlimb costs its normally
      listed amount plus 50 percent of that listed modification cost.
    scope: The printed wording refers to modifications to such a synthetic cyberlimb;
      it does not add a second surcharge to the base price of every synthetic limb
      or to an unrelated obvious limb.
  source_relationships:
  - equipment/sr3-core-cyberware-bone-lacing-reflexes-limbs-p303.yml (accepted original
    cyberlimb base-market ratings and costs; not resubmitted)
  - rules/cyberware/sr3-core-cyberlimb-mechanics-p303.yml (accepted original Strength,
    Body and integrated-device conditions; not resubmitted)
  - Original source printed p93 Cyberware and Social Interaction (separate visibility/social
    rule; no new numeric modifier asserted here)
  source_review:
    original_source_evidence: Independently reviewed the freshly reacquired original
      FASA7001 345-page PDF with SHA256 matching the live SR3.yml manifest; printed
      p301 is physical PDF310, lower-right Cyberlimbs paragraph, and its immediate
      printed p302/PDF311 upper-left continuation.
    exact_source_condition: Printed p301 provides +3 Concealability while wearing
      clothing over a synthetic cyberlimb; printed p302 completes that sentence and
      applies a 50-percent listed-price increase to modifications to such a limb.
    independent_existing_canon_reuse: Verified accepted p303 cyberlimb rules and printed-market
      table separately; they already preserve racial Strength and other implant effects,
      but not these p301-302 clothing and synthetic-modification cost conditions.
