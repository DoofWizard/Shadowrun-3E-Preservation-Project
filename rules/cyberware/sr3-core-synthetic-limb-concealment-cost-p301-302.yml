    editorial_distinctions: The report describes original fictional tabletop equipment
      and source-narrated social effects in third person, distinguishing overt cyberware
      from synthetic concealability and preserving the source's conditions and positive
      numeric signs.
    completion_limit: This independent local review covers the specified synthetic-limb
      subsections and their already accepted market dependencies, not the entire Cyberware
      chapter or an executed game engine.
headline: FASA Corporation Shadowrun, Third Edition (FASA7001) fictional tabletop
  synthetic-cyberlimb clothing Concealability +3 and modification-cost +50%, original
  printed pp301-302/PDF310-311
summary: 'Original FASA7001 published tabletop Cyberlimbs subsection: clothing adds
  +3 to a synthetic limb’s Concealability, and each modification to such a limb costs
  50 percent above its listed price; previously accepted original p303 market and
  Strength/Body records remain unchanged.'
