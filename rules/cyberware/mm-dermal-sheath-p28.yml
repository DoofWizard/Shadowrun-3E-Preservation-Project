  ruthenium_sheath:
    effects_reference: Man & Machine p114 ruthenium polymers
    logic_circuits_DNI_equipped: true
    change_coloration_by_mental_command_action: Simple
    display_linked_text_or_images: true
    imaging_scanner_connections: [implanted, external linked by datajack]
    purchase_modifier:
      essence: 0.2
      cost_nuyen: 150000
      availability: '+2/+4 days'
      street_index: 0.25
      legality: '4P-N'
      concealability: '—'
  implanted_image_scanner_each:
    purchase_modifier:
      essence: 0.05
      cost_nuyen: 8000
      availability: '—'
      street_index: '—'
      legality: '—'
      concealability: '—'
  purchase_modifier_basis: The plus signs on the option rows identify additions to the relevant sheath statistics; no numerical value is inferred from a dash.
