    mechanic: Non-elven Druids who manipulate Background Count energies along a Tír
      cairn line use the same Path Magic rules as elven Druid Followers, referenced
      to p134.
    ogam_stones: Non-elven Druids lack formal magical orders; therefore, they cannot
      create ogam stones.
    otherwise: Use the standard Druid rules in Grimoire II and London Sourcebook.
