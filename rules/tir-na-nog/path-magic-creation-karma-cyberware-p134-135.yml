data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: Historical original/Second Edition-compatible; no inferred Third Edition
      conversion
    source_pdf_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: 134-135
    physical_pdf_pages: 143-144
  source_context: Fictional Shadowrun-setting material from a published tabletop RPG.
    Distinguish book-narrator descriptions, in-world speakers’ allegations and speculation;
    no claims about real contemporary Belfast.
  edition_and_system: Historically modifies Shadowrun Second Edition (SRII) and Grimoire
    Second Edition, NOT SR3. Path magic blends shamantic and hermetic approaches for
    dedicated Followers of a Path. Source claims its powers closely tie to Tír na
    nÓg; Druids may employ Tír cairn lines.
  player_character_eligibility:
    allowed_player_paths:
    - Path of the Warrior
    - Path of the Steward
    - Path of the Bard
    - Path of the Druid
    righ: The spiritually most advanced Path of the Rígh cannot be held by a player
      character in the original text.
    order_requirement: The Follower only gains initiation grades with assistance of
      the associated magical order; independent traitor runner risks consequences.
  essence_and_cyberware:
    all_tir_elven_characters_minimum_essence_after_cyberware: 1.5
    warrior_follower_minimum_essence_after_cyberware: 2.0
    restriction: No allowed implanted cyberware may reduce Essence below the applicable
      minimum. Applies also to dissident Tír elves; stricter standard archetype rules
      remain possible.
    cultural_preference: Original Tír elven source favors least-invasive augmentations
      such as boosted over wired reflexes.
  path_core_advancement:
    scope: Path Core Skills and Attributes differ by Path. Basic SRII character creation
      applies until character’s initiation in the appropriate magical order.
    cost: Actual Karma required for improving a Path Core Skill or Attribute is one-half
      the standard Karma cost, rounding DOWN.
    recommended_minimum_share_of_good_karma_percent: 70
    recommended_minimum_qualifier: Gamemaster may allow occasional exceptions for
      costly magical operations, foci or allies.
    skill_subspecializations: Follower may buy only one specialization or concentration
      per Path Core Skill at reduced Karma price.
    non_path_core_advancement: A Follower may improve a non-Path-Core Skill or Attribute
      but pays 1 ADDITIONAL Karma Point above the normal standard Shadowrun cost.
    upper_limits: Source states no general final cap on Path Core improvements other
      than gamemaster judgment.
  skillwires_and_attribute_enhancement:
    skillwires: A Follower may not use skillwires to simulate Path Core Skills.
    druids: Druid Path members eschew all cyberware under the rule’s general statement.
    other_followers: Followers may take certain muscle/reflex/body augmentations,
      e.g. Warriors’ rangfinders or eye modifications, but no Path Core Skill may
      be cybernetically boosted.
    path_core_attribute: Artificial enhancements are allowed for Path Core Attributes,
      but Good Karma development of UNaugmented ratings remains required.
  karma_award_modifier:
    trigger: Gamemaster judges a Follower to have acted to further the chosen Path’s
      goals.
    increase_percent: 25
    rounding: Round fractional increases UP.
    examples: Warrior may gain extra Karma through combat; Druid may receive extra
      Karma for increasing wisdom/knowledge; strictly subject to GM judgment.
  general_categories: Some Paths allow magical or physical adepts; metamagic from
    Grimoire II, school-specific bonus dice and penalties, spells and initiations
    receive later path modifications.
