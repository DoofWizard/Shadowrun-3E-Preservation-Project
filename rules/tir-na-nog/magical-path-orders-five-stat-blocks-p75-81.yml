  scope: Exact historical stat-box transcription of the five fictional Danaan magical
    orders. Estimates, membership limits, ritual strictures and source cross-references
    are sourcebook mechanics, not factual claims about real organizations.
  five_order_stat_blocks:
    Order of Cu Chulainn:
      printed_page: 76
      pdf_page: 85
      type: Dedicated
      members:
        follower_mages: 415
        follower_adepts: 300
        others: 120
        qualification: Insufficient data; estimates, not verified membership counts.
      highest_known_initiate_grade: 10
      strictures:
        attendance: Compulsory at sacred dates.
        belief: Shared belief system (warlike and aggressive).
        exclusive_membership: Applies to Followers only.
        exclusive_ritual: Yes.
        fraternity: Yes.
        karma: Special rules apply to individual Karma for Followers; see Path Magic,
          p. 135.
        obedience: Absolute for Followers, strongly emphasized for others.
        secrecy: Most people suspect a hermetic combat order in TRC, but members neither
          admit nor deny it.
      group_strictures:
        limited_membership: Elves only; higher-grade initiates screen applicants for
          affinity with Northern Way and Warrior Path.
        material_link: DNA sample required from Followers; optional for other members.
        oath: Required.
        group_resources: Luxury; special access to high-tech weaponry.
        patron: Danaan Families, especially northern-based.
    Order of Etain:
      printed_page: 77
      pdf_page: 86
      type: Initiatory; Dedicated for Followers
      members:
        follower_mages: 450
        follower_adepts: 400
        others: 225
        qualification: Insufficient data; estimates.
      highest_known_initiate_grade: 10
      strictures:
        attendance: Compulsory at sacred dates.
        belief: Shared belief system (worldly, commercial).
        exclusive_membership: Applies to Followers only.
        exclusive_ritual: No.
        fraternity: Part of initial oath-taking, but subject to creative interpretation.
        karma: Special rules apply to individual Karma for Followers; see Path Magic,
          p. 135.
        obedience: Only for major matters.
        secrecy: Yes; business influence recognized but hermetic order not suspected;
          members deny the group exists.
      group_strictures:
        limited_membership: Elves only; higher-grade initiates screen applicants for
          affinity with Eastern Way.
        material_link: None required.
        oath: Required, flexible in application.
        group_resources: Luxury; special access to communication systems and commercially
          sensitive data concerning foreign companies.
        patron: Danaan Families, especially eastern-based.
    Order of Brigid:
      printed_page: 78
      pdf_page: 87
      type: Initiatory; Dedicated for Followers
      members:
        follower_mages: 300
        follower_adepts: 190
        others: 80
        qualification: Insufficient data; estimates.
      highest_known_initiate_grade: 10
      strictures:
        attendance: Compulsory at sacred dates.
        belief: Shared belief system (cultural continuity and development).
        exclusive_membership: Applies to Followers only.
        exclusive_ritual: Yes.
        fraternity: Yes; part of oath-taking on initiation.
        karma: Special rules apply to individual Karma for Followers; see Path Magic,
          p. 135.
        obedience: Does not apply because of Bardic creativity.
        secrecy: No; initiates often use magic openly, and people may know the order
          exists without formal recognition.
      group_strictures:
        limited_membership: Elves only; higher-grade initiates screen for affinity
          to the Southern Way.
        material_link: DNA sample required from Followers; optional for others.
        oath: Required.
        group_resources: Luxury; access to instruments, sculpture/painting supplies,
          art archives, photographic materials.
        patron: Danaan Families, especially southern-based.
    Order of Ogma:
      printed_page: 80
      pdf_page: 89
      type: Initiatory/Dedicated
      members:
        follower_mages: 220
        others: 400
        qualification: Insufficient data; estimates; source box does not enumerate
          a separate Follower-adepts count.
      highest_known_initiate_grade: 10
      strictures:
        attendance: Compulsory at all five sacred dates.
        belief: Shared belief system (scholarship, morals, guardianship).
        exclusive_membership: Yes.
        exclusive_ritual: Yes.
        fraternity: Yes; part of oath-taking on initiation.
        karma: Special rules apply to individual Karma for Followers; see Path Magic,
          p. 135.
        obedience: Absolute for Followers, strongly emphasized for others.
        secrecy: No; publicly recognized and well regarded for environmental protection
          and educational work.
      group_strictures:
        limited_membership: Elves only; higher-grade initiates screen for affinity
          with Western Way.
        material_link: DNA sample required from Followers; optional for others.
        oath: Required.
        group_resources: Middle to Luxury; the order may request resources from other
          members though many live ascetically.
        patron: Danaan Families, especially western-based.
    Order of the Sun, Moon, and Stars:
      printed_page: 81
      pdf_page: 90
      type: Initiatory/Dedicated
      members:
        estimated: 28
        qualification: Exact number unknown; source gives an estimate.
      highest_known_initiate_grade: 9
      strictures:
        attendance: Compulsory at sacred date.
        belief: Shared belief system (transcendence, regal authority).
        exclusive_membership: Yes.
        exclusive_ritual: Yes.
        fraternity: Yes; part of oath-taking on initiation.
        karma: Special rules apply to individual Karma for Followers; printed cross-reference
          is Path Magic, p. xx., unresolved in this text.
        obedience: Absolute if demanded by the highest-grade initiate.
        secrecy: Absolute, though other Danaan elves recognize a Rígh Follower by
          appearance.
      group_strictures:
        limited_membership: Elves reincarnated into Path of the Center.
        material_link: Yes (the box does not specify the form).
        oath: Required.
        group_resources: Luxury; the source claims the group can obtain whatever it
          requires.
        patron: All Danaan Families, especially central- and western-based.
  general_rule_context:
    path_requirements: The source describes Followers as joining a magical order and
      being able to advance initiation. Only adepts follow the Warrior Path, while
      the Rígh Path uses mages rather than adepts.
    grade_0: Warrior order narrative identifies Grade 0 as the result of a successful
      first ordeal; other group grades are not converted or inferred.
    gamemaster_note: The page-81 GM note refers readers to Path Magic, starting p134,
      under Game Information, for creation, advancement and special abilities of characters
      who follow the Ways and Paths. Those later rules are not claimed to have been
      extracted here.
    do_not_modernize: All listed figures and cross-references are from 1993 historical
      original/Second Edition-compatible source, not rewritten for SR3.
  forward_status: Reviewed forward only; Denver source blocks the authoritative next-source
    transition.
