data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: Historical original/Second Edition-compatible; no inferred Third Edition
      conversion
    source_pdf_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: 138-139
    physical_pdf_pages: 147-148
  source_context: Fictional Shadowrun-setting material from a published tabletop RPG.
    Distinguish book-narrator descriptions, in-world speakers’ allegations and speculation;
    no claims about real contemporary Belfast.
  eligibility: Full magicians ONLY; Path of the Rígh player character prohibited by
    general character-creation restriction on p134.
  path_core_skills:
  - Armed Combat
  - Etiquette (Elven)
  - History (Ireland/Tír)
  - Leadership
  - Magical Theory
  - Unarmed Combat
  - any 2 additional Combat Skills
  - any 2 Physical Skills
  - any 2 Knowledge Skills NOT related to combat
  path_core_attributes: ALL standard attributes
  attribute_rating_caps:
    most_attributes: Normal racial maximum +1
    charisma_maximum: 11
  initiation:
    order: Order of the Sun, Moon, and Stars
    initial_grade: 0
    path_core_magic_skills:
    - Conjuring
    - Sorcery
    - Enchanting
    magic_attribute: Increase Magic Attribute by +1 at EVERY grade of initiation,
      INCLUDING Grade 0.
  metamagic:
    anchoring_any_spell:
      target_number_modifier: -1
      drain_level_modifier: -1
    dispelling: Decrease target number for ALL Dispelling attempts made by Rígh initiate
      by -2.
  geas_restriction: A Rígh never accepts a geas restricting ANY spell.
  ritual_sorcery: Order of the Sun, Moon, and Stars initiation decreases target numbers
    for ALL stages of ritual sorcery by -1; additionally each such initiate receives
    +1 Bonus die for Drain Resistance Tests.
  bonus_dice_cases:
  - dice: 4
    when: whenever resisting and/or casting ALL spells
  - dice: 1
    when: resisting and casting spells in province of Meath
  - dice: 1
    when: resisting or casting spells per EVERY 2 grades initiation
  dice_penalties: None for this Path.
  cross_references: Additional Magic Rules Enchanting p141 and Magical Beings p143.
