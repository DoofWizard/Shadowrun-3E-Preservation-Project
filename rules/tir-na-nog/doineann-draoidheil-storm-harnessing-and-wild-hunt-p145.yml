  source_context: Fictional Shadowrun sourcebook, FASA Corporation 1993; original/Second
    Edition-compatible mechanics; speaker claims and GM options identified as such.
  storms:
    fictional_definition: Doineann draoidheil are persistent magical-energy storms
      at mapped Tir locations; they interfere with magic in the setting.
    force_modifier: The storm’s Force Rating increases target numbers for ALL magical
      operations inside the storm by that amount.
    scale: Narrator describes storm radii from a few hundred yards to about five miles;
      exact locations and Force ratings are in the original sourcebook’s map.
    storm_fluctuation: Gamemaster uses lunar cycle principles; Force values on the
      map are base ratings.
    control_eligibility: Only initiates of Order of the Sun, Moon, and Stars can attempt
      to control a storm.
    control_test: Magic Test target number = 2 × storm Force Rating, reduced by 1
      per 2 initiation grades, rounding fractional reductions UP.
    failure: An unsuccessful Magic Test causes 9D Drain.
    success: A successful test avoids immediate Drain and permits temporary energy-harnessing.
    bonus_amount: The controlling player rolls 1 die for each Magic Test success and
      subtracts 1 from each die result; sum, capped at storm Force Rating, is added
      as bonus dice to Magic Pool (usable for magical or astral operations).
    duration_roll: Gamemaster rolls 1 die per Magic Test success, subtracts 1 from
      each die result and sums for duration in minutes.
    bonus_time_table:
    - test_successes: 0
      information: No information
    - test_successes: 1
      information: Estimate accurate within 50 percent
    - test_successes: 2
      information: Estimate accurate within 25 percent
    - test_successes: 3+
      information: Estimate exact
    release: After using the storm’s power, initiates suffer 9D Drain when relinquishing
      control; resist under standard Shadowrun rules.
    source_note: The gamemaster may adjust individual Force ratings by 50 percent
      or more for planetary conjunctions, powerful spirits, ritual events, or the
      Wild Hunt.
  wild_hunt:
    fictional_setting: Described as exceptionally powerful forces associated with
      the paranormal animals of Europe; not an established real-world phenomenon.
    eligibility: Only the most powerful initiates of Order of the Sun, Moon, and Stars
      may possibly command it, with permission of Lady Brane Deigh and the Seelie
      Court.
    rules_status: Original publication provides NO formal rules for raising or commanding
      the Wild Hunt; exact play handling is at the gamemaster’s discretion.
    campaign_guidance: The book associates major Wild Hunt events with large ritual/legendary
      developments rather than an ordinary single adventure.
