data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: Historical original/Second Edition-compatible; no inferred Third Edition
      conversion
    source_pdf_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: '138'
    physical_pdf_pages: '147'
  source_context: Fictional Shadowrun-setting material from a published tabletop RPG.
    Distinguish book-narrator descriptions, in-world speakers’ allegations and speculation;
    no claims about real contemporary Belfast.
  eligibility: Any kind of magician or magical adept. Path of the Druid is not restricted
    to elves in the Game Information introduction.
  path_core_skills:
  - Negotiation WITHOUT Concentration or Specialization
  - any 12 Knowledge Skills
  - any 4 Physical Skills
  development_exception: A Druid may not increase Negotiation until gaining wisdom
    and knowledge through developing other Skills; GM exercises judgment. Astrology
    or astronomy suggested as Knowledge Skills.
  path_core_attributes:
  - Charisma
  - Willpower
  initiation:
    order: Order of Ogma
    initial_grade: 0
    extra_core_skills: Magicians and adepts gain Conjuring and/or Sorcery on initiation,
      at GM discretion. Full magicians also gain Enchanting as a Path Core Skill.
  metamagic:
    anchored_illusion:
      target_number_modifier: -1
      drain_level_modifier: -1
    anchored_combat:
      target_number_modifier: 1
      drain_level_modifier: 1
    masking_auras: For anyone assensing a masked Druid, increase target number of
      that player character’s Success Test by +2.
  other_magic:
    geas: Never accepts geas restricting illusion spells.
    rural_outdoor_invisibility: When an Order of Ogma Druid initiate casts Invisibility
      on another Druid in a rural outdoor area, add +2 TN to ANY Perception Test to
      detect the subject.
    cross_references: Enchanting p141 and Magical Beings p143 of Additional Magic
      Rules.
  bonus_dice_cases:
  - dice: 1
    when: resisting or casting illusion spells
  - dice: 1
    when: resisting or casting illusion spells in Connaught
  - dice: 1
    when: resisting or casting illusion spells on or in water
  - dice: 1
    when: resisting or casting illusion spells in autumn
  - dice: 1
    when: resisting or casting illusion spells within 72 hours of Samhain (November
      2)
  - dice: 1
    when: resisting or casting illusion spells per EVERY 2 grades of initiation
  combat_spell_penalties:
    dice_lost_when_casting_combat_spells: 2
    dice_lost_when_resisting_combat_spells: 3
    mitigation: Willpower Test against TN 10 minus half initiation grade (ROUND DOWN);
      EVERY 2 successes restore 1 penalty die.
    additional_test_target_number_if_underground_or_surrounded_by_rock: 2
    bonus_dice_from_test: 0
framing: reference_exact
