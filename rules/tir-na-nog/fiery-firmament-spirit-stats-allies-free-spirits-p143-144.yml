data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition_scope: FASA Corporation Tir na nÓg (1993), historical Shadowrun original/Second
      Edition-compatible mechanics; no inferred Third Edition conversion
    source_pdf_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: 143-144
    physical_pdf_pages: 152-153
  source_context: Fictional Shadowrun sourcebook, FASA Corporation 1993; original/Second
    Edition-compatible mechanics; speaker claims and GM options identified as such.
  fictional_spirit_background: Bards claim affinity with solar-fire spirits of the
    Great Fiery Firmament; the book notes other Sixth World magicians dispute their
    elemental origin. The Tir researchers report no metaplanar home yet identified.
  types:
  - type: Latent Fire Spirit
    attributes:
      B: F + 2
      Q: (F + 2) × 5
      S: F - 2
      C: F
      I: F
      W: F
      E: F(A)
      R: F
    powers:
    - Accident
    - Engulf
    - Flame Aura
    - Flame Projection
    - Guard
    - Movement
    - Psychokinesis
    domain: Within or beside hot objects and/or places
  - type: Manifest Fire Spirit
    attributes:
      B: F + 4
      Q: (F + 3) × 5
      S: F + 4
      C: F
      I: F
      W: F
      E: F(A)
      R: F + 2
    powers:
    - Accident
    - Engulf
    - Enhanced Movement
    - Flame Aura
    - Flame Projection
    - Guard
    - Movement
    - Noxious Breath
    - Psychokinesis
    domain: Volcanoes, raging fires, firestorms, forest fires, and so on
  allies:
    general: Tir hermetics rarely create allies; the book attributes this to objections
      to controlling spirits.
    exception: Initiates of the Order of the Sun, Moon, and Stars create ally guardians
      for ritual sorcery and similar activities.
    time_karma_multiplier: Use at most 90 percent of standard Shadowrun creation cost
      and time, less 5 percentage points per initiation grade.
    lower_bound: Neither time nor Karma cost may fall below 50 percent of the corresponding
      standard Grimoire II p70–72 values.
    banish_opponent: Banishment attempts by magicians outside the Sun, Moon, and Stars
      order receive +2 to every normal target number.
    banish_order_member: Members of the originating order use standard target numbers
      per Grimoire II p72.
  free_spirits:
    karma_gift: Initiates giving Karma to free spirits add a 25 percent bonus; fractional
      bonus amounts greater than 0.5 round up, and those less than 0.5 round down.
    printed_example: Giving 7 Karma Points counts as 9 (7 × 1.25 = 8.75, rounded up).
    binding: The fictional Tir magicians do not bind free spirits.
    fictional_roles: Free spirits are described as art contributors, guardians or
      messengers; sometimes used to affect rivals or disrupt magical reconnaissance.
