  rule_source: The fictional tabletop RPG sourcebook describes a magically active
    Danaan elf’s Giving of Honour in the Walking the Paths section, without giving
    a target number, dice pool, numeric modifier or ritual-duration requirement on
    this printed page.
  steps_and_conditions:
  - sequence: 1
    condition: An elf with magical aptitude Walking a Path undergoes the Giving of
      Honour as a personal oath to the Path at a family rite witnessed by elders.
  - sequence: 2
    condition: After Giving Honour, the elf may be initiated into the magical group
      or order corresponding to that Path; the source uses permissive language, not
      an automatic transfer or compulsory induction.
  - sequence: 3
    effect: The source states that as an initiate the elf gains the ability to use
      metamagic. This is the exact permission described here, not an automatic allocation
      of a new metamagic technique, specific grade, cost, or target number.
  path_order: The Center (Rígh) Path is commonly last, but the source explicitly allows
    exceptions and does not prescribe a fixed order for the four cardinal Paths.
  edition_warning: This archival rule statement belongs to the historical 1993 original/Second
    Edition-compatible publication. It is not rewritten as an automatic Shadowrun
    Third Edition mechanic.
  forward_status: Independent source review only; pending prior Denver source recovery,
    no contiguous authorization or active-source rule change.
