  source_context: Fictional Shadowrun sourcebook, FASA Corporation 1993; original/Second
    Edition-compatible mechanics; speaker claims and GM options identified as such.
  source_presentation: Fictional Order of Ogma initiates use decorated pebbles as
    spell-specific foci or combined-purpose, higher-grade enchantments. This is historical
    tabletop-game magic, not real-world practice.
  spell_specific:
    qualities:
    - +1 die to Magic Pool when casting the stone’s specified spell type
    - +1 die when casting that spell type within 72 hours of an appropriate equinox
      date
    - +1 die to the user’s resistance against that spell type
    creation: An initiate may enchant one simple ogam stone for an individual in 7
      days at a cost of 6 Karma Points.
    recipient_constraint: The intended user must attend the final enchantment stages
      and provide approximately one-quarter pint of blood for the fictional ceremonial
      bond.
    specific_user_only: Only the individual for whom the stone was designed may use
      the enchanted item.
    bonding_cost: When the recipient later supplies blood as part of the fictional
      bonding rite, the bond costs the recipient 1 Karma Point.
    consequence: The ritual is described as a potential material link for ritual sorcery.
      Some Ogma initiates therefore receive few requests.
  general_purpose:
    design: Unique stacked power/spirit foci; use the stacking enchantment rules in
      Grimoire II pp26–27; halve required Karma cost and creation time.
    bonding_rule: Karma cost equals 1 per Rating Point of desired power-focus rating
      plus 1 per 2 Rating Points of spirit-focus rating; round fractional Karma up.
    printed_example:
      power_rating: 7
      spirit_rating: 5
      power_karma: 7
      spirit_karma_before_rounding: 2.5
      spirit_karma_after_rounding: 3
      total_karma: 10
    possession: Recipient’s blood bond is described as for simple stones, but the
      general-purpose stone costs rating-based Karma.
    spirit_ward: Initiates often make the stones to honor trusted recipients and ask
      friendly spirits to observe the stones during creation; spirits may help track
      stones.
    limit: A character can have at most one simple and one complex ogam stone at once.
