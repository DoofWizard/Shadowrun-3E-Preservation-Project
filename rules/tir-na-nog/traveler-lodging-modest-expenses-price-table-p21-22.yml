data:
  publication:
    title: Tír na nÓg
    publisher: FASA Corporation
    publication_year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: original/Second Edition-era Shadowrun setting source
    source_pdf_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: 21-22
    pdf_pages: 22-23
  section: WHAT DOES IT COST? / MODEST EXPENSES FOR ONE PERSON
  lodging_p21_narrator:
    typical_single_occupancy_room_per_night: £45–£80, meals excluded
    double_occupancy_adjustment: 50 percent more than the single-occupancy figure
    dublin_accommodation_adjustment: 25 percent higher than the quoted typical accommodation prices
    flathail_majestic_william_butler_yeats_suite: up to £5,000 per night; described as accommodating six
    budget_availability: Fewer cheap hostels/boarding houses; some university residences offered when vacant,
      generally booked early
    other_cost_context: Government taxation/subsidies influence prices; gasoline, car hire and taxis are relatively
      expensive in the fictional setting
    dublin_general_market_adjustment: 5–10 percent above other areas, as stated in p21 prose
    ulster_cost_variability: Narrator attributes unstable prices to unreliable supply, hoarding, speculation
      and price fixing
  table_p22:
    title: MODEST EXPENSES FOR ONE PERSON
    region_scope: Typical one-person visitor expenses outside Dublin in Tír, according to the 1993 fictional
      book
    dublin_table_adjustment: Capital generally 10–25 percent higher than listed, according to the accompanying
      p22 explanation (distinct from p21 general 5–10 percent figure)
    rows:
    - item: Moderate hotel room
      printed_cost: £60
    - item: Hotel breakfast, including tip
      printed_cost: £12
    - item: Lunch at moderate restaurant, including tip and half-bottle wine
      printed_cost: £25
    - item: Dinner at moderate restaurant, including tip and bottle of fine wine
      printed_cost: £60
    - item: Pint of Guinness
      printed_cost: £3
    - item: Double measure of average Irish whiskey
      printed_cost: £3.75
    - item: Sightseeing tour (whole morning or afternoon)
      printed_cost: £10
    - item: Nightclub membership, 7 days
      printed_cost: £80
    - item: Admission to museum or historic site
      printed_cost: £2.50–£8
    - item: Ticket to major sporting event (except All-Tír finals)
      printed_cost: £12–£30*
    - item: Car rental per day, including insurance
      printed_cost: £200**
    - item: Car rental per week, including insurance
      printed_cost: £600**
    - item: Gasoline, litre
      printed_cost: £4*
    - item: Taxi ride, per kilometre; add 10% tip to total fare
      printed_cost: £3.50
    - item: Pair of jeans
      printed_cost: £40–£60*
    - item: Pair of shoes, moderate quality
      printed_cost: £55
    - item: Pair of shoes, bespoke
      printed_cost: £300
    - item: Bribe for simple information (where to get what)
      printed_cost: £75
    - item: Bribe for sensitive information (who is doing what to whom and why)
      printed_cost: £750+
    - item: Simple sexual pleasures
      printed_cost: £120; subtract 10% in Dublin, 25% in Ulster
    - item: BTL chip
      printed_cost: £500+
    single_asterisk_note: Single asterisk marks government subsidy.
    double_asterisk_note: Double asterisk marks heavy taxes.
    medical_insurance_note: Analyzer comments there are no street prices; in-world government issuance only,
      not an ordinary table purchase.
  speaker_attribution_p21:
    analyzer: Opinion alleging government influence through the fictional national health service; not source-narrator
      fact
    traveler: Reports erratic amenities at the Majestic hotel; attributed personal account, not universal description
    sinead_f: Alleges government surveillance of hotel phone lines; attributed allegation, not narrator confirmation
  scope: Historical fictional tabletop RPG source prices, not contemporary Irish prices, commercial advice
    or modern Shadowrun rules.
