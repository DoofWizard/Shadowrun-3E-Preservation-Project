  veil:
    fictional_defense: Surrounds the Tir; source attributes design to advanced magical
      engineering and reports a technological radar blanket, but describes its internal
      mechanism as unknown.
    distance_off_coast_km_range:
    - 12
    - 18
    height_above_sea_level_meters_approx: 20
    area_extent_meters_range:
    - 400
    - 600
    affected_entities: Sentient creatures entering the affected zone, plus some electronic
      sensor/automatic guidance systems.
    mechanical_spell_equivalence: Chaotic World spell with variable Force each Combat
      Turn.
    force_range:
    - 4
    - 9
    per_combat_turn_force_roll: roll one six-sided die and add 3
    movement: Affected beings drift away from their desired direction, direction determined
      by gamemaster; sensor guidance is impaired.
    cannot_dispel: true
    unaffected_navigation: A simple compass remains unaffected.
    access: Official ferry corridors through Veil are approximately 2 km wide and
      patrolled by naval security checking arrivals/departures.
  cairn_lines:
    source_cross_reference: Tir Provinces p100; Grimoire II Background Count p89.
    typical_background_count_min: 1
    typical_background_count_max: 4
    druid_path_casting_bonus: Druid Follower standing on cairn line receives bonus
      dice equal to current Background Count, added to Magic Pool for spellcasting.
    druid_ritual_enchanting_target_number_reduction: Subtract half the Background
      Count, rounding fractional halves UP, from target numbers for all ritual sorcery
      and enchanting tests on a cairn line.
    fluctuations: The current count may vary with celestial cycles. Typical map values
      are not constant.
    samhain_surge:
      date: around dawn of Samhain, November 2
      background_increase_points_range:
      - 2
      - 5
      duration_hours: 12
    great_cairn_line:
      base_background_count: 3
      samhain_dawn_background_count: 5
    newgrange:
      base_background_count: 4
      rises_to: 5
      holiday: Alban Arthuan (winter solstice)
      days_before: 4
      days_after: 4
    gamemaster_discretion: May add lesser lines with BC 1 or 2 and set static or dynamic
      additional sites, sometimes up to 4.
