    GM scenarios distinguished from book-narrator facts.
  scope: Exact historical Second Edition-compatible fictional Druid totem-specific
    modifiers, not generic SR3 conversions.
  boar:
    favored_environment: Sacred sites and thick forests
    advantages:
      combat_spell_dice_bonus: 2
      extra_services_from_summoned_spirit_for_combat: 1
    disadvantages: Gamemaster decides when Boar territory is invaded; Boar must attack
      without warning and continue until adversaries retreat, even when outnumbered.
      Subtract 2 dice when resisting illusion spells.
    resist_illusion_dice_modifier: -2
    narrator: Boar defends territory and sacred sites aggressively.
  bull:
    favored_environment: Anywhere in Tir countryside
    advantages:
      health_spell_dice_bonus: 2
      combat_spell_dice_bonus: 1
      detection_spell_dice_bonus: 1
    numeric_disadvantages: None in game statistics.
    character_creation_charisma_minimum: 4
    behavior_constraint: Bull cannot forget a slight or insult and ultimately must
      avenge perceived injustice.
    narrator: Warrior and leader associated with protecting close druids and organizing
      resistance to incursions.
  horse:
    favored_environment: Farmland, light woodland, rural areas near forests
    advantages:
      health_spell_dice_bonus: 2
      enhanced_movement_critter_power_uses_per_day: 3
      prairie_spirit_conjuring_dice_bonus: 2
    disadvantages: Horse avoids conflict but rejects promises or agreements severely
      restricting freedom; gamemaster must make repeated judgment calls for long-range
      plans. Subtract one die for resisting combat or illusion spells.
    resist_combat_spell_dice_modifier: -1
    resist_illusion_spell_dice_modifier: -1
    narrator: Horse represents freedom and fertility; description notes interactions
      with agricultural communities.
