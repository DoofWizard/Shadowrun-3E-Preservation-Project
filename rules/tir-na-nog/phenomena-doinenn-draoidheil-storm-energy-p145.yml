  magical_storms:
    terminology: doineann draoidheil, a permanent magical storm in the fictional setting
    force_rating: Each storm has a Force rating shown on back-of-book map; it changes
      over time and can have local regions of several miles, sometimes only one day.
    general_target_number_modifier: Add storm Force rating to target numbers for ALL
      magical operations within storm.
    world_cycle: Source recommends lunar cycles for fluctuations.
    eligible_order: Only initiates of the Order of the Sun, Moon and Stars may attempt
      to harness the storm.
    test: Magic Test against target number equal to 2 × storm Force, reduced by 1
      for each 2 initiation grades, rounding fractional grade-pairs UP.
    failure: On an unsuccessful Magic Test, initiate suffers 9D Drain.
    success: Successful initiate avoids this immediate storm damage and may gather
      energy.
    energy_roll: Roll one die for each Magic Test success, subtract 1 from each individual
      die result, then add results. The sum is capped at the storm Force rating.
    energy_bonus: Add dice equal to capped energy roll to the caster’s Magic Pool
      for magical or astral operations.
    duration: Roll one die per successful Magic Test success; subtract 1 from each;
      sum the results to obtain minutes before bonus ends.
    after_ending: Initiate suffers Drain of 9D when relinquishing this power, resisted
      by standard rules.
    estimate_accuracy_by_magic_test_successes:
      '0': no information
      '1': duration estimate within 50%
      '2': duration estimate within 25%
      3+: exact estimate
    source_claim: Order sources suggest initiates of grade 6+ may face storm power
      as part of an ordeal; not a numeric bonus.
    gamemaster_variation: Base storm Force may be changed by 50% or more because of
      in-world celestial, spirit or major-event conditions.
