  ally_magic:
    order_context: Most Tir hermetics, including Followers, avoid creating allies.
      Order of the Sun, Moon and Stars initiates create allies as ritual guardians.
    ally_creation_time_karma_percent: 90% of standard Shadowrun time and Karma, minus
      5 percentage points per creator initiation grade.
    minimum_percent_of_standard_cost: 50
    nonmember_banishment_target_number_modifier: 2
    nonmember_condition: Attempt by any magician who is not a member of the Order
      of the Sun, Moon and Stars to banish an ally made by that order.
    member_banishment: For initiates of the same order, use standard target numbers,
      referenced to Grimoire II p72.
  free_spirits:
    giving_karma_bonus_percent: 25
    rounding: For rounding fractional Karma, greater than half rounds up, less than
      half rounds down; source example 7 paid counts as 9.
    source_example:
      actual_karma_paid: 7
      effective_karma_received: 9
      unrounded: 8.75
    reference: Use historical Grimoire II pp76–77 free-spirit Karma rules otherwise.
    restriction: Tir magicians do not generally bind free spirits; the book describes
      a cultural taboo, not a new explicit numeric binding prohibition.
