  cyberdeck_legality: Cyberdecks licensed by the Tír Ministry of the Interior, restricted
    private use; combat software is illegal while limited masking and defense utilities
    may be licensed.
  street_price_multiplier: (20 + 2D6) × 100% of prior SRII and sourcebook prices,
    as printed; preserve formula exactly rather than interpreting as an absolute nuyen
    cost.
  system_style: Sculpted/imagery-based Matrix systems employ symbolic locations and
    icons drawn from fictional Tír mythology.
  node_correspondence:
    Central Processing Unit: Castle, temple, or another place of power.
    Dataline Junction: Crossroads or intersection.
    Dataline: Ancient road, stream, corridor or path.
    Datastore: Library or repository of knowledge, cairn, dolmen, sacred grove, fish-filled
      lake.
    I/O Port: Object/place symbolic of the port function.
    Slave Node: Object/place symbolic of slave function.
    Sub-processor Unit: Mill, foundry or other work site.
    System Access Node: Ancient arch, gap between standing pillars, or doorway.
  tir_symbolism_skill:
    untrained_target_number_modifier: 4
    per_skill_point_modifier_reduction: 1
    related_skill_alternative: For each 2 points in a similar specialist skill, reduce
      the +4 TN modifier by 1, at gamemaster discretion.
    scope: Tests for direct Tír node/system interaction.
  sculpted_reaction: Normal Reaction modifiers for sculpted systems do not apply to
    this Tír special case.
