  source_context: Fictional historical Shadowrun RPG publication; game mechanics and
    named hypothetical source claims not real-world instructions.
  simulation_company: Fictional Software Simulations Éireann-Tír (SSET) systems using
    original Virtual Realities rules, proposed by publication as optional game-master
    modifications.
  multiple_imaging:
    number_of_illusions: Generate 1–3 identical images for each IC construct. Roll
      1D6, divide by 2, round fractions UP.
    test_modifier: Add +1 to all target numbers for tests to evade or defeat Multiple
      Imaging IC.
    removal: Character may run an Analyze program with a Complex Action; on a successful
      test removes multiple images.
    references: SRII p176 (Complex Action).
  reality_filters:
    opposed_test: Against an SSET system a player using a reality filter makes an
      opposed test of sculpted system against deck Evasion Rating, as specified by
      Virtual Realities p52.
    extra_die: Add 1 extra die to the dice rolled for the system; the base number
      of system dice equals its System Rating.
  expert_ic: SSET expert IC follows Virtual Realities p22; descriptive text suggests
    broad use, without giving new numeric expert IC stats.
  ic_constructs:
    rating: When facing an IC construct formed from multiple IC components, use arithmetic
      AVERAGE of all component ratings, instead of lowest component rating described
      in Virtual Realities p22.
    rounding: Normally round fractions smaller than 0.5 down; gamemaster MAY choose
      to round ALL fractions up as an option.
  ic_allocation: Black IC allocation is unrelated to CPU System Rating; original Virtual
    Realities p23 provides default context.
  hostile_deckers: Hostile SSET deckers and system black IC have an inverse relationship,
    according to the fictional description; no new numeric modifier supplied.
  cyberdecks: Tir decker references SRII p173, with named fictional on-site deckers
    using higher or lower equivalent decks.
