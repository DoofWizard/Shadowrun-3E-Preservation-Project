  veil:
    setting: The Veil is a fictional island-boundary magical phenomenon alongside
      advanced monitoring technology; official ferry corridors are approximately two
      kilometers wide.
    distance_from_coast_km_range:
    - 12
    - 18
    height_above_sea_level_m_approx: 20
    width_m_range:
    - 400
    - 600
    force_effect: Inside 400–600 meters, affects sentient creatures with variable-Force
      Chaotic World spell-like effect.
    force_each_combat_turn: Roll 1 die and add 3; Force ranges from 4 to 9. Reevaluate
      each Combat Turn.
    navigation_effects: The book says affected characters may move in unexpected directions,
      and electrical sensors/autopilot guidance become unreliable; effects cannot
      be Dispelled.
    unaffected: A simple compass is unaffected; the book states the Veil does not
      interfere with normal air travel.
    access: Ferry channels are patrolled by naval-security vessels under the fictional
      setting.
  cairn_lines:
    background_count_range:
    - 1
    - 4
    cross_reference: Grimoire II p89; Tir Provinces p100
    druid_casting: A Follower of the Path of the Druid standing on a cairn line may
      use Background Count as additional Magic Pool dice for spellcasting.
    ritual_enchanting: For Druidic ritual sorcery and enchanting, reduce ALL test
      target numbers by half the Background Count, rounding fractions UP.
    surge: At Samhain dawn (November 2), certain lines rise by 2 to 5 Background Count
      for 12 hours; other surges are under gamemaster control.
    great_cairn_line:
      base_background_count: 3
      samhain_background_count: 5
      other_event_adjustments: Gamemaster may add other seasonal changes.
    other_lines: Gamemaster may plot additional lines with base Background Counts
      1 or 2 based on fictional cairn/tomb-site density.
    newgrange_site:
      base_background_count: 4
      winter_solstice_background_count: 5
      window: For 4 days before and 4 days after the winter solstice (Alban Arthuan).
    other_sites: Gamemaster may establish static or dynamic counts up to 4 at other
      cairn sites.
