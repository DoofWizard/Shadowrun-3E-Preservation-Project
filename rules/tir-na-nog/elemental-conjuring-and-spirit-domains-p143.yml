  source_context: Fictional Shadowrun sourcebook, FASA Corporation 1993; original/Second
    Edition-compatible mechanics; speaker claims and GM options identified as such.
  elemental_scope: Followers with Conjuring skill can summon elementals, including
    Warrior adepts. Warriors can summon ONLY earth elementals. Aligned/opposed elemental
    rules depend on the order’s affinity.
  conjuring_bonus_penalty_table:
  - variable: Time required
    bonus: Standard time × 0.9
    penalty: Standard time × 1.25
  - variable: Conjuring Test target number
    bonus: -1
    penalty: 1
  - variable: Services performed
    bonus: Successes + 1
    penalty: Successes - 1
  - variable: Drain Resistance target number
    bonus: -1
    penalty: 1
  - variable: Great Form summonable
    bonus: true
    penalty: false
  table_notes:
    time_bonus: Base 0.9 multiplier decreases another 0.05 per grade of summoner’s
      initiation.
    services_floor: If number of successes becomes below zero, count it as zero.
    great_forms: A summoner may conjure Great Forms of other elementals; the table
      restriction concerns the opposed element.
  nature_spirit_domains:
  - magical_order: Cu Chulainn
    domain: Spirits of the Land (Spirits of Earth)
  - magical_order: Etain
    domain: Spirits of the Sky
  - magical_order: Brigid
    domain: Spirits of the Great Fiery Firmament
  - magical_order: Ogma
    domain: Spirits of the Waters
  - magical_order: Sun, Moon and Stars
    domain: All spirits; receives all bonuses and none of the penalties
  nature_spirits: Followers may summon elementals and nature spirits, but an order
    may call only spirits in its particular domain, with corresponding elemental-style
    bonuses and penalties.
