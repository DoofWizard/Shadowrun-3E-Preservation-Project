  source_method: 'Fictional tabletop-game sourcebook reporting: rules are historical
    game mechanics; narrator facts, disputed in-world theories, and optional gamemaster
    decisions are distinct.'
  source_context: Software Simulations Éireann-Tír (SSET) designs fictional sculpted
    Matrix systems; consult historical Virtual Realities rules for underlying operations.
  multiple_imaging:
    duplicate_image_count_roll: roll 1D6, divide by 2, round fractional result UP,
      yielding 1–3 duplicates
    target_number_modifier_vs_multi_image_ic: 1
    analyze_action: Successful Analyze program test made as a Complex Action eliminates
      additional IC images.
    base: Any IC construct appears with 1–3 identical additional images.
  reality_filters:
    sculpted_system: SSET System Access Nodes use ghostly, ethereal imagery and black
      IC as the setting description.
    opposed_test: For a player character using a reality filter, test against sculpted
      system with the decker’s Evasion Rating opposed, following Virtual Realities
      p52.
    system_extra_dice: Add one extra die to the system roll for each point of System
      Rating; this is equivalent to System Rating extra dice.
  expert_ic: Expert IC detail and underlying rules remain Virtual Realities p22; source
    supplies no new numerical stat block.
  ic_constructs:
    rating: Use the AVERAGE rating of all lowest-rated component pieces, not the lowest
      individual component rating.
    rounding: Round fractions less than 0.5 DOWN. Gamemaster may instead round all
      fractions UP.
  ic_allocation: Black IC allocation is not constrained by the CPU System Rating,
    referring to Virtual Realities p23.
  hostile_deckers: SSET systems may employ hostile deckers; gamemaster determines
    their presence and tactics. Top SSET deckers may have Fairlight decks, less experienced
    ones upgraded Fuchi Cyber-6 equivalents; compare SRII p173.
