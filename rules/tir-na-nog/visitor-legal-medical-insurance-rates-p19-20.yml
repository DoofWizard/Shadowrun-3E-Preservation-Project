  section: LAW AND LAW ENFORCEMENT / MEDICAL ASSISTANCE — quoted source-era price
    examples
  legal_insurance:
    mandate: Book narrator says incoming visitors must pay into a Legal Insurance
      Fund before entering Tír.
    coverage: For criminal proceedings following a violation of the Tír laws; ordinary
      civil cases such as libel and slander are not covered.
    example_price_week_nuyen: 120
    example_price_week_punts: 262
    exact_printed_currency_pair: 120¥/£262 (printed source even though not arithmetically
      equivalent to the separately reported 2.20 rate; no silent correction)
    example_context: The source labels this a rule of thumb for visitors from Europe,
      Australasia or relatively stable American nations with a clean record.
    variables: The exact charge depends on country of origin, legal history, visit
      purpose and intended duration. An embassy or consulate administrator determines
      rates.
    lawyers: The sourcebook says only Tír citizens may act as court lawyers, and contingency-fee
      arrangements are illegal.
  medical_insurance:
    mandate: The in-world National Health Service requires visitors to purchase insurance
      covering the full expected duration; no refunds for early departure.
    healthy_age_range_years:
    - 20
    - 35
    example_weekly_cost_nuyen: 160
    example_weekly_cost_punts: 352
    example_context: For persons in good health aged 20–35; not a universal base premium
      for all ages.
    example_age_60_coronary_multiplier: 4
    cholesterol_price_increase_percent_per_centile_above_average: 5
    cholesterol_example_restriction: The source specifically discusses males with
      blood β-4 cholesterol, not an all-person formula.
    cyberware_additional_risk: Cyberware or personal enhancement adds a risk factor,
      EXCEPT simple datajacks, memory chips and knowledge skillwires. Source gives
      no universal numeric modifier for this factor.
    source_declared_exclusion: The in-world narrator says inaccurate medical-history
      declarations forfeit visitor rights to medical attention; reported as a fictional
      coercive institutional policy, not endorsed medical advice.
  attribution_boundary: Anonymous/named in-world comments about greater legal charges
    and security zones on these pages are allegations, not an official price table,
    and should remain in attributed-claim records.
  historical_fiction_only: true
