data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: Historical original/Second Edition-compatible; no inferred Third Edition
      conversion
    source_pdf_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: 135-136
    physical_pdf_pages: 144-145
  source_context: Fictional Shadowrun-setting material from a published tabletop RPG.
    Distinguish book-narrator descriptions, in-world speakers’ allegations and speculation;
    no claims about real contemporary Belfast.
  eligibility: The Warrior can be a physical adept or magical adept, NEVER a full
    magician; most followers are physical adepts.
  path_core_skills:
  - Armed Combat
  - Unarmed Combat
  - Firearms
  - any 3 additional Combat Skills
  - any 6 Physical Skills
  - any 4 other skills of choice
  illustrative_additional_skills: Military History (especially Irish/Tír history of
    20th–21st centuries or mythic battles), Psychology specialized in Deviant Behaviour,
    at least one Vehicle Skill, and one Technical Skill; the p135 line continues on
    p136.
  path_core_attributes:
  - Body
  - Strength
  - Quickness
  initiation:
    order: Order of Cu Chulainn
    initial_grade: 0
    magical_adept: Gain Sorcery and/or Conjuring as Path Core Skill(s) upon initiation
      as appropriate.
    physical_adept: Initial Grade-0 initiation adds +2 to Magic Attribute Rating for
      a total Magic Attribute Rating of 8.
  metamagic:
    centering: Warrior Followers may NOT use centering for combat-related actions.
    anchored_combat_spells:
      target_number_modifier: -1
      drain_level_modifier: -1
    anchored_illusion_spells:
      target_number_modifier: 1
      drain_level_modifier: 1
  implant_essence_exception:
    condition: Cyberware directly related to Warrior Path and not simulating Path
      Core Skills
    essence_loss: 1/2 normal Essence loss, ROUND UP.
    otherwise: Use normal Shadowrun Essence cost rules and global minimum Essence
      2.0 from p134.
  bonus_dice_cases:
  - dice: 1
    when: resisting or casting combat spells
  - dice: 1
    when: resisting or casting combat spells during winter
  - dice: 1
    when: resisting or casting combat spells within 72 hours of Imbolc, February 2
  - dice: 1
    when: resisting or casting combat spells per EVERY 2 grades of initiation
  - dice: 1
    when: resisting or casting combat spells in province of Ulster
  - dice: 1
    when: resisting or casting combat spells in hills or mountains
  illusion_penalty:
    dice_lost_when_casting_illusion_spells: 2
    dice_lost_when_resisting_illusion_spells: 3
    mitigation_test: Successful Willpower Test, TN 10 minus half of initiation grade
      (round DOWN).
    restoration: EVERY 2 successes restores 1 die of the penalty.
    additional_test_tn_if_on_or_in_water: 2
    may_gain_bonus_dice_from_mitigation_test: false
  other_cross_references: Enchanting p141 and Magical Beings p143 of Additional Magic
    Rules for specific rules on magical-item bonding, spirits and summoning.
framing: reference_exact
