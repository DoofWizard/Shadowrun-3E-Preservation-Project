data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    publication_year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: Shadowrun historical original/Second Edition-compatible; no unsupported
      Third Edition conversion
    pdf_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: 141-142
    physical_pdf_pages: 150-151
  source_method: 'Fictional tabletop-game sourcebook reporting: rules are historical
    game mechanics; narrator facts, disputed in-world theories, and optional gamemaster
    decisions are distinct.'
  bonding_foci:
    scope: Initiates of a Tir magical order who are Followers; spell focus must match
      the relevant order for the discounted cost, except the Sun, Moon and Stars order
      discount extends to all magical items.
    grade_zero_appropriate_focus_karma_multiplier: 0.9
    per_higher_initiation_grade_additional_multiplier_reduction: 0.05
    minimum_final_bonding_karma_points: 1
    example: An Order of Cu Chulainn initiate may bond a combat-spell focus with the
      discount.
    opposed_item_karma_multiplier: 1.25
    opposed_examples:
    - Combat-spell focus bonded by a Druid
    - Health-spell focus bonded by a Warrior
    warrior_weapon_focus_category: For initiates of the Order of Cu Chulainn, weapon
      foci count as combat items.
    first_bonding_covered: true
    applies_to: Reduced or increased Karma applies to first bonding and subsequent
      bonding.
  druidic_enchanting:
    reference: Grimoire II pp30–32 governs Druidic enchantment except combat-related
      work.
    combat_exception: A Druid enchanting a combat-related item requires a complete
      enchanting shop.
    characterization: Tir Druids generally disdain metallic objects and avoid combat
      items; Followers rarely use fetishes.
    acquiring_fetishes: If a Follower requires a fetish, the source says it usually
      comes from a non-Follower initiate of the same order.
    dependency: Order of Cu Chulainn Followers who only have adept Sorcery do not
      learn Enchanting and require non-Follower initiates of their order to create
      foci.
  enchanting_test_target_number_modifier:
    order_appropriate_item: -1
    opposed_item: 1
  enchanting_time_and_other_costs: 'For item-type, alchemical work, and analysis,
    use the same relative time/Karma multipliers as focus bonding: reduce time/Karma
    for orientation-appropriate work; increase for opposed work.'
  non_focus_item_scope: Relevant multipliers also apply to enchanting time for fetishes
    and unique objects.
  gathering_materials:
    base_rule: Grimoire II
    reduction: Initiates belonging to different orders work together; the required
      gathering time is halved.
    ogma_druids: Members of the Order of Ogma who are also Druids restrict their enchanted
      objects to virgin telesma.
    other_initiates: Other initiates may work with unprocessed material including
      wood, plants, crystal, and stone.
