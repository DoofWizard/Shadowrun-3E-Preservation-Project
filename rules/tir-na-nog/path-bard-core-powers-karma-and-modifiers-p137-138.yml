data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: Historical original/Second Edition-compatible; no inferred Third Edition
      conversion
    source_pdf_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: 137-138
    physical_pdf_pages: 146-147
  source_context: Fictional Shadowrun-setting material from a published tabletop RPG.
    Distinguish book-narrator descriptions, in-world speakers’ allegations and speculation;
    no claims about real contemporary Belfast.
  eligibility: Any kind of magician or magical adept.
  path_core_skills:
  - Art History
  - Artistic Composition
  - Performance Skill
  - any 4 Social Skills
  - any 4 Knowledge Skills NOT related to combat
  - any 4 Language Skills
  path_core_attributes:
  - Quickness
  - Charisma
  - Willpower
  specializations: Art History and Artistic Composition may concentrate or specialize
    in any art form, e.g. music, painting.
  bardic_powers:
    names:
    - Compulsion
    - Influence
    original_reference: Critter powers as described in Shadowrun Second Edition pp217–218.
    acquisition_karma_cost_each: 5D6 + 10 Karma Points
    threshold: Gamemaster determines the target Karma threshold secretly during character
      creation and keeps it secret from the Bard.
    karma_saving_requirement: At least 10 percent of future Karma awards must be saved
      toward each desired power, ROUND fractions UP; saved Karma constitutes part
      of the general 70 percent Path Core investment, not in addition.
    minimum_initiation_grade_to_gain_powers: 3
    order: Order of Brigid
    acquire_when: Upon acquiring sufficient saved Karma and attaining at least Grade
      3 initiation; whichever condition happens last.
    use_requirement: Powers can only be exercised while the Bard is engaged in a performance.
      Examples singing/poetry, sculpture, acting.
    cost_per_use: 1D6 + 2 Good Karma Points, ROUND DOWN, from Karma set aside for
      Path Core development, to a MINIMUM OF 1 Karma Point per use.
    consent_and_artistic_integrity: A Bard may use magic/powers to enhance audience
      appreciation when a viewer agrees IN ADVANCE, or when using them does not negatively
      affect the art’s integrity. Gamemaster decides artistic appropriateness. Do
      not collapse prior consent into assumed consent.
  initiation:
    order: Order of Brigid
    initial_grade: 0
    extra_core_skills: Magicians and adepts gain Sorcery and/or Conjuring upon initiation
      as appropriate.
  metamagic:
    anchored_manipulation:
      target_number_modifier: -1
      drain_level_modifier: -1
    anchored_health:
      target_number_modifier: 1
      drain_level_modifier: 1
    geas_restriction: Never accepts a geas restricting manipulation spells.
  bonus_dice_cases:
  - dice: 1
    when: casting/resisting manipulation spells intended to CONTROL
  - dice: 1
    when: casting/resisting controlling manipulation spells during summer
  - dice: 1
    when: casting/resisting controlling manipulation spells within 72 hours of Lugnasadh
      (August 1)
  - dice: 1
    when: casting/resisting controlling manipulation spells per EVERY 2 grades of
      initiation
  - dice: 1
    when: casting/resisting controlling manipulation spells in province of Munster
  - dice: 1
    when: casting/resisting controlling manipulation spells standing within 10 feet
      AND line-of-sight of a fire AT LEAST campfire size
  health_spell_penalties:
    dice_lost_when_casting_health_spells: 2
    dice_lost_when_resisting_health_spells: 3
    mitigation: Willpower Test versus target number 10 minus half initiation grade
      (ROUND DOWN), EVERY 2 successes restore 1 penalty die.
    additional_target_number_if_suspended_in_air: 2
    bonus_dice_from_test: 0
  other_cross_references: Additional Magic Rules p141 Enchanting and p143 Magical
    Beings; Bardic powers from SRII pp217–218.
framing: reference_exact
