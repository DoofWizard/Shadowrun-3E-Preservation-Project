  elementals:
    who: Followers with the Conjuring Skill can summon elementals, including Warrior
      adept Followers.
    warrior_exception: Warriors may summon ONLY earth elementals.
    affinity: Element closely associated with summoner grants bonuses; an opposed
      element incurs penalties.
  conjuring_bonus_penalty_table:
    time_required:
      bonus: standard time × 0.9, with further reduction 0.05 per initiation grade
      penalty: standard time × 1.25
    conjuring_test_target_number:
      bonus: -1
      penalty: 1
    number_of_services:
      bonus: successes + 1
      penalty: successes - 1; if below zero use zero
    drain_resistance_target_number:
      bonus: -1
      penalty: 1
    great_form_summonable:
      bonus: true
      penalty: false
      penalty_exception: Summoner may conjure Great Forms of other elementals even
        when opposed element penalty applies.
  nature_spirits:
    summoner: Followers can summon elementals and nature spirits, but each magical
      order has a spirit domain.
    modifiers: Same bonuses/penalties apply as for the elemental table.
  spirit_domain_table:
    Cu Chulainn: Spirits of the Land (Spirits of Earth)
    Etain: Spirits of the Sky
    Brigid: Spirits of the Great Fiery Firmament
    Ogma: Spirits of the Waters
    Sun, Moon and Stars: All spirits; bonuses for all, no penalties
