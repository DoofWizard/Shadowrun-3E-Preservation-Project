  source_method: 'Fictional tabletop-game sourcebook reporting: rules are historical
    game mechanics; narrator facts, disputed in-world theories, and optional gamemaster
    decisions are distinct.'
  source_order: Order of Ogma initiates create intricately carved ogam stones; spell-specific
    stones are much more common than the general-purpose type, which generally requires
    higher-grade initiates.
  spell_specific_stone:
    magic_pool_bonus_dice_for_named_spell_type: 1
    additional_dice_for_spell_type_within_72_hours_of_relevant_equinox: 1
    resistance_dice_against_named_spell_type: 1
    crafting_days: 7
    creating_initiate_karma_cost: 6
    recipient: The named recipient must attend the final stages of magical creation
      and provide roughly a quarter-pint blood sample for the fictional ritual bonding;
      this is a described in-game rite, not a real-world procedure.
    recipient_bonding_karma_cost: 1
    bonded_user: Only the specifically named recipient can use the finished enchanted
      stone.
    source_claim: The ritual establishes a potential sympathetic link between recipient
      and initiate; this concern explains low requests.
  general_purpose_stone:
    type: Stacked power/spirit focus, a complex and unique magical object.
    underlying_rule: Use Grimoire II pp26–27 stacked-enchantment rules; halve the
      Karma and time required for the enchantment.
    bonding_karma_formula: desired Power Rating + one Karma Point for every 2 Rating
      Points of secondary spirit focus, round fractional total UP.
    illustrative_rating_power: 7
    illustrative_rating_spirit: 5
    illustrative_bonding_cost: 10
    bond: Recipient becomes linked to item through a blood bond in the fictional ritual.
    privacy_limit: Order of Ogma generally makes ogam stones for trusted recipients
      and may keep track through friendly spirits, even on astral planes if the object
      acts as a spell lock.
    maximum_active_per_character:
      simple: 1
      complex: 1
  references: Grimoire II pp26–27 and pp30–32 are historical Second Edition-era cross-references,
    not converted SR3 mechanics.
