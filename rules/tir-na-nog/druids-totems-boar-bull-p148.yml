  boar:
    traits: Fiercely territorial, protective of sanctuaries and guarded sites, aggressive
      in danger, and hard to divert once engaged; a fictional totem description.
    favored_environments:
    - sacred sites
    - thick forests
    advantages:
      combat_spell_bonus_dice: 2
      additional_spirit_service_for_combat: 1
    disadvantages:
      territoriality: Gamemaster decides when sacred territory has been invaded; Boar
        must attack intruders without warning even if associates object.
      combat_persistence: Does not disengage until opponents turn tail and flee, even
        if outnumbered.
      illusion_resistance_dice_modifier: -2
  bull:
    traits: Warrior-leader, active in defense of rural Druids, hospitable toward allies,
      vengeful toward those believed unjust; source says Bulls often act as judges
      in druidic disputes.
    favored_environment: Anywhere in the Tír countryside.
    advantages:
      health_spell_bonus_dice: 2
      combat_spell_bonus_dice: 1
      detection_spell_bonus_dice: 1
    disadvantages:
      charisma_minimum_at_character_generation: 4
      vigilance: Holds grudges and must avenge injuries or believed injustice; no
        additional dice modifier printed.
