data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: Historical original/Second Edition-compatible; no inferred Third Edition
      conversion
    source_pdf_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: 136-137
    physical_pdf_pages: 145-146
  source_context: Fictional Shadowrun-setting material from a published tabletop RPG.
    Distinguish book-narrator descriptions, in-world speakers’ allegations and speculation;
    no claims about real contemporary Belfast.
  eligibility: Any kind of magician or magical adept.
  path_core_skills:
  - Etiquette (Corporate)
  - Leadership
  - Negotiation
  - any 3 additional Social Skills
  - any 4 computer- or communications-related Skills
  - any 4 Knowledge Skills, at least 2 related directly to the Steward’s business
    activity
  - any 4 skills from any area EXCEPT combat
  path_core_attributes:
  - Charisma
  - Intelligence
  - Willpower
  initiation:
    order: Order of Etain
    initial_grade: 0
    extra: Magicians and adepts gain Conjuring and/or Sorcery as Path Core Skills
      on initiation as GM deems appropriate.
  anchoring:
    health_spells:
      target_number_modifier: -1
      drain_level_modifier: -1
    manipulation_spells:
      target_number_modifier: 1
      drain_level_modifier: 1
  geas_restriction: A Steward never accepts a geas restricting the use of health spells.
  bonus_dice_cases:
  - dice: 1
    when: resisting or casting health spells
  - dice: 1
    when: resisting or casting health spells in Leinster province
  - dice: 1
    when: resisting or casting health spells while in the air (e.g., levitating)
  - dice: 1
    when: resisting or casting health spells during spring
  - dice: 1
    when: resisting or casting health spells within 72 hours of Beltane (May 1)
  - dice: 1
    when: resisting or casting health spells for EVERY 2 grades of initiation
  manipulation_penalties:
    dice_lost_when_casting_manipulation_spells: 2
    dice_lost_when_resisting_manipulation_spells: 3
    mitigation: Success on Willpower Test against target number 10 minus half initiation
      grade (round DOWN). EVERY 2 successes restore 1 penalty die.
    test_target_number_additional_when_near_fire_at_least_campfire: 2
    bonus_dice_from_test: 0
  other_cross_references: 'Additional Magic Rules: Magical Beings p143 and Enchanting
    p141.'
