  source_context: Fictional Shadowrun sourcebook, FASA Corporation 1993; original/Second
    Edition-compatible mechanics; speaker claims and GM options identified as such.
  section: Additional Magic Rules / Enchanting / Bonding Foci
  subject: Specific historical Second Edition-compatible enchantment rules for fictional
    Tir na nÓg magical orders; baseline standard Shadowrun and Grimoire II remain
    cross-references.
  bonding_foci:
    favored_focus: Follower initiate bonding an order-appropriate spell focus has
      Karma cost = standard basic Karma cost × 0.9 at Grade 0.
    each_additional_grade: Subtract an additional 0.05 from cost multiplier per successive
      initiation grade.
    minimum_bonding_cost: 1 Karma Point.
    opposed_focus: 'Karma cost equals standard cost × 1.25 for a focus opposite the
      initiate’s Path orientation (examples: combat focus for a Druid; health spell
      focus for a Warrior).'
    cu_chulainn: For initiates of the Order of Cu Chulainn, treat weapon foci as combat
      items for orientation.
    sun_moon_stars: Initiates of Order of the Sun, Moon, and Stars use reduced Karma
      costs for all magical items.
    first_bonding: Both increased and reduced Karma costs apply to first bondings
      too.
  time_and_targets:
    enchanting_time: The same bonding multipliers determine enchanting time, including
      fetishes and unique objects.
    enchanting_tests_favored_target_number_modifier: -1
    enchanting_tests_opposed_target_number_modifier: 1
  druid_constraints:
    tradition: Druidic enchanting uses rules for British hermetic druids in Grimoire
      II pp30–32 unless a combat-related item is enchanted.
    combat_item: Requires a complete enchanting shop.
    preferences: Druids dislike metallic items, and rarely create combat items; followers
      often seek fetishes from non-followers.
  cu_chulainn_constraint: Cu Chulainn initiates possess Sorcery rather than Enchanting
    skill; a non-Follower initiate of their order must enchant their foci.
  gathering_enchanting_materials:
    ogma_initiates: Gathering time is halved relative to Grimoire II because Tir magical
      orders cooperate.
    druids: Druids can use only virgin telesma for enchanted objects.
    other_initiates: Other initiates do not require virgin telesma and prefer unprocessed
      wood, plants, crystal, and stone.
  other_enchanting: For analysis, alchemical materials and related processes, apply
    the same reduction in time and Karma for aligned items and increase in time and
    Karma for opposed items.
