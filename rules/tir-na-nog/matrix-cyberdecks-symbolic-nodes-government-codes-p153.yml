  source_context: Fictional historical Shadowrun RPG publication; game mechanics and
    named hypothetical source claims not real-world instructions.
  cyberdeck_street_price: Black-market deck price = (20 + 2D6) × 100 percent of corresponding
    SRII/previous-source listed price, per source text.
  cyberdeck_regulation: Ministry of the Interior licensing; private decks generally
    limited to inexpensive models; military/combat software illegal or restricted.
  tir_matrix: Fictional Tir graphical Matrix uses sculpted icons and symbolic place
    associations.
  symbolic_node_types:
  - node: Central Processing Unit
    icon: Castle, temple or another place of power
  - node: Dataline Junction
    icon: Crossroads or intersection
  - node: Dataline
    icon: Ancient road, stream, corridor or path
  - node: Datastore
    icon: Library/storehouse of knowledge, cairn, dolmen, sacred grove, fish-filled
      lake
  - node: I/O Port
    icon: Object/place symbolically appropriate to function of I/O port
  - node: Slave Node
    icon: Object/place symbolically appropriate to slave-node function
  - node: Sub-processor Unit
    icon: Mill, foundry or another place of work
  - node: System Access Node
    icon: Ancient arch, space between two freestanding pillars, or other doorway
  specialization_rule:
    without_tir_symbolism: Character adds +4 modifier to target numbers for Matrix
      activity directly related to a Tir system/node.
    tir_symbolism: Each point of Tír Symbolism specialization reduces this modifier
      by 1.
    other_related_skills: Gamemaster may reduce +4 modifier by 1 for every 2 relevant
      points in similar/related skills.
  reaction_modifier: Normal Reaction modifiers for sculpted systems DO NOT apply to
    Tír Matrix systems; original Virtual Realities is the cross-reference.
  government_security_codes:
  - system: Social Benefits Registry
    code: Red-4
  - system: Interior Affairs Registry
    code: Red-5
  - system: Environmental Regulation Registry
    code: Red-7 (up to Red-9 for prognostic programs)
  - system: TRC systems
    code: Red-9
