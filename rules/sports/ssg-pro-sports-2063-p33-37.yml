id: rule.ssg-pro-sports-2063-p33-37
record_type: rule
status: source_reviewed
source: source.fanpro-10667
printed_pages: '33-37'
pdf_pages: '34-38'
edition_scope: 'FanPro Sprawl Survival Guide (FanPro10667, 2003), Shadowrun Third Edition fictional tabletop supplement; 2063 sporting regulations'
content_class: [rule_procedure]
framing: reference_exact
headline: 'FanPro10667 SR3 fictional professional sports overview, pp33-37/PDF34-38'
summary: 'Later 2063 competition eligibility, field dimensions and next-season hockey changes; preserve original legacy rules and unresolved spellcasting conflict.'
data:
  general_p33_34:
    default_restrictions: [implant weaponry, spells, spirits, paracritters]
    default_exception: unless otherwise noted for the sport
    adept_eligibility: most leagues permit adepts, but not all
    astral_monitoring: nearly all professional sports are monitored by trained magicians and spirits
    spirits_as_players: prohibited, including free spirits
    paracritter_player_exception: several sasquatch on NAN stickball teams
    metatype_playing_time: CAS 2056 Baker vs. MLS ruling barred denial based on metatype; other leagues accepted it as precedent
    spellcasting_conflict: p33 describes urban brawl as the sole current permission, whereas p34 and p36 give sport-specific exceptions; do not resolve by inference
  auto_racing_p34:
    restricted: [adepts, drugs, nanites]
    implants_restricted_in: NASCAR only
    NASCAR_vehicle_eligibility: specific vehicle templates
  baseball_p34:
    restricted: [adepts, nanites]
    metahumans_restricted_in: Nippon Professional League only
    cyberware_and_bioware: limited
  basketball_p34:
    restricted: [cyberlimbs, height or reach modifications, drugs, nanites]
    reflex_boosters: limited; no levels specified here
    Sure_Shot: NABA considering permission, not established as permitted
  combat_biker_p34:
    restrictions_listed: none
    arena: football-sized, four-lane maze, skyway over middle
    prior_match_rules: rule.shadowbeat-combat-biker-competition-p65-67
    comparison: nine-member teams and flag objective match legacy overview; do not resolve prior role count discrepancy
  court_ball_p35:
    restrictions_listed: none; cyberweaponry expressly permitted
    prior_match_rules: rule.shadowbeat-court-ball-and-amateur-athletics-p62-63
    comparison: three players, three replacements, seven-point or elimination outcome, ring goal all consistent; no change to prior bounce rules stated
  football_p35:
    restricted: [cyberlimbs, telescoping limbs]
    field_m: {length: 150, width: 60}
    ball_kg: 2
    OZFL: rules incompatible with other leagues
    drone_league: ordinary football format with team budget allocated among offense, defense, special teams and repairs
    lineage: older ShadowBeat field uses yards; retain both printed values without unit conversion or assuming identical field
  hockey_p35:
    league: INHL; open professional league not geographically based
    restricted: [adepts]
    cyberware_and_bioware: limited
    next_season_changes:
      exoskeleton_enhancements_allowed: true
      body_armor_allowed: true
      fight_end: player taps out or is unconscious
      prior_fight_end: one participant falls prone
      bench_clearing_brawls_per_game: 3
      prior_season_bench_clearing_brawls_per_game: 1
  personal_combat_p36:
    restrictions: league-dependent
    most_leagues_allow: [cyber-modifications, adepts]
    ultraweight_min_kg: 200
    scope: later weight class; do not replace legacy boxing class limits
  soccer_p36:
    restricted: [adepts, drugs, nanites, phenotypic alteration]
    implants: injury correction only, not enhancement
    metahuman_eligibility: most leagues allow; some regional leagues prohibit
  stickball_p36:
    restricted: [drugs, implants, nanites]
    sasquatch_allowed: true
    adepts_and_mages_allowed: true
    attributed_spell_restriction:
      speaker: Painted Owl
      current: spells on opposing team prohibited
      experiment: all-spellcaster league allows spells against opposing team; possible public introduction not confirmed
  urban_brawl_p33_36_37:
    printed_restriction: control manipulation spells only
    p33_example: influencing thoughts or actions of opposing team members prohibited
    comparison: three blocks wide, four deep; thirteen players per team; goal objective reuses legacy match rules
    prior_match_rules: rule.shadowbeat-urban-brawl-match-p68-72
  scope: original source-period eligibility and match conditions; no invented dice, equipment ratings, or universal edition supersession
