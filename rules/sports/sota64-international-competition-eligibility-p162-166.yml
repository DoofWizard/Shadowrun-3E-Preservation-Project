edition_scope: 'FanPro State of the Art: 2064 (FanPro25004, 2004), Shadowrun Third Edition, corrected December 2005 PDF; fictional competition eligibility'
content_class: [rule_procedure]
headline: 'FanPro25004 Shadowrun Third Edition: international soccer and Triple Crown eligibility'
summary: 'Fictional 2064 mixed international soccer eligibility, qualification constraints and the named 2063 Triple Crown exception, with the printed team count reconciled.'
framing: reference_exact
data:
  publication: {title: 'State of the Art: 2064', publisher: FanPro, catalog_number: FanPro25004, edition: Shadowrun Third Edition, chapter: Culture Shock}
  scope: Fictional competition eligibility and format, not a new dice system.
  soccer:
    attribution: Tina Duarte, GloboTrid, fictional in-world report, pp162-163
    world_cup_interval_years: 4
    world_cup_reported_teams: 32
    mixed_gender_first_world_cup_year: 2064
    future_international_tournaments: FIFA announced mixed-gender competition for all subsequent international tournaments.
    north_american_qualification: Fourth NAMLS slot decided by CAS versus UCAS playoff.
    asia_qualification: One slot undecided pending Henan versus Sichuan playoff.
    roster_note: The printed regional list accounts for 32 slots (Africa 3, Asia 5, Europe 13, North America 4, Oceania 1, South America 6), including two undecided slots; this agrees with the prose total.
    changeling_eligibility: A fictional forum commenter reports concern over infected changelings competing; no additional formal universal eligibility rule is stated.
  horse_racing:
    printed_page: 166
    attribution: World Sport staff, fictional October 2063 report
    triple_crown_previous_rule: Genetically engineered horses had been excluded.
    named_exception: Old Admiral was permitted to compete following negotiations.
    limitation: The passage does not establish unrestricted admission of every genetically engineered horse or specify a new test.
  lineage:
    earlier_record: rule.shadowbeat-court-ball-and-amateur-athletics-p62-63
    comparison: Earlier legacy record states the four-year World Cup interval but not mixed international eligibility or the named racing exception. Preserve the interval as context and the distinct later rules without blanket supersession.
    boundary: No new Olympic eligibility rule inferred from the bid discussion on pp164-165; the Formula X announcement and hockey split on p166 supply no operational match statistics or tests.
