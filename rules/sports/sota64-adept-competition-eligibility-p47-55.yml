pdf_pages: '48, 55-56'
edition_scope: 'FanPro State of the Art: 2064 (FanPro25004, 2004), Shadowrun Third Edition, corrected December 2005 source; fictional sporting eligibility'
content_class: [rule_procedure]
data:
  publication: {title: 'State of the Art: 2064', publisher: FanPro, catalog_number: FanPro25004, edition: Shadowrun Third Edition, chapter: The Path of the Adept}
  scope: In-world competition constraints, not a new dice-resolution system.
  general_eligibility:
    printed_page: 47
    attribution: MVP and Neon Teal, fictional forum contributors
    nonaugmented_leagues: Most exclude adepts.
    olympic_events: Suspected magic use at a major Olympic event may result in disqualification; some countries make exceptions, generally using separate magically enhanced leagues.
  gladio_ufc:
    printed_pages: '54-55'
    publication_narrator: Gladio acquired the Ultimate Fighting Championship franchise and opened it to both magically enhanced and cyber-augmented competitors.
    attributed_match_rules:
      attribution: Cannonball, fictional forum contributor, p55
      style_restrictions: All fighting styles admitted.
      classification: Weight classes.
      excluded_abilities: Some offensive cyberware and lethal adept abilities prohibited; individual exclusions unspecified.
      match_end: Knockout or voluntary concession.
    other_leagues:
      attribution: John Bull and Brick, fictional forum contributors, p54
      olympics_and_most_world_championships: Reported to exclude adepts; separate leagues where participation is allowed.
      urban_brawl_and_combat_biker: Some teams reportedly bench adepts or field them selectively; no league-wide eligibility rule established by the passage.
  lineage:
    earlier_records: [rule.shadowbeat-professional-ball-sports-p58-62, rule.shadowbeat-court-ball-and-amateur-athletics-p62-63, rule.shadowbeat-individual-combat-sports-p64]
    distinction: The later SR3 publication describes an additional named competition that admits both enhancement categories. Do not replace ShadowBeat boxing, freestyle, general professional eligibility or Olympic procedure wholesale; no universal supersession demonstrated.
framing: reference_exact
headline: 'Fictional Shadowrun Third Edition tabletop sport eligibility: FanPro25004 adept participation and Gladio UFC match constraints'
summary: 'Original printed pp47 and 54-55 describe later fictional sporting eligibility, including the Gladio UFC exception, weight classes, permitted styles, unspecified prohibited abilities and match-ending conditions. In-world reports retain attribution; no new dice modifiers or universal replacement of legacy rules inferred.'
