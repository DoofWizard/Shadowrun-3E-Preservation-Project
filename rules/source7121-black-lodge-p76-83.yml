printed_pages: "76-83"
pdf_pages: "85-92"
content_class:
  - rule_exact
  - rule_procedure
  - world_fact
framing: newsroom_neutral

organization_rules:
  lodge_size: "No more than 7 members in a lodge at any one time."
  linkage: "One of the seven leads the lodge and is also a member of a lodge in the next tier, linking the organization through shared astral contacts."
  membership:
    - "The Black Lodge never recruits elves."
    - "It recruits mages, shamans and adepts of all kinds."
    - "Adepts cannot progress beyond the fourth tier of the organization."
    - "All new members enter as Apprentices of a Lodge of Nostradamus regardless of existing initiate grade."
    - "Magically active recruits must accept the Lodge's progression structure rather than use an existing initiate grade."

tier_structure:
  tier_5:
    lodge: "Lodge of Merlin / Black Council"
    members: 7
    initiate_grades: "13 or higher"
    leader: "Penultimate Master"
  tier_4:
    lodge: "Lodges of Morgana"
    initiate_grades: "10 to 12"
  tier_3:
    lodge: "Lodges of Mordred"
    initiate_grades: "7 to 9"
  tier_2:
    lodge: "Lodges of Rasputin"
    initiate_grades: "4 to 6"
  tier_1:
    lodge: "Lodges of Nostradamus"
    initiate_grades: "1 to 3"
    grade_0: "Unlimited Grade 0 initiates serve as foot soldiers."
  source_claimed_totals:
    lodges_controlled: 1333
    initiates_grades_1_to_13_plus: 9331

penultimate_master:
  - "Presented as a 'pure magician' no longer bound to an ordinary magical discipline."
  - "Can summon spirits, elementals and watchers and cast any spell."
  - "Must cast spells, including conjuring and summoning, from ancient texts."
  - "No fixed Force or character stat block is supplied."

typical_black_lodge:
  reference: "Magical Groups terms, Grimoire II pp.54-60."
  Name: "Lodge of Mordred, Confederate American States"
  Leader: "Joseph Willis 'J.W.' Ellis, Novice Initiate of the Lodge of Morgana, American Continent"
  Type: "Initiatory/Conspiratorial (protect and promote the Black Lodge's interests)"
  Members: 7
  Limitations:
    - "Black Lodge initiates"
    - "No elves"
  Strictures:
    - Attendance
    - Exclusive_Membership
    - Oath
    - Obedience
    - Secrecy
  Resources_Dues: "Luxury. No dues."
  Patron: "The Black Council"

