data:
  publication:
    title: 'State of the Art: 2064'
    publisher: FanPro
    catalog_number: FanPro25004
    edition: Shadowrun Third Edition
    corrected_pdf_version: 1.0 December 2005
    chapter: Games of State
    section: Game Information / Running an Espionage Campaign / Requisitioning Gear
    printed_page: 30
    physical_pdf_page: 31
  eligibility: Players creating characters employed as agency operatives may choose
    optional Budget Pool mechanism; routine mission equipment is otherwise provided
    within organizational constraints.
  creation:
    source: Initial Resources nuyen
    maximum_nuyen_allocation_fraction: 0.5
    effect: Set aside selected nuyen into Budget Pool usable to requisition mission-specific
      gear.
    combine_character_pools: true
    combination_use: Multiple agent Budget Pools may be combined for large purchases
      such as vehicles or specialized mission devices.
  advancement:
    cost_per_good_karma: 1
    increase_budget_pool_nuyen: 1000
    maximum_fraction_of_good_karma_earned_in_single_adventure_spendable_on_budget_pool: 0.5
    note: Text says players should not spend more than half earned Good Karma; no
      unprinted general lifetime cap is added.
  requisition_test:
    precondition: Budget Pool (or sum of combined Budget Pools) has sufficient funds
      to cover item base cost.
    test: Availability Test using agent character Etiquette skill
    target_number: Item Availability target number as normal SR3 equipment acquisition
      (SR3 p272)
    on_requisition: Deduct the item base cost from Budget Pool
    street_index_applied: false
    price_negotiations_applied: false
    other_success_failure_effects: Use cited SR3 Availability system; page does not
      introduce new handling of failed Tests.
  limits: Organizational discretion and budget limits remain GM campaign context,
    not numeric unlimited entitlement.
  boundary: Requisitioning Gear on original printed p30 ends before Satellite Imagery;
    those separate imagery mechanics and tables are not included here.
framing: reference_exact
