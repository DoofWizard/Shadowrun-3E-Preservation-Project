  disguising_rules:
    ordinary_item_target_concealability: Equipment may freely be disguised as an ordinary
      object whose Concealability is lower than the equipment Concealability.
    required_increase_if_target_greater_or_equal: Raise original equipment Concealability
      to exceed ordinary object Concealability.
    maximum_increase_above_equipment_original: 3
    cost_increase_for_each_one_point_concealability_increase_fraction_of_base_cost: 0.5
    multiple_devices_in_one_item_minimum_device_concealability_above_disguise: 2
    spot_disguise:
      base_target_number_formula: Disguise object Concealability + 4
      successes_to_detect_phony_object: 1
      extra_successes: Help reveal true nature of object
    security_scanners_not_using_eyes:
      bypass_disguise: true
      applicable_concealability: Equipment normal unmodified Concealability
      examples:
      - chemsniffer
      - magnetic_anomaly_detector
    agency_requisition_availability: 8/96 hours
    agency_requisition_reference: Games of State Requisitioning Gear p30; not a general
      public street-market availability guarantee
