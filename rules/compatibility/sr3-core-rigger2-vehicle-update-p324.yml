rying the passenger is under attack.","scope":"Passenger character, not vehicle Control Pool."},"related_accepted_canon":["compatibility.rigger2.general-precedence","rule.vehicles.sr3-core-vehicle-condition-rigger-p145","rule.vehicles.damage","rules/compatibility/sr3-core-vr2-matrix-update-p325.yml"],"source_review_receipt":{"independent_original_images":"Original cataloged FASA7001 scan, printed p324/PDF332, full page and Rigger 2 right-column procedure, independently visually inspected and reconciled with already accepted SR3 core vehicle and Rigger 2 precedence records.","reviewed_human_text_paths":["edition_scope","headline","summary","data.publication.*","data.source_section","data.source_precedence.*","data.passenger_initiative.*","data.crash_tests.*","data.vcr_driving_modifiers.*","data.rigger_dodging.*","data.vehicle_weapon_damage.*","data.spells_against_vehicles.*","data.passengers_under_attack.*","data.related_accepted_canon[*]","data.source_review_receipt.*"],"substance_boundary":"Specific historically scoped Rigger 2-to-SR3 update test modifiers and exceptions; duplicate generic SR3 p145 first-pass passenger initiative and general precedence are cross-referenced rather than independently superseded.","no_execution_claim":"This source audit and structural transaction preflight do not prove whole FASA7001 rulebook completion or playable engine tests."}},"headline":"FASA Corporation Shadowrun Third Edition (FASA7001) fictional tabletop Rigger 2 vehicle update, printed p324/PDF332","summary":"Original SR3 conversion rules for legacy Rigger 2: rigger/passenger initiative, crash-test choice, VCR Driving modifiers, Control Pool dodging, vehicle weapon and spell damage, and passenger half Combat Pool.","framing":"reference_exact"}
