id: rule.compatibility.mm-sr2-augmentation-update-p7
record_type: rule
status: source_reviewed
source: source.mm
printed_pages: "7"
pdf_pages: "7"
edition_scope: SR3
content_class: [rule_procedure]
headline: "FASA Corporation 1999, FASA7126 Man & Machine: Cyberware, Shadowrun Third Edition fictional tabletop rules, printed p7/PDF7: Updating Your Characters"
framing: reference_exact
data:
  applicability: "Existing SR2 characters updated to SR3 using Man & Machine."
  reconfigured_cyberware:
    named_examples: [tactical computer, encephalon]
    change: "Some multi-function units were reconfigured; some were divided into smaller devices."
  cyberlimb_attachments:
    additional_essence_cost: 0
    scope: "Multiple attachments accommodated by cyberlimb space, subject to the book's specific cyberlimb rules."
  installed_cyberware_update:
    action: "Consult the revised descriptions of existing gear and adjust character Essence to reflect changes."
  bioware_update:
    essence_cost: 0
    maximum_bio_index: 9
    drawbacks_apply_to: [mundanes, magicians]
    suggested_over_limit_resolution: "Select existing bioware items to cease functioning until the bioware points cost is 9 or less."
    suggested_not_mandatory: true
    warning: "Excess bioware relative to Essence carries severe penalties; use the book's bioware rules for the exact threshold and effects."
    inactive_item_accounting: "The introduction gives no general method for reactivation or removal; this guidance is for updating existing characters."
  later_mechanics: "Use the revised implant, healing and surgery rules rather than treating this introduction as a complete conversion algorithm."
