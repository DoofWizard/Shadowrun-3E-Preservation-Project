source: source.fanpro-10667
printed_pages: '60-62'
pdf_pages: '61-63'
edition_scope: FanPro Sprawl Survival Guide (FanPro10667, 2003), Shadowrun Third Edition fictional tabletop supplement
content_class: [rule_exact]
framing: reference_exact
headline: FanPro10667 SR3 fictional international travel eligibility, printed pp60–62/PDF61–63
summary: Game-setting passport medium, visa exceptions, destination-specific permits and attributed restrictions, without additional dice mechanics.
data:
  attribution: In-world narrator Rancine, except separately attributed commentary
  passport:
    encoded_on: registered credstick
    scope: commercial international travel
  visa:
    requirement: destination-dependent
    exceptions:
      - citizens of NAN countries traveling to other NAN countries do not require visas
      - CAS and UCAS do not require visas from each other's citizens
      - California is described as dispensing with visas
    application_channels: [online, consulate, embassy]
    customary_checks: [identity, credit balance]
    security_review: destination evaluates whether applicant presents a terrorism, crime, smuggling or espionage risk
    variable_application_factors: [country of origin, criminal SIN, sometimes metatype]
    additional_information_may_include: [medical and inoculation records, itinerary, hotel reservations]
    restricted_equipment: permits and licenses from the country of origin may be required for restricted equipment, including implants, cyberdecks, software and foci
    strict_magic_jurisdictions:
      named_examples: [United Kingdom, Tir na nÓg]
      requirement: magicians must register and obtain a permit for legal magic use
    processing: several weeks described; refusal remains possible
    possible_acceptance_conditions: [blood or tissue sample retained for potential ritual magic in the fictional setting, limited duration, mandatory reporting of itinerary changes]
  attributed_qualifications:
    Spook_consular_jurisdiction: consular or embassy premises are extraterritorial; applicants discovered presenting false identification are subject to that jurisdiction's arrest and prosecution; the speaker claims higher approval likelihood for in-person applications
    Paper_Chaser: student and work visas generally last longer than tourist visas and are harder to obtain; additional personal data, company or school acceptance and reason for study or work are required
    Turner: corporate citizens generally have easier visa access, particularly work visas, when their megacorporation operates in the destination
    Spook: citizens of both Tirs are prohibited from entering Aztlan; Tsimshian and Salish-Shidhe Council impose reciprocal travel prohibitions on their citizens; other destinations may lead to questioning on return
  scope: Fictional jurisdiction-specific eligibility; no uniform visa duration, fee, dice test or target number stated. Not real-world immigration policy.
  reuse: [rule.ssg-sin-citizenship-status-p37, rule.ssg-credstick-validation-lifecycle-p38-40, rule.ssg-fictional-magic-licensing-citizenship-p43-44]
