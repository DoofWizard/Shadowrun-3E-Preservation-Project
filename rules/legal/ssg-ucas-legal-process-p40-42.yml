source: source.fanpro-10667
printed_pages: '40-42'
pdf_pages: '41-43'
edition_scope: FanPro Sprawl Survival Guide (FanPro10667, 2003), Shadowrun Third Edition fictional tabletop supplement
content_class: [rule_procedure]
framing: reference_exact
headline: FanPro10667 SR3 fictional UCAS jurisdiction, custody and hearings, pp40-42/PDF41-43
summary: Published fictional law-enforcement and court-process conditions, including source-specific detention, bail and appearance timing.
data:
  jurisdiction_p40_41:
    extraterritorial_corporate_property: ordinary police access is not automatic
    private_law_enforcement_contractor: corporate property requires proper warrants
  police_p41:
    detention_without_charge_max_hours: 72
    stop_person_or_vehicle_for_checks: permitted for ID, vehicle registration and insurance
    personal_vehicle_search_and_astral_scan_warrant_required: false
    private_property_search_or_scan: consent or probable cause
    records_request_warrant_required: false
    records_scope: [Matrix logs, credit histories, phone records, utility information, GridGuide records, other files]
    surveillance_authorization: generally not required except wiretaps and mind probes
    typical_unit_equipment: [metal-detection wand, cyberware scanner]
    random_checkpoint_equipment: chemical sniffers
    awakened_officer_detection: Catalogue and astral scanning; no new spell rating or test provided
  court_p42:
    initial_appearance_max_days_after_arrest: 3
    hearing_medium: usually telepresence; high-profile hearings still in person
    initial_hearing: formal charges; possible bail depending on offense and judge
    bail_granted: released on recognizance to return on designated court date; conditions may restrict location or association
    bail_unavailable_or_refused: remand to custody until trial
    failure_to_return: bail forfeited if no reappearance within the set timeframe
    bail_bond: loan for bail period, usually secured by property or other collateral
    representation: entitlement from arrest onwards; state-appointed representative may be requested if unable to pay
    minor_cases: initial hearing may resolve plea and sentence; some municipal courts try minor cases without jury
    ordinary_not_guilty_trial_jurors: 12
    jury_qualification: usually twelve; varies by case
    trial_duration: varies from one day to several years
    sentencing_options: [fine, incarceration, both]
    first_offender_discretion: especially with mitigating circumstances, judge may suspend sentence with probation or substitute community service for incarceration
    appeal: conviction or sentence may be appealed; senior court may decline meritless case
  attributed_p42:
    Legal Beagle: courts now operate 24 hours a day, seven days a week via telepresence
    Tracker: most bail agents offer 10 percent of bail for skip-tracing
    Nuyen Nick: megacorporate SIN holders excluded from juries except dual UCAS citizens
    Eurasian: ordinary local rules apply to valid SIN holders; some federal offenses may entail indefinite detention without charges or trial, and the SINless lack the ordinary protections in this account
  scope: Published fictional UCAS legal framework; CAS broadly similar, other jurisdictions may differ. No new universal skill test or real-world legal rule.
  reuse: rule.gear.sr3-core-gear-legality-permits-fines-p273-274
