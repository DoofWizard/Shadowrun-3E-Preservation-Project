id: rule.system-failure.jormungand-p67
record_type: rule
status: ingested
source: source.fanpro-25014
printed_pages: '65-67'
pdf_pages: '66-68'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: 'Fictional Shadowrun SR3 System Failure (FanPro, FanPro25014), pp65-67/PDF66-68: Jormungand statistics and Matrix encounter conditions'
data:
  publication:
    title: System Failure
    publisher: FanPro
    edition: SR3
    catalog: FanPro25014
  name: Jormungand
  kind: Chimaera, unique daemon/worm construct
  persona:
    bod: 6
    evasion: 5
    masking: 2
    sensors: 5
  pilot_rating: 5
  hacking_pool: 6
  attack: '6D'
  echoes:
    - Cascading Code
    - Enhanced Distortion Echo
    - Siphon
    - Traceroute
  traceroute_scope: high traffic areas
  cascading_code:
    rating_increment: 1
    affected: [all Persona Ratings, Attack Rating]
    triggers: [each minute after release, each defeat in cybercombat]
  enhanced_distortion_echo:
    turns_present_in_host_per_increment: 2
    local_target_number_increment: 1
    maximum_modifier: {system_security_value_multiplier: 2}
    affected_tests: tests involving non-Dissonant users, subsystems, constructs and programs
  branch_resolution:
    code_egg_exists: Respawns at the nearest Dissonance Pool after defeat, with Cascading Code escalation.
    code_egg_host_destroyed: The corresponding branch decays; existing damage persists.
  additional_conditions:
    p65_pdf66:
      respawn_location_alternative: nearest Dissonance Pool or egg-host
      respawn_delay: mere seconds
      code_egg_upload_requires_dissonant_otaku_presence: true
    p66_pdf67:
      avoids_resonance_wells: true
      dissonant_code_interaction_with_resonance_well: unknown in source
    p67_pdf68:
      recommended_minimum_eggs_and_nest_sites_per_continent: 6
      respawn_location_as_stated: nearest Dissonance Pool
  source_discrepancy: p65 includes egg-host as an alternative respawn location; p67 names only the nearest Dissonance Pool. Both statements are retained without adjudication.
