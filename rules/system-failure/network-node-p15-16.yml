headline: 'FanPro System Failure (FanPro25014, SR3), fictional tabletop RPG pp15-16/PDF16-17: Network Node augmentation and operating conditions'
data:
  publication: {title: System Failure, publisher: FanPro, edition: SR3, catalog: FanPro25014}
  node_headware:
    appearance: The game describes the suite as resembling ordinary business cyberware on most cursory security or medical scans.
    fragment_storage:
      compressed_headware_memory: true
      data_lock: true
      encryption_rating: 8
      accessible_to_node: false
      contents: Deus and Megaera code fragments
    secondary_memory: Used with cranial cyberdeck and datajack/knowsoft link.
    additional_components: [internal radio transceiver, subdermal speakers, transducer, internal simsense transceiver, headware sensory links]
    simsense:
      transmission: Full-X ASIST over encrypted radio carrier
      sensory_sharing: true
      memories_and_experiences: sometimes
      approximate_direct_range_meters: 20
      matrix_sharing: true
  node_bodyware:
    only_bodyware: skillwires
    skillwire_rating: 6
    skillsoft_use_requires: knowsoft link
  fictional_ai_possession:
    requires_active_matrix_connection: true
    enabling_implants: [skillwires, sensory links]
    effect: Deus can assume control of the fictional Node's senses, memories and body.
  fictional_code_compilation:
    connection: Matrix
    compilation_duration: predetermined, no numeric interval specified
    fragment_copy_on_network_connection: true
    compiling_without_node: Requires computing power comparable to the SCIRE; Deus lacks such a facility.
    replacement: If a Node is killed or captured, the stored fragment image can be transferred to a newly created Node.
  unspecified_statistics: [Essence, monetary cost, Availability, memory capacity]
