headline: 'System Failure (FanPro25014, FanPro, SR3): fictional tabletop character consequences, printed p81/PDF82'
data:
  publication: {title: System Failure, publisher: FanPro, edition: SR3, catalog: FanPro25014}
  heading: Consequences
  context: Crash 2.0 fictional event
  eye_damage:
    condition: Character faces the flash at the event and lacks adequate eye shielding.
    effect: Possible eye damage.
  direct_damage:
    applicable_characters: Characters within 2 kilometers of the fictional event center and characters in tall buildings may suffer direct effects.
    base_damage_code: 20D
    power_modifier_per_100_meters_out: -1
  indirect_damage:
    effect: Possible secondary shockwave injuries; the text supplies no separate game damage code for these effects.
  astral_effect:
    severe_astral_disturbances: true
    heightened_background_count: true
    duration: Months, possibly years.
    numeric_background_count: null
  discretion: The consequences are possible effects for the gamemaster to portray, not automatic injury for every character.
