data:
  character_advancement:
    entity: entity.chemistry.anabolic-steroids
    prerequisite: The fictional character meets the source-described regular intensive game-item use and exercise condition.
    qualifying_weeks: desired_attribute_score
    karma_cost_reduction:
      Strength: {fraction: '1/2', rounding: up}
      Body: {fraction: '1/4', rounding: up}
    rounding_target: not separately specified by source
    longer_term_game_consequences:
      gm_discretion: true
      permitted_game_representations: [appropriate Flaws, modifiers, occasional Stress damage]
  acth:
    entity: entity.chemistry.acth
    implant: entity.bioware.adrenal-pump
    activation_rule: reuse existing implant activation and game-item references
    addictive: false
    tolerance_accumulates: true
    accumulated_tolerance_consequence: external implant trigger becomes ineffective
    tolerance_threshold: not specified in this clause
