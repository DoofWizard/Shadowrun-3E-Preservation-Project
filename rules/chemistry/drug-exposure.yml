id: rule.chemistry.drug-exposure
record_type: rule
name: Drug Exposure and Resistance
domain: chemistry
status: ingested
source: source.mm
printed_pages: '105-106'
pdf_pages: '106-107'
edition_scope: SR3
content_class: [rule_exact]
effective:
  status: current
  source: source.mm
  page: 105
  basis: extends
scope:
  applies_to: [subsystem.chemistry.drugs]
resolution:
  summary: The fictional compound Vector determines whether exposure applies. Resolve a Body Damage Resistance Test using the compound Power as target number after Speed, adjusted by the game exposure and protection rules. Resistance can stage Damage Level down but not up; additional dosage is a separate rule.
  inputs: [Vector, Power, Damage Level, Speed, exposure conditions, protective gear, Body]
  outputs: [damage/effects suffered]
links:
  uses: [rule.combat.damage-codes, rule.tests.success-test]
  affects: [rule.condition.condition-monitor]
  modified_by: []
  interacts_with: [rule.chemistry.additional-dosage]
sources:
  - {source: source.mm, page: 105, relation: extends, note: 'Drug Attributes / Determine Exposure'}
  - {source: source.mm, page: 106, relation: clarifies, note: 'Exposure modifiers / Body Resistance Test / Applying an Antidote'}
notes:
  - The four original Vector categories are contact, ingestion, inhalation and injection.
  - Separate weapon-damage and compound-resistance tests apply when both are applicable.
data:
  speed:
    immediate_test_timing: end of same Combat Turn
    one_combat_turn_test_timing: end of following Combat Turn
  effects:
    default_applies_even_if_damage_resisted: true
    exception: unless otherwise stated
    extent_of_game_exposure_can_mitigate_effects: true
  resistance:
    pool: Combat Pool
    pool_allocation_timing: when attack is made
    same_allocated_dice_apply_to_both_tests: true
    current_later_turn_pool_not_available_for_delayed_test: true
    damage_causing_weapon_test_timing: immediate
    compound_test_timing: after Speed
  antidote:
    before_speed_elapsed: {compound_nullified: true, damage: none, other_effects: none}
    after_speed_elapsed: {further_damage: none, other_effect_potency_multiplier: 0.5, healing_test_target_modifier: -2}
  worked_game_example:
    original_damage_code: 12L Stun
    modified_damage_code: 10L Stun
    body_dice: 3
    previously_allocated_combat_pool_dice: 3
    resistance_dice: 6
    resistance_successes: 1
    remaining_damage: Light Stun
    separate_effects_test: {attribute: Body, target_number: 5, successes: 1, action_modifier: 4, duration_minutes: 8}
  exposure_modifiers:
    basis: Original p106 Exposure Modifiers table; game Power modifiers, not actual medical or protective efficacy.
    gamemaster_exposure_discretion: true
    contact:
      full_body_exposure: {game_power_modifier: 4}
      semi_protective_gear: {game_power_modifier: -2}
      chemsuit: {game_power_modifier: '-Rating'}
    ingestion:
      character_vomits_before_speed: {game_power_modifier: -4}
      stomach_pumped_before_speed: {game_power_modifier: -8}
    inhalation:
      wet_rag_over_nose_and_mouth: {game_power_modifier: -1}
      chemsuit_air_filter: {game_power_modifier: '-Rating'}
      respirator:
        core_rule: rule.survival.sr3-core-gear-effects-p293-294
        core_fields: data.respirator.damaging_gases
        original_values_match_core: true
        apply_once: true
    equipment_cross_references:
      envirosealed_armor: {game_contact_protection: true, installed_respirator_rule: as_above, core_rule: rule.armor.sr3-core-camouflage-shield-security-effects-p284}
      hazmat_and_xe: {record: entity.gear.hazmat-xe, reuse_existing_game_effects: true}
    game_dosage_unit: abstract source-defined game unit; no physical amount inferred
  game_attack_resolution:
    exposure_requires_successful_hit_not_completely_dodged: true
    game_power_increase_per_two_attack_successes: 1
    damage_causing_attack_successes_cannot_stage_weapon_damage_up: true
    game_impact_armor_power_reduction: 'floor(Impact Armor / 2)'
    successful_called_shot_game_armor_effect: nullifies Impact Armor
    damage_causing_called_shot_choice: [negate armor, stage weapon Damage Level]
headline: 'FASA7126 Man & Machine: Cyberware (FASA Corporation, 1999, fictional Shadowrun Third Edition tabletop RPG), pp105-106/PDF106-107: resistance timing, dice pools, and fictional condition modifiers'
framing: reference_exact
