id: rule.chemistry.addiction
record_type: rule
name: Substance Addiction
domain: chemistry
status: ingested
source: source.mm
printed_pages: '108-109'
pdf_pages: '109-110'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: SR3 fictional character addiction tests and progression
summary: FASA7126 Man & Machine, FASA Corporation, 1999, Shadowrun Third Edition tabletop RPG; printed pp108-109/PDF109-110. Character-sheet mechanics only.
effective: {status: current, source: source.mm, page: 108, basis: defines}
scope:
  applies_to: [fictional characters using addictive substances, including BTLs]
resolution:
  summary: Game tests determine initial dependence, recurring rating increases, Fix Factor intervals and monthly character consequences.
  inputs: [Addiction Rating, Addiction Code, Tolerance Rating, Edge, Fix Factor, Body, Willpower, use count]
  outputs: [addiction state, modified ratings, character sheet consequences]
  steps: []
data:
  addiction_rating: target number for resistance to addiction
  addiction_codes: {P: physical, M: mental, both: separate tests and potentially separate ratings}
  edge: {left_of_slash: pre-addiction, right_of_slash: post-addiction, rating_increment: 1, incremented_ratings: [Addiction, Tolerance], trigger: each multiple of applicable Edge use count, cumulative: true}
  fix_factor: maximum interval between uses for an addicted fictional character
  tolerance_rating: measure used for tolerance tests
  initial_test:
    timing: first use
    tn: base Addiction Rating
    dice: {mental: unaugmented Willpower, physical: Body}
    successes_to_avoid_addiction: 1
    both_codes: separate tests
    dwarf_physical_bonus_dice: 2
    dwarf_mental_bonus_dice: 0
  subsequent_pre_addiction_test: {trigger: each increase in Addiction Rating, tn: modified Addiction Rating, dice: Body or Willpower according to code, failure: addicted}
  on_becoming_addicted: {addiction_rating: base Addiction Rating plus 1}
  fix_interval:
    extension_test: {dice: Body or Willpower according to code, both_if_necessary: true, tn: current Addiction Rating, maximum_extensions: 1, success: skip one Fix Factor interval}
    missed_deadline: immediate withdrawal
  monthly_effects:
    test: {dice: Body and/or Willpower according to code, tn: current Addiction Rating, interval: one month}
    failure: {permanent_body_loss: 1}
    at_body_one:
      further_body_loss: false unless Body is raised
      permanent_body_racial_modified_limit_reduction: 1
      permanent_body_attribute_maximum_reduction: 1
      weekly_player_choice: [lose one Physical Condition Monitor box, lose one Mental Condition Monitor box, permanently lose 0.25 Essence]
    awakened_essence_loss: check Magic Loss per SR3 p160
    essence_zero: character dies
    monitor_loss: {from_end: Light, treat_as_damage_filled: true, first_box_tn_modifier_all: 1, ten_physical_boxes: character dies, ten_stun_boxes: coma}
  examples:
    addiction: {base_rating_code: 4M, edge: '5/50', willpower: 5, fifth_use_tn: 5, fifteenth_use_tn: 7, failed_test_rolls: [1, 2, 2, 2, 5], post_addiction_rating: 5}
    fix_interval: {fix_factor_days: 2, modified_addiction_rating: 6, extended_interval_days: 4}
    monthly: {first_month_tn: 7, later_tn: 10, later_failed_test_body_loss: 1}
links: {uses: [rule.tests.success-test], affects: [], modified_by: [], interacts_with: [rule.chemistry.tolerance, rule.chemistry.withdrawal]}
sources:
  - {source: source.mm, page: 108, relation: defines, note: Substance Abuse and Becoming Addicted}
  - {source: source.mm, page: 109, relation: extends, note: Getting a Fix and Addiction Effects; worked examples}
notes: []
