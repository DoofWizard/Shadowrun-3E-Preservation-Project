      glare: [2, 2, [4, 2], [4, 2], [4, 2], 1]
      mist: [2, 2, [2, 0], [2, 0], [0, 0], 1]
      light_smoke_fog_rain: [4, 4, [4, 2], [4, 2], [0, 0], 2]
      heavy_smoke_fog_rain: [6, 6, [6, 4], [6, 4], [1, 0], 3]
      thermal_smoke: [4, 4, [4, 4], [4, 4], [8, 6], 2]
