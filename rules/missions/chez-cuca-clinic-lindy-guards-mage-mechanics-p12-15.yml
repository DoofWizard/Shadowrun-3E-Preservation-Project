data:
  publication_context: 'Fictional tabletop RPG archival source: Missions, FASA Corporation,
    copyright 1996, FASA7325, original Second Edition, source.fasa-7325, printed pp12,13,14,15/PDF
    pp13,14,15,16.'
  source_review_scope: Statements below report this fictional published source; scenario
    options are hypothetical game-master branches, not historical assertions or real-world
    advice.
  historical_edition: All stats below transcribe Shadowrun Second Edition game information
    for the fictional FASA7325 adventure. No SR3 conversion is implied.
  clinic_detection_tests:
    printed_p13_surgery: Biotech (6) or Cybertechnology (4) successfully reveals that
      the surgery equipment, made to look old, is well-maintained and current.
    printed_p13_recovery: Perception (5), requiring 1 or more successes, reveals that
      each recovery bed has an unusual high-quality custom simsense unit.
  facility_maglocks:
    ordinary_rooms_rating: 6
    command_center_rating: 10
  project_staff_and_random_presence:
    powell_office_presence: Powell is in his office on 2 in 6 checks; otherwise he
      is typically occupied elsewhere.
    command_center_population: Twenty or so noncombat scientists, staffers and technicians
      in addition to dedicated command security.
  lindy_npc:
    attribute_sequence: B6 Q6 S6 I4 W5 C4 E2.15 R5(10)
    armor: 4/3
    initiative: 10 + 3D6
    threat_professional_rating: 4/3
    body_index: 1
    skills: Firearms 6; Unarmed Combat 6
    cyberware: Retractable Spur; Skillwires Plus (3); Softlink (3); Wired Reflexes
      (2)
    bioware: Enhanced Articulation; Orthoskin (3); Trauma Damper
    gear: Form-Fitting Body Armor-2 (3/1); Ares Viper Silvergun [Heavy Pistol, 30
      (clip), SA/BF, 9S(f)]; Skillsofts for Music (3), Biotech (3), and Amazonian
      Portuguese (3)
  renraku_guards_12:
    count: 12
    attribute_sequence: B4 Q3 S3 I3 W3 C2 E5.5 R3
    armor: 4/1
    initiative: 3 + 2D6
    threat_professional_rating: 3/3
    skills: Armed Combat 3; Firearms 4
    cyberware: Boosted Reflexes (1)
    gear: Form-Fitting Body Armor-3 (4/1); SCK Model 100 [SMG, 30 (clip), SA/BF, 7M]
      with sound suppressor; AZ-150 Stun Baton [+1 Reach, 8S Stun]
  security_mage:
    attribute_sequence: B2 Q4 S2 I6 W5 C3 E6 R5 M6
    armor: 4/1
    initiative: 5 + 1D6 (21 + 1D6 when astral)
    threat_professional_rating: 4/3
    skills: Conjuring 4; Firearms 3; Sorcery 6
    gear: Form-Fitting Body Armor-3 (4/1); SCK Model 100 [SMG, 30 (clip), SA/BF, 7M]
      with sound suppressor
    spells:
    - False Memory 6
    - Manabolt 6
    - Mind Probe 5
    - Stunball 4
    - Treat 4
    astral_patrol: The mage spends 10 minutes astrally patrolling, then rests for
      20 minutes.
    watchers: The mage has a Force 3 watcher spirit in each of the above-ground businesses;
      they can alert her when an outsider enters.
  entry_devices: Fictional entrances are equipped with cyberware scanners and project
    personnel can monitor security cameras. The page identifies concealed storage-room
    doors without providing a numeric lock target other than the general maglock ratings.
framing: reference_exact
