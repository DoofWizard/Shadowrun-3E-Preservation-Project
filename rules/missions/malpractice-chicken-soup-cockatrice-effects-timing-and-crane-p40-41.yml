    "source_context": "Fictional tabletop role-playing game: Missions (FASA7325), FASA Corporation (1996), original Shadowrun Second Edition adventure collection, catalog source.fasa-7325. Printed pp40–41/PDF41–42.",
    "historical_mechanics": "Original Shadowrun Second Edition fictional Malpractice / Chicken Soup mechanics from printed pp40–41; do not convert automatically to SR3.",
    "sedation": "The sedated cockatrices are not asleep. They remain aware of the environment, initially groggy and docile because of a mild sedative; the fictional book states their powers can be used but are impaired while the sedative operates.",
    "attack_target_modifier": "A +2 target-number modifier applies to ANY attack made by the sedated cockatrices; this affects their attacks, not the player character’s attack TN.",
    "quickness_reaction": "While sedated, cockatrice Quickness and Reaction are each halved, with fractional results rounded down.",
    "damage_code": "A successful attack still deals 8M damage. The source points to Shadowrun Second Edition pp222 and 233.",
    "noise_and_wakeup": "Sounds louder than casual conversation and pain can shock the cockatrices out of their sedated state. A single gunshot makes 3D6 cockatrices panic and scatter; each additional gunshot restores another 3D6 cockatrices to full faculties. The source describes flapping, vigorous movement and awakening as consequences.",
    "temporal_progression": "After THREE people have been rescued, the cockatrices become edgy. After the FIFTH rescue, they have become fully conscious and aware. The rules’ exact ordinal thresholds are preserved; the wording is not a universal timeline for other encounters.",
    "crane_operation": "A successful Perception (5) Test identifies the controls for the gripper crane inside the warehouse. An access ladder leads to a small 8-foot by 6-foot platform housing its controls, near the warehouse southeast corner. The book describes the crane as tracking along the ceiling and being movable across the warehouse. The test is for recognizing the controls, not for a separate invented operation skill.",
    "gm_condition": "The gamemaster may extend the surrounding yakuza / Knight-Errant armed conflict into the warehouse, but this is an optional story branch and not a mandatory mechanical effect."
  },
