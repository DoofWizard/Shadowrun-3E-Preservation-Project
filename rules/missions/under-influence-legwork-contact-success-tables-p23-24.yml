data:
  publication_context: 'Fictional tabletop-RPG publication: Missions (FASA7325), FASA
    Corporation (1996), historical Shadowrun Second Edition fictional tabletop-RPG
    adventure anthology; catalog source.fasa-7325; printed pp23,24/PDF24,25.'
  legwork_overview: Characters may ask contacts about Sgt Franco Tanner, his alias
    Frank “Leopard” Leonard, Dr. Cuca and the Futuremen; all entries are game-master
    information tables keyed to skill-test successes.
  contact_tests:
  - subject: Sergeant Franco Tanner
    appropriate_contacts: Any Police contact
    target_number: 4
    results:
      '0': Contact does not recognize the name, joking about the surname.
      '1': Contact associates Tanner with Organized Crime Division and long-running
        undercover work; speaks favorably about undercover officers.
      2+: Contact knows Tanner as a capable clean-record officer and finds his undercover
        record justified.
  - subject: Frank “Leopard” Leonard
    appropriate_contacts: Any Street contact
    target_number: 4
    results:
      '0': Contact does not know the alias.
      '1': Contact associates Leopard with downtown gangs and introductions to street
        suppliers.
      2-3: Contact says Leopard has recently been asking about the Futuremen and trying
        to locate their activity.
      4+: Contact says Leopard’s contacts often encounter police and suspects he works
        for Lone Star.
  - subject: Dr. Cuca
    appropriate_contacts: Any Street contact
    target_number: 4
    results:
      '0': Contact guesses he might be a decker at Sybrespace.
      1-2: Contact thinks he is a new street doctor in Ravenna with a good reputation
        and favorable prices.
      '3': Contact says Cuca operates from MindSound Music and remarks on the difficulty
        of locating a skilled street doctor.
      4+: Contact suspects a medical or corporate supplier because of high-quality
        cyberware.
  - subject: The Futuremen
    appropriate_contacts: Any Gang or Street contact
    target_number: 4
    results:
      '0': Contact recalls a similarly named drumitar performer who vanished in 2054.
      '1': Contact knows the gang exists and may be violent toward outsiders in their
        territory.
      2-3: Contact believes the Futuremen have outside resources and recently obtained
        more cyberware.
      4+: Contact claims a gang member at Northgate appeared unaware of a raid attributed
        to him; the person was found dead two days later. The statement is an in-world
        contact allegation, not confirmed independent fact.
  attribution: All quoted-result tiers are fictional responses of unnamed in-world
    police/street/gang contacts. An absent success does not establish factual certainty
    of the informant’s assertions.
