data:
  publication_context: FICTIONAL Shadowrun tabletop-RPG adventure Missions (FASA7325),
    published by FASA Corporation (1996), original Second Edition; catalog source.fasa-7325;
    printed pp57-58/PDF pp58-59.
  edition_integrity: All values are quoted from the scanned original Second Edition
    adventure, with no conversions to Third Edition mechanics.
  search_procedure:
    matrix: Searching AresSpace or UCAS government databases requires a successful
      Computer Test against the specific subject Target Number. Steele supplies AresSpace
      passcodes, so a decker needs only Access and other Matrix tests on AresSpace.
      UCAS government searches use the sample UCAS system in Virtual Realities 2.0
      pp153–55, with this adventure’s Veil host connected to Host C (p154).
    ucas_locate_file: For player deckers using UCAS, perform Locate File System Test
      (Virtual Realities 2.0, System Tests p19) for files about the NASA probes, Project
      Cydonia, or Operation Discovery. Refer to the published NPC Deckers subsection
      for NPCs.
    success_pooling: 'UCAS/Veil host files: each retrieved file counts as successes
      for determining information from the section-specific Success Tables. The maximum
      successes listed per source cap its available information; the total number
      of successes determines detail. GM may supply actual narrative file details
      rather than only success totals.'
  ucas_veil_host:
    security_code: Red-9/17/19/15/17/15
    paydata: 13
    data_density: 2D6 X 5
    setting: A UCAS system in Washington DC, used by the fictional Department of Defense,
      with subordinate Veil. Standard UMS architecture, security sheaf similar to
      Virtual Realities 2.0 Host C but with lower triggers.
    security_sheaf:
    - trigger_step: 3
      event: Probe-9
    - trigger_step: 5
      event: Tar Baby-8
    - trigger_step: 7
      event: Trap Trace-10 (Killer-9)
    - trigger_step: 9
      event: Passive Alert
    - trigger_step: 11
      event: Expert Construct (Armor +2 Defense/-2 Offense), Trace-8, Tar Baby-5,
        Marker-6
    - trigger_step: 13
      event: Cascading Blaster-9
    - trigger_step: 15
      event: Active Alert; government decker alerted and will arrive next turn
    - trigger_step: 17
      event: Expert Construct (Armor and Shielding +2 Offense/-2 Defense), Black IC-8
        (lethal), Acid-7
    - trigger_step: 19
      event: Cascading Black IC-7 (lethal)
    - trigger_step: 21
      event: Shutdown
  npc_deckers:
    resourcing: Without an in-team decker, the players may requisition an AresSpace
      decker or hire a freelancer. For AresSpace, use Corporate Decker, Corporate
      Contacts p15, Shadowrun II Gamemaster Screen.
    fee_and_delay: Freelancer recruitment takes substantial time; the published minimum
      for UCAS-system work is 10,000 nuyen.
    simplified_search: For a borrowed or hired decker, the GM may perform a Computer
      Test vs Computer Search Target Number + 2, add Hacking Pool dice, and award
      one appropriate file for every 3 successes. Each file converts into an information-success
      count under the printed tables.
  nasa_2001:
    arespace_computer_target: 4
    arespace_contacts: Etiquette (Corporate) (6) Test
    arespace_contact_types:
    - Company Man
    - Corporate Secretary
    - Corporate Decker
    - other Corporate contacts (not Mr. Johnson)
    arespace_private_search: Steele-provided passcodes; Computer (3) Test retrieves
      files; up to 7 successes from AresSpace records/contacts
    ucas_computer_target: 7
    ucas_failed_test: On any failed test during a computer search, trace programs
      alert Veil officials who initiate a cleanup operation (see The Clean-up Crew,
      p60).
    ucas_contacts: Etiquette (Government) (6) Test; Government Official, Government
      Agent, Mercenary, other Government contacts
    independent_contacts: Etiquette (8) Test; Shadowland, Media Producers and Reporters,
      other plausibly informed contacts
    independent_cap: 5
  project_cydonia:
    arespace_computer_target: 4
    arespace_contacts: Etiquette (Corporate) (6) Test; Company Man, Corporate Secretary,
      Corporate Decker, other Corporate contacts (not Mr. Johnson)
    ucas_computer_target: 5
    ucas_failed_test: On any failed UCAS computer search test, trace programs alert
      Veil officials who initiate a cleanup operation.
    ucas_files: 3
    successes_per_ucas_file: 2
    ucas_contacts: Etiquette (Government) (6) Test; Government Agent, Government Official,
      other Government contacts
    independent_contacts: Etiquette (7) Test; Shadowland, Media Producers, Reporters
      and non-Ares Corporate contacts
    independent_cap: 8
  operation_discovery:
    ucas_computer_target: 9
    ucas_failed_test: On any failed test, UCAS trace programs alert Veil; see Clean-up
      Crew p60.
    ucas_files: 5
    successes_per_ucas_file: 4
    ucas_contacts: Etiquette (Government) (9) Test; consult continuing text on printed
      p60 for full details.
framing: reference_exact
