data:
  publication_context: 'Fictional tabletop RPG archival source: Missions, FASA Corporation,
    copyright 1996, FASA7325, original Second Edition, source.fasa-7325, printed pp3,4/PDF
    pp4,5.'
  source_review_scope: Statements below report this fictional published source; scenario
    options are hypothetical game-master branches, not historical assertions or real-world
    advice.
  historical_rules_basis:
    primary: Shadowrun, Second Edition (SRII), not SR3
    supplements:
    - 'Shadowrun Companion: Beyond the Shadows'
    - Grimoire, Second Edition (Grimoire II)
    - Virtual Realities 2.0 (VR2)
    mechanical_format: Published statistics use Shadowrun Second Edition format; the
      text says first-edition game masters need adjustments to NPC, weapon and spell
      statistics. No Third Edition conversion is supplied.
  success_test_notation:
    format: Skill (target number)
    example: Sorcery (5) is a Sorcery Success Test against target number 5.
    success_tables: 'A higher total of successes includes all information listed for
      lower totals: for example, 3 successes yield the information for 1, 2 and 3
      successes.'
  npc_professional_rating_from_second_edition:
    cross_reference: Shadowrun, Second Edition, p187
    rating_1: NPCs withdraw from a fight after taking a Light wound.
    rating_2: NPCs withdraw after taking a Moderate wound.
    rating_3: NPCs withdraw after taking a Serious wound.
    rating_4: NPCs continue fighting until unconscious or dead.
    application: The book recommends game masters adjust Threat Rating dice during
      an encounter to match opposition strength and party capability. Threat Rating
      dice substitute for Dice Pools under the cited Second Edition Professional Rating
      rule.
framing: reference_exact
