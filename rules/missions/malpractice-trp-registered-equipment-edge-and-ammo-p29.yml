data:
  publication_context: 'Fictional tabletop-RPG publication: Missions (FASA7325), FASA
    Corporation (1996), original Shadowrun Second Edition tabletop RPG adventure collection;
    publisher FASA Corporation; catalog/source source.fasa-7325; printed pp29/PDF30.'
  game_option: 'A character becoming a TRP automatically gains the Registered Equipment
    Edge (reference: original Shadowrun Companion, p34). This is a source-era game
    rule, not an SR3 conversion.'
  equipment_selection: TRPs receive weapons from DocWagon’s registered weapons list.
    The gamemaster may create the list, but allowable weapons should be able to use
    gel rounds or stun rounds.
  other_gear: The gamemaster can assign special non-lethal equipment, including Narcojects,
    tasers, shock or stun weapons (shock gloves, net guns and comparable items), subject
    to game approval. TRPs can have other survival equipment if registered. The source
    explicitly says there is no restriction on TRP cyberware.
  ammunition_accountability: Each TRP gets one round of real ammunition for a weapon
    of the TRP’s choice. It is confiscated when the HTR team returns from the mission.
    If fired, the TRP must explain its circumstances at DocWagon; if it strikes a
    person, the HTR team must bring the person in for treatment as well as recovering
    the client.
  game_scope: All provisions describe fictional tabletop role-playing character options
    and company rules rather than real-world weapons policy.
