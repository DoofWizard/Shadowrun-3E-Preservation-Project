data:
  publication_context: 'Fictional tabletop-RPG publication: Missions (FASA7325), FASA
    Corporation (1996), historical Shadowrun Second Edition fictional tabletop-RPG
    adventure anthology; catalog source.fasa-7325; printed pp22,23/PDF23,24.'
  facility_timeline:
    trigger: Elapsed hours:minutes start when characters defeat Futuremen or escape
      their ambush; default times are GM-adjustable
    events:
    - - 0:00
      - Defeat Futuremen, or Cuca and colleagues realize some characters escaped.
    - - 0:02
      - Cuca alerts Powell; Powell orders evacuation, guard alert and staff equipment
        pack-up.
    - - 0:05
      - MindSound Music doors lock and a CLOSED sign is displayed.
    - - 0:10
      - Unmarked Renraku trucks arrive; staff load equipment.
    - - 0:12
      - Powell starts transmitting Matrix data to Renraku via a short-term emergency
        SAN.
    - - 0:27
      - Matrix transmission finishes; Powell begins wiping Host C.
    - - 0:30
      - Data wipe finishes; staff load computer systems.
    - - 0:35
      - Guards place explosive charges to destroy non-portable equipment or evidence.
    - - 0:45
      - All mobile equipment has been loaded; trucks depart; other personnel remain.
    - - 0:55
      - Guards finish placing charges and depart with Cuca and Powell.
    - - '1:00'
      - The charges detonate; characters in underground rooms take 9D damage, and
        remaining Futuremen project evidence is destroyed.
    special_footnote: 0:02 may be increased as needed if characters must follow more
      leads; Powell can delay even days or believe the characters died. Source marks
      this row with an asterisk.
  award_individual_karma:
    survival: 1
    threat: 3
    discovering_cuca_is_behind_futuremen: 1
    obtaining_sufficient_proof: 1
    keeping_tanner_alive: 1
    unit: Karma points; award as listed; source directs standard SRII p199 rules for
      individual Karma
  rules_context: Exact historical Second Edition fictional game scenario table, not
    an actionable real-world facility procedure.
