data:
  publication_context: FICTIONAL Shadowrun tabletop-RPG adventure Missions (FASA7325),
    FASA Corporation 1996, original Shadowrun Second Edition, catalog source.fasa-7325,
    printed pp60/PDF pp61.
  fictional_subject: The NASA/UCAS/Veil events and official contacts belong to the
    authored fictional alternate-history campaign.
  operation_discovery_ucas_matrix: 'Continuation of the printed-p58 Operation Discovery
    UCAS/Veil computer search: each file found counts as 4 information successes;
    the search may retrieve 5 files.'
  government_contacts:
    test: Etiquette (Government) (9) Test
    contact_types:
    - Government Agent
    - Government Official
    - other Government contacts
    qualification: The source says contacts resist this unusually sensitive subject
      and require persuasive inquiries.
  independent_contacts:
    test: Etiquette (9) Test of the appropriate type
    contact_types:
    - Shadowland
    - Media Producers
    - Reporters
    - other plausible conspiracy enthusiasts
    maximum_successes: 5
    topic: Operation Discovery information from sources outside AresSpace and UCAS
      government.
  investigation_branching:
    yavin: Lieutenant Colonel Yavin encounter follows an interest in the astronaut.
    zeus: Dr. Zeus follows inquiry into a project scientist.
    xavier: Mr. Xavier, I Presume? follows inquiry into Karl Xavier.
    storage: If the characters reach 12 or more information successes about Operation
      Discovery, they learn the secret Kansas storage site and can pursue Tales of
      Hoffman.
  cleanup_crew:
    when: The fictional game master may bring in Veil’s cleanup crew shortly after
      the characters begin investigating; exact timing and encounter location are
      optional.
    members: John Silver (former mercenary) commands, Jason “Eldritch” Mason is a
      combat mage, and six trained UCAS soldiers complete the team.
    cross_references: Tales of Hoffman p67 gives soldiers’ statistics; Cast of Shadows
      p71 gives Silver and Eldritch statistics.
    optional_gm_helps: The source recommends a discretionary Draco Foundation contact
      to provide hints if players cannot uncover Operation Discovery; player characters
      remain corporate employees subject to in-world AresSpace expectations.
framing: reference_exact
