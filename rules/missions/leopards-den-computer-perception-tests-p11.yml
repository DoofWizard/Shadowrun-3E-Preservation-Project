data:
  publication_context: 'Fictional tabletop RPG archival source: Missions, FASA Corporation,
    copyright 1996, FASA7325, original Second Edition, source.fasa-7325, printed pp11/PDF
    pp12.'
  source_review_scope: Statements below report this fictional published source; scenario
    options are hypothetical game-master branches, not historical assertions or real-world
    advice.
  source_scope: Numerical tabletop game mechanics for a fictional hotel investigative
    encounter; Shadowrun Second Edition historical values are preserved without Third
    Edition reinterpretation.
  hotel_access_payment: The hotel clerk may accept an in-game payment of at least
    250 nuyen, with larger amounts possible for suspicious characters; the scenario
    says such an expenditure can appear in an expense report only after approximately
    six months. This is a fictional game-master contingency.
  terminal_security: A successful Computer (5) Test bypasses the terminal’s password
    security. The personal data file is encrypted using the equivalent of Scramble-6
    IC; recovering it requires a Computer (10) Test, reducing the target number by
    the rating of any Decrypt utility used.
  tanner_return_detection:
    watch_character: Lookout succeeds with Perception (5) to recognize the approaching
      person as Tanner.
    tanner_notices_watch: Tanner has a Perception (6) Test to detect a concealed observer,
      with the target number adjusted up or down for the lookout’s actual concealment.
    tanner_notices_entry: Tanner has a Perception (4) Test to notice signs of forced
      entry in the hotel suite.
  source_rules_status: These values are attached to optional scene branches and must
    not be interpreted as generic security-system instructions.
