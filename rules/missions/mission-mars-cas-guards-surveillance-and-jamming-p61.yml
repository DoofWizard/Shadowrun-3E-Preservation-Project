data:
  publication_context: FICTIONAL Shadowrun tabletop-RPG adventure Missions (FASA7325),
    FASA Corporation 1996, original Shadowrun Second Edition, catalog source.fasa-7325,
    printed pp61/PDF pp62.
  editional_integrity: All Second Edition game statistics and test parameters are
    preserved as originally printed, without Third Edition conversion.
  cas_air_force_guards:
    count: 4
    attributes:
      B: 4
      Q: 4
      S: 4
      I: 3
      W: 3
      C: 3
      E: 6
      R: 3
    armor: 5/3
    initiative: 3 + 1D6
    threat_professional_rating: 3/3
    skills:
      Etiquette (Political/Street): 2/2
      Firearms: 5
      Unarmed Combat: 4
    gear:
    - Armor Jacket (5/3)
    - Ares Predator [Heavy Pistol, 15 (clip), SA, 9M, 1 spare clip]
    - HK227-S in guard shed [SMG, 28 (clip), SA/BF, 7M, 1 spare clip]
  surveillance:
    fictional_context: Veil planted surveillance devices in homes and offices of people
      with Operation Discovery knowledge, including Yavin, after Dunkelzahn’s photos
      surfaced.
    bug_scanning: A character scanning Yavin’s home makes a Success Test, rolling
      dice equal to scanner rating against each bug’s rating (Target Number 7). Four
      Veil bugs are planted; each one takes 1 success to find, so 3 successes reveal
      3 of 4 bugs.
    jamming: A character using a jammer or white-noise generator makes a Success Test
      rolling dice equal to that device’s rating versus the bugs’ rating; any successes
      jam bug transmissions.
  gm_discretion: The published text allows Yavin to permit a scan, though he doubts
    visitors could plant listening devices unnoticed.
