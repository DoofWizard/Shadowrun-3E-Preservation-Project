data:
  publication_context: FICTIONAL Shadowrun tabletop-RPG adventure Missions (FASA7325),
    published by FASA Corporation (1996), original Second Edition; catalog source.fasa-7325;
    printed pp59/PDF pp60.
  mechanical_context: Each success range is printed in the source; information is
    offered by the GM as player investigation results, not historical claims about
    the real NASA or government. A plus suffix means that many or more successes.
  nasa_mars_mission:
  - successes: 0-2
    result: Common knowledge that NASA withheld Mars data; the photos in Dunkelzahn’s
      will were not among the originally publicized data.
  - successes: 4-5
    result: Image tags on the will photographs match those from NASA Security and
      Sentry probes, suggesting the photographs are legitimate.
  - successes: 6-8
    result: Though NASA never publicly admitted it, observers—especially UFO-watch
      groups—insist NASA mounted a follow-up mission to its 2001 expedition.
  - successes: 9-10
    result: Several years after the first mission NASA undertook secret Operation
      Discovery, commonly rumored as a follow-up.
  - successes: 11+
    result: Operation Discovery was a secret Mars mission following up the NASA Security
      and Sentry probe data, including the photos eventually made public through Dunkelzahn’s
      will.
  project_cydonia:
  - successes: 0-2
    result: Cydonia failed; evidence indicates that someone tampered with the received
      probe data, not ordinary failure caused by AresSpace.
  - successes: 3-4
    result: Returned data consisted of several minutes of static plus a clear image
      matching the photograph in Dunkelzahn’s will; the data showed signs of tampering.
  - successes: 5-6
    result: Evidence pointed to a MUFON (Mutual UFO Network) cell which had requested
      and been refused access to the mission data.
  - successes: 7-8
    result: Rumors within AresSpace and Shadowland say Ares struck the MUFON cell
      and that several of its members were reportedly killed.
  - successes: 9+
    result: Karl Xavier was involved in Project Cydonia, transferred from NASA at
      the 2016 buyout, later left AresSpace and heads rival Astrotech Industries.
  operation_discovery:
  - successes: 0-3
    result: Operation Discovery was a top-secret NASA mission launched after the 2001
      probe mission to investigate its data.
  - successes: 4-6
    result: A manned mission ran August 2011 to January 2012; Karl Xavier worked on
      the project and transferred from NASA to AresSpace in 2016.
  - successes: 7-8
    result: Lt. Col. James Yavin, the only surviving astronaut, is still alive; Dr.
      Robert Zeus (pronounced ZAY-US), a researcher of Mars samples, is also alive.
  - successes: 9-10
    result: A system failure caused a crash on Mars on December 24, 2011; three of
      eight crew survived and returned with samples.
  - successes: '11'
    result: Mars samples included stone from the pyramids and bones from the skeleton
      depicted in photographs from Dunkelzahn’s will.
  - successes: '12'
    result: Command capsule, samples, and research data are kept in an abandoned missile
      silo under the Hoffman farm in Kansas.
  printed_gap_note: NASA table prints no 3-success row, proceeding from 0–2 directly
    to 4–5; do not interpolate or invent a missing tier.
