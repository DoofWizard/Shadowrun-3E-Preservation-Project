    "astral_protection": "The fictional Michael follows the characters astrally, responds to an attack on his astral form using a Force 8 mana barrier, and forms a protective sphere of magic. The text states that the barrier protects him in astral space.",
    "physical_encounter": "His projected image is immune to physical attacks here; bullets pass through an astral apparition. In the lavishly disguised bedroom, Michael is masked by a Quickened Mask spell and the ordinary room by a Quickened Landscape spell. A group of six Alphas guards him.",
    "magic_and_progression": "Michael uses magical protections against guns and spells, including deflecting or dispersing hostile magical effects. When the characters approach his physical body, the girls initially fight while Michael preaches; if the girls are badly hurt he shifts to a more aggressive defense. In close-range physical combat, the fiction makes his body easier to defeat once the Mask illusion falls.",
    "choices_and_variants": "GM may increase opponents’ Threat Ratings by one or two or modify their statistics if the encounter is too easy; the book suggests a drawn-out dramatic conflict. It separately advises against arbitrary player-character death. These are optional GM difficulty adjustments, not fixed numerical modifiers for every game.",
    "source_qualifiers": "Force 8 applies specifically to Michael’s astral mana barrier. No Force is specified here for his Quickened Mask or Landscape spells. Keep the stated invulnerability of his astral appearance separate from physical vulnerabilities of his actual body.",
