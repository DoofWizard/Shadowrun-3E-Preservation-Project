data:
  lineage: Second Edition-era equipment effects in FASA7118. No inferred replacement or automatic application
    to Third Edition rules.
  source_context: Source-period fictional in-world catalog and notes; cross-referenced Gamemaster Information
    may supply further mechanics.
  gamma_scopolamine:
    printed_page: 81
    pdf_page: 90
    rating: 10D Stun
    speed: Immediate
    vector: Injected
    source_stated_effects:
    - dizziness
    - pupil dilation
    - speech loss
    - delirium
    - paralysis
    deadly_stun_damage_effect: Full paralysis
    lesser_stun_damage_procedure: Add +2 to all modifiers appropriate for the stun wound.
    example_serious_stun:
      target_number_modifier: '+5'
      initiative_modifier: '-5'
    full_effect_duration_hours: 1
    residual_effect: After the full effects end, remaining substance acts as a truth serum for one additional
      hour
    residual_effect_duration_hours: 1
    target_willpower_rating_adjustment: -2, minimum resulting Willpower Rating 1, during the chemical effect
    bulk_dose_availability_rule: For every 3 doses desired, increase Availability by +1 and base time by +1
      day
    starting_availability: 8/2 weeks
  fab_1:
    printed_page: 82
    pdf_page: 91
    astral_interaction_as_described: A filled enclosed space acts as living astral containment; the source
      describes trapping an astral being in that space.
    field_test_limitation: Controlled testing stringent but minimal field testing, per seller; noncontained
      use discouraged by seller
    activation: Release FAB-1 into a controlled area, from refrigerated coolant/feeding vats.
    reuse: Once canister is removed from vat, bacteria start dying immediately and cannot be reused
    street_availability: Gamemaster discretion; normally not available on the street
  fab_uv:
    printed_page: 83
    pdf_page: 92
    astral_detection_description: FAB-UV glows in ultraviolet light. A moving astral intruder displaces glowing
      airborne FAB-UV, casting a revealing shadow.
    detector_procedure:
    - Lightly flood intended area with FAB-UV aerosol
    - Illuminate the area with ultraviolet light
    - Observe displaced, glowing FAB-UV revealing an intruder position
    released_lifespan_hours: approximately 3-4
    storage_reuse: Must be kept in sub-zero freezers; upon removal bacteria begin dying and cannot be reused
  bcg:
    printed_page: 84
    pdf_page: 93
    installation_description: Double-layered exterior walls, doors, and windows with FAB-1 pressurized release
      units
    deployment_procedure:
    - On-site security magician detects an astral intruder in protected area
    - Magician activates BCG
    - System releases FAB-1 into enclosed protected zone, intended to trap astral intruder
    conduits_per_canister: 1
    availability: At gamemaster discretion; not normally street available
framing: reference_exact
headline: 'Historical game procedures and limits: gamma-scopolamine, FAB astral systems'
summary: Exact catalog effect and deployment conditions for gamma-scopolamine and FAB astral-containment systems.
