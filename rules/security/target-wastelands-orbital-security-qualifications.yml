headline: Fictional Shadowrun Third Edition Zurich-Orbital security qualifications, FanPro Target Wastelands (FanPro10653, 2002), printed p78 / PDF p79
data:
  source_title: "Target: Wastelands"
  publisher: FanPro
  extends: rule.security.target-wastelands-orbital-security
  passenger_screening_scope: The narrator specifies screening on passenger flights; the astral scan occurs on the ground and inventory is checked by weight to the gram.
  passenger_access: Passenger flights to Zurich-Orbital originate on the ground, not at other orbital stations.
  supply_exception: In-world commenter Toos reports regular supply flights to Apollo, Shibanokuji and Icarus, with Zurich-Orbital offices handling cargo at those stations.
  screening_qualification: In-world commenter Baxter reports that the full screening battery is used for first-time visitors and strangers, with cursory checks after four or five uneventful trips. This is attributed commentary, not a fixed test or guaranteed exemption.
  matrix_defenses:
    communication_initiator: Zurich-Orbital initiates, schedules and prearranges outside communications.
    uplinks: Dedicated glaciered uplinks.
    san_defenses: [vanishing SAN, teleporting SAN]
    host_qualification: The existing minimum Red-6 host condition applies if an uplink node is found; the narrator also describes limited time and options and numerous IC without specifying further ratings.
