  original_headings:
  - Doors and Windows
  - HVAC
  - Switch Alarms / Trip Beam Systems
  - Mechanical Tripwire
  - Pressure Mesh and Pads
  - Cameras and Visual Sensors
  - Area Sensors / Motion Sensors
  doors_and_windows:
    alarm_detection:
      test: Perception Test
      target_number: alarm rating
    alarm_disabling:
      test: Electronics Test
      target_number: alarm rating
      base_time_minutes: 5
      modifiers: Existing SR3 p95 Electronics Build/Repair modifiers; not restated
        or invented
    glass_scoring:
      tool_rating_at_least: window material Barrier Rating
      named_reference: M&M tool laser, Man & Machine p15, affects windows of Barrier
        Rating 10 or less
    window_climbing:
      ordinary: Athletics (2) Test
      unusual_height_or_angle: May require Climbing Test, Shadowrun Companion p44;
        no new fixed target number
  hvac:
    duct_crawling_rate: Quickness meters per minute
    fan_disable:
      test: Electronics (4) Test
    fan_removal:
      test: Electronics Build/Repair (4) Test
    accidental_fan_damage:
      ductwork_fans: 4M Physical
      main_fans: 8S Physical
    duct_uv_furnace_disabling:
      test: Electronics Build/Repair (4) Test
      base_time_minutes: 1
      source_caveat: This is a fictional security-system description; source does
        not assign real-world effects
  capacitance_switch_alarm:
    range_meters: 2
    detection: any living body inside range
    cannot_distinguish: metahumans from animals
  trip_beam:
    notice_test: Use existing Wire/Tripwire Perception Target Number Table from printed
      p96, including SR3 p232 visibility modifiers
    smoke: Increases visibility, not concealment
    fictional_aerosol_visibility: Perception modifier -1, with possible GM-triggered
      environmental alarm
    attempted_crossing:
      test: Quickness Test
      target_number: gamemaster sets 4 or higher by coverage
    detailed_planning:
      test: Quickness Test
      target_number_with_schematics_and_time: 8
      target_number_with_only_picture: 12
      target_number_with_neither: 16
      base_time: 1 week
    proxy_emitter:
      test: Reaction (6) Test
      one_emitter_per_detector: true
      failure: Alarm triggered
    armed_laser:
      game_damage: 10M
      impact_armor: Half (round down)
      effectiveness_and_power: See Man & Machine p30; no unprinted conversion
  mechanical_tripwire:
    avoidance_via_wire_table: Use accepted Wire/Tripwire Perception Table p96
    mechanical_relay_trick:
      test_1: Electronics (4) Test
      test_2: Reaction (4) Test
      same_person_both_tests_modifier_each: 2
    weighted_string_test:
      test: Quickness (4) Test
      success: allows testing an area without setting off the game tripwire
  pressure_mesh_and_pads:
    initial_noticing: Use accepted p96 Wire/Tripwire Perception Target Number Table
    after_stepping:
      second_test: Perception Test against same TN with -2 modifier
      failure: Alarm triggers
      success: May attempt to remove pressure before exceeding sensitivity
    pressure_release:
      test: Reaction Test
      target_number: Sensitivity Level from accepted p98 Pressure Sensor Sensitivity
        Table + character natural Body Rating
      running_target_number_modifier: 2
    sensitivity_table: Separately indexed in rules/security/sota63-area-scanner-modifiers-p98-99.yml;
      no duplicate numeric table
  cameras_and_visual_sensors:
    notice: Perception Target Number based on sensor Concealability; gamemaster may
      increase for disguise
    bright_video_glare_perception_modifier: 2
    laser_targeting: Laser Weapons Test under ordinary ranged rules
    spell_targeting: Elemental Light spell permitted, reference Magic in the Shadows
      p52
    overpower_sensor: If successes exceed sensor rating it burns out until repaired
    dazzle_instead: If not exceeding rating, apply +4 to Perception Tests made via
      sensor
  motion_sensors:
    ultrasound_presence_range_meters: 5
    careful_movement:
      distance_m_per_combat_turn: 0.5
      test: Opposed Stealth against sensor rating
      failure: Alarm triggered
    walking_faster:
      threshold_m_per_turn: 1
      target_number_modifier: Additional +1 per further 0.25m above 1m per Combat
        Turn
    ultrasonic_emitter_optional:
      base_move_m_per_combat_turn: 2
      test: Opposed Rating Test
      stealth: May be Complementary skill
      target_number_modifier: -1 for every 0.5m slower than 2m/Combat Turn
  accepted_neighbor_rules_reused:
  - rules/security/sota63-wire-tripwire-barrier-tables-p96.yml
  - rules/security/sota63-area-scanner-modifiers-p98-99.yml
  scope_limit: Exact available-source game rules, pp97-99 detection/access/procedure
    headings only. Existing lighting, fences, material barriers, pressure/pheromone/chemical
    numeric tables, MAD and cyberware scanning records are reused, not resubmitted;
    no engine execution claimed.
