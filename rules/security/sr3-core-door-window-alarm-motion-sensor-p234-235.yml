edition_scope: >-
  Original FASA Corporation Shadowrun, Third Edition (FASA7001), fictional tabletop
  role-playing game mechanics from printed pp234-235 / physical PDF243-244.
  The abstract dice tests do not describe effective real-world security practices.
content_class:
  - rule_exact
headline: >-
  FASA Corporation Shadowrun, Third Edition FASA7001 fictional game alarm-contact
  and motion-sensor tests, printed pp234-235/PDF243-244
summary: >-
  Original tabletop rules for door/window contact alarms and ultrasound motion
  sensors: Perception TN 6, complementary Electronics B/R, system-Rating tests,
  5-meter sensor range, Stealth opposition, and +1 TN per additional quarter-meter
  above one meter of movement per Combat Turn.
