    source_printed_pages: [234, 235]
    fictional_ultrasound_field_radius_meters: 5
    gradual_movement:
      nominal_meters_per_combat_turn: 0.5
      test: Opposed Stealth (Sensor Rating) Test
      failed_test: The fictional alarm activates.
    quicker_movement:
      threshold_meters_per_combat_turn: 1
      additional_meters_step: 0.25
      target_number_increase_per_step: 1
      condition: The modifier applies for each additional quarter-meter moved beyond 1 meter in a Combat Turn.
      no_unprinted_rule: The passage does not state a separate success threshold or a universal effect for other movement speeds.
    additional_option:
      item: The original game references an ultrasound emitter/detector on printed p293 as a possible in-game countermeasure.
      scope: No equipment statistics or distinct resolution rule for this item are inferred from pp234-235.
