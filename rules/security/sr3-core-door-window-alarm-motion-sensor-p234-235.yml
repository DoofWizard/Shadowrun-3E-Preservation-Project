  door_window_alarms:
    source_printed_page: 234
    game_device: The source depicts contact alarms that activate when an original circuit is broken by an opened game-world door or window.
    contact_location_test:
      dice: Perception Test
      target_number: 6
      complementary_skill: Electronics Build/Repair may be used as a Complementary Skill.
    contact_resolution_test:
