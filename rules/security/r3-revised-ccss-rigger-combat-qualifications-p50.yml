  section: Security Riggers / Rigger Combat
  game_combat_qualifications:
    no_effect_on_rigger_combat: [Hardening, defensive programs, intrusion countermeasures]
    initial_actor: highest rigged Initiative result
    ending_combat: one participant disengages or passes out
    winning_intruder_game_state: control of the fictional rigged system or its drones, and access to information previously available to the defeated security rigger
    opposed_test_dice_limit:
      printed_limit_value: attacker Willpower
      printed_limit_subject: number of dice used
      interpretation: The text permits both participants to use Control Pool but does not expressly identify the cap as applying to added pool dice alone; retain this ambiguity rather than resolving it by inference.
    first_defender_in_multiple_rigger_network: rigger occupying the captain's chair
