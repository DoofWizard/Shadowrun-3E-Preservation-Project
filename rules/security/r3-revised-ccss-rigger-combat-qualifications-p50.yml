  scope_limit: Game resolution and fictional state transitions only. Existing opposed Willpower Test, optional Control Pool, damage staging, action economy and defeat condition are reused; printed dice-cap ambiguity remains unresolved. No new real-world operations or historical-edition difference is asserted.
