headline: FanPro10667 SR3 fictional records and monitoring qualifications, pp52-53/PDF53-54
summary: Original tabletop evidence-availability conditions and attributed record types, including the cheaper-lock exception; no new search test.
data:
  publication: {title: Sprawl Survival Guide, publisher: FanPro, catalog_number: FanPro10667, year: 2003, edition: Shadowrun Third Edition, source_id: source.fanpro-10667, printed_pages: '52-53', physical_pdf_pages: '53-54', source_pdf_sha256: b0855865c06b20f8c71251d45d980d54470990af656277f5b9ace9264a9e309f}
  narrator_p52:
    public_space_cameras: Often monitored by peace officers in the source's fictional urban setting.
    lower_violent_crime_areas: Camera feeds may instead be recorded for subsequent review.
    matrix_transactions: Described as leaving electronic records.
  attributed_public_information_p53:
    speaker: Lone Star Public Information Services
    record_types:
      - {event: door access, records: [maglock, centralized security terminal if present], exception: The source explicitly excludes cheaper locks from the maglock-record feature.}
      - {event: credstick transaction, records: [reader unit, bank service]}
      - {event: phone call, fields: [number dialed, call duration, phone location at time of call]}
      - {event: vehicle in transit, records: [GridGuide vehicle location]}
      - {event: signed contract, authentication: credstick, records: [legal filing agency]}
      - {event: cross-border travel, fields: [passport details, travel authentication]}
    public_camera_claim: Public streets and shopping malls have real-time surveillance cameras.
  qualifications:
    x_star: Speaker disputes the generality of real-time monitoring and claims that most footage is archived for later review.
    arclight: Speaker disputes the reliability of electronic records as evidence, including the possibility of fabricated evidence.
    scope: The source does not specify universal recording coverage, retention duration, reliability rating or a new search test. Real-time capture is distinct from real-time human monitoring.
  reuse: [rule.ssg-ucas-legal-process-p40-42, rule.ssg-credstick-validation-lifecycle-p38-40, rule.communications.sr3-core-cellphone-network-location-and-pager-p287, subsystem.vehicles.gridguide]
