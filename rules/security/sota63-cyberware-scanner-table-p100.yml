  Scanner Table.'
data:
  source:
    publication: 'State of the Art: 2063'
    publisher: FanPro
    edition: Shadowrun Third Edition
    catalog_number: FanPro10664
    printed_page: 100
    physical_pdf_page: 101
    source_kind: historical fictional tabletop role-playing game mechanics
  rules:
    cyberware_implant_grade_target_numbers:
    - grade: Standard
      tn: 3
    - grade: Alphaware
      tn: 6
    - grade: Betaware
      tn: 8
    - grade: Deltaware
      tn: 10
    essence_threshold_modifiers:
    - essence: 4 or less
      modifier: -1
    - essence: 2 or less
      modifier: -2
    - essence: 0 or less
      modifier: -3
    success_information:
    - successes: 1
      reveals: Location of cybernetic devices (head, arms, etc.)
    - successes: 2
      reveals: Rough number of cybernetic devices
    - successes: 3
      reveals: Category of cybernetics (brainware, senseware, bodyware, etc.)
    - successes: 4
      reveals: Purpose of cybernetic device (eye mod, reaction mod, etc.)
    - successes: 5
      reveals: Rating or grade of cybernetic device (betaware, electronic mag-3, etc.)
    - successes: 6+
      reveals: Model of cybernetic device (examples include Zeiss Adlerauge Cybernetic Eyes and Ares Pericles Smartlink-2)
    procedure: For implanted characters make a scanner Rating Test against the printed grade target number, with applicable Essence threshold modifier; higher successes
      reveal additional tiers of information.
    source_note: The printed table lists Essence 4, 2, 0 thresholds separately. This record does not assert that overlapping thresholds stack.
  coverage_limit: Only the printed Cyberware Scanner Table and adjacent Cyberware Scanners procedure on printed p100/PDF101; excludes lock bypass, transponder-embedded
    key and gear-market rows.
