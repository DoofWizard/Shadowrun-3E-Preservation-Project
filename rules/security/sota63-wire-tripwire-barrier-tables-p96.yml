source: source.fanpro-10664
printed_pages: '96'
pdf_pages: '97'
edition_scope: FanPro Shadowrun Third Edition 2003 only; no retroactive rule supersession
content_class:
- rule_exact
framing: reference_exact
headline: 'Fictional Shadowrun Third Edition rules from FanPro State of the Art: 2063 (FanPro10664), printed 96/PDF 97: Wire/Tripwire and Security Barrier Ratings'
summary: 'Source-image-reviewed numeric Wire/Tripwire and Security Barrier Ratings for fictional Shadowrun Third Edition tabletop play, FanPro (2003), State of the
  Art: 2063/FanPro10664, original printed 96, physical PDF 97.'
data:
  provenance:
    publication: 'State of the Art: 2063'
    publisher: FanPro
    edition: Shadowrun Third Edition
    source_catalog_number: FanPro10664
    chapter: Keeping the Rabble Out
    source_kind: fictional tabletop-RPG rules, not real-world operational instructions
    printed_pages: '96'
    physical_pdf_pages: '97'
  source_exact_rules:
    wire_tripwire_perception_target:
    - type: Barbed Wire
      tn: 4
    - type: Concertina/Razorwire
      tn: 3
    - type: Monofilament Wire
      tn: 8
    - type: Capacitance Wire
      tn: 8
    - type: Trip Beam (Obvious)
      tn: 2
    - type: Trip Beam (Visible)
      tn: 6
    - type: Trip Beam (Invisible)
      tn: 12
    - type: Mechanical Tripwire
      tn: 6
    - type: Pressure Pad
      tn: 6
    - type: Pressure Mesh
      tn: 8
    perception_modifiers:
    - situation: Camouflaged/Obscured in brush
      modifier_range:
      - 1
      - 4
    - situation: Character distracted/running
      modifier: 2
    - situation: Illumination level fluctuates
      rule: Add +1 to modifier of worst level
    wire_damage_by_grab_walk_run:
    - wire_type: Barbed
      grab: 3L
      walking: 4L
      running: 6L
    - wire_type: Concertina
      grab: 4M
      walking: 5M
      running: 8M
    - wire_type: Monofilament
      grab: 7S
      walking: 9S
      running: 11S
    barrier_rating_by_material:
    - material: Plywood
      rating: 2
    - material: Drywall
      rating: 3
    - material: Plastiboard
      rating: 4
    - material: Chain link (alloy or densiplast)
      rating: 6
    - material: Plasticrete
      rating: 6
    - material: Densiplast
      rating: 8
    - material: Kevlar Wallboard
      rating: 8
    - material: Plastisteel
      rating: 12
    - material: Steel-reinforced
      rating: 16
    - material: Blast-plated
      rating: 24
    - material: Milspec
      rating: 32
    faulty_plasticrete_detection: Chemistry or Engineering (8) Test; original refers to Plastisteel-7 (p.113, M&M).
    cross_references:
    - 'Walls: SRComp p44 (climbing), SR3 p124 (barrier rules), SR3 p119 (Blast Against Barriers and confined spaces)'
    - Tunneling section on the same p96 refers to the Tunneling Table on p97; numeric tunneling table and all its options are NOT normalized by this record
  source_context_notes:
  - All numeric values are exact from printed table boxes on p96/PDF97; the 3-severity damage triples correspond to Grab/Walking/Running in that printed order.
  - The record is a fictional tabletop-rule reference, not a physical security tutorial.
  coverage_limit: Only Wire/Tripwire Table, Wire Damage Table, Security Barrier Ratings and the specified faulty-plasticrete TN from printed p96. Does not close the
    continuous Tunneling/Lighting text or adjacent pages.
