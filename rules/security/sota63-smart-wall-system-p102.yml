data:
  source:
    publication: 'State of the Art: 2063'
    publisher: FanPro
    edition: Shadowrun Third Edition
    catalog_number: FanPro10664
    printed_page: 102
    physical_pdf_page: 103
    source_kind: historical fictional tabletop role-playing game mechanics
  rules:
    fictional_product: Novatech fictional embedded Smart Walls security monitoring in the SR3 sourcebook.
    per_sensor_unit_concealability: 8 + sensor rating
    per_unit_sensor_rating_rule: All sensors in a Smart Wall unit must share the same rating.
    per_unit_range_rule: Range of the wall unit is per sensor and tied to that sensor rating.
    ccss_requirement: All Smart Walls must attach to a CCSS system; one router per wall unit connects wall units at a central router.
    detection_and_evasion_cross_reference: Once a sensor is identified, fictional detection/evasion tests use the same procedures as corresponding other sensor types;
      this record does not transcribe those procedures.
    section_title: SMART WALLS
  coverage_limit: Only the Smart Walls boxed rules of printed p102/PDF103. Adjacent retinal, voiceprint, fingerprint, CCSS and market-entry rules remain distinct
    and are not claimed completed.
