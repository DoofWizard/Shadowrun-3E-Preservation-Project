    section: 'Game Information: Lighting'
  lighting_effects:
    instant_on_off:
    - Incandescent
    - Fluorescent
    - Halogen
    gas_discharge_warmup_minutes: 5
    mercury_vapor_relight_minutes: 10
    sodium_vapor_relight_minutes: 15
    active_infrared: Active infrared lamps are described as illuminating a scene for
      infrared and thermographic sensors.
    ultraviolet_light: Ultraviolet lamps produce ultraviolet and short-wavelength
      blue visible light; the source says they can reveal fictional forensic biological
      or mineral traces invisible under white light.
    ultraviolet_exposure_consequence: The source describes sustained unprotected exposure
      causing skin burns, visual glare and other unpleasant effects. No target numbers
      or damage codes are supplied; do not invent them.
    high_heat_risk: The book says sustained exposure to hot halogen bulbs can ignite
      flammable materials; this is a fictional-environment note, not a new standalone
      damage code.
    edition_rule_scope: These timings are printed in the Game Information section
      for SR3; they do not substitute a separate universal real-world lighting standard.
  coverage_limit: Limits scope to the Lighting subsection at printed p96/PDF97, excluding
    separately indexed security barrier ratings and adjacent Tunneling mechanics.
