enterprise_zones:
  extraterritorial_boundary: "The tenant's extraterritoriality begins at the Enterprise Zone wall and ends when the lease ends."
  outside_holdings: "Corporate property elsewhere in Québec is not extraterritorial under this system and remains subject to Québec law and Gendarmerie investigation."
  customs: "Québec may establish temporary unannounced customs posts at Enterprise Zone access points."
  language: "Corporations inside Enterprise Zones may use any language."
  authorized_counts: {Quebec_City: 12, Montreal: 18}
  claimed_quebec_city_2062: 11
gendarmerie:
  security_rating_model: "Uses Lone Star SOP and security ratings."
  wilderness_rating:
    code: "W-zone"
    meaning: "Wilderness area the Gendarmerie will not willingly patrol under normal circumstances."
