{"id":"rule.security.srcomp-additional-security-systems-p89-90","record_type":"rule","status":"source_reviewed","source":"source.srcomp","printed_pages":"89-90","pdf_pages":"90-91","edition_scope":"FASA Corporation Shadowrun Companion, FASA7905a, Shadowrun Third Edition fictional tabletop game rules, printed pp89-90/PDF90-91.","content_class":["rule_procedure"],"data":{"provenance":{"publication_title":"Shadowrun Companion","publisher":"FASA Corporation","catalog_number":"FASA7905a","edition":"Shadowrun Third Edition","source_id":"source.srcomp","source_type":"published fictional tabletop role-playing supplement","printed_pages":"89-90","physical_pdf_pages":"90-91","chapter":"Advanced Rules","section":"Additional Security Systems; Trip Beams; Pressure Mesh and Pads; Vibration Detectors; Gas Delivery Systems; Chemical Detection Systems"},"scope":"Fictional tabletop optional game procedures for facility security, extending SR3 core pp232-237. These are original game mechanics, not real-world installation instructions.","fictional_trip_beams":{"notice_exposed_test":"Perception Test, target number 2, with source SR3 Visibility modifiers","intentionally_concealed_perception_tn_modifier":"+4","bypass_by_quickness_test":{"minimum_target_number":4,"with_design_schematics":8,"only_picture":12,"neither_picture_nor_design_schematics":16,"base_design_time":"one week, plus necessary fictional equipment; precise GM target is otherwise at discretion","minimum_target_number_scope":"Separate direct-navigation Quickness Test, GM sets target by coverage; minimum TN 4.","design_method_test_scope":"The TN 8/12/16 values belong to a different optional fictional Quickness Test, not to the direct-navigation test.","with_design_schematics_condition":"The TN 8 case additionally assumes ample study time."},"proxy_emitter":{"cost_nuyen_each":200,"required_count":"one for each detector","placement_test":"Reaction Test (6)","failed_placement":"Failed Reaction Test causes the alarm when the original trip-beam event is subsequently triggered, not automatically at the time of the test."},"qualifier":"Some cinematic arrangements are expressly impossible to bypass; GM discretion remains relevant","visibility_exception":"For this fictional Perception Test, the source reverses the usual smoke visibility effect. At the GM's discretion, the aerosol visibility example may trigger certain sensitive alarm systems; the source identifies environmentally controlled interiors as settings where these systems are often found. This is a conditional game adjudication, not an automatic alarm."},"fictional_pressure_mesh_pads":{"original_sensitivity_table":[{"device":"Pressure Mesh","perception_target":8,"normal_sensitivity":7,"animal_sensitivity":4,"drone_sensitivity":3},{"device":"Pressure Pad","perception_target":6,"normal_sensitivity":7,"animal_sensitivity":3,"drone_sensitivity":4}],"notice_test":"Perception against applicable original table target number, including applicable modifiers.","after_stepping_on_device":"Only after the first Perception Test fails does the character step on the device and make a second Perception Test against the same target number with -2; failure triggers alarm, success allows the subsequent Reaction Test.","escape_test":"Successful Reaction Test against device sensitivity level PLUS character natural Body Rating before pressure crosses threshold","running_modifier":"+2 to the escape Reaction Test target number"},"fictional_vibration_detectors":{"detection_test":"Opposed Stealth Skill Test against device vibration-analysis software rating; a single net success prevents detection for that Combat Turn","ordinary_software_rating":"6 to 10+ (source describes typical range)","movement_allowance":"0.5 meter per Combat Turn to try to avoid detection","movement_1_meter":"At 1 meter per Combat Turn apply +3 to the character test target number","faster_than_1_meter":"Automatic alarm, no stealth test"},"fictional_game_gas_dispersion":{"benchmark":"30 cubic meters filled in one Combat Turn (3 seconds)","approximate_spread":"10 cubic meters per second; illustration approximates 2m tall, 2m wide, 2.5m deep","maximum_initiative_passes":"3 per Combat Turn","spread_timing":"Starts at the end of the triggering Initiative Pass and resolves last in each Initiative Pass, up to three passes in a Combat Turn.","recognition_test":"At the time of exposure, characters holding Delayed Actions may make a Perception Test using Intelligence dice against Target Number 10, with appropriate Perception modifiers.","exception":"Game master may adjust dispersal for scenario; gas detection equipment may automatically alert its wearer","spread_per_initiative_pass_cubic_meters":10,"source_effects_reference":"SR3 core p250 supplies the effects on characters; this optional subsystem supplies timing and recognition only."},"fictional_chemical_detection":{"source_description":"Hand-held rating up to 3, while detector systems are rated 1 to 8; architecturally based systems have base Concealability Rating 4","test":"Roll dice equal to detector Rating against Base Target Number 10, then apply cumulative negative modifiers","original_chemical_detection_modifier_table":[{"quantity":"Each 8 standard rounds (or fraction)","target_number_modifier":-1},{"quantity":"Each 6 explosive rounds (or fraction)","target_number_modifier":-1},{"quantity":"Each concussive or fragmentation hand grenade","target_number_modifier":-1},{"quantity":"Each 2 smoke or flash grenades","target_number_modifier":-1},{"quantity":"Each 3 mini-grenades of any type","target_number_modifier":-1},{"quantity":"Each 30 grams standard non-plastique explosive","target_number_modifier":-1},{"quantity":"Each 100 grams plastique","target_number_modifier":-1}],"source_worked_case":{"standard_ammunition_rounds":20,"ammo_modifier":-3,"other_grenades_count":2,"grenade_modifier":-2,"total_modifier":-5,"base_target_number":10,"result_target_number":5}},"provenance_note":"Rules are transcribed strictly as tabletop source text. No actual equipment handling, technical construction or installation instructions are supplied."},"framing":"reference_exact","headline":"FASA7905a Shadowrun Companion: optional tabletop security test conditions and exposure timing","summary":"FASA Corporation Shadowrun Companion FASA7905a, SR3 fictional game-resolution conditions and numeric tables, printed pp89-90/PDF90-91, including the separate discretionary alarm qualifier and delayed-action recognition window."}
