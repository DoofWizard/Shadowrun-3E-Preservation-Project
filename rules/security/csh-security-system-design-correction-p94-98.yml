data:
  corrects_record: rule.security.csh-gm-security-levels-perimeters-p94-98
  corrects_blob: ca2de7eb11c237b57e1aa3c905ab9091ffd59f6b
  field_corrections:
    security_system_design.access_to_items:
      printed_page: 94
      pdf_page: 103
      scope: The fictional game permits characters to purchase the new equipment for their safehouses or squats if they can afford it. Most of the equipment is described as too unwieldy for mobile use.
    overall_security_level.formula:
      printed_page: 98
      pdf_page: 107
      numerator: Sum the levels of the individual components.
      divisor: 6
      rounding: down
      qualification: The original gives no five-component restriction on the numerator. Page 96 allows separate ratings for the four physical components and either of the two technical components. The book does not specify how to reconcile the optional subdivisions with the fixed divisor.
framing: reference_exact
headline: FASA7118 Corporate Security Handbook (FASA, 1995), Second Edition, original pp94-98/PDF103-107
summary: Two source-reviewed corrections for the fictional tabletop game's equipment purchase scope and overall security level formula; historical record retained, no SR3 conversion.
