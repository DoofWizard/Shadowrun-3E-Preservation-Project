headline: 'Fictional Shadowrun Third Edition rules from FanPro State of the Art: 2063 (FanPro10664), printed 98-99/PDF 99-100: Pressure, Pheromone and Chemical Scanner
  Game Tables'
summary: 'Source-image-reviewed numeric Pressure, Pheromone and Chemical Scanner Game Tables for fictional Shadowrun Third Edition tabletop play, FanPro (2003), State
  of the Art: 2063/FanPro10664, original printed 98-99, physical PDF 99-100.'
data:
  provenance:
    publication: 'State of the Art: 2063'
    publisher: FanPro
    edition: Shadowrun Third Edition
    source_catalog_number: FanPro10664
    chapter: Keeping the Rabble Out
    source_kind: fictional tabletop-RPG rules, not real-world operational instructions
    printed_pages: 98-99
    physical_pdf_pages: 99-100
  source_exact_rules:
    pressure_sensor_sensitivity:
    - sensor: Pressure Mesh
      normal: 7
      animals: 4
      drones: 3
    - sensor: Pressure Pad
      normal: 7
      animals: 3
      drones: 4
    pheromone_scanner_perception_modifiers:
    - condition: Light Exertion (jogging, light lifting)
      modifier: -1
    - condition: Heavy Exertion (running, fighting, heavy lifting)
      modifier: -2
    - condition: Menstruating (females only)
      modifier: -2
    - condition: Tailored Pheromones, Level 1
      modifier: -1
    - condition: Tailored Pheromones, Level 2
      modifier: -2
    - condition: Cultured Pheromones, Level 1
      modifier: -2
    - condition: Cultured Pheromones, Level 2
      modifier: -4
    - condition: Clean Metabolism Bioware
      modifier: 4
    chemical_detection_modifiers:
    - situation: For each 8 standard rounds (or portion thereof)
      modifier: -1
    - situation: For each 6 explosive rounds (or portion thereof)
      modifier: -1
    - situation: For each 1 concussion or fragmentation hand grenade
      modifier: -1
    - situation: For each 2 smoke or flash grenades
      modifier: -1
    - situation: For each 3 mini-grenades (any type)
      modifier: -1
    - situation: For each 30 grams of standard (non-plastique) explosive
      modifier: -1
    - situation: For each 100 grams of plastique
      modifier: -1
    - situation: Explosives/ammo contained in plastic
      modifier: 1
    - situation: Explosives/ammo hermetically sealed
      modifier: 4
    pheromone_scanner_base_signature:
      most_metahumans: 6
      trolls: 5
      test: scanner rating against character/animal base signature modified by listed circumstances
    mad_detector:
      test: MAD rating against item or fictional-weapon Concealability
      successes_required: 1
      other_check: ether taggant nanites detected using Rating (3) Test
      visual_concealability_modifiers_apply: false
    chemsniffer:
      test: Rating (10) Test modified by Chemical Detection Modifiers Table
      successes_required: 1
    sound_vibration_detection:
      test: Stealth versus vibration analysis rating (opposed)
      stealth_movement_half_meters_per_turn: 0.5
      faster_movement_up_to_meters_per_turn: 1
      fast_move_target_number_bonus: 3
      greater_than_one_meter_per_turn: automatically sets off vibration detectors
    source_page_subsections:
    - 'p98: Pressure Mesh and Pads (table); p99: Pheromone Scanner Table, Chemical Detection Modifiers Table, Sensors/MADS/Chemsniffers and vibration section'
  source_context_notes:
  - All modifiers preserve source signs. Their test types and success requirements reflect the fictional printed rules, not real-world scanner capability.
  - The detailed motion-sensor stealth movement and trip-beam evasion procedures on these pages require a different record and remain unclosed.
  coverage_limit: Only named numerical tables and directly associated generic tests on printed p98-99/PDF99-100; motion-detector-specific options, scanner equipment
    market table, bypass descriptions and artwork are not claimed complete.
