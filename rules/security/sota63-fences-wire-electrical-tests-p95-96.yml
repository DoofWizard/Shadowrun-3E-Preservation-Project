summary: 'Independently page-image-reviewed exact tabletop mechanics from FanPro State
  of the Art: 2063 (Shadowrun Third Edition, FanPro10664, 2003), printed 95-96/physical
  PDF 96-97.'
data:
  source_context:
    publication_title: 'State of the Art: 2063'
    publisher: FanPro
    edition: Shadowrun Third Edition
    catalog_number: FanPro10664
    chapter: Keeping the Rabble Out
    historical_scope: Fictional 2003 tabletop RPG; technical descriptions are period
      in-world claims, not modern-world advice
    printed_pages: 95-96
    physical_pdf_pages: 96-97
    section: 'Game Information: Fences, Wire, Electrified Fences, Walls'
  printed_mechanics:
    precedence:
      claim: Where the new Game Information mechanics conflict with another sourcebook,
        this section says to use the rules printed here.
      prior_sources:
      - Security Systems in SR3 pp232-237 (as named in this book)
      - Shadowrun Companion pp89-90 (as named in this book)
      designation: Explicit rule-priority statement from this historical SR3 supplement;
        not a blanket modernization of other editions.
    fence_climb_reference: The text directs climbing-fence attempts to Shadowrun Companion
      p44. No unprinted climbing TN is invented.
    fence_cutting:
      reference: SR3 p293 wire-clippers rule
      rate_meters_per_minute: ceil(Strength / 2) meters per minute
      context: fictional character action speed
    wire_noticing: Use the separately accepted Wire/Tripwire Perception Target table
      in rule.security.sota63-wire-tripwire-barrier-tables-p96; do not duplicate it.
    wire_damage: Use existing Wire Damage Table (Grab/Walking/Running damage codes)
      in rule.security.sota63-wire-tripwire-barrier-tables-p96.
    wire_cut_test:
      type: Strength Test
      tn: 6
      case: cutting standard wire with wire clippers
    monowire_cut_test:
      type: Strength Test
      tn: 5
      case: cutting fictional monowire
    unsecured_monowire_hazard:
      type: Quickness Test
      tn: 6
      purpose: avoid recoil of the free end when unsecured
      failure_damage: 10S
    impact_armor_interaction:
      effect: Impact armor gives half (round down) protection against wire damage;
        the printed table and this interaction are separately preserved.
    electrified_contact:
      damage: 4D Stun
      weapon_analogy: Shock weapon, SR3 p124
    electrified_release:
      type: Body Test
      tn: 6
      purpose: remove paralyzed hands from an electrified fence
    electrified_repeat:
      damage: 4D
      timing: At end of each Combat Turn if character remains attached
    electrified_unconscious:
      damage: one final 4D
      timing: When character is knocked unconscious before muscles relax and character
        slumps
    electrified_grounding:
      no_contact_damage: Levitation or another means of remaining ungrounded avoids
        electric contact damage.
      tool_rule: Holding a pair of clippers in contact with the fence counts as grounding
        the character; not equivalent to being ungrounded.
    electrical_monitoring:
      decision: At gamemaster discretion, sensors measuring current and resistance
        may flag when a fence is cut or someone is electrically affected.
    wall_climbing: References Shadowrun Companion p44; no independent climbing TN
      on these pages.
    wall_damage: References SR3 p124 Barrier rules and SR3 p119 Blast Against Barriers
      / Blast in a Confined Space.
    wall_material_weakness:
      test: Chemistry or Engineering (8) Test to notice faulty plasticrete construction
      supplement_reference: Plastisteel-7, Man & Machine p113
    barrier_rating_table_ref: Numerical Security Barrier Ratings from printed p96
      are already indexed as rule.security.sota63-wire-tripwire-barrier-tables-p96.
  source_cross_reference_note: Preserves the printed references and damage/TN mechanics;
    does not infer generalized real-world fence behavior.
  coverage_limit: Covers Game Information introduction and Fences/Wire/Electrified
    Fences/Walls text on pp95-96. Omits separately indexed tables on p96, Tunneling
    on p96-97, and the Lighting subsection.
