id: rule.skillsofts.cannon-companion-dedicated-chipjack-game-effects-p64
record_type: rule
status: reviewed
source: source.cc
printed_pages: '64'
pdf_pages: '65'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: 'FASA7908 Cannon Companion: dedicated chipjack fictional game effects'
summary: 'FASA Corporation Shadowrun Third Edition tabletop RPG, printed p64/PDF65. Original dedicated-chipjack game eligibility, removal test and optional movement modifier, distinct from ordinary chipjack and implant option records.'
data:
  existing_records:
    - option.skillsofts.implant
    - option.skillsofts.btl-implant
    - rule.cyberware.sr3-core-chipjack-data-lock-tooth-compartment-p298-299
  game_device:
    designated_chip: one specific implant-option skillsoft or BTL
    compatible_other_chip_types: false
    linked_headware_communications: optional remote activation or deactivation in fictional game
    normal_chipjack_rules_apply_except_eligibility: true
  game_removal_test:
    skill: Biotech (Cybertechnology)
    target_number: 8
    requires_success: true
    source_exceptions: Fictional GM may specify a permanently fixed chip or an additional adverse consequence; no universal alternate test is supplied.
  optional_ras_override:
    reference: M&M p21
    movement_while_chip_active: prevented
    all_target_number_modifier_while_active: 8
  scope: Game mechanics only; no physical implantation instructions or real-world technology claims.
