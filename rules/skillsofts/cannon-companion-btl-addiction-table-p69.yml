id: rule.skillsofts.cannon-companion-btl-addiction-table-p69
record_type: rule
status: reviewed
source: source.cc
printed_pages: '69'
pdf_pages: '70'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: 'FASA7908 Cannon Companion: original fictional BTL addiction table'
summary: 'FASA Corporation Shadowrun Third Edition tabletop RPG, printed p69/PDF70; all fourteen original game-table rows for fictional BTL character conditions, including distinct ratings, tolerance, edge and Fix Factor.'
data:
  related_rule: rule.chemistry.addiction
  columns: [type_or_option, rating_code, tolerance, edge, fix_factor]
  base_types:
    - [Dreamchips, 4M/2P, 2, 3/10, 3 days]
    - [Moodchips, 3M/3P, 2, 2/10, 1 day]
    - [Personafix, 5M/2P, 2, 5/12, 1 week]
    - [Tripchips, 3M/4P, 2, 4/12, 1 week]
  option_modifiers:
    - [Defective, '-1', '-', '-', '-']
    - [Partial Peak Controls, '-2', '-2', 'x 2/x 1.5', '-']
    - [Personalized, '+3', '-1', '-/-2', '-']
    - [Psychotropic, '+1', '-', '-1/-1', '-']
    - [Rough Cut, '-1', '+1', '-', '-']
  btl_rating_modifiers:
    - ['1-2', '-1', '-', '-', '-']
    - ['3-4', '-', '-', '-', '-']
    - ['5-6', '+1', '-', '-', '-']
    - ['7-8', '+2', '-', '-', '-']
    - ['9+', '+4', '-', '-1/-1', '-']
  notation: Dashes reproduce original empty-effect cells and are not invented values; paired Edge values remain in original order.
  scope: Existing four BTL type entities contain market values, not this separate addiction table; Man and Machine owns general substance abuse procedure.
