id: rule.skillsofts.cannon-companion-btl-programming-qualifiers-p66-69
record_type: rule
status: reviewed
source: source.cc
printed_pages: '66-69'
pdf_pages: '67-70'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: 'FASA7908 Cannon Companion: fictional BTL programming option game qualifications'
summary: 'FASA Corporation Shadowrun Third Edition tabletop RPG, printed pp66-69/PDF67-70; original game rating, dice, eligibility and size conditions supplement fifteen existing BTL option summaries.'
data:
  design:
    rating_adjustments: cumulative
    size_multiplier: 2
    program_size_table: SR3 p223
    option_rating_maximum: base BTL rating
  black_death:
    game_damage_power: option rating
    damage_level_multiplier_increment: 2 per level above Light
    resistance: Body only
    repeated_damage: at end of each Combat Turn
    removal: Complex Action and Willpower test against option rating
    successful_deactivation_final_damage_power: half rating rounded down
    trigger: activation or specified event in fictional program cycle
  black_night:
    damage_type: Stun rather than Physical
    shutdown: when character becomes unconscious
    damage_level_multiplier_increment: 1 per level above Light
  cluster: use cluster skillsoft rules p60; can contain both BTL and skillsoft programs
  defective:
    effective_rating: 75 percent rounded down
    per_use_stun: '(Rating)L, resisted with Willpower'
    actual_size_multiplier: 0.5
    design_size_increase_percent: 150
    incompatible: [optimization]
  degrading:
    original_table_design_rating_modifier: 1
    per_use_rating_reduction: 1
    burn_out_at_rating: 0
    incompatible: [one-shot, timer]
  implant: use implanted skillsoft rules p61
  one_shot:
    uses: 1
    actual_size_multiplier: 0.25
    design_size_multiplier: 1.5
    incompatible: [degrading, timer]
  optimization: use skillsoft optimization rules p62
  partial_peak_controls:
    effective_rating: half rating rounded down
    original_jurisdiction: legal in California Free State and some other fictional countries; above CAS and UCAS limits
  personalized:
    acquisition: special order requiring fictional examination and simsense diagnostics
    non_intended_user: adverse effects analogous to customized skillsofts p60 reference as printed
    actual_size_multiplier: 0.5
    design_size_increase_percent: 150
    incompatible: [optimization]
  polypov:
    dreamchip_only: true
    multiple_pov_requires: BTL-modified polyPOV simdeck
    simultaneous_users: each may experience a different POV
    single_user_simulpov_requires: multiple datajacks
    simulpov_stun: '(Rating)M'
    simulpov_addiction_rating_increase: 1
    design_size_multiplier_per_additional_pov: 1.5
  psychotropic:
    trigger: deactivation or unconsciousness
    test: Willpower against Psychotropic rating
    failure: lasting fictional psychotropic condition analogous to psychotropic IC
  ras_override:
    original_table_design_rating_modifier: '-'
    effect: suppresses voluntary movement; common in direct-input chips, generally unnecessary in dreamdeck chips whose decks include it
    source_distinction: having RAS override is not the same as disabling it (p65)
  rough_cut:
    target_number_modifier_while_active: 1
  timer: configured elapsed time or play count; erases fictional chip at threshold
  precedence_flags:
    - Existing btl-degrading option records design modifier -1; original p69 table explicitly prints +1.
    - Existing btl-ras-override option describes disabling the override, whereas original p68 describes the installed override suppressing movement; p69 table prints a dash, not Special.
  scope: Existing BTL purchase modifier rows are reused read-only apart from the explicit discrepancies; no shared option is rewritten.
