id: rule.skillsofts.cannon-companion-pab-event-qualifiers-p68-71
record_type: rule
status: reviewed
source: source.cc
printed_pages: '68-71'
pdf_pages: '69-72'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: 'FASA7908 Cannon Companion: fictional PAB event-state test qualifiers'
summary: 'FASA Corporation Shadowrun Third Edition tabletop RPG, printed pp68–71/PDF69–72. Original game-only modifiers and outcome qualifications absent from the existing SR3 event-reprogramming procedure.'
data:
  existing_procedure: procedure.skillsofts.event-reprogramming
  original_reprogramming_modifiers_table:
    device: negative PAB rating (already included in the existing base target-number calculation; do not apply twice)
    memory_span:
      less_than_day: -1
      less_than_week: 0
      less_than_month: 1
      less_than_six_months: 3
      less_than_year: 6
      more_than_year: 8
    exactly_one_year: not explicitly assigned a band by the printed table
    event_unimportant: -1
    event_vital: 2
    subject_directly_involved: 2
    per_previous_failed_test: 2
    linked_events_or_information: [1, 4]
    linked_range_interpretation: inclusive range of positive modifiers
    basic_attitudes_ethics_or_psychology: add subject Willpower
  game_state_qualifications:
    base_time_rounding: round up before success division
    failed_test_temporary_state_days: PAB rating
    success_state_duration: until detected and reversed
    direct_behavior_change: false
    successful_state_includes_reprogramming_interval: true
    standard_lie_detection: does not identify the fictional altered-memory state
    standard_interrogation: character answers as though the altered memories are real
  fictional_setting_restriction: The source limits legal use to licensed therapists and certain government agencies; this is not real-world law.
  source_example: 'The printed p71 example has attributes 4 and 6, device rating 5, two +2 modifiers, target 5, two successes with one allocated to concealment, and 12 days.'
  legacy_relation: 'ShadowBeat original 2E-era procedure is a separate historical record; its differing target and modifier rules are not imported into SR3.'
  scope: Abstract fictional character-state and dice mechanics only; no actual technology or clinical procedure is specified.
