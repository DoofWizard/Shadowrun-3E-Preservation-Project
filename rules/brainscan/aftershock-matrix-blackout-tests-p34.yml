headline: 'Fictional tabletop RPG archive: Brainscan, FASA Corporation (2000), Shadowrun
  Third Edition, FASA7331/source.fasa-7331, printed pp34/physical PDF pp35 — Aftershock
  Matrix power-outage tests, dump shock and host bounce'
summary: Historical source-review record from the fictional Shadowrun SR3 campaign
  Brainscan (FASA Corporation, 2000, FASA7331/source.fasa-7331); printed pp34, physical
  PDF pp35. Exact Shadowrun Third Edition game dice triggers and page reference for
  blackout-related virtual host effects; not computer-system instructions.
data:
  context: Fictional Seattle power outage in Aftershock, Brainscan printed p34/PDF35.
  general_effect: Cyberdecks carry their own supplies, while most Matrix hosts depend
    on electricity and briefly retain only critical backup functionality. Nonessential
    hosts begin to shut down within minutes; a decker may still connect but can have
    trouble navigating to the desired destination.
  dumpshock:
    condition: A player character's decker is in a host that goes off-line from the
      blackout.
    roll: 1D6
    trigger_result: 1
    effect: Immediately dumped from the host and suffers dumpshock.
    cross_reference: Shadowrun Third Edition core, p227
  bouncer_host:
    condition: A host remains on-line during the blackout and experiences the sudden
      power surge.
    roll: 1D6
    trigger_result: 1
    effect: The host increases security measures, treats even an innocent decker as
      a threat, and may bounce to a higher security level.
    new_security_rating: Set by gamemaster; the source explicitly permits an increase
      as high as Red.
    gm_note: The campaign text frames this as an optional power-surge effect, not
      a universal rule for all systems.
  lineage: Original Shadowrun Third Edition Brainscan scenario-only effects; no current-system
    replacement implied.
framing: reference_exact
