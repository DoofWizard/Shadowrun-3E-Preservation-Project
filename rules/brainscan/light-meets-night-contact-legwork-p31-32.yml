headline: 'Fictional tabletop RPG archive: Brainscan, FASA Corporation (2000), Shadowrun
  Third Edition, FASA7331/source.fasa-7331, printed pp31-32/physical PDF pp32-33 —
  fictional contact-legwork target numbers and success tiers'
summary: Historical source-review record from the fictional Shadowrun SR3 campaign
  Brainscan (FASA Corporation, 2000, FASA7331/source.fasa-7331); printed pp31-32,
  physical PDF pp32-33. Complete graded contact-information matrix. These are results
  for fictional in-game Contacts tests; allegations and guesses in result tiers remain
  attributed to sources, not narrator-confirmed facts.
data:
  scene: 'Light Meets Night: Legwork'
  note: TN and count of successes determine which source-authored in-world remarks
    the gamemaster supplies. All success grades recorded as tiers, including zero
    and all-ones only where printed.
  topics:
  - topic: Council Island
    source_page: 31
    pdf_page: 32
    contact_options:
    - kind: tribal
      target_number: 3
    - kind: other Seattle
      target_number: 5
    tiers:
      '0': Contact does not know the island.
      '1': Contact asks whether a native festival is happening there.
      '2': Council Island is described as Salish-Shidhe territory with a government
        embassy or related presence.
      '3': Contact believes island workers are predominantly tied to the Salish-Shidhe
        government or Gaetronics; Gaetronics is claimed to be closely intertwined.
      '4': Contact warns official business is expected; borders are protected by guards
        with security gear and magical capabilities.
      5_plus: Contact says defenses focus on highway access/go-gangs and water approach
        may be easier with suitable resources.
  - topic: Council Island Inn
    source_page: 31
    pdf_page: 32
    contact_options:
    - kind: tribal
      target_number: 4
    - kind: other Seattle
      target_number: 6
    tiers:
      '0': Contact asks where Council Island is.
      '1': The inn is identified as a hotel at the island's northern end.
      '2': Private, upscale hotel; access to a room needs a trusted connection.
      '3': Contact jokes about a mistress but says visiting diplomats, senior Gaetronics
        personnel, and the ambassador's mistress are among guests.
      '4': Contact explicitly retracts the mistress story as a joke.
      5_plus: Contact thinks internal hotel security is relatively light after gaining
        entry to the difficult-to-access island.
  - topic: 'Gaetronics: corporate contacts'
    source_page_range: 31-32
    pdf_page_range: 32-33
    contact_options:
    - kind: corporate
      target_number: 4
    tiers:
      '0': Contact dismisses Gaetronics as below double-A status.
      '1': Contact names Gaetronics as largest corporation within Salish-Shidhe Council
        territory, barely multinational, influential around Council Island and Seattle.
      '2': Contact identifies electricity from nuclear and alternative plants as the
        core business, with geology, ecology, atmospheric studies and stated green
        policies.
      '3': Contact asserts Gaetronics provides much of Seattle's electricity and has
        strong influence over Salish-Shidhe government.
      4_plus: Contact reports unverified rumors that Gaetronics and Shiawase Atomics
        are in an unusual, recent corporate conflict.
  - topic: 'Gaetronics: street contacts'
    source_page: 32
    pdf_page: 33
    contact_options:
    - kind: street
      target_number: 4
    tiers:
      '0': Contact recognizes the company name but knows little.
      '1': Contact recalls a promotional power-generation slogan.
      '2': Contact describes a large Salish-Shidhe nuclear plant as producing most
        of Seattle's power.
      '3': Contact alleges Gaetronics CEO and the chief of the Salish-Shidhe tribe
        are brothers; this is a contact claim, not confirmed narration.
      '4': Contact thinks Shiawase cannot locally match Gaetronics and resents the
        relationship.
      5_plus: Contact speculates many Gaetronics executives are visiting the Qatuwas
        Festival.
  - topic: Qatuwas Festival
    source_page: 32
    pdf_page: 33
    contact_options:
    - kind: tribal
      target_number: 4
    - kind: other Seattle
      target_number: 6
    tiers:
      '0': Contact does not recognize the festival.
      '1': Contact has seen posters announcing it for the next several nights.
      '2': Contact identifies a Salish-Shidhe ceremonial festival on Council Island.
      '3': Contact says it is a three-day celebration also used by non-native attendees
        as an opportunity to visit the island.
      4_plus: Contact identifies a series of Coast Salish-area festivals through the
        year, including Seattle's Qatuwas.
  - topic: 'Shiawase: corporate contacts'
    source_page: 32
    pdf_page: 33
    contact_options:
    - kind: corporate
      target_number: 4
    tiers:
      '0': Contact describes Shiawase as an unusually low-profile AAA firm.
      '1': Contact calls Shiawase a leading global biotechnology corporation with
        multiple interests.
      '2': Contact reports expanded Seattle influence and acquisition of companies
        formerly belonging to Fuchi.
      '3': Contact describes Shiawase corporate intelligence as highly reputed.
      '4': Contact says competition between Gaetronics and Shiawase Atomics has become
        openly hostile.
      5_plus: Contact claims Shiawase wants more Seattle power share but cannot place
        a nuclear plant in heavily populated Seattle after the Redmond Glow City incident,
        and Salish-Shidhe approval for an alternative site is unavailable because
        of Gaetronics ties.
  - topic: 'Shiawase: street contacts'
    source_page: 32
    pdf_page: 33
    contact_options:
    - kind: street
      target_number: 4
    tiers:
      '0': Contact mentions owning a Shiawase video camera; little corporate knowledge.
      '1': Contact raises anti-DocWagon sentiment and uncertainty whether to accept
        a job against a Big Ten firm.
      '2': Contact recalls Shiawase's nuclear facility in the Barrens near Glow City
        and expresses concern about its earlier incident.
      '3': Contact says Shiawase is investing in Seattle research and security and
        hiring runners.
      '4': Contact alleges Shiawase pays discreetly for professional work but would
        retaliate after a betrayal; this is an in-world claim.
      5_plus: Contact alleges Gaetronics is gaining Seattle electricity market share
        and Shiawase is considering reprisals.
  edition: Original FASA7331 Shadowrun Third Edition contact resolution.
framing: reference_exact
