headline: 'FICTIONAL Shadowrun Third Edition tabletop RPG, FASA Corporation Brainscan
  (2000; FASA7331/source.fasa-7331), printed p144/physical PDF145: Medusa construct
  ablative-armor and stun procedures'
summary: 'Original fictional Shadowrun Third Edition combat mechanics from FASA Corporation
  Brainscan (FASA7331, 2000), printed p144/PDF145: Medusa armor degradation trigger,
  optional stun system, wound-penalty threshold and hydraulic-jack Handling tests.
  Exact numerics and cited rules remain historical.'
data:
  subject: Medusa, the fictional Deus combat drone construct in Brainscan, printed
    p144/PDF145. The source presents these as game rules, not actual weapons or engineering
    guidance.
  armor:
    ablative_armor_points_as_printed: 2
    armor_rating_addition: +4 to Armor Rating
    trigger_as_printed: An attack that strikes a Medusa with a Power three times the
      modified Armor Rating will remove 1 point of ablative armor.
    effect: Remove 1 point of ablative armor upon the printed attack trigger; do not
      infer additional thresholds or mathematical comparison not stated.
  wound_penalty_contingency: Contingency maneuver controls allow the Medusa to ignore
    up to 6 boxes of wound penalties; if the drone takes more than 6 boxes of damage,
    all wound penalties apply.
  electric_shock:
    trigger_action: Simple Action
    printed_damage: 10S Stun
    armor_interaction: Against half the target character’s Impact Armor
    additional_effect: Disorienting as a taser; original rule points to SR3 p124
    optional_variant: Some Medusae have an implanted taser system with the same effects
      and a Sharpshooter 3 autosoft to use it.
  hydraulic_jacks:
    test: Handling Test
    jump_distance: 3 meters per success
    equipment: Hydraulic jacks in all four legs
  weapons_as_printed:
  - Fineblade claws [9M, +1 Reach]
  - Tail whip [9L, +2 Reach]
  - Taser/shock system [10S Stun, SA]
  autosofts_as_printed:
  - Clearsight 5
  - Implant Weaponry 4
  - some also have Sharpshooter 3
  historical_lineage: The source cites Shadowrun Third Edition p124 and Man & Machine
    p127 for taser/electrical effects; these are publication cross-references and
    not inferred conversions.
