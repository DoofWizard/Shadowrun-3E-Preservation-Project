    "route": "Three-person Surfstar Marine Seacop teams patrol the water around Council Island, concentrating around Burbank Park while the festival is held, and watch vessels approach.",
    "initial_response": "After a boat is noticed, a patrol boat signals it to stop and checks identification with a portable Rating 3 credstick reader; obvious arms, cyberware or unusual conduct can trigger further scrutiny. The boat may be tailed after a clear check.",
    "suspicion_response": "If the patrol identifies suspicious elements it delays travelers for backup and then attempts arrest. The printed game procedure distinguishes suspicious circumstances from automatic hostility.",
    "unlit_boat_test": "If player characters disable running lights and avoid patrols, the marine officers attempt a Perception (8) test, adjusted for characters’ concealment, invisibility, mature spirit powers and other conditions. Any success makes the patrol close to look again; two or more successes lead it to radio for reinforcements and intercept.",
    "radar_exception": "Marine patrol boats do not carry radar and cannot use radar to locate an approaching boat.",
    "combat_alert": "Marine patrol crews radio for backup and fire an alert flare when fighting begins, if able. First supporting patrol boat arrives in 1D6 Initiative Passes after alert, another after an additional 1D6 ÷ 2 Initiative Passes. Total of six patrol boats are on the lake.",
    "astral_support": "An astrally projecting Salish shaman arrives 1D6 ÷ 2 Initiative Passes after the combat alert.",
    "silent_defeat": "If characters defeat a marine patrol before it signals for help and without obvious firearm/explosion sounds, the shoreline may not be alerted; each hour island marine officers attempt Perception (8) to find the lost patrol boat, whether sunk, hidden, or stationary.",
