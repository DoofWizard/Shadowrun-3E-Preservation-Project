data:
  subject: Deus Gorgon, fictional robot construct; distinct game tests and weapon
    effects on Brainscan printed p142. The general world-profile facts and overall
    construct rules are indexed separately.
  camouflaged_detection:
    mechanism_in_fiction: Ruthenium-polymer camouflaged carapace
    test: Perception (10) Test
    condition: Needed for a fictional character to notice a cloaked Gorgon
  handling:
    leap: 2 meters for each success on a Handling Test
    pilot_handling_bonus: +2 Pilot Rating for Handling Tests due to fictional drive-by-wire
      and structural agility
  special_attacks_as_printed:
  - Fineblade claws [9M, +2 Reach]
  - Tail whip [9L, +2 Reach]
  - Spray nozzle with freeze foam or other compound
  arms_strength: 9
  wound_penalties:
    until: Ignore up to 6 boxes of wound penalties
    above_threshold: If the Gorgon takes more than 6 boxes of damage, all wound penalties
      apply
  autosofts_as_printed:
  - Clearsight 4
  - Implant Weaponry 4
  - Sharpshooter 3
  source_cross_references:
  - 'Whip rules: Shadowrun Third Edition p276'
  - 'Freeze foam: Man & Machine p112'
