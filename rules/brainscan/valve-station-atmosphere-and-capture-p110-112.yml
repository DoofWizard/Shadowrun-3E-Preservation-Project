data:
  atmosphere_identification:
    tests:
    - Electronics (8) Test
    - Chemistry (4) Test
    - Engineering (5) Test
    result: Reveals that most of level 202 contains halon gas, while other sectors contain pressurized
      vacuum or fictional gases including Neuro-stun VIII and Green Ring-3; a few are not identifiable
      by serial numbers.
  atmosphere_control:
    test: Electronics (Control Systems) (6) Test
    failure: Wrong mixture or no change.
    duration: Approximately 1 hour for the original mixture to drain and fresh mixture to enter.
    alternative: Kiell or Sebastian can also enter the local control computers and select the atmosphere.
  station_security:
    security: Rating 4 passcode maglock.
    guard_choices: One Medusa drone or a pair of Spider drones; these are alternative GM encounter
      configurations.
  zombie_room_gas:
    original_name: Colorless, odorless, contact-vectored neuro-stun X gas
    damage: 8S Stun
    speed: 1 Combat Turn
  drug_and_cyberware:
    drones: A dozen Bumblebee drones administer gamma-scopolamine as referenced to p250 of the original
      SR3 core book.
    forced_implant: Characters without datajacks are subjected to involuntary alphaware datajack
      surgery by Deus’s captors.
    essence_effect: Essence loss of .16
    magic_consequence: Magic loss uses The Magic Attribute rule on p158 of the original SR3 core
      book.
    sedation: Characters receiving the implants do not realize what has happened until they awaken.
    electrode_alternative: GM may substitute basic electrodes for forcibly implanted datajacks, reducing
      Matrix Reaction by half, rounded down.
  mainframe_security:
    barrier_rating: 8
    equipment: Deus’s Grendel Project CCR-235 mainframe host/SCIRE AEP interface, protected by multiple
      maglocks.
    prepared_cyberdecks: Other deckers may use Renraku Kraftwerk-8 cyberdecks; the narrator includes
      a Resistance group with fire support.
  precision: All dice, target numbers, ratings, time, damage, Essence/Magic and exceptions are game
    rules from FASA7331; this record is not a real-world procedure.
