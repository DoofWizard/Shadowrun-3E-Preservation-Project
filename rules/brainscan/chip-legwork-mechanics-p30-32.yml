  Edition Brainscan (FASA7331), printed 30-32/PDF31-33; all reported allegations and
  optional GM events are separated from narrator facts.
data:
  Tacoma_chip:
    available_memory: At least 300 Mp on computer or cyberdeck
    test: Computer (5)
    time: Approximately 30 minutes per success to receive complete information; less
      time can reveal partial information
    result_by_success:
      all_ones: Looks as though it overwrites substation power-consumption records.
      '0': Appears to be a utility program.
      '1': Copies power-consumption data.
      '2': Sends copied records to an anonymous Matrix node when the substation connects.
      '3': Monitors without recording information incoming from the main Gaeatronics
        host.
      4_plus: Erases itself and several substation computer files when a specified
        character string appears in incoming data.
  Council_Island_Inn_chip:
    available_memory: At least 200 Mp
    test: Computer (6)
    time: Approximately 30 minutes per success for complete detail
    result_by_success:
      all_ones: Appears to be an elaborate email client.
      '0': Uninformative program code.
      '1': Behaves like a fictional email virus, replicating to outgoing emails.
      2_to_3: Targets a list of email addresses on a Gaeatronics Matrix host.
      4_plus: Begins sending data packets to another node upon reaching its destination.
  combined_revelation: Enough successes examining both programs indicates that the
    Council Island program broadcasts packets matching the sequence that will cause
    the Tacoma program to delete itself.
  contact_target_numbers:
    Council_Island:
      Tribal Contacts: 3
      Other Seattle Contacts: 5
    Council_Island_Inn:
      Tribal Contacts: 4
      Other Seattle Contacts: 6
    Gaeatronics:
      Corporate Contacts: 4
      Street Contacts: 4
    Qatwas_Festival:
      Tribal Contacts: 4
      Other Seattle Contacts: 6
    Shiawase:
      Corporate Contacts: 4
      Street Contacts: 4
  contacts_note: Original printed successful-contact information has separate credited
    success ladders. All are in-world contact statements, not historical facts about
    real companies.
