  "data": {
    "scope": "Original Shadowrun Third Edition game procedures for Deus's fictional robot drone constructs; rules cited to SR3 and Renraku Arcology: Shutdown.",
    "autonomy": "Drones are gamemaster-controlled autonomous constructs. In most tests use each drone's Pilot rating in place of a rigger's skill or attribute; no rigger is directly controlling them.",
    "sensor_test": "Because constructs perceive through sensors, they make Sensor Tests (Sensor Rating dice against Signature) instead of Perception Tests. Apply standard source modifiers; the source specifies metahumans have Signature 6 (5 for trolls).",
    "learning_pool": "Drones may use Learning Pool dice in Success Tests otherwise augmentable with Combat, Control or Task Pool dice.",
    "robot_pool": "Each drone has a Robot Pool representing autonomous coordination and BattleTac IVIS advantages; it can augment its actions, and refreshes in the same manner as other dice pools.",
    "autosoft_effects": "Autosofts enhance Pilot Rating for the specified test, such as Sharpshooter on Gunnery and Clearsight on Sensor Tests. The added dice are not ordinary pool dice.",
    "ranged_combat": "Use SR3 Sensor-Enhanced Gunnery. A drone must obtain weapons lock with a successful active Sensor Test requiring a Complex Action; it may lock more than one target. For an attack it rolls Pilot Rating (plus relevant autosofts), plus half its Sensor Rating rounded down, plus Learning and Robot Pool dice, against the target's Signature modified by the Sensor-Enhanced Gunnery Modifiers Table (SR3 p154).",
    "melee": "Use normal melee combat rules. Roll Pilot Rating enhanced by relevant autosofts, plus Learning and Robot Pools. The drones may use both pools for Dodge Tests.",
    "physical_damage": "Treat constructs as vehicles for damage resistance. Halve the weapon Power rounded down; if this reduced Power is less than or equal to the drone's armor, the attack has no effect. Otherwise subtract armor from the reduced Power and reduce Damage Level by one.",
    "magic": "Spells affecting only living targets have no effect on constructs. Physical spells affecting non-living matter can affect them. The source specifies Object Resistance 10 and a target number equal to 10 plus the drone's Body Rating; the machines make no Resistance Test against spells.",
    "self_destruct": "Constructs have fictional self-destruct devices if captured or leaving the arcology boundaries. Explosion Power = (Body × 2) + 8, decreasing by 1 per meter of separation, with Damage Level S; subtract Impact Armor from blast Power normally.",
    "ramming_and_caution": "Dervish, Manta, and Medusa have BattleTac FDDM indirect-fire modules and can be dangerous rammers. Apply the SR3 ramming rules at pages 143 and 148."
  },
