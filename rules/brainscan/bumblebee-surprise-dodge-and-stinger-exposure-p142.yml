summary: Source-reviewed historical game-mechanics record from fictional FASA Brainscan,
  original Shadowrun Third Edition (FASA7331, 2000), printed p142/PDF143. Preserves
  named Perception target numbers, modifiers, surprise condition, chemical-exposure
  cross-references and recharge timing as published; not real-world instructions.
data:
  subject: Fictional Deus Bumblebee drone construct in FASA Brainscan, printed p142/PDF143.
    This record isolates special rules not fully represented as procedures in the
    existing general drone and fictional-world profiles.
  visual_detection:
    test: Perception (10) Test
    condition: to spot a Bumblebee drone in motion
    stationary_modifier: +2 to target number if the drone is still
    thermographic_vision_modifier: -3 to target number for a character using thermographic
      vision
  surprise_and_dodge:
    condition: Unless a character sees the fictional Bumblebee drone, its attack catches
      that character by surprise
    effect: The victim cannot dodge that attack; the published rule is expressly conditional
      on not seeing the drone.
  stinger_game_effect:
    equipment: Implanted single-use stingers
    payload: Two doses of fictional cutter nanites
    effect_cross_reference: Same fictional effect as cutter nanites in Man & Machine
      p92
    exposure_cross_reference: Apply the chemical exposure via weapons rules in Man
      & Machine p106; do not substitute an unstated real-world method.
  operating_limits:
    maximum_flight_time: 5 Combat Turns
    maximum_range: 50 meters
    hive_reload: Spending 5 Combat Turns at its hive permits the drone to reload its
      two stinger doses
  autosofts_as_printed:
  - Clearsight 3
  - Implant Weaponry 2
  historical_lineage: Man & Machine is an expressly cited game-rules source; no new
    edition change is asserted here.
framing: reference_exact
