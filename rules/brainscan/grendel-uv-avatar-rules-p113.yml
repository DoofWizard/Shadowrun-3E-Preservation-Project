  "data": {
    "topic": "Grendel ultraviolet-host physical-avatar and utility game procedures",
    "source_override": "Grendel is a UV Matrix host. The gamemaster treats deckers as physical-bodied characters, with a fictional medieval Japanese metaphor, rather than using normal decking rules.",
    "attributes": {
      "mental": "Retain normal mental attribute ratings.",
      "body_and_strength": "Each equal to the Bod deck rating.",
      "quickness": "Equals the Evasion deck rating.",
      "reaction_and_initiative": "Calculated normally; bonuses from Response Increase or running pure DNI apply."
    },
    "skills": "Normal skills apply. Characters may substitute Computer (Programming) skill (round down) for skills they lack, as printed; the sentence supplies no divisor.",
    "dice_pools": "No pools other than Hacking Pool may be used for UV-host tests; only characters using a hot cyberdeck may use Hacking Pool.",
    "utility_rules": {
      "active_memory": "Utilities appear as physical tools and trappings, according to program, rating and host metaphor.",
      "armor_shield": "Armor and shield utilities appear as medieval Japanese armor and shields with Armor equal to utility rating.",
      "attack": "Attack utilities become medieval melee, projectile or throwing weapons with comparable physical-weapon statistics and applicable skills.",
      "skill_example": "A medic-6 utility can provide Biotech 6.",
      "relocate_camo": "May grant a GM-selected Stealth Test modifier or extra dice while fleeing oni IC.",
      "commlink": "May appear as a carrier pigeon or similar prop."
    },
    "physical_damage": "Damage sustained in a UV host affects the character's physical body, not merely a Matrix icon.",
    "scope": "The book gives discretionary metaphor and utility conversions to the GM; do not infer a universal SR3 conversion outside this scenario."
  },
