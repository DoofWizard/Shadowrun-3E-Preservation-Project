data:
  climax_mechanics:
  - printed_page: 121
    effect: The ropes suspending Ronin and Aneki have Barrier rating 8.
  - printed_page: 122
    effect: Contact with Megaera by an AI IC construct or otaku servant triggers an
      18D Stun disruptive attack.
  - printed_page: 122
    effect: On every Combat Turn, Deus can use one action to affect the fictional
      UV-host combat scene; Megaera is also allowed one interference action each Combat
      Turn.
  - printed_page: 122
    effect: Megaera can cause multiple copies of a runner to act independently; the
      effect lasts 2D6 Combat Turns; damage to any copy may affect all, or only that
      copy at GM discretion.
  - printed_page: 122
    effect: Megaera may give a character the ability to throw fireballs using the
      Damage Code of 10S.
  qualification: The intervention lists are proposed optional gamemaster twists rather
    than globally applicable SR3 rules. Do not flatten the conditional list into universal
    mechanics.
