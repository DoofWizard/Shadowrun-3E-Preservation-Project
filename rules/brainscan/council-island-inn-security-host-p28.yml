data:
  fictional_hotel: Council Island Inn, Salish-Shidhe territory, Shadowrun Third Edition
  bungalow_security:
    front_door_cardreader_maglock_rating: 6
    maglock_antitampering_rating: 2
    window_alarms: Audible in bungalow and alert hotel security console
    wards_rating: 3
    magical_ward_response: Hotel security shaman raises alarm if attacked or breached.
    perimeter_guard_count: 2
    guard_round: Approximately 10 minutes each.
    camera: Miniature concealed camera records each bungalow entrance and footage
      can be reviewed; front-desk console can monitor.
  alarms:
    door_window: One hotel guard arrives in 2D6 combat turns; two more guards and
      a Force 5 wind spirit arrive 1D6 combat turns afterward.
    camera_or_visual_sighting: Six guards with wind spirit arrive after 3D6 combat
      turns.
    security_patrol_cars: Two arrive in 2D6 minutes, separate rolls for each.
  host:
    matrix_connected: false
    rating: Orange-7/14/12/12/13/13
    access: Local security terminals around marina, parking and hotel entrances, or
      internal bungalow panels.
    sheaf:
    - trigger_step: 3
      event: Probe-4
    - trigger_step: 7
      event: Probe-6
    - trigger_step: 11
      event: Passive Alert; Tar Baby-6
    - trigger_step: 15
      event: Killer-6
    - trigger_step: 18
      event: Blaster-6
    - trigger_step: 22
      event: Active Alert; Blaster-8
  illustration:
    printed_page: 28
    physical_pdf_page: 29
    description: Black-and-white image of heavily equipped fictional security guard
      using a handheld transmitter.
