data:
  standard_disconnect: A runner dumped from the UV host takes 16D Stun damage.
  iccm_exception: If the runner has ICCM, the stated damage is 14S rather than the
    16D Stun default.
  gm_mitigation: If this injury would kill one or more player characters, the gamemaster
    is explicitly advised to reduce it appropriately.
  outcome: All characters who were in the UV host are unconscious after dumping, regardless
    of whether their waking location is the 202nd floor or zombie room.
  ronin_exception: Ronin is not dumped from the Matrix alongside the other deckers
    and remains jacked in; physically disconnecting him is allowed without harm. He
    awakens with no memory of the fight, and attempting to jack into his active internal
    connection does not succeed.
