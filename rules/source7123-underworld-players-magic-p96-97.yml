id: rules.source7123.underworld-players-magic
record_type: rule_reference
status: ingested
source: source.fasa-7123
printed_pages: "96-97"
pdf_pages: "98-99"
content_class:
  - rule_exact
  - rule_procedure
  - character_option
  - campaign_guidance
framing: exact_mechanics

chimera:
  npc_ratings:
    - "At a minimum, Chimera assassins should be Superior to all player characters."
    - "They may have exotic cyberware as chosen by the gamemaster; much of it may be delta-grade or experimental."
    - "Chimera assassins should have Threat Ratings of at least 6 and as high as 10."

ninja:
  character_type:
    - "Most ninjas described on pp.48-49 are physical adepts or physical magicians (Awakenings p.119)."
  common_adept_powers:
    - Combat Sense
    - Flexibility
    - "Improved Ability (Armed Combat)"
    - "Improved Ability (Athletics)"
    - "Improved Ability (Stealth)"
    - "Improved Ability (Throwing)"
    - "Improved Ability (Unarmed Combat)"
    - Increased Reflexes
    - Killing Hands
    - Nerve Strike
    - Spell Shroud
    - Traceless Walk
  favored_magic:
    - mask
    - invisibility
    - detection spells
    - shapeshifting
    - telekinetic manipulations
    - death touch
    - slay
  notes:
    - "Geasa may restrict some adept abilities."
    - "Rumors of water-walking or passing through solid walls are presented as setting claims, not new spell rules."

tattoo_magic:
  quickening:
    - "A magical tattoo is a means of Quickening a single spell or set of spells on the wearer."
    - "For resisting attempts to dispel it, grounding through it, or astral combat, a spell Quickened through tattoo magic has twice its effective Force; effective Force is the amount of Karma spent to Quicken it."
  ink:
    radicals: "1 unit of herbal or mineral radicals per 2 Force points of the spell to be Quickened, round up."
    alchemical_base_time: "10 days"
    enchanting_test_target_number: "Number of units being mixed; minimum Target Number 2."
    time_resolution: "Divide the base time by the number of successes."
    no_successes: "Base time is wasted and the enchanter must try again."
    all_ones: "Base time is wasted and the materials are destroyed."
  tattoo:
    minimum_area: "10 square centimeters × desired Force Rating squared."
    examples:
      - "Force 1 requires 10 square centimeters."
      - "Force 4 requires 160 square centimeters."
    artist_base_time: "Force Rating squared days."
    tattooing_test_target_number: 4
    time_resolution: "Divide the base time by the number of successes."
    no_successes: "The artist must spend twice the base time to complete the tattoo."
    all_ones: "The tattoo is ruined and may scar the wearer."
    self_application: "A tattoo artist cannot give himself a magical tattoo."
  binding:
    - "The magician casts the desired spells on the subject using the normal Quickening rules (Grimoire II p.45) and spends Karma to bind the Quickening in place."
    - "Once bound, the Quickened spell can only be undone through Dispelling or in astral combat."
    - "Un-Masked Quickened spells must be considered when determining whether a character is detected by astral or magical security measures (Grimoire II p.46)."

triad_magic:
  totems: "Chinese magicians do not have totems and receive no totem bonuses."
  five_elements_spell_correspondence:
    wood: detection
    fire: combat
    soil: health
    metal: manipulation
    water: illusion
  spirits:
    - "Chinese magicians summon nature spirits as shamans do (Shadowrun II p.139)."
    - "Spirits often manifest as creatures of the land, sea and air, frequently dragonlike; ancestral ghosts and demons (kuei) are spirits of man."
  feng_lung:
    - "Chinese and Triad magicians make extensive use of feng-lung or dragon lines, natural manalines and power sites (Awakenings pp.103-104)."

sources:
  - {source: source.fasa-7123, printed_pages: "96-97", pdf_pages: "98-99", relation: rule_reference}
