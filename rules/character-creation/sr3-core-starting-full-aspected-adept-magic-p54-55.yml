    kind: published fictional cyberpunk tabletop role-playing game
  original_chapter: Creating a Shadowrunner — Choosing Magical Abilities (original
    printed pp54-55)
  magic_priority_reuse: The original Master Character Creation Table is already independently
    normalized in rule.character-creation.sr3-master-priority-numeric-p54; Priority
    A permits a Full Magician and Priority B an Adept or Aspected Magician.
  full_magician:
    starting_spell_points: 25
    may_cast_spells: true
    may_conjure_spirits: true
    may_use_magical_foci: true
    may_astrally_perceive_and_project: true
    tradition_choice:
    - shamanic
    - hermetic
  aspected_magician:
    starting_spell_points: 35
    specialization: An aspected magician specializes in an aspect of the chosen shamanic
      or hermetic tradition; magical capabilities are limited by that aspect rather
      than universally granting full Sorcery and Conjuring.
    may_astrally_perceive: true
    may_astrally_project: false
    tradition_choice:
    - shamanic
    - hermetic
  magician_creation_spell_point_purchases:
    nuyen_per_added_spell_point: 25000
    maximum_spell_points_after_purchases: 50
    purchased_at_character_creation_only: true
    may_not_sell_points_back_for_nuyen: true
    may_not_carry_over_unspent_creation_spell_points: true
    can_be_spent_to_learn_starting_spells: true
    can_be_spent_to_bond_starting_foci: true
    can_be_spent_to_begin_with_conjured_spirits_when_tradition_and_specialization_allow: true
  beginning_spirit_cost_in_spell_points:
    per_point_of_spirit_force: 1
    per_service_owed_to_character: 2
    published_example:
      spirit_kind: air elemental
      force: 4
      services_owed: 4
      spell_points_for_force: 4
      spell_points_for_services: 8
      total_spell_points: 12
  beginning_game_limits_for_full_and_aspected_magicians:
    spell_force_max: 6
    focus_force_max: 6
    spirit_force_max: 6
    max_spirits: 6
    services_owed_by_each_spirit_max: 6
    aspected_conjuring_prerequisite: Starting spirits are permitted only if the selected
      aspected tradition can conjure them.
  adept_creation:
    starting_magic_rating_used_in_original_example: 6
    starting_power_points_equal_magic_rating: true
    initial_power_points_at_magic_6: 6
    may_purchase_or_sell_extra_power_points_at_creation: false
    starting_spell_points: 0
    weapon_focus_bonding_with_creation_spell_points: false
    later_karma_for_weapon_focus_bonding: After character creation a qualified adept
      may use acquired Karma to bond a weapon focus, as described in the published
      game.
