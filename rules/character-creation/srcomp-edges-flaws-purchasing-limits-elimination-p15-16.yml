id: rule.character-creation.srcomp-edges-flaws-purchasing-limits-elimination-p15-16
record_type: rule
status: source_reviewed
source: source.srcomp
printed_pages: 15-16
pdf_pages: 16-17
edition_scope: FASA Corporation Shadowrun Companion FASA7905a, Shadowrun Third Edition
  optional Edges and Flaws game rules
content_class:
- rule_procedure
headline: 'FASA7905a Shadowrun Companion printed pp15-16/PDF16-17: optional Edge/Flaw
  purchase, limits, later elimination, and GM-designed options.'
summary: Exact optional character-system point balance and character count caps, rating
  and target-number limits, Good Karma elimination cost, incompatible trait and educator
  options, and gamemaster design limits.
data:
  publication:
    title: Shadowrun Companion
    publisher: FASA Corporation
    catalog: FASA7905a
    edition: Shadowrun Third Edition
    printed_pages:
    - 15
    - 16
    physical_pdf_pages:
    - 16
    - 17
  source_headings:
  - EDGES AND FLAWS
  - PURCHASING EDGES AND FLAWS
  - Edges and Flaws During Game Play
  - LIMITATIONS
  - ELIMINATING FLAWS
  - DESIGNING EDGES AND FLAWS
  optional_use:
    gamemaster_may_exclude_system: true
    may_use_with:
    - SR3 standard Priority System
    - Companion optional Point-Based Character Design
    notes: GM always controls which Edges and Flaws are permitted; the printed options
      do not automatically grant bonuses to every character.
  purchasing_during_character_creation:
    Edge_point_value_sign: positive
    Flaw_point_value_sign: negative
    standard_priority_system: Select Edges and Flaws whose total signed point values
      sum to zero, and observe the count cap.
    maximum_edges_count: 5
    maximum_flaws_count: 5
    maximum_total_count: 10
    point_based_system:
      cost_of_edges: Spend Building Points equal to the chosen Edge point value.
      rebate_from_flaws: Gain Building Points equal to the absolute value of the chosen
        Flaw point value.
      source_recommendation_maximum_Building_Points_gained_or_spent_this_way: 6
      cap_status: The six-Building-Point limit is explicitly the publication recommendation;
        do not convert it into a universal compulsory cap.
  adding_during_play:
    gamemaster_may_allow: true
    narrative_rule: Edges or Flaws arising in play should be integrated into existing
      character history and roleplaying rather than automatically added to skills/attributes.
    one_to_one_balancing_not_required: A new Flaw need not have a corresponding Edge
      or new Attribute/Skill effect.
  mechanical_limits:
    Edge_attribute_or_skill_bonus_may_exceed_standard_maximum: false
    exception: Only if specific original-source Edge text explicitly permits exceeding
      the otherwise applicable limit.
    target_number_floor_for_Edge_Flaw_modifications: 2
    incompatible_traits: The GM may not combine contradictory benefit/Flaw pairs such
      as Pacifist and Total Pacifist.
    education_options: 'The original p16 text names four educational Edges/Flaws:
      University Education, Technical School Education, Illiterate and Uneducated;
      these represent character-background extremes and do not themselves imply universal
      extra tests.'
    adjacent_original_source_disagreement: The printed p31 Edges Table names College
      Education while the p16 prose says University Education; preserve both labels
      without assuming an unprinted equivalence.
  eliminating_flaws_during_play:
    optional_rule_must_be_gm_permitted: true
    roleplay_or_long_process: Gamemaster may require extensive play, difficult withdrawal,
      training, medical care or other in-world resolution rather than a simple instantaneous
      purchase.
    Good_Karma_cost_formula: 10 x absolute value of the chosen Flaw point value.
    example:
      flaw: Sea Madness
      flaw_value: -4
      Good_Karma_required: 40
    other_costs: GM may impose additional nuyen expenses for medical or specialized
      steps; these are not assigned one universal monetary value in the source.
    subsequent_alternate_flaw: Eliminating one Flaw may produce or expose a different
      Flaw if justified by the narrative and gamemaster.
  designing_custom_edges_flaws:
    suggested_edge_positive_point_maximum: 6
    suggested_flaw_negative_point_minimum: -6
    status: General source advice, not an unbreakable numerical law; source says generally
      no Edge above 6 and no Flaw below -6.
    gm_approval_required: true
    pricing_principle: Assign larger positive cost to broader benefits and larger-magnitude
      Flaw compensation to more severe drawbacks; compare existing approved examples.
  referenced_summary_tables:
    original_printed: 31
    physical_pdf: 32
    canonical_path: options/character-creation/srcomp-edges-flaws-original-point-value-tables-p31.yml
framing: reference_exact
