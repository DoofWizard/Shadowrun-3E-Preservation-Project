headline: 'Original tabletop mechanics from FASA Corporation Shadowrun Companion, FASA7905a, Shadowrun Third Edition, printed p36/PDF37: optional fictional shapeshifter modifiers table.'
summary: Source-reviewed numeric modifiers across all seven listed SR3 shapeshifter variants; retain each form, modifier, condition and limit exactly.
data:
  publication:
    title: Shadowrun Companion
    publisher: FASA Corporation
    catalog: FASA7905a
    edition: Shadowrun Third Edition
    printed_page: 36
    pdf_page: 37
  table: Shapeshifter Racial Modifiers
  columns_explained:
    mental: Applies in both forms.
    human: Form-specific modifications for human form.
    animal: Form-specific modifications for animal form.
    attributes: All attribute and Reaction modifiers are additive; initiative bonuses state number of extra D6.
    unarmed_attack_power_bonus: Listed addition to unarmed attack Power; where present the table also explicitly adds one Damage Level.
  species:
