    kind: published fictional cyberpunk tabletop role-playing game
  original_chapter: Creating a Shadowrunner — Knowledge Skills by Class / Knowledge
    and Language Skill assignment
  source_knowledge_categories:
  - category: Street
    game_scope: Information from street connections, including in-world gang identification,
      criminal organizations, smuggling routes and fringe cults.
  - category: Academic
    game_scope: Book and school learning such as biology, medicine, chemistry, politics,
      philosophy, history and music.
  - category: Sixth World
    game_scope: Specialized knowledge of the fictional Shadowrun game world, including
      cybertechnology, metahumanity, magic and dragons.
  - category: Background
    game_scope: An in-game character previous job or personal background knowledge
      such as computers, electronics, sorcery, conjuring and demolitions.
  - category: Interests
    game_scope: Hobbies and other chosen in-world interests, including science fiction,
      urban brawl, woodworking and wine.
  knowledge_creation:
    skill_points_formula: Intelligence × 5
    linked_attribute: Intelligence
    knowledge_skill_costs: Use the core Active Skill cost rule relative to the relevant
      linked Attribute; see existing source-reviewed p57 skill-cost table.
    max_base_rating_at_creation: 7
    max_specialization_rating_at_creation: 7
    min_base_rating: 1
    may_purchase_new_knowledge_skills_after_creation: true
    may_improve_skills_after_creation: true
    knowledge_spending_is_separate_from_active_skill_points: true
    choice_scope: Players may freely choose topics within the five presented categories
      as compatible with their fictional character.
  language_creation:
    base_free_languages: At least one language is known at game start
    free_language_skill_points_formula: Intelligence × 1.5
    rounding: Round down
    can_spend_knowledge_skill_points_on_language_skill_ratings: true
    cost_and_specialization_limits: Language Skills follow original core Active Skill
      costs and limitation rules; additional language details and the paired Reading/Writing
      starting skill procedure are separately normalized from printed p91.
  published_build_arithmetic:
    covert_ops_intelligence: 4
    covert_ops_knowledge_points: 20
    covert_ops_free_language_points: 6
    combat_mage_intelligence: 4
    combat_mage_knowledge_points: 20
    combat_mage_free_language_points: 6
    sample_reference: Printed p59 gives named Covert Ops Specialist and Troll Combat
      Mage knowledge/language lists as illustrative builds, not universal compulsory
      skills.
