id: rule.character-creation.srcomp-shapeshifter-dual-nature
record_type: rule
status: source_reviewed
source: source.srcomp
printed_pages: '36'
pdf_pages: '37'
edition_scope: Shadowrun Third Edition optional Shadowrun Companion shapeshifter rules
content_class:
- rule_procedure
framing: reference_exact
headline: 'FASA Corporation Shadowrun Companion FASA7905a, SR3 original printed p36/PDF37: optional fictional shapeshifter dual nature, astral combat and projection mechanics.'
summary: Source-reviewed action timing and astral behavior, detection, ward interference, Masking exception and human-form-only magician projection.
data:
  publication:
    title: Shadowrun Companion
    publisher: FASA Corporation
    catalog: FASA7905a
    edition: Shadowrun Third Edition
    printed_page: 36
    pdf_page: 37
  scope: Optional shapeshifter player characters in this fictional tabletop role-playing game.
  dual_nature:
    occupies_physical_and_astral_planes_simultaneously: true
    astral_perception_action: Simple Action
    can_switch_off_astral_presence: false
    consequence: Shapeshifters remain susceptible to astral detection and attack; magical barriers such as wards block their movement.
  astral_appearance:
    form: Idealized image of the animal form even while physically in human form.
    recognition: A shapeshifter physically in human form can be recognized through astral perception unless an initiate capable of Masking conceals that appearance.
  astral_combat:
    default_attributes: The shapeshifter uses physical Attributes and Combat Pool when engaged in astral combat.
    exception: The default does not apply while astrally projecting.
  full_magician_projection:
    allowed_physical_form: human only
    astrally_projecting_attributes: Use the character's human-form Mental Attributes, as normal.
  lineage:
    relation: Optional character-type-specific exception, not a replacement for ordinary SR3 astral combat or projection rules.
