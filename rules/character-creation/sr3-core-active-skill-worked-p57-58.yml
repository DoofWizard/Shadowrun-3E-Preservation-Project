  rule_reuse:
    cost: Spend one Skill Point per rating point at or below the linked Attribute, two points per rating
      point above it.
    specialization_at_creation: Free initial specialization raises chosen specialization to original rating
      plus one and lowers its base skill to original rating minus one.
    canonical_existing_ids:
    - rule.character-creation.active-skill-purchase
    - rule.skills.specialization
