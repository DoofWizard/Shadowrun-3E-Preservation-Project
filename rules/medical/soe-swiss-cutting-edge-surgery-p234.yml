headline: FanPro Shadows of Europe (FanPro25002), Shadowrun Third Edition fictional rules — Swiss cutting-edge surgery regional modifiers
summary: Source-specific tabletop medical search, provider rating, exceptional equipment and skill, and price modifiers.
data:
  scope: Swiss legal and illicit bio-clinics in the fictional setting.
  access: Clinics tend to be permissive about identity and missing SIN; some refuse metahuman clients.
  experimental_options: GM may introduce experimental implants, technology or surgical techniques.
  medical_search:
    condition: Character consults knowledgeable Swiss or European contacts.
    modifier: -2
    reference: Man & Machine p143
  provider_base_rating:
    additive_modifier: 2
    reference: Man & Machine Medical Ratings Table p144
  exceptional_ratings: At GM discretion, equipment ratings and doctor skill levels may exceed 6.
  cost: GM encouraged to increase procedure costs by 10 percent or more.
  reuse: Apply existing medical search, provider-rating and surgical-cost procedures; do not replace their general rules.
