headline: FASA7126 Stress Test — dice, thresholds and modifiers
summary: FASA7126 Man & Machine, FASA Corporation (1999), Shadowrun Third Edition tabletop RPG, printed p126/PDF127.
effective: {status: current, source: source.mm, page: 126, basis: defines}
scope:
  applies_to: [implant or Attribute Stress]
resolution:
  summary: An implant or Attribute receiving Stress requires a Stress Test; one success prevents failure, except that Deadly Stress automatically causes failure.
  inputs: [current Stress Points, implant grade or unaugmented Attribute, applicable modifiers]
  outputs: [continued function or failure]
  steps:
    - Select dice from the Stress Dice Table.
    - Start with the current Stress Point total as target number and apply the applicable modifiers.
    - Roll the test; zero successes causes failure.
data:
  stress_levels: {Light: '1-2', Moderate: '3-5', Serious: '6-9', Deadly: '10+'}
  automatic_failure: 10
  dice:
    cyberware: {basic: 1, alpha: 2, beta: 3, delta: 5}
    bioware: {cosmetic: 1, basic: 2, cultured: 4}
    attribute: unaugmented Attribute / 2
  target_number_modifiers:
    cyberlimb_integrity: subtract Integrity Rating
    attribute_boosted_by_bioware: add boost value
  used_implants: Use the equivalent grade's dice.
  surgery_options: Fragile and Rugged affect test dice as specified on p148.
  extreme_conditions: The gamemaster may require a test even without new Stress when the implant or Attribute is subjected to extreme conditions.
