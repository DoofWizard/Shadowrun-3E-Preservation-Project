headline: FASA7126 Scarring — Body test, modifiers and scar categories
summary: FASA7126 Man & Machine, FASA Corporation (1999), Shadowrun Third Edition tabletop game rules, printed pp132-133/PDF133-134.
effective: {status: current, source: source.mm, page: 132, basis: extends}
scope:
  applies_to: [characters healing Serious or Deadly Physical wounds]
resolution:
  summary: Once the wound heals, a Body Test against the number of damage boxes taken, with the listed modifiers, determines the fictional scar category.
  inputs: [Body, damage boxes taken, healing conditions, modifiers]
  outputs: [scar category, applicable removal or social effects]
  steps: []
data:
  test: Body
  base_target_number: number of boxes of damage taken
  modifiers:
    hospital_or_clinic: -4
    bad_healing_conditions: 2
    terrible_healing_conditions: 4
    magical_healing_half_or_more_damage: -4
    magical_healing_less_than_half_damage: -2
    dermal_plating: 3
    dermal_sheath: 2
    fire_or_acid_damage: 4
  successes_to_scar:
    '0': grotesque
    '1-2': conspicuous
    '3-4': romantic
    '5+': no visible scar
  removal:
    conspicuous_or_romantic: simple cosmetic surgery
    grotesque: moderate cosmetic surgery
    cross_reference: M&M p146
  nanosurgery: wounds healed through nanosurgery leave no scars; see M&M p150
  social_interactions: GM may adjust social tests based on scar location, visibility and the other character's response, for example a +1 penalty or a bonus to Intimidation or negotiation.
