id: rule.damage.attribute-damage
record_type: rule
name: Attribute Damage and Failure
domain: damage
status: ingested
source: source.mm
printed_pages: '129-131'
pdf_pages: '130-132'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7126 Attribute Damage — failure tables, permanent damage and Stress repair
summary: FASA7126 Man & Machine, FASA Corporation (1999), Shadowrun Third Edition tabletop game rules, printed pp129-131/PDF130-132.
effective: {status: current, source: source.mm, page: 129, basis: extends}
scope:
  applies_to: [organic wound effects and Attribute Stress or failure]
resolution:
  summary: The source adds Stress and Attribute failure effects to the ordinary SR3 Condition Monitor and permanent damage rules.
  inputs: [wound effect, affected Attribute, Stress, Body Test, die results, healing conditions]
  outputs: [Attribute Stress, temporary Attribute or linked skill impairment, permanent damage modifier, repair outcome]
  steps: []
data:
  organic_wound_effect:
    attribute_selection_die: 1D6
    organic_damage_table:
      '1': Body
      '2': Strength
      '3': Quickness
      '4': Intelligence
      '5': Willpower
      '6': Reaction
    stress_points: '1D6 / 2'
    stress_test: required
    wound_related_attribute_damage: always requires doctor care to heal
  attribute_failure:
    result: temporary Attribute reduction or impairment of the Attribute and linked skills
    table_use: GM may choose to roll 1D6 for an impaired Attribute
    target_number_modifier_applies_to: [Attribute Success Tests, use of linked skills]
    failure_table:
      '1': {attribute_reduction: 0, target_number_modifier: 1}
      '2': {attribute_reduction: 1, target_number_modifier: 1}
      '3': {attribute_reduction: 1, target_number_modifier: 2}
      '4': {attribute_reduction: 2, target_number_modifier: 2}
      '5': {attribute_value: 'floor(value / 2)', target_number_modifier: 2}
      '6': {attribute_value: 'floor(value / 2)', target_number_modifier: 3}
    reduced_to_zero: character is bedridden until the Attribute is healed and cannot use it or linked skills
  deadly_wounds_and_permanent_damage:
    core_rule: SR3 p127 remains in effect
    condition: Body Test for permanent damage after a Deadly wound
    additional_target_number: highest current Stress Point total on any Attribute
  attribute_stress_repair:
    general_attribute_stress: may heal naturally; complications may require medical care
    method: use the bioware Stress healing and magical healing rules
    failed_attribute: must be repaired before healing
    minimum_stress: 0
    permanent_stress: therapeutic surgery required to restore Attribute function; see M&M p147
links:
  uses: [rule.damage.stress-points, rule.damage.stress-test, procedure.damage.bioware-stress-repair]
  affects: [rule.attributes.attribute-ratings]
  modified_by: []
  interacts_with: []
sources:
  - {source: source.mm, pages: '129-130', relation: extends, note: Attribute Damage, Attribute Failure, Organic Damage Table, Attribute Failure Table and Deadly Wounds}
  - {source: source.mm, page: 131, relation: extends, note: Attribute Stress Repair}
notes:
  - The general natural-healing allowance does not erase the specific doctor-care requirement for Attribute damage resulting from organic wound effects.
