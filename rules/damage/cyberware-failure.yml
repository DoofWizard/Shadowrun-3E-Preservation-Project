  structural_exception: Primarily structural or physiological modifications do not lose performance from damage in the ordinary manner; their failure instead requires medical repair and maintenance.
  all_tn_modifier_cause: feedback or discomfort
  repair: Stress repair is covered on p130; failed cyberware repair requires Implant Surgery under p146.
