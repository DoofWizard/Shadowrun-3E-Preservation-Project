headline: FASA7126 Bioware Damage and Failure — slot and cumulative Stress rules
summary: FASA7126 Man & Machine, FASA Corporation (1999), Shadowrun Third Edition tabletop RPG, printed p128/PDF129.
effective: {status: current, source: source.mm, page: 128, basis: defines}
scope:
  applies_to: [wound effects classified as bioware damage]
resolution:
  summary: Use the cybersystem damage procedure with Bio Index instead of Essence; damaged bioware has cumulative item-specific Stress effects.
  inputs: [wound effect, Bio Index slot assignment, bioware item]
  outputs: [affected bioware, Stress-level effects, possible failure]
  steps: []
data:
  trigger_roll: '3-4'
  bio_index_slots:
    count: 6
    method: Substitute Bio Index slots for Essence slots in the cybersystem damage procedure.
    excess_bioware: Double up slots if the character has more bioware than available slots.
  stress_points: 1D6 / 2
  stress_test_required: true
  stress_effects: Item-specific negative effects apply at their listed Stress Level and accumulate with all effects of lower levels.
  failed_stress_test: Treat the implant as having Deadly Stress; it has failed and the character suffers the listed Deadly Stress effects.
  repair: Stress repair uses p130; failed bioware requires Therapeutic Surgery on p147.
