headline: FASA7126 Man & Machine — Called Shots and Deadlier Over-Damage with Wound Effects
summary: Published fictional Shadowrun Third Edition tabletop game rules from FASA Corporation (1999), Man & Machine, printed p134/PDF135; conditional interactions with the core combat options.
