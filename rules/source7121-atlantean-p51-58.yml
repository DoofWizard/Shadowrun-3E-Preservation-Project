atlantean_foundation:
  source_period_profile:
    - "Publicly resembles the National Geographic Society while maintaining major magical-research facilities, archives and a collection of magical artifacts."
    - "The source leaves the foundation's ultimate motives to the gamemaster."
  item_interest_guidance:
    - "In some campaigns a Force 5 item may be powerful enough to attract the foundation's interest."
    - "In other campaigns only items with double-digit Force Ratings attract its interest."

immortal_elves:
  known_population: "Less than 25 immortal elves are known to exist."
  birth_note: "No immortal elves have been born since the Awakening."
  gene_note:
    - "Immortality is described as a gene triggered by the rise of the world's mana level."
    - "The gene may lie dormant, so additional 'unawakened' immortal elves may exist."
  campaign_rule:
    - "Immortals do not need to follow the standard rules because their knowledge goes back a long way and they can manipulate mana unusually."
    - "Start all immortal characters with Threat Ratings of 10 or higher."

mystic_crusaders:
  composition: "Mages, shamans, riggers, deckers and other warrior-society members aligned with the Atlantean Foundation."
  threat_rating: "All Crusaders have Threat Ratings of 5 or higher."
  other_statistics: "Use any appropriate Shadowrun Contact or archetype."

