resolution:
  summary: "Cybermantic characters periodically test Willpower for chronic dissociation syndrome at intervals and target numbers based on negative Essence. Onset causes severe penalties to perception and other tests and prevents initiating actions. Specialized magical treatment at a delta clinic may reverse the syndrome, but repeated treatment becomes progressively harder."
