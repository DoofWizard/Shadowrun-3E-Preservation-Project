scope:
  applies_to: ["cybermantic characters using Observe in Detail"]
resolution:
  summary: "A cybermantic character can become absorbed in minor details after an unsuccessful Observe in Detail attempt. A Willpower test is required to break the cycle, and other characters may assist by attracting the subject's attention."
  inputs: ["Perception Test result", "Willpower"]
  outputs: ["normal attention or fixation"]
