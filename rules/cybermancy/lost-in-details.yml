headline: Cybermantic Observation Fixation and Recovery
summary: FASA7126 Man & Machine, FASA Corporation (1999), Shadowrun Third Edition fictional tabletop rules, printed p58/PDF59.
effective: {status: current, source: source.mm, page: 58, basis: defines}
scope:
  applies_to: [cybermantic characters using Observe in Detail]
resolution:
  summary: The fictional rules model a fixation that can occur after a failed observation test and end through Willpower or assistance.
  inputs: [Perception Test result, modified target number, Willpower]
  outputs: [normal attention or fixation]
  steps:
    - When Observe in Detail is used and all Perception dice fail at a modified target number of at least 5, immediately roll Willpower against that modified target number.
    - Failure leaves the character fixated. Repeat the Willpower Test each subsequent Combat Turn or once per minute outside combat, increasing the target number by 1 each repetition.
    - After five consecutive failed tests, the invoked-memory stimulator activates and the target number decreases by 1 per Combat Turn or minute, as appropriate.
    - Other characters may attempt to attract the subject's attention; each attempt reduces the Willpower target number by 1.
