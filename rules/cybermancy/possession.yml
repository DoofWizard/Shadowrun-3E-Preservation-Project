id: rule.cybermancy.possession
record_type: rule
name: "Cyberzombie Possession"
domain: cybermancy
status: ingested
effective: {status: current, source: source.mm, page: 57, basis: defines}
scope:
  applies_to: ["spirits or initiates attempting to possess a cybermantic subject"]
resolution:
  summary: "The magical binding that anchors a cybermantic subject also traps a possessing astral form. The possessing entity may attempt to break free with a Complex Action and an opposed Willpower/Force-style test using the source's Essence-based target number; failed attempts leave it trapped. A possessing entity also faces additional resistance when trying to control the body."
  inputs: ["subject negative Essence", "possessor Willpower or Force", "Spirit Energy or initiate grade"]
  outputs: ["possessor escapes, remains trapped, or controls the body"]
  steps: []
