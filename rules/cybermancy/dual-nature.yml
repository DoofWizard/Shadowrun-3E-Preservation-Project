effective: {status: current, source: source.mm, page: 57, basis: defines}
scope:
  applies_to: [cybermantic characters]
resolution:
  summary: Cybermantic characters are permanently present on the physical and astral planes but lack the innate astral perception of Awakened characters.
  inputs: [Aura Reading or Intelligence]
  outputs: [astral perception and vulnerability]
  steps:
    - A cybermantic character may acquire the Aura Reading Active Skill despite the normal Awakened-only restriction.
    - Use Aura Reading instead of Intelligence for astral perception; the skill functions as a standard skill rather than a complementary skill. Without the skill, default to Intelligence for Astral Perception Tests.
    - Apply standard astral combat rules when the cybermantic character defends against an astral attack.
