resolution:
  summary: "Cybermantic characters are permanently dual-natured and exist on the physical and astral planes simultaneously. They are vulnerable to astral attack. To astrally perceive they use Aura Reading as a standard skill, defaulting to Intelligence if they lack it; standard astral-combat rules apply when they are attacked."
