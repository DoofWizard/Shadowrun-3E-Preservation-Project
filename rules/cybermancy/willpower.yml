effective: {status: current, source: source.mm, page: 58, basis: defines}
scope:
  applies_to: [cybermantic characters]
resolution:
  summary: The fictional cybermancy rules reduce Willpower for negative Essence, then restore part of the loss through the cybermantic process.
  inputs: [negative Essence, pre-cybermancy Willpower]
  outputs: [effective Willpower]
  steps:
    - Reduce Willpower by 1 for each half point or fraction of a half point of negative Essence.
    - Restore up to 4 points of this lost Willpower, without exceeding the pre-cybermancy rating.
data:
  willpower_loss: 'ceil(abs(negative Essence) / 0.5)'
  maximum_restoration: 4
  restoration_cap: pre-cybermancy Willpower
  example_essence: -0.75
  example_loss_before_restoration: 2
  immune_to_magic_increasing_willpower: true
  cybermantic_restoration_can_be_dispelled_or_broken: false
