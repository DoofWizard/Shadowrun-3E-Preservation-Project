headline: Cybermantic Social Modifiers and Karma Gain
summary: FASA7126 Man & Machine, FASA Corporation (1999), Shadowrun Third Edition fictional tabletop rules, printed p58/PDF59.
effective: {status: current, source: source.mm, page: 58, basis: defines}
scope:
  applies_to: [cybermantic characters]
resolution:
  summary: The fictional rules impose social modifiers and a reduced Karma gain rate on characters with negative Essence.
  inputs: [negative Essence, social test type]
  outputs: [social-test modifier, Karma award rate]
  steps:
    - Apply the ordinary cyberware social-interaction penalty, which gives a sub-zero Essence character a modifier of +3.
    - Add the absolute Essence value as a Charisma and Charisma-linked skill modifier, rounding fractions up. For Essence below -2, double the penalty for the amount below -2.
    - Apply these modifiers as a bonus instead for Intimidation or Interrogation Open Tests.
data:
  ordinary_modifier_at_subzero_essence: 3
  additional_modifier_basis: absolute Essence value rounded up
  increased_penalty_threshold_essence: -2
  multiplier_for_amount_below_threshold: 2
  emotional_bond_exception: Penalties still apply to prior close relationships; GM may increase them in such circumstances.
  magical_compensation_permitted: false
  karma_gain_multiplier: 0.5
  example:
    essence: -3
    ordinary_modifier: 3
    first_two_negative_essence_modifier: 2
    remaining_negative_essence_modifier: 2
    total_modifier: 7
    intimidation_or_interrogation_open_test_bonus: 7
