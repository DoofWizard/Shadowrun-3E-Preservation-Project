headline: FanPro10667 SR3 fictional tabletop institutional access and magical schooling, pp55-57/PDF56-58
summary: Published school-entry qualifications, usual magical screening and placement, and typical education pathways, with source-attributed exceptions.
data:
  narrator: In-world publication Livewire
  school_access_p55:
    corporate_school: Admission restricted to corporate affiliates, with rare specially selected exceptions.
    private_school: Almost always requires demonstrated academic or athletic aptitude as well as high tuition.
    qualification: Both school types are described as expensive and selective.
    attributed_exceptions:
      Prepster: Admission standards may be relaxed for children of wealthy alumni.
      Bung: Human identity is often expected in practice.
      Blade: Religious schools may admit students of other faiths; financial status is not the sole admission criterion at all private schools.
  public_school_p56:
    attributed_sin_exception: Brick reports that public schools generally scrutinize student SINs only lightly unless the government objects.
  magical_screening_p56:
    typical_frequency: Annual testing for magical potential is sponsored by most schools.
    positive_screen: Students with a positive result receive an opportunity for magical instruction.
    placement: Full mages, shamans and adepts usually attend dedicated magic schools instead of regular classes; students with lesser magical talent receive supplemental instruction alongside ordinary schooling.
    attributed_qualification: Cleo disputes access for SINless children in the Barrens; Magister says poorer schools have difficulty funding proper screening but identified talent receives funded education in that account; Cobalt Blue reports that such children often enter corporate magic programs.
  higher_education_p56_57:
    scholarship: Academic or athletic promise may qualify for partial or full college tuition scholarships.
    corporate_employee_children: Financial assistance is available for children of corporate employees.
    trade_school_typical_duration: Two years or less; many offer night classes.
    attributed_corporate_aid_condition: Ranger claims corporate assistance requires a commitment to the corporation and selection of a corporation-approved school.
  scope: Fictional institutional access and descriptive education patterns, not a guaranteed admission, skill award, mandatory training duration or new test. The source supplies no numeric aptitude threshold, screening target number or tuition amount.
  reuse: [rule.ssg-sin-citizenship-status-p37, rule.training.srcomp-optional-skill-attribute-training]
