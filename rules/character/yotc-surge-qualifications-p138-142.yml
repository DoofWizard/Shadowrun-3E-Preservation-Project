data:
  publication: {title: Year of the Comet, publisher: FanPro, catalog_number: FanPro10650, edition: Shadowrun Third Edition}
  supplements: rule.character.yotc-surge
  p138:
    existing_characters: The gamemaster can exclude or require SURGE for all existing player characters instead of using the recommended random determination.
    new_character_timing: The new character options are offered at gamemaster discretion in a campaign set after September 2061.
    severity_reroll: The five Good Karma reroll option requires gamemaster permission.
  p139:
    incompatible_effect: Reroll or choose a different effect if the character cannot acquire the selected effect.
    bio_rejection: Nanoware is expressly exempt from the rejection of cyberware; nano-implants are not exempt.
    chronic_osteocuspus: Removed or trimmed bone growth returns during the two-week pain period.
  p140:
    cyclops: The replacement eye retains the natural visual abilities of the former eyes.
    third_eye: Depth perception remains possible with one eye closed.
  p141:
    feline_eyes: The zero-point exception applies to any character losing natural thermographic vision, not specifically to shapeshifters.
    goblinization: A character already metahuman may change only into a metavariant of their own species; humans may become orks or trolls.
    long_tail: The tail is not consciously controllable.
  p142:
    natural_venom: The fictional character is completely immune to their own natural toxin.
    prehensile_tail: Cannot perform fine manipulation because it has no digits.
framing: reference_exact
headline: Year of the Comet SURGE eligibility and effect qualifications
summary: Source-specific corrections and omitted conditions supplement the existing SURGE rule record.
