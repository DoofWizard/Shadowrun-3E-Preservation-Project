  negative_3d6:
    3: "Chronic Osteocuspus"
    4: "Bio-Rejection"
    5: "Cyclops"
    6: "Third Eye"
    7: "Critter Spook"
    8: "Tusks"
    9: "Altered Skin Coloration"
    10: "Unusual Hair"
    11: "Altered Eye Color"
    12: "Choose a Flaw as a Negative Effect, or create one"
    13: "Pointed Ears"
    14: "1D6: 1-3 Feathers; 4-6 Scales"
    15: "Vestigial Tail"
    16: "Slow Healer"
    17: "Astral Hazing"
    18: "Dual Natured"

social_interaction:
  default: "+1 modifier to Charisma and Charisma-linked skill tests made by a changeling"
  gm_adjustment: "May be increased for especially conspicuous/frightening expressions."
  sympathetic_audience: "May be waived or become -1 when interacting with changeling fans or accepting SURGE subcultures."

npc_use:
  rule: "NPCs may undergo SURGE using the same determination rules as player characters."

sources:
  - {source: source.fanpro-10650, printed_page: 138, pdf_page: 139, relation: defines, note: "SURGE Test, target-number modifiers and severity"}
  - {source: source.fanpro-10650, printed_pages: "139-143", pdf_pages: "140-144", relation: defines, note: "SURGE effects, random tables, social interaction and custom effects"}

notes:
  - "This record defines Year of the Comet SURGE mechanics and does not infer supersession over any later treatment."
  - "Printed pp.134-137 / PDF pp.135-138 contain Game Information framing and campaign/probe-race guidance but no additional standalone numeric rule procedure identified in this slice."
