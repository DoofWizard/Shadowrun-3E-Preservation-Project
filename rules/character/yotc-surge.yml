id: rule.character.yotc-surge
record_type: rule
status: reviewed
source: source.fanpro-10650
printed_pages: '138-143'
pdf_pages: '139-144'
edition_scope: SR3
content_class: [rule_exact]
data:
  publication: {title: Year of the Comet, publisher: FanPro, catalog_number: FanPro10650, edition: Shadowrun Third Edition}
  name: Year of the Comet SURGE Character Rules
  domain: character
  effective: {status: optional, basis: defines}
  eligibility:
    likelihood_guidance: Mundane humans without implants have about a 15 percent chance; other types are less likely.
    existing_characters: GM may exclude all player characters, require all to change, or use the recommended random test. GM determines timing and onset, which can be delayed for months or occur gradually over days or weeks.
    surge_test:
      test: Essence (12) Test
      karma_allowed: false
      exclusions: [variable Essence, cyberzombies, Essence 0 or less]
      partial_essence: Round Essence up before testing.
      target_number_modifiers: {awakened: '+(Magic rating / 2, round up)', metahuman_standard: '+2', metahuman_variant: '+3', albino: '+4', otaku: '+4', infected_hmhvv: '+5', shapeshifter: '+6'}
    new_characters:
      eligibility: GM discretion for new characters in games set after September 2061.
      options: [Normal SURGE Test, Purchase Positive and Negative Effects as Edges and Flaws]
      changeling_build_point_fee: 5
      restriction: The purchase option requires payment of the fee before taking any effects.
  severity:
    trigger: At least one SURGE Test success.
    negative_effect_points: {roll: 1D6, modifier: '+2 per success after the first'}
    positive_effect_points: {roll: 1D6, modifier: '+2 per success after the first'}
    reroll: {cost_good_karma: 5, scope: Either severity roll, permission: GM discretion, finality: Second result must be used}
  effect_framework:
    categories: [positive, negative]
    balancing: Positive and negative point totals need not cancel.
    assignment: GM may permit selection or require random determination.
    incompatible_effect: Reroll or choose another effect when the selected effect cannot apply.
    custom_effects: Player and GM may create effects with final GM approval and balance against published effects and SRComp Edges and Flaws.
  negative_effects:
    - {name: Altered Eye Color, value: -1, mechanics: 'No vision change; incompatible with cybereyes, bioware cat eyes and Feline Eyes.'}
    - {name: Altered Skin Coloration, value: '-1 or -2', mechanics: 'Value depends on visibility and social effects; incompatible with dermal sheathing, chloroplast skin and bioware skin pigmentation.'}
    - {name: Astral Hazing, value: -5, mechanics: 'Unavailable to Awakened. After more than one hour in one place background count becomes 1, can grow to half Essence rounded down (minimum 1), affects both planes, fades about an hour after departure.'}
    - {name: Bio-Rejection, value: '-5; -2 for Awakened', mechanics: 'Rejects cyberware including nano-implants but excluding nanoware, and non-cultured bioware. Existing implants cause illness progressing to incapacitation in Body days; without hospitalization and implant removal within Body x 2 days the character dies.'}
    - {name: Chronic Osteocuspus, value: -10, mechanics: 'Acclimation (10 - Willpower) weeks, +4 to all actions. GM may reduce pain modifier through pain-control effects and may lengthen acclimation. Ordinary armor and restrictive clothing unusable; specially designed armor and clothes cost 150% of base. Thereafter Pain Resistance level 3, free Slow Healer and +1 unarmed Power. Removed or trimmed growth returns over two weeks at +2 to all actions. Incompatible with dermal sheathing.'}
    - {name: Critter Spook, value: -1, mechanics: 'Nearby animals and paranormal critters react with fear or hostility; +2 to attempts to control, soothe or pacify; in combat they prefer this character as first target.'}
    - {name: Cyclops, value: -4, mechanics: 'Existing eyes wither and cybereyes are purged; one natural replacement eye retains former natural vision modes. +2 target number for ranged attacks due to lost depth perception.'}
    - {name: Dual Natured, value: '-10; -5 for Awakened', mechanics: 'Permanently dual natured; affects and is affected by astral objects/forms; vulnerable to possession and astral attacks, may defend using normal astral combat; may learn Aura Reading. Awakened characters may project and resume dual nature on return.'}
    - {name: Feathers, value: '-1 or -2', mechanics: 'No protective value; cost depends on visibility and social impact.'}
    - {name: Pointed Ears, value: -1, mechanics: 'Human only; may pass as elf, but elf NPCs discovering the deception may react with hostility.'}
    - {name: Scales, value: '-1 or -2', mechanics: 'No protective value; cost depends on visibility and social impact; incompatible with dermal sheathing.'}
    - {name: Slow Healer, value: -2, mechanics: '+2 modifier to all Healing Tests made by the character.'}
    - {name: Third Eye, value: -2, mechanics: 'No visual modifier; depth perception remains with one eye closed. Perception (4) can reveal the third eye when closed.'}
    - {name: Tusks, value: -1, mechanics: 'Slight speech impediment; unavailable to orks and trolls.'}
    - {name: Unusual Hair, value: '-1 or -2', mechanics: 'Cost depends on visibility and social impact; incompatible with Feathers.'}
    - {name: Vestigial Tail, value: -1, mechanics: 'No balance bonus; limited voluntary wagging; clothing must be tailored and certain sustained sitting positions are uncomfortable.'}
    - name: SRComp Flaws as Negative Effects
      values: {Allergy: '-2 to -5', Color Blind: -1, Low Pain Tolerance: -4, Night Blindness: '-2/-1', Weak Immune System: -1, Sensitive Neural Structure: '-2/-4', Simsense Vertigo: '-2/-4', Astral Impressions: -2, Spirit Bane: -2}
  positive_effects:
    - {name: Astral Sight, value: 6, mechanics: 'Not available to already Awakened characters including adepts. Limited Awakening with Magic 1; permits astral perception, Aura Reading and Enchanting; no astral projection or other magical skills or abilities.'}
    - {name: Claws or Talons, value: 2, mechanics: 'Unarmed Combat, (STR + 1)L damage; incompatible with handrazor cyberware.'}
    - {name: Dermal Deposits, value: 2, mechanics: '+1 Body for Damage Resistance Tests; cumulative with troll natural dermal armor or dermal plating.'}
    - {name: Fangs, value: 2, mechanics: 'Unarmed Combat, -1 Reach, (STR + 1)L damage.'}
    - {name: Feline Eyes, value: 2, mechanics: 'Natural low-light vision. If the character previously had natural thermographic vision, it is lost and the effect has value 0. Incompatible with cybereyes and bioware cat eyes.'}
    - {name: Gills, value: 4, mechanics: 'Reflexive switching between lungs and gills; OXSYS cybergill benefits without cyber upkeep; incompatible with OXSYS cybergill cyberware.'}
    - {name: Goblinization, value: 10, mechanics: 'Humans may change only into orks or trolls; other metahumans may change only into a metavariant of their own species. Replace racial modifiers; GM may assign Stress or failure to implants affected by transformation. Strict GM control recommended.'}
    - {name: High Frequency Hearing, value: 2, mechanics: 'Natural high-frequency hearing; incompatible with cyberears or high-frequency hearing modifications.'}
    - {name: Horns, value: 2, mechanics: 'Unarmed Combat, -1 Reach, (STR)M damage.'}
    - {name: Improved Scent, value: 2, mechanics: 'As the corresponding adept power; unavailable to adepts with that power.'}
    - {name: Improved Taste, value: 2, mechanics: 'As the corresponding adept power; unavailable to adepts with that power.'}
    - {name: Long Tail, value: 2, mechanics: 'At least 1 m but less than 2 m; involuntary movement; -2 target number to balance, climbing, jumping, falling, Knockdown and similar tests; cumulative -3 with balance augmentation earware. Requires adjusted clothing and makes certain prolonged sitting positions uncomfortable.'}
    - {name: Low Frequency Hearing, value: 2, mechanics: 'Natural low-frequency hearing; incompatible with cyberears or low-frequency hearing modifications.'}
    - {name: Marsupial Pouch, value: 2, mechanics: 'May hold items with Concealability 6 or higher; adds +4 Concealability when carried.'}
    - name: Natural Venom
      value_by_vector: {ingestion: 2, injection: 4, inhalation: 6, contact: 8}
      mechanics: 'Fictional toxin is harmless to its originating character. Power equals unaugmented Body, Damage Level M, Speed Immediate, maximum daily doses equal Essence. In-game vector modes: ingestion uses swallowed saliva or mucus; injection uses saliva or mucus entering the bloodstream; inhalation uses the exhalation-spray procedure; contact can use the weapon coating or spit-attack game options. The spray and spit rules are referenced to Man and Machine p65. GM may assign stronger or different compound-like effects and raise point cost accordingly.'
    - {name: Prehensile Tail, value: 5, mechanics: 'As Long Tail but consciously controlled; can pick up objects, cannot perform fine manipulation or pull triggers. +2 to attempts to use objects; effective Strength half unaugmented Strength rounded down; supports full body weight when hanging; no additional attack.'}
    - {name: Resistance to Disease, value: '1, 3 or 5', mechanics: 'Each level gives one additional die on Body Tests resisting disease; compatible with implant, magic and dwarf resistance bonuses.'}
    - {name: Resistance to Poisons, value: '1, 3 or 5', mechanics: 'Each level gives one additional die on Body Tests resisting toxins; compatible with implant, magic and dwarf resistance bonuses.'}
    - {name: Retractable Claws, value: 3, mechanics: 'As Claws or Talons with retractability; incompatible with handrazors.'}
    - {name: Satyr Legs, value: 6, mechanics: '+1 running multiplier, +2 kicking attack Power, +1 die to jumping Athletics Tests; incompatible with cyberlegs.'}
    - {name: Thermographic Vision, value: '2; 1 for Decker and Rigger characters', mechanics: 'Natural thermographic vision as dwarfs and trolls.'}
    - name: SRComp Edges as Positive Effects
      values: {Exceptional Attribute: 2, Adrenaline Surge: 2, Double Jointed: 1, High Pain Tolerance: '2 per box', Lightning Reflexes: '2/4/6', Natural Immunity: '1/3', Night Vision: '2/1', Quick Healer: 2, Toughness: 3, Will to Live: '1/2/3', Perfect Time: 1, Photographic Memory: 3, Sense of Direction: 1, Animal Empathy: 2, Astral Chameleon: 2, Magic Resistance: '1 to 4', Poor Link: 2, Spirit Affinity: 2}
  random_effect_tables:
    positive_3d6:
      '3': Goblinization
      '4': Satyr Legs
      '5': '1D6: 1-3 Retractable Claws; 4-6 Marsupial Pouch'
      '6': Dermal Deposits
      '7': '1D6: 1-3 Resistance to Disease; 4-6 Resistance to Poisons'
      '8': '1D6: 1-3 Claws; 4-6 Talons'
      '9': Choose or create an Edge as a Positive Effect
      '10': Thermographic Vision
      '11': '1D6: 1-3 Fangs; 4-6 Horns'
      '12': '1D6: 1-3 High Frequency Hearing; 4-6 Low Frequency Hearing'
      '13': '1D6: 1-3 Improved Scent; 4-6 Improved Taste'
      '14': Feline Eyes
      '15': Natural Venom
      '16': Prehensile Tail
      '17': Gills
      '18': Astral Sight
    negative_3d6:
      '3': Chronic Osteocuspus
      '4': Bio-Rejection
      '5': Cyclops
      '6': Third Eye
      '7': Critter Spook
      '8': Tusks
      '9': Altered Skin Coloration
      '10': Unusual Hair
      '11': Altered Eye Color
      '12': Choose or create a Flaw as a Negative Effect
      '13': Pointed Ears
      '14': '1D6: 1-3 Feathers; 4-6 Scales'
      '15': Vestigial Tail
      '16': Slow Healer
      '17': Astral Hazing
      '18': Dual Natured
  social_interaction: {default: '+1 modifier to Charisma and Charisma-linked Skill Tests made by a changeling', gm_adjustment: May be increased for especially conspicuous or frightening expressions, sympathetic_audience: May be waived in accepting contexts or become -1 with changeling fans}
  npc_use: GM may use the same determination rules for NPCs.
  sources:
    - {source: source.fanpro-10650, printed_page: 138, pdf_page: 139, relation: defines}
    - {source: source.fanpro-10650, printed_pages: '139-143', pdf_pages: '140-144', relation: defines}
  precedence:
    supplements_reconciled: rule.character.yotc-surge-qualifications-p138-142
    corrected_legacy_fields: [Feline Eyes zero-point eligibility, Goblinization same-species limit, Bio-Rejection nanoware exception, GM discretion and incompatible effects, Cyclops vision, Third Eye depth, Chronic Osteocuspus regrowth, Long Tail involuntary movement, Prehensile Tail fine manipulation, Natural Venom immunity]
    note: These source-specific corrections replace conflicting legacy wording without asserting later-edition supersession.
framing: reference_exact
headline: Year of the Comet SURGE test, effects and eligibility
summary: Reconciles legacy effect eligibility and qualifications with the original six-page mechanical section and accepted supplement.
