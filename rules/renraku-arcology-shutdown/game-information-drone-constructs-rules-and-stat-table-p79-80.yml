  "data": {
    "published_source": "Renraku Arcology: Shutdown, FASA Corporation, FASA7328, 1998, original Shadowrun Third Edition-compatible printed pp79-80/PDF80-81; Rigger 2 references preserved.",
    "gm_status": "The gamebook says Deus's constructs are autonomously controlled robotic drones with highly variable characteristics; the GM may improvise unique models, while the table supplies typical values, not immutable claims about every drone.",
    "network_placement": "The source gives a 50% chance that a drone is affiliated with one of Deus's subscriber RC networks at any given time. Bumblebees, Dolls and Spiders generally use Green networks; Dervishes, Mantas and Medusae use drone networks.",
    "construction_and_stats": "These drones use custom smart materials and arrangements, may include higher speed/carrying capacity, RC interfaces, enhanced Pilot systems; the book says do not apply ordinary Rigger 2 construction rules as if all were ordinary vehicles.",
    "drone_tests": {
      "normal_skill": "Where a rigger does not directly control the construct, use its Pilot Rating in lieu of a rigger skill or other character Attribute for actions.",
      "sensor": "Make Sensor Test with Sensor Rating dice versus Signature in place of Perception Test (Rigger 2 p28). Metahumans generally have Signature 6; trolls 5.",
      "learning_pool": "Add Learning Pool dice to a Success Test as a character adds Combat Pool or Task Pool.",
      "robot_pool": "Use Robot Pool to augment any drone action; it refreshes like other pools. Source compares it to knowbot-directed advantages, including implanted BattleTac IVIS (Rigger 2 p67).",
      "autosofts": "Clearsight autosoft adds dice to Pilot Rating for Sensor Tests, Sharpshooter for Gunnery; expert autosoft dice can be used in tests involving Pilot Rating but are not pool dice.",
      "attacks": "Constructs use Pilot Rating augmented by autosofts plus Learning/Robot Pool dice.",
      "armor_damage": "Physical attack Power after reduction for armor: if modified Power is less than or equal to armor, no effect; otherwise subtract armor and reduce damage level by one, per SR3 p149.",
      "spells": "Spells affecting only living targets do not affect constructs. The source sets Object Resistance 10; for physical spells target number 10 plus the construct's Body Rating; machines make no Resistance Test (SR3 p150).",
      "ranged_indirect_fire": "Dervish, Manta and Medusa are described as having BattleTac FDDM modules for indirect fire, cf. Rigger 2 p98."
    },
    "self_destruct": "Constructs may be programmed to destroy themselves if captured or if they wander too far from arcology walls. Explosion Power equals Body squared, then subtract any armor and 1 per meter distance; Damage Level S. This is a fictional tabletop damage formula, not real explosives advice.",
