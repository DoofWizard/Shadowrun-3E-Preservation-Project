    "transfiguration": "For each band obtained, an otaku receives +1 to one of MPCP, Hardening, Body, Evasion, Masking, or Sensor rating; OR +100 MP I/O Speed; OR +1 Matrix Reaction. Further bands may be spent increasing the same rating repeatedly (the book's example increases Evasion by +2 across two bands).",
    "blues_greens": "Blues are combat-oriented Banded who use varying armor/weapons selected by the gamemaster for the mission. Greens perform arcology administration, sustain operations and supervise captive populations and experiments; for a Green NPC the GM chooses an existing appropriate contact or archetype and adds package cyberware/bioware."
