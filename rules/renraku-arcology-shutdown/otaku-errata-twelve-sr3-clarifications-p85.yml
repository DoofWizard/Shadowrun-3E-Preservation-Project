  "data": {
    "source_context": "FASA Corporation Renraku Arcology: Shutdown, FASA7328 (1998), printed p85/PDF86. The book states these twelve changes and clarifications supersede/add to Virtual Realities 2.0 pp142–148 to make otaku compatible with SR3.",
    "changes": [
      {
        "number": 1,
        "rule": "Otaku characters must assign Priority A to Resources and the lowest Priority to Magic."
      },
      {
        "number": 2,
        "rule": "Otaku Racial Modified Limits under SR3 p245 are increased by 1 for Mental Attributes and reduced by 1 for Physical Attributes; Attribute Maximums may also change."
      },
      {
        "number": 3,
        "rule": "Channel skills are linked to Willpower. Otaku cannot default from a Channel to anything else; Channels may specialize to mimic a specific utility."
      },
      {
        "number": 4,
        "rule": "Otaku need both a datajack and an ASIST converter to use the Matrix; see book pp82–83."
      },
      {
        "number": 5,
        "rule": "Hardening is a Living Persona rating, not a Complex Form. Hardening equals Willpower / 2, rounded up. It can only rise by raising Willpower; it cannot be purchased as a Complex Form."
      },
      {
        "number": 6,
        "rule": "Operational utilities as defined in Virtual Realities 2.0 p96 cannot be Complex Forms; Channel skill/specializations handle System Tests for Analyze, Browse, etc. Only offensive, defensive and special utilities can be Complex Forms."
      },
      {
        "number": 7,
        "rule": "Initial otaku Complex Forms do not require Karma. At creation, only one incomplete (programming-in-process) Complex Form is allowed under the basic rule."
      },
      {
        "number": 8,
        "rule": "Otaku automatically have sufficient Active Memory for all their Complex Forms. This 'unlimited' memory cannot be used for other purposes."
      },
      {
        "number": 9,
        "rule": "Otaku require some physical storage hardware such as headware memory or off-line storage to upload, download, or otherwise manipulate files."
      },
      {
        "number": 10,
        "optional": true,
        "rule": "At character creation, GMs may optionally provide a base Computer (Software Programming) Skill × 50 MP of Complex Forms in place of the single incomplete Complex Form; characters still make all required programming dice rolls."
      },
      {
        "number": 11,
        "optional": true,
        "rule": "GMs may optionally allow a free starting Armor Complex Form with rating equal to Willpower; or instead Sleaze equal to Intelligence, or Camo equal to Charisma."
      },
      {
        "number": 12,
        "optional": true,
        "rule": "To use satellite uplinks, GMs may optionally introduce a Satlink Interface hardware device costing 2,000¥. It does not depend on the otaku's MPCP, unlike a decker's satellite interface; the otaku need only fine-tune to the Matrix."
      }
    ],
    "precedence": "These are explicitly printed historical Shadowrun Third Edition corrections/additions, not inferred conversions or independently established contemporary rules."
  },
