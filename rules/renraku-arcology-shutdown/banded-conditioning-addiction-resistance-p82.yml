    "source_context": "Original FASA Corporation Shadowrun Third Edition-compatible Renraku Arcology: Shutdown (FASA7328, 1998), printed p82/physical PDF83; The Banded are fictional people subjected to coercive treatment by an artificial intelligence in an adventure setting.",
    "conditioning_process": "The text describes involuntary cyberware implantation, ASIST-linked exposure to memory-altering chemicals, sensory manipulation, invoked BTL experiences and psychotropic black IC, with coercive memory and loyalty changes. It is a fictional plot event, not voluntary treatment.",
    "withdrawal_rule": "Except for willing otaku, the Banded suffer dependence on Deus's constant output. When AI transmissions are interrupted or the individual is removed from the arcology, withdrawal begins after Body × 4 hours. A Willpower (10) Test increases this onset by 1 hour per success. Once withdrawal begins, they suffer +4 to all target numbers until the craving is fulfilled. The book says an otherwise deprived Banded person may become berserk or die by suicide; the described fictional addiction takes 30 days to overcome.",
    "defiance_rule": "Resisting an order or acting contrary to Deus's wishes requires a successful Willpower (10) Test. The source says doing so is usually highly detrimental to that Banded character's well-being and refers to the cyberware-package game effects.",
    "captured_character_rule": "If a player character is captured and designated as Banded, first install the cyberware package for the type chosen by the gamemaster. If low Essence prevents it, the AI may use alpha- and beta-grade ware or replace already installed ware. Source states beta-grade cyberware costs 40 percent less Essence: multiply Essence cost by 0.6. Make separate Body (10) and Willpower (10) Tests. Success on BOTH leaves the character unconditioned but causes Serious Stun damage; otherwise the character is thoroughly conditioned and addicted to Deus.",
    "control_scope": "This rule concerns fictional mind control and captive characters; it does not license portrayal of coercion as consent."
