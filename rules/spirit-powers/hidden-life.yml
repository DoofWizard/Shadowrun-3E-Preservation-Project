id: rule.spirit-powers.hidden-life
record_type: rule
name: "Free Spirit Power: Hidden Life"
domain: spirit-powers
status: ingested
effective: {status: current, source: source.mits, page: 117, basis: defines}
scope: {applies_to: ["free spirits with Hidden Life"]}
resolution:
  summary: "The spirit permanently places its life force in a hiding place. While the hiding place survives, the spirit cannot be permanently destroyed by ordinary means and physical forms gain regeneration. The hiding place receives protection based on Force plus Spirit Energy. The life may be hidden in an animal or, at gamemaster discretion, a metahuman, with additional effects."
  inputs: ["hiding place", "Force", "Spirit Energy"]
  outputs: ["protected life force, regeneration, hiding-place protection"]
  steps: []
