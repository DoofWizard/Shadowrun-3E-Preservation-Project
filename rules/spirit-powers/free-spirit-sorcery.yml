resolution:
  summary: "A free spirit uses Sorcery as a magician. Initial Sorcery is based on Force and Spell Pool on Spirit Energy. The spirit can spend Good Karma to increase Sorcery and learn spells without a teacher or formula, but cannot cast spells above its own Force and must materialize to affect physical targets."
