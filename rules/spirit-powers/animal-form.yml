id: rule.spirit-powers.animal-form
record_type: rule
name: "Free Spirit Power: Animal Form"
domain: spirit-powers
status: ingested
effective: {status: current, source: source.mits, page: 117, basis: defines}
scope: {applies_to: ["free spirits with Animal Form"]}
resolution:
  summary: "A free spirit can materialize as a non-magical animal. Add Spirit Energy to the animal's normal physical Attributes and use spirit Force for mental Attributes. The form gains Immunity to Normal Weapons based on Spirit Energy, retains the spirit's other powers, and can speak if the spirit wishes. Destroying the animal form disrupts the spirit."
  inputs: ["animal form", "Force", "Spirit Energy"]
  outputs: ["materialized animal-form statistics"]
