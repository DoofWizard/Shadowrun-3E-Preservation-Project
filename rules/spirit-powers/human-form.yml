resolution:
  summary: "A free spirit can assume any desired metahuman form in a manner similar to materialization. Physical Attributes use the normal physical values for the spirit's type plus Spirit Energy; mental Attributes equal Force. The form gains Immunity to Normal Weapons based on Spirit Energy and can be changed by dematerializing and rematerializing."
  inputs: ["chosen metahuman form", "Force", "Spirit Energy"]
  outputs: ["materialized metahuman-form statistics"]
