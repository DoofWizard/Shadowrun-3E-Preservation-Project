scope:
  applies_to: ["beings with Accident"]

resolution:
  summary: "Causes an apparently normal mishap. The target resists with Quickness or Intelligence, whichever is greater, against a target number equal to the power user's Essence; failure causes the mishap to affect the target's next Initiative Pass."
  inputs: ["target Quickness", "target Intelligence", "user Essence"]
  outputs: ["resisted or accident occurs"]

