    - -4
  - - Other odors present
    - 2
  taste_target_number_modifiers:
  - - Taste obvious
    - -4
  - - Perceiver has a cold
    - 2
  perception_success_thresholds:
  - successes: 1
    meaning: Something is there.
  - successes: 2
    meaning: Something definitely is there; the perceiver suspects its general type.
  - successes: 3
    meaning: The perceiver knows the type of thing and suspects its exact nature.
  - successes: 4+
    meaning: The perceiver knows what it is, but cannot supply specifics without further
      information or examination.
  original_table_cross_reference:
    visibility_footnote: Source refers to Combat printed p111 for visibility conditions;
      where slash values appear, the first is cybernetic vision and second is natural
      vision.
