  perception_test:
    dice: Intelligence Rating dice
    default_target_number: 4
    team_group_dice: average Intelligence Rating of the team plus one die for each
      team member
    team_group_disallowed_when_surprise_possible: true
    outcome: One success means something was noticed; use the printed p232 Success
      Table for detail levels.
    conditional_bonus: The source says certain complementary skills such as Stealth
      (Awareness) may add to Perception Tests.
  general_target_number_modifiers:
  - - Perceiver is distracted
    - 2
  sight_target_number_modifiers:
  - - Very small object
    - 6
  - - Object partially hidden
    - 2
  - - Object brightly colored
    - -2
  - - Action very obvious
    - -4
  - - Action not obvious
    - 4
  visibility_numeric_table:
    source_page: Printed 232 / PDF241 repeats the exact Combat p112 visibility matrix.
      Reuse accepted rule.combat.sr3-core-visibility-numeric-p111-112; direct visual
      comparison shows all eight source-row values and cybernetic/natural slash notation
      agree.
    canonical_record: rules/combat/sr3-core-visibility-numeric-p111-112.yml
    original_table_row_count: 8
    columns:
    - condition
    - normal
    - low_light
    - thermographic
    not_duplicated_reason: Original exact matrix is already accepted in a canonical
      source-reviewed rule; this record establishes the p232 appearance and authoritative
      cross-reference.
  sound_target_number_modifiers:
  - - Single gunshot
    - -2
  - - Silenced single gunshot
    - 0
  - - Burst fire
    - -4
  - - Sound-suppressed burst fire
    - -2
  - - Full autofire
    - -6
  - - Sound-suppressed autofire
    - -4
  - - Grenade blast
    - -8
  - - A person's yell
    - -2
  - - Sound is rooms away
    - 2
  - - Sound is on same floor
    - 4
  - - Sound is floors away
    - 6
