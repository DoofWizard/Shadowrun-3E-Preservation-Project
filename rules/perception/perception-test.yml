id: rule.perception.perception-test
record_type: rule
name: "Perception Test"
domain: perception
status: ingested

effective:
  status: current
  source: source.sr3-core
  page: 231
  basis: defines

scope:
  applies_to:
    - "noticing non-obvious sensory information"

resolution:
  summary: "A Perception Test normally rolls Intelligence against a gamemaster-set target number or a relevant opposing value. For one team-wide Perception Test, use the team’s average Intelligence Rating as the base dice, then add one die for each team member; do not use a group Perception Test when surprise is possible. Success count determines the detail noticed."
  inputs:
    - "Intelligence"
    - "base target number"
    - "sensory/situational modifiers"
  outputs:
    - "degree of perceived information"
  team_perception:
    dice: "average team Intelligence + 1 die per team member"
    restriction: "Do not make one group Perception Test when surprise is possible."

links:
  uses:
    - rule.tests.success-test
  affects: []
  modified_by:
    - modifier.perception.conditions
  interacts_with:
    - entity.skill.stealth

sources:
  - source: source.sr3-core
    page: 231
    relation: defines
    note: "Running the Shadows — Perception"
  - source: source.sr3-core
    page: 232
    relation: clarifies
    note: "Perception Test Modifiers and Perception Success tables"

notes:
  - "Corrected against the source image: team Perception uses average Intelligence, not highest Intelligence."
  - "Stealth (Awareness) may be added in certain cases."
