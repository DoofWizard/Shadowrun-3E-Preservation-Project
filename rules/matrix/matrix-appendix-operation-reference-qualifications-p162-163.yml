headline: FASA7909 Matrix fictional game operation appendix qualifications
summary: Original Matrix pp162-163 explicitly classifies Graceful Logoff and gives the Locate Slave utility assignment in both reference tables; existing detailed tabletop rules and source conflicts remain intact.
data:
  graceful_logoff:
    appendix_page: 162
    appendix_pdf_page: 163
    footnote_symbol: '§'
    footnote_definition_page: 163
    footnote_definition_pdf_page: 164
    appendix_operation_class: interrogation
    qualification: The appendix marks Graceful Logoff with the interrogation symbol. The core description and Matrix p102 additional rules do not explicitly assign this category or a new cumulative success threshold to this operation. Preserve the printed classification without inventing a threshold or replacing the detailed resolution.
  locate_slave:
    appendix_operation_table_page: 162
    appendix_utility_table_page: 163
    appendix_listed_utility: Browse
    appendix_utility_reverse_listing: Browse
    qualification: Matrix lists Browse in both tables. The existing FASA7001 p217 Analyze assignment and p220 Browse listing remain separate original-source assertions. No precedence is inferred.
