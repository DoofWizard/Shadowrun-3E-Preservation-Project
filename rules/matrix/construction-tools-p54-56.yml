source: source.matrix
printed_pages: '54-56'
pdf_pages: '55-57'
edition_scope: FASA Corporation Matrix (FASA7909), Shadowrun Third Edition fictional tabletop RPG, original construction tool rules.
content_class: [rule_exact]
