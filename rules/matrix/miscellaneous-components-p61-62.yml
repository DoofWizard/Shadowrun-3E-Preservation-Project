id: rule.matrix.miscellaneous-components-p61-62
record_type: rule
status: source_reviewed
source: source.matrix
printed_pages: '61-62'
pdf_pages: '62-63'
edition_scope: FASA Corporation Matrix (FASA7909), Shadowrun Third Edition fictional tabletop RPG, original miscellaneous component attachment and operating conditions.
content_class: [rule_procedure]
framing: reference_exact
headline: Matrix miscellaneous component attachment and use
summary: Original game attachment tests, limits, battery and casing conditions, and accessory-specific qualifiers.
data:
  publication: {title: Matrix, publisher: FASA Corporation, catalog: FASA7909, edition: Third Edition}
  attachment:
    eligibility: GM approval and compatible terminal connection; direct neural operation requires separate DNI modification per SR3 p303.
    active_accessory_limit: Twice MPCP rating at any given time.
    FUP: No installation time.
    patchwork: {tests: ['Electronics B/R (4)', 'Computer B/R (4)'], both_must_succeed: true, base_time_hours: 1, successes_divide_time: true, tools: microtronics kit, additional_parts_nuyen: 75}
  accessory_conditions:
    speakers: {remote_port_connection_allowed: true, availability_per_extra_225_nuyen: '+1/+6 hrs'}
    battery: {run_time_hours: 6, recharge_hours: 1, replacement_after_about_hours: 500, required_for_wireless: true}
    camera: Video or trideo imaging feed stored by terminal.
    casing: {base_barrier_rating: 3, maximum_barrier_rating: 12, FUP_required: false, patchwork_required: true, damage_reference: SR3 pp124-125}
    chip_reader: Optical memory chip access.
    credstick_reader: Fictional credstick information verification and modification capability; see SR3 pp286-287.
    credstick_slot: Reads credstick data and allows credit transactions.
    disk_drive: Optical disk access.
    display_screen: Portable video or trideo output.
    fiberoptic_cable: Standard terminal and accessory connection.
    hitcher_jack: Trode or datajack connection; one-way information, same view as user, no control of actions; SR3 p208.
    keyboard: Manual input.
    micro_camcorder: Recording and transmission of images; SR3 p290.
    microphone: Voice commands and outside speech to user.
    microwave_dish: Cannot be built from temporary dish components.
    monitor: {availability_per_extra_1000_nuyen: '+1/+6 hrs'}
    offline_storage: Memory unit without processor.
    passkey_reader: Working unit available only from issuing corporation; GM determines street value; printed p63 table is for blank unit.
    power_cord: Electrical outlet connection.
    printer: Color hardcopy and photocopy capability in the setting.
    scanner: Image and identification input; SR3 p292.
    satellite_dish: Satellite transponder connection.
    signal_locator: Standard or activate-on-demand tracking signal; SR3 p291.
    simlink: Transmitter, receiver and recorder; SR3 p289.
    temporary_satellite_dish: Quickly assembled and dismantled; see Cannon Companion p55.
    touchpad: Optional mouse or trackball adapter.
    transceiver: Two-way radio communication; SR3 p287.
    trode_jack: Electrode net Matrix access; p17.
    vid_link_transmitter: Video and trideo transmission; SR3 p289.
    VR_kit: Goggles and gloves for physical manipulation of Matrix information.
  relationship: Extends the general component construction procedure; source-specific accessory purchase rows are a separate equipment table. Existing SR3 device rules are reused by reference, not replaced.
  source_review: Printed p61/PDF62 lower left and right column, p62/PDF63 left column and top right; attachment conditions, numeric modifiers, accessory restrictions and original references checked.
