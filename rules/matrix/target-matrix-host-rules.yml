headline: 'FASA7219 Target: Matrix SR3 host procedures, pp123-125 / PDF124-126'
summary: 'Fictional tabletop host procedure reconciliation with exact source qualifications and specialist record lineage.'
data:
  publication: {title: 'Target: Matrix', publisher: FASA, catalog: FASA7219, edition: Shadowrun Third Edition}
  detailed_records:
    - rule.matrix.target-matrix-seattle-gridlock-p123
    - rule.matrix.target-matrix-seattle-asist-overload-p123
    - rule.matrix.target-matrix-hacker-house-p123-124
    - rule.matrix.target-matrix-lone-star-host-p124
    - rule.matrix.target-matrix-malaysian-independent-bank-p124
    - rule.matrix.target-matrix-peoples-university-p124
    - rule.matrix.target-matrix-zurich-orbital-host-p124-125
