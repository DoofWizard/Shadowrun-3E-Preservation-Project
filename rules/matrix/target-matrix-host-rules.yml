  seattle_host_sheafs: 'GM generates corporate host sheafs appropriate to the campaign; host descriptions beginning p57 provide context.'
  hacker_house_language: 'The vendor uses its own programming language; this accounts for the optional bug and glitch modifiers.'
  hacker_house_guest: 'Anyone locating a display node may enter as a guest with very restricted privileges.'
virtual_seattle:
  seattle_rtg:
    security_code: 'Green-5/6/9/6/6/6'
    sheaf: 'Green Grid security sheaf, Matrix p114; Seattle LTGs have approximately the same ratings and security.'
  asist_filter_overload:
    occurrence_test: {RTG_login: '2D6', LTG_login: '3D6', trigger: 'all dice show 1'}
    effect:
      cold_ASIST: '+4 TN to all target numbers'
      hot_ASIST: '+6 TN to all target numbers'
      duration: 'Begins during that visit at GM-selected timing; ends on reset (Simple Action).'
      diagnose: 'Computer (Hardware) (4)'
    panics:
      trigger: 'More than one full Combat Turn of overload.'
      test: 'Willpower (5)'
      failure: 'Panic persists until jack-out; Matrix or simsense access causes recurrence until recovery.'
      recovery: 'Matrix p109 recovery as Rating 5 psychotropic IC.'
  gridlock:
    apply_one: 'GM may choose one effect during heavy traffic, including on other busy grids; see detailed record for six alternatives.'
hacker_house:
  public_access: 'Any Shadowland node; hidden display nodes also exist. Most catalog entries are free to browse.'
  demos: 'One-shot demos cost 10% of asking price; no demos from the isolated catalog.'
  secure_catalog_access: '100 nuyen entry fee; a catalog agent assists customers.'
  availability: 'Standard Availability Test; if available, base time 8 hours and Street Index -0.5; standard price otherwise per Matrix p94.'
  custom_programming: 'Street Index +1 for final cost; GM determines duration under Matrix programming rules.'
  optional_bug_rule: 'If optional rules (Matrix p81) apply, Bug Test Modifier -4 and Glitch-table modifier -2; software may contain bugs.'
  account: 'A purchase results in a personal account for subsequent logins.'
lone_star:
  gridsec:
    rating: 'Typically Equal and Trained.'
    utilities: 'Black hammer, killjoy and track typically rating 6 or higher; other utilities at GM discretion.'
    deck: 'Equal-rated deckers use Novatech Hyperdeck-6.'
  superior_or_superhuman_gridsec_deck: 'Novatech Slimcase-10'
  rookie_training: 'Novatech Z-Term'
  file_integrity:
    - 'Important files usually protected by worms, data bombs or Pavlov data bombs.'
    - 'For altered local files, note Control Test for header authentication under Edit File (SR3 p216).'
    - 'Unauthenticated alteration is noticed at four-hour main-office synchronization; GridSec investigates and may monitor the file or use it as a trap.'
  sheaf: 'Target: Matrix p133'
malaysian_independent_bank:
  account: 'No SIN required; passcode-only clients require a balance starting at 10000 nuyen, reduced with more identification.'
  services: ['electronic lock-boxes', 'anonymous remailing', 'other privacy services']
  note: 'Service fees are high but unspecified; sheaf p134.'
peoples_university:
  access: 'Characters must be both from the California Bay Area and members of the Resistance; almost any course, live or virtual instructors and simsense learning.'
  instructors: 'GM sets instructor skill for teaching new skills; SR3 p95 Instruction.'
  note: 'Standard host sheaf p134.'
zurich_orbital:
  access:
    - 'Dedicated satellite uplink and vanishing SAN are prerequisites in the fictional host scenario.'
    - 'SAN has scramble-13 IC and stays open for an unspecified timed interval.'
    - 'Freeze Vanishing SAN +4 TN (Matrix p99).'
    - 'Validate Account +6 TN to obtain priority handoff instead of disconnection.'
  sysops: 'Fates are Superhuman and Professional deckers using modified Fairlight Excaliburs; Zurich-Orbital System Familiarity (Matrix p24); utilities at GM discretion.'
  black_hammer: 'Maenads, not Fates, each have black hammer 1D6 + 6 with targeting option; GM chooses SK, agent or smart frame.'
  sheaf: 'Target: Matrix p134'
other_matrix_hosts:
  clubs: 'Etiquette (Matrix), Matrix p124, commonly used in social encounters.'
  hot_asist_games: 'Most games use cold ASIST; some fictional illegal, more expensive hot ASIST games pit deckers against deckers or nonlethal IC.'
  brothels: 'GM determines presentation based on group composition; no universal numeric procedure supplied.'
sources:
  - {source: source.fasa-7219, printed_pages: '123-125', pdf_pages: '124-126', relation: defines_rules}
