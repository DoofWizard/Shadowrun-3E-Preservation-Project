  constraints:
  - These are published original-game topology and routing conditions, not real-world network-access instructions.
  - A drawn example does not establish numerical Access or Security ratings for every host.
  - Topology does not grant automatic success on a separate Host/Grid System Test.
  - Scope is printed pp203-204; this record does not claim complete Matrix chapter implementation.
