headline: 'FASA Corporation Shadowrun, Third Edition (FASA7001), fictional tabletop Matrix routing rules: printed
  pp203-204 / PDF212-213'
summary: Original game route conditions for open LTG access, mandatory first-tier host traversal and return, directly
  linked hosts, restricted PLTG entry/access, and off-line hosts. The illustrated networks are examples, not mandatory
  universal configurations.
