  gameplay_routing_model:
    open_access:
      layout: Hosts attached directly to one LTG
      route: Any host attached to the currently accessible LTG can be approached from that grid without first traversing
        a different host.
      current_host_exit: The book explicitly permits disconnecting from an already entered host and accessing another
        without terminating the overall Matrix run.
    tiered_access:
      first_tier_host: The first-tier host A is the sole direct host connection to the public grid in the source
        diagram.
      second_tier_hosts:
      - B
      - C
      - D
      route_to_second_tier: The fictional decker must first pass through A before entering B, C, or D.
      second_tier_to_second_tier: To move from B to C or D, the decker must re-enter first-tier host A rather than
        bypass A.
      first_tier_roles: The source allows a first-tier system to act as a switch passing authorized users to second-tier
        hosts or to a private local telecommunications grid.
      chokepoint_design: Chokepoint is a possible security-intensive variation of tiered access with a strongly
        protected first-tier host and relatively less secure second-tier hosts; described as design variation rather
        than compulsory layout.
    host_to_host:
      network: Hosts are linked directly to other hosts and perform distinct tasks while sharing data.
      route_rule: The decker can access more deeply linked hosts only by passing through hosts that are connected
        in the fictional topology.
      diagram_example: In the p204 diagram, access to Host E from the LTG proceeds through the connected access
        hosts B, C and D; there is no direct public LTG-to-E link shown.
      not_universal: The particular diagram is illustrative; it is not a fixed required topology for every host-to-host
        network.
    private_grid:
      restricted: The PLTG is an owner-controlled fictional grid not generally open to the public.
      entry_routes: The publication describes multiple owner-defined entry points linking public grids, or entry
        via a host connected to the PLTG.
      post_entry: Once the decker has accessed any host in the private grid, the source says the decker can access
        any other host connected to that grid; this does not waive separate operation tests elsewhere in the Matrix
        chapter.
      internal_topology: Hosts within a PLTG may themselves use tiered or host-to-host configurations.
      optional_difficulty_guidance: For custom-designed PLTGs, the book recommends considering Orange or Red Security
        Codes and Easy Intrusion Difficulty (cross-reference printed p205), as GM discretion rather than a mandatory
        rating.
    offline_host:
      network_route: A host deliberately kept off the Matrix has no route through normal connected public/private
        grids.
      source_scenario: For this fictional game, direct physical access to the location and its jackpoint is required
        to interact with an off-line host.
      certainty: The book explicitly distinguishes disconnected hosts from remotely accessible connected ones.
  relationships:
    existing_general_topology: rule.matrix.topology
    existing_regional_grid_ratings: rule.matrix.sr3-core-na-rtg-system-ratings-p202-203
