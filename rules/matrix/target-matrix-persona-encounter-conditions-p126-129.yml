data:
  publication: {title: 'Target: Matrix', publisher: FASA, catalog: FASA7219, edition: Shadowrun Third Edition}
  general: GM selects persona NPCs with player-character power levels in mind; use ratings to set relative strengths
  anubis:
    assignment_participation: always works alone and does not allow player characters to accompany him
    direct_adversary: source recommends against using him directly against player characters; GM discretion
  fastjack:
    in_person_meetings: false
    physical_run_participation: false
    encounter_qualification: encountering him without appropriate introductions is unlikely to secure special consideration
    combat_preference: nonlethal unless absolutely necessary
    gm_limit: do not have him complete the characters' work for them
  grid_reaper:
    assignments: prefers one-shot work rather than regular teams
    assistance: occasional rather than dependable recurring rescue
    direct_action_against_characters: only if characters act first
  red_wraith:
    commitment: characters should not rely on a long-term commitment while his personal investigation remains his priority
  silvery_k:
    likely_encounter: Nexus, almost any evening or night
    default_attitude: strictly professional unless runners have a very good reputation
  slamm_0:
    possible_scavenger_hunt_contacts: skilled deckers who dislike otaku or are strongly opposed to Humanis
    job_constraints: avoids endangering himself or others and sets aside personal inclinations if they conflict with a job
  smiling_bandit:
    consultant_conditions: [matter interests him, team has a decent reputation]
    prior_personal_familiarity_required: false
  snow_tiger:
    potential_contact: runs involving Wuxing or the Triads; possible deck and programming services
    loyalty: will not betray the Sons of Thunder or Lei-Kung
  link_and_michael_sutherland: explicit contact and loyalty conditions in rule.matrix.target-matrix-persona-ratings
