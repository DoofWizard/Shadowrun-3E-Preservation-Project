record_type: rule
name: "Matrix Jackpoints"
domain: matrix
status: ingested
effective: {status: current_extension, source: source.matrix, pages: "30-33", basis: extends}

state:
  values:
    - access_modifier
    - trace_modifier
    - io_speed
    - base_bandwidth

types:
  console:
    access: "With authorized console access, halve the directly connected system's Access rating and Security Value for Access Tests."
    trace_modifier: -6
    io_speed: unlimited
    base_bandwidth: unlimited
  legal:
    access_modifier: -2
    trace_modifier: -2
    io_speed: 300
    base_bandwidth: 20
  high_speed_legal:
    access_modifier: -2
    trace_modifier: -2
    io_speed: 500
    base_bandwidth: 50
  illegal:
    access_modifier: 0
    trace_modifier: 0
    io_speed: 300
    base_bandwidth: 20
  illegal_high_speed:
    access_modifier: 0
    trace_modifier: 0
    io_speed: 500
    base_bandwidth: 50
  junction_box_tap:
    access_modifier: 0
    trace_modifier: 0
    io_speed: "dataline tap rating x 50"
    base_bandwidth: "dataline tap rating x 5"
  maser_power_grid:
    access_modifier: 0
    trace_modifier: -2
    io_speed: 400
    base_bandwidth: 25
  remote_device:
    access_modifier: 4
    trace_modifier: 4
    io_speed: 100
    base_bandwidth: 10

resolution:
  - "Access modifiers apply only to Access Tests on the host/grid directly connected through that jackpoint."
  - "Use the lower I/O Speed of cyberterminal or jackpoint."
  - "Base Bandwidth matters when the optional Icon Bandwidth rules are enabled."

sources:
  - {source: source.matrix, pages: "30-33", relation: extends, note: "Jackpoint Values and Hardwired Jackpoints"}
notes: []
source: source.matrix
printed_pages: '30-33'
pdf_pages: '31-34'
edition_scope: 'FASA7909 Matrix, FASA Corporation, Shadowrun Third Edition fictional tabletop RPG'
content_class: [rule_exact]
data:
  publication: {title: Matrix, publisher: FASA Corporation, catalog: FASA7909, edition: Shadowrun Third Edition}
  source_correction: {field: types.illegal.access_modifier, previous: 10, corrected: 0, printed_page: 32, pdf_page: 33}
  gm_variation: 'The gamemaster may vary the four game ratings for particular jackpoints.'
  trace_scope: 'Trace modifier affects the duration of the fictional Trace IC location cycle.'
  console_condition: 'Console access requires a directly connected workstation and security or superuser account credentials, or a station already logged in with those privileges; otherwise use legal access statistics.'
  connection_targets:
    console: host
    legal: LTG
    high_speed_legal: LTG
    illegal: LTG
    illegal_high_speed: LTG
    junction_box_tap: 'LTG or host, depending on location in the fictional network'
  maser_condition: 'Requires maser interface hardware and a maser Matrix power-grid connection.'
  remote_device_condition: 'The printed I/O Speed and Base Bandwidth for a remote device are typical values; individual devices can have lower limits.'
  tap_conditions:
    dataline_tap_rating: 'Equal to cyberterminal MPCP rating for the two fictional tap types.'
    electronics_build_repair_target_number: 4
