id: rule.matrix.jackpoints
record_type: rule
name: "Matrix Jackpoints"
domain: matrix
status: ingested
effective: {status: current_extension, source: source.matrix, pages: "30-33", basis: extends}

state:
  values:
    - access_modifier
    - trace_modifier
    - io_speed
    - base_bandwidth

types:
  console:
    access: "With authorized console access, halve the directly connected system's Access rating and Security Value for Access Tests."
    trace_modifier: -6
    io_speed: unlimited
    base_bandwidth: unlimited
  legal:
    access_modifier: -2
    trace_modifier: -2
    io_speed: 300
    base_bandwidth: 20
  high_speed_legal:
    access_modifier: -2
    trace_modifier: -2
    io_speed: 500
    base_bandwidth: 50
  illegal:
    access_modifier: 10
    trace_modifier: 0
    io_speed: 300
    base_bandwidth: 20
  illegal_high_speed:
    access_modifier: 0
    trace_modifier: 0
    io_speed: 500
    base_bandwidth: 50
  junction_box_tap:
    access_modifier: 0
    trace_modifier: 0
    io_speed: "dataline tap rating x 50"
    base_bandwidth: "dataline tap rating x 5"
  maser_power_grid:
    access_modifier: 0
    trace_modifier: -2
    io_speed: 400
    base_bandwidth: 25
  remote_device:
    access_modifier: 4
    trace_modifier: 4
    io_speed: 100
    base_bandwidth: 10

resolution:
  - "Access modifiers apply only to Access Tests on the host/grid directly connected through that jackpoint."
  - "Use the lower I/O Speed of cyberterminal or jackpoint."
  - "Base Bandwidth matters when the optional Icon Bandwidth rules are enabled."

sources:
  - {source: source.matrix, pages: "30-33", relation: extends, note: "Jackpoint Values and Hardwired Jackpoints"}
notes: []
