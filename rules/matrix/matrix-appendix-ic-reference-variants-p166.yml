headline: FASA7909 Matrix tabletop IC reference table variants for Probe and Sparky
summary: Original fictional game appendix p166 specifies bonus dice for Probe and Physical damage for Sparky; the accepted core records differ. No precedence inferred.
data:
  probe:
    appendix_type: Reactive
    appendix_target: System operations
    appendix_security_test_bonus_dice: IC Rating
    existing_core_rule: Separate Probe Rating test against Detection Factor; successes increase Security Tally.
  sparky:
    appendix_type: Proactive
    appendix_target: Icon
    appendix_icon_damage_power: IC Rating
    appendix_icon_damage_level_by_security_code: {Blue: M, Green: M, Orange: S, Red: S}
    appendix_MPCP_attack: true
    appendix_character_damage_power: IC Rating
    appendix_character_damage_level: M
    appendix_character_damage_track: Physical
    existing_core_character_damage_track: Stun
    existing_matrix_ICCM_rule: Roll Body and Willpower resistance tests separately and use the better result.
  related_records:
    - {id: rule.matrix.sr3-core-matrix-ic-white-gray-black-exact-p227-230, blob: 9a71a0b9e89f0b370ee174ab76a9ce72f70fc1c3}
    - {id: rule.matrix.matrix-advanced-ic-use-p109, blob: 8ce492c9c1d941c463ffe58f2c875ce0ba108bca}
  adjudication: Preserve the appendix wording and existing core and chapter records without inferred replacement or precedence. The Probe wording is not assumed to be mechanically equivalent to the separate test. Detailed chapter conditions are retained as separately sourced rules.
