headline: 'FASA7909 Matrix (SR3), printed pp20-21/PDF21-22: signature and Sensor communication qualifications'
summary: 'Published fictional tabletop game conditions for persona identity, differing source log scopes and selective communication.'
data:
  publication: {title: Matrix, publisher: FASA Corporation, catalog: FASA7909, edition: Shadowrun Third Edition}
  signature:
    printed_page: 20
    pdf_page: 21
    role: The fictional MPCP contains a serial number identifying the cyberterminal; nearly all interactions require the signature.
    legal_manufacture: Each legally manufactured cyberterminal MPCP has a unique nonremovable signature.
    absent_signature: Most fictional systems refuse interaction with an MPCP that has no signature.
    masking: In the game Masking can conceal or alter the apparent signature; a signatureless deck may need Masking to supply an apparent signature.
    logging_p20: The source describes all operations as logged with signature, timestamp and operation code.
    logging_p40_distinction: The separate p40 rule gives typical and extensive log scopes and leaves actual extent to GM discretion; preserve both statements without assuming universal precedence.
    related: rule.matrix.matrix-passcode-security-game-conditions-p40
  sensor:
    printed_page: 21
    pdf_page: 22
    communication: Sensor translates a user's mental speech and sends it to specified fictional icons; receiving Sensor programs render it as audible speech to their users.
    selective_reception: A user may instruct Sensor to receive communication only from specified icons.
    new_test_or_modifier: null
