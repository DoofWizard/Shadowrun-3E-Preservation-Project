id: rule.matrix.cranial-cyberlimb-terminal-p65-66
record_type: rule
status: source_reviewed
source: source.matrix
printed_pages: '65-66'
pdf_pages: '66-67'
edition_scope: FASA Corporation Matrix (FASA7909), Shadowrun Third Edition fictional tabletop RPG.
content_class: [rule_exact]
framing: reference_exact
headline: Matrix cranial and cyberlimb terminal construction rules
summary: Original fictional implant component restrictions, memory and connections, and cranial component table.
data:
  cranial:
    components: Only listed cranial parts can be constructed; nonmodular and treated as hardwired without the hardwiring cost reduction; incompatible with standard terminals.
    mandatory: [MPCP with icon, persona programs, ASIST circuitry, I/O Speed, active memory]
    construction: Standard terminal tests; installation coincides with implant surgery under Man and Machine p147.
    purchased_components: Partial construction permitted if character installs component to MPCP personally.
    stock_M_and_M_decks: Hot ASIST; quoted prices exclude active memory, ICCM and reality filters.
    memory: Dedicated cranial active memory is only for active utilities; headware memory can be active or storage; other linked memory only storage.
    external_jackpoint: Dedicated fiberoptic connection only to cranial terminal, not other implants; permits external access to unconscious or restrained game character.
    wireless: External linking device required; use p60 and p61 rules.
    other_cyberware: Standard router and interconnectivity rules from Man and Machine pp22 and 46.
  cranial_parts:
    columns: [component, essence, cost_nuyen, street_index]
    shared_availability: 6/2 wks
    shared_legality: 4P-S
    rows:
      - [Active Memory, 'Mp / 1000', '200 per Mp', 1]
      - [Cold ASIST Interface, 0.2, construction cost, 0.5]
      - [Hot ASIST Interface, 0.4, 'construction * 1.2', 1]
      - [External Jackpoint, 0.1, 500, 1]
      - [Hardening, 'rating / 10', 'construction * 1.2', 1.5]
      - [ICCM Filter, 0.2, 'construction * 1.2', 1.5]
      - [Icon Chip, 0.1, 'construction * 1.2', 1.5]
      - [I/O Speed Module, 0.1, 'construction * 1.2', 1]
      - [MPCP, 'rating / 10', 'construction * 1.2', 1]
      - [Persona Chips each, 0.2, 'construction * 1.2', 1]
      - [Reality Filter, 0.2, 'construction * 1.2', 2]
      - [Response Increase, 0.2, 'construction * 1.2', 1]
    notes: Cold and hot ASIST include RAS override; I/O and Response Increase Essence costs flat, persona and icon costs per chip.
  cyberlimb: Standard terminal construction except modular plug-and-use only, no hardwiring, no casing because limb is casing.
  relationship: Extends the existing Matrix cyberterminal construction procedure; Man and Machine source records remain unchanged.
