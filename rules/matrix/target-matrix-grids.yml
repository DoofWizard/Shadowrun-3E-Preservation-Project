  security_tally: Add frame/agent/SK rating to decker's tally when trashed, as IC.
transys_neuronet:
  caerlion: Caerleon uses a maser power grid; a character physically accessing it needs a maser power grid interface.
  boreworm:
    size_multiplier: 4
    attack: When icon takes damage, worm makes Attack Test using its rating vs target number MPCP + Hardening.
    success: Permanently removes one level of Hardening, then begins removing MPCP levels by same procedure.
    repair: Only replacement of damaged MPCP repairs this damage.
