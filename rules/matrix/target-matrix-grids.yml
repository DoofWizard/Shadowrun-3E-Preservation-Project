data:
  publication:
    title: 'Target: Matrix'
    publisher: FASA Corporation
    catalog_number: FASA7219
    edition: Shadowrun Third Edition
    source_id: source.fasa-7219
    original_pdf_sha256: dc9fbba78b9eb5efc60941213a90dfa0be190275dc92ea671631ddb7db154c4b
  page_map:
    printed: 116-119
    pdf: 117-120
  angel_satcon_qualifications:
    printed_page: 116
    satellite_grid_and_uplink_rules: Matrix pp47 and 34 respectively; RTG ratings and Density modifiers on Matrix p47.
    host_table_scope: Typical ratings by satellite function; GM may vary them and use timed or triggered SAN effects from Matrix pp120-121.
  provider_sheaf_qualification:
    printed_page: 118
    typical_sheaf: 'Target: Matrix p132 is Green-Average; for Green-Hard, GM may increase IC ratings.'
  shiawase_sheaf_reference:
    printed_page: 119
    printed_cross_reference: 113
    note: Original p119 references p113; retain this printed reference separately from the actual security-sheaf listing.
  lineage:
    noose_net_session_sheafs: rule.matrix.target-matrix-noose-net-session-sheafs-p116
    pueblo_tally_carryover: Existing SR3 core security tally rule retained; no duplicate procedure.
  search_scope:
    UOL: All Computer (Search Operations) Tests on UOL receive its listed modifier.
    Shiawase_MIFD: Computer (Search Operations) Tests in MIFD databases receive its listed modifier.
  pueblo_navigation_scope:
    printed_page: 119
    changing_connections: The LTG connections are rearranged semi-regularly; prior route knowledge is not reliable. The iconography navigation roll applies when relying
      on prior visit/trail knowledge.
  saeder_krupp_prime_qualification:
    printed_page: 119
    SAN_location: The source requires extensive legwork or Matrix investigation to locate one of the fictional PLTG SANs; merely happening upon one is almost nil.
headline: 'Target: Matrix (FASA7219, SR3), grid rules pp116-119 / PDF117-120'
summary: 'Original FASA7219 grid mechanics: corrected qualifications, retained numeric ratings and source-specific exceptions for the fictional Shadowrun Third Edition
  tabletop game.'
