angel_satcon:
  - "Angel SatCom satellites use scramble-5 IC; successful Decrypt Access is required."
  - "When atmospheric conditions may interfere with sensor equipment, roll 1D6; on 1, conditions interfere with attempted device use."

chicago_noose_net:
  grid_security: "Random Easy-difficulty grid security; Orange is base level."
  trace: "Tracing a character jacked in from inside Noose Net receives +4 Trace modifier; gamemaster may rule tracing impossible."
  access_anomaly:
    test: "On Logon to RTG, roll 2D6 and add results."
    threshold: "10+ triggers unusual grid behavior."
    resolution: "Roll 3D6 on Wild Matrix Table, or gamemaster invents an appropriate occurrence."
  resonance_well_search: "Attempts to create a resonance well in Noose Net receive -2 target number modifier."

wild_matrix_table:
  "3-4": "Incompatibility; use Archaic Systems rules."
  "5": "ASIST feedback; use Archaic Systems rules."
  "6": "Subsystem infected with worms; roll Worm Table, then 1D6: 1-2 Access, 3 Control, 4 Index, 5 Files, 6 Slave."
  "7-8": "System delays; lose Response Increase bonuses, excluding reality filters/pure DNI."
  "9": "Grid cannot support full simsense; apply +1 TN to all Matrix activity."
  "10": "Overlapping security; halve trigger intervals (round up) or generate two sheafs and compare tally against both."
  "11": "Weak interface; use Archaic Systems rules."
  "12": "Power fluctuations; once/minute Bod (6) or stalled/hung; failure = no actions next Combat Turn; all 1s = dump shock."
  "13": "Partially corrupted file system; +2 TN to all Index and Files Tests."
  "14-15": "Stray signals/static; +2 TN to all Sensor Tests."
  "16-17": "Weak bandwidth; use Archaic Systems rules."
  "18": "IC construct identifies intruder and attacks; cascading blaster-5 and tar pit-5 IC."

doj:
  edit_file_modifier: "+4 unless using superuser account"
  offline_archive: "Files older than five years may be moved to offline chips in physical warehouses; retrieval may require physical/social legwork."
  search_modifiers:
    INS: 2
    FBI: -1
    UCAS_Marshals: 1
    DEA: 1
    Bureau_of_Prisons: 2
    Anti_Trust_Division: 0
    Office_of_Inspector_General: -1

magicknet:
  annual_fee: "1,000¥"
  undernet_search_modifier: -1
  undernet_access: "Requires in-the-know contact and successful social test(s), such as Etiquette (Matrix), Etiquette (Magic), or Negotiations (Bribery)."
