  PlanetLink:
    security: "normally standard"
    note: "Some game operators may run games at BTL levels; treat extended play as Rating 4 BTL dreamchip exposure using cited addiction rules."
  Yamatetsu_MetaMatrix:
    meta_modified_gear_discount: "5% reduction to cost increase for meta-modified gear obtained through MetaMatrix"
    metahuman_search_modifier: -1

pueblo_grids:
  party_ic: "Reduce normal party-IC to-hit penalty by 1; e.g. three-piece cluster gives +1 instead of +2."
  navigation:
    route_memory: "If heading toward a host with LTG code or after successful Locate Access Node, roll 1D6/2 round up; number = grids away. If following known iconography trail, roll 1D6."
    table:
      "1-2": "Dead-end LTG; backtrack or Locate Access Node."
      "3-4": "A SAN leads to a different/higher-security LTG; enter or Locate Access Node for directions."
      "5-6": "Path leads where expected."
  software_availability: "Reduce Availability of programs obtained through this source by 2."

saeder_krupp_prime:
  passkey_duration: "After obtaining passkey, roll 1D6; result is number of days it remains valid."
  trace_ic: "+2 rating when locating intruder originating inside PLTG or from European/Russian/Middle Eastern grid."

