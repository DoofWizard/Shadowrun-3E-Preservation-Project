angel_satcon:
- Angel SatCom satellite SANs are always protected by scramble-5 IC; successful Decrypt Access is required for entry.
- When the satellite instrumentation or communications/surveillance devices are used, roll 1D6; on 1, atmospheric conditions interfere with attempted use. GM determines
  device effectiveness.
chicago_noose_net:
  grid_security: Random Easy-difficulty grid security; Orange is base level.
  trace: Tracing a character jacked in from inside Noose Net receives +4 Trace modifier; gamemaster may rule tracing impossible.
  access_anomaly:
    test: On Logon to RTG, roll 2D6 and add results.
    threshold: 10+ triggers unusual grid behavior for as long as the character accesses the grid.
    resolution: Roll 3D6 on Wild Matrix Table, or gamemaster invents an appropriate occurrence.
  resonance_well_search: When founding a tribe in Noose Net, attempts to create a resonance well receive a -2 target number modifier.
wild_matrix_table:
  3-4: Incompatibility; use Archaic Systems rules.
  '5': ASIST feedback; use Archaic Systems rules.
  '6': 'Subsystem infected with worms; roll Worm Table, then 1D6: 1-2 Access, 3 Control, 4 Index, 5 Files, 6 Slave.'
  7-8: System delays; lose Response Increase bonuses, excluding reality filters/pure DNI.
  '9': Grid cannot support full simsense; visual output becomes high-resolution line drawings and other sensory input is dropped; apply +1 TN to all Matrix activity.
  '10': Two independent grid security processes; halve trigger intervals (round up) or generate two security sheafs and compare the character’s security tally against
    both.
  '11': Weak interface; use Archaic Systems rules.
  '12': Power fluctuations; once/minute Bod (6) or stalled/hung; failure = no actions next Combat Turn; all 1s = dumped from the system and suffers dump shock.
  '13': Partially corrupted file system; +2 TN to all Index and Files Tests.
  14-15: Stray signals/static; +2 TN to all Sensor Tests.
  16-17: Weak bandwidth; use Archaic Systems rules.
  '18': IC construct identifies intruder and attacks; cascading blaster-5 and tar pit-5 IC.
doj:
  edit_file_modifier: +4 unless using superuser account
  offline_archive: Standard DOJ policy transfers material more than five years old to offline storage chips in physical warehouses; a DOJ worker with warehouse access
    must locate and upload the file. The fictional requester must complete the required forms and pass an ID check, or succeed in bribing the worker.
  search_modifiers:
    INS: 2
    FBI: -1
    UCAS_Marshals: 1
    DEA: 1
    Bureau_of_Prisons: 2
    Anti_Trust_Division: 0
    Office_of_Inspector_General: -1
  additional_search_modifiers: GM may apply additional target number modifiers to Computer (Search Operations) Tests because of interagency file transfers and bureaucracy.
  matrix_marshals: UCAS Matrix Marshals are Equal NPCs, usually encountered in pairs or squads; utilities include BattleTac Matrixlink, track, and attack and defense
    utilities.
magicknet:
  annual_fee: 1,000¥
  undernet_search_modifier: -1
  undernet_access: A character must find a knowledgeable contact and persuade them to provide access details; this may require Etiquette (Matrix), Etiquette (Magic)
    or Negotiations (Bribery) Test(s). Alternatively the character can purchase the Magick Undernet as a contact during character creation.
  threshold_guardian:
    type: semi-autonomous knowbot
    stats:
      core_rating: 8
      mpcp: 8/6/6/4/8
      pilot_skill: 8
      initiative: 8 + 4D6
      utility_pool: 8
      hacking_pool: 8
      utility_payload: 23
      utilities:
        Attack_S: 8
        Armor: 4
        Scanner: 6
        Lock_on: 5
  official_search_modifier: 0
  library_access: Magical library nodes charge extra for research time, beyond the annual membership fee.
service_providers:
  UOL:
    search_modifier: -1
    note: Low security attracts deckers; operator routinely intercepts data and monitors users. The GM determines when and if this occurs.
  PlanetLink:
    note: The book reports a rumor that some games operate at BTL levels. A hot ASIST interface is required for full effect; at GM discretion extended play risks
      BTL addiction. Treat such games as Rating 4 BTL dreamchips using Man & Machine p108 Substance Abuse rules and Cannon Companion p69 BTL Addiction Table.
  Yamatetsu_MetaMatrix:
    meta_modified_gear_discount: 5% reduction to cost increase for meta-modified gear obtained through MetaMatrix
    metahuman_search_modifier: -1
pueblo_grids:
  party_ic: Pueblo grid and host party IC reduces the normal party-IC to-hit penalty by 1; e.g. three-piece cluster gives +1 instead of +2.
  navigation:
    route_memory: If heading toward a host with LTG code or after successful Locate Access Node, roll 1D6/2 round up; number = grids away. If following known iconography
      trail, roll 1D6.
    table:
      1-2: Dead-end LTG; backtrack or Locate Access Node.
      3-4: A SAN leads to a completely different LTG (possibly higher security); try a different route or perform Locate Access Node for directions.
      5-6: Path leads where expected.
  software_availability: Reduce Availability of programs acquired through the Pueblo black market by 2.
saeder_krupp_prime:
  passkey_duration: After obtaining a passkey, roll 1D6; result is days it remains valid, after which the character needs a new passkey.
  trace_ic: +2 rating when locating intruder originating inside PLTG or from European/Russian/Middle Eastern grid.
