id: rule.matrix.matrix-appendix-ic-classification-bindings-p166
record_type: rule
status: source_reviewed
source: source.matrix
printed_pages: '166'
pdf_pages: '167'
edition_scope: FASA Corporation Matrix (FASA7909), Shadowrun Third Edition fictional tabletop role-playing game, printed p166/PDF167.
content_class: [rule_exact]
framing: reference_exact
headline: FASA7909 Matrix tabletop IC appendix classification and targeting bindings
summary: Original printed p166/PDF167 preserves the explicit table labels separately from detailed chapter resolution and the existing SR3 core rules.
data:
  appendix_classification_fields:
    white_ic:
      Scout:
        type: Special
        targets: [System operations, Icon]
    gray_ic:
      Blaster: {type: Proactive}
      Acid-rip: {type: Proactive}
      Bind-rip: {type: Proactive}
      Jam-rip: {type: Proactive}
      Mark-rip: {type: Proactive}
    trace_ic:
      Trace: {type: Proactive, target: Icon}
    black_ic:
      Cerebropathic: {type: Proactive, targets: [Icon, Character]}
      Lethal: {type: Proactive, targets: [Icon, Character]}
      Non-lethal: {type: Proactive, targets: [Icon, Character]}
      Psychotropic: {type: Proactive, targets: [Icon, Character]}
  qualifications:
    Scout: The Special classification is the appendix type label; the detailed Matrix chapter separately describes reactive and proactive modes.
    Trace: The appendix has a separate Trace IC heading; the Matrix chapter describes a white-gray hybrid with proactive hunt and reactive location phases. The appendix classification does not erase the latter phase.
  existing_rule_bindings:
    white_ic_effects: {id: rule.matrix.matrix-white-ic-effects-p103-104, blob: 7adcabf78e3476bcd44a9ebc149944c50dd7408f}
    trace_phases: {id: rule.matrix.matrix-trace-ic-bandwidth-p104-107, blob: a6fbf53eca793b5228679b21c3339ed4db90474c}
    black_ic_extensions: {id: rule.matrix.matrix-black-ic-extensions-p107-109, blob: 44ef8fa07ae1db725e35dbc8238003235a798d34}
    core_ic_effects: {id: rule.matrix.sr3-core-matrix-ic-white-gray-black-exact-p227-230, blob: 9a71a0b9e89f0b370ee174ab76a9ce72f70fc1c3}
  scope: These are explicit additional appendix classification bindings, not replacement effect rules. Existing Probe and Sparky appendix bindings and all detailed chapter conditions remain unchanged.
