id: rule.matrix.echo.distortion
record_type: rule
name: "Distortion Echo"
domain: matrix
status: ingested
effective: {status: source_specific, source: source.fanpro-10652, printed_page: 24, pdf_page: 24, basis: defines}
scope:
  users: "Otaku who follow the Dissonance and undergo submersion at a Dissonance pool."
resolution:
  action: "Complex Action"
  local_effect: "Disrupts processes on the local system; can distort icons, images and system sculpture."
  offensive_targets: "Number of Matrix users equal to otaku MPCP ÷ 2, round down."
  matrix_user_penalty: "For every 2 Hacking Pool dice committed to Distortion, each targeted Matrix user suffers +1 TN to all Matrix actions."
  otaku_target_penalty: "Targeted otaku, sprites and daemons reduce channels and complex forms by 1 per 2 Hacking Pool dice allocated."
  immunity: "Dissonance-following otaku are immune."
  defense:
    method: "Targeted Matrix user takes a Complex Action and allocates Hacking Pool."
    cancellation: "Each defensive Hacking Pool die nullifies one Hacking Pool die the distortion otaku allocated against that character only."
    multiple_distortions: "Only strongest Distortion effect applies; effects do not stack."
  sustain:
    action: "Simple Action each Initiative Pass"
    detection_factor_penalty: "-1 Detection Factor for every turn sustained past the first."
  tortoise_mode: "Targeted tortoise-mode users are immediately crashed."
sources:
  - {source: source.fanpro-10652, printed_page: 24, pdf_page: 24, relation: defines}
