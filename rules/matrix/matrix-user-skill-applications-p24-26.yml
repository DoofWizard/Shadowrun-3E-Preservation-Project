data:
  publication: {title: Matrix, publisher: FASA Corporation, catalog: FASA7909, edition: Shadowrun Third Edition}
  computer_skill:
    basic_access_requires_skill: false
    program_or_system_manipulation_requires_skill: true
    specializations:
      Cybernetics: Relevant to ICCM filter creation (p21) and certain computerized surgical procedures (Man & Machine p136).
      Decking: Used for unauthorized System Operations and improvised attacks in the game.
      Hardware: Regular computers, mainframes and computer devices; construction and modification use Computer B/R.
      Programming: Program design; rating ceilings are already represented in rules/matrix/matrix-programming-rating-constraints-p76.yml.
      Search Operations: Information searches (p124).
  other_active_skills:
    Computer Build/Repair: Building and modifying cyberterminals, cyberdecks and other computers, including assembly from purchased parts (p52).
    Electronics Build/Repair: Used for the fictional jackpoint procedure (p32).
    Etiquette (Matrix): Persona social interactions and Matrix searches (p124).
    Small Unit Tactics (Matrix): Both skill user and recipient of its bonus must be linked using a BattleTac Matrixlink program (p71); general skill rules referenced in Cannon Companion p105.
  design_knowledge:
    program_plan: Program Design Knowledge Skill for the specific program type permits creation of its plan (p78).
    separate_types: [Defensive Utility, Offensive Utility, Operational Utility, Special Utility, Cyberterminal Code, White IC, Gray IC, Black IC, Trace IC, Frame Core, IC Construct, Worm, Application, Programming Suite]
    cyberterminal_design: Used for the Design Test when constructing one's own components (p55).
    info_sortilage: Restricted to otaku who have learned the Info Sortilage echo; recognizes patterns, associations and hidden details in large data sets. Printed p25 points to p55; the printed reference is retained without correction.
    other_examples: [Data Brokerage, Matrix Gangs, Data Havens, Legendary Deckers, Matrix Security Procedures, Corporate Hosts, Jackpoint Locations, Deckmeisters, Matrix Topography, Databases, Otaku, Artificial Intelligence, Satellite Networks, Virtual Meeting Spots, Iconography, Chat Rooms, Seattle LTG]
  relationship: Complements existing program design and search rules; does not replace their numeric procedures.
