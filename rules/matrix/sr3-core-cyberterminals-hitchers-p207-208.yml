  section: The Matrix / Cyberterminals / Accessories
  cyberterminal:
    original_game_kind: Keyboard-and-screen cyberterminal alternative to a cyberdeck; may use electrode or datajack input
      and optional VR display peripherals.
    max_MPCP_rating: 4
    response_increase_supported: false
    utility_program_rating_modifier: -1
    reason_for_modifier: Source describes lower control than full cyberdeck.
    black_IC_damage_to_user: Source explicitly states cyberterminal users cannot be hurt by Black IC.
    dump_shock_damage_to_user: Source explicitly states cyberterminal users cannot be hurt by dump shock.
    approximate_price_fraction_of_equivalent_cyberdeck: 0.1
    cost_qualification: Generally 10 percent of an equivalent cyberdeck price; not a separate printed cyberterminal price
      table or automatic discount to every model.
  hitcher_connections:
    form: Hitcher jacks permit an additional fictional observer to jack in and view the decker Matrix session.
    spectator_perspective: Hitcher sees from the decker persona perspective as an observer.
    direct_control_allowed: false
    can_modify_or_affect_decker_persona: false
    risk: Hitchers enjoy similar IC side-effect protection to cyberterminal users; narrative frustration and nonparticipation
      are not game penalties.
    market_reference: Original FASA7001 printed p304 lists hitcher jack accessory price; not reproduced as new equipment statistic
      here.
  lineage_and_reuse:
