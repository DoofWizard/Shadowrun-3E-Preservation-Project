headline: 'FASA7219 Target: Matrix (SR3), fictional Shadowland chapter access and architecture, pp28-31 / PDF29-32'
summary: 'FASA Corporation in-world node architecture, variable access policies, venue limits and attributed exceptions; retains the distinct explicit p121 game rules.'
data:
  publication:
    title: 'Target: Matrix'
    publisher: FASA Corporation
    catalog_number: FASA7219
    edition: Shadowrun Third Edition
    source_id: source.fasa-7219
    original_pdf_sha256: dc9fbba78b9eb5efc60941213a90dfa0be190275dc92ea671631ddb7db154c4b
  node_architecture:
    printed_page: 28
    pdf_page: 29
    san_count: 2
    san_destinations: [Matrix, Shadow Matrix]
    intermediate_hosts: Number and arrangement vary by node; each has a host separating the two network sides and controlling access.
    isolation: The separating host is designed to permit physical destruction of the connection during an attack so the Shadow Matrix can be isolated.
    inter_node_routing: Nodes do not connect directly to one another; important data is routed to the Nexus for storage and distribution.
    mirroring_exception:
      speaker: Captain Chaos
      claim: Both Nexus and individual nodes filter inbound and outbound material; not all information is mirrored.
    attributed_architecture:
      - {speaker: FastJack, claim: Additional chokepoints on both sides run virtual machines as buffers and security screens.}
      - {speaker: Captain Chaos, claim: Implementation varies by node; the precise details are not confirmed uniformly.}
      - {speaker: HoodRat, claim: Linking hosts commonly involve virtual machines and trapdoors; the usual chokepoint entry SAN is one-way, with a separate triggered one-way exit SAN.}
      - {speaker: HoodRat, claim: At a node the speaker previously used, an agent checked passcodes, passkeys and icons; accepted credentials triggered the exit sequence, while rejected credentials led to confinement in the chokepoint.}
      - {speaker: Captain Chaos, claim: Other routes facilitate non-icon data transfers; their implementation is not specified.}
  local_access_policy:
    printed_page: 28
    pdf_page: 29
    seattle: Permissive access policy.
    fdc: Government agents and police are prohibited, though enforcement is not assured.
    oakland: Members and supporters of openly anti-metahuman racist organizations are banned; uploaded Humanis propaganda is automatically deleted.
  venue_scope:
    printed_page: 29
    pdf_page: 30
    separate_venues: Social venues are operated by node administrators but treated separately within the node; general node access does not give unrestricted behavior privileges there.
  access_qualifications:
    printed_page: 31
    pdf_page: 32
    protocols: Access procedures change and differ across nodes; individual nodes use trapdoor SANs, teleporting SANs or combinations.
    skill_requirement: A character need not be a decker to access Shadowland.
    relationship_to_game_information: The reputation and reference route supplements the existing p121 contact and admission guidance without adding a fixed test.
  lineage:
    existing_game_information: rule.matrix.target-matrix-data-havens
    disposition: Chapter-specific and attributed conditions, not universal fixed target numbers, IC ratings or replacement procedures.
