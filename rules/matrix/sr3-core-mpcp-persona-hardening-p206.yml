  operation:
    simultaneous_deckers_per_deck: 1
    physical_requirements:
    - Decker physically attaches a fiber-optic jack to the datajack.
    - Cyberdeck physically connects to a Matrix jackpoint.
    persona_software_concept: Bod, Sensor, Evasion and Masking are persona programs representing the persona attributes in
      Matrix tests; utilities are separately rated programs.
  hardening:
    per_point_reduction_to_black_IC_damage_power: 1
    applies_to: Power of Black IC damage dealt to in-game icon or actual decker for Resistance Tests
    gray_IC_crashed_icon_exception: When a decker icon has been crashed by Gray IC and that IC makes an Attack Test, the target
      number for the Attack Test increases by +1 per Hardening point.
    limits: Do not apply Black IC Power reduction to all attack utilities; follow p207 distinction.
