id: rule.matrix.target-matrix-data-havens
record_type: rule
name: 'Target: Matrix - Data Haven Procedures'
domain: matrix
status: ingested
source: source.fasa-7219
printed_pages: 120-122
pdf_pages: 121-123
general:
- Data havens may be purchased as contacts during character creation (Matrix p128); contact upkeep covers the time and expense of knowing how to access and being
  able to access the haven.
- No security sheafs are included for data havens because player-character intrusion is unlikely and their security changes frequently; the GM determines each haven’s
  security in the campaign.
shadowland:
  discovery: Best reached through reputation, contacts and instructions/passcodes rather than brute-force discovery.
  security: Nodes handle security independently; chokepoints are common, sometimes with trapdoors or vanishing SANs. Security deckers are ready and IC is normally
    configured aggressively.
  architecture: Nodes are mirrored/backed up through the Nexus so one node's loss does not remove information availability.
nexus:
  access:
  - Reach through a Shadowland node.
  - Enter the killing jars and await approval; provide proper passcodes OR otherwise convince the security decker on duty to permit access.
  - Circumventing the procedure results in active alerts, aggressive grey-to-black IC and live security deckers.
asgard:
  connection: Use Satellite Uplink rules.
  density_modifier: 4
  connection_window: two hours per day
  market:
  - The fictional Asgard sysops assign traceless anonymous accounts used for both buying and selling data.
  - Asgard keeps roughly 40-80% of purchase price as commission.
  - Asgard does not normally hold data more than two weeks. Data that fails to sell or cannot be auctioned without disclosing its contents is placed in a searchable
    archive that charges a fee.
  services:
  - electronic drop-box
  - satellite surveillance
azziewatch:
  focus: Aztlan/Aztechnology intelligence and regional border/troop information.
  security_context: Frequent hostile attempts are expected; gamemaster should treat the haven as a high-risk target.
helix:
  public_access: Log on using the public host address; wait in the chokepoint while the persona is traced. If the address is approved, visitor authorization and entry
    follow. Access to Helix itself has no fee; data charges are separate.
  visitor_privileges:
  - Limited personal-account privileges.
  - Can read files.
  - Upload Data does not automatically succeed.
  - Download Data succeeds only for items made available.
  registered_users: Normal personal-account privileges; no automatic trace on login.
other_havens:
- Kalinin, Manchester and Morgue are described as specialized regional/research havens.
- Their distinctive content and access conditions should be preserved as setting constraints; no additional universal numeric mechanic is specified in this range.
