headline: FASA Corporation Shadowrun Third Edition FASA7001 fictional tabletop Matrix
  System Tests, action economy and Security Tally, original printed pp209-210/PDF218-219
summary: Source-checked Matrix System Test opposed success contests and running Security
  Tally, noncombat action allocation, new-icon/IC Sensor outcomes, location-limited
  grid logons and the printed worked Logon example.
data:
  publication:
    title: Shadowrun, Third Edition
    publisher: FASA Corporation
    edition: Third Edition
    catalog: FASA7001
    source_id: source.sr3-core
    nature: Published fictional cyberpunk tabletop role-playing game source
    original_pdf_sha256: 7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914
