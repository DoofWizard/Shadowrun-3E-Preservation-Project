headline: 'FASA7909 Matrix (SR3), printed pp18-20/PDF19-21: computer interface qualifications'
summary: 'Fictional tabletop game conditions for trode disconnection, ASIST mode changes and reality filter use.'
data:
  publication: {title: Matrix, publisher: FASA Corporation, catalog: FASA7909, edition: Shadowrun Third Edition}
  trodes:
    printed_page: 18
    pdf_page: 19
    extends: rule.matrix.interface-access
    link: Fiberoptic cable to cyberterminal
    removal: Disconnects the character and may cause dump shock under SR3 p227.
  asist:
    printed_pages: '18-19'
    pdf_pages: '19-20'
    extends: rule.matrix.asist-modes
    cold_other_IC_effects: Unchanged; the source separately treats lethal black IC as nonlethal against a cold ASIST user.
    hot_interface_legality: Illegal in the fictional setting.
    switching_under_black_IC: Requires the same game tests as an attempt to jack out (SR3 p230).
  reality_filter:
    printed_page: 20
    pdf_page: 21
    extends: rule.matrix.speed-options
    toggle_action: Complex Action
    initiative_score_change: Beginning of next Combat Turn
    effective_MPCP_consequence: The user may need to reduce persona and utility program ratings to remain within the effective MPCP limits.
