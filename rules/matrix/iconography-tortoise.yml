{"id":"rule.matrix.iconography-tortoise","record_type":"rule","name":"Matrix Iconography, Perception and Tortoise Mode","domain":"matrix","status":"source_reviewed","effective":{"status":"current_extension","source":"source.matrix","pages":"40-42","basis":"extends"},"source":"source.matrix","printed_pages":"40-42","pdf_pages":"41-43","edition_scope":"FASA Corporation Matrix FASA7909, Shadowrun Third Edition fictional tabletop RPG; original printed pp40-42, with the next chapter beginning p43.","content_class":["rule_exact"],"framing":"reference_exact","headline":"FASA7909 Matrix original perception, iconography and tortoise rules, pp40-42","summary":"Corrects the original source page span and restores missing perception, reality-filter and tortoise operation qualifications while preserving the existing rule ID.","resolution":{"iconography":["UMS uses standardized icons; sculpted systems use a central metaphor.","A user describing actions contrary to that metaphor receives +2 to target numbers for all tests in the system.","When the GM determines a reality filter conflicts with system sculpture, roll MPCP against system Security Value. Failure imposes -2 Reaction and -1D6 Initiative for as long as the character remains in the sculpted environment; success preserves the filter bonus."],"movement":["Matrix location is logical rather than physical, defined by the dataspace, data pathways and elements immediately accessible through the user's operations."],"tortoise_mode":["Tortoise mode uses conventional displays and controls, without persona or ASIST.","Effective Sensor 1 and Detection Factor 1.","No IC triggers; each trigger logs MXP address, trace launches on the third trigger step, passive alert immediately ends the session.","Cannot perform Decoy, Null Operation, Redirect Datatrail or Relocate Trace.","During combat, computer actions are limited to one Combat Phase per Combat Turn."]},"links":{"interacts_with":["rule.matrix.speed-options","rule.matrix.security-tally"]},"sources":[{"source":"source.matrix","pages":"40-42","relation":"extends","note":"Visibility and Perception, System Iconography, Matrix Movement, Tortoise Mode and Tortoise Operations"}],"notes":[],"data":{"publication":{"title":"Matrix","publisher":"FASA Corporation","catalog":"FASA7909","edition":"Third Edition","source_pdf_sha256":"b5be5f7d6b51823ea51545b7816f3813ddc9f3bf4b674e4aa261030edbdb02fe"},"perception":{"sensor_scope":"The Sensor persona program detects features from icon identification data; ASIST translates them, possibly through a reality filter. Background traffic usually remains hidden unless specifically sought.","hidden_features":"Hosts may omit iconography and deckers may employ Masking; sufficiently capable Sensor programs can still detect presence and show default icons.","unidentified_icon":"Closest UMS icon when the type is known; a blinking three-dimensional X if completely unidentified.","core_references":["SR3 p202 Seeing the Matrix","SR3 p209 Matrix Perception"]},"sculpture":{"contrary_action_tn_modifier":2,"conflict_test":"MPCP Test","conflict_tn":"Security Value","failure_reaction_modifier":-2,"failure_initiative_dice_modifier":-1,"success":"Retain reality-filter Reaction and Initiative bonuses.","duration":"While in sculpted environment, possibly extending across a linked host network or PLTG and its hosts.","conflict_decision":"GM determines whether conflict occurs, usually at Logon."},"tortoise":{"interface":"Any Matrix-attached computer with basic interface, including a cyberterminal.","persona":false,"visible_as_icon":false,"locate_operation":"Locate Tortoise Users","dump_operation":"Crash Application","utilities":"Permitted if loaded into active memory.","effective_sensor":1,"detect_other_personas":"Only when conducting a system operation.","effective_detection_factor":1,"ic_triggered":false,"mxp_logged_each_trigger":true,"trace_trigger_step":3,"passive_alert":"Immediate session termination.","excluded_operations":["Decoy","Null Operation","Redirect Datatrail","Relocate Trace"],"physical_speed":"Normal physical speed.","combat_phases_per_turn_for_computer_actions":1},"source_review":{"images":["printed p40/PDF41 right column","printed p41/PDF42 both columns","printed p42/PDF43 both columns","printed p43/PDF44 next chapter heading"],"reviewed_fields":"All named operations, values, conditional penalties, visibility and timing qualifiers; existing legacy semantic facts retained."}}}
