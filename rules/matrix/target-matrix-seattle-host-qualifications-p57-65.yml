id: rule.matrix.target-matrix-seattle-host-qualifications-p57-65
record_type: rule
status: source_reviewed
source: source.fasa-7219
printed_pages: '57-65'
pdf_pages: '58-66'
edition_scope: 'FASA7219 Target: Matrix, FASA, Shadowrun Third Edition fictional tabletop RPG'
content_class: [rule_procedure]
framing: reference_exact
headline: 'FASA7219 Target: Matrix SR3 Seattle host qualifications, pp57-65/PDF58-66'
summary: 'Fictional tabletop host-specific access, security layers, responder conditions and reported lookup timing; p123 controls GM security sheafs.'
data:
  publication: {title: 'Target: Matrix', publisher: FASA, catalog_number: FASA7219, edition: Shadowrun Third Edition}
  authority: 'The fictional Dead Deckers Society describes local host conditions; use p123 for GM-designed security sheafs. No fixed IC ratings or extra target numbers are supplied here.'
  ares:
    printed_page: 57
    public_link: Knight Errant downtown host
    private_layers: 'Progressively more sensitive, with increasingly capable IC; first private layer serves Bellevue office business.'
    response: 'Sensitive intrusion response uses IC and trace, with Knight Errant involvement.'
  microdeck:
    printed_page: 58
    response: 'IC is the initial defense, usually favoring incapacitation; company deckers patrol and respond. Neon Rose qualifies that sensitive systems may use black IC.'
  global_technologies:
    printed_page: 58
    response: 'Locally developed IC includes expert systems, automated decker programs and psychotropic IC; Eagle Security provides on-call deckers on alert.'
  shiawase:
    printed_page: 59
    data_distribution: 'Sensitive material is split across directories and databases, requiring multiple searches and downloads.'
    response: 'Usually trace IC first, then other IC while security responds.'
  cross_electronics:
    printed_pages: '59-60'
    access: 'A subhost links the Everett Community College and Cross host.'
    response: 'Trace and report preferred; sufficient disturbance brings on-duty company deckers.'
  knight_errant:
    printed_page: 60
    public_host_color: Green
    secure_host_color: Orange
    reported_minimum_online_deckers: 2
    qualification: 'The secure host tests Matrix defenses and trains combat deckers; the narrator reports at least a couple online at any given time.'
  federated_boeing:
    printed_page: 61
    routine_business_host_color: Green
    secure_host_color: Red
    response: 'IC favors rapid removal; company deckers respond if the system cannot promptly remove intruders.'
  aztechnology:
    printed_page: 61
    public_host_color: Green
    private_host_color: Red
    private_link: Aztechnology PLTG
    reported_decker_availability: '24/7 on call'
    response: 'Gray and black IC and trace programs are favored.'
  novatech:
    printed_page: 62
    response: 'Distributed defenses emphasize psychotropic IC, party IC and degradation of intruding cyberdeck functions; company deckers support defense.'
    attributed_exception: 'Psycher alleges that discounted company hardware or programs fail when used against Novatech; no quantified failure test is given.'
  mitsuhama:
    printed_pages: '62-63'
    private_host_color: Red
    access: 'Correct access codes allow transition from the public host to the private one; private host links to the MCT PLTG.'
    response: 'Black IC favored; external alarms additionally bring corporate deckers.'
  sea_tac:
    printed_page: 63
    access: 'Public flight information and airline links; private host contains operational and security information.'
    response: 'Private host emphasizes password protocols and trace IC, with security response on alert.'
  renraku_arcology:
    printed_pages: '63-64'
    qualification: 'Main host restored selectively; unchecked sections remain offline and are accessible only from within the arcology. The heading restriction on public access remains distinct.'
  seasource:
    printed_pages: '64-65'
    public_access_fee: 0
    reported_lookup_max_seconds: 60
    qualification: 'Restored public database may have missing, stale, misfiled or corrupt entries; the reported lookup time is not a universal Matrix operation duration.'
  pac_rim_communications_unlimited:
    printed_page: 65
    access: 'Public hosts connect to the company PLTG; subscriber and account records are in the private grid.'
    response: 'IC supported by security deckers on patrol.'
