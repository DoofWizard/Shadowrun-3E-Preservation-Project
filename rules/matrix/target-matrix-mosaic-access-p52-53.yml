headline: 'FASA7219 Target: Matrix SR3 Mosaic fictional haven access conditions pp52-53/PDF53-54'
summary: 'Source-attributed weekly relocation, variable application timing, prerequisites and PLTG architecture; no inferred generic mechanic.'
data:
  publication: {title: 'Target: Matrix', publisher: FASA, catalog_number: FASA7219, edition: Shadowrun Third Edition}
  attribution: 'Zmei describes Mosaic in the Data Havens chapter; additional claims have their own named fictional speakers. These are site-specific campaign constraints, not universal Matrix rules.'
  access:
    san_relocation: {printed_pages: '52-53', approximately_weeks: 1, location: 'Usually within the Vladivostok grid.'}
    discovery: 'An account registration supplies a keyword for locating the current SAN in a fictional online newspaper personal-ad listing; registration requires locating the operators outside that process.'
    keyword_change: {speaker: Perry Stroyka, qualification: 'Changes occasionally; no interval specified.'}
    chokepoint: 'SAN leads directly to an extremely black chokepoint. Usually at least one security decker or guard agent examines visitor icons; new visitors receive attention.'
    application:
      speaker: Passport
      prerequisites: ['New applicant pays an unspecified fee.', 'Application includes shadow references.']
      processing: {minimum_hours: 1, maximum_days: 7, depends_on: ['Reputation', 'Quality of references', 'Additional gratuity']}
      unknowns: 'No fixed fee, target number or gratuity amount printed.'
  architecture:
    printed_page: 53
    grid_type: PLTG
    host_count_approximate: 24
    archive_hosts_fraction: 'More than half.'
    other_host_functions: ['Chat rooms', 'Message boards', 'Meeting places', 'Newsfeeds']
    linked_host_restriction: {speaker: Floyd, organization: Northern Star Ring, condition: 'Special access privileges required for its linked hosts.'}
  lineage: 'Existing Game Information data-haven rules pp120-122 do not establish Mosaic-specific numeric mechanics; no replacement of general contact rules is inferred.'
