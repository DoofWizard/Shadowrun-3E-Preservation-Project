id: rule.matrix.advanced-core-utility-uses-p74-75
record_type: rule
status: source_reviewed
source: source.matrix
printed_pages: '74-75'
pdf_pages: '75-76'
edition_scope: FASA Corporation Matrix (FASA7909), Shadowrun Third Edition fictional tabletop RPG; original pp74-75/PDF75-76.
content_class: [rule_exact]
framing: reference_exact
headline: Matrix advanced applications of existing SR3 utilities
summary: Original FASA7909 extensions to core utility operation links, target eligibility, option compatibility and programming exceptions, retaining core multipliers.
data:
  existing_core_rule: rule.matrix.sr3-core-matrix-utility-multipliers-effects-p220-222
  operational_options: Reuse the ten-option list in rule.matrix.operational-utility-multipliers-p68-71; p74 repeats it for existing SR3 operational utilities.
  operational_extensions:
    Browse: Also modifies TN for Trace MXP Address.
    Relocate: Also reduces System Test TN to defeat Trace IC after its location cycle begins.
    Scanner: Also reduces System Test TN for Locate Frame, Locate Tortoise User and Scan Icon.
  special_options: Reuse the five-option list in rule.matrix.special-utility-multipliers-p71-73; p75 repeats it for existing SR3 special utilities.
  track_extension:
    additional_targets: [frames, agents, sprites, daemons, SKs, AIs]
    resolution: Same as against personas.
    source_heading: Special Utilities
    classification_note: Matrix p75 places Track here while SR3 core p221 describes it among offensive utilities; retain both source headings without inferring a wholesale category change.
  attack_extension:
    additional_targets: [frames, agents, sprites, daemons, SKs, AIs]
    eligible_options: [Adaptive, Area, Bug-Ridden, Chaser, Crashguard, DINAB, Limit, One-Shot, Optimization, Penetration, Selective, Stealth, Targeting]
  black_hammer_and_killjoy:
    applies_to: [Black Hammer, Killjoy]
    targets: [Personas]
    eligible_options: [Adaptive, Bug-Ridden, Crashguard, One-Shot, Optimization, Selective, Targeting]
    maximum_programmed_rating: ceil(Computer (Programming) skill / 2)
    permitted_SK_use: true
    prohibited_loading: [frame, agent, sprite, daemon]
    relationship: Specific exception to ordinary programming ceiling in rule.matrix.program-rating-constraints-p76.
  slow:
    eligible_options: [Adaptive, Area, Bug-Ridden, Crashguard, DINAB, One-Shot, Optimization, Selective, Targeting]
    trace_IC_vulnerability: Only during hunting cycle.
  defensive_options:
    Armor: [Adaptive, Bug-Ridden, Crashguard, Optimization]
    Cloak: [Adaptive, Bug-Ridden, Crashguard, One-Shot, Optimization]
    Lock-On: [Adaptive, Bug-Ridden, Crashguard, One-Shot, Optimization]
    Medic: [Adaptive, Bug-Ridden, Crashguard, DINAB, Optimization]
  armor_area_exception: Against Area-equipped offensive utilities, effective Armor utility rating increases by 2; already independently preserved in original p83 option record, reused here.
  provenance:
    reused_core_blob: bc82c8a104b0ffa29c54ba41b365b959e988655d
    reused_program_ceiling_blob: 0c9a3cdd6c27a46c78c94bc60d8382d27723d8fc
    reused_option_effects_blob: 0de9dec5d45113caa52735a91a2646ca4af72f16
    legacy_catalog_blob: 258ae24166192261006fedf0c50ea7fbe52e304f
