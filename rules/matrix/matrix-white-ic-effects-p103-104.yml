{"id":"rule.matrix.matrix-white-ic-effects-p103-104","record_type":"rule","status":"source_reviewed","source":"source.matrix","printed_pages":"103-104","pdf_pages":"104-105","edition_scope":"FASA Corporation Matrix FASA7909, Shadowrun Third Edition fictional tabletop RPG, printed 103-104/PDF 104-105.","content_class":["rule_exact"],"framing":"reference_exact","headline":"Matrix tabletop Data Bomb, Pavlov and Scout IC extensions","summary":"FASA7909 Matrix source-specific tabletop rules; extends existing SR3 game mechanics.","data":{"legacy_catalog":"entities/matrix/ic-extension.yml (1e8b47a5ba03267f69e0062a68019d3e4547f184); names already indexed, resolution below adds missing mechanics.","data_bomb":{"class":"white; reactive","attachment":"One per file or remote slave icon; compatible with Scramble IC. Not triggered by security tally; affects any accessing user icon.","detection":"Successful Analyze Icon against protected icon.","defuse":"Correct passcode or successful Disarm Data Bomb on detected IC (Files Test for file; Slave Test for device; Defuse utility). Failure leaves armed; retry risks tally. Success permits one access by that character only; repeat defusing for every further access, other users still trigger. No crash, tally increase for IC rating, or suppression required for successful defusal.","trigger":"Successful access System Test detonates; failed access does not. Automatically inflicts rating D icon damage, standard resistance and Armor Power reduction; IC crashes, rating added to tally unless suppressed. Cybercombat attack detonates immediately against attacker regardless of attack success; crash raises tally as usual."},"pavlov":{"inherits":"Data Bomb except listed changes.","damage":"rating M","crashes_on_trigger":false,"access_threshold":"floor(IC rating / 2); access fails unless System Test successes exceed threshold."},"scout":{"class":"white; reactive Probe until attacked or passive/active alert, then proactive","reactive":"GM rolls IC rating against Detection Factor on every intruder System Test; successes add to tally.","proactive":"Stops probing System Tests; defends by normal cybercombat. Probing Attack Tests deal no damage; each success adds one die to Security Value for next attack on intruder by another proactive IC. Additional probes accumulate up to Scout rating.","example_condition":"Bonus survives crashing Scout before next other IC attack; four successes add four dice in printed example."}}}
