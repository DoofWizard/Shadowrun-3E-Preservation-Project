headline: 'FASA7219 Target: Matrix SR3 pp74-75/PDF75-76: Zurich-Orbital chapter conditions'
summary: 'Attributed fictional host connection timing, account qualifications and compartmentation; explicit Game Information modifiers are not replaced.'
data:
  publication: {title: 'Target: Matrix', publisher: FASA, catalog_number: FASA7219, edition: Shadowrun Third Edition}
  chapter_narrator: RocketMan
  ground_station:
    outgoing_from_zurich_orbital_only: true
    guest_list_required: true
    incoming_transmissions_accepted: false
    station_database_isolated_during_ground_link: true
  connection_duration:
    minimum_seconds: 0.5
    maximum_minutes: 30
    depends_on: [ground station, traffic to be exchanged]
    qualification: 'Attributed chapter range; no uniform duration is specified by the explicit p124-125 rules.'
  priority_handoff:
    attributed_to: Red Wraith
    qualification: 'Priority status is restricted to transmissions to certain accounts; existing p124-125 Validate Account and handoff rules remain controlling.'
  host_structure:
    separate_sections: [Habitat, Corporate Court, Z-O Bank]
    habitat_command_and_control_isolated: true
    accessible_habitat_functions: [some maintenance functions, internal camera views]
    reported_sysop_assignments: {Clothos: Bank, Lachesis: Corporate Court, Atropos: Habitat}
    qualification: 'RocketMan reports these assignments; the explicit p124-125 Fates and Maenads mechanics are retained separately.'
