{"id":"rule.matrix.matrix-grid-security-response-p113-114","record_type":"rule","status":"source_reviewed","source":"source.matrix","printed_pages":"113-114","pdf_pages":"114-115","edition_scope":"FASA Corporation Matrix FASA7909, Shadowrun Third Edition fictional tabletop RPG, printed 113-114/PDF 114-115.","content_class":["rule_exact"],"framing":"reference_exact","headline":"Matrix tabletop grid security response and illustrative sheaves","summary":"Original Matrix supplement game mechanics, expanding the existing SR3 rules and source-specific advanced security summary.","data":{"rules":{"alert":"RTGs, LTGs and most PLTGs delay alerts. Random grid sheaves: only 10+ gives an alert; 8-9 becomes reactive or proactive gray IC.","response":"Passive alert on RTG/LTG: one security decker arrives at end of following Combat Turn. Backup request or active alert: one additional security decker arrives at end of each subsequent Combat Turn. Stats use SRComp p83.","shutdown":"No host-shutdown event on grid sheaves. At end of sheaf, additional IC construct or security decker arrives every Combat Turn until intruder dispatched.","carryover":"Tally generated on an RTG carries to connected LTGs and PLTGs, not another RTG. Matches core; retained as source-specific grid condition."},"sample_sheaves":{"note":"Illustrative, not mandatory; rows are printed p114 game profiles.","blue":[[6,"Probe-5"],[12,"Probe-6"],[18,"Scout-6"],[24,"Passive Alert; Security Deckers"],[30,"Tar Pit-5"],[36,"Ripper (mark-rip)-6"],[42,"Construct-8 (Killer-10, Probe-6)"],[48,"Active Alert"],[54,"Blaster-8"],[60,"Blaster-10"]],"green":[[5,"Probe-6"],[10,"Probe-8"],[15,"Scout-7"],[20,"Trace-7"],[25,"Passive Alert; Security Deckers"],[30,"Ripper (bind-rip)-7"],[35,"Trace-7 with trap Blaster-4"],[40,"Blaster-7"],[45,"Active Alert"],[50,"Construct-10 (Blaster-10, Trace-5, Crippler (acid)-5)"],[55,"Blaster-9"],[60,"Sparky-11"]],"orange":[[4,"Probe-8"],[8,"Scout-8"],[12,"Trace-8"],[16,"Probe-8 with trap Tar Pit-6"],[20,"Passive Alert; Security Deckers; Ripper (mark-rip)-8"],[24,"Scout-8 with trap Blaster-8"],[28,"Trace-12"],[32,"Construct-12 (Probe-4, Blaster-10, Ripper (bod-rip)-10)"],[36,"Blaster-10"],[40,"Active Alert; Scout-10 with trap Blaster-10"],[44,"Psychotropic Black IC-8"],[48,"Nonlethal Black IC-10"]],"red":[[3,"Probe-10"],[6,"Scout-10 with trap Crippler (marker)-8"],[9,"Trace-10 with trap Killer-8"],[12,"Passive Alert; Security Deckers; Ripper (mark-rip)-10"],[15,"Construct-14 (Killer-10, Ripper (bind-rip)-8, Scout-10)"],[18,"Trace-15"],[21,"Sparky-10"],[24,"Active Alert; Psychotropic Black IC-8"],[27,"Nonlethal Black IC-12"],[30,"Nonlethal Black IC-15"]]}}}
