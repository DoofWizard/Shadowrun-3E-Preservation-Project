id: rule.matrix.matrix-paydata-generation-defenses-p49-51
record_type: rule
status: ingested
source: source.matrix
printed_pages: '49-51'
pdf_pages: '50-52'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: 'FASA7909 Matrix (FASA Corporation, Shadowrun Third Edition fictional tabletop RPG): random Paydata Points and file defenses, printed pp49-51/PDF50-52'
data:
  publication: {title: Matrix, catalog_number: FASA7909, publisher: FASA Corporation, edition: SR3}
  extends: subsystem.matrix.paydata
  locate_requires_utility: Evaluate
  random_generation: optional GM method instead of determining specific fictional data
  points_and_size:
    Blue: {points: '1D6 - 1', size_per_point_Mp: '2D6 x 20'}
    Green: {points: '2D6 - 2', size_per_point_Mp: '2D6 x 15'}
    Orange: {points: '2D6', size_per_point_Mp: '2D6 x 10'}
    Red: {points: '2D6 + 2', size_per_point_Mp: '2D6 x 5'}
  download_required: true
  example: {security_code: Green, points_roll: 5, total_points: 3, locate_successes: 2, points_located: 2, size_rolls: [6, 12], file_sizes_Mp: [90, 180]}
  file_defenses:
    method: GM may specify defenses or roll 1D6
    columns: [none, scramble_IC, data_bomb_IC, worms]
    rows:
      Blue: ['1-3', '5-6', '-', '-']
      Green: ['1-2', '3-4', '5-6', '-']
      Orange: ['1', '2-3', '4-5', '6']
      Red: [Never, '1-2', '3-4', '5-6']
    unresolved: Blue roll 4 has no printed assignment; do not infer one.
    data_bomb_subtable: {die: 1D6, standard_data_bomb_IC: '1-4', Pavlov_IC: '5-6'}
    worms_table_printed_page: 116
  resale:
    final_price: Use ordinary fencing rules (SR3 p237).
    exception: Adventure-specific files have story-dependent time sensitivity; Mr. Johnson prices are usually set in advance.
  excessive_rewards: GM may reduce market value when flooded, apply penalties to Etiquette Skill, and introduce in-game consequences from interested groups; no fixed penalty value is specified.
