resolution:
  summary: "Long-distance Matrix communication between terrestrial, orbital and lunar locations may impose signal lag."
  earth_moon_example: "Communication between Earth and the Moon takes one full Combat Turn each way."
  reaction_effect: "At minimum, characters in the Matrix suffer -2 Matrix Reaction."
  severe_effect: "At the gamemaster's discretion for sufficiently long delays, a character may act only once every other Combat Turn."
  applicability: "The exact effect depends on communication distance and applies to Matrix interaction across the delayed link."

