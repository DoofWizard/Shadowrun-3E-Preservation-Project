id: rule.matrix.target-matrix-regional-haven-access-qualifications
record_type: rule
status: source_reviewed
source: source.fasa-7219
printed_pages: '39, 43-44, 46-47, 49-50'
pdf_pages: '40, 44-45, 47-48, 50-51'
edition_scope: 'FASA Corporation Target: Matrix (FASA7219), Shadowrun Third Edition fictional tabletop supplement; attributed, site-specific campaign access and host conditions, not universal Matrix rules.'
content_class: [rule_procedure]
framing: reference_exact
headline: 'FASA7219 Target: Matrix (SR3), fictional regional haven access and architecture, pp39, 43-44, 46-47, 49-50 / PDF40, 44-45, 47-48, 50-51'
summary: 'Attributed Azziewatch, Kalinin, Manchester and Morgue access and architecture qualifications, preserving frequency, cost, eligibility and scope without inventing tests.'
data:
  publication: {title: 'Target: Matrix', publisher: FASA Corporation, catalog_number: FASA7219, edition: Shadowrun Third Edition, source_id: source.fasa-7219, original_pdf_sha256: dc9fbba78b9eb5efc60941213a90dfa0be190275dc92ea671631ddb7db154c4b}
  azziewatch:
    printed_page: 39
    pdf_page: 40
    speaker: FastJack
    san_location: Hidden in the public Matrix host of an individual FastJack describes as unreal, somewhere on the fictional Texas grid.
    typical_approximate_san_relocations_per_week: 3
    relocation_qualification: More frequent relocation when Midnight Angel is especially concerned about security.
    security: Described as tight, with predominantly gray IC; no rating specified.
    admission_lineage: rule.matrix.target-matrix-azziewatch-admission-p39
  kalinin:
    printed_pages: '43-44'
    pdf_pages: '44-45'
    speaker: Zarya
    grid_classification: LTG
    classification_condition: Kalinin's operators also operate the Konigsberg RTG; the LTG is not publicly advertised.
    special_service_terms: Some additional free Matrix services for residents and special access rates for BEPRC; amounts not given.
    corporate_access:
      formally_barred: false
      affected_employees: Saeder-Krupp and most Japanacorps.
      typical_access_fee_multiplier: 2
      other_reported_tactics: Excess charges presented as accidental and incorrectly programmed searchbots.
      qualification: These are common discriminatory practices described for this haven, not an automatic surcharge on all corporate users.
    connection_report:
      speaker: Leggy
      condition: Rough spots especially at links to neighboring countries.
      possible_effects: Sudden power surges or drastic sim-peak drops; no numerical test or modifier specified.
  manchester:
    printed_pages: '46-47'
    pdf_pages: '47-48'
    speaker: Diamond Jack
    admission_policy: The fictional haven explicitly bars Humanis, Protestant paramilitaries and other pro-fascist anti-metahuman supporters.
    policy_exception:
      speaker: Searchlight
      claim: Some such supporters have concealed their views and infiltrated anti-Tir political groups; actual exclusion is not guaranteed.
    san_location: Hidden within the fictional British LTGs.
    san_relocation_frequency: daily
    linked_host_count_approximate: 12
  morgue:
    printed_pages: '49-50'
    pdf_pages: '50-51'
    speaker: Dances-with-Credsticks
    mrg_entry:
      public_san_location: Singapore City LTG.
      authorized_client_access: Clients lease browsing time for specified archive sections.
      dedicated_sans: Each of the source-period Big Eight megacorporations has a dedicated SAN from one of its corporate hosts into the MRG.
    morgue_sans:
      simultaneous_count_options: [2, 3]
      scope: SANs leading into and out of the fictional Morgue; not a separate count for each direction.
      relocation_frequency: daily
      stationary_sans: false
    singapore_icon_restriction:
      speaker: Noodle Boy
      condition: The fictional Online Harmony Act applies to icons displaying material the Singapore sysadmins deem offensive, commonly vulgarity, nudity or violent images.
      reported_consequence: Sysadmins may remove and do remove such users from Singapore grids.
    related_game_information: rule.matrix.target-matrix-helix-morgue-access-p121-122
  scope_limit: Existing p120-122 admission, virtual-machine and icon/Guide procedures remain authoritative and are not restated; no new fixed target numbers, IC ratings or universal modifiers inferred.
