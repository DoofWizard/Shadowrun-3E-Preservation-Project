{"id":"rule.matrix.matrix-security-sheaf-generation-p112-115","record_type":"rule","status":"source_reviewed","source":"source.matrix","printed_pages":"112-115","pdf_pages":"113-116","edition_scope":"FASA Corporation Matrix FASA7909, Shadowrun Third Edition fictional tabletop RPG, printed 112-115/PDF 113-116.","content_class":["rule_exact"],"framing":"reference_exact","headline":"Matrix tabletop random security sheaf generation and IC selection","summary":"Original Matrix supplement game mechanics, expanding the existing SR3 rules and source-specific advanced security summary.","data":{"generation":{"trigger_increment":"Roll 1D6 divided by 2; apply security-code modifier; add to previous threshold. Core rule retained.","trigger_table":[["Blue",4,"5-7"],["Green",3,"4-6"],["Orange",2,"3-5"],["Red",1,"2-4"]],"event_roll":"Roll 1D6 plus number of previously passed steps at current alert level; use current alert column.","alert_table":{"columns":["no alert","passive alert","active alert"],"rows":[["1-3","reactive white","proactive white","proactive gray"],["4-5","proactive white","reactive gray","proactive white"],["6-7","reactive gray","proactive gray","black"],["8+","passive alert","active alert","shutdown"]]},"alert_transition":"Blue/Green advance to next trigger step at new alert level; Orange/Red additionally roll IC at same step. Shutdown refers to host shutdown.","ic_sequence":"Determine specific IC via indicated 1D6 or 2D6 table; then rating and appropriate options. GM may use tables as guidelines rather than randomization, with high rolls generally more challenging."},"ic_selection":{"reactive_white":{"dice":"1D6","rows":[["1-2","Probe"],["3-5","Trace"],["6","Tar Baby"]]},"proactive_white":{"dice":"2D6","rows":[["1-5","Crippler"],["6-8","Killer"],["9-11","Scout"],["12","Construct"]],"note":"Printed lower endpoint 1 is impossible on 2D6; preserve without correction."},"reactive_gray":{"dice":"1D6","rows":[["1-2","Tar Pit"],["3","Trace with trap"],["4","Probe with trap"],["5","Scout with trap"],["6","Construct"]],"trap":"Determine trap type on Trap IC Table, then ratings for both programs."},"proactive_gray":{"dice":"2D6","rows":[["2-5","Ripper"],["6-8","Blaster"],["9-11","Sparky"],["12","Construct"]]},"black":{"dice":"2D6","rows":[["2-4","Psychotropic"],["5-7","Lethal"],["8-10","Non-Lethal"],["11","Cerebropathic"],["12","Construct"]],"psychotropic":"GM chooses or rolls 1D6: 1-2 Cyberphobia; 3 Frenzy; 4 Judas; 5-6 Positive Conditioning."},"crippler_ripper":{"dice":"1D6","rows":[["1-2","Bod"],["3","Evasion"],["4-5","Masking"],["6","Sensor"]],"procedure":"Roll target attribute then program rating."}},"constructs":{"limit":"Combined IC ratings at most twice Frame Core Rating.","procedure":["Determine Frame Core Rating using IC Rating Table.","Roll twice on Alert Table for two IC types; generate each program and rating normally.","Roll 2D6 on Proactive IC Options Table for entire construct.","Generate further IC one at a time until combined rating equals or exceeds twice Frame Core Rating.","If above payload, reduce randomly selected IC rating until total equals payload."]},"gm":{"security_deckers":"Not part of random IC tables. GM determines presence; generally systems with patrols, potentially multiple deckers at sensitive sites. Usually alerted on active alert; chance patrol encounters possible. Stats use Creating Prime Runners, SRComp p83.","adjustments":"GM may change unrealistic or unbalanced generated results; examples include no Trace after jackpoint already located and avoiding Black IC for an ordinary Blue host. IC rating supplies Damage Resistance TN, so balance against decker defenses.","additional_features":"2D6 on Nasty Surprises Table, p116."},"worked_example":{"host":"Orange-7/11/14/13/14/13","first_threshold":3,"tally_after_logon":2,"tally_after_index_test":4,"event_die":4,"ic_type_roll":7,"ic":"Killer","ic_rating_roll":8,"ic_rating":7,"option_roll":6,"option":"Cascading","later_thresholds":[6,8],"later_tally":9,"source_discrepancies":["The p113 example uses +2 for initial Orange threshold then +1 for later steps, unlike the constant +2 in p115 table.","p112 prose says roll 1D6 for IC Rating, but p113 worked example and p116 table use 2D6. Preserve both; no precedence invented."]}}}
