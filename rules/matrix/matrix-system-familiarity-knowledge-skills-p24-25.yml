data:
  publication: {title: Matrix, publisher: FASA Corporation, catalog: FASA7909, edition: Shadowrun Third Edition}
  procedure:
    trigger: Entry into a grid or host of the type covered by the character's System Familiarity Knowledge Skill.
    test: System Familiarity Skill Test
    target_number: System Security rating
    action_required: false
    additional_hacking_pool_dice_per_success: 1
    duration: Current stay in that system only.
    maximum_additional_dice: Original Hacking Pool
    tests_per_stay: 1
    reentry: Repeat the test after leaving and returning.
    knowsoft_test_modifier: 4
    specialization_examples: [owner, maker, Security Code color]
    other_system_types: GM may allow skills for additional types.
  named_types:
    Automated Factory: Hosts primarily controlling automated or robotic production.
    Cellular Network: Matrix hosts of cellular networks.
    Chat Room: Social and meeting hosts, persona clubs and message boards.
    Chokepoint: Checkpoint hosts such as firewalls and killing jars.
    Communication Satellite: Data-traffic satellites and constellations; excludes orbital habitat and factory hosts.
    Data Archive: Database and archive hosts; may assist data-oriented Search Tests (p124).
    Game Host: Commercial virtual-reality game hosts.
    LTG: LTGs and potentially PLTGs; GM may require separate skill for proprietary private networks.
    Matrix Bank: Hosts handling virtual bank accounts and credit transactions.
    RTG: RTG operations.
    Security Network: Hosts monitoring or controlling an installation's security.
  relationship: Extends Hacking Pool rules; see source.matrix p26 and rules/dice-pools/hacking-pool.yml. No second base pool or refresh rule implied.
framing: reference_exact
