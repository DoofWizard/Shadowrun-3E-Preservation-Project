headline: 'FASA7219 Target: Matrix (SR3), fictional Nexus chapter access and use, pp31-34 / PDF32-35'
summary: 'FASA Corporation source-period descriptions of gateway hosts, security-decker conditions, separate exit SANs and contribution expectations; retains attributed comments and the distinct explicit p121 rules.'
data:
  publication:
    title: 'Target: Matrix'
    publisher: FASA Corporation
    catalog_number: FASA7219
    edition: Shadowrun Third Edition
    source_id: source.fasa-7219
    original_pdf_sha256: dc9fbba78b9eb5efc60941213a90dfa0be190275dc92ea671631ddb7db154c4b
  chapter_attribution: 'In-world chapter account, not a universal game-resolution rule.'
  gateways:
    printed_page: 31
    pdf_page: 32
    required_network: Shadow Matrix PLTG
    destination_network: Separate Nexus PLTG
    gateway_count: A few at any one time; no fixed number stated.
    gateway_type: All are vanishing SANs; some have appeared behind trapdoors in Shadowland nodes connected to the Shadow Matrix.
    destination: Killing jar host, not directly the Nexus PLTG.
    location_comment:
      speaker: Red Wraith
      claim: The Nexus regularly relocates the SANs, limiting the usefulness of indexing records.
  killing_jars:
    printed_page: 32
    pdf_page: 33
    inbound_san: One-way into the killing jar.
    outbound_san: A single heavily protected SAN leads to the Nexus.
    ic_activation: Active IC constructs remain on standby until Nexus staff command them to attack.
    visitor_resolution: The security decker scans the visitor and escorts an accepted visitor into the Nexus; otherwise the decker releases the IC constructs.
    comments:
      - {speaker: Ward, claim: Security deckers carry a passkey that exempts them from IC attacks.}
      - {speaker: Manticore, claim: Passcodes change frequently at irregular intervals; passcode and passkey formats change semi-frequently; passcodes are specific to a killing jar or user.}
    exit: The chapter describes twelve separate one-way exit SANs to the Shadow Matrix, bypassing the killing jars.
  use_conditions:
    printed_page: 34
    pdf_page: 35
    eligibility: Users who can reach the Nexus and contribute data to the Heap may use it.
    contribution: Regular paydata contributions are expected in principle but rarely enforced in practice.
    topology: The interlinked host architecture changes continually; a datapath need not lead to the same place on subsequent visits.
  lineage:
    existing_game_information: rule.matrix.target-matrix-data-havens
    disposition: Retain the explicit p121 admission and alert rules; these are additional attributed chapter qualifications and do not specify fixed target numbers, tests or IC ratings.
