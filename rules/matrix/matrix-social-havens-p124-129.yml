headline: Matrix social and archive contact acquisition (FASA7909, SR3 fictional tabletop RPG)
summary: FASA Corporation, Matrix FASA7909, Shadowrun Third Edition, pp124-129/PDF125-130. Fictional tabletop contact extension; existing core social and contact rules remain unchanged.
data:
  legacy_comparison: 'rules/matrix/information-searches.yml blob 47317822cf0c940dce735d937a22078f347ad00c already describes Etiquette and reputation; it omits the archive contact modifiers and upkeep rules below.'
  social_tests:
    skill: Etiquette (Matrix)
    GM_modifier_basis: Reputation, credibility, outstanding favors and agreements rather than visible physical appearance, race or demeanor.
    npc_contacts: Ordinary SR3 contact selection and levels apply. Optional Shadowrun Companion friends-of-friends and Wrong Party rules may apply.
  underground_archive_contact:
    upkeep_contact_level: 2
    high_level_source_optional_upkeep_level: 3
    high_level_example: Nexus
    etiquette_matrix_search_TN_modifier: -2
    wrong_party_additional_dice: 2D6
    base_time: 2D6 hours
    time_resolution: Divide by extra successes.
    costs_and_obligations: Contact purchase and upkeep costs represent the access knowledge and codes needed to locate and enter the fictional archive, and the time and effort needed to keep that knowledge current. The GM may require barter, favors or markers.
    purchase_as_matrix_contact_allowed: true
    typical_periodic_contribution: Most Shadowland-type fictional archive operations require periodic contributions to the archive; a character with such a contact should expect to contribute paydata occasionally. No fixed interval is specified.
  legitimate_pay_or_private_database_contact:
    upkeep_contact_level: 1
    extensive_use_exception: GM may increase upkeep costs.
    etiquette_matrix_search_allowed: false
    alternate_resolution: Computer skill specific-area Search Test.
    purchase_as_matrix_contact_allowed: true
