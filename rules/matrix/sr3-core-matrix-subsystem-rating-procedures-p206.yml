    source_id: source.sr3-core
    original_pdf_sha256: 7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914
    kind: published fictional tabletop role-playing game
  original_page:
    printed: 206
    physical_pdf: 215
    section: The Matrix / System Ratings / Subsystem Ratings and Rating Format
  system_access:
    authorized_users: A high subsystem rating does not itself prevent an authorized in-game user from operating the subsystem.
    passive_alert_subsystem_modifier: 2
    passive_alert_trigger: After Passive Alert has been activated, all five subsystem ratings increase by +2 (original p206
      refers to p211).
    scope: Modifier applies to Access, Control, Index, Files, Slave; no alteration to Security Code or Security Value stated
      here.
  subsystem_contests:
  - name: Access
    function: Unauthorized logon to a grid or host
    test: Intruding decker Computer Skill opposed against the grid/host Access Rating in a Success Contest.
  - name: Control
    function: Unauthorized administrative or remote management commands such as disconnecting a legitimate user
    test: Success Contest against host Control Rating.
  - name: Index
    function: Unauthorized searching for system addresses and files
    test: Success Contest against Index Rating.
  - name: Files
    function: Unauthorized reading or writing of datastores; encoded file decryption or output to external devices
    test: Success Contests against Files Rating; source additionally requires tests to decrypt encoded files and output to
      devices.
  - name: Slave
    function: Control of devices managed by a host such as in-fiction cameras and elevators
    test: Success Contest against Slave Rating.
  rating_notation:
    format: Security Code-Security Value/Access/Control/Index/Files/Slave
    acronym: ACIFS
    original_example: Red-6/10/12/10/9/9
    original_example_values:
      security_code: Red
      security_value: 6
      Access: 10
      Control: 12
      Index: 10
      Files: 9
      Slave: 9
  reused_canonical:
  - rules/matrix/system-ratings.yml
  - rules/matrix/sr3-core-na-rtg-system-ratings-p202-203.yml
  gap_filled: Original p206 adds five subsystem functions and Passive Alert +2 conditional adjustment beyond earlier generic
    summary/table.
