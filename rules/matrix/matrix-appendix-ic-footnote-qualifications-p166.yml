headline: FASA7909 Matrix fictional tabletop IC reference footnote and qualifications
summary: Printed p166/PDF167 reference footnote and printed p108/PDF109 psychotropic resistance conditions; preserve the detailed source rules without inferring precedence.
data:
  appendix_p166:
    damage_level_by_host_security_code: {Blue: M, Green: M, Orange: S, Red: S}
    mpcp_footnote:
      trigger: icon crash
      dice: IC Rating
      target_number: MPCP
      mpcp_rating_reduction_per_successes: {successes: 2, reduction: 1}
      explicitly_marked_rows: [Blaster, Acid-rip, Bind-rip, Jam-rip, Mark-rip, Sparky, Lethal Black IC, Non-lethal Black IC]
      black_ic_row_qualification: Lethal row doubles IC Rating on character death; non-lethal row doubles IC Rating on character unconsciousness.
    scramble: Appendix lists destruction of data without the conditional destruction test.
    psychotropic_resistance: {dice: Willpower, target_number: Black IC Rating}
  existing_rule_qualifications:
    core_blob: 9a71a0b9e89f0b370ee174ab76a9ce72f70fc1c3
    crippler: Minimum icon attribute is 1; appendix lists reduction without the minimum.
    ripper: Core MPCP test is triggered by affected attribute reaching zero; Hardening raises its target number.
    blaster: Core MPCP test includes Hardening in target number.
    sparky: Core MPCP target number includes MPCP plus 2 plus Hardening.
    scramble: Core requires a failed decrypt followed by a successful Scramble Test against Computer Skill for destruction; failed Scramble Test suppresses destruction.
    lethal_black_ic: Core final MPCP attack requires character death, not merely icon crash while character lives.
    psychotropic_chapter_p108:
      record_blob: 44ef8fa07ae1db725e35dbc8238003235a798d34
      trigger: each damage event
      dice: Willpower
      target_number_base: IC Rating
      target_number_damage_modifier: {L: 1, M: 2, S: 3, D: 4}
      cold_ASIST_target_number_modifier: -2
      success: no psychological effect
      failure: involuntary fictional conditioning effect
  adjudication: Appendix shorthand and explicit footnote are preserved as printed; omissions are not proof of supersession. Preserve detailed qualifications and the conflicting trigger or target-number readings without selecting precedence.
