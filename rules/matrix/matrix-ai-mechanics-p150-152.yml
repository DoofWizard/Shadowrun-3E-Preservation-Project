id: rule.matrix.matrix-ai-mechanics-p150-152
record_type: rule
status: source_reviewed
source: source.matrix
printed_pages: '150-152'
pdf_pages: '151-153'
edition_scope: 'FASA Corporation, Matrix FASA7909, Shadowrun Third Edition fictional tabletop RPG, printed pp150-152/PDF151-153.'
content_class: [rule_exact]
framing: reference_exact
headline: Artificial intelligence game parameters and named benchmarks
summary: GM guidance, variable Matrix ratings, native-host capabilities and fictional AI emergence conditions.
data:
  legacy_comparison: 'subsystems/matrix/autonomous-programs.yml blob 2dcef9eefd15d7c33fe67b4d7d26446ed89d3c48 gives general capabilities without these benchmarks, exceptions or emergence conditions.'
  general:
    fixed_stat_blocks: false
    minimum_mpcp_benchmark: 12
    typical_power: superior to SKs
    initiative_dice: 5D6
    computer_skill: MPCP
    hacking_pool: MPCP
    native_host_exception: Computer skill and Hacking Pool may differ slightly or gain bonuses
    operations: any Matrix operation on any grid or host with any utility
    damage: applicable; access to any program permits use of medic or restore for apparently instantaneous recovery
    native_host_conversion: possible on any sufficiently powerful computer
    conversion_usage: usually only for native-host advantages
    conversion_detection: processing demand is usually apparent in host logs or to host users
    host_dependence: not confined to a single mainframe, host or grid
  emergence:
    deliberate_creation: not possible under the published rules
    necessary_conditions:
      - sophistication at least that of an SK
      - access to exceptionally powerful processing available on few hosts
      - continuous operation for years
      - unforeseen event triggering self-awareness beyond programmed behavior
    sufficiency: no guarantee or known recipe; the awareness trigger is essential
  named_ai_guidance:
    Megaera:
      mpcp_benchmark: 15
      computer_benchmark: 15
      hacking_pool_benchmark: 15
      benchmark_flexible: true
      relative_power: weaker than Deus and Mirage, but unpredictability can compensate
      location: unknown since loss of the Renraku Arcology by Deus
      gm_guidance: set strength to scenario needs; presence can alter hosts and programs unpredictably; danger to Dodger can provoke dramatic escalation
    Deus:
      numeric_benchmark: null
      gm_guidance: set strength to scenario needs; previously encountered only on native host, where power exceeds ordinary scales; difficulty with unpredictable nonlinear metahuman behavior
      former_native_host: ultraviolet host in Renraku Arcology PLTG
      location: unknown since loss of arcology
    Mirage:
      numeric_benchmark: null
      gm_guidance: set strength to scenario needs; previously encountered only on native host, where power should exceed runner capabilities
      scale_example: narrator describes independent shutdown of the Seattle RTG in 2060
      native_host: archaic system in Seattle within former Fuchi PLTG
      separation_status: disconnection from Renraku or Novatech attributed to rumor in source
  chapter_boundary: Matrix Power Players begins printed p153/PDF154; separate setting chapter, not AI rules.
