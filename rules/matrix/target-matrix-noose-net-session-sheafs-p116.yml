headline: 'FASA Target: Matrix (SR3) Chicago Noose Net session-specific randomized sheaf rules, printed p116/PDF117'
summary: 'Original FASA7219 Game Information: the fictional damaged Chicago grid does not have a single typical
  sheaf; the GM determines ratings, trigger steps and sheaf separately at each logon/session, with Orange base for
  security.'
data:
  publication:
    title: 'Target: Matrix'
    publisher: FASA Corporation
    catalog_number: FASA7219
    edition: Shadowrun Third Edition
    source_id: source.fasa-7219
    original_pdf_sha256: dc9fbba78b9eb5efc60941213a90dfa0be190275dc92ea671631ddb7db154c4b
    source_type: published fictional tabletop roleplaying game supplement
  original_section: Game Information / Grids / Chicago Noose Net
  original_printed_page: 116
  original_physical_pdf_page: 117
  setting_scope: Only Chicago Noose Net in the fictional Shadowrun setting; not an automatic procedure for all RTGs
  independent_session_roll_rule:
    condition: Every time a character logs on to Chicago Noose Net
    security_rating: The game master randomly determines the grid security rating at Easy Intrusion Difficulty,
      by the original SR3 reference
    security_sheaf: The game master randomly determines trigger steps and the security sheaf at the beginning of
      each session; use Orange as the base security level
    simultaneous_session_exception: Different characters logged in at the same time may have different security
      sheafs; Noose Net has no one typical sheaf
    reference_only: Random-generation procedures are in original FASA7001 SR3 Intrusion Difficulty and FASA7909
      Matrix security rules, not repeated here or redefined
  lineage:
