data:
  publication:
    title: 'Target: Matrix'
    publisher: FASA Corporation
    catalog_number: FASA7219
    edition: Shadowrun Third Edition
    original_pdf_sha256: dc9fbba78b9eb5efc60941213a90dfa0be190275dc92ea671631ddb7db154c4b
  login_exceptions:
    printed_page: 39
    attributed_to: ASDF
    trigger: A visitor or newly created account logs on and the automatic trace returns a blacklisted jackpoint or MXP address.
    effects: Account termination, active alert and proactive defenses.
    verified_account_exception:
      attributed_to: Saltlander
      condition: Account verified by the sysops.
      effect: Trace procedure is omitted.
    blacklist_policy:
      attributed_to: ik@wij.helix.nl
      description: Recent hostile users, addresses of unfriendly organizations, and addresses disliked by administrators may be blacklisted.
  host_security:
    printed_page: 40
    attributed_to: ASDF
    usual_color_range: [Green, Red]
    exception: Some hosts have higher security, with entry generally limited to intended users.
    subsystem_tendencies: Index and Files usually low, Control described as high to prevent tampering.
    fixed_numeric_ratings: null
    appearance_qualification:
      attributed_to: Black Isis
      description: Sculpted appearance is not a reliable indicator of defensive strength.
  registered_account_names:
    printed_page: 41
    attributed_to: XpBowe78dfd
    policy: Registered users can select and readily change their account names.
  paydata_identity:
    printed_page: 41
    attributed_to: Tracker
    claim: Each item of paydata has a unique ID and a Helix database links it to the uploader; commentator reports that this may identify the source of a leak or data theft.
    certainty: In-world claim, not an automatic game-resolution result.
  selected_host_conditions:
    printed_page: 42
    binary_dreams: Virtual shop provides a utility-testing range; Nova reports occasional beta copies for outside testing and possible bugs, not a guaranteed service.
    hecatombe: Combat arena is separate from the audience host; arena security levels can be adjusted for the match. Leagues differ; no universal rating or wager is specified.
    rubble_heap: Residents are encouraged to deposit discarded data rather than delete it; other users may access it. No fixed retrieval test or time is specified in this chapter.
