headline: Matrix FASA7909 living persona rules, printed pp137-139
summary: FASA Corporation Shadowrun Third Edition fictional tabletop RPG living persona and channel mechanics, printed pp137-139/PDF138-140; includes source example qualifications.
data:
  legacy_comparison: 'subsystems/matrix/otaku.yml blob 5ca1f878a1ff9428f66259d8093d927b757d9d15 summarizes the persona framework without these explicit modifiers, restrictions and damage procedures.'
  detection_factor: 'floor((Masking + Sleaze) / 2) + 1'
  system_familiarity_test_TN_modifier: -1
  using_living_persona:
    icon: Idealized physical appearance by default; alternate appearance requires an icon complex form with size multiplier 2.
    implants_and_spells: Mental attribute improvements from implants also improve corresponding persona attributes; Mental attribute spells may affect persona and Hacking Pool. Cosmetic Charisma improvements such as tailored pheromones do not improve persona Charisma.
    ASIST: Treat as hot interface; no extra hot-ASIST or pure-DNI Reaction/Initiative bonuses.
    reality_filter: No equivalent available.
    reaction: Intelligence; total Matrix Initiative dice 4D6; no direct cyberware or bioware Matrix Reaction or Initiative bonuses.
    persona_modes: No switching of attribute allocation.
    memory: Channels and complex forms require neither active nor storage memory and are always active; file manipulation still requires storage hardware.
  cybercombat_damage:
    gray_IC: Persona icon Condition Monitor damage also applies to the otaku Stun Condition Monitor.
    black_IC: Physical damage as for deckers.
    gray_ripper_IC: Reduced persona attribute persists until healed; apply Bioware Stress Repair (Man and Machine p130), one Stress Point per rating point lost.
    stress_repair_example: {persona_attribute: Sensor, rating_loss: 3, stress_points: 3, stress_damage_level: Moderate}
    attribute_crashed_to_zero: Reduce associated Mental attribute or attributes by 1 until persona rating recovers to half original rating. Examples establish Evasion 6 recovery threshold 3 with Intelligence reduced by 1, and Masking 7 recovery threshold 4 with both Willpower and Charisma reduced by 1.
    worms: No effect on living personas.
  improvement: Increasing Mental attributes with Karma increases linked persona ratings; submersion may also improve persona.
  SOTA: Always current; no action on SOTA advancement required.
  jackpoints: All wired jackpoints except maser power grids; wireless use requires suitable external interface.
  using_channels:
    system_test_TN_reduction: Appropriate channel rating substitutes for operational utility rating.
    locate_paydata_example: {test: Index, target_number: 'host Index rating minus otaku Index channel rating'}
    memory_cost: 0
    immunity: Channels are not programs and are unaffected by tar IC and utility-targeting programs such as hog.
    immunity_example: Use of the Control channel in the presence of tar baby IC does not trigger that IC.
