  visitor_chapter_policy:
    printed_page: 40
    guest_account: Full trace precedes access to the full PLTG.
    restrictions: Some hosts refuse entry; uploads including file comments are forbidden, and downloads reserved for registered users or residents are unavailable.
    scope: Chapter access policy; retain the separate p121 Upload Data operation qualification.
  registered_services:
    printed_page: 41
    host_access: Host owners may still deny entry.
    public_upload: Registered users may upload data to public areas for download.
    communications: Account or blind email drop, and anonymous forwarding, are available.
    timed_storage:
      eligibility: Registered users may rent storage.
      trigger: Data not accessed by an authorized user within the agreed period.
      disposition: Forward to designated location or erase, according to instructions.
      fixed_duration: null
      fixed_fee: null
    disputed_retention: In-world commentator Tokus reports a rumor that copies are retained; sysops deny it. No retention rule is established.
  resident_qualification:
    printed_page: 41
    attributed_to: ik@wij.helix.nl
    account_variation: Operations, access and storage allowances vary by resident; greater privileges may be granted for demonstrated merit, or reduced for failing administrators' expectations.
    fixed_modifier: null
