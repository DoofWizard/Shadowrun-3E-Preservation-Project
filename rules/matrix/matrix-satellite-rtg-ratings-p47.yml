  null_meaning: Original scan is damaged; unknown ratings or modifiers are not zero and are not playable defaults.
  constellation_conditions:
    topology: Satellite RTGs usually have no subordinate LTGs; each orbital habitat owned by the provider is an exception and is included as an LTG. Individual satellites may have their own directly reachable hosts.
    access: Apply the named constellation density modifier to the fictional Computer (Hardware) satellite link test described on printed p34.
    security_tally: A user's tally on a satellite RTG carries over to any other RTG subsequently accessed; a tally generated on an RTG also carries over when the user accesses a satellite RTG.
