resolution:
  summary: "Cyberdecks are defined by MPCP and related hardware ratings/capacities. The MPCP limits persona-program ratings and contributes to deck functions; persona programs provide Bod, Evasion, Masking and Sensors, while deck hardware includes Hardening, Active Memory, Storage Memory, I/O Speed and Response Increase."
