      availability_target_number: 8
      availability_time_days: 14
      street_index: 2
    - rating_range: 10+
      price_nuyen_formula: Design program size in Mp × 1000
      availability_target_number: 16
      availability_time_days: 30
      street_index: 3
    price_basis: Published values include both program object code and a copy of source
      code.
    object_code_only: Reduce price by 25 percent for a copy of object code only.
    existing_occ_burned_code: If the object code has already been burned on an OCC,
      add 10 percent to the cost; the source does not specify a special discount
      ordering.
    program_options_rating: Option ratings do not change this price table.
    special_availability: Agents, IC constructs and IC programs have both the Availability
      target number and time period doubled.
    upstream_dependency: Use original Matrix program Design Size in Mp and rating;
      neither actual compressed size nor options are assumed as substitutes for Design
      Size.
  verifying_program_contents:
    scope: Character checks a purchased fictional game program for its identity, rating
      and optional features.
    online_method: Successful Analyze Icon operation while in the fictional Matrix.
    offline_method:
      skill_test: Computer (Programming) Test
      target_number: 4
      memory_requirement: Cyberterminal must have enough memory to hold the analyzed
        program.
      base_time: 5 minutes per Mp of program size
      information_by_number_of_successes:
        '1': Nature of program and its actual size in Mp
        '2': Program rating
        '3': One programming option
        '4': Rating of one option
        5+: Further option identities or option ratings, one per additional success
      repeat_check: After a successful test, character may rerun the test with a +2
        target-number modifier to learn further information.
