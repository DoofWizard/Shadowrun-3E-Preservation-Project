  helix_account_tiers:
    visitor:
      access: Visitor-level personal account permissions, limited host access
      allowed: Read permitted files and download available items
      restrictions: Upload Data operations do not automatically succeed; Download Data succeeds only for
        items available to the visitor
    registered:
      access: Normal personal-account privileges; not traced on login
      admission: Registration requires background check and good references, according to source continuation
        on printed p122
    resident:
      access: Can create a house host and has almost unrestricted actions inside Helix
      admission: Administrators only grant resident privileges after knowing the character, trusting their
        decking skill and reputation; not automatic merely for having a registered account
    privilege_scope: Individual host owners may set additional upload/download limits for their own hosts
  morgue_access:
    find: Locate the remote datastore and determine whether it is a virtual machine, then locate the SAN
      to reach the data haven
    authorized: Passcodes can only be obtained after a current Morgue user vouches for an applicant and
      a substantial background check is passed
    without_passcode: The source states access must be forced, but does not supply a unique target number
      or universal fixed test here
    source_scope: Morgue data haven in fictional Singapore, not all data havens
  related_prior_record: rules/matrix/target-matrix-data-havens.yml
  distinct_missing_prior_fields:
  - Helix registered-user background/reference gate and resident account prerequisites
  - Helix resident house host and near-unrestricted permission distinction
  - Morgue vouching/background-check access and remote datastore/SAN discovery sequence
  no_invented_mechanic: No numeric test target or grant guarantee is specified in this original range;
    any other tests remain GM adjudicated
