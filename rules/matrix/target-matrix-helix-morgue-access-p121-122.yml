headline: 'FASA Target: Matrix (SR3) Helix account tiers and Morgue restricted access, printed pp121-122/PDF122-123'
summary: Source-specific account permissions and social-gate procedures for the fictional Helix and Morgue
  data havens; retains conditional access without inventing fixed target numbers.
