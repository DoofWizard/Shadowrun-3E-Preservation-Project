    edition: Shadowrun Third Edition
    printed_page: 98
    physical_pdf_page: 99
  scope: Behind the Badge / Game Information / New IC / Snitch Psychotropic Black IC
  name: Snitch Psychotropic Black IC
  source_comparison: Similar to Judas IC, Matrix p108; use Judas rules for programming size and game purposes.
  target_effect: Involuntary subliminal compulsion in a fictional character to report apparent wrongdoing secretly; the character is unaware of the compulsion and denies reporting if confronted.
  known_activity_scope: The descriptive paragraph includes known upcoming and recently committed activity; no fixed time interval is specified.
  recipient_scope: The fictional conditioned character seeks an authority with jurisdiction over the act or authority over those affected by it.
  subject_scope: Reports can concern the conditioned character, friends or acquaintances; these relationships do not exempt the character from the compulsion.
  game_test:
    secrecy: GM rolls secretly
    trigger: Whenever the affected character has an opportunity to report criminal activity.
    attribute: Willpower
    target_number: Snitch IC Rating
    success: Resists compulsion on that opportunity but remains unaware of inner conflict.
    failure: Character reports under the recipient scope while unaware of the compulsive conditioning.
  original_wording_conflict: The original descriptive paragraph says legal activities while subsequent text explicitly describes criminal acts and wrongdoing; neither statement is silently corrected.
  scope_boundary: p98 contains no new standalone Snitch damage code, rating, or program size number; defer to printed Judas IC cross-reference without inventing values.
