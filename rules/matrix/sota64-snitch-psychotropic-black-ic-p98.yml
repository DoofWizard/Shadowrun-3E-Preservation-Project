  scope: Behind the Badge / Game Information / New IC / Snitch Psychotropic Black
    IC
  name: Snitch Psychotropic Black IC
  source_comparison: Similar to Judas IC, Matrix p108; treat exactly like Judas for
    programming size and game purposes
  target_effect: Subliminal compulsion to secretly report apparent wrongdoing to authority
    figures with jurisdiction; character does not recognize compulsion and denies
    reporting if confronted
  game_test:
    secrecy: GM rolls secretly
    trigger: whenever affected character can report criminal activity
    attribute: Willpower
    target_number: Snitch IC Rating
    success: Resists compulsion on that opportunity but remains unaware of inner conflict
    failure: Character reports to relevant authority while unaware of compulsive conditioning
  original_wording_conflict: The original descriptive paragraph says legal activities
    while subsequent text explicitly describes criminal acts and wrongdoing; neither
    statement is silently corrected.
  scope_boundary: p98 contains no new standalone Snitch damage code, rating, or program
    size number; defer to printed Judas IC cross-reference without inventing values.
