id: rule.matrix.partial-construction-hardwiring-p62
record_type: rule
status: source_reviewed
source: source.matrix
printed_pages: '62'
pdf_pages: '63'
edition_scope: FASA Corporation Matrix (FASA7909), Shadowrun Third Edition fictional tabletop RPG.
content_class: [rule_procedure]
framing: reference_exact
headline: Matrix partial construction, hardwiring and upgrading
summary: Original component purchase and hardwired construction exceptions on printed page 62.
data:
  partial_construction:
    purchased_software_cost: programming cost (p78)
    pre_cooked_OCC_cost_multiplier: 1.1
    purchase_risk: The fictional source notes potentially unreliable or damaging code in externally supplied components.
  hardwiring:
    installation_base_time_multiplier: 2
    installation_parts_cost: floor(normal parts cost * 0.5)
    separate_unit_cost: unchanged
    casing: custom casing, purchased separately, with 10 percent markup per hardwired unit
    MPCP_self_hardwiring: prohibited
  upgrading:
    eligibility: hardwired components only; MPCP excluded
    maximum_upgrades_per_component: 1
    rating_increase: 1
    design_successes_available_for_Cook_or_Installation_TN_reduction: floor(design successes / 2)
    software_size: apply program upgrade rules (p81)
    installation_base_time_hours: 1
    installation_TN_modifier: -2
  relationship: Extends the existing procedure.matrix.cyberterminal-construction stage outline with original numeric exceptions.
