id: rule.matrix.echo.siphon
record_type: rule
name: "Siphon Echo"
domain: matrix
status: ingested
source: source.fanpro-10652
pages: "24"
pdf_pages: "24"
use:
  action: "Complex Action"
  resistance: "Target makes a Bod Test, with Hacking Pool allowed, against the otaku's Charisma."
  zero_successes: "Target leaves the Matrix and resolves dump shock."
  one_to_three_successes: "Target has +2 to all tests and cannot initiate actions for 4 Initiative Passes minus successes."
