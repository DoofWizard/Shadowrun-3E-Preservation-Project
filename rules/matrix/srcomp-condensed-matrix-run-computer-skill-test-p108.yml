headline: 'FASA Corporation Shadowrun Companion (FASA7905a), Shadowrun Third Edition: optional condensed Matrix run, original printed p108/PDF109'
summary: 'Original optional gamemaster procedure allowing some fictional Matrix runs to be resolved with one Computer Skill Test affected by applicable decker programs, rather than fully playing out the decking sequence.'
data:
  original_heading: Computer Skill Test
  chapter: Running the Game — Incorporating Deckers
  applicability: In some cases, the gamemaster may use this shortcut to represent a Matrix run.
  resolution:
    number_of_tests_for_condensed_run: 1
    skill: Computer Skill
    applicable_modifier_source: Effects of the decker character's applicable programs modify the test.
    unspecified_by_companion: The passage supplies no standalone numeric target number, success threshold, or universal program modifier table for this condensed option.
  usage_limit: The book advises using this option sparingly, because a decker player may lose engaging gameplay if the character seldom performs more involved Matrix activity.
  optional_not_replacement: This is an optional gamemaster pacing abstraction; it does not replace the baseline SR3 Matrix rules in ordinary play.
  neighboring_alternatives: Printed pp107-108 also discuss NPC deckers, two-pronged operations, simultaneous scene handling, an assistant gamemaster, and solo Matrix adventures as pacing suggestions, not a new mandatory target-number table.
