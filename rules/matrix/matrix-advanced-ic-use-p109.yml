{"id":"rule.matrix.matrix-advanced-ic-use-p109","record_type":"rule","status":"source_reviewed","source":"source.matrix","printed_pages":"109","pdf_pages":"110","edition_scope":"FASA Corporation Matrix FASA7909, Shadowrun Third Edition fictional tabletop RPG, printed 109/PDF 110.","content_class":["rule_exact"],"framing":"reference_exact","headline":"Matrix tabletop advanced core IC use and crashing rules","summary":"FASA7909 Matrix source-specific tabletop rules; extends existing SR3 game mechanics.","data":{"sparky_iccm":"ICCM-equipped fictional character may make two Damage Resistance Tests against Sparky IC, one Body and one Willpower, use better result. Extends p21 ICCM summary (rules/matrix/iccm-protection.yml, blob 33b5454ae635d5755b5684eb3173a2ac53e61112), which does not specify these Sparky dice tests.","reused_lethal_black_cold_asist":"Cold ASIST treats lethal Black IC as nonlethal, Stun not Physical; already accepted in rules/matrix/asist-modes.yml, blob d6a8a2e61bdeb16a937329eefa4f6187b50394e4.","reused_tar_baby_tar_pit":"One-shot utility destruction wipes all copies in active memory; already accepted in rule.matrix.utility-option-effects-p83-85, blob 0de9dec5d45113caa52735a91a2646ca4af72f16.","reused_crashing_ic":"Standard SR3 crash tally; suppression for 1 Detection Factor; Stealth attack utility option subtracts rating from tally increase (source example 6-3=3), already accepted in p83-85 utility-option record. Optional sacrifice one Hacking Pool die in lieu of Detection Factor already accepted in rule.matrix.hacking-pool-eligibility-options-p26, blob ac3877a5dc7c609073bd389386864ddce26392ce."}}
