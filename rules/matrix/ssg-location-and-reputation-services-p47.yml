headline: FanPro10667 SR3 fictional tabletop proximity and reputation-service capabilities, p47/PDF48
summary: Published service-specific sign-up, proximity alerts and ratings access, without new dice or range rules.
data:
  narrator: In-world publication Livewire
  location_based_service:
    prerequisite: Sign up for the particular proximity service.
    notification: Compatible mobile devices alert participating people when they are near other participants with shared interests.
    example: The fictional Immortal Combat service alerts a pocket secretary or another device hosting the fighter avatar when another player is nearby.
    numeric_distance: null
  reputation_service:
    user_can_rate_interactions: true
    access_to_ratings: Users can view ratings left by people they know or trust.
    example: Shared product and service reputation files can notify shoppers of their friends' endorsements or warnings.
    numeric_rating_scale: null
  scope: Described fictional service capabilities, not an automatic location disclosure rule or an additional Etiquette modifier; no range, timing or test is specified.
  reuse: [rule.communications.sr3-core-cellphone-network-location-and-pager-p287, rule.matrix.information-searches, rule.matrix.matrix-social-havens-p124-129]
