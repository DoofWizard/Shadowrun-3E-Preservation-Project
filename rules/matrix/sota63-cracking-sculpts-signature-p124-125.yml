data:
  source_context:
    publication_title: 'State of the Art: 2063'
    publisher: FanPro
    publication_year: 2003
    edition: Shadowrun Third Edition
    catalog_number: FanPro10664
    source_id: source.fanpro-10664
    chapter: Culture Shock
    source_section: Game Information
    fictional_context: Exact numbered mechanics apply to published Shadowrun Third
      Edition tabletop fiction only.
    printed_pages: 124-125
    physical_pdf_pages: 125-126
    subsection: Sculpts, cracking programs and signatures
  sculpts:
    source_cross_reference: Matrix p91 IC constructs
    payload: None
    hacking_pool: None
    initiative: None
    maximum_core_rating: Computer (Programming) skill of creator
  program_cracking:
    precondition: Character has the target program object code; if source code is
      already available, the reverse derivation is not required.
    required_knowledge_skill: Cracking
    uncrackable_if: target program multiplier exceeds Cracking skill rating
    required_memory: Computer active and storage memory must EACH be at least the
      targeted program size.
    test: Computer (Programming)
    base_target_number: target program rating +4
    cracker_utility_effect: reduce the derived target number by cracker utility rating
    extra_memory_modifier: -2 to target number when computer has twice the needed
      memory
    time: twice the time to create target program (MP size in days ×2); Programming
      Test successes may reduce this period, with no additional numeric reduction
      printed here.
  cracker_utility:
    multiplier: 6
    program_options:
    - Adaptive
    - bug-ridden
    - crashguard
    - DINAB
    - limit
    - optimization
    - sneak
    maximum_rating: ceil(Computer (Programming) skill /2)
    role: The source describes it as a game-programming aid reducing test target number
      to derive source code from object code.
  signature_program_option:
    design_rating_modifier: '+3'
    source_derivation_target_number_penalty: '+4'
    legwork_dice_bonus_for_author_identification: +1 die
    characterization: Programmer may embed a distinctive signature; fictional legwork
      identification is easier when distinctive style is recognizable.
  scope: Exact SR3 game material on printed pp124–125/PDF125–126. Does not substitute
    the separate Matrix sourcebook procedures without explicit lineage review; tourism
    narrative beginning p125 is excluded.
framing: reference_exact
