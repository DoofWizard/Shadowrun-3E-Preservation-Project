    speaker: Orbital Bandit
    direct_ground_access: Short daily access periods due to the orbital period.
    window_duration: Each described window lasts slightly less than two hours; number of windows not specified.
    remote_access: Limited geosynchronous public-domain communication satellites permit remote connection; this route causes substantial lag, with no numerical modifier stated here.
    entry_security: The satellite SAN carries scramble IC; no rating is supplied in this passage. An account or knowledge of protocols makes access easier, not an unconditional guarantee.
  security_staff_coverage:
    printed_page: 36
    pdf_page: 37
    speaker: Orbital Bandit
    claim: Ground-based and orbital deckers maintain a watch schedule, handing over when their access windows permit.
    certainty: Attributed claim by the haven operator; no guaranteed security gap or fixed modifier inferred from other speakers' speculation.
  bounded_source_discrepancy:
