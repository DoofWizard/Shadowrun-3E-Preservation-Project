    chapter_statement: Each direct-access window is slightly shorter than two hours.
    explicit_game_rule: One two-hour-long opportunity each day, using the Satellite Uplink rules and Density modifier +4.
    disposition: Preserve both descriptions and keep the explicit Game Information mechanic intact. Do not derive an additional access window, lag modifier or substitute rule from the chapter account.
