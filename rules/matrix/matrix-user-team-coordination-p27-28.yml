    team_role: 'A decker can assist other characters rather than necessarily taking the lead in every virtual encounter.'
  delegation:
    frame_and_agent_use: 'Deckers may create frames and agents that other characters use for information searches.'
    utility_use: 'Deckers may create game utilities for other characters to use on simpler Matrix tasks.'
    shared_operations: 'Deckers may support other characters performing system operations through relevant Knowledge skills and backup.'
    ordinary_terminal: 'Non-decker teammates may perform simpler Matrix tasks and participate in a Matrix encounter while the decker deals with IC.'
  overwatch:
    game_context: 'A decker character may provide virtual support for the party during a shadowrun.'
    host_access_condition: 'If the fictional host is not remotely accessible, the decker needs on-site access and a safe physical position while using the Matrix.'
