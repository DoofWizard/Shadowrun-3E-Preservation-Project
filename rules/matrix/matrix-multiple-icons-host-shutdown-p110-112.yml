{"id":"rule.matrix.matrix-multiple-icons-host-shutdown-p110-112","record_type":"rule","status":"source_reviewed","source":"source.matrix","printed_pages":"110,112","pdf_pages":"111,113","edition_scope":"FASA Corporation Matrix FASA7909, Shadowrun Third Edition fictional tabletop RPG, printed 110,112/PDF 111,113.","content_class":["rule_exact"],"framing":"reference_exact","headline":"Matrix tabletop multiple icons, host shutdown and optional subsystem ratings","summary":"Original Matrix supplement game mechanics, expanding the existing SR3 rules and source-specific advanced security summary.","data":{"legacy":"rules/matrix/advanced-security.yml d1501f5cd30e8fd64dc6dc8c4d55cb5af4a559c5 summarizes but does not specify the following conditions.","multiple_icons":{"tally":"Separate Security Tally per user icon. Each icon reaching a trigger step activates fresh IC for itself even if another icon previously destroyed that step's IC. Ordinarily icon-triggered effects concern only that icon.","construct_exception":"IC constructs may attack any icon whose tally is sufficient to trigger them.","passive_alert_scope":"All subsystem ratings increase by 2 for all users, not only the icon triggering the alert.","legitimate_accounts":"Ordinarily passive and active alerts do not impede legitimate account holders because authorized activities automatically succeed; they may not notice the intrusion."},"host_shutdown":{"trigger":"Predetermined tally threshold; host-initiated sequence differs from Crash Host operation.","duration":"Sum ceil(Security Value / 2) D6; total Combat Turns of countdown.","final_warning":"1D6 divided by 2 indicates remaining turns when warning occurs; source example result 2 means 2 turns remaining. No new rounding convention inferred.","sensor":"Secret Sensor Test for each user at end of every Combat Turn, TN equal to remaining countdown turns; repeat separately until success. Success reveals shutdown mode but not timing. All users notified with exact remaining turns on final warning.","termination":"At end of last Combat Turn, remaining characters dumped offline and suffer SR3 dump shock; applications, frames, agents, command sets and IC crash; ongoing and monitored operations terminate."},"optional_subsystem_variation":{"authority":"GM may raise or lower individual subsystem ratings of grids or hosts by entry point, file category or load; may also change jackpoint Access modifiers.","illustrative_access":{"public_grid":2,"dedicated_workstation_or_remote_device":-1},"illustrative_files":{"public_relations":-2,"personnel_management":2},"grid":"Ratings commonly fluctuate with load and traffic."},"mapping_note":"PDF112 is full-page illustration, not a missing rule page."}}
