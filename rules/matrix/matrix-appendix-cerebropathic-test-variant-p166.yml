id: rule.matrix.matrix-appendix-cerebropathic-test-variant-p166
record_type: rule
status: source_reviewed
source: source.matrix
printed_pages: '107, 166'
pdf_pages: '108, 167'
edition_scope: FASA Corporation Matrix (FASA7909), Shadowrun Third Edition fictional tabletop RPG; source.matrix.
content_class: [rule_exact]
framing: reference_exact
headline: FASA7909 Matrix Cerebropathic IC tabletop test target variant
summary: Original printed pp107 and 166 disagree about the target number of the final in-game stress test after the fictional character is knocked unconscious.
data:
  chapter_p107_pdf108:
    trigger: The IC renders the character unconscious.
    dice: 2 times IC rating
    target_number: Higher of character Willpower or Intelligence.
    effect: One Stress Point per success, subject to chapter ICCM and cold ASIST exceptions.
  appendix_p166_pdf167:
    trigger: Character knocked out.
    dice: 2 times Black IC rating
    target_number: MPCP
    effect: Successes inflict Stress Points.
  precedence: Unresolved. Preserve both printed test targets; do not replace the chapter's specific stress allocation and protection rules with the abbreviated table.
  related_rule: rule.matrix.matrix-black-ic-extensions-p107-109
