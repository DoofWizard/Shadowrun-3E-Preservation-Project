{"id":"rule.matrix.matrix-trace-ic-bandwidth-p104-107","record_type":"rule","status":"source_reviewed","source":"source.matrix","printed_pages":"104, 106-107","pdf_pages":"105, 107-108","edition_scope":"FASA Corporation Matrix FASA7909, Shadowrun Third Edition fictional tabletop RPG, printed 104, 106-107/PDF 105, 107-108.","content_class":["rule_exact"],"framing":"reference_exact","headline":"Matrix tabletop Trace IC and optional icon bandwidth","summary":"FASA7909 Matrix source-specific tabletop rules; extends existing SR3 game mechanics.","data":{"trace_class":"Hybrid white/gray IC; hunt then location cycle.","hunt":{"attack":"Normal cybercombat Attack Test using system Security Value; +1 TN per successful Redirect Datatrail by target. Target rolls Evasion against Trace IC rating; ties or greater defender successes negate hit. At least one net IC success starts location cycle.","termination":"Successful hit, IC crash or intruder exit. Evade Detection maneuver works only in hunt; Relocate utility ineffective in hunt."},"location":{"state":"Immediately becomes reactive and disappears. Locate IC operation (Complex Action) needed before attack; no maneuver or counterattack once located.","turns":"floor((10 + jackpoint Trace modifier + active Camo rating) / net hunt Attack Test successes). Count only full Combat Turns, completed after last Initiative Pass; if IC frozen or destroyed before turn ends, that turn is not counted.","completion":"If not crashed or relocated before completion, records jackpoint serial and physical location in game security logs and alerts physical security; GM determines physical response by resources, jurisdiction and site Security Rating.","targeting_tn_modifier":-1,"targeting_scope":"All subsequent Attack Tests by system proactive IC against traced target.","tally_acceleration":"Add 1 extra point each time security tally increases."},"counterplay":{"crash":"Normal IC destruction tally penalty; proactive during hunt, reactive after hit.","graceful_logoff":"Immediately ends location cycle if successful; increase operation TN by Trace IC rating.","jack_out":"Datatrail remains for max(1, 1D6-1) Combat Turns; if duration equals/exceeds remaining location turns, trace completes. Unconsciousness, death or persona crash alone leaves connection open; same jack-out persistence applies.","relocate":"Location cycle only; see accepted Relocate Trace operation p100; no tally for defeating via Relocate."},"grid_scope":"Trace persists on LTG, parent RTG and all LTGs governed by same RTG; keep suppressed or relocating after defeating on LTG. Ends on logging onto host or different RTG/PLTG. Trace triggered by jackpoint governing RTG or its LTG may immediately dump target once jackpoint located; other grids and hosts cannot.","optional_icon_bandwidth":{"allocation":"Sum persona program ratings and ratings of all utilities in active memory; can reserve more at start; fixed for run, disconnect and restart to change. Destroyed/reduced program ratings free capacity for reassignment, not reduction of declared bandwidth.","modifier":"If icon bandwidth exceeds jackpoint base bandwidth, hunting-cycle TN modifier = -floor(icon bandwidth / base bandwidth), applies to both Track utility and Trace IC.","pre_run_reductions":"Persona ratings may be lowered for whole run; utility ratings cannot be reduced unless adaptive. Utility Mp size irrelevant.","otaku_bandwidth":0},"examples":{"trace":"Red-6, trace-8, two redirects: 6 dice TN5; 4 successes versus Evasion 6 at TN8 with 1 success; jackpoint -2 and camo 4 gives 12/3 = 4 full turns.","bandwidth":"Persona ratings 5+3+4+4=16; loaded ratings 5+4+6+4=19, total 35, declared 40 with 5 reserve; base 20 gives -2."},"reuse":"Jackpoint bandwidth and modifiers p32, Track p75, Redirect and Relocate p100, Graceful Logoff p102 already indexed; no replacement."}}
