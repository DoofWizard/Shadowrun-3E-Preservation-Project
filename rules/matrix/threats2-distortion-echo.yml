summary:
  - "Complex Action; affects up to MPCP/2 Matrix users, rounded down."
  - "Each 2 Hacking Pool dice committed imposes +1 on affected Matrix actions."
  - "Otaku, sprites and daemons also lose 1 channel/complex-form rating per 2 dice; Dissonance followers are immune."
  - "Targets may defend by spending a Complex Action and Hacking Pool dice one-for-one."
  - "Effects do not stack; sustaining requires a Simple Action each Initiative Pass and lowers Detection Factor after the first turn."
