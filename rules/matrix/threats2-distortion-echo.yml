id: rule.matrix.echo.distortion
record_type: rule
name: "Distortion Echo"
domain: matrix
status: ingested
source: source.fanpro-10652
pages: "24"
pdf_pages: "24"
summary:
  - "Complex Action; affects up to MPCP/2 Matrix users, rounded down."
  - "Each 2 Hacking Pool dice committed imposes +1 on affected Matrix actions."
  - "A targeted tortoise-mode user's session is immediately crashed."
  - "Otaku, sprites and daemons also lose 1 channel/complex-form rating per 2 dice; Dissonance followers are immune."
  - "Targets may defend by spending a Complex Action and Hacking Pool dice one-for-one against the dice allocated to that specific character."
  - "Effects do not stack; only the strongest distortion applies."
  - "Sustaining requires a Simple Action each Initiative Pass; Detection Factor is reduced by 1 for every turn sustained past the first."
notes:
  - "Local-system sensory distortion is described as vertigo/nausea and temporary fading, wavering, pixelation and de-rezzing of Matrix imagery."
