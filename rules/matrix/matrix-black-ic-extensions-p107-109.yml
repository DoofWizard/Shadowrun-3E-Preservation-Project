{"id":"rule.matrix.matrix-black-ic-extensions-p107-109","record_type":"rule","status":"source_reviewed","source":"source.matrix","printed_pages":"107-109","pdf_pages":"108-110","edition_scope":"FASA Corporation Matrix FASA7909, Shadowrun Third Edition fictional tabletop RPG, printed 107-109/PDF 108-110.","content_class":["rule_exact"],"framing":"reference_exact","headline":"Matrix tabletop cerebropathic and psychotropic Black IC extensions","summary":"FASA7909 Matrix source-specific tabletop rules; extends existing SR3 game mechanics.","data":{"cerebropathic":{"base":"Nonlethal Black IC rules; when it renders the fictional character unconscious, final attack targets character stress instead of MPCP.","test":"Roll twice IC rating against higher of character Willpower or Intelligence; each success inflicts 1 Stress Point; ICCM reduces to 1 per 2 successes; cold ASIST immune to stress.","stress_table_1d6":{"1-3":"Intelligence","4":"Willpower","5-6":"Implant"},"implant":"Random cyberware or bioware implant connected to neurological system; apply M&M p124 Stress Point rules."},"psychotropic":{"base":"Nonlethal Black IC rules; fictional involuntary conditioning. Each damage event requires Willpower Test TN IC rating plus damage level modifier; cold ASIST -2 TN. Failure implants effect; success no psychological effect.","damage_tn":{"L":1,"M":2,"S":3,"D":4},"awareness":"Character initially unaware and rationalizes behavior; others must point out unusual behavior to identify cause. GM may devise variants.","cyberphobia":"Willpower Test against IC rating before jack-in; add IC rating to TN of computer, simsense, Matrix or other phobia-related tasks. GM may reduce penalty by up to half with fictional fear-suppressing magic or drugs.","judas":"Compulsion to betray self or others, not just to benefit deploying entity. At each opportunity, secret Willpower Test vs IC rating; success resists without awareness, failure compulsive act. Character denies or rationalizes behavior.","frenzy":"Character acts without intelligent self-control or conversation, in combat uses natural attacks or basic blunt object. Persists until death/unconsciousness and resumes on regaining consciousness. Optional GM Willpower Test every 24h vs IC rating; success awakens exhausted, recurrence possible. In-game tranquilizer patches equal to IC rating or Control Emotions spell rating at least IC rating calm for 24h, then easily returns to frenzy.","positive_conditioning":"Compulsion to favor producing/deploying organization; Willpower Test vs IC rating to participate in action perceived harmful to it. Success allows action with +2 TN on opposed actions; failure prevents participation, forced action may cause protest, resistance or emotional collapse at GM discretion."},"detection":{"skill":"Biotech with medical shop or Psychology; TN affected character Willpower; base hours = IC rating. PAB rating reduces TN. Mind Probe spell detects with 5+ successes."},"recovery":{"spontaneous":"At end of each month, Willpower Test TN IC rating; success ends conditioning.","psychotherapy":"Base hours = IC rating x 2; administering character Psychology Test vs affected Willpower.","PAB":"Same base time; Biotech Test vs affected Willpower minus PAB rating; Psychology complementary."}}}
