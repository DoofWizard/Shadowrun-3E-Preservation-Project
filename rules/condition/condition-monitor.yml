id: rule.condition.condition-monitor
record_type: rule
name: "Condition Monitor"
domain: condition
status: ingested

scope:
  applies_to:
    - "Characters"
    - "Equipment that uses Condition Monitors"
  excludes: []

resolution:
  summary: "A character Condition Monitor has separate Physical Damage and Stun Damage tracks. The Physical track records wound damage and indicates death; the Stun track records fatigue and stun damage and indicates unconsciousness."
  inputs:
    - "Physical damage"
    - "Stun damage"
  outputs:
    - "current damage state"
    - "unconsciousness or death when applicable"
  steps: []

