    physical_boxes: 15
    expected_instant_death: false
  - id: overflow.body5_exceeded
    body: 5
    physical_boxes: 16
    expected_instant_death: true
  - id: modifiers.stunM_physicalL
    stun_boxes: 3
    physical_boxes: 1
    expected_injury_tn_modifier: 3
    expected_initiative_modifier: -3
  code_status: Source-reviewed numeric record; consumer prototype is not a canonical
    ingestion receipt or full engine validation.
