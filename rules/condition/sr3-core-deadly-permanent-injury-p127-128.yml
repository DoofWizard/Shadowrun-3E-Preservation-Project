    successes: 1
    injury_die: 5
    side_die: 3
    injured_part: Right ear
    healing_base_time_multiplier: 1.5
  - id: deadly.two_successes
    successes: 2
    permanent_part_loss_by_this_test: false
  code_status: Specification vectors only, no executed engine validation or source-level
    cross-supplement supersession inferred.
