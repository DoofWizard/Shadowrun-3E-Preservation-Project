  chapter: Soldiers of Fortune
  section: Game Information / Running a Mercenary Campaign
  gm_advice:
    setting_contrast: The text differentiates a mercenary campaign from an ordinary
      urban shadowrunning campaign. Fictional mercenary assignments often take place
      in remote field environments with fewer everyday nonplayer-character interactions.
    social_contact_scarcity: Field assignments can leave mercenary player characters
      seeing mostly their own unit and interacting with outside characters infrequently;
      the chapter presents this as a game-master pacing challenge, not a new fixed
      contact penalty.
    suspense_pacing: The text advises a GM to build anticipation during long periods
      of uneventful field duty and to use occasional false alarms or uncertain encounters
      before moments of action.
    contracts: A mercenary agreement with a fictional employer can last several weeks
      to several months rather than cover one short job. The employer may request
      multiple distinct missions during the agreement.
    linked_sessions: The same agreement may connect multiple adventures into a coherent
      story arc or mini-campaign.
  independently_indexed_on_same_page:
    canonical_record: rule.mercenary.sota63-rural-guide-contact-p72
    path: rules/mercenary/sota63-rural-guide-contact-p72.yml
    scope: Exact rural-guide NPC template, contact examples, ratings and Edge references;
      no duplication.
  missing_numeric_effects: No dice modifier, mandatory contract length, contact acquisition
    cost, or guaranteed frequency of random encounters is assigned in this GM guidance
    subsection.
  example_vectors_not_executed:
  - case: single contract, several linked assignments
    hypothetical_sessions: 3
    rule_effect: No new dice modifier; GM groups assignments into one optional narrative
      arc.
  coverage_limit: Only the optional campaign-structure, social-isolation, suspense
    and contract advice on printed p72/PDF73; rural guide statistics and later military
    equipment are covered by separately accepted records.
