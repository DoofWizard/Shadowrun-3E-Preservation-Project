headline: 'Fictional Shadowrun Third Edition optional rural guide contact, FanPro
  State of the Art: 2063 (FanPro10664), printed p72/PDF73'
summary: Source-book advice and a complete sample fictional rural-guide contact, with
  exact game attributes, initiative, skills, specializations, pool and equipment;
  optional GM use only.
data:
  publication:
    title: 'State of the Art: 2063'
    publisher: FanPro
    catalog_number: FanPro10664
    edition: Shadowrun Third Edition
    printed_page: 72
    physical_pdf_page: 73
  section: Soldiers of Fortune / Game Information / Running a Mercenary Campaign /
    Contacts / Guide Contacts
  source_scope: Book advises that rural mercenary assignments give player characters
    fewer everyday contacts than urban shadowruns. A local guide is offered as a helpful
    contact and ready-to-use optional NPC, not mandatory starting equipment or automatic
    character ability.
  guide_contacts:
    description: A guide is a locally knowledgeable resident familiar with the land,
      flora, fauna and neighbors. The source suggests guides may help with rural navigation,
      local relationships and introductions to other contacts; their judgments and
      situational warnings are descriptive, not guaranteed numerical detection rules.
    possible_edges_not_guaranteed:
    - Sense of Direction (Shadowrun Companion p24)
    - Home Ground (Shadowrun Companion p18)
    uses:
    - Rural contact
    - Navigate unfamiliar area
    - Interact with local residents
    - Collect information about rural activity
    places_to_meet: Local villages or towns
    similar_connections:
    - Smugglers
    - Scouts
    - Mercenaries
    - Tribal people
    - Nomads
    gm_option: The sample is a fictional guide contact template; the narrator does
      not require that every guide have the listed Edges.
  sample_guide:
    attributes:
      B: 4
      Q: 3
      S: 3
      I: 5
      W: 3
      C: 4
      E: 6
      R: 4
    initiative: 4 + 1D6
    dice_pools:
      Combat: 5
    karma_pool: 2
    professional_rating: 2
    active_skills:
    - name: Athletics
      rating: 3
    - name: Biotech
      rating: 2
    - name: Etiquette
      rating: 3
      specialization:
        name: Local Area
        rating: 6
    - name: Navigation
      rating: 3
    - name: Stealth
      rating: 3
      specialization:
        name: Wilderness
        rating: 5
    - name: Rifles
      rating: 3
    - name: Survival
      rating: 4
    - name: Unarmed Combat
      rating: 3
    knowledge_skills:
    - name: Current Events
      rating: 4
    - name: Local Landmarks
      rating: 6
    - name: Local Politics
      rating: 4
    - name: Native Language
      rating: 5
      specialization:
        name: Local Lingo
        rating: 7
    - name: Secondary Language
      rating: 3
    - name: Other Street Knowledge Skill 1
      rating: 4
      source_unspecified_name: true
    - name: Other Street Knowledge Skill 2
      rating: 4
      source_unspecified_name: true
    gear:
    - Camping gear
    - NavStar GPS
    - Survival knife
  not_automatic_effects:
  - No mandatory contact acquisition cost, navigation bonus, or new die modifier is
    specified on this page.
  - No mechanical Sense of Direction or Home Ground Edge is granted to all guides
    by default.
  - The optional suggested contact is not proof every mercenary game must include
    an NPC guide.
