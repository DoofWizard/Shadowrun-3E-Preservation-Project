  original_heading: Street Gear / Biotech / Organic Replacements
  fictional_in_world_conditions:
    vat_grown_tissue_and_organs: The book narrator says vat-grown replacement tissues
      and organs are readily available in the setting.
    type_o_product_claim: The narrator describes commonly used Type O products tailored
      for minimal rejection reaction.
    type_o_treatment_condition: The source says such transplants still require a tailored
      immunosuppressant treatment program to prevent rejection by the fictional character.
    patient_derived_tissue_comparison: The source describes replacement tissue grown
      from the patient’s own cell samples as the safest option within the fictional
      setting.
    brain_and_nervous_tissue_exception: The book explicitly says that replacement
      brain or nervous tissue is not yet available.
    viable_clone_exception: The source says fully viable clones exist only in the
      realm of fiction even within its setting.
  printed_cross_reference: Damage and Healing, printed p125; the p304 paragraph does
    not print an independent numeric transplant procedure.
  mechanically_unstated_fields:
  - No transplant Target Number or dice pool is provided in this paragraph.
  - No replacement-organ purchase price, surgical duration or treatment rating is
    printed here.
  - The patient-cell and Type O comparisons do not establish a universal game bonus
    or damage modifier.
