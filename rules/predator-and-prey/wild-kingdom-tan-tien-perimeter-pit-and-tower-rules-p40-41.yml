data:
  source_context: Fictional Shadowrun tabletop adventure Predator and Prey (FASA Corporation,
    1998; FASA7324, catalog source.fasa-7324), historical Second Edition-era rules;
    no inferred Third Edition conversion. Printed pp40–41/PDF41–42.
  fence:
    height_m: 6
    construction: Razor wire on both sides, with central thin conductive warning wire;
      cutting that central wire alerts the security rigger.
    climbing_damage: 7M, reduced by Impact Armor
    touch_three_wires_damage: 6D, Combat Pool cannot reduce this damage
    gate_construction: Chain link gate reinforced by three steel bars
    gate_vehicle_collision_damage: 5D when sideswiping, and five Combat Phases to
      fully open or close
  pit:
    width_m: 4
    depth_m: 8
    occupants: Two troops of eight asonwu each; the animals are fitted with cyberware.
    exit: Ladder operated remotely or manually; the animals respond to its sound.
    cross_reference: Asonwu critter statistics on original printed p76; do not invent
      their attributes here.
  gun_tower:
    construction: Four-story gun tower with rotating track; third-floor rigger behind
      a Barrier Rating 8 door, and two armed guards in addition to rigger.
    assault_cannon: Smartlinked assault cannon, 200-round belt of explosive ammunition.
    heavy_machine_gun: Smartlinked heavy machine gun, 1,000-round belt of explosive
      ammunition.
    track_recoil_compensation: 6
    protective_plastic_barrier_rating: 16
    spare_rounds_assault_cannon: 1000
    spare_rounds_heavy_machine_gun: 4000
    tower_base_barrier_rating: 12
    tower_signature: 2
    building_door_barrier_rating: 4
    building_thick_door_barrier_rating: 12
    security_rigger: Use Rigger archetype, Shadowrun Second Edition p59.
  source_scope: These are fictional tabletop RPG game statistics, not actual site-security
    instructions.
framing: reference_exact
headline: Tan Tien perimeter barrier, gun tower and asonwu mechanics — FICTIONAL Shadowrun
