  "data": {
    "source_context": "Fictional Shadowrun tabletop-RPG adventure Predator and Prey, FASA Corporation, catalog FASA7324 (1998), source.fasa-7324, original Second Edition-era setting and mechanics; printed pages cited against PDF pages, with no inferred Third Edition conversion.",
    "original_edition_rules": {
      "controlled_pack": "Disball attacks with twice as many animals as player characters, up to a maximum of ten animals he can control at one time. Animals beyond his control flee. Controlled dogs use Concealment for surprise, and Disball astrally observes and directs them against magically active runners first.",
      "pack_variants": "GM chooses pack according to runner capabilities. Choices listed: aardwolf (Concealment, cannot conceal again merely by moving after a runner sees it), barghest, bogie, mundane dogs using SRII p233 Large Dog, flame jackal, gabriel hound (human-shaped disguise requires crouching, pushing a cart, and cannot sustain erect posture for long), hell hound, martichoras (only one present), piasma (only one present and the specimen from the introduction video), saber-tooth cat (only one), and shadowhound.",
      "attack_roles": "Area-effect animals hold back and interfere while physically stronger animals fight; bogies use Accident, shadowhounds Darkness, and aardwolves Concealment. A magically active runner astrally observing the disguised homeless figure notices the difference between the figure and the dogs and risks notice by a black hell hound.",
      "optional_effects": "The source suggests hell hounds can repeatedly use flame projections from a concealed rear position to ignite a safe building, and the GM may use the resulting human cries as a distraction; this is a fictional optional encounter construction, not operational advice.",
      "rescue_and_bounty": "If the characters drive the pack off, they may call Mr. Johnson, who identifies a pickup location. Shiawase Envirotech transport may take dead or surviving animals; Fire in the Hole technicians arrive, tag bodies and sedate survivors. They provide a receipt, and the stated bounty is paid within 24 hours, often by courier. If runners undertake Dog Eat Dog World before Fire in the Hole, that bounty has not yet been offered and is not awarded.",
