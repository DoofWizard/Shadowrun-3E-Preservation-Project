    "main_attack": "Twenty mami wata with Enhanced Quickness jump aboard on the starboard side, using the speed of the animals to cover about ten meters of ship rail. Each runner within 3 meters of the railing rolls 1D6: results 1 or 2 indicate collision, and a second 5-dice 'attack' must be resisted as 8 Stun damage.",
