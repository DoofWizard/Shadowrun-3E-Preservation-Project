data:
  source_context: Fictional Shadowrun tabletop adventure Predator and Prey (FASA Corporation,
    1998; FASA7324, catalog source.fasa-7324), historical Second Edition-era rules;
    no inferred Third Edition conversion. Printed p42/PDF43.
  vehicle_fuel:
    hovertrucks: 4
    fuel_depot_explosion: 20D at depot, decreasing by 1 Power per 2 meters distance
      from depot; map p41 labels potential radius 4c.
  grounds:
    awakened_green_mamba: Twelve ekyelebenle (Dendroaspis spuerea); reference original
      printed p79 for statblock and spit mechanics.
    lobby_gomatia: Three adaptive-coloration lizards; the source says they do not
      have cameras or sonic implants, unlike some other animals.
    physical_spotting: Perception (8) Test for noticing astrally active gomatia in
      physical space.
  office:
    card_reader_rating: 4
    armored_glass_barrier_rating: 8
    power_generators: Located at 8a; office roof has satellite dishes and radio towers.
  research_computer:
    host_sequence_exact: Red-5/11/8/8/10/8
    host_connection: Unconnected to the Matrix
    data: Ten 125-Mp chunks of paydata
    value_per_chunk: 2D6 × 2,000 nuyen
    security_sheaf: Labyrinth motif; unauthorized access drops metal mesh walls and
      applies electrical floor shocks; fiction, not actual system security.
  trigger_sheaf:
  - step: 4
    event: Satellite channel opens to Tan Tien–Beijing at 50 Mp bandwidth
  - step: 6
    event: Probe-8
  - step: 10
    event: 'Passive Alert: Killer-6'
  - step: 14
    event: Download/deletion of files through satlink begins
  - step: 18
    event: Blaster-8
  - step: 22
    event: Expert Construct/Offense +2 (Armor), Tar Baby-5, Sparky-7
  - step: 27
    event: Black IC-9 (Armor)
  - step: 30
    event: Shutdown
  lab_antivenin:
    quantity: Several 200-milliliter jars in the fictional research laboratory
    mechanic: Each jar of suitable ekyelebenle antivenin injected into a character
      reduces the Power Level of subsequent Damage Codes for the poison by 1.
    identification: Successful Biotech (6) Test identifies the correct dosage.
  caution: Original 1998 fantasy RPG mechanics, not medical instructions or real network
    exploitation procedures.
