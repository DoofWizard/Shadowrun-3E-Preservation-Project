    "entity_departure": "When runners kill or bring Disball close to death, the fictional astral entity leaves the body; if that happens before the last wave, Disball's body can still move for the remaining time. The source suggests only one magically active character notices the departure, if more are present, to preserve dramatic uncertainty. Disball may die; if he survives, the GM text describes shattered memory and catatonia, with a long possible recovery. The astral entity rather than Disball is established as the instigator of the planned mass attacks.",
