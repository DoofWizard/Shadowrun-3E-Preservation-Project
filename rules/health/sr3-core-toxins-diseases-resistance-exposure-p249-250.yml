{"content_class":["rule_procedure"],"data":{"countermeasures_as_book_rules":{"antidote_effect":"The source says an appropriate antidote generally reduces attack Power; usually administered after exposure and before the fictional damage is taken. No universal fixed numeric reduction is given here.","deadly_condition":"For a victim who has already received Deadly damage, the book classifies injection of the correct antidote as professional attention, cross-referenced to Deadly Wounds and First Aid, printed p129. It does not reverse the damage automatically.","vaccine_effect":"A source-appropriate vaccine administered before exposure grants immunity under this rule and avoids the Body Test. This is a fictional game mechanic, not clinical advice."},"exposure_and_timing":{"continued_contact":"While contact with a toxin continues, or while the character remains infected with a disease, another Body Test is required each time the specified Speed interval elapses.","damage":"The listed attack Damage Code includes a Power and Damage Level; associated symptoms may persist as the source specifies.","initial_test":"When the listed Speed period elapses, make one Body Test against the source-specific attack Power.","repeat_test_target_modifier":"+4 to the Body Test target number on a repeated interval while exposure/infection persists. The original passage does not state this increases cumulatively by another +4 each interval.","speed":"The specified toxin or disease Speed determines when the fictional victim makes the initial Body resistance test after exposure; some are immediate, others have delayed onset."},"lineage_and_overlap":{"distinct_omission":"The accepted FASA7001 per-source semantic index contains no original p249–250 disease/toxin exposure-resolution record; this does not claim the remainder of the source complete.","reuse":["rule.condition.sr3-damage-monitor-numeric-p125-126","rule.condition.sr3-core-deadly-permanent-injury-p127-128"]},"publication":{"catalog_number":"FASA7001","edition":"Third Edition","kind":"published fictional cyberpunk tabletop role-playing game core rules","publisher":"FASA Corporation","source_id":"source.sr3-core","title":"Shadowrun, Third Edition","verified_original_pdf_sha256":"7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914"},"resistance":{"damage_staging":"Every two Body Test successes reduce the Damage Level by one stage.","no_automatic_immunity":"Avoid conflating a successful resistance test with vaccine-granted immunity or with avoiding all source-specific side effects.","target_number":"Attack Power of the disease or toxin.","test":"Body Test"},"source_page_pairs":[[249,258],[250,259]],"source_review":{"inspected_original_images":"Physical PDF258 (visibly printed 249), Diseases and Toxins at bottom both columns; PDF259 (visibly printed 250), upper-right Body-test/antidote/vaccine/Deadly passages; all compared before record freeze.","limitations":"Editorial source-review and structural gate receipts cannot alone prove source-wide mechanical completeness or executable-game tests.","reviewed_human_readable_paths":["edition_scope","headline","summary","data.publication.*","data.source_section","data.exposure_and_timing.*","data.resistance.*","data.countermeasures_as_book_rules.*","data.lineage_and_overlap.*","data.source_review.*"]},"source_section":"Beyond the Shadows / Diseases and Toxins: original general resolution procedure, not real medical guidance"},"edition_scope":"FASA Corporation, Shadowrun, Third Edition (FASA7001), Third Edition fictional tabletop RPG rules, original printed pp249–250 / physical PDF258–259; no other edition or real-world guidance.","framing":"reference_exact","headline":"FASA Corporation Shadowrun, Third Edition (FASA7001) fictional RPG disease/toxin exposure and resistance procedure, printed pp249–250/PDF258–259","id":"rule.health.sr3-core-toxins-diseases-resistance-exposure-p249-250","pdf_pages":"258-259","printed_pages":"249-250","record_type":"rule","source":"source.sr3-core","status":"source_reviewed","summary":"Exact original tabletop Body resistance TN, two-success staging, recurring exposure and +4 repeat modifier, timing, vaccine/antidote sequence, and Deadly-wound medical condition."}
