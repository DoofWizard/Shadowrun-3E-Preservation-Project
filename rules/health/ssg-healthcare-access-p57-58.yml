headline: FanPro10667 SR3 fictional health service access and insurance conditions, pp57-58/PDF58-59
summary: Fictional private and public care access, advance-paid response services, and attributed insurance premium differences; existing treatment and contract mechanics retained.
data:
  publication: {title: Sprawl Survival Guide, publisher: FanPro, catalog_number: FanPro10667, year: 2003, edition: Shadowrun Third Edition, source_id: source.fanpro-10667, printed_pages: '57-58', physical_pdf_pages: '58-59', source_pdf_sha256: b0855865c06b20f8c71251d45d980d54470990af656277f5b9ace9264a9e309f}
  private_hospital:
    narrator_access_requirements: [valid SIN, high-quality health insurance]
    corporate_alternative: {speaker: Arclight, claim: Large corporations commonly provide their own private hospitals to employees; smaller corporations contract with local hospitals.}
  public_hospital:
    serves_uninsured: true
    quality: Varies substantially by location.
  neighborhood_clinic:
    narrator: Smaller informal clinics welcome all patients and provide what care they can; staffing and performance vary.
  private_insurance:
    attributed_sin_requirement: {speaker: Lindsay, claim: Private insurers require a SIN; private policies generally cost more and offer less coverage than corporate group policies.}
    attributed_premium_comparison: {speaker: Bung, affected_metatypes: [ork, troll], premium_multiplier: 2, comparison_group: other metatypes, scope: In-world speaker's account including corporate employees; not a universal price rule.}
    attributed_coverage_exceptions: {speaker: Cynic, claim: Insurers have been known to cancel expensive cases despite being expected not to do so; many refuse applicants with pre-existing conditions.}
  armed_response:
    subscription_model: advance payment for chosen service level
    range: Pay-as-you-go service through hazardous-scene recovery and treatment, depending on chosen coverage.
    source_disagreement: {speaker_one: DoubleTalk, claim_one: Do not count on contracted responders assisting other people at the scene., speaker_two: Jess, claim_two: Individual responders sometimes make exceptions.}
  reuse: [rule.health.sr3-core-docwagon-medkit-support-p303-304, rule.health.srcomp-docwagon-contracts-response-p90-91, rule.ssg-sin-citizenship-status-p37]
  scope: Fictional service access context for the gamemaster; no additional treatment dice, universal insurance price, or change to existing DocWagon contract tiers.
