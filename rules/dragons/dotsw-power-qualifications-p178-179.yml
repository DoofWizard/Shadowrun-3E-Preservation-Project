data:
  publication: {title: Dragons of the Sixth World, publisher: FanPro, catalog_number: FanPro10666, edition: Shadowrun Third Edition}
  supplements: [rule.dragons.powers-karma-dragonspeech, rule.dragons.innate-spell-metahuman-form-twist-fate]
  karma:
    permitted_uses: Normal character Karma Pool uses apply.
    optional_purchase_cap: GM may cap the number of additional dice or purchased successes at the original dice pool size, not the original success count.
  dragonspeech:
    range: Unaided line of sight.
    recipients: Living creatures can perceive it even with cybernetic replacement of natural hearing organs.
    background_count_test: Optional at GM discretion in areas of intense background count.
  innate_spells:
    force_qualification: Force is usually equal to Essence, rather than an unconditional value.
  twist_fate:
    reroll_result: Target retains the new roll results after rerolling successful dice.
    reference: The opposed test and other costs and effects remain as recorded in the existing power record.
  lineage: The chapter identifies its differences from the SR3 core chapter as the more recent official treatment; the immutable core is not rewritten.
