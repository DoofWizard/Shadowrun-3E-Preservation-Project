  publication: {title: Dragons of the Sixth World, publisher: FanPro, catalog_number: FanPro10666, edition: Shadowrun Third Edition}
  supplements: rule.dragons.celedyr-earth-magic
  eligibility: Celedyr and true drakes created by him, not all drakes.
  navigation: Eligible creatures instinctively navigate through the earth; the source does not specify a navigation test or target number.
  scope: The earth-passage exception is for movement only. It does not remove the natural-earth astral barrier for spells or line of sight, and does not apply to artificial substances.
  reuse: Existing record supplies physical Walking Rate, unimpeded astral projection and underground Search power.
framing: reference_exact
headline: Earth Magic navigation and movement-only qualification
summary: Adds the omitted instinctive navigation ability and preserves the limited scope of earth passage.
