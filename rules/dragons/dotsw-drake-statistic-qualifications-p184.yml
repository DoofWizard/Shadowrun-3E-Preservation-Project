data:
  publication: {title: Dragons of the Sixth World, publisher: FanPro, catalog_number: FanPro10666, edition: Shadowrun Third Edition}
  supplements: rule.dragons.drakes
  statistic_application:
    dracoform: Published true and bred drake stat lines represent averages in dracoform, not mandatory fixed values for all individuals; attributes and powers may vary.
    humanoid_form: Use individual human or metahuman statistics. Physical attributes tend to be slightly above average for the apparent race and may be varied by the GM.
    mental_attributes: Unchanged between forms.
    true_drake_humanoid_essence: 8
  innate_power_scope: Drake powers generally follow SR3 and Critters, except the explicit qualifications in this source.
  magical_skills: Drakes with the appropriate magical abilities may learn and use magic as full or aspected magicians or adepts; this is not universal for bred drakes.
  lineage: The average dracoform profiles do not establish a universal player-character conversion formula; retain the earlier Threats 2 formula separately without inferring unprinted precedence for individual generation.
framing: reference_exact
headline: Drake average stat profile and humanoid form qualifications
summary: Distinguishes average creature statistics from individual form statistics and confirms the source's game-master discretion.
