id: rule.dragons.innate-spell-metahuman-form-twist-fate
record_type: rule
name: "Innate Spell, Metahuman Form and Twist Fate"
domain: dragons
status: ingested
effective: {status: current, source: source.fanpro-10666, pages: "178-179", basis: updates}
innate_spell:
  force: "equal to dragon Essence"
  drain: "none"
  sustain: "normally per standard spell rules"
  common_examples:
    - Flamethrower
    - Acid Stream
    - Lightning Bolt
    - Steam
    - Mind Probe
    - Alter Memory
    - Control Thoughts
    - Influence
metahuman_form:
  great_dragons: "Acquire a Metahuman Form power similar to the free-spirit Human Form power."
  action: "Exclusive Complex Action to assume; returning to true form is also Exclusive Complex Action."
  physical_abilities: "Metahuman form physical abilities equal those of a normal metahuman of chosen race."
  lesser_dragons: "May use magic to assume metahuman/other forms, but this is not innate and must be sustained/maintained."
twist_fate:
  users: "great dragons"
  opposed_test: "target Willpower vs dragon Essence; initiates may add Grade to Willpower"
  on_dragon_win: "chosen Twist Fate effect succeeds"
  on_tie_or_target_win: "effect fails but spent dragon Karma remains spent"
  effects:
    - "Spend 1 Karma Pool point as a Free Action to negate another visible creature's Karma Pool point expenditure; permanent Karma expenditures to buy successes cannot be negated."
    - "Spend 1 Karma Pool point as a Simple Action to force a visible creature to reroll all successful dice on a test; failed dice are not rerolled. Target may spend 1 Karma Pool point to automatically resist."
    - "Transfer points from dragon Karma Pool to visible characters. Recipient can exceed normal pool maximum, but granted points do not refresh; when used they return when the dragon's pool refreshes."
sources:
  - {source: source.fanpro-10666, pages: "178-179", relation: updates}
