data:
  publication: {title: Dragons of the Sixth World, publisher: FanPro, catalog_number: FanPro10666, edition: Shadowrun Third Edition}
  supplements: rule.dragons.technology-flight-vehicle-combat
  matrix_hitching:
    action: Exclusive Complex Action
    protection: The dragon experiences the Matrix through the decker's mind and is insulated from dumpshock and IC.
    link_break: The dragon must break its mental link before attending to the physical world; the source does not require the decker to wait for this before jacking out.
  flight:
    ordinary_travel_test_required: false
    insufficient_successes: If some successes are obtained but fewer than required, the maneuver fails and the dragon may circle and retry.
    required_successes: GM sets the number according to maneuver difficulty; a simple maneuver may require one.
  vehicle_interaction:
    ramming_body_scope: The equivalent vehicle Body rating is used only for determining the base Damage Level of a collision; the dragon resists using its normal Body attribute.
    melee_range_required: true
    magic: Spells against vehicles use SR3 p150 vehicle and magic rules.
    hardened_armor: Attacks with base Power below Armor rating are deflected; Armor spells can supplement natural armor.
  lineage: Source-specific additions and correction to existing flight and technology record; core remains unchanged.
framing: reference_exact
headline: Dragon Matrix hitching, flight tests and vehicle interaction qualifications
summary: Restores the exclusive action type, link condition, ordinary flight exemption and restricted use of equivalent vehicle Body from the original game source.
