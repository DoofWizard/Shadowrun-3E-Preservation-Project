id: rule.dragons.dotsw-magic-qualifications-p179-181
record_type: rule
status: reviewed
source: source.fanpro-10666
printed_pages: '179-181'
pdf_pages: '181-183'
edition_scope: SR3
content_class: [rule_exact]
data:
  publication: {title: Dragons of the Sixth World, publisher: FanPro, catalog_number: FanPro10666, edition: Shadowrun Third Edition}
  supplements: rule.dragons.magic
  ritual_sorcery:
    materials_required: false
    scope: Applies also to a ritual spell led by a dragon.
    remote_target_link: Material or symbolic link remains necessary when target is outside line of sight.
  conjuring:
    materials_or_special_location_required: false
    controlling: A dragon may attempt to take control of any spirit type it can summon, using normal rules.
    banishing: Any spirit type may be banished, including ancestor and loa spirits that dragons cannot summon or control.
    free_spirit_summon_and_bind: Requires knowledge of the free spirit's true name; bargaining or commanding without that name is not magical binding.
    ally_spirits_frequency: Dragons rarely summon allies, although the usual summoning rules apply.
    blood_spirit_prerequisite: The fictional dragon must know the Sacrificing metamagical technique; dragon society regards summoning blood spirits as a serious crime.
  enchanting:
    virgin_telesma: Separated parts of the dragon's own body qualify as virgin telesma if the dragon chooses to enchant them as a focus.
    ritual_link: Such a focus remains a potential ritual link to the dragon and the character who bonds it.
    focus_retention: These foci may be kept by the dragon or given to very trusted associates; the source does not impose mandatory retention of all detached body parts.
  initiation:
    printed_page: 180
    pdf_page: 182
    great_dragon_initiates: All great dragons are initiates, usually Grade 10 or higher except very young great dragons.
    technique_knowledge: Initiates know techniques according to grade under the normal character rules; the gamemaster chooses which techniques a particular dragon knows.
    common_metamagic: [Masking, Shielding]
    uncommon_metamagic: [Divining, Possessing]
    additional_access:
      Target Awakened Lands: [Sensing]
      State of the Art 2063: [Absorption, Filtering, Psychometry, Severing]
    rare_metamagic: [Channeling]
    additional_access_frequency: The additional-access techniques are not classified as uncommon in this passage.
  astral:
    embodied_attributes: Normal physical attributes apply to interaction with physical and astral beings while embodied.
    spell_targeting: Only mana-type spells affect astral targets.
    initiate_pool: Dragon initiates gain their Astral Pool under Magic in the Shadows p58.
    listed_statistics: Astral Initiative, Astral Combat Pool and Spell Pool entries apply only with appropriate Magical Skills.
    metaplanar_projection: Dragon initiates can project to the metaplanes; this is distinct from ordinary astral projection by dragons with Magical Skills.
  corrects_legacy_fields:
    initiation.status: Use the great-dragon initiation qualification above, including the distinction between initiation and grade.
    initiation.rarer_metamagic: Use uncommon_metamagic and additional_access separately; the legacy combined frequency list is incorrect.
    astral.metaplanes: Apply the initiation qualification above without changing the source's separate rule for astral projection.
    conjuring.sacrificing: Apply the explicit technique prerequisite above.
    enchanting.body_parts: Apply the optional focus retention qualification above.
  lineage: Source-specific qualifications and field corrections to rule.dragons.magic; no core rule is changed.
framing: reference_exact
headline: Dragon magic initiation, metamagic, spirit and astral qualifications
summary: FanPro10666 Dragons of the Sixth World (FanPro, 2003, Shadowrun Third Edition), fictional tabletop rules, printed pp179-181/PDF181-183; distinguishes technique availability from frequency, preserves grade and initiation qualifications, and corrects named legacy fields.
