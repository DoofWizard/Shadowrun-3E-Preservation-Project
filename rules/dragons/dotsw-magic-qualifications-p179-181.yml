data:
  publication: {title: Dragons of the Sixth World, publisher: FanPro, catalog_number: FanPro10666, edition: Shadowrun Third Edition}
  supplements: rule.dragons.magic
  ritual_sorcery:
    materials_required: false
    scope: Applies also to a ritual spell led by a dragon.
    remote_target_link: Material or symbolic link remains necessary when target is outside line of sight.
  conjuring:
    materials_or_special_location_required: false
    controlling: A dragon may attempt to take control of any spirit type it can summon, using normal rules.
    banishing: Any spirit type may be banished, including ancestor and loa spirits that dragons cannot summon or control.
  enchanting:
    virgin_telesma: Separated parts of the dragon's own body qualify as virgin telesma if the dragon chooses to enchant them as a focus.
    ritual_link: Such a focus remains a potential ritual link to the dragon and the character who bonds it.
  astral:
    embodied_attributes: Normal physical attributes apply to interaction with physical and astral beings while embodied.
    spell_targeting: Only mana-type spells affect astral targets.
    initiate_pool: Dragon initiates gain their Astral Pool under Magic in the Shadows p58.
    listed_statistics: Astral Initiative, Astral Combat Pool and Spell Pool entries apply only with appropriate Magical Skills.
  lineage: These are source-specific qualifications to the existing dragon magic record; no core rule is changed.
framing: reference_exact
headline: Dragon magic ritual, spirit, enchanting and astral qualifications
summary: Original FanPro10666 rules preserve material exceptions, spirit eligibility, focus properties and astral interaction limits.
