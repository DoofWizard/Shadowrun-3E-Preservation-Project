id: rule.dragons.celedyr-earth-magic
record_type: rule
name: "Celedyr Earth Magic"
domain: dragons
status: ingested
effective: {status: character_specific, source: source.fanpro-10666, page: 189, basis: defines}
users:
  - world.character.celedyr
  - "true drakes created by Celedyr"
effects:
  astral:
    - "May astrally project through natural earth normally with no impediment."
  physical:
    - "May physically pass through natural earth at a movement rate equal to Walking Rate."
    - "This movement ability does not extend to artificial substances such as brick or concrete."
  limitations:
    - "Natural earth still serves as an astral barrier for spells and for determining line of sight."
  search:
    - "Possess a special version of the spirit Search power for locating people, places or objects underground."
links:
  interacts_with:
    - rule.magic.astral-barriers
sources:
  - {source: source.fanpro-10666, page: 189, relation: defines, note: "Earth Magic"}
