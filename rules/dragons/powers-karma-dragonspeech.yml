id: rule.dragons.powers-karma-dragonspeech
record_type: rule
name: "Dragon Powers, Karma and Dragonspeech"
domain: dragons
status: ingested
effective: {status: current, source: source.fanpro-10666, pages: "178-179", basis: updates}
powers:
  innate:
    - Astral Armor
    - Dragonspeech
    - Enhanced Senses (Enhanced Smell, Wide-Band Hearing, Low-Light Vision, Thermographic Vision)
    - Hardened Armor
  individual:
    - Animal Control
    - Compulsion
    - Corrosive Saliva
    - Empathy
    - Fear
    - Influence
    - Magical Skills
    - Innate Spell
    - Noxious Breath
    - Venom
  great_dragon:
    - Metahuman Form
    - Twist Fate
karma:
  adult_dragon_pool: "10-20 typical"
  great_dragon_pool: "50 or more possible"
  limitation: "GM may limit buying additional dice/successes to no more than the original dice pool or successes."
  good_karma_for_magic: "Generally half the dragon's Karma Pool, subject to GM adjustment."
dragonspeech:
  medium: "telepathic, line of sight, perceived mentally as speech"
  language: "works regardless of recipient language"
  machines: "non-living devices such as microphones cannot detect it"
  blocking:
    test: "Willpower vs TN equal to dragon Charisma"
    duration: "successes = minutes blocked before another test"
    concentration_modifier: "+2 to all other actions while blocking"
  selectivity: "Dragon can make speech audible to selected recipients only."
  background_count:
    test: "Intelligence vs TN equal to background count rating"
    purpose: "hear dragonspeech properly over astral noise"
  extensions:
    - "Some dragons use dragonspeech as the carrier for Animal Control, Compulsion, Empathy, Fear, Influence, and certain Innate Spells."
sources:
  - {source: source.fanpro-10666, pages: "178-179", relation: updates}
