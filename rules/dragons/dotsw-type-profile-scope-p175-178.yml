data:
  publication: {title: Dragons of the Sixth World, publisher: FanPro, catalog_number: FanPro10666, edition: Shadowrun Third Edition}
  supplements: rule.dragons.type-statlines
  sea_dragon:
    profile_scope: The p176 numeric profile describes the sea dragon or leviathan type, not the specific named great dragon profiled on pp137-142.
    breathing: Water and air.
    terrestrial_movement: Slow and clumsy on land; the source reports no observed sea dragon on land.
    manual_dexterity: Poor despite opposable thumbs on the forelimbs.
    numeric_movement_modifier: Not specified in the p176 description.
  great_dragon:
    species_scope: Great dragon specimens occur among all dragon species.
    size_qualification: Often up to 50 percent larger than typical dragons; size is not an entirely reliable identification criterion.
    profile_application: The modifiers on p178 apply to the normal attributes of the great dragon's own type where a plus sign is printed; the ordinary sea dragon profile is not itself a named great-dragon stat block.
framing: reference_exact
headline: Dragon type profile and movement scope (FanPro10666)
summary: Fictional Shadowrun Third Edition tabletop rules from FanPro's Dragons of the Sixth World, printed pp175-178/PDF177-180. Corrects the applicability of the sea dragon type statistics without changing the printed numbers or assigning unsupported movement penalties.
