headline: FanPro25002 SR3 p227 (PDF228) — Italian Confederation fictional campaign profit share
summary: The published game sets a territorial share of net profit for fictional shadowruns in Italy.
data:
  section: Running in Italy
  standard_pizzo_percent: 10
  basis: net profit
  scope: Any fictional shadowrun in the territory of one of the four Italian Mafia organizations described in the game, even when that organization is not involved in the operation.
  qualification: The relevant organization depends on the territory; the source states a standard percentage, not an invariant or a gross-revenue charge.
