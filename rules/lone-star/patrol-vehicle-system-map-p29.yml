data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog_number: FASA7115
    published: 1994
    fictional_game: Shadowrun tabletop role-playing game
    edition: Original/Second Edition historical compatibility (as identified by source
      introduction p5); NOT converted to SR3
  source_anchors:
  - printed_page: 29
    pdf_page: 29
  heading: VEHICLE SYSTEM MAP
  printed_legend:
    CPU: Central Processing Unit
    DS: Datastore
    I/OP: Input/Output Port
    SAN: System Access Node
    SPU: Subprocessor Unit
  topology: CPU is the center with I/O ports 1 through 4, DS, SAN-1, SAN-2, and an
    SM diagram node. The map is a fictional in-vehicle computer-system diagram.
  node_ratings_as_printed:
    CPU:
      security_color: Orange
      security_rating: 3
      Barrier: 4
      Blaster: 3
    I/OP-1:
      security_color: Orange
      security_rating: 3
      Access: 2
      function: Keyboard
    I/OP-2:
      security_color: Orange
      security_rating: 2
      function: Display monitors
    I/OP-3:
      security_color: Orange
      security_rating: 2
      function: Video cameras installed in the car
    I/OP-4:
      security_color: Orange
      security_rating: 4
      function: Other sensors, including those monitoring officer life signs
    DS:
      security_color: Orange
      security_rating: 2
      Access: 4
      Scramble: 4
    SAN-1:
      security_color: Orange
      security_rating: 4
      Access: 4
      Scramble: 4
      Trace and Burn: 4
      Trace and Report: 3
    SAN-2:
      security_color: Orange
      security_rating: 4
      Access: 4
      Scramble: 4
      Trace and Burn: 4
      Trace and Report: 3
  node_functions:
    CPU: Records radio communication, stores front- and rear-camera images, supervises
      electronic/mechanical/weapons systems, provides an LTG directory of Lone Star
      offices/resources and access to surveillance-drone information; source explicitly
      says this does not let patrol officers maneuver drones.
    DS: Records-utility files, CityMap maps and local documents downloaded by officers
      or received at daily briefing.
    SAN-1: Primary cellular link to precinct computer; no LTG address; not externally
      accessible from elsewhere in the Matrix.
    SAN-2: Redundant cellular link; also lacks an LTG address.
  original_edition_rule_fidelity: Keep all ratings, named IC and node colors as printed;
    do not translate, reinterpret, or upgrade to Shadowrun Third Edition Matrix statistics.
