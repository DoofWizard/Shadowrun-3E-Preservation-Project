data:
  source_anchor: Continuation of Summoning Queens, left column above Insect Spirit Profiles
  summoned_queen:
    behavior_reference: Standard free-spirit rules, Grimoire II pp.76-83
    actually_free: false
    exception_power: Spirit Energy
    restriction: Other free-spirit powers and abilities are absent unless the Queen actually gains freedom from
      her summoner.
  spirit_energy_and_potency:
    queen_to_shaman: A present summoned Queen can give points of her Spirit Energy to increase the shaman's effective
      Potency at a 1-to-1 ratio, increasing the number of spirits he may directly control.
    withdrawal: The Queen may take back any Potency points she gave the shaman.
    reuse: If the Queen uses that same Spirit Energy later to increase her own Force Rating, the shaman loses the
      bonus.
    shaman_to_queen: The Queen may demand sacrifice of the shaman's own Potency at 2 Potency points per 1 Spirit
      Energy point gained by the Queen.
    control_relationship: Queen and shaman continually contest control of the hive.
  daily_summoning:
    budget: Queen Force Rating + shaman Magic Attribute + shaman unmodified Potency
    unit: Cumulative Force Rating points of spirits the Queen and shaman can summon per day
    soldier_cost: 2 x summoned spirit Force Rating
    worker_cost: Summoned spirit Force Rating
  hive_limits:
    maximum_true_form_soldiers: Queen Force Rating x shaman Body Attribute
    true_form_workers_as_printed: Queen Force Rating x shaman Willpower x 10
    source_ambiguity: The source expressly says true form workers here although p.137 says workers always manifest
      in flesh form. Preserve both statements without silently substituting a form.
  beetle_summoning_class:
    source_anchor: Beetle paragraph, last lines of right column
    male_beetle: Counts as soldier for summoning
  canonical_links:
    historical_reference_to:
    - rule.spirits.insect-queen-control
