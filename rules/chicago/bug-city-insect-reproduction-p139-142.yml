id: rule.chicago.bug_city.insect_reproduction_p139_142
record_type: historical_tabletop_magic_procedures
status: source_reviewed
source: source.fasa-7117
printed_pages: 139-142
pdf_pages: 148-151
edition_scope: Historical Shadowrun Second Edition Bug City; no inferred Third Edition supersession
content_class:
- rule_procedure
data:
  beetle:
    p: '139'
    pdf: '148'
    additional_spirits: Summon using the roach-spirit procedure on p.142.
  cicada:
    p: '139'
    pdf: '148'
    summoning_and_investiture: As roaches, p.142, except incubation takes Force Rating weeks of the summoned spirit.
  mantis:
    p: 140-141
    pdf: 149-150
    shaman_control: At one time, a Mantis shaman controls at most one female and a number of males equal to shaman
      Potency.
    male_summoning: Standard conjuring, SRII p.139
    female_summoning: Great form procedure, Spirit Forms, Grimoire II p.64
    creation_interval: Female may create new mantids every 2D6 weeks.
    energy_acquisition:
      prerequisite: Merge with and consume at least one male mantis spirit.
      male_outcome: A fully consumed male is destroyed.
      maximum_force_consumed: Female Force Rating + female Spirit Energy
      excess: If the limit prevents full consumption of a male, he retains only the Force not consumed. At the next
        creation cycle the female starts by consuming this partially consumed male.
      time_per_merging: Number of hours equal to male mantis Force Rating
    investment_budget: Following each merging and consumption cycle, combined new-spirit Force Rating points available
      equal twice the Force consumed.
    host: A human host body of the same sex as the mantis spirit being created
    new_male_cost: 1 available Force Rating point per point of new male Force
    new_female:
      procedure: Great form conjuring; default to the female spirit's Willpower because she lacks Conjuring. Make
        all tests as if she were a magician.
      force_point_cost: 2 points for each point of new female Force
      additional_personal_spirit_energy_cost: Half the new spirit's Force, round down
      authorization: A female controlled by a shaman cannot produce another female unless the shaman permits it.
    investment_time: 1 hour per Force Rating point given to the new spirit
    resulting_forms:
      female: Always true form; gains free-spirit powers of aura masking and human form; retains host memories and
        can mimic the host.
      male: Always true form
  mosquito:
    p: '141'
    pdf: '150'
    cocoon_placement: Must be deposited in still or near-still water.
    summoning: Same rules and procedures as roach spirits, p.142.
  roach:
    p: '142'
    pdf: '151'
    shaman_male_summoning: Standard non-Queen insect-spirit summoning, p.137
    unassisted_control_limit: Shaman Potency x 10
    at_limit: No further summoning without aid of at least one Mother.
    mother_control_increase: Each additional Mother allows doubling the number of roaches the shaman can control.
    mother_summoning:
      procedure: Standard great form conjuring, Grimoire II p.64
      drain: Add 50 percent to Mother's Force Rating for calculating resisted Drain, rounding resulting fractions
        up.
      printed_example: Force 5 becomes 7.5, rounded to 8 for the conjurer's Drain Resistance Test.
      spirit_energy: Possesses Spirit Energy, Grimoire II p.79; no other free-spirit powers or abilities unless
        she gains freedom.
    mother_creating_males:
      daily_budget: Mother's Force Rating + Mother's Spirit Energy in Force Rating points, invested into host bodies
    mother_creating_mother:
      permission: Requires shaman permission
      cost: Sacrifice her own Spirit Energy as the new Mother's Force
      new_mother_force_maximum: Producing Mother's own Force minus 1
      duration_days: 2 x producing Mother's Force Rating
      restriction: Cannot create any other roach spirits while producing this female for investment
    maturity: Investment into a host takes 10 days from birth to maturity.
    manifestation: Determine males' true/flesh forms using p.137; Mothers only manifest in true form.
  wasp:
    p: '142'
    pdf: '151'
    host_requirement: Queen must deposit eggs within a host creature.
    sequence: Queen first uses a secreted toxin to paralyze the host, usually during summoning, then deposits eggs.
    manifestation: Larvae either merge with the host to become flesh forms or consume the host and emerge as true
      forms.
  canonical_links:
  - rule.spirits.solitary-insect-spirits
  - rule.spirit-powers.insect-summoning
  - rule.spirits.insect-forms
