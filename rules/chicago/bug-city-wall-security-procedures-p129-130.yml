  land_barrier_climb_p129:
    traverse_distance: Crossing from ground on one side to ground on the other takes 2D6 Complex Actions.
    climb_test: At each climb attempt, make Climbing (2D6) Test; 1 success is enough to move forward.
    slip_trigger: More than half (round up) of the dice rolled for the Climbing Test show 1.
    slip_delay: Additional 1D6 / 2 (round down) Complex Actions to complete climb.
    slip_damage_test: Body-based Damage Resistance Test against target number 4; base Damage Level S; Impact armor reduces
      target number.
    climbing_other_action_modifier: +2 to all target numbers for any physical action while climbing.
    barricade_attack_barrier_ratings:
      explosives_and_elemental_effect_blast_magic: 12
      firearms_and_unarmed_and_other_attacks: 24
    intent: Climbing through shifting debris rather than a continuous engineered surface.
  guards_spotting_climbers_p129:
    observer_rating: Guards use Attribute Rating 5 for Perception Test.
    range_based_target_number: Use SRII p.88 shotgun range categories (specific category/range determines TN).
    adjustments:
    - SRII p.185 Perception Test modifiers
    - SRII p.89 Visibility Modifiers
    optional_sensors: At gamemaster discretion, add 2D6 / 2 (round up) dice to Perception Test at sensor-equipped site.
  tower_visibility_p129:
    spotlights: Two high-power spot/floodlights per tower; illuminate radius 10 meters anywhere within 150 meters to daylight
      equivalent.
    glare: Apply Visibility modifier for Glare (SRII p.89) to target numbers when shooting at or into the lights.
    cover: Use standard Partial Cover modifier (SRII p.78) or expanded Fields of Fire cover modifiers when applicable.
    flares: One or more loads of flares per tower; each illuminates radius 75 meters to daylight equivalent.
  guards_lethal_fire_p129_130:
    firing_constraint: When firing with lethal force against people trapped inside the Containment Zone, guard makes Willpower
      (9) Test and needs at least 1 success.
    retry: Repeat the Willpower (9) Test once each action while target remains in line of sight, until successful or target
      passes beyond line of sight.
    vulnerable_target_modifier: +2 to guard target number for first shot at woman or child; guards reflexively avoid these
      targets.
    wall_crossing_target_modifier: -1 to guard target number for each Combat Turn that guard refrains from shooting at a target
      climbing/penetrating the CZ barrier.
    reciprocal_fire: If the guard is fired upon, all guards immediately return fire.
  swimmer_detection_p130:
    routine: Roll 2D6 for each minute character is in the water.
    patrol_spots_if_result_at_most:
      day: 4
      night: 2
    when_within_50m_of_sensor_buoy_chain: Roll only 8 or less by day, 4 or less by night to spot swimmer.
    guard_stats_reference: Use guards in The Towers/The Guards; water/air vehicles from Rigger Black Book, Living in Oblivion
      p.55.
  astral_barrier_p130:
    patrol: Rating 4 watcher spirit patrols under 2,000 square meters of Tight Terrain (Grimoire SRII p.92).
    modifiers: Apply spirit-patrol modifiers from second-edition Grimoire p.92.
    evasion: On detection, apply Astral Evasion rules SRII p.149.
    additional_force_check: Roll Astral Security Table (2D6) to determine other astral assets.
    astral_security_table_2d6:
    - roll: 2-3
      effect: Same as 6-8, plus Combat Mage from SRII p.50, Threat/Professional Rating 4/3.
    - roll: 4-5
      effect: Same as 6-8, plus 1D6 watchers.
    - roll: 6-8
      effect: An additional 1D6 / 2 (round down) Force 4 watchers.
    - roll: 9-10
      effect: An additional 1D6 / 2 (round down) Force 6 watchers.
    - roll: 11-12
      effect: A single watcher guards the area.
  lineage: Historical second-edition procedure only; not represented as an SR3 rule replacement.
summary: Game procedures for wall climbing, guards, swimmer detection and astral patrols, with exact tests and table entries
  retained.
