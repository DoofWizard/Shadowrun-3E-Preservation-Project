data:
  share_willpower:
    effect: Queen protects subjects with a Willpower barrier; mind-control or mind-reading spells must overcome
      that barrier before affecting a protected subject.
    numeric_resolution: No additional number or test formula is given in this subsection.
  skill:
    timing: When a worker is summoned
    allowed: Any nonmagical Build/Repair or similar skill required by the Queen
    rating: Worker Force
  summoning:
    effect: Queen summons insect spirits to serve her.
    references:
    - Grimoire II pp.102 and 104
    - Bug City p.137
  venom:
    attacks: One or more poisonous attacks
    damage_code: (Essence)S unless otherwise noted
    resolution: Toxin rules, SRII p.186
    speed: 1 turn
  weaknesses_general: Almost all insect spirits have Reduced Senses and Vulnerability in addition to their powers;
    consult individual profiles.
  reduced_senses: Any or all senses may be limited; typically operate at half normal effectiveness rating.
  vulnerability_insecticides:
    weapon_effect: Increase Damage Level by 1 level for insecticide-using weapons or attacks against a vulnerable
      insect.
    example: A 2L insecticide-treated club becomes 2M against a vulnerable insect spirit.
    healing: Wounds caused by such weapons heal normally.
    simple_contact: Nuisance allergy; irritation with no significant game effect.
    ingestion: Extreme allergy, including extreme discomfort and physical harm as an automatic Light Wound.
  canonical_links:
