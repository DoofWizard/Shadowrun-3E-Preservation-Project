id: rule.chicago.bug_city.torpor_astral_conditions_p144_146
record_type: historical_tabletop_magic_procedures
status: source_reviewed
source: source.fasa-7117
printed_pages: 144-146
pdf_pages: 153-155
edition_scope: Historical Shadowrun Second Edition Bug City; no inferred Third Edition supersession
content_class:
- rule_procedure
data:
  torpor:
    p: 144-145
    pdf: 153-154
    living_proximity:
      distance_meters: One-half of the approaching being's Essence or Magic, whichever is greater, round down
      test_by_gamemaster: Approaching person's Essence or Magic, whichever is greater, against insect spirit Force
      awakening: One success wakes the insect.
    magical_proximity:
      subjects: Magic items; active, sustained or Quickened spells; spirits
      distance_meters: Force of the item, spell or spirit passing or used near the insect
      test: Same test as above; target number equals insect Force; one success wakes insect.
      source_precision: The text calls this the same test and does not supply a replacement dice-pool formula for
        each kind of item.
    spell_area:
      condition: A spell's area of effect includes a torpid insect.
      resolution: Make the Essence or Magic Test as if the insect were within insect Force meters of the spell's
        center.
    conjuring_proximity:
      distance_meters: 10 x Force of spirit being summoned
      resolution: Same test as for items or spells; one success wakes insect.
    after_awakening: Aware but immobile for 1 Combat Turn; acts and moves normally on the second Combat Turn.
  background_count:
    p: '145'
    pdf: '154'
    chicago_typical: 1
    significant_harmful_magic_sites: Gamemaster assigns 2 or 3, for example former hives.
    sanctum: 0 within the walls of the former Field Museum; only described clean astral site.
    shattergraves: 4
    cermak_ratings:
    - within_meters: 1000
      rating: 5
    - within_meters: 200
      rating: 6
    - within_meters: 100
      rating: 7
    ordinary_reference: Grimoire Second Edition p.89, Background Counts 1-5
    special_site_reference: London and Tir na nOg describe sites where an aligned character can gain ability.
  astral_pollution:
    p: '145'
    pdf: '154'
    threshold: Background Count above 5
    cause_constraint: Cannot result from normal magic or human endeavors within natural laws; requires something
      unnatural.
    effects:
      astral_success_tests: Apply background-count target-number modifier to any astrally related Success Test per
        the rating 1-5 rules; applies to detection-spell target numbers too.
      spell_drain: +1 Drain target number for each Background Count point above 5
      drain_example: Rating 7 imposes +2 Drain target number.
      astral_damage:
        who: Magician astrally projecting or perceiving into polluted area
        resistance: Damage Resistance Test using Willpower
        timing: Immediately upon projecting/perceiving into area, and at start of every Combat Turn while continuing
        example: Entering mid-turn A requires immediate test; remaining into start of B requires another even if
          the first Action Phase of B will be used to stop projecting.
        damage_type: Physical
        damage_per_combat_turn:
        - background_count: 6
          damage: 6L
        - background_count: 7
          damage: 7L
        - background_count: 8
          damage: 8M
        - background_count: 9
          damage: 9M
        - background_count: 10
          damage: 10D
  detecting_background_count:
    p: '145'
    pdf: '154'
    applies: Magically active character enters any background-count area, polluted or not, before perceiving or
      projecting.
    gamemaster_test: Magic or Essence, whichever is LOWER
    target_number: 12 - Background Count
    examples: Rating 4 gives TN 8; rating 8 gives TN 4.
    active_search: No bonus for actively feeling out area; doing so is Assensing and requires astral perception.
  metaplanar_travel:
    p: '145'
    pdf: '154'
    zone_effect: No target-number modification or other penalty to astral quests or other metaplanar activity.
    atmosphere: Psychological heaviness has no stated mechanical penalty.
  conjuring:
    p: 145-146
    pdf: 154-155
    difficulty: Conjuring within the Containment Zone is not unusually difficult; additional danger comes from insect
      attention and torpor.
    active_insect_attention_radius_meters: 10 x Force of spirit being summoned
    response_test: Success Test with dice equal to nearby insect Force
    target_number: 10 - Force of spirit being summoned
    purpose: Determine whether nearby active insects respond to the summoning.
  canonical_links:
  - rule.magic.background-count
  - rule.magic.mana-warps
  - rule.magic.astral-perception
  - rule.magic.astral-projection
  - rule.chicago.bug_city.insect_spirit_summoning_p137
  lineage: Historical local conditions and astral-pollution rules; no inferred replacement of SR3 rules.
headline: Bug City torpor and astral conditions, pp.144-146
summary: Awakening tests, background-count damage and detection, metaplanar and conjuring rules.
framing: reference_exact
