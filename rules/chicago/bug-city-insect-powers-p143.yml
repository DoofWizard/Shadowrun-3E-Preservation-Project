data:
  source_anchor: Special Powers, through Share Minds
  general: Insects possess standard SRII spirit powers plus these special powers; most special powers are limited
    to Queens.
  animal_control_insect_type: Queen sends swarms of hive spirits for information gathering, mass attacks and similar
    tasks.
  compulsion:
    effect: Queen produces pheromones imposing overriding compulsions on (meta)humans.
    range_meters: Queen Force Rating
    targets: Any character within range
    alternative_delivery: Pheromones may be secreted in a form mixed with food, drink or other substances, or administered
      like a drug; this is a fictional spirit power.
  enhanced_senses:
    examples:
    - heat-sensing organs
    - sonar
    - improved hearing
    - improved smell
    - low-light vision
    - thermographic vision
    - motion detection
    - sensing electrical or electromagnetic field disturbances
    qualification: Many insects have such capabilities; examples are not an automatic grant of all senses to every
      profile.
  fear:
    effect: Terror of the insect or its terrain; target panics and runs as fast as possible toward what it perceives
      as the nearest safe location.
    test: Opposed insect Essence against target Willpower
    outcomes_as_printed:
    - successes: '1'
      effect: Panicked flight
    - successes: '2'
      effect: Flees and does not return
    - successes: '4'
      effect: Flees and does not return; sweats blood if anyone mentions the insect or place
    - successes: 6+
      effect: Disabling phobia
    qualification: No separate 3-success or 5-success entry is supplied; do not invent one.
  paralyzing_touch:
    trigger: Every melee hit, even without damage
    test: Opposed insect Essence against prey Willpower
    quickness_reduction: 1 point per insect net success
    reduction_duration_minutes: Insect Essence
    stacking: Multiple touches can cause multiple Quickness reductions.
    zero_quickness: Cannot move; must make a Willpower Test each paralyzed minute against insect Essence to continue
      breathing.
    failed_breathing_test: No successes on any such test before paralysis ends stops breathing; death after Body
      Attribute minutes unless first aid is applied.
    recovery_if_surviving: Regain 1 lost Quickness point every 10 minutes.
  pestilence:
    disease: Similar to VITAS-3, SRII p.186
    avoid_infection: Successful Body Resistance Test against insect Force + 2
    armor: Does not help resist this damage
  share_minds:
    effect: Two-way telepathy linking Queen with every spirit under her control; she can see and hear what each
      sees and hears.
    topology: Subjects are linked only to the Queen; subject-to-subject communication must be relayed through her.
    usage: Subjects rarely request relaying except for crucial messages.
  continuation: Remaining powers and weaknesses appear on p.144 and require separate review.
  canonical_links:
