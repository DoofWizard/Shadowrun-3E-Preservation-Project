data:
  source_anchor: Bug City p.137, Manifestation Table under Summoning Insect Spirits
  test_reference: Opposed host-Willpower and insect-spirit-Force Success Test described immediately before this table, citing Shadowrun Second Edition p.214
  axis: Host's successes
  outcomes_in_printed_order:
    - host_success_condition: '0 or insect spirit generates more successes'
      result: Host is destroyed; a true-form insect spirit emerges.
      resulting_form: true_form
    - host_success_condition: '1-2'
      result: Host body takes the principal resemblance of the insect spirit's true form, including changes in shape and mass or additional limbs; a flesh-form insect spirit is created.
      resulting_form: flesh_form
    - host_success_condition: '3'
      result: Host body develops some true-form traits, including chitinous armor, multifaceted eyes, or underdeveloped extra limbs; a flesh-form spirit manifests.
      resulting_form: flesh_form
    - host_success_condition: '4-5'
      result: Host body develops only one physical aspect of the true form; a flesh form emerges.
      resulting_form: flesh_form
    - host_success_condition: '6+'
      result: Host retains its original form and gains the free-spirit power of aura masking, but is not a free spirit and remains controlled by its Queen or shaman. This is technically a flesh form, with access to the host's memories and ability to mimic the host.
      resulting_form: flesh_form
      aura_masking_power: true
      is_free_spirit: false
      retains_original_host_form: true
      remains_controlled_by: Queen or shaman
      memory_access: host's memories
      mimic_host: true
  related_rule_id: rule.chicago.bug_city.insect_spirit_summoning_p137
