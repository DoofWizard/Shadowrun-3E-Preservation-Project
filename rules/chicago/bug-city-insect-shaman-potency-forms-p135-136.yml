status: source_reviewed
source: source.fasa-7117
printed_pages: 135-137
pdf_pages: 144-146
edition_scope: Historical Shadowrun Second Edition source material (Bug City, 2056
  setting); no inferred Shadowrun Third Edition supersession
content_class:
- rule_procedure
data:
  source_anchors:
    printed_135: INSECT TOTEMS; INSECT SHAMANS; Increasing Potency
    printed_136: Insect Shaman Threat Rating; Insect Classifications; Forms of Insect
      Spirits
    printed_137: Flesh-form spirit traits (continuation); Summoning Insect Spirits
  insect_totem_game_rule:
    compared_to_standard_totems: An insect shaman may summon a spirit directly embodying
      the insect totem; traditional totem shamans cannot do this as far as is known
      in the text.
    limits: No additional spells or spellcasting benefits beyond normal spellcasting
      and the powerful insect-spirit summoning ability; no ordinary totemic Advantages/Disadvantages
      restrictions apply.
    historic_variants: The text states insect rules had varied in Grimoire II, Queen
      Euphoria, Universal Brotherhood, and Double Exposure. The Bug City term Potency
      replaces the previous use of Threat Rating for insect and toxic threats to avoid
      confusion with general Threat Rating.
    source_period: Rules explicitly discussed as Shadowrun Second Edition; SR3 conversion/supersession
      not claimed.
  potency:
    meaning: Insect shaman personal power; determines how many spirits the shaman
      may control before summoning a Queen (see Summoning Insect Spirits p.137).
    base_game_rule: Insect shaman Threat Rating equals Potency.
    optional_game_rule: If the gamemaster uses optional Magical Threat Rating rules
      from Prime Runners p.100, the insect shaman Magical Threat Rating equals Potency.
    initial_potency_formula: 1D6 ÷ 2, round down
    initial_potency_applies: At start of an adventure involving an insect shaman,
      gamemaster assigns this rating.
    goal_success_delta: +1 Potency for each assigned task completed
    goal_failure_delta: -1 Potency for each assigned task failed
    trajectory: Rating may rise and fall within an adventure according to the progress
      of the hive/nest; the gamemaster defines a series of tasks and provides PCs
      an opportunity to disrupt plans.
    queen_transfer_reference: Insect Queen can grant Spirit Energy to a shaman, increasing
      his Potency (Grimoire II p.79); full summoning/control formulas follow on Bug
      City p.137.
  insect_classification_mechanics:
    classification_axes:
    - 'species/type: ant, wasp, beetle, etc.'
    - 'social pattern: hive or solitary'
    - 'class: worker/soldier/Queen for hive; male/female/Mother for solitary'
    - 'form: true-form spirit or flesh-form spirit'
    hive_classes:
    - worker (sometimes called drone)
    - soldier (also called fighter/warrior)
    - Queen
    solitary_classes:
    - male
    - female
    - Mother (fertile female)
    true_form:
      physical_similarity: Man-sized spirit resembles insect type; normal spirit powers,
        abilities, and weaknesses, with insect-class particulars.
      flight: Only a true-form spirit of a winged insect class can fly (real wings,
        not just vestigial).
      non_flying_movement: On the astral plane a non-flying true-form insect spirit
        moves at Astral Quickness x 3 for normal movement, or Force x 750 kilometers
        per hour for fast movement.
      climbing: Can move along vertical surfaces such as the side of a building at
        any speed.
      banishment: True-form insect spirits can be banished (Shadowrun Second Edition
        p.143).
      minimum_attribute_rating: 1
      abilities:
      - various enhanced senses
      - vulnerability to insecticides
      mandatory_classes:
      - Queen
      - Mother
    flesh_form:
      creation_context: A spirit inhabits a living host; a flesh-form combines aspects
        of the original host and insect type.
      physical_attribute_modifier: Physical Attributes each 1 point less than the
        host’s values.
      mental_attribute_rule: Mental Attributes equal to those of the true-form spirit.
      dual_natured: true
      worker_power: Flesh-form worker has power of Skill (see Special Powers, Bug
        City p.143).
      worker_weakness: Reduced Senses (Sight).
      absent_abilities:
      - no enhanced senses
      - no vulnerability to insecticides
      - cannot be banished
  lineage_refs:
  - Grimoire II (Shadowrun Second Edition), insect spirit material and Spirit Energy
  - Shadowrun Second Edition p.187, Threat Rating
  - Prime Runners p.100, optional Magical Threat Rating
  - Bug City p.137, summoning insect spirits and flesh-form manifestation (continuation)
headline: 'Insect shaman Potency and insect spirit form rules (pp.135–137)'
summary: Historical Second Edition insect shaman Potency, threat rating, totem, and
  spirit-form mechanics.
framing: reference_exact
