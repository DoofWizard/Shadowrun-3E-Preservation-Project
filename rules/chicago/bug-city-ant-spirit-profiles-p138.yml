id: rule.chicago.bug_city.ant_spirit_profiles_p138
record_type: historical_tabletop_critter_statistics
status: source_reviewed
source: source.fasa-7117
printed_pages: '138'
pdf_pages: '147'
edition_scope: Historical Shadowrun Second Edition Bug City; no inferred Third Edition supersession
content_class:
- equipment_stat
data:
  source_anchor: Ant Spirit Soldier (True Form), Ant Spirit Worker (flesh-form), Ant Queen
  notation: F is spirit Force; H indicates the host body's Physical Attribute numbers; Q entries retain the source
    movement multiplier; E entries retain F(A) as printed.
  soldier_true_form:
    attributes:
      B: F + 1
      Q: (F + 4) x 4
      S: F + 4
      C: '-'
      I: F
      W: '2'
      E: F(A)
      R: F x 2
      Armor: F
    initiative: (Reaction + 10)/(Reaction + 20) + 1D6
    initiative_footnote: +20 Initiative in astral space; +10 when physically manifest
    threat_professional_rating: Force/4
    attack:
      skill: Reaction
      damage: STR(M) or as Power
    powers:
    - Enhanced Senses (Smell)
    - Paralyzing Touch
    - Venom
    weaknesses:
    - Reduced Senses (Sight)
    - Vulnerability (Insecticides)
    sex_and_wings: Exclusively male and winged
    stat_scope: Printed attributes describe the physically manifest soldier; in astral space all statistics equal
      its Force.
  worker_flesh_form:
    attributes:
      B: H - 1
      Q: (H - 1) x 3
      S: H - 1
      C: '-'
      I: F - 2
      W: '1'
      E: F(A)
      R: '3'
      Armor: None
    initiative: 3 + 1D6
    threat_professional_rating: 1/2
    attacks: None
    powers:
    - Enhanced Senses (Smell)
    - Skill
    weaknesses:
    - Reduced Senses (Sight)
    - Vulnerability (Insecticides)
    sex_and_fertility: All workers are infertile females.
    source_ambiguity: This profile expressly includes Enhanced Senses and insecticide vulnerability, unlike the
      general flesh-form description on p.137. Both are preserved without inferred erratum.
  queen:
    attributes:
      B: F + 5
      Q: (F + 6) x 5
      S: F + 6
      C: F
      I: F
      W: F
      E: F(A)
      R: F x 3
      Armor: F
    initiative: (Reaction + 10)/(Reaction + 20) + 1D6
    initiative_footnote: +20 Initiative in astral space; +10 when physically manifest
    threat_professional_rating: Force/4
    attack:
      skill: Reaction
      damage: STR(S) or as Power
    powers:
    - Animal Control (Ants)
    - Compulsion
    - Enhanced Senses (Smell)
    - Fear
    - Immunity to Normal Weapons
    - Paralyzing Touch
    - Share Minds
    - Share Willpower
    - Summoning
    - Venom
    weaknesses:
    - Reduced Senses (Sight)
    - Vulnerability (Insecticides)
    sex_and_wings: Fertile females that have lost their wings after mating
    stat_scope: Printed attributes describe the physically manifest spirit; in astral space all statistics equal
      its Force.
  canonical_links:
  - entity.spirit.insect-queen-mother
  - rule.spirits.insect-forms
  - rule.spirits.insect-hive
  - rule.chicago.bug_city.insect_shaman_potency_forms_p135_136
  lineage: Historical species profiles; no replacement of current SR3 spirit records inferred
headline: Bug City p.138 historical ant-spirit statistics
summary: Complete ant soldier, worker and Queen profiles, with source discrepancies retained.
framing: reference_exact
