  barter_pricing: Gamemaster sets barter exchange values using adjusted nuyen equivalents, not a fixed alternate barter-point system.
  base_reference: Containment Zone Costs table, Living in Oblivion p.59, covers common goods; use nearest 1994 U.S. dollar equivalent (USD = nuyen for this purpose) when missing.
  demand_override: Gamemaster adjusts barter value based on story demand, scarcity, and the needs of those exchanging goods or services.
  supply_context: Regular UCAS food drops are sufficient for survival, not surplus storage; hoarding or diversion threatens the balance.
  rare_item_adjustments:
    table_reference: Rare Items Availability/Street Index Table, Bug City pp.132-133.
    availability_notation_example: +3/x3 adds 3 to the Availability target number and multiplies acquisition time by 3.
    generally_unavailable: Means normally not offered for sale; gamemaster may require an acquisition method other than ordinary barter.
    street_index_seller_note: Seller (N+) identifies a seller market where price commonly exceeds the stated Street Index threshold N.
    availability_default: Unless otherwise stated use standard Availability rules.
  source_provenance: Game Information, printed p.131 / PDF p.140.
summary: Historical barter guidance with precise Availability, acquisition-time and seller-market interpretations.
