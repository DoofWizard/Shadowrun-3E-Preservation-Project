id: rule.chicago.bug_city.insect_spirit_summoning_p137
content_class:
- rule_procedure
data:
  source_anchor: 'Bug City p.137: SUMMONING INSECT SPIRITS; Summoning Queens, including continuation above
    Manifestation Table'
  summoning_scope:
    domain: In any domain where insects can survive, irrespective of conventional domain associations; summon
      any appropriate insect-spirit class matching the insect totem
    ordinary_summoning_reference: Shadowrun Second Edition p.139, standard conjuring procedure, for non-Queen/non-Mother
      spirits
    host_requirement: Must be summoned into a living animal host; humans and metahumans are not required, and
      non-metahuman animals can be hosts.
    host_gender: An insect spirit may be summoned into a host of any gender, irrespective of spirit gender,
      except Queens and Mothers require a female creature as host; mantis spirits have additional host preferences
      not quantified here.
  incubation:
    worker: Incubates in host for Force Rating weeks; a worker always manifests in flesh form.
    soldier: Incubates in host for twice Force Rating weeks.
    other_classes: May manifest in flesh form or true form depending on opposed manifestation test.
  manifestation_test:
    reference: Shadowrun Second Edition p.214, opposed Success Test
    actors:
    - host
    - insect spirit
    host_test_attribute: Host Willpower Rating
    host_target_number: 2 x insect spirit Force Rating
    spirit_test_attribute: Insect spirit Force Rating
    spirit_target_number: Host Willpower Rating
    queen_assisted_modifier: If Queen helped summon, add +2 to host target number.
    result_reference: Bug City p.137 Manifestation Table; outcomes in rule.chicago.bug_city.insect_manifestation_table_p137.
  control_without_queen_or_mother:
    true_form_spirit_count_cap: 10 x insect shaman Potency
    total_force_points_cap: 5 x (insect shaman Magic Rating + Potency) collectively across controlled summoned
      true forms
    cap_interaction: Available Force points may constrain practical spirit count below 10 x Potency when Magic
      is low.
    flesh_form_spirit_count_cap: Unlimited; summoned flesh forms do not count against true-form count cap.
    obedience: Summoned spirits follow insect shaman direction unless their Queen explicitly orders otherwise.
    lineage_reference: Grimoire II p.107, Potency and summoning.
  queen_summoning:
    reference: Grimoire II p.64, standard great-form spirit summoning, plus Bug City p.137 additions
    prerequisite: Insect shaman must be an initiate to summon Queen.
    nonplayer_initiation_cost: For NPC insect shamans without Karma, sacrifice Potency points as equivalent
      to Karma for initiation.
    balance_note: Gamemaster may modify non-player character opponent statistics to suit challenge; editorial
      GM guidance, not fixed numerical modifier.
  related_record_ids:
  - rule.chicago.bug_city.insect_shaman_potency_forms_p135_136
