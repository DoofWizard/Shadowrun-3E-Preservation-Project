id: rule.nanotech.pilot-and-programming
record_type: rule
name: Nanite Pilot Ratings and Programming
domain: nanotech
status: ingested
source: source.mm
printed_pages: "83-86,96-97"
pdf_pages: "84-87,97-98"
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: "FASA7126 Man & Machine (FASA Corporation, 1999, fictional Shadowrun Third Edition tabletop RPG), printed pp83-86,96-97/PDF84-87,97-98: nanite capabilities, surgery prerequisites and facility costs"
effective: {status: current, source: source.mm, page: 96, basis: defines}
scope: {applies_to: ["nanoware and nanodrones"]}
resolution:
  summary: "Determine fictional nanite capabilities from Pilot Rating and calculate industrial nanotech facility costs. Keep introductory technological constraints separate from formal game tests."
  inputs: ["nanite type", "Pilot Rating", "facility type", "base facility cost"]
  outputs: ["available functions", "facility cost"]
  steps: []
data:
  general:
    printed_page: 96
    categories: [nanoware within the body, nanodrones capable of external operation]
    semi_autonomous: true
    self_rewriting_programming: false
    constant_radio_signal_required: false
    pilot_rating: "Number of functions the system can perform."
    typical_pilot_rating: 1
    higher_pilot_ratings: rarer and more expensive
    learning_pool: false
    initiative_rating: not_required
    drone_reference: "Rigger 2 p67"
  nanodrones:
    printed_pages: "96-97"
    single_process_production_line_approximate_nuyen: 10000000
    street_index_and_availability_applicable: false
    street_level_access: false
    nanotech_shops_exist: false
    facility_practicality: GM discretion
    associated_knowledge_skill: "Engineering (Nanorobotics)"
    facility_cost_table:
      printed_page: 97
      research_facility_nuyen: "(maximum nanite Pilot Rating + 10)^2 * 100000"
      reprogrammable_nanite_facility_nuyen: "(maximum nanite Pilot Rating + 10)^2 * 250000"
      single_use_production_line_nuyen: "research facility cost + non-nanotech facility cost"
      multi_use_production_line_nuyen: "reprogrammable nanite facility cost + non-nanotech facility cost"
      non_nanotech_facility_reference: "SR3 p288"
  contextual_limits:
    interpretation: "Fictional setting constraints stated in the introduction; no new manufacturing test or pricing formula is supplied there."
    replication:
      printed_pages: "83,86"
      in_body_replication_possible: false
      controlled_environment_and_suitable_materials_required: true
      typical_ideal_replication_days: [10, 15]
      best_case_minimum_days: 7
      best_case_requires_suspending_other_functions: true
      timing_note: "The 10-15 day current ideal-environment description and the separate at-least-one-week best-case statement are retained without equating them or establishing a die-roll mechanic."
      market_factories: "Commercial factories require specialized proprietary inputs or produce sterile systems incapable of further replication."
    autonomy:
      printed_pages: "83,86"
      complex_manufacture_requires_external_controller: true
      large_adaptive_projects: "May require a semi-autonomous knowbot; the source describes possible AI research as unconfirmed."
      direct_metahuman_interface_supported: false
      programming_changes: "Use the external controller; apply the explicit reprogramming and direct-control rules separately."
    cybernetic_surgery:
      printed_page: 84
      required_for_all_cybernetic_surgery: true
      roles: [implanting standalone cyberware, producing effects of other cyberware, connecting cyberware to neural pathways]
      examples: [bone lacing, skillwires, dermal plating, wired reflexes, datajack, balance augmentors, retinal duplication, orthoskin, dermal sheathing]
      direct_integration_examples: [cybereye accessories, filtration systems, chemical immunity tools, chemical analysis tools]
      distinction: "This is a fictional technology prerequisite, not an additional surgical test or a requirement to select the Nanosurgery option for every implant. Apply the actual procedure and option rules separately."
    physical_scope:
      printed_page: 86
      direct_gross_body_change: false
      major_indirect_effects_possible: true
      energy_storage: "Limited to operating the nanite itself."
      environmental_vulnerability: "Stress, shock and environmental changes affect the systems."
links: {uses: [], affects: [], modified_by: [], interacts_with: [subsystem.nanotech.core]}
