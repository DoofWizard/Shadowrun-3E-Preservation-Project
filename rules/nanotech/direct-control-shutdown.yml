id: rule.nanotech.direct-control-shutdown
record_type: rule
name: "Nanite Direct Control and Shutdown"
domain: nanotech
status: ingested
effective: {status: current, source: source.mm, page: 97, basis: defines}
scope: {applies_to: ["nanite systems"]}
resolution:
  summary: "Nanites are not riggable drones. Direct control is limited to supported programming methods. Nanite systems can be shut down by built-in conditions, commands, removal of external power, programmed task completion or system-specific triggers, after which some breeds decay or can later be restarted."
  inputs: ["system design", "shutdown condition", "power source", "programmed task"]
  outputs: ["active, shut down, decaying, or restartable state"]
  steps: []
links: {uses: [rule.nanotech.pilot-and-programming], affects: [subsystem.nanotech.core], modified_by: [], interacts_with: []}
sources:
