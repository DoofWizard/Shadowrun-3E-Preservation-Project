    - two armed ground patrol vehicles
    example_initiative_score: 19
    source_initiative_action_description: Two Combat Phases for this Combat Turn as
      described by the narrator.
    first_initiative_pass_actions:
    - First Simple Action disaffiliates the aerial surveillance drone to free an active
      slot for a ground patrol vehicle.
    - Second Simple Action affiliates one ground patrol vehicle.
    example_next_use_claim: The book says the newly affiliated ground patrol vehicle
      will be usable during Josie's next Initiative Pass.
    general_rule_same_page: The general Subscriber Lists paragraph says a drone may
      not act during the Combat Turn in which it is affiliated.
    interpretive_status: Source-internal timing tension between general Combat Turn
      restriction and worked-example next-Initiative-Pass language; preserve both
      without declaring the example a universal exception or erasing the general rule.
