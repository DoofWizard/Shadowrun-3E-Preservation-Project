  drone_weapon_firing:
    action_cost: Complex Action
    target_scope: An armed weapon on any single drone
    restriction_when_jumped_in_primary: The directly controlling rigger cannot take
      the Fire a Weapon System action with a secondary drone.
    pool_condition: Riggers using a cybernetic link may use Combat Pool dice only
      with their primary drone.
    distinction_from_command: Issuing a command to one drone or group is a separate
      Complex Action; the source does not equate issuing orders with directly firing
      a secondary drone weapon.
