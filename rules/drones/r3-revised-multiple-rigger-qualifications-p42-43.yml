  section: Drones / Multiple Rigger Networks
  qualifications:
    eligible_networks: The source restricts multi-rigger networks to ships and fixed facilities.
    occupied_control: Attempting to take an already occupied captain's chair or directly controlled drone fails.
    assignment: The captain's-chair rigger may assign a standby rigger to a drone only if it is not controlled by another rigger.
    captain_removal: The captain's-chair rigger may remove a drone from another rigger's control without that rigger's consent.
    chair_vacancy: The lead rigger taking direct control of a drone, jacking out, or being dumped can vacate the chair.
