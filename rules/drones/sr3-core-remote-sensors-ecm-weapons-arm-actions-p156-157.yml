  free_action_sensors:
    action: Activate or deactivate sensors on one drone
    action_cost: Free Action
    effect_timing: Activated sensors come online at the start of the next Combat Turn
    qualification: The original book specifies next-turn timing for activation; it
      does not specify a separate deactivation latency in this passage.
  free_action_ecm_eccm:
    action: Activate or deactivate ECM or ECCM on one drone
    action_cost: Free Action
    effect_timing: Activated ECM/ECCM comes online at the start of the next Combat
      Turn
    qualification: The original book specifies next-turn timing for activation; it
      does not specify a separate deactivation latency in this passage.
  free_action_weapon_system:
    action: Arm or disarm one weapon system on one drone
    action_cost: Free Action
    maximum_armed_weapon_systems_per_drone: 1
    switching_armed_weapon_systems_cost: Free Action
    source_condition: The published fictional drone may have only one weapon system
      armed at any one time, even when it has multiple systems available.
  coverage_boundary: This record covers the activation-state restrictions omitted
