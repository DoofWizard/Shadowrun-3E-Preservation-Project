  section: Robots / Adaptation Pool / Initiative
  adaptation_pool:
    owner: individual robot
    base_dice: that robot's Pilot rating
    eligible_success_tests: tests a standard character could augment with Combat Pool, Control Pool or Task Pool dice
    relevance_condition: action directly supports that robot's prime directive
    historical_normalization_conflict: The summary of rule.drones.robots describes a shared Adaptation Pool; the revised original assigns a pool to a robot using its own Pilot rating. Sharing is specified separately for IVIS, not for Adaptation Pool.
  initiative:
    autonomous_phase_qualification: Robots need not act simultaneously with their rigger, unlike standard drones; they use their own Reaction and Initiative.
