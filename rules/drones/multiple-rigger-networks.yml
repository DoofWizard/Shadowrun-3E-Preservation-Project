    "excludes": []
  },
  "resolution": {
    "summary": "Some large networks support multiple riggers with one captain's-chair controller and standby/direct-control riggers under an exclusion principle.",
    "inputs": [
      "network roles",
      "drone control state"
    ],
    "outputs": [
      "which rigger controls which network element"
    ],
    "steps": [
      "Only ships/fixed facilities normally support multiple riggers.",
      "A rigger may be in captain's chair, direct-control a drone, or stand by.",
      "Standby rigger can communicate/perceive through network but cannot issue commands or control drones.",
      "Only one rigger may control captain's chair; only one rigger may directly control a particular drone.",
      "If captain's chair becomes vacant, a standby rigger may take over. If contested, resolve Opposed Willpower Test; winner gets captain's chair.",
      "Captain's-chair rigger can remove a drone from another rigger's control; direct-control rigger can relinquish drone to standby."
    ]
  },
