  section: Drones / Subscriber Lists / Configuring a Subscriber List
  qualifications:
    configuration_distinct_from_affiliation: Configuring a fictional drone for a subscriber list is not affiliating it to the list; the appropriate datafile is required for configuration.
    unused_list_storage: A subscriber list not needed immediately may be stored on a code fill module.
    fictional_interface_compatibility: The digital-code fill module and its drone data port are incompatible with standard datajacks and cyberdeck FUPS ports.
    file_access_test_condition: Accessing the appropriate file normally requires no skill test if the character has previously worked with drones; otherwise successful completion requires an appropriate Vehicle Background (4) Test.
    programming_test_condition: The Electronics (4) programming test applies in stressful or critical circumstances, i.e. when a Success Test is required.
  reuse:
    - rules/drones/subscriber-lists.yml
    - rules/drones/sr3-core-remote-deck-subscriber-limits-p156.yml
  scope_limit: The revised-source qualifications distinguish configuration from affiliation; reuse existing base times, reboot effects and affiliation actions without resolving the printed timing tension or asserting an original FASA7910 edition difference.
