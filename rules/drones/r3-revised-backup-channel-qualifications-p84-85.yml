    trigger: A fictional channel has suffered MIJI degradation.
    choice: The rigger may deactivate the degraded game channel and reassign its functions to another channel.
    mandatory: false
  combined_channel_action_modifier:
    value: 2
    applies_to: All game actions using either of the two combined original channel functions while the backup arrangement persists.
  scope: Existing channel classes, opposing location modifier and prohibition on consolidating all three remain in the referenced rule; apply the action modifier once, not separately for each function. No historical edition change inferred.
