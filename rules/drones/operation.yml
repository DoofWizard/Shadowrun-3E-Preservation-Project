resolution:
  summary: "Drones have Pilot Ratings and normally operate autonomously with Pilot-based tests. A rigger may control drones through a remote-control network, jump into a primary drone, or supervise multiple drones; secondary drones and captain's-chair operation use their own rating substitutions and bonus restrictions."
