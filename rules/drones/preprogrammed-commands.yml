    "summary": "Stored commands can encapsulate detailed drone behavior and remote-control channels can back one another during EW degradation.",
    "inputs": [
      "command complexity",
      "programming successes",
      "deck storage",
      "channel state"
    ],
    "outputs": [
      "stored command",
      "backup-channel configuration"
    ],
    "steps": [
      "Each preprogrammed command covers one specific task and must contain explicit formation/direction/distance/speed details. Command complexity cannot exceed RC deck rating.",
      "Before run, Computer (Programming) Test against GM-set complexity TN. Memory MP = (complexity TN²×100)÷successes. Programming hours = TN÷successes.",
      "During run activate a stored command as Free Action; RC deck directs drones automatically.",
      "RC deck channels are command/system/simsense. One may act as backup for another; actions on a channel carrying two functions suffer +2 TN, while intruder trying to locate that channel gets -1 TN. All three cannot be consolidated onto one channel."
    ]
