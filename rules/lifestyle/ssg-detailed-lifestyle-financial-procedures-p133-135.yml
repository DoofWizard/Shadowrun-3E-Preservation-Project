  section: Game Information / Detailed Lifestyles / Other Considerations, payment, roommates and SINless characters
  optional: true
  permanent_lifestyle:
    full_purchase_multiplier: 100 × ordinary base monthly cost, as in SR3 p241; does not infer new core rules
    partial_category_purchase_formula: (sum of category points permanently bought / total current lifestyle points)
      × current base monthly lifestyle cost × 100
    partial_purchase_example:
      bought_points: 8
      total_points: 20
      base_monthly_nuyen: 6650
      purchase_nuyen: 266000
    ongoing_payment: Use the Lifestyle Costs Table on the points of categories not bought; do not merely subtract
      a proportional cost.
    ongoing_example:
      remaining_points: 12
      monthly_nuyen: 1000
  category_changes:
    duration: 2D6 days per category level changed; add rolls for multiple level and category changes
    upward_change_payment: Higher monthly lifestyle cost begins at start of the change, before work completed
    downward_change_payment: Lower monthly cost begins only after the necessary change time is completed
    limitations: Area and usually Space changes require a move; the source lists other contextual restrictions and
      gamemaster judgment.
  multiple_lifestyles:
    aggregation: Calculate each lifestyle point total and monthly nuyen bill separately; sum money costs, not points.
    example:
      home_points: 20
      home_nuyen: 6650
      hideout_points: 8
      hideout_nuyen: 400
      total_monthly_nuyen: 7050
  regional_differences:
    formula: Published local Cost of Living/Lifestyle percentage multiplied by Seattle base lifestyle cost.
    examples:
    - region: Sydney
      regional_percent: 150
      base_monthly_nuyen: 7500
      local_monthly_nuyen: 11250
    - region: Perth
      regional_percent: 90
      base_monthly_nuyen: 7500
      local_monthly_nuyen: 6750
    unlisted: Gamemaster sets local percentage if no source table exists.
  roommates:
    communal_categories:
    - Area
    - Space
    individual_upgrades: Other categories may be upgraded for individual residents without applying improvements
      to roommates.
    communal_cost_formula: Base shared-category lifestyle cost × (1 + 0.20 × (occupants - 1)); members split this
      cost by an agreed method.
    individual_extra_cost: Personal full lifestyle monthly cost minus communal-category base monthly cost, plus
      that resident’s share of revised communal cost.
    worked_case:
      occupants: 3
      communal_points: 26
      communal_base_nuyen: 40000
      member_total_points: 28
      member_full_nuyen: 70000
      personal_extra_nuyen: 30000
      communal_with_occupants_nuyen: 56000
      communal_share_nuyen_approx: 18667
      member_monthly_nuyen_approx: 48667
    dependent_occupants: The same +20 percent communal cost rule applies for each extra NPC; a character living
      with three children pays 160% of the base communal cost.
  sinless_characters:
    forged_id: Maximum points per lifestyle category equals forged SIN rating + 2.
    example:
      forged_id_rating: 2
      max_points_per_category: 4
    no_fake_id: Without a fake ID, a character is limited to a grand total of 12 lifestyle points.
  missed_payments:
    shortfall: Difference in points between the lifestyle actually lived and points paid for, using the Lifestyle
      Costs Table; round a partial payment down to whole points.
    check_frequency: Each month the full lifestyle cost is not paid, until debt is paid off.
    standard_roll: 2D6
    easygoing_landlord_edge_roll: 3D6
    trigger_happy_landlord_flaw_roll: 1D6
    trigger: If test result is less than or equal to the lifestyle points shortfall, roll a further 1D6, applying
      the Shadowrun Rule of Six, and subtract that result from the current lifestyle point total.
    effect: The gamemaster selects categories in which points are lost; the character has time to respond; another
      monthly loss may occur while arrears persist.
    example:
      full_lifestyle_points: 20
      full_monthly_nuyen: 6650
      paid_nuyen: 2500
      payment_equivalent_points: 14
      shortfall_points: 6
      trigger_roll_threshold: 2D6 ≤ 6
      example_loss_die: 4
      reduced_points: 16
      reduced_monthly_nuyen: 3650
  hiding_from_collectors:
    opposed_test: Stealth against fictional landlord/collector Intelligence, or corporate Efficiency as appropriate;
      success contest.
    two_net_successes: Each 2 net successes delays detection for one week.
    repeat_attempt: On subsequent Stealth contests, increase the landlord or collector Intelligence rating (or
      corporate Efficiency rating) by a cumulative +1 each time; the third contest gains +2.
    when_moving: Old landlord or collector may still pursue in-world outstanding debt; fake ID rating may contribute
      dice to Stealth.
  service_boosting:
    rule: A decker who personally increases own Matrix services or subscriptions may raise Entertainment by 1 point
      without paying extra for the increase.
    exception: This benefit does not apply to other residents whose subscription upgrades the decker purchases;
      their service cost must be counted.
  code_validation_status: Original source mechanics reviewed; numeric worked cases are specifications and not executed
    game-engine tests.
headline: Exact optional Detailed Lifestyles payments and roommate rules — FanPro Sprawl Survival Guide (FanPro10667),
  Third Edition, pp133-135
summary: Original fictional Shadowrun rules for partial home purchases, rating changes, roommate 20% surcharge,
  SINless limits and monthly arrears checks, with printed numeric examples.
