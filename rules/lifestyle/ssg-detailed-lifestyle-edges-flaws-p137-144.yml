id: rule.lifestyle.ssg-detailed-lifestyle-edges-flaws-p137-144
record_type: rule
status: source_reviewed
source: source.fanpro-10667
printed_pages: 137-144
pdf_pages: 138-145
edition_scope: Original FanPro Sprawl Survival Guide (FanPro10667, 2003), Shadowrun Third Edition optional Detailed Lifestyles
  extension; does not replace FASA7001 core lifestyle rules
content_class:
- rule_exact
framing: reference_exact
headline: Lifestyle Edges & Flaws original option modifiers — FanPro Sprawl Survival Guide (FanPro10667), Third Edition, pp137-144
summary: Original optional fictional game-system numeric Edge/Flaw modifiers, exclusions, monthly cost formula and exceptional
  source examples.
data:
  publication:
    title: Sprawl Survival Guide
    publisher: FanPro
    catalog_number: FanPro10667
    year: 2003
    edition: Shadowrun Third Edition
    source_id: source.fanpro-10667
    source_pdf_sha256: b0855865c06b20f8c71251d45d980d54470990af656277f5b9ace9264a9e309f
    source_kind: fictional tabletop role-playing game supplement
    printed_pages:
    - 137
    - 138
    - 139
    - 140
    - 141
    - 142
    - 143
    - 144
    physical_pdf_pages:
    - 138
    - 139
    - 140
    - 141
    - 142
    - 143
    - 144
    - 145
  section: Game Information / Detailed Lifestyles / Lifestyle Edges & Flaws, examples and acquisition/removal
  optional: true
  modifiers:
    default_monthly_cost_formula: Monthly cost after modifiers = base monthly lifestyle cost × (1 + sum of individual Edge
      and Flaw modifiers).
    max_edges_per_lifestyle: 5
    max_flaws_per_lifestyle: 5
    monthly_cost_change_cap_fraction: 0.5
    source_example:
      base_monthly_nuyen: 5000
      edge_modifiers:
      - 0.1
      - 0.15
      flaw_modifiers:
      - -0.05
      total_modifier: 0.2
      final_monthly_nuyen: 6000
    asterisk_marked_options: Items with detailed_lifestyle_only=true are marked * by the original source and tied specifically
      to this detailed system; others may be used with the core system too.
    gamemaster_approval: GM has final say on permissible combinations and exceptional cases.
  edges:
  - name: Astral Repellent
    modifier: 0.2
    effect: After successful conjuring to enter the home, astral beings must also pass Willpower (5); failure also fails conjuring.
    incompatible_with:
    - Astral Magnet
  - name: Bribed Security
    modifier: 0.15
    effect: Halve response times once an alarm is sounded.
    incompatible_with:
    - Underpaid Security
  - name: Concerned Neighbors
    modifier: 0.05
    effect: Local neighbors notice suspicious activities with Intelligence 3 for intruder detection.
  - name: Defensive Setup
    modifier: 0.1
    effect: Home residents familiar with layout may benefit automatically from Partial Cover in ranged combat or Superior
      Position in melee.
    incompatible_with:
    - Ambush Friendly
  - name: Easygoing Landlord
    modifier: 0.05
    effect: Use 3D6 instead of usual 2D6 for detailed lifestyle nonpayment check, or 2D6 instead of standard SR3 1D6.
    incompatible_with:
    - Trigger-Happy Landlord
  - name: Escape Tunnel
    modifier: 0.1
    effect: A concealed exit/entry route allows secret escape and access.
  - name: Good Insulation
    modifier: 0.05
    effect: Building maintains tolerable internal conditions during outside extremes.
    incompatible_with:
    - Bad Insulation
  - name: Good Reputation
    modifier: 0.05
    effect: Negotiation tests with contractors and delivery/service providers receive -2 to target numbers.
    incompatible_with:
    - Bad Reputation
  - name: Hasty Access
    modifier: 0.05
    effect: Under unusual circumstances, enter or leave home from any room within one Combat Turn.
    incompatible_with:
    - Difficult Access
  - name: Helpful Neighbors
    modifier: 0.05
    effect: A specific chosen group of neighbors provides helpful assistance.
    may_stack_for_separate_neighbor_groups: true
  - name: Inconspicuous Housing
    modifier: 0.1
    effect: Increase target numbers to locate the character or obtain information about tenants by +1.
  - name: Insurance
    modifier: 0.1
    effect: Under same SIN, if house becomes unusable, replacement temporary lifestyle of equivalent value without additional
      cost until repaired; first use permanently raises Edge modifier by +0.05 for all homes under same SIN; cumulative with
      repeated claims.
    requires_sin_registration: true
    after_each_claim_modifier_increase: 0.05
    all_homes_same_sin_affected: true
    purchased_lifestyles_not_registered_to_sin_eligible: false
  - name: Manaline/Power Site in the Basement
    modifier: 0.2
    effect: Location directly on rating 1 manaline or power site; normal magical benefits and unwanted attention.
    modifier_if_awakened: 0.3
    site_rating: 1
  - name: Masterful Engineering
    modifier: 0.05
    effect: Home alteration tasks use 1D6 days per point instead of ordinary 2D6 days.
    incompatible_with:
    - Patchwork Engineering
    detailed_lifestyle_only: true
  - name: Motivated Service
    modifier: 0.1
    effect: Outside nonsecurity home services complete time-sensitive tasks in half the usual time.
    incompatible_with:
    - Disgruntled Service
  - name: No More Neighbors
    modifier: 0.15
    effect: No nearby neighbors, no distractions or help.
    cannot_combine_with_any_other_neighbor_edge_or_flaw: true
  - name: One Step Away From Everything
    modifier: 0.05
    effect: Halve travel times to specialty shops, services and amenities.
    incompatible_with:
    - Middle of Nowhere
  - name: Pest Repellent
    modifier: 0.05
    effect: Pests approaching residence must make Willpower (6).
    incompatible_with:
    - Infestation
  - name: Privacy Screen
    modifier: 0.1
    effect: For outside surveillance on residence, +1 to tests target numbers per purchased level, to maximum three levels.
    incompatible_with:
    - No Privacy
    per_level: true
    maximum_levels: 3
  - name: Quiet Neighborhood
    modifier: 0.15
    effect: Security breaches occur half as often as normal.
    incompatible_with:
    - Rough Neighborhood
  - name: Reliable Utilities
    modifier: 0.1
    effect: Basic utility services remain available even during extreme conditions.
  - name: Roommate From Heaven
    modifier: 0.1
    effect: An unusually cooperative roommate; multiple separately purchased roommate entries represent extra helpful residents.
    repeatable: true
  - name: Terrific View
    modifier: 0.05
    effect: Impressive view in specified direction; may recur for different views.
    repeatable: true
  - name: Vigilant Security
    modifier: 0.15
    effect: Increase home Security rating by 1 only for quantity of dice rolled on tests against intrusion attempts.
    incompatible_with:
    - Inattentive Security
    detailed_lifestyle_only: true
  - name: Watertight
    modifier: 0.05
    effect: Rain and flood protection keeps interior dry.
    incompatible_with:
    - Waterlogged
  flaws:
  - name: Ambush Friendly
    modifier: -0.1
    effect: Intruders succeeding in Perception Test to find opening receive Partial Cover (ranged) or Superior Position (melee).
    incompatible_with:
    - Defensive Setup
  - name: Annoying Neighbors
    modifier: -0.05
    effect: Specific group of neighbors repeatedly causes disturbances.
    repeatable_for_separate_neighbor_groups: true
  - name: Astral Magnet
    modifier: -0.2
    effect: Astral pests and wild spirits are unusually drawn to the home.
    incompatible_with:
    - Astral Repellent
  - name: Background Count
    modifier: -0.2
    effect: Residence has a background count of level 1.
    modifier_if_awakened: -0.3
    background_count_rating: 1
  - name: Bad Insulation
    modifier: -0.05
    effect: Poor insulation exposes residents to harsh outside temperatures.
    incompatible_with:
    - Good Insulation
  - name: Bad Reputation
    modifier: -0.05
    effect: Negotiations with outside contractors or service providers incur +2 to target numbers.
    incompatible_with:
    - Good Reputation
  - name: Cacophonous Neighborhood
    modifier: -0.05
    effect: Sustained neighborhood noise interferes with sleep and quiet.
  - name: Crashpad
    modifier: -0.1
    effect: House is a hangout/overnight stop for a gang or social circle, reducing privacy and security.
  - name: Cursed Amenities
    modifier: -0.1
    effect: Unreliable utilities, hot water and power hamper ordinary use.
  - name: Difficult Access
    modifier: -0.05
    effect: Entry or exit takes at least two minutes due to awkward access.
    incompatible_with:
    - Hasty Access
  - name: Disgruntled Service
    modifier: -0.1
    effect: Outside nonsecurity service workers perform tasks slowly and poorly.
    incompatible_with:
    - Motivated Service
  - name: Disgusting Neighborhood
    modifier: -0.05
    effect: Residence lies by unpleasant industrial/waste site, reducing living quality.
  - name: Gnomes Under the Floorboards
    modifier: -0.1
    effect: Small Concealability 8+ objects have 1-in-6 chance to go missing; at level 1 they reappear after 1D6×1D6 days;
      level 2 permanently gone.
    modifier_for_level_2: -0.2
    missing_chance: 1 on 1D6
    concealability_threshold: 8
    level_1_reappearance_days: 1D6 × 1D6
    level_2_reappearance: never
  - name: Haunted
    modifier: -0.1
    effect: Disturbances disturb sleepers; at level 2 site contains an unbanished Force 1 Specter and must resolve the entity.
    modifier_for_level_2: -0.2
    level_2_specter_force: 1
  - name: Horrible View
    modifier: -0.05
    effect: Bad view from specified direction, repeatable for distinct views.
    repeatable: true
  - name: Inattentive Security
    modifier: -0.15
    effect: Reduce home Security rating by 1 only for quantity of dice rolled against intrusion attempts.
    incompatible_with:
    - Vigilant Security
    detailed_lifestyle_only: true
  - name: Infestation
    modifier: -0.1
    effect: Frequent pest activity inside home; at level 2 the type and frequency is up to gamemaster.
    incompatible_with:
    - Pest Repellent
    modifier_for_level_2: -0.2
  - name: Intolerant Neighbors
    modifier: -0.05
    effect: Specific set of neighbors reports and disrupts household.
    repeatable_for_separate_neighbor_groups: true
  - name: Living By Committee
    modifier: -0.1
    effect: Commune imposes meetings, duties, and shared upkeep on residents.
  - name: Living With Parents
    modifier: -0.25
    effect: Housing cost reduced by living with parents or property-owning relative at cost of restrictive house rules; only
      removal is moving out.
  - name: Mail Leftovers
    modifier: -0.05
    effect: Legacy mail and complaints continue from prior tenant; requires roleplay to resolve.
  - name: Middle of Nowhere
    modifier: -0.05
    effect: Double travel time to specialty services compared with normal.
    incompatible_with:
    - One Step Away From Everything
  - name: No Hazard Alarm
    modifier: -0.05
    effect: House lacks alarms for fire, electrical or other hazards.
  - name: No Privacy
    modifier: -0.05
    effect: External surveillance target numbers decrease by 1 per purchased level, to maximum three levels.
    incompatible_with:
    - Privacy Screen
    per_level: true
    maximum_levels: 3
  - name: Patchwork Engineering
    modifier: -0.05
    effect: Renovations take 3D6 days per point instead of normal 2D6 days.
    incompatible_with:
    - Masterful Engineering
    detailed_lifestyle_only: true
  - name: Portal in the Closet
    modifier: -0.05
    effect: A hidden physical passage to an unpleasant area, extent varies with purchased Flaw level.
    possible_min_modifier: -0.2
  - name: Roommate From Hell
    modifier: -0.05
    effect: Difficult roommate; may purchase multiple roommate entries for additional residents, who do not count toward rent.
    repeatable: true
  - name: Rough Neighborhood
    modifier: -0.15
    effect: Security violations happen twice normal frequency.
    incompatible_with:
    - Quiet Neighborhood
  - name: This Isn’t Sam’s Pizza
    modifier: -0.05
    effect: Residence telecom contact attracts persistent calls intended for a business.
  - name: Trigger-Happy Landlord
    modifier: -0.05
    effect: Use 1D6 instead of 2D6 for detailed lifestyle monthly nonpayment checks; for standard SR3 payment failure, roll
      1D6, divide result by two and round down.
    incompatible_with:
    - Easygoing Landlord
  - name: Underpaid Security
    modifier: -0.15
    effect: Double security response times after an alarm.
    incompatible_with:
    - Bribed Security
  - name: Unreliable Security
    modifier: -0.05
    effect: Roll 1D6 on requests for security help; on a roll at or below purchased level no help arrives, maximum five levels.
    per_level: true
    maximum_levels: 5
  - name: Victory Gardens
    modifier: -0.2
    effect: Home used for substantial indoor cultivation; effective Space rating reduced by one lifestyle category. Under
      this book’s detailed system, applies to the housing/Space category.
    effective_space_level_change: -1
  - name: Waterlogged
    modifier: -0.05
    effect: Water enters through roof or floor during precipitation.
    incompatible_with:
    - Watertight
  sample_packages:
  - name: Co-op Housing
    printed_total_modifier: -0.5
    features: Community resources, meetings and upkeep; several specified roommate/neighborhood flaws.
  - name: Community Beacon
    printed_total_modifier: 0.45
    features: Well-regarded, helpful and convenient home with several positive neighbor and service edges.
  - name: House of the Dead
    printed_total_modifier: -0.8
    modifier_for_awakened: -0.9
    source_exception: The printed example explicitly says it exceeds the usual number-of-Flaws rule; totals also exceed the
      stated 50% cost-change cap, and the source supplies no clear universal precedence. Keep the example as printed without
      treating this as a generalized engine override.
  - name: Safehouse
    printed_total_modifier: 0.5
    features: Defensive and hidden housing combining Defensive Setup, Hasty Access, No More Neighbors and two Privacy Screen
      levels.
  purchase_or_removal:
    adding_edge: GM-approved roleplay/work and ongoing increase in monthly lifestyle charge
    adding_flaw: May follow game events; monthly cost decreases as flaw manifests
    removing_edge: Stop paying/upkeeping its features; GM judges whether roleplay allows immediate removal
    removing_flaw: Requires repair/roleplay and appropriate expenses; after satisfied, higher monthly cost applies
    permanent_lifestyle_one_time_price_adjustment: If property is permanently owned, the difference in Edge/Flaw cost is paid
      or returned as one lump sum, with 100 months used as the full purchase multiplier; GM determines refund mechanism.
  source_ambiguities:
  - The House of the Dead package’s printed -0.80/-0.90 modifier exceeds the general 50 percent lifestyle cost-change limit.
    Preserve both facts without inventing precedence.
  code_validation_status: Direct source-page review of cost modifiers and linked effects; executable game-engine validation
    not performed.
