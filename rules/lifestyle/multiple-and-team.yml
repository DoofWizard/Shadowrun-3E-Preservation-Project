scope:
  applies_to:
    - entity.lifestyle.lifestyle

resolution:
  summary: "Characters may maintain multiple lifestyles for different purposes. Teams may jointly purchase team lifestyles/safehouses; individual characters still maintain personal lifestyles unless the campaign circumstances dictate otherwise."
  inputs:
    - "number and level of lifestyles"
    - "team contributions"
  outputs:
    - "separate maintained residences/safehouses"

