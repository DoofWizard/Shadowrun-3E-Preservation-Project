{"id":"rule.first_run.supernova_garage_escape_and_karma_p37_39","record_type":"rule","status":"reviewed_forward_unindexed","source":"source.fasa-7329","printed_pages":"37-39","pdf_pages":"38-40","edition_scope":"FASA Corporation First Run (FASA7329, 1999), original Shadowrun Third Edition fictional tabletop RPG adventure; no later-edition conversion","content_class":["rule_exact"],"data":{"publication":{"title":"First Run","publisher":"FASA Corporation","author":"Michael Mulvihill","copyright_year":1999,"catalog_number":"FASA7329","source_id":"source.fasa-7329","edition":"original Shadowrun Third Edition","cataloged_original_pdf_sha256":"222cb911ef86b0ddf2a853d622068859fe09a078d23c881a32cee0100eaf0c5e","printed_pages":"37-39","physical_pdf_pages":"38-40"},"original_page_mapping":{"printed_37":38,"printed_38":39,"printed_39":40},"context":"Exact source-specific resolution of the fictional Supernova finale and the chapter's printed Karma-award table, not real vehicle advice.","garage":{"renraku_team":"Three vans are described at the garage access; two block the road and one obstructs the ramp. Source directs GM to use the original Red Samurai statistics in the Cast of Shadows section, printed p40.","cyberzombie":"Source's scripted order list prioritizes attacking the garage door, then the first person seen, disabling a vehicle, and moving to the next vehicle, subject to the encounter's stated conditions.","first_vehicle_target":"After a first-vehicle attack order, roll 1D6: odd results select the characters' vehicle; even results select Villiers's vehicle.","if_runners_assist":"Cyberzombie and Renraku group may engage once the characters agree to assist Villiers; otherwise the written scene has the characters attempting to escape separately."},"driving_escape":{"required_maneuvers":3,"sequence":["Pass the cyberzombie or the Red Samurai group that breaches the garage door","Pass the van obstructing the ramp","Bypass the road blockade"],"test":"Use original Shadowrun Third Edition Driving Test Modifiers, p134.","terrain":"Tight Terrain: +3 target-number modifier","stress":"Stressful situation: additional +2 target-number modifier","successful_test":"The GM narrates a clean maneuver; after all three succeeded the characters escape.","failed_test":"Source calls for a ram into either the cyberzombie or a van. Apply the original SR3 Ramming rules p143, including consequences of a crash.","optional_outcome":"Villiers and Lanier might aid the team under the condition that the player group agreed to help them; the narrated response varies with that decision."},"karma":{"source_heading":"AWARDING KARMA","original_sr3_reference":"SR3 original p244","entries":[{"condition":"Surviving the run","karma_points":2},{"condition":"Threat Level","karma_points":1},{"condition":"Not trying to harm Villiers or Lanier","karma_points":1},{"condition":"Killing the cyberzombie","karma_points":1}],"note":"Original book awards individual Karma to each team member according to achievements; entries are not a promised automatic total. Do not substitute later-edition awards."},"provenance_distinctions":"The source's conditional escape and scripted force behavior are fictional gamemaster procedures, not historical events."},"headline":"Supernova — exact Third Edition escape maneuvers and Karma awards","summary":"Fictional Shadowrun First Run, FASA Corporation FASA7329 (1999), original Third Edition, printed pp37–39/PDF38–40; three vehicle maneuvers, +3 and +2 modifiers, 1D6 target selection, and four exact Karma rewards.","framing":"reference_exact"}
