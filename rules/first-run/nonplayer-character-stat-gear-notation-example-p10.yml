    "source_gear_notation_rules": {
      "ratings_follow_name": "Applicable ratings appear in parentheses after the gear item. Classification or magical gear details also appear in parentheses; Damage Codes, where applicable, appear in brackets.",
      "ranged_weapon_record": "The bracketed weapon information includes class, firing mode(s), Damage Code, ammo/reload information, recoil compensation and attachments. Distances and base target numbers without recoil modification are shown below each ranged weapon.",
      "range_tn": "The target number at each range band appears in parentheses after that band; these are listed as unmodified by recoil.",
      "melee_weapon_record": "Damage Code and reach, if any, appear in brackets. Strength-dependent Damage Codes in an NPC sample have already been calculated.",
      "armor_and_cyberware": "Armor appears separately with its rating in brackets; cyberware is alphabetized by item name with grade/rating in parentheses and included subcomponents in brackets.",
      "deck_vehicle_notes": "The cyberdeck is presented first in regular gear with MPCP and adaptations; programs list ratings. Vehicles are alphabetized with gear, and firm/hardpoint weapons, rigging or remote-control customization are shown in parentheses."
    },
    "source_npc_construction_notes": {
      "source_permissions": "The GM need not use the Shadowrun Third Edition Priority System for NPC creation and may adjust statistics within the game system's applicable maximum attributes. The page points to Critters p19 and SR3 p245 for baseline and limits.",
      "reuse": "The book suggests existing sample statistics or pregenerated characters as starting points, with adjustments for the party and adventure.",
      "ownership": "Sample NPC gear lists are not necessarily exhaustive inventories; the page describes optional GM additions and the order of weapon, armor, cyberware and other items."
    }
