  - printed_page: 50
    topic: border identity verification
    seattle_id_reader_rating: 2
    salish_shidhe_id_reader_rating: 3
    cross_reference: Use the Shadowrun Third Edition rules on printed p239 for the ID-reader problem. These are setting
      game ratings, not modern identification-system specifications.
  - printed_page: 50
    topic: local availability and prices
    denny_creek_multiplier: 2
    reference_price: Seattle going rate
    equipment_legality: Bows, arrows and knives are legal purchases in the NAN; the source says runners cannot buy anything
      illegal there.
  - printed_page: 50
    topic: social encounters
    cross_reference: The source points to Charisma-linked skills on p92 of SR3 for some prejudicial treatment; no numeric
      target is supplied in this paragraph.
  - printed_page: 51
    topic: off-road tests
    terrain_class: Restricted
    movement_modifier: '+3'
    procedure: The gamemaster can call for a standard Driving Test at intervals, following SR3 printed p134. A failed
      test represents an unexpected driving obstacle; the original gives examples but no fixed failure damage or frequency.
  - printed_page: 51
    topic: optional stronger guards
    procedure: For an escalated border encounter, substitute Red Samurai NPC statistics from the Supernova scenario with
      armor vests with plates in place of Red Samurai armor. This is a discretionary GM option, not a required encounter.
  mechanical_fidelity: Numerals are preserved exactly as original Third Edition table/rule references; no edition conversion
    or invented target numbers.
