  job_offer:
    employer: Daisy Quallin (fictional elven talismonger)
    task: Recover four crates of rare imported magical telesma from a smuggling party
      called the Pentagon and return four agreed items to the smugglers.
    initial_payment: For a participating magical character, Daisy offers materials
      toward a focus of the character's choice, up to 5,000¥ in value; material costs
      beyond that are paid by that character. For other runners, Daisy offers 5,000¥
      each.
    cannot_increase_initial_offer: true
    payment_timing: Payment follows acquisition and conversion of the recovered telesma
      into focus materials rather than an immediate cash advance.
    voluntary_reallocation: A runner may forgo the individual 5,000¥ to help one magic-using
      teammate obtain a larger focus payment; if the others agree, each additional
      participant contributes 5,000¥.
    contact_advancement: 'If a magician who already counts Daisy as a talismonger
      contact refuses the personal fee and helps as a favor: a Level 1 contact can
      become Level 2; a Level 2 contact can become Level 3. When other runners also
      waive payment, they each receive Daisy as a Level 1 talismonger contact, subject
      to the source conditions.'
  the_magic_touch:
    ritual_circle: Force 6 hermetic circle in Daisy's back room.
    bound_elemental_count: 3
    bound_elemental_forces: 6
    elemental_types:
    - Fire
    - Air
    - Earth
  outgoing_shipment:
    crate_1: Elven wine.
    crate_2: Simchips of mixed genres, including adult entertainment and children's
      animation; approximately 250 chips. The crate also has a false bottom.
    crate_3: Ritual trinkets, charms and magical materials; its hidden compartment
      contains a Novatech Sandman simsense deck.
    crate_4: Assorted Seattle souvenirs, collectible cards and fiction; a concealed
      lower compartment holds a used Sony CTY-360-D cyberdeck.
    source_note: These are fictional in-world cargo descriptions and not handling
      guidance.
  exchange_shipment:
    crate_1: Live coral reef.
    crate_2: Swamp dirt and material resembling crayfish.
    crate_3: Dirt and dust.
    crate_4: Caribbean League rum.
  conditions: 'The source frames taking the job as a choice: accepting the offer and/or
    choosing a favor is not assumed for every character.'
