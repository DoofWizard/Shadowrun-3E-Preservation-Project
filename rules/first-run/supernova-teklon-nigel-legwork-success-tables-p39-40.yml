{"id":"rule.first_run.supernova_teklon_nigel_legwork_success_tables_p39_40","record_type":"rule","status":"reviewed_forward_unindexed","source":"source.fasa-7329","printed_pages":"39-40","pdf_pages":"40-41","edition_scope":"FASA Corporation First Run (FASA7329, 1999), original Shadowrun Third Edition fictional tabletop RPG adventure; no later-edition conversion","content_class":["rule_exact"],"data":{"publication":{"title":"First Run","publisher":"FASA Corporation","author":"Michael Mulvihill","copyright_year":1999,"catalog_number":"FASA7329","source_id":"source.fasa-7329","edition":"original Shadowrun Third Edition","cataloged_original_pdf_sha256":"222cb911ef86b0ddf2a853d622068859fe09a078d23c881a32cee0100eaf0c5e","printed_pages":"39-40","physical_pdf_pages":"40-41"},"original_page_mapping":{"printed_39":40,"printed_40":41},"scope":"Exact original Third Edition fictional Supernova legwork success thresholds and graduated information tables, retaining uncertainties, character attribution and Matrix/Contact alternative eligibility.","legwork_instructions":"Gamemaster uses these success tables when fictional player characters research the scenario's named topics. Reference original First Run Adventure Basics p8 for using Legwork. Results below are source-level statements to be revealed by contacts; rumors and allegations are not promoted to narrator facts.","tables":[{"topic":"TekLon Electronics","method":"Corporate Contacts (Target Number 4) OR Matrix search by decker in the Milk Run system (see First Run p25)","target_number":4,"entries":[{"successes":"0","information":"Contact has never heard of the firm or found a corporate listing."},{"successes":"1","information":"A microtronics manufacturing company in Auburn."},{"successes":"2","information":"TekLon claims 75 percent of cyberlimbs include TekLon microtronics; explicitly a company claim."},{"successes":"3","information":"TekLon lost business during the corporate war as some corporate investments withdrew."},{"successes":"4","information":"Lakeview International Holding Company withdrew financing; the owners reportedly did not know the full extent of its prior investment."},{"successes":"5","information":"The source contact describes Lakeview as a Fuchi shell, and reports Novatech and Renraku competing claims over ownership investments."},{"successes":"6+","information":"A prediction that TekLon will announce revolutionary microtronics circuitry the following week; presented as a source contact forecast."}]},{"topic":"TekLon Electronics","method":"Street Level Contacts (Target Number 4)","target_number":4,"entries":[{"successes":"0","information":"Contact mistakes TekLon for a Tir music group."},{"successes":"1","information":"Contact remembers TekLon's name from cyberarm components."},{"successes":"2","information":"Contact says TekLon does not manufacture finished cyberware but the small internal parts used in it."},{"successes":"3","information":"Contact reports TekLon financially struggled during the corporate war."},{"successes":"4","information":"A rumor, not independently verified, that Fuchi once owned TekLon; some scientists reportedly left during Fuchi's growth."},{"successes":"5","information":"Contact says TekLon's owners were unaware of Fuchi funding; Novatech and Renraku pressured the company and the owners were surprised."},{"successes":"6+","information":"Contact reports an attempt to operate without major corporate backing and an alleged microtronics breakthrough."}]},{"topic":"Nigel Terwilliger","method":"Appropriate Contacts (Target Number 4)","target_number":4,"entries":[{"successes":"0","information":"A joking mistaken identification as TekLon's lead singer."},{"successes":"1","information":"Contact has not heard of him and doubts that he is a regular Mr. Johnson."},{"successes":"2","information":"His name is vaguely familiar from the corporate war; contact does not know his allegiance."},{"successes":"3","information":"Contact tentatively reports former Fuchi employment, perhaps as an infiltration specialist."},{"successes":"4","information":"Contact thinks he works for Novatech but cautions it may be cover; has been seen working with small corporations."},{"successes":"5+","information":"Contact says he has recently connected with TekLon, identified as a cyberware-related firm in Auburn, and believes former Fuchi colleagues may reappear."}]},{"topic":"Nigel Terwilliger","method":"Appropriate Contacts (Target Number 4) with Novatech or Renraku knowledge OR Matrix search by decker in the Milk Run system (see First Run p25)","target_number":4,"entries":[{"successes":"0","information":"TekLon Electronics employee."},{"successes":"1","information":"Recently hired by TekLon Research Division as technician/consultant on a secret microtronics project; research access is Delta Four."},{"successes":"2","information":"Works late, has a clean record and has shown no interest in disclosures that Renraku and Novatech are involved with TekLon."},{"successes":"3","information":"Formerly a technician/consultant at Abstract Media Services."},{"successes":"4","information":"Novatech and Shiawase fought over Abstract Media Services before it failed for lack of funding; Abstract researched optical-storage technology."},{"successes":"5","information":"Abstract was heavily financed by Fuchi until Fuchi's collapse; Nigel was among its last employees and joined TekLon two days after Novatech disclosed its Abstract and TekLon/Fuchi connections."},{"successes":"6+","information":"Nigel claims he had not worked in Seattle before Abstract; other contacts contradict that claim and report he previously worked for approximately six companies, with uncertainty caused by his unremarkable appearance."}]}],"provenance":"Every listed success level and the exact Target Number 4 are retained from printed pp39–40. In-world gossip is explicitly marked as source contact information, not established biography. No assumed cumulative test rules beyond source's normal Legwork framework."},"headline":"Supernova — exact four TekLon and Nigel legwork success tables","summary":"Original FASA Corporation First Run (FASA7329, 1999), fictional Shadowrun Third Edition RPG, printed pp39–40/PDF40–41; four complete Target Number 4 legwork tables, original success brackets, attributed claims and Matrix alternatives.","framing":"reference_exact"}
