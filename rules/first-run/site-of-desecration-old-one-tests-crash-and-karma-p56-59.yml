  conversation_and_spirit_tests:
  - page: 56
    action: Speak privately with the Old One
    test: Charisma (7) Test
    success: The spirit becomes interested and notes which character seems strongest
      or most trustworthy.
  - page: 56
    action: Spirit evaluates magical display
    shaman: Call a forest, mountain or wind spirit of Force 7 or greater
    mage: Call an elemental at Force 8 or greater.
  - page: 56
    action: Recognize the Old One’s motives
    initial_test: Charisma (7) Test
    follow_up: Willpower (7) Test after succeeding at Charisma
    success_effect: Each success permits clearer understanding of the spirit’s motives
      in one of its contests; the Old One knows when a runner understands and may
      exclude that runner from the particular test.
  - page: 56
    action: Evidence from damaged Ares Dragon
    test: Rotor Aircraft (4) Test
    alternative: Use the higher applicable flying-craft B/R Skill or Knowledge Skill
      dealing with aircraft as a complementary skill; the printed text also names
      the team rigger.
  rotorcraft_success_table:
    pages: 56-57
    test: Rotor Aircraft (4) Test
    rows:
    - successes: '1'
      finding: The vehicle was equipped for smuggling rather than combat.
    - successes: '2'
      finding: The rigger dumped the fuel to avert an explosion.
    - successes: '3'
      finding: The rigger jacked out before impact (disconnecting from the rigged
        craft).
    - successes: '4'
      finding: The crew bailed out.
    - successes: '5'
      finding: The vehicle has below-standard sensors for mountain flying.
    - successes: 6+
      finding: A ripped-off section of the main rotor caused the crash.
  old_one_optional_tests:
  - printed_page: 57
    power: Accident
    target: A party member near a drunken troll
    test_or_modifier: +1 modifier to the troll when fighting drunk, negating the troll’s
      Reach bonus
    resolution: A fight or confrontation may ensue; the source recommends the test
      for an adventurer lacking strong combat skills.
  - printed_page: 57
    power: Challenge through food
    first_test: Willpower (4) Test
    escalation: Increase target number by 1 for every additional spoonful
    failure_follow_up: Body (4) Test, or take 1 box each of Light Stun and Physical
      damage, as printed
  - printed_page: 57
    power: Concealment
    consequence: The spirit hides one or more players while the nearest warriors are
      nearby, then removes protection at a strategically tense moment. No numeric
      test appears in this example.
  - printed_page: 57
    power: Fear
    consequence: The spirit scares Crescent Eye away, prompting a timed search. The
      gamemaster chooses how long before either the farmer or nearby warriors notice
      the absence.
  - printed_page: 57
    power: Weather Control
    consequence: An optional difficulty increase causes rain, snow or fog, making
      existing challenges harder; the text does not provide an exact new modifier
      for this option.
  later_bargaining:
    printed_page: 58
    honest_account: If the team truthfully explains its role, the Old One may judge
      it successful without imposing the deception test.
    deceptive_account: If the party claims it will transport the spirit without intending
      to do so, require a Charisma (7) Test followed by Willpower (7) Test; note successes
      on each.
    pentagon_follow_up: Members of the Pentagon must roll the same number or more
      successes to change the spirit’s mind.
    failure: The Old One may deploy Fear and disperse the group, leaving recovery
      of Daisy’s goods possible afterward.
  award_karma_table:
    printed_page: 59
    system_reference: Individual Karma follows Shadowrun Third Edition p244. The table
      below gives team-member awards.
    rows:
    - condition: Surviving the run
      points: 2 points
    - condition: Threat level
      points: 1–3 points*
    - condition: Surviving the Old One’s tests
      points: 1–3 points*
    asterisk: The gamemaster determines the amount according to difficulty of events
      and encounters.
    failure_condition: If the team returns to Daisy without her magical goods, award
      only the Threat level Karma component.
  subsequent_tests:
    printed_page: 59
    old_one_epilogue: A mage assessing the astral realm notices unusually powerful
      magical force; the source advises raising the Target Number for that test to
      6, reflecting Daisy’s store-associated magic.
    legwork: Little advance research is possible in the mountain region; historical
      cross-references include this book p46 and Shadowrun Third Edition p320.
  mechanical_scope: All tests, target numbers, modifiers, powers, success table entries
    and awards above are historical Third Edition fictional game mechanics. No edition
    conversion or modern real-world application is inferred.
