{"id":"rule.first_run.food_fight_supermarket_sweep_and_karma_p17","record_type":"rule","status":"reviewed_forward_unindexed","source":"source.fasa-7329","printed_pages":"17","pdf_pages":"18","edition_scope":"FASA Corporation, First Run (FASA7329, copyright 1999), original Shadowrun Third Edition fictional tabletop-roleplaying adventures; no later-edition conversion","content_class":["rule_exact"],"data":{"publication":{"title":"First Run","publisher":"FASA Corporation","author":"Michael Mulvihill","copyright_year":1999,"catalog_number":"FASA7329","source_id":"source.fasa-7329","edition":"Shadowrun Third Edition","cataloged_original_pdf_sha256":"222cb911ef86b0ddf2a853d622068859fe09a078d23c881a32cee0100eaf0c5e","printed_pages":"17","physical_pdf_pages":"18"},"original_page_mapping":{"printed_17":18},"section_heading":"Supermarket Sweep; Food Fight Table; Awarding Karma; Debugging (printed p17).","mechanical_context":"Fictional Shadowrun Third Edition RPG environmental-combat and adventure-reward rules for Food Fight; exact source-era dice, damage, timing and modifiers are recorded as printed, not general real-world procedures.","environmental_sweep":{"trigger":"Each time someone fires a gun in the supermarket scenario, roll 1D6 and use the Food Fight Table to determine what breaks and its effects on the conflict.","fire_mode_modifier_first_roll":{"burst_fire":"+1 to the first roll","full_auto":"+2 to the first roll","other":"No extra first-roll modifier stated."},"follow_up_roll":"Roll 2D6 for each of three columns Color, Consistency and Type to determine the splattered fictional product.","cumulative":"The table results are cumulative; a target suffers results for each level below the roll result in addition to the rolled result, as described by the source.","food_fight_table":[{"die_roll":"1","result":"Nothing breaks."},{"die_roll":"2\u20133","result":"Glop splashes over the target and anyone within 2 meters; the floor in that area becomes Difficult Terrain."},{"die_roll":"4\u20135","result":"So much glop splashes over the target that the face and arms become completely covered. Apply +2 modifier to all actions owing to impaired visibility."},{"die_roll":"6","result":"A burst of spilled products affects the target and others nearby, with secondary hazards such as falling cans, exploding fixtures and chemical reactions. The target makes a Body (4) test to resist Light Stun damage; cumulative lower-tier effects still apply."}],"roll_2d6_columns":[{"roll":2,"color":"Black","consistency":"Chunky","type":"Powder"},{"roll":3,"color":"Blue","consistency":"Fizzy","type":"Plastic"},{"roll":4,"color":"Green","consistency":"Lumpy","type":"Metal"},{"roll":5,"color":"Orange","consistency":"Smelly","type":"Meat"},{"roll":6,"color":"Pink","consistency":"Soft","type":"Liquid"},{"roll":7,"color":"Purple","consistency":"Spongy","type":"Powder"},{"roll":8,"color":"Red","consistency":"Sticky","type":"Liquid"},{"roll":9,"color":"White","consistency":"Sudsy","type":"Meat"},{"roll":10,"color":"Yellow","consistency":"Syrupy","type":"Metal"},{"roll":11,"color":"Clear","consistency":"Thick","type":"Plastic"},{"roll":12,"color":"Multicolored","consistency":"Choose 2","type":"Vegetable"}]},"karma_guidance":{"survival":1,"other":"Individual additional Karma awards according to SR3 core-rule general guidance (printed p244).","total_example":"The published adventure awards 1 point for surviving the encounter and 1 additional point for facing down the Chiller Thrillers, 2 total for each participant, with any other individual awards at the GM\u2019s discretion; actual defeat or incapacitation of the gang is not specified as a precondition.","facing_down_chiller_thrillers":1},"optional_scene_debugging":"In an optional GM response when the runners are outmatched, the gang may stop shooting a character apparently down and out, or may abduct Wanda and flee with stolen goods; these are scenarios presented as optional adjustments, not a mandatory outcome.","campaign_continuation":"The adventure ends with the characters potentially being questioned by fictional Lone Star security or choosing to continue into the separate Supernova scenario (printed p18).","mechanics_lineage":"Third Edition source-specific table and award, not a converted Second Edition rule."},"headline":"Source-verified archival record: Food Fight supermarket environmental combat table and Karma awards","summary":"Fictional tabletop-RPG archival record from First Run, FASA Corporation, FASA7329 (1999), original Shadowrun Third Edition, printed pp17/physical PDF pp18. Exact 1D6/2D6 environmental rolls, burst/full-auto adjustments, cumulative effects, target numbers, Light Stun test, reward numbers and original table entries.","framing":"reference_exact"}
