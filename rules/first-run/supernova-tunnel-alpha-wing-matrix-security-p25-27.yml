{"id":"rule.first_run.supernova_tunnel_alpha_wing_matrix_security_p25_27","record_type":"rule","status":"reviewed_forward_unindexed","source":"source.fasa-7329","printed_pages":"25-27","pdf_pages":"26-28","edition_scope":"FASA Corporation, First Run (FASA7329, copyright 1999), original Shadowrun Third Edition fictional tabletop RPG adventure; no later-edition conversion","content_class":["rule_exact"],"data":{"publication":{"title":"First Run","publisher":"FASA Corporation","author":"Michael Mulvihill","copyright_year":1999,"catalog_number":"FASA7329","source_id":"source.fasa-7329","edition":"original Shadowrun Third Edition","cataloged_original_pdf_sha256":"222cb911ef86b0ddf2a853d622068859fe09a078d23c881a32cee0100eaf0c5e","printed_pages":"25-27","physical_pdf_pages":"26-28"},"section":"Supernova — Milk Run, tunnel approach, Alpha Wing and TekLon facility (fictional adventure)","original_page_mapping":{"printed_25":26,"printed_26":27,"printed_27":28},"tunnel":{"distance_from_auburn_entry":"just under one kilometer to TekLon laboratory wall","damp_environment":"Tunnel is dry; unpleasant odor and poor lighting are scenario descriptions.","willpower_test":{"test":"Willpower (4) Test","condition":"Each character traversing the tunnel must succeed or become physically ill and vomit.","failed_test_followup":"Unaugmented Body (6) Test; failure causes one box of Stun damage."},"obstacle":"Cable debris may trip characters; described as a hazard but no separate numerical trip test is prescribed."},"wall":{"spray_time":"about 5 minutes for the solvent to stop bubbling and form a passable section","touch_test":"Body (6) Test when a character touches the sprayed section during that interval","failure":"One box of Physical damage and +2 penalty to all target numbers for actions using the affected hand over the next 24 hours.","hand_qualification":"If affected hand is not declared, the GM treats the character's gun hand as affected.","ward":"Astral ward permanently present at Force 6; cross-reference original SR3 p174 for ward passage.","fictional_consequence":"The book notes that breaching the ward can have later consequences involving TekLon mages; it does not assert immediate guard arrival."},"entering_alpha_wing":{"capacity":"Storage room accommodates at most three player characters simultaneously.","unsurveyed_entry":"Athletics (6) Test if entering rapidly without inspecting storage; success yields Moderate Stun Wound, failure Serious Stun Wound from landing among metal shelves.","resistance":"Body (4) Test; stage damage down one level for every two successes.","security_choices":"A decker can use the storage security console, while without a decker characters must individually use Electronics Skill for the maglocks.","surveillance":"Cameras continue to record activity unless individually disabled."},"matrix":{"red_hard_host":"A Red Hard host with minimum Security Value 8 is described as the worst-case expectation; actual TekLon system is Easy Orange.","actual_system_ratings":"4/10/10/10/10/6","logon":"Log On To Host uses Computer Skill plus any Hacking Pool dice against the host Access Rating 10, minus applicable utilities; normal SR3 rules apply.","security_test":"The GM still rolls Security Tests as Success Contests pitting host Security Value against decker Detection Factor; record successes if an alert would occur despite the system being offline.","slave_node":"The maglock control slave node is represented as a room with five switches; camera slave node as a room with a sofa and twenty-two monitors.","camera_operations":"Locate Slave, then Control Slave to control each camera; continuing control requires a Free Action each Initiative Pass. Edit Slave can loop footage for one camera at a time; source explicitly says this operation is monitored.","locks":"Control Slave may open maglocks all together or individually; direct manual access remains possible.","host_analysis":"Analyze Host identifies the system as old Red Hard security but now offline.","elevator":"Can be controlled in principle from a node, but local elevator on/off switch is off.","tek_lon_plgt":"Separate Easy Orange Matrix PLTG described in the source; Locate File and Locate Access Node operations possible.","files":"Locate File operation finds matching files; result successes equal number of matching files and character must access their stored host to read content.","host_shares":{"A":"public company profile and catalogue","B":"company and personnel","C":"sales and financial records","E":"research, Alpha Wing and the Pit"},"file_encryption":"Decrypt File removes Scramble 4 IC for interested records; reference original SR3 p228.","original_rules_reference":"Shadowrun Third Edition p204, p205, p211, p228 are explicitly referenced in the scenario."},"electronics_option":{"maglock_rating":{"security_system_doors_A_to_E":5,"other_maglocks":3},"security_cameras":"Stationary; cameras glowing red are active.","electronics_test":"Electronics (4) Test with 2 successes disables a camera without physically damaging it; 1 success leaves signs of tampering.","camera_barrier_rating":2,"light_walls":"walls in this area are three meters high, useful for fictional positioning."},"map_room_rule_details":{"room_4a_to_4_barrier_rating":4,"room_4a_to_8_window_barrier_rating":2,"room_8_steel_door_barrier_rating":16,"room_8_to_9a_and_9c_ward_force":12,"room_8_to_9a_and_9c_glass_barrier_rating":6,"room_9b_second_light_source_modifier":"+6 modifier to Perception Tests for noticing details in the otherwise dark room without a second light source.","room_9c_logo_identification":"Corporate Knowledge Skill (4) Test or Corporate Etiquette Skill (5) Test with at least 1 success reveals newer Novatech logo.","room_9c_case_lock_rating":4,"room_9c_case_description":"Microtronic head with incomplete external human form; it is locked in a case found in room 9c."},"source_distinctions":["Host A-E labels for the file system are separate from physical maglock labels A-E.","No late edition substitution; original exact dice, modifiers, ranges and ratings retained.","All fictional technology and security systems are rules and scenarios, not real facilities."]},"headline":"Supernova — exact original SR3 tunnel, Alpha Wing, Matrix and electronics mechanics","summary":"Original-page reviewed rules from FASA Corporation's fictional Shadowrun First Run (FASA7329, 1999), original Third Edition, printed pp25–27/PDF26–28: tunnel and ward tests, TekLon Matrix ratings, camera controls, maglocks, map barriers and perception modifiers.","framing":"reference_exact"}
