{"id":"rule.first_run.supernova_downtime_case_and_intersection_tests_p28_31","record_type":"rule","status":"reviewed_forward_unindexed","source":"source.fasa-7329","printed_pages":"28-31","pdf_pages":"29-32","edition_scope":"FASA Corporation, First Run (FASA7329, copyright 1999), original Shadowrun Third Edition fictional tabletop RPG adventure; no later-edition conversion","content_class":["rule_exact"],"data":{"publication":{"title":"First Run","publisher":"FASA Corporation","author":"Michael Mulvihill","copyright_year":1999,"catalog_number":"FASA7329","source_id":"source.fasa-7329","edition":"original Shadowrun Third Edition","cataloged_original_pdf_sha256":"222cb911ef86b0ddf2a853d622068859fe09a078d23c881a32cee0100eaf0c5e","printed_pages":"28-31","physical_pdf_pages":"29-32"},"original_page_mapping":{"printed_28":29,"printed_29":30,"printed_30":31,"printed_31":32},"alpha_wing_exit":{"perception_4":"When exiting with the case, one player character on the top level may make a Perception (4) Test; with 2 successes, the character hears activity beyond the steel door.","additional_perception_4":"One additional Perception (4) Test for any character near the steel door can reveal the approaching Renraku group with 1 success.","host_alert":"If a decker is present, the system enters Red Hard alert with no IC attacks at this stage."},"optional_tunnel_critter_encounter":{"source":"Pushing the Envelope, printed p28","creatures":"Devil rats, three per player character; see original Critters p25.","status":"Optional nuisance encounter while exiting; the source allows other minor critters instead. Not a mandatory fight or source-established outcome."},"downtime":{"maximum":"Two hours maximum before characters need to resume the story.","recovery":"Characters with Stun damage may heal during uninterrupted downtime; characters with Physical damage lack sufficient time to recover naturally and can use Heal or Treat spells or stim patches.","spirit_summoning":"With no more than two hours between calling Johnson and the callback, a mage may summon up to Force 2 elementals, subject to appropriate library/hermetic circle requirements.","matrix_downtime":"TekLon discovered node is Red Hard when re-accessed; exact ratings 8/16/14/18/18/18.","host_rules_reference":"Shadowrun Third Edition p205 and Security Sheaf p211."},"case_lock":{"device":"The acquired fictional case uses a Rating 6 electronic lock.","test":"Electronics (6) Test with Electronics Kit; 2 successes per latch required to open without signs of tampering; 1 success opens latch with evidence.","physical":"Case has Barrier Rating 4; physical force may damage delicate microtronic head inside.","tech_identification":"Electronics with Microtronics specialization or relevant Knowledge Skills can identify advanced unfinished design at target number 12."},"four_corners":{"early_recognition":"Any character with Corporate Security, Military Knowledge or Leadership may attempt TN 5; 2 successes identify Renraku Red Samurai as commonly arriving in five-person teams; 3 successes also indicate lack of usual ground support in this scene.","initial_spotting":"Perception (4) Test for a character watching Main Street at meeting time; auditory/visual equipment may modify according to source.","second_detection":{"astral_or_enhanced_hearing":5,"magical_astral_senses":5,"ordinary_character":6,"hearing_amplification":8},"second_detection_qualification":"Source specifies a second Perception Test after the staged lead-in, and a single success is enough to notice helicopters; an astrally perceiving character must return attention to the body to notify others.","first_turn":"The gamemaster rolls Initiative once for the armed Red Samurai group and separately for mages. Their cyberzombie has no Initiative action on the first Combat Turn.","red_samurai_first_pass":"When Renraku troops land, player characters take +2 to hit them during the initial phase. Subsequent penalties follow normal rules; no general free penalty is assigned to future turns.","first_turn_traffic":"Each armed Red Samurai generally uses attacks against two different targets in the same Combat Phase; original game shooting-at-two-targets modifier applies.","mages_arrival":"A Perception (6) Test may notice the arriving mages' vehicle headlights when facing south on 100th Street.","cyberzombie_order_test":{"magicians_request":2,"continue_prior_action_at_start_of_combat_turn":3,"other_red_samurai_request":4,"other_people_request":8,"consecutive_test_exception":"Three consecutive successful Willpower Tests let the cyberzombie continue that action until another order; no more tests required."},"original_magic_reference":"Apply source's Confusion critter power reference in SR3 p263 to portray limited responsiveness. The GM may describe the figure as requiring explicit instructions, rather than treating it as an independently strategic NPC."},"attribution":"All outcomes are optional scenario mechanics from the 1999 First Run adventure; no real-world security actions are instructed."},"headline":"Supernova — exact Third Edition downtime, case, Four Corners tests and cyberzombie control","summary":"Source-reviewed fictional Shadowrun RPG rules in FASA Corporation First Run (FASA7329, 1999), original Third Edition, printed pp28–31/PDF29–32; recovery windows, Force limits, case lock, Perception TNs, initiative, modifiers and ordered commands.","framing":"reference_exact"}
