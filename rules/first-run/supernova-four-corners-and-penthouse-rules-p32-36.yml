{"id":"rule.first_run.supernova_four_corners_and_penthouse_rules_p32_36","record_type":"rule","status":"reviewed_forward_unindexed","source":"source.fasa-7329","printed_pages":"32-36","pdf_pages":"33-37","edition_scope":"FASA Corporation First Run, FASA7329 (1999), original Shadowrun Third Edition FICTIONAL tabletop RPG adventure; no later-edition conversion","content_class":["rule_exact"],"data":{"publication":{"title":"First Run","publisher":"FASA Corporation","author":"Michael Mulvihill","copyright_year":1999,"catalog_number":"FASA7329","source_id":"source.fasa-7329","edition":"original Shadowrun Third Edition","cataloged_original_pdf_sha256":"222cb911ef86b0ddf2a853d622068859fe09a078d23c881a32cee0100eaf0c5e","printed_pages":"32-36","physical_pdf_pages":"33-37"},"original_page_mapping":{"printed_32":33,"printed_33":34,"printed_34":35,"printed_35":36,"printed_36":37},"four_corners_combat_turns":{"turn_2_continuation":"Cyberzombie initially remains inactive until ordered by mages; source describes turn timing as conditional on their Initiative passes.","turn_3":"The source directs separate Initiative rolls for armed Red Samurai, mages and cyberzombie; if mages lacked a second Initiative pass in prior turn they use the listed turn-two actions. Renraku focuses on the case and not Chavez's PDA.","turn_4":"Roll Initiative for surviving Renraku members and they move toward their van.","turn_5":"Their van leaves on first initiative of surviving troops, except the cyberzombie cannot drive.","cyberzombie_orders":["Attack anyone with a case.","Get the case out of Chavez's car; mages give this order only if Red Samurai soldiers are all dead.","Attack the character causing the most damage, typically one using the most powerful firearm.","Attack anyone shooting at the Red Samurai.","Attack magicians and shamans among the runners."],"cyberzombie_confusion":"If holding a case marked with a new Novatech emblem instead of expected Renraku case, the cyberzombie becomes confused by its own confusion critter effect (original SR3 p263).","combat_logic":"These are a GM-authored sample sequence; outcomes vary with player decisions.","original_art":"Printed p32 includes a large black-and-white illustration showing an armored vehicle and fictional armored figures during the scene."},"after_combat":{"pda_calendar":"Chavez's PDA has a password-free one-week calendar; source appointments include 'Accosted N' (3:00 p.m. previous day), 'Switched N's cases' (5:00 p.m. previous day), 'N called about meet' (12:30 a.m. current day), 'Swap cases' (2:00 a.m.), and 'Payout @ 3844 Belmont Avenue, code #68GTH773KN1' (3:00 a.m.).","aod_tracking":"Renraku case has an activate-on-demand tracking signal rated 8, still active inside; detectable only while device is on or the case is open.","optical_disks":"The Renraku case contains 12 optical disks. Decoding outside the meeting requires a portable disk reader and is an optional choice, not a mandatory action.","case_opening":"Game master refers to the same case-opening procedure and test previously stated on printed p29; no new test is substituted here."},"penthouse":{"location":"Fictional scenario rendezvous at 3844 Belmont Avenue, fourteenth-floor penthouse.","ward":"Only fourteenth floor is astrally warded; Force 14 ward; the elevator shaft is unwarded, but the entrance on floor fourteen is warded.","front_maglock":"Battery operated and disconnected from Matrix; no datajack or electronic jackpoint.","identification_test":"After entering the penthouse, Corporate Etiquette OR Corporate Knowledge Skill Test at target number 4.","successes":[{"number":1,"result":"Character recognizes Richard Villiers."},{"number":2,"result":"Character also recognizes Miles Lanier."}],"jamming":"Any headware communication the PCs are sporting is jammed; Lanier is tuned to their frequency and can relay their messages.","equipment_protection":"If player characters threaten Villiers and Lanier with weapons, the GM scene describes sudden lights-out and Neuro-Stun gas (reference original SR3 p250), while the men step into a sealed chamber of Barrier Rating 12.","optional_magic":"A Force 12 hearth spirit with Guard and Concealment appears if threatened; if banished/destroyed a second Force 12 fire elemental appears under the scenario. These are escalating conditional GM options, not normal background rules."},"payment":{"villiers":"He produces jet-black credsticks of 10,000 nuyen apiece until their total matches the previously agreed payment.","renraku_extra":"Yellow credsticks 1,000 nuyen each; orange credsticks 500 nuyen each as printed.","context":"Fictional monetary terms and options; no real-world transactional guidance."},"source_confidence":"Exact numeric ratings and conditions are transcribed from original pp32-36, with early scene mechanics independently in separate pp28-31 rule record."},"headline":"Supernova — exact Four Corners finale, corporate handoff and penthouse mechanics","summary":"Source-reviewed fictional First Run tabletop RPG by FASA Corporation (FASA7329, 1999), original Shadowrun Third Edition, printed pp32–36/PDF33–37: NPC turn sequence, PDA clues, tracking Rating 8, Force 14 ward, target-number tests and exact payouts.","framing":"reference_exact"}
