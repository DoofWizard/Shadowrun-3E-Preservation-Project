{"id":"rule.first_run.supernova_johnson_perception_negotiation_magic_p23_24","record_type":"rule","status":"reviewed_forward_unindexed","source":"source.fasa-7329","printed_pages":"23-24","pdf_pages":"24-25","edition_scope":"FASA Corporation, First Run (FASA7329, copyright 1999), original Shadowrun Third Edition fictional tabletop RPG adventure; no later-edition conversion","content_class":["rule_exact"],"data":{"publication":{"title":"First Run","publisher":"FASA Corporation","author":"Michael Mulvihill","copyright_year":1999,"catalog_number":"FASA7329","source_id":"source.fasa-7329","edition":"Shadowrun Third Edition","cataloged_original_pdf_sha256":"222cb911ef86b0ddf2a853d622068859fe09a078d23c881a32cee0100eaf0c5e","printed_pages":"23-24","physical_pdf_pages":"24-25"},"original_page_mapping":{"printed_23":24,"printed_24":25},"scope":"Exact original Third Edition rules and scenario-specific tests for fictional Supernova hiring scene at Club Penumbra; optional GM scene variations are separately identified. No modern edition conversion.","concealability_and_military_surveillance":{"recommendation":"For the scenario, the book characterizes weapons with a Concealability Rating higher than 5 as easier to hide; characters displaying weapons with Concealability Rating 4 or less may attract UCAS military attention.","trigger":"If a player character carries a weapon with Concealability Rating 4 or less and spends any amount of time outside on the street or in an 'open' vehicle such as a motorcycle, roll 1D6.","initial_roll":"On a 1, a military guard notices the team; the source then requires a Perception Test against the weapon's Concealability Rating to determine if they have spotted the concealed weapon.","detection":"Even 1 success on the guard's Perception Test means the weapon has been spotted.","military_skill":"The accompanying source says UCAS military personnel have Military Procedures Knowledge Skill 5; treat it as Police Procedure Skill for a legality/search check in this scenario.","cross_references":["SR3 Legality Codes p273","Perception/Concealability scenario guidance; original Third Edition only"]},"johnson_perception_test":{"target_number":4,"cumulative":"Every successful roll reveals all information at the achieved success level and each lower numbered level.","table":[{"successes":"0","result":"Club Penumbra is strikingly dark and lively."},{"successes":"1","result":"Notice Mr. Johnson/Nigel acting very nervous."},{"successes":"2","result":"Notice the words 'Security Use Only' on the folder from which he retrieves the map."},{"successes":"3","result":"See a security tag in his briefcase from TekLon Industrial Electronics."},{"successes":"4","result":"Read 'Priority Clearance to Alpha Wing' on the security tag."},{"successes":"5+","result":"Read the name 'Terwilliger' on the security tag."}],"legwork_note":"The source marks the level-four/five clues as potentially useful in later legwork or the Milk Run Matrix search; not evidence that the players necessarily discover them."},"magic_and_social_checks":{"background":"Nigel is a mundane human and is not carrying magical items; he is not necessarily representative of other nightclub patrons.","observe_spellcasting":"He may recognize magical activity by SR3 spell-observation rules (original p162). The adventure applies a −1 target-number modifier to his test due to his experience and training.","analyze_truth":"Nigel speaks what he believes is true when making the offer; his confidence is mistaken or incomplete in some details, and game effects are not a substitute for later source facts.","detect_enemies":"The characters have no known enemies in the club at the beginning of this scene.","detect_magic":"Nigel is not magically active and is not carrying magical items.","mind_probe":"When a player casts Mind Probe, Nigel makes a Perception Test against the spell's Force. With even 1 success, he leaves the meeting. The source also calls Mind Probe illegal in its fictional jurisdiction.","optional_listening_hook":"If a character obtains 4 or more successes on a Perception Test, an optional red-herring exchange between military officers and elves may be noticed; a Clairaudience spell or appropriate hearing enhancements could reveal details. The GM is explicitly told this is a red herring, not guaranteed critical evidence."},"negotiation":{"applicability":"Only a player character with the Negotiation Skill can negotiate the offer with Nigel; the book allows one negotiation attempt for the team, generally led by the character with the highest rating.","mechanics":"Use Negotiation Test rules from SR3 original p93; First Run does not supply a replacement universal target number.","initial_payment":"20,000 nuyen per player character on completion; Nigel initially offers no payment up front.","success_outcomes":[{"successes":"1","effect":"Nigel refuses additional cash but offers his van, an unarmored Ares Roadmaster. This version has no datajack, remote-control interface, or vehicle control rig adaptation."},{"successes":"2","effect":"Nigel offers an additional 5,000 nuyen up-front payment to split between characters."},{"successes":"3+","effect":"Nigel offers a maglock passkey for a locked storage room in the TekLon map (room 3), where he claims electronics can be resold."}],"uncertainty":"The source states these success brackets; the summary does not add an unprinted assertion about whether the rewards are cumulative.","separate_payment":"The 5,000 nuyen described as an operating allowance is stated by Nigel to be all he has available, regardless of the fiction's corporate resources."},"provenance_note":"All target numbers, success counts and gear descriptions are original SR3 source-specific mechanics; fictional enforcement, disguise and magical social behavior are recorded as game context, not real-world directions."},"headline":"Supernova — exact SR3 hiring-meeting tests, negotiation and magic rules","summary":"Source-reviewed exact game procedures for a fictional tabletop-RPG scenario in First Run (FASA Corporation, FASA7329, 1999), original Shadowrun Third Edition, printed pp23–24/PDF pp24–25; Perception TN4, dice, SR3 cross-references and negotiated fictional rewards.","framing":"reference_exact"}
