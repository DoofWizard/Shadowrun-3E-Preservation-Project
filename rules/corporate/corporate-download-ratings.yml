domain: corporate
status: ingested
source: source.fasa-7125
printed_pages: "119-125"
pdf_pages: "125-131"

corporate_attributes:
  definitions:
    Intelligence: "Information-gathering capability; used as dice pool for determining what the corporation knows."
    Counter-Intelligence: "Ability to keep secrets and prevent information leakage; may serve as target number against investigations."
    Publicity: "Corporate analogue of Charisma; measures public image and media influence."
    Efficiency: "Management, training, crisis response, redundancy and problem-solving effectiveness."
    Black_Ops: "Capability to organize and execute covert corporate operations."
    Security: "Overall ability to protect corporate assets from outside aggression."
  security_subratings: ["Matrix","Magic","Physical"]

