rating_change_cycle:
  cadence: "Once every six months of game time."
  efficiency_test:
    target_number: 4
    effect: "Each success adds one point to an Asset Rating chosen by the gamemaster; a given Asset Rating can increase by no more than 1 from this test."
  publicity_test:
    target_number: 8
    effect: "The corporation loses three Asset points chosen by the gamemaster/randomly, reduced by one point per success; successes beyond three have no additional effect."
  black_ops_test:
    test: "Opposed test: acting corporation's Black Ops vs target corporation's Security."
    zero_successes: "Acting corporation loses one Asset point."
    one_success: "Break even."
    two_or_more_successes: "Acting corporation gains one Asset point and target corporation loses one matching Asset point."
  intelligence_test:
    test: "Opposed/targeted as Intelligence vs another corporation's Counter-Intelligence."
    effect: "Works like Black Ops Test for asset-rating gain/loss."
  note: "Changed Asset Ratings must concern the same category on both sides when transferred/lost through competitive tests."

