contact_knowledge:
  general_information: "-1 or -2"
  specific_details: "+1"
  secret_information: "+2"
  highly_sensitive_black_information: "+4"
  contacts_specialty: "-2"
  fixer_or_mr_johnson: "-2"
  works_for_corporation: "-2"
  procedure:
    - "For information concerning a corporation, use its Counter-Intelligence as the target number for the contact's Intelligence or Etiquette Test, then apply the contact-knowledge modifiers."
    - "If testing what one corporation knows about another, roll the investigating corporation's Intelligence against the subject corporation's Counter-Intelligence, applying appropriate Intelligence modifiers."

asset_rating_scale:
  "0-1": "No assets worth mentioning"
  "2-3": "Poor"
  "4": "Adequate"
  "5": "Above-par"
  "6": "Good"
  "7": "Very Good"
  "8": "Extensive"
  "9-10": "Superior"
  "11": "Extraordinary"
  "12+": "Dominates the world market (no competition)"

