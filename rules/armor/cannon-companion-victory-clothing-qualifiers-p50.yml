headline: 'FASA7908 Cannon Companion: Victory fictional clothing game qualifiers'
summary: 'FASA Corporation Shadowrun Third Edition tabletop RPG, printed p50/PDF51. Original Victory clothing effects omitted by the thirteen matching existing market entities.'
data:
  clothing_quality: ordinary
  industrious:
    fire_attack_power_modifier: -2
    contact_vector_chemical_attack_power_modifier: -2
    winterwear_cold_attack_power_modifier: -2
  wild_hunt:
    all_wild_hunt_items_camouflage_eligible: true
    camouflage_type_selected_at_purchase: true
    camouflage_rules_printed_page: 97
    light_clothing_environment: hot or humid
    heavy_clothing_environment: cold or windy
    massaging_liners: allow extended stationary use without cramps or extreme discomfort
  rapid_transit:
    concealed_color_controls_each_piece: true
    maximum_color_and_pattern_choices: 10
    integrated_equipment_at_cost: [GPS, transceiver, skillsoft jukebox]
    all_rapid_transit_jumpsuits_accessory_eligible: true
    optional_plastic_restraint_melter_game_stats:
      concealability: 10
      capacity_sets: 1
      completion_combat_turns: 10
  source_limit: Game values only; no additional numeric comfort or environmental effects are specified. The original thirteen base clothing market rows match the existing entities.
