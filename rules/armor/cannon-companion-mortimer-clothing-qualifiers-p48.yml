headline: 'FASA7908 Cannon Companion: Mortimer of London clothing game effects'
summary: 'FASA Corporation Shadowrun Third Edition tabletop RPG, printed p48/PDF49. Four fictional clothing lines have specific game modifiers absent from their existing market entities.'
data:
  clothing_quality: tres chic
  troll_and_dwarf_racial_modification_surcharge: 0
  greatcoat:
    chemical_attack_power_modifier: -2
    cold_attack_power_modifier: -2
    covered_item_concealability_multiplier: 1.5
  ulysses:
    chemical_or_liquid_attack_power_modifier: -4
    covered_item_concealability_multiplier: 1.5
  crimson_sky:
    cold_attack_power_modifier: -1
  summit:
    cold_attack_power_modifier: -3
    chemical_attack_power_modifier: -1
    integrated_holster: true
    largest_supported_game_weapon_class: SMG
  reused_market_entities: [entity.armor.mortimer-greatcoat, entity.armor.mortimer-ulysses, entity.armor.mortimer-crimson-sky, entity.armor.mortimer-summit]
  source_limit: No rounding for the concealability multiplier is specified here.
