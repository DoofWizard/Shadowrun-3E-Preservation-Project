headline: 'FASA7908 Cannon Companion: Vashon Island and Zoe outfit game qualifiers'
summary: 'FASA Corporation Shadowrun Third Edition tabletop RPG, printed pp48-49/PDF49-50. Original fictional clothing rules and labels missing from existing armor entities.'
data:
  vashon_island:
    default_clothing_quality: fine
    grand_dame_quality: tres chic
    actioneer:
      printed_line_name: Actioneer Line
      existing_entity_name_variant: Auctioneer
      combinable: true
      mutually_exclusive_components: [Suit Jacket, Long Coat]
      long_coat_covered_item_concealability_multiplier: 1.5
      long_coat_counts_as_separate_armor_layer: false
    sleeping_tiger:
      combinable: true
      maximum_selectable_color_schemes_on_equipped_pieces: 4
    hardliner_gloves_game_skill: Unarmed Combat
  zoe:
    futura:
      clothing_quality: fine
      combinable: true
      mutually_exclusive_components: [Blazer, Sweater]
      printed_bottom_component: Skirt/Slacks
      existing_entity_name_variant: Shirt/Slacks
    heritage:
      clothing_quality: tres chic
      exclusive_commission_period_years: 1
    second_skin:
      clothing_quality: tres chic
      requires_custom_tailoring_to_user: true
  source_limit: Existing nine Vashon Island and five Zoe armor market rows match the printed numeric values. This record preserves original labels and rules without changing shared entities; separate Hardliner Gloves acquisition row not resolved here.
