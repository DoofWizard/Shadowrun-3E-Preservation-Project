source: source.fanpro-10650
printed_pages: '155-156'
pdf_pages: '156-157'
edition_scope: SR3
content_class: [rule_exact]
data:
  publication: {title: Year of the Comet, publisher: FanPro, catalog_number: FanPro10650, edition: Shadowrun Third Edition}
  name: Yucatan Toxic Zones
  domain: environment
  effective: {status: source_defined, basis: defines}
  toxic_rating:
    scale: 1 (light contamination) to 10 (deadly wasteland)
    quick_generation: 1D6
    high_rating_guidance: Ratings 7 or higher are rare; use sparingly.
  daily_exposure:
    test: Damage Resistance Test using Body
    frequency: Once per day spent in a toxic-rated area.
    damage_code_by_rating: {'1': 2L, '2': 3L, '3': 4M, '4': 5M, '5': 6M, '6': 6S, '7+': '(Toxic Rating)D'}
  protection_and_modifiers:
    protective_gear: Apply protection from chemsuits and other systems according to their individual rules.
    open_wounds: Add the Physical Wound Modifier to the exposure target number; exclude Stun wounds.
    medical_procedures: Add the local Toxic Rating to target numbers for first aid and other medical procedures inside the zone.
    direct_exposure: Specific fictional chemical effects refer to Man and Machine pp101-123.
  critters:
    guidance: Most affected creatures become ill and die; some mutate. Apply the source-referenced Critters rules for Mutant Critters p15 and Toxic Critters p17.
  spirits_and_shamans:
    domain: A toxic area is a domain of toxic spirits.
    summoning:
      toxic_spirits: Only toxic shamans can summon toxic spirits.
      nature_spirits: Other nature-spirit summoners cannot summon within a toxic domain.
      entering_spirits: Nature spirits and spirits of the elements able to cross domain boundaries can enter but are reluctant.
      reference: Magic in the Shadows p124.
    shaman_pressure:
      treatment: During the Yucatan devastation shaman player characters experience distress; their totems may urge retreat or protection of the ecology.
      optional_penalty: The gamemaster may assign a suitable Mental Flaw or other penalty during this period, such as one box of unrecoverable Stun damage. Refusal to obey a totem is not a condition.
      toxic_conversion: Do not force a shaman player character to become toxic. If the character does become toxic, immediately transfer control to the gamemaster as an NPC.
      summoned_spirits: Spirits summoned by the shaman may resist entering particular areas and become less helpful generally.
    spirit_activity: Spontaneous appearances increase as the conflict progresses; toxic spirits may obstruct or attack characters. See Magic in the Shadows p98.
  sources:
    - {source: source.fanpro-10650, printed_pages: '155-156', pdf_pages: '156-157', relation: defines}
  precedence:
    supplements_reconciled: rule.environment.yotc-toxic-zone-shaman-qualifications-p156
    corrected_legacy_field: spirits_and_shamans.shaman_pressure.optional_penalty
    note: The earlier refusal prerequisite is replaced by the source-defined period of ecological devastation; no change to other publications is inferred.
framing: reference_exact
headline: Year of the Comet toxic-zone rules and shaman qualifications
summary: Source-reviewed canonical replacement preserving the exposure table and correcting the optional shaman penalty trigger.
