  shaman_penalty: During the period of ecological devastation the gamemaster may assign an appropriate Mental Flaw or other penalty to reflect the shaman character's distress; the example is one box of unrecoverable Stun damage. Refusal of a totem's urging is not a prerequisite stated by the source.
  summoned_spirits: Spirits summoned by the shaman may hesitate to enter certain areas and become generally less helpful.
