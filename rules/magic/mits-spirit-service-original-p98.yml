headline: FASA7907 Magic in the Shadows (SR3) - Spontaneous spirits, elemental service and spirit healing
summary: FASA Corporation, Magic in the Shadows (FASA7907), fictional SR3 tabletop rules, printed p98/PDF99.
data:
  spontaneous_spirits:
    scope: Short-lived spirits appearing in domains without conjuring; usually uninterested in metahuman affairs, but characters may communicate or bargain with them.
    conjuring_resistance:
      applies_to: [banishing, binding, controlling]
      target_number_multiplier: 2
      success_multiplier: 0.5
      rounding: down
  extend_elemental_service:
    procedure: Mage repeats a summoning ritual specifically for an already bound elemental; each Conjuring Test success adds one service to its remaining services.
    drain: Resolve normal Conjuring Drain.
    loss_of_control: Elemental becomes uncontrolled if the mage is knocked unconscious or dies from the damage, or the Conjuring Test rolls all ones.
  elemental_guard:
    binding_good_karma_cost: Force
    counts_against_charisma_limit: false
    guard_duration: 1 year and 1 day, or until banished or killed in astral combat.
    disruption_return: Returns to the guard post after 28 days minus Force; the general disruption rule states a 24-hour minimum separately.
  healing:
    native_plane: Spirit's wounds are healed on next call for service after returning to its native plane.
    summoner_action: Exclusive Complex Action
    summoner_service_cost: 1
    heals: All Physical damage; not Stun damage or Force lost by banishing.
    last_service: If healing consumes the final service, spirit completes its current service before departing.
    natural_recovery: Recover one Condition Monitor box per minute spent out of combat.
