    printed_page: 174
    physical_pdf_page: 175
    nature: historical fictional tabletop RPG rulebook
  source_heading: Magic / Astral Barriers / Wards
  astral_barriers:
    dual_natured: Magical barriers are dual-natured, having physical and astral components.
      The physical part may be chalked, painted or engraved runes in a hermetic circle,
      a physical ward wall, a bead curtain or any other part of a shamanic lodge.
    astral_visibility: Astral form is invisible and intangible to physical beings;
      walking physically through may trigger an Astral Detection Test as if a projecting
      character had passed through them.
    astral_movement: In the astral plane barriers act as solid walls, block movement,
      and impose visual penalty equal to Force.
    penetration: A would-be intruder must overcome an astral barrier in astral combat;
      physical passage alone does not overcome it.
    creator_exception: Creator may see or move through the barrier freely and may
      choose to let other astral forms pass or see through it.
    cross_barrier_spell_target_number_addition: Barrier Force added to target number
      of a spell cast through the barrier at a target on the other side, from either
      physical or astral plane.
  circles_and_lodges:
    trigger: Hermetic circle acts as a barrier only while used for magic; shamanic
      lodge has a barrier conforming to its shape.
    circle_barrier_shape: Hemisphere with diameter equal to circle diameter and height
      equal to its radius or to tallest participant, whichever is greater.
    shamanic_lodge_shape: Barrier conforms to lodge; open-air lodges form hemispheres
      like hermetic circles.
    force: Barrier Force equals circle or lodge Rating.
  wards:
    purpose: Ward is an astral barrier without another magic function; an Awakened
      character capable of astral perception may set one up with time.
    volume_limit_cubic_meters: creator Magic Attribute * 50
    group_volume_limit_cubic_meters: sum of group Magic Attributes * 50
    placement: Must be placed on a non-living physical object such as a wall, vehicle
      or rock; it cannot be moved from that physical component to a new location.
    ritual_hours: desired ward Force
    ritual_special_materials_required: false
    ritual_test: Magic Attribute Test against target number equal to desired ward
      Force; a group makes individual tests and totals successes.
    lifespan_weeks: number of ritual successes
    permanence: May be made permanent by spending Karma equal to ward Force.
    drain_code: (Force)L
    drain_physical: false
    maximum_creator_force: Magic Attribute
    maximum_group_force: sum of group Magic Attributes
    renewal_test: Additional warding ritual on existing ward uses existing Force as
      target number; new successes add the same number of weeks to lifespan.
    failed_renewal: Failure otherwise leaves ward unchanged.
    all_ones_renewal: On all dice showing 1, the renewal attempt destroys existing
      ward.
    nonmandatory_fee_guidance: Some in-world practitioners generally charge around
      100 nuyen per magician-hour; commercial guidance, not an obligatory numerical
      rule.
  lineage: 'Source-only original printed p174: astral combat damage table and subsequent
    p176 combat specifics are separate; no whole-chapter or game-engine certification
    claimed.'
