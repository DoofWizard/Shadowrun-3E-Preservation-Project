id: rule.magic.mits-awakened-world-original-tests
record_type: rule
status: reviewed
source: source.mits
printed_pages: '8-12'
pdf_pages: '9-13'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: Original latent aura, Force regulation and fictional custody mechanics
summary: Original fictional tabletop game rules in FASA Corporation's Magic in the Shadows (FASA7907, Shadowrun Third Edition), printed pp8-12/PDF9-13.
data:
  latent_magical_ability:
    printed_page: 8
    pdf_page: 9
    detection_test: Astral Perception Test
    minimum_successes_before_awakening: 5
    after_awakening: aura displays magical ability normally
    reference: SR3 p172
  in_world_magical_regulation:
    printed_page: 11
    pdf_page: 12
    jurisdictions: [UCAS, CAS]
    regulated_minimum_force: 3
    applies_to: [spell, spirit, focus, other magical effect]
    permits_may_be_obtained: true
  fictional_magician_custody_game_effects:
    printed_page: 12
    pdf_page: 13
    short_term_magemask:
      line_of_sight_blocked: true
      speech_blocked: true
      mental_action_target_number_modifier: 6
      includes_magic_attempts: true
      normally_automatic_action_test: {attribute: Willpower, target_number: 10}
      example_automatic_action: astral projection
    long_term_involuntary_confinement_effects:
      concentration_test_target_number_modifier: 10
      astral_projection_test: {attribute: Willpower, target_number: 14}
    permanent_involuntary_magic_removal:
      resulting_magic_attribute: 0
      flaw_points_per_magic_point_lost: 1
      flaw_category: appropriate physical or mental Flaws
      reference: SR Companion p15
