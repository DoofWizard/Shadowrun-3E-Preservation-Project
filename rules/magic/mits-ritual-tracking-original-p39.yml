id: rule.magic.mits-ritual-tracking
record_type: rule
status: ingested
source: source.mits
printed_pages: '39'
pdf_pages: '40'
edition_scope: SR3
content_class: [rule_procedure]
data:
  eligibility: Ritual Sorcery requirements apply except no spell is cast, and both a material link and astral spotter are mandatory.
  procedure: [begin casting preparations, make Targeting Test, make Drain Resistance Test]
  allocation: More Ritual Pool dice may be allocated to targeting because no spell is cast.
  successful_link: An astral thread appears and the spotter follows it using SR3 p177 astral tracking rules; Ritual Pool dice may augment the Tracking Test.
  result: Spotter may report the physical location; team can interact with the target if astrally present.
  detection_and_reverse_tracking: Use the noticing and tracking procedures for ritual sending on printed p37.
  drain:
    timing: At the end of tracking, every member resists.
    target_number: floor(Targeting Test target number / 2)
    level: M
    pool: Remaining Ritual Pool dice may be distributed to members for Drain.
  maintenance:
    duration: Keep the link until the spotter finishes following it.
    action: Exclusive
    interruption: If withdrawal exhausts the pool, or the ritual is attacked or otherwise interrupted, the astral thread disappears.
framing: reference_exact
headline: 'Fictional Shadowrun Third Edition: Ritual tracking, FASA7907, printed 39/PDF 40'
summary: 'FASA Corporation, Magic in the Shadows; original-source tabletop game mechanics.'
