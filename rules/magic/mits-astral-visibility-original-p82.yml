headline: FASA7907 Magic in the Shadows (SR3) - Astral Visibility
summary: Original fictional tabletop game mechanics, FASA Corporation, printed p82/PDF83.
data:
  illumination: Astral illumination comes from the Earth's and living beings' auras; physical light level does not affect it.
  applicability: Obscurants, mundane-object searches, background count and living biomass modify astral combat, searches, assensing and related tests.
  target_number_modifiers:
    light_fog_or_smoke: 1
    thick_fog_or_smoke: 2
    open_flame: 2
    intense_flame: 3
    looking_for_mundane_physical_object: 2
    background_count: +Level
    crowded_biomass: 2
    packed_biomass: 4
  biomass_examples:
    crowded: Busy dance floor, outdoor concert crowd, large school of fish or water no more than 50 meters deep.
    packed: Thick jungle or packed subway train.
  mundane_shadow_search: Uniform gray appearance makes a mundane physical object's astral shadow harder to locate.
  underwater:
    general: No depth-related illumination penalty.
    shallow_water_depth_maximum_meters: 50
    shallow_water: Treat as crowded biomass because of living organisms.
    polluted_water: Relatively low biomass, but likely a slight background-count penalty; source gives no fixed numeric rating.
