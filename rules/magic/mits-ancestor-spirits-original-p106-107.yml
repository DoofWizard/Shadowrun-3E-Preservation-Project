id: rule.magic.mits-ancestor-spirits-original
record_type: rule
status: reviewed
source: source.mits
printed_pages: '106-107'
pdf_pages: '107-108'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7907 Magic in the Shadows (SR3) - Ancestor Spirit summoning and original stat row
summary: FASA Corporation's Magic in the Shadows, fictional tabletop game rules, printed 106-107/PDF107-108.
data:
  astral_quest:
    plane: Plane of the Dead; reflects the summoner's individual beliefs and background.
    eligibility: Initiates may quest there only after an ancestor spirit agrees to guide them.
    other_metaplane_rules: Apply normally (p91).
  summoning:
    appropriate_fetishes: 3
    missing_fetish_service_reduction_each: 1
    reduction_discretion: Gamemaster.
    duration_hours: desired Force / number of spirit relatives present (including shaman)
    relatives_required_to_be_willing: false
    services_and_drain: Resolve normally.
    simultaneous_limit: 1
    replacement: Prior ancestor spirit vanishes; all its remaining services are lost.
    great_form_known: false
  stat_row:
    columns: [B, Q, S, C, W, I, E, R]
    values: [F+2, F*3, F+1, F, F, F, F/A, F]
    initiative: F+10+1D6
    astral_initiative: F+20+1D6
    attack: (Strength)M Stun
    powers: [Accident, Confusion, Divination, Guard, Materialization, Search]
    power_list_correction: Original list does not include Concealment, unlike entity.spirit.ancestor.
    domain_boundary: None.
    power_radius_kilometers: Force * 5
