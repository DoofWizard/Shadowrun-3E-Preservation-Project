id: rule.magic.mits-sacrificing-geas-drain-original
record_type: rule
status: reviewed
source: source.mits
printed_pages: '133-134'
pdf_pages: '134-135'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7907 fictional Blood Magic geas and Drain qualifications, printed pp133-134
summary: FASA Corporation, Magic in the Shadows (FASA7907, Shadowrun Third Edition), printed pp133-134/PDF134-135; fictional tabletop rules supplement to option.magic.sacrificing, not real-world practice.
data:
  supplements: [option.magic.sacrificing]
  geas:
    instruction: Group already knowing the geas required.
    interval_hours: 24
    fictional_qualification: Death of a sentient game character through a direct-contact unarmed or personal-weapon attack by the geas holder; a spell or ranged-weapon attack does not qualify.
    failure: Geas broken; magical ability is not maintained by this geas.
  learning:
    group_knowing_technique_required: true
    self_initiation_allowed: false
    npc_exception: Some fictional magical threats learn from spirits or astral quests; the text disallows the same route for player characters without loss of sanity.
  drain_modifier:
    applies_to: Drain of any Magical Skill test by an initiate.
    fictional_donor_consent: Willing or unwilling.
    fictional_donor_eligibility: Sentient creatures; paranormal critters subject to GM determination; a spirit qualifies only when inhabiting a living body. The caster may be the donor.
    qualifying_critter_examples: [sasquatch, dragon]
    qualifying_spirit_example: Ally spirit inhabiting an animal form.
    game_target_conditions: Arm's-reach range; donor game character restrained or otherwise unable to resist; qualifying Physical damage from a melee weapon wielded by the initiate.
    fictional_qualifying_wound_draws_blood: true
    test_skill: Melee Combat Skill
    target_number: 2
    action: Part of the spellcasting Complex Action.
    success_selection: Caster may choose not to apply all successes.
    resistance: Normal Damage Resistance Test without Combat Pool dice.
    spell_timing: Simultaneous with qualifying damage event.
    effective_force_drain_delta_per_physical_box: -1
    actual_force_for_sorcery_and_spell_resistance: unchanged
    additional_fictional_death_delta: '-floor(donor Essence / 2)'
    self_donor_resolution: Source permits any desired level of Physical damage to the caster game character.
    example: {spell_force: 9, physical_damage_boxes: 4, effective_force_for_drain: 5}
    summoning_link: Characters with this metamagic can also summon blood spirits; see p134.
