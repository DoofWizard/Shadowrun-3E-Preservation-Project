  source_heading: Magic / Astral Tracking
  scope: In the published fictional Shadowrun setting, existing magical things (spells,
    spirits, foci, circles, and lodges) retain an astral link to their owner; astral
    travelers can use the link to trace the source.
  start_tracking:
    test: Astral Perception Test
    target_number: 4
    base_time_hours: 6
    elapsed_time_formula: 6 hours divided by successes on the Astral Perception Test
    requirement: The tracker must maintain astral projection for the search interval,
      unless suspending the attempt.
  suspension:
    allowed: If search duration exceeds the tracker’s permissible astral projection
      interval, tracking may be halted so the character can rest and resume later.
    resume_test: Intelligence or Magic Test (use whichever Attribute is higher)
    resume_target_number: Number of hours since the tracking was abandoned
    resume_successes_required: 1
    failure: Trail is lost if no successes on the resumption test.
    restart_after_loss: A new Astral Perception Test can be attempted with a +2 target-number
      penalty.
  provenance_note: Original source printed p177 is physical PDF page 186, after eight
    intervening color plates; no interpolated content from those plates.
headline: FASA Corporation Shadowrun, Third Edition FASA7001 fictional Astral Tracking
