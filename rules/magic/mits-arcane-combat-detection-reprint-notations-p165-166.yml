    core_canon_target: See Detection Spell Target Number table on original p192
    status: unresolved_cross_source_target_difference
    handling: Preserve both source-specific entries; no supersession or conversion inferred.
  qualifications:
    - Interpret R only under the supplement key's unwilling-target condition; no new resistance by voluntary recipients is inferred.
    - Mindlink carries the voluntary-target qualifier; its directional line-of-sight code does not replace the core rules for later movement.
    - Type, duration and Drain effects remain in the pinned core records. Differences in notation, formatting and absent dedicated range fields are not by themselves rule contradictions.
