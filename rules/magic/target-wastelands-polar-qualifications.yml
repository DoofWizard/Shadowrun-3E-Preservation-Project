headline: Polar magic and spell exceptions
data:
  source_title: "Target: Wastelands"
  publisher: FanPro
  page_123:
    traceless_walk: Permits crossing snow without sinking or leaving a trail.
    temperature_tolerance: Protects against polar cold; the printed parenthesis specifies -1 target modifier per level for desert Survival Tests, not polar Survival Tests. Preserve the wording discrepancy.
    sixth_sense: May help an adept avoid thin ice, unstable snow, crevasses or avalanches.
    fire_elemental: A service can keep a character warm or melt icy obstacles or snow for water.
    nature_spirit_guard: Desert or wind spirits can protect characters from snowstorms using Guard.
    white_nights: Nocturnal or diurnal totems and appropriate time geasa may be advantaged or disadvantaged according to season.
  page_124:
    antarctic_mana_surge: Surge duration and intensity are random and unpredictable; the gamemaster chooses the interval before rolling again, generally once daily.
    waterbolt_and_splash: A drysuit or polar survival suit exempts a character from the specified immediate wet-freezing hazard; otherwise the temperature-dependent damage and action modifiers already recorded in the polar spell catalog may apply until dry and warm.
    tupilak: Ally spirits, usually with Inhabiting; access to Accident and Fear through special rituals or metamagic is presented only as a rumor.
