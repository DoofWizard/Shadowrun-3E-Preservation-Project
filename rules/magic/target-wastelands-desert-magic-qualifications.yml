headline: Fictional Desert magical survival qualifications
data:
  source_title: "Target: Wastelands"
  publisher: FanPro
  spell_qualifications:
    personal_thermostat: Personal rather than area-effect version of Alter Temperature.
    limited_armor_against_heat: Protects against desert sun and hot sand as well as heat-based elemental effects.
  adept_powers:
    traceless_walk: Allows travel across desert sand without a trail and defeats seismic microphones.
    temperature_tolerance: "-1 target number per level for desert Survival Tests."
  spirit_services:
    air_elemental: One service gives a cool sand-free breeze for one day.
    air_elemental_sandstorm: "+1 modifier to all actions when materialized within a sandstorm."
    water_elemental: One service supplies water for a number of characters equal to Force for one day.
    nature_spirit:
      domains: [desert, wind]
      guard: May protect characters from sandstorms.
      oasis: At gamemaster discretion can indicate the direction of an oasis.
