  refining_constraint: The ordinary raw-metal refining procedure referenced on MITS p41 dissolves natural orichalcum. Use the already recorded alternative alchemical circulation procedure instead.
  campaign_availability:
    discovery: September 2061.
    depletion: In mid-2062 all known deposits run dry; even located but unexploited deposits disappear. No new veins are found at that time.
    scope: This describes deposit availability during the source's fictional campaign chronology, not the destruction of already recovered stock.
