  scope_limits:
    - The table key supplies the interpretation of T, R, RC and A in their respective columns. Source-specific target and range notation is retained without duplicating core effect profiles.
    - Influence's parenthesized Drain notation in this table differs literally from the bare S in the pinned core record; do not infer a substantive difference solely from punctuation.
    - Source-specific rows and pinned core records are not evidence of engine execution or formal book acceptance.
  review:
    original_pages: Fresh verified original Drive PDF; publication identity PDF1 and p6/PDF7; all 23 starred Manipulation rows on printed pp167–169/PDF168–170 directly inspected against the four pinned core records.
    reviewed_text_paths: [edition_scope, headline, summary, 'data.*']
    scope: Control, elemental, telekinetic and transformation reprint notation only. Magical Gear and Adept Powers remain separate.
