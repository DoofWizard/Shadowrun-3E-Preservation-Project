id: rule.magic.mits-great-form-original
record_type: rule
status: reviewed
source: source.mits
printed_pages: '107'
pdf_pages: '108'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7907 Magic in the Shadows (SR3) - Great Form Spirits and physical bonus costs
summary: FASA Corporation, Magic in the Shadows, printed 107/PDF108, fictional tabletop mechanics.
data:
  physical_bonus:
    eligibility: Successful Invoking by an initiate; enhancements apply to the materialized physical form.
    budget: floor(initiation grade / 2)
    cost_per_increase: {Armor: 1, Body: 1, Reach_plus_1: 2}
    example: {grade: 8, force: 6, budget: 4, reach_increase: 1, body_increase: 2}
    correction: The original table sets Armor cost at 1 point per increase, contrary to rule.spirits.great-form notes (3).
  great_blood_spirits:
    proximity_to_sentient_beings_required: false
    simultaneous_power_targets: Force
    additional_power: Engulf; resolve as water Engulf (SR3 p263).
  great_elementals:
    simultaneous_power_targets: Force
    area_engulf_radius_meters: Force
    may_exclude_friendly_targets: true
    environmental_effects_require_physical_form: true
    environmental_effects_range: Line of sight.
    environmental_effects:
      fire: Ignition of flammable game objects.
      water: Burst pipes, flooding and directed water.
      air: Wind produces Difficult Ground (p112).
      earth: Tremor magnitude 4 or 5, damage to fragile structures/items and Difficult Ground.
  great_loa:
    additional_hosts: Other astrally active characters and beings, beyond houngans and serviteurs.
    physical_appearance: Host takes on the loa's appearance over the entire body.
    possession_duration: At the spirit's discretion, without the ordinary duration limit.
    additional_power_when_possessing: Immunity to Normal Weapons.
    additional_type_power_reference: Loa Spirit Powers p102.
  great_nature_spirits:
    may_cross_domains: true
    land_sea_sky_additional_power: Storm (p99).
    man_additional_power: Divination for domain-related questions.
    simultaneous_power_targets: Force
    counts_toward_one_per_domain_limit: false
    total_bound_limit: Summoner Charisma
  great_spirits_of_elements:
    may_cross_domains: true
    bound_limit: Magician Charisma; each counts as one.
    additional_powers: [Storm, Cleansing]
    cleansing_resolution: Use metamagic Cleansing (p74), substituting spirit Essence for Sorcery.
