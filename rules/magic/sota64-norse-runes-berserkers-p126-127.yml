data:
  publication: {title: 'State of the Art: 2064', publisher: FanPro, catalog_number: FanPro25004, edition: Shadowrun Third Edition, chapter: Old World Magic, section: 'Norse Pagans, Rune Enchanting and Berserkers', printed_pages: '126-127', physical_pdf_pages: '127-128'}
  norse_pagan_magicians:
    tradition: Standard shaman rules; pantheistic shaman if following pantheon, idol follower if devoted to individual deity.
    references: [MITS p26]
  rune_enchanting:
    skill_requirements: Rune Lore Knowledge skill and Enchanting.
    declaration_timing: Before beginning focus formula; restrictions incorporated into formula.
    formula_creation_base_time_multiplier: 2
    enchanting_base_time_multiplier: 2
    additional_test: Rune Lore against focus Force after normal Enchanting Test.
    failure: Rune Lore failure is equivalent to failed Enchanting Test.
    without_rune_lore: Cannot apply runic restrictions to formula.
    restrictions: Function as geasa (MITS pp31-33) except focus functions only when conditions met.
    restrictive_condition_examples: [No exposure to sunlight, Soaked in beer, No steel contact, Exposure to moonlight]
    particularly_specific_condition: GM may count it as two geasa (example full-moon-only use).
    per_restriction:
      enchanting_target_number_modifier: -1
      first_bonding_karma_cost_modifier: -1
      standard_bonding_karma_cost_modifier: -1
    focus_addiction: Normal.
    talisman_geas: May make runic focus a condition of ordinary talisman geas.
    runes_without_restrictions: No bonus.
    formula_reference: MITS p42
  berserkers:
    typical_character: Warrior adept with combat frenzy geas covering all magical powers; magician's way or shamanic way adepts also possible.
    shamanic_mask: Powerful berserkers may exhibit mask during frenzy.
    frenzy: All may enter frenzy as Bear shamans do (SR3 p163); certain fictional game substances and BTLs may also induce frenzy.
    initiated_at_will_test:
      attribute: Willpower
      target_number: 6 - Initiate Grade
      minimum_target_number: Not separately specified in this passage.
framing: reference_exact
headline: 'Old World Magic — Norse Pagans, Rune Enchanting and Berserkers'
summary: 'Source-specific SR3 fictional tabletop mechanics from printed pages 126-127; no whole-source completion claim.'
