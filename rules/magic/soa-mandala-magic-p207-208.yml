data:
  publication: {title: Shadows of Asia, publisher: FanPro, edition: SR3, catalog: FanPro25007}
  tibetan:
    path: Path of Wuxing
    reference: Magic in the Shadows p17
    replacement: mandala instead of hermetic circle
    material: colored sand
    hermetic_circle_rules: Most apply, subject to the following exceptions.
    physical_size_fraction: '1/3'
    astral_size_multiplier: 1
    construction_time_multiplier: 3
    rituals_per_mandala: 1
    after_ritual: Gather the sand and empty it into running water, preferably a river dragon line in Tibet.
    summoning: Tibetan Wuxing monks need no mandala to summon spirits.
    practical_scope: Construction delay and single-use limit principally affect ritual sorcery and astral quests.
  hindu:
    practitioners: Brahmin hermetic magicians
    replacement: mandala instead of hermetic circle
    rules: Similar rules to Tibetan mandalas, with the same benefits; no separate numerical exception is specified.
    design: Usually simpler than Tibetan mandalas; geometric and symbolic depiction of the ritual or spell, traditionally colored sand but other materials are used.
headline: "Tibetan and Hindu mandala rules"
framing: reference_exact
