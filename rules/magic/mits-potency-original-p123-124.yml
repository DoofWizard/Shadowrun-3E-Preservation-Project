headline: Magical threats — Potency, goals and spirit pact mechanics
summary: Fictional Shadowrun Third Edition rules from FASA Corporation, Magic in the Shadows (FASA7907), printed pp123-124/PDF124-125.
data:
  potency:
    users: Awakened NPC magical threats, including toxic shamans, Petro houngans, insect shamans, blood magicians, corrupted magicians and followers of the twisted way; spirits do not gain Potency.
    pool: Additional dice pool for any magical test; standard SR3 dice-pool rules apply; refresh at the start of every Combat Turn.
    effective_magic: Magic Attribute plus Potency Rating for standard Magic Attribute uses, including determining physical Drain.
    spell_pool: Exclude Potency from Spell Pool calculation.
    geas: Lost Potency cannot be compensated by a geas.
    adept_bonus_power_points: Potency Rating
    goal_achieved_delta: 1
    goal_thwarted_delta: -1
    deed_ordeal: Destroying a magical threat may qualify as a deed ordeal for initiation.
  pact:
    eligibility: An NPC magical threat may enter a pact with a willing free spirit; usually only shadow free spirits consider it. The source also allows a threat to compel a free spirit into a pact through its true name; such a spirit seeks to escape the bond.
    spirit_maximum_simultaneous_pacts: 1
    initial_permanent_potency_bonus: ceil(Spirit Energy / 2)
    subsequent_link: Each increase or decrease of either rating causes the same change in the other rating, at a one-to-one ratio.
    termination: Only the death of one partner breaks the bond.
    inducements: A spirit may offer use of powers such as Wealth or Astral Gateway, or teach spells or metamagic under the applicable learning rules.
    survivor_outcomes: The source states the result may depend on whether the survivor was the dominant partner. It describes no further effect other than release from the bond in many cases; alternatively the survivor can gain a permanent Potency or Spirit Energy bonus, or lose rating in proportion to the fallen partner's power. No exact general bonus or loss formula is specified; some surviving threats lose all magical ability.
    survivor_mental_flaws: In almost all cases a threat surviving a spirit partner's death acquires Mental Flaws (SRComp p22) worth points equal to the spirit's Spirit Energy.
  existing_canon:
    - rule.magic.potency
    - rule.magic.spirit-pact-threat
  distinct_source: The separate Shared Potency rule in Threats 2 uses different pact-specific provisions; no supersession is asserted.
