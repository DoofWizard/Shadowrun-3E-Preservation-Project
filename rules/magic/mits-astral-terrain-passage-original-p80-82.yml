headline: FASA7907 Magic in the Shadows (SR3) - Astral Terrain, Earth Passage and Getting Lost
summary: Original fictional tabletop game mechanics, FASA Corporation, printed pp80, 82/PDF81, 83.
data:
  terrain:
    astral_forms: Solid and luminous to one another, including spirits, projecting magicians, dual beings and the Earth.
    physical_shadows_and_auras: Visible but immaterial on the astral plane.
    mana: Invisible and pervasive.
  earth_passage:
    earth: Natural rock and soil connected to the living Earth are astrally solid; worked or detached material such as cut stone, concrete or adobe does not have that property.
    exception: An astral form may penetrate the Earth's diffuse astral form despite ordinary astral solidity.
    base_minutes_per_meter: 30
    test: Charisma
    target_number: 4
    success_time: Base travel time divided by successes.
    assistance: Earth elementals and gnomes may assist as a service or favor, adding their Force in dice to the Charisma Test.
    failure: No successes means the traveler cannot pass through Earth.
    additional_attempts_maximum: Traveler's Charisma.
    cumulative_target_number_increase_per_additional_attempt: 2
    abandoning_attempt: A traveler may stop the attempt at any time and return to the starting point by normal movement.
    no_passage_left_behind: A follower or traveler returning through Earth to the surface must make the same Charisma Test; no persistent tunnel exists.
    duration_warning: Earth passage may exceed the safe duration of astral projection.
    example: 12 meters requires 6 hours base; Charisma 5 against TN 4 yields 3 successes, reducing time to 2 hours. Leaving through Earth requires another test.
  getting_lost:
    visibility: An astral form inside opaque material has no line of sight.
    test: GM makes a secret Intelligence Test during blind transit through a large solid object requiring more than one Action to traverse.
    base_target_number: 4
    target_number_increase_per_30_minutes_blind: 1
    failure: Traveler goes in the wrong direction and discovers this when they fail to emerge at the intended time and place.
    all_ones: Completely lost; a character must attempt to return to their physical body under SR3 p173; a spirit must return to its home metaplane.
    scope: Objects more than a few meters thick; excludes large objects with open spaces such as buildings.
    guide: Earth elementals and gnomes may guide travelers as a service or favor and never become lost.
    example: Two hours blind gives TN 8; Intelligence 5 rolls 1, 1, 2, 3, 5 for zero successes, so traveler deviates from intended route.
  mapping_note: Physical PDF82 is a full-page illustration, not included in the mechanical page references.
