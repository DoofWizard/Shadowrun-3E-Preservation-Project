headline: Toxic shamans, domains and spirits — Force and Potency rules
summary: Fictional Shadowrun Third Edition rules from FASA Corporation, Magic in the Shadows (FASA7907), printed pp124-127/PDF125-128.
data:
  shaman:
    alignments: [avenger, poisoner]
    totem: A corrupted interpretation of a normal totem; retain the standard totem modifiers and the obligation to follow the totem's distorted ways.
    typical_totems: Avengers tend toward wilderness totems; poisoners tend toward urban totems.
    typical_initial_potency: floor(1D6 / 2)
    potency_goals: The fictional NPC's alignment determines suitable goals for the ordinary Potency gain rule; the book gives examples involving attacks on settlements or executives, environmental catastrophe, and release of paranormal creatures.
  domains:
    background_count: Most toxic domains have a strong background count.
    nature_spirits: Ordinary shamans cannot summon nature spirits in toxic domains.
    spirits_of_man: Toxicity is determined by extreme human misery or extreme regimentation and repression, rather than environmental pollution alone.
  toxic_spirits:
    summon_or_control: Toxic shamans only.
    banishing: Other magicians may banish them.
    control_contest: If the original summoner loses control, the spirit is freed rather than transferred to the challenger.
    inherited_powers: Ordinary nature-spirit powers and abilities for the corresponding type.
    additional_powers: [Corrosive Secretions, Noxious Breath]
    appearance: The toxic nature is apparent to observers.
    summoning_test_force: Chosen Force for the Conjuring Test.
    drain_resistance_force: Chosen Force for the Conjuring Test.
    spirit_force: Chosen Force + toxic domain background count.
    domain_boundary: A toxic shaman can send a summoned toxic spirit in physical form outside its domain, without ordinary nature-spirit domain restrictions.
    free_spirit: A toxic free spirit may make a Spirit Pact with a toxic shaman in addition to its other free-spirit powers.
  rare_toxics:
    wu_jen: Apply the toxic shaman rules to toxic wu jen.
    spirits_of_elements: Convert spirits of the elements to toxic spirits in the same manner as nature spirits; spontaneous appearances in toxic domains are described.
    source_cross_reference: The Domain Phenomenon page reference is printed as p. XX.
  existing_canon:
    - option.magic.toxic-shaman
    - rule.magic.toxic-domains
  correction: The historical toxic-domains summary applies increased Force to summoning resistance; the original explicitly uses chosen Force for both summoning and Drain-resistance tests, while increasing the spirit's Force by background count.
