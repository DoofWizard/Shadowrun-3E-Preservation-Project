headline: FanPro Shadows of Europe (FanPro25002), Shadowrun Third Edition fictional rules — Brittany Light Mist and Dense Mist
summary: Common and distinct rated Mist effects, spirit control tests, mana storms and astral rifts.
data:
  section: The Mist
  common:
    manifestations: May hide within ordinary fog; supernatural silence and possible luminous or visual effects.
    planes: [astral, physical]
    hindered: [radar, detection devices, detection spells, hearing, normal sight]
    tests_and_flux: Modifier magnitude equals Mist rating; printed wording gives no explicit signed Flux adjustment.
    background_count: Mist rating
    encounters: Paranormal critters are attracted; encounter likelihood increases, with no numeric chance specified.
  light:
    frequency: common
    rating_range: [1, 5]
    confusion: Affects metahumans as SR3 Confusion (p263), using Mist rating instead of critter Essence.
    controlled_spirit_encounter:
      test: Controlling magician immediately tests Willpower against Mist rating times 2.
      failure: Spirit departs immediately and will not return to the Mist; magician may call it later outside the Mist.
      success: Spirit remains and one favor or command is expended.
    optional_invisible_mana_storms:
      reference: Target Awakened Lands p111
      spell_effects: [Illusion, Control Manipulation]
      combination: and/or
  dense:
    frequency: rare
    rating: '1D6 + 3'
    confusion: Affects spirits and has the same Confusion effect as Light Mist; retain this source wording without expanding target scope by inference.
    occasional_metahuman_movement: May limit metahuman travel using the SR3 Movement critter power (p265), substituting Mist rating for critter Essence.
    usual_physical_mana_storms:
      spell_effects: [Mana-based Combat, Elemental Manipulation, Control Manipulation]
    occasional_astral_rifts: Open to unknown metaplanes and force anyone in the area to astrally project; use Target Awakened Lands pp102-103.
