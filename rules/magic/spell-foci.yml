scope:
  applies_to: ["Expendable Spell Foci","Specific Spell Foci","Spell Category Foci"]
  excludes: []
resolution:
  summary: "Spell foci provide additional dice equal to Force for the spellcasting functions allowed by their subtype. Expendable foci are consumed on use; specific-spell and category foci remain bonded and allocate dice to eligible Sorcery/Drain functions under their subtype restrictions."
  inputs: ["focus subtype","Force","eligible spell/test"]
  outputs: ["bonus dice"]
