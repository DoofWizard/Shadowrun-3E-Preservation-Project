headline: FASA Corporation Shadowrun, Third Edition (FASA7001) fictional spellcasting
  target-number conditions, printed p183/PDF192
summary: Original magic rules for sustained-spell +2 TN per spell, touch-range visibility
  exception, elemental manipulation base TN4 regardless of range when visible, and
  applicable ranged-combat modifiers and evasion.
data:
  publication:
    title: Shadowrun, Third Edition
    publisher: FASA Corporation
    edition: Third Edition
    catalog_number: FASA7001
    source_id: source.sr3-core
    pdf_sha256: 7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914
    printed_page: 183
    physical_pdf_page: 192
    nature: published fictional tabletop roleplaying rules
  source_section: Spellcasting / Spell Targeting continuation / Elemental Manipulation
    Spells
  sustained_spells:
    modifier_per_active_sustained_spell_to_new_spellcasting_target_number: 2
    scope: Each spell the caster is currently sustaining increases the target number
      of a subsequently cast spell by +2.
  touch_range:
    cover_or_visibility_spellcasting_target_modifiers_apply: false
    condition: Spellcaster must touch intended target. When the target resists contact,
      resolve the separate Unarmed Combat Test under normal melee modifiers; the touch
      attack is not exempt from those modifiers.
  elemental_manipulations:
    casting_test: Sorcery as ranged-combat skill, following ordinary ranged attack
      mechanics in the original book
    base_target_number: 4
    base_target_number_ignores_range: true
    line_of_sight_requirement: Caster must be able to see the target; the range-independent
      base TN does not override target visibility.
    additional_target_modifiers:
    - cover
    - visibility
    - injury
    - sustaining spells
    defense: These elemental manipulation attacks may be dodged under the relevant
      ranged combat rules; resistance is a Damage Resistance Test rather than ordinary
      spell resistance.
