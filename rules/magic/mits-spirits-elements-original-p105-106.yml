id: rule.magic.mits-spirits-elements-original
record_type: rule
status: reviewed
source: source.mits
printed_pages: '105-106'
pdf_pages: '106-107'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7907 Magic in the Shadows (SR3) - Spirits of the Elements original statistics and domain rules
summary: FASA Corporation's fictional tabletop RPG Magic in the Shadows, printed 105-106/PDF106-107.
data:
  eligibility:
    usual_tradition: Path of Wuxing.
    other_traditions: Path of the Bard and certain shamans unable to summon spirits of man may summon particular types.
    independently_appearing_spirits_summonable: false
    toxic_spirits: Attack toxic spirits on sight regardless of summoner commands.
    wood_metaplane_has_elemental_equivalent: false
  domains_and_summoning:
    natural_origin_required: true
    artificial_sources_excluded: true
    ordinary_spirit_may_leave_domain: false
    great_form_exception: true
    suggested_domain_radius_meters: Force * 10
    summoner_need_be_inside_domain: false
    line_of_sight_required: true
    domain_membership: After summoning the conjurer is considered within that domain; summoning any other spirit counts as leaving it.
    simultaneous_domain_membership_limit: 1
    summoning_resolution: Nature spirit procedure (SR3 p186); one favor per success, one spirit of the elements per domain.
    default_plane: Astral; materializes or manifests if requested.
    may_use_powers_on_summoner_from_astral: true
    control_eligibility: Magicians capable of summoning spirits of the elements.
    banishment: Standard procedure (SR3 p189).
  statistics:
    notation: F = spirit Force; F/A retained as printed for Essence. Q formula retains movement multiplier.
    columns: [B, Q, S, C, W, I, E, R]
    gnome:
      attributes: [F+4, (F-2)*2, F+4, F, F, F, F/A, F-2]
      initiative: F+8+1D6
      astral_initiative: F+20+1D6
      attack: (Strength)S
      reach_bonus: 1
    manitou:
      attributes: [F+3, F*2, F+1, F, F, F, F/A, F]
      initiative: F+10+1D6
      astral_initiative: F+20+1D6
      attack: (Strength)S
      engulf_damage: (Force)S Stun
    salamander:
      attributes: [F+1, (F+2)*3, F-2, F, F, F, F/A, F+1]
      initiative: F+10+1D6
      astral_initiative: F+20+1D6
      attack: (Strength)M
    sylph:
      attributes: [F-2, (F+3)*4, F-3, F, F, F, F/A, F+2]
      initiative: F+12+1D6
      astral_initiative: F+20+1D6
      attack: (Strength)M Stun
    undine:
      attributes: [F+2, F*2, F, F, F, F, F/A, F-1]
      initiative: F+9+1D6
      astral_initiative: F+20+1D6
      attack: (Strength)S Stun
  existing_profile_bindings:
    gnome: entity.spirit.element-gnome
    manitou: entity.spirit.element-manitou
    salamander: entity.spirit.element-salamander
    sylph: entity.spirit.element-sylph
    undine: entity.spirit.element-undine
