headline: Corrupted and Twisted Way Potency and pact qualifications (fictional SR3 NPC rules)
summary: FASA Corporation, Magic in the Shadows (FASA7907, Shadowrun Third Edition), printed pp134-135/PDF135-136; fictional tabletop RPG rules supplement to the historical NPC options.
data:
  supplements: [option.magic.corrupted-magician, option.magic.twisted-way]
  corrupted:
    starting_potency: 'floor(1D6 / 2)'
    starting_potency_qualification: Unconditional for the source-defined Corrupted NPC category, not merely typical.
    potency_goal_basis: The fictional magician selects a personal kind of harmful conduct; success at relevant fictional threat objectives increases Potency.
    illustrative_goal_categories: [ritual killing under a specified fictional auspicious-time condition, inducing an innocent character to commit a crime or act against their nature, inducing addiction to a dangerous or degrading vice, destroying another character's symbol of hope or achievement or happiness]
    pact_eligible_spirit: Shadow free spirit, under Spirit Pacts p124.
  twisted_way:
    starting_potency: 'floor(1D6 / 2)'
    starting_potency_qualification: Unconditional for followers of the Twisted Way, not merely typical.
    potency_power_points: Additional Power Points may purchase powers suited to the fictional adept's personal path; a Potency decrease removes the corresponding extra powers.
    physical_changes: May accompany Potency growth and new powers; no fixed pattern or mandatory physical change table is provided.
    physical_change_examples: [scaly hide associated with Mystic Armor, altered eyes associated with improved vision]
    pact_eligible_spirit: Shadow spirit, in the same manner as the Corrupted under Spirit Pacts p124.
    illustrative_goal_categories: [hunting a specified fictional victim and inducing fear, defeating a specified opponent in mortal combat, demonstrating superior skill, gaining dominance over followers through strength and skill and cunning]
