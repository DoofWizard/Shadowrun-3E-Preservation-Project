id: rule.magic.mits-corrupted-twisted-original
record_type: rule
status: reviewed
source: source.mits
printed_pages: 134-135
pdf_pages: 135-136
edition_scope: SR3
content_class:
- rule_exact
framing: reference_exact
headline: Original fictional NPC Potency rules and objective examples
summary: FASA Corporation, Magic in the Shadows (FASA7907, Shadowrun Third Edition),
  printed pp134-135/PDF135-136; fictional RPG antagonist rules.
data:
  supplements:
  - option.magic.corrupted-magician
  - option.magic.twisted-way
  corrupted:
    starting_potency: floor(1D6 / 2)
    starting_potency_qualification: Unconditional for the source-defined Corrupted
      NPC category, not merely typical.
    potency_goal_basis: The fictional magician selects a personal kind of harmful
      conduct; success at relevant fictional threat objectives increases Potency.
    illustrative_goal_categories:
    - Fictional ritual killing objective with a specified victim count, prescribed
      ritual manner and specified celestial alignment or other auspicious timing.
    - Causing an innocent fictional person to commit a crime or another act contrary
      to their nature.
    - Causing a specified number of fictional people to become addicted to a particularly
      degrading or dangerous vice.
    - Destruction of a symbol of hope, achievement or happiness for one or more fictional
      people.
    pact_eligible_spirit: Shadow free spirit, under Spirit Pacts p124.
  twisted_way:
    starting_potency: floor(1D6 / 2)
    starting_potency_qualification: Unconditional for followers of the Twisted Way,
      not merely typical.
    potency_power_points: Additional Power Points may purchase powers suited to the
      fictional adept's personal path; a Potency decrease removes the corresponding
      extra powers.
    physical_changes: May accompany Potency growth and new powers; no fixed pattern
      or mandatory physical change table is provided.
    physical_change_examples:
    - scaly hide associated with Mystic Armor
    - altered eyes associated with improved vision
    pact_eligible_spirit: Shadow spirit, in the same manner as the Corrupted under
      Spirit Pacts p124.
    illustrative_goal_categories:
    - Fictional stalking and killing objective involving a specified victim type,
      with both challenge to the hunter and maximum fear in the victim as example
      qualifications.
    - Victory in mortal combat against a specified type of fictional opponent.
    - Demonstrated superior skill in a particular area; the book cites theft of a
      well-guarded item or killing of a well-protected fictional individual as examples.
    - Dominance over a fictional group of followers through superior strength, skill
      and cunning.
  example_scope:
    printed_page: 135
    pdf_page: 136
    applicability: Optional character-specific example goals, not universal prerequisites
      or an exhaustive list.
    numeric_awards: No fixed Potency increment or fixed target count is assigned by
      these examples.
