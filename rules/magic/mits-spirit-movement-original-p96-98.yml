headline: FASA7907 Magic in the Shadows (SR3) - Spirit movement, metaplanar travel and disruption
summary: FASA Corporation, Magic in the Shadows (FASA7907), fictional SR3 tabletop rules, printed pp96, 98/PDF97, 99.
data:
  scope: Spirit rules in SR3 pp260-269 apply unless superseded by specific rules.
  astral_movement:
    slow_meters_per_combat_turn: Force times 5
    fast_maximum_kph: Force times 1000
    exception: Spirit-specific movement overrides these rates.
  metaplanar_travel:
    action: Complex Action
    route: Directly between physical or astral space and native metaplane, in either direction, unless otherwise stated; astral barriers do not impede the transit.
    other_planes: Most spirits cannot access planes other than their native one.
    standby: Spirit usually waits on its native plane until called; on return it appears in astral space in the summoner's presence, not at a remote ordered location.
    domain_limit: Domain-limited spirits can return only within their domain.
    barrier_shortcut_service_cost: 1
    free_spirits: May travel to any metaplane and arrive directly at a familiar location in physical or astral space; unfamiliar locations require ordinary or astral travel.
    assensing: At least 5 Assensing Test successes reveal the number and types of spirits the summoner has on call in the metaplanes, but not their Force.
    quest_companion: A questor can bring or call a bound spirit on the metaplanes; spirit automatically makes an Opposed Test to go free using its Force against the character's Charisma.
    native_plane_test_force_multiplier: 2
  disruption:
    triggers: Deadly Stun in astral combat or destruction of physical form by Physical or Stun damage in physical combat.
    return: Disrupted spirit goes to its native plane; cannot reappear in physical or astral space for 28 days minus Force, minimum 24 hours.
    elemental_capacity: Disrupted bound elementals still count against binding capacity; at the limit, release one before summoning a replacement.
    watcher_exception: Watchers are permanently destroyed rather than disrupted when knocked out.
    early_return: Only an astral quest to the native plane with Quest Rating equal to spirit Force can recall a disrupted spirit early.
    banished_spirit: Cannot be brought back.
    source_cross_reference: The early-return paragraph prints a placeholder page XX for Astral Quest; actual quest rules are on pp92-95.
  mapping_note: Physical PDF98 is full-page artwork without mechanical text.
