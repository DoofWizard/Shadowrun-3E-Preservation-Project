id: rule.magic.mits-spell-design-area-effect
record_type: rule
status: ingested
source: source.mits
printed_pages: '51'
pdf_pages: '52'
edition_scope: SR3
content_class: [rule_exact]
data:
  default: Single target.
  area_effect:
    ordinary_targets: All valid visible targets within the area; caster cannot selectively exclude valid targets including self.
    center: Any point within line of sight.
    radius_meters: Caster Magic Attribute.
    extended_radius_meters: Magic times 10.
    reduction: Withhold dice per SR3 p181.
    health: No area-effect health spells; must target a specific organic system.
    sustained_illusion_or_manipulation:
      movement_action: Complex Action
      constraint: Area remains within line of sight.
      leaving: Effect ends for characters leaving the area.
      entering: Make appropriate Spell Resistance Test.
    detection_new_sense:
      interpretation: Radius represents range of the new sense.
      usual_radius_meters: Magic times Force.
      extended_radius_meters: Magic times Force times 10.
    elemental_manipulation: Affects all targets within area, not limited by line of sight to each target; see SR3 p182.
framing: reference_exact
headline: 'Fictional Shadowrun Third Edition spell design area effects, FASA7907, printed 51/PDF 52'
summary: 'FASA Corporation, Magic in the Shadows: tabletop RPG area radii, exclusions, moving sustained areas and detection or elemental exceptions.'
