headline: "Fictional Shadowrun tabletop RPG: Shadows of Asia (FanPro, FanPro25007, SR3), printed/PDF p211 — Manchurian magic and optional Ta'ren spirit mechanics"
framing: reference_exact
data:
  publication: {title: Shadows of Asia, publisher: FanPro, edition: SR3, catalog: FanPro25007}
  astral_aspect:
    penalized_conjuring: [Spirits of Man, ancestor spirits]
    native_practitioners: Wujen and other native magicians may attune to the local astral space to avoid the penalty.
    edge: GM may require an Edge for the attunement, typically 1 point.
  taren:
    native_region: Manchuria
    optional_rule: GM determines whether the fictional rumors of temporary possession and use of a metahuman host as conduit for physical powers are true; only then do these rules apply.
    inhabitation: Similar to shedim Inhabitation (Year of the Comet p151), restricted to living metahumans.
    inhabited_host:
      perception: Sense Link (Magic in the Shadows p109) shares host perceptions.
      communication: Telepathic Link (Magic in the Shadows p109); most spirits avoid communication unless necessary.
    threatened_spirit:
      trigger: A threatened spirit may attempt to control its host to combat the threat.
      test: Opposed Test of spirit Force against host Willpower.
      success: Spirit controls host and replaces host Mental Attributes with its Force.
    sorcery_skill: equal to Force
    spellcasting: Normal spellcasting; GM selects known spells.
    additional_powers: More powerful spirits may possess other spirit and free spirit powers.
