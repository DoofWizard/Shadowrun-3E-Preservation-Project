id: rule.magic.sota64-adept-powers-p64-68
record_type: rule
status: source_reviewed
source: source.fanpro-25004
printed_pages: '64-68'
pdf_pages: '65-69'
edition_scope: Shadowrun Third Edition, FanPro25004, State of the Art 2064 (2004; corrected PDF December 2005)
content_class: [rule_exact]
data:
  publication: {title: 'State of the Art: 2064', publisher: FanPro, catalog_number: FanPro25004, edition: Shadowrun Third Edition, chapter: The Path of the Adept, section: New Powers, printed_pages: '64-68', physical_pdf_pages: '65-69'}
  eligibility: Available to adept characters at creation or through normal advancement at GM discretion.
  powers:
    aid_spell:
      printed_page: 64
      cost_per_level: 0.5
      action: exclusive Complex Action
      requirement: Physical contact with magician casting in same Initiative Phase; adept concentrates as mana conduit.
      bonus_dice_per_level: 1
      drain: {power: spell Force / 2, level: M, type: Stun, mana_spell_resistance: Willpower, physical_spell_resistance: Body}
    animal_empathy:
      printed_page: 64
      cost_per_level: 0.25
      bonus_dice_per_level: 1
      scope: Skill tests for nonthreatening animal handling or attempts to threaten or frighten animals.
    commanding_voice:
      printed_pages: '64-65'
      cost: 0.5
      action: Complex Action
      order_max_words: 3
      opposed_test: Adept Charisma against target Willpower.
      additional_targets_tn_modifier_each: 1
      success: Target uses next available Free or Simple Action either to comply or hesitate, GM choice; no continuing compulsion afterward.
      eligibility: Metahuman able to directly hear and understand; no technological transmission or amplification.
      repeat_tn_modifier: Cumulative +2 each additional attempt against same target within 24 hours.
    cool_resolve:
      printed_page: 65
      cost_per_level: 0.5
      resistance_bonus_dice_per_level: 1
      scope: Resist Charisma-linked social skills; works against other adept powers but not spells or critter powers.
    deep_rooting:
      printed_page: 65
      cost: 0.5
      effect: All effects of one Rooting level (MITS p151), plus halve recoil penalties rounding down.
      front_firing_arc_degrees: 90
      max_turn_per_action_degrees: 90
      disengage: Complex Action
      rooting_prerequisite: false
    eidetic_sense_memory:
      printed_page: 65
      cost: 0.5
      effect: Photographic visual memory and exceptional recall and identification of sounds, smells, textures and tastes; accelerated reading by photo-reading, no fixed rate stated.
    elemental_strike:
      printed_page: 65
      cost: 0.5
      prerequisite: Killing Hands.
      effect: Secondary elemental effect (MITS p51) on Killing Hands attack; choose element when purchasing; visible effect around hands or feet when active.
      activation: Simple Action
      duration_combat_turns: Magic
      early_end: Free Action
      incompatible: [Distance Strike, Delay Damage]
    empathic_healing:
      printed_page: 65
      cost: 1
      test: Magic Test, TN 10 minus target Essence (round down, as printed).
      effect: Transfer target Physical damage to adept, maximum boxes equal to successes.
      base_time: By wound level transferred, SR3 Permanent Spell Base Time table p128.
      extra_successes: May reduce base time.
      requirement: Maintain physical contact throughout; only Physical damage is transferable.
    empathic_reading:
      printed_page: 65
      cost_per_level: 0.25
      effect: Intelligence Test against target's Negotiation Open Test to detect lies; reduce Open Test result for adept by 1 per level.
    enhanced_balance:
      printed_page: 65
      cost_by_level: {level_1: 0.5, level_2: 1}
      tn_modifier_per_level: -1
      scope: Physical Skill Tests involving balance and Knockdown Tests.
    enthralling_performance:
      printed_page: 65
      cost: 0.5
      prerequisite: Artistic performance Knowledge Skill; purchase separately for each skill.
      test: Open Test using selected performance skill; audience members failing to beat it with Willpower Test become entranced.
      perception_distraction_modifier: 4
      ordinary_distraction_modifier_for_comparison: 2
      automatic_break: Stressful act affecting entranced audience member or obtrusive environmental distraction.
      maximum_duration_minutes: Charisma * 10
    facial_sculpt:
      printed_page: 66
      cost: 1
      concentration_minutes: 10 - Willpower
      duration_hours: Magic
      recognition_test: Open Magic Test sets observer Perception TN for recognizing adept.
      effect: Alter facial features and apparent facial metatype; body mass may make result incongruous.
      orzet: Can create facial structure required to speak Or'zet without penalty (p167).
      specific_person_disguise_tn_modifier: -2
      disguise_reference: SOTA2063 p104.
    gliding:
      printed_page: 66
      cost: 1
      max_distance_meters: Magic
      effect: Run across tangible surfaces that normally cannot support adept; farther movement requires break points or landings and repeated use.
      acrobatics: Difficult maneuver requiring Athletics Test at GM-set TN.
      secondary_effects: Motion still produces sound and vibration; may combine with Traceless Walk to eliminate secondary effects.
    improved_ability_expanded:
      printed_page: 66
      relationship: Extends Improved Ability (SR3 p169) to additional skill categories.
      cost_per_die_table:
        artistic_performance_knowledge_skills: 0.25
        build_repair_skills: 0.5
        social_skills: 0.5
        vehicle_skills: 0.5
    inertia_strike:
      printed_page: 66
      cost: 0.5
      scope: Melee or unarmed attack.
      attack_base_damage_level_modifier: -1
      knockdown: Opponent tests even if no damage, as if Damage Level one higher than base.
      automatic_knockdown: Serious or worse wound.
    iron_gut:
      printed_page: 66
      cost_per_level: 0.25
      ingested_toxin_power_reduction_per_level: 2
    iron_lungs:
      printed_page: 66
      cost_per_level: 0.25
      breath_holding_bonus_seconds_per_level: 45
      breath_holding_reference: Shadowrun Companion p47.
      fatigue_test_tn_modifier_per_level: -2
    kinesics:
      printed_page: 66
      cost_by_level: {level_1: 1, level_2: 2, level_3: 3}
      etiquette_negotiation_tn_modifier_per_level: -1
      minimum_tn: 2
      social_charisma_success_test_bonus_dice_per_level: 1
      lie_detection_against_adept_tn_modifier_per_level: 2
      lie_detection_scope: Includes magical and technological tests.
      communication: Two adepts with Kinesics in sight of each other may use Complex Action to convey basic messages or emotional states nonverbally.
    linguistics:
      printed_pages: '66-67'
      cost: 0.25
      exposure_hours: 10 - Magic
      test: Intelligence Test after exposure.
      tn_table:
        - {category: common, examples: [Arabic, Aztlaner Spanish, German], tn: 4}
        - {category: uncommon, examples: [Sperethiel, Swahili, Ukrainian], tn: 6}
        - {category: obscure, examples: [Latin, "Or'zet", Sami], tn: 8}
      success: Language skill Rating 1 at no Karma cost; later increases at ordinary Karma cost with half base learning time.
    living_focus:
      printed_page: 67
      cost: 1
      effect: Sustain spell cast on adept so caster no longer sustains it.
      adept_sustaining_tn_modifier: 2
      maximum_spell_force: Magic
      maximum_spells: 1
    melanin_control:
      printed_page: 67
      cost: 0.25
      duration_hours: Magic
      action: Complex Action per one grade shift of either hair or skin, within natural metatype skin tone limits.
      skin_grades: [albino, tan, brown, black]
      hair_grades: [white/gray, blonde, red/brown, black]
      example_albino_to_black_actions: 3
    motion_sense:
      printed_page: 67
      cost: 0.5
      range_meters: Magic
      effect: Detect moving objects, people or animals even when conventional senses do not detect them.
      test: Perception Test using size-table TN or target Open Stealth Test result when stealthing, modified by Background Count.
      successes_required: 1
      size_tn_table:
        smaller_than_average_cat: 8
        smaller_than_average_mid_sized_metahuman: 6
        average_mid_sized_metahuman: 4
        larger_than_average_mid_sized_metahuman: 2
      detected_target_visibility_modifier_reduction: 2
      example_invisible_target_modifier: {normal: 8, detected: 6}
      exception: Cannot detect motion beyond astral barrier.
    multi_tasking:
      printed_page: 67
      cost: 0.5
      effect: Attend fully to simultaneous sensory inputs and two independent actions or thoughts.
      free_actions_per_initiative_phase: 2
    nimble_fingers:
      printed_page: 67
      cost: 0.5
      bonus_dice: 1
      scope: Stealth or Quickness Tests involving sleight of hand.
      actions_now_free: [Insert Clip, Pick Up/Put Down Object, Remove Clip, Use Simple Object]
    pain_relief:
      printed_page: 67
      cost: 1
      test: Magic Test, TN 10 minus target Essence (round down, as printed).
      success: Reduce target Stun damage by one wound level; may alleviate Drain.
      base_time_minutes: 30
      time_formula: Base time divided by successes.
      requirement: Uninterrupted concentration and skin contact with other target; cannot treat self.
    penetrating_strike:
      printed_page: 67
      cost_by_level: {level_1: 0.75, level_2: 1.5, level_3: 2.25}
      impact_armor_reduction_per_level: 1
      scope: Unarmed melee damage determination only.
      compatible: Killing Hands
      incompatible: Distance Strike
    resilience:
      printed_page: 67
      cost_per_level: 0.25
      stabilization_bonus_dice_per_level: 1
      stabilization_reference: SR3 p129.
      permanent_damage_check_bonus_dice_per_level: 1
      permanent_damage_reference: SR3 p127.
      wound_effect_test_tn_modifier_per_level: -1
      wound_effect_reference: Man & Machine p126.
    side_step:
      printed_pages: '67-68'
      cost_per_level: 0.5
      combat_pool_bonus_dice_per_level: 1
      restriction: Only Dodge and Full Dodge attempts against ranged or melee attacks.
    sprint:
      printed_page: 68
      cost_per_level: 0.25
      effective_quickness_bonus_per_level: 1
      scope: Running distance only.
    sustenance:
      printed_page: 68
      cost: 0.25
      daily_sleep_hours: 3
      daily_meals: 1
      normal_comparison: Equivalent energy and health to eight hours sleep and three meals; one restroom trip per day.
    three_dimensional_memory:
      printed_page: 68
      cost: 0.5
      capture_action: Complex Action on firsthand observed area.
      recall: Perception Test to mentally explore captured area; no changes to scene and only actually observed or sensed details are available.
      max_area_as_printed: Magic attribute in square meters (source parenthesis incomplete; no exponent added).
      max_areas: Magic
      elapsed_time_tn_modifier_table:
        - {time: Less than 24 hours, modifier: 0}
        - {time: Less than a week, modifier: 1}
        - {time: Less than a month, modifier: 2}
        - {time: Less than a year, modifier: 3}
        - {time: A year or more, modifier: 4}
    voice_control:
      printed_page: 68
      cost: 0.5
      effect: Alter pitch, modulation, tone and volume, mask or imitate voices and sounds within normal metahuman vocal range; excludes infrasound and ultrasound.
      impersonation_test: Opposed Test of adept Intelligence against voice recognition system rating or other character Intelligence.
      thrown_voice_range_meters: Magic
    wall_running:
      printed_page: 68
      cost: 1
      max_distance_meters: Magic
      effect: Move on sheer wall or vertical surface; farther distance requires break points or landings and repeated use.
      acrobatics: Difficult maneuver requiring Athletics Test at GM-set TN.
      secondary_effects: Sound or tracks still occur; may combine with Traceless Walk to eliminate them.
framing: reference_exact
headline: "Fictional Shadowrun Third Edition: New Adept Powers (FanPro25004)"
