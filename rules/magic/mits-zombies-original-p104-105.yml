id: rule.magic.mits-zombies-original
record_type: rule
status: reviewed
source: source.mits
printed_pages: '104-105'
pdf_pages: '105-106'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7907 Magic in the Shadows (SR3) - Zombie and grande zombie rules; individual loss-of-control tests
summary: FASA Corporation's fictional Shadowrun SR3 tabletop supplement Magic in the Shadows (FASA7907), printed 104-105, PDF 105-106.
data:
  preparation:
    eligible: Houngan.
    facility: Hounfour rating at least desired Force.
    enchanting_target_number: Desired Force.
    base_days: 10
    success_duration: Base days divided by successes.
    zero_successes: Lose 10 days and repeat the test.
    all_ones: Body cannot be used as a zombie.
  animation:
    conjuring_target_number: Desired Force.
    hours: Desired Force.
    lifespan_months_per_success: 1
    expiration: Animating spirit departs and the fictional body rapidly decomposes.
    drain: Normal spirit summoning Drain (SR3 p187).
    loss_of_control_trigger: Houngan becomes unconscious or dies, including from summoning Drain.
    loss_of_control_test_dice: Zombie Force
    loss_of_control_target_number: 6
    loss_of_control_test_scope: Test separately for every zombie currently controlled by that houngan.
    failure: Zombie attacks nearby living beings without direction for 2D6 Combat Turns, then collapses and disintegrates.
    success: Spirit becomes free and remains bound to its host body.
  characteristics:
    dual_natured: true
    pain_immunity: true
    body: floor(C_body / 2) + Force
    quickness: floor(C_quickness / 2)
    strength: floor(C_strength / 2) + Force
    charisma: Force
    willpower: Force
    intelligence: Force
    C_definition: Original character Attribute or racial average of the fictional body.
    essence_notation_as_printed: FZ
    reaction: (Quickness + Intelligence) / 2, calculated normally.
    initiative: Reaction + 1D6
    attack: Strength(M)
    combat_pool: Calculate normally.
    skills: None.
    intelligence_use: Limited to situations such as Perception Tests.
    karma: None.
    cyberware: Only cyberware affecting physical Attributes remains functional.
  commands:
    authorized_commanders: Summoner or anyone designated by the summoner.
    continuing_order: Does not require remaining in creator's line of sight.
    new_order: Requires creator's line of sight.
    control_limit: 2 * Charisma
    replacement: At the limit, creator may allow an existing zombie to become inanimate before animating another.
  grande_zombies:
    form: Free spirit permanently bound to the body occupied when it became free.
    inherited_abilities: Normal zombie abilities.
    effective_force: Force increased by Spirit Energy as for other free spirits.
    additional_powers: 1D3 free spirit powers, typically aura masking, hidden life and sorcery.
    unavailable_powers: [animal form, human form, possession]
    force_loss_per_month: 1
    replenishment: In the fictional game, monthly consumption of human or metahuman flesh restores the body; resolve using Essence Drain (Critters p10), as for wendigos.
    essence_loss_reference: Critters p15.
