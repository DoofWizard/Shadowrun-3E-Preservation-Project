printed_pages: '39-40'
pdf_pages: '40-41'
edition_scope: SR3
content_class: [rule_exact]
data:
  canonical_context: subsystem.magic.enchanting
  skill: {linked_attribute: Willpower, type: Active Magical Skill, eligibility: Awakened only, specializations: [Alchemy, Artificing]}
  knowledge_skill: Talismongering is the Enchanting Background Skill; Awakened and mundane characters can analyze and manufacture magical materials and fetishes with it.
  drain: none
  workflow: [collect raw materials, refine with Talismongering, make fetishes or ritual materials or refine into radicals with Alchemy, use Artificing for foci]
  tools:
    kit: {cost_nuyen: 10000, portability: large backpack or suitcase, uses: [talismongering, gathering, refining herbal or mineral material subject to p41 mineral restrictions]}
    shop: {cost_nuyen: 100000, rental_nuyen_per_day: 100, rental_excludes_materials: true, portability: midsize van, operating_area_square_meters_approx: 50, uses: [artificing, alchemy, analysis, metal refining, any kit task], fuel: necessary for furnace or forge work}
    facility: No enchanting facility equivalent; an appropriate non-enchanting facility may be needed to manufacture the intended object itself.
  additional_alchemy_artificing_requirements: Shaman requires a lodge and mage requires an Enchanting library; rating at least the operation rating. Gear alone suffices for gathering and Talismongering.
  source_correction: The specializations are Alchemy and Artificing, not Talismongering; Talismongering is a separate Knowledge Skill.
  related_price_table: MitS p169 lists equipment and service prices.
framing: reference_exact
headline: 'Fictional Shadowrun Third Edition: Enchanting and gear, FASA7907, printed 39-40/PDF 40-41'
summary: 'FASA Corporation, Magic in the Shadows; original-source tabletop game mechanics.'
