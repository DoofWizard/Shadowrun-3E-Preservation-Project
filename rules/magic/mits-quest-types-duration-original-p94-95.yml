id: rule.magic.mits-quest-types-duration-original
record_type: rule
status: reviewed
source: source.mits
printed_pages: '94-95'
pdf_pages: '95-96'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7907 Magic in the Shadows (SR3) - Astral quest purposes and duration
summary: Source-reviewed fictional tabletop rules from FASA7907, FASA Corporation, Magic in the Shadows, SR3, printed pp94-95/PDF95-96.
data:
  quest_types:
    astral_concealment:
      eligibility: Character carries an astrally traceable item such as a focus, ritual material link or thesis.
      plane: Chosen by questor.
      rating: Chosen by questor.
      result: Conceals the item's astral link at Citadel; tracking via that link requires a quest of the same rating to the same plane; identify plane using the masked-aura penetration test.
    initiation:
      result: Can satisfy an initiation ordeal; physical body remains in deep trance.
      duration_days: Quest Rating
      cross_reference: MitS p58, initiation ordeals.
    learn_formula:
      rating: Chosen by magician.
      result: Add dice equal to Quest Rating to formula-design Skill Test for spell, ally, focus or other formula.
      shaman_plane: Totem's native plane.
      mage_plane: Element appropriate to formula, spell purpose or ally native plane; GM chooses an element at random if no appropriate one.
      example: Conjuring 5 plus successful Rating 3 quest yields 8 formula-design dice.
    learn_metamagic:
      eligibility: Initiate.
      rating: Number of metamagical techniques currently known; minimum target number 2.
      shaman_plane: Totem home metaplane.
      mage_plane: Random hermetic metaplane.
      duration_days: Quest Rating
      result: Learn a metamagical technique.
    learn_spell:
      rating: Chosen by magician.
      plane: Same selection as Learn Formula.
      karma_cost_reduction: Quest Rating
      additional_learning_test_dice: Quest Rating
      cross_reference: SR3 p180.
    retrieve_disrupted_spirit:
      eligibility: Summoner's spirit disrupted; also applies to returning an ally to inhabit a new body.
      plane: Spirit's native metaplane.
      rating: Spirit Force
      result: Spirit returned to physical world.
    spirit_battle:
      eligibility: Free spirits, nature spirits, elementals, allies or any other spirits with native planes, including hidden life.
      plane: Spirit's native plane, which must first be determined (MitS p114).
      result: At Citadel the spirit appears for astral combat; defeat can permanently destroy it.
    true_aura:
      target: Initiate using masking.
      prerequisite: Questor must be assensing the masked aura and know it is masked before projecting.
      rating: Target initiate grade
      result: Accurate reading of masked aura.
      physical_duration: 0
    true_name:
      target: Free spirit.
      rating: Spirit Force plus Spirit Energy
      result: Learn true name; also permits reading a free spirit's masked aura.
  duration:
    general: Roll Quest Rating dice (D6); sum in physical hours, except Initiation and True Aura. Learn Metamagic has a specific days rule above.
    ambiguity: General duration text explicitly names only Initiation and True Aura as exceptions although Learn Metamagic specifies days; retain both statements.
    subjective_time: GM determines apparent elapsed time on metaplanes.
    essence_loss_during_quest: 0
