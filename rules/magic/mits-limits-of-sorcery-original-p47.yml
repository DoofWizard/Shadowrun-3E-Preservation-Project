edition_scope: SR3
content_class: [rule_exact]
data:
  scope: These limits are the design assumptions for spells published for the fictional Shadowrun game; the GM and players may change them, but doing so can disrupt game balance.
  magical_link:
    requirement: Sorcery cannot affect a target without a magical connection.
    spellcasting: The target's visible image supplies the connection through line of sight.
    ritual_sorcery: A representation that is an integral part of the target's substance can supply the connection.
  space_and_time:
    prohibited: Direct alteration of distance or passage of time, including teleportation and time travel.
    allowed: Alter the rate of a process such as healing or a chemical reaction, or enable rapid movement; neither directly changes space or time.
  precognition:
    certainty: Sorcery cannot reliably predict the future; long-range reliable precognition is unavailable.
    allowed: Short-range clues about possible events only; reliability declines as the attempted prediction extends further into the future.
  spirits:
    prohibited: Summoning or banishing spirits is the domain of Conjuring rather than Sorcery.
    allowed: Spells can damage spirits and create barriers to block or contain them.
  autonomous_effects: Mana responds to manipulation by Magical Skills such as Sorcery; magical effects cannot make independent decisions.
framing: reference_exact
headline: 'Fictional Shadowrun Third Edition limits of sorcery, FASA7907, printed p47/PDF48'
summary: 'FASA Corporation, Magic in the Shadows: spell-design boundary conditions and permitted exceptions for tabletop play.'
