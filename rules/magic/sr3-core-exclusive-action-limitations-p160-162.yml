headline: 'Fictional Shadowrun Third Edition core (FASA Corporation FASA7001): exclusive
  magic actions, printed pp160 and 162 / physical PDF161 and 163'
summary: Original FASA7001 exclusive-action concentration rule and its named Sorcery,
  Conjuring and astral-projection actions. The source continuation skips an intervening
  full-page in-world essay; exact noncontiguous printed/PDF provenance is retained.
data:
  publication:
    title: Shadowrun, Third Edition
    publisher: FASA Corporation
    edition: original Shadowrun Third Edition
    catalog: FASA7001
    source_id: source.sr3-core
