    - 163
    source_headings:
    - EXCLUSIVE ACTIONS
    - EXCLUSIVE ACTIONS TABLE
  exclusive_rule:
    requires: The magician cannot perform an exclusive magical action while using
      another magical skill or maintaining another magical ability.
    existing_sustained_spell: The example in the original text says the magician must
      stop sustaining a prior spell before casting an Exclusive spell.
    spell_defense: Maintaining spell defense over allies is also not possible while
      engaging in an Exclusive action.
    scope: Exclusivity is a rule on concurrent magical activities, not a replacement
      for ordinary Free/Simple/Complex Action costs.
  exclusive_actions_table:
    sorcery:
    - action: Exclusive Spellcasting
      reference_printed_page: 180
    - action: Casting a Spell from a Sustaining Focus
      reference_printed_page: 190
    conjuring:
