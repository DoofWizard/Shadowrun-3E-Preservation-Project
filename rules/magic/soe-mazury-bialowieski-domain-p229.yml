headline: FanPro25002 SR3 p229 (PDF230) — Mazury and Bialowieski fictional magical terrain
summary: Regional magical-domain guidance and background counts for fictional Polish wilderness encounters.
data:
  section: Mazury-Bialowieski Containment Area
  mazury:
    domain: toxic
    background_count: {high_local_values: [4, 5]}
    reference: Magic in the Shadows p126, toxic domains
    encounter_qualifications: The published setting includes mutated critters, ghouls, scavengers and toxic shamans; ghosts, specters and toxic spirits occur around the Olsztyn battlefield.
  bialowieski_forest:
    background_count: {minimum: 0, maximum: 3}
    encounter_qualifications: Awakened creatures and spirits occur here, including a substantial leshy population; forest spirits may alter paths to redirect intruders outside the forest or toward predators.
  scope_limit: The high Mazury counts apply in some areas, not uniformly throughout the containment area; the source does not prescribe a random roll for either range.
