id: rule.magic.mits-watcher-summoning-original
record_type: rule
status: reviewed
source: source.mits
printed_pages: '100-101'
pdf_pages: '101-102'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7907 Magic in the Shadows (SR3) - Watcher summoning and characteristics
summary: FASA Corporation, Magic in the Shadows (FASA7907), fictional SR3 tabletop rules, printed pp100-101/PDF101-102.
data:
  conjuring:
    eligibility: Any magician capable of summoning spirits using Conjuring.
    timing_and_equipment: Generally any time with no special equipment.
    test: Conjuring against watcher Force.
    hours_per_success: 1
    max_force: Round up Magic divided by 2.
    drain_code: (Force + life span in hours)L Stun
    physical_drain: false
    drain_resistance: Charisma Test (SR3 p162); initiates can use Centering.
    reduce_drain: Summoner may shorten the watcher life span.
    simultaneous_limit: Charisma
    counts_against_elemental_limit: false
    dismissal: Summoner may dissolve own watcher at will even remotely and before expiry.
    extended_life:
      time_unit: week
      payment: Karma equal to weeks, ritual material units equal to weeks, or a combination totaling weeks.
      material_unit_nuyen: 1000
      example: Five weeks costs 5 Karma, 5 units, or for example 3 units and 2 Karma.
    expiration: Watcher dissolves when its time ends regardless of duration unit.
    karma_point_maximum: 1
    source_example:
      magic: 6
      conjuring: 7
      force: 3
      test_rolls: [1, 1, 2, 3, 4, 4, 6]
      successes: 4
      life_hours: 4
      drain: 7L
      charisma: 4
      drain_rolls: [2, 2, 3, 7]
      drain_successes: 1
      suffered_stun_boxes: 1
  characteristics:
    plane: Astral only; no materialization or metaplanar travel.
    manifestation: Can perceive physical sight and sound and manifest visibly and audibly but cannot touch matter or directly affect physical plane.
    attribute_ratings: Force
    task_capability: Focused on simple assigned tasks, limited general understanding and literal instructions; unexpected obstacles often prevent completion.
    blocked_by_barrier: May remain blocked until expiry.
    banishing_and_astral_combat: Normal banishing and astral combat apply.
    control_transfer: Another magician cannot take control.
    astral_damage: (Force)L Stun
    physical_damage: false
    immune_targets: Cannot damage astral forms requiring Physical damage, including barriers and foci.
  existing_canon_reused: [entity.spirit.watcher, procedure.magic.summon-watcher, rule.spirits.watcher-characteristics]
  editorial_review: All root and nested text reviewed as fictional game mechanics, preserving limits and separate payment and Drain units.
