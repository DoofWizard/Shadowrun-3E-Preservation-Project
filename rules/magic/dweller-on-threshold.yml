resolution:
  summary: "Every astral quest begins with the Dweller on the Threshold. The Dweller confronts each traveler with personally relevant knowledge and requires a test against the Quest Rating. Failure ends the quest for that traveler; successes can add temporary Karma Pool dice usable during the quest."
