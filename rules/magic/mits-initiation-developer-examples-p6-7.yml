id: rule.magic.mits-initiation-developer-examples
record_type: rule
status: source_reviewed
source: source.mits
printed_pages: '6-7'
pdf_pages: '7-8'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7907 initiation progression examples and prior-system contrast (printed pp6-7/PDF7-8)
summary: FASA Corporation, Magic in the Shadows, Shadowrun Third Edition fictional tabletop RPG; developer examples supplement the existing initiation procedure.
data:
  rule_reference: procedure.magic.initiation
  attribution: Developer commentary by Mike Mulvihill, printed p7/PDF8.
  previous_system_description:
    initial_grade: 0
    initial_metamagical_abilities: 6
    initial_magic_increase: 0
    initial_metaplane_access: true
    initial_opportunity_to_remove_geasa: true
    subsequent_initiation_gains_magic: true
    subsequent_initiation_gains_new_metamagical_abilities: false
    status: historical_description_not_current_rule
  graduated_initiation:
    first_grade: 1
    grade_zero_exists: false
    total_metamagical_abilities: 10
    initiations_to_gain_all_if_no_geasa_taken_and_learning_each_time: 10
    metaplane_access_commentary: The developer summarizes metaplane access as a benefit of initiation without specifying eligibility here; the detailed procedure specifies full magicians for first-grade access.
  grade_four_examples:
    - tradition: bear shaman
      grade: 4
      magic_increase: 4
      learned_techniques: [anchoring, centering, reflecting, shielding]
    - tradition: mage
      grade: 4
      magic_increase: 3
      geasa_removed: 1
      signature_changes: 1
      learned_techniques: [masking, cleansing]
    - tradition: houngan
      grade: 4
      magic_increase: 2
      geasa_removed: 2
      signature_changes: 1
      learned_techniques: [possession]
  scope: Illustrative progression histories, not mandatory builds or independent eligibility rules. Detailed initiation and signature-alteration tests remain in the linked procedure.
