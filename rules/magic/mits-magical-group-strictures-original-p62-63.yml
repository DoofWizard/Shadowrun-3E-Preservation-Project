resolution:
  summary: A magical group needs a magical link to confer its group initiation discount. Strictures are rules bound to that link.
  inputs: [Magic Attribute, desired initiation grade, outstanding individual violations, group strictures]
  outputs: [Cleared violations, expulsion, loss or restoration of magical link]
