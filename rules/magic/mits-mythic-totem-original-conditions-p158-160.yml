id: rule.magic.mits-mythic-totem-original-conditions
record_type: rule
status: source_reviewed
source: source.mits
printed_pages: '158-160'
pdf_pages: '159-161'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: Mythic totem confinement, frenzy, overflow and original qualifications — FASA7907, SR3 fictional tabletop RPG
summary: FASA Corporation, Magic in the Shadows, Shadowrun Third Edition, printed pp158-160/PDF159-161; source-specific supplements to historical mythic totem options.
data:
  supplements:
    fenrir: {wounded_berserk: mandatory, reference: Bear shaman, core_printed_page: 163}
    gargoyle:
      usual_lifestyle: [High, Luxury]
      lifestyle_core_printed_page: 240
      home_access: Accessible perch, walkway or balcony near roof.
      reaction_to_being_caught_unaware: The fictional shaman retreats to plan their next move rather than acting hastily.
    griffin:
      declared_target: The fictional shaman always declares the most powerful opponent as their attack target in battle.
      target_restriction: Attacks only that target until either the shaman or opponent dies or is incapacitated.
      unsolicited_combat_help: Considered an insult; the existing offended-shaman Willpower (6) Test remains applicable.
    pegasus:
      voluntary_enclosure:
        remain_inside_willpower_test_target: 6
        initial_failure: May remain but receives +1 to all target numbers while inside.
        repeat_interval_hours: Willpower
        additional_failure: Cumulative +1 modifier to all tests.
        modifier_triggering_death_frenzy: 8
      involuntary_enclosure:
        initial_all_target_number_penalty: 1
        increase_per_interval: 1
        interval_hours: Willpower
        modifier_triggering_death_frenzy: 8
        imprisonment_extra_test: {attribute: Willpower, target_number: 6, interval_hours: Willpower, failure: death frenzy}
      death_frenzy:
        all_attributes_increase: 2
        behavior: The fictional shaman immediately tries to escape confinement and fights only opponents who attempt to stop them.
        damage_accounting: GM secretly accumulates damage during frenzy; neither damage nor penalties apply during frenzy.
        lethal_damage_condition: Accumulated damage exceeds the Physical column of the Condition Monitor and the shaman's Body Rating.
        lethal_condition_effect: Remains in frenzy for minutes equal to Willpower, then dies.
        escape_effect: Frenzy ends minutes equal to Willpower after escape; all accumulated damage takes effect then and may be fatal.
        willpower_basis: Source says Willpower without separately specifying whether the increased or usual Attribute is used.
    phoenix:
      physical_overflow_capacity: 'Body * 2'
      overflow_capacity_decrease_per_incident: 1
      decrease_trigger: Each occasion damage overflows the Physical column of the Condition Monitor; capacity may eventually reach zero.
      spirits_of_man_allowed: false
      required_performance_skill: Musical instrument, singing, dance or another performance skill.
      performance_skill_uses: May be a geas or creative skill for Centering (printed p72).
      flame_spirit_reference_printed_page: 105
    thunderbird: {fury_reference: Shark shaman, core_printed_page: 166}
    unicorn:
      free_skill: Aura Reading
      starting_skill_rating: 'starting Intelligence / 2'
      source_rounding: not specified
      normal_skill_improvement: true
      aura_reading_core_printed_page: 86
      moral_code: The fictional shaman follows a strict code protecting the wild and its creatures and opposing corruption even at personal risk.
