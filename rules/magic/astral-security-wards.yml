resolution:
  summary: "Magic in the Shadows adds ward variants and spirit-created wards to the standard SR3 ward system. Spirits can create wards using Force in place of Magic; alarm wards emphasize intrusion detection, polarized wards restrict astral visibility asymmetrically, and masking wards conceal magical activity behind the barrier."
