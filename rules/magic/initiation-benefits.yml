resolution:
  summary: "Each initiation can provide one of three principal benefits: increase Magic and learn a metamagic technique; increase Magic and alter astral signature; or shed a geas. Only one option is chosen per initiation."
  inputs:
    - "new initiation grade"
    - "chosen benefit"
  outputs:
    - "Magic/metamagic, Magic/signature alteration, or geas removal"
