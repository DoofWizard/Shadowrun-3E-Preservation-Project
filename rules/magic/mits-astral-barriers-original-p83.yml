headline: FASA7907 Magic in the Shadows (SR3) - Astral Barriers and Pressing Through
summary: Fictional tabletop RPG mechanics from FASA Corporation, printed p83/PDF84.
data:
  nature: All astral barriers are dual-natured, block astral forms and astral sight, and ordinarily require dual beings and active foci to defeat the barrier in astral combat before crossing. The physical anchor need not match the shape of the astral barrier; a corresponding invisible mana barrier exists on the physical plane.
  magical_effects:
    spell_casting_across_barrier: Add barrier Force to target number.
    dispelling_across_barrier: Add barrier Force to target number.
    normally_blocked: Ranged critter powers, spell defense, shielding and other Magical Skill uses do not work across the barrier except where specified.
    exceptions: Self-range critter powers and adept powers are unaffected on the physical plane unless specified otherwise.
    mundane_crossing: A mundane person or object can cross physically; a sustained spell or critter power on it stops functioning.
    quickened_crossing: For a nonprojecting character or an object bearing a quickened spell, oppose total Karma used for quickening against barrier Force. If the spell wins it survives crossing and the barrier creator senses its passage; a tie or barrier victory destroys the spell.
  forced_crossing:
    applicability: Physical momentum or transport forces a dual-natured being or object across; this is an expedited alternative to ordinary astral combat.
    focus_test: Roll focus Force against barrier Force as target number.
    perceiving_character_test: Roll Charisma against barrier Force as target number.
    success_threshold: Half barrier Force rounded down.
    focus_outcomes:
      at_least_threshold: Pass unharmed.
      positive_below_threshold: Deactivate focus involuntarily.
      zero: Deactivate focus; barrier can attempt to destroy enchantment, requiring one success on a barrier Force Test against twice focus Force (SR3 p176).
    perceiving_character_outcomes:
      at_least_threshold: Pass unharmed.
      positive_below_threshold: Drop astral perception or project if able; if projecting, astral form stays outside and physical body crosses.
      zero: Disrupted (SR3 p176).
    dual_being: Apply perceiving-character procedure. A being unable to project is forced across and resists Stun damage of twice barrier Force at Deadly level with Willpower. A being with Magic checks for Magic loss if it takes Deadly Stun.
    barrier_afterward: Breach does not defeat barrier; immediately subsequent astral combat uses its full Force.
    visible_effect: Physical observers can detect the mana discharge with Perception TN 10; astral manifestation is a bright flash.
    notifications: Barrier creator senses every successful or attempted forced crossing regardless of outcome; the bonded owner of a forced focus also senses the conflict.
  source_ambiguity: For Force 1 the rounded-down threshold is zero, overlapping the separately stated zero-success outcome. The source gives no explicit precedence.
