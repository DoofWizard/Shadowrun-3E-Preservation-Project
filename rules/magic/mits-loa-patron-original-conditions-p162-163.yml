headline: Loa patron original conduct and conditions — FASA7907, SR3 fictional tabletop RPG
summary: FASA Corporation, Magic in the Shadows (FASA7907), Shadowrun Third Edition fictional tabletop RPG, printed pp162-163/PDF163-164. These are game-character requirements, not claims about real religious practitioners.
data:
  supplements:
    agwe:
      conduct: The game character must try diplomatic solutions before resorting to violence.
    damballah:
      conduct: The game character follows a strict moral code and must keep their word.
    erzulie:
      lifestyle_reference_core_printed_page: 240
      usual_follower_gender: female
      gender_requirement: not stated
    ghede:
      conduct: The game character is described as unable to resist an offer of food or drink, especially rum.
    legba:
      ritual_invocation_order: first among the Loa in the game's fictional ritual practice
    obatala:
      conduct: The game character is expected to oppose evil and corruption and does not kill without a very good reason.
    shango:
      berserk_reference_core_printed_page: 163
