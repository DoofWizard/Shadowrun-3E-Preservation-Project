headline: "Fictional Shadowrun tabletop RPG: Shadows of Asia (FanPro, FanPro25007, SR3), printed/PDF pp213-214 — Ganges manaline flash-flood rules"
framing: reference_exact
data:
  publication: {title: Shadows of Asia, publisher: FanPro, edition: SR3, catalog: FanPro25007}
  normal_rating_range: [4, 6]
  flash_floods:
    frequency: Irregular; GM discretion.
    direction: west to east along manaline
    speed_km_per_hour: 1
    magic_resolution: Treat as localized mana surges for all magic use (Magic in the Shadows pp86-87).
    cause: Unconfirmed; possible link to alleged breaches in Tibetan Maya Cloud.
    surge_test:
      trigger: Direct contact with Ganges water at the time of a flash flood.
      reference: Year of the Comet p138
      additional_target_number_modifier: -5
      effect_theme: Both positive and negative SURGE effects follow a Hindu theme in the fictional setting.
      examples: [monkey features, elephant features, bird features, prehensile tails, third eyes, multiple limbs, blue or green skin, scales, horns, dwarf metatype expression]
  references: [rule.magic.mana-surges]
