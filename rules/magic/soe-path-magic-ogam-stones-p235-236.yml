headline: FanPro Shadows of Europe (FanPro25002), Shadowrun Third Edition fictional Path Magic and Ogam Stones, printed pp235-236 / PDF236-237
summary: "Original SR3 Righ eligibility and initiation guidance plus six-Karma Ogam spell-focus enchantment; historical Second Edition mechanics remain separate."
data:
  section: Path Magic
  path_abilities_reference: Magic in the Shadows pp20-21; retain existing Path of the Wheel abilities.
  righ:
    eligibility: Character must have followed all four other Paths in previous lifetimes.
    player_character_availability: GM guidance says most likely unavailable to player characters, not an unconditional ban.
  initiation: Most magical groups do not meet elven path followers' needs; they usually must join a Tir na nOg order with its obligations and loyalty oaths, or self-initiate.
  ogam_stones:
    creators: Followers of the Paths of the Wheel.
    form: Smooth stones bearing Celtic symbols, enchanted as spell foci.
    extra_enchanting_karma: 6
    cost_basis: Total additional Karma, not multiplied by Force.
    effect: Doubles the user's normal path spell bonuses, if any, for the focus's spell category.
    example: An illusion spell focus made as an ogam stone doubles the normal illusion spell bonuses of a Path of the Druid follower.
    non_path_users: May use the stone as an ordinary spell focus without its special path benefits.
  historical_comparison: The historical Second Edition Tir na nOg p142 describes distinct spell-specific and stacked power/spirit focus rules; do not import those rules into this SR3 option.
