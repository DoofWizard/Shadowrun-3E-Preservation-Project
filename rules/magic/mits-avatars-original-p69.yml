edition_scope: SR3
content_class: [rule_exact]
data:
  classification: Powerful free spirit (Free Spirits, printed p113).
  association: Each initiate group and each self-initiated character has a unique avatar serving as a patron for metaplanar and higher magical mysteries.
  appearances:
    planes: [astral, physical]
    form: Apparently chosen by the avatar.
    communication: Usually visions or dreams; may appear during metaplanar quests as assistance or obstruction.
    duration: Typically brief.
  interaction:
    magical_skills_or_attacks_against_avatar: Usually ineffective; no fixed test or rating supplied.
    danger_response: Immediate withdrawal to the metaplanes.
    reported_consequences: Accounts describe transportation to metaplanes without a means of escape or temporary loss of magical abilities; these are not automatic resolution rules.
    magical_link: Avatar watches for departures from the initiate's path or threats to the link; interference with an avatar is described as a theoretical danger to the group's or initiate's link, without a specified test.
    true_name: Some in-world observers believe avatars have true names as free spirits; no guaranteed discovery or control mechanic is specified here.
    gm_limit: Interactions should remain brief and limited; avatars are principally roleplaying devices, not exploitable player resources.
framing: reference_exact
headline: 'Fictional Shadowrun Third Edition rules: avatars (FASA7907) (printed 69/PDF 70)'
summary: 'FASA Corporation, Magic in the Shadows: avatar association, spirit classification, danger response and interaction constraints in the tabletop RPG.'
