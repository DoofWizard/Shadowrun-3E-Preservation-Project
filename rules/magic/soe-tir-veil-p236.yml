headline: FanPro Shadows of Europe (FanPro25002), Shadowrun Third Edition fictional Tir na nOg Veil, printed p236 / PDF237
summary: "Original SR3 Veil: 12-18 km offshore, 20 m above sea level, 1D6 + 3 Force Chaotic World equivalence, affected entity classes and nondispellability."
data:
  section: The Veil
  nature: Fictional perimeter phenomenon of uncertain origin, possibly magical or mixed technological and magical; the source describes unpredictable behavior since the comet.
  distance_off_shore_km: [12, 18]
  height_above_sea_m: 20
  below_sea_level: Possible, not confirmed.
  manifestation: Typically fog, sometimes invisible or presenting as a chaotic glow with visual and audio effects.
  affected_on_entry: [sentient creatures, technological sensors, technological guidance systems]
  spell_equivalence: Chaotic World
  force: 1D6 + 3
  dispellable: false
  passage: Gateways on standard ferry routes are guarded by patrol ships and spirits.
  other_gateways: Talismans, spells or metamagic opening passages, or spontaneously appearing predictable gateways, are rumors. The source states the Unseelie Court and allies have access to means of passage.
  edition_distinction: Historical Second Edition Tir na nOg p144 has additional timing, width and navigation details; SR3 p236 does not specify a per-turn Force reroll, width, or compass exception, so these are not silently carried over.
