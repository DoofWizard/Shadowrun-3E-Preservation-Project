id: rule.magic.mits-ally-release-banishing-original
record_type: rule
status: reviewed
source: source.mits
printed_pages: '108-109, 113'
pdf_pages: '109-110, 114'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7907 SR3 Ally Spirit escape, banishing and release
summary: FASA Corporation's Magic in the Shadows, fictional Shadowrun Third Edition tabletop rules, printed 108-109 and 113/PDF109-110 and 114.
data:
  escape:
    force_at_most_charisma: Attempt possible after failed ritual of change or all ten Physical Condition Monitor boxes filled.
    force_above_charisma: Attempt also possible when all ten Physical or Stun Condition Monitor boxes are filled.
    summoner_test_dice: Conjuring + Charisma
    summoner_test_tn: ally Force
    ally_test_dice: ally Force
    ally_test_tn: summoner Charisma
    ally_karma_pool_allowed: true
    escape_condition: Ally generates more successes than summoner; the attempt is optional.
    consequence: Summoner loses invested Magic Point and access to ally abilities; free ally may choose to stay or serve another character.
    former_master_services: GM roleplaying decision, not a dice test.
    example: Charisma 6 plus Conjuring 5 gives 11 dice at TN 4 against a Force 4 ally rolling 4 dice at TN 6; ally with fewer successes remains bound.
  voluntary_release_relationship:
    decision_authority: gamemaster
    basis: how the magician treated the ally
    possible_relationships: [companion, contact, enemy]
  banishing:
    summoner_bonus_dice: Charisma added to Conjuring whether ally is bound or free.
    by_summoner: Ally destroyed.
    by_creator: The character who banishes an ally they created recovers the invested Magic Point and nothing else.
    by_other: Ally disrupted, not destroyed.
    disruption_days: 28 - ally Force
    early_retrieval: Creator may undertake astral quest to native metaplane at rating equal to ally Force.
    destruction_by_other_means: invested Magic Point lost
    failed_summoner_banishment: ally goes free and Magic Point not recovered
    astral_combat: Creator may try to destroy ally in astral combat; losing or breaking off frees ally.
    free_ally_true_name: Required for banishing or defeating it in astral combat on its native metaplane.
  free_inhabiting:
    homunculus_link: Free ally remains in the homunculus focus owned by and magically linked to its summoner.
    recovery_after_host_destruction: Friendly magician must know ally's true name and have its complete trust for a ritual of change or astral quest to rescue it.
  canon_correction: rule.spirits.losing-banishing-ally omits the escape trigger at Force less than or equal to Charisma and does not specify the disruption duration.
