headline: FASA Corporation Shadowrun, Third Edition (FASA7001), original fictional
  nature-spirit power contests and spirit dice pools, printed pp188-189/PDF197-198
summary: Original tabletop nature-spirit power contest by Force difference with ties
  ineffective, distinct damaging-power combat resolution, summoner awareness, and
  spirit Karma Pool equal to summoning Conjuring successes plus one.
data:
  publication:
    title: Shadowrun, Third Edition
    publisher: FASA Corporation
    edition: Third Edition
    catalog_number: FASA7001
    source_id: source.sr3-core
    source_pdf_sha256: 7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914
    printed_pages:
