    editorial_distinctions: Fictional tabletop powers and simulated damage are reported
      in third person. The example is a published hypothetical, not an independently
      asserted event or universal damage rule.
    reuse_limit: The accepted p188 spirit-forms/combat entry expressly notes the nature-spirit
      power conflict continues on p189. The accepted p189 control/banishing entry
      covers separate magician-spirit control and does not carry these Force comparison
