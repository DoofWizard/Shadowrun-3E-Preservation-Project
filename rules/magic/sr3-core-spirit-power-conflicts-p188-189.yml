    nature: published fictional tabletop role-playing game rules
  original_source_section: Spirit Combat continuation / Nature Spirit opposed powers
    (bottom of p188 and top of p189)
  opposing_nature_spirit_powers:
    condition: When nature spirits oppose each other within a domain with non-damaging
      powers, resolve the opposing powers according to their respective Force ratings.
    source_example: Accident against Guard
    contest: Compare the Force ratings directly; the spirit with the higher Force
      wins.
    successful_power_effective_force: Difference between the Force ratings of the
      opposing spirits
    equal_force: Tied Force ratings have no effect.
    no_new_dice_test: The source specifies direct Force comparison for this power
      contest, not an additional Conjuring or opposed test.
  damaging_spirit_powers_and_weapons:
    ordinary_combat_procedures: Attacks involving damage-causing powers or weapons
      use the standard damage and combat rules, rather than the non-damaging opposing-power
      Force-only contest.
    statistics_source: The spirit's corresponding Attributes for those tests appear
      in the original Spirits and Dragons chapter.
    normal_condition_monitors: Spirits have normal Condition Monitors to track damage.
  summoner_detection:
    event: Spirit is killed or disrupted.
    result: Summoner knows immediately that the spirit was killed or disrupted.
  spirit_dice_pools:
    permitted_pool_categories:
    - Combat Pool
    - Astral Combat Pool
    - Karma Pool
    spirit_karma_pool_formula: Number of successes in the Conjuring Test that summoned
      the spirit, plus 1.
    example_illustrative_not_engine_tested:
      conjuring_test_successes: 3
      resulting_spirit_karma_pool: 4
  original_p266_karma_pool_scope_comparison:
    cross_reference_printed_page: 266
    cross_reference_pdf_page: 275
    existing_accepted_canonical: rule.spirits.sr3-core-dragon-spirit-dice-pools-p266
    p189_original: For a summoned spirit, Karma Pool equals the number of successes scored in its summoning Conjuring Test plus 1.
    p266_original: The Spirits and Dragons Dice Pools paragraph instead describes spirit and dragon Karma Pool size as gamemaster-assigned by in-game threat; for dragons it suggests a minimum of twice the player-character average.
    unresolved_scope: Both are statements of the original FASA Corporation Third Edition core. The text does not expressly say whether p266 general discretion overrides the p189 summoning-specific formula; preserve both without inventing an automatic precedence.
    engine_consumer_note: A consuming rules engine should record an explicit adjudication before choosing between these different source instructions; neither formula nor GM discretion is silently erased.
    independently_inspected_original_images: Original printed p189/PDF198 and printed p266/PDF275 in the freshly SHA256-verified FASA7001 scan; printed p188/PDF197 context also checked.
    original_pdf_sha256: 7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914
    previous_accepted_blob_preserved: 6ee4fe4c89e53e163e6140864bd36591d77b8517
