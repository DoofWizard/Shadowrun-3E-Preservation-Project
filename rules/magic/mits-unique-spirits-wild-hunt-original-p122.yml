headline: Unique Spirits — Wild Hunt statistics and limits
summary: Fictional SR3 tabletop mechanics from FASA Corporation, Magic in the Shadows (FASA7907), printed p122/PDF123.
data:
  unique_spirits:
    conjuring: Other unique entities may be beyond current conjuring methods.
    design: GM determines statistics, personality and abilities; all have Force and powers, with no restriction to ordinary combinations.
    greater_entities: Avatars, totems and related loa or idols may be treated as forces beyond ordinary game statistics, with player interaction generally in metaplanes and physical encounters rarely occurring (visions or dreams are suggested).
  wild_hunt:
    summoning: Secret metamagical technique akin to Invoking, known to a few powerful initiates; may also appear spontaneously.
    form: Materialized and dual-natured only; never purely astral.
    home_metaplane: Known only to those capable of summoning it.
    purpose: Summoners determine the particular goal; spontaneous appearances almost always respond to an injustice to nature.
    duration: At most one night, sunset to sunrise; the source attributes to rumor the claim that evading it until sunrise permits escape.
    movement: Can fly across any terrain or obstacle.
    attributes_columns: [B, Q, S, C, I, W, E, R, INIT, Attack]
    rows:
      hounds: [4, '6 (x 8)', 4, '—', '2/6', 6, 6Z, 5, '5 + 3D6', 7S]
      steeds: [9, '8 (x 8)', 9, '—', '2/6', 6, 6Z, 5, '5 + 3D6', 6D]
      hunters: [8, '7 (x 8)', 8, '—', 6, 8, 10Z, 8, '8 + 3D6', 10S]
      huntsman: [10, '8 (x 8)', 10, '—', 7, 10, 12Z, 10, '10 + 3D6', 12D]
    collective_power_rating: Huntsman Essence Rating
    collective_powers:
      - Confusion
      - Enhanced Senses (Low-Light Vision, Thermographic Vision)
      - Fear
      - Immunity (Age, Cold, Fire, Normal Weapons, Pathogens, Poisons)
      - Magical Guard (Self)
      - Magic Sense
      - Materialization
      - Search
    additional_powers:
      hounds: [Enhanced Senses (Improved Smell), Paralyzing Howl]
      steeds: [Innate Spell (Flamethrower), Noxious Breath]
      hunters: ["Enhanced Physical Attributes (Strength, once per night, for Essence turns)"]
      huntsman: [Animal Control (all normal animals), Cold Aura, Innate Spell (Lightning Bolt), Paralyzing Touch, Weather Control]
    weakness: Allergy (Sunlight, Extreme)
