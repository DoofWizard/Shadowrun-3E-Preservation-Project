summary: Astral-form exception, opposed possession test and memory-access rule for fictional Kurawa spirits.
data:
  publication: {title: Shadows of Asia, publisher: FanPro, edition: SR3, catalog: FanPro25007}
  forms:
    kurawa: Astral only.
    pandawa_lima: Can materialize.
  possession:
    analog: Possession power, Critters p13.
    unwilling_subject_allowed: true
    opposed_test: Spirit Force versus subject Willpower; spirit must win.
    memory_access: The possessing spirit gains access to the subject's memories, analogous to master shedim Inhabitation (Threats 2 p54).
