id: rule.magic.mits-insect-spirit-powers-original
record_type: rule
status: reviewed
source: source.mits
printed_pages: '132-133'
pdf_pages: '133-134'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: Insect Spirit Powers - original action profiles and special rules
summary: Fictional tabletop game rules from FASA Corporation's Magic in the Shadows (FASA7907, Shadowrun Third Edition), printed pp132-133/PDF133-134.
data:
  standard_powers: True-form insect spirits also have standard spirit powers from the SR3 basic rules.
  animal_control_insects:
    profile: {type: M, action: Complex, range: LOS, duration: Sustained}
    actor: Queen or Mother
    targets: ordinary insects of the spirit's own type
    swarm_uses: [information gathering through insect senses, mass attack]
    wasp_swarm: The book identifies mass attack by wasps as deadly.
    existing_canon: rule.spirit-power.animal-control
  aura_masking:
    profile: {type: M, action: Automatic or Simple, range: Self, duration: Always}
    resolution: Apply free spirit Aura Masking (MitS p117).
    reason: The insect spirit lacks its own Spirit Energy.
    spirit_energy_for_all_tests: Queen or Mother Spirit Energy
    before_queen_or_mother_summoned: Use the summoning insect shaman's initiation grade instead.
    existing_canon: rule.spirit-powers.aura-masking
  compulsion:
    profile: {type: P, action: Complex, range: LOS, duration: Sustained}
    fictional_effect: The Queen or Mother can impose an involuntary urge on humans who perceive her pheromones.
    scent_distance_meters: Force
    fictional_exposure_forms: [food or drink, drug, mixture with other substances]
    opposed_test: Queen or Mother Force versus target Willpower
    actions_controlled_per_net_success: 1
    timing: Control must occur immediately; future actions cannot be compelled.
    existing_canon: rule.spirit-powers.compulsion
  share_minds:
    profile: {type: M, action: Automatic, range: Special, duration: Always}
    bond: Continuous two-way telepathy between Queen or Mother and each controlled spirit.
    message_action_each_direction: Free
    remote_sight_and_hearing_action: Free
    simultaneous_perceived_subjects: 1
    subject_to_subject_communication: Relay through Queen or Mother only.
    existing_canon: rule.spirit-powers.share-minds
  skill:
    profile: {type: M, action: Complex, range: Self, duration: Always}
    existing_canon: rule.spirit-powers.insect-skill
  summoning:
    profile: {type: M, action: Exclusive Complex, range: Special, duration: Permanent}
    existing_canon: rule.spirit-powers.insect-summoning
