  source_heading: Magic / Spell Targeting / Elemental Manipulation Spells / Astral
    Spellcasting
  ordinary_spell_line_of_sight:
    transparent_obstruction: Transparent material such as glass does not normally
      prevent the caster from targeting a visible entity; the spell effect arises
      at the target location rather than traveling through the glass.
    opaque_obstruction: An opaque barrier prevents targeting an unseen person or object
      by ordinary line-of-sight spells.
    partial_obstruction: Semitransparent obstructions may impose visibility modifiers.
    area_valid_target: Ordinary area magic affects all valid targets within radius;
      being inside the area does not make an otherwise invisible/untargetable entity
      a valid target.
    ordinary_area_behind_wall: A person entirely concealed behind a wall is not affected
      by a Powerball if the caster cannot see them, even if the wall itself is affected.
  elemental_manipulation:
    medium: The spell produces a physical energy or matter effect (such as fictional
      fire, acid or lightning), directed at a target like a ranged attack.
    physical_barriers: Physical obstacles may impede an elemental effect; the source
      refers to Firing through Barriers (printed p124).
    magical_obstacles: Spell Defense and astral barriers may also block its magical
      control.
    area_explosion: Elemental area spells affect targets physically within their area
      like an explosion; a hidden target behind a wall may still be hit by an area
      elemental spell even when the caster does not see the target.
  astral_spellcasting:
    projecting_can_target: An astrally projecting caster can cast at visible astral
      forms, including other projecting or perceiving characters, spirits, dual beings
      and active foci.
    target_spell_type: Astral forms can be affected only by mana spells.
    physical_target_exception: Seeing the aura of an otherwise invisible physical
      person while projecting does not permit targeting that physical person with
      a spell from astral space if the person is not present in astral space.
    drain_while_projecting: Drain from spells cast while astrally projecting is always
      Physical, regardless of Force.
    perceiving_caster: A physically present astrally perceiving caster can target
      entities visible through either ordinary or astral perception, but is also vulnerable
      to attacks from both planes.
    plane_separation: An opaque boundary between physical and astral planes prevents
      a caster on one side from seeing across; dual-natured beings occupy both and
      may attack or be attacked on either side.
  context: Source examples describe imaginary Shadowrun magic; these are tabletop
    adjudication conditions, not claims about real paranormal abilities.
headline: Original FASA Corporation Shadowrun, Third Edition fictional FASA7001 elemental
  and astral spell targeting exceptions, printed p182/PDF191
summary: Source-reviewed visibility, transparent barrier, ordinary versus elemental
