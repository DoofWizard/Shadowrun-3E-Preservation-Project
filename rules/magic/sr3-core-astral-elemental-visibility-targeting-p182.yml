  source_heading: Magic / Spell Targeting / Elemental Manipulation Spells / Astral Spellcasting
  ordinary_spell_line_of_sight:
    transparent_obstruction: Transparent material such as glass does not normally prevent the caster from targeting
      a visible entity; the spell effect arises at the target location rather than traveling through the glass.
    opaque_obstruction: An opaque barrier prevents targeting an unseen person or object by ordinary line-of-sight
      spells.
    partial_obstruction: Semitransparent obstructions may impose visibility modifiers.
    area_valid_target: Ordinary area magic affects all valid targets within radius; being inside the area does not
      make an otherwise invisible/untargetable entity a valid target.
    ordinary_area_behind_wall: A person entirely concealed behind a wall is not affected by a Powerball if the caster
      cannot see them, even if the wall itself is affected.
  elemental_manipulation:
    medium: The spell produces a physical energy or matter effect (such as fictional fire, acid or lightning), directed
      at a target like a ranged attack.
    physical_barriers: Physical obstacles may impede an elemental effect; the source refers to Firing through Barriers
      (printed p124).
    magical_obstacles: Spell Defense and astral barriers may also block its magical control.
    area_explosion: Elemental area spells affect targets physically within their area like an explosion; a hidden
      target behind a wall may still be hit by an area elemental spell even when the caster does not see the target.
  astral_spellcasting:
    projecting_can_target: An astrally projecting caster can cast at visible astral forms, including other projecting
      or perceiving characters, spirits, dual beings and active foci.
    target_spell_type: Astral forms can be affected only by mana spells.
    physical_target_exception: Seeing the aura of an otherwise invisible physical person while projecting does not
      permit targeting that physical person with a spell from astral space if the person is not present in astral
      space.
    drain_while_projecting: Drain from spells cast while astrally projecting is always Physical, regardless of Force.
    perceiving_caster: A physically present astrally perceiving caster can target entities visible through either
      ordinary or astral perception, but is also vulnerable to attacks from both planes.
    plane_separation: The original source describes the division between physical and astral planes as one-way glass,
      not mutually opaque. A caster only on the physical side cannot see into the astral plane. A projecting caster
      on the astral side can see the physical scene, but spells cast from astral space are stopped at the plane
      boundary and cannot affect physical-only targets. A dual-natured perceiver exists on both sides and can see
      and attack eligible beings on either plane, and may be attacked from both.
    one_way_plane_barrier:
      original_analogy: An unbreakable pane of one-way glass separates the physical and astral planes in this fictional
        game.
      physical_only_observer: The physical-side face is opaque; a physical-only spellcaster cannot see through it
        into astral space or cast across it.
      astrally_projecting_observer: The astral-side face is transparent toward the physical world; an astrally projecting
        magician can see objects or people on the other side but their spells cannot pass through the plane boundary
        to physical-only targets.
      dual_being_or_astrally_perceiving_caster: Occupies both planes simultaneously, sees beings on either side
        and may attack eligible targets on both planes, but can likewise be targeted from either.
      limitation: Visibility across the one-way boundary does not make a physical-only target astrally present;
        normal astral mana-spell and targeting restrictions remain in force.
  context: Source examples describe imaginary Shadowrun magic; these are tabletop adjudication conditions, not claims
    about real paranormal abilities.
  review_2026_11_18:
    publication: FASA Corporation, Shadowrun, Third Edition, FASA7001; published fictional tabletop role-playing
      game, original printed p182/physical PDF191.
    original_pdf_sha256: 7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914
    old_blob_preserved: 5faad3a1a7a510a16ed3b4e36d8315d4361830c2
    original_page_image: Direct visual review of original 345-physical-page source PDF191, lower left and top right
      Astral Spellcasting paragraphs. The printed one-way glass analogy identifies explicitly asymmetric visibility
      and symmetric risk for dual beings.
    specific_correction: Accepted plane_separation phrasing overstated mutual opacity and failed to preserve the
      astral-projecting caster seeing the physical side while unable to target through the boundary. Replace that
      phrase with the complete source-stated asymmetry and explicit dual-plane condition.
    preserved_assertions: All prior accepted physical/astral targeting, elemental area effects, Force and spell-Drain
      conditions outside plane_separation remain unchanged in substance. No edition conversion, extraneous power
      or new numeric rule was introduced.
