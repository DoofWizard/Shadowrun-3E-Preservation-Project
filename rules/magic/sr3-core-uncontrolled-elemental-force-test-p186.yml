content_class:
- rule_procedure
headline: FASA Corporation Shadowrun, Third Edition FASA7001 original fictional uncontrolled-elemental
  Force(6) test, printed p186/PDF195
summary: 'Original conjuring consequences when summoning Drain kills or incapacitates
  a hermetic mage: uncontrolled elemental Force dice versus TN6, flee on success versus
  attack on no success; nature spirit departure distinguished.'
data:
  publication:
    title: Shadowrun, Third Edition
    publisher: FASA Corporation
    edition: Third Edition
    catalog_number: FASA7001
    source_id: source.sr3-core
    source_pdf_sha256: 7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914
    printed_page: 186
    physical_pdf_page: 195
    nature: original fictional tabletop game
  source_section: Conjuring / Summoning Elementals / Uncontrolled response after summoner
    incapacitation
  trigger:
    condition: Summoner dies or is knocked unconscious from Drain while summoning
      an elemental
    result: The fictional elemental becomes uncontrolled; resolve its immediate response
      with its own Force (6) Test.
  response_test:
    dice: Elemental Force rating
    target_number: 6
    required_successes_to_flee: 1
    one_or_more_successes: The uncontrolled elemental recognizes its opportunity and
      flees immediately, disappearing from both physical and astral planes.
    zero_successes: The uncontrolled elemental attacks its former master, regardless
      of defenses.
    former_master_already_dead: If the summoner is already dead, the uncontrolled
      elemental attacks the nearest living beings instead.
    termination: It continues its rampage until killed, banished or controlled by
      another mage.
  distinct_nature_spirit_case: A nature spirit summoned by a shaman departs if Drain
    kills or knocks its shaman summoner unconscious; it does not use the elemental
    Force (6) escape-versus-attack procedure.
  existing_canon_reused:
  - rule.magic.sr3-core-conjuring-summon-nature-elemental-exact-p186
  - rule.magic.sr3-core-spirit-control-banishing-exact-p189
  - rule.magic.spirit-services
  - rule.magic.controlling-spirits
  source_review:
    original_verified_image: Original printed p186/PDF195 independently inspected
      after matching fresh original source PDF SHA256. These outcomes are fictional
      tabletop scenario mechanics, not real-world attack advice.
    text_field_paths_reviewed:
    - edition_scope
    - headline
    - summary
    - data.publication.*
    - data.source_section
    - data.trigger.*
    - data.response_test.*
    - data.distinct_nature_spirit_case
    - data.existing_canon_reused[*]
    - data.source_review.*
    source_distinctions: The trigger is death or loss of consciousness from summoning
      Drain; avoid conflating nature spirit departure with elemental uncontrolled
      behavior. Preserve success versus failure, original master agency, and whether
      the master is already deceased.
    reuse_limit: The accepted p186 summoning entry states only that elemental becomes
      uncontrolled. The accepted p189 control/banishing entry covers subsequent control,
      not the immediate p186 Force(6) roll and its branch effects.
    certification_limit: Does not imply the full Conjuring chapter is complete or
      engine implementation tested.
