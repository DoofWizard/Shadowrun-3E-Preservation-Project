data:
  publication: {title: 'State of the Art: 2064', publisher: FanPro, catalog_number: FanPro25004, edition: Shadowrun Third Edition, chapter: Old World Magic, section: 'Neo-Pagan Magic and Wicca', printed_pages: '122-124', physical_pdf_pages: '123-125'}
  dependency: [SR3 core, Magic in the Shadows]
  tradition:
    default: Idol followers and shamans per MITS p16.
    exception: Hermetic-oriented practitioners use standard hermetic rules.
    idol_choice: A game idol represents an aspect of a deity; different devotees of the same deity can have different game modifiers. Different deities may share one idol.
    pantheistic: Use pantheistic shaman rules (MITS p16); relate lunar-cycle modifiers to the deity dominant in that period.
  suggested_idols:
    Wiccan:
      - [God/Horned Man/Pan/Manon, [Horned Man, Wild Huntsman]]
      - [Goddess/Diana/The Mother, [Great Mother, Moon Maiden]]
    Celtic:
      - [Herne/Cernunnos, [Horned Man, Wild Huntsman, Dragonslayer]]
      - [Lugos/Lugh/Lleu, [Sky King, Wise Warrior, Dragonslayer]]
      - [Nodens/Nuada/Nudd, [Dark King]]
      - [Belenos/Balor/Beli, [Sky Father, Wise Warrior]]
      - [Don/Danu, [primeval Great Mother, Lover, female Sea King]]
    Norse:
      - [Wotan/Odin, [Creator, Dark King, Sky Father, Wise Warrior, Wild Huntsman]]
      - [Thor, [Dragonslayer, Wise Warrior]]
      - [Freya, [Great Mother, Lover]]
      - [Loki, [Adversary, Trickster, Coyote (description only)]]
      - [Hel/Hela, [female Dark King]]
      - [Heimdall, [Wise Warrior]]
      - [Njord, [Sea King, male Great Mother]]
      - [Fenrir, [Fenrir (toxic idol)]]
    Roman_Hellenic:
      - [Jupiter/Zeus, [Sky Father, Wise Warrior, Bacchus]]
      - [Juno/Hera, [Great Mother, Siren]]
      - [Neptune/Poseidon, [Sea King]]
      - [Pluto/Hades, [Dark King]]
      - [Minerva/Athena, [female Sky Father, Wise Warrior]]
      - [Apollo, [Sky Father, Wild Huntsman (without nature focus)]]
      - [Venus/Aphrodite, [Lover, Seductress, Siren]]
      - [Diana/Artemis, [Moon Maiden, female Wild Huntsman]]
      - [Ceres/Demeter, [Great Mother]]
      - [Bacchus/Dionysis, [Bacchus]]
      - [Vulcan/Hephaestus, [Firebringer, Creator]]
      - [Prometheus, [Firebringer]]
      - [Pan, [Horned Man]]
      - [Vesta/Hestia, [Firebringer]]
      - [Mars/Ares, [Wise Warrior]]
      - [Cronus/Saturn, [Adversary]]
      - [Hercules/Heracles, [Dragonslayer]]
  festivals:
    optional: true
    background_count_minimum: 2
    initiation_karma_cost_modifier: -1
    prerequisites: GM approval; initiate actively takes part in ritual; magical tradition considers the date significant; background count may arise from festival or mana fluctuation.
    dates: [Midsummer solstice, Midwinter solstice, spring equinox, autumn equinox]
  urban_witches:
    optional: true
    spirit_substitution: Urban shamans summon ancestor spirits instead of spirits of the sky, alongside spirits of man.
    otherwise: Standard urban shaman and totem rules.
    references: [MITS p16, MITS p106]
  wicca:
    options: Hermetic mages or shamans even within one coven; Goddess cults often favor Great Mother or Moon Maiden; some Celtic Wiccans use nature, animal or mythical totems.
    ritual_sites: Function as ordinary shamanic lodges during rituals; normally inert outside rituals unless power site or particular background count. Permanent hermetic circles, when present, must be created separately under normal rules.
    book_of_shadows:
      hermetic_library_max_rating: 6
      material_link: All group members.
      manifestation_focus: Group avatar.
    rumored_secret_metamagic: Not established player techniques; existence and abilities are GM-defined, restricted to a few high-level initiates if used; hypothetical entities comparable in power to totems or avatars.
    references: [MITS p26]
framing: reference_exact
headline: 'Old World Magic — Neo-Pagan Magic and Wicca'
summary: 'Source-specific SR3 fictional tabletop mechanics from printed pages 122-124; no whole-source completion claim.'
