    text_observed: 'At original p196/PDF205 the secondary effects paragraph says +2 for base Serious and +4 for base Moderate. The printed page does not say +4 for Deadly; Light has no secondary effects.'
    original_source_nuance: 'The source ordering is counterintuitive. Retain the literal original Serious/Moderate distinction without silently imposing a Deadly value or a same-edition erratum not independently verified.'
