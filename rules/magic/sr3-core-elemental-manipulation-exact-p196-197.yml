    assertion_preservation: 'All previously accepted unaffected spell stat lines, area and single-target distinctions, 2D6 secondary-effect procedure, TN signs, damage-level selection and source limitations remain unchanged; the +4 condition is restored to Moderate, with no unprinted Deadly condition.'
    reviewed_text_paths: [headline, summary, edition_scope, data.publication, data.printed_to_pdf, data.section, data.basic_mechanics, data.secondary_effect_test, data.spell_lines, data.secondary_effects, data.source_qualifications, data.code_status, data.source_review_2026_11_15]
    limit: 'The historical 2026-11-15 source-review assertion that +4 meant Deadly was erroneous; current directly examined printed page says Moderate. Prior committed blob remains in repository history; source review does not establish full chapter completeness or executable tests.'
  source_review_2026_11_16:
    actual_source: 'FASA Corporation Shadowrun, Third Edition FASA7001, original fiction tabletop RPG; printed p196, physical PDF205; cross-check original p197/PDF206.'
