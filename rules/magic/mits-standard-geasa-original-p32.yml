data:
  canonical_context: subsystem.magic.geasa
  standard_types:
    condition: Requires a specified personal state; broken outside it. Examples include astral perception, being unwounded, a particular posture or intoxication.
    domain: Restricts magic to one specified domain, such as a nature-spirit domain; broken in other domains.
    exclusive: Adepts only. A restricted power cannot operate concurrently with other magical activity, including other adept powers; while it operates, other powers cannot operate.
    fasting: In this fictional game rule, nourishment other than water breaks the geas for the subsequent 24 hours.
    gesture: Requires free visible gestures of hands and arms; broken when movement is prevented. A dancing variant requires movement of legs and body.
    incantation: Requires loud, clearly audible speech, chant or singing; broken when the character cannot vocalize as required.
    shaman: Only full shamans whose totem provides a Totem Advantage may take this; excludes aspected magicians, non-shamans, pantheists and totems without advantages. Only magic providing a Totem Advantage is allowed; other magic breaks it. Dog example permits detection spells and field or hearth spirits.
    talisman:
      object: Specific item, including a fetish or focus, with at least three specified distinct traits.
      fulfillment: Must be held or worn.
      replacement: Recover the item or obtain a closely similar replacement. A nonmagical talisman must be the same kind of item and bonded as a fetish (SR3 p180). A replacement focus must have the same type and Force and be bonded.
    time: Magic is restricted to day, night or a single season; outside the selected period the geas is broken. Shamans with time-related Totem Advantages or Disadvantages cannot select it.
