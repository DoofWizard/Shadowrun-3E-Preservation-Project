headline: FASA7907 Magic in the Shadows (SR3) - Metaplane entry and the Dweller
summary: Source-reviewed fictional tabletop rules from FASA7907, FASA Corporation, Magic in the Shadows, SR3, printed pp91-92/PDF92-93.
data:
  planes:
    ordinary_access: Initiates with astral projection may project directly; other characters need a free spirit's Astral Gateway power.
    tradition: Magicians may visit planes outside their own tradition.
    known_hermetic_planes: [earth, air, fire, water]
    known_shamanic_planes: [man, waters, sky, land]
    exception: Access to the plane of death requires an ancestor spirit as guide.
  quest:
    commitment: Entering a metaplane begins an astral quest; return to the body occurs on success or failure with astral disruption, not at will.
    destination: Choose one metaplane before projecting; no transfer to a different plane during the quest.
    no_specific_goal_rating: 1D6
    rating_visibility: A character knows a rating they control; the GM alone knows ratings such as a quest for a free spirit's true name.
    success: Reach the Citadel to obtain the objective.
    group_entry: Travelers may start in separate physical locations, but must project at the same time intending to travel together; no joining after entry or rejoining after forced return.
  dweller:
    encounter: All travelers meet the Dweller at the threshold, whose appearance may reflect the quest or questor and who reveals a secret about each group member.
    test: Each participant uses a skill or Attribute selected by the GM for the quest purpose.
    target_number: Quest Rating
    failure: Quest fails for the character.
    reward: Add one temporary Karma Pool die per two successes; usable only for this quest and removed afterward.
