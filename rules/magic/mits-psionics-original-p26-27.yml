headline: FASA7907 Magic in the Shadows (SR3) - Psionics
summary: Original fictional tabletop game mechanics, FASA Corporation, printed pp26-27/PDF27-28.
data:
  magician_type: Full magician under SR3 p160, using ordinary magician rules except for the listed belief-based restrictions.
  aspected_psionics: None are known in the publication; this is not stated as an absolute creation prohibition.
  astral_abilities:
    - Astral perception and aura reading
    - Astral projection, including travel to the metaplanes
  spell_eligibility:
    test: The spell must fit the character's model of mental powers; the gamemaster decides individual eligibility.
    compatible_examples:
      - Combat spells
      - Detection spells
      - Directed illusions
      - Control and telekinetic manipulations
    incompatible_examples:
      - Transformation manipulations
      - Health spells other than Heal
      - Most indirect illusions
    acquisition: Design the spell independently or learn it from another psionic; traditional magical teachers and spell formulas are unavailable.
  cooperation: Magical cooperation is limited to other psionics, including ritual sorcery and group initiation.
  geasa: Mystical or magical restrictions are not eligible; examples of eligible mental-focus restrictions are Condition, Fasting and Meditation.
  foci: None may be used.
  magical_defense:
    - Spell defense
    - Dispelling
    - Wards
  conjuring:
    ordinary_nature_spirits: Prohibited
    elementals: Prohibited
    ordinary_magical_spirit_banishing: Prohibited
    permitted:
      - Thought forms using Conjuring
      - Watcher spirits under MitS p100
    thought_form_exception: Thought forms may be banished by other psionics and other magicians, as stated on p27.
