headline: FASA Corporation Shadowrun, Third Edition (FASA7001) original fictional tabletop Spirit Combat rules, printed p189/PDF198 — summoning-success Karma Pool formula and immediate summoner awareness
summary: 'Original FASA7001 p189: each summoned spirit Karma Pool is summoning Conjuring successes plus one; a summoner knows immediately if their spirit is killed/disrupted. Separately preserve the source p266 GM-discretion instruction without invented precedence.'
data:
  publication:
    title: Shadowrun, Third Edition
    publisher: FASA Corporation
    edition: Third Edition
    catalog_number: FASA7001
    source_id: source.sr3-core
    medium: original published fictional cyberpunk tabletop role-playing game
    verified_original_pdf_sha256: 7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914
  original_source:
    printed_page: 189
    physical_pdf_page: 198
    section: Magic / Spirit Combat continuation, immediately before Controlling
  spirit_combat_pools:
    eligible_spirit: The original p189 Spirit Combat paragraph describes spirits as critters eligible for Combat Pool, Astral Combat Pool and Karma Pool under otherwise governing dice-pool rules.
    summon_based_karma_pool_formula: Number of successes achieved on the Conjuring Test that summoned the particular spirit, plus 1
    summon_based_karma_pool_flat_bonus: 1
    summon_based_karma_pool_input: Success count on that spirit's original successful Conjuring Test
    noninference: The p189 passage gives no independent rounding rule, repeat roll, or rule for transferring a summon result to an unrelated spirit; other pool and power restrictions remain separately governed.
  summoner_awareness:
    trigger:
    - Spirit killed
    - Spirit disrupted
    subject: Summoner of that spirit
    timing: Immediately
    consequence: The source states the summoner immediately knows that the spirit was killed or disrupted; it supplies no specific extra detection test or new action cost.
    scope: Knowledge of this spirit outcome, not omniscience about other spirit conditions or location.
  other_source_p266_crosscheck:
    printed_page: 266
    physical_pdf_page: 275
    related_accepted_canonical_id: rule.spirits.sr3-core-dragon-spirit-dice-pools-p266
    independently_inspected_original: FASA7001 original p266/PDF275 says the gamemaster determines spirit/dragon Karma Pool size by threat; for dragons suggests at least twice player-character average. It does not state the p189 summon-successes-plus-one expression.
    unresolved_source_internal_variation: Preserve the specific p189 summon-derived formula and the later p266 gamemaster-discretion wording as separate source assertions. No unprinted priority, automatic supersession or mandatory combination is inferred for game-engine behavior.
    impact: A Spirit Karma Pool consumer must account for this p189 versus p266 source-internal difference rather than silently overwrite either rule.
