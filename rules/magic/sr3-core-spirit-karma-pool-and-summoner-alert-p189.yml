  source_review_receipt:
    original_images_independently_inspected:
    - Original printed p188/physical PDF197 spirit combat and forms
    - Original printed p189/physical PDF198 left column spirit combat continuation and transition to Controlling
    - 'Original printed p266/physical PDF275 left column Dice Pools: Karma Pool'
    new_substance: The already-accepted p188 spirit combat source-specific record and p189 controlling/banishing record do not include the p189 summon-successes-plus-one Karma Pool formula or the immediate spirit death/disruption notification. The separate p266 record preserves GM discretion but omits the p189 formula.
