  source_heading: Magic / Astral Damage Codes / Astral Damage / Astral Objects / Astral
    Evasion
  astral_damage_codes:
  - attack: Unarmed Attack
    damage_code: (Charisma)M
  - attack: Armed Attack
    damage_code: (Charisma) plus Weapon Focus Damage (see p191)
  - attack: Dual Being
    damage_code: (Strength)M or by type
  - attack: Spirit, Focus or Barrier
    damage_code: (Force)M
  damage_resistance:
    astral_entity: Use Willpower (character) or Force (astral being).
    dual_natured: Use Body.
    natural_armor: A dual-natured being with natural physical armor receives its normal
      armor; reduce astral attack Power by its natural armor rating.
    worn_armor: Physical armor worn by a character does not protect against astral
      damage.
    attacker_choice: Astral damage may be Physical or Stun at attacker choice.
    adept: Adept with Killing Hands can apply full power to the astral plane.
    body_and_astral_link: Damage inflicted on astral form is also suffered by physical
      body, and vice versa; astral form killed means physical body also dies.
    healing: Healing techniques affecting physical and astral bodies apply to damage
      of either origin.
  disruption:
    deadly_stun: Astral form is disrupted and immediately leaves astral space. Projecting
      characters return to physical body regardless of separating barriers and become
      unconscious at Deadly Stun; spirits vanish.
    projector_magic_loss: Disrupted projector makes the ordinary Magic Loss check
      referred to printed p160.
    spirit_reappear_delay_days: 28 - Spirit Force
    magic_reduced_to_zero: Projected character is disrupted and returns to body if
      Magic Attribute falls to zero.
    recover_magic_after_disruption: One Magic point per hour while not projecting.
    spirit_force_zero: Spirits with Force reduced to zero are disrupted and do not
      reappear for 28 minus Force days.
  astral_objects:
    examples: Barriers and foci are non-intelligent astral objects; they can fight
      only in astral combat if attacked, inflict Physical damage, and can be affected
      only by Physical damage. Their creator or owner automatically senses astral
      attack.
    attack: Attacker uses Charisma (or Force) in an Opposed Test against object Force;
      net successes reduce attacker Magic or Force or object Force, based on winner.
    other_dice: No other dice pools except Karma may be used for the opposed test.
    object_karma_pool: A barrier may have Karma Pool equal to Karma invested; a focus
      may have Karma Pool equal to bonding Karma Cost per Force point plus Force.
      Example Power Focus 3 gives Karma Pool 5 + 3 = 8.
    multi_attacker: Separate attacks; the object Force reduction accumulates until
      a Combat Turn passes to refresh.
    weapon_focus_bonus_dice: One additional Charisma die per 2 points of weapon focus
      Force, rounded down.
    overcome: When Force reaches zero, object is overcome but not automatically destroyed;
      regains Force in one Combat Turn if untouched.
    suppression: A character may expend a Complex Action each Combat Turn to suppress
      a zero-Force object; it cannot regain Force until left untouched for a full
      Combat Turn. Suppressed astral barrier allows astral or dual forms through.
    destroy_test: To destroy an overcome object, attacker makes Charisma Test against
      target number twice original Force; one success suffices.
    destroy_focus: Destroys enchantment of focus.
    destroy_temporary_barrier: Destroys temporary barriers such as wards.
    permanent_barriers: Permanent lodge/circle barriers become permanently ineffective
      against that attacker, not globally; a lodge may renew its link to earth in
      Force days, circle redrawn in Force hours. Permanent ward requires a new warding
      ritual and additional Karma equal to the desired Force.
    mana_spell: Astral object targeted with mana spell resists with Force for Damage
      Resistance; bonded focus/barrier creator may allocate Spell Defense dice from
      anywhere. Deadly damage destroys object; each lesser damage level reduces Force
      by one, recovered after one Combat Turn with no additional damage.
  evasion:
    dual_natured: Limited to physical movement; projecting opponent can evade via
      greater astral movement.
    projecting_test: Opposed Magic Test (or Force for spirit), comparing pursuer and
      pursued.
    multiple_pursuers: Facing 2 or more pursuers, opposed test against pursuer with
      highest Magic/Force plus +1 target-number modifier per additional pursuer.
    outcome: Side with greater successes determines escape or maintaining range; tie
      favors pursuers.
  source_scope: P176/PDF177 is the printed continuation after an intervening original
    illustration page; explicit source numbers only, no inferred p175 text.
headline: FASA Corporation Shadowrun, Third Edition FASA7001 fictional astral damage,
