data:
  canonical_context: procedure.magic.artificing
  artificing: Enchanting specialization for making foci; requires shop and object or materials; design formula, enchant telesma, complete with Karma bonding.
  formula:
    specification: Type, Force and form/material basis; a formula for the same form works with mundane, virgin or alchemical materials.
    acquisition: Buy or design; any character with Enchanting may use a completed formula for that specific focus.
    base_days: {Expendable Anchoring: 10, Expendable Spell: 10, Specific Spell: 10, Sustaining: 10, Centering: 20, Homunculus: 20, Spell Defense: 20, Reusable Anchoring: 30, Shielding: 30, Spell Category: 30, Spirit: 30, Power: 60, Weapon: 60}
    specific_spell_also_requires: spell formula
    test: Enchanting against desired Force; divide base time by successes. Failure requires the base time and another test.
    interruption: Formula design may be interrupted without penalty; formulas cannot be memorized.
    translation: Hermetic and shamanic formulas; translating between traditions is equivalent to fresh design with TN modifier -2.
    mundane: Mundane characters with Talismongering may design formulas but not make foci; using Talismongering instead of Enchanting adds +2 TN.
  telesma:
    eligible: Any inanimate object; its Object Resistance modifies Enchanting TN. More natural objects or objects requiring more work by the character are easier to enchant and less costly in first-bonding Karma; see the material and bonding tables.
    mundane: Commercial or premade object.
    handmade: Enchanter makes object from purchased materials using appropriate skill, often Build/Repair.
    virgin: Enchanter gathers raw materials and makes the object entirely from scratch using Talismongering and appropriate handicraft or Build/Repair; magically attuned to maker.
  exotic_materials_optional:
    applicability: GM option; after completing formula, roll 1D6. Result at or below Force requires an exotic material. At Force 6 or greater one material is automatic; subtract 6 from Force and roll again against the reduced Force, repeating the subtract-and-roll procedure until the reduced Force is zero or less. A positive remainder of at least 6 necessarily requires another material.
    selection: For each requirement roll 2D6 on table, choose an entry or invent a material; required exotic radicals are additional to voluntary alchemical radicals and cannot count twice.
    table_2d6:
      '2': fictional freshly killed dragon body part
      '3': 10 units of herbs from remote region of another continent
      '4': one unit metal alchemical radical
      '5': 1D6 x 10000 nuyen in fine gems
      '6': one liter of blood from a living fictional Awakened critter
      '7': a lock of hair, or feathers or scales, from an Awakened critter
      '8': one unit herbal alchemical radical
      '9': 1D6 x 10000 nuyen in precious metals
      '10': souvenir from astral quest
      '11': 10 units of minerals from remote region of another continent
      '12': bodily fluid or tissue sample from fictional living dragon
    alternative: Redesign the formula to roll new requirements if the character declines to meet them.
    example: Force 8 forest spirit focus automatically requires one material; remainder 2 and roll 2 requires a second. GM assigns one unit of leaves from a rare Amazonian tree and a lock of leshy hair.
