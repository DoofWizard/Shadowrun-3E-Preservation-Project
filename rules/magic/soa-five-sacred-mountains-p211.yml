headline: "Fictional Shadowrun tabletop RPG: Shadows of Asia (FanPro, FanPro25007, SR3), printed/PDF p211 — Five Sacred Mountains power-site rules"
framing: reference_exact
data:
  publication: {title: Shadows of Asia, publisher: FanPro, edition: SR3, catalog: FanPro25007}
  minimum_power_site_rating: 4
  aspect: Wujen and other wuxing practitioners; each site enhances magic corresponding to its element.
  seasonal_increase: Rating may increase at times significant in the wuxing cycle; magnitude not specified.
  optional_attunement:
    eligible: wujen
    choices: [yin, yang]
    same_attunement_rating_multiplier: 1.5
    opposite_attunement_rating_multiplier: 0.5
    balanced_site_rating_multiplier: 1
    rounding: not specified
  sites:
    - {name: "T'ai Shan", energy: yang, element: Wood, enhanced_spell_category: detection, increase_season: spring}
    - {name: Zhurong Peak, energy: yang, element: Fire, enhanced_spell_category: combat, increase_season: summer}
    - {name: Song Shan, energy: balance, element: Earth, enhanced_spell_category: health, increase_season: null}
    - {name: Hua Shan, energy: yin, element: Metal, enhanced_spell_category: manipulation, increase_season: autumn}
    - {name: Xuanwu Peak, energy: yin, element: Water, enhanced_spell_category: illusion, increase_season: winter}
  xuanwu_exceptions:
    non_wujen: Mana ebb equal to site rating (Target Awakened Lands p100).
    material_body_possessing_spirits: Spirits occupying a material body, such as shedim or loa, become dormant.
    trigger: Possessed person or object enters the vicinity.
    test: Opposed Test of spirit Force against site power rating.
    if_site_wins: Spirit is expelled from person or object.
  references: [rule.magic.power-sites, option.magic.path-wuxing]
