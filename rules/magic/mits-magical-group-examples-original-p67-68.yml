data:
  bear_doctor_society:
    type: initiatory
    members: 8
    strictures: [Belief, Fraternity, Limited Membership, Oath]
    membership: Salish Bear shamans
    resources: High
    dues_nuyen_monthly: 625
    dues_fraction_of_normal: 0.5
    balance_paid_by: Community
    patron: Salish tribe
    bear_lodge_rating: 8
    hospital_beds: 20
    member_living_quarters: true
    customs: Salish patients and patients unable to pay receive free care; protection of life and Bear's requirements govern conduct; needless killing is forbidden.
  children_of_the_dragon:
    type: dedicated
    members: 20
    strictures: [Attendance, Belief, Limited Membership, Exclusive Ritual, Fraternity, Karma, Oath, Obedience]
    membership: Worshippers of the Great Dragon Spirit
    belief: Great Dragon Spirit
    resources: Luxury
    dues_nuyen_monthly: 100
    balance_paid_by: Followers
    shamanic_lodge_rating: 9
    hermetic_library_all_skill_ratings: 8
    group_working_supplies: Provided by group
  hermetic_order_of_the_auric_aurora:
    type: initiatory
    members: 25
    ranks: 3
    strictures: [Fraternity, Karma, Limited Membership, Oath, Secrecy]
    membership: Mages only
    resources: Middle
    dues_nuyen_monthly: 200
    hermetic_library_all_skill_ratings: 8
    enchanting_shop: true
    ritual_space: true
    member_lore_store_discount_percent: 25
    customs: Scholarly practice and aid to the needy are favored; violent shadowrunning is discouraged, without a formal ethical stricture.
  illuminates_of_the_new_dawn:
    type: conspiratorial
    members_worldwide: 500
    maximum_members_per_circle: 12
    strictures: [Belief, Limited Membership, Fraternity, Link, Oath]
    belief: Magocratic progressivism
    membership: Mages only
    resources: Luxury
    dues_nuyen_monthly: 200
    structure: Local circles report to higher circles and ultimately to the Inner Circle; multiple circles may share an area.
  mitsuhama_research_unit_13:
    type: [dedicated, conspiratorial]
    purpose: Promote and protect MCT interests
    members: 10
    strictures: [Exclusive Ritual, Limited Membership, Link, Oath, Obedience]
    membership: MCT mages only
    obedience_scope: Corporate and Unit superiors
    resources: Luxury
    dues_nuyen_monthly: 0
    patron: Mitsuhama Computer Technology
    customary_initiation_gift_nuyen: 1000 times the superior's initiate grade, in cash or goods
  sisterhood_of_ariadne:
    type: dedicated
    dedication: Wicca
    members: 13
    mage_members: 3
    strictures: [Attendance, Belief, Fraternity, Limited Membership, Secrecy]
    attendance: Monthly full moon rituals
    belief: Wicca; protect Earth and women's rights; harmful magic only to protect self or Earth.
    fraternity: Sorority
    membership: Female Wiccans only
    resources: Middle
    dues_nuyen_monthly: 450
    hermetic_library_ratings: {Sorcery: 8, Conjuring: 4}
    shamanic_lodge_rating: 5
    customs: Both magical traditions admitted; male visitors excluded from rituals; supplies purchased in bulk for members.
  source_labels: Karma and Link are retained as printed in these example statblocks, without automatic normalization.
