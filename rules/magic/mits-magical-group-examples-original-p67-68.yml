headline: 'Fictional Shadowrun Third Edition rules: pre-generated magical groups (FASA7907) (printed 67-68/PDF 68-69)'
summary: 'FASA Corporation, Magic in the Shadows: six sample group profiles for tabletop play, with membership, strictures, resources, dues and facility ratings.'
