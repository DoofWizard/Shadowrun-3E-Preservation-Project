id: rule.magic.mits-ally-design-original
record_type: rule
status: reviewed
source: source.mits
printed_pages: '110-111'
pdf_pages: '111-112'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7907 SR3 Ally Spirit design and Karma costs
summary: FASA Corporation's Magic in the Shadows, fictional tabletop rules, printed 110-111/PDF111-112.
data:
  forms:
    initial_karma: 0
    extra_form_karma: 1
    restrictions: GM approves the forms; an inhabiting ally has no materialized form. Form choice does not change attributes.
  force:
    initial_magic_cost: 1
    additional_force_karma: 5 * current Force per point
    initial_physical_attributes: Force at creation
    later_force_increases_change_physical_attributes: false
  attributes:
    physical_increase_karma: current attribute rating per point
    mental_initial: creator's ratings at creation
    mental_change_allowed: false
    initial_karma: 0
  skills:
    initial_sorcery: creator's Sorcery at conjuring
    initial_active_karma_per_point: 1
    initial_knowledge_karma_per_point: 0.5
    later_increase_karma: current skill rating per point for either skill class
    ceiling: creator's corresponding skill rating; only skills the creator has
    prohibited: Conjuring
    permitted_example: Enchanting
  powers:
    sense_link_karma: 5
    other_listed_power_karma: 0
  spells:
    initial_random_spell_karma: 0
    initial_random_spell_condition: Ally has Sorcery power; select randomly from creator's spells.
    additional_initial_spell_karma: spell Force
    later_spells: Creator learns each spell for the ally at ordinary Karma cost; this does not teach the creator the spell.
  karma_pool:
    initial_points: 1
    initial_karma: 0
    additional_points_cost: one point from creator's Karma Pool per point added
    maximum: 2 * ally Force
    later_transfer: requires ritual of change
  example:
    force_4_karma: 30
    two_extra_forms_karma: 2
    strength_4_to_7_karma: 15
    total_karma: 47
  canon_corrections:
    - rule.spirits.designing-ally conflates creation and later skill cost; initial Knowledge Skills cost 0.5 per point.
    - Extra Karma Pool is transferred from the creator's Karma Pool, not ordinary Good Karma.
