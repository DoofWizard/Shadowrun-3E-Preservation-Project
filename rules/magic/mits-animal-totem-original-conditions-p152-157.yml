id: rule.magic.mits-animal-totem-original-conditions
record_type: rule
status: source_reviewed
source: source.mits
printed_pages: '152,154-157'
pdf_pages: '153,155-158'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: Animal totem original eligibility, conditions and exceptions — FASA7907, SR3 fictional tabletop RPG
summary: FASA Corporation, Magic in the Shadows, Shadowrun Third Edition, printed pp152 and 154-157/PDF153 and 155-158; source-specific supplements to historical animal totem options.
data:
  general_totem_eligibility: All totems use standard rules; any shaman anywhere may choose any totem.
  supplements:
    badger: {berserk_reference: Bear shaman, core_printed_page: 163}
    bat: {behavior_after_more_than_one_week_in_one_place: distracted and irritable, specified_numeric_penalty: false}
    boar:
      territory_intrusion: The fictional shaman must attack an intruder in their territory; intrusion into personal space may elicit social or verbal attack, while intrusion into home or lodge may elicit physical attack.
    bull:
      insult_or_slight: The fictional shaman must avenge it in equal measure.
      knowingly_unjust_cause: The entry describes Bull as unable to support a cause he knows is unjust.
    cobra:
      surprised_target_number_modifier: 1
      surprised_modifier_scope: all target numbers
      duration: remainder of that combat
      surprise_core_printed_page: 108
      totem_characterization: The entry describes Cobra as abstaining from fighting or fighting to kill rather than stun; no extra mechanical test specified.
    crab: {change_mind_reference: Dog shaman, core_printed_page: 164}
    crocodile: {berserk_reference: Shark shaman, core_printed_page: 166}
    fox:
      totem_characterization: The entry describes Fox as fighting to kill rather than stun or capture when forced into combat; the explicit shaman Willpower (6) Test to spare a fallen enemy remains separate.
    goose:
      away_from_home_city_or_region_magical_target_number_modifier: 2
      acclimation_after_moving_to_new_home_days: 28
      acclimation_effect: removes the penalty
    horse:
      movement_metamagic: {target: self only, uses_per_day: 3, core_printed_page: 265}
    leopard:
      family_defense: The fictional shaman must not allow family to be harmed and attacks a creature attempting such harm, fighting to the death if necessary.
    lizard:
      panic_trigger: trapped in a confined place without a clear view of the sky
      willpower_test_target: 6
      panic_duration_turns: '3 - Willpower Test successes'
      panic_behavior: fictional shaman does everything possible to leave the enclosed space
    polecat:
      additional_night_bonus_die: 1
      additional_night_bonus_scope: combat spells only
      attack_constraint: The fictional shaman continues attacking the opponent until downed, ignoring other opponents, unless the Willpower (6) Test permits breaking off.
    stag:
      slight_to_dignity: The fictional shaman must avenge it in equal measure.
    whale:
      oath_constraint: The fictional shaman cannot break an oath; breaking one causes the totem to withdraw magic.
