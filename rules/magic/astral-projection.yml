resolution:
  summary: "Astral projection separates the astral form from the physical body as an Exclusive Complex Action. The astral form uses astral Attributes and movement, while the physical body remains behind; projection duration and returning to the body are limited by Essence/Magic-related rules."
  inputs: ["physical body state","Essence","astral form"]
  outputs: ["projecting astral state"]
