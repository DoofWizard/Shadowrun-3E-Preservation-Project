id: rule.magic.sr3-core-magic-essence-loss-numeric-p158-160
record_type: rule
status: source_reviewed
source: source.sr3-core
printed_pages: 158, 160
pdf_pages: 159, 161
edition_scope: FASA Corporation Shadowrun, Third Edition (FASA7001), original fictional
  tabletop game; no automatic later edition or supplement rule substitution
content_class:
- rule_exact
headline: Fictional FASA Corporation Shadowrun Third Edition (FASA7001) numeric Magic
  attribute, Essence and Magic Loss, printed pp158 and 160/PDF159 and 161
summary: Original Third Edition Magic starting rating rounded down from Essence, a
  staged Essence reduction condition, 2D6 Magic Loss Test, qualifying event types,
  and burnout consequences; the source has an intervening art page, not evidence of
  a missing rules folio.
data:
  publication:
    title: Shadowrun, Third Edition
    publisher: FASA Corporation
    edition: original Shadowrun Third Edition
    catalog: FASA7001
    source_id: source.sr3-core
    nature: published fictional tabletop role-playing game rulebook
  source_pages:
    printed:
    - 158
    - 160
    physical_pdf:
    - 159
    - 161
    source_headings:
    - THE MAGIC ATTRIBUTE
    - Magic Loss
    - FORCE
    intervening_pdf160: Full-page illustration; not cited as a numbered semantic rule
      page.
  magic_attribute:
    category: Special Attribute of Awakened characters
    starting_value_rule: Magic starts equal to current Essence rounded down to a whole
      number
    worked_example:
      essence: 5.8
      starting_magic: 5
    mundane_boundary: Characters with Magic 0 have no active magical capabilities.
  essence_loss:
    mechanism: Essence loss from cyberware or other effects also reduces Magic, with
      each full point or fraction crossing the next lower whole Essence level triggering
      the stated one-point loss.
    illustrative_threshold:
      before_essence: 5.8
      before_magic: 5
      new_essence_below: 5
      magic_reduction: 1
    limit: This is not permission to restore separately lost Magic whenever Essence
      later changes.
  other_magic_loss_checks:
    events_named_in_core:
    - event: Deadly Physical damage and improper medical treatment
      cross_reference_printed: 129
    - event: Abusing the body with stimulants or other drugs
      cross_reference_printed: 160
    - event: Failing to follow the totem path
      cross_reference_printed: 163
    - event: Disruption during astral combat
      cross_reference_printed: 176
    test_dice: 2D6, ordinary sum
    result_if_sum_less_than_or_equal_to_current_magic: Reduce the Magic Attribute
      by 1
    result_if_sum_greater_than_current_magic: No Magic loss from that test
    critical_boundary: The source does not say that every named event always results
      in loss without the specified check.
  burnout:
    trigger: Current Magic Attribute falls to zero
    consequence: The character loses the ability to use magical powers and becomes
      mundane under the original core rule.
    knowledge_retained: The character retains magical skills and knowledge but cannot
      actively use magical abilities.
    active_skill_conversion: Magical Active Skills become magical Background Knowledge
      Skills.
    adept_power_dependency: Adepts losing Magic also lose some adept powers under
      the separate printed p168 procedure; exact allocation is not inferred here.
  force_context:
    scope: Force is a rating of magical things such as spells, spirits and magical
      items (foci).
    spells: Spell Force is used as the target number for resisting spell effects and
      as a measure of spell power under the relevant spell-specific rules.
    spirits: Spirit Force reflects a spirit’s relative power.
    limitation: This contextual description does not supply individual spell or spirit
      statblocks.
  existing_canonical_reuse:
  - rule.magic.magic-attribute
  - rule.magic.magic-loss
  - rule.magic.spell-characteristics
  lineage: Record is original FASA7001 Magic/Essence and Magic Loss only; metamagic,
    initiation, healing and later optional replacement rules remain separate.
  extraction_boundaries:
  - Printed p158 is visible on physical PDF159 and printed p160 on PDF161.
  - The physical PDF160 is artwork; no printed p159 fact is assumed.
  - Other cited cross-reference procedures were not expanded or re-transcribed in
    this record.
framing: reference_exact
