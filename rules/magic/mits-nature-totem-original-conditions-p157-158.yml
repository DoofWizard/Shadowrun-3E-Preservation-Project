headline: Nature totem confrontation, commitment and payment qualifications — FASA7907, SR3 fictional tabletop RPG
summary: FASA Corporation, Magic in the Shadows, Shadowrun Third Edition, printed pp157-158/PDF158-159; source-specific qualifications to the existing nature totem options.
data:
  supplements:
    moon:
      direct_confrontation_willpower_test_target: 6
      negotiation_is_confrontation: false
      arguments_are_confrontation: true
    oak:
      protection_commitment: The fictional shaman steadfastly protects people they have agreed to defend, even at the cost of their life.
    sea:
      payment_determined_by: the shaman
      payment_can_be_nonmonetary: true
      payment_varies_by_relationship: true
      willpower_test_target_to_avoid_answering_slight_or_insult_in_kind: 6
    sun:
      unjust_cause_constraint: The fictional shaman refuses to follow any cause they believe unjust.
