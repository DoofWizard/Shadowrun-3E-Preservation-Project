  mechanics:
    environment_types:
    - wilderness
    - urban
    environment_condition: A totem may have a preferred wilderness or urban domain
      that affects where a shamanic lodge devoted to it may exist.
    bonus_penalty_scope: The original totem grants bonus dice on specified Sorcery
      or Conjuring tests and may subtract dice or change target numbers under explicitly
      stated conditions; modifiers do not change skill ratings.
    totem_benefit_choice: Some totems require a shaman's player to select the relevant
      bonus; once chosen, it is permanent.
    totem_adherence: A gamemaster may use totems as fictional in-world guides, cues,
      riddles and omens; these are discretionary narrative tools rather than an automatic
      modifier.
    departure_from_path: When a shaman violates totem ideals, gamemaster may portray
      warning or loss of totem bonuses; continued disregard may reduce Magic Attribute
      by one point. Restoring the lost power may require seeking the totem and following
      its ideals, potentially with a special GM-determined adventure.
  presentation_distinctions:
    shamanic_mask: The source describes temporary visible-to-observers animal-like
      magical features when a shaman casts; the mask is an apparent hallucination,
      invisible to machines and video recording.
    authority: The totem descriptions contain character options and fictional narrative
      beliefs; optional gamemaster responses are not automatic penalties.
