headline: 'FASA Corporation Shadowrun, Third Edition FASA7001 fictional spell-learning
  example correction: original pp180-181/PDF189-190 versus publisher SR3 errata v1.5
  (1998)'
summary: Retains original contradictory Force 8 worked example for source fidelity,
  while a separate publisher-issued original Third Edition erratum establishes corrected
  learning TN14 (16−2) and 6 Karma; original p180 2×Force rule remains authoritative.
