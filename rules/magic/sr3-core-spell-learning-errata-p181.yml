  original_scan_unchanged:
    p180_general_target_number: Twice the desired Force of the spell
    p181_worked_example: Force 8 Fireball with Exclusive -2 applied for learning says
      target number 6; the example disagrees with the printed p180 general 2 × Force
      rule.
    accepted_original_record: rule.magic.sr3-core-learning-limited-spells-p180-181
    original_record_sha: a4b4b2c8a89f75f7d1c4dd56c5f9087d19d499a3
    original_record_disposition: Retain its faithful original-scan transcription,
      including the inconsistent worked example. Do not silently replace source text
      with erratum.
  historical_same_edition_erratum:
    issuer: FASA Corporation
    credited_author: Sharon Turner Mulvihill
    title: Shadowrun 3rd Edition Errata
    original_version: '1.5'
    published_date: '1998-11-02'
    printed_page_addressed: 181
    later_collected_version: 4.1 dated 2004-02-28, reflecting correction in corrected
