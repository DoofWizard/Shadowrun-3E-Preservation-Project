    archived_1998_url: https://www.oocities.org/timessquare/castle/2966/sr3_errata.html
    archived_2004_url: https://www.nullsheen.com/posts/erratasr3/
    scope: Replace only the second paragraph of the printed p181 Spell Learning Example.
      This erratum resolves the example inconsistency; it does not redefine the generic
      source p180 learning procedure.
    corrected_formula: 2 × original spell Force minus applicable Exclusive spell-learning
      modifier
    corrected_example_force: 8
    corrected_example_general_target_number: 16
    corrected_example_exclusive_learning_modifier: -2
    corrected_example_target_number: 14
    corrected_example_good_karma_cost: 6
    applicability: The specific -2 Exclusive limit must be selected for learning-test
      target-number and Karma reduction; a limit instead allocated to Drain does not
      grant that learning discount. The original limit-assignment conditions remain
      in the accepted p180-181 rule.
  precedence_and_engine_use:
    original_baseline: Use published original core mechanics as the baseline; keep
      original example as a documented historical typo.
    same_edition_erratum_overlay: For a rules-as-corrected SR3 consumer, use target
      number 14 and 6 Karma in the stated Force 8 Exclusive-learning worked example,
      and retain the original general learning target-number formula.
    not_an_original_page_statement: true
    no_cross_edition_import: true
