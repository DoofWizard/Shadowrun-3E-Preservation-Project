    independent_errata_evidence: Published FASA Corporation 1998 version 1.5 errata
      credited to Sharon Turner Mulvihill, independently cross-checked against archived
      2004 version 4.1 original-Third-Edition errata wording; both agree on 16-2=14
      and six Karma.
