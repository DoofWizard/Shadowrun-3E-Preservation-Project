    expected_learning_target_number: 14
    expected_good_karma_cost: 6
  - force: 8
    spell_learning_limit_modifier: 0
    expected_learning_target_number: 16
    expected_good_karma_cost: 8
  source_review:
    original_page_evidence: Fresh independently SHA256-verified 345-page FASA7001
      scan; original printed p180/PDF189 general formula and printed p181/PDF190 incorrect
