data:
  publication: {title: 'State of the Art: 2064', publisher: FanPro, catalog_number: FanPro25004, edition: Shadowrun Third Edition, chapter: Old World Magic, section: 'Druids and Bards', printed_pages: '125-126', physical_pdf_pages: '126-127'}
  celtic_and_wild_druids:
    base: Most Celtic and all wild druids use wilderness shaman rules.
    wild_totems: [Sun, Moon, Oak, Stream, Wildcat, Bear, Eagle, Wolf, Wyrm]
    celtic: Idol or nature totems representing Celtic divinities, elemental forces and sacred animals.
    optional_expanded_rules:
      sensing_test_dice_modifier: 1
      talismonger_gathering: Greater ease around sacred circles via sensitivity to background count, especially when favorably aspected; no numeric modifier stated.
      herb_lore: Complementary skill on Enchanting Tests involving suitable herbal materials.
      herbal_collection_requirement: Consecrated golden sickle.
      sacred_circle_conjuring: May summon appropriate great form spirits of appropriate domain inside own sacred circle even without invoking metamagic.
      initiation_and_ordeals: Reserved for Imbolc, Beltane, Lugnasad and Samhain.
      other_great_rituals: Often reserve these for major festivals.
    references: [MITS p25, Target Awakened Lands p110]
  typical_background_counts:
    - [Grand Lodges on minor leys, 1]
    - [Grand Lodges on great leys, 2]
    - [Warwick Castle, 3]
    - [Caerleon, 3]
    - [Callanish, 3]
    - [Heart of Broceliande forest, 3]
    - [Stonehenge, 4]
    - [Lyonesse, 4]
  bards:
    character_types: Mainly Celtic-inspired magicians with artistic skills and artist's way adepts; mundane performers and stagehands can be part of troupes.
    independent_numeric_modifiers: None stated.
