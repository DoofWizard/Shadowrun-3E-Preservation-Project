data:
  publication: {title: 'State of the Art: 2064', publisher: FanPro, catalog_number: FanPro25004, edition: Shadowrun Third Edition, chapter: Old World Magic, section: 'Hermetic Paradigms and Schools', printed_pages: '127', physical_pdf_pages: '128'}
  base_rules: Hermetic schools per MITS p17.
  optional_cross_school:
    circle_and_library_modifiers: [2, -2]
    condition: GM may increase ordinary positive and negative modifiers to these values for distinctly different or opposing schools.
    optional_negative_modifier_extension: Foci, spell formulas, ritual trappings of markedly different schools.
    limited_local_presence:
      ritual_materials_and_foci_price_increase_percent: 20
      ritual_materials_and_foci_availability_increase_percent: 50
      optional: true
  school_options:
    hermetic_druidism:
      benefit: Same Celtic and wild druid advantages at sacred circles and during four major festival dates; standard hermetic otherwise.
      source_reference: SOTA64 pp125-126
    reformed_ritualism:
      ritual_magic_sorcery_dice_modifier: 1
      other_spellcasting_dice_modifier: -1
    avant_garde_thaumaturgy:
      spell_design_dice_modifier: 2
      eligible_formula: Entirely new formula only; not variant of published spell.
      group_ritual_magic_sorcery_dice_modifier: -1
    unified_magic_theory:
      minimum_initiate_grade: 3
      option: Exchange elemental conjuring for nature-spirit conjuring or reverse at initiation instead of learning a new metamagic technique.
      exclusivity: Loses ability to conjure former spirit type.
      cross_tradition_tools_penalties: None, including shamanic, houngan and wujen traditions.
      own_tradition_tool_positive_modifiers: None.
    concordance_alchemists:
      enchanting_test_dice_modifier: 2
      chemistry_knowledge_skill_minimum_rating: 3
      physics_knowledge_skill_minimum_rating: 3
      qualification: Both knowledge skills required to understand alchemical theory and qualify as alchemist.
    pythagoreans:
      permitted_users_and_interpreters: Trained Pythagoreans or mages with Math Knowledge skill rating 4 or higher.
      applies_to: Pythagorean spell formulas and magic circles.
