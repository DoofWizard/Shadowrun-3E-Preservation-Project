headline: FASA7907 Magic in the Shadows (SR3) — General adept rules and other adept
  ways
summary: Original fictional tabletop mechanics, FASA Corporation, printed pp21–22/PDF22–23.
data:
  general_adept_powers:
    effect: Adept powers permanently alter the character's abilities.
    dispelling: Adept powers cannot be dispelled in the manner of spells.
    aura_reading:
      test: Aura Reading Test on the adept's aura.
      minimum_successes_for_insight: 2
      insight: Reveals some information about the adept's powers and their levels.
      extra_success_threshold: 2
      per_success_above_threshold: Reveal one power or the exact level of one power.
  artists_way:
    centering: Performance of the character's art supplies a means of Centering as
      an initiate.
    reference: MitS p72; standard Centering requirements remain applicable.
  spirit_way:
    astral_perception: Followers possess astral perception as the foundation of their
      way.
  scope:
    separate_records:
    - rule.magic.mits-adept-totem-way-original
    - rule.magic.mits-magicians-way-original
    other_ways: Athlete, Warrior and Invisible Ways describe areas of expertise without
      additional numerical tests or power costs in these passages.
