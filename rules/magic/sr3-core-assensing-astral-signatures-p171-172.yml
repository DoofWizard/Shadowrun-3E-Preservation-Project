    distinctions: Source-book narrator's fictional magic mechanics are distinguished
      from in-world forensic examples; success thresholds, resistance and conditions
      preserved.
    revision_assertion_equivalence: Old p171–172 numeric, condition, timing, consent
      and limit assertions remain unchanged. The revision adds original-page source
      details for aura/impression nature and astral interaction absent in the prior
      canonical record; it does not change those already normalized tests.
  aura_information_and_reading:
    living_auras: Living beings display astral auras with observable general health,
      emotions, and magical nature.
    enchanted_objects: Enchanted objects display their magical nature as astral impressions.
    mundane_objects: Nonmagical objects do not have their own auras, but can retain
      impressions from contact with living auras.
    object_impressions: Assensing can read such impressions left on an object; this
      is a fictional rulebook possibility, not automatic perfect identification.
    spellcasting_aura: A spell cast on the physical or astral plane produces a visible
      aura around its caster.
  astral_interaction:
    source_heading: Astral Interaction (original printed p172/PDF173)
    physical_character_with_astral_perception: A character using astral perception
      can touch and interact with astral forms using normal physical Attributes and
      skills.
    reciprocal_vulnerability: Other astral forms can affect and fight an astrally
      perceiving character, including by using mana spells.
    physical_weapons_and_worn_armor: Ordinary physical weapons and worn armor are
      ineffective against astral opponents in the interaction described.
    activated_weapon_foci: An activated weapon focus can be used against astral opponents.
    natural_armor_and_adept_power: Natural armor, such as a troll’s armor, and the
      Mystic Armor adept power provide protection against astral combat damage.
    mana_spell_targeting: A perceiving character can cast mana spells at astral opponents
      through astral perception, subject to ordinary spell targeting rules.
    source_scope: These are historical fictional tabletop combat and spell-targeting
      rules on p172, not real-world abilities; the more detailed p174 and p176 astral
      combat records remain authoritative for their respective mechanics.
