  source_section: Astral perception, assensing table and signature identification
    or erasure
  astral_perception:
    activation: Simple Action to begin astral perception while still physically present;
      astral forms and auras become perceivable.
    ordinary_visibility: Seeing unobscured spirits, astral barriers and present astral
      forms is a Free Action; ordinary Perception Tests only if something is hiding.
    dual_nature: The perceiver can interact with astral forms using their physical
      Attributes and skills but is also vulnerable to astral attack.
    mundane_distraction_target_modifier: +2 to completely mundane nonmagical tasks
      while using astral perception.
    barrier_visual_target_modifier: Equal to astral barrier Force.
    psychic_sense_independent_of_physical_sight: Original printed p171 explains that
      astral perception is a psychic sense independent of physical vision. A character
      uses a Simple Action to perceive the astral plane while remaining physically
      present.
  assensing:
    basic_test: Assensing Test with Intelligence dice and target number 4; degree
      of detail follows the success table.
    aura_reading_complementary: Complementary Aura Reading Skill Test at target number
      4. For every two successes, add one success to Assensing, provided the complementary
      test has at least one success.
    retry_rule: Number of additional tests for a better result is limited to character
      Intelligence; each subsequent test adds +2 to target number.
    result_table:
    - successes: '0'
      information: No new information.
    - successes: 1-2
      information:
      - General health condition and presence or absence of cyberware implants
      - General emotional impression
      - Class of any magical subject such as elemental/spell/focus
      - Whether subject is mundane or Awakened
      - Recognition of familiar aura regardless of physical disguise
    - successes: 3-4
      information:
      - Compare target Essence and Magic against observer as higher, lower or equal
      - General location of implants
      - General diagnosis of diseases or toxins
      - Exact emotional state
      - Compare target Force against observer Magic
      - Presence of astral signatures
    - successes: 5 or more
      information:
      - Exact subject Essence, Magic Attribute and Force
      - Exact location of any implants
      - Accurate diagnosis of disease or toxin
      - Broad cause of emotional impression
      - General cause/type of astral signature
  astral_signatures:
    duration: A signature from the fictional magical effect persists a number of hours
      equal to that effect's Force after its effect ends.
    read: At least three Assensing successes detect a signature. Recognize a previously
      seen signature. Five or more successes may indicate general magical origin.
    eraser_skill: Use Sorcery for spell signatures or Conjuring for spirit signatures,
      against the Force of the spell or spirit.
    eraser_successes: Each successful test success reduces persistence duration by
      one hour; successes at least equal to Force erase the signature.
    scope: Each signature is treated separately; multiple signatures do not combine.
      Permanent intrinsic signatures of existing spells, spirits or foci cannot be
      erased by this process.
    drain: After the fictional erase test resist (Force)L Drain; if Force exceeds
      Magic Attribute the Drain is Physical.
    timing: Erase requires a number of Complex Actions equal to effect Force and requires
      astral perception.
  source_review:
    original_images: Original printed pp171-172/PDF172-173 independently re-reviewed
      via both source-page images in this run, including all Assensing table rows,
      signature/erasure mechanics, aura properties and Astral Interaction paragraphs.
