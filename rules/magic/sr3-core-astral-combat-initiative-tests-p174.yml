  source_heading: Magic / Astral Combat / Astral Initiative / Astral Combat Tests
  combat_scope:
    eligibility: Any astral form may take part in astral combat. Physical characters
      who are not using astral perception or projection are immune to direct astral
      attacks.
    mechanic: Uses melee combat rules; non-spell ranged weapons cannot be used in
      the astral plane. Astral characters attacking other astral forms have no astral-movement
      penalty.
  initiative:
    dual_natured_and_astrally_perceiving: Use normal physical Reaction and Initiative.
    astrally_projecting_reaction: Intelligence Attribute
    astrally_projecting_initiative_score: Intelligence + 20 + 1D6
    become_projecting_mid_turn: A character who projects during a Combat Turn (Exclusive
      Complex Action) uses physical Initiative for the rest of that turn.
    return_mid_turn: A projecting character who returns to the physical body during
      a Combat Turn (Exclusive Complex Action) cannot take another action for two
      Initiative Passes.
  combat_tests:
    dual_natured: Use normal physical Attributes, skills and Combat Pool; movements
      and Initiative are limited by physical bodies, including spirits in physical
      form.
    projecting: Use normal Mental and Special Attributes; substitute Mental for Physical
      in astral combat.
    astral_combat_pool_formula: round down((sum of Mental Attributes) / 2)
    melee: Make ordinary melee combat tests. For an armed astral combat skill, a weapon
      focus must be used; otherwise use Unarmed Combat or Sorcery as allowed.
    unarmed_option: Characters can attack with the Unarmed Combat skill.
    sorcery_option: Characters can use Sorcery instead of Unarmed Combat, including
      adepts who cannot cast spells. Sorcery used this way consumes dice that otherwise
      could be used for spell defense/spellcasting.
    spirits_and_astral_entities: Spirits and other astral entities use their Force
      for all astral combat tests unless materialized.
  source_scope: Original p174 ends when Astral Damage begins; numeric damage codes
    and astral object rules continue at printed p176/PDF177, separately normalized.
headline: Original FASA Corporation Shadowrun, Third Edition FASA7001 fictional astral
  combat initiative and test formulas, printed p174/PDF175
summary: Original tabletop mechanics distinguishing astral perception, projection
  and dual-natured combat, Initiative, actions and astral Combat Pool.
