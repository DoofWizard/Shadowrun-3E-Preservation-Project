content_class: [rule_exact]
data:
  resolution:
    primary: Use spell Damage Code.
    secondary: GM determines environmental or further damage effects appropriate to fictional spell and situation; after primary damage, if a standing target remains vulnerable, roll 2D6 for nonliving targets.
    object_resistance_test: Result must equal or exceed Object Resistance with the listed level modifier.
    object_resistance_modifier_by_damage: {D: 0, S: 2, M: 4}
    light_damage: No secondary effects.
  elements:
    acid:
      primary: Full-body armor treated for toxic-material resistance negates damage; fume cloud extends to twice spell area and adds 4 to all target numbers in affected area; treacherous ground and fumes last rest of turn.
      secondary: Fictional objects may be corroded or melted; vehicle tires flatten; armor loses 1 each from Ballistic and Impact; Deadly effect may destroy firearms.
    blast:
      primary: Increase Damage Level by one against manifested earth elementals and gnomes; apply melee Knockdown with spell Force in place of attacker Strength.
      secondary: Glass, plaster and unreinforced walls or structures may be damaged.
    fire:
      primary: Increase Damage Level by one against water elementals and undines.
      secondary: Flammable materials receive -1 Object Resistance. Ignited clothing causes 6M damage at end of first Combat Turn, then +2 Power each turn until extinguished. Fictional exploding ammunition or similar items resolve as weapon hits without armor reduction; Combat Pool may assist resistance. Vehicle fuel secondary-effect test adds 2 Object Resistance unless fuel is exposed to open air.
    ice:
      primary: Increase Damage Level by one against fire and water elementals, salamanders and undines; heated armor or clothing negates damage; treacherous ground until end of turn.
      secondary: Moving vehicles immediately make Crash Test and may stall; liquids may freeze and normal plants may die.
    light:
      primary: Flare penalty per SR3 p112 for one Combat Turn after attack; sunlight allergy or vulnerability may cause extra damage.
      secondary: Flammables may ignite and optical scanners may overload.
    lightning:
      primary: Insulated armor or clothing negates effect; ungrounded characters may escape it; increase Damage Level by one against air elementals and sylphs; melee Knockdown rules apply.
      secondary: Electrical equipment Object Resistance -1; equipment, fictional firearms and ammunition may be damaged; vehicles may short out or suffer fuel ignition; vehicle Object Resistance +2 unless fuel is exposed to open air.
    metal:
      primary: Iron allergy or vulnerability causes extra damage.
      secondary: Unprotected targets may be shredded by fictional metallic fragments; armor rating may fall by one; some sensors and scanners may be confused.
    sand:
      primary: Increase Damage Level by one against air elementals and sylphs.
      secondary: Machinery or weapons not fully sealed against environment may jam or be damaged.
    smoke:
      primary: Stun damage; continued exposure can overflow Condition Monitor into Physical damage after unconsciousness.
      secondary: Visibility modifier +4 for rest of turn.
    water:
      primary: Stun damage, melee Knockdown for all affected, one Damage Level increase against fire elementals and salamanders; exposed wiring shorts; affected area is treacherous ground for rest of turn.
      secondary: Electrical or electronic gear including vehicle engines may short out, but not cyberware.
framing: reference_exact
headline: 'Fictional Shadowrun Third Edition elemental spell effects, FASA7907, printed 51-54/PDF 52-55'
summary: 'FASA Corporation, Magic in the Shadows: tabletop RPG primary and secondary elemental effect resolution, Object Resistance modifiers and ten elemental game categories.'
