id: rule.magic.mits-free-spirit-origin-energy-original
record_type: rule
status: reviewed
source: source.mits
printed_pages: '113-114'
pdf_pages: '114-115'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7907 free spirit eligibility and Spirit Energy (SR3)
summary: FASA Corporation's Magic in the Shadows, fictional tabletop RPG rules, printed 113-114/PDF114-115.
data:
  origin:
    eligible: [ally, elemental, loa, blood spirit, nature spirit, spirit of the elements, insect spirit, zombie]
    excluded: [watcher, ancestor spirit]
    adjudication: GM may decide at loss of control; Force greater than 6 and long association with metahumanity favor freedom.
    random_test: Force dice, TN 6; TN 4 for favored spirits; at least 1 success grants freedom.
    failure_return_to_metaplanes: [nature spirit, loa, spirit of the elements]
    failure_attacks_summoner: [elemental, blood spirit, zombie]
    uncontrolled_ally_always_free: true
    initial_force_and_karma_pool: Retain ratings at moment of freedom.
    domain: May cross domains; domain-specific powers work in other domains of the same kind only.
  spirit_energy:
    initial: 1
    maximum: Force
    increase_one_cost_good_karma: new Spirit Energy rating
    force_based_power_rating: Force + Spirit Energy
    physical_attributes: calculated using Force + Spirit Energy
    astral_initiative_bonus: Spirit Energy
    personal_domain_multiplier: 2
    other_situational_modifiers: GM discretion; example half Spirit Energy for spirit of man in nonurban setting.
    emergency_karma_pool: Spirit Energy points may be spent as Karma Pool; points spent this way are permanently lost.
  comparison: Complements rule.spirits.becoming-free and rule.spirits.spirit-energy with exact thresholds, failure categories, ceiling and expenditure rule.
