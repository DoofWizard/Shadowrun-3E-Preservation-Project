headline: 'FASA Corporation Shadowrun, Third Edition FASA7001 fictional Illusion Spells:
  printed p195/PDF204 original resistance comparison versus publisher corrected same-edition
  errata v4.1'
summary: The original p195 scan requires MORE observer successes; SR3 publisher errata
  v4.1 [13] changes that Illusion Resistance comparison to EQUAL OR MORE, so a tie
  now permits observer recognition without altering the preserved original source.
