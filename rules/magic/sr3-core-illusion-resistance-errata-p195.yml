    printed_page: 195
    physical_pdf_page: 204
  original_scan_text:
    printed_rule: The observer must obtain MORE successes than the illusion spellcaster
      on a Resistance Test to recognize an illusion as unreal.
    canonical_source_record: rule.magic.sr3-core-illusion-target-and-resistance-p195
    canonical_source_record_blob: dd3c77ab17ceef7d7f4b54075ddbe03efa1d1457
    preservation: Keep original scanned wording and original canonical record unchanged,
      including its strict greater-than comparison.
  official_same_edition_erratum:
    publisher_line: Shadowrun Third Edition original same-edition publisher errata,
      v4.1 dated 2004-02-28; correction marked [13] for thirteenth corrected printing.
    publisher_original_web_source: shadowrunrpg.com, historical original; archived
      copy at https://www.nullsheen.com/posts/erratasr3/
    affected_page_and_section: Printed p195, Illusion Spells, third paragraph, third
      sentence.
    replacement_rule: Observer recognizes the illusion is not real when Resistance
      Test successes are EQUAL TO OR GREATER THAN the spellcaster successes.
    comparator: '>='
    opposed_successes_equal: Observer sees through the illusion in corrected SR3,
      unlike the original scanned first-print wording.
    opposed_successes_less: Observer remains affected by the illusion unless a separate
      source condition applies.
    applies_to: Recognizing illusory unreality under the general Illusion Spells rule
      only, not a universal change to opposed combat, spell damage, or other success-contest
      rules.
    no_cross_edition_import: true
  test_vectors_specifications_only:
  - caster_successes: 3
    observer_resistance_successes: 2
    recognizes_illusion: false
  - caster_successes: 3
    observer_resistance_successes: 3
    recognizes_illusion: true
  - caster_successes: 3
    observer_resistance_successes: 4
