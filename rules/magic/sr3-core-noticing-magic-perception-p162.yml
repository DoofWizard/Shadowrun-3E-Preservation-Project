id: rule.magic.sr3-core-noticing-magic-perception-p162
printed_pages: '162'
pdf_pages: '163'
content_class:
- rule_exact
headline: 'Fictional Shadowrun Third Edition core (FASA Corporation FASA7001): noticing
  magic, printed p162 / physical PDF163'
summary: Original FASA7001 noticing-magic Perception Test, with the Force-versus-Magic
  TN formula, worked numerical examples and five exact situational modifiers; other
  ordinary Perception modifiers remain an explicit cross-reference.
data:
  publication:
    title: Shadowrun, Third Edition
    publisher: FASA Corporation
    edition: original Shadowrun Third Edition
    catalog: FASA7001
    source_id: source.sr3-core
    nature: published fictional tabletop role-playing game sourcebook
  source_page:
    printed:
    - 162
    physical_pdf:
    - 163
    heading: NOTICING MAGIC / NOTICING SPELLCASTING MODIFIERS TABLE
  scope: The core describes observers recognizing a magician using a magical skill,
    not mechanically identifying all invisible or unrelated magical effects.
  test:
    skill_or_attribute: Perception Test
    base_target_number: 4
    target_number_formula: 4 + magician Magic Attribute - Force of magic being performed
    source_mandated_perception_modifiers: Apply any relevant ordinary situational
      Perception Test modifiers (core reference p231), but do not infer a special
      stacking exemption.
  examples:
  - magician_magic: 6
    performed_force: 4
    expected_target_number: 6
  - magician_magic: 6
    performed_force: 2
    expected_target_number: 8
  noticing_spellcasting_modifiers:
  - situation: Observer is Awakened
    target_number_modifier: -2
  - situation: Observer is astrally perceiving
    target_number_modifier: -2
  - situation: Shamanic mask is visible
    target_number_modifier: -2
  - situation: Shaman is performing magic with Totem Advantage
    target_number_modifier: -1
  - situation: Magician casts a fetish-limited spell
    target_number_modifier: -1
  source_limits: The page does not settle how multiple listed situations combine with
    every Perception modifier, nor replace astral perception/special spell recognition
    rules.
  canonical_reuse:
  - rule.tests.target-numbers
  - rule.magic.astral-perception
  - rule.magic.spell-characteristics
  lineage: Original FASA7001 perception of a magical act, not later supplemental magical-detection
    effects.
record_type: rule
status: source_reviewed
source: source.sr3-core
edition_scope: FASA Corporation, Shadowrun Third Edition, FASA7001, original core
  only; advanced supplements and later editions require separate lineage evidence
