id: rule.magic.mits-free-insects-original
record_type: rule
status: reviewed
source: source.mits
printed_pages: '132'
pdf_pages: '133'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: Free insect spirits — original freedom tests, advancement and true-name restriction
summary: Fictional tabletop rules from FASA Corporation's Magic in the Shadows (FASA7907, Shadowrun Third Edition), printed p132/PDF133.
data:
  freedom:
    hive_normal: Queens normally are the only hive spirits that become free; subordinate insects ordinarily perish with their Queen.
    hive_exception: Unusual circumstances permit subordinate freedom when Queen dies, particularly good merges.
    solitary: More likely to go free than hive spirits, especially Mothers.
    gm_discretion: GM may decide freedom; free insect spirits are rare.
    optional_test_trigger: Queen or Mother death
    test_dice: individual insect spirit Force
    normal_target_number: 2 * Queen_or_Mother Force + Queen_or_Mother Spirit Energy
    good_merge_target_number: Queen_or_Mother Force + Queen_or_Mother Spirit Energy
    success: individual spirit becomes free
  immediately_free:
    free_spirit_powers: 1D3
    spirit_energy: 1
    bound_to_queen_or_shaman: false
    other_abilities_retained: true
    advancement: ordinary free spirit rules (MitS p114)
    may_summon_or_produce_other_insect_spirits: false
  spirit_feeding:
    availability: many free insect spirits gain this ability, not universal
    power: Essence Drain (Critters p10), restricted to spirits as targets
    drained_force_points_per_karma_point: 4
  free_spirit_roles: [trickster, shadow, hunter]
  true_name_quest:
    eligible_magicians: insect shamans only
    other_questers_outcome: the fictional source specifies death or insanity
  existing_canon: [rule.spirits.free-insect-spirits]
