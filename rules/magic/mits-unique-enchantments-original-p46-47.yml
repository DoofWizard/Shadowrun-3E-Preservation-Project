data:
  canonical_context: procedure.magic.unique-enchantment
  creation_skill: Enchanting
  eligible_forms: [focus, alchemical radical, fetish made with specified raw materials]
  purpose: A unique enchantment can meet a particular adventure requirement even without a direct magical effect of its own.
  optional_uses:
    specific_free_spirit: A spirit focus may be designed for conjuring a particular free spirit; related unique items may instead contain that spirit or serve as a shrine or statue in which it survives loss of mana.
    spirit_commission: A spirit commissioning an item may encode its true name in the formula supplied to the enchanter.
    exceptional_alchemy: A particular alchemical material may be required to overcome ancient magic beyond the reach of ordinary methods.
    unusual_focus: A fictional dragon may demand a focus made to an ancient formula in exchange for a service; obtaining the formula may itself be an adventure requirement.
  effect_scope:
    ongoing_reusability_required: false
    guidance: Even exceptionally powerful adventure-specific effects need not continue to function after their intended use; the effect may depend on a particular target, moment or rare condition.
    illustrative_recurrence_years: 127
    recurrence_is_example_not_general_rule: true
  adjudication: The book offers examples rather than universal target numbers, costs or construction durations for unique enchantments.
framing: newsroom_neutral
headline: 'Fictional Shadowrun Third Edition GM guidance: Unique Enchantments, FASA7907, printed 46-47/PDF 47-48'
summary: 'FASA Corporation, Magic in the Shadows; optional item forms, scenario-specific uses and restrictions on continued access to exceptional magical effects.'
