id: rule.magic.mits-free-spirit-powers-original
record_type: rule
status: reviewed
source: source.mits
printed_pages: '116-118'
pdf_pages: '117-119'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7907 free spirit powers and acquisition (SR3)
summary: FASA Corporation, Magic in the Shadows (FASA7907), fictional SR3 tabletop rules, printed pp116-118/PDF117-119.
data:
  acquisition: On becoming free gain 1D3 powers; each Force increase grants another if 2D6 is at least the new Force. GM selects or rolls powers; random generation is a distinct procedure.
  animal_form:
    metadata: [P, Exclusive Simple, Self, Special]
    initiative_bonus: 10
    transition: Exclusive Simple to materialize or return to astral; maintenance requires no effort.
    form_choice: Nature spirits usually choose animals native to their domain; elementals rarely use animal forms, usually large powerful ones.
  astral_gateway:
    metadata: [M, Exclusive Complex, LOS, Sustained]
    eligibility: Magicians and nonmagicians may project to astral space or the native metaplane.
    essence_loss: None while spirit guards the physical body.
    abandonment: Gateway closes when guard ceases; full magicians may try ordinary return to body, others die immediately. Noninitiates abandoned on a metaplane die immediately.
    possession_exception: Normally willing subjects; a spirit with Possession can force even a mundane subject into astral combat to attempt possession, but may not use Gateway to strand a subject deliberately to die.
  aura_masking:
    metadata: [M, Automatic, Self, Always]
    test: Initiate Magic Test against spirit Force; successes required equal difference between grade and Spirit Energy.
    success: Reveals masking and native metaplane, not true aura itself.
    quest_rating: Force + Spirit Energy
    quest_success: True aura, true name and ordinary assensing information.
    spirit_viewer: GM secret Force Test as for Masking, or GM may allow automatic penetration; deliberate masking also available.
  dispelling:
    metadata: [M, Complex, LOS, Instant]
    effective_sorcery: Force + Spirit Energy
    procedure: Standard dispelling, SR3 p184.
  hidden_life:
    metadata: [P, Automatic, Special, Always]
    destruction: Destruction of hiding place destroys spirit; while intact even true name cannot permanently banish or destroy it. Failed regeneration causes temporary disruption.
    hiding_place_armor: Force + Spirit Energy
    hiding_place_armor_applies_to: [magical damage, mundane damage]
    animal: Immunity to age, normal weapons, pathogens and toxins; regeneration; all Attributes increase by Force; animal is controlled by spirit.
    metahuman: Source presents analogous benefits as speculation; effects on body and mind unknown. GM may assign Mental Flaws totaling Spirit Energy, increasing with it.
  human_form:
    metadata: [M, Exclusive Complex, LOS, Sustained]
    transition: Text specifies Exclusive Simple to materialize or return to astral, no effort for maintenance; retain discrepancy with header.
    initiative_bonus: 10
    destruction: Destruction of materialized form disrupts spirit.
  personal_domain:
    metadata: [P, Automatic, Special, Always]
    nature_spirit_restriction: Site must be in domain appropriate to spirit type.
    worked_effective_force_example: {force: 4, spirit_energy: 3, effective_force_for_powers_inside_domain: 10}
    possession: Spirit with Possession may initiate astral combat against any subject in its domain, regardless of willingness or astral activity; possession possible on victory.
    destruction: Domain cannot be changed after selection; physical destruction or drastic alteration removes enhanced power.
    destruction_example: A swamp spirit loses its expanded power when its selected marsh is converted to a landfill.
    speculation: Source presents possible transformation into toxic spirit after domain destruction as speculation, especially pollution.
  possession: Uses power on printed p99; no new standalone resolution in this paragraph.
  sorcery:
    metadata: [M, Varies, Varies, Varies]
    free_allies_always_have_power: true
    spell_pool: Force
    starting_skill: Spirit Energy
    advancement: Good Karma for skills and spells; no ordinary magical tools, teacher or formula required; normal learning time.
    drain: none
    maximum_spell_force: spirit Force
    targeting: Normal spell targeting rules; physical-plane spells require materialization.
  wealth:
    metadata: [P, Exclusive Complex, LOS, Permanent]
    base_nuyen: 1000 * Force
    multiplier: Sum of Spirit Energy dice, not one die plus Spirit Energy.
    interval_days: 30
    example: Force 4 and Spirit Energy 3 produce 3D6 * 4000 nuyen.
    material: Precious metals or stones; other valuables possible; created material is magical on assensing and permanently bears creator's astral signature; resale subject to market and fencing.
  comparison: Adds missing metadata, test thresholds, transitions and exceptions to historical rule.spirit-powers records and corrects Wealth dice and Gateway eligibility. Existing animal and human attribute formulas, personal-domain area and doubling, and p99 Possession rules are reused rather than repeated.
