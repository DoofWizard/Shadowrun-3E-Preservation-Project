printed_pages: '102-104'
pdf_pages: '103-105'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7907 Magic in the Shadows (SR3) - Loa conjuring, services and serviteurs
summary: FASA Corporation's fictional Shadowrun Third Edition supplement Magic in the Shadows (FASA7907), printed 102-104, PDF 103-105.
data:
  summoning:
    eligible: Only houngans; any loa type is eligible.
    nonpatron_bound_limit: 1
    patron_bound_limit: 1
    patron_excluded_from_nonpatron_limit: true
    patron_summoning_bonus_dice: 2
    conjuring_target_number: Force
    extra_dice: Applicable loa spirit foci.
    service_per_success: 1
    action: Exclusive Complex
    expiration_hours: 12
    expiration_basis: Measured from summoning irrespective of time of day.
    drain_attribute: Charisma
    drain_target_number: Force
    drain_modifiers: Apply all applicable loa advantages and spirit foci.
    drain_level: Same as nature spirit or elemental summoning (SR3 p187).
    drain_unconscious_summoner: Spirit departs.
  service_details:
    materialization: Not available; astral manifestation follows projecting magician rules (SR3 p173).
    attribute_ratings: All spirit Attributes equal Force.
    astral_services: Powers benefiting the summoner and any watcher task; possession is the other service.
    possession_hosts: Summoner or serviteur; use Possession p99.
    possession_cancels_remaining_services: true
    simultaneous_possessing_loa_per_houngan: 1
    other_loa_when_houngan_possessed: Other loa depart and their services end.
    host_physical_attributes: Increase each by spirit Force.
    host_mental_attributes: Equal spirit Force.
    host_state: Spirit controls the body; host is unconscious and retains no memory of the interval.
    host_power_access: Spirit can employ any of its powers through the body as if materialized.
    other_houngan_control: Not permitted while the spirit occupies a living body.
    exorcism: Any magician tradition may banish it from the host (SR3 p189).
    end_condition: Task completion or 12 hours, whichever comes first; exorcism can end possession earlier.
    departure_damage: (Force)D Stun
    departure_resistance: Host Willpower; apply loa advantages whether departure is voluntary or not.
  domain_clarifications:
    domain_scope: Domain determines where domain-specific powers function, not where a loa may exist.
    examples: Agwe Search only on open water; Shango Concealment only in storms or near fires.
    Erzulie_influence: love or lust
    Ghede_domain: Graveyards or any location with numerous corpses, such as a mortuary.
    Legba_domain: On or near the junction of two roads, streets or paths.
    Ogoun_domain: Site of any ongoing combat.
    Ogoun_great_form: Immunity to fire and normal weapons.
  serviteurs:
    prerequisite: Sincere belief and commitment to the fictional tradition; a houngan performs the initiation ritual and checks sincerity beforehand.
    false_pretenses_allowed: false
    effect: Ritual establishes the magical link allowing possession by loa summoned by a houngan.
    player_character_karma_cost: 10
