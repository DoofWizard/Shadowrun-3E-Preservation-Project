id: rule.magic.mits-blood-spirit-original
record_type: rule
status: reviewed
source: source.mits
printed_pages: '134'
pdf_pages: '135'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: Original Blood Spirit game statistics and summoning parameters
summary: FASA Corporation, Magic in the Shadows (FASA7907, Shadowrun Third Edition), printed p134/PDF135; fictional tabletop RPG mechanical supplement to entity.spirit.blood-spirit and procedure.magic.summon-blood-spirit.
data:
  supplements: [entity.spirit.blood-spirit, procedure.magic.summon-blood-spirit]
  attributes: {B: 'F+1', Q: '(F+2)x3', S: 'F-2', C: F, W: F, I: F, E: F/A, R: 'F+1'}
  initiative: {physical: '(F+1)+10+1D6', astral: '(F+1)+20+1D6'}
  maximum_force_table:
    - {fictional_sacrifice_category: Small animal, maximum_force: 1}
    - {fictional_sacrifice_category: Medium animal, maximum_force: 2}
    - {fictional_sacrifice_category: Large animal, maximum_force: 3}
    - {fictional_sacrifice_category: Mundane sentient, maximum_force: Essence}
    - {fictional_sacrifice_category: Awakened sentient, maximum_force: Magic}
  awakened_animal_maximum_force_bonus: 1
  great_form_eligibility: The fictional sacrifice is an initiate or comparably Awakened critter; invoking is available to the conjurer.
  ritual_hours: desired Force
  services_per_conjuring_success: 1
  binding_control_and_remote_service: Same as SR3 elementals.
  fictional_spirit_limits:
    maximum_distance_from_sentient_beings_meters: 'Force x 100'
    additional_essence_cap: Force
    replenishment: Essence Drain restores lost Essence; a spirit prevented from replenishing turns on its summoner.
    freed_spirit: Always turns on its summoner when freed.
    free_spirit_essence_loss: 1 point per week instead of 1 point per day.
    free_spirit_pact: May enter a Spirit Pact with a magical threat.
