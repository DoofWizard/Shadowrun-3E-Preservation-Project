    source_comparison_limits:
      - The supplement lists Toxin Power for Antidote and Detox, while the pinned core stat lines use Toxin Strength; preserve the literal difference without inferring a new formula.
      - Hibernate's supplement row bears V; the pinned core effect expressly permits a voluntary or unconscious subject. The table notation must not silently erase that exception.
      - Heal and Treat use Damage Level in the supplement Drain column and Patient Wound Level in the core record; the core wound-level basis and timing remain recorded separately.
      - Stabilize's abbreviated target does not replace the core elapsed-minute condition or minimum Force requirement.
