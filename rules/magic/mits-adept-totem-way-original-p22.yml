headline: FASA7907 Magic in the Shadows (SR3) — Totem Way
summary: Fictional Shadowrun tabletop RPG rules from FASA Corporation, printed p22/PDF23. The initiation exception and its limits are retained.
data:
  totem_relationship:
    character_model: Adept treats the totem as an ideal to emulate rather than the ordinary shamanic relationship.
    geasa: Often adopted on abilities to model shamanic totem modifiers; not stated as mandatory.
    behavior: The adept observes the totem's behavioral restrictions and limitations.
  initiation:
    astral_quest_ordeal: Permitted for followers of the Totem Way (MitS p57).
    exception: The totem provides passage to the metaplanes only during the astral quest ordeal and guides the adept back safely afterward.
    restrictions: Does not otherwise permit astral projection or metaplanar travel.
