    original_pdf_sha256: 7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914
    nature: fictional tabletop role-playing game original rulebook
    printed_pages:
    - 182
    physical_pdf_pages:
    - 191
  source_heading: Magic / Sorcery Test / Object Resistance Table / area and detection
    spell cases
  sorcery_test:
    dice: Allocated Sorcery skill dice, optionally supplemented by allocated Spell
      Pool dice.
    spell_pool_cap: Spell Pool dice added to the test cannot exceed the number of
      Sorcery dice allocated to it.
    zero_successes: The spell fails and has no effect.
    all_ones: The spell fails, and the target number of the subsequent Drain Resistance
      Test is increased by +2.
  area_spell_test:
    roll: One Sorcery Test for the area spell.
    resolve: Compare its successes separately against each valid target’s target number,
      and make a separate Resistance Test for each valid target.
    limits: Only valid targets in the radius are affected.
  detection_spell_test:
    roller: Gamemaster rolls Sorcery Test secretly.
    ordinary_report: Gamemaster reports what the target/caster learns from the test.
    failed_test: The gamemaster may give no result or express uncertainty.
    all_ones: The gamemaster gives misleading or false information.
  living_target_base:
    mana_spell: Normally use target Willpower.
    physical_spell: Normally use target Body.
  object_resistance_table:
    target_number_by_category:
    - category: Natural Objects
      examples: Trees, Soil, Unprocessed Water
      target_number: 3
    - category: Manufactured Low-Tech Objects and Materials
      examples: Brick, Leather, Simple Plastics
      target_number: 5
    - category: Manufactured High-Tech Objects and Materials
      examples: Advanced Plastics, Alloys, Electronic Equipment
      target_number: 8
    - category: Highly Processed Objects
      examples: Computers, Complex Toxic Wastes
      target_number_minimum: 10
      notation: 10+
  nonliving_target_rules:
    materials_rule: Target number for a spell cast against a nonliving object depends
      on material or manufacturing complexity according to the table.
    processed_object: Higher technology/processing makes an object harder to affect
      with magic.
    minimum_force: Affecting an object requires the spell Force to be at least half
      the Object Resistance, rounded down.
    vehicles: Vehicles add Body and half armor to armor resistance before dividing
      in half, as stated for this object-resistance case.
  conditions: Visibility/cover and distractions/injury can modify relevant casting
    target numbers; original printed p182 refers to the main modifiers elsewhere without
    restating their values.
headline: FASA Corporation Shadowrun, Third Edition FASA7001 fictional Sorcery Test
  and Object Resistance Table, original printed p182/PDF191
summary: Exact original tabletop Spell Pool cap, all-ones failure, area/detection
  spell resolution, and object-resistance target numbers 3/5/8/10+ with Force threshold.
