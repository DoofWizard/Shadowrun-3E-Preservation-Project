  adept_focus:
    eligibility: Adepts only; variant of power focus.
    effective_magic_bonus: Force
    additional_power_points: 0
    effects: Raises effective Magic for active-power limits, tests, ranges and other effects based on current Magic.
    drain_resistance_bonus_dice: Force
    changes_drain_type: false
    cost_and_bonding: Same as spirit focus of equal Force.
  infusion_focus:
    effect: Grants one dedicated adept power not normally possessed for as long as the focus is bonded and active.
    enchanting: An adept possessing the designated power must participate in enchanting.
    bonding: Another adept possessing that power must be present to teach the bonding adept to use the focus.
    rating_formula: power point cost * 2
    example: {power: Combat Sense 2, focus_rating: 4}
    counts_toward_active_power_limit: true
    excluded_power: Magical Power (Magic in the Shadows p22)
    cost_and_bonding: Same as spell category focus of equal Force.
    availability: {target_number: 8, base_time_hours: 72}
  scope: Exact new focus effects and cost dependencies; existing spirit and spell-category focus prices are not restated or changed.
