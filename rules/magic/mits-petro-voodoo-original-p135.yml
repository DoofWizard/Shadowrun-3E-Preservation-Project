headline: Petro houngan — Potency, loa and zombie-control rules
summary: Source-specific fictional Shadowrun Third Edition RPG mechanics from FASA Corporation's Magic in the Shadows (FASA7907), printed p135/PDF136.
data:
  tradition: Voodoo shamanic magical threat; the book compares its NPC behavior to that of the avenger toxic shaman.
  potency: The Petro houngan gains Potency by achieving goals appropriate to the character's corrupted objectives, under the magical-threat rules.
  summoned_loa_abilities: Same as standard loa spirits.
  zombie_control_limit: (Charisma + Potency) * 2
  standard_zombie_control_limit_reference: rule.magic.mits-zombies-original
  general_potency_reference: rule.magic.mits-potency-original
  loa_reference: rule.magic.mits-loa-conjuring-services-original
