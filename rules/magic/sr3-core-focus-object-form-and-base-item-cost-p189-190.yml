    missing_substance: The inspected accepted p190 focus action, bonding, p191 weapon/sustaining
      focus and p305 focus market records provide Force, action, eligible-form and
      prices but do not explicitly encode the p189-190 ordinary functional base-object
      additional nuyen cost and general form eligibility together.
    source_assertion_distinctions: These are published fictional game purchasing and
      focus-form constraints. Weapon focus combat/form restrictions are not generalized
      to other foci, example object shapes are nonexclusive, and pricing is contingent
      on mundane function instead of an unconditional surcharge.
    limits: This receipt documents the original-page review and source comparisons,
      not a complete rulebook audit or runnable game-engine verification.
