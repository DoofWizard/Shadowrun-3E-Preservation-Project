    section: Magic / Foci / Form, immediately preceding Bonding
  form_rules:
    focus_is_physical_object: true
    generic_foci_form: Non-weapon foci and fetishes can assume many physical forms
      that the character can carry or use, with the source giving examples across
      shamanic and hermetic magical traditions.
    weapon_focus_form_exception: Weapon foci are physically weapons; the separate
      original p191 weapon-focus passage excludes missile weapons from enchantment
      as weapon foci.
    examples_are_not_compulsory: The publication describes drums, rattles, knives,
      carvings, masks, mojo bags, staves, wands, rings, amulets, bracelets, computer
      decks and lighters as illustrative forms, not a mandatory exhaustive item list.
    nonmagical_use: A mundane physical object may also be enchanted as a focus, including
      an object serving a practical function apart from its focus effect.
  market_and_cost:
    sourcing: The fictional source describes foci sold by talismongers, and notes
      that higher-Force foci are less readily available; use the separate original
      Street Gear market record for exact Availability and focus nuyen pricing.
    additional_base_cost_condition: When the physical item has an ordinary, nonmagical
      function other than purely ornamental use, its mundane item price is owed in
      addition to the magical focus price.
    only_focus_price_for_ornamental_object: The p189-190 passage imposes no distinct
      extra base-item cost on strictly ornamental objects; the regular magical focus
      price and any other independently sourced rules still apply.
    cost_stack_operation: Total nuyen cost for a focus built into a nonornamental
      functional object is focus market price plus ordinary base-item market price;
      do not replace one cost with the other.
    bonding_karma_distinct: The separate p190 bonding Karma cost is not the same as
      the purchase nuyen price, and remains governed by the accepted Focus Bonding
      Table.
  source_constraints:
    no_extra_form_restrictions: The examples do not establish a mandatory tradition-specific
      shape, material formula or new gear price.
    no_new_mundane_price: No specific price for a lighter, cyberdeck, blade or other
      base object is inferred here; look up that item in its own authorized table.
    weapon_focus_detailed_restrictions: Use the separately accepted p191 weapon-focus
      conditions for enchantment limits, orichalcum, use and deactivation.
