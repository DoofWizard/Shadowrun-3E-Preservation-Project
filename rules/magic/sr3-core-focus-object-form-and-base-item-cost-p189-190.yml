headline: 'FASA Corporation Shadowrun, Third Edition FASA7001 fictional tabletop Magic
  foci: original physical form and mundane base-item cost, printed pp189-190/PDF198-199'
summary: 'Original FASA7001 p189-190 source reviewed: non-weapon foci may use carryable
  or usable physical objects; functional nonornamental objects require their ordinary
  nuyen price in addition to the magical focus price. Weapon focus restrictions and
  bonding Karma are separately preserved.'
