  running_ways:
    purpose: Adept ways guide character personality, power development and roleplaying; individual ways beyond those presented are possible.
    gamemaster: Encourage players to define personal paths and incorporate them into plot and development.
  the_lost:
    affected: Adepts without a way or who have departed from their way, including those acting against their original convictions.
    optional_power_cost_increase_percent: 25
    application: At gamemaster discretion, the cost of adept powers may increase for affected adepts.
    optional_power_loss: Adepts who lose their way may also lose powers until they regain focus.
