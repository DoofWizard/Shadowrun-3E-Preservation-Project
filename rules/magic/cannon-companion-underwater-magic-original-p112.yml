id: rule.magic.cannon-companion-underwater-magic-original-p112
record_type: rule
status: ingested
source: source.cc
printed_pages: '112'
pdf_pages: '113'
edition_scope: SR3
content_class: [rule_exact]
data:
  publication: {title: Cannon Companion, publisher: FASA Corporation, catalog_number: FASA7908}
  extends: subsystem.environment.underwater
  tabletop_rules:
    geasa_and_centering: equipment may restrict speech or movement required for a geas or Centering skill
    astral_visibility_reference: Magic in the Shadows p82
    detection_spells: may compensate for poor visual conditions, but not for spellcasting purposes
    oxygenate: subject is immune to underwater game-health hazards except HPNS
    illusions: reduced underwater perception can make detection harder; physical illusion size and distance are refractively altered, mana illusion size and distance are not
    illusion_plausibility_example: an apparent human at extreme depth without protective gear is not believable in the game
    elemental_manipulations:
      blast_and_fire: automatically fail underwater; caster still resists Drain
      earth_ice_acid: targets receive -1 to Spell Resistance Test target numbers
      water: works normally
    conjuring:
      astral_presence: any spirit type can appear normally in underwater astral space; materialization restrictions are distinct
      earth_water: can be conjured in underwater habitats when sufficient appropriate materials are present; both may materialize and act normally underwater, except earth elementals suffer character underwater combat penalties
      air_fire: cannot be conjured in enclosed underwater habitats and cannot materialize underwater
      water_spirit_domains: [lake, river, sea, swamp, undines]
      water_spirit_guard: protects against all underwater game-health hazards including HPNS
      hearth_domains: inhabited undersea research stations and mining colonies
      spirits_of_man_domains: seagoing ships and submarines with a long-term resident crew
      toxic_domains: ruined underwater sites including polluted waste locations; Magic in the Shadows p126
framing: reference_exact
headline: "FASA7908 Cannon Companion (SR3) - Underwater spellcasting and conjuring exceptions"
summary: "FASA Corporation, fictional Shadowrun Third Edition tabletop rules; source.cc, printed pp112, PDF pp113. Source-specific additions and clarifications to the existing subsystem."
