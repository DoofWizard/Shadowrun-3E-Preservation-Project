headline: FASA7907 Magic in the Shadows (SR3) - Thought Forms
summary: Original fictional tabletop game mechanics, FASA Corporation, printed p27/PDF28.
data:
  nature: An incorporeal spirit associated with the summoning psionic's subconscious; can materialize physically.
  summoning: Use the nature-spirit summoning procedure in SR3 p186.
  maximum_active_per_psionic: 1
  duration_hours: 24
  earlier_expiration: Vanishes when all owed services are expended.
  domain_restriction: None
  movement_range_meters: (Willpower + Charisma + Magic) * 10, using the summoner's attributes.
  destination: May travel anywhere directed by the summoner within the stated range.
  banishing: Other psionics and other magicians may banish a thought form.
  free_spirit: May become a free spirit under MitS p113; may exhibit aspects of the summoner's psyche.
  attributes:
    B: F + 1
    Q: F + 2
    S: F - 2
    C: F
    I: F
    W: F
    E: F/Z
    R: F + 1
  initiative:
    physical: F + 11 + 1D6
    astral: F + 20 + 1D6
  attack: (STR)M
  powers:
    - Materialization
    - Psychokinesis
    - Search
  source_notation: F is Force; the Essence entry F/Z is retained as printed without guessing its meaning.
