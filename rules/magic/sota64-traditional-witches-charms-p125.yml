data:
  publication: {title: 'State of the Art: 2064', publisher: FanPro, catalog_number: FanPro25004, edition: Shadowrun Third Edition, chapter: Old World Magic, section: 'Traditional Witches and Charms', printed_pages: '125', physical_pdf_pages: '126'}
  tradition:
    base: Shaman rules without totem or idol bonuses or disadvantages.
    conjuring: Nature spirits as shamans; may substitute ancestor spirits for spirits of man. Individual witches may qualify as urban shamans even in villages.
    sorcery: Restricted to ritual sorcery and a form of anchored spells; knows anchoring metamagic from outset in exchange for non-ritual sorcery.
    hexes: Normal spells attached to handcrafted objects under anchoring rules; ordinary anchoring conditions apply.
    full_magician: Most are full magicians subject to these limitations.
    aspected_options:
      standard: Sorcerer or conjurer under standard rules.
      healer: Healing spells normally, plus spirits of man or ancestor spirits; other standard aspected rules.
      diviner: No sorcery or conjuring; divination metamagic without initiation.
    references: [MITS p16, MITS p70, MITS p71]
  charms:
    eligible_creator: Traditional witch only.
    preparation: Handcrafted suitable item, no formula.
    enchanting_target_number: 6
    investment_good_karma: 1
    transfer: Must be freely given; recipient automatically bonds without cost.
    owner_eligibility: Awakened or mundane.
    activation: Touch as Simple Action, expend stored Karma only to reroll a test.
    one_use: Item aura extinguished and cannot hold future charms or serve as focus.
    personal: Individual owner only; use one at a time.
    simultaneous_bonded_charms: All other charms bonded to that person become inert without benefit when one is used, regardless of whether carried.
    other_purposes_force: 1
    other_purposes_examples: [Focus Addiction, Astral Combat]
    market_row:
      name: Charm
      availability: 4/48 hours
      cost_nuyen: 1000
      street_index: 2
      bonding_cost: 0
