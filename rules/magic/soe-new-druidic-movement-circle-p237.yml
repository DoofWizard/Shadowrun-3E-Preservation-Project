headline: FanPro Shadows of Europe (FanPro25002), Shadowrun Third Edition fictional New Druidic Movement circle, printed p237 / PDF238
summary: "Original typical NDM circle: membership in multiples of three, six strictures, Luxury resources, dues, patron, preferred ordeals and metamagic."
data:
  section: The New Druidic Movement
  scope: GM may use this typical circle for characters who want membership; some Inner Circles differ substantially.
  type: [Initiatory, Conspiratorial (Temporal Power)]
  membership_multiple: 3
  usual_members: [9, 27]
  strictures:
    Attendance: Major Druidic festivals.
    Limited Membership: Hermetic Druids only.
    Material Link: Required.
    Oath: Required.
    Obedience: Required.
    Secrecy: Required.
  resources: Luxury
  dues: High; occasional extraordinary contributions may be requested. No fixed nuyen amount stated.
  patron: NDM; circles have connections among fictional British nobility, government departments and megacorporations.
  customs: Initiation grades distinguished by titles and symbolic regalia such as robes, laurels and torcs. Metamagical research is highly valued.
  preferred_ordeals: [Astral Quest, Oath, Thesis]
  popular_metamagic: [Channelling, Cleansing, Invocation, Sensing]
  geasa: Druids dislike adopting geasa because of restrictions on freedom of action; not a formal prohibition.
  general_rules_reference: subsystem.magic.magical-groups; use existing general group mechanics, not a new generic group rule.
