data:
  publication:
    title: 'State of the Art: 2064'
    publisher: FanPro
    catalog_number: FanPro25004
    edition: Shadowrun Third Edition
    corrected_source_version: 1.0 December 2005
    chapter: Games of State
    section: Game Information / New Spells
    printed_page: 33
    physical_pdf_page: 34
  learning_scope: Ordinary magicians may learn these fictional intelligence spells
    if they have the appropriate agency contacts; no independent numerical cost printed.
  spells:
    sound_barrier:
      spell_category: Illusion
      type: P
      target_number: 4
      duration: S
      drain: +1 (M)
      referenced_source_spell: Silence, SR3 p196
      game_effect: Creates a perimeter that blocks sound traveling across the area
        boundary, rather than blanketing the full area in silence.
      inside_sounds: Sounds wholly inside remain audible inside; only crossing boundary
        is muffled/silenced
      outside_sounds: Sounds wholly outside remain audible outside; only crossing
        boundary is muffled/silenced
      frequency_scope: Also affects infrasound and ultrasound
    word_recognition:
      spell_category: Detection
      type: M
      target: W
      duration: S
      drain: (M)
      related_spell: Limited, less intrusive variation of Mind Probe; does not reveal
        entire mind
      target_restriction: Person within caster line of sight
      stimulus: Send a person name, image or single-word concept, detect minimum degree
        of familiarity by successes
      target_awareness: Target notices concept rising to attention inexplicably and
        may notice spellcasting as normal
      success_table:
      - successes: '0'
        recognition_level: none
        affirmative_if: Never; no response
      - successes: '1'
        recognition_level: fleeting
        affirmative_if: Knows a name, heard a term or previously heard of the place/person
      - successes: '2'
        recognition_level: minor
        affirmative_if: Met person, visited place once, or has textbook understanding
          of term
      - successes: 3-4
        recognition_level: solid
        affirmative_if: Met person several times recently, frequented place, or in-depth
          knowledge of term
      - successes: 5+
        recognition_level: intimate
        affirmative_if: Close friend, buddy, lover or boss; strong emotional attachment
          to place; or vested interest in term
      table_interpretation: Results detect minimum recognition only and depend on
        whether subject actually meets named threshold; more casting successes do
        not by themselves force a positive recognition against unfamiliar subject.
  scope_boundary: Only New Spells and Word Recognition success table on printed p33/PDF34;
    adjacent ordinary fictional narrative example is explanatory, not an independent
    modification of numbers.
