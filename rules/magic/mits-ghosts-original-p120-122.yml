id: rule.magic.mits-ghosts-original
record_type: rule
status: reviewed
source: source.mits
printed_pages: '120-122'
pdf_pages: '121-123'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: Ghosts — haunt, chain, apparition and specter mechanics
summary: Fictional SR3 tabletop game rules from FASA Corporation, Magic in the Shadows (FASA7907), printed pp120-122/PDF121-123.
data:
  general:
    force_rating: As for other spirits; powers vary individually.
    behavior: Some ghosts are hostile only when attacked or subjected to banishment; others may attack living beings without provocation.
    haunt: A place functioning like a nature spirit domain. The source reports no successful nature spirit summons in a ghost haunt, suggesting mutual exclusion. Domain-dependent powers can include Accident, Confusion, Possession and Guard against beings entering the haunt.
    chain: A physical anchor; banishing requires destruction of the chain or possession of it by the banishing magician.
  apparition:
    materialization: false
    manifestation: Visible and audible, without direct physical effects on the physical world or its characters through powers.
    powers: May have any specter power and use it on astral characters.
    combat: Can fight in astral combat when attacked; hostile apparitions may initiate attacks on astral intruders.
    astral_defeat_or_banishment: Destroyed unless it has a chain, in which case it is disrupted.
    chained_return_days: 28 - Force
  specter:
    materialization: true
    combat: Astral combat, or physical combat while materialized.
    astral_defeat_or_banishment: Permanent destruction unless it has a chain; with a chain it is only disrupted.
    physical_defeat: Disruption only.
    domain_powers: Restricted to haunt.
    task_resolution: Specters whose existence is tied to an unresolved task vanish permanently once that task is completed; not all specters have such a task.
    powerful_specters: Some very powerful specters possess free-spirit powers, most commonly Hidden Life, Possession and Sorcery.
    materialized_power_use: Standard spirit materialization and power rules apply.
    attributes: {B: F+1, Q: F-2, S: 'F+2 (x 3)', C: F, W: F, I: F, E: F/A, R: F+1}
    attack: STR(M)
    initiative: F + 11 + 1D6
    astral_initiative: F + 20 + 1D6
    required_power: Materialization
    optional_powers: [Accident, Compulsion, Confusion, Fear, Hidden Life, Noxious Breath, Paralyzing Touch (or Howl), Possession, Psychokinesis, Sorcery]
    weakness: Optional Allergy to something significant to the living identity; the source gives fire as an example.
  conjuring:
    summoning: Ghosts cannot be summoned.
    binding: Only ghosts with chains are eligible. A magician or mundane holding the chain may attempt the free-spirit binding procedure (MitS p115). A failed attempt is very likely to provoke the ghost to attack the would-be binder.
    banishing: Standard Conjuring; chained ghosts require destruction of the chain or possession by the banishing magician.
    qualification: The text separately states that a ghost with a chain is disrupted rather than destroyed by astral defeat or banishment. It does not explicitly resolve whether holding an intact chain permits permanent banishment; preserve both clauses.
  lineage:
    critters_catalog: entity.critter.specter has a separate Critters source stat line and power list. This record preserves MitS's distinct attack, astral initiative, powers and conditions without asserting automatic supersession.
