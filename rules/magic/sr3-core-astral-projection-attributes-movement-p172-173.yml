data:
  publication:
    title: Shadowrun, Third Edition
    publisher: FASA Corporation
    edition: Third Edition
    catalog_id: FASA7001
    source_id: source.sr3-core
    source_pdf_sha256: 7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914
    printed_pages:
    - 172
    - 173
    physical_pdf_pages:
    - 173
    - 174
    kind: published fictional tabletop role-playing game rules
  source_heading: Magic / Astral Projection / Astral Attributes / Astral Senses /
    Manifestation / Astral Movement / Astral Detection / While You Were Out
  projection_actions:
    enter: Exclusive Complex Action to leave physical body and begin astral projection.
    exit: Exclusive Complex Action to return to physical body.
    during_projection: No Exclusive Actions while astrally projecting; continued projection
      counts as magical activity even though maintaining it takes no action.
  astral_attribute_mapping:
    Strength: Charisma
    Quickness: Intelligence
    Body: Willpower
    Reaction: Intelligence
    initiative_bonus: 20
    initiative_context: Astrally projecting Initiative uses the character astral Reaction
      plus the +20 bonus; source says projection moves as fast as thought.
    mental_attributes_unchanged: true
    mental_modification_scope: Changes to Mental Attributes from spells, cyberware
      or other effects also affect astral form.
  astral_senses:
    available: Sight and hearing operate as normal human senses, with astral assensing
      available; physical speech and sounds are audible.
    unavailable: Cannot taste or smell; physical objects are intangible and cannot
      normally be touched; written abstract information cannot be read merely by viewing
      its astral aura.
    barrier_visibility_modifier: Astral barriers impose a visual penalty equal to
      the barrier Force; physical lighting has no effect on astral visibility.
  manifestation:
    activation_action: Simple Action
    deactivation_action: Free Action
    nature: Astral form becomes a ghostlike visible and audible image to living viewers
      but remains intangible.
    machine_limit: Cameras and microphones cannot capture the manifestation; cyber-eye
      observers can perceive the image through their minds.
  movement:
    normal_meters_per_turn_formula: Intelligence * 4
    fast_kilometers_per_turn_formula: Magic Attribute
    fast_kilometers_per_hour_approx_formula: Magic Attribute * 1000
    fast_movement_limitation: Fast movement does not permit reading detailed surroundings
      or assensing without slowing, though direction and avoidance of astral obstacles
      remain possible.
    flight: Astral forms can fly.
    altitude_limit_km_approx: 80
    solid_objects: Pass through physical solid objects, but cannot pass through the
      earth itself; physical terrain does not impede travel except this limitation.
  astral_passage_detection:
    physical_character_test: Perception Test
    base_target_number: 10
    target_number_modifier_if_awakened: -2
    additional_target_number_modifier_if_can_astrally_perceive_but_is_not_using_it: -2
    result: Success conveys a sensory warning of an astral form passing through the
      subject, not automatic detailed identification.
  physical_body_while_projecting:
    condition: Physical body remains comatose or in deep trance and is usually unaware
      of its surroundings.
    essence_lost_per_elapsed_hour: 1
    death_if_essence_reaches: 0
    essence_recovery_per_minute_after_return: 1
    recovery_limit: Cannot exceed original Essence.
    find_lost_body_test: Willpower Test
    find_lost_body_target_number: 4
    find_lost_body_base_hours: 6
    find_lost_body_duration_formula: 6 hours / successes on the Willpower Test
    source_limited_note: These are game-time and fictional magical mechanics, not
      physiological claims.
  overlap: Reuses already accepted source-reviewed assensing and astral-signature
    mechanics printed pp171-172; this is the distinct astral-projection continuation
    only. Full magic chapter completion is not claimed.
headline: FASA Corporation Shadowrun, Third Edition (FASA7001), fictional tabletop
  astral projection exact rules, printed pp172–173/PDF173–174
summary: Original Magic chapter astral action economy, substituted ratings, movement
  formulas, detection modifiers, physical-body timekeeping and manifestation limits
  for fictional SR3 gameplay.
