id: rule.magic.mits-cultural-tradition-original-conditions
record_type: rule
status: reviewed
source: source.mits
printed_pages: '24-26'
pdf_pages: '25-27'
edition_scope: SR3
content_class: [character_option]
framing: reference_exact
headline: FASA7907 Magic in the Shadows - Cultural tradition game options
summary: FASA Corporation, Magic in the Shadows (FASA7907, Shadowrun Third Edition), printed pp24-26/PDF25-27. Optional fictional game character traditions and their rule qualifications.
data:
  supplements: [subsystem.magic.traditions-expanded]
  general:
    rules: Standard SR3 magical rules apply unless specifically modified.
    examples: The listed traditions and suggested geasa, foci and fetishes are not exhaustive; typical associations are not mandatory prerequisites.
  profiles:
    aborigine_magic:
      page: 24
      usual_path: Almost exclusively shamanic; many wilderness shamans.
      common_totems: [Badger, Crocodile, Scorpion, Shark, Snake, Sun, Moon, Sea, Mountain]
    aztec_magic:
      page: 24
      path: Shamanic.
      common_totems: [Bat, Eagle, Jaguar, Lizard, Moon, Plumed Serpent, Puma, Snake, Sun]
      initiation_context: The fictional setting describes blood magic as common among initiates, not as an eligibility requirement.
    black_magic:
      page: 24
      paths: [hermetic, shamanic]
      usual_shamanic_idols: [Adversary, Horned Man, Seductress]
      optional_variant: The gamemaster may include the fictional Corrupted variant (p134); it is not a universal rule of this tradition.
    chaos_magic:
      page: 24
      usual_path: Hermetic; may interact with multiple spirit beings and totems during astral quests.
    christian_magic:
      pages: '24-25'
      usual_path: Theurgists commonly follow distinct hermetic schools; some shamanic variants exist.
      example_idol: St. George or St. Michael as Dragonslayer.
      spirit_appearance: Some summoned spirits of man take angelic forms.
    druidic_magic:
      page: 25
      celtic_path: Wilderness shaman (p16).
      celtic_totems: [Bear, Eagle, Horse, Snake, Wildcat, Wolf, Wyrm, Sun, Moon, Oak, Wild Huntsman, Great Mother]
      english_path: Hermetic.
      lodge_form: Standing-stone circle in a natural setting.
    egyptian_magic:
      page: 25
      path: Heka pantheistic shaman, no individual patron; Sorcery resembles hermetic practice.
      optional_summoning_modifier:
        gm_discretion: true
        desert_spirits_dice: 2
        other_spirits_of_land_dice: -2
        fixed: true
    romany_magic:
      page: 25
      path: Shamanic, with various idols; some pantheists.
      usual_first_metamagic: Divining (almost always, not required).
    hawaiian_magic:
      page: 25
      path: Shamanic.
      common_totems: [Fish, Gecko, Goose, Shark, Turtle, Whale]
      optional_spirit_substitution: Many kahunas can summon salamanders instead of spirits of man (p105).
      centering_context: Secret language used for spells and rituals including Centering.
    hindu_magic:
      page: 25
      usual_path: Pantheistic shaman with no single patron totem; some follow particular idols.
      example_idols: [Vishnu as Sky Father, Kali as female Wild Huntsman]
      spell_language: Sanskrit is standard in this fictional tradition.
    islamic_magic:
      pages: '25-26'
      path: Hermetic, usually a specific school.
      spirit_kind: Djinn and ifrits are elementals; generally more humanoid manifestations.
    norse_magic:
      page: 26
      path: Shamanic; some pantheists; berserker adepts also common.
      idol_equivalents: [Odin or Wotan as Sky Father or Wild Huntsman, Thor as Dragonslayer, Freya as Great Mother, Loki as Trickster, Tyr as Wise Warrior]
      typical_practices: Rune divination and astral quests.
    qabbalistic_magic:
      page: 26
      path: Hermetic; certain ultra-orthodox sects have a distinct school.
      ally_spirit_example: Golem inhabiting a clay body (p108).
    rastafarian_magic:
      page: 26
      path: Shamanic.
    shinto_magic:
      page: 26
      path: Shamanic, with patron kami, nature totems such as Sun or Mountain, or occasionally animal totems.
      optional_spirit_substitution: Many miko summon ancestor spirits rather than spirits of man (p106).
      optional_focus_form: Paper charms may be expendable spell foci.
    witchcraft:
      page: 26
      paths: [hermetic, shamanic]
      common_totems: [Great Mother, Moon Maiden, Horned Man]
      ritual_timing: Commonly follows lunar cycles; no new numerical timing rule stated.
