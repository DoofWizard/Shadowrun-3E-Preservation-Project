scope:
  applies_to: ["sustained spells compatible with the focus"]
  excludes: []
resolution:
  summary: "A sustaining focus can maintain one compatible sustained spell whose Force does not exceed the focus Force, freeing the caster from the normal sustaining concentration modifier while the focus remains active and in contact with the spell target as required."
  inputs: ["focus Force","spell Force","spell target"]
  outputs: ["sustained spell maintained by focus"]
