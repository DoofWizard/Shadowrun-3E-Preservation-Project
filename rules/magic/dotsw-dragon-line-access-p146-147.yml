data:
  publication: {title: Dragons of the Sixth World, publisher: FanPro, catalog_number: FanPro10666, edition: Shadowrun Third Edition}
  supplements: rule.magic.ring-of-fire-dragon-lines
  access:
    eligible: Anyone with the proper knowledge may access the natural network; Eastern dragon identity is not a prerequisite.
    aspect: The fictional author Dunkelzahn describes Eastern dragons as receiving a stronger and easier response; he regards the network as virtually useless to most of his own brethren.
    identification: Very close astral inspection reveals the aspect; the in-world commentator Talon reports confirming it and describes the lines as not especially powerful.
  balance:
    source_attribution: The later in-world update on p147 attributes the regional damage to a likely mana surge through unbalanced lines, not a demonstrated causal test.
    balanced_condition: The update describes a balanced network as tolerating a surge with limited volcanic activity.
    recovery: The update reports partial restoration of balance through unspecified recent dragon activity and describes the mitigation as temporary unless Ryumyo stops or uses greater care.
  unspecified: No rating, bonus dice, target number, resolution test, surge threshold or balancing procedure is supplied.
framing: reference_exact
headline: Ring of Fire dragon-line access and balance qualifications
summary: FanPro10666 Dragons of the Sixth World (FanPro, 2003, Shadowrun Third Edition), fictional tabletop setting-specific magic reference, printed pp146-147/PDF148-149; preserves access eligibility and attributed balance limitations without assigning numerical modifiers.
