headline: FASA7907 Magic in the Shadows (SR3) - Power Sites and Aspected Power
summary: Fictional tabletop RPG mechanics from FASA Corporation, printed pp84-85/PDF85-86.
data:
  power_sites_and_manalines:
    nature: Beneficial concentrations of mana rather than interference. Sites are typically small and isolated; manalines are rare regional channels that can connect sites. Both fluctuate; manalines may drift, change course, disappear or appear.
    ratings: [1, 5]
    test_bonus: Each turn a magician in the area adds dice equal to site or line rating to Magical Skill and Astral Tests, allocating them as desired like a power focus.
    drain: Does not reduce Drain.
    simultaneous_use: Multiple magicians may use the same site at once.
    gathering: A Talismongering Gathering Test for materials within the area gains dice equal to site or line rating.
  aspected_power:
    applicability: A background count can favor or oppose particular activities, leaving other activities unaffected. GM specifies the aspect and effects rather than applying a universal binary rule.
    examples:
      religious_revival: Worshippers may be unaffected or benefit as at a power site; nonbelievers face ordinary count and opponents of that religion may face a higher penalty.
      toxic_count: Serves as a power site for toxic shamans and ordinary background-count penalty for others.
      specific_skill: The Mojave Desert example is aspected against Conjuring and hinders all use of that skill there.
    gm_guidance: Aspecting may balance magical capabilities of player characters and opposition; the source sets no universal numeric multiplier for stronger penalties.
