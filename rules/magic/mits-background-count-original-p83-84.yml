headline: FASA7907 Magic in the Shadows (SR3) - Background Count
summary: Fictional tabletop RPG mechanics from FASA Corporation, printed pp83-84/PDF84-85.
data:
  definition: Local mana distortion from strong emotional impressions, environmental destruction or absence of nature, or powerful or prolonged magical activity. Positive and negative events qualify; negative sources tend to generate higher counts more rapidly.
  ordinary_rating_range: [1, 5]
  rating_assignment: GM chooses rating from guidelines. If multiple categories apply use only the highest; ratings may change as events and impressions change.
  level_guidelines:
    - {level: 1, criterion: Brief or recent generation, examples: 'Argument, passionate encounter, magical convention, Awakened gathering place, alienating office, hospital, or violence or heroic act within past hour.'}
    - {level: 2, criterion: Many people or prolonged generation, examples: 'Concert, riot, sporting event, revival, maximum-security prison, enchanting workshop, terminal-care ward, cyberware clinic, research facility or large factory.'}
    - {level: 3, criterion: Significant past impression within 100 years, examples: 'Major battlefield, devastated forest, burned residential area, illicit organ clinic, cathedral, monastery, lamasery or shrine.'}
    - {level: 4, criterion: Significant impression with generating conditions continuing, examples: 'Active major battlefield, dragon lair, severe industrial pollution, repeatedly emotionally charged site, sudden mass-death disaster.'}
    - {level: 5, criterion: Historical-scale event or lethally contaminated site, examples: 'Within 5 km of a nuclear blast site, genocide or mass-detention sites, lethal toxic or radioactive waste areas.'}
  persistence: Usually hours or days; stronger events leave more durable impressions. After the source is removed the count fades over hours, days or weeks depending on GM and intensity; Cleansing can remove such counts.
  plane_scope: Simultaneously affects physical and astral mana in the area.
  assensing: Immediately noticeable as astral distortion; reveals general emotional impressions only, not precise imagery, identities or reconstruction of events.
  nonastrally_active_awakened_detection: GM rolls secret Magic Test at TN 12 minus background count when entering; one success reveals presence and approximate level (rating 3 gives TN 9).
  magical_skill_test_modifier: Add rating to Sorcery, Conjuring and Enchanting target numbers on either plane.
  astral_test_modifier: Add rating to all local astral tests, including combat, perception and analysis.
  drain_resistance_modifier: Add one to Drain target number for every two rating points (integer division); rating 1 adds zero, ratings 2 and 3 add one.
  special_cases: Ratings above 5 are mana warps; power sites and aspected power have separate rules.
