id: rule.magic.mits-free-spirit-karma-original
record_type: rule
status: reviewed
source: source.mits
printed_pages: '116'
pdf_pages: '117'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7907 free spirit Karma transfer and advancement (SR3)
summary: FASA Corporation's Magic in the Shadows, fictional tabletop RPG rules, printed 116/PDF117.
data:
  gift:
    source: Voluntary gift of Good Karma from living physical beings; spirit cannot earn it directly or take it involuntarily.
    donor_cost_per_spirit_point: {full_magician: 1, aspected_magician_or_adept: 2, mundane: 3}
    improvement_test: Conjuring versus Force + Spirit Energy; add 2 to TN when acting for another donor.
    success: Improve donation ratio by 1, rounding fractions down; full magician gives 2 spirit Karma per 1 spent.
    attempts: One per payment; failure leaves original ratio in effect.
    example: A mundane owes 3 spirit Karma; pays 9 without assistance, or 6 after successful assistance.
    npc_guideline: GM discretion; suggested available Good Karma equal to NPC Karma Pool.
  growth:
    spirit_energy_cost_per_point: new Spirit Energy rating
    force_increase_one: Good Karma equal to 3 * new Force plus 1 Spirit Energy point.
    convert_spirit_energy_to_good_karma: '1:1'
    example: Force 5 and Spirit Energy 3 can become Force 6 and Spirit Energy 2 for 18 Good Karma; if only 16 Good Karma available, convert 2 Spirit Energy to cover the shortfall.
    skills: Ordinary character skill advancement costs; spirits with Sorcery may learn spells.
    karma_pool_cost_per_point: 10
    karma_pool_condition: GM discretion
    new_powers: Possible upon Force increase; see printed 116-119.
  comparison: Adds exact improvement test, rounding, one-attempt limit, growth costs and conversion to rule.spirits.free-spirit-good-karma.
