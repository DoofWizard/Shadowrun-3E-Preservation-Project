id: rule.magic.mits-idol-original-conditions
record_type: rule
status: source_reviewed
source: source.mits
printed_pages: '160-162'
pdf_pages: '161-163'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: Idol profile original conditions and procedure supplements — FASA7907, SR3 fictional tabletop RPG
summary: FASA Corporation, Magic in the Shadows (FASA7907), Shadowrun Third Edition fictional tabletop RPG, printed pp160-162/PDF161-163. Supplement to existing idol options.
data:
  supplements:
    adversary: {berserk_reference_core_printed_page: 163, toxic_idol_reference_printed_page: 124}
    bacchus:
      continue_action_test: {attribute: Willpower, target_number: 6}
      distraction_trigger: A more interesting, attractive or relaxing alternative presents itself.
    creator:
      unusual_or_unique_encounter_test: {attribute: Willpower, target_number: 4}
      examination_mode: astral perception
      examination_begins: immediately
      examination_duration_turns: 3
      turns_reduced_per_success: 1
      successes_to_ignore_impulse: 3
    dragonslayer:
      conduct: The game character maintains pledged loyalty and is required to act honorably and respectfully, expecting reciprocal conduct.
    great_mother:
      conduct: The game character cannot refuse aid to someone in need and must oppose environmental, social, political and magical corruption under a strict moral code.
      corruption_penalty_dice: -2
      affected_test_scope: not specified by original
    moon_maiden: {advantages: none, disadvantages: none}
    sea_king: {sea_legs_flaw_reference: Shadowrun Companion, reference_printed_page: 24}
    seductress:
      temptation_test_examples: [drugs, BTLs, sex]
      toxic_idol_reference_printed_page: 124
    siren:
      multiple_attacker_spellcasting_modifier: 1
      original_modifier_kind: spellcasting modifier
      target_number_interpretation: Historical option says target-number modifier; original does not explicitly name the modifier basis.
      toxic_idol_reference_printed_page: 124
    trickster: {advantages: none, disadvantages: none}
    wild_huntsman: {berserk_reference_core_printed_page: 163}
    wise_warrior:
      conduct: The game character must observe a warrior code and proper conduct or risk losing the Idol's favor.
