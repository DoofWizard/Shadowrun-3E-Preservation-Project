data:
  section: The Volcanoes of Auvergne
  astral_eruptions_steam_and_lava: Apply the astral construct rules in Target Awakened Lands; astral or materializing lava is described as extremely dangerous, with GM guidance to use it as a challenge rather than arbitrary punishment.
  lava_stone: Strong astral barrier protecting underground sites against intrusion; no numerical Barrier rating specified here.
  astral_travel_through_earth: {base_time_multiplier: 2, minutes_per_meter: 60, reference: 'Magic in the Shadows pp80-82'}
  enchanting_materials:
    minerals_collected_in_auvergne: natural refined materials
    optional_at_gm_discretion: Unusual basalt formations or stones may count as natural radicals or exotic material.
