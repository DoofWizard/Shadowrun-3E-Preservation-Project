  source_heading: Magic / Spells / Duration / Permanent Spell Base Time
  durations:
    Instant: Spell takes effect and vanishes within the same action, even though the
      effect may persist.
    Sustained: The effect continues while the caster actively maintains it.
    Permanent: The effect becomes permanent if maintained for the specified interval;
      otherwise ends as an ordinary sustained spell.
  sustained_spells:
    caster_concentration: Maintaining a sustained spell requires concentration but
      no action by itself.
    ends_when: The spell stops when the caster ceases concentration; an unconscious
      or sleeping caster cannot sustain a spell.
    voluntary_termination: The caster may stop sustaining one or more spells as a
      Free Action.
    after_damage: Caster sustaining a spell and suffering damage must pass a Sorcery
      Test with target number equal to that spell’s Force, plus any injury modifiers,
      to continue.
    target_number_modifier_per_spell: 2
    applies_to: Each sustained spell adds +2 to target numbers for the character’s
      Tests, including Drain Resistance Tests.
    exception: Normal Damage Resistance Tests do not take this +2 sustained-spell
      modifier.
    simultaneous_limit: A caster may simultaneously sustain no more spells than their
      Sorcery rating.
    exclusive_action: Performing an Exclusive action requires dropping any sustained
      spells.
  permanent_spell_base_time:
    unit: Combat Turns
    by_drain_damage_level:
      Light: 5
      Moderate: 10
      Serious: 15
      Deadly: 20
    reduce_base_time: Divide the base time by the number of Sorcery Test successes
      allocated to reducing the base time.
    non_reusable_successes: Successes allocated to reduce the permanent-spell time
      do not count toward the spell’s effect.
    failure_to_sustain: If the caster stops sustaining before the required time, the
      permanent spell’s effect disappears, as for a sustained spell.
  force:
    minimum_force: 1
    maximum_force: Cannot cast a spell at higher Force than the Force at which the
      caster learned it.
    lower_force_allowed: true
    increasing_learned_force: To increase maximum available Force of a learned spell,
      learn the spell again at the higher Force.
