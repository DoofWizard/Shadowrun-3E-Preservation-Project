data:
  publication: {title: Year of the Comet, publisher: FanPro, catalog_number: FanPro10650, edition: Shadowrun Third Edition}
  supplements: rule.magic.yotc-shedim
  p150:
    metaplanar_return: After entering Earth's astral plane, a shedim cannot return voluntarily to the metaplanes.
    true_names: Whether shedim have true names is unresolved in this source.
  p151:
    spirit_energy_use: May be used in the ways described on MITS p114.
    karma_gifts: Karma can also be freely given to shedim according to the free spirit rules on MITS p116.
    karma_pool: The gamemaster may adjust the stated initial pool or advancement amount to suit the game.
    power_assignment: The listed powers are possible powers, not a universal mandatory set; the gamemaster assigns them to each spirit according to threat and role.
    deathly_aura:
      type: P
      chill: Does not freeze water.
      decay: Organic materials decay within the area; the effect does not directly harm living metahumans or critters, but kills insects and small animals such as mice.
    inhabitation:
      type: M
      materialization: Cannot materialize physically; may manifest astral form on the physical plane but requires a vessel for physical action.
  p152:
    prior_vessel_damage: Damage predating inhabitation does not directly affect the spirit and cannot be healed by it; decay and old damage can impair natural vessel abilities.
    post_inhabitation_damage: New damage to the vessel impedes the spirit under ordinary rules and may be healed by its Regeneration power if present.
    ritual_link: A separated flesh sample can decay to an unusable ritual material link after a long-inhabited corpse is vacated.
  p153:
    living_vessel_death: If the living vessel dies, the shedim is ejected into astral space but may immediately attempt to inhabit the resulting corpse.
    karma_drain_type: P
framing: reference_exact
headline: Year of the Comet shedim power assignment and vessel qualifications
summary: Missing source conditions supplement the existing shedim mechanics and tables.
