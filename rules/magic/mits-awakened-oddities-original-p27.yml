headline: FASA7907 Magic in the Shadows (SR3) - Miracle workers and unusual magical paths
summary: FASA Corporation, FASA7907, original fictional Shadowrun tabletop RPG options, printed p27/PDF28.
data:
  miracle_workers:
    magical_rules: Religious belief provides the character's interpretation of ordinary magic; no separate numerical bonus or superior religion is specified.
    spell_presentation: Prayers.
    spirit_presentation: Nature spirits or elementals may appear in forms associated with the character's beliefs.
    religious_trappings_and_rituals: [geasa, fetishes, foci]
  madness_paths:
    player_character_eligible: false
    scope: The unusual magical paths described under Madness on printed p27, not every character with a mental health condition.
    possible_npc_styles: Unusual spirits and a shamanic totem drawn from the character's personal mythology.
    reference: Magical Threats, MitS p123.
