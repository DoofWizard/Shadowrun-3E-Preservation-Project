headline: FASA7907 Magic in the Shadows (SR3) — Magician's Way
summary: Fictional Shadowrun tabletop RPG rules from FASA Corporation, printed p22/PDF23. Numerical requirements, loss consequences, exceptions and the original worked character example are retained.
data:
  character_creation:
    magic_priority: A
    ordinary_adept_rules: Apply except for the magician-adept provisions.
    minimum_magical_power_levels: 1
    magical_power_cost_per_level: 1
    spell_points_per_level: 6
    spell_points_timing: Character creation only.
    spell_point_uses: Spells, spirits and other standard Spell Point expenditures (SR3 p54).
    tradition_choices: [shamanic, hermetic]
  magical_skills:
    permitted: [Sorcery, Conjuring]
    effective_magic: Equals Magical Power level when using Magical Skills.
    rules: Follow ordinary Magical Skill procedures within the chosen tradition.
    shamanic_modifiers: Shamanic magician adepts follow totems and apply totem skill modifiers as shamans do.
    adept_powers: Purchased and used in the usual adept manner independent of magical tradition.
  magic_loss:
    allocation: Reduce Magical Power before other adept powers.
    zero_magical_power: Permanently removes active Magical Skill use and bars reacquisition of Magical Power.
    thereafter: Treat as an ordinary adept; initiation and acquisition of other powers remain available.
  example:
    character: She Who Knows The Night
    ordinary_adept_powers: [Improved Stealth, Combat Sense, Improved Unarmed Combat, Killing Hands]
    ordinary_adept_power_points: 4
    magical_power_points: 2
    effective_magic_for_magical_skills: 2
    force_above_effective_magic: Spellcasting above Force 2 risks Physical Drain in this example.
