id: rule.magic.mits-enchanting-test
record_type: rule
status: ingested
source: source.mits
printed_pages: '44'
pdf_pages: '45'
edition_scope: SR3
content_class: [rule_procedure]
data:
  canonical_context: procedure.magic.artificing
  prerequisites: Acquired or manufactured telesma, enchanting shop, mage Enchanting library or shaman lodge at least focus Force.
  concentration: Only ordinary survival tasks permitted during ritual.
  base_days: 30
  test: Enchanting Test against focus type base TN plus applicable modifiers. Divide 30 days by successes; failure requires another 30 days and another test; all ones abort and waste materials.
  base_target_numbers: {Expendable Spell: 3, Expendable Anchoring: 4, Specific Spell: 4, Sustaining: 4, Homunculus: 5, Reusable Anchoring: 6, Shielding: 6, Spell Category: 6, Spell Defense: 6, Spirit: 6, Centering: 6, Weapon: 6, Power: 8}
  modifiers:
    focus_force: add Force
    material_basis: add Object Resistance (SR3 p182)
    handmade_telesma: -1
    virgin_telesma: -2
    radicals_one_material: -1
    radicals_two_materials: -2
    radicals_three_materials: -4
    orichalcum_per_unit: -1
  radicals:
    eligibility: Use a number of radical units equal to focus Force for one/two/three different material modifiers; radicals may be incorporated into the object or used in enchanting.
    orichalcum: Each unit separately reduces Enchanting TN and first bonding Karma by 1.
    consumption: All radicals used are bound to the focus and consumed.
    bonding: Radicals can reduce first bonding cost; see p45.
    example: Force 3 power focus with one herbal, one mineral and one metal radical gets -4 TN.
  multiple_telesma: Usually one at a time; exception is expendable spell foci, batch up to Intelligence identical foci with all time, tests, material and Karma costs as for a single focus.
  example_batch: Intelligence 4 can create four identical Force 3 expendable spell foci for the cost of one Force 3 focus.
framing: reference_exact
headline: 'Fictional Shadowrun Third Edition: Enchanting Test, FASA7907, printed 44/PDF 45'
