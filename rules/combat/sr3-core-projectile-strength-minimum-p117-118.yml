  scope: Fictional tabletop projectile-weapon attack and readiness tests; market weapon
    values remain in previously verified original core p276 records.
  bows:
    strength_minimum: Purchase-time bow Strength Minimum, 1 or greater, sets range
      and Damage Code from original table.
    under_minimum_penalty: Add +1 to the attack target number for each full point
      that character Strength is below that bow Strength Minimum.
    source_example_rule_not_numeric_example:
      strength_deficit_points: 2
      expected_attack_target_number_modifier: 2
  crossbows:
    strength_minimums:
      light: 3
      medium: 4
      heavy: 5
    under_minimum_penalty: One additional Ready Weapon action to reload the crossbow
      per point by which character Strength is below crossbow minimum.
    source_example_rule_not_numeric_example:
      strength_deficit_points: 2
      additional_ready_weapon_actions: 2
  throwing_weapons:
    strength_minimum_required: false
    range_and_damage_attribute: The thrower’s Strength Attribute determines range
      and damage.
  source_table_pointer:
    original_printed_page: 118
    original_pdf_page: 119
    reused_market_table: equipment.melee-projectile.sr3-core-market-p275-276
    table_summary: Original projectile table repeats bow, arrows, crossbows, throwing
      knife and shuriken values; the separate accepted market table remains the canonical
      numeric equipment list.
  limit: No fabricated Strength rounding, crossbow firing-speed override, projectile
    range factor, or late-edition rule conversion.
