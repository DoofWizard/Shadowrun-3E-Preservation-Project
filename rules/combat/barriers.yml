id: rule.combat.barriers
record_type: rule
name: "Barriers"
domain: combat
status: ingested
effective: {status: current, source: source.sr3-core, page: 124, basis: defines}
scope:
  applies_to: ["attacks through or against physical barriers"]
  excludes: []
resolution:
  summary: "Barrier Rating represents a material's resistance. Attacks may fire through barriers with attack Power reduced by armor and Barrier Rating, or attempt to break through barriers using Power compared with Barrier Rating. Damage can reduce Barrier Rating and sufficiently powerful attacks can open holes or destroy the barrier."
  inputs: ["Barrier Rating","attack Power","weapon/attack type"]
  outputs: ["reduced attack, barrier damage, breach or no effect"]
  steps: []
