id: rule.combat.cannon-companion-combat-options-declaration-resolution-p85-86
record_type: rule
status: reviewed
source: source.cc
printed_pages: '85-86'
pdf_pages: '86-87'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: 'FASA7908 Cannon Companion SR3: optional combat declaration and opposed-test details'
summary: 'FASA Corporation fictional tabletop RPG, printed pp85-86/PDF86-87: option eligibility, declaration, timing and opposed-test qualifications supplement inherited combat options.'
data:
  option_framework:
    existing_rule: rule.combat.combat-options
    training_required: false
    optional_secret_declaration:
      gm_may_require_written_choice_before_roll: true
      reveal_after_dice_rolled: true
  charging_timing:
    existing_option: option.combat.charging-attack
    movement_may_accumulate_across_initiative_passes: true
    continuous_movement_required_through_attack_pass: true
  pulling_punches_eligibility:
    existing_option: option.combat.pulling-punches
    applicable_test_roles: [attacking, defending]
    qualification: The general option eligibility on p85 applies because p86 states no role exception. The inherited attacker-only wording does not express this scope.
  disarming_initial_result:
    existing_option: option.combat.disarming
    initial_displaced_weapon_location: ground at the disarmed character's feet
    qualification: This is the starting location before additional-success displacement.
  subduing_resolution:
    existing_option: option.combat.subduing
    initial_threshold:
      minimum_successes: opponent Quickness
      source_count_terminology: successes
      inherited_count_terminology: net successes
      precedence: unresolved
    win_below_threshold_state: grasp only
    successful_subdual_actions_allowed: false
    successful_subdual_prone_state: Optional at controlling character choice.
    escape_target_number_open_test_dice_per_net_success: 1
    escape_target_number: Highest Open Test die result.
    follow_up_if_subdued_opponent_wins: Opponent resolves an up-close counterattack.
  scope: Fictional character state and dice resolution only; existing option records remain read-only.
