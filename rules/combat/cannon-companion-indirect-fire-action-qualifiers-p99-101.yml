headline: 'FASA7908 Cannon Companion: original indirect-fire game action qualifiers'
summary: 'FASA Corporation Shadowrun Third Edition fictional tabletop RPG, printed pp99-101/PDF100-102. Supplements the existing game procedure with omitted action, dice and eligibility conditions.'
data:
  existing_record: procedure.combat.indirect-fire
  fictional_game_scope: Dice and action economy only.
  acquisition:
    spotter_acquisition_action: Complex
    notification_included_in_acquisition_action: true
    failed_acquisition: No indirect attack; an ordinary attack instead uses the +8 Blind Fire game modifier.
    vehicle_sensor_test_reference: SR3 p136
    battleTac_pool_refresh: If spotting lasts over one Combat Turn, allocated dice remain unavailable until spotting ends.
    designator_pool_refresh: Beginning of Combat Turn after spotting finishes.
  game_eligibility:
    information_guided_network_membership_required: both spotter and firer
    rigged_network_fddm_required: both remote control deck and firing unit
    ordinary_direct_fire_or_imprecise_game_weapon: Indirect procedure unavailable; GM may reduce Blind Fire modifier by 2 for acquisition information.
    rigged_mount_barrier_rule_reference: SR3 p124
    designator_guided_category: self-propelled seeker-guided game projectiles only
  maintenance:
    concurrent_attack_modifier: +2 second firearm modifier (SR3 p112)
  attack:
    combat_pool_allowed: false
    missile_mode: fire-and-forget
    sensor_dice_allowed_for_spotted_missile: false
    scatter_zero: direct hit
  source_note: Printed p101 example uses last Initiative Pass Phase 1 arrival, whereas p102 timing rule specifies Phase 0; preserve the discrepancy without deciding precedence.
