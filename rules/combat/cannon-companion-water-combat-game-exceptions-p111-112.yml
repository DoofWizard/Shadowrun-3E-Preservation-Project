edition_scope: SR3
content_class: [rule_exact]
data:
  publication: {title: Cannon Companion, publisher: FASA Corporation, catalog_number: FASA7908}
  extends: subsystem.environment.underwater
  tabletop_rules:
    surface_to_underwater_visibility:
      reference: SR3 p111 standard Visibility Modifiers
      low_light_treated_as: normal vision
      thermo_treated_as: normal vision
      ultrasound_sights_function: true
    underwater_weapon_rule: ordinary game weapon entries use the surface-to-underwater game restrictions; entries expressly designed for underwater use are exempt
    underwater_equipment_cross_references: [Cannon Companion p31, Cannon Companion p20]
    underwater_melee_vision: apply appropriate depth and murkiness modifiers from Cannon Companion p111 in addition to the existing melee test conditions
    scuba_tank_game_resolution: the original rupture condition requires a single attack meeting the existing Power and Serious wound thresholds; ignore lesser game damage
framing: reference_exact
headline: "FASA7908 Cannon Companion (SR3) - Water combat game exceptions"
summary: "FASA Corporation, fictional Shadowrun Third Edition tabletop rules; source.cc, printed pp111-112, PDF pp112-113. Source-specific additions and clarifications to the existing subsystem."
