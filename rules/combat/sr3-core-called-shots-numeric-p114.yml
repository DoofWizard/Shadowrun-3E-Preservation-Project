    limit: Reviewed field paths and schema preflight are not proof of exhaustive source
      fidelity or engine implementation.
    correction_reason: The prior baseline's absolute melee_allowed_in_original_core_called_shot=false
      erroneously collapsed the original p105 melee/unarmed follow-up into the narrower
      p114 firearm-mode sentence. This correction preserves each printed claim with
      its source/page, does not invent a later supersession, and retains all unchanged
      numeric called-shot rules.
    prior_accepted_commit: 8f4c2c20c14f94e4f76451215d78197c8b545782
    prior_accepted_blob: 166fc44ba57cfb6a92caab8a6847c7fd0f0e996d
    prior_baseline_retained_at: journal_p114/baseline.yml (working receipt; not GitHub
      publication)
    assertion_preservation: All unchanged target-number, mode, damage-step, cap, choice
      and vehicle subtarget assertions remain identical; revised melee boolean is
      replaced by explicit source-specific p105 and p114 claims, with original source
      contradiction noted.
  source_internal_tension:
    printed_page_105_physical_pdf_106: Original Free Actions / Call a Shot entry lists
      Aim, Fire Weapon, Throw Weapon and Melee/Unarmed Attack as allowable immediately
      following actions.
    printed_page_114_physical_pdf_115: Original Called Shots paragraph says called
      shots can only be made with weapons firing in SS, SA or BF modes; separate examples
      cover damage-level increase and vehicle-sized subtargets.
    relation: These are distinct original Third Edition source claims; the p105 melee
      listing conflicts with a literal blanket reading of p114. No unstated erratum,
      precedence or optional house rule is adopted.
    scope: Source-specific correction to overbroad boolean in the first accepted p114
      record, not a replacement of p105 accepted action economy.
