id: rule.combat.sr3-core-called-shots-numeric-p114
record_type: rule
status: source_reviewed
source: source.sr3-core
printed_pages: '114'
pdf_pages: '115'
edition_scope: Original FASA Corporation Shadowrun, Third Edition FASA7001, fictional
  tabletop game core rules printed p114/physical PDF115; no later optional rules silently
  converted to core.
content_class:
- rule_exact
headline: 'FASA Corporation fictional tabletop RPG Shadowrun, Third Edition (FASA7001)
  original p114/PDF115: called-shot limits and exact effects'
summary: 'FASA Corporation Shadowrun Third Edition FASA7001 original printed p114/PDF115
  called shots: +4 TN, three permitted firearm modes, choice of two effects; preserve
  the original p105/PDF106 free-action list''s melee follow-up as an unresolved core
  internal tension, not a blanket prohibition.'
data:
  publication:
    title: Shadowrun, Third Edition
    publisher: FASA Corporation
    edition: Third Edition
    catalog_number: FASA7001
    source_id: source.sr3-core
    original_pdf_sha256: 7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914
    fictional_tabletop_publication: true
    printed_page: 114
    physical_pdf_page: 115
  source_heading: 'Combat: Called Shots'
  declaration:
    free_action: Call a Shot
    timing: The printed p114 Called Shots description allows Aim then a Call a Shot
      Free Action at attack; the separate printed p105 Free Actions entry says Call
      a Shot must immediately be followed by Aim, Fire Weapon, Throw Weapon or Melee/Unarmed
      Attack. Preserve both source orderings without choosing one silently.
    accessible_location_decider: Gamemaster determines whether the declared vulnerable
      point is accessible.
  original_core_mode_restriction:
    allowed_firing_modes:
    - single-shot
    - semi-automatic
    - burst-fire
    full_auto_allowed_in_original_core_called_shot: false
    p114_firearm_modes_only_statement: Printed p114 explicitly limits called shots
      with weapons that FIRE to single-shot, semi-automatic and burst-fire modes.
    melee_followup_listed_original_p105: true
    melee_core_permission_resolution: 'Internal inconsistency/unresolved scope: p105
      Free Action entry includes Melee/Unarmed Attack as an immediate follow-up; p114
      limits called shots to weapons using three firing modes. Do not infer an unqualified
      original-core melee prohibition or permission.'
  option_select_one:
  - choice: increase_damage_level
    target_number_modifier: 4
    damage_level_steps: 1
    damage_level_cap: D (Deadly)
    condition: Player choice with gamemaster agreement.
  - choice: specific_vehicle_or_larger_subtarget
    target_number_modifier: 4
    damage: Normal damage rules against selected part of vehicle or comparably sized
      target
    condition: Target such as tires or windows, if specific location is accessible.
  lineage_and_preexisting_canon:
    core_reference: rules/combat/called-shots.yml
    optional_later_extension: Shadowrun Companion optional advanced melee Called Shot
      (original Companion pp85-86) adds or clarifies melee outcomes; original FASA7001
      p105 separately lists melee/unarmed as a valid Call a Shot follow-up, so do
      not claim the core had no melee mention.
    reconciliation_note: The p114 narrative restricts firearm modes while the p105
      Free Action entry explicitly lists melee/unarmed. The generic called-shots.yml
      and optional Companion combat-options.yml may reflect different scopes; source-internal
      tension remains unadjudicated.
  example_vectors_not_executed:
  - firing_mode: burst-fire
    attack_base_target_number: 5
    called_shot_modifier: 4
    expected_attack_target_number: 9
    damage_level: M
    increase_damage_option_expected_level: S
  - firing_mode: full-auto
    original_core_called_shot_permitted: false
  editorial_review:
    stage: original_page_review_before_baseline_freeze
    evidence: Original FASA7001 printed p105/PDF106 Free Actions Call a Shot entry
      and printed p114/PDF115 Called Shots entry independently re-reviewed as page
      images after detecting a genuine internal cross-reference tension. Existing
      original action timing record independently compared; first accepted baseline
      and candidate retained unchanged in prior journal.
    text_field_paths_reviewed:
    - headline
    - summary
    - edition_scope
    - data.publication.*
