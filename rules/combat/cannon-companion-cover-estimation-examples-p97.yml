id: rule.combat.cannon-companion-cover-estimation-examples-p97
record_type: rule
status: reviewed
source: source.cc
printed_pages: '97'
pdf_pages: '98'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: 'FASA Corporation Cannon Companion (FASA7908, SR3): cover-area estimation and reciprocal dice examples'
summary: 'Original fictional tabletop game printed p97/PDF98; GM area judgment, exact half modifier and two numerical examples supplement the existing p98 table.'
data:
  existing_modifier: modifier.combat.partial-cover
  estimation:
    authority: Gamemaster
    metric: Overall visible area of the fictional target, not a count of individual body parts.
    table_reference: Cannon Companion printed p98.
    use_as_guideline: true
  reciprocal_modifier:
    operation: Divide the applicable cover modifier by 2 for the character making a fictional attack from cover.
    exact_not_approximate: true
  original_examples:
    estimated_visible_percent: 45
    example_target_number_modifier: 4
    example_cover_modifier: 4
    example_reciprocal_target_number_modifier: 2
  scope: Existing five table rows remain in the shared modifier; no new row or core substitution.
