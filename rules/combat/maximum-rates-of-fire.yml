id: rule.combat.maximum-rates-of-fire
record_type: rule
name: "Maximum Rates of Fire"
domain: combat
status: ingested

effective:
  status: current
  source: source.cc
  page: 101
  basis: clarifies

scope:
  applies_to:
    - "firearms used within a Combat Phase/Combat Turn"

resolution:
  summary: "Cannon Companion clarifies maximum rounds fired by weapon/mode: normal burst-fire fires three-round bursts, normal full-auto can fire up to ten rounds in one Complex Action, minigun-class weapons up to fifteen, and qualifying super-machine-gun weapons up to eighteen, subject to ammunition and mode restrictions."
  inputs:
    - "weapon class"
    - "firing mode"
    - "available ammunition"
  outputs:
    - "maximum rounds/bursts per Combat Phase"

links:
  uses:
    - subsystem.combat.firearm-firing-modes
  affects:
    - rule.combat.burst-fire-effects
    - rule.combat.full-auto-effects
  modified_by: []
  interacts_with: []

sources:
  - source: source.cc
    page: 101
    relation: clarifies
    note: "Maximum Rates of Fire"

notes:
  - "This clarifies/extents SR3 firing-rate rules rather than replacing the core firing-mode subsystem."
