  "resolution": {
    "summary": "Communicate tactical analysis/orders to improve Initiative or optionally Combat Pool.",
    "inputs": [
      "skill",
      "communication",
      "BattleTac"
    ],
    "outputs": [
      "team bonus"
    ],
    "steps": [
      "Normally use on last action of Combat Turn; communication is Complex Action, except self-only. BattleTac master can make communication a Simple Action.",
      "Base TN: direct/close LOS 4; radio 6; LOS hand-signals/no audio 8. BattleTac cyberlink -2, receiver -1; apply wound and recipient Perception modifiers.",
      "Maximum teammates benefiting excludes user and equals skill rating.",
      "Every 2 successes grants +1 Initiative next Combat Turn, capped by recipient Reaction. Conflicting orders use highest bonus -1.",
      "Prepared ambush can add 1 die per 2 successes to Reaction/Surprise Tests.",
      "Optional: replace Initiative bonus with extra Combat Pool at 1 die per +1 Initiative."
    ]
  },
