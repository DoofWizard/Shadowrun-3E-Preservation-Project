    altered_staging_direction: up
    required_successes_per_damage_level_increase: 4
    normal_successes_per_damage_level_increase: 2
    damage_code_unchanged: true
  zoning:
    next_engagement_superior_position_applies_on: [attack, defense]
  scope: Fictional tabletop dice and state modifiers only; existing shared records remain read-only.
