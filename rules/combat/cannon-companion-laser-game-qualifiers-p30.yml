headline: FASA7908 Cannon Companion SR3 fictional laser equipment game effects
summary: FASA Corporation, Shadowrun Third Edition Cannon Companion, printed p30 / PDF31. Missing tabletop damage, armor and eligibility fields from the laser equipment section.
data:
  existing_rule: rule.combat.laser-weapons
  recoil_modifier: 0
  damage_resistance:
    ballistic_armor_applies: false
    impact_armor_multiplier: 0.5
    rounding: down
  range_power_modifiers: {Short: 0, Medium: -2, Long: -4, Extreme: -6}
  obscurant_power_modifier:
    applies_to: [smoke, fog]
    power_change: -1
    per_game_distance_meters: 2
    correction: Source changes Damage Code Power, not the Attack Test target number.
  game_equipment_eligibility:
    anti_vehicle_classification: false
    accessory_slots_allowed: [underbarrel, top]
  governing_skill: entity.skill.laser-weapons
