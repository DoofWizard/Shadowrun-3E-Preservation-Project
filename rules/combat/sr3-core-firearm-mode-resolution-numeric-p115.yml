  source_heading: Combat — Semi-Automatic Mode, Burst-Fire Mode, Short Bursts and
    Full-Auto Mode
  semi_automatic:
    maximum_shots_per_combat_phase: 2
    action_per_shot: Simple Action
    first_shot_recoil_modifier: 0
    second_shot_recoil_modifier_if_same_phase: 1
    compensation: Recoil compensation can cancel the +1 modifier on the second shot.
    separate_success_test_for_each_shot: true
    combat_pool_dice: Allocate Combat Pool dice separately for each shot, if used.
  burst_fire:
    rounds_in_full_burst: 3
    action_per_burst: Simple Action
    maximum_bursts_per_combat_phase: 2
    recoil_modifier_per_full_burst: 3
    recoil_compensation: Can neutralize the recoil modifier.
    separate_success_test_per_burst: true
    combat_pool_dice: Allocate separately to each burst, if used.
    power_rating_increase_per_full_burst: 3
    damage_level_step_increase_per_full_burst: 1
    printed_example:
      base_damage_code: 5M
      three_round_burst_damage_code: 8S
  insufficient_ammunition:
    two_round_short_burst:
      condition: Burst ends one round short because clip has insufficient ammunition.
      power_increase: 2
      damage_level_step_increase: 0
      recoil_modifier: 2
    one_round_remaining:
      condition: Burst has only one round due to insufficient ammunition.
      resolution: Treat as a single-shot attack.
  full_auto:
    action: Complex Action
    declare_rounds_at_specific_target: true
    minimum_rounds_per_burst: 3
    maximum_rounds_one_combat_phase: 10
    recoil_modifier_per_round: 1
    recoil_compensation: Applied to the cumulative recoil modifier under original
      firearm rules.
    success_test: A separate Success Test is made for each full-auto burst; Combat
      Pool may augment separately.
    power_increase_per_round: 1
    damage_level_step_increase_every_full_rounds: 3
    damage_level_step_maximum: D (Deadly)
    insufficient_ammunition_exception: If ammunition is insufficient for the declared
      burst, use the printed Short Bursts rule on this page.
