id: rule.combat.combat-options
record_type: rule
name: "Advanced Melee Combat Options"
domain: combat
status: ingested

effective:
  status: optional
  source: source.cc
  page: 85
  basis: adds_option

scope:
  applies_to:
    - option.combat.advanced-melee-combat
  excludes: []

resolution:
  summary: "A character may declare one combat option per Combat Phase before rolling dice. The selected option modifies the attack or defense test rather than creating an additional test."
  inputs:
    - "declared combat option"
    - "attack or defense test"
  outputs:
    - "option-specific modification"
  steps:
    - "Declare the combat option before dice are rolled."
    - "Apply the option to the attack or defense test."
    - "Use no more than one combat option per Combat Phase unless a specific rule states otherwise."

links:
  uses: []
  affects: []
  modified_by: []
  interacts_with:
    - option.combat.advanced-melee-combat

sources:
  - source: source.cc
    page: 85
    relation: defines
    note: "Combat Options"

notes:
  - "Individual options such as Called Shot, Charging Attack, Disarm, Full Defense, Knockdown Attack, Multiple Targets and others will be individual child records."
