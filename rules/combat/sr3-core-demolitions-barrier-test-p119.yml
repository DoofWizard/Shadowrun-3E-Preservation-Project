  abstract_game_rule:
    scope: When the fictional Demolitions Skill is used for a game explosive charge
      against a barrier, the source adds an abstract skill success modifier to blast
      Power.
    barrier_rating_used: Normal Barrier Rating, not the doubled rating used for the
      separate ordinary grenade-blast initial-barrier comparison.
    demolitions_skill_test_target_number: 2
    in_game_effective_power_bonus_per_success: 1
    game_sequence:
    - Use the source normal Barrier Rating in the Demolitions-versus-barrier case.
    - Resolve the fictional Demolitions Skill Test against target number 2.
    - Add one point to in-game explosive Power for each success.
    no_real_world_implementation: This is only a dice-and-Barrier-Rating abstraction
      from the tabletop game; it does not specify any physical preparation, materials,
      or real-world handling method.
