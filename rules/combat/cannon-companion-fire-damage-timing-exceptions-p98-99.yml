id: rule.combat.cannon-companion-fire-damage-timing-exceptions-p98-99
record_type: rule
status: reviewed
source: source.cc
printed_pages: '98-99'
pdf_pages: '99-100'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: 'FASA7908 Cannon Companion SR3: fire damage and state exceptions'
summary: 'FASA Corporation fictional Shadowrun Third Edition tabletop rules, printed pp98-99/PDF99-100. Source-specific damage and game-state qualifications supplement the existing fire rules and tables.'
data:
  existing_record: rule.combat.fire-incendiaries
  timing:
    direct_fire_attack: Immediate damage.
    ambient_fire: Resist damage only at end of each Combat Turn.
  fire_damage_resolution:
    ignition_is_not_required_for_fire_attack_damage: true
    gm_may_improvise_damage_code_using_base_fire_damage_table: true
  ignition_test_references:
    elemental_secondary_effects: MITS p51
    object_resistance_rating: SR3 p182
  burning_carried_game_equipment:
    ignition_eligibility: Includes clothing, armor and gear carried by a character.
    ammunition_or_explosives: The game source specifies explosion on ignition, rather than a possibility.
    damage_resolution: Resolve as a point-blank weapon hit against a character wearing such equipment.
    armor_reduction: false
    combat_pool_resistance_allowed: true
  ongoing_fire:
    ends_when_either: [nothing remains to burn, fire is extinguished]
  extinguishing:
    usual_combat_turns: 2
    gm_approval_of_suitable_means_required: true
    larger_fire_or_insufficient_means_may_extend_duration: true
  scope: Fictional game damage timing and resistance only; both six-row tables remain in the existing record.
