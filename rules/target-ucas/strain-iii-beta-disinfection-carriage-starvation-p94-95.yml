data:
  section: Game Information — Strain-III Disinfecting Hosts, Carriers and Background Counts
  source_context: 'Original FASA Corporation Target: UCAS (FASA7214, ©1997), fictional Shadowrun Second Edition-era
    tabletop RPG, printed pp94-95/PDF pp95-96.'
  source_substance:
    deactivation: The source lists ceasing astral perception/projection, deactivating foci/spell locks, stopping
      sustained spells or spirits leaving to their metaplanes as ways to interrupt a cloud’s supply, subject
      to fictional entity capabilities.
    cure_disease_deadly:
      target_number: Cloud Rating + any background count modifier
      effect: For every 2 successes reduce the cloud Rating by 1; if Rating reaches 0, the cloud is destroyed;
        a living host may still experience temporary flu-like illness with optional Moderate stun wound and
        days of discomfort.
    sterilize_spell:
      base_target_number: 4 + Rating of most powerful cloud in spell area + applicable background count
      effect: For every 2 successes decrease Rating of all clouds in area by 1; caster must be astrally perceiving
        or projecting and can thereby become a target.
      repeat_casting: Each additional spell against a cloud increases the next attempt’s target number by +1,
        cumulatively, until 24 hours have passed, when it resets.
    target_switching:
      stronger_host: If a new potential host’s Force is at least 3 points greater than current host, cloud
        may move to the new host after the usual Feeding Test.
      failure: On failed transfer attempt it stays with the initial host and requires another Feeding Test
        to reattach there.
      escape: An original host with Quickness > 2 × cloud Quickness can move out of its attention, subject
        to astral LOS/obstructions.
    starvation: Without any astrally active food or sustainable background count, cloud can survive a number
      of weeks equal to Rating, then loses 1 Rating point each week until 0 and death.
    carriers: Astrally active hosts or objects can transport bacteria without being drained. Devil rats and
      cockroach spirits are described as adapted, partly immune carriers, drained at half the normal rate.
      Metahuman mages who cease astral perception/projection can transport Strain-III until they reactivate;
      the source explicitly notes carriage outside CZ is uncommon but possible.
    background_count: Cloud cannot raise Rating by feeding on ambient background count. It can survive indefinitely
      at Rating no greater than background count. Temporary counts from brief intense emotion/spellcasting
      are insufficient to sustain it. Chicago CZ has persistent Background Count >=1.
    narrative_game_master_guidance: Source recommends applying cloud encounters occasionally to support campaign
      tension rather than repeating all rolls every turn; this is guidance, not an exception overriding numeric
      rules.
