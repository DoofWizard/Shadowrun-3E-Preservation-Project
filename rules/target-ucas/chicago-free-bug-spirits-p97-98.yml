data:
  section: Game Information — Bugs, free bug spirits and queen death
  source_context: 'Original FASA Corporation Target: UCAS (FASA7214, ©1997), fictional Shadowrun Second Edition-era
    tabletop RPG, printed pp97-98/PDF pp98-99.'
  source_substance:
    lineage: 'Insect spirits: Bug City pp135–145, Grimoire II pp101–107. Mutations: Threats pp64–69. Free-spirit
      rules: Grimoire II pp76–83.'
    queen_death_test:
      dice: Force Test for each insect spirit in queen’s hive
      target_number: 2 × Queen spirit Force
      modifier: −2 to target number for “good mergers” with 5+ Willpower successes while invested; Bug City
        p137/Grimoire II p102 cross-reference
      on_at_least_one_success: spirit becomes free instead of dying with queen.
    new_free_bug: Begins Spirit Energy 1 and loses half Force on queen’s death; has normal free spirit Karma-collecting
      abilities.
    unique_energy_transfer: Free bug can drain Force from other spirits using procedure analogous to Essence
      Drain (Shadowrun II p217). 4 Force points drained from a target grant 1 Karma point to free bug (ratio
      4:1), even when the target does not consent.
    free_spirit_categories: Free bug can be trickster, shadow or hunter. Hunters prey on other spirits and
      exist for domination/destruction; this is fictional characterization, not an instruction for real harm.
    true_name_quest_limit: Unless gamemaster explicitly allows exception, only insect shamans may make astral
      quests to determine a free bug’s true name, creating an unusual constraint for most player characters.
    scope: The book frames free insect spirits as post-Extermination campaign opponents/options; this does
      not establish that all hives or all queens perished.
