data:
  section: Game Information — Damage from Voids; Magical Tests in Voids; Void Magical Effects
  source_context: 'Original FASA Corporation Target: UCAS (FASA7214, ©1997), fictional Shadowrun Second Edition-era
    tabletop RPG, printed pp96-97/PDF pp97-98.'
  source_substance:
    entry_damage: Astral perceiver/projector entering a Void takes (Void Level)L physical wound; normal resistance
      is allowed. For each continued Magic-Rating number of turns astrally active in Void, resist the damage
      again. Leave Void or cease astral activity to stop cycles.
    long_duration: 'Every hour spent astrally active in a Void removes 1 Intelligence and 1 Essence. After
      leaving Void, Essence returns 1 per minute, Intelligence 1 per 24 hours; GM may instead assign Mental
      Flaw of rating equal to hours spent in Void. Willpower (4) on each new astral entry: with no successes
      immediately lose 1 Intelligence, recovered in 24 hours.'
    intelligence_zero: At Intelligence 0, an astral projector is thrown back to physical body and astral perceiver
      is knocked out; suffers Deadly Stun. Make Willpower Test with target number equal to character’s unaugmented
      Intelligence. Every 2 successes reduce damage by one box. Only rest heals this particular wound, not
      magic; GM may also impose Mental Flaw.
    fast_movement: Source advises against astral fast movement within CZ; optional GM consolidation of many
      backgrounds/Voids into one aggregate roll applies if character insists, not a universal substitute for
      individual tests.
    dual_natured_behavior: Dual-natured creatures in Voids become violent or disoriented and their Intelligence
      is reduced by the Void Level.
    magical_test_target_number: Add +1 to ALL magical/astral tests for each Void Level. Includes conjuring,
      spellcasting, astral perception, astral combat, quickening, anchoring; tests of purely physical activity
      unaffected except dual-natured creatures (always astrally active). TN penalties can be reduced via centering
      under Grimoire II p44.
    drain_modifiers: Increase Power of Drain by +1 per Void Level. Increase Drain Damage Level by one level
      per complete 3 Void Levels (e.g. 3S -> 7D at Void Level 3).
    source_example: The printed worked example states a Force 6 manaball normally has Drain 3S and becomes
      7D in a Level 3 Void, describing an increase of 4 to Drain Power. The table separately lists +1 Drain
      Power per Void Level; preserve the apparent numerical discrepancy without inventing an explanation. The
      Level 3 Void adds +3 to the spellcasting test target number.
    void_effects_scope: Source rules are fictional historical Shadowrun mechanics; do not translate into modern
      editions.
