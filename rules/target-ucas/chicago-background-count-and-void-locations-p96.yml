data:
  section: Game Information — Chicago Background Count; Voids and locations
  source_context: 'Original FASA Corporation Target: UCAS (FASA7214, ©1997), fictional Shadowrun Second Edition-era
    tabletop RPG, printed pp96/PDF pp97.'
  source_substance:
    persistent_background_count:
      central_CZ: 1
      hives_and_magical_centers: 2 or 3
      Shattergraves: 4
      Cermak_Blast_center:
        level: 7
        radius_meters: 100
      Cermak_Blast_next_ring:
        level: 6
        additional_width_meters: 200
      Cermak_Blast_next_ring_after_that:
        level: 5
        additional_width_meters: 1000
      after_outer_ring: Continuously reduces toward usual Containment Zone level 1.
    exception: Sanctum used by Jason Two-Spirits and companions is described as the only Containment Zone area
      without either background count or Void.
    void_definition: Localized unpredictable astral-energy deficits rather than high-energy background count;
      mechanically negative counterparts to background count levels, affecting astral activity and not ordinary
      mundane tests.
    void_movement: Voids appear and disappear in arbitrary places and times, without fixed spatial pattern.
      GMs may assign locations and levels rather than randomly roll.
    optional_random_2d6_table:
    - roll: '2'
      result: Level 3 Void
    - roll: 3-4
      result: Level 2 Void
    - roll: 5-6
      result: Level 1 Void
    - roll: 7-9
      result: Level 1 Background Count
    - roll: 10-11
      result: Level 2 Background Count
    - roll: '12'
      result: Level 3 Background Count
    specific_locations_precede_random: Use established site background count (for example Cermak Blast) rather
      than rolling randomly there. An uncommon local Void level can exceed nearby background count.
    historical_cross_reference: Bug City p145 is the source’s prior mechanical reference on Cermak Blast background
      count.
