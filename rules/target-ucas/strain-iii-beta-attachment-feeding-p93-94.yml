data:
  section: Game Information — Strain-III Feeding, Energy Drain, Force/Feeding Table
  source_context: 'Original FASA Corporation Target: UCAS (FASA7214, ©1997), fictional Shadowrun Second Edition-era
    tabletop RPG, printed pp93-94/PDF pp94-95.'
  source_substance:
    possible_hosts: Astrally active hosts include dual-natured entities (elementals, nature spirits, watchers,
      cyberzombies); active foci and spell locks can be attached only if activated and their magician is astrally
      perceiving or projecting. Dormant foci or foci belonging to an inactive magician are not eligible.
    feeding_test:
      dice: Cloud Rating dice
      target_number: Target effective Force rating + combined Rating of Strain-III clouds already attached
        to that target
      minimum_successes_to_attach: 1
      effective_force: Spirit or focus Force, magician’s unaugmented Magic (not enhanced by foci), cyberzombie
        absolute Essence value, other appropriate equivalent. An active focus and its perceiving/projecting
        user are separate possible targets.
      multiple_targets: Use one roll of cloud Rating dice and compare against target numbers of all valid targets;
        attach to strongest eligible target where at least one success was rolled. If the strongest resisted,
        consider the next eligible target. Example Rating 6 cloud versus Wraith Magic 7, Scarecrow Magic 5
        and Scarecrow focus Rating 3 succeeds against Scarecrow but not Wraith.
    combined_clouds: Any number of clouds may attach while their aggregate Rating does not exceed 10. Attached
      clouds are treated as one combined Rating; a new cloud that would raise Rating above 10 cannot attach
      to that target.
    feeding_rate_table:
    - state: dormant
      rating: 1-5
      normal_strain: 36 hours
      beta_strain: 18 hours
    - state: active
      rating: 6-9
      normal_strain: 24 hours
      beta_strain: 12 hours
    - state: mature
      rating: 10+
      normal_strain: 12 hours
      beta_strain: 6 hours
    force_loss: After each base feeding interval, drain 1 Force point from the host. A second Feeding Test
      can shorten the base time by dividing it by number of successes; with zero successes use printed standard
      base interval.
    rating_growth: Each 1 Force point removed from host adds 1 to the feeding cloud’s Rating. When it reaches
      Rating 10 it reproduces into usually two clouds whose Ratings sum to 10, one active and one dormant;
      they cannot both attach to the same host if total Ratings exceed 10.
    host_results: Affected magician loses Magic Rating permanently (can only subsequently improve by normal
      initiation), focus loses a Force point irreversibly, spells/spell locks/foci are rendered useless at
      effective Force 0; a spirit, paranatural critter or magician reaching effective Force 0 dies. Cyberzombies
      carry clouds but cannot be drained because they possess no usable magical energy.
    source_distinction: Original Strain-III in Threats is slower than the released Beta strain; the table explicitly
      gives both normal and Beta rates.
