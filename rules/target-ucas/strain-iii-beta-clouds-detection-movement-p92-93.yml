data:
  section: Game Information — Strain-III Rules; Clouds, perception and movement
  source_context: 'Original FASA Corporation Target: UCAS (FASA7214, ©1997), fictional Shadowrun Second Edition-era
    tabletop RPG, printed pp92-93/PDF pp93-94.'
  source_substance:
    lineage: The source supplements and partly replaces the original Strain-III procedures in FASA Threats
      p104 specifically for the Beta strain released into Chicago.
    nature: Astral-only bacteria, no physical manifestation or effect on non-astral objects; attaches to astrally
      active hosts and drains magical energy. The book rejects a settled synthetic origin and reports that
      field researchers increasingly regard it as naturally occurring. A single bacterium has no meaningful
      effect; game mechanics use clouds.
    cloud_rating: A cloud has an energy rating. It occupies an approximate sphere whose radius in meters equals
      Rating, with irregular actual limits; contracts around feeding host.
    rating_states:
    - state: dormant
      rating: 1-5
      astral_quickness: 1
      behavior: Usually stationary but may roam for food.
    - state: active
      rating: 6-9
      astral_quickness: 2
      behavior: Moves toward food by own volition.
    - state: mature
      rating: 10+
      behavior: A cloud with enough energy to reproduce; can be dormant or active.
    movement: Neither dormant nor active cloud can use the “fast movement” option for projecting magicians
      (Second Edition p146).
    astral_line_of_sight: Clouds cannot pass or see through living earth, living people, rooms sealed with
      FAT bacteria or other astral LOS obstructions; inanimate walls also block LOS even though the material
      itself does not inherently block astral movement.
    seeing_clouds: Astrally perceiving magicians, spirits and critters make Perception Test at base target
      number 12 minus cloud Rating, subject to ordinary astral LOS. Gamemaster may require Magic Theory (6)
      to identify a detected cloud; failure can mean confusion with localized background count.
    cloud_sight_range: The cloud senses astrally active objects in line of sight to a range of 2 × cloud Rating
      meters; an astrally active object partially in view can attract it.
    masking: Against a magician masking an aura, the gamemaster rolls dice equal to cloud Rating to pierce
      mask (Grimoire II p46); successful roll recognizes food. Actual astral contact cannot be concealed by
      masking.
