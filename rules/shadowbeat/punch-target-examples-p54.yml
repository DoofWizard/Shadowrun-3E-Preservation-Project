headline: FASA7109 ShadowBeat original Punch Test examples, printed p54/PDF63
summary: Original fictional RPG example modifier components and optional GM replacement of a group factor.
data:
  publication: {title: ShadowBeat, publisher: FASA Corporation, year: 1992, catalog_number: FASA7109, source_pdf_sha256: d111ebcfcab4e40645e61f2924e58b5d8ace6ab4c18610e3085e324c52bd4278}
  supplements: [rule.shadowbeat-punch-tests-and-filing-p51-54]
  fictional_renton_beat:
    initial: {street_gang: 2, metahumans: 1, neighborhood: -1, low_rank: -2, violent_crime: 3, target: 3}
    two_days_later: {policlub: 2, street_gang: 2, metahumans: 1, neighborhood: -1, local_policlub_leadership: -1, violent_crime: 3, target: 6}
    additional_group_example:
      condition: If the beat expands to involve the fictional terrorist group Alamos 20,000.
      additional_modifier: 2
      gm_alternative: The GM may count Alamos 20,000 as replacing Humanis rather than adding a separate factor.
      replacement_net_change: 0
  fictional_burglary_beat:
    initial: {individual_criminals: 2, political_party: 2, low_rank: -2, felony: 2, target: 4}
    expanded: {federal_government: 6, national_area: 3, president_rank: 3, felony_and_abuse_of_office: 3, target: 15}
  example_scope: These are printed fictional scenario calculations, not new universal modifiers. The neighborhood value follows the printed table and examples, not the contradictory prose on p53.
