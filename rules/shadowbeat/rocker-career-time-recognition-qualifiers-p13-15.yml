data:
  publication: {title: ShadowBeat, publisher: FASA Corporation, year: 1992, catalog_number: FASA7109, source_pdf_sha256: d111ebcfcab4e40645e61f2924e58b5d8ace6ab4c18610e3085e324c52bd4278}
  corrects:
    record_id: rule.shadowbeat-rocker-status-income-message-p13-16
    prior_blob: 5c8f88798ebe2e9ee63eb7023c8daa15a03ee0fc
    field: data.booking.time_rule
    source_qualification: On p14 the number of successes reduces the Base Time; this passage does not explicitly specify the arithmetic. The existing division interpretation is not a separately stated original booking formula.
    failure: The entire Base Time elapses without a booking.
  career_adjudication:
    single_exceptional_success: On p13 the narrator cautions against treating a single Novastar result by an unknown band as sufficient for major promotion or a world tour; the usual consequences are favorable publicity, more bookings and possible recording income. This is a GM judgment qualification, not a replacement for the ratings table or status prerequisites.
  recognition:
    active_behavior: On p15 performing or taking another action that makes the fictional rocker recognizable can lower the Recognition Test target number, in addition to the existing appearance and disguise qualifications.
  scope: Original qualifiers only; no new target number, time formula, or native SR3 adapter inferred.
