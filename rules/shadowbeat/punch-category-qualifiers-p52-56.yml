data:
  publication: {title: ShadowBeat, publisher: FASA Corporation, year: 1992, catalog_number: FASA7109, source_id: source.fasa-7109}
  supplements: [rule.shadowbeat-punch-tests-and-filing-p51-54, rule.shadowbeat-beat-consequences-and-ratings-p55-56]
  printed_category_examples:
    special_interest:
      minor_organized_crime: [Seoulpa, Triads in North America]
      major_organized_crime: [Mafia, Yakuza, Triads in Asia]
    highest_rank:
      low_level: [gang members, employees, low-ranking members, ordinary people]
      managers: [individual gang leaders, local corporate managers, local government officials or agents, precinct police officials]
      executives: [company presidents, city and state officials, local Mafia capo, minor Yakuza oyabun, senior police officials]
      major_executives: [major corporate executive, senator or congressman, Mafia Don, major Yakuza oyabun]
