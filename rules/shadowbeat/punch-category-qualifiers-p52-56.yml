      famous_without_authority: [major media figures, sports stars, other news reporters, people with fame or notoriety but little authority]
  break_network_reward: The source describes raises, promotions or cash bonuses as usual prospects for reporters filing stories hot enough to break the network, not guaranteed payouts.
  final_ratings_trigger: Calculate the final ratings when the reporter marks the beat ended with 30.
  scope: The category examples apply to the published fictional RPG Punch table, not real-world classifications. Existing modifiers and formulas are unchanged.
