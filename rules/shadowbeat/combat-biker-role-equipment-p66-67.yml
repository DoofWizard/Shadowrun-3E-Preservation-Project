data:
  publication: {title: ShadowBeat, publisher: FASA Corporation, year: 1992, catalog_number: FASA7109, source_id: source.fasa-7109}
  role_eligibility:
    linebiker: {standard: [mace, riot gun], additional_choice: [flail, net, whip, bola], additional_count: 1}
    lancebiker: {standard: [lance, mace, riot gun]}
    thunderbiker: {standard: [mace, fictional concussion launcher], launcher_mount: fixed to cycle}
    goalie: {standard: [autoshot riot carbine, mace, tetsubo], on_foot: true}
  competition_resources:
    goalie_carbine_stun_rounds_per_play: 20
    thunderbiker_concussion_rounds_per_play: 3
    linebiker_and_lancebiker_stun_rounds_per_play: 3
    riot_gun_carry: carried or cycle-mounted at player discretion
    smart_weapons: permitted
    net: entangling, no direct damage stated
    unarmed_actions: permitted, including game-defined flying block
    replacement_and_reload: between plays
    armor_reference: rules/shadowbeat/combat-biker-competition-p65-67.yml
    safety_and_communication_reference: rules/shadowbeat/combat-biker-competition-p65-67.yml
  source_notes:
    p66: All sporting firearms use Stun ammunition under fictional match rules; concussion equipment is separately specified.
    p67: The earlier statement that linebiker and lancebiker cycles do not mount weapons conflicts with the later explicit optional riot-gun mounting permission; preserve both statements without inferred precedence.
    game_stat_scope: Source describes physical equipment construction without assigning complete tabletop damage or reach statistics here; descriptive construction details excluded. Reconcile any actual equipment stats separately against pp88-99.
