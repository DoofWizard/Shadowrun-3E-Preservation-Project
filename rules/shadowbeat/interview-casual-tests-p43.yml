framing: reference_exact
data:
  publication: {title: ShadowBeat, publisher: FASA Corporation, year: 1992, catalog_number: FASA7109, source_id: source.fasa-7109, source_pdf_sha256: d111ebcfcab4e40645e61f2924e58b5d8ace6ab4c18610e3085e324c52bd4278, chapter: And Now the News}
  interview:
    skill: Interview concentration of Interrogation; Trideo Interview specialization
    test: Standard Interview Success Test using original Shadowrun Social Skill guidelines p153
    usual_target: Interviewee Willpower
    alternatives: GM may substitute Intelligence or Charisma; actively resistant subject may use highest mental attribute
    impact: Highest resolved die total as with Pix Test; ordinary interview TN modifiers do not alter Impact
    on_camera: Interview may provide an extra Pix Test or Proof according to knowledge and test outcome
    off_camera: At least five successes may yield Proof but never counts as a Pix Test
    validity: Interview is voluntary; information compelled under duress is not valid documentation in this game system
    clues: Interviews may supply adventure clues or legwork
  casual_interviews:
    scope: Witnesses or people reacting to an event; one test regardless of number of interviewees
    target_modifiers: Scene sets TN and modifiers; hostile or frightened crowd worsens TN; friendly eager crowd improves it
    etiquette: Appropriate Etiquette Test at same TN; reduce penalties by one per two successes, never turn penalties into bonuses
    crowd_willpower_examples: {ordinary: 3, runners: 4, trained_magicians: [5, 6]}
    results:
      - {successes: '1-2', result: No extra information; on-camera excerpts count as extra Pix Test, Impact is best resolved die}
      - {successes: '3-4', result: Legwork-level information or minor clues; interview also counts as Pix Test subject to camera requirement}
      - {successes: '5+', result: Eyewitness account may count as Proof and supply adventure clues}
    knowledge_limit: Successes cannot create knowledge absent from the interviewees
    gm_constraint: Disallow casual interviews seeking nonexistent newsworthy events
    time_minutes: '1D6 * 10 before making test, if time matters'
  edition_lineage:
    sr3_status: unsuperseded_candidate_not_yet_compatibility_verified
    unresolved_comparisons: [Interview skill hierarchy, social test modifiers, Proof and Pix Test relationship]
