content_class: [rule_procedure]
headline: FASA7109 ShadowBeat original beat consequences and ratings, pp55-56/PDF64-65
summary: Fictional reporting career consequences, credibility and final ratings, with all five rating bands.
framing: reference_exact
data:
  publication: {title: ShadowBeat, publisher: FASA Corporation, year: 1992, catalog_number: FASA7109, source_id: source.fasa-7109}
  false_material:
    gm_secret_test: Once filed, fake pix or proof may be tested once; dice skill equals sum of Special Interest, Who Is Involved and Money modifiers; method-specific TN is defined in the earlier What Is Truth rules.
    if_detected: Story spiked, cumulative permanent Punch TN increase of 2 per detected incident, employee disciplinary action.
    restoration: GM may allow credibility recovery through a major honestly reported beat when the character genuinely reforms.
  spike:
    network_support: withdrawn; employee reassigned
    reopening: Pursue independently without network resources, collect additional material and file again using Punch Test; success sufficient to keep story alive restores assignment; another spike brings discipline.
  outside_pressure:
    gm_option: Roleplay opposition instead of using increased target numbers; keep threats within survivable game encounter scope.
    documented_retaliation: May count as proof if surviving reporter documents an attack connected to the beat; routine threats encountered in ordinary adventure activity do not qualify.
  ratings:
    calculation: Divide total Punch successes by highest File Number, then multiply by highest successfully faced Punch TN; add applicable break-network rating bonus from p52.
    rows:
      - {range: '0-10', result: employee discipline}
      - {range: '11-25', result: average, no reward or penalty}
      - {range: '26-50', result: above average, network employee reward}
      - {range: '51-60', result: national attention and network reward, next_major_beat_Punch_modifier: -2, legal_result: indictment of exposed criminals if filed proof usable as legal evidence; GM adjudicates}
      - {range: '61+', result: same as 51-60 plus appropriate legal or corporate action against exposed figures; GM determines fictional consequences}
    saved_bonus: May defer and accumulate bonuses across beats, but apply only one per beat; activate on any Punch Test and retain for all subsequent Punch Tests on that beat.
    rounding: Not specified on page; no inferred rule.
  edition_lineage: Original legacy rules only; SR3 adaptation and supersession unresolved.
