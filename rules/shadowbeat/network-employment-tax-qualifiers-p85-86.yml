id: rule.shadowbeat-network-employment-tax-qualifiers-p85-86
record_type: rule
status: source_reviewed
source: source.fasa-7109
printed_pages: '85-86'
pdf_pages: '94-95'
edition_scope: FASA Corporation ShadowBeat (1992), original legacy 2E-era tabletop rules; not native SR3.
content_class: [rule_exact]
framing: reference_exact
headline: ShadowBeat network career benefits, duties, advancement and tax-rate overlap
summary: Original optional archetype employment and affiliation rules, including unresolved overlap of two tax rates.
data:
  publication: {title: ShadowBeat, publisher: FASA Corporation, catalog_number: FASA7109, year: 1992}
  original_pdf_sha256: d111ebcfcab4e40645e61f2924e58b5d8ace6ab4c18610e3085e324c52bd4278
  affiliation:
    printed_page: 85
    multiple_affiliations_allowed: true
    affiliated_story_sale: Easier sale to that network and wider coverage; no numerical modifier specified.
    staff_support: Technicians, drivers with vehicles, researchers and ordinary security may assist; street-specialist services excluded.
    transport_qualifier: Equipment and transport depend on network resources and occasion; pirate assistance is generally less concerned with legality than major network assistance.
    reuse: Existing affiliation fees, 2D6 respondents and attribute and appropriate skill ratings of 3 remain unchanged.
  employment:
    printed_page: 85
    benefits: Salary provides lifestyle and all affiliation benefits.
    weekly_reporter_duty: File at least one story.
    weekly_nonreporter_duty: Work on one filed story.
    minor_roles: Staff reporter, technician, security specialist or similar position.
    major_roles: Featured reporter, field producer or senior news-team member.
    employment_table: Reuse six existing job/network lifestyle and purchase-cost rows.
    taxes_on_provided_lifestyle_covered: true
    additional_income_tax_percent: 20
    tax_scope: Paragraph concerns independent or major network employees with registered SINs; no rate inferred for anonymous pirate employees.
    demotion: Major job to minor job.
    dismissal: Minor job can be lost.
    promotion: Minor to major job; good performance at a smaller network may bring offers from larger networks.
    career_adjudication: Generally roleplayed from consistent performance rather than one ordinary success or failure; a spectacular failure such as fabricated evidence can end a career.
  additional_income:
    printed_page: 86
    official_sin_account_tax_percent: 33
    scope: Additional income entering official SIN-linked accounts; contract lifestyle taxes already paid.
    original_inconsistency: The 20 and 33 percent provisions may overlap; no precedence or stacking procedure is printed. Preserve both, with no automatic combined rate.
  reuse_without_duplication:
  - rule.shadowbeat-network-affiliation-employment-p85
  - rule.shadowbeat-sins-income-tax-discovery-p86
  source_review: {printed_pages: '85-86', physical_pdf_pages: '94-95', reviewed: 'Affiliation and employment prose, six table rows, and adjacent SIN tax paragraph; accepted matching fields reused.'}
