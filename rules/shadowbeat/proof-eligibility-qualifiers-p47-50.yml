  real_proof_eligibility: The original game distinguishes interview-test Proof from evidence obtained through actual adventure events; the latter must establish a fact, not arise merely from a few interview dice rolls.
  eyewitness_qualification: The book describes eyewitness evidence corroborated by trideo or other records as the strongest kind for public acceptance of a story; no separate numerical modifier is specified here.
  matrix_extract_qualification: In the fictional Matrix rules a genuine downloaded file extract can stand on its own if it has been successfully decrypted when necessary and was not previously fabricated and planted.
  scope: Original evidence eligibility only; no additional numerical bonus or native SR3 conversion inferred.
