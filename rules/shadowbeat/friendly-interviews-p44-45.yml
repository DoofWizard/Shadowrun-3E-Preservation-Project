content_class: [rule_procedure]
headline: FASA7109 ShadowBeat original Friendly Interviews, pp44-45/PDF53-54
summary: Friendly Interviews - original legacy game procedure, numerical conditions and exceptions; no verified SR3 replacement asserted.
framing: reference_exact
data:
  publication: {title: ShadowBeat, publisher: FASA Corporation, year: 1992, catalog_number: FASA7109, source_id: source.fasa-7109, source_pdf_sha256: d111ebcfcab4e40645e61f2924e58b5d8ace6ab4c18610e3085e324c52bd4278, chapter: And Now the News}
  target_basis: GM sets difficulty by relevance rather than NPC attributes
  testimony_target_numbers:
    - {type: direct_testimony, target_number: 3, condition: firsthand knowledge directly relevant to the story}
    - {type: background_testimony, target_number: 6, condition: recognized expert with information highly relevant but not directly connected}
    - {type: general_background, target_number: 8, condition: recognized expert whose information is not directly relevant}
  impact:
    base: highest resolved die when at least one success, as for Pix Test
    add: relevant subject skill rating if involved; otherwise higher of Charisma or Intelligence
    karma_bought_proof: use highest actual die result, not purchased successes
    worked_example_p44: {rolled_successes: 3, highest_actual_die: 9, purchased_successes: 2, karma_spent: 4, proof_impact: 9}
    worked_example_p45: {target_number: 8, successes: 2, highest_die: 17, relevant_skill: 6, impact: 23}
  outcome:
    proof_success_threshold: 5
    below_threshold_with_success: extra Pix Test
    eyewitness_exception: automatic Proof if eyewitness testimony establishes the story without requiring a roll
    karma_purchase: may purchase successes up to five under original Shadowrun p149; printed example buys two for four Karma points
    max_extra_pix_tests_from_friendly_interviews: 1
    proof_interview_count: GM discretion, normally one interview per subject area for a beat; GM determines how many may be arranged
  access:
    direct_testimony: roleplay to locate actual eyewitness
    willing_contact_or_adventure_npc_time_hours: [1, 2]
    otherwise: {test: appropriate Etiquette, target_number: 4, base_time_hours: 24}
    relevance_exception: GM may rule interview irrelevant to beat even when interview itself succeeds
  source_note: p44 preceding casual-interview example reduces TN 11 to 10 with one Etiquette success; accepted p43 general rule specifies one reduction per two successes. Preserve discrepancy without changing the earlier record.
  edition_lineage:
    sr3_status: unsuperseded_candidate_not_yet_compatibility_verified
    comparison_needed: Original social test and Karma procedures versus SR3; do not apply original edition mechanics natively without reconciliation.
  source_review:
    original_printed_pages: '44-45'
    original_pdf_pages: '53-54'
    editorial_scope: Fictional game rule reference only
