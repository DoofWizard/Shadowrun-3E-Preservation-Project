    original_pdf_sha256: d111ebcfcab4e40645e61f2924e58b5d8ace6ab4c18610e3085e324c52bd4278
  corrects: rule.shadowbeat-sins-income-tax-discovery-p86
  investigation_trigger: In the fictional game, investigation of a character by government
    or other authorities for any reason may reveal the accounting discrepancy; the
    trigger is not limited to scrutiny of official payments.
  reuse: Retain the existing 3D6 minus relevant Accounting or Law skill and official
    lifestyle fine calculation; no new discovery threshold or minimum fine is specified
    here.
  optional_social_modifier: The original permits extending the existing plus 2 social
    interaction target number modifier to other SINless characters beyond the named
    entertainment and reporting professions.
  source_review: Original printed p86/PDF95, SINs and SINners in the Shadows paragraphs,
    compared to indexed p86 record blob 17e2adc2d00651d67d113b7468c219791c06c171.
