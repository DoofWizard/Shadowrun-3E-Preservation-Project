headline: FASA7109 ShadowBeat fictional network encounter state qualifications pp28-29/PDF29-30
summary: Original tabletop search interruption, modifier eligibility and encounter outcome conditions, supplementing existing legacy dice tests.
data:
  publication: {title: ShadowBeat, publisher: FASA Corporation, catalog_number: FASA7109, year: 1992, source_id: source.fasa-7109}
  supplements: [rule.shadowbeat-network-conflict-tests-p27-29]
  broadcaster_game_state:
    stationary_located: Fictional security arrival in minutes; exact number not specified.
    mobile_reentry_before_trace_clock_expires: Fictional automatic trace locates the transmitter in minutes; exact number not specified.
  investigator_game_state:
    single_fixed_sampler:
      interruption_condition: Signal interruption exceeds one hour.
      consequence: Current search cannot complete; restart the search if the signal resumes.
    two_unit_modifier_eligibility: Two units in different locations or two mobile units.
    parallel_tasks: Multiple simultaneous search tasks are permitted where resources allow; no combined-roll formula specified.
  cable_game_state:
    location_result: Discovery of the fictional formatter does not establish the character's location unless the character is at the formatter.
  scope: Original abstract game-state conditions only; existing dice, clocks and unresolved ECM wording unchanged.
