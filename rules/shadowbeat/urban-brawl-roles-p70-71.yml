content_class: [rule_procedure]
headline: FASA7109 ShadowBeat original Urban Brawl role eligibility, pp70-71/PDF79-80
summary: Fictional competition roster, equipment categories, ball-carrier and communications restrictions.
framing: reference_exact
data:
  publication: {title: ShadowBeat, publisher: FASA Corporation, year: 1992, catalog_number: FASA7109, source_id: source.fasa-7109}
  roster:
    total: 13
    substitutions: between plays subject to injury and penalty rules
    augmentation_quantity_limit: none
    offensive_roles:
      scout: {count: 4, ballistic: 3, impact: 2, helmet: required, standard_equipment: personal sidearm}
      banger: {count: 4, ballistic: 4, impact: 3, helmet: required, standard_equipment: personal sidearm}
      heavy: {count: 2, ballistic: 4, impact: 3, helmet: required, standard_equipment: 'personal sidearm and one game weapon from assault rifle, SMG or shotgun categories'}
      blaster: {count: 1, ballistic: 3, impact: 2, helmet: required, standard_equipment: LMG with gyro-harness, gyro_harness_rating: 2}
    nonoffensive_roles:
      outrider: {count: 1, ballistic: 4, impact: 3, helmet: required, mount: motorcycle, standard_equipment: 'personal sidearm and one cycle-mounted game weapon from assault rifle, SMG or shotgun categories', may_carry_ball: false, may_transport_ball_carrier: false}
      medico: {count: 1, ballistic: 6, impact: 4, helmet: required, equipment: medical kit, uniform: bright glossy white, combat: prohibited, may_carry_ball: false}
    medico_exception: protected role; attack penalty exception applies when medico is mounted on outrider cycle because cycle remains a legal game target
  equipment_rules:
    personal_sidearm: single-action, double-action or semi-automatic game weapon up to Heavy Pistol class; specified short-barreled combat shotgun exception
    ammunition_quantity_limit: none
    additional_melee_equipment: generally permitted, external or cyberware
    prohibited_equipment: [monofilament weapons, electrically charged weapons]
    motorcycle_class: unrestricted for outrider, vehicle control rig allowed
    recovered_equipment: discarded melee equipment allowed; improvised in-game items allowed except firearms, monofilament or charged weapons
    registered_team_armor: dark and bright color required; yellow and gold prohibited because they obscure surrender indicators
    regulation_armor: approved surrender and penalty circuits, except medico rules on p72
    radio: two-way, range limited to Brawl Zone
    outside_communication_capability: must be neutralized for duration of match or player barred
  edition_lineage: {sr3_status: unsuperseded_candidate_not_yet_compatibility_verified, dependency: original role gear categories and armor ratings are competition constraints, not new native SR3 equipment stats}
  source_review: {printed: '70-71', pdf: '79-80', scope: all role counts, armor ratings, ball eligibility and game equipment restrictions}
