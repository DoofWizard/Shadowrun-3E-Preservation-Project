headline: Fictional Shadowrun ShadowBeat home receiver capabilities (FASA7109, 1992, pp20-23/PDF21-24)
summary: FASA Corporation original legacy game equipment qualifications cover included receiver costs, screen size, authorized terminal access and FAX and vidphone interfaces.
data:
  publication: {title: ShadowBeat, publisher: FASA Corporation, year: 1992, catalog_number: FASA7109, source_pdf_sha256: d111ebcfcab4e40645e61f2924e58b5d8ace6ab4c18610e3085e324c52bd4278}
  supplements: {record_id: rule.shadowbeat-home-trideo-eligibility-p20-23, prior_blob: 20819f9aff59e09fe3c1e300fa64446e4a2ad4fc}
  basic_receiver:
    lease_and_service_subscriptions_included_in_qualifying_lifestyle: true
    typical_flatscreen_diagonal_cm: [50, 90]
    typical_3V_display_volume_cubic_meters_approx: 1
    basic_terminal: Hardwired to free public databases; may also dial other Matrix systems for which the character has access.
  fax:
    standard_A4_scan_seconds: 0.5
    compatible_destinations: [other trid units, standalone FAX machines, personal computer FAX chips]
    received_data_modes: [immediate printing, storage in data files for later browsing or printing]
    standalone_purchase_and_connection: Allowed regardless of lifestyle; underlying phone or Matrix service still required for remote transfers.
  large_display: Compatible with any video or holo output, including broadcast TV, with no specific basic service prerequisite.
  vidphone:
    outgoing_image_source: Camera pickup in trid unit
    received_image_destinations: [TV display, dedicated vidphone display, compatible personal phone screen]
  edition_status: Original legacy equipment capabilities only; existing SR3 access rules, prices and service prerequisites are not replaced.
