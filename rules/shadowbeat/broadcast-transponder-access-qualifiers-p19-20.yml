headline: Fictional Shadowrun ShadowBeat satellite reception constraints (FASA7109, 1992, pp19-20/PDF20-21)
summary: FASA Corporation original legacy game device constraints cover exclusive transponder modes, feed selection, premium receiver interfaces and high-bandwidth Matrix reception.
data:
  publication: {title: ShadowBeat, publisher: FASA Corporation, year: 1992, catalog_number: FASA7109, source_pdf_sha256: d111ebcfcab4e40645e61f2924e58b5d8ace6ab4c18610e3085e324c52bd4278}
  supplements: {record_id: rule.shadowbeat-broadcast-transmission-p18-20, prior_blob: 768272205a7aa1ea89dad666f6b0808c0bd6e930}
  satellite:
    transponder_input_and_output_simultaneous: false
    output_compression_ratio: '4:1'
    receiver_selection: [satellite, transponder, program feed]
    home_controller: Typical home controllers automate program selection; public Matrix programming databases provide commercial satellite positions and transponder schedules.
    premium_reception: The original setting describes lawful premium receivers as using a real-time Matrix interface synchronized with the satellite feed for decryption.
    access_distribution: Home dish or cable from a shared central dish.
  matrix_transmission:
    high_bandwidth_modem_required_for_standard_trid_multiformat_reception: true
  edition_status: Original fictional media-system constraints; do not replace native SR3 Matrix mechanics or infer a new dice test.
