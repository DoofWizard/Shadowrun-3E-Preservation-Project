headline: Fictional Shadowrun ShadowBeat instrument classifications and Matrix audio output (FASA7109, 1992, pp8-9/PDF9-10)
summary: FASA Corporation original legacy game rules distinguish bowed and plucked instrument skill classes and specify file-based or host-permitted live Matrix audio output.
data:
  publication: {title: ShadowBeat, publisher: FASA Corporation, year: 1992, catalog_number: FASA7109, source_pdf_sha256: d111ebcfcab4e40645e61f2924e58b5d8ace6ab4c18610e3085e324c52bd4278}
  supplements: {record_id: rule.shadowbeat-instrument-control-p8-10, prior_blob: 7673140cab4f1c975be7180dd09ac73e15564fea}
  acoustic_skill_group_boundaries:
    winds: [horns, woodwinds, reeds, double reeds]
    strings: bowed instruments
    guitars: plucked string instruments including banjos and mandolins
    percussion: instruments played by striking
    keyboards: keyboard instruments including pipe organs and harpsichords
  matrix_audio_output:
    prerequisite: Compatible Matrix-connected OMNI terminal input
    additional_output_mode: Write transmission to a dedicated computer data file
    live_sampling_condition: Host system permits realtime sampling
    listener_interface: Direct ASIST input via cyberterminal rather than audible sound
  edition_status: Original legacy skill boundaries and output conditions only; no native SR3 skill or test conversion inferred.
