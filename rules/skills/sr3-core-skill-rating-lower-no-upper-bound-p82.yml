  original_section: Skills / Skill Ratings, with Specialization beginning below
  ratings:
    minimum_for_a_possessed_skill: 1
    if_below_minimum: A game character without rating 1 or higher does not possess
      that skill; an attempted skill-dependent action may still use the separate Skill
      Defaulting rule where permitted, not an invented skill-rating-zero die.
    dice_for_ordinary_skill_test: The skill rating is the number of six-sided dice
      rolled on a normal test with that skill; other dice pools and rule exceptions
      are determined separately.
    hard_upper_rating_limit: null
    upper_limit_statement: The original text explicitly says skill ratings have no
      upper limit, while acquisition and improvement become harder when a character
      skill rating rises far above its linked Attribute rating.
    linked_attribute_qualification: The original source cites the Skills and Linked
      Attributes Table on the same printed page for which Attribute a skill uses,
      and Improving Skills on printed p244 for advancement difficulty; this paragraph
      gives no specific numerical upper cap or Karma multiplier.
    rating_description_scope: The Skill Ratings Table on printed p98 supplies descriptive
      levels; it does not impose a limit of rating 8.
