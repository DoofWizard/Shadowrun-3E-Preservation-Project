{"content_class":["rule_exact"],"data":{"additional_skills":{"deduct":"Subtract total ratings of existing Knowledge skills before buying more; remaining points can also buy more Active skills using character creation rules.","knowledge_skill_point_budget_formula":"Intelligence x 5","read_write_language_rating":"Floor(Language Skill rating / 2)","worked_example":"Intelligence 6 gives 30 points; already has Magic Background 4 and Parazoology 3, subtract 7, leaving 23 points."},"already_indexed_canon_reused":["compatibility.sr2.character-conversion","compatibility.sr2.skill-conversion","rule.skills.specialization","rule.advancement.karma-pool"],"conversion_scope":"SR2 player characters and nonplayer characters are adjusted approximately, not necessarily rebuilt as exact copies.","dice_pools_and_threat_ratings":{"npcs_critters":"NPCs and critters no longer use Threat Ratings; use character-style dice pools per SR3 p43.","recalculate":["Astral Combat Pool","Hacking Pool"],"renamed":"Spell Pool replaces Magic Pool","unchanged":["Combat Pool","Control Pool"]},"editorial_review":{"limits":"Original published fiction/game conversion facts only; existing summary records reused; optional GM choices and rounded minima retained; no claim that SR2 source or all of p324 was independently completed here.","original_page":"Original FASA7001 PDF331 / printed p323 full source image inspected directly, both columns, with p324/PDF332 continuity reviewed.","reviewed_paths":["edition_scope","headline","summary","data.publication.*","data.conversion_scope","data.skill_conversion.*","data.additional_skills.*","data.dice_pools_and_threat_ratings.*","data.karma.*","data.already_indexed_canon_reused[*]","data.editorial_review.*"]},"karma":{"difference":"Add difference between old and new Karma Pool to Good Karma.","npc_critter_reference":"NPCs and critters receive Karma Pools by SR3 p248 guidelines.","old_pool_adjustment":"Divide old Karma Pool by 2, round down, minimum resulting Karma Pool 1.","species_scope":["elf","dwarf","ork","troll"]},"publication":{"catalog_number":"FASA7001","edition":"Third Edition","kind":"published fictional tabletop RPG rulebook","original_pdf_sha256":"7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914","physical_pdf_page":331,"printed_page":323,"publisher":"FASA Corporation","source_id":"source.sr3-core","title":"Shadowrun, Third Edition"},"skill_conversion":{"both_concentration_and_specialization":"Choose SR3 base skill and choose either the prior SR2 concentration or specialization as SR3 specialization, then add 1 each to converted base and specialization ratings.","combat_and_knowledge_concentrations_become_base":"For most SR2 combat and Knowledge concentrations, ignore SR2 base skill and convert the concentration into a SR3 base skill at the same rating.","concentration_if_no_equivalent":"Choose a new specialization for the base skill with the same rating as the old concentration.","concentration_if_sr3_specialization_exists":"Rename SR2 concentration to equivalent SR3 specialization; preserve its rating and base rating.","default":"Compare to SR3 Skills list and retain rating when the skill translates directly.","etiquette":"Converted SR3 Etiquette base rating is SR2 Etiquette rating minus 2; prior SR2 Etiquette concentration becomes SR3 specialization at equal rating.","etiquette_example":"SR2 Etiquette (Street 4) converts to SR3 Etiquette 2 (Street 4).","gunnery_example":"An SR2 Gunnery 3 (Machine Guns 5) could become SR3 Heavy Weapons 5, or at GM choice Heavy Weapons 3 plus Gunnery 2; the alternative is optional, not automatic.","multiple_etiquette":"Use highest SR2 Etiquette rating to determine SR3 base rating.","pistols_example":"SR2 Firearms 4 (Pistols 6 [Ares Predator 8]) becomes SR3 Pistols 6 (Ares Predator 8).","stealth_example":"SR2 Stealth 4 (Urban 6) becomes SR3 Stealth 4 (Sneaking 6)."}},"edition_scope":"FASA Corporation Shadowrun, Third Edition FASA7001 original printed p323/physical PDF331, conversion of fictional SR2 characters into the historical Third Edition tabletop RPG; not an SR2 rule replacement beyond the original update.","framing":"reference_exact","headline":"FASA Corporation Shadowrun Third Edition FASA7001: complete original fictional SR2 character conversions printed p323/PDF331, exact Skills, Karma and Knowledge","id":"rule.compatibility.sr2-character-conversion-exact-p323","pdf_pages":"331","printed_pages":"323","record_type":"rule","source":"source.sr3-core","status":"source_reviewed","summary":"Original fictional tabletop conversion rules: SR2 concentration/specialization and Etiquette ratings, Knowledge = Intelligence × 5, Read/Write = half language (down), adjusted dice pools and species-limited Karma minimum. Reuses existing general conversion canon."}
