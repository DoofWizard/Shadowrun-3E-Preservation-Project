id: rule.skills.tool-levels
record_type: rule
name: "Build/Repair Tool Levels"
domain: skills
status: ingested

effective:
  status: current
  source: source.sr3-core
  page: 288
  basis: defines

resolution:
  summary: "Build/Repair work requires tools appropriate to the job. SR3 divides tool support into kits, shops and facilities."
  levels:
    kit: "Portable basic equipment for repairs."
    shop: "Transportable only with a large van or small truck."
    facility: "Effectively immobile because of bulky, heavy machinery."
  cost_multipliers:
    general_construction: 1
    electronics_computer_cyberware_microtronics: 3
    vehicle: 2

links:
  uses:
    - rule.skills.build-repair

sources:
  - {source: source.sr3-core, page: 288, relation: defines, note: "Tools"}
