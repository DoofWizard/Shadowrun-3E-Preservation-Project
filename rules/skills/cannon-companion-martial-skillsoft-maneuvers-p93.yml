headline: 'FASA7908 Cannon Companion SR3: martial-art activesoft maneuver selection'
summary: 'FASA Corporation fictional tabletop game, printed p93/PDF94. Original skillsoft-specific maneuver capacity and purchase selection supplements the existing character conversion record.'
data:
  existing_records: [procedure.combat.convert-advanced-melee, rule.skillsofts.use]
  applies_when: Optional advanced melee and martial-art rules are in use.
  separate_active_skill_per_style: true
  full_rating_points_per_maneuver: 2
  maneuver_selection_timing: At purchase of the skillsoft.
  allowed_maneuvers: Only maneuvers permitted by the encoded style.
  example:
    style: Aikido
    activesoft_rating: 5
    allowed_maneuvers: 2
  distinct_loadouts: Two activesofts of equal rating and style may have different selected maneuvers.
  scope: No permanent learned skill or additional dice pool is inferred.
