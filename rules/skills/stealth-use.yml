scope:
  applies_to: ["Sneaking","Hiding","Theft","Alertness uses of Stealth"]
  excludes: []

resolution:
  summary: "Sneaking or hiding uses a Stealth Open Test; the highest result becomes the target number for observers' Perception Tests. Theft commonly uses an Opposed Test of Stealth against the victim's Intelligence. Alertness is treated as a Complementary Skill for Perception Tests when applicable."
  inputs: ["Stealth rating","specialization","observer Perception or victim Intelligence"]
  outputs: ["detection/evasion or theft result"]
  steps: []

