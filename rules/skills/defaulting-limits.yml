  "resolution": {
    "summary": "Under the original FASA7001 printed p85 rule, defaulting is barred if an action's ordinary modified target number is 8 or higher BEFORE adding the defaulting-route modifier. A test whose ordinary modified target number is below 8 does not become barred merely because adding +2/+3/+4 brings the resulting target number to 8 or more. For a defaulted Open Test, subtract the defaulting modifier from the highest die result.",
    "inputs": [
      "modified target number before defaulting-route adjustment",
      "selected default route and its +2/+3/+4 adjustment",
      "whether the required skill/action allows defaulting",
      "Open Test highest die result when applicable"
    ],
    "outputs": [
      "whether default is legal under original predefault cutoff",
      "target number with route modifier or adjusted Open Test result"
    ],
    "steps": [
      "Check whether the skill/action independently permits a default route.",
      "Compute all applicable nondefault test modifiers and evaluate the resulting target number BEFORE adding the defaulting-route penalty.",
      "If that predefault modified target number is 8 or higher, defaulting is forbidden.",
      "Otherwise apply the legal default-route dice and target-number modifier; the subsequent higher target number is not an additional exclusion under this threshold.",
      "If the defaulted test is an Open Test, apply the route penalty by subtracting it from the highest Open Test die result rather than increasing a target number."
    ]
  },
