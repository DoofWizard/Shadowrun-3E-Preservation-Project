id: rule.skills.cannon-companion-active-skill-item-scope-p104-105
record_type: rule
status: reviewed
source: source.cc
printed_pages: '104-105'
pdf_pages: '105-106'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: 'FASA7908 Cannon Companion SR3: Active Skill equipment eligibility'
summary: 'FASA Corporation, Shadowrun Third Edition, printed pp104-105/PDF105-106. Explicit fictional tabletop skill applicability omitted from the shared skill entities.'
data:
  armor_build_repair:
    existing_skill: entity.skill.armor-build-repair
    eligible_armor_types: all
    explicit_examples: [armor jackets, riot shields, hardened military-grade armor]
  spray_weapons:
    existing_skill: entity.skill.spray-weapons
    scope: All semi-liquid dispersal equipment in the source skill category.
    explicit_in_game_equipment_examples: [foam dispensers, flame-throwers]
    foam_dispenser_source_reference: Man and Machine p116
    flame_thrower_source_reference: Cannon Companion p29
  shared_skill_fields: Existing linked attributes, defaults, specializations and other skill categories are retained without duplication.
