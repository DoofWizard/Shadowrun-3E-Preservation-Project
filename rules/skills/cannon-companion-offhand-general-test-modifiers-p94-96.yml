id: rule.skills.cannon-companion-offhand-general-test-modifiers-p94-96
record_type: rule
status: reviewed
source: source.cc
printed_pages: '94-96'
pdf_pages: '95-97'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: 'FASA7908 Cannon Companion SR3: general handedness and Ambidexterity tests'
summary: 'FASA Corporation fictional tabletop game printed pp94 and 96/PDF95 and 97. General off-hand test modifier and Edge reduction absent from the existing two-weapon option; p95 is an illustration.'
data:
  existing_option: option.combat.two-weapon-fighting
  default_handedness: Player selects left or right unless character has Ambidexterity Edge.
  off_hand_tests:
    discretionary_gm_target_number_modifier: {min: 1, max: 4}
    condition: GM considers situation for a test involving the off hand.
  ambidexterity:
    allowed_edge_values: [2, 4, 6, 8]
    general_off_hand_penalty_reduction: Edge value divided by 2.
    follows_standard_edge_rules: Shadowrun Companion p15.
  off_hand_skill_classification: Each category-specific Off-Hand skill is Active and treated as its underlying melee skill.
  scope: Existing specialized two-weapon resolution is reused; no new combat procedure inferred.
