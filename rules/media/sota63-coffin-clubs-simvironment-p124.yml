ound_count_condition":"Particularly good shows can temporarily raise background count to the stated maximum; staff may use Cleansing metamagic to reduce the astral static.","temporary_background_count_at_particularly_good_show_max":3},"sim_vironment":{"track_price_yen":{"thirty_minutes":100,"sixty_minutes":150},"description":"Fictional immersive simsense/limited-Matrix hybrid supplies a full sim feed without full RAS override. Most physical senses are filtered, but full movement is permitted. Participants play selected characters and choose actions within scripted limits leading to predetermined possible endings.","reality_separation_test":{"attribute":"Willpower","target_number":8,"target_number_increase_per_failed_attempt":1,"repeat_interval_minutes_if_still_connected":5,"repeat_condition":"A character who does not disconnect repeats the test every five minutes to avoid losing touch with reality; a failed test increases the next attempt TN by one.","test_purpose":"Distinguish reality from the Sim-Vironment and jack out."},"custom_track_minimum_price_yen":75000,"custom_track_pricing_basis":"four-person Dir-X Full-X track and upward","custom_track_insertion":"Sim-Vironments are kept offline to prevent unauthorized access; insertion of a custom track must be physical. This restriction is on track insertion, not a mandatory wired interface for every participant."},"scope":"Applies only to Game Information on printed p124/PDF125. Separate Coffin Clubbing narrative on printed p109 is indexed independently. The page also begins separate Cracking rules not included here."},"framing":"reference_exact"}
