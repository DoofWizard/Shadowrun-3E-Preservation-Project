headline: 'FanPro10667 SR3 fictional simsense production, pp25-27/PDF26-28'
summary: 'SR3 recording eligibility, magic visibility and production qualifiers, compared with original core and ShadowBeat records.'
data:
  recording_p25:
    full_x_requires_implanted_simrig: true
    existing_mode_reference: rule.media.sr3-core-simsense-output-playback-p285-286
    existing_implant_reference: rule.cyberware.sr3-core-simrig-simlink-skillwires-p301
  production_p26:
    existing_stacking_reference: rule.shadowbeat-simsense-production-legacy-p74-78
    stacking_comparison: similar stand-in sensory characteristics, baseline replay and Full-X response capture; clarity degrades after about three overlaps, not a hard limit
    natural_sense_patches: recordings of useful sensory ranges, added during stacking or post-production
    pseudostim: computer-generated effects, then stacked through the performer sensorium; costly and time-consuming
  magic_p26:
    mana_spells_recordable: false
    astral_perception_recordable: false
    physical_spells_recordable: true
    illusion_response: a magical illusion can elicit an emotive response even though the illusion is absent from the recording; later visual effects can be added
    scope: physical spell casting is described as taxing and practical effects usually safer; no additional Drain or recording test given
  postproduction_p26_27:
    wet_record: unedited Baseline or Full-X simrig recording
    simth: removes background noise and mixes sense patches, pseudostim, effects and voiceovers
  lineage: retains native SR3 recording eligibility and reinforces historical stacking fidelity limit; no new numerical skill test, memory rate or automatic edition conversion
