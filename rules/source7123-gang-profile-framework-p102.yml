first_tier_gangs:
  requirements:
    - "A first-tier gang must operate in at least five cities or territories."
    - "A first-tier gang must have Markets in each of its turfs."
  rating_guidance:
    - "Using the Syndicate Rating system as a guide, a first-tier gang should have a total Operations and Market rating no greater than 30-45 in any city in which it operates."
    - "The gang's grand-total ratings for all cities combined should never be greater than 60; it is still a gang."
  use:
    - "Gang profiles use the Shadowrun Companion: Beyond the Shadows gang-description format beginning on p.121."
    - "The first-tier profiles add a Satellite Forces category for activities and approximate membership in other cities."

