headline: FanPro25002 SR3 p233 (PDF234) — Swiss fictional NPC prejudice rules
summary: The published fictional setting specifies regional NPC prejudice checks and optional social modifiers, not claims about real Swiss people.
data:
  section: Swiss Prejudice
  base_rule_reference: Shadowrun Third Edition p92
  prejudice_check:
    npc_category: fictional Swiss human NPC
    die_roll_modifier: -4
    qualification: Subtract only four from the prejudice check roll instead of the ordinary deduction.
  racism_table:
    applies_to: NPC determined to be racist under the game rules
    rolls: 2
    point_allocation: Divide the Racism Points between the two results as evenly as possible.
  optional_social_modifier:
    minimum: 1
    maximum: 5
    tests: [Social, Charisma]
    condition: A foreign or Awakened character deals with a biased fictional Swiss NPC.
    decision: gamemaster discretion
  exception: Only the regular racism rules apply to Swiss-French NPCs in this fictional setting.
