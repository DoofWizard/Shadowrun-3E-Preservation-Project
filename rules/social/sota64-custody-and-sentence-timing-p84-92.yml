pdf_pages: '85, 89, 93'
edition_scope: FanPro State of the Art 2064 (FanPro25004, 2004), Shadowrun Third Edition, corrected December 2005 PDF; fictional campaign time constraints.
content_class: [rule_procedure]
data:
  publication: {title: 'State of the Art: 2064', publisher: FanPro, catalog_number: FanPro25004, edition: Shadowrun Third Edition}
  scope: In-world narrative constraints for adjudicating fictional custody and sentence time, not a universal dice subsystem or current law.
  precharge_detention:
    printed_page: 88
    narrator: X-Star
    jurisdiction: UCAS
    maximum_hours: 72
    condition: The fictional narrator describes detention of a potential witness, victim or suspect before a criminal charge; usually the person is held only until adequately questioned unless more time is needed to collect evidence for a charge.
  parole_and_probation:
    printed_page: 84
    narrator: Wolf Larson
    parole: After serving part of a sentence, the parole board decides whether release is appropriate. Reporting is usually weekly and restrictions are case specific. Time on parole can extend beyond the original sentence.
    probation: Usually given to first-time offenders, often with community service; regular meetings and sentencing-body conditions apply. Violation results in imprisonment for the remaining sentence as described by the narrator.
    no_fixed_sentence_formula: true
  credit_for_time_served:
    printed_page: 92
    narrator: Hardcase
    condition: In the fictional account, pre-conviction jail time is credited against the sentence after conviction; the narrator notes that the credited time can exhaust the sentence.
  lineage:
    existing_sr3_adjudication: procedure.sota64-resolving-arrests-p97
    existing_legacy_reference: world.lone_star.operational_arrest.p98_100
    distinction: The accepted p97 record delegates proceedings to the GM and supplies no fixed timing; the historical Lone Star arrest record describes booking and arrest but not the 72-hour UCAS interval. Preserve this later in-world timing constraint without silently replacing the earlier source.
  limitations: No dice pool, target number, universal duration for bail or probation, or mandatory sentencing formula is supplied. Regional variations and narrator attribution remain applicable.
framing: reference_exact
headline: FanPro25004 Shadowrun Third Edition fictional custody and sentence timing
summary: Source-attributed UCAS precharge detention interval, parole and probation timing, and credit for jail time in a fictional campaign; no new dice subsystem.
