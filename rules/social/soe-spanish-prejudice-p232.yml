headline: FanPro25002 SR3 p232 (PDF233) — Spanish fictional NPC prejudice rules
summary: This published fictional setting adds regional NPC prejudice rolls and optional social test adjustments; it does not describe actual people or communities.
data:
  section: Spanish Prejudice
  base_rule_reference: Shadowrun Third Edition p92
  prejudice_check:
    npc_category: fictional Spanish Catholic NPC
    die_roll_modifier: -4
    qualification: Subtract only four on the prejudice check instead of the ordinary deduction.
  racism_table:
    applies_to: NPC determined to be racist under the game rules
    rolls: 2
    point_allocation: Divide the Racism Points between the two results as evenly as possible.
  optional_social_modifier:
    minimum: 1
    maximum: 5
    tests: [Social, Charisma]
    condition: An Awakened character deals with a biased fictional Spanish NPC.
    decision: gamemaster discretion
  exceptions: [Galicia, Asturias, Canaries]
  exception_scope: None of these regional changes applies to NPCs from the listed places.
