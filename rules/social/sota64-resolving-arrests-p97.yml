  procedure_kind: Optional fictional campaign adjudication, not a mandatory legal
    subsystem.
  trigger: A player character is arrested.
  detail: GM decides how much of the proceedings to roleplay, including lockup, arraignment,
    bail and encounters with fictional NPCs; new contacts may result.
  bail_branch: If bail is made, the character chooses whether to return to court or
    become a fugitive.
  trial_branch: GM may make the trial an adventure involving the party. A character
    with the Law skill can attempt self-representation; the source calls this difficult
    without specifying a test or target number.
  abbreviated_branch: On a guilty plea or an open-and-shut case, the GM may proceed
    directly to punishment, including probation or incarceration.
  fixed_test_or_sentence_table: None supplied.
