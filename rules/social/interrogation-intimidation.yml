resolution:
  summary: "Interrogation and Intimidation use Open Tests to generate resistance target numbers. Interrogation sets the target number for the subject's Willpower Success Test; Intimidation sets the target number the victim must meet with Willpower to resist."
  inputs: ["Interrogation/Intimidation rating","situational modifiers","subject Willpower"]
  outputs: ["resistance target number","resistance outcome"]
  steps: []

