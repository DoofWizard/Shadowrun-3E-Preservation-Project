data:
  section: Game Information — Border Crossing Random Encounter Table
  fictional_gm_usage: An optional Shadowrun game-master encounter-generation table
    for fictional border journeys, not actual surveillance evasion or real-world operations.
  dice: 3D6
  columns:
  - 3d6_roll
  - high_altitude_crossing
  - low_altitude_crossing
  - land_crossing
  - water_crossing
  outcomes:
  - roll: 3-4
    high_altitude: Special*
    low_altitude: Special*
    land: Special*
    water: Special*
  - roll: 5-6
    high_altitude: Flying Critter
    low_altitude: Critter
    land: Critter
    water: Critter
  - roll: 7-8
    high_altitude: Private/Corp/Cargo Craft
    low_altitude: Dead Zone**
    land: Fence/Natural Barrier
    water: Pirates
  - roll: '9'
    high_altitude: None
    low_altitude: None
    land: Gang or Rural Cop
    water: Private/Corp/Cargo Craft
  - roll: '10'
    high_altitude: None
    low_altitude: None
    land: Joe/Jane Citizen
    water: None
  - roll: '11'
    high_altitude: None
    low_altitude: None
    land: None
    water: None
  - roll: '12'
    high_altitude: None
    low_altitude: Dead Zone**
    land: None
    water: None
  - roll: 13-14
    high_altitude: Drone
    low_altitude: Ground Patrol
    land: Ground Patrol
    water: Boat Patrol
  - roll: 15-16
    high_altitude: Air Patrol
    low_altitude: Drone/Astral Patrol
    land: Astral/Drone Patrol
    water: Astral/Drone Patrol
  - roll: 17-18
    high_altitude: Fighter Squadron
    low_altitude: Drone/Air Patrol
    land: Air Patrol
    water: Naval Ship
  repeat_rules:
    Pueblo: 2
    Tir Tairngire: 2
    Aztlan: 3
    all_others: 1
  footnotes:
    special: An unusual GM-defined event, potentially an accident, dragon, fovea,
      forest fire, etc.; no fixed numeric statistic supplied.
    dead_zone: Roll again and consult the Land Crossing column for what lies in the
      dead zone; an implausible result instead becomes a ground patrol equipped with
      mobile radar and surface-to-air missiles.
  table_purpose: Fictional environment may still produce an encounter even when a
    detection test is unsuccessful; results depend on crossing type.
  historic_rules_context: Printed p110 of FASA7215; SR2-era content retained without
    3E conversion.
