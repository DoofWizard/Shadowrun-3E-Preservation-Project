data:
  section: Game Information — Vladivostok / Siberian wilderness
  fictional_rules_provenance: Original FASA Corporation 1998 historical Shadowrun Second Edition-era
    material; all modifiers are tabletop-game rules, not real-world instructions.
  background_count:
    general_siberian_wilderness_minimum: 1
    special_locations:
    - Lake Baykal
    - Tunguska Crater
    - Valley of Geysers
    special_locations_value_options:
    - 2
    - 3
    aspected_background: The source describes the background as aspected and cites Awakenings
      printed p104.
    conjuring_test_target_number: Desired spirit Force + the local Background Count, on every
      Conjuring Test in Siberia.
    rule_test_scope: All Siberian Conjuring Tests
    source_lineage: Awakenings p104
  power_sites:
    site_rating_range:
    - 1
    - 3
    rating_fluctuates: true
    effect: Additional Magic Pool dice for magicians attuned to the area (usually only the Evenk
      and other tribal shamans).
    gm_discretion: Gamemaster may adjust the area/rating numbers upward or downward.
    source_lineage: Awakenings pp103–104
  mana_surges:
    trigger: Whenever GM determines Background Count and/or Power Count of area has rating 2 or
      more, the Mana Surges rules must be used.
    automatic_regions:
    - Lake Baykal
    - Tunguska Crater
    - Valley of Geysers
    source_lineage: Shadowrun Companion (SRComp) p82
  talismongering:
    siberian_telesma_examples:
    - pine wood
    - minerals
    - herbs
    - precious metals
    - shapeshifter fur
    - Tunguska mutated plants
    activity: Gathering telesma for refining and artificing
    base_time_reduction_percent_range:
    - 25
    - 50
    rounding: Round up as expressly stated by printed page; do not invent missing time-unit formula.
    discretion: At gamemaster discretion.
    target: Base time for refining and artificing.
  critter_stat_column_legend:
    INT: The dice rolled and added to Reaction under standard initiative rules, not a fixed Intelligence
      statistic.
    rules_lineage:
    - Shadowrun, Second Edition p79 (initiative)
    - Shadowrun, Second Edition pp214–219 (critter powers)
    - Predator and Prey pp88–96 (critter powers)
  source_pages: FASA7215 printed p99/PDF100; Background Count, Talismongering in Siberia, New
    Critters introductory mechanics.
framing: reference_exact
