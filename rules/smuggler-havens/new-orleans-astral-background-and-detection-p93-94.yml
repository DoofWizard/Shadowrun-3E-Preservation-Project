data:
  heading: 'The Environment: astral background count and spirit detection'
  source_edition: Second Edition-era rule references, not automatically transplanted into SR3.
  background_count:
    french_quarter_standard: 1
    mardi_gras_possible_maximum: 3
    reach: At the height of Mardi Gras in many parts of New Orleans; the source says the count can rise AS HIGH
      AS 3, not always 3.
    effect: The high background count can make astral activity difficult in the fictional game.
    rules_reference: Grimoire 2, printed p89
  astral_spirit_detection:
    rule_reference: Grimoire 2, Astral Patrolling Table printed p92
    use: A game master may use the table to test whether a spirit notices an astrally active character.
    average_number_of_dice_for_detection_test: 4
    gm_exception: The number of dice may be increased or decreased according to desired spirit activity in the
      area.
  spirit_categories_specifically_named:
  - nature spirits
  - elementals
  - voudoun loas
  - ghosts
  - specters
  - watcher spirits
  - insect spirits
  - other free spirits
  additional_critter_reference: Game Information Critters section printed p95 and following.
