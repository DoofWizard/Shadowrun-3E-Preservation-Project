data:
  heading: New Loas
  great_form_loa:
    qualification: Voudoun initiates may attempt to summon a great form work loa by undergoing an astral quest.
    base_reference: Awakenings p127 describes work loas; use its normal work loa abilities.
    additional_powers:
    - Psychokinesis
    - Manifestation
    manifestation_effect: May assume a physical form.
    possible_forms: Great form work loa typically reflects one of the greater loa; source examples are Ogoun the
      Iron Warrior and Damballah as a great albino serpent.
    manifest_attributes_calculation: Use the statistics for Spirits of Man to calculate the great form loa’s manifest
      attributes.
  ancestor_spirits:
    availability: Many fictional New Orleans shamans are described as able to summon ancestor spirits.
    rule_reference: Cyberpirates p152
    optional_gm_integration: Game masters may include more traditionalist African shamanic characters using the
      described African-magic traditions from Cyberpirates.
  edition_lineage:
  - Awakenings pp120–131
  - Awakenings p127
  - Cyberpirates p152
