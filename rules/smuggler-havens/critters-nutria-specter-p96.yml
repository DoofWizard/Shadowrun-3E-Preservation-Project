data:
  heading: Critters — Nutria and Specter
  nutria:
    description: The source depicts an aggressive possum-sized rodent with orange teeth, common in fictional New
      Orleans and its surrounding region.
    stats:
      B: '1'
      Q: 3 x 3
      S: '1'
      C: —
      I: 1/3
      W: '1'
      E: '6'
      R: '4'
      INT: +1D6
    attack:
      damage: 5L
      type: bite
    powers:
    - Concealment (self only)
    - Immunity to Pathogens
    - Immunity to Poisons
    weaknesses: None
    infection: One-in-six chance any nutria carries VITAS-3, represented by 11 or 12 on 2D6. If bitten by an infected
      nutria, roll 2D6; result 9 or more means the character contracts the disease.
  specter:
    description: A hostile ghost capable of manifesting into the physical world; each has a Force rating; some
      are tied to a person or item as an anchor.
    stats_as_published_manifested_form:
      B: F+1
      Q: F+2 (x3)
      S: F−2
      C: F
      I: F
      W: F
      E: (F)A
      R: F+1
      INT: +1D6
    astral_form: Use Force for all tests rather than the printed manifested-form attributes.
    attack: Special
    powers_always:
    - Immunity to Normal Weapons
    - Manifestation
    possible_other_powers:
    - Accident
    - Compulsion
    - Confusion
    - Fear
    - Noxious Breath
    - Paralyzing Touch (or Howl)
    - Psychokinesis
    weaknesses: Some specters exhibit Allergy to certain important things from their lives.
    anchor_and_banishing: While its anchor exists, it is immune to banishing; astral combat may disrupt it, after
      which it returns after 28 minus its Force days.
    domain_exception: Powers with domain restrictions operate only in the particular place the specter haunts.
    free_spirit_options: The source says powerful specters may increase Spirit Energy using karma and possess
      free spirit powers including Hidden Life, Possession and Sorcery (Grimoire 2 pp76,79–81).
