  recorded as published, or GM scenarios remain distinctly optional; no Shadowrun 3E conversion.
data:
  source_section: Game Information — Undersea Security, FASA Corporation tabletop game mechanics
  undersea_camera_rules:
    ordinary_video_detection_range_meters: 150
    blue_light_detection_range_meters: 250
    blue_light_perception_test_target_number_modifier: '+1'
    blue_light_modifier_justification: Monochrome image quality impedes game Perception Tests.
    low_light_amplification_range_multiplier: ×2
    low_light_applicability: Normal or blue-light video cameras.
    lineage: 'Target: Smuggler Havens, historical Shadowrun Second Edition-era.'
  passive_sonar:
    rules_lineage: Cyberpirates pp168–169; aquacology sonar is passive only.
    swimming_diver_sonar_signature: 4
    ships_detecting_divers_sonar_modifier: '+4'
    aquacology_sonar_signature_range:
    - 1
    - 6
    undersea_mines_oil_rigs_power_stations_signature_range:
    - 1
    - 2
    marine_biological_research_stations_and_farms_signature_range:
    - 3
    - 5
    covert_bases_signature: 6 or possibly higher
  ultrasonic_sonar:
    rules_lineage: Rigger 2 pp27–32 (sensor rules), not ordinary sonar rules.
    sensor_rating: Any sensor rating (book says "may have any Sensor Rating")
    maximum_flux_rating: 1
  undersea_drones:
    normal_remote_control_range_without_cable_meters: 10
    cabled_range_limit: Length of cable, not nominal 10-meter radio limit.
    end_of_each_turn_snarling_check: Roll 2D6 at the end of every combat turn when maneuvering a
      cabled drone.
    snarling_trigger: If the 2D6 result is less than 2, or less than a GM-chosen threshold.
    source_anomaly_preserved: Less than 2 on a conventional 2D6 is mathematically impossible; this
      is preserved as printed, without silently changing it to <=2 or another TN.
    snared_effect: –10 modifier to drone Maneuver Score until cable is untangled.
    untangle_action: One full Combat Turn; drone can perform no other actions except untangling
      the snarl.
    free_ranging_drones: Multiple signal transmitters allow cable-free operation within designated
      patrol area; outside area carrier signal is lost and drone disconnects from remote-control
      network.
  publication_context: 'FICTIONAL tabletop role-playing game Target: Smuggler Havens, FASA Corporation,
    catalog FASA7215, 1998, printed page 103/PDF104, original Second Edition-era mechanics; no real
    equipment performance claim.'
