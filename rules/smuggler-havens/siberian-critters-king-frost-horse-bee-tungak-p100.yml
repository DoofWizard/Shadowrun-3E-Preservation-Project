summary: 'Archival description from the 1998 fictional Shadowrun sourcebook Target: Smuggler Havens
  (FASA Corporation, FASA7215), printed 100/PDF 101: King Frost, Humped Horse, Siberian Bee, and
  Tungak exact game statistics. Exact tabletop game statistics and dice remain verbatim in data.
  No Third Edition conversion assumed.'
data:
  section: Game Information — New Critters continued
  king_frost:
    other_names:
    - Crackle Frost
    - Frost
    description: Solitary trickster spirit, reported in forms including whirling snow, a man of
      ice and pale white woman; no verification that all manifestations are the same type.
    B: '5'
    Q: 6 × 3
    S: '3'
    C: '4'
    I: '5'
    W: '5'
    E: 6(A)
    R: 15/25
    INT: +1D6
    Attacks: 5S
    Powers:
    - Accident
    - Cold Aura (Zone × 2)
    - Engulf
    - Immunity to Cold
    - Immunity to Normal Weapons
    - Immunity to Pathogens
    - Immunity to Poisons
    - Magical Resistance
    - Manifestation
    - Movement
    - Petrification
    - Silence (Zone × 2)
    Weaknesses:
    - Vulnerability (Fire)
    reaction_pair: 15 manifest, 25 Astral Reaction
  humped_horse:
    description: The fictional source describes a two-humped equine native across Siberia, eastern
      Russia and Mongolia; valued as a mount, durable and magic-capable but difficult to train.
    B: '8'
    Q: 6 × 6
    S: '6'
    C: '3'
    I: 4/4
    W: '4'
    E: '6'
    R: '5'
    INT: +2D6
    Attacks: 6S
    Powers:
    - Adaptive Coloration
    - Animal Control (Equines)
    - Binding
    - Enhanced Movement
    - Guard
  siberian_bee:
    description: Fictional larger bee that favors electromagnetic fields and builds hives around
      transformers, generators and similar power sources; source describes historical Siberian
      beekeeping.
    B: '2'
    Q: 5 × 3
    S: '1'
    C: —
    I: 1/3
    W: '2'
    E: '6'
    R: '5'
    INT: +2D6
    Attacks: 4M Sting, Venom
    Powers:
    - Electrical Projection (see below)
    - Enhanced Senses (electromagnetic)
    - Immunity to Pathogens
    - Immunity to Poisons
    - Venom
    Notes:
      flying_quickness_multiplier: 5
      minimum_bees_for_combined_projection: 10
      combined_attack_cost: Complex Action
      combined_attack: One Electrical Projection attack against one target
      participating_bees_reuse_delay: D6 turns before those bees may project again, regardless of target.
  tungak:
    description: Siberian sickness spirit in the source’s fictional folklore account.
    B: '2'
    Q: 6 × 3
    S: '2'
    C: '2'
    I: '5'
    W: '5'
    E: 6(A)
    R: 15/25
    INT: +1D6
    Attacks: 4S
    Powers:
    - Blindness
    - Darkness
    - Immunity to Cold
    - Immunity to Normal Weapons
    - Immunity to Pathogens
    - Immunity to Poisons
    - Noxious Breath
    - Pestilence (see below)
    Pestilence: The gamemaster may choose any disease to inflict through the Pestilence power,
      including the explicitly named fictional VITAS 3.
    Optional_powers:
    - Alienation
    - Confusion
    - Essence Drain (Permanent)
    reaction_pair: 15 manifest, 25 Astral Reaction
  mechanical_lineage: Historical game mechanics exactly as published; no Shadowrun Third Edition
    conversion.
  source_pages: FASA7215 printed p100/PDF101, including Tungak table in upper-right continuation
    and Siberian Bee Notes.
