data:
  heading: Russian Inefficiency; The Siberian Wilderness — Spirits
  corporate_etiquette_rule:
    trigger: Characters who use the Etiquette (Corporate) Concentration in the Russian business-practice situation
      described on printed p98.
    target_number_modifier: '+1'
    scope: Add to all target numbers for Etiquette (Corporate) Concentration tests in that setting.
  siberian_spirit_behavior:
    narrator_account: The source portrays spirits summoned in Siberia as strong-willed and independent. They resent
      being enslaved into service, carry out compelled services with extreme reluctance and seek chances to
      break free; these acts are explicitly unwilling, not consensual.
    conditional_turn_on_summoner: If the summoner becomes weakened, the spirit may turn against that
      summoner; this possibility is conditional and not described as automatic.
    tribal_shaman_negotiation: Some Siberian tribal shamans negotiate favors with spirits rather than
      enslaving them. The source says this can result in the shaman carrying out the spirit’s bidding.
    optional_setting_effects: The book describes manifested spirits as sometimes acting spontaneously to protect
      their domains and occasionally exhibiting the Free Spirit power Animal Form.
    rule_reference_for_animal_form: Grimoire 2 p79
    rule_reference_for_manifested_spirits: Grimoire 2 p76
    unmodified_core_rule: All standard rules for manifested spirits still apply; no additional numeric modifier
      is given for this description.
