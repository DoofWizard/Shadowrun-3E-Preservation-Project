data:
  section: Game Information — New Critters
  stat_legend:
    B: Body
    Q: Quickness
    S: Strength
    C: Charisma
    I: Intelligence
    W: Willpower
    E: Essence
    R: Reaction; paired values denote manifest/astral when source explicitly says so
    INT: Initiative dice added to Reaction
    Attacks: Source damage code and special qualifiers preserved
  baba_yaga:
    aliases:
    - Likho
    - Greedy Mogus
    form: Spectral, gnarled, bloodless old woman with white hair; some appear to have only one
      eye. The source describes nocturnal forest encounters, a fictional entity that may consume
      metahuman flesh and employ Essence Drain.
    B: '5'
    Q: '5'
    S: '5'
    C: '2'
    I: '5'
    W: '7'
    E: 8(A)
    R: 10/20
    INT: +1D6
    Attacks: 7M, Special
    Powers:
    - Accident
    - Compulsion (Zone × 2)
    - Darkness
    - Enhanced Senses (Smell)
    - Essence Drain (Temporary)
    - Fear (Zone × 2)
    - Glamour
    - Immunity to Age
    - Immunity to Cold
    - Immunity to Normal Weapons
    - Immunity to Pathogens
    - Immunity to Poisons
    - Magic Sense
    - Manifestation
    - Paralyzing Touch
    Weaknesses:
    - Allergy (Sunlight, Mild)
    - Essence Loss (1 point per month)
    Essence_Drain_requirement: Must consume flesh to use the Essence Drain power.
    Optional_powers:
    - Cold Aura
    - Confusion
    - Enhanced Physical Attribute (Strength, twice per day for Essence × D6 turns)
    - Magic Resistance
    - Sorcery
    reaction_pair: 10 manifest, 20 Astral Reaction
  siberian_firebird:
    description: Larger Siberian cousin of North American firebird, carnivorous; golden feathers
      valued as telesma. The source says it uses Accident and Desire Reflection on those seeking
      feathers.
    wingspan: 2.5 meters
    length: 2 meters
    B: '4'
    Q: 6 × 3
    S: '4'
    C: —
    I: 3/4
    W: '3'
    E: (6)
    R: '6'
    INT: +2D6
    Attacks: 8M
    Powers:
    - Accident
    - Desire Reflection
    - Fire Resistance
    - Flame Aura
    - Movement
    - Search
  woolly_mammoth:
    description: Fictional reports of living specimens emerging around 2015; source says some
      Siberian tribes reportedly trained them for riding and claims wartime use in the Russian–Siberian
      War. These are source-reported claims, not real zoology.
    B: 12/4
    Q: 5 × 5
    S: '12'
    C: —
    I: 1/4
    W: '4'
    E: '6'
    R: '4'
    INT: +1D6
    Attacks: 7D, +1 Reach
    Powers:
    - Adaptive Coloration
    - Enhanced Senses (Low Light Vision)
    - Enhanced Movement
    - Immunity to Cold
    - Regeneration
    Notes: Woolly mammoths are not affected by illusion spells.
  source_pages: FASA7215 printed p99/PDF100, New Critters table and accompanying notes. All exact
    historical game statistics.
