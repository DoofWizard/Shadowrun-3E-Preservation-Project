data:
  section: Game Information — Running the Border; Unauthorized Border Crossing Table
    and Sensor Ratings Modifiers Table
  fictional_rules_scope: The pages provide abstract game sensor-rating tests for the
    fictional Shadowrun North American states, not actual border or security-system
    specifications.
  nations_table_columns:
  - nation
  - sensor_rating
  - flux
  - ECCM
  - ECD
  - threat/professional_rating
  unauthorized_border_crossing_table:
  - nation: Algonkian
    sensor_rating: 3
    flux: 5
    eccm: null
    ecd: null
    threat_professional_rating: 3/3
  - nation: Athabaskan
    sensor_rating: 5
    flux: 4
    eccm: 5
    ecd: null
