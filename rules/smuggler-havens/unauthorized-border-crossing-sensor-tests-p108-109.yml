  crossing_resolution:
    trigger: Fictional characters cross a national boundary anywhere other than an
      authorized checkpoint.
    both_sides: For each nation on either side, make a Sensor Test with relevant modifiers.
    sensor_dice: Number of dice equals that nation Sensor Rating after modifiers from
      the Sensor Ratings Modifiers Table.
    target_number: Vehicle Signature, applying appropriate modifiers; cited to Rigger
      2 p27.
    random_factor: Use one randomly selected modification from the Random Factors
      (2D6) table to represent unequal coverage and differentiate challenges; see
      p109.
    electronic_countermeasures: For characters using ECM or ED electronic warfare,
      game text references Flux, ECCM, ECD, the nation rating and appropriate Flux
      modifiers (Rigger 2 pp31, 109).
    undetected: If modified Sensor Rating is 0 or less, or modified Flux Rating is
      below 0, characters happen to cross through an area not covered by sensors.
    underwater: Underwater border crossing instead follows the passive/active sonar
      rules cited to Cyberpirates pp168–169; use context-dependent GM test.
  response_on_detection: Nation adjusted Flux Rating informs distance of detection
    using the Rigger 2 Flux Rating and Range Table; fictional patrol/interception
    encounters follow.
  encounter_even_if_undetected: After escaping sensor detection, players still roll
    on Border Crossing Random Encounter Table (p110).
  encounter_frequency_override:
    Pueblo: 2
    Tir Tairngire: 2
    Aztlan: 3
    otherwise: 1
  sensor_ratings_modifiers_table_columns:
  - situation
  - sensor_modifier
  - flux_modifier
  sensor_ratings_modifiers_table:
  - situation: Hostile Border
    sensor_modifier: '+2'
    flux_modifier: '+2'
  - situation: Near Major City or Airport
    sensor_modifier: '+1'
    flux_modifier: '+4'
  - situation: Commercial Flight Altitude (1,000–15,000m)
    sensor_modifier: '0'
    flux_modifier: '+2'
  - situation: Very High Altitude (over 15,000m)
    sensor_modifier: '-1'
    flux_modifier: '-4'
  - situation: Low Altitude NOE (100–1,000m)
    sensor_modifier: '0'
    flux_modifier: '0'
  - situation: Nape-of-Earth Flight (less than 100m)
    sensor_modifier: '-1'
    flux_modifier: '-2'
  - situation: Land Travel
    sensor_modifier: '-3'
    flux_modifier: '-3'
  - situation: River or Lake Travel
    sensor_modifier: '-3'
    flux_modifier: '0'
  - situation: Sea or Ocean Travel
    sensor_modifier: '-1'
    flux_modifier: '0'
  random_factors_roll: 2D6
  sensor_ratings_random_factors:
  - roll: '2'
    sensor_modifier: '-2'
    flux_modifier: '-2'
  - roll: 3-4
    sensor_modifier: '-2'
    flux_modifier: '0'
  - roll: 5-6
    sensor_modifier: '-1'
    flux_modifier: '0'
  - roll: '7'
    sensor_modifier: '0'
    flux_modifier: '0'
  - roll: 8-9
    sensor_modifier: '+1'
    flux_modifier: '0'
  - roll: 10-11
    sensor_modifier: '+2'
    flux_modifier: '0'
  - roll: '12'
    sensor_modifier: '+3'
    flux_modifier: '+2'
  historical_lineage: Rigger 2 references retained as printed, no inferred replacement
    by Rigger 3 or SR3 tables.
