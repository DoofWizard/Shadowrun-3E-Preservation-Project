data:
  heading: Critters — Corpselight; Devil Jack Diamond
  stat_column_legend: B=Body; Q=Quickness; S=Strength; C=Charisma; I=Intelligence; W=Willpower; E=Essence; R=Reaction;
    INT=Initiative. Reproduce game statistics literally with their dice notation.
  source_lineage:
  - Shadowrun Second Edition pp214–219
  - Predator & Prey pp88–96
  - Shadowrun Second Edition p79 initiative rules
  corpselight:
    type: Fictional astral creature also called will-o’-the-wisp that manifests as a glowing pale-light sphere
      approximately 0.3 metres across and typically a couple of metres above the ground.
    behavior: The source says it feeds on living creatures’ Essence, using fear and dangerous situations to facilitate
      this.
    stats:
      B: '5'
      Q: '10'
      S: —
      C: —
      I: '2'
      W: '5'
      E: (2D6)A
      R: '5'
      INT: +2D6
    melee_attack:
      damage: 3M
      attack_type: burning touch
      reach_modifier: -1 Reach
    astral_combat_force: Force equals its current Essence rating.
    powers:
    - Essence Drain
    - Immunity to Normal Weapons
    - Manifestation
    - Movement
    - Psychokinesis
    - Regeneration
    weaknesses:
    - Essence Loss
    essence_at_first_encounter: 2D6
    maximum_essence: 12
  devil_jack_diamond:
    type: Large fictional fish from a lumberjack legend; averages 3 metres in length and weighs approximately
      150 kilograms.
    behavior: Possesses heavy scales, broad flat head and powerful jaws with sharp teeth; floats near the surface
      when not feeding.
    stats:
      B: 5/3
      Q: 3 x 5
      S: '5'
      C: —
      I: 1/3
      W: '4'
      E: '6'
      R: '4'
      INT: +2D6
    attack:
      damage: 8S
      type: bite
    armor_exception: +2 points of armor against attacks directed against its back.
