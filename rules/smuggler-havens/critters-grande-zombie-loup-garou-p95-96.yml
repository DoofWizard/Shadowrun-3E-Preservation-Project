data:
  heading: Critters — Grande Zombie and Loup Garou
  grande_zombie:
    classification: Fictional loa zombie (Awakenings p130) that escapes its summoner’s control and becomes a free
      spirit (Grimoire 2 p76).
    binding: Bound to the body it occupied when it became free; already bound to a physical form.
    powers: Has ordinary loa-zombie abilities except effective Force increases by Spirit Energy as for other free
      spirits.
    new_free_spirit_powers: Receives 1D6 ÷ 2 free-spirit powers upon becoming free, usually Aura Masking, Hidden
      Life and Sorcery (Grimoire 2 pp79–81).
    forbidden_form_powers:
    - Animal Form
    - Human Form
    - Possession
    metabolic_requirement: 'Essence Loss (Shadowrun Second Edition p220): loses one point of Force every month.
      To sustain the spirit, it must consume human or metahuman flesh every month.'
    gm_setting_context: The source suggests fictional opportunities in the organ trade and some voudoun sects;
      possible disguise with illusion spells and Aura Masking; some control or infiltrate ghoul groups. These
      are source descriptions, not real-world recommendations.
  loup_garou:
    classification: Fictional infected human; strain of Human-Metahuman Vampiric Virus (HMHVV) causing a transformed
      lupine appearance.
    transformation: The source says the person has generally little ordinary human intelligence, with a peak of
      4 to 6 days of every 28 days in a ravening state; circumstances are not a voluntary choice.
    local_bounty_nuyen: 1,500 or more in New Orleans and most other municipalities; fictional public-health bounty.
    infection: Anyone bitten or otherwise contacting a loup garou may become infected with its HMHVV strain; successful
      Body (6) Test required to avoid infection.
    stat_columns:
    - B
    - Q
    - S
    - C
    - I
    - W
    - E
    - R
    - INT
    stats:
      B: 4 (6)
      Q: 4 x 4
      S: 7 (9)
      C: —
      I: 3/4
      W: '4'
      E: '5'
      R: 4 (6)
      INT: +1D6 (+3D6)
    attack: 7M (9M)
    powers:
    - Enhanced Physical Attributes (Strength, once per day for (Essence)D6 turns)
    - Enhanced Senses (Thermographic Vision)
    weaknesses:
    - Allergy (Sunlight, Severe)
    - Allergy (Aconite or Horseradish, Severe)
    parentheses_note: Statistics in parentheses refer to creature at peak power.
