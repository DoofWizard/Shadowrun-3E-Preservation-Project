data:
  section: Game Information — Special Rules for Low-Altitude Vehicles (LAVs), continued
    on p107; Optional Vehicle Rules and Flight Ceiling Table
  source_setting: All numeric procedures are for the fictional Shadowrun tabletop
    RPG; p106–107 explicitly refers to historical Rigger 2 and SR2 rather than a Shadowrun
    3E conversion.
  low_altitude_vehicle_description:
    also_called:
    - t-bird
    - thunderbird
    motion: A thrust-based aircraft rather than conventional aerodynamic-wing lift.
      The game text describes maneuverability and armor as distinctive features.
    altitude_limit_meters: 1500
  takeoff_and_landing:
    vstol_label: Very Short Takeoff and Landing (VSTOL)
    runway_meters:
      takeoff: 120
      landing: 240
    vtol: Vertical Takeoff and Landing (VTOL) uses downward jet blast; no runway required
      but consequences for nearby people and equipment.
    unusual_surface_piloting:
      test: Piloting Test
      modifier_to_target_number: '+1'
      reference: Rigger 2, p36
      on_failure: LAV automatically acquires 2 points of vehicle Stress.
      scope: VTOL takeoff or landing on unusual surfaces.
    jetwash_personnel:
      within_radius_meters: 15
      damage_code: 8M Physical
      resolution: Exposed personnel resist blast damage; Impact armor applies, Combat
        Pool dice cannot aid the Damage Resistance Test.
    jetwash_vehicles:
      within_radius_meters: 15
      qualifying_body: Body 2 or less
      damage_code: 8L
      damage_reduction: Vehicles use their applicable damage-reduction rule.
    hearing_effect:
      within_radius_meters: 15
      test: Body (4) Test
      exception: Helmets that incorporate special hearing protection negate this hearing
        test.
      failure: Partial hearing loss; +1 modifier to hearing-related Perception Tests.
      source_exception: Cyber-ears with a dampener modification, cited at SR2 p247,
        do NOT qualify as adequate hearing protection here.
  stall_speed:
    threshold_meters: The t-bird stall-speed rule applies at height 75 meters or higher
      only.
    below_75_meters: Stall-speed rule does not apply because ground effect gives lift,
      but t-bird must follow the same terrain type and movement restrictions as ground
      vehicles.
  flight_ceiling_table_meters:
    thunderbird: 1500
    zeppelin: 4000
    helicopter: 6000
    jet_propeller_single_engine: 6000
    jet_propeller_twin_engine_or_airliner: 10000
    jet_turbine_fixed_wing_aircraft: 12000
    fighter_aircraft: 20000
  flight_ceiling_footnotes:
    fighter_aircraft: Includes jump-jet fighters operating in vectored-thrust mode.
    helicopter: Includes tilt-wing aircraft operating in autorotation/hover mode.
  flight_ceiling_exceptions:
    lav_zeppelin_helicopter: Cannot generate enough lift to rise beyond their flight
      ceilings.
    fixed_wing_above_ceiling: Engines stall, aircraft begins to plummet. Pilot must
      succeed at a Piloting Test with the aircraft Handling Rating as target number
      to restart engine before crashing.
    test_frequency: Pilot may attempt only one Piloting Test per Combat Turn, but
      may make as many tests as possible across turns before crash.
  nape_of_earth_noe:
    aircraft_height_threshold_meters: Below 100
    drone_height_threshold_meters: 20 or less
    terrain: Aircraft uses the same terrain type and restrictions as ground vehicles.
    sensor_test_modifier: +1, IN ADDITION TO ground-terrain modifiers (Rigger 2 p28).
    pilot_failure: Whenever an NOE Piloting Test fails, the pilot must make a Crash
      Test (Rigger 2 pp51–52).
  sensor_dead_zones:
    source_description: Natural terrain may prevent sensor detection of low-flying
      targets; GM may delineate terrain dead zones and adjust Border Crossing random-encounter
      results for circumstances.
    sensor_detection: Anything inside a Sensor Dead Zone cannot be detected by a Sensor
      Detection Test. The dead-zone areas themselves also cannot be detected by a
      Sensor Detection Test; this is distinct from a statement that the sensor hardware
      itself is invisible.
    map_locating_test:
      requirement: Autonav System Rating 3 or greater, map/terrain display
      test: Intelligence (5) Test
      alternative: Appropriate local-area Knowledge Skill may substitute for Intelligence
        Attribute.
      success: Suggests possible dead zones.
      failure: Character infers dead-zone locations incorrectly.
    submarine_note: Underwater canyons and crevasses might create smaller, less frequent
      sonar dead zones because sonar sound diffracts around corners.
  mechanical_preservation_note: All distances, target numbers, modifiers, prerequisites,
    and historical rules citations transcribed from the printed p106–107 illustrations;
    not rebalanced for SR3.
