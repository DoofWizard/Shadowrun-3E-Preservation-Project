scope:
  applies_to:
  - secondhand bioware
resolution:
  summary: Only basic bioware can be obtained used, at 60 percent of normal cost,
    with one permanent Stress point that cannot be removed. Cultured bioware cannot
    be reused. The gamemaster may rule that treatment-like implants are not available
    used.
  inputs:
  - bioware grade/type
  outputs:
  - whether secondhand implantation is possible
  steps:
  - Confirm the implant is basic grade and physically reusable at the gamemaster’s
    discretion.
  - Multiply normal cost by 0.60.
  - Assign one permanent, unremovable Stress point.
