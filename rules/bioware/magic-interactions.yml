resolution:
  summary: "Most magical effects combine normally with bioware, but the source defines bounded exceptions: metabolic-suspension effects do not stack, pain-resistance bioware has limits against magical pain effects and Nerve Strike, reflex-enhancement bonuses use only the highest applicable Reaction/Initiative bonus, and thermosense is not defeated by vision-based illusions."
