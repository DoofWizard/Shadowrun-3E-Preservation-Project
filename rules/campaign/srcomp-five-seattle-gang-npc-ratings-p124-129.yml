id: rule.campaign.srcomp-five-seattle-gang-npc-ratings-p124-129
printed_pages: 124-129
pdf_pages: 125-130
data:
  section: Alternate Campaign Concepts — Gang Creation on the Fly — Gangs in Shadowrun
  rule_context: Five source-printed Seattle street-gang examples support the optional NPC gang scaling procedure
    on printed p124. These are in-world fictitious example groups and not a default rule for actual organizations.
  fields: Gang Rating is one of Inferior, Equal, Superior, or Superhuman. Head Count is the source-described
    membership count. Lieutenants is a count or qualification for a named group.
  original_source_named_sample_groups:
  - name: The Halloweeners
    canonical_organization_id: entity.organization.halloweeners
    printed_pages: 124-125
    physical_pdf_pages: 125-126
    leader: Slash and Burn
    gang_rating: Superior
    head_count_min_approx: 25
    head_count_max_approx: 40
    lieutenants: 5
    membership_metatype: unrestricted_by_stated_metatype
    membership_note: Originally human; the fictional leader subsequently admits anyone willing to oppose megacorporations.
    leader_metatype: human
    explicitly_identified_npc_roles:
    - {name: Zazz, metatype: human, role: mage, limitation: mental block against using fire spells}
    - {name: Zany Janey, metatype: human, role: razorgirl}
    - {name: Honest Jack, metatype: dwarf}
    - {name: Sister Love, metatype: elf, role: rigger}
    - {name: Bobby Blue, metatype: troll}
  - name: The Spiders
    canonical_organization_id: entity.organization.spiders
    printed_pages: 125-127
    physical_pdf_pages: 126-128
    leader: Widow
    gang_rating: Superior
    head_count_min_approx: 50
    head_count_max_approx: 100
    lieutenants: 5
    membership_metatype: mixed
    leader_metatype: human
    leader_magical_role: Spider shaman
    explicitly_identified_npc_roles:
    - {name: Tarantula, metatype: ork}
    - {name: Fiddler, metatype: elf}
    - {name: Trapdoor, metatype: dwarf}
    - {name: Wolf, metatype: human, magic_qualification: 'Gang regarded him as a potentially powerful magician; no definite magical character type or rating stated.'}
    - {name: Recluse, metatype: troll}
  - name: The Spikes
    canonical_organization_id: entity.organization.spikes
    printed_pages: 127-128
    physical_pdf_pages: 128-129
    leader: Lord Torgo
    gang_rating: Superior
    head_count_min_approx: 15
    head_count_max_approx: 25
    lieutenants: 2
    membership_metatype: troll_only
    leader_metatype: troll
    explicitly_identified_npc_roles:
    - {name: Goddess Ursula, metatype: troll}
  - name: The Red Hot Nukes
    canonical_organization_id: entity.organization.red-hot-nukes
    printed_pages: 128-129
    physical_pdf_pages: 129-130
    leader: Grinder
    gang_rating: Equal
    head_count_min_approx: 15
    head_count_max_approx: 25
    lieutenants: 0
    lieutenants_original_wording: None
    membership_metatype: dwarf_only
    membership_magical_role: adept
    leader_metatype: dwarf
    leader_magical_role: adept
  - name: The Night Hunters
    canonical_organization_id: entity.organization.night-hunters
    printed_pages: '129'
    physical_pdf_pages: '130'
    leader: Stiv (main group)
    gang_rating: Equal
    head_count_min_approx: 20
    head_count_max_approx: 30
    lieutenants: 2
    lieutenants_original_qualification: Main group; splinter gangs vary
    membership_metatype: human_only
    splinter_leadership: Each splinter gang has its own leader.
  named_template_scenario_conditions:
    scope: Optional fictional NPC profile conditions, not universal gang or character advancement rules. No new skill test, target number, damage rating or Karma price is specified by these profiles.
    halloweeners_p125:
      initiation_ritual_count: 2
      first_ritual_duration_minutes_approx: [5, 10]
      second_ritual: The fictional profile requires proof of an intrusion into a megacorporate office.
    spiders_p125_126:
      recruitment_context: The fictional gang abducts prospective recruits and subjects them to involuntary conditioning.
      initial_initiation: A vision quest to meet Spider and receive a spider name; survival confers membership. Unsuccessful recruits generally die within one or two days after the quest ends.
      failed_quest_typical_survival_days: [1, 2]
      assigned_duty: After receiving a name, the new member is assigned a specific task in the gang's fictional territory.
      lieutenant_eligibility: Satisfactory performance of the assigned task followed by completion of the second initiation, which entails abducting a prospective initiate; participation in conditioning is usual, not an unconditional prerequisite.
      lieutenant_promotion:
        challenge: Defeat a fictional bug spirit singlehandedly.
        minimum_fellow_ganger_witnesses: 5
        witnesses_observe: true
        rescue_exception: Witnesses intervene if the challenger appears likely to lose the fight, to save the challenger's life.
        promotion_on_rescue: false
        minimum_retry_wait_years_after_rescue: 1
    spikes_p128:
      initiation: The fictional profile requires a fatal act against an elf, witnessed and substantiated by a trophy; no game test is specified.
      minimum_witnesses: 2
    red_hot_nukes_p128_129:
      membership: Dwarfs only; the source describes the group as entirely composed of adepts.
      initiation: The fictional leader sets a hazardous disarmament challenge for each recruit; the profile describes failure as fatal, without specifying a game test or target number.
    night_hunters_p129:
      initiation: The fictional profile requires marking a metahuman victim with the gang symbol; some splinter groups accept paint, while most use painful methods. This describes coercive fictional conduct, not a universal game rule.
  membership_range_interpretation: The printed numbers are approximate headcounts, not exact minimum/maximum
    roster limits or mechanically guaranteed combatant totals.
  original_supersession_language: The source explicitly says these five descriptions supersede other information
    previously published about the named gangs. This reflects the Companion source-period claim; it does not
    predetermine the status of later publications.
  relationship_to_existing_canon:
  - entities/organizations/srcomp-seattle-gangs.yml is the existing five-organization identity and source-supersession
    index (reuse all five canonical IDs).
  - rules/campaign/srcomp-gang-reputation-leadership-economics-p123-124.yml supplies the existing generic four-tier
    group comparison and size-adjustment procedure; do not duplicate or replace it.
  - subsystems/campaign/gang.yml remains the existing qualitative optional campaign overview.
  source_reconciliation_scope: Structured original example group ratings, approximate membership, lieutenant counts, explicit group metatype and magical-role composition, and specified NPC character types or limitations. These are optional named NPC templates, not universal character-creation restrictions; narrative and biographies are not certified.
  publication_provenance:
    publisher: FASA Corporation
    title: Shadowrun Companion
    catalog: FASA7905a
    edition: Shadowrun Third Edition
    source_id: source.srcomp
    original_pdf_sha256: 8c52409108459a130ff6292722d98dc1f7a65cf870e63e363c34dc1dc299afd5
    physical_pdf_pages: 125-130
  example_use: The GM may use these five examples as archetypes or as the named groups, as stated on printed p124.
headline: 'FASA Corporation Shadowrun Companion (FASA7905a), Shadowrun Third Edition: fictional NPC gang example mechanics, printed pp124–129/PDF125–130'
summary: FASA Corporation Shadowrun Companion (FASA7905a), SR3, printed pp124–129/PDF125–130; preserves optional fictional NPC group statistics, initiation and advancement conditions, and source-period supersession. No universal promotion rule or engine implementation inferred.
