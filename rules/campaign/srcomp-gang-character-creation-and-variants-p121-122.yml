data:
  section: Alternate Campaign Concepts — This Is Our Turf, Meat — Gang Creation and
    Gang Options
  scope: Optional fictional street-gang campaign character-creation adjustments; these
    are not general SR3 chargen replacements.
  ordinary_street_gang_character_creation:
    starting_nuyen_max: 90000
    priority_system_resource_restriction: A gang PC cannot choose Resources priority
      A or B.
    starting_skill_rating_cap: 3
    skill_categories_affected:
    - Knowledge
    - Technical
    - Magical
    named_skills_included:
    - Sorcery
    - Conjuring
    - Magical Theory
    - Demolitions
    - Computer
    education_related_edges_cost_multiplier: 2
    gear_availability_max_at_creation: 5
    npc_gang_members_purchased_with_creation_nuyen:
      cost_per_group_nuyen: 50000
      additional_npc_count_per_purchase: 1D6
      npc_attributes: 3
      npc_skill_ratings: 3
      metatype_attributes: Apply published metatype modifiers to the NPC baseline
        attributes
      ownership: NPC gangers created this way belong to the entire PC group rather
        than one individual PC and do not count as personal chargen contacts.
      player_control: The gamemaster may permit players to control these NPCs.
    gang_contacts:
      common_fixer: One gang-wide Level 1 Fixer contact upon creation
      not_personal_contact: The gang-wide fixer does not count as an individual PC
        contact; other gang members are assumed to know one another.
      personal_contacts: Each ganger receives the ordinary number of personal contacts under standard character creation rules.
      non_street_contacts: Unusual; the source recommends a story explaining the relationship.
    rivals_and_enemies:
      rival_gang_count: Divide number of PC gang members by 2 and round fractions
        up
      rival_gangs_enemy_rank: 2
      each_pc_individual_enemy_rank: 1
      leader_additional_individual_enemy_rank: 1
      source_scope: GM treats the rival gangs as group-level enemies and assigns each
        player character an individual Rank 1 enemy in the campaign.
    leadership:
      leader: The PC who spends the most nuyen buying additional NPC gangers becomes the initial leader; the other PCs are lieutenants.
      tie_resolution: Not specified by the source.
      suggested_initial_karma_bonus: 10
      purpose: The optional bonus can be invested in Reputation, which later influences
        leadership.
  variant_gang_options:
    elf_gang:
      starting_nuyen_max: 400000
      resource_eligibility: Applies when the gang chooses backing by elven interest groups; the fictional sponsor can impose expectations.
      priority_system: May use Resources Priority B
      enemy_multiplier_vs_standard_gang: 2
      lifestyle_minimum: Medium
    tribesmen_gang:
      required_character_role: One character, usually the leader, must be a shaman
      members: Members are almost always human Native Americans; metahuman members must originate in NAN lands or have Native American ancestry.
      symbol: The shaman's totem forms part of the gang symbol even if the shaman is not the leader.
      contact_limit: Only the gang leader has City or Street contacts; other contacts
        must be Rural or Tribal
    decker_gang:
      leader_starting_nuyen: 1000000
      leader_priority: Resources Priority A
      leader_random_jackpoints_min: 10
      leader_hidden_microtronics_shops: 2
      leader_expenses: The character purchasing leadership also pays for the jackpoints and shops; the GM and leader's player determine jackpoint locations.
      other_members: No ordinary gang cash and education limits for nonleader decker-gang
        members
      leader_contacts: Leader should have any Street contacts; other decker gang members
        connect through the Matrix
      GM_discretion: GM determines whether a Matrix contact is a real-world contact
        or a Matrix persona
  reuses:
  - subsystem.campaign.gang is a historical qualitative overview; this new record
    supplies original numeric options without modifying that overview
  - Core SR3 character-creation rules are otherwise unchanged.
