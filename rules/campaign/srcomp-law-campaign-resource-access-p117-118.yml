headline: 'FASA Corporation Shadowrun Companion (FASA7905a), Shadowrun Third Edition fictional tabletop RPG: law-campaign organizational resource access and advancement, pp117-118/PDF118-119.'
summary: 'Optional campaign assumptions, specific organizational free-access benefits, possible magical instruction and GM budget and advancement discretion; not general character entitlements.'
data:
  applicability: Optional police or corporate-security player-character campaign, not ordinary shadowrunner campaigns.
  campaign_resource_assumptions:
    black_market_access: The publication describes these characters as lacking a black-market outlet for goods obtained during their fictional assignments; this is the campaign premise, not a universal SR3 prohibition.
    funding_limit_option: The GM may reduce the corporation or precinct budget, limiting access to high-quality or functioning equipment and money for character projects.
    equipment_backing: The organization provides equipment and backing; characters generally need not scrounge for gear unless they want something outside regulations. Underfunded departments remain an exception to well-funded equipment access.
  magical_character_benefits:
    organization_magical_equipment_and_resources_free_access: true
    in_house_initiatory_group_possible: true
    group_instruction_timing: May become available at a future point; no automatic initiation or fixed advancement cost specified.
  decker_benefits:
    legitimate_system_access: The campaign provides opportunities to use multiple computer systems in an authorized role.
    own_organization_high_technology_systems_free_access: true
  advancement_oversight: The fictional organization's rules and regulations provide the GM a basis for controlling character advancement and access to new cyberware or magical abilities; no fixed cap or automatic approval is specified.
  limitations: Free access to specified organizational resources is not an unrestricted transfer of ownership or a general waiver of equipment costs, tests, or initiation requirements.
