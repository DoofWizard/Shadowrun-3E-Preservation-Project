data:
  section: Running the Game — Payment and Reward; Baseline Shadowrun Payment Table
  scope: Fictional tabletop-game pay benchmarks for gamemasters, not mandatory fixed awards, real-world
    pay rates, or practical instructions for the named fictional run types.
  currency: nuyen (¥)
  table_type: Baseline low-end fictional adventure fee or rate, before risk and other gamemaster adjustments
  baseline_run_pay_rows:
  - run: Assassination
    base_fee_nuyen: 5000
    basis: per run
  - run: Bodyguard/Security Duty
    base_fee_nuyen: 200
    basis: per day
  - run: Burglary
    base_fee_nuyen: 2000
    basis: per run
  - run: Courier Run
    base_fee_nuyen: 1000
    basis: per run
  - run: Datasteal
    percent_of_data_value: 20
    basis: percentage of data value
  - run: Distraction
    base_fee_nuyen: 1000
    basis: per run
  - run: Destruction
    base_fee_nuyen: 5000
    basis: per run
  - run: Enforcement
    base_fee_nuyen: 1000
    basis: per run
  - run: Encryption/Decryption
    base_fee_nuyen: 200
    basis: per MP of data
  - run: Extraction
    base_fee_nuyen: 20000
    basis: per run
  - run: Hacking
    base_fee_nuyen: 1000
    basis: multiply by the target host Security Value
  - run: Investigation
    base_fee_nuyen: 200
    basis: per day
  - run: Smuggling Run
    base_fee_nuyen: 5000
    basis: per run
  gamemaster_payment_guidance:
    ultimate_decision: The gamemaster decides pay based on the fictional run risk, employer ability/willingness
      to pay and runner reputations.
    frequency_example: Player characters average roughly one shadowrun per month.
    individual_starting_point: An individual runner’s payment starts near a month’s living expenses
      plus gear needed for that run; use the team’s average lifestyle expenses where lifestyles differ.
    table_is_low_end: The baseline table gives low-end rates for the listed runs; more dangerous work
      or an especially capable target or team can justify a higher rate.
    party_size: Table rates do not inherently account for team size; larger teams can generally expect
      more.
    excluded_costs: Benchmarks do not necessarily cover expenses, hazard pay or death benefits.
    adjustment: All rates are modifiable benchmarks, not immutable contracted payouts.
  optional_windfall_guidance:
    frequency: Rare, tied to especially difficult work or campaign transitions; not an ordinary payment
      supplement.
    approximate_value: As a rule of thumb, roughly six months of a character’s lifestyle cost.
    source: An unexpected fictional-campaign source, and not necessarily cash.
    alternatives: The publication describes optional compensation with valuable fictional data, people,
      equipment, paid expenses, magic research time or access, special Matrix access, and SIN numbers.
  provenance:
    publication: Shadowrun Companion
    publisher: FASA Corporation
    catalog: FASA7905a
    edition: Shadowrun Third Edition
    source_id: source.srcomp
    printed_pages:
    - 99
    - 100
    physical_pdf_pages:
    - 100
    - 101
    original_pdf_sha256: 8c52409108459a130ff6292722d98dc1f7a65cf870e63e363c34dc1dc299afd5
  source_interpretation_cautions:
  - The printed fee table supplies recommended baselines, not required minimums, guarantees, or fixed
    encounter rewards.
  - The table gives Hacking a 1000¥-per-host-Security-Value multiplication, while Datasteal is 20%
    of the value of the data.
  - Narrative examples from the adjacent Archetypal Adventure Plots chapter are descriptive context,
    not additional numeric pay modifiers.
