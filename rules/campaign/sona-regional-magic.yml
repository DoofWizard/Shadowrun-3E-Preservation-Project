id: rule.campaign.sona-regional-magic
record_type: rule
name: "Shadows of North America Regional Magic"
domain: campaign
status: ingested
effective: {status: source_specific, source: source.fanpro-10655, pages: "192-204", basis: defines_and_modifies}
scope: {applies_to: ["regional magical conditions and campaign procedures in Shadows of North America"]}

regions:
  athabaska:
    denali:
      power_site_rating: {base: 3, peak: 6}
      astral_shallow: "The mountain top is occasionally an astral shallow."
      quest_modifier: "An initiate who leaves the body near the top and undertakes an astral quest reduces the target number of all tests on that quest by 1."
      return_rift: "On return there is a 1-in-6 chance an astral rift opens for 1D6 hours."
    harding_icefield:
      power_site_rating: "2-5"
      aspect: "Totemic magic; favored totem changes every 1D6 days."

  california_free_state:
    talislegging:
      collection: "In the Mojave and Northern Crescent, base time to collect one unit of raw materials is 5 days instead of 10."
      joshua_tree: "Joshua-tree roots, leaves, bark and wood halve base time for artificing and refining, round up; the gamemaster may also allow Joshua and Redwood tree parts as exotic materials."
      other_telesma: "At gamemaster discretion, other telesma gathered in the Mojave or Northern Crescent may reduce refining and artificing base time by one-third to one-half."
    mount_shasta:
      power_site_rating: "1-3"
      aspect: "Shamanic magic and summoning nature spirits."
    mojave:
      power_site_rating: "1-3; up to 5 at Ubehebe Crater"
      aspect: "Aspected against Conjuring."
      joshua_tree_forest:
        background_count: 2
        aspect: "Against conjuring spirits."
        spirit_behavior:
          - "Summoned spirits are unusually independent and contemptuous, resist the summoner's wishes, perform services reluctantly and exploit opportunities to break free."
          - "Spirits may manifest spontaneously without being summoned, usually to protect the forest; exact motives may vary."

  denver:
    high_altitude:
      duration: "12 + 1D6 days after first arrival; Rule of Six applies to the roll."
      immunity: "Characters with extended-volume bioware do not suffer these effects."
      disease_toxin: "Reduce effective Body by 1 for Resistance Tests against diseases and toxins."
      awakened_drain: "For Awakened newcomers, reduce effective Willpower by 1 for magic-related Drain Resistance Tests."

  pueblo_corporate_council:
    yaqui_shamanism:
      tradition: "Yaqui shamans follow Idols rather than totems."
      examples: [Dragonslayer, Fire-Bringer, Great Mother, Sky Father, Wise Warrior]
    kachina_shamans:
      conjuring: "Cannot conjure Spirits of the Waters; may conjure Ancestor Spirits instead."
      initiation: "Kachina initiates must learn Channeling as their first metamagic technique."
    los_alamos_redondo:
      background_count: 2
      redondo_peak_aspect: "Summoning regular Spirits of the Flames."
      los_alamos_aspect: "Summoning toxic Spirits of the Flames."
    eastern_pueblo:
      background_count: 1
      appearance: "Magic and spirits take on a twisted astral appearance but otherwise function normally apart from the Background Count."
    trinity:
      background_count: 5
      aspect: "In favor of the Atomic Kiva."
    ucla_usc:
      effect: "Mana Surge and Wild Magic rules apply around UCLA and USC."

  sioux_nation:
    devils_tower:
      power_site_rating: "3; rises to 5 during the solstices"
      aspect: "Shamanic magic; during the solstice, especially health magic."
    talislegging:
      locations: ["Badlands", "Black Hills", "Yellowstone Springs"]
      collection: "At gamemaster discretion, reduce base collection time for one unit of raw materials by half to 5 days or by one quarter to 7 days."

  tsimshian:
    toxic_domains:
      background_count: "1-5"
      spirit_effect: "Shamans cannot summon spirits inside these toxic domains; even elsewhere in Tsimshian spirits may be cross and unhelpful."
      toxic_path_pressure: "The gamemaster may use roleplaying pressure and Willpower Tests to resist frenzy when a shaman confronts toxic devastation."
      toxic_path_outcome: "If the character succumbs to the toxic path, the character immediately becomes an NPC."

  ucas:
    awakened_mistrust:
      cost_guidance: "Magical goods and services tend to be more expensive in the UCAS than in the NAN, Tir Tairngire or Seattle."
      social_guidance: "The gamemaster may apply the SR3 racial-prejudice modifiers to obviously Awakened characters to reflect fear and mistrust of magic."

  ute:
    salt_lake_city:
      mana_ebb: "Usually Rating 4; may fluctuate between 2 and 6 at gamemaster choice."
      critter_effect: "Paranormal critters tend to avoid the vicinity."
    grand_canyon:
      power_site_rating: "3-5"
      aspect: "Not aspected."
      astral_rifts: "At certain times of year, short-lived astral rifts open along the Colorado River."
    telesma:
      petrified_forest: "Reduce base collection time for one unit of raw materials by three quarters to 2 days; petrified wood and fossils may serve as exotic materials."
      painted_desert: "Reduce base collection time by one quarter to 7 days."

links:
  uses:
    - rule.magic.power-sites
    - rule.magic.background-count
    - rule.magic.mana-surges
