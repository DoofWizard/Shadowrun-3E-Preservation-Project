data:
  section: 'Alternate Campaign Concepts: character-creation variants in Where Does It Hurt?, Trained to Be
    Ghosts, and I Am the Law'
  source_scope: These three optional campaign-specific character-creation guidelines do not replace the default
    SR3 character-creation procedures in ordinary shadowrunner campaigns.
  docwagon_high_threat_response:
    printed_page: 110
    physical_pdf_page: 111
    baseline: Create DocWagon player characters using standard Shadowrun character-creation rules.
    resources_priority_option:
      gm_may_prohibit:
      - A
      - B
      reason_in_fiction: DocWagon supplies most equipment other than implanted gear for the emergency-response
        team.
      mandatory_by_default: false
    biotech_skill_rating_recommendation:
      minimum: 3
      strength: The publication says each character should have at least this rating; this is a campaign guideline
        rather than a hard default SR3 chargen restriction.
    suggested_team_functions:
    - Rigger for ambulance or medevac transport
    - Magical healer
    - One or two medical specialists with Biotech and supporting Biology or Cybertechnology skills
    - Additional fire-support personnel, where appropriate
    - Decker at headquarters maintaining tactical intelligence
  special_forces:
    printed_page: 115
    physical_pdf_page: 116
    baseline: Use the standard Shadowrun character-creation rules for the fictional government-funded special-forces
      campaign.
    enemies_optional_rule: Do not use the optional enemies character-creation rules referenced on printed page
      68; adversaries may still arise during the campaign.
    availability_option:
      may_ignore: true
      scope: Procurement of weapons and armor for the government-funded special-forces scenario
      not_global_rule: true
    free_contacts:
      count: 2
      identities:
      - Commanding officer
      - Quartermaster who manages equipment
      other_contacts: Additional contacts must be purchased.
    annual_wage_nuyen: 75000
    lifestyle_context: The source describes this as sufficient for Medium Lifestyle plus extras; it is scenario
      compensation rather than a standard rule for all player characters.
    team_structure: Military ranks and assigned specialties are illustrative organizational and roleplaying
      guidance, not mandatory new character statistics.
    specialty_game_bonus_default: false
    specialty_bonus_exception: A game bonus applies only if the GM elects to assign one.
    pre_mission_campaign_timing:
      minimum_days: 3
      rule: The fictional special-forces campaign description assumes at least this many days of personnel
        isolation before each mission; this is scenario timing, not a universal SR3 character-creation rule.
    metatype_guidance: Most fictional governments employ all metatypes; the source describes exceptions
      for particular governments as setting-dependent, not a global metatype restriction.
  police_and_corporate_security:
    printed_page: 116
    physical_pdf_page: 117
    baseline: This option applies to fictional police and corporate-security player characters.
    skills_priority_minimum: C or higher
    academic_or_background_knowledge_skills_minimum_count: 2
    point_based_creation:
      active_skill_points_minimum: 24
      applicability: Only when the optional point-based character-creation method is used
    enemies_at_creation:
      recommendation_count: 2
      ranks:
      - 1
      - 2
      strength: The publication says these characters should have at least two enemies, one Rank 1 and one
        Rank 2.
    free_contacts:
      count: 2
      allowed_source: Employees of the character’s corporation, or fellow police officers at the character’s
        precinct
      additional_purchased_contacts: May be of any type
    metatype_guidance: The source describes nonhuman officers as unusual, typically no more than one in a team;
      this is setting guidance, not a firm universal metatype cap.
    lifestyle_context: Characters should receive a salary sufficient for Medium Lifestyle; no exact amount
      is specified here.
    team_specialization: A team may consist of characters all specializing in the same field; the usual
      shadowrunner expectation of diverse specialties is not required for this optional campaign.
  provenance:
    publication: Shadowrun Companion
    publisher: FASA Corporation
    catalog_number: FASA7905a
    edition: Shadowrun Third Edition
    source_id: source.srcomp
