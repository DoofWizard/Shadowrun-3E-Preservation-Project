headline: 'FASA Corporation Shadowrun Companion (FASA7905a), Shadowrun Third Edition fictional tabletop RPG:
  optional DocWagon, special-forces, and police/corporate-security character-creation rules (printed pp110,115–116).'
summary: Original FASA7905a optional campaign character-creation constraints, including GM-assigned
  specialty bonuses, scenario timing, homogeneous team specialization, and original numeric costs and limits.
