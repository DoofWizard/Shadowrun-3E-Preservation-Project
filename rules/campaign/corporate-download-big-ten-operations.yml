id: rule.campaign.corporate-download-big-ten-operations
record_type: rule
name: "Corporate Download - Big Ten Shadow Operations"
domain: campaign
status: ingested
source: source.fasa-7125
printed_pages: "125-140"
pdf_pages: "131-146"

corporations:
  Ares:
    hiring:
      normal_pay: "standard rates"
      affiliation_hidden: true
      gear_option: "If employer affiliation is revealed, Ares may offer hardware worth 120% of equivalent cash payment; half up front, remainder on completion."
      mixed_payment: "If nuyen and gear are mixed, the nuyen portion is reduced by 80%."
      company_men: "Private DocWagon contracts and approximately 20% higher pay than freelancers."
    security:
      ordinary_guards:
        minimum_weapon_skill: 5
        minimum_security_procedures: 4
        ratings: "Equal; Knight Errant Professional, Hard Corps Trained"
      firewatch:
        squad_size: "5-7"
        composition: "at least one rigger and one Awakened member"
        ratings: "Superior and Professional"
        awakened: "initiates of at least Grade 3; typically Shielding and Centering"
  Aztechnology:
    hiring:
      channel: "Usually through subsidiaries, shell companies or other intermediaries."
      pay: "125-150% of recommended fees."
      goods_option: "Consumer goods/services from corporate product base may replace up to 50% of fee."
      exceptions: "Assassination-type work is normally handled internally by specialist assets."
    security:
      conventional: "ACS troops emphasize heavy firepower and coordinated response."
      elite: "Leopard and Jaguar Guards are Equal or Superior and Professional; Awakened members are adepts."
      matrix: "Initial security decker is Equal and Professional; escalation adds deckers and high-grade gray IC."
  Cross:
    hiring:
      planning: "Historically detailed and controlled; source-period policy increasingly uses standard-pay runner teams."
      retainer: "Selected retained teams receive lifestyle/support plus monthly compensation and difficult-job bonuses."
      paydata_bonus: "Cross may buy useful extra paydata at 1.5 times normal value."
    security:
      physical: "Facilities normally have at least one security decker and one security rigger; guards are Equal and Professional."
      magical: "Relatively rare; Awakened guards are usually hermetic."
      matrix: "Deckers are Trained and Equal; software/decks are often Superior and sometimes Superhuman; pairs are common."
      seraphim: "Agents are Professional and Superior, with alpha/beta-grade cyberware where useful."
  MCT:
    hiring:
      pay: "Nearly double normal shadowrun rates."
      preferred_payment: "MCT corporate scrip is preferred unless runners are intentionally kept unaware of employer."
      discipline: "Failure or disobedience is treated harshly; long-term retaliation is an explicit campaign expectation."
    security:
      guards: "Equal and Trained"
      squad_leaders: "Superior and Professional"
      security_riggers: "Superior and Trained"
      magicians: "Equal and Professional; mages more common than shamans"
      zero_zone: "High-security facilities may use lethal automated systems, riggers, drones, robots, magical defenses and perimeter denial."
  Novatech:
    hiring:
      new_contractors: "5% above standard rates."
      repeat_contractors: "Future-run scale may rise to 25% above standard."
      gear: "May substitute discounted nuyen-for-gear arrangements and corporate equipment."
      company_men: "Some teams are retained while still allowed outside jobs that do not involve Novatech."
    security:
      guards_and_riggers: "Equal and Professional"
      awakened: "Equal and Professional; most are initiates"
      cats_combat_deckers: "Superior and Professional"
      other_cats: "Superior and Semi-Trained"
      black_omega: "Superhuman and Professional; initiates at least Grade 5"
      black_alpha: "Equal or Superior and Professional; initiates at least Grade 3"
  Renraku:
    hiring:
      pay: "Good current rates; may bundle multiple jobs."
      new_talent: "Often first tested through a mock 'digger' run."
      gear_conversion:
        first_success: "Up to 25% of payment may be exchanged for gear/cyberware/surgery."
        later_successes: "+5 percentage points per successful run."
        maximum: "Gear portion never exceeds 50% of total pay."
    against_renraku:
      arcology_hazard: "Runs into the Arcology typically pay an extra 200% hazard premium."
      extracted_items: "Renraku-related extracted items may be purchased at five times ordinary value."
      matrix_data: "Datasteals/hacking against Renraku typically pay double normal rates."
    security:
      matrix_deckers: "Equal or Superior and Trained"
      red_samurai: "Superhuman and Professional; typical squad four troopers plus one mage"
      note: "Source-period defenses are highly variable because of post-Arcology disruption."
  Saeder_Krupp:
    hiring:
      standard_runner_pay: "approximately 150% of standard rates plus hazard bonuses"
      retainer: "Generally double to triple standard rate."
      payment_options: "Data, intelligence, forged IDs/travel papers, unusual gear and other favors may substitute for nuyen."
    against_saeder_krupp:
      pay: "If employer admits target is S-K, commonly 2-3 times standard rates."
    security:
      guards: "Superior and Professional; minimum Security Procedures 4; trained to recognize astral passage."
      basic_squad: "12 personnel: 10 guards, 1 initiated magician, 1 rigger."
      site_commander: "Superhuman; specialized in tactics"
      response: "High-threat armed response with air support available at major sites."
      matrix_trace_modifier: "S-K trace IC gains +2 Rating when tracing within S-K PLTG or European, Russian or Middle Eastern grids."
  Shiawase:
    hiring:
      standard_pay: true
      stock_option: "May negotiate 10% of fee as Shiawase stock; up to 50% of fee may be paid in stock, but no more."
    security:
      physical: "Equal in Combat Skills, Superior in Negotiation/other Social Skills, Professional; guards generally have a melee specialization."
      magical: "Each site normally has one Equal-rated magician; larger magical assets used as needed."
      matrix: "Equal and Professional deckers typically appear at fifth or sixth trigger step; wide mix of white/gray IC and psychotropic IC."
      spirit_company: "Elite six-person teams; members Superior and Professional; adepts/magicians are initiates of at least Grade 3."
  Wuxing:
    hiring:
      veteran_retainers:
        mundane: "Middle lifestyle for samurai, deckers and riggers."
        awakened: "High lifestyle."
      support: "May provide Triad contacts for supplies without Street Index markup, but normal availability delays still apply."
      ordinary_pay: "standard rates; may substitute imported goods or travel/shipping services."
    security:
      guards: "Range from Inferior/Semi-Trained to Equal/Trained; some Triad guards Inferior/Trained."
      matrix_deckers: "Equal and Trained"
      wujen: "Superior and Professional"
      hong_kong_hq_power_site: "Rating 4"
      tactics: "Strong use of hidden PLTG/SAN access and contact intelligence; magical security organized around feng shui/mana conditions."
  Yamatetsu:
    hiring:
      initial_simple_job: "50-80% of standard pay."
      followup: "One or two additional test runs at standard pay."
      experienced_runner_pay: "May rise to 200% of standard, including travel expenses."
      medical_option: "Crash Cart Executive Diamond service may be offered where available; source compares it with 75,000¥ Special Platinum service."
      special_security_detail_employment: "Minimum pay is twice standard rate; requires DNA sample."
    against_yamatetsu:
      japanese_corporate_clients: "Many Japanacorps pay double standard rates for runs against Yamatetsu."
    security:
      guards: "Equal and Trained"
      magicians: "Equal and Professional"
      older_facilities: "Use modern security, automated drones, sentry weapons, riggers, lasers, traps and substantial IC upgrades."
      SSD:
        size: 7
        composition: ["weapon specialist","rigger","decker","adept","full magician (usually shaman)","team leader","one additional operative"]
        ratings: "Superior and Professional"

sources:
  - {source: source.fasa-7125, printed_pages: "125-140", pdf_pages: "131-146", relation: defines_campaign_procedures}
