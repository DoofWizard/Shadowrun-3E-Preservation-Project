id: rule.campaign.sotf-general-adventure-guidance
record_type: rule
name: "Survival of the Fittest General Adventure Guidance"
domain: campaign
status: ingested
effective:
  status: campaign_specific
  source: source.fanpro-10665
  printed_pages: "8-17"
  pdf_pages: "9-18"
npc_scaling:
  rule: "NPCs are intended to stand up to an average player-character group; gamemasters should adjust NPCs to the actual party."
  tools:
    - "All NPCs receive Karma Pool and Professional Rating under SR3."
    - "Use the prime-runner rules from Shadowrun Companion when stronger opposition is required."
great_dragons:
  classification: "Treat great dragons as ultimate-level NPCs."
  source_references:
    - "Use great-dragon statistics from Shadowrun Companion."
    - "Source notes that great dragons also have additional abilities described in Magic in the Shadows."
  campaign_constraint: "The campaign is not built around defeating the great dragons in direct combat; direct assault is framed as effectively unwinnable for ordinary runners."
adventure_use:
  - "Read the adventure fully before play."
  - "Adjust individual adventures carefully because changes can propagate across the linked campaign."
  - "Keep copies of character sheets and campaign notes."
  - "Use standard SR3 rules for Perception, Negotiation and other common procedures rather than duplicating them in this book."
sources:
  - {source: source.fanpro-10665, printed_pages: "8-17", pdf_pages: "9-18", relation: defines_campaign_guidance}
notes:
  - "No supersession relationship is inferred."
