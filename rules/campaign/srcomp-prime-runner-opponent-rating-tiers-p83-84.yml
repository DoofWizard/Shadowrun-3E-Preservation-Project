headline: 'FASA Corporation, Shadowrun Companion (FASA7905a), Shadowrun Third Edition
  fictional tabletop role-playing game, original printed pp83-84 / physical PDF pp84-85:
  Creating Prime Runners, five optional NPC opponent tiers'
summary: Exact optional tabletop-game numeric and procedural mechanics for creating
  prime runners, five optional npc opponent tiers, as printed in the original FASA7905a
  supplement; source-specific, not an automatic replacement of SR3 core.
data:
  usage: 'Optional gamemaster opponent design: relative ratings are comparisons with
    the campaign player-character averages, not automatic character-generation absolutes.'
  opponent_tiers:
  - tier: Inferior
    skill_and_attribute_ratings: 1-2 points lower than average player characters
    karma_pool: 1-2 dice fewer than player-character average
    encounter_guidance: One player character can, under ideal conditions, match 2-3
      Inferior NPCs.
  - tier: Equal
    skill_and_attribute_ratings: roughly equal to average player characters
    karma_pool: equal to average player-character Karma Pool
    encounter_guidance: Peers; exact number of equals depends on relative abilities
      and character skills.
  - tier: Superior
    skill_and_attribute_ratings: 1-2 points higher than average player characters
    karma_pool: 1-2 dice greater than average player-character Karma Pools
    encounter_guidance: One Superior NPC may match two player characters.
  - tier: Superhuman
    skill_and_attribute_ratings: 3 or more points higher than average player characters
    karma_pool: 3-4 dice greater than average player-character Karma Pools
    encounter_guidance: One Superhuman NPC may match an entire player-character team.
  - tier: Ultimate
    skill_and_attribute_ratings: gamemaster-defined; no mandatory numeric statistics
    karma_pool: need not use Karma Pools
    encounter_guidance: Use sparingly; plot-scale foes such as great dragons, powerful
      spirits and ancient immortal entities.
  professional_rating: Give each NPC opponent a Professional Rating as referenced
    to SR3 printed p248 to determine whether it continues fighting or gives up; not
    a fixed tier-derived rating.
  source_behavior: NPC classification is suggested guidance; attributes and pools
    may be adjusted during campaign to match the intended opposition.
  reuses:
  - Optional Team Karma procedures from printed pp82-83 are separate and already accepted;
    no duplicate Team Karma arithmetic.
framing: reference_exact
