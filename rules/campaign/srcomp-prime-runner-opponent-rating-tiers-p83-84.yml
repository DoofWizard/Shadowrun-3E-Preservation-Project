headline: FASA7905a — Creating Prime Runners, optional fictional tabletop NPC tiers
summary: Source-reviewed relative NPC ratings, encounter guidance, Professional Rating examples, Ultimate dice resolution, and original tier-label ambiguity.
data:
  usage: Optional GM design guidance based on the campaign player-character average ratings, not absolute character-generation statistics.
  opponent_tiers:
  - tier: Inferior
    skill_and_attribute_ratings: 1-2 points below the player-character average
    karma_pool: 1-2 dice below the player-character average
    encounter_guidance: Under ideal conditions one player character is a match for 2-3 Inferior NPCs.
    qualification: An Inferior NPC can still be a major threat through information, influence or other advantages.
  - tier: Equal
    skill_and_attribute_ratings: Approximately the player-character average
    karma_pool: Equal to the player-character average
    encounter_guidance: Peers and potential rivals; their prevalence depends on player-character competence.
  - tier: Superior
    skill_and_attribute_ratings: 1-2 points above the player-character average
    karma_pool: 1-2 dice above the player-character average
    encounter_guidance: One Superior NPC is an even match for two player characters; use rarely.
  - tier: Superhuman
    skill_and_attribute_ratings: At least 3 points above the player-character average
    karma_pool: 3-4 dice above the player-character average, as indicated by the placement of the final paragraph in this tier.
    encounter_guidance: Usually one Superhuman NPC is an even match for an entire player-character team.
    source_ambiguity: The pool paragraph under Superhuman names Superior characters, although the preceding Superior section already specifies 1-2 dice. Preserve the printed wording conflict rather than treating the tier inference as unambiguous.
  - tier: Ultimate
    skill_and_attribute_ratings: GM defines characteristics as needed; no mandatory numerical game statistics.
    karma_pool: No Karma Pool required; the optional source guidance is to continue rolling game dice until success.
    encounter_guidance: Use sparingly as plot-scale opponents, including great dragons, powerful spirits, ancient immortals and godlike AIs. Characters may thwart their plans rather than survive direct confrontation.
  professional_rating: Each NPC has a separate Professional Rating (SR3 printed p248) governing its response in combat, not a rating automatically derived from the tier.
  professional_rating_examples:
  - {tier: Inferior, category: Trained, rating: 3}
  - {tier: Superior, category: Average, rating: 1}
  source_behavior: GM can vary individual Karma Pools and increase or decrease them during the campaign; the classifications may also be used for enemies (printed p68).
  reuses:
  - Team Karma on printed pp82-83 is separately recorded.
