  section: Double, Double, Toil and Trouble
  scope: Optional magical campaign design; not a restriction on ordinary SR3 characters.
  team_composition:
    recommendation: Most or all player characters should have a magical ability, but mundane characters may participate.
    shared_affiliation: A common magical order, lodge or initiatory group is recommended, not mandatory.
    backed_team_exception: When the team works for an external patron, the publication explicitly permits a mixture of magically active and mundane members.
