    gm_may_set_magical_skill_upper_limit: true
    example_skills: [Sorcery, Conjuring]
    fixed_numeric_limit_in_source: null
    purpose: The optional campaign cap controls advancement in a magic-focused group; the source also recommends investment in nonmagical abilities.
