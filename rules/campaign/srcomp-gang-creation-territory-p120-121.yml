data:
  section: Gang Creation
  scope: Small neighborhood or area gangs; the campaign notes do not apply to city-wide or national groups.
  setup:
    order: The gamemaster develops the fictional gang concept before the players create their characters.
    membership: Completion of the initiation ritual establishes full membership; initiation for lieutenants may differ, and a new leader may require renewed vows.
    concept_constraints: The fictional gang's chosen focus determines its membership restrictions. The gamemaster approves the group's distinctive features.
  territory:
    recommended_city_blocks_per_member: 1
    include_npc_members: true
    calculation: Recommended territory in city blocks equals the total number of player and nonplayer gang members.
    strength: A rule of thumb for patrol feasibility, not an absolute maximum or a compulsory map size.
    safe_zones: The fictional territory may contain limited free or safe zones, such as a clinic or school.
