id: rule.campaign.srcomp-retirement-second-career-contact-business-p87-89
record_type: rule
status: reviewed
source: source.srcomp
printed_pages: 87-89
pdf_pages: 88-90
edition_scope: FASA7905a Shadowrun Third Edition, source-original optional Companion
  rules
content_class:
- rule_procedure
headline: 'FASA Corporation Shadowrun Companion (FASA7905a), Shadowrun Third Edition
  fictional tabletop RPG: optional retired-runner NPC contacts, second careers and
  team integration, original printed pp87-89 / PDF88-90'
summary: Source-original game rules and optional gamemaster guidance concerning retired
  player characters as contacts, career-dependent contact networks and nuyen permit
  costs; separate from the previously accepted generic retirement overview.
data:
  retirement_transfer:
    nature: Optional campaign transition. When a retired runner leaves active player-character
      play, the former player may transfer control to the gamemaster and may subsequently
      play another character.
    retained_role: Former shadowrunners may remain involved as NPC fixers, intermediaries,
      Mr. Johnson employers, consultants, shopkeepers or other non-player supporting
      roles.
    retired_character_contact_level: Regardless of the role a retired character assumes,
      the former character counts as a Level 3 contact for former teammates.
    friends_of_friends: A former runner’s contacts can serve as friends-of-a-friend
      for all former team members under the separately established FOF rule; no new
      FOF formula introduced here.
  former_runner_as_employer_or_agent:
    role: A retired character acting as a fictional Mr. Johnson employer, talent agent
      or job intermediary may employ knowledge of runner work and contacts.
    contact_minimum_option: If the former runner has fewer than six total contacts,
      the gamemaster and former controlling player may select enough additional contacts
      to bring the number to six.
    effects_not_specified: The publication does not mandate a fixed percentage commission,
      test target number or universal payout for this choice.
  former_runner_as_fixer:
    contact_minimum_option: A character retiring to operate as a fixer may select
      contacts to bring the total number to six; added contacts may reflect the fictional
      fixer’s speciality.
    other_rules: Contacts, acquisition and selling fictional game gear are not assigned
      new dice formulas on these pages; refer to accepted core and existing contact
      rules.
  former_runner_as_business_operator:
    initial_costs: A second-career business requires inventory and required facilities;
      the gamemaster may use equipment and working-gear costs printed in SR3 to set
      initial investment.
    fictional_registration: A business operator in this fictional setting must possess
      a SIN, including a counterfeit SIN if used in the setting, together with applicable
      permits and registrations.
    permit_cost_nuyen: General business and operating permits may cost 100–1,000¥
      or more, varying with the kind of fictional business; the gamemaster sets the
      campaign-specific cost.
    market_cost_exception: The book notes that legal gear purchases for establishing
      a legitimate shop are not subject to the Street Index of those items.
    ambiguity: The text provides a discretionary range with “or more,” not a universal
      fixed 1,000¥ maximum.
  introducing_new_team_members:
    classification: 'Gamemaster campaign guidance rather than a mandatory die test:
      a team contact introduction, trial run, or chance encounter can bring a new
      runner into an existing group.'
    mandatory_numeric_rule: No fixed target number, fixed cost or obligatory reward
      is specified here.
  reuse:
  - Existing options/campaign/retirement.yml generic retirement overview remains unchanged.
  - Existing Friends-of-Friends contact mechanics and SR3 gear equipment values remain
    authoritative for referenced calculations.
framing: reference_exact
