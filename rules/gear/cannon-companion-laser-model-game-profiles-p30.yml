headline: FASA7908 Cannon Companion SR3 fictional laser item game profiles
summary: FASA Corporation, Shadowrun Third Edition Cannon Companion, printed p30 / PDF31. Game-specific item range classes, battery resource and recharge rates absent from the existing entities.
data:
  profiles:
    - entity: entity.weapon.ares-mp-heavy-laser-plus
      game_range_class: sniper rifle
      charge_capacity: 50
      recharge: {charges: 1, game_hours: 2}
      included_equipment: [underbarrel tripod, backpack battery case]
    - entity: entity.weapon.laser-iii
      game_range_class: sporting rifle
      charge_capacity: 20
      recharge: {charges: 1, game_hours: 1}
      battery: hip-mounted pack
    - entity: entity.weapon.ares-redline
      game_range_class: heavy pistol
      charge_capacity: 10
      recharge: {charges: 2, game_hours: 1}
      battery: detachable battery clip
      reload_game_procedure: standard firearm clip ejection and insertion
