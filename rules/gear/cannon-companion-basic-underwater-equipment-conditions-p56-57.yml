headline: Cannon Companion basic underwater equipment
framing: reference_exact
data:
  publication: {title: Cannon Companion, publisher: FASA Corporation, catalog_number: FASA7908}
  fictional_tabletop_equipment:
    basic_set: [face mask, snorkel, fins, wet suit, regulator, buoyancy compensator and weight belt, scuba tank]
    regulator: {verbal_communication: impossible, features: [primary and secondary mouthpiece, depth and pressure gauge, compensator inflator attachment]}
    compensator: {with_weight_belt: neutral buoyancy, can_return_diver_to_surface: true}
    scuba_tank: {game_pressure_bar: 300, game_average_consumption_bar_per_minute: 4, varies_with: [depth, lung capacity, activity]}
    wet_suit: {cold_damage_power_modifier_in_water: -1}
    dry_suit: {cold_attack_power_modifier_in_water: -2}
    basic_equipment_weight: {listed_weight_applies_on_dry_land: true, diving_weight_penalty: none}
    dual_tank_assembly: {simultaneous_tanks: 2}
    enclosed_helmet: {verbal_communication: possible, features: [external speakers, head lamp, external underwater radio or cablephone jack]}
    full_face_mask: {regulator_quick_release: true, removable_side_plugs: [communication systems, voice microphones, other accessories]}
