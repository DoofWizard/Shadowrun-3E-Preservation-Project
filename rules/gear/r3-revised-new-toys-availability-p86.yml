headline: FanPro10662 p86/PDF88 New Toys fictional tabletop availability exception
summary: Preserve the source-specific absence of two market ratings and the GM-controlled campaign eligibility condition, without extending the restriction to all military-grade game items.
data:
  publication: {title: Rigger 3 Revised, publisher: FanPro, catalog_number: FanPro10662, edition: Shadowrun Third Edition, source_pdf_sha256: 88c3670ad4f39efebb1ee0545c222e4153bc4a5e1114e138e063e4f845a36909}
  scope: The specific tightly controlled subset of military-grade vehicle equipment, munitions and gear described in the fictional New Toys introduction, not every military-grade item.
  acquisition:
    availability_rating_supplied: false
    street_index_rating_supplied: false
    fictional_eligibility: Exceptional campaign access through the highest-level in-world military contacts or extremely rare and unusual in-world black-market opportunities.
    gamemaster_decides: [whether, when, how]
  interpretation: Do not substitute a zero rating or a standard availability roll for an absent rating. Use the ordinary SR3 equipment market rules for applicable equipment with supplied ratings; this is the source-specific exception.
