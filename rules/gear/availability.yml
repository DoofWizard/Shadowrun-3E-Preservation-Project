resolution:
  summary: "An Availability Code expresses both how difficult an item is to locate and how long acquisition normally takes. The left value is the Etiquette target number; the right value is the base acquisition time."
  inputs:
    - "Availability target number"
    - "Availability time"
    - "Etiquette successes"
  outputs:
    - "whether source is found"
    - "time to acquire item"

