printed_pages: '12-13'
pdf_pages: '13-14'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: 'FASA7908 Cannon Companion: Arrowhead game-effect qualifiers'
summary: 'FASA Corporation Shadowrun Third Edition fictional tabletop RPG, printed pp12-13/PDF13-14. Original dice and damage-track conditions supplement the existing arrowhead rule and six existing equipment rows.'
data:
  applies_to: [arrows, crossbow_bolts]
  barbed:
    game_removal_test: 'Biotech (8) Test by attending medic'
    additional_physical_damage_boxes_on_failed_test: 1
  explosive_and_ex:
    game_rule_inheritance: 'Use the corresponding explosive or EX explosive firearm ammunition game effects.'
  hammerhead:
    game_rule_inheritance: 'Use gel round game effects, SR3 printed p116.'
    range_qualification: 'Original specifies the firing bow range using bow Strength Minimum minus 1; no additional numeric interpretation is asserted.'
  incendiary:
    duration_combat_turns: 5
    game_damage_code: 5L
    game_damage_timing: 'End of each Combat Turn for contact with the arrow or bolt.'
    linked_game_condition: 'Flammable game objects may gain the fire condition; see Fire and Incendiaries, printed p98.'
  screamer:
    damage_track: Stun
    attack_power_formula: 'floor(normal Power / 2)'
  reuse: 'Six source p13 table rows and the existing expanded-arrowheads summary are unchanged; this record supplies previously absent mechanical qualifiers.'
  source_boundary: 'Fictional tabletop game damage codes, dice tests, and status durations only.'
