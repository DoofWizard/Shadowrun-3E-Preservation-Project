id: rules.source7121.blood-mage-gestalt
record_type: rule_reference
status: ingested
source: source.fasa-7121
printed_pages: "70-75"
pdf_pages: "79-84"
content_class:
  - rule_exact
  - rule_procedure
  - world_fact
framing: exact_mechanics

organization:
  members: 20
  protection_per_member: "12 Aztechnology Jaguar Guards permanently assigned to each priest."
  linking_group_size: 10
  ritual_subject_reference: "The source says the Gestalt prefers magically talented metahuman ritual subjects between ages 12 and 20; preserve as source-period setting fact, not a player-facing procedure."

blood_magic:
  reference: "Aztlan sourcebook pp.175-177."
  rules:
    - "All magical rituals performed by the Gestalt require blood magic."
    - "Blood-magic sacrifices negate Drain effects for spells according to the published blood-magic rules."
    - "Each priest also takes a Deadly physical wound as a result of the ritual."
    - "This damage can only be healed by rest."
    - "Each time a priest performs a blood-magic ritual, the priest must make the standard test for magic loss."

linking_ritual:
  participants: 10
  entity_statistics:
    - "Add together the statistics of all 10 ritual participants and divide by 10."
    - "The resulting magical entity has average attributes."
  initiate_grade:
    - "The Gestalt entity's initiate grade is the sum of all ritual participants' initiate grades."
    - "With an average Gestalt-priest initiate grade of 3, the Gestalt entity has initiate grade 30."
  threat_rating:
    - "If necessary, the gamemaster may add together the priests' Threat Ratings and give the Gestalt entity the resulting over-the-top Threat Rating."

material_link:
  rule: "A Gestalt entity with a material link can locate and kill the subject of that link almost anywhere on the planet unless the subject is extremely well-masked or protected by extremely powerful magic."

sources:
  - {source: source.fasa-7121, printed_pages: "74-75", pdf_pages: "83-84", relation: rule_exact}
