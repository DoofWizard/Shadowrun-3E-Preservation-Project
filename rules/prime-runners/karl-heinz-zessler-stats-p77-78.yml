  spirit_calling_house_rules_as_printed:
    limitation: Cannot summon spirits through the standard shamanic method.
    available_approach: Uses knowledge of spirits to request help with a Charisma Test.
    general_power_focus: May add bonus dice from a suitable general Power Focus or other chosen magical item.
    target_number: Force Rating of called spirit
    success_conversion: Spirit supplies one service for every 2 successes on Charisma Test.
    consent_and_reason: GM may have the spirit seek a reason for being called; disposition depends on spirit Intelligence equal to its Force Rating.
    usual_use: Hesitant to ask for spirit services; normally calls to obtain information.
    greater_spirits: Great spirits are contacted by a watcher messenger, and no Charisma Test is required for their assistance in this special arrangement.
    spirit_compensation: Free spirits often ask for Karma; great spirits generally demand a significant service or favor.
  other_rules_notes:
    magical_order: Grade 8 Initiate of an unspecified magical order; no invented membership or lineage.
    centerings:
    - For most spellcasting, speaks in the arcane language named Fumerian in source.
    - For enchanting or summoning/contacting spirits or elementals, sings in ancient Egyptian.
    combat_casting: Avoids combat spells and casts them only when absolutely necessary; retains listed Combat spells.
    role_of_merlin: Guardian ally named Merlin; stats left to the gamemaster to suit campaign needs, no invented numbers.
    housing_wards: Residence continuously guarded by watchers.
