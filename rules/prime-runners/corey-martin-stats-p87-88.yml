  mechanical_notes:
  - All listed shella powers operate for the host body; Regeneration makes the possessed
    person difficult to kill.
  - During a feeding frenzy, Corey is unable to stop pursuing the target until it
    is caught or he is released; the host does not recognize the need to escape a
    stronger pursuer, while the spirit does.
  - Shella may sacrifice or abandon a host at any time if necessary; after abandoning
    one, it remains weak and drifts until finding another suitable host.
  - Shella can enter a new host only when the prospective host is very stressed, injured,
    or experiencing intense fear, panic, and pain.
  - A prospective host may resist entry with a Willpower (6) Test. Increase the target
    number by 1D6 within 24 hours of a full moon, and by 1 within 72 hours of a full
    moon.
  - To banish the shella normally use effective Force Rating 8; within 72 hours of
    a full moon, use 8 + 1D6.
  - Shella is strongest at full moon; near new moon, it cannot enter the host body
    for 1D6 days; source explicitly distinguishes waxing and waning control.
  innate_quality: Corey as an ork possesses natural Low-Light Vision.
