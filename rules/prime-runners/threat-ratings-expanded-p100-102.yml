content_class:
- rule_procedure
data:
  title: Expanded Second Edition Threat Ratings
  source_anchors:
  - printed_page: 100
    pdf_page: 109
    heading: Threat Ratings; Degree of Threat; Combat Threat Rating; Magical Threat
      Rating
  - printed_page: 101
    pdf_page: 110
    heading: Decking Threat Rating; Vehicle (Control) Threat Rating; Is That Tough
      Enough?
  - printed_page: 102
    pdf_page: 111
    heading: Final Note; Optional Initiative; Creature/Spirit Threat Ratings
  scope_and_purpose:
  - Second Edition base Threat Ratings replace NPC dice pools with a fixed number
    of dice on both offensive and defensive tests; the rating may be adjusted during
    play to strengthen or weaken an NPC.
  - 'This extended historical SR2 system allows four distinct ratings for NPC areas:
    Combat, Magical, Decking, Vehicle (Control).'
  - Calculate the base value for each rating as one-third of the Dice Pool that would
    ordinarily have applied to that NPC in the relevant area, rounded to nearest whole
    number; add Threat Rating dice to appropriate tests.
  - NPC Threat Index is used to estimate balance against PCs; it is NOT an exact measure
    of encounter danger. Equipment, weapons, spells, cyberware, bioware, positioning
    and other resources affect the encounter separately.
  categories:
    Combat:
      replaces: Combat Pool situations and ranged, armed, unarmed combat expertise
      initiative_adjustment: For a comparison using an NPC Combat Threat Index, multiply
        the index by 1.5 (increase 50%) if NPC has 2 Combat Turn actions; by 2 (increase
        100%) if 3; by 2.5 (increase 150%) if 4.
      pc_comparison: Player characters Combat Pool ratings may be adjusted analogously
        when making index comparisons.
      caution: Firepower imbalance (especially melee weapons or Reach on only one
        side) may outweigh a numerical index.
    Magical:
      replaces: Magic Pool situations
      spell_defense_allocation: At gamemaster choice, 2 points (dice) of Magical Threat
        may be allocated to spell defense for 1 point (die) of spell defense; once
        allocated they cannot be used for other magical Success Tests.
      initiate_comparison: Gamemaster may add one-half an initiate’s grade to NPC
        Magical Threat Index for opponent comparison.
      conjuring_adept_exception: Conjuring adepts do not have Magical Threat Ratings;
        for comparison, the GM may use an index equal to one-third (round to nearest
        whole) of NPC Conjuring Skill.
      balancing_caution: Estimate before game and rebalance if needed; spells, foci
        and spirits can change balance and effects of accompanying/conjured spirits
        should be applied to whole combat rather than exclusively for one character.
    Decking:
      replaces: Hacking Pool situations
      balance_notes: Deckers’ cyberdecks and programs can shift balance radically;
        corporate deckers in a home system may gain advantage by ignoring security
        codes or other obstacles.
    Vehicle (Control):
      replaces: Control Pool situations
      test_types:
      - Driving
      - Piloting
      - Position Tests
      balance_notes: Vehicle Handling differences can be decisive in chases and vehicle/control
        contests.
  npc_vs_pc_fight_level:
    calculation: Compare combined Threat Index of NPC opposing group multiplied by
      3 with the combined relevant Dice Pool points of the player-character group.
    example: 'Printed example: PC combined Combat Pool 36 versus NPC group Combat
      Threat Index 12; the book identifies 12 as 33% of Combat Pool and calls encounter
      A Breeze.'
    limitation: 'Apply a rating only where relevant: e.g. Decking Threat when actual
      decking occurs, Vehicle (Control) in control encounters.'
    unresolved_inconsistency: The same printed page instructs multiplying NPC Threat
      Index by 3 before comparison, implying 36/36=100% for its own example. Both
      source statements retained; no silent reconciliation.
  optional_initiative: Add one-half the NPC Threat Rating (rounded down) to the NPC’s
    Initiative total when GM wants to simulate a more experienced NPC reacting faster.
  creature_spirit:
    base: Creature/spirit Combat Threat Rating equals one-half of the creature’s Reaction
      or the spirit’s Force, with all fractions rounded UP.
    paranormal_bonus: For creatures with paranormal or spellcasting abilities (especially
      dragons), increase Combat Threat by one-half creature Essence IF creature has
      a combat-damaging or neutralizing spell or ability.
    spirits_exception: Do not apply that Essence-based increase to spirits.
  notes:
  - Specific threat ratings printed in Prime Runners are examples/guidelines, not
    immutable levels for later Shadowrun NPCs; GM may adjust based on the PC party.
  - Threat Index is for encounter balance; NPC Threat Rating itself is used in actual
    play.
  - Historical source addresses Second Edition only; do not conflate with any revised
    Third Edition threat mechanics.
