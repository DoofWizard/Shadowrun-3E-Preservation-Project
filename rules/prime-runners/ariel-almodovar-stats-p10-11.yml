  mechanics_context:
  - Her printed Magic Attribute is 9 (12); the Notes identify her unaugmented Magic as showing Grade 3 initiation
    in a hermetic order.
  - The Centering ritual is a slow swaying dance during which Almodovar stays at her standing position; immobility
    matters to surveillance casting.
  - The source specifies access to a grimoire granting her variants of useful spells with Force Ratings 6–8 as a
    possible noncash payment.
  - She is reluctant to conjure watchers because they are easily detected and the cost in ritual materials is high.
