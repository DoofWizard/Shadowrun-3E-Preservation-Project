  other_notes:
  - Natural Low-Light Vision
  - Mild allergy to certain food additives; vegetarian and carefully chooses what
    he eats
  - Photographic Memory allows remembering whatever the gamemaster wants him to know
    in the DC area, but not much beyond it
  game_master_price_mechanics:
  - Use standard Negotiation Tests for decreasing the price
  - Runners can receive an extra 5 percent price reduction on any deal if they supply
    optical CDs of 1930s/1940s detective movies Sherlock wants
  - Gamemaster may dispense with Etiquette Tests for item Availability, or subtract
    2 from the usual target numbers for such a test
  game_master_services:
  - Can supply most weapons other than military hardware, and armor, at short notice
  - Source says he can reduce required values to 75 percent of those given in SRII
  - Acts as an employment exchange and can help direct runners to work; source warns
    not to overuse him as a clue provider
