data:
  name: Michael James Sutherland [Decker]
  source_anchors:
  - printed_page: 72
    pdf_page: 81
    heading: Michael James Sutherland / character background
  - printed_page: 73
    pdf_page: 82
    heading: Attributes, Initiative, Threat Ratings, Cyberware, Gear, Notes
  attributes:
    Body: 2
    Quickness: 5
    Strength: 3
    Charisma: 5
    Intelligence: 7
    Willpower: 4
    Essence: 5
    Reaction: 6 (9 in Matrix only)
  initiative: 6 + 1D6 (4D6 in Matrix only*)
  professional_rating: 2
  threat_ratings:
    Combat: 2
    Decking: 9
  cyberware:
  - Datajack
  - Headware Memory, 30 Mp
  - Smartlink
  gear:
  - Ares Predator [15 (clip), SA, 9M, w/50 rounds of regular ammunition]
  - 2 modified Fairlight Excaliburs [one with MPCP 14, Hardening 7, I/O 75, Reaction
    Increase 3; the second identical except Hardening 6; never leave his apartment]
  - 2 modified Fuchi Cyber-7s [Hardening 6, I/O 50, Response Increase 3]
  - 'Programs determined by the gamemaster: Fairlights always have Sleaze 9, Browse
    9, Deception 9; attack utilities have area-effect and penetration options (source
    cites p.22, Virtual Realities).'
  - 'Microtronics Workshop: Portable computer, heavily modified as gamemaster sees
    fit; wallet-sized version'
  - Doc Wagon Contract (Platinum)
  - Tres Chic clothing, Brit style
  - Other items the gamemaster determines
  mechanics_and_notes:
  - The original page does not provide a character Skills table; do not invent a skill
    list or treat the printed music footnote as an enumerated skill.
  - 'Source footnote: Pre-20th-century music only; add 1 point to Skill Rating for
    specific composers noted in Sutherland biography.'
  - Gamemaster customizes unlisted programs and utilities; avoid silently filling
    omissions.
  - When using the Fast Resolution System for smart-frame operations, treat system
    load as 70 percent of actual value.
  - 'Integrated cardiomonitoring and mini-PET brain-scanning system: subtract 2 from
    target number of his Willpower Test to jack out when confronted with black IC.'
  - This stabilization system also gives him Target Number 3 on a Body Test to avoid
    Stun damage when jacking out.
  - If attacked by black IC and he fails to jack out, he is allowed a Body Resistance
    Test against IC damage because of the stabilizers.
  - Source cites SR II p.171 for jacking out of the Matrix and Virtual Realities p.55
    for smart frames; these are historical source references, not SR3 conversion.
