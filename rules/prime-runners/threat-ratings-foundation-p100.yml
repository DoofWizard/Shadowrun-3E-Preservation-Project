data:
  origin_and_scope:
    original_system: Shadowrun Second Edition Threat Ratings
    publication_expansion: Prime Runners expands the basic system to separate NPC areas of expertise
    gm_optionality: The gamemaster may use the basic or expanded system as best fits the campaign.
  basic_system:
    purpose: NPC Threat Rating substitutes for Dice Pools, avoiding expenditure tracking.
    use: A constant number of dice applies to an NPC offensive or defensive test; it may be modified during an encounter.
  expanded_system:
    domains:
    - Combat
    - Magical
    - Decking
    - Vehicle (Control)
    domain_selection: Use a separate Threat Rating only for tests in the associated domain.
    base_rating_calculation:
      numerator: NPC equivalent Dice Pool for that domain
      divisor: 3
      rounding: nearest whole number
      application: Add domain Threat Rating dice to appropriate tests in that area.
  balance_limitation: Threat Indices aid encounter comparison but are not an exact measure of danger; weapons, gear,
    spells, cyberware, bioware and other factors still matter.
headline: 'Prime Runners p100: foundation historical mechanics'
summary: Exact source-period Threat Rating values, applicability, exceptions, and edition provenance are preserved
  in structured fields.
framing: reference_exact
