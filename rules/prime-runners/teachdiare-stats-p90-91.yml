data:
  name: Teachdiare [Assassin]
  source_anchors:
  - printed_page: 90
    pdf_page: 99
    heading: Attributes, Skills, Initiative, Cyberware, Bioware, Physical Adept Abilities,
      Gear
  - printed_page: 91
    pdf_page: 100
    heading: 'Notes: bespoke weapon adjustments, magical ring, adrenal state and exceptions'
  attributes:
    Body: 5 (7)
    Quickness: 7 (8) [10]
    Strength: 5 (8) [10]
    Charisma: 2 (8) [see Notes]
    Intelligence: '6'
    Willpower: 4 (6) [8]
    Essence: '0.03'
    Magic: '4'
    Reaction: 6 (8) [12]
  skills:
    Bike: 6
    Etiquette (Corporate): 3
    Etiquette (Street): 5
    Firearms: 9
    Rifles: '11 (Walther WA 2100: 13)'
    Gaelic: 6
    Sperethiel: 6
    Stealth: 11
    Throwing Weapons: 3
    Unarmed Combat: 10
  special_skills:
    Ambidexterity: 13
    Centering (Tai Chi/Martial Arts): 8
  initiative: 6 + 1D6 (8 + 4D6) [12 + 4D6]
  professional_rating: 4 (never surrenders or stops fighting until dead)
  grade_of_initiation: 9
  threat_ratings:
    Combat: 8
  cyberware:
    grade: all delta-customized
    items:
    - Bone Lacing (Titanium) (1/1 Armor, Unarmed Damage = [(8)[10]] +3 M)
    - 'Hydraulic Leg Jacks: 6'
    - Level II Smartlinks in both hands (see Notes)
    - Voice modulator with all functions (including playback)
  bioware:
    grade: custom
    Body Rating: '4.02'
    items:
    - 'Adrenal Pump: 2'
    - 'Damage Compensator: 6'
    - Enhanced Articulation (+1 die for physically oriented skills except ranged combat)
    - 'Muscle Augmentation: 3'
  physical_adept_abilities:
  - 'Increased Reflexes: 3'
  - Enhanced Centering (Combat Skills)
  gear:
  - Ares Predator II [Heavy Pistol, 15 (clip), SA, 9M; 100 rounds regular, 50 rounds
    APDS; Level II Smartlink]
  - Doc Wagon Contract (Platinum), or its equivalent in almost all countries
  - Harley Scorpion
  - Walther WA-2100 [Sniper Rifle, 10 (magazine), SA, 14S; 50 rounds each regular,
    explosive and APDS; personally adapted Level II Smartlink and Silencer]
  - Other items, especially armor, at gamemaster discretion
  mechanical_notes:
  - Natural Low-Light Vision (elf).
  - Predator in left hand and Walther rifle in right; both smartlinks neurally/reflexively
    separate; does not use both simultaneously.
  - His custom Walther gives him -1 to all target numbers when he uses it; every other
    user suffers +1 to all target numbers.
  - 'Unarmed damage: 8M (Stun) without adrenaline pump; 10M (Stun) with adrenal pump
    operating; gamemaster may also use the Physical Damage rule referenced on p.83
    of Fields of Fire.'
  - Adrenal pump can be suppressed/activated using MAO/MAOI (MAO inhibitor)/ATCH shots;
    parenthesized attribute statistics represent pump operating and bracketed statistics
    require adrenal pump plus the other listed enhancements, as shown in the source.
  - Charisma normally 2; becomes 8 in threatening uses of personality/resources, including
    interrogations or subtler social situations where he presents a relevant threat.
  - 'Gold ring engraved with Celtic runes, approximately 4000 BCE: Complex Action
    to hypnotize one sentient target per Combat Turn while facing target at <=20 meters.'
  - Target resists by opposed Willpower Test against Teachdiare; if target achieves
    fewer than 3 net successes, target forgets that Teachdiare is or ever was present,
    including technical or infrared detection.
  - Ring effect ends when Teachdiare leaves; returning to target on a subsequent occasion
    does not reactivate it without renewed use on the spot.
  - Any aggressive act by Teachdiare against target breaks ring effect unless he renews
    it.
  - Any magically active character who pays 24 Karma Points to bond ring can use it.
  editorial_boundary: Historic NPC game statistics; no SR3 mechanical conversion claimed.
