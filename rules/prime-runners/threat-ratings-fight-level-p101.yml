data:
  name: 'Fight Level Table: Threat Index / Dice Pool Percentage'
  source_anchors:
  - printed_page: 101
    pdf_page: 110
    heading: Fight Level Table
  comparison: Printed rule instructs comparing (NPC opposing group combined Threat
    Index multiplied by 3) to PCs combined relevant Dice Pool points.
  levels:
  - threat_level: A Breeze
    percentage: 33
    description: A cakewalk; negligible challenge.
  - threat_level: Tricky
    percentage: 75
    description: Not simple, but not a serious concern; an unlucky shot may cause
      damage.
  - threat_level: Even Up
    percentage: 100
    description: Evenly matched; either side can prevail.
  - threat_level: Hard
    percentage: 125
    description: Opposition stronger, but beatable with effort.
  - threat_level: A Bruiser
    percentage: 150
    description: A demanding battle and casualties/injury expected.
  - threat_level: We're Fragged
    percentage: 200
    description: Very dangerous; strategic avoidance or luck may be needed.
  caution: The table gives qualitative encounter guidance, not an automatic victory
    or fixed measured danger; equipment and other factors change outcomes.
  worked_example_as_printed: Printed page 101 gives PC combined Combat Pool 36 and
    NPC group Combat Threat Index 12, labels 12 as 33% of 36 and classifies encounter
    A Breeze.
  unresolved_source_internal_discrepancy: The same page says to multiply combined
    NPC Threat Index by 3 before comparing it with PC Dice Pool points; this would
    give 36/36=100% for the printed example, not the printed 33%. Preserve both statements
    as written; do not silently repair the discrepancy.
