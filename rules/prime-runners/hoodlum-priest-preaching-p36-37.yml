data:
  name: Hoodlum Priest
  source_anchors:
  - printed_page: 36
    pdf_page: 37
    heading: Hoodlum Priest
  - printed_page: 37
    pdf_page: 38
    heading: Attributes/Skills/Notes
  preaching_skill_rating: 10
  social_interactions:
    trigger: Hoodlum Priest delivers Preaching during interactions; a brief declamation
      is a Simple Action, not a lengthy sermon
    dice_pool: Dice equal to Preaching skill rating (10)
    target_number: Listener’s Willpower
    effect: Each success temporarily treats Priest Charisma as +1 for later tests
      within the same interaction, including negotiating, interrogating and similar
      tests.
    limitations: Rules do NOT force conversion to his beliefs; gamemaster decides
      the beliefs of other NPCs.
  follower_morale:
    trigger: Priest deliberately whips up his flock before an encounter, e.g. for
      a run/raid
    effect: Add 1 to each follower’s Professional Rating and Threat Rating for the
      duration of the next combat encounter.
  ghouls_and_ghosts:
    target_classes:
    - Ghouls
    - Ghosts
    - At gamemaster discretion banshees, perhaps vampires and other listed critters
    dice_pool: Preaching skill rating (10)
    target_number: Creature’s Essence Rating
    two_or_more_successes: Creature will not attack the Priest or anyone with him
      unless they attack the creature first.
    four_or_more_successes: Undead creature moves away if he commands it and if possible;
      it may also communicate with him when requested.
    group_modifier: Add 1 to skill test target number for every 20 critters when addressing
      a large group.
    setting_exception: Ghosts and ghouls of Chicago Shattergraves know the Priest;
      they are reported unlikely to attack unless he attacks them or they are magically
      compelled.
  important_disambiguation: This is source-era fiction game resolution, not a real-world
    religious, paranormal or persuasion claim.
