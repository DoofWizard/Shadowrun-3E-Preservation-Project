data:
  section: Actions / Critter
  additional_action_labels:
    simple: [Sense Link, Telepathic Link]
    complex: [Aid Power, Animal Form, Animal Gateway, Human Form, Wealth]
  literal_name_uncertainty: Animal Gateway is the printed label. The relationship to Astral Gateway in Magic in the Shadows is unresolved; do not treat the labels as synonymous without evidence.
  reference_scope: The introductory paragraph identifies SR3, Rigger 2, Virtual Realities 2.0, Magic in the Shadows and the Critters book in the SR3 Gamemaster Screen as the underlying sources. The list alone does not specify power prerequisites, targeting, or supersession.
  preserved_qualifiers: The printed Simple listing of Materialize/Dematerialize and Complex listings of Engulf, Essence Drain, Mist Form, Search and Storm do not express the exclusive qualifiers preserved in detailed power records. Do not remove those qualifiers or infer an action-cost change from this abbreviated reference.
