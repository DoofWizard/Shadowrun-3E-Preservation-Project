headline: FASA7905a Shadowrun Companion (SR3), printed p130/PDF131 - Magic action reference additions
summary: The FASA Corporation consolidated fictional tabletop action reference supplies additional action classifications, with detailed procedures and eligibility preserved separately.
data:
  section: Actions / Magic
  additional_action_labels:
    free: [Allocate Spell Defense/Reflecting/Shielding dice]
    simple: [Read an Aura, Rooting (adept power)]
    complex: [Divination (Metamagic), Quicken a Spell (Metamagic), Create Wards, Possession (Metamagic), Ritual Sorcery]
  focus_listing_discrepancy:
    free: Deactivate Focus
    simple: Activate/Deactivate Focus
    complex: Activate Sustaining Focus
    disposition: The printed reference places deactivation in both Free and Simple lists. Preserve the two listings without inferring a new action cost or superseding the detailed core focus rules.
  scope: These are printed action classes, not total procedure lengths. In particular the Divination and Quickening entries do not replace their detailed timing, tests, or exclusive activity constraints. Read an Aura is not a universal action cost for every form of astral observation.
  additional_class_limits: Create Wards and Ritual Sorcery do not become single-action procedures; retain their detailed durations, tests and exclusivity where applicable. The Possession metamagic label does not alter the distinct entry conditions for willing hosts and hosts defeated in astral combat in the detailed fictional game rules.
  allocation_scope: The printed Free Action grouping covers allocating dice, not resolving an incoming spell; separate Spell Defense, Reflecting and Shielding eligibility and allocation rules remain intact.
