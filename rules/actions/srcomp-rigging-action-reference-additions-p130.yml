headline: FASA7905a Shadowrun Companion (SR3), printed p130/PDF131 - Rigging/Vehicle action reference distinctions
summary: Original fictional tabletop classifications for rigged and non-rigged device activation, signal interception and CCSS system disengagement; preserve the distinct later rigger-combat disengagement rule.
data:
  section: Actions / Rigging/Vehicle
  grouped_activation_reference:
    free: Activate/Deactivate Rigged Autonav/Sensors/ECM/ECCM/ECD
    simple: Activate/Deactivate Non-rigged Autonav/Sensors/ECM/ECCM/ECD
    qualification: The printed grouping distinguishes rigged from non-rigged activation and deactivation. This is a reference classification, not permission to discard separate system-specific timing or mode requirements.
  reference_only_action_labels:
    complex: [Conduct Signal Interception, Disengage from a CCSS System]
  cross_source_distinction:
    companion_system_disengagement: Complex
    rigger3_combat_disengagement: Free
    compared_record: rules/security/ccss-rigger-combat.yml
    disposition: The Companion names disengagement from a CCSS system, while the later Rigger 3 record specifies disengagement during opposed rigger combat. Retain the different scopes without inferring identical procedures or a universal replacement.
  scope: This consolidated reference cites SR3, Rigger 2, Virtual Realities 2.0, Magic in the Shadows and Critters. These action classifications do not establish the detailed procedures, tests, timing, prerequisites or later-source supersession.
