id: rule.actions.srcomp-decking-action-reference-additions-p130
record_type: rule
status: reviewed
source: source.srcomp
printed_pages: '130'
pdf_pages: '131'
edition_scope: FASA Corporation Shadowrun Companion (FASA7905a), original Shadowrun Third Edition fictional tabletop game.
content_class: [rule_exact]
framing: reference_exact
headline: FASA Corporation Shadowrun Companion (FASA7905a), Third Edition, printed p130/PDF131 - Decking reference distinctions and Utility Pool restriction
summary: Original fictional tabletop action reference preserves the SK/AI-only Free Action for Utility Pool allocation and the previously recorded Crash Application discrepancy; detailed later procedures remain distinct.
data:
  section: Actions / Decking
  reference_only_action_labels:
    free: [Retrain Bandwidth]
    complex: [Invalidate Passcode, Purge Hog Virus, Restore Utility, Validate Passcode]
  utility_pool_reference:
    action: Allocate Utility Pool
    action_class: Free
    eligibility_only: [SKs, AIs]
    qualification: The Companion explicitly restricts this fictional game action to SKs and AIs. The later Matrix SK rule specifies allocation timing; the later AI record describes broad utility access but does not state this exact eligibility restriction. Retain the original reference classification without importing SK timing into AI procedures.
  printed_combined_labels:
    complex: [Crash Application or Host, Use Medic or Restore Utility]
  cross_source_difference:
    companion_crash_application_listing: Complex
    matrix_crash_application_listing: Simple
    matrix_crash_host_listing: Complex
    compared_record: references/matrix/system-operations.yml
    disposition: Preserve the original Companion listing alongside the distinct later Matrix operation classes; do not apply the older combined label as a replacement for the later detailed rules.
  scope: The original consolidated reference cites multiple earlier and contemporary game books, including Virtual Realities 2.0. These abbreviated classifications do not define their procedure, prerequisites, or supersession. Passcode actions are not presumed identical to later account operations, nor is Restore Utility presumed identical to Medic or Swap Memory.
