headline: FanPro10653 Target Wastelands SR3 fictional polar travel and exposure qualifications, printed pp121-123 / PDF pp122-124
data:
  source_title: "Target: Wastelands"
  publisher: FanPro
  hazards_page_121:
    survival_test: Many polar hazards are included in the Survival Test; the additional rules are optional for the gamemaster.
    dexterity_and_agility: Cold-induced numbness or bulky cold-weather clothing may each justify a +1 or +2 target number modifier to affected actions.
    glare: Outdoor daytime exposure without vision protection incurs glare penalties.
    clothing: Gamemaster may inflict Stun damage for either excessive or inadequate clothing, or inadequate water.
  hazards_page_122:
    white_nights: Track hours awake and apply appropriate target number modifiers for sleep loss and exhaustion when polar day or night disrupts sleep.
    crevasses: Snow bridges are especially risky for trolls or burdened characters.
    gusts: Major gusts may knock a character down on a failed Body (8) Test.
    slippery_ice: If the icy ground is slippery, a Quickness (6) Test is required to avoid falling.
  vehicles_page_123:
    snow_travel: [snowmobiles, caterpillars, crawlers, hovercraft, skimmers]
    hard_packed_snow_and_ice_additional_possible: [ATVs, sand buggies, walkers]
    terrain: Restricted or Tight, or impassable.
    ice_sheet_collision: An immediate Crash Test is required if a vehicle hits an ice sheet.
    aircraft: A Driving Test is mandatory; deep snow or hidden ice may incur additional modifiers.
    stress_precedence: The polar rule specifies 1 Stress Point per day or 1 per week with matching adaptation; compare the general adaptation wording on page 132 before selecting an effective rule.
    sea_travel: Ice can trap ships; iceberg collisions threaten vessels at and below the surface. The gamemaster may introduce collisions and damage as dramatically appropriate, with no separate numerical resolution procedure specified here.
