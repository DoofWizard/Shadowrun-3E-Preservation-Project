id: rule.hazards.target-wastelands-polar-survival
record_type: rule
name: "Target: Wastelands Polar Survival Guidance"
domain: hazards
status: ingested
effective:
  status: source_specific
  source: source.fanpro-10653
  pages: "47-54"
  basis: defines_source_specific_guidance
scope:
  applies_to:
    - "polar travel and equipment use in Target: Wastelands"
guidance:
  cold_and_water:
    - "Melt snow or ice before drinking rather than using body heat to melt it."
    - "Wet clothing greatly increases heat loss; staying dry is a primary survival concern."
    - "Cold exposure can lead to hypothermia, frostbite and trench foot."
    - "Dehydration remains a serious risk in cold deserts."
  visibility:
    - "Snow and ice can create severe glare and snow blindness; use eye protection."
    - "Snowstorms reduce ordinary, infrared, thermal, ultraviolet and motion-tracking usefulness."
    - "Millimetric imaging radar is recommended for movement in snowstorms."
  equipment:
    - "Cold suits use insulation and moisture-wicking layers; extreme cold still requires care."
    - "Maintain equipment frequently because lubricants, batteries, optics, armor materials and exposed cyberware can perform poorly in extreme cold."
    - "Use low-temperature weapon lubricants and minimize unnecessary external accessories."
    - "Heavy armor hinders travel in deep snow; cold-weather armor may reduce infrared contrast."
    - "Cyberlimbs require insulation, temperature management and maintenance in extreme cold."
  vehicles_and_drones:
    - "Road-capable vehicles work with care; snowmobiles and tracked ground drones are favored off-road."
    - "Aircraft and aerial drones have visibility, heat-signature and landing risks."
    - "Winter storms may disrupt communications and targeting; repeaters can help long-distance drone control."
  communications_and_magic:
    - "Satellite communications are strongly recommended in remote polar regions."
    - "Magical assistance is presented as especially useful for warmth, shelter, food and spirit support."
sources:
  - {source: source.fanpro-10653, pages: "47-54", pdf_pages: "48-55", relation: defines_source_specific_guidance}
notes:
  - "This record captures operational guidance, not the formal environmental test procedures later in Game Information."
  - "Poster speculation about astral phenomena is not promoted to general rules."
