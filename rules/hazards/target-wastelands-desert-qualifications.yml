headline: Fictional desert hazard qualifications, FanPro10653 SR3 printed 116-117 PDF 117-118
data:
  source_title: "Target: Wastelands"
  publisher: FanPro
  extends: [rule.hazards.target-wastelands-desert-hazards, rule.equipment.target-wastelands-desert-equipment-stress]
  ground_vehicles:
    terrain: Desert vehicle terrain is always Restricted or Tight and can be impassable, rather than merely sometimes classified that way.
  daily_stress:
    specified_targets: [external cyberware, vehicles]
    qualification: The one Stress Point per day sentence specifies external cyberware and vehicles. Weapons are identified as vulnerable but handled by the separate moving-parts jam procedure.
  moving_parts:
    poor_cleaning: Increasing the jam likelihood by one per day of inadequate cleaning is at gamemaster discretion, not automatic.
    timing: The source recommends choosing the moment of the resulting jam for dramatic tension.
  electrical_interference:
    exception: Internal cyberware is immune to the sandstorm electrical-interference rule.
    static_sensitive_items:
      game_roll: 1D6
      result_one: Uninsulated explosives and munitions in the fictional sandstorm detonate, rather than merely malfunction.
  source_scope: Desert hazards supplement the Survival Test at gamemaster discretion.
