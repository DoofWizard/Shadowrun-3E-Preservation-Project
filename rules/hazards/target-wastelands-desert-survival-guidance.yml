water:
  planning: {human_or_non_troll: "4 liters/day", troll: "8 liters/day"}
  extreme_heat_example: "At about 48 C, a healthy person resting in shade is described as surviving only a little over two days without water."
  exertion_example: "The same discussion says an unprotected traveler may lose up to about 4 liters/hour through sweating."
  improvised_solar_still: "A clear-plastic field still is described as producing roughly 1 liter/day under favorable conditions."
heat:
  guidance: "Use protective headwear, loose clothing, eye protection, gradual acclimation, regular hydration and night travel when practical."
  thermal_observation: "Sun-heated terrain can reduce useful thermographic contrast."
sand_and_wind:
  equipment: "Sand abrades optics, filters, sensors, joints and exposed machinery; dry lubricants are preferred to oil-based lubricants."
  storm_response: "Seek shelter, protect breathing and shut down electronics when practical."
flooding:
  guidance: "Rare heavy rain can create fast flash floods; avoid dry channels and seek high ground."
