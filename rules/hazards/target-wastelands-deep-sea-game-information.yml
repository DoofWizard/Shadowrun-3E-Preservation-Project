cyberware_pressure: &pressure
  threshold: "When a fictional character descends beyond 200 meters (20 atmospheres ambient), make a Stress Test, using implant grade to determine dice."
  recurrence: "Make another Stress Test for each additional 200 meters of depth."
  selection: "The gamemaster decides whether to test every item or select the affected item randomly."
  internal_headware: "The gamemaster may exempt equipment such as internal headware because cranial fluid buffers pressure; tooth compartments are excepted."
breathing_mixtures: &mixtures
  nitrox: "High-oxygen nitrox is excepted from the exotic-atmosphere problems described here."
  heliox: "Heliox conducts heat six times faster than nitrogen, with qualitative thermographic consequences; make a Body (4) Test against inner-ear infection and a Stress Test for the implant in question. Cyberear malfunction risk increases; implanted subvocal microphones, radios and telephones cannot be used properly."
  trimix: "The effects are less severe in warmer trimix; equipment in either heliox or trimix still warrants adverse-condition Stress Tests."
oxygenate_interaction: &oxygenate "A character with Oxygenate sustained on them deep underwater suffers oxygen toxicity: one box of Physical damage per minute until ascent or the spell is dropped."
