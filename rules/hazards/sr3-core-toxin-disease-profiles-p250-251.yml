  section: 'Beyond the Shadows — Toxins and Diseases: individual fictional game profiles'
  profiles:
  - name: Neuro-stun VIII
    printed_page: 250
    damage_code: 6S Stun
    speed: 1 Combat Turn
    game_effects:
      contact_or_inhalation_as_source_depiction: true
      even_if_damage_resisted: The character experiences in-game disorientation for approximately one hour.
      target_number_modifier_during_disorientation: 2
  - name: Narcoject
    printed_page: 250
    damage_code: 6D Stun
    speed: Immediate
    game_description: The book depicts this fictional game toxin as injected, including with in-world drug darts;
      the source states no additional side effects.
  - name: Gamma-Scopolamine
    printed_page: 250
    damage_code: 10D Stun
    speed: Immediate
    game_effects:
      source_depicted_delivery: Injection in the fictional setting.
      deadly_stun: The source equates Deadly Stun with full paralysis; lesser damage still imposes an additional
        +2 to ordinary Stun-wound modifiers.
      lesser_damage_extra_target_number_modifier: 2
      worked_example:
        stun_level: Serious
        target_number_modifier_total: 5
        initiative_modifier_total: -5
      full_effect_duration_hours: 1
      residual_effect_duration_after_full_effect_hours: 1
      residual_in_world_claim: The book depicts a residual effect as a truth-serum claim; this is fictional game-world
        portrayal, not a reliable real-world medical claim.
      willpower_modifier: -2
      willpower_floor: 1
      willpower_modifier_scope: For the duration of the fictional chemical effect, as described on original printed
        p250.
  - name: Fugu Family
    printed_pages:
    - 250
    - 251
    speed: Instantaneous
    variants:
    - name: Fugu-5
      damage_code: 3D
      in_world_price_per_dose_nuyen: 10000
    - name: Fugu-6
      damage_code: 6D
      in_world_price_per_dose_nuyen: 20000
    - name: Fugu-8
      damage_code: 8D
      in_world_price_per_dose_nuyen: null
    resisted_damage_side_effects: The source states there are no side effects if the character successfully resists
      damage.
    source_world_context: The book describes a manufactured fictional neurotoxin family and in-world coercive use;
      the entry does not supply any real-world synthesis or procurement instructions.
    price_limit: Printed p251 supplies dose costs for watered-down Fugu-5 and Fugu-6; no Fugu-8 price is specified
      there.
  - name: VITAS-3
    printed_page: 251
    damage_code: 6D
    speed: 12 hours
    source_description: The fictional rulebook describes viral disease transmitted through close contact or shared
      confined space; after the game incubation period, fever, chills and vomiting last until the in-game damage
      has been reduced to Light.
