id: rule.hazards.target-wastelands-survival-test
record_type: rule
name: 'Target: Wastelands Survival Test'
domain: hazards
status: ingested
source: source.fanpro-10653
printed_pages: '105-108'
pdf_pages: '106-109'
edition_scope: SR3
content_class: [rule_procedure]
framing: reference_exact
headline: 'FanPro10653 Target: Wastelands (FanPro, 2002), fictional SR3 wilderness Survival Test, pp105-108/PDF106-109'
effective: {status: source_specific, source: source.fanpro-10653, pages: '105-108', pdf_pages: '106-109', basis: defines}
procedure: &procedure
  activation: 'The gamemaster may invoke this procedure when characters spend several consecutive days in the wilderness.'
  frequency: 'Once invoked, test once per day in wilderness conditions.'
  skill: entity.skill.wilderness-survival
  terrain_target_numbers: {arctic_or_antarctic: 8, desert: 6, forest: 4, jungle: 5, low_mountains_or_foothills: 5, high_mountains: 6, plains: 4, swamp: 5, tundra: 5}
  modifiers:
    - {condition: 'full camping/survival gear', tn: -2}
    - {condition: 'partial camping/survival gear', tn: -1}
    - {condition: 'rations available', tn: -2}
    - {condition: 'no food or water', tn: 1}
    - {condition: 'heat/climate control available', tn: -1}
    - {condition: 'inappropriate clothing/armor', tn: '+1 to +4'}
    - {condition: 'extended travel/exertion', tn: '+1 to +4'}
    - {condition: 'toxic terrain', tn: '+2 to +4'}
    - {condition: 'poor weather', tn: 1}
    - {condition: 'terrible weather', tn: 2}
    - {condition: 'extreme weather', tn: 4}
    - {condition: 'unfavorable season', tn: 2}
    - {condition: 'Body 1-5', tn: '—'}
    - {condition: 'Body 6-12', tn: -1}
    - {condition: 'Body 13+', tn: -2}
    - {condition: 'injured', tn: '+Wound Modifier'}
  exposure_roll: 'Roll 1D6, or sum 2D6 in extremely hazardous conditions; subtract test successes. The result is the number of Stun damage boxes from exposure and fatigue.'
  recovery: 'This Stun damage cannot heal until the character reaches civilization or no longer relies on survival skills, and can rest for an 8-hour period.'
  deadly_stun: 'At Deadly Stun the character collapses and cannot attempt further Survival Tests. Without help, daily exposure damage continues, overflowing to Physical damage until death.'
  group_test: 'The group may test individually or together. One primary character tests, usually the highest Wilderness Survival skill or least wounded participant; other skilled participants may make Complementary Tests at the same target number, contributing half their successes rounded down. Add 1 to the exposure roll for each additional group member and distribute damage evenly, assigning extra boxes from lowest Body upward; break tied Body values randomly.'
  optional_stress: 'Instead of Stun damage, the character or each member of a group may receive the result as Stress Points, allocated randomly using the Man & Machine p127 Wound Effect Table, followed by the appropriate Stress Test for each recipient.'
links:
  uses: [entity.skill.wilderness-survival, rule.tests.success-test, rule.damage.stress-points]
  affects: [rule.condition.condition-monitor]
  modified_by: []
  interacts_with: [rule.hazards.target-wastelands-polar-survival]
data:
  source_title: 'Target: Wastelands'
  publisher: FanPro
  publication_year: 2002
  procedure: *procedure
sources:
  - {source: source.fanpro-10653, pages: '105-108', pdf_pages: '106-109', relation: defines}
notes:
  - 'The individual Body modifier does not apply to group tests.'
  - 'Detailed modifier thresholds and worked example are retained in rule.hazards.target-wastelands-survival-test-qualifications.'
