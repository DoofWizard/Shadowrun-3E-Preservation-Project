procedure: &procedure
  frequency: 'once per day while traveling through wilderness'
  skill: entity.skill.navigation
  base_target_number: 4
  initial_scatter: '10 percent of distance traveled multiplied by 1D6; direction uses the SR3 p118 scatter procedure.'
  success_effect: 'Each test success reduces scatter distance by 5 percent of distance traveled.'
  exact_arrival: 'Scatter reduced to zero or less means the group reaches the intended destination.'
  positive_scatter: 'If the remaining distance is positive, the characters reach an unintended location.'
  recovery_after_getting_lost: 'Once the characters realize they are lost, make another Navigation (4) Test with applicable modifiers; one or more successes identifies location and permits a new course.'
  further_travel: 'Further Navigation Tests are required if the remaining journey exceeds one day; the gamemaster may also repeat the procedure during course recovery.'
  all_ones: 'On any Navigation Test with all dice showing 1, the characters cannot establish their location or route to the destination for 24 hours; the gamemaster may place them at a reasonable location.'
  group_use: 'Use the highest Navigation skill in the group.'
modifiers: &modifiers
  gps_present: -2
  compass_present: -1
  vehicle_autonav: '-(Autonav Rating - 1)'
  map_or_mapsoft_available: -1
  familiar_terrain: -1
  weather_clear: -1
  weather_overcast: 0
  weather_bad: 2
  weather_terrible: 4
  equipment_limit: 'Apply only one of GPS, compass or vehicle Autonav.'
