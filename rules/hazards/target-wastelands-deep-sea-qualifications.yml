headline: Fictional Shadowrun Third Edition tabletop deep-sea rules — FanPro's Target Wastelands (FanPro10653), printed p130/PDF p131
data:
  source_title: "Target: Wastelands"
  publisher: FanPro
  extends: [rule.hazards.target-wastelands-deep-sea-game-information, entity.spell.alter-pressure]
  cyberware_pressure:
    immunity: The gamemaster may exempt internal headware from pressure Stress, except tooth compartments; exemption is not automatic.
    gas_mix_correction: The Body (4) inner-ear infection test and implant Stress Test belong to the heliox discussion; nitrox is explicitly excepted from the exotic-atmosphere problems in this paragraph.
    trimix: Less severe effects; equipment Stress Tests still apply.
    communication: Heliox can prevent proper use of implanted subvocal microphones, radios and telephones in the fictional setting.
    heliox_specific_implant: The source specifically identifies increased risk of cyberear malfunction as well as inner-ear infection; the implant Stress Test applies to the cybernetic implant in question.
    heliox_heat: The source describes heat conduction as six times faster than nitrogen and identifies a qualitative thermographic targeting consequence, without assigning a numerical targeting modifier.
  deep_sea_magic:
    detox: Can remove the intoxicating effects of nitrogen narcosis.
    alter_pressure:
      structural_effects: The gamemaster adjudicates the effects of pressure shifts on structures, life-support systems and pressurized cabins according to circumstances.
      exposure: Prolonged exposure within the spell area may invoke the Cannon Companion oxygen toxicity, decompression sickness, nitrogen narcosis or related hazard rules.
    oxygenate: A character on whom Oxygenate is sustained deep underwater suffers oxygen toxicity, taking one box of Physical damage per minute until ascending or the spell being dropped; the source states this consequence as mandatory under that condition.
