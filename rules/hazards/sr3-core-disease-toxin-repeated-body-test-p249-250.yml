  original_section: Beyond the Shadows — Diseases and Toxins
  characteristics:
  - The original tabletop fictional toxin or disease has a Power, Damage Code and
    Speed.
  - On reaching its specified Speed interval following exposure, an affected character
    makes a Body Test to resist in-game damage.
  initial_resistance_test:
    attribute: Body
    target_number: substance Power
    damage_staging: Every two successes reduce the Damage Level by one step.
  ongoing_exposure_or_infection:
    condition: The character remains in contact with the toxin or infected with the
      disease after the relevant Speed interval.
    repeat_test_after_each_speed_interval: true
    test_attribute: Body
    target_number_modifier: 4
    qualifier: The original passage says repeat tests have a +4 target-number modifier.
      It does not specify cumulative +4 on each further test; no cumulative increase
      is inferred.
    continue_until: Exposure or infection is no longer ongoing under original scenario
      conditions.
  original_antidote_vaccine_distinction:
    antidotes: The source describes game antidotes usually reducing disease/toxin
      Power and generally being used after exposure, before game damage is applied.
    vaccines: The source describes vaccines administered before exposure that can
      provide immunity so the character need not make the Body Test.
    deadly_damage_cross_reference: For Deadly damage, the correct in-game antidote
      is treated as professional attention under the Deadly Wounds and First Aid chapter,
      printed p129; no independent real medical instruction is stated.
  canonical_overviews_reused:
