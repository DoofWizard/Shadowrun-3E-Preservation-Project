  extends: rule.hazards.target-wastelands-navigation-test
  positive_scatter: The travelers arrive off target at another location.
  scatter_direction_reference: SR3 p118 Scatter Rules.
  after_recovery:
    multi_day_journey: Continue making additional Navigation Tests if the remaining travel exceeds one day.
    optional: Gamemaster may repeat the Navigation Test procedure while the travelers attempt to return to their intended course.
    location_recovery_test: Once the fictional travelers realize they are lost, another Navigation (4) Test with applicable table modifiers is required; at least one success establishes location and permits a new course.
  all_ones:
    scope: Any Navigation Test.
    duration_hours: 24
    location: Gamemaster may place the travelers at a reasonable location of choice.
