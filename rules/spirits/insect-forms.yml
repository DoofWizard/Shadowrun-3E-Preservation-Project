resolution:
  summary: "Insect spirits appear as either true-form spirits or flesh-form hybrids. True forms follow ordinary spirit rules, are astral/materializing spirits with Force Attributes and vulnerability to insecticides. Flesh forms permanently merge with a host body, become dual-natured, and combine host and spirit traits according to worker or soldier type and the degree of transformation."
  inputs: ["spirit type", "host body", "transformation result"]
  outputs: ["true-form or flesh-form insect spirit statistics"]
