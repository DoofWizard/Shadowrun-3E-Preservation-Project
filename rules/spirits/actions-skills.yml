    - "spirits and dragons in physical or astral combat"

resolution:
  summary: "Spirits and dragons use ordinary combat actions and skills where applicable, with their listed attributes, powers, and magical abilities. Their Initiative, actions, skills, and dice pools are determined from the creature's statistics and the relevant physical/astral state."
