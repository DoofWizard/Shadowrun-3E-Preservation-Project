scope: {applies_to: ["watcher spirits"]}
resolution:
  summary: "Watchers exist only on the astral plane and cannot materialize or ascend to a metaplane. Their Attributes equal Force. They can see/hear and manifest visibly/audibly, but cannot directly manipulate the physical world. They are bound to their summoner, use only Stun damage in astral combat, and have highly literal, limited intelligence."
