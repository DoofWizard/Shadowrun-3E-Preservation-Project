resolution:
  summary: "Allies normally remain with or near their master and can be sent to their native metaplane and recalled. A service order normally takes a Simple Action. Common services include astral watch, resisting the master's spell Drain, surveillance, ritual support, combat and other tasks. Allies can become increasingly independent as they grow."
