id: rule.spirits.true-names
record_type: rule
name: "Free Spirit True Names"
domain: spirits
status: ingested
effective: {status: current, source: source.mits, page: 114, basis: defines}
scope: {applies_to: ["free spirits and characters who know their true names"]}
resolution:
  summary: "A free spirit receives a true name when it becomes free. Speaking the true name attracts the spirit's awareness and creates an astral signature; repeating it three times can compel immediate arrival. Knowing a true name enables special banishing, binding, unique enchanting, and destruction attempts and can reveal or exploit the spirit's native-plane connection."
  inputs: ["true name", "speaker", "spirit Force/Spirit Energy"]
  outputs: ["spirit awareness, astral signature, summoning pressure, or access to true-name actions"]
