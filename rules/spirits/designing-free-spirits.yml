resolution:
  summary: "The source provides random generation tables for spirit type, Force, Spirit Energy, great-form status, and additional free-spirit powers. Force is normally 2D6; Spirit Energy is 2D6 x 10 percent of Force, rounded up. A free spirit automatically gains 1D3 free-spirit powers on going free and can gain additional powers as Force rises."
