resolution:
  summary: "Great loa can possess astrally active beings as well as ordinary eligible hosts, display their loa aspect physically, and gain Immunity (Normal Weapons) plus a loa-specific great-form power. Great nature spirits can cross domain lines, with land/sea/sky types gaining Storm and all great nature spirits able to Divinate. Great spirits of the elements also cross domain lines, count against Charisma-based spirit limits, gain Storm, and gain Cleansing."
