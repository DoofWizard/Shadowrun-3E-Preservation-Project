resolution:
  summary: "An ally spirit is a unique spirit created by a magician from a custom formula. The creator sacrifices 1 point of Magic and spends Karma to determine Force, Attributes, skills, forms, powers, spells and Karma Pool. The ally is bound to the creator but grows more independent as it gains power; an escaped ally becomes a free spirit."
  inputs: ["creator", "ally formula", "Magic sacrifice", "Karma design budget"]
  outputs: ["custom ally spirit"]
