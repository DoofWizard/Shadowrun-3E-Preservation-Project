{"id":"rule.spirits.sr3-core-spirit-powers-first-p262-264","record_type":"rule","status":"source_reviewed","source":"source.sr3-core","printed_pages":"262-264","pdf_pages":"271-273","edition_scope":"FASA Corporation, Shadowrun, Third Edition FASA7001 original supernatural fictional tabletop critter-power procedures and modifiers printed pp262-264/PDF271-273; do not merge later Critters supplement.","content_class":["rule_procedure"],"framing":"reference_exact","headline":"FASA7001 original fictional Shadowrun Third Edition critter powers: sustained effects, Fear and Hardened Armor, printed pp262-264/PDF271-273 (FASA Corporation)","summary":"Corrected original tabletop rules for innate power sustaining, separate Fear duration/severity successes, and the unmodified attack-Power Hardened Armor threshold; other established powers and APDS/AVM exception preserved.","data":{"publication":{"title":"Shadowrun, Third Edition","publisher":"FASA Corporation","catalog_number":"FASA7001","edition":"Third Edition","source_id":"source.sr3-core","source_kind":"published fictional tabletop role-playing game","source_sha256":"7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914","printed_pages":[262,263,264],"physical_pdf_pages":[271,272,273]},"source_section":"Spirits and Dragons — Powers (first group)","framework":{"same_state":"User and target must occupy compatible physical/astral states. Mana powers can affect astral forms; Physical powers need physical presence. Dual beings can interact with both as specified.","action_classes":"Complex, Simple, Free, Automatic; Exclusive powers cannot be performed while using/sustaining a different power.","range_classes":["LOS","Touch","Self"],"duration_classes":["Instant","Sustained","Permanent","Always","Special"],"sustain_limit":"Original printed p262 states no Essence-based numerical cap on the count of sustained critter powers. It instead specifies that innate sustained powers require no effort or cost and incur no continuing strain or target-number modifier. Do not invent a global cap from this page; separately sourced limits, if any, must be evaluated independently.","accuracy_scope":"The game master can adjudicate paranormal abilities contextually; numeric mechanics below are exact printed procedure elements.","sustain_damage_interruption":"Taking damage does not disrupt a spirit or dragon's sustained innate powers under the original p262 text."},"powers":{"accident":{"type":"P","action":"Complex","range":"LOS","duration":"Instant","test_attribute":"greater of target Quickness or Intelligence","target_number":"User Essence","on_test_failure":"Target suffers an apparent accident and loses the next Initiative Pass. Vehicle accident may force immediate Crash Test."},"animal_control":{"type":"M","action":"Complex","range":"LOS","duration":"Sustained","small_animals_maximum":"User Charisma × 5","large_animals_maximum":"User Charisma","scope":"Directing only normal actions of an animal; no source permission for implausible skills."},"astral_armor":{"type":"M","action":"Auto","range":"Self","duration":"Always","armor_rating":"User Essence","applies_to":"Astral form against astral attack only","dual_natured_exception":"Dual-natured creature needs astral projection to benefit."},"binding":{"type":"P","action":"Complex","range":"LOS or Touch","duration":"Instant","binding_strength":"2 × user Essence","escape_test":"Bound target Strength Test against binding Strength."},"concealment":{"type":"P","action":"Simple","range":"LOS","duration":"Sustained","perception_target_number_addition":"User Essence","can_conceal_multiple_targets":true,"scope":"Concealed subjects can still see each other."},"confusion":{"type":"M","action":"Complex","range":"LOS","duration":"Sustained","success_test_target_number_modifier":"User Essence","decision_test":"Affected character Willpower Test at TN equal to user Essence to make a decision; otherwise indecision persists until externally prompted."},"engulf":{"type":"P","action":"Exclusive Complex","range":"Touch","duration":"Sustained","initial_attack":"Melee; spirit uses Quickness rather than Reaction; successful target counterattack avoids being engulfed.","escape":"On each target action, Opposed Strength versus spirit Force Test; success frees the target.","damage_timing":"On each spirit action, including action engulfing target, apply subtype damage.","fire":{"damage":"(Force)M","additional_power":2,"armor":"Impact helps; Ballistic does not."},"water":{"damage":"(Force)M Stun","power_increase_per_spirit_action_since_engulfment":1,"additional_effect":"Deadly Stun victims still risk suffocation, subject to fictional game sequence."},"air":{"damage":"(Force)S Stun","resistance_attribute":"higher of target Willpower or Body","defense":"Breathing equipment does not prevent effect as published; unconscious victims may suffocate."},"earth":{"damage":"(Force)S","defense":"Impact armor applies, not Ballistic armor."}},"enhanced_senses":{"type":"P","action":"Auto","range":"Self","duration":"Always","examples":["low-light vision","thermographic vision","hearing","smell","heat-sensing","sonar","motion detection"]},"fear":{"type":"M","action":"Complex","range":"LOS","duration":"Special","test":"Opposed target Willpower against user Essence","duration_combat_turns":"Generally equal to the creature's successes (not specifically net successes); the creature's net successes separately guide the severity of fear.","severity":"Opposed-test net successes measure how severe the subject's fear becomes."},"flame_aura":{"type":"P","action":"Free","range":"Self","duration":"Sustained","melee_attack_power_addition":2,"striking_attacker_damage":"(Essence)M","armor":"Impact armor may help, given armoring of part used."},"guard":{"type":"P","action":"Complex","range":"LOS","duration":"Sustained","effect":"Prevents accidental mishaps, natural or caused by Accident power, in controlled terrain."},"hardened_armor":{"type":"P","action":"Auto","range":"Self","duration":"Always","no_damage_condition":"If the attack's Power, unmodified by burst fire or anything else, does not exceed the being's Hardened Armor rating, the attack causes no damage. APDS/AVM half-rating is a separate printed p264 exception.","against_apds_or_avm":"Hardened Armor counts as half its rating."}},"existing_canon_reuse":["catalog.critters.powers from the separate FASA7002 Critters publication","rule.spirits.combat","rules/magic/sr3-core-spirit-forms-combat-exact-p188.yml"],"source_limit":"This source-specific original FASA7001 power section is not a modern description of real-world supernatural ability or harm.","editorial_review":{"original_page_images":["Printed p262/PDF271, left and right columns","Printed p263/PDF272, left and right columns","Printed p264/PDF273, hardened-armor continuation top left"],"reviewed_text_paths":["edition_scope","headline","summary","data.publication.*","data.source_section","data.framework.*","data.powers.*","data.existing_canon_reuse[*]","data.source_limit","data.editorial_review.*"],"fidelity_limit":"Record specific original-image inspection and gate; later Critters source differences are not assumed superseding.","source_corrections_20261115":{"reviewed_text_field_paths":["data.framework.sustain_limit","data.framework.sustain_damage_interruption","data.powers.fear.duration_combat_turns","data.powers.fear.severity","data.powers.hardened_armor.no_damage_condition","data.editorial_review.source_corrections_20261115","headline","summary"],"source_provenance":"Fresh cataloged 112,507,704-byte FASA7001 FASA Corporation Shadowrun, Third Edition original source PDF SHA256 7661ba959edba8376373ed0cef13a39ecb63a2e9da3a311c3f4982d15b758914. Independently viewed printed p262/physical PDF271, p263/PDF272, and p264/PDF273, both text columns.","old_accepted_discrepancies":"Prior accepted record asserted an unsourced Essence-count cap on sustaining; used net successes instead of creature successes for generally stated Fear duration; and reversed the original pre-modifier damage-Power condition for Hardened Armor.","fidelity_boundary":"Preserve the original distinctions between source-assigned general duration, Fear severity, unmodified Hardened Armor attack Power and separate APDS/AVM half-rating. The source limits support these specific corrections, not entire-chapter completion or engine-tested behavior."}}}}
