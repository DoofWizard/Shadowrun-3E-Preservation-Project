scope: {applies_to: ["free spirits"]}
resolution:
  summary: "Spirit Energy represents accumulated free-spirit power beyond Force. It augments Force-based powers and physical Attributes, adds to astral Initiative, and can vary by situation or personal domain. All free spirits begin with 1 Spirit Energy and may raise it by spending Good Karma equal to the new Spirit Energy rating."
