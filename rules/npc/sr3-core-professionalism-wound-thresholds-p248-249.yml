  section: Non-Player Characters — NPC Professionalism
  professionalism_purpose: The original game gives the gamemaster fictional NPC courage/professionalism
    ratings that help judge continued fighting after injuries; ratings guide judgment
    rather than forcibly constrain GM decisions.
  optional_willpower_test:
    gm_may_use: true
    applicable_categories:
    - Average
    - Semi-Trained
    - Trained
    exempt_category: Professional
    test_attribute: Willpower
    target_number: 4
    trigger: An NPC has been wounded and the gamemaster is deciding whether the NPC
      can continue fighting.
    source_boundary: The source does not provide a separate numerical success threshold
      for remaining in combat beyond the standard game test rules.
  category_guidance:
  - category: Average
    original_examples:
    - pedestrians
    - untrained civilians
    wound_threshold: Light
    response: The book says such NPCs stop fighting or flee immediately after a Light
      wound.
  - category: Semi-Trained
    original_examples:
    - street cops
    - low-ranking corporate security guards
    wound_threshold: Moderate
    response: The book says such NPCs stop fighting or flee immediately after a Moderate
      wound.
  - category: Trained
    original_examples:
    - bodyguards
    - mercenaries
    - experienced street cops
    - corporate security guards
    wound_threshold: Serious
    response: The book says such NPCs stop fighting or withdraw immediately after
      a Serious wound.
  - category: Professional
    original_examples:
    - shadowrunners
    - elite law enforcement
    - elite security characters
    wound_threshold: null
    response: The book describes fighting to the end unless personal motivation dictates
      otherwise; no fixed wound threshold is supplied.
  interpretation: Preserve both descriptive wound thresholds and the gamemaster-optional
    Willpower (4) check; do not recast all categories as mandatory automatic effects,
    or subject Professionals to the optional check.
