id: rule.ssg-automated-transport-payment-p17
record_type: rule
status: source_reviewed
source: source.fanpro-10667
printed_pages: '17'
pdf_pages: '18'
edition_scope: 'SR3 fictional transport-service reference; FanPro, Sprawl Survival Guide (FanPro10667, 2003)'
content_class: [rule_procedure]
headline: 'Shadowrun Third Edition fictional tabletop service conditions: taxis and parking, FanPro Sprawl Survival Guide (2003), p17/PDF18'
summary: 'Source-described automated service payment and access conditions, with no added test or fare value.'
framing: reference_exact
data:
  scope: published fictional automated service procedures, not a universal vehicle rule
  taxi:
    boarding: passenger slots a credstick and selects a destination
    travel_condition: sufficient funds on credstick
    fare_deduction: at destination
    payment_failure_conditions: [insufficient funds, passenger does not authorize transaction]
    payment_failure_effects: [doors remain locked, company automatically reports crime to local law enforcement]
    passenger_compartment: camera monitoring at all times
  parking:
    entry: slot credstick and receive assigned parking-space number
    exit: slot credstick and pay for duration of stay
  game_test_target_number: null
  cost_reference: references/economy/ssg-common-costs-p124.yml
