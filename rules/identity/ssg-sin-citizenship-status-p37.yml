id: rule.ssg-sin-citizenship-status-p37
record_type: rule
status: source_reviewed
source: source.fanpro-10667
printed_pages: '37'
pdf_pages: '38'
edition_scope: FanPro Sprawl Survival Guide (FanPro10667, 2003), Shadowrun Third Edition fictional tabletop supplement
content_class: [rule_procedure]
framing: reference_exact
headline: FanPro10667 SR3 fictional SIN citizenship and legal status, p37/PDF38
summary: Distinct citizenship conditions and source-described criminal SIN status; no new verification test.
data:
  ordinary_sin:
    assigned_at: [birth, acquisition of citizenship]
    registration_standards: GSINR applies to nations using SINs; extraterritorial corporations must comply
    recorded_identity_fields: [name, birthdate, birthplace, citizenship, parents]
    registry_data_sharing: national and corporate registries share data with GSINR; otherwise disclosure is restricted to appropriate authorities
    dual_citizenship: possible; two separate SINs; some jurisdictions revoke citizenship upon acquisition of another
    civil_rights: many nations and corporations guarantee an established set of rights or privileges with a SIN; visas confer a more limited set
    ordinary_sin_required_for: [legal rental, employment, bank account, utility account, travel tickets, school, many basic consumer services]
  assignment_to_sinless:
    assigning_authority: law enforcement or government judicial agency
    conditions: applicant must demonstrate identity, contribution to society and law-abiding character
    guarantee: false
    processing_time: lengthy but not numerically specified
  criminal_sin:
    assigning_authority: law enforcement
    recipient: registered criminals
    additional_digits: 1
    purpose: denotes criminal or legal status
    linked_additional_data: [photographs, biometric scans, criminal records, sometimes tissue samples]
  attributed_eligibility:
    speaker: Spook
    qualification: some countries deny SINs to metahumans; in more liberal areas sasquatch, dragons, free spirits and other sentient critters have obtained them
  scope: Source describes fictional societal legal status; no universal verification rating, acquisition cost or time is supplied.
  reuse: [rule.gear.sr3-core-gear-legality-permits-fines-p273-274, rule.identity.ssg-fictional-id-creation-options-p125-127]
