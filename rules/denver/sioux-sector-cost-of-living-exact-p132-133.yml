  numbered_original_notes_semantics:
    '1': In the fictional Sioux Sector, only corporate security forces and their legal
      designates can buy explosive ammunition and other specialized ordnance.
    '2': Explosives are easier to obtain than elsewhere; the speaker cites a certificate-of-need
      requirement and alleged abuses of that requirement.
    '3': Corporate and sector security forces may use silencers without restriction;
      civilians may not possess silencers. Smartlinks can be installed by residents,
      while the only lawful model is described as made by Telsport.
    '4': Civilians may not lawfully possess armor heavier than armored clothing.
    '5': Only Sioux-manufactured headware may be legally installed for sector citizens,
      even though the narrator observes a shortage of such local manufacture.
    '6': The book explains premiums for legally purchased magical items in terms of
      the only legitimate talismonger/distributor for the sector being in Casper,
      Sioux Nation, and an included Sioux Nation surcharge designed to bypass the
      treaty’s anti-gouging provisions.
    '7': The book says the fictional Sioux government places very few restrictions
      on security vehicles owned by corporate security forces and their legal designates.
  numeric_values_source_fidelity: Percentages are source-period comparative equipment
    costs, not modern retail prices; original category order, markers and values preserved
    without inferred conversion.
