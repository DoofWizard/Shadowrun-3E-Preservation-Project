  printed_footnotes_exact_meaning:
  - mark: '1'
    assertion: The note identifies specific ammunition categories restricted for civilian
      ownership, including APDS, explosive and belt-fed ammunition; assault-cannon
      rounds are reserved for the named corporate security force.
  - mark: '2'
    assertion: Light and medium body armor are permitted but heavy armor is restricted;
      the source notes security guards commonly wear medium armor.
  - mark: '3'
    assertion: Demolition-type explosives require government licensing as a contractor
      or equivalent, with personal explosives subject to stricter controls.
  - mark: '4'
    assertion: The text reports no restrictions on firearm accessories in the Aztlan
      Sector.
  - mark: '5'
    assertion: Surveillance countermeasures may not be sold legally in the sector;
      the text gives illicit prices as 110–250 percent of Seattle prices, varying
      by demand and supply.
  - mark: '6'
    assertion: The note differentiates lawful prosthetic replacement cybertech from
      enhancements; it reports approximately 300 percent of Seattle prices for illicit
      enhanced gear, with prices varying, and states that cyberdecks may not be purchased
      legally.
  - mark: '7'
    assertion: The listed magical-weapon category is illegal and available only on
      unofficial markets at a cited 300 percent of Seattle prices.
  - mark: '8'
    assertion: The printed note gives “Get actual price.” for military vehicles.
  market_interpretation_in_narrator:
    usual_aztlan_sector_VAT_percent: 10
    black_and_shadow_market_prices_may_vary_by_up_to_percent: 20
    price_index_scope: Legal market where not otherwise annotated; source warns prices
      fluctuate and are not directly comparable to Aztlan proper.
