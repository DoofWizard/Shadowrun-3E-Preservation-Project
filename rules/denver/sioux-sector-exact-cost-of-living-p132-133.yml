  numbered_footnotes:
    '1': The fictional source restricts explosive ammunition and specified ordnance
      to corporate security forces and designated legal agents.
    '2': The fictional narrator claims explosives are easier to obtain in this sector
      and mentions abuse of need certificates; this is in-world setting narration,
      not real-world procedural advice.
    '3': Corporate and sector security forces may use silencers without restriction,
      while civilian possession is illegal in the fictional sector. The source states
      only the Telspot model is a legal civilian smartlink.
    '4': Fictional civilians may not legally possess armor heavier than armored clothing.
    '5': Only Sioux-manufactured headware may legally be installed in fictional Sioux
      Nation citizens; the source narrator remarks sarcastically on local manufacture.
    '6': Prices for legal magical equipment include premiums because the sole legitimate
      talismonger/distributor is based in Casper in the Sioux Nation, plus an in-world
      surcharge on magical drek intended to circumvent Treaty anti-gouging rules.
    '7': The fictional Sioux government imposes few restrictions on security vehicles
      held by corporate security forces and their designated agents.
  note_attribution: Numbered footnotes are printed book narration, not statements
    by named Shadowland posters.
  fidelity_note: All 32 printed percentage values and footnote marks [1]–[7] are preserved,
    including categories and Seattle comparison basis.
