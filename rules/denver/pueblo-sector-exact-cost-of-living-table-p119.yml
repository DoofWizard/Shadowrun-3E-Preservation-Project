  footnotes_original_substance:
  - '1: Anything other than standard military ball ammunition is restricted; the speaker
    notes that belt purchases are not legally available.'
  - '2: Light body armor is legal; other armor is restricted in the fictional sector,
    with Pueblo Security Enterprises having special access.'
  - '3: Explosive purchases require a license; the speaker states this is burdensome.'
  - '4: Silencers, smartlinks and wizard-linked equipment are heavily restricted;
    recoil compensation is legal, allegedly for hunting.'
  - '5: Military vehicles are effectively out of ordinary legal reach; the commentary
    describes enforcement pressure and prices.'
  currency_and_prices: Percentages of fictional Seattle prices, not nuyen prices or
