data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    Shadowrun Second Edition-era fictional tabletop sourcebook; the legal restrictions
    and penalties below concern its invented Pueblo Sector.'
  source_pages:
    printed_range: 121-124
    pdf_range: 122-125
    reviewed_printed_pages:
    - 121
    - 122
    - 124
    reviewed_pdf_pages:
    - 122
    - 123
    - 125
    printed_page_123: Original full-page Pueblo Arsenal illustration, no legal prose
  source_voice: The How Pueblo Sector Works section is bylined to the fictional contributor
    Weares Funny Hats on printed p120. The following law-and-enforcement descriptions
    are the bylined speaker’s source-era account of the invented sector, not present-day
    actual law or independently verified narrator reportage.
  fictional_personal_use_and_btl_policy:
    printed_page: 121
    general_policy_reported: The contributor says Pueblo management permits most alcohol,
      recreational pharmaceuticals and simchips, including California hots, when used
      privately; conduct that harms another person or another person’s property while
      altered is treated as though premeditated, and intoxication is not a defense
      in this fictional sector.
    chip_dealing_policy_reported: BTLs are described as illegal, and penalties for
      dealing BTLs are said to tend to be three to five times the penalties for personal
      possession.
    comparison_not_an_exact_mandatory_multiplier: The printed text says penalties
      tend to be three to five times as severe; it does not prescribe an invariant
      multiplier for every case.
  fictional_cyberware_policy:
    printed_pages:
    - 122
    - 124
    class_a_and_b: The contributor says people entering the Pueblo Sector are required
      to disclose their Class A and Class B cyberware to the government, and describes
      cyberware licensing as unusually burdensome.
    class_c: The contributor describes Class C cyberware, including cyberweapons and
      associated skillsofts, as illegal in the sector, with entry denied to persons
      known to possess it.
    class_c_consequence: If sector security discovers prohibited Class C modifications
      after entry, the contribution states that imprisonment is at least ten years;
      a person who also falsified entry information may face more.
    punishment_context: The ten-year term is presented as the contributor’s described
      sector practice; the separate exact weapons-and-punishments table on printed
      p122 also lists Class C Cyberware possession as 10 yrs.
  fictional_cyberdeck_policy:
    printed_page: 124
    registration: The contributor reports that every cyberdeck and program must be
      registered with the sector government when brought into the sector or bought
      there.
    inspection: The account says security staff may check decks and software for unregistered
      stealth modifications.
    stealth_modification_penalty: The contributor says stealth-modifying an otherwise
      licensed deck almost always results in five years imprisonment with no parole.
    qualifier: Almost always is retained; the source does not frame the term as an
      unconditional rule.
  fictional_controlled_chip_policy:
    printed_page: 124
    scope: The contributor says penalties under this heading apply to possession of
      or dealing in BTL chips or more restricted chips such as 2XS.
    dealing_variation: Penalty amounts depend on the number of chips, their severity,
      and other circumstances.
    average_penalty: The source states an average penalty of 2,000 nuyen and six months
      imprisonment, rather than a universally fixed sentence.
    relationship_to_table: The printed p122 controlled-items categories appear in
      the separate weapon-fines-and-punishment table; this record preserves the additional
      narrative qualifications without silently replacing that exact table.
  source_relationship: Complements, but does not duplicate, already indexed world/denver/pueblo-sector-corporate-government-immigration-and-law-p120-122.yml
    and the exact printed p122 and p124 punishment tables.
