source_period_profile:
  - "The chapter presents post-Chicago insect spirits as potentially more subtle and adaptive, including 'good merge' hosts that may pass in ordinary society."
  - "A possible telepathic hive-mind and improved possession/infiltration behavior are presented through an in-world survivor account and should remain attributed rather than universal fact."
  - "The Cermak Blast is presented as having accelerated insect-spirit adaptation in Chicago."

telepathy_rule:
  base_reference: "Telepathy power, Shadowrun Second Edition p.218."
  substitution:
    - "When giving bug spirits the telepathic power, do not use Essence for the required test."
    - "Instead, make an Opposed Willpower Test between the insect spirit's Force Rating and the target's Willpower Rating."

cermak_variant_option:
  reference: "Toxic Critters rules, California Free State pp.148-149."
  rule: "Gamemasters may use the Toxic Critters rules to increase the powers of Chicago bugs exposed to radiation in the Cermak Blast."

