data:
  publication: {title: Shadowrun Companion, publisher: FASA Corporation, catalog: FASA7905a, edition: Shadowrun Third Edition}
  supplements: rule.contacts.srcomp-enemy-rating-characteristics-original-p69-70
  creation:
    timing: The gamemaster may establish personal enemies during character creation.
    entity_type: Individuals or organizations.
    campaign_scope: A personal enemy may become a team enemy, and a team enemy may become personal.
    high_rating_exception: The source generally advises against a single starting Rating 5 or 6 enemy, but the Hunted Flaw can justify one.
  characteristic_descriptions:
    scope: Qualitative game ratings and examples, not additional automatic numeric modifiers.
    power:
      low: {range: [1, 2], interpretation: Limited resources.}
      moderate: {range: [3, 4], interpretation: Greater ability to act directly or through hired NPCs.}
      high: {range: [5, 6], interpretation: Extensive resources and influence.}
    motivation:
      low: {range: [1, 2], interpretation: Seeks a limited reprisal.}
      moderate: {range: [3, 4], interpretation: Seeks a substantially more serious reprisal.}
      high: {range: [5, 6], interpretation: Will travel great distances to pursue the fictional conflict.}
    knowledge:
      low: {range: [1, 2], interpretation: Does not know the character's location; may obtain clues to earlier whereabouts.}
      moderate: {range: [3, 4], interpretation: Knows the home city but must await further activity to identify the current location.}
      rating_five: May maintain continuous observation or have close personal knowledge.
      rating_six: Knows the character's precise location when play begins.
      rating_zero: Attempts to obtain leads have not located the character and the trail is stale.
