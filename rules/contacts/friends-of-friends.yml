id: rule.contacts.friends-of-friends
record_type: rule
name: Friends of a Friend
domain: contacts
status: ingested
effective:
  status: optional
  source: source.srcomp
  page: 62
  basis: extends
scope:
  applies_to:
  - using a contact's network to reach another source
resolution:
  summary: A character may work through a primary contact to reach that contact's
    secondary contacts (FOFs). FOFs use the character's normal test dice but apply
    target-number, cost/time, and information-leak modifiers according to the FOF's
    level and distance from the primary contact.
  inputs:
  - primary contact
  - FOF level
  - desired information, equipment, or service
  - base contact fee or item availability time
  outputs:
  - secondary contact access
  - modified test target number
  - modified fee or waiting time
  modifiers:
    level_1:
      target_number: 6
      cost_time_multiplier: 3
      wrong_party_target_modifier: -2
      target_number_modifier: 6
    level_2:
      target_number: 4
      cost_time_multiplier: 2
      wrong_party_target_modifier: -1
      target_number_modifier: 4
    level_3:
      target_number: 2
      cost_time_multiplier: see source text; may be reduced or waived at gamemaster
        discretion
      wrong_party_target_modifier: 0
      target_number_modifier: 2
    each_fof_after_first:
      target_number: 2
      cost_time_multiplier: see source text
      wrong_party_target_modifier: -2
      target_number_modifier: 2
    asking_around:
      wrong_party_target_modifier: -3
      target_number_modifier_source_literal: — (no numeric Target Number Modifier
        in this row)
    target_number_semantics: The level target_number values are additive Target Number
      Modifiers (+6, +4, +2, and +2 per further FOF), not absolute or replacement
      Target Numbers.
    table_columns_as_printed:
    - FOF Level
    - Target Number Modifier
    - Cost/Time Multiplier
    - Wrong Party Target Modifier
  fees:
  - Determine the normal contact fee using the SR3 contact-fee rules, then multiply
    it by the FOF cost/time multiplier.
  - A Level 3 FOF may reduce or waive the fee as a favor at the gamemaster's discretion.
  waiting:
  - For an item with Availability time, multiply the normal Availability time by the
    FOF cost/time multiplier.
  - If the information or item has no Availability, roll 2D6 days for the base wait,
    then apply the multiplier.
  - Each Etiquette success or each extra payment equal to 10 percent of the contact's
    fee reduces the wait by one day; normal Availability rules still apply.
