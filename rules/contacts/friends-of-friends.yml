  preserved_legacy_consumer_keys: resolution.modifiers.level_1/level_2/level_3/each_fof_after_first.target_number
    retain numeric values; their source-defined meaning is additive, not absolute,
    with target_number_modifier explicit aliases.
  using_fofs: Apply each positive FOF target-number modifier to the ordinary test
    TN; use normal test dice and the primary contact bonus dice. Different secondary-contact
    hops may impose additional modifiers.
  fees: Normal original SR3 contact fee is multiplied by the Cost/Time Multiplier
    where numeric. A Level 3 FOF may reduce or waive fee at GM discretion.
  waiting: Normal Availability time (or 2D6 days if no Availability) times the FOF
    Cost/Time Multiplier. Each Etiquette success or additional 10-percent fee payment
    can reduce wait one day; ordinary Availability rules also apply.
  example: Original p62-63 fictional examples show a positive FOF modifier added to
    an existing Etiquette Test TN, not a TN replacement.
