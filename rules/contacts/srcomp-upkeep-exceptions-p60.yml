  publication: {title: Shadowrun Companion, publisher: FASA Corporation, catalog: FASA7905a, edition: Shadowrun Third Edition}
  heading: Contact Upkeep
  supplements: rule.contacts.upkeep
  payment_timing: The annual amount may be paid across the game year, rather than in a single payment.
  additional_requirements: The gamemaster may establish campaign-specific contact maintenance requirements.
  level_one_failure:
    option_combination: The gamemaster may apply any one or all three consequences listed in the existing upkeep rule.
    network_access: When the contact ceases communication, both that contact and that contact's network cease to be available through that relationship for information.
  illustrative_adjustment:
    condition: A fictional Level 2 contact receives a relationship benefit that the gamemaster values as ongoing upkeep.
    example_remaining_cash_fraction: 0.5
    duration: While the benefit continues.
    scope: Example of discretionary valuation, not a general discount entitlement.
