  publication: {title: Shadowrun Companion, publisher: FASA Corporation, catalog: FASA7905a, edition: Shadowrun Third Edition}
  supplements: rule.contacts.special-contact-networking
  organization_network:
    eligibility: Almost any ordinary contact may belong to an organization or club.
    breadth_tradeoff: Broad membership does not guarantee access to members with privileged knowledge; such access is less likely in broadly appealing groups.
  international_network:
    chaining: Each intermediate friend of a friend is treated as a contact of the preceding one, with applicable ordinary FOF cost and time multipliers and Wrong Party modifiers.
    modifier_application: When contacts meet international FOFs, the gamemaster may apply the applicable International Contacts Table modifiers to the FOF Etiquette Test.
    direct_assistance: An international contact may supply information or assistance directly as well as through FOFs.
