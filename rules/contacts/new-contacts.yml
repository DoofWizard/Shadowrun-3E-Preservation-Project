    - entity.contact.contact
  affects: []
  modified_by: []
  interacts_with:
    - rule.contacts.improving-levels

sources:
  - source: source.srcomp
    page: 72
    relation: extends
    note: "New Contacts"
  - source: source.srcomp
    pages: "73-78"
    relation: example
    note: "Additional contact archetypes/examples"

notes:
  - "The contact archetypes on pp. 73-78 are examples/entities rather than replacement contact mechanics."
