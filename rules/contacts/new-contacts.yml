id: rule.contacts.new-contacts
record_type: rule
name: "Acquiring New Contacts"
domain: contacts
status: ingested

effective:
  status: optional
  source: source.srcomp
  page: 72
  basis: extends

scope:
  applies_to:
    - "contacts gained during play"

resolution:
  summary: "Recurring NPC relationships may become contacts during play. The Companion groups useful contact roles into corporate, government, street, underworld, and media categories and provides reusable sample NPC contact archetypes."
  inputs:
    - "NPC relationship"
    - "history of interaction"
    - "campaign circumstances"
  outputs:
    - "new contact"

links:
  uses:
    - entity.contact.contact
    - catalog.contacts.srcomp-samples
  affects: []
  modified_by: []
  interacts_with:
    - rule.contacts.improving-levels

sources:
  - source: source.srcomp
    page: 72
    relation: extends
    note: "New Contacts"
  - source: source.srcomp
    pages: "73-78"
    relation: example
    note: "Corporate, government, street, underworld, and media contact guidance plus sample contacts"

notes:
  - "The pp. 73-78 archetypes are examples and reusable NPC/contact templates; they do not replace the generic contact entity or contact-level rules."
