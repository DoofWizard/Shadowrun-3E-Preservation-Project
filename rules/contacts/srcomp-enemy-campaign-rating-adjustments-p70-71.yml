data:
  publication: {title: Shadowrun Companion, publisher: FASA Corporation, catalog: FASA7905a, edition: Shadowrun Third Edition}
  heading: Using Enemies
  supplements: rule.contacts.srcomp-enemy-rating-characteristics-original-p69-70
  campaign_adjustments:
    rating: The gamemaster may increase or decrease an enemy's Rating and Characteristic Points according to its current threat during the campaign.
    alternative: The gamemaster may adjust the fictional antagonist's actions to suit the story without recalculating ratings.
    combined_enemies: When fictional enemies cooperate, the gamemaster should design a suitably scaled encounter rather than add their Enemy Ratings together into an unbounded combined score.
  original_example:
    scope: Illustrative campaign adjustments only; no universal arithmetic progression is prescribed.
    adversary_ratings:
      - {role: father, initial: 1, during_visit: 2, after_departure: 0}
      - {role: former fiance, initial: 1, during_visit: 3, after_departure: 1}
      - {role: security head, initial: 2, during_visit: 3, after_departure: 3}
    characteristic_adjustment: The first increase is accompanied by appropriate adjustments to Motivation, Power and Knowledge.
