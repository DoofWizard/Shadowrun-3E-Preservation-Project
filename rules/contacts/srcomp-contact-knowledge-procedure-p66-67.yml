data:
  publication: {title: Shadowrun Companion, publisher: FASA Corporation, catalog: FASA7905a, edition: Shadowrun Third Edition}
  heading: Contact Knowledge
  related_canon: rules/contacts/contact-knowledge.yml
  related_canon_blob: 9899b0d77d5b860c3993b984f27dfda13db66df8
  scope: Original source separates the test of willingness to share from the test of actual knowledge; the former does not determine the latter.
  sequencing:
    mandatory_disclosure_first: false
    original_example: In the fictional example continued under Spilling the Beans, the gamemaster first resolves the contact's knowledge, then resolves disclosure separately.
    discrepancy: The generic contact knowledge record describes willingness as preceding knowledge; the printed example establishes that this is not a universal mandatory sequence.
  test_example:
    fictional_contact: Joe the bartender
    skill: Etiquette (Street)
    target_number: 8
    successes: 0
    result: The contact does not know the requested prototype details, but may still supply related general street rumors.
  existing_fields_reused: The related canon preserves the six target-number bands, two modifiers, choice of Etiquette or Intelligence, and success and failure interpretations; no new table values are asserted here.
framing: reference_exact
headline: FASA7905a Shadowrun Companion (FASA Corporation, SR3), pp66-67 — separate contact knowledge and disclosure tests
