  publication: {title: Shadowrun Companion, publisher: FASA Corporation, catalog: FASA7905a, edition: Shadowrun Third Edition}
  supplements: rule.contacts.shadowland-information-search
  selection_timing: A character with the required Computer skill may select Shadowland during character creation.
  access: The fictional service requires valid access codes and successful identification checks before the character can reach the service and requested information.
  identity_display: Characters appear under their street names and decker icons; those identifiers do not disclose physical location or search motivation.
  search_duration_discretion: The gamemaster may shorten or lengthen the ordinary search duration according to the particular inquiry.
  completed_search_output: The service assembles the requested data in a folder termed a sourcebook.
  personal_knowbot:
    prerequisites: Approval and registration with the service's deckers and programmers.
    normal_registration_duration: Usually less than one hour.
    search_duration: The existing two-die hours search rule applies after these prerequisites.
  optional_difficulty_scope: The gamemaster may use the applicable Contact Knowledge Table target number for all Matrix-based tests to locate specific data, including searches on Shadowland.
