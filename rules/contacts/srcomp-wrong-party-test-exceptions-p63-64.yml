data:
  publication: {title: Shadowrun Companion, publisher: FASA Corporation, catalog: FASA7905a, edition: Shadowrun Third Edition}
  heading: The Walls Have Ears
  supplements: rule.contacts.wrong-party
  frequency: Within this optional system the gamemaster makes a Wrong Party Test each time a character uses a contact or FOF for an inquiry.
  involved_individuals: Count all participating characters, FOFs and contacts who introduced the characters and FOFs.
  consequence_discretion: Consequences depend on campaign circumstances, the inquiry and the outside party; table bands are suggestions, not guaranteed outcomes.
  example_thresholds: A fictional megacorporation may not react until ten or more accumulated successes, while a particularly anxious fictional group may react at two or three.
  early_inquiry_exception: After several early successes the gamemaster may introduce misleading fictional leads through contacts or FOFs.
  asking_around: Apply the asking-around modifier in the original FOF table to the Wrong Party Test.
  original_example_discrepancy: The p64 example labels Tony a Level 2 FOF but uses a negative two modifier; p62 describes him as Level 1 and the printed table assigns negative one to Level 2. Preserve the table separately and do not infer an erratum.
