data:
  publication: {title: Shadowrun Companion, publisher: FASA Corporation, catalog: FASA7905a, edition: Shadowrun Third Edition}
  heading: The Walls Have Ears
  supplements: rule.contacts.wrong-party
  frequency: Within this optional system the gamemaster makes a Wrong Party Test each time a character uses a contact or FOF for an inquiry.
  involved_individuals: Count all participating characters, FOFs and contacts who introduced the characters and FOFs.
  consequence_discretion: Consequences depend on campaign circumstances, the inquiry and the outside party; table bands are suggestions, not guaranteed outcomes.
  example_thresholds: A fictional megacorporation may not react until ten or more accumulated successes, while a particularly anxious fictional group may react at two or three.
  early_inquiry_exception: After several early successes the gamemaster may introduce misleading fictional leads through contacts or FOFs.
  asking_around: Apply the asking-around modifier in the original FOF table to the Wrong Party Test.
  original_example_discrepancy: The p64 example labels Tony a Level 2 FOF but uses a negative two modifier; p62 describes him as Level 1 and the printed table assigns negative one to Level 2. Preserve the table separately and do not infer an erratum.
  related_accepted_path: rules/contacts/wrong-party.yml
  related_accepted_blob: 5f6b6a4ea5e358e5489b5a8b9c02237656d02081
  worked_example_p64:
    context: Fictional Billy Boy seeks an Ares Alpha combat gun, a new highly illegal item in the example's setting, then possessed only by Ares. Its corporate and military customers are still waiting for it. The GM tests whether Ares notices the inquiries and responds.
    base_target_number: 6
    inquiries:
      - {level_of_inquiry: 1, contact: Joe the bartender, dice: 2, target_number: 6, successes: 0}
      - {level_of_inquiry: 1, contact: Timmons the cop, dice: 2, target_number: 6, successes: 1}
      - {level_of_inquiry: 2, contact: Tony the Snake, via: Joe the bartender, dice: 3, printed_fof_level: 2, printed_modifier: -2, effective_target_number: 4, successes: 1}
      - {level_of_inquiry: 2, contact: Sexy Sioux, via: Timmons the cop, dice: 3, printed_fof_level: 3, printed_modifier: 0, effective_target_number: 6, successes: 1}
    first_level_successes: 1
    first_level_outcome: The GM decides Ares does not take notice; similar inquiries are familiar to the fictional corporation.
    cumulative_successes: 3
    cumulative_outcome: The GM decides Ares still does not take notice, given the relatively low total and the size of the corporation; this is a discretionary example, not a universal threshold.
framing: reference_exact
headline: Fictional Shadowrun tabletop RPG Wrong Party Test worked example, FASA Corporation Shadowrun Companion FASA7905a (Third Edition), printed pp63-64/PDF64-65.
