id: rule.contacts.improving-levels
record_type: rule
name: "Improving Contact Levels"
domain: contacts
status: ingested

effective:
  status: optional
  source: source.srcomp
  page: 60
  basis: extends

scope:
  applies_to:
    - "existing contacts"

resolution:
  summary: "Contact levels normally improve through roleplaying and sustained relationship-building. As an optional alternative, the gamemaster may permit a character to spend Karma to improve a contact by one level."
  inputs:
    - "current contact level"
    - "relationship history"
    - "gamemaster approval"
  outputs:
    - "improved contact level where earned"
  karma_option:
    cost: "2 x the new contact level in Karma Points"
    maximum_improvement: "one contact level by this method"
    examples:
      level_1_to_2: 4
      level_2_to_3: 6
  deterioration:
    - "The process works in reverse: prolonged neglect or disrespect can reduce a contact by one level."

links:
  uses:
    - entity.contact.contact
  affects: []
  modified_by: []
  interacts_with:
    - rule.contacts.upkeep

sources:
  - source: source.srcomp
    page: 60
    relation: extends
    note: "Improving Contact Levels"

notes:
  - "The Karma purchase is an optional alternative to relationship-based advancement and requires gamemaster approval."
