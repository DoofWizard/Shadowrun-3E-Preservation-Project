data:
  title: Shadowrun Companion — Enemy Rating Table and Power/Motivation/Knowledge characteristic point rules
  source_role: Optional enemy-creation rules for fictional tabletop campaigns; contact, enemy, and NPC game
    ratings, not real-world targeting guidance.
  source_chapter: Contacts and Enemies
  enemy_rating_table:
  - standard_system_resources_priority: E
    point_based_starting_resources_nuyen: 5000
    enemy_rating: 0
    characteristic_points_per_enemy: 0
  - standard_system_resources_priority: D
    point_based_starting_resources_nuyen: 20000
    enemy_rating: 1
    characteristic_points_per_enemy: 4
  - standard_system_resources_priority: C
    point_based_starting_resources_nuyen: 90000
    enemy_rating: 2
    characteristic_points_per_enemy: 6
  - standard_system_resources_priority: B
    point_based_starting_resources_nuyen: 200000
    enemy_rating: 3
    characteristic_points_per_enemy: 8
  - standard_system_resources_priority: A
    point_based_starting_resources_nuyen: 400000
    enemy_rating: 4
    characteristic_points_per_enemy: 11
  - standard_system_resources_priority: null
    point_based_starting_resources_nuyen: 650000
    enemy_rating: 5
    characteristic_points_per_enemy: 14
  - standard_system_resources_priority: null
    point_based_starting_resources_nuyen: 1000000
    enemy_rating: 6
    characteristic_points_per_enemy: 17
  source_printed_dash_note: The standard-system priority column prints a dash for the 650,000¥ and 1,000,000¥
    point-based rows; no ordinary priority category is supplied for those rows.
  enemy_rating_selection:
    gamemaster_determines_based_on: The player character’s starting Resources Priority or point-based starting
      resources provides a convenient baseline for the Enemy Rating; the GM can adjust to suit the campaign.
    rating_allocation: The GM may divide a player character’s Enemy Rating among several enemies rather than
      require one enemy of that entire rating.
    example: A character with Resources Priority A (Enemy Rating 4) may have one Rating 4 enemy, two Rating
      2 enemies, four Rating 1 enemies, or one Rating 3 enemy plus one Rating 1 enemy.
    flaw_exception: Some character Flaws increase the number or rating of enemies; refer to the Edges and Flaws
      chapter.
    high_rating_guidance: Ratings 5 and 6 are presented as better suited for particularly powerful antagonists
      and exceptional campaigns, not required starting enemies.
  enemy_characteristics:
    names:
    - Power
    - Motivation
    - Knowledge
    individual_rating_min: 0
    individual_rating_max: 6
    point_budget: The Enemy Rating Table gives a budget of Characteristic Points the GM can assign among the
      three characteristics for each enemy being created.
    power: Resources the enemy can use to act against the player character; rating 0 lacks meaningful practical
      resources, while ratings 5–6 denote very powerful opponents.
    motivation: How strongly the enemy seeks to act against the player character; the source contrasts low,
      moderate and very high levels, and a rating of 0 can be entirely passive.
    knowledge: Information the enemy has about the player character and whereabouts; rating 0 has no usable
      leads, ratings 3–4 permit awareness without necessarily locating the character, and ratings 5–6 can represent
      intensive surveillance or knowing the character’s location.
  original_example_characteristic_allocations:
  - name: Father
    enemy_rating: 1
    power: 0
    motivation: 3
    knowledge: 1
  - name: Ex-fiancé
    enemy_rating: 1
    power: 1
    motivation: 3
    knowledge: 0
  - name: Security head
    enemy_rating: 2
    power: 1
    motivation: 4
    knowledge: 1
  example_context: The fictional St. Jude sample divides the Resources Priority A enemy pool into three opponents
    (1+1+2); these example characteristics illustrate per-enemy allocation rather than one shared 11-point
    budget.
  using_enemies: The gamemaster may change an enemy’s influence, individual characteristic ratings and campaign
    behavior as the fictional story develops; these are narrative adjudications, not fixed automatic modifiers.
  table_qualitative_reference: The adjacent The Enemies You Deserve table illustrates enemy ratings 0 through
    6 with fictional situations; its scenarios are illustrations, not additional numeric formulas.
