id: rule.contacts.wrong-party
record_type: rule
name: "Wrong Party Information Leak"
domain: contacts
status: ingested

effective:
  status: optional
  source: source.srcomp
  page: 63
  basis: extends

scope:
  applies_to:
    - "contact and FOF inquiries that may attract unwanted attention"

resolution:
  summary: "Each time a character or team makes an inquiry through a contact or FOF, the gamemaster may make a Wrong Party Test to see whether word of the inquiry leaks to interested or hostile parties."
  inputs:
    - "number of people involved in the inquiry"
    - "FOF level or asking-around method"
    - "sensitivity of the inquiry"
  outputs:
    - "accumulated leak successes"
    - "campaign consequences when thresholds are reached"
  test:
    dice_pool: "one die per individual involved in the inquiry"
    examples:
      "one character speaking to one contact": "2D6"
      "eight-person team using a contact and another contact": "10D6"
    base_target_number: 6
    cumulative: true
    notes:
      - "The gamemaster may raise the target number for unusually careful or paranoid characters or lower it for careless characters."
      - "Apply the negative Wrong Party target-number modifiers from the Friends of a Friend table; they make leaks more likely."
  consequence_bands:
    "1-4": "Rumors of the team's activity begin circulating and rivals or enemies may start watching for an opportunity."
    "5-8": "The street broadly knows the team is active, although details may still be incomplete."
    "9-12": "Operational secrecy is badly compromised and opposition may know enough to interfere directly."
    "13+": "Only a few details remain secret; major opposition has extensive awareness and preparation opportunities."

links:
  uses:
    - entity.contact.contact
  affects: []
  modified_by:
    - rule.contacts.friends-of-friends
  interacts_with:
    - subsystem.contacts.enemies

sources:
  - source: source.srcomp
    page: 63
    relation: extends
    note: "The Walls Have Ears"
  - source: source.srcomp
    page: 64
    relation: clarifies
    note: "Wrong Party Table and examples"

notes:
  - "Successes from repeated inquiries in the same line of investigation are cumulative."
