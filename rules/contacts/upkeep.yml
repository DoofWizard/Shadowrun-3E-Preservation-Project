id: rule.contacts.upkeep
record_type: rule
name: "Contact Upkeep"
domain: contacts
status: ingested

effective:
  status: optional
  source: source.srcomp
  page: 60
  basis: extends

scope:
  applies_to:
    - "ongoing relationships with contacts"

resolution:
  summary: "Contact upkeep is a two-part optional campaign rule: maintain the relationship through roleplaying and also meet an annual upkeep cost. Upkeep can be paid with nuyen or with favors, services, advice, gifts, or other benefits the gamemaster values as payment."
  inputs:
    - "contact level"
    - "relationship maintenance"
    - "annual upkeep paid in nuyen or equivalent value"
  outputs:
    - "maintained contact level"
    - "degraded or lost contact if upkeep is neglected"
  annual_upkeep_nuyen:
    level_1: 500
    level_2: 3000
    level_3: 7000
  failure:
    - "A contact normally drops one level when required upkeep is not met or the relationship is not maintained."
    - "A Level 2 or Level 3 contact that drops may regain the previous level under the improving-contact rules."
    - "If a Level 1 contact is lost, the gamemaster may remove the contact, convert the contact into an enemy, or assign the Bad Reputation flaw."
    - "If all contacts are lost through neglected upkeep, the character receives Hung Out to Dry and Bad Reputation; the source also directs the gamemaster to increase the Priority level of each enemy by 1."

links:
  uses:
    - entity.contact.contact
  affects: []
  modified_by: []
  interacts_with:
    - rule.contacts.improving-levels
    - subsystem.contacts.enemies

sources:
  - source: source.srcomp
    page: 60
    relation: extends
    note: "Contact Upkeep and Contact Upkeep Table"

notes:
  - "This is optional/additive Companion material and does not replace the core contact entity or contact-level definitions."
