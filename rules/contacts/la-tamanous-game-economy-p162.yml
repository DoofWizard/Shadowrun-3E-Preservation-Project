headline: 'Loose Alliances (FanPro25006, FanPro, SR3), printed/PDF p162: fictional Tamanous game-economy qualifications and character consequences'
data:
  publication: {title: Loose Alliances, publisher: FanPro, edition: SR3, catalog: FanPro25006}
  fictional_organization: Tamanous
  game_cyberware_resale:
    basis: New cyberware book price in the Shadowrun game economy.
    common_percent: 10
    rare_or_custom_upper_percent_range: [20, 25]
    qualifier: Suggested fractions, not a universal fixed resale rule.
  fictional_transaction_qualifications:
    contact: The book makes the fictional transaction conditional on finding an operative and obtaining that NPC's trust.
    eligibility: The fictional remains must contain items the organization desires; the book identifies viable organs and functioning cyberware as its principal interests.
    outside_contractors: The fictional group rarely contracts out its core abduction and organ-harvesting activities; it generally retains those jobs internally.
  other_fictional_transaction_pricing:
    fixed_price_or_formula: false
    price_authority: Gamemaster discretion according to campaign needs.
    game_price_factors:
      - condition
      - time of death
      - metatype
      - desirability
    factors_nonexhaustive: true
  character_reputation:
    other_shadowrunners: Tend to avoid teams known to work with the organization; secrecy is a stated exception.
    law_enforcement: Harsher treatment of characters rumored to be involved.
    quantified_modifier_specified: false
