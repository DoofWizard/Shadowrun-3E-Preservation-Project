headline: 'Loose Alliances (FanPro25006, FanPro, SR3), printed/PDF p164: fictional Technicolor Wings rigger eligibility and game freight rates'
data:
  publication: {title: Loose Alliances, publisher: FanPro, edition: SR3, catalog: FanPro25006}
  rigger_work:
    recruitment_advantage: A character who brings new customers has improved hiring prospects.
    prerequisite: Pass the initiation test run.
    progression: Assigned route and initial low-level jobs; work level rises with player success.
    numeric_test_parameters: not specified
  freight:
    base_nuyen: 250
    volume_unit_cf: 10
    interval_days: 1
    fictional_game_goods_multipliers:
      - {category: paralegal, class: A, multiplier: 2}
      - {category: security grade, class: B, multiplier: 4}
      - {category: military grade, class: C, multiplier: 6}
    undisclosed_contents_flat_nuyen_per_10cf_per_day: 1000
    rounding_rule: not specified
    example: {fictional_goods_class: A, volume_cf: 10, days: 2, nuyen_per_day: 500, total_nuyen: 1000}
