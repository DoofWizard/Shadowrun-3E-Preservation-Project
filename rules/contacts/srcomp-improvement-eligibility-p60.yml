  heading: Improving Contact Levels
  supplements: rule.contacts.improving-levels
  improvement_eligibility:
    applies_to: All contact-level increases, including the optional Karma method.
    approval: The gamemaster must approve the increase based on the fictional relationship.
    level_three_exception: A contact with only occasional meetings and no notably friendly relationship is not suitable for Level 3.
  deterioration:
    level_one: A neglected Level 1 contact becomes unusable and may disappear or become an enemy.
    loss_of_all_contacts_through_neglect: The character suffers damage to street reputation and at minimum faces target-number modifiers to Interaction Tests.
    modifier_magnitude: Not quantified in this passage.
