data:
  publication: {title: Shadowrun Companion, publisher: FASA Corporation, catalog: FASA7905a, edition: Shadowrun Third Edition}
  heading: New Contacts
  applies_to: Printed sample contacts used as GM NPCs or player-character contacts.
  customization:
    open_skill_choices: Select unspecified skills to suit the campaign, respecting any limits in the individual stat block.
    language_skills:
      default: Assume the NPC can speak, read and write languages the GM considers necessary.
      alternative: Assign Language Skills under the SR3 character creation rules, p59.
    gear: The GM may assign additional gear beyond the listed necessary gear.
    knowledge_scope: Contact information is normally limited to the contact's areas of expertise; contacts should not be universal experts.
  stat_block_references:
    - references/contacts/srcomp-sample-contact-original-game-stat-blocks-p74-76.yml
    - references/contacts/srcomp-sample-contact-original-game-stat-blocks-p77-78.yml
framing: reference_exact
headline: Shadowrun Companion p73 — sample contact customization
summary: Optional fictional NPC customization rules for open skill choices, languages, additional equipment and specialist knowledge.
