printed_pages: '135-136'
pdf_pages: '136-137'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: FASA7126 Surgical Skills — Biotech specializations and medical knowledge
summary: FASA7126 Man & Machine, FASA Corporation (1999), Shadowrun Third Edition tabletop rules, printed pp135-136/PDF136-137.
data:
  biotech:
    base_active_skill_for_medical_procedures: true
    standard_skill_use_and_defaulting: true
    specializations:
      cybermancy: Cybermantic surgery (M&M p55).
      cybertechnology_implantation: Cyberware implant surgery (M&M p146).
      extended_care: Postoperative, recovery and long-term care; assists Physical damage healing (SR3 p127).
      first_aid: Immediate lifesaving and wound care.
      magical_health: New specialization for extended care of Awakened patients; includes holistic methods, astral assessment and health spells.
      organ_culture_and_growth: Care and growth of replacement parts and bioware; preservation of donated transplant parts.
      surgery: Cosmetic, therapeutic and trauma surgery; excludes cybertechnology implantation and transimplant surgery.
      transimplant_surgery: Bioware or replacement body-part transimplant surgery (M&M p147).
  other_active_skills:
    computer_cybernetics: Computerized cybertechnology and its neural or data interfaces.
    computer_cybernetics_br: Repair of computerized implants, including headware, skillwires, matrixware and riggerware.
    electronics_cybertechnology: Electronic cyberware and associated power, control, diagnostics, communication and motor systems.
    electronics_cybertechnology_br: Construction, maintenance and repair of electronic cyberware.
  knowledge_skills:
    medicine:
      required_for_doctor: true
      applications: [diagnosis, surgical planning]
      general_practitioner: No Medicine specialization.
      specializations: [specific biological system, traumatology, pathology, toxicology]
    particularly_useful: [Biotechnology, Cybertechnology, Genotechnology, Nanotechnology]
    other_potentially_useful: [Biology, Parazoology, Parabotany, Chemistry, other physical sciences, Psychology, Sociology]
  relationship_to_core: The original SR3 Biotech skill and defaulting rules remain in force; this supplement specifies application domains and additional specializations.
sources:
  - {source: source.mm, pages: '135-136', relation: extends, note: Surgical Skills, Active Skills and Knowledge Skills}
