headline: "Mr. Johnson's Little Black Book (FanPro25003, FanPro, SR3), fictional tabletop p34/PDF35: optional player-awarded Karma"
data:
  publication: {title: "Mr. Johnson's Little Black Book", publisher: FanPro, edition: SR3, catalog: FanPro25003}
  optional: true
  supplements: rule.karma.core-karma
  core_printed_page: 244
  recommended_group_total_karma: 2
  suggested_categories:
    contribution:
      award: 1
      criterion: Character with superior ideas or plan, or who rescued a teammate from a nearly impossible predicament.
    roleplaying:
      award: 1
      criterion: Player whose roleplaying the group especially enjoyed.
  voting:
    participants: Everyone on the team votes in each category.
    self_vote_allowed: false
    winner: Character receiving the most votes in that category gets the award.
    tie_break: null
  additional_categories: GM may add categories; examples include professionalism and humor.
  notice: Inform all players of the guidelines before the run starts.
  scope: Suggested extra awards in addition to normal GM Karma awards, not an automatic mandatory bonus or replacement for core rules.
