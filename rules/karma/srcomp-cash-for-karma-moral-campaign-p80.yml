data:
  title: Cash for Karma — moral-campaign variation
  relation_to_base_option: Optional variation of Cash for Karma; not the ordinary
    Cash for Karma procedure in the adjacent column.
  applicability: Campaigns where player characters buy Karma instead of receiving
    ordinary awards, including the source-described campaigns with morally questionable
    player characters.
  ordinary_karma_awards: The gamemaster makes no standard Karma awards during this
    campaign variation.
  acquisition: Player characters must obtain all their Karma by purchasing it with
    nuyen.
  sequence:
  - The player announces the intention to purchase Karma for the character.
  - The gamemaster determines the price of one Karma Point by rolling 3D6 and multiplying
    the result by 100 nuyen.
  - The player may purchase Karma at the rolled unit price, subject to any limit on
    the number of points the gamemaster permits to be bought at one time.
  price_per_karma_point:
    roll: 3D6
    multiplier_nuyen: 100
    formula: 3D6 × 100 nuyen for 1 Karma Point
  quantity_cap: The gamemaster sets any limits on the number of Karma Points a character
    can purchase at one time.
  karma_pool_exception_to_base_option:
    purchase_counts_as_awarded_karma: true
    rather_than_always_good_karma: Every twentieth purchased point, or every tenth
      for humans, is added to the Karma Pool instead of Good Karma.
    human_karma_pool_interval: 10
    other_character_karma_pool_interval: 20
  comparison_with_existing_option:
    existing_id: option.karma.cash-for-karma
    distinction: The ordinary option makes purchased Karma Good Karma that does not
      count toward Karma Pool progress; this optional moral-campaign variation instead
      counts purchased Karma as awarded Karma and allocates periodic points to Karma
      Pool.
  provenance:
    publisher: FASA Corporation
    title: Shadowrun Companion
    product_id: FASA7905a
    game_edition: Shadowrun Third Edition
    original_printed_page: 80
    physical_pdf_page: 81
    source_id: source.srcomp
    rules_section: Advanced Rules — Karma / Cash for Karma
  limitations:
  - No fixed lifetime maximum purchase quantity is specified; the gamemaster sets
    a per-purchase cap.
  - Do not apply this variant to ordinary Cash for Karma campaigns unless the gamemaster
    selects it.
