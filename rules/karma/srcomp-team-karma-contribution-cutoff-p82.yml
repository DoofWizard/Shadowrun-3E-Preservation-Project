data:
  section: Advanced Rules / Team Karma
  applicability: Intended for a stable group of characters played over an extended period; not feasible for regularly changing characters.
  additional_contributions: Members may add points between encounters or adventures.
  withdrawal: Characters cannot withdraw contributed points for personal use; departure removes points under the existing departure rules without returning them to the character.
  optional_personal_pool_cutoff:
    gm_guidance: The gamemaster should suggest a personal Karma Pool cutoff, with 5 and 10 points given as examples.
    example_cutoffs: [5, 10]
    allocation_after_cutoff: Further Karma Pool points earned by that character go directly to the Team Karma Pool.
    purpose: Experienced characters can support newer team members while limiting the size of personal pools.
  reuse:
