data:
  title: Favors and Markers — Karma costs, contact effects and marker resolution
  source_context: Optional Favors and Markers rules in the published fictional Shadowrun
    Third Edition Companion supplement, not real-world agreements.
  relation_to_legacy_overview:
    canonical_id: option.karma.favors-markers
    distinct_rule_contribution: Exact Karma expenditure, temporary contact status,
      and marker-earned award procedures, rather than the older generic overview that
      mentions optional exchanges without numeric cost or contact test effect.
  favor_purchase:
    cost:
      good_karma_points: 1
    purchase: For 1 Good Karma Point, a player character buys one favor from an NPC.
    temporary_contact_level: 1
    social_test_attitude: Friendly for the purposes of Social Skill Tests for the
      favor.
    duration_scope: Contact level and Friendly attitude apply for purposes of the
      purchased favor only; no permanent contact is established by the purchase.
    source_cross_reference: SR3 core p92 for Social Skill Tests.
  optional_gm_favor_awards:
    permission: The gamemaster may offer the player an option to substitute favors
      for Karma at the end of an adventure.
    purpose: Allows players to accumulate favors to call in when needed.
  markers:
    definition: A marker is an obligation on the player character to perform a service
      or action for a nonplayer character.
    permitted_agreement: Only players can agree to markers for their characters; a
      gamemaster can encourage this arrangement through NPC offers.
    calling_marker: When an NPC, never another player character, calls a marker, the
      player character must perform the requested service or action.
    earned_karma_on_completion:
      minimum_karma_points: 1
      source_wording: The player character receives at least 1 Karma Point for completing
        the requested service.
      gm_discretion: The gamemaster may increase the award when the service is especially
        difficult.
      note: The source says Karma Points, not specifically Good Karma Points; no inferred
        pool categorization.
    future_favor_exchange: A character can trade a marker for a future favor from
      an NPC.
  uncertainty_policy:
  - No universal upper cap on NPC marker completion Karma awards is stated.
  - Do not infer a mandatory refusal penalty beyond the stated obligation.
  - Do not promote a purchased temporary Level 1 contact into a permanent relationship.
