data:
  title: 'Optional Team Karma Pool: contribution, refreshing, voting, membership,
    and departure'
  relation_to_existing:
    canonical_id: subsystem.karma.team-karma
    distinct_new_fields: Numeric initial contribution, multi-team surcharge, voting
      procedures, half-pool departure loss, optional good-terms share calculation,
      death/replacement, and NPC-team handling; the prior subsystem outline does not
      state these values.
  source_scope: An optional Shadowrun Third Edition gamemaster rule for a persistent
    shadowrunning team, not a new default rule for every party.
  formation:
    minimum_contribution_per_member:
      karma_pool_points: 1
    transfer: Each member contributes at least 1 point from personal Karma Pool to
      a Team Karma Pool.
    permanency: Contributed personal Karma Pool points are permanently removed from
      the contributing character.
    refresh: The Team Karma Pool refreshes when personal Karma Pools refresh.
    burned_points: Team Karma Pool points spent for extra successes or otherwise burned
      are permanently lost, as with personal Karma Pool.
  multiple_teams:
    contribution_cost_formula: Cost in personal Karma Pool Points equals desired Team
      Karma contribution plus 1 point for each additional team the character belongs
      to.
    example: 'Character is part of three teams; adding 2 Team Karma Pool points to
      one team costs 4 personal Karma Pool Points: 2 contribution + 2 extra-team surcharge.'
    example_teams: 3
    example_contributed_points: 2
    example_personal_pool_cost: 4
  use:
    group_only: A character may use Team Karma only when acting with the team or on
      the team’s behalf, not on an unrelated solo run.
    consent: Use requires agreement by a majority of team members.
    presence: Not every member must be present for the pool to be used.
    voting: All players present at the gaming session vote on each use; ties are decided
      by the gamemaster.
  ordinary_departure:
    group_pool_loss: When a member leaves or is asked to leave, one-half of the current
      Team Karma Pool points are permanently removed.
    departing_member_compensation: The departing character receives none of the lost
      Team Karma Pool points.
    return_after_departure: If the character rejoins, the character must contribute
      new Karma to the pool before using it again.
  optional_good_terms_departure:
    availability: Gamemaster may waive the ordinary departure loss if a member departs
      on good terms.
    formula: Divide total Team Karma Pool points by number of team members, rounding
      up, to calculate the departing member’s share.
    action: Reduce the Team Karma Pool by that share when the member leaves.
    return_of_points: The departing member does not receive the removed Karma Points.
    bad_terms: On bad or indifferent departure terms, the normal one-half pool reduction
      applies.
  death_and_replacement:
    death: No Team Karma is lost when a team member dies.
    replacement: The replacement is treated as a new character and must make the standard
      initial contribution.
  npc_teams:
    gm_option: If player characters use Team Karma, the gamemaster should apply it
      to coordinated NPC teams as well.
    guideline: NPC team pool size depends on PC pool size and threat; the source supplies
      no one fixed numeric value.
  provenance:
    title: Shadowrun Companion
    publisher: FASA Corporation
    product_id: FASA7905a
    edition: Shadowrun Third Edition
    source_id: source.srcomp
    printed_pages:
    - 82
    - 83
    pdf_pages:
    - 83
    - 84
    section: Advanced Rules — Karma Pools — Team Karma; Karma and Defecting Team Members;
      NPC Team Karma
  caveat:
  - The ordinary pool-loss and good-terms waiver alternatives are distinct GM choices
    and are not cumulative.
  - The first formation contribution is a minimum, not a maximum.
