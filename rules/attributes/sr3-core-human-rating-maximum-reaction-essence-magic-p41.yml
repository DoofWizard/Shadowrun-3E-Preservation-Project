    only_magically_capable_characters_have_magic: true
    starting_if_magically_capable: 6
    current_rating_formula: Magic declines when Essence declines, with the example
      giving Magic Rating 4 for Essence 4.5; the text treats starting Magic 6 as equal
      to starting Essence and rounds downward in this example
    source_example:
