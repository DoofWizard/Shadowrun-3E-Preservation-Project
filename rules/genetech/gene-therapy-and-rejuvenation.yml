id: rule.genetech.gene-therapy-and-rejuvenation
record_type: rule
status: ingested
source: source.fanpro-10664
printed_pages: '26'
pdf_pages: '27'
edition_scope: 'FanPro, State of the Art: 2063 (FanPro10664, 2003), Shadowrun Third
