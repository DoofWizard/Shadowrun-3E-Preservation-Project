  bio_index_notation: Original first DNA Masking tier, levels 1–3, prints an em dash in the
    Bio Index column. Preserve the literal dash. Its mechanical equivalence to a number is not
    independently established; do not treat it as numeric zero without authentic errata.
  scope: Original source physical PDF29, printed p28. DNA masking and DNA scanner test and market
    rules only. No real-world identification claims.
