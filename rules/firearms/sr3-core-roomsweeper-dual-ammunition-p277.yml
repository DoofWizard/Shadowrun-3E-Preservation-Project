  source_weapon: Remington Roomsweeper
  weapon_type: Short-barreled fictional shotgun described under heavy pistols on p277
  attack_range_reference: Use the heavy-pistol range bands rather than the ordinary
    shotgun ranges.
  combat_resolution_reference: Use the source shotgun rules in Combat printed p117,
    even when heavy-pistol range bands are used.
  ammunition_configurations:
  - variant: Shotgun rounds
    default_market_damage_code: 9S(f)
    market_source: Original firearms table, printed p278/PDF287
    note: The market table reflects the printed source standard flechette notation;
      do not apply the ordinary-round override to it.
  - variant: Normal rounds instead of shotgun rounds
    alternate_damage_code: 9M
    condition: The weapon is loaded with normal rounds rather than shotgun rounds
    range_and_resolution: Retain the source heavy-pistol range and shotgun combat-rule
      references; only the explicitly supplied alternate Damage Code is changed.
