  scope_and_noninference: The original fictional source supplies this model-specific
    exception. Do not generalize a 9M normal-round Damage Code to other shotgun models
    or derive an unprinted magazine, damage stacking, or later-edition conversion.
  source_review_limitation: Printed p277/PDF286 and market p278/PDF287 original page
    images were inspected. The source review, editorial paths and structural gates
    do not certify complete SR3 normalization or executable tests.
