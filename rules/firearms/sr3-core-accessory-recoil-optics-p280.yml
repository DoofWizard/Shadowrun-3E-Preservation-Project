data:
  publication:
    title: Shadowrun, Third Edition
    publisher: FASA Corporation
    catalog_number: FASA7001
    edition: Third Edition
    source_id: source.sr3-core
    printed_page: 280
    physical_pdf_page: 289
  fictional_game_scope: The published game describes these as original SR3 firearm accessory rules; prices and table ratings are recorded separately on printed p282.
  bipod:
    mount: underbarrel
    permitted_position: Low to ground with the character sitting or lying down
    recoil_compensation_points: 2
    setup_action: Simple Action
    concealability_effect: No change when deployed
  concealable_holster:
    game_effect: Adds 2 to the Concealability Rating of a pistol
    customized_for_wearer: true
  gas_vent_recoil:
    mounting_position: barrel
    cannot_be_removed_once_installed: true
    source_variants:
      - {name: Gas-vent II, recoil_compensation_points: 2, concealability_modifier: -1}
      - {name: Gas-vent III, recoil_compensation_points: 3, concealability_modifier: -2}
  gyro_stabilization:
    concept: A fictional gyrostabilized heavy weapon arm and harness; game mechanics refer to a character using the mounted weapon
    standard_rating: 5
    deluxe_rating: 6
    recoil_and_movement_modifier_rule: Neutralizes recoil and movement modifiers up to the equipped gyro system's Rating
    built_in_smart_goggles: Standard military systems additionally feature protected-cable smart goggles
    equipped_armor_bonus:
      ballistic: 1
      impact: 1
    concealability: Not concealable
    wearing_melee_target_number_modifier: 4
    wearing_combat_pool_limit: May use only half the character's Combat Pool dice; the page does not state a rounding convention
    equip_harness_time_minutes: 5
    quick_release_action: One Complex Action
    attach_weapon_action: Two Complex Actions
    remove_weapon_action: Two Complex Actions
  imaging_scopes:
    variants_described: [low-light, infrared, optical magnification, electronic magnification]
    allowed_mount: top only
    incompatible_with_smartlink: true
    install_action: One Complex Action
    remove_action: One Complex Action
    magnification_range_target_rule: Modifies the weapon's range Target Number as defined in original printed p110
    magnification_system_concealability_modifier: -1
    low_light_and_thermographic_concealability_modifier: -2
    combined_systems: May combine modes and switch between them; market cost is the sum of component prices
  related_accepted_canon:
    mount_slot_and_integral_rules: rule.firearms.accessory-mounts
    purchase_table: equipment.firearms.sr3-core-weapon-accessory-table-p282
    tripod_and_ultrasound_use: rule.firearms.sr3-core-tripod-ultrasound-usage-p282
  archival_constraints: Exact game ratings, target-number penalties and action units are retained; does not assume a rule from modern firearm operation.
