data:
  publication:
    title: Shadowrun, Third Edition
    publisher: FASA Corporation
    catalog_number: FASA7001
    edition: Third Edition
    source_id: source.sr3-core
    printed_page: 281
    physical_pdf_page: 290
  fictional_game_scope: This records source game action costs, target-number modifiers and compatibility restrictions, not construction or use of real-world devices.
  laser_sight:
    activation: In-game sight activates when the shooter touches the trigger
    firearms_test_target_number_modifier: -1
    incompatible_with_smartlink: true
    mount: top or underbarrel
    weapon_concealability_modifier: -1
    installation_action: One Complex Action
    removal_action: One Complex Action
  shock_pads:
    compatible_in_game_weapons: Rifles, assault rifles and shotguns with rigid shoulder stocks; hip brace of a heavy automatic weapon
    recoil_compensation_points: 1
  silencer:
    mount: barrel
    compatible_fire_modes: [single-shot, semi-automatic]
    revolvers_excluded: true
    target_number_modifier_to_notice_discharge_or_locate_shooter: 4
    weapon_concealability_modifier: -2
    installation_action: One Complex Action
    removal_action: One Complex Action
  smart_goggles:
    use: Receivers for an in-game gun's smartgun feedback; book depicts aiming cross hairs and ammunition count in user's field of vision
    normal_connection: Fiber-optic link from a smartgun
    optional_helmet_integration: true
    optional_mirrored_sunglasses:
      price_rule: Double the nuyen cost of the normal goggles
    low_light_or_infrared_upgrade_nuyen: 1000
  smartgun_systems:
    versions: [internal, external]
    internal_mounting: Built into the fictional firearm
    internally_retrofitted_cost_rule: Installing after manufacture doubles the weapon's purchase price
    external_mounts: top or underbarrel
    external_transfer: May be moved to a different weapon with one hour of maintenance and alignment
    without_receiver: The hardware offers no target-number benefit without a smartlink or smart goggles
    with_smartlink_firearms_target_number_modifier: -2
  sound_suppresser:
    use_with_fire_modes: Burst-fire and full-auto weapon modes
    target_number_modifier_to_notice_discharge_or_locate_shooter: 2
    replacement_after: 300 rounds of burst or automatic fire
    weapon_concealability_modifier: -2
    installation_action: Two Complex Actions
    removal_action: Two Complex Actions
  spare_clips:
    cost_nuyen_each_unloaded: 5
    capacity: The full ammunition capacity of the particular weapon
    interchangeability: Not interchangeable between different weapons, even within a common firearm class
  related_accepted_canon:
    accessory_purchase_table: equipment.firearms.sr3-core-weapon-accessory-table-p282
    mounting_limits: rule.firearms.accessory-mounts
    recoil_accounting: rule.combat.sr3-core-recoil-accounting-numeric-p110-113
  archival_constraints: These are numeric tabletop-game statistics as originally published, not assertions about real devices, and do not prove later source supersession.
framing: reference_exact
