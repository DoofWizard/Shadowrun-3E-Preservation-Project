id: rule.firearms.cannon-companion-customization-labor-economy-p79-80
record_type: rule
status: reviewed
source: source.cc
printed_pages: '79-80'
pdf_pages: '80-81'
edition_scope: SR3
content_class: [rule_exact]
framing: reference_exact
headline: 'FASA7908 Cannon Companion: fictional tabletop customization labor and character time'
summary: 'FASA Corporation Shadowrun Third Edition tabletop RPG, printed pp79-80/PDF80-81. Character downtime, NPC contact-dependent labor charges, and fictional purchase-accounting qualifications absent or incompletely expressed in the existing procedure.'
data:
  existing_procedure: procedure.firearms.customize
  npc_labor:
    normal_hours_per_day: 8
    normal_days_per_week: 5
    overtime: excess work in either the day or week
    level_1_contact_or_friend_of_friend:
      standard_nuyen_per_hour: 100
      overtime_nuyen_per_hour_minimum: 150
    level_2_contact:
      standard_nuyen_per_hour: 50
      overtime_waiver_condition: job does not consume too much of the contact's free time
    level_3_contact:
      standard_nuyen_per_hour: 25
      overtime_charge: 0
      free_work_possible: exceptional prior treatment of the contact
    contact_reference: SR3 p254 or SRComp pp59-63
  player_character_downtime:
    ordinary_daily_hours_without_social_conflict: 6
    exceeding_ordinary_hours: interferes with social obligations and contact availability
    bodily_sustenance_conflict_above_hours_per_day: 12
    consequence: narrative deprivation and neglected personal needs; no fixed dice penalty specified here
  fictional_accounting:
    listed_accessory_owned_item: use listed Availability, Street Index, weight change and price
    design_or_npc_special_order: use Design Point Value as directed on printed p80
    unlisted_option_street_index: not applicable
    unlisted_option_price_multiplier: 8
    parts_search_resolution: standard SR3 equipment acquisition including Availability, printed p272
    reused_parts_search_rule: procedure.firearms.customize
  source_boundary: Abstract RPG time and fictional nuyen costs, not real-world modification guidance.
