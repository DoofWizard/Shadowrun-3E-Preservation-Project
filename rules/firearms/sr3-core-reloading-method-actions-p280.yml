content_class: [rule_procedure]
framing: reference_exact
headline: 'Fictional Shadowrun Third Edition tabletop RPG: FASA Corporation FASA7001 printed p280/PDF289, original firearm reloading method and action table'
summary: 'Archival account of the six original reloading-method codes and exact tabletop action costs and round counts in the Ammo Reloading Table; not instructions for handling real firearms.'
data:
  publication: 'Shadowrun, Third Edition'
  publisher: FASA Corporation
  catalog_number: FASA7001
  edition: Shadowrun Third Edition
  printed_page: 280
  physical_pdf_page: 289
  table: AMMO RELOADING TABLE
  action_terms: [Simple Action, Complex Action]
  source_method_codes:
    c: removable clip holding rounds
    b: break action, with the firing mechanism opened near the breech to insert rounds manually
    m: internal magazine, accessed through a small insertion port
    cy: pop-out cylinder, either manually loaded or loaded with a speed loader
    belt: long belt of linked ammunition, fed into the weapon
  rows:
    - {method: Removable Clip, code: c, action: Simple Action, result: 'Remove or insert clip.'}
    - {method: Removable Clip, code: c, action: Complex Action, result: 'Insert (Quickness) rounds into clip.'}
    - {method: Break Action, code: b, action: Complex Action, result: 'Insert 2 rounds.'}
    - {method: Internal Magazine, code: m, action: Complex Action, result: 'Insert (Quickness) rounds.'}
    - {method: Cylinder, code: cy, action: Complex Action, result: 'Use speed loader.'}
    - {method: Cylinder, code: cy, action: Complex Action, result: 'Insert (Quickness) rounds.'}
    - {method: Belt Feed, code: belt, action: Complex Action, result: 'Insert belt.'}
    - {method: Belt Feed, code: belt, action: Complex Action, result: 'Insert (Quickness ÷ 2) rounds into belt.'}
  resolution_notes:
    - 'The method notation appears in parentheses below the ammunition number in the original firearm table; it determines which rows apply.'
    - 'A listed result is the amount of fictional ammunition reloaded in the stated action, not an instruction to a real-world operator.'
    - 'The source provides no explicit rounding direction for Quickness divided by two in the belt-feed row; no rounding policy is inferred.'
  canonical_relationship:
    source_contribution: original_exact_procedure
    interacts_with: [rule.firearms.ammunition, rule.firearms.firing-modes]
    later_supersession: not_reviewed
