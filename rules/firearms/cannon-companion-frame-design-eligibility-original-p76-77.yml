id: rule.firearms.cannon-companion-frame-design-eligibility-original-p76-77
record_type: rule
status: reviewed
source: source.cc
printed_pages: "76-77"
pdf_pages: "77-78"
edition_scope: SR3
content_class:
  - rule_exact
framing: reference_exact
headline: "Cannon Companion FASA7908 available design options by frame"
summary: "The original FASA Corporation Shadowrun Third Edition Cannon Companion printed pp.76-77, physical PDF pp.77-78, limits which firearm-design options are eligible for each of fourteen base frames; maximum levels and allowed firing/loading variants are frame-specific."
data:
  original_table: Available Design Options by Frame
  canonical_generic_options: rule.firearms.design-options
  canonical_base_frames: rule.firearms.design-frames
  frames:
    Hold-Out Pistol:
      allowed: [ammo_loading, ceramic_components, firing_mode, flechette_only, improved_ammo_capacity, improved_concealability, increased_power, melee_hardening, metahuman_design]
      ammo_loading_only: [break_action]
      firing_modes_only: [SA]
      max_levels: {increased_power: 1}
    Light Pistol:
      allowed: [ammo_loading, ceramic_components, firing_mode, flechette_only, improved_concealability, improved_ammo_capacity, improved_fcu, increased_power, melee_hardening, metahuman_design, weight_decrease]
      ammo_loading_excludes: [belt]
      firing_modes_only: [SS, BF, SA/BF]
      max_levels: {improved_fcu: 2, increased_power: 1, weight_decrease: 2}
    Machine Pistol:
      allowed: [ceramic_components, firing_mode, flechette_only, heavy_barrel, improved_concealability, improved_fcu, increased_power, melee_hardening, metahuman_design, recoil_compensation, selectable_clip, weight_decrease]
      firing_modes_only: [FA, BF/FA]
      max_levels: {improved_fcu: 6, increased_power: 1, recoil_compensation: 1, weight_decrease: 2}
    Heavy Pistol:
      allowed: [ammo_loading, ceramic_components, firing_mode, flechette_only, heavy_barrel, improved_ammo_capacity, improved_concealability, improved_fcu, increased_power, melee_hardening, metahuman_design, recoil_compensation, weight_decrease]
      ammo_loading_only: [break_action, internal_magazine, cylinder]
      firing_modes_only: [SS, BF, SA/BF]
      max_levels: {improved_fcu: 4, increased_power: 1, recoil_compensation: 1, weight_decrease: 6}
    Submachine Gun:
      allowed: [ceramic_components, firing_mode, heavy_barrel, high_velocity_capability, improved_concealability, improved_fcu, increased_power, melee_hardening, metahuman_design, recoil_compensation, selectable_clip, weight_decrease]
      firing_modes_only: [BF, FA, BF/FA, SA/BF/FA]
      max_levels: {ceramic_components: 1, improved_fcu: 4, increased_power: 1, recoil_compensation: 2, weight_decrease: 8}
    Shotgun:
      allowed: [ammo_loading, barrel_extension_reduction, bullpup_configuration, ceramic_components, firing_mode, heavy_barrel, improved_ammo_capacity, improved_concealability, improved_fcu, increased_power, melee_hardening, metahuman_design, recoil_compensation, selectable_clip, weight_decrease]
      ammo_loading_only: [break_action, clip]
      firing_modes_only: [SS, BF, SA/BF]
      max_levels: {ceramic_components: 1, improved_concealability: 1, improved_fcu: 4, increased_power: 2, recoil_compensation: 1, weight_decrease: 6}
    Taser:
      allowed: [ceramic_components, improved_concealability, increased_power, melee_hardening, metahuman_design, weight_decrease]
      max_levels: {increased_power: 2, weight_decrease: 2}
    Sport Rifle:
      allowed: [ammo_loading, barrel_extension_reduction, bullpup_configuration, ceramic_components, easy_breakdown, firing_mode, heavy_barrel, improved_ammo_capacity, improved_concealability, improved_fcu, increased_power, melee_hardening, metahuman_design, recoil_compensation, selectable_clip, weight_decrease]
      ammo_loading_only: [clip]
      firing_modes_only: [SS, SA/BF]
      max_levels: {ceramic_components: 1, improved_concealability: 1, improved_fcu: 4, increased_power: 2, recoil_compensation: 1, weight_decrease: 6}
    Assault Rifle:
      allowed: [barrel_extension_reduction, bullpup_configuration, ceramic_components, easy_breakdown, heavy_barrel, high_velocity_capability, improved_concealability, improved_fcu, increased_power, melee_hardening, metahuman_design, recoil_compensation, selectable_clip, weight_decrease]
      max_levels: {ceramic_components: 1, improved_concealability: 2, improved_fcu: 1, increased_power: 1, recoil_compensation: 2, weight_decrease: 8}
    Sniper Rifle:
      allowed: [ammo_loading, barrel_extension_reduction, ceramic_components, easy_breakdown, firing_mode, heavy_barrel, improved_ammo_capacity, improved_fcu, increased_power, metahuman_design, recoil_compensation, selectable_clip, weight_decrease]
      ammo_loading_only: [clip]
      firing_modes_only: [SS]
      max_levels: {ceramic_components: 3, improved_fcu: 4, increased_power: 2, recoil_compensation: 1, weight_decrease: 6}
    Light Machine Gun:
      allowed: [ammo_loading, firing_mode, heavy_barrel, high_velocity_capability, increased_power, metahuman_design, recoil_compensation, selectable_clip, weight_decrease]
      ammo_loading_only: [belt]
      firing_modes_only: [SA, BF, FA, SA/BF, SA/BF/FA]
      max_levels: {increased_power: 1, recoil_compensation: 2, weight_decrease: 12}
    Medium Machine Gun:
      allowed: [ammo_loading, heavy_barrel, high_velocity_capability, increased_power, metahuman_design, recoil_compensation, selectable_clip, weight_decrease]
      ammo_loading_only: [belt]
      max_levels: {increased_power: 1, recoil_compensation: 2, weight_decrease: 16}
    Heavy Machine Gun:
      allowed: [ammo_loading, heavy_barrel, high_velocity_capability, increased_power, metahuman_design, recoil_compensation, selectable_clip, weight_decrease]
      ammo_loading_only: [belt]
      max_levels: {increased_power: 1, recoil_compensation: 2, weight_decrease: 16}
    Assault Cannon:
      allowed: [ammo_loading, heavy_barrel, increased_power, metahuman_design, recoil_compensation, weight_decrease]
      ammo_loading_only: [belt]
      max_levels: {increased_power: 2, recoil_compensation: 1, weight_decrease: 12}
  semantics:
    - Only options explicitly listed for a frame are eligible on that frame.
    - Frame-specific maximum levels and mode/loading restrictions qualify generic option rules.
