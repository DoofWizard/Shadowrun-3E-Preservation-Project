headline: 'FASA7908 Cannon Companion: fictional firearm inventory variant price and counter rule'
summary: 'FASA Corporation Shadowrun Third Edition tabletop RPG, printed p15/PDF16. The opening catalogue rules identify equal purchase cost for variants of the same fictional item and qualify the normal equipment display by in-world manufacture year.'
data:
  publication: {title: Cannon Companion, publisher: FASA Corporation, catalog_number: FASA7908, edition: Shadowrun Third Edition, source_id: source.cc}
  source_pdf_sha256: 7b979ed358aaa23bbe68eb95a0887b1315f302bedd6bcc04df00d8d68fbd84a4
  catalogue_variant_price:
    variants: [standard, caseless]
    same_firearm_model_purchase_cost: equal
  fictional_ammunition_counter:
    modern_firearm_default: present
    display: remaining ammunition quantity
    manufacture_before_game_year: 2050
    older_item_exception: may lack counter
  delegated_game_rules:
    standard_resolution: 'SR3 pp114, 276'
    catalogue_description_exceptions: apply when stated
    variant_compatibility: rule.firearms.cannon-companion-av-capsule-game-bindings-p36-38
    core_counter_and_ammunition_price: rule.firearms.sr3-core-loading-system-and-recoil-notation-p276
  boundary: 'Purchase-price parity applies to the two fictional catalogue versions of a firearm, not every ammunition type or weapon class. The pre-2050 statement is a possible absence, not a mandatory missing feature. No action cost or dice modifier is specified.'
