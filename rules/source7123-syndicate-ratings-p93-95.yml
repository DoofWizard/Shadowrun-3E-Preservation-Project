shadowrun_effect_table:
  - {effect: "Negligible: the syndicate hardly notices", potential_loss_gain: 0}
  - {effect: "Minor: the syndicate can compensate easily", potential_loss_gain: 1}
  - {effect: "Appreciable: the syndicate can compensate, but with difficulty", potential_loss_gain: 2}
  - {effect: "Major: the syndicate must take extreme measures to recover", potential_loss_gain: 3}
  guidance:
    - "Most shadowruns produce a 0 or 1 point effect."
    - "The gamemaster determines a Potential Loss/Gain rating for each shadowrun and tracks those values."
    - "Ratings may be adjusted as often or infrequently as desired; quarterly adjustment is recommended."

rating_adjustment_test:
  resource_pool: "For each syndicate, Resource Pool equals its total Operations Rating. Seattle Mafia example: 37."
  steps:
    - "1. Assess Effects: total recorded Losses and Gains since the last adjustment; some may cancel. Adjust affected Market Ratings accordingly before testing. A loss to one syndicate may be a gain to another."
    - "If a shadowrun causes one syndicate to take over a market from another, the new controlling syndicate receives only 1 point of Gain regardless of the effect's significance."
    - "2. Determine Test Order: test Markets directly affected by shadowruns first, positive and negative; test every Operation second; the gamemaster may then adjust/test other Markets of choice."
    - "3. Make the Tests: roll dice equal to the adjusted base rating against a Target Number equal to the initial Market or Operations Rating before Loss/Gain adjustments."
    - "Resource Pool dice may augment a test. The maximum Resource Pool dice allocated to one Market or Operation equals the adjusted base Market/Operations Rating."
    - "Once Resource Pool dice are used, they are gone and do not refresh; unused Resource Pool dice cannot be saved for the next quarter."
  example:
    - "Seattle Mafia Smuggling Rating 7 suffers Loss 2: adjusted base 5; roll 5 dice against Target Number 7."
    - "Allocating 3 Resource Pool dice yields 8 dice against TN 7; the Mafia Resource Pool falls from 37 to 34."
  rating_adjustment_table:
    - {successes: "0", result: "Reduce the Base Rating by 1D6/2 (round up)"}
    - {successes: "1-3", result: "Base Rating remains the same"}
    - {successes: "4-6", result: "Increase Base Rating by 1"}
    - {successes: "7+", result: "Increase Base Rating by 2"}
  example_result:
    - "Four successes increase the adjusted Seattle Mafia Smuggling base from 5 to 6."

gang_rating_rules:
  - "Most gangs have Net Ratings of 25 or less; major gangs such as the Ancients or Cutters can have Net Ratings as high as 60."
  - "Gangs usually operate in only a few Markets and usually have Operations Ratings of 3 or less."
  gang_reputation_table:
    - {leader_gang_reputation: "20-19", crimetrack_reputation: 0, standing: "Tier 3"}
    - {leader_gang_reputation: "18-17", crimetrack_reputation: 1, standing: "Tier 3"}
    - {leader_gang_reputation: "16-15", crimetrack_reputation: 2, standing: "Tier 2"}
    - {leader_gang_reputation: "14-13", crimetrack_reputation: 3, standing: "Tier 2"}
    - {leader_gang_reputation: "12-11", crimetrack_reputation: 4, standing: "Tier 1"}
    - {leader_gang_reputation: "10-9", crimetrack_reputation: 5, standing: "Tier 1"}
    - {leader_gang_reputation: "8-7", crimetrack_reputation: 6, standing: "Tier 1"}
    - {leader_gang_reputation: "6-5", crimetrack_reputation: 7, standing: "Minor Syndicate"}
    - {leader_gang_reputation: "4-3", crimetrack_reputation: 8, standing: "Minor Syndicate"}
    - {leader_gang_reputation: "2 or less", crimetrack_reputation: 9, standing: "Minor Syndicate"}

