effective: {status: source_specific, source: source.fanpro-10653, pages: "116-117", pdf_pages: "117-118", basis: defines}

environmental_stress: &stress
  exposed_gear: "Weapons, exposed cyberware and vehicles are vulnerable to sand; the daily Stress rule specifies external cyberware and vehicles only."
  daily_stress_points: 1
  maintained_or_adapted: "Daily implant cleaning and maintenance, or matching vehicle hostile-environment/desert adaptation, reduces the daily rate to 1 Stress Point per week."

moving_parts: &moving
  daily_check: "Each day a firearm or other item with moving parts is used, roll 1D6."
  jam: "On a 1, the item jams and needs an appropriate Build/Repair (4) test with a base time of 1 hour before use."
  poor_cleaning: "If not cleaned regularly, the gamemaster may increase the jam range by 1 per day; on day two the item jams on 1-2 if this option is used."
  timing: "The source recommends that the gamemaster time the resulting jam for dramatic tension."

sandstorm_interaction: &sandstorm
  rule: "During a sandstorm, double the Stress Points inflicted and the jam likelihood."

