  "data": {
    "context": "Source-reviewed fictional tabletop-RPG setting/rules, not real-world instructions or allegations. Every rule cited is an historical Second Edition game mechanic.",
    "nonplayer_only": "The book expressly forbids player characters from learning blood magic, becoming a blood mage, or conjuring blood spirits. Blood magic and its rules are GM-controlled non-player-character material only.",
    "scope": "Path of the Blood is a rare category of metamagic practiced by high-grade initiates from hermetic or shamanic traditions in the fictional Aztlan setting; unlike anchoring or centering it is not generally known even among initiatory groups.",
    "blood_magic_drain_procedure": [
      "Spells must be specifically learned for blood-magic use. Blood magic is integrated into casting a spell; the casting uses one Complex Action even with the additional attack test.",
      "A caster may draw on the life force of a willing or unwilling donor within arm's reach to reduce Drain by inflicting a Physical wound during spellcasting.",
      "For the game's ritual-resolving Attack Test, use Target Number 2 against a motionless, restrained or otherwise incapable-of-resistance donor. The source specifies a strength-based knife or other edged weapon.",
      "The donor makes a normal Body Damage Resistance Test modified only by dermal armor; no Combat Pool dice can be used.",
      "The caster may pull the blow by selecting lower Power than the theoretical maximum. Example: Strength 4 yields a 4L knife attack but can be reduced to 3L, 2L or 1L.",
      "Each box of Physical Damage marked off on the donor's Condition Monitor during the spellcasting action provides one free success on the caster's Drain Resistance Test after casting.",
      "If lethal damage exceeds the donor's Damage Overflow (SRII p111), add bonus free successes equal to one-half the donor's Essence, rounded down. Distinguish the Physical boxes and the overflow/Essence bonus."
    ],
    "donors": "Source limitation: donor must be self-aware and intelligent. Typical donors are (meta)humans; gamemaster may allow other intelligent beings, such as Sasquatches or dragons. Only physically manifested astral beings under magician control meet the physical-wound requirement.",
    "self_inflicted_damage": "NPC magicians may use their own blood and life force by taking Physical damage while casting; the source explicitly contrasts Physical wounds and Stun damage.",
    "worked_example": {
      "fictional_casting": "NPC shaman Tlamatinime casts Force 8 Flamethrower, using the blood-magic donor procedure; the example then repeats with Force 10.",
      "initial_attack": "Strength 4; 4 successes on Armed Combat Skill test; 4L damage. Donor Body 3, no dermal armor, 3 dice versus Target Number 4, no successes; wound staged to Serious, marking 6 Physical boxes. Six free successes reduce Force 8 Flamethrower Drain of [(F/2)+1]S, namely 5S, so no Drain is taken.",
      "second_attack": "The second casting uses Force 10; the attack kills the donor, filling the remaining 4 Physical boxes plus 3 Physical Damage Overflow boxes: 7 free successes for the damage, and 3 additional free successes from the donor's Essence, for 10 total. No Drain is taken in the example."
    },
    "gm_context": "The book warns that NPC blood magic represents profoundly coercive and dangerous conduct in the fictional setting and should be handled sparingly, with moral gravity; this is not a player option.",
