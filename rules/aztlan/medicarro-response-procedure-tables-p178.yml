  "data": {
    "context": "Fictional Second Edition tabletop role-playing-game mechanics in the 1995 FASA Aztlan sourcebook. These are game statistics and GM resolution rules, not real-world instructions.",
    "source_reference": "MediCarro is the fictional Aztlan analogue of DocWagon; the original book references the DocWagon rules in The Neo-Anarchist's Guide to Real Life and specifies the following modifications.",
    "procedure": [
      "When called, determine available responding vehicle by rolling 1D6 on the Response Vehicle Table.",
      "Roll 3D6 for response time and apply ALL cumulative modifiers from the response-time table.",
      "Apply a minimum response time of 4 minutes."
    ],
    "response_vehicle_table": {
      "standard_call": {
        "1-4": "Ground",
        "4-6": "Air"
      },
      "high_threat_response_call": {
        "6": "Osprey II",
        "1-3": "Ground",
        "4-5": "Stallion"
      },
      "source_overlap_note": "Original table prints '1-4 Ground' and '4-6 Air' for a Standard Call, overlapping on die result 4; do not silently normalize."
    },
    "area_modifier": {
      "Tenochtitlán corporate area": "-2",
      "Tenochtitlán core": "-1",
      "Tenochtitlán outskirts": "+1",
      "Other major city core": "0",
      "Other major city outskirts": "+2",
      "Minor city core": "+1",
      "Minor city outskirts": "+3",
      "Small town/village": "+10",
      "Up to 10 km beyond city/town limits": "+10",
      "More than 10 km beyond city limits": "NA",
      "Aztechnology-owned territory": "-3"
    },
    "enforcement_rating_modifier": {
      "AAA–AA": "-2",
      "A–B": "-1",
      "C": "0",
      "D": "+2",
      "E": "+4",
      "Z": "+8"
    },
    "response_type_modifier": {
      "Standard Response Team": "0",
