  extends: [catalog.gear.target-wastelands-underwater-systems]
  availability: All listed underwater systems except olfactory camouflage are unavailable through ordinary street markets; access is at gamemaster discretion.
  screaming_mimi:
    secondary_test_trigger: Only crew members who take damage from the fictional sonic effect make the Body or Willpower (6) Test.
    creature_response: At gamemaster discretion the sound may repel underwater creatures or provoke frenzied behavior.
  snake_spine_whips:
    controller: CCSS rigged security system.
    damage_to_segments: Loss of a segment can disable the remainder of its chain; a damaged link may be removed in the fictional system.
    table_concealability: All four arm variants have a dash in the Concealability column.
    grapple: One arm may hold a grappled target while a second arm attacks; only one arm attacks at a time.
