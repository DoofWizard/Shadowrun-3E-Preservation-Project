id: entity.organization.deus-network
record_type: entity
name: "The Network"
domain: matrix
status: ingested
profile:
  - "Distributed organization/being of slightly more than one thousand metahuman nodes carrying portions of Deus/Megaera code after the Renraku Arcology transfer."
  - "At least 10 percent of nodes are online at any given time, forming a reduced-power distributed version of Deus, Megaera, or a mixed personality."
  - "Network behavior changes with which aligned nodes are online."
  - "Factions form around competing plans for whether and how to rebuild an artificial intelligence in the global Matrix."
  - "Some nodes seek positions of influence in corporations and organizations useful to an eventual rebuilt AI."
factions:
  rebuild_deus:
    leaders:
      - Scarecrow
      - Puck
      - Nubian
    goal: "Rebuild Deus essentially as known."
  preserve_network:
    leader: "Michael Bishop / Ronin"
    alignment: "Megaera-aligned"
    goal: "Keep the distributed Network rather than rebuild a unitary AI."
node_rules:
  population: "Slightly over 1,000."
  original_state: "Nodes began as Deus-created otaku able to store code and participate in distributed processing."
  fading: "Older nodes are losing Channels through Fading after leaving the SCIRE host; eventually most may need cyberdecks."
  lead_nodes:
    identities:
      - Scarecrow
      - Puck
      - Nubian
    submersion: "At least 6 grades each."
    full_otaku_abilities: true
  distributed_ai_benchmark:
    description: "As a networked unit, approximately as powerful as a weak AI."
    values:
      MPCP: 15
      Computer_skill: 15
      pool_benchmark: "around 15"
    behavior_under_attack: "Can split and disperse rather than remain a single attackable unit."
cybertechnology:
  implant: "Neural headware used to form the distributed network between nodes."
  ordinary_exam: "Not noticeable by normal physical examination unless brain surgery."
  MRI: "Detectable by MRI."
  diagnostic_scan: "New SENSE technology from Neuranalysis can identify it, but purpose requires Cybertechnology (12) Test."
sources:
  - {source: source.fanpro-10652, printed_pages: "100-101", pdf_pages: "100-101", relation: defines}
