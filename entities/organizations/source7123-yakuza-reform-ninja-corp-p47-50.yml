name: "Yakuza reform, specialist clans, and corporate relationships"

membership_and_reform:
  traditional_policy:
    - "The source describes traditional gumi as strongly exclusionary toward non-Japanese members and metahumans, with similarly restrictive attitudes toward women."
  north_american_change:
    - "Some North American gumi are described as hiring metahumans and outsiders for work without admitting them as full members."
    - "A small number of women are described as holding meaningful rank in less-traditional gumi."
  new_way:
    name: "New Way"
    leading_figure: "Okido Honjowara"
    organizations:
      - Nagato Combine
      - Honjowara-gumi
    location: "New Jersey"
    notes:
      - "The New Way argues for retaining honor and community-service traditions while accepting metahumans, women, magic, and other Sixth World changes."
      - "Honjowara's Green Serpent Guard is described as an elven bodyguard unit composed of powerful physical adepts."

ninja_reference:
  historical_structure:
    genin: "agent-level members who performed field work"
    chunin: "middle managers and coordinators"
    jonin: "clan head"
    kunoichi: "female ninja"
  sixth_world_context:
    - "The source distinguishes historical ninja traditions, modern imitators, magical revival movements, and surviving specialist clans rather than treating every shadow operative as a literal ninja."
  oni_do:
    name: "Oni-Do"
    translation: "Goblin Way"
    membership:
      - oni
      - koborokuru
      - trolls
      - elves
    notes:
      - "The Oni-Do is presented as a specialist clan that adapted old ninja traditions to metahuman members and Sixth World magic."
      - "The source describes Oni-Do members as trained in ninjutsu and magical abilities and as working as agents for corporate patrons."

corporate_relationships:
  general:
    - "The source presents close relationships between many gumi and Japanese corporations, particularly in San Francisco."
    - "Local arrangements vary by corporation and gumi; the source does not describe a single universal corporate-Yakuza alliance."
    - "Corporate ties can provide gumi with advanced equipment and access while gumi provide off-book personnel and local influence."
  examples:
    mitsuhama: "described as maintaining close ties with several major gumi"
    fuchi_north_america: "described as more distant from Yakuza involvement"
    renraku_and_yamatetsu: "described as occupying an intermediate position"
  attributed_technical_claim:
    - "Shadowland commentary claims some Yakuza-sourced computer hardware and cyberdecks carry hidden safeguards or encoded controls; the source presents this as commentary rather than a universal equipment rule."

