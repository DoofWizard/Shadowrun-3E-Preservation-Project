id: entity.organization.draco-foundation
record_type: entity
name: "Draco Foundation"
domain: organizations
status: ingested
founded: 2057
founder_context: "Created under Dunkelzahn's will after his assassination."
mandate:
  public:
    - "Administer Dunkelzahn's Last Will and Testament and distribute its bequests."
    - "Carry out Dunkelzahn's remaining last wishes."
  private_or_unpublished:
    status: "strongly indicated by source but contents undisclosed"
    detail: "The Foundation is described as carrying additional instructions left to Nadja Daviar and the trustees."
governance:
  - "Run by a Board of Trustees appointed by Nadja Daviar; charter permits appointment of additional trustees."
  - "Board votes on resource allocation, hiring/firing and other administrative business."
  - "Normally meets for about one week each month, beginning around the third day; meetings may run longer."
headquarters:
  main: "Washington, FDC / DeeCee"
  branches:
    - Atlanta
    - Seattle
    - Denver
    - Hannover
    - Hong Kong
    - London
    - "numerous additional smaller offices"
resources:
  - "Retains whatever portions of Dunkelzahn's estate were not otherwise bequeathed."
  - "Holdings are described as potentially comparable to an A- or AA-level megacorporation in aggregate resources, though exact value is undisclosed."
  - "Possible assets include investments, real estate, art, magical items and information inherited from Dunkelzahn."
operations:
  shadow:
    - "Has hired shadowrunners since its founding and retains some as regular assets."
    - "Assets, Inc. is identified as the best-known retained shadow team, led by Ryan Mercury; Jane-in-the-Box is its decker."
  drakes:
    - "Offers asylum and assistance to newly awakened drakes."
    - "At least some drakes have accepted Foundation protection."
    - "This policy potentially conflicts with great dragons seeking control of drakes."
