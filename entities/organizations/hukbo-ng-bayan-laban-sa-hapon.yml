nature:
  - "The source describes the Huk as a decentralized resistance network and rallying identity rather than a single conventional hierarchy."
  - "Masaru is presented as the only figure with a broad view of the network's members and accomplishments."
  - "Cells, political organizations, labor groups, community supporters and armed pirate teams can all identify with the Huk while remaining operationally independent."

