network_characteristics:
  - "The source portrays faction leaders as joining for different reasons, including labor politics, elections, metahuman rights, environmental protection and armed resistance."
  - "Membership and support are deliberately compartmentalized; many supporters provide information, shelter or material aid without joining armed cells."
  - "A source character estimates that more than half of the Philippine population is affiliated with the Huk in some manner; this is retained as an attributed estimate, not a verified census figure."
  - "Operational teams are described as commonly ranging from six to thirty pirates."

