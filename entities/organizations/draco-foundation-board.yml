id: catalog.organization.draco-foundation-board
record_type: entity_catalog
name: "Draco Foundation Board of Trustees"
domain: organizations
status: ingested
source: source.fanpro-10666
pages: "26-30"
entries:
  - id: world.character.nadja-daviar
    name: "Nadja Daviar"
    role: "Chairperson"
    profile:
      - "Executor of Dunkelzahn's estate and chair of the Draco Foundation."
      - "Also UCAS Vice President during the source period."
      - "Day-to-day Foundation involvement is limited by political duties, but she attends most board meetings."
  - id: world.character.aina-dupree
    name: "Aina Dupree"
    role: "Vice Chairperson"
    profile:
      - "Handles Foundation business in Daviar's absence and is described as effectively running many day-to-day matters."
      - "Recipient of a Dunkelzahn bequest that explicitly asked her to join the Foundation."
      - "Known biographical facts are sparse; many extraordinary identity claims in shadowtalk are unverified."
  - id: world.character.frank-hardy
    name: "Frank Hardy"
    full_name: "Francis Eamon deValera Hardy"
    role: "Trustee"
    profile:
      - "Prince Edward Island fomor, botanist/agronomist and owner of Silver Branch."
      - "Develops hybrid plants for harsh environments."
      - "Source commentary identifies him as a powerful shaman/nature-spirit practitioner; political-terrorist links remain rumor."
  - id: world.character.manuel-torres
    name: "Manuel Torres"
    role: "Trustee"
    profile:
      - "Caracas muralist and teacher."
      - "Produces devotional objects and is reported to sometimes create magical talismans."
      - "Has past connections to Hualpa's circle through a commission for Maria Locasin."
  - id: world.character.milo-czerda
    name: "Milo Czerda"
    role: "Trustee"
    profile:
      - "Centaur from the Mt. Igman/Bosnia region, poet and writer."
      - "Communicates through writing/translation; source notes published work and botanical knowledge."
  - id: world.character.midori-kanematsu
    name: "Midori Kanematsu"
    role: "Trustee"
    profile:
      - "Extremely wealthy Japanese investor with large holdings distributed among smaller/start-up corporations rather than major megacorps."
      - "Significant aerospace, techno-magical and biomedical interests."
      - "Claims that she is a spirit, shapeshifter, magician/adept or other nonhuman being are explicitly rumors."
  - id: world.character.grace-friel
    name: "Grace Friel"
    aliases: ["Gracie"]
    role: "Trustee"
    profile:
      - "Elite Edinburgh-based decker who emigrated from Tir na nOg in 2035."
      - "Known for exceptional ability to locate people online and to avoid being found."
      - "Claims that she is a faerie being, free spirit, otaku or their creator/ambassador remain unverified rumors."
notes:
  - "Board biographies deliberately separate reported public facts from Shadowland speculation."
