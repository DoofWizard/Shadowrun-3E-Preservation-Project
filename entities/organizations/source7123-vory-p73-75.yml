name: "Vory v Zakone"

context:
  - "The chapter first notes that many smaller ethnic, national and metahuman organizations continue to exist alongside the major North American syndicates."
  - "Vory v Zakone is translated as 'thieves who follow the code' and presented as a Russian/Eastern European network with historical roots in the post-1917 prison and underworld culture."

source_period_profile:
  - "The source describes the Vory as having survived Soviet collapse, internal Russian/Georgian division and the EuroWars, then rebuilding networks in Russia and among emigrant communities."
  - "North American Vory activity is described as increasingly visible, particularly along the Pacific Coast."

code:
  - "The traditional code emphasizes loyalty, promises, debts, mutual assistance and internal discipline."
  - "Older anti-establishment rules concerning prison, work, property and ordinary social life are described as having been relaxed or abandoned as conditions changed."
  - "The source says traditional visible marks also gave way to a more conservative, businesslike appearance."

structure_and_support:
  obshchak:
    role: "common monetary fund"
    functions:
      - "The fund's size reflects the authority of the group controlling it."
      - "Funds support members and families, internal obligations and new enterprises."
  personnel:
    - "The source describes several ranks, ending with the shestiorka as a low-ranking courier/errand role."
    - "Outside gangs and street personnel may be retained for temporary support."
  markets:
    - "The source emphasizes black-market trade, distribution networks and information brokerage as major Vory strengths in North America."
    - "Information collection and analysis are described as especially important to the organization's expansion."

