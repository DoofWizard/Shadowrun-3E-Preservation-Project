name: "Ghost Cartels"

history:
  - "The source traces the ghost cartels to surviving Central and South American narcotrafficante organizations that were not absorbed into ORO/Aztechnology."
  - "It states that the Medellin, David and Masaya cartels helped capitalize ORO and effectively disappeared as separate entities as ORO became Aztechnology and Aztlan."
  - "Smaller competitors lost substantial market share first to Aztechnology and then to simsense/BTL technology."
  - "After Amazonia's formation in 2034, surviving organizations invested in legitimate businesses and used that economic base to maintain a precarious position near Amazonia; this is the origin given for the 'ghost cartel' label."

source_period_profile:
  - "Colombia, especially Bogota, is presented as a buffer zone where ghost-cartel influence overlaps with Aztlan, Amazonia and other outside interests."
  - "The source describes the cartels as exploring Awakened Amazonian plant life for potentially marketable psychoactive compounds."
  - "The chapter presents their political position as fragile and their expansion plans as capable of aggravating Aztlan-Amazonia tensions."

