name: "Triads"

source_period_profile:
  - "The source presents the Triads as old Chinese secret-society networks that developed into major transnational organizations and retained an unusually strong magical tradition after the Awakening."
  - "Hong Kong and southern China remain core centers, while North American activity is described as growing in Seattle, California, Denver and other urban markets."
  - "Claims about the full extent of Triad magical power are presented as a mixture of documented influence, reputation and attributed speculation."

