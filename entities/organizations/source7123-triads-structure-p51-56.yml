role_notes:
  - "The Incense Master is the spiritual officer overseeing rituals, oaths and new membership; the source says the office is often held by a magician following the Triad magical tradition."
  - "The Red Pole controls the organization's soldiers and territorial enforcement."
  - "The White Paper Fan handles financial and Matrix functions."
  - "The Grass Sandal handles external liaison and pay-off work."
  - "Below the designated offices, individual Triads maintain their own business, recruitment, communications, training, benefits and support structures."

communications:
  - "The source describes coded numbers, secret hand signs, code words and arrangements of tea service as traditional internal communication methods."
  - "The organizations are portrayed as highly resistant to infiltration and intensely protective of internal secrets."

