name: "Seoulpa Rings"

source_period_profile:
  - "The source presents the Seoulpa Rings as a comparatively young North American organization that grew out of Korean factions within the Yakuza rather than as a direct continuation of ancient Korean societies."
  - "Tensions between Akira Watada's organization and Korean Yakuza leadership in Seattle culminated in the 2043 Schism, after which surviving Korean leaders organized independent Rings."
  - "Park Jai Kyu is identified as the principal organizer of the first modern Seoulpa Rings; stories about his ancestry and magical foresight are treated as attributed claims."

structure:
  - "Each Ring is an independent organization built around a leader and a network of recruits rather than a subordinate branch of a central commission."
  - "Park's decentralization model emphasized small independent groups, diverse recruitment and limited knowledge between Rings so that losses in one group would not expose the rest."
  - "Rings may cooperate temporarily for larger undertakings and then separate again."
  - "Lieutenants sometimes establish new Rings with the original leader's approval."
  - "The source describes little routine inter-Ring warfare despite the lack of a central governing body."

business_profile:
  - "Typical Rings concentrate on lower-capital street markets such as gambling, burglary, adult-entertainment services, controlled-substance distribution and chip distribution."
  - "Multiple Rings may pool resources for a larger temporary project, especially where Yakuza interests are involved."
  - "The organizations are portrayed as operationally flexible and less constrained by inherited business traditions than older syndicates."
  - "Some Rings incorporate cyberware, magic, ritual sorcery and spirits into their activities."

