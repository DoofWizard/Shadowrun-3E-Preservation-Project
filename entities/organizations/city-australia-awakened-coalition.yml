id: entity.organization.city-australia-awakened-coalition
record_type: entity
name: "City"
domain: organizations
status: ingested
source_period: "2062"
profile:
  type: "shadowy coalition of Awakened entities reported in Australia"
  known_membership:
    - "Nine members are free spirits of man, most identified as Animus/Anima spirits."
    - "Additional free spirits of man cooperate with City for reasons of their own."
  activity:
    - "Reportedly takes an interest in metahuman affairs and occasionally hires shadowrunners or other metahuman agents."
    - "Jobs are described as including urban and rural work rather than only Outback operations."
  agenda:
    - "Help metahumans and metahuman civilization resist the encroachment of Australia's Awakened land."
    - "Mitigate the effects of mana storms and alchera on metahuman settlements."
    - "Preserve a viable relationship between civilization and the land because spirits of man depend on metahuman civilization."
  methods:
    - "Employs shadowrunners and other mortal allies."
    - "Acts from enlightened self-interest rather than simple altruism."
sources:
