entries:
  - {id: entity.organization.saiki-rengo, name: "Saiki-rengo", type: "Yakuza rengo", profile: "Major Australian Yakuza organization, strongest in northeastern Australia; led by Kazuma Saiki."}
  - {id: entity.organization.kawaru-gumi, name: "Kawaru-gumi", type: "Yakuza gumi", profile: "Queensland ork/troll Yakuza faction; both rival and potential partner to conventional Yakuza interests."}
  - {id: entity.organization.golden-triangle-society, name: "Golden Triangle Society", type: "Triad", profile: "Small Australian Triad rumored to be linked to the Red Dragon Triad in Hong Kong."}
  - {id: entity.organization.grass-sandals, name: "Grass Sandals", type: "Triad", profile: "Largest Australian Triad in this source period; led by Li Mi."}
  - {id: entity.organization.green-gang-australia, name: "Green Gang", type: "Triad", profile: "Second-largest Australian Triad; strong in smuggling and talismongering; shadowtalk links it to Wuxing."}
  - {id: entity.organization.australian-vietnamese-gangs, name: "Vietnamese Gangs", type: "organized crime network", profile: "Centered around Darwin with additional east-coast/Adelaide presence; firearms, betting, organlegging/chips, robbery, hacking and blood sports."}
  - {id: entity.organization.australian-vory, name: "Vory v Zakone (Australia)", type: "Russian Mafia", profile: "Small Sydney/Melbourne presence using low-profile prostitution, illegal-fight, smuggling and drug markets."}
  - {id: entity.organization.stefanopoulos-family, name: "Stefanopoulos Family", type: "Greek Mafia", profile: "Dominant Greek crime family centered in Melbourne; led by Anton Stefanopoulos."}
  - {id: entity.organization.australian-south-african-syndicates, name: "South African Syndicates", type: "organized crime network", profile: "Strongly concentrated in Perth; involved in smuggling, prostitution, illegal fighting, money laundering and construction rackets."}
  - {id: entity.organization.crows-biker-gang, name: "Crows", type: "biker gang", profile: "National-level biker organization with many Aboriginal members; sometimes acts as informal road/security force."}
  - {id: entity.organization.thors-hammers-australia, name: "Thor's Hammers", type: "biker gang", profile: "Major national biker club with Aboriginal membership."}
  - {id: entity.organization.apaches-australia, name: "Apaches", type: "biker gang", profile: "Major national biker club; source notes possible cooperation with the Scales against syndicate expansion."}
  - {id: entity.organization.scales-australia, name: "Scales", type: "biker gang", profile: "Major national biker club involved in road security, water/drug/arms markets and conflict with organized crime."}
  - {id: entity.organization.hells-angels-australia, name: "Hell's Angels", type: "biker gang", profile: "One of the five named national biker clubs."}
notes:
  - "Shadowtalk-only allegations are not promoted beyond the confidence stated in the individual profile."
