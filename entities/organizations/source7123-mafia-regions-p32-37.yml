framing: newsroom_neutral

name: "Mafia regional network"

regions:
  boston:
    major_families:
      - O'Riley
      - Morelli
      - Muldoon
    leadership:
      - "Don Conor 'The Mick' O'Riley leads the dominant family."
    notes:
      - "O'Riley is identified as an elf and as the only metahuman capo then sitting on the Commission."

  new_york:
    major_families:
      - Carnetti
      - Colombo
      - Genovese
      - Lucchese
      - Bonanno
    notes:
      - "The source calls these the Big Five and presents them as major powers in the Commission."
      - "Their influence extends through Manhattan, upstate New York, Newark, and Philadelphia, with substantial legitimate-business and corporate connections."

  deecee:
    major_families:
      - Mueller
      - Marconi
    leadership:
      - "Don Franco 'The Enforcer' Mueller is the regional capo."
      - "Don Victor 'Velvet' Marconi serves as a prominent political intermediary."
    notes:
      - "The source presents DeeCee operations as deeply concerned with political access and influence."

  chicago:
    major_families:
      - O'Toole
    leadership:
      - "Don Leo 'The Lion' McCaskill of Milwaukee has temporary authority over remaining Chicago interests."
    notes:
      - "The Containment Zone destroyed or isolated much of the old Chicago organization."
      - "The Commission had not yet permanently reassigned Chicago's vacant seat during the source period."

  seattle:
    major_families:
      - Bigio
      - Ciarniello
      - Finnigan
    leadership_context:
      - "The late James O'Malley had previously unified Seattle's Mafia interests against regional rivals."
      - "After his death, the source presents the top Seattle position as unresolved."
      - "Rowena O'Malley is identified as a possible claimant, while the Commission is portrayed as reluctant to approve her."
    notes:
      - "The source describes Seattle as a longstanding rivalry zone among the Mafia, Yakuza, and other local organizations."

  new_orleans:
    major_families:
      - Kozlowski
    leadership:
      - "Miriam 'La Dame du Morte' Kozlowski leads the family."
      - "Her mother Paula previously held the position after Stan 'Gumbo' Kozlowski."
      - "Pamela Rodenbush is identified as Miriam's intended successor."
    notes:
      - "The source emphasizes the family's two-generation female leadership as unusual within Mafia tradition."

  atlanta:
    major_families:
      - Gianelli
    notes:
      - "The family is presented as an established regional organization with Caribbean-facing trade connections and corporate-contract interests."

  dallas_fort_worth:
    major_families:
      - Chavez
    notes:
      - "The Chavez family is described as having roots in the former Mexican Mafia and as expanding after settling in Texas."

  los_angeles:
    major_families:
      - Larraga
      - Gillespie
    notes:
      - "The source presents Los Angeles as a major California Mafia market with interests spanning entertainment, hospitality, resort businesses, gaming, and off-channel adult-entertainment services."

  san_francisco:
    major_families:
      - Worzcek
    notes:
      - "The Worzcek family is concentrated around Oakland/Berkeley and competes with the stronger local Yakuza presence through alliances with smaller organizations."

  denver:
    major_families:
      - Casquillo
    notes:
      - "The Casquillo family is strongest in the UCAS sector and operates behind a legitimate shipping/import concern."
      - "Denver's jurisdictional patchwork prevents any one syndicate from fully consolidating the region's informal trade routes."

  las_vegas_nan:
    major_families:
      - Verontesse
    notes:
      - "The source presents Las Vegas as the principal Mafia center inside the Native American Nations."
      - "Core businesses include gaming, adult-entertainment operations, informal distribution, and black-market merchandise."
      - "A coercive labor market is described as operating behind ostensibly legitimate entertainment and hospitality fronts."
      - "An attributed Shadowland claim links individuals who disappear from that market to Tamanous; the source does not establish the claim as confirmed fact."

  caribbean_league:
    major_families:
      - Batista
      - Gambione
    notes:
      - "The Batista family is presented as the principal Havana organization, with Miami's Gambione family also deeply involved in regional activity."
      - "After the Awakening, the source describes an accommodation between local Mafia leadership and powerful voudoun-aligned groups, reducing direct conflict and integrating some magical specialists into family operations."

