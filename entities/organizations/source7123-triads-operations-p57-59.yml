name: "Triad operations, personnel and initiation"

business_profile:
  - "North American Triads are described as expanding into gambling, adult-entertainment services and other vice markets already occupied by established syndicates."
  - "The source describes competitive pressure campaigns against rival businesses and personnel as part of territorial expansion; this material is retained as setting context rather than operational guidance."
  - "Other activities described in the chapter include controlled-substance distribution, chip distribution, protection arrangements, finance, laundering, recruiting, communications and related support functions."

personnel:
  - "Women may join Triads, though the source portrays senior leadership as uncommon; Hsu Tai of the White Crane Triad is identified as a Lodgemistress and powerful sorceress."
  - "Magicians are presented as unusually common and culturally significant within Triad organizations."
  - "Traditional anti-cyberware attitudes are described as strongest higher in the hierarchy and less rigid among lower-ranking soldiers; the source also presents physical adepts as fitting comfortably within Triad martial and magical culture."

initiation:
  - "The source describes the lowest-rank Sze Kau initiation as an elaborate lodge ceremony rich in symbolic rebirth, loyalty oaths and traditional ritual imagery."
  - "The ceremony may be compressed from an older multi-day form, while some lodges require the candidate to return for follow-up rites."
  - "The source preserves higher-rank initiation details as largely unknown to the narrator and attributes additional magical significance to some lodge rites."

mechanics_audit:
  protected_classes_found: []
  findings:
    - "The initiation description is setting ritual, not a player-character Initiation mechanic or test procedure."
    - "No target number, dice-pool modifier, Karma cost, Force value, damage code, Availability value, formal test, character option or stat block is defined on printed pp.57-59."

