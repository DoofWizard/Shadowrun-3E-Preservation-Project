name: "Yakuza"

source_period_profile:
  - "The source presents the Yakuza as an old Japanese organization whose Sixth World identity is divided between traditionalists and reformers."
  - "North American expansion is tied especially to Pacific Rim trade, Japanese corporate expansion, and the post-2036 occupation of San Francisco."
  - "San Francisco is described as the unofficial Yakuza capital of North America in the source period."

organization:
  gumi:
    role: "clan or syndicate"
    size: "from a few dozen members to roughly one thousand"
  rengo:
    role: "alliance of gumi"
  oyabun:
    role: "clan or syndicate head"
  wakagashira:
    role: "second in command"
  wakagashira_hosa:
    role: "underlings of the second in command"
  kumi_in:
    role: "enlisted members"
  komon:
    role: "advisors"
  shingiin:
    role: "counselors"
  hisho:
    role: "secretaries"
  kaikei:
    role: "accountants"
  nawabari:
    role: "territory controlled or claimed by a gumi"

alliances:
  watarada_rengo:
    notes:
      - "The source identifies the Watarada-rengo as the most important major alliance in the Pacific Northwest."
      - "The alliance is presented as reducing destructive competition among allied gumi without creating a Mafia-style central ruling commission."

traditions:
  principles:
    - jingi
    - giri
    - ninjo
  summary:
    - "Jingi governs rank, etiquette, and deference."
    - "Giri centers on duty, loyalty, repayment of obligations, and service."
    - "Ninjo centers on sympathy, compassion, and the traditional idea of service to ordinary people."
  obedience:
    - "Traditional doctrine requires complete loyalty to the oyabun and treats failure of duty as requiring reparation."
  yubitsume:
    framing: "traditional bodily reparation practice"
    note: "The source describes voluntary loss of part or all of a finger as a traditional response to serious failure; this is descriptive setting material, not a game procedure."
  irezumi:
    framing: "family-marking tattoo tradition"
    note: "Tattoos identify family allegiance, rank, and achievements; senior members may accumulate extensive designs that remain concealable under ordinary clothing."

