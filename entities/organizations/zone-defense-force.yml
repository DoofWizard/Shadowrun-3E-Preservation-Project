id: entity.organization.zone-defense-force
record_type: entity
name: "Zone Defense Force"
domain: organizations
status: ingested
profile:
  - "Denver security and military organization operating under Ghostwalker's authority."
  - "Established as a joint peacekeeping/defense force for Denver after the January 2062 political settlement."
  - "Composed of equal elements supplied by the participating nations, with personnel loaned from their national forces."
  - "Operates independently through its own command staff; participating nations may nominate personnel but Ghostwalker retains final selection."
  - "Ghostwalker states that the force answers ultimately to him."
  - "Intended to replace nationally commanded military forces stationed inside the Front Range Free Zone while preserving collective defense."
sources:
  - {source: source.fanpro-10666, pages: "63-64", relation: defines_profile}
  - {source: source.fanpro-10650, printed_page: 73, pdf_page: 74, relation: clarifies_creation_and_command}
notes:
  - "Descriptive operational capabilities are preserved without inventing mechanical bonuses."
