name: "Alamos 20,000"

source_period_profile:
  - "The source presents Alamos 20,000 as a deliberately fragmented anti-metahuman umbrella whose apparent subsidiaries, fronts and factions may not know they serve the same larger organization."
  - "The central model is a leadership struggle among the Nazi, Troll, Zealot, Senator and Loon factions; each advances a different agenda while treating the others as competitors."
  - "The organization works best as a behind-the-scenes threat whose lower-level fronts can appear independently in a campaign."

game_information:
  - "The named leaders should be used as archetypes rather than fixed character stat blocks; the gamemaster may make them active or passive, give them changing motives, and alter alliances/internal struggles to suit the campaign."
  - "The gamemaster should decide whether apparent Alamos-linked groups cooperate efficiently, work with local anti-metahuman organizations, or mistake one another for rivals."
  - "The Metagenetic Research Consortium operates Project Centers pursuing research useful to the organization's anti-metahuman agenda."
  - "Human-supremacist training centers are described as producing personnel trained to a level comparable to a high-level corporate security team."

