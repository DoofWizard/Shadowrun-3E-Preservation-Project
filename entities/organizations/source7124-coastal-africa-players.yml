entities:
  - id: world.polity.anyi-territory-2059
    name: "Anyi Territory"
    type: regional_polity
    ruler: "King Kouame"
    major_cities:
      - "Adzane"
      - "Agboulle"
      - "Dimbokro"
      - "Abengorou"
    major_river: "Komoe"
    source_notes:
      - "The source describes a strongly hierarchical territory dominated by troll leadership."
      - "Conflict with neighboring Baule populations is a central source-period issue."
      - "Source commentary about internal oppression, succession and individual motives remains attributed."

  - id: world.polity.asamando-2059
    name: "Asamando"
    type: regional_polity
    ruler: "Queen Thema Laula"
    major_city: "Nyamkopon"
    major_river: "Black Volta"
    source_notes:
      - "The player profile presents Asamando as a ghoul-majority polity with an organized government and military."
      - "Claims about population policy, medical experimentation and the queen's motives remain attributed where they appear in Shadowland commentary."

  - id: world.polity.asante-nation-2059
    name: "Asante Nation"
    type: regional_polity
    ruler: "Asantehene Osei Agyemang"
    major_cities:
      - "Accra"
      - "Kumasi"
      - "Koforidua"
      - "Tema"
    major_river: "Volta"
    source_notes:
      - "The source describes Osei Agyemang as absolute ruler, chief priest and commander of the armed forces."
      - "Corporate activity is restricted compared with neighboring territories."
      - "The state is described as a significant source of employment and transit for independent operators."

  - id: organization.fanti-maritime-network
    name: "Fanti Pirates"
    type: regional_maritime_network
    captain: "Kweku"
    major_bases:
      - "Cape Coast"
      - "Wineba"
    source_notes:
      - "The source explicitly says there is no single central leader for all Fanti groups; Kweku is one influential patriarch."
      - "Kweku is described as controlling access around Accra with an extended family and associated groups."
      - "Political goals and long-term strategy are disputed among source commentators."

  - id: organization.final-message
    name: "The Final Message"
    type: small_regional_group
    captain: "Jonty Geldenhuys"
    bases: "unknown"
    approximate_size: "20-30 active members"
    source_notes:
      - "The group is described as small, mobile and unusually secretive."
      - "Its leader is identified as a former bounty hunter from Azania."
      - "Claims about ideology, personality alteration and hidden objectives remain attributed commentary rather than established mechanics."

  - id: organization.guiding-hand
    name: "The Guiding Hand"
    type: religious_organization
    leader:
      title: "Honorable Reverend"
      name: "Jack Bayonne"
    base: "somewhere in the former Western Province of Ghana"
    source_notes:
      - "The source describes a small religious community founded by Bayonne."
      - "Claims that the organization is a cover for another operational purpose remain attributed Shadowland speculation."

  - id: organization.illuminates-new-dawn
    name: "The Illuminates of the New Dawn"
    type: magical_educational_organization
    director_of_education: "Ernest Faldspar"
    local_headquarters: "Accra"
    source_notes:
      - "The source describes charity, education, medical relief and magical training as the visible focus of the local organization."
      - "Claims about recruitment motives or hidden ideological goals remain attributed."

  - id: organization.church-whole-earth
    name: "The Church of the Whole Earth, Inc."
    type: religious_environmental_organization
    founder: "Jaelle Lester"
    local_chief_guru: "Gabrielle Irving"
    source_notes:
      - "The organization is described as an environmental and spiritual movement with an African branch."
      - "Internal splintering and disagreement over methods are part of its source-period profile."
      - "Sensational claims about individual members are retained only as attributed commentary."

  - id: world.city.sekondi-2059
    name: "Independent City of Sekondi"
    type: independent_city
    presidential_governors:
      - "Ako Amatsewe"
      - "Akwete Amatsewe"
    source_notes:
      - "Sekondi is presented as a democratic, heavily commercialized independent city."
      - "Its docks and metropolitan security are major local institutions."
      - "The source describes the harbor as a politically important neutral zone for competing interests."

provenance_policy:
  - "Named leaders, offices, cities and organizational roles are direct source-period data."
  - "Claims about covert sponsorship, atrocities, secret programs, ideology or personal motives remain attributed unless established by the expository profile."

