  findings:
    - "The nuyen amounts are source-period campaign/reference prices, not a universal assassination-cost formula."
    - "No target number, dice-pool modifier, damage code, Availability value, formal test, character option, weapon stat, cyberware stat or NPC stat block is defined on printed pp.76-78."

