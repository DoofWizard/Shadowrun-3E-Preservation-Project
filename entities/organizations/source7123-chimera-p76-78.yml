name: "Chimera"

source_period_profile:
  - "Chimera is presented as a small specialist organization active in Seattle since 2054 and associated with former Soviet state-security personnel."
  - "The source links its origins to the KGB First Chief Directorate's Department V / Kamera lineage after the second Soviet collapse."
  - "Estimated membership ranges from fewer than five to roughly a dozen; the source describes members as human, mundane and mostly male, while later commentary raises the possibility of external magical support."
  - "Members are described as veteran espionage personnel with high-grade cyberware and extensive technical support."

attributed_cases:
  - "Four prominent Seattle-area deaths in the preceding year are attributed to Chimera by the narrator, though the organization does not publicly claim responsibility."
  - "The chapter uses these cases to establish Chimera's reputation for patience, specialized preparation and varied methods; the attribution remains explicitly uncertain."

contact_and_pricing:
  - "Prospective clients are described as using indirect Matrix-contact channels rather than a public storefront or fixed price list."
  - "A sample automated response says a message remains stored for 48 hours before being replaced by a follow-up response."
  - "Price is said to vary with target security and contract constraints."
  - "The visually verified ballpark starting point for a 'bare' target is approximately 50,000 nuyen."
  - "Commentary discusses 500,000 nuyen as a plausible high-end figure for a difficult target and says the Joe Two Feathers case was worth more than half a million nuyen to an unknown party or parties."

mechanics_audit:
