name: "Mafia / Cosa Nostra"

source_period_profile:
  - "The source presents the Mafia as a long-lived North American organized-network structure that survived the Awakening, the Ghost Dance War, the breakup of the old United States, and growing competition from other syndicates."
  - "The source distinguishes Cosa Nostra from smaller independent ethnic organizations and describes long-term consolidation, absorption, and competition among regional networks."
  - "Chicago and Seattle are presented as current pressure points after major losses and leadership disruptions."

organization:
  capo_di_tutti_capi:
    label: "boss of all bosses"
    source_state: "vacant for more than a century"
  inner_circle:
    size: "12+"
    role: "central cadre of the most powerful dons and capos"
  commission:
    membership: "heads of 50+ families"
    role: "arbitrates major inter-family disputes and coordinates high-level business"
    meeting_mode:
      - "Historically met in major UCAS cities."
      - "By the source period, increasing security and travel difficulties have pushed meetings toward Matrix-based virtual sessions."
  regional_capo:
    role: "head of multiple families in an area"
  family:
    don: "family head"
    consigliere: "counselor outside the ordinary chain of command"
    sottocapo: "underboss"
    caporegimes: "captains managing daily operations"
    soldatos: "made members carrying out orders and supervising outside personnel"
    employees:
      - management
      - accounting
      - data_processing
      - decker_support
      - low_level_matrix_support
    associates:
      role: "outside specialists used for specific jobs without full family membership"

code:
  omerta:
    role: "code of silence and non-cooperation with outside authorities"
  rispetto:
    role: "formal deference to higher-ranking members and family honor expectations"

source_period_notes:
  - "The source reports roughly forty to fifty Mafia families operating in North America, with only a smaller set treated as major powers."
  - "Family leadership is traditionally hereditary or passed to close male relatives, with New Orleans explicitly identified as a notable exception led by women for two generations."
  - "Lower-ranking members and younger personnel are described as increasingly comfortable with cyberware, Matrix technology, and other Sixth World tools despite conservative leadership culture."

