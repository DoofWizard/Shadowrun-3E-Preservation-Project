name: "Seoulpa Ring personnel and initiation"

personnel:
  - "Early Rings recruited heavily from Seattle's Korean community, using shared language and personal networks as security against infiltration."
  - "Later Rings are described as increasingly diverse in metatype and background, with loyalty to the Ring weighted more heavily than ancestry."
  - "Ring membership and leadership remain highly individual; there is no single standardized personnel model across all Rings."

initiation:
  general:
    - "Initiation practices are described as Ring-specific security and loyalty screening rather than a universal ceremony."
    - "The source presents some Rings as using severe endurance testing and others as using magical investigation of a candidate's history."
  changgo_example:
    duration: "8 hours"
    sponsorship:
      - "A candidate required a recommendation from one Ring member and secondary support from at least two additional members personally familiar with the candidate."
      - "Sponsors could face serious internal consequences if a candidate proved unsuitable because of facts the sponsors reasonably should have known."
    setting_summary:
      - "The ceremony combined isolation, questioning, repeated loyalty declarations and a deliberately punishing endurance ordeal intended to test commitment."
  komonjo_example:
    - "The source says the Komonjo Ring does not use the same physical ordeal; its shamans instead use psychometry to examine a candidate's personal history and concealed information."

