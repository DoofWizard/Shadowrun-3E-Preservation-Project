id: catalog.organization.seattle-downtown-gangs
record_type: entity_catalog
name: "Downtown Seattle gangs — 2060 source snapshot"
domain: organizations
status: ingested
source: source.fanpro-10657
pages: "32, 38-39"
pdf_pages: "33, 39-40"

entries:
  - id: entity.organization.berserkers
    name: "Berserkers"
    area: "Ballard"
    source_period_facts:
      - "Local gang associated with neighborhood protection."
      - "Has ties to smugglers using a minor Puget Sound route from Salish-Shidhe territory."
  - id: entity.organization.halloweeners
    name: "Halloweeners"
    area: "Downtown waterfront south of the Renraku arcology"
    source_period_facts:
      - "Described as the largest and most volatile Downtown gang."
      - "Current incarnation follows the near-destruction of an earlier group in conflict with Renraku."
      - "Led by Slash-and-Burn and strongly anti-corporate in recruitment and identity."
      - "Uses orange-and-black colors and jack-o'-lantern/flame imagery."
    reported_or_speculative:
      - "Shadowtalk claims members may know unofficial routes into the shut-down arcology."
  - id: entity.organization.first-nations-gang
    name: "First Nations"
    area: "Waterfront north of the arcology and parts of Everett"
    source_period_facts:
      - "Native American gang led by the Salish elf Blood-of-the-Buffalo."
      - "Uses a raven-over-howling-coyote emblem."
      - "Receives yakuza support and works as street-level muscle for the Shotozumi-rengo."
      - "Opposes the Choson Ring in Everett."
  - id: entity.organization.troll-killers
    name: "Troll Killers"
    area: "Lake Washington / Wolf Bay"
    source_period_facts:
      - "Humans-only Human Nation youth cadre with an anti-metahuman ideology focused especially on trolls and orks."
      - "Sometimes works for smugglers operating across the lake."
  - id: entity.organization.bloody-screamers
    name: "Bloody Screamers"
    area: "Ravenna / Green Lake"
    source_period_facts:
      - "Predominantly ork gang formed after the Night of Rage."
      - "Maintains ties to the Ork Underground and smuggling activity."
      - "Primary feud in this range is with the Troll Killers."
  - id: entity.organization.disassemblers
    name: "Disassemblers"
    area: "South Seattle"
    source_period_facts:
      - "Predominantly ork/troll gang with smaller human and dwarf membership."
      - "Associated with illicit body-part trafficking and chop-shop activity."
      - "Uses a white-skull facial/badge motif."
    reported_or_speculative:
      - "Shadowtalk describes the gang as a street-level arm of Tamanous and credits Tamanous with improving its logistics."

notes:
  - "Printed narrative facts are separated from shadowtalk allegations; no later-period status is inferred."
  - "This range contains no standalone combat stat blocks for these gangs."
