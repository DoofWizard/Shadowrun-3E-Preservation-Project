id: gangs.source7123.third-tier
record_type: organization_reference
status: ingested
source: source.fasa-7123
printed_pages: "105-110"
pdf_pages: "107-112"
content_class:
  - rule_exact
  - world_fact
  - campaign_guidance
framing: newsroom_neutral

profile_context:
  - "The source identifies all gangs in Shadowrun Companion: Beyond the Shadows pp.125-130 as third-tier gangs and presents the following profiles as expanded examples."

voodoo_posse:
  leader: "Midnight"
  lieutenants: "None"
  gang_rating: "Superior"
  head_count: "Approximately 20-25 members, all of whom are magicians and voudoun practitioners."
  initiation_reference:
    - "The source describes a hazardous chemically assisted endurance/initiation ordeal; it is narrative setting material and provides no game-resolution test or dosage statistic."
  uniqueness:
    - "Midnight is described as able to call on various loas to possess Posse members."

scatterbrains:
  leader: "Giggles"
  lieutenants: "Unknown"
  gang_rating: "Equal to Superior, depending on Giggles's personality and the 'clowns' around him at any given time."
  head_count: "Reportedly 50-60 members, though up to 30 of them may be Giggles's multiple personalities."
  initiation_reference:
    - "Initiation varies with Giggles's current personality and consistently centers on absurd public-performance tasks rather than a printed game test."

steppin_wulfs:
  leader: "Seymour the Invincible (Seymour Dudley Vencken III)"
  lieutenants:
    - "None as such."
    - "The Wulfs tend to run in groups of 5 or 6; each subgroup usually treats one ganger as leader until and unless the others remove him."
  gang_rating: "Superior"
  head_count: "Approximately 30 members; the exact number changes."
  augmentation:
    - "Seymour supplies gang members with experimental custom cyberware and bioware."
    - "Every Wulf carries two experimental super-glands described as altered versions of an adrenal pump and suprathyroid gland."
    - "Some gang members may actually have an Essence of less than 0."
    - "No full cyberware/bioware statistics for the custom pieces are supplied."

isis_9:
  leader_lieutenants: "No one knows for certain which member is the leader or whether such concepts apply."
  gang_rating: "Superior"
  head_count: "As far as anyone can tell, only nine members."
  initiation_rituals: "None."
  focus: "Matrix-based otaku gang."

razor_heads:
  leader: "Double-Edge"
  leader_type: "Physical adept"
  lieutenants:
    - Damocles
  gang_rating: "Superior"
  head_count: "Approximately 25-30 members."
  initiation_reference:
    - "The printed initiation is an unarmed trial against an opponent with a ranged weapon; incapacitation is sufficient and killing is not required."
  equipment_context:
    - "Members favor blades and other close-combat weapons; no unique weapon stat block is supplied."

new_world_soldiers:
  leader: "Sugar Daddy"
  lieutenants: "None"
  gang_rating: "Equal"
  head_count: "Approximately 60 members."
  initiation_reference:
    - "Initiation varies by recruit and is tailored to the candidate's specialty; the source prints no universal test, target number or skill requirement."

mechanics_audit:
  findings:
    - "Gang Rating, head counts, subgroup sizes, magical composition, leader character type and the Essence-below-zero note are preserved exactly as printed campaign-facing facts."
    - "Printed initiation descriptions on pp.105-110 are narrative gang customs, not formal dice-resolution procedures."
    - "No individual NPC attribute/skill stat blocks are provided in these profiles."

sources:
