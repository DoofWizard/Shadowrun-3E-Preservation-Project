id: entity.organization.mimi-guardians
record_type: entity
name: "Mimi Guardians"
domain: organizations
status: ingested
source_period: "2062"
profile:
  - "Magical order charged with defending the Spirit Caves of Uluru and keeping imprisoned spirits contained."
  - "Tracks intruders and attempts to recover anything taken from the caves."
  - "Members are fanatically devoted to their duties and sworn not to reveal what they guard."
  - "The source describes members as initiates of considerable power and experience."
game_guidance:
  average_guardian: "Superior magician NPC (Shadowrun Companion p.84)."
rumors:
  - "The order is rumored to know unusual metamagics, including travel through physical rock."
  - "Some rare elf/ork metavariants in the order are rumored to be descendants of legendary Mimi beings."
sources:
  - {source: source.fanpro-10651, printed_page: 119, pdf_page: 120, relation: defines_game_information}
notes:
  - "Metamagic and ancestry claims are rumors in the source and are not promoted to established mechanics."
