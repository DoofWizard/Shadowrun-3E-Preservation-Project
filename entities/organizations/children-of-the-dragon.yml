id: entity.organization.children-of-the-dragon
record_type: entity
name: "Children of the Dragon"
domain: organizations
status: ingested
profile:
  type: "Religious movement"
  founder: "David Dragonsong (born David Lawrence Emerson)"
  founding_context:
    - "Formed after Dunkelzahn's 2057 assassination around a belief that Dunkelzahn was a divine/sacred being who sacrificed himself for metahumanity."
    - "Dragonsong became active after Dunkelzahn's death, spent months at the DeeCee rift site, then re-emerged as the group's leader."
  source_period_2061:
    estimated_membership: "Approximately 80,000 across the UCAS, per the source's closest estimate."
    growth: "Membership surged again during the comet period after earlier plateauing."
    centers:
      - "Main temple on Prince Edward Island, UCAS"
      - "DeeCee temple near the Dunkelzahn Rift"
      - "St. Louis"
      - "Boston"
      - "new sites in Denver and Seattle"
    practices:
      - "Congregations/creches center on temples."
      - "Members are expected to make periodic pilgrimages to major temples."
      - "Major temples are described as having strong magical/astral security."
      - "Source describes altars incorporating objects said to be Dunkelzahn talon clippings; provenance is not independently verified here."
    social_work:
      - "Ministry to poor and neglected communities."
      - "Recruitment among SINless/street populations."
    security:
      - "Shadowtalk reports a secret internal security/runner group used against supernatural threats; this remains attributed."
  notable_figures:
    - "David Dragonsong"
    - "Joshua Morningstar"
  magical_claims:
    - "Dragonsong publicly performed magic after previously being considered mundane and attributed this to Dunkelzahn."
    - "Followers discuss a Dragon totem and spontaneous Awakening among some members; these are source-period claims."
sources:
