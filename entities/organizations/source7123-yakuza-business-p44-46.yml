name: "Yakuza business portfolio"

major_activities:
  adult_entertainment:
    notes:
      - "The source presents Yakuza gumi as building coordinated adult-entertainment networks rather than merely buying existing local businesses."
      - "A mature Yakuza-run network is described as commonly controlling roughly 60-80 percent of the local commercial market; the source says gumi generally avoid pushing above 80 percent because new independents continually enter."
  gambling:
    notes:
      - "West Coast gumi are presented as major operators of traditional Asian gambling as well as upscale private clubs."
      - "High-end clubs may combine gaming, virtual entertainment, and full-simsense feeds."
    campaign_values:
      club_world:
        location_context: "downtown San Francisco"
        cover_nuyen: 250
        drink_minimum: 2
        drink_cost_nuyen: 25
        wagering_context: "The source commentary treats wagers below a few thousand nuyen per bet as beneath the venue's usual clientele."
  sokaiya:
    notes:
      - "The source describes sokaiya as shareholder-meeting specialists who use corporate share positions and disruptive pressure to extract money from target companies."
      - "North American activity is concentrated especially in Seattle and California, with additional activity in major corporate centers."
      - "The source presents public denunciation by local gumi as frequently performative and attributes some sokaiya groups to approval or direction from senior Yakuza figures."
    financial_example:
      - "An attributed example on printed p.46 says an independent operator seeking 15 percent of a major stock issue could face a purchase above 25,000,000 nuyen and would still need about 2,500,000 nuyen to cover a margin purchase."

mechanics_audit:
