id: catalog.contacts.srcomp-samples
record_type: entity_catalog
name: "Shadowrun Companion Sample Contacts"
domain: contacts
status: ingested
source: source.srcomp
pages: "73-78"

categories:
  - corporate
  - government
  - street
  - underworld
  - media

entries:
  - id: example.contact.amerindian-tribesperson
    name: "Amerindian Tribesperson"
    source_page: 74
    uses:
      - rural_contact
      - tribal_customs
      - tribal_contacts
      - talismongering
    notes:
      - "Provides access to tribal knowledge, rural routes, hideouts, smuggling paths, and magical places outside the sprawl."
  - id: example.contact.arms-dealer
    name: "Arms Dealer"
    source_page: 74
    uses:
      - weapons
      - ammunition
      - armor
      - explosives
      - security_vehicles
      - acquisition_network
    notes:
      - "Illegal weapons and armor supplier with underworld, smuggling, military, and customer connections."
  - id: example.contact.bounty-hunter
    name: "Bounty Hunter"
    source_page: 75
    uses:
      - information
      - locating_people
      - locating_critters
      - police_contacts
      - arms_dealer_contacts
    notes:
      - "Tracking specialist who can locate difficult targets and may know law-enforcement and weapons contacts."
  - id: example.contact.corporate-wage-slave
    name: "Corporate Wage Slave"
    source_page: 75
    uses:
      - corporate_information
      - office_rumors
      - project_information
      - corporate_security_information
    notes:
      - "Low- or mid-level corporate insider whose useful knowledge depends on job and department."
  - id: example.contact.gang-leader
    name: "Gang Leader"
    source_page: 76
    uses:
      - neighborhood_information
      - muscle
      - gang_contacts
      - organized_crime_connections
    notes:
      - "Local gang authority with broad awareness of activity on the gang's turf."
  - id: example.contact.mob-soldier
    name: "Mob Soldier"
    source_page: 76
    uses:
      - organized_crime_information
      - criminal_connections
      - syndicate_work
    notes:
      - "Lower-echelon organized-crime contact whose loyalty limits what can safely be disclosed about the employer."
  - id: example.contact.paramedic
    name: "Paramedic"
    source_page: 76
    uses:
      - emergency_medical_treatment
      - medical_supplies
      - street_medical_information
    notes:
      - "Emergency medical contact with access to treatment and supplies."
  - id: example.contact.plainclothes-cop
    name: "Plainclothes Cop"
    source_page: 77
    uses:
      - police_information
      - criminal_records
      - law_enforcement_contacts
      - datawork
    notes:
      - "Law-enforcement insider with access to records and investigative contacts."
  - id: example.contact.reporter
    name: "Reporter"
    source_page: 77
    uses:
      - media_information
      - public_exposure
      - source_network
      - identity_or_disappearance_contacts
    notes:
      - "Information broker and media contact who trades in leads, sources, and stories."
  - id: example.contact.snitch
    name: "Snitch"
    source_page: 77
    uses:
      - street_information
      - rumors
      - law_enforcement_connection
    notes:
      - "Street informant who sells information and may also report to law enforcement."
  - id: example.contact.street-cop
    name: "Street Cop"
    source_page: 78
    uses:
      - police_information
      - street_enforcement_information
      - criminal_records
      - datawork
    notes:
      - "Uniformed beat contact who can provide precinct and street-level law-enforcement information."
  - id: example.contact.street-doc
    name: "Street Doc"
    source_page: 78
    uses:
      - medical_treatment
      - cyberware_installation
      - medical_supplies
      - neighborhood_information
    notes:
      - "Off-the-books medical provider and cyberware installer serving people without ordinary legal access to care."

notes:
  - "The source provides game-stat blocks for these archetypes; this catalog preserves their reusable identity, role, and provenance without treating them as replacements for generic contact rules."
