  entries:
  - id: entity.chemistry.gamma-anthrax
    name: Gamma-Anthrax
    exposure:
      test: Unaugmented Body vs Power 8.
      infection: 6+ successes avoids infection; otherwise successes equal incubation
        period in days.
    progression:
    - After incubation, remove 1 box from maximum of both Condition Monitors every
      6 hours.
    - Death occurs if Condition Monitors are reduced to zero.
    - 'Every 24 hours infection persists: pathogen Power +1 for treatment resistance
      and cumulative +1 TN to all actions.'
    diagnosis: 2 successes on Biotech (6); fewer give clues, more suggest remedies.
    treatment: Susceptible to antibac; after defeat, removed boxes heal as normal
      combat wounds.
    vector: air, contact, injection
    cost: 1,250¥/dose
    availability: 16/30 days
    street_index: 5
    legality: 2Z
    source_worked_consequence: For example, after 24 hours of four 6-hour reductions,
      a character has room for only six boxes of Stun before unconsciousness and six
      boxes of Physical before overflow, as described by the source.
  - id: entity.chemistry.ebola-plus
    name: Ebola Plus
    aliases:
    - Strain 74B-3
    exposure:
      test: Unaugmented Body (8).
      infection: 6+ successes avoids infection for that exposure; while exposed, repeat
        Body (8) each minute.
    progression:
    - '24h after exposure: resist 8L with unaugmented Body.'
    - 'Day 2: 8M.'
    - 'Day 3: 8M.'
    - 'Day 4: 8S.'
    - 'Day 5: 8S.'
    - 'Day 6: 8D.'
    - Damage cannot heal until virus is eliminated.
    - If survivor heals without magic or cellular-repair therapy, permanent Body -2;
      later genetic therapy may repair this loss.
    survival_after_course: If the character survives the disease course, the original
      game states the virus is spent and recovery may proceed; damage is otherwise
      unhealable until elimination.
    treatment: Zeta-interferon functions at half normal strength, round down.
    diagnosis: Biotech (6); fewer than 3 successes may misidentify normal Ebola; total
      failure often indicates influenza or unknown viral attack.
    vector: air, contact, injection
    cost: 5,000¥/dose
    availability: 20/30 days
    street_index: 6
    legality: 1Z
  mechanical_scope: Published fictional Shadowrun disease exposure, timed wound resistance,
    condition monitor and treatment-effect rules; not real pathogen behavior.
