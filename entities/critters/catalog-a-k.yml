  - id: entity.critter.king-frost
    name: "King Frost"
    source_page: 33
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "King Frost (sometimes called Crackle Frost or just Frost) is a solitary, mischievous and sometimes malevolent prankster spirit creature. It has been reported as appearing in several forms, though this has not yet been verified and these different forms may in fact be separate spirit types. Such forms have included whirling snow, a man made of ice and a pale white woman. The spirit often makes a crackling noise, like breaking ice, when using its powers."
    stat_block_raw: "F F x 4 F - 3 F - 2 F F (2D6)A F 3 3"
    initiative: "F+10 + 1D6"
    attacks: "(F)S"
    powers_raw: "Accident, Cold Aura, Engulf, Immunity (Cold, Normal Weapons, Pathogens, Poisons), Magical Guard (Self Only), Materialization, Movement, Petrifying Gaze, Silence"
