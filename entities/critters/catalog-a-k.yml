  - id: entity.critter.each-uisge
    name: "Each-uisge"
    source_page: 27
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This aquatic mammal resembles a horse, standing a meter and a half tall at the shoulder and weighing approximately 385 kilograms. Its body hair is short, save for a flowing mane and tail, usually black. It moves on horselike legs and can walk and run freely on land as well as swim and dive. Though it can clamp onto its victims with its sharp teeth and drag them underwater, it prefers to compel its prey to leap on its back,"
    stat_block_raw: "10/1 4 x 6 8 — 2 / 4 3 6 4"
