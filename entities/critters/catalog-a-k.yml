    explicit_catalog_supersession: true
    description: "This large lizard resembles a western dragon, but it has no wings. Though it typically moves on all fours, it can also rear up on its hind legs, balancing with its tail. Its scales range from red-brown on the back to light tan on the belly, and it can breathe fire. A fast and aggressive carnivore, the firedrake will attack anything that enters its hunting area."
