    explicit_catalog_supersession: true
    description: "The greater unicorn is larger and less delicate-looking than the standard unicorn, with a thick mane and pink-tinged hooves. Its single horn is short and thick, and its eyes have a golden cast. The greater unicorn can grow as tall as a meter and a half at the shoulder. Many shamans consider this creature's horn ideal for making fetishes or spell foci for dealing with poisons and pathogens, which has prompted a sizable poaching industry."
    stat_block_raw: "8 4 x 5 8 4 3 / 4 4 6Z 5"
    initiative: "5 + 2D6"
    attacks: "8M, +1 Reach"
    powers_raw: "Empathy, Enhanced Physical Attributes (Quickness), Immunity (Pathogens, Poisons), Magical Guard (Self Only), Search 3 1"
