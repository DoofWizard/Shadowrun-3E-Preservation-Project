    explicit_catalog_supersession: true
    description: "The European gargoyle is a winged humanoid, about 1.5 meters tall and weighing 160 kilograms or more. Its squat, bulky body is covered in dermal ridges and plates which, com bined with its dark gray or black skin, give it the look of living stone. It stalks its prey by swooping down on victims from tall buildings and returning to the heights with its prey locked in its taloned hands."
    stat_block_raw: "10/ 9 5 x 3 8 — 2 / 5 5 6 4"
