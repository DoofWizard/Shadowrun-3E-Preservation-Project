    attacks: "4L, -2 Reach"
    powers_raw: ""
    weaknesses_raw: ""
    notes_raw: "Females use drained Essence to empower boosted Attributes. Only 1 in 6 females have the Pestilence power, which infects victims with VITAS-3. Quickness multiplier for flying is 5."
