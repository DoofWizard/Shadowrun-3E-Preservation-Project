    source_page: 29
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This large wolf stands a meter and a half tall at the shoulder and averages over 2 meters in length. It has shaggy brown fur; welldeveloped canine teeth; and long, curved claws on its feet. A nocturnal carnivore, it stalks a wide range of prey, including metahumans. Its strength, tenacity, and willingness to attack almost any living creature on sight have made the fenrir wolf the most feared carnivore in Europe."
    stat_block_raw: "10 5 x 4 9 — 2 / 5 5 5 4"
