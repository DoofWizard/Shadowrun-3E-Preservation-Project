  - id: entity.critter.incubus
    name: "Incubus"
    source_page: 33
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The Incubus is a nocturnal urban predator that resembles a large, land-dwelling octopus. Its soft body grows up to a meter long, and the span of its tentacles (from tip to tip, of its diameter) can exceed 3.2 meters. With the ability to read its prey's mind, the incubus can cast an Innate Spell (Phantasm) that perffectly matches the prey's innermost desires, mesmerizing the prey while it closes in for the kill."
    stat_block_raw: "6 2 x 2 9 3 3 / 5 4 6Z 4"
    initiative: "4 + 1D6"
    attacks: "5S, +1 Reach"
    powers_raw: "Desire Reflection, Enhanced Senses (Low-Light Vision), Innate Spell (Phantasm)"
    weaknesses_raw: "Allergy (Sunlight, Moderate)"
    notes_raw: ""
