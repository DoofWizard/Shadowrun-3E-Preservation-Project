    name: "Gorgon"
    source_page: 31
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The gorgon is an amphibious dracoform, approximately 8 meters long, with powerful limbs and a ruff of loose skin around the throat. Its feet are webbed and clawed, and a ridge of spines runs down its back. A ring of snakelike appendages, each roughly 18 inches long and ending in small spheres, springs from the crown of its head. Gorgons lack wings but have well-concealed gills along the neck. They appear to be carnivores and are known to hunt metahumans."
    stat_block_raw: "11/ 2 4 x 4 10 — 2 / 4 4 6Z 4"
    initiative: "4+1D6"
    attacks: "8D, +1 Reach"
    powers_raw: "Innate Spell (Lightning Bolt, Petrify), Noxious Breath, Paralyzing Touch, Petrifying Gaze, Venom, Weather Control"
    weaknesses_raw: "Dietary Requirement (Heavy Petroleum Oils)"
    notes_raw: "Quickness multiplier for swimming is 5."
