    powers_raw: ""
    weaknesses_raw: ""
    notes_raw: "1D6 heads can attack with the same Complex Action (no more than two heads per target). Quickness multiplier for swimming is 7. Some may have certain powers, such as Dispelling, Fear, Innate Spell"
  - id: entity.critter.icedrake
    name: "Icedrake"
    source_page: 33
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The icedrake resembles a western dragon, but it has no wings. It can grow as long as 1.5 meters. Like its cousin the firedrake, the icedrake moves on all fours, but it can also balance on its rear limbs and tail. An aggressive and fearless hunter, the icedrake will attack larger creatures without hesitation. It protects itself by emanating an aura of cold, intense enough to damage any creature foolish enough to come near."
    stat_block_raw: "4 4 x 4 4 — 2 / 3 3 6Z 5"
    initiative: "5+ 1D6"
    attacks: "6M"
