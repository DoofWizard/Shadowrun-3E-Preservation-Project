    description: "This Spirit of Man manifests as a short, hairy-bodied, bearded humanoid, usually clad in peasant garments or rags. A free-willed servant spirit, it takes up residence in a secluded part of a home— usually a barn, cellar, or attic. At night, it performs such menial services as cleaning and tidying. It also uses its powers to defend its adopted home."
    stat_block_raw: "F - 3 (F-2) x5 F -5 F F F F / A F - 1"
    initiative: "F + 9 + 1D6"
