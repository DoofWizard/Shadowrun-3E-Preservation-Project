id: catalog.critters.a-k
record_type: entity_catalog
name: "Critters Catalog A-K"
domain: critters
status: ingested
source: source.critters
pages: "18-33"

catalog_rule:
  statement: "Critters states that the statistics and powers in its Awakened Critters chapter supersede previously published information."
  application: "Each entry in this catalog records that explicit source-level supersession without inferring a specific predecessor record where repository evidence does not identify one."

entries:
  - id: entity.critter.aardwolf
    name: "Aardwolf"
    source_page: 20
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The North American aardwolf stands 0.9 meters tall at the shoulder and weighs about 37 kilograms. Its base color is a dusty tan, with darker patches on the flanks and a dark patch running from between the ears down the spine. Aardwolves are cunning and make good use of their Concealment power. The creatures have little stamina and can only maintain high speed for less than a minute before dropping back to a slow run."
    stat_block_raw: "3 4x5 3 — 2 / 4 2 6 4"
    initiative: "4 + 2D6"
    attacks: "5M"
    powers_raw: "Concealment (Personal)"
    weaknesses_raw: "Allergy (Pollutants, Mild)"
    notes_raw: ""
  - id: entity.critter.abrams-lobster
    name: "Abrams Lobster"
    source_page: 20
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The Abrams lobster is the largest crustacean in Europe, with a 2.5-meter body length and an average weight of 100 kilograms. Its tough exoskeleton supports two pairs of antennae, four pairs of legs for walking and swimming, and a single pair of massive claws."
    stat_block_raw: "5 / 6 3 x 4 5 — 1 / 4 4 6 3"
    initiative: "3+ 1D6"
    attacks: "5S, +1 Reach"
    powers_raw: "Enhanced Senses (Sonar), Hardened Armor, Immunity (Poisons)"
    weaknesses_raw: ""
    notes_raw: "If an Abrams lobster inflicts damage with a melee attack, the target must make a Quickness (4) Test. If the target achieves no successes, the lobster's claw grips the victim. Gripped victims"
  - id: entity.critter.afanc
    name: "Afanc"
    source_page: 20
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The afanc resembles a crocodile, but it grows as long as 4.5 meters (including the tail) and typically weighs 375 kilograms. It has large claws used for digging and is green-brown in color. Carnivores of exceptional awareness and cunning, afancs live in semi-social groups of up to six but forage and feed individually. A Filipino version called the buwaya uses its Search power to seek food and then magically compels the prey to come within biting distance. It is lazy"
    stat_block_raw: "10 /8 4 x 4 8 — 2 / 4 4 6 3 20"
    initiative: "3 + 1D6"
    attacks: "10S"
    powers_raw: "Engulf, Enhanced Physical Attributes (Strength, three times per day, for [Essence]D6 turns), Enhanced Senses (Low-Light Vision, Smell), Hardened Armor, Search"
    weaknesses_raw: ""
    notes_raw: "An afanc that makes a successful melee biting attack may grip its victim in its jaws, unless the victim makes a successful Quickness (4) Test. To escape, the victim must make a Strength Test, using the"
  - id: entity.critter.agropelter
    name: "Agropelter"
    source_page: 21
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "A cunning but unintelligent omnivore, the agropelter is a small hominid, up to 0.9 meters tall, with a slender, wiry body, an ape-like face and long, thin, strong limbs. Short, thick fur, usually brown or black, covers its body, and both hands and feet have sharp claws. The aggressive agropelter has been known to attack humans to drive them away from its territory."
    stat_block_raw: "2 4 x 3 3 — 3 / 4 2 6 4"
    initiative: "4 + 2D6"
    attacks: "3M or Humanoid"
    powers_raw: "Enhanced Senses (Improved Hearing and Smell, Low-Light Vision)"
    weaknesses_raw: ""
    notes_raw: "Multiplier for movement through treetops is 4."
  - id: entity.critter.aitvaras
    name: "Aitvaras"
    source_page: 21
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This Awakened snake averages 8 meters in length and 40 kilograms in weight. It can fly, and may be related to feathered serpents. Unlike most reptiles, it appears to be active at all times of day and in all seasons of the year."
    stat_block_raw: "4 6 x 3 3 5 4 / 6 52 6 6"
    initiative: "6 + 3D6"
    attacks: "6L, +1 Reach"
    powers_raw: "Animal Control (Special), Concealment (Personal), Empathy, Immunity (Normal Weapons), Magical Guard (Self Only), Venom; some have Magical Skills."
    weaknesses_raw: ""
    notes_raw: "The aitvaras may use its Animal Control power on domestic and farm animals and reptiles. Against any other normal animal, it"
  - id: entity.critter.anwuma-bavole
    name: "Anwuma Bavole"
    source_page: 21
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Anwuma bavole are Awakened fish-eating bats similar to North American birdmen. They live in coastal West Africa, where they hunt surface-feeding fish in the Gulf of Guinea. Anwuma bavole carry no diseases that affect metahumans. They sometimes fixate on groups of people, following them for days without eating or sleeping, for no apparent reason. The Nzima people see this as an omen of good luck and actively encourage the creatures by feeding them."
    stat_block_raw: "1 4 x 4 0 — 1 / 4 1 6 4"
    initiative: "4 + 1D6"
    attacks: "3L"
    powers_raw: "Enhanced Senses (Low-Light Vision), Sonic Projection (High Frequency)"
    weaknesses_raw: "Allergy (Sunlight, Mild)"
    notes_raw: ""
  - id: entity.critter.asonwu
    name: "Asonwu"
    source_page: 21
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "These animals are similar to the agropelter (a small humanoid metavariant of the rhesus monkey). They are carnivorous and hunt in packs to take down large prey. A few members hamstring the prey with swift biting attacks; once it is down, up to fifty asonwu mob it. The symptoms of the disease inflicted by this creature's Pestilence power are itching, shaking, madness, and eventually brain death."
    stat_block_raw: "2 4 x 3 3 — 3 / 4 2 6 6"
    initiative: "6+ 1D6"
    attacks: "6L"
    powers_raw: "Enhanced Senses (Improved Hearing and Smell, LowLight Vision), Pestilence"
    weaknesses_raw: ""
    notes_raw: "Multiplier for arboreal movement is 4."
  - id: entity.critter.baba-yaga
    name: "Baba Yaga"
    source_page: 21
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "A spectral spirit-creature, the baba yaga (also known as Likho or Greedy Mogus) appears as a sinewy, gnarled, blood-less old woman with white hair. Some have been seen in mate21rial forms with only one eye. They are solitary and appear only nocturnally and in isolated forest locations. The baba yaga has been known to consume metahuman flesh, behaving in a way similar to the wendigo in its use of the Essence Drain power."
    stat_block_raw: "F F x 2 F F - 3 F F + 2 (1D6+7)A F"
    initiative: "F+ 10+1D6"
    attacks: "(F + 2)M"
    powers_raw: "Accident, Compulsion, Enhanced Senses (Smell), Essence Drain (Permanent), Fear, Glamour, Immunity (Age, Cold, Normal Weapons, Pathogens, Poisons), Magic Sense, Materialization,"
    weaknesses_raw: "Allergy (Sunlight, Mild), Essence Loss (1 point per month)"
    notes_raw: "Some baba yaga may have one or more of these additional powers: Cold Aura, Confusion, Enhanced Physical Attribute (Strength, twice per day for Essence x D6 turns), Magical Skills. The baba yaga"
  - id: entity.critter.bandersnatch
    name: "Bandersnatch"
    source_page: 22
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The bandersnatch, a type of sasquatch infected with a vampiric virus, stands about 3 meters tall and weighs 400 kilograms. A bandersnatch's fur is thicker and shabbier than a sasquatch's, and its arms are somewhat longer. Because a ban-dersnatch can use its Adaptive Coloration power to refract light around its body, its true form is rarely seen. When using this power, the bandersnatch appears as a shifting, humanoid-shaped image of the surrounding terrain."
    stat_block_raw: "8 3 x 4 7 — 2 / 4 4 6Z 4"
    initiative: "4 + 3D6"
    attacks: "8S, +1 Reach"
    powers_raw: "Adaptive Coloration, Mimicry, Pestilence (HMHVV-2)"
    weaknesses_raw: ""
    notes_raw: ""
  - id: entity.critter.bandit
    name: "Bandit"
    source_page: 22
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The bandit is a larger version of the raccoon, growing up to a meter long, with disproportionately long front legs and opposable thumbs. Bandits have been known to use simple tools and are attracted to shiny objects."
    stat_block_raw: "2 4 x 3 2 4 3 / 5 2 6 5"
    initiative: "5 + 1D6"
    attacks: "3L"
    powers_raw: "Enhanced Senses (Improved Hearing and Smell, Low-Light Vision)"
    weaknesses_raw: ""
    notes_raw: "Bandits have an innate understanding of lock mechanisms. Using simple tools such as a discarded nail or a bit of wire, a bandit can often pick mechanical locks. Treat this ability as a Rating 4 skill."
  - id: entity.critter.banshee
    name: "Banshee"
    source_page: 22
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Tall and gaunt, the banshee is an elf infected with HMHVV. It prefers desolate places near human habitation and is reclusive except when hunting. It lives off the Essence of its victims, whom it terrifies into flight with its haunting wail and pursues until the victim drops from exhaustion. The banshee then closes in for the kill, completely draining its prey of Essence. An elf who becomes infected with HMHVV and turns into a"
    stat_block_raw: "3 4 x 5 3 5 4 4 2D6 4"
    initiative: "4 + 2D6"
    attacks: "Humanoid"
    powers_raw: "Enhanced Senses (Improved Hearing and Smell, Low-Light Vision), Essence Drain, Fear, Immunity (Age, Pathogens, Poisons), Infection, Mist Form, Regeneration. Many also possess Magical Skills."
    weaknesses_raw: "Allergy (Sunlight, Moderate), Essence Loss, Vulnerability (Wood, Silver)"
    notes_raw: ""
  - id: entity.critter.barghest
    name: "Barghest"
    source_page: 22
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The barghest resembles an oversized mastiff, either pure white or pure black. Its short fur lies flat on its body, creating the impression that its hide is naked, and spines protrude the length of its back. Its eyes shine red and its teeth glow slightly in the dark because of luminescent bacteria in its saliva. It hunts alone or in pairs during breeding season; at other times, it hunts in packs of twelve or more."
    stat_block_raw: "7 6 x 3 5 — 3 / 6 3 6Z 6"
    initiative: "6 + 2D6"
    attacks: "9S"
    powers_raw: "Enhanced Senses (Sonar), Fear, Paralyzing Howl"
    weaknesses_raw: ""
    notes_raw: ""
  - id: entity.critter.basilisk
    name: "Basilisk"
    source_page: 22
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The basilisk is a large lizard, averaging 2.5 meters from snout to tail and weighing about 100 kilograms. Its knobby scales are black and bright yellow, condensing to solid black at snout and tail tip. It has 40 saw-edged teeth and feeds primarily on small mammals, but it will happily devour anything it can catch."
    stat_block_raw: "4/2 2 x 3 7 — 1 / 3 2 6Z 2"
    initiative: "2 + ID6"
    attacks: "6M,-1 Reach"
    powers_raw: "Petrifying Gaze"
    weaknesses_raw: "Allergy (Own Gaze, Severe)"
    notes_raw: ""
  - id: entity.critter.bean-sidhe
    name: "Bean Sidhe"
    source_page: 22
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This spectral being manifests as an old woman, dressed in rags or in clothes from a bygone age. It appears to act as a messenger, its piercing wails either lamenting the dead or warning of an imminent death in the family to which it is attached. Bean sidhes appear exclusively to families in Scotland 22or Tir na nOg who possess a strong Celtic genetic strain and a generally low rate of UGE. Occasionally, apparently insane"
    stat_block_raw: "F-1 (F-1)x2 F - 1 F - 3 F F + 1 (4d6+2)A F-1"
    initiative: "F + 9 + 1D6"
    attacks: "Special"
    powers_raw: "Cold Aura, Compulsion, Essence Drain (Temporary), Immunity (Age, Cold, Normal Weapons, Pathogens, Poisons), Magic Sense, Materialization, Paralyzing Howl, Psychokinesis,"
    weaknesses_raw: "Allergy (Silver, Severe), Essence Loss"
    notes_raw: "F = current Essence. Minimum Essence 6, Max 26. Astral Initiative is F + 20 + ID6."
  - id: entity.critter.behemoth
    name: "Behemoth"
    source_page: 23
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "A territorial animal with aggressive hunting habits, the behemoth is a large paraspecies of the common alligator. Standing 3 meters high at the shoulder and 4.9 meters long, the behemoth is covered in a thick, leathery skin. Its preferred method of hunting is to remain motionless just below the water's surface, where it waits for unsuspecting creatures to pass. A variant called the macareu is derived from the caiman instead of the common alligator and"
    stat_block_raw: "10/ 6 4 x 3 25 — 2 / 2 5 6 3"
    initiative: "3 + 1D6"
    attacks: "7D"
    powers_raw: "Hardened Armor"
    weaknesses_raw: ""
    notes_raw: ""
  - id: entity.critter.birdman
    name: "Birdman"
    source_page: 23
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Related to the common brown bat, the birdman's body is up to 0.6 meters long, with a wingspan of up to 2 meters. Forming flocks for mutual protection, birdmen are harmless, though their menacing appearance often frightens the uninformed into attacking them. Naturally curious, the birdman can be a nuisance. Its bite can cause a dangerous infection."
    stat_block_raw: "2 5 x 4 1 — 1 / 5 3 6 5"
    initiative: "5 + 2D6"
    attacks: "3L"
    powers_raw: "Enhanced Senses (Improved Hearing, Sonar), Pestilence (Special), Sonic Projection"
    weaknesses_raw: "Allergy (Sunlight, Mild), Reduced Senses (Vision)"
    notes_raw: "Birdmen frequently carry a infection similar to malaria. If a character is affected by the birdman's Pestilence power, he is infected with a disease that does 7L Damage, with a speed of 24"
  - id: entity.critter.black-annis
    name: "Black Annis"
    source_page: 23
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This highly territorial and solitary hunter stands 1.7 meters tall. Hair grows from the creature's head and down most of its spine, with thick tufts across the tops of the shoulders and hands. It prefers to live in rocky caves or to dig out a lair among the roots of large trees. The black annis is carnivorous, using its speed and strength to catch and kill its prey."
    stat_block_raw: "9 4 x 5 10 — 2 / 3 4 5Z 4"
    initiative: "4 + 2D6"
    attacks: "10S"
    powers_raw: "Empathy (Depression), Enhanced Physical Attributes (Strength, once per day, for [Essence]D6 turns), Enhanced Reactions, Enhanced Senses (Low-Light Vision)"
    weaknesses_raw: "Allergy (Sunlight, Mild)"
    notes_raw: ""
  - id: entity.critter.blackberry-cat
    name: "Blackberry Cat"
    source_page: 23
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The size of a large house cat, the average blackberry cat weighs 15 kilograms and has long, black or white fur. They are highly intelligent and are thought to be capable of manipulating metahumans through their various magical powers."
    stat_block_raw: "2 5 x 5 2 3 3 / 8 5 6Z 6"
    initiative: "6 + 3D6"
    attacks: "6L, -1 Reach"
    powers_raw: "Accident, Adaptive Coloration, Blindness, Compulsion, Desire Reflection, Enhanced Reactions (1D6 times per day for [Essence]D6 turns), Enhanced Senses (Low-Light"
    weaknesses_raw: "Catnip --- blackberry cats find it irresistible."
    notes_raw: ""
  - id: entity.critter.blood-kite
    name: "Blood Kite"
    source_page: 23
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This small hawk has brown feathers with red patches on the wings that are said to resemble spilled blood. It also has a sharp, hooked beak and powerful talons, which males use most often to strike at the eyes of their prey."
    stat_block_raw: "1 5 x 5 1 — 1 / 4 2 6 5"
    initiative: "5 + 1D6"
    attacks: "2L"
    powers_raw: "Enhanced Senses (Improved Vision, Thermographic Vision)"
    weaknesses_raw: ""
    notes_raw: "Each time a character takes damage from a blood kite attack, roll 2D6. On a result of 12, the character has taken damage to an eye. To resist this damage, the character may make a Body Test"
  - id: entity.critter.bogie
    name: "Bogie"
    source_page: 23
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The bogie appears as an oversized rottweiler, standing up to 1.25 meters tall at the shoulder, with small horns that protrude from its brow. A carnivore, an individual bogie will usu23ally back down from a confrontation with any large creature that does not flee from its threat displays. However, when hunting in packs, bogies are ferocious and relentless."
    stat_block_raw: "3 5 x 4 4 — 2 / 4 3 6Z 4"
    initiative: "4 + ID6"
    attacks: "6M"
    powers_raw: "Accident, Enhanced Reactions, Enhanced Senses (Improved Hearing and Smell, Low-Light Vision, Motion Detection), Fear, Movement (Self Only) Weaknesses: Allergy"
    weaknesses_raw: "Allergy (Horseradish, Moderate)"
    notes_raw: ""
  - id: entity.critter.brocken-bow
    name: "Brocken Bow"
    source_page: 24
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The Brocken bow is a featureless, humanoid shadow, ranging from 2 to 5 meters tall. It is linked with sites of witchcraft trials and major sabbat festivals, and it tends to manifest at those places and times. It appears at dusk and remains active until shortly before dawn, during which time it stalks sentient victims and drains their Essence."
    stat_block_raw: "F-1 (F-1) x 3 F - 1 F F - 2 F (4d6 +3) A F"
    initiative: "F+10 + 1D6"
    attacks: "Special"
    powers_raw: "Cold Aura, Essence Drain (Permanent and Temporary), Fear, Immunity (Age, Cold, Normal Weapons, Pathogens, Poisons), Materialization, Movement, Paralyzing Touch, Shadow Cloak"
    weaknesses_raw: "Allergy (Sunlight, Moderate), Essence Loss (1 point per 10 years), Vulnerability (Fire)"
    notes_raw: "All Brocken bows possess the power of Essence Drain. To determine powers of individual Brocken bows, roll 1D6 for each power listed above. On a result of 1, the Brocken bow does not have"
  - id: entity.critter.centaur
    name: "Centaur"
    source_page: 24
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The centaur is half-horse, half-primate, standing roughly 2 meters tall at the shoulder and weighing an average of 300 kilograms. It moves on its four horse legs and has a pair of powerfully muscled arms ending in three-fingered hands with opposable thumbs. Their degree of intelligence remains open to debate, but they are known to make and use rough tools and weapons. Centaurs have excellent night vision; they rarely attack unless provoked."
    stat_block_raw: "10 4 x 5 7 — 3 / 5 3 6 4"
    initiative: "4 + 2D6"
    attacks: "6S, +1 Reach"
    powers_raw: "Enhanced Senses (Low-Light Vision, Thermographic Vision), Magic Sense, Search"
    weaknesses_raw: ""
    notes_raw: ""
  - id: entity.critter.cerberus-hound
    name: "Cerberus Hound"
    source_page: 24
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The cerberus hound is a three-headed black dog standing just over a meter tall at the shoulder and weighing 1 10 kilograms. Carnivores by nature, they hunt deer, goats, and sheep, along with the occasional metahuman. They rely on their acute senses to track prey and sheer strength to pursue their prey for long distances without tiring."
    stat_block_raw: "6 4 x 5 6 — 2 / 6 4 6Z 5"
    initiative: "5 + 3D6"
    attacks: "8M"
    powers_raw: "Concealment (Personal), Corrosive Saliva, Enhanced Physical Attributes (Strength, three times per day, for [Essence]D6 turns), Enhanced Reactions (three times per day for [Essence]D6 turns),"
    weaknesses_raw: ""
    notes_raw: "Because the cerberus hound can bite with each of its three heads, one Complex Action in a Combat Turn gives it three attacks, but all of these must be made against the same target."
  - id: entity.critter.chimera
    name: "Chimera"
    source_page: 24
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Resembling a wingless western dragon, the chimera can grow up to 3.7 meters long, with coloring ranging from dark gray to brown to light yellow-brown or tan. The chimera is a lithe, fast carnivore that will eat anything it can catch. Solitary and highly territorial, the chimera has a venomous bite."
    stat_block_raw: "5 / 4 6 x 5 5 — 1 / 3 4 5Z 5"
    initiative: "5 + 2D6"
    attacks: "6M"
    powers_raw: "Concealment (Personal), Immunity (Poisons), Venom"
    weaknesses_raw: "Vulnerability (Iron)"
    notes_raw: ""
  - id: entity.critter.chupacabras
    name: "Chupacabras"
    source_page: 24
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The chupacabras is a 1.2-meter-tall bipedal reptile resembling a cross between an iguana and a monkey. Its scales are green and covered with coarse hair. It possesses an iguana's spiky head crest, large red eyes, a short tail and opposable thumbs. It lives in tropical forests in the Caribbean (and is rumored to live on Madagascar). This secretive creature feeds on blood, preferring goats and cattle (its name means \"goatsucker\" in Spanish), and occasionally attacks metahumans"
    stat_block_raw: "5 4 x 4 3 — 3 / 5 6 2D6 5"
    initiative: "5 + 1D6"
    attacks: "3L"
    powers_raw: "Concealment (Personal), Essence Drain, Immunity (Pathogens, Poisons), Paralyzing Touch"
    weaknesses_raw: "Allergy (Sunlight, Mild), Essence Loss, Vulnerability (Fire)"
    notes_raw: ""
  - id: entity.critter.cockatrice
    name: "Cockatrice"
    source_page: 25
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The cockatrice is a long-legged, birdlike creature, mostly yellow, with a bright red coxcomb and a horny beak. Its total body length from head to tail is just over 3 meters, and it weighs an average of 40 kilograms. Though capable of limited flight, the cockatrice is awkward in the air and is much better-suited to running. It prefers to chase its prey, often rising briefly into the air and striking downward with its taloned feet."
    stat_block_raw: "3 5 x 3 4 — 2 / 3 2 6Z 4"
    initiative: "4 + 1D6"
    attacks: "8M"
    powers_raw: "Immunity (Own Touch), Paralyzing Touch"
    weaknesses_raw: ""
    notes_raw: ""
  - id: entity.critter.corps-cadavre
    name: "Corps Cadavre"
    source_page: 25
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The corps cadavre is a type of zombie, the animated body of a deceased metahuman. Because it is already dead, the corps cadavre is immune to certain magical attacks that normally affect living beings. It cannot exist without being magically sustained, but it can function independently of its creator to a certain extent."
    stat_block_raw: ""
    initiative: "1 + 1D6"
    attacks: "Humanoid"
    powers_raw: "Immunity (Mana Powers and Spells, Pathogens, Poisons)"
    weaknesses_raw: "Allergy (Sunlight, Moderate)"
    notes_raw: "Attributes noted are average for a corps cadavre. As corps cadavers were originally characters, these Attributes may vary. Target"
  - id: entity.critter.corpselight
    name: "Corpselight"
    source_page: 25
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The corpselight (also known as a will-o'-the-wisp) appears as a floating ball of light slightly less than half a meter in diameter—usually cold white, sometimes blue-tinged, with an intensity of 10 candles. It generally floats no more than 2 meters off the ground. They appear only at night, most often in deserted areas."
    stat_block_raw: "F (F+5) x 3 — — F - 3 F (4d6)A F"
    initiative: "F+10 + 2D6"
    attacks: "(F)M, -1 Reach"
    powers_raw: "Essence Drain, Immunity (Normal Weapons), Materialization, Movement, Psychokinesis, Regeneration"
    weaknesses_raw: "Essence Loss Notes: When initially encountered, a corpselight has a 2D6 Essence Rating. This means that its normal"
    notes_raw: "When initially encountered, a corpselight has a 2D6 Essence Rating. This means that its normal maximum Essence Rating is 12; however, its Essence Drain power can"
  - id: entity.critter.crested-barbarian
    name: "Crested Barbarian"
    source_page: 25
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Orange-tinted skin and thick brown fur give the crested barbarian the look of a large ape, standing 1.6 meters tall and weighing approximately 95 kilograms. These scavenging animals function in social groups of six to fifteen adults led by an alpha male. Though normally docile, many crested barbarians carry an infection akin to VITAS-3, making their bites a deadly hazard."
    stat_block_raw: "5 4 x 4 4 — 2 / 3 2 6 3"
    initiative: "3+ 1D6"
    attacks: "4M"
