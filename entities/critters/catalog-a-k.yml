    name: "Griffin"
    source_page: 32
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Part eagle and part lion in appearance, this large, winged beast has golden-brown feathers covering its wings and foreparts, with lightly furred hindquarters. From head to tail, the average griffin is more than 4 meters long, with a 7 meter wingspan. Its forelimbs are scaled and end in four toes, each tipped with a sharp talon. Its hooked beak is generally bright yellow or red."
    stat_block_raw: "9 / 3 7 x 2 9 — 3 / 5 4 7Z 6"
    initiative: "6 + 1D6"
    attacks: "9S, +1 Reach"
