    source_page: 26
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This nocturnal, Awakened version of the manta ray can achieve a \"wingspan\" of 8 meters. Its dorsal surface is black, with white markings on the ventral. Not normally aggressive toward larger creatures, its most distinctive feature is its ability to leap from the water and glide for up to 100 meters."
    stat_block_raw: "9 3 x 5 10 — 2 / 3 4 6Z 4"
