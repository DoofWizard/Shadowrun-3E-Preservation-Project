    description: "Completely hairless, the nocturnal devil rat grows up to a meter in length (including its tail) and weighs as much as 4 kilograms. Hunting in packs of up to thirty individuals, their prolific breeding rate, combined with their innate immunity to most poisons, makes exterminating them nearly impossible."
