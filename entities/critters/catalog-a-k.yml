    explicit_catalog_supersession: true
    description: "This flying insect is 16 centimeters long and weighs 3 grams. Males possess serrated mandibles and a long, slender proboscis, and detect sound through feathered antennae. Females use a hardened proboscis overlaid with chitin platelets and ending in chitinous needles to penetrate their victims' skin and suck blood. Ghede flies live in marshes, swamps, and polluted or stagnant waterways. Females need metahuman blood to mature the eggs they carry within their bodies,"
