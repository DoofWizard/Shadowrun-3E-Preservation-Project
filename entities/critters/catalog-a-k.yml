    name: "Ghoul"
    source_page: 30
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Ghouls are metahumans infected with the Krieger strain of the Human-Metahuman Vampiric Virus (HMHVV). The virus causes the victim to lose all body hair. The skin becomes a rough, scabrous hide, and the fingers elongate, with the nails hardening into claws. Teeth become sharper and more pronounced, while the eyes develop a white film of cataracts. The transformation often destroys the intellect of the victim, but many ghouls remain quite intelligent."
    stat_block_raw: "7 5 x 4 6 1 4 5 5Z 4"
    initiative: "4+ 1D6"
    attacks: "Humanoid"
    powers_raw: "Enhanced Senses (Smell, Hearing), Pestilence (Krieger HMHVV). Some also have Magical Skills."
    weaknesses_raw: "Allergy (Sunlight, Mild), Reduced Senses (Blind, or nearly so)"
    notes_raw: "West African ghouls, called sasabonsam, have extremelly long legs and arms and can run on all fours as easily as on two legs (x 5 running multiplier). Filipino ghouls, known as busaw, exhibit Allergy"
