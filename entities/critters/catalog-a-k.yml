    powers_raw: "Engulf, Materialization, Movement, Noxious Breath,"
    weaknesses_raw: "An air elemental may be confined by airtight seals; Vulnerability (Earth)"
    notes_raw: ""
  - id: entity.critter.embracer
    name: "Embracer"
    source_page: 28
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Completely hairless, with smooth red skin that has an almost metallic sheen, the embracer stands up to 1.9 meters tall, with approximately the same proportions as the mountain gorilla. The omnivorous embracers are solitary hunters who are constantly hungry and therefore always hunting. Though they have sharp teeth, their most dangerous mode of attack is to grab their prey in a bear hug and squeeze it to death."
    stat_block_raw: "8 4 x 3 8 — 2 / 3 3 6Z 5"
    initiative: "5 + 1D6"
    attacks: "7S, +1 Reach"
    powers_raw: "Corrosive Secretions, Immunity (Fire), Movement (Decrease)"
    weaknesses_raw: "Allergy (Cold, Mild)"
    notes_raw: ""
  - id: entity.critter.enwontzane
    name: "Enwontzane"
    source_page: 28
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Enwontzane are nocturnal, arboreal predators related to the sasquatch. They stand nearly 3 meters tall and weigh more than 400 kilograms. They do not carry the HMHVV virus. Native to the forests of coastal West Africa, they will feed on anything ork-sized or smaller. They hunt and live in family groups of up to ten and have one infant per year."
    stat_block_raw: "8 3 x 4 7 — 2 / 4 4 6Z 4"
    initiative: "4 + 1D6"
    attacks: "10S, +1 Reach"
    powers_raw: "Adaptive Coloration"
