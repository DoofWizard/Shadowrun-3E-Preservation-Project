    source_page: 26
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "An Awakened chimpanzee, the dour is short, stocky and muscular, with long arms and a humanlike face. It stands just over a meter tall and weighs 70 kilograms. Largely nocturnal, the dour prefers caverns, caves and abandoned mines, where it uses its acute low-light vision to hunt rats and other rodents. Some live in trees, spending the daylight hours in lairs they dig beneath the roots.•"
    stat_block_raw: "5 4 x 3 5 3 2 / 4 3 5 5"
