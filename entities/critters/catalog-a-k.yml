    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Highly sought after for its magical tusks, the golden boar is a hoofed mammal averaging 2.2 meters in length, standing approximately a meter tall and weighing approximately 170 kilos. Covered in a coat of gray-brown fur, overlaid with red-brown hair, this omnivore is almost exclusively found in dense forests. It shows aggressiveness only when mating or protecting its young."
    stat_block_raw: "6 / 1 4 x 5 8 — 2 / 5 6 6Z 4"
    initiative: "4 + 2D6"
