    stat_block_raw: "6 3 x 1 6 — 2 / 6 3 6Z 3"
    initiative: "3 + 3D6"
    attacks: "6M"
    powers_raw: "Adaptive Coloration, Enhanced Senses (Smell, 360° vision), Immunity (Poisons)"
    weaknesses_raw: ""
    notes_raw: "The gomatia may attack with its tongue, doing 6L Stun and taking a Free Action to drag what it grasps to its mouth. An Opposed Strength Test is required to break the gomatia's grasp."
