  - id: entity.critter.elemental
    name: "Elemental"
    source_page: 28
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Elementals are embodiments of the four hermetic elements. Each spirit's appearance is peculiar to its element and the nature of the ritual that summoned it, with the size of its material form nearly always indicative of its power. For more information on elementals, consult the Magic chapter, beginning on p. 186 of SR3. Elementals appear wherever they are summoned, usually near a concentration of the spirit's element. Complete descriptions appear in Spirits and Dragons,"
    stat_block_raw: "F - 2 (F+3)x4 F - 3 F F F F(A) F + 2"
    initiative: "F +12 +1D6"
