    explicit_catalog_supersession: true
    description: "This flying mammal stands just over a meter tall, with a meterlong tail, batlike wings, and fur. Its natural expression resembles that of a human face distorted with rage. All specimens encountered to date have been female. It eats carrion, and is believed to carry disease."
