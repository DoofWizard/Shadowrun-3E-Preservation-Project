    weaknesses_raw: "Allergy (Fire, Mild)"
    notes_raw: ""
  - id: entity.critter.imperial-eagle
    name: "Imperial Eagle"
    source_page: 33
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This large bird of prey has an average wingspan of just under 4 meters and weighs 24 kilograms. It tears its food apart with its large, curved beak and holds its prey in wicked talons. It appears to have limited weather-control ability, which it uses to hold off bad weather when hunting is vital."
    stat_block_raw: "3 5 x 2 3 4 2 / 4 6 6 4"
