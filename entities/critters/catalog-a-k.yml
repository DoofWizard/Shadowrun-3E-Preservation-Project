    source_page: 31
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Goblins are HMHVV-infected dwarfs. Virally induced changes include the loss of almost all body hair and fat; the latter reduces the goblin's body mass to the point that its skeletal structure is clearly visible. Goblin ears are large, long, and slightly pointed. Its favorite food is raw meat, and it prefers the dark recesses of abandoned buildings or underground caverns. As with other HMHVV-afflicted species, most goblins suffer from severely reduced intelligence,"
    stat_block_raw: "5 4 x 2 6 — 1 / 5 5 2D6 4"
    initiative: "4 + 2D6"
