    source_page: 26
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "There are several related types of dragons found around the world. They are all large saurian creatures of great intelligence, and they match descriptions of mythological dragons and great serpents from the areas where they are found. What little is known about dragons comes from interviews with the great dragon Dunkelzahn. Most dragons are solitary creatures that avoid unnecessary contact with other beings. Dragons are incapable of speech, but they are able to"
    stat_block_raw: "14/ 8 8 x 3 35 9 8 8 (2D6)Z 8"
    initiative: "8 + 2D6"
    attacks: "4D, +2 Reach"
    powers_raw: "Astral Armor, Enhanced Senses (Wide-Band Hearing, Low-Light Vision, Thermographic Vision), Hardened Armor Powers Observed In Individuals: Animal Control (Reptiles),"
    weaknesses_raw: ""
    notes_raw: "Attributes preceded by a (+) should be added to the normal Attributes for the great dragon’s type. Some great dragons are also"
  - id: entity.critter.dzoo-noo-qua
    name: "Dzoo-noo-qua"
    source_page: 27
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "A troll infected with HMHVV, the dzoo-noo-qua is frequently covered with horns, spikes and bony plates of dermal armor. The average dzoo-noo-qua is just under 3 meters tall and weighs 120 kilograms. Primarily nocturnal, these creatures often live in caves, sewers or abandoned buildings. Dzoo-noo-qua are not intelligent, as the viral infection causes the intellect to deteriorate to animal level."
    stat_block_raw: "9 / 4 5 x 2 10 1 3 / 3 4 2D6 4 Attacks: 7S, +1 Reach Powers: Enhanced Senses (Thermographic Vision), Essence Drain, Infection, Magical Guard (Self Only), Regeneration. Some also have Magical Skills."
