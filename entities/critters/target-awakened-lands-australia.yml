id: catalog.critters.target-awakened-lands-australia
record_type: entity_catalog
name: "Target: Awakened Lands — Australia Parazoology"
domain: critters
status: ingested
source: source.fanpro-10651
pages: "66-73"
mechanics_status: "descriptive-source-period traits captured; formal stat blocks remain pending Game Information where supplied"
entries:
  - id: entity.critter.mermaid
    name: "Mermaid"
    printed_page: 66
    pdf_page: 67
    relation: regional_occurrence
    summary: "Reported in Australian coastal waters; the section treats mermaids as generally less hostile than some merrow groups."
  - id: entity.critter.merrow
    name: "Merrow"
    printed_page: 66
    pdf_page: 67
    relation: regional_occurrence
    summary: "Reported in Australian coastal waters; some communities are described as territorial and capable of using tools and, in some cases, magic."
  - id: entity.critter.storm-dolphin
    name: "Storm Dolphin"
    printed_page: 66
    pdf_page: 67
    relation: regional_occurrence
    summary: "Awakened dolphins reported along Australian and New Zealand coasts; the source emphasizes hostility toward people and weather-affecting ability."
  - id: entity.critter.megalodon
    name: "Megalodon"
    printed_page: 67
    pdf_page: 68
    relation: defines_source_period_entry
    summary: "Giant predatory shark described as reaching roughly 16 meters, attracted to blood and capable of regenerating severe injury."
    qualitative_mechanics:
      - "Regeneration is described as failing when a direct hit destroys the brain or severs the spinal cord."
      - "Small groups may hunt together."
  - id: entity.critter.new-leatherback
    name: "New Leatherback"
    printed_pages: "67-68"
    pdf_pages: "68-69"
    relation: defines_source_period_entry
    summary: "Awakened sea turtle around 3 meters long; strong swimmer and active predator."
    qualitative_mechanics:
      - "Can exert a magical compulsion that drives intruders toward immersion in the nearest body of water."
  - id: entity.critter.artnwerre
    name: "Artnwerre"
    printed_pages: "68-69"
    pdf_pages: "69-70"
    relation: defines_source_period_entry
    summary: "Awakened dingo variant, somewhat taller and lighter-colored than a mundane dingo, usually hunting in packs."
    qualitative_mechanics:
      - "Studies cited by the source indicate pack members communicate empathically."
      - "The source describes them as wary of metahumans and prone to follow mana-storm aftermath for weakened prey."
  - id: entity.critter.bunyip
    name: "Bunyip"
    printed_page: 69
    pdf_page: 70
    relation: unverified_report
    source_status: uncertain
    summary: "The section explicitly says Australian parazoologists have not established concrete facts or reliable proof of the bunyip; reported specimens and DNA claims remain inconclusive."
  - id: entity.critter.drop-bear
    name: "Drop Bear"
    printed_page: 69
    pdf_page: 70
    relation: defines_source_period_entry
    summary: "Awakened koala relative described as a nocturnal ambush predator with dark coloration, strong claws and fangs."
    qualitative_mechanics:
      - "Naturally blends into its surroundings in a manner compared by the source to a bandersnatch."
      - "Attacks from above by dropping from trees."
  - id: entity.critter.metaroo
    name: "Metaroo"
    printed_page: 70
    pdf_page: 71
    relation: defines_source_period_entry
    summary: "Genetic red-kangaroo variant with heightened sensitivity to mana fields."
    qualitative_mechanics:
      - "Moves rapidly to escape magical danger; the source treats unusual metaroo flight behavior as a warning sign for nearby magical hazards."
  - id: entity.critter.pakaltu-worm
    name: "Pakaltu Worm"
    printed_pages: "70-71"
    pdf_pages: "71-72"
    relation: defines_source_period_entry
    awakened: false
    summary: "Larval form of the Australian glass wasp; eggs can be ingested on fruit and hatch inside a host."
    lifecycle:
      - "Eggs mature within roughly 2-3 days after entering a host."
      - "After hatching, larvae reach full size in about 3 hours, then leave the dead host and may pupate for up to a month."
    qualitative_mechanics:
      - "The source says egg membranes are vulnerable to certain chemicals and that magic can cure an infestation; exact game procedure is not supplied here."
  - id: entity.critter.shadow-crawler
    name: "Shadow Crawler"
    printed_page: 71
    pdf_page: 72
    relation: defines_source_period_entry
    summary: "Awakened redback-spider offshoot, commonly around the size of a human fist when food is plentiful."
    qualitative_mechanics:
      - "Dual-natured; hunts and feeds on astral as well as physical prey."
      - "Its webs are also dual-natured and can trap astral beings."
      - "The source describes life-force draining through trapped prey."
  - id: entity.critter.tasmanian-tiger
    name: "Tasmanian Tiger"
    printed_page: 72
    pdf_page: 73
    relation: source_period_history
    source_status: partially_uncertain
    summary: "The source recounts cloning of thylacines from cryogenic tissue in 2006 and their later disappearance and re-emergence in the wild after the Awakening."
    note: "Awakened powers and predatory anecdotes are primarily shadowtalk in this section and are not promoted here to established mechanics."
  - id: entity.critter.wombrick
    name: "Wombrick"
    printed_page: 73
    pdf_page: 74
    relation: defines_source_period_entry
    summary: "Awakened diprotodon variant described as roughly twice the height of a mundane wombat, around 6 meters long and up to about 400 kilograms."
    qualitative_mechanics:
      - "Notably resistant to severe damage."
      - "Slow-moving but hazardous to fast vehicles that fail to avoid it."
sources:
  - {source: source.fanpro-10651, printed_pages: "66-73", pdf_pages: "67-74", relation: defines_and_locates}
notes:
  - "Existing canonical IDs are reused for mermaid, merrow and storm dolphin."
  - "Bunyip existence is explicitly unresolved in the descriptive source and remains marked uncertain."
  - "Shadowtalk-only claims are excluded from formal creature mechanics."
