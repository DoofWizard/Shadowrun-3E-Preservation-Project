regional_occurrences:
  - "Greater Unicorn: small Australian populations; protected species, illegal to hunt; black-market horn poaching exists."
  - "Harpy: small flocks near human habitation, feeding on garbage and carrion."
  - "Incubus: urban predator in some Australian cities."
  - "Jauchekafer: carrion/toxic-waste feeder in some cities and coastal toxic zones."
  - "Loup Garou: HMHVV-2 outbreaks have spread to Australia."
  - "Man of the Woods: rare forest spirits reported."
  - "Mermaid and Merrow: coastal waters, particularly near the Great Barrier Reef."
  - "Nomad: malevolent urban entities; presence expected to spread."
  - "Nova Scorpion: Australian variant occurs in the Outback."
  - "Rockworm: rocky Outback and some infested urban areas."
  - "Saber-Toothed Cat: occurs in parts of the Outback, particularly near or in alchera."
  - "Sea Serpent: saltwater serpents occur off the Australian coast."
  - "Shapeshifter: dingo and snake shapeshifters are rumored but unconfirmed."
  - "Siren: caves and mountainous or rocky areas."
  - "Specter: Australia has ordinary ghost/specter occurrences."
  - "Storm Dolphin: small coastal pods; known to interfere with shipping by causing storms."
  - "Stormcrow: flocks gather around mana storms and mundane storms of their own creation."
  - "Talis Cat: encountered wild in Australian wilderness."
  - "Unicorn: protected species with an illegal poaching and smuggling market."
  - "Vampire: HMHVV present; vampires occasionally encountered in urban areas."
  - "Wendigo: HMHVV-infected orks occur and are particularly suited to Australian wilderness."
  - "Wyrd Mantis: isolated Outback populations."
