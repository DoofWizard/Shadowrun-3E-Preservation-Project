  - id: entity.critter.sasquatch
    name: "Sasquatch"
    source_page: 40
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This gigantic humanoid stands almost 3 meters tall and weighs 110 kilograms. It typically has black or dark brown body hair, often silver-tipped among older sasquatches. Curious and peaceful by nature, it fights only when attacked. In 2042, the sasquatch was officially recognized as a sentient species. Sasquatches are best-known for their gift of mimicry; they can imitate a variety of sounds, including the hunting calls of other creatures."
    stat_block_raw: "8 3 x 4 7 3 3 2 6Z 4"
    initiative: "4 + 1D6"
    attacks: "Humanoid, +1 Reach"
    powers_raw: "Mimicry (Animal Calls). Many also have Magical Skills."
    weaknesses_raw: ""
    notes_raw: ""
  - id: entity.critter.satyr
    name: "Satyr"
    source_page: 41
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This goatlike creature stands just over 1 meter tall and weighs up to 55 kilograms. Both genders have short tails and shaggy hair around the loins, as well as short, hollow horns just in front of their ears; males also possess a short beard and a mane of chest fur. All four of a satyr's limbs end in four-toed hooves, though its forefeet are less hardened. Expert climbers, satyrs can clamber up almost-sheer rock faces. They can also stand and walk erect for short distances."
    stat_block_raw: "2 4 x 5 2 — 2 / 4 3 6 3"
    initiative: "3 + ID6"
    attacks: "5L"
    powers_raw: "Accident, Concealment (Personal), Enhanced Reactions (three times per day, for [Essence]D6 turns)"
    weaknesses_raw: "Vulnerability (Poisons)"
    notes_raw: "Satyrs can detect even trace amounts of pollutants and possess excellent climbing skills."
  - id: entity.critter.scorpyrine
    name: "Scorpyrine"
    source_page: 41
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This scorpionlike arachnid has a sharp, curved stinger with two large venom glands, and its back and claws are covered by black, chitinous plates. A nocturnal carnivore, the scorpyrine usually kills its prey with its powerful claws, stinging only if its prey struggles too long or is significantly larger than the scorpyrine. If provoked to attack by humans or metahumans, the scorpyrine anchors itself to its enemy with its claws and then stings the victim. Its venom is highly acidic"
    stat_block_raw: "2 / 1 5 x 2 1 — 1 / 4 2 6 3"
    initiative: "3 + 1D6"
    attacks: "4L, -1 Reach"
    powers_raw: "Immunity (Fire), Venom"
    weaknesses_raw: ""
    notes_raw: "Damage Code listed applies to claw attack. Use Damage Code 5S or higher for attacks using the venomous stinger. The scorpyrine"
  - id: entity.critter.sea-leech
    name: "Sea Leech"
    source_page: 41
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This huge leech reaches an average size of 10 meters long and 3 meters wide. The number of \"mouths\" through which it sucks its victims' blood ranges from one large mouth to as many as ten. Each mouth is made up of strong muscles with which it drains blood and is filled with teeth sharp enough to rip the flesh off a troll with ease. Very few sea leeches resemble each other, and the scientific community has not yet been able to determine all the forms"
    stat_block_raw: "5 (7) 5 (7)x 4 3(8) — 1 (4) 1 (4) 6 2 (8)"
    initiative: "2 (8) + 1D6"
    attacks: "8S"
    powers_raw: "Engulf (Water), Enhanced Attribute (Strength), Movement (Self)"
    weaknesses_raw: "Dietary Requirement (Salt), Vulnerability (Fire)"
    notes_raw: "The Attributes listed represent the minimum, with maximum in parentheses. Once a sea leech has made a successful attack, the victim takes 1 box of Stun damage per Initiative Pass from blood loss."
  - id: entity.critter.sea-serpent
    name: "Sea Serpent"
    source_page: 42
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This aquatic lizard has a long tail and neck; a small, crested head; and broad, paddle-shaped flippers. Normally slow-moving, it spends most of its time near the bottom of deep lakes. Though an air breather, it can remain submerged for up to three hours. If provoked, it is large enough to inflict considerable damage on its attacker. The saltwater serpent is a larger, more streamlined version of its freshwater cousin and grows up to 25 meters long. This aggressive"
    stat_block_raw: "10 /2 4 x 4 18 — 1 / 4 4 6 4"
    initiative: "4+ 1D6"
    attacks: "8S,+1 Reach"
    powers_raw: "Enhanced Physical Attributes (Quickness, twice per day, for [Essence]D6 turns)"
    weaknesses_raw: ""
    notes_raw: ""
  - id: entity.critter.shadowhound
    name: "Shadowhound"
    source_page: 42
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "A nocturnal predator that hunts in packs, the shadowhound resembles a huge dog, 1.2 meters tall at the shoulder. Its coat is gray, marked with black patches. It can shift the patches by moving its muscles under the skin, providing it with excellent night camouflage."
    stat_block_raw: "4 4 x 4 5 — 2 / 4 3 6 4"
