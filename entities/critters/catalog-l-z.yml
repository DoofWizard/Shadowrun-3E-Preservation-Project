    explicit_catalog_supersession: true
    description: "Vampires are humans and metahumans infected with HMHVV. They prey on sentient beings, absorbing the life essence of their victims along with the victim's blood. Some vampires refuse to drain Essence from an unwilling subject; others revel in their role as hunters and killers. Vampires will become sick to their stomachs within an hour of consuming anything but blood and have particularly bad reactions to alcohol. Many vampires display magical ability, and the transformation"
    stat_block_raw: "3 5 x 5 3 5 4 4 2D6 4"
    initiative: "4 + 2D6"
    attacks: "Humanoid"
    powers_raw: "Enhanced Physical Attributes, Enhanced Senses (Hearing, Smell, Thermographic Vision), Essence Drain, Immunity (Age, Pathogens, Poisons), Infection, Mist Form, Regeneration. Many also"
    weaknesses_raw: "Allergy (Sunlight, Moderate), Induced Dormancy (Lack of Air), Essence Loss, Vulnerability (Wood)"
    notes_raw: "Variant vampires exist around the world. The Caribbean sukuyan exhibits Dietary Requirement (Salt) and in some cases a psychologically based Allergy (Holy Objects, Moderate). The Filipino"
  - id: entity.critter.vampiric-pawn
    name: "Vampiric Pawn"
    source_page: 46
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Most vampiric pawns are human and are almost indistinguishable from normal human beings. They depend on the blood enzymes of a vampire or a nosferatu to live. If they fail to receive a regular dose, they become lethargic, fall comatose and ultimately die. Vampires and nosferatu use pawns to perform actions they cannot, such as moving around during daylight, moving items to which the vampire is allergic, and so on."
    stat_block_raw: "3 3 4 3 3 5 1D6 3"
    initiative: "3 + 1D6"
    attacks: "Humanoid"
    powers_raw: "Immunity (Age, Normal Weapons)"
    weaknesses_raw: "Essence Loss (Special)"
    notes_raw: "The Attributes above are for an average pawn. Because vampiric pawns were once characters, they retain those char4 6acters' Attributes, with a minimum Strength 4, Willpower 5, and Essence 2."
  - id: entity.critter.volleying-porcupine
    name: "Volleying Porcupine"
    source_page: 47
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Nocturnal and solitary, the volleying porcupine is a large rodent with a body length of 1.1 meters and a 25-centimeter tail. It weighs approximately 14 kilograms and is covered with long, slender white quills and shorter, thicker, black-and-white banded quills. Though not normally aggressive, when threatened it can spray a noxious musk as well as fire its quills short distances in an effort to drive away enemies."
    stat_block_raw: "1 4 x 2 1 — 1 / 3 4 6 3"
    initiative: "3 + 1D6"
