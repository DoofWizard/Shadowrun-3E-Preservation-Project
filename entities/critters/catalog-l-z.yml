id: catalog.critters.l-z
record_type: entity_catalog
name: "Critters Catalog L-Z"
domain: critters
status: ingested
source: source.critters
pages: "34-48"

catalog_rule:
  statement: "Critters states that the statistics and powers in its Awakened Critters chapter supersede previously published information."
  application: "Each entry records the source-level supersession statement without inventing predecessor links."

entries:
  - id: entity.critter.kludde
    name: "Kludde"
    source_page: 34
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This shapeshifting beast can take avian, canine or feline form. The avian form resembles a large raven, the feline form a black house cat. The canine form is just under 2 meters from nose to tail, with thick neck and tail fur, and a pair of vestigial leathery wings. All three forms have reddish eyes, are primarily nocturnal, and have been known to attack humans and metahumans."
    stat_block_raw: "Avian Form 3 6 x 3 2 — 2 / 4 6 7Z 4"
    initiative: "4 + 3D6"
    attacks: "61, -1 Reach"
    powers_raw: "Blindness, Desire Reflection, Fear (Canine Form Only), Hypnotic Song (Avian Form Only), Magic Sense, Magical Guard (Self Only), Psychokinesis"
    weaknesses_raw: "Allergy (Sunlight, Nuisance)"
    notes_raw: "Quickness multiplier for flying in avian form is 6."
  - id: entity.critter.knocker
    name: "Knocker"
    source_page: 34
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The knocker is a short, apelike humanoid with powerful arm and shoulder muscles. It is subterranean and constantly active. Miners by nature, knockers tunnel through caves or abandoned mines and frequently excavate new mines. They use their magical powers as well as physical force to drive off intruders."
    stat_block_raw: "4 3 x 3 4 2 3 / 5 6 6 3"
    initiative: "3+ 1D6"
    attacks: "6L, -1 Reach"
    powers_raw: "Accident, Enhanced Physical Attributes (Strength and Body, four times per day each for [Essence x Essence] turns), Enhanced Senses (Low-Light Vision, Thermographic Vision), Fading, Glamour"
    weaknesses_raw: "Allergy (Sunlight, Moderate)"
    notes_raw: ""
  - id: entity.critter.kraken
    name: "Kraken"
    source_page: 34
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This sea creature resembles a giant squid, with an average total length of 25 meters. Two of its twelve tentacles are elongated and end in fleshy oval pads; those tentacles measure 40 meters, 10 meters longer than the others. It can change color to a limited extent; its natural coloring is white, with dark blue or dark brown mottling."
    stat_block_raw: "12/ 3 5 x 3 20 — 2 / 3 6 6Z 7"
    initiative: "7 + 1D6"
    attacks: "12D, +2 Reach"
    powers_raw: ""
    weaknesses_raw: ""
    notes_raw: ""
  - id: entity.critter.lambton-lizard
    name: "Lambton Lizard"
    source_page: 34
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This Awakened salamander can grow larger than 6 meters in length and is covered with a natural armor of overlapping dermal bone plates. Though a slow mover on land, it is swift for its size in water. The catfish-like \"whiskers\" around its mouth secrete a substance that causes temporary paralysis."
    stat_block_raw: "7 / 2 4 x 2 5 — 1 / 4 3 5 3"
    initiative: "3 + 1D6"
    attacks: "4S, +1 Reach"
    powers_raw: "Paralyzing Touch"
    weaknesses_raw: ""
    notes_raw: "The lambton lizard can also spray the paralyzing substance out to a maximum of 3 meters. Treat as a Ranged Combat attack. Unless the attack is completely dodged, it affects the victim as the Paralyzing"
  - id: entity.critter.leshy
    name: "Leshy"
    source_page: 34
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "These humanoids often appear plantlike, an impression given by their leaf-and-moss garments, rough skin, and green-tinged hair. They average 1.5 meters tall, with short tails. Known for their magical ability, leshy are frequently shamans and show an affinity for forest spirits. Highly territorial, they often set traps for the unwary passing through their home grounds."
    stat_block_raw: "3 4 x 4 3 4 3 3 8Z 3"
    initiative: "3 + 2D6"
    attacks: "Humanoid"
    powers_raw: "Confusion; many have Magical Skills. Leshy gain +1 die for dealing with forest spirits."
    weaknesses_raw: ""
    notes_raw: ""
  - id: entity.critter.lesser-thunderbird
    name: "Lesser Thunderbird"
    source_page: 34
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "A day creature, the lesser thunderbird resembles a red-brown eagle but has a wingspan of up to 3 meters. Able to generate and project an electrical field for defense, the lesser thunderbird relishes the static-charged air of electrical storms."
    stat_block_raw: "3 6 x 4 3 — 2 / 5 3 6Z 46"
    initiative: "6 + 1D6"
    attacks: "3L"
    powers_raw: "Enhanced Senses (Low-Light Vision), Innate Spell (Lightning Bolt), Weather Control (Electrical Storms) Notes: Flying multiplier is 4."
    weaknesses_raw: ""
    notes_raw: "Flying multiplier is 4."
  - id: entity.critter.leviathan
    name: "Leviathan"
    source_page: 35
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This carnivorous whale reaches an average length of 20 meters; it resembles a killer whale, but with a broader and flatter body. An aggressive predator, it feeds on smaller whales and other marine mammals and can remain underwater for up to an hour without surfacing for air."
    stat_block_raw: "11/ 2 5 x 3 10 — 2 / 4 3 6 5"
    initiative: "5 + 1D6"
    attacks: "10D"
    powers_raw: "Enhanced Senses (Sonar), Mimicry"
    weaknesses_raw: ""
    notes_raw: ""
  - id: entity.critter.loup-garou
    name: "Loup-Garou"
    source_page: 35
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The loup-garou is a human infected with a strain of the HumanMetahuman Vampiric Virus (HMHVV-2). The virus alters the host considerably: short gray-black fur covers the body, the canines become pronounced, the lips draw back from the teeth, and fingernails harden into claws. The loup garou is barely intelligent, but has an animal cunning. It lives as a scavenger most of the time, save for a peak period of four to six days out of every twenty-eight when it"
    stat_block_raw: "4 (6) 4 x 4 7 — 3 / 4 4 5 4 (6)"
    initiative: "4(6) + ID6 + (3D6)"
    attacks: "7M (9M)"
    powers_raw: "Enhanced Physical Attributes (Strength, once per day, for [Essence]D6 turns, Enhanced Senses (Thermographic Vision), Pestilence (HMHVV-2)"
    weaknesses_raw: "Allergy (Sunlight, Moderate), Allergy (Aconite or Horseradish, Moderate)"
    notes_raw: "Statistics in parentheses are for the creature at the peak of its cycle."
  - id: entity.critter.mami-wata
    name: "Mami Wata"
    source_page: 35
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Mami wata are West African mermaids domesticated by Ewe pirates, whose selective breeding has produced a slightly faster and smarter variant. Mami wata grow up to 1.5 meters long."
    stat_block_raw: "4 6 x 4 6 — 3 / 5 3 6 5"
    initiative: "5 + 1D6"
    attacks: "6S"
    powers_raw: "Enhanced Physical Attributes (Quickness, once per day, for [Essence x 2]D6 turns), Enhanced Senses (Hearing)"
    weaknesses_raw: "Dietary Requirement (Alcohol)"
    notes_raw: ""
  - id: entity.critter.man-of-the-woods
    name: "Man-of-the-Woods"
    source_page: 35
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This rare forest spirit usually appears as a slender human man or woman clad as a tribal shaman. It has also appeared as a deep patch of shadow, a walking tree, and a talking wood land animal. When assensed, the man-of-the-woods appears as a flickering, shimmering humanoid. More free-willed than the average nature spirit, they can leave their own domains but cannot exercise their powers outside their territory."
    stat_block_raw: "F+ 5 (F+1)x 2 F+ 2 F F F F/A F"
    initiative: "F+ 10+ 1D6"
    attacks: "(F)S"
    powers_raw: "Accident (Domain), Concealment (Domain), Confusion (Domain), Fear (Domain), Immunity (Normal Weapons), Magical Guard, Materialization, Movement, Weather Control"
    weaknesses_raw: ""
    notes_raw: "Roll 2D6 to determine Force. Astral Intiative is F + 20 +1D6."
  - id: entity.critter.martichoras
    name: "Martichoras"
    source_page: 35
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The martichoras is an aggressive carnivore that grows to a length of 2.2 meters and a height of 1.1 meters at the shoulder. Resembling a lion, it has longer fur and a wider mouth with multiple rows of teeth as well as a bunch of porcupinelike spines that grow from the tip of its tail. Very fast, it prefers to run its prey to ground instead of lurking in ambush."
    stat_block_raw: "8 6 x 4 8 — 3 / 4 3 6 6"
    initiative: "6 + 1D6"
    attacks: "7S, +1 Reach"
    powers_raw: "Enhanced Senses (Low-Light Vision), Venom"
    weaknesses_raw: "Allergy (Pollution, Mild)"
    notes_raw: ""
  - id: entity.critter.meistersinger
    name: "Meistersinger"
    source_page: 35
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This Awakened humpback whale averages 26 meters in length and weighs up to 55 metric tons. It has elongated tail flukes and seven to twelve small dorsal humps in place of the usual dorsal fin. Most meistersingers are magically active."
    stat_block_raw: "20/ 2 5 x 5 14 8 6 6 9Z 6"
    initiative: "6 + 3D6"
    attacks: "15D, +1 Reach"
    powers_raw: "Animal Control (Fish, Aquatic Mammals), Compulsion, Empathy, Engulf, Enhanced Senses (Sonar), Fear, Immunity (Normal Weapons), Influence, Magic Sense, Search, Sonic Projection"
    weaknesses_raw: "Dietary Requirement (Krill)"
    notes_raw: ""
  - id: entity.critter.merlin-hawk
    name: "Merlin Hawk"
    source_page: 36
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "A medium-sized member of the falcon family, the merlin hawk measures approximately half a meter in length and weighs 4 kilograms. Preying on rodents, the merlin hawk is territorial and uses its extraordinary speed to pursue all other birds of prey in its territory. Though magically active, it rarely uses its powers to harm unless severely provoked."
    stat_block_raw: "1 7 x 3 1 5 4 / 8 4 7Z 6"
    initiative: "6 + 3D6"
    attacks: "1L,-1 Reach"
    powers_raw: "Animal Control (Avians), Magical Skills"
    weaknesses_raw: "Vulnerability (Willow-Wood Weapons, Poisons)"
    notes_raw: "Merlin hawks are magically active, using detection, illusion and manipulation spells. They usually have ratings in the following ranges: Magic Attribute, 5 + 1D6; Sorcery Skill, 4 + 1D6; Conjuring"
  - id: entity.critter.mermaid
    name: "Mermaid"
    source_page: 36
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This marine mammal resembles a sea lion with humanlike arms and a shock of long, dark head hair. It has four claw-tipped fingers but no opposable thumb. Mermaids can reach lengths of more than 2 meters and weights of up to 350 kilograms. A fast-moving predator, the mermaid catches and rends its prey using its strong hands and talons."
    stat_block_raw: "4 6 x 4 6 — 2 / 4 3 6 4"
    initiative: "4 + 1 D6"
    attacks: "6S"
    powers_raw: "Enhanced Physical Attributes (Quickness, once per day, for [Essence]D6 turns), Enhanced Senses (Hearing)"
    weaknesses_raw: "Dietary Requirement (Mercury)"
    notes_raw: ""
  - id: entity.critter.merrow
    name: "Merrow"
    source_page: 36
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "With its humanoid upper body, tapering torso, and slender but strong tail, the merrow vaguely resembles the mermaids of classic fairy tales. Its long forelimbs end in three-fingered hands with opposable thumbs. A long mane covers its neck, and a series of extended spinal vertebrae runs the length of the torso. Despite the dermal bone that armors its lower body, the merrow's tail is remarkably flexible. They are known to use simple"
    stat_block_raw: ""
    initiative: "5 + 1 D6"
    attacks: "Humanoid"
    powers_raw: "Some have Magical Skills."
    weaknesses_raw: ""
    notes_raw: ""
  - id: entity.critter.naga
    name: "Naga"
    source_page: 36
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The naga is a large serpent 10 meters long, but with an enlarged, blunt head. Coloration varies but is almost always a multicolored pattern that fades toward the pale underbelly. Naga become inactive in periods of extreme heat or cold. They eat small mammals and live in rocky crevices or human-built structures. Normally solitary, nagas may be found in groups of up to two dozen. The longest-lived specimen in captivity is 32 years old."
    stat_block_raw: "5 / 1 2 x 3 6 3 3 4 8Z 4"
    initiative: "4 + 1D6"
    attacks: "5M, -1 Reach"
    powers_raw: "Guard, Magical Skills (Sorcery), Venom"
    weaknesses_raw: ""
    notes_raw: ""
  - id: entity.critter.nature-spirits
    name: "Nature Spirits"
    source_page: 37
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Nature spirits are the embodied forces of nature and of place; they are spirits of the shamanic tradition. There are four classes of nature spirits: Spirits of the Land (forest, mountain, desert, prairie), Spirits of the Waters (sea, lake, river, swamp), Spirits of the Sky (storm, mist), and Spirits of Man (city, field, hearth). Nature spirits rarely appear in any fixed form. When they do materialize, it is often in a form that reflects their home terrain. If"
    stat_block_raw: "F+ 1 (F+2)x 4 F- 2 F F F (F)A F +1"
    initiative: "F + 11 + 1D6"
    attacks: "(F - 2)M"
    powers_raw: "Accident, Concealment, Confusion, Fear, Guard, Materialization, Search Field Spirit Powers: Accident, Concealment, Guard, Materialization,"
    weaknesses_raw: ""
    notes_raw: ""
  - id: entity.critter.nimues-salamander
    name: "Nimue's Salamander"
    source_page: 37
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Mainly a land dweller, this small, tailed amphibian measures 15 centimeters, plus a 10-centimeter tail, and weighs .15 kilograms. It is black with an irregular yellow patch between its eyes, a yellow streak on its underbelly, and wide orange stripes running along its side and the dorsal surface of its tail. Nimue's salamander is in increasing use as a guard animal."
    stat_block_raw: "1 3 x 2 0 — 1 / 2 2 6Z 2 3 7"
    initiative: "2+ 1D6 Attacks: 1L,-2 Reach"
    attacks: "1L,-2 Reach"
    powers_raw: "Magic Sense"
    weaknesses_raw: "Vulnerability (Poisons)"
    notes_raw: "Nimue's salamander also uses a special Magical Drain power: if a magician casts a spell within Essence x 2 meters of the salamander, the"
  - id: entity.critter.nomad
    name: "Nomad"
    source_page: 38
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "A mental parasite, the nomad is an astral being that \"possesses\" victims, forcing them into a homicidal rage. Once the victim kills, the nomad feeds off the dying creature's Essence. It appears on the physical plane only when attacking, materializing as an amorphous patch of darkness about half a meter across. When assensed on the astral plane, the nomad appears as an amoeboid creature of impenetrable blackness, roughly 1.5 meters across."
    stat_block_raw: "F - 3 (F-6) x 3 — F - 3 F - 3 F - 3 (7+2D6)A F - 4"
    initiative: "F + 6+ 1D6"
    attacks: "Special"
    powers_raw: "Compulsion (Special: Homicidal Mania), Essence Drain (Modified), Immunity (Normal Weapons), Materialization, Possession"
    weaknesses_raw: ""
    notes_raw: "To attempt possession, the nomad must be at melee range. Make"
  - id: entity.critter.nosferatu
    name: "Nosferatu"
    source_page: 38
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Nosferatu are humans infected with the Bruckner-Langer strain of HMHVV. Like vampires, they consume blood to live but need significantly less. They share vampires' allergy to sunlight and are almost exclusively nocturnal. They also share the ability to create minions, though few of them bother to do so. Highly intelligent and more rational than the average vampire, nosferatu are frequently able to outthink their enemies."
    stat_block_raw: "4 3 x 5 4 5 5 5 (5+2D6)Z 4"
    initiative: "4+ 1D6"
    attacks: "Humanoid"
    powers_raw: "Compulsion, Enhanced Physical Attributes (Body and Strength, twice per day each, for [Essence]D6 turns), Enhanced Senses (Improved Hearing, Low-Light Vision, Thermographic Vision), Essence"
    weaknesses_raw: "Allergy (Sunlight, Severe), Essence Loss (1 point per 1D6 + 1 months)"
    notes_raw: "Nosferatu begin as characters, so they retain most of the characters' Attributes. The Attributes listed are the minimum Attributes a nosferatu can have (with the exception of Essence, which has a"
  - id: entity.critter.nova-scorpion
    name: "Nova Scorpion"
    source_page: 38
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Approximately 1 meter long, the nova scorpion has a goldcolored body and large pincers. Its tail ends in a large stinger. Several species of scorpions inhabit the same area as the nova scorpion, but they are all much smaller and paler with smaller stingers."
    stat_block_raw: "5 4 x 4 3 — 3 / 5 5 6 4"
    initiative: "4+ 1D6"
    attacks: "5M"
    powers_raw: "Concealment (Self Only), Venom"
    weaknesses_raw: ""
    notes_raw: "The venom's Damage Code is (Essence)D Physical, with an onset time of 1 hour. An antitoxin is available for 150¥ per dose."
  - id: entity.critter.nutria
    name: "Nutria"
    source_page: 38
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "A possum-sized rodent with sharp orange teeth and a vicious disposition, nutria can be found throughout New Orleans and the surrounding area—as common as rats are elsewhere. They usually attack in packs of up to thirty, preying on other animals and even small or helpless humans and metahumans."
    stat_block_raw: "1 3 x 3 1 — 1 / 3 1 6 4"
    initiative: "4 + 1D6"
    attacks: "5L"
    powers_raw: "Concealment (Self Only), Immunity (Pathogens, Poisons) 3 8Notes: There is a 1 in 6 chance that a nutria has the Pestilence power (VITAS-3)."
    weaknesses_raw: ""
    notes_raw: "There is a 1 in 6 chance that a nutria has the Pestilence power (VITAS-3)."
  - id: entity.critter.oracle-owl
    name: "Oracle Owl"
    source_page: 39
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The oracle owl stands 90 centimeters tall and weighs 6.5 kilograms. Its plumage is mostly light brown, with a patch of white on its chest. The delicate feathers on the edges of its wings make it virtually silent in flight. Its powerful talons and large, hooked beak are perfectly suited for dispatching its prey with a single strike. They defend their territory aggressively, using their powers of influence and animal control to compel other birds of prey in the area to fend"
    stat_block_raw: "2 5 x 2 1 4 3 / 6 3 6Z 5"
    initiative: "5 + 3D6"
    attacks: "5L"
    powers_raw: "Animal Control (Avians), Empathy, Enhanced Senses (Improved Hearing and Smell, Low-Light Vision, Tactile Sense, Thermographic Vision), Innate Spell (Special), Magic Sense, Magical"
    weaknesses_raw: "Vulnerability (Poisons)"
    notes_raw: "The oracle owl can use any detection spells (gamemaster's discretion) with its Innate Spell power. Quickness multiplier for flying is 6."
  - id: entity.critter.pegasus
    name: "Pegasus"
    source_page: 39
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This winged horse stands just under 2 meters at the shoulder and has an average wingspan of 7.5 meters. Most are white or roancolored; a few are black. Primarily a land creature, the pegasus flies for short bursts of 10 to 20 minutes, generally to escape threats or bypass obstacles. Despite the difficulties of capturing these creatures, there is a sizable illicit market for young pegasi. They cannot interbreed with common horses."
    stat_block_raw: "9 4 x 6 7 — 2 / 5 3 6 5"
    initiative: "5 + 1D6"
    attacks: "6S, +1 Reach"
    powers_raw: "Enhanced Reactions (three times per day for [Essence]D6 turns)"
    weaknesses_raw: "Dietary Requirement (Citric acid)"
    notes_raw: "Quickness multiplier for flying is 8."
  - id: entity.critter.peryton
    name: "Peryton"
    source_page: 39
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The peryton is a winged deer, just over a 1.5 meters tall at the shoulder, with an average wingspan of 5.5 meters. Both males and females sport antlers, though the male's set is larger. Unusual for a deer, the peryton has large incisor teeth. Omnivorous, it has been known to hunt down small or injured humans and metahumans. Perytons attack by swooping down on their prey and knocking it over with their antlers. The beast then tears at its victim with its heavy"
    stat_block_raw: "8 4 x 5 7 — 2 / 4 3 6 5"
    initiative: "5 + 2D6"
    attacks: "7S, +1 Reach"
    powers_raw: "Accident, Enhanced Senses (Depth Perception), Silence"
    weaknesses_raw: ""
    notes_raw: "Listed Damage Code refers to antler strike. For stomping or biting attacks, use Damage Code 4S. Quickness multiplier for flying is 7."
  - id: entity.critter.phoenix
    name: "Phoenix"
    source_page: 39
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This large bird has a 4-meter wingspan and a 2-meter-long tail, usually a glittering array of azure shades. Its crested head sports gold plumage, and its body feathers are iridescent red and purple. Phoenix feathers are prized in many parts of the world, leading to a growing industry in poaching."
    stat_block_raw: "3 4 x 4 4 — 2 / 4 2 6Z 3"
    initiative: "3 + 1D6"
    attacks: "4M"
    powers_raw: "Flame Aura"
    weaknesses_raw: ""
    notes_raw: ""
  - id: entity.critter.piasma
    name: "Piasma"
    source_page: 39
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This non-territorial carnivore descended from the black bear can reach a height of 1.5 meters at the shoulder, a length of 3 meters, and a weight of more than 600 kilograms. The plasma prefers its prey alive, but it often survives by scavenging the garbage metahumans leave behind."
    stat_block_raw: "11/ 2 4 x 5 13 — 2 / 4 4 6 4"
    initiative: "4 + 2D6"
    attacks: "9D, +1 Reach"
    powers_raw: "Enhanced, Physical Attributes (Strength or Quickness, once per day each, for [Essence x 2D6 turns], Enhanced Reaction, Enhanced Senses (Thermographic Vision, Wide-Band Hearing)"
    weaknesses_raw: "Allergy (Sunlight, Nuisance)"
    notes_raw: ""
  - id: entity.critter.protean
    name: "Protean"
    source_page: 39
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "In its amorphous form, the protean is a mass of cells (resembling dysentery bacteria) weighing as little as half a kilo and as much as 125 kilograms. It hunts by concealing or disguising itself, luring its prey into range, and then engulfing it and destroying it with corrosive secretions. Proteans can assume the outward form of any creature they have engulfed and absorbed."
    stat_block_raw: "Sp 3 x 2 Sp — 0 / 2 2 4 2"
    initiative: "2 + 1D6"
    attacks: "Special"
    powers_raw: "Adaptive Coloration, Corrosive Secretions, Engulf"
    weaknesses_raw: "Vulnerability (Alkaline chemical weapons, EM weapons, Hydrophobics, Fire)"
    notes_raw: "Attributes noted as Sp are determined using the following special rules. Proteans that weigh less than 10 kilos have a Body Rating of 0, 1 for proteans between 10 and 40"
  - id: entity.critter.quicksilver-mongoose
    name: "Quicksilver Mongoose"
    source_page: 40
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The solitary quicksilver mongoose, a small subtropical relative of European weasels and martens, measures 1.05 meters and weighs 3.5 kilograms. Covered with gray-brown fur, this primarily nocturnal hunter relies on speed, agility and its hypnotic dancing ability to capture its prey."
    stat_block_raw: "1 7 x 4 1 — 2 / 5 3 6 5"
    initiative: "5 + 3D6"
    attacks: "3L, -1 Reach"
    powers_raw: "Accident, Confusion, Desire Reflection, Hypnotic Dance (treat as the Hypnotic Song power except for LOS range), Immunity (Poisons, wholly immune to snake venom; see below), Movement"
    weaknesses_raw: "Dietary Requirement (Snake Venom and Hepatic Enzymes)"
    notes_raw: "Increase the Damage Code for the attack to 5D if the target is"
  - id: entity.critter.rockworm
    name: "Rockworm"
    source_page: 40
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The rockworm is a pallid, fleshy-looking worm that can reach 2 meters in length, with a mouth full of grinding teeth and horny plates that vaguely resemble a bit for drilling oil. It burrows into and digests stone, grinding the rock to dust and mixing it with corrosive saliva. If attacked, a rockworm can inflict serious injury with its mouth plates and acidic secretions."
    stat_block_raw: "2 / 1 4 2 — 1 / 2 3 3 2"
    initiative: "2 + 1D6"
    attacks: "2M"
