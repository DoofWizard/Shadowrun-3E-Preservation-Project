    notes_raw: "Flying multiplier is 4."
  - id: entity.critter.troglodyte
    name: "Troglodyte"
    source_page: 46
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Troglodytes are slender, omnivorous bipeds that rarely exceed a height of 1.6 meters. They have large heads and eyes and no hair. They live in loosely knit bands of up to 50 individuals and normally feed off subterranean creatures. The troglodyte's intelligence is unknown but is at least equal to that of primates."
    stat_block_raw: "3 3 x 4 2 2 3 / 4 3 6 3"
    initiative: "3 + 1D6"
    attacks: "Humanoid"
    powers_raw: "Concealment, Enhanced Senses (Thermographic Vision)"
    weaknesses_raw: "Allergy (Sunlight, Mild)"
    notes_raw: ""
  - id: entity.critter.tungak
    name: "Tungak"
    source_page: 46
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Known by many different names to different ethnic groups, the tungak is commonly regarded by Siberians as a sickness spirit responsible for causing all colds, diseases, and infections."
    stat_block_raw: "F - 4 F x 3 F - 4 F - 4 F F F/A F"
    initiative: "F+ 10 + 1D6"
    attacks: "(F)S, +1 Reach"
    powers_raw: "Blindness, Immunity (Cold, Normal Weapons, Pathogens, Poisons), Noxious Breath, Pestilence (see below), Shadow Cloak"
    weaknesses_raw: ""
    notes_raw: "The tungak's Pestilence power may be used to infect the target with any disease the gamemaster desires, including VITAS-3. Some tungak may have one or more of these additional powers:"
  - id: entity.critter.unicorn
    name: "Unicorn"
    source_page: 46
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "A unicorn resembles a horse with a single, spiral horn in the middle of its forehead and a flowing mane and tail. It stands 1.5 meters tall at the shoulder and weighs 370 kilograms. Unicorn horns are prized in many parts of the world for medicinal and magical purposes."
    stat_block_raw: "8 5 x 6 8 — 3 / 4 4 9Z 5"
    initiative: "5 + 1 D6"
    attacks: "8M, +1 Reach"
    powers_raw: "Immunity (Pathogens, Poisons), Magical Guard"
    weaknesses_raw: "Allergy (Pollutants, Moderate)"
