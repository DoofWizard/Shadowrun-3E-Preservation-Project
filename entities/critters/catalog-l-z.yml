  - id: entity.critter.shapeshifter
    name: "Shapeshifter"
    source_page: 42
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Shapeshifters appear as large, well-formed members of an animal species. They have the innate magical ability to assume a human form, which typically retains vestiges of the creature's bestial nature. Viewing a shapeshifter in astral space reveals its true nature. Contrary to myths, shapeshifters are not influenced by the cycles of the moon, nor are they humans able to turn into animals. They do demonstrate a moderate allergic reaction to silver. Shapeshifters follow the normal habits of their a"
    stat_block_raw: "5 4 x 5 5 3 3 3 8Z 4"
    initiative: "4 + ID6"
    attacks: "Humanoid"
    powers_raw: "Enhanced Physical Attributes (in animal form), Regeneration."
    weaknesses_raw: "Allergy (Silver, Moderate), Vulnerability (Silver)"
    notes_raw: "When a shapeshifter is in animal form, use the normal animal attributes (see p. 19) designated A, and add the modifiers. The only animal shapeshifter types known are those listed above. Some may"
  - id: entity.critter.shasta-deer
    name: "Shasta Deer"
    source_page: 43
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Shasta deer greatly resemble ordinary mule deer. Adults are about 2 meters long; their color varies from reddish-brown in the summer to bluish-gray in the winter, with a white rump patch and a black-tipped tail. Males have branched antlers, rather than tines extending from a single antler. Fawns are spotted. According to rumor, they have a clear but undefined link with nature spirits; they also appear highly intelligent and seem to remember those who treat"
    stat_block_raw: "6 8 x 3 6 — 5 / 8 4 6Z 7"
    initiative: "7 + 2D6"
    attacks: "5M, +1 Reach"
    powers_raw: "Any given Shasta deer has up to three of the following: Concealment, Empathy, Enhanced Reaction, Fading, Magical Guard, Magical Sense, Magical Skills, Masking, Movement"
    weaknesses_raw: ""
    notes_raw: "The Shasta deer are mysterious critters. They may even be spirits of the forest, free spirits, or shapechangers, if the gamemaster desires."
  - id: entity.critter.siberian-bee
    name: "Siberian Bee"
    source_page: 43
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "Bee-keeping was historically practiced by several Siberian ethnic groups, but the practice had nearly died out when the Awakening mutated a new, larger bee with a preference for electromagnetic fields. These large bees tend to build their hives near transformers, generators and other sources of power. They are able to perform a sort of group-based electrical attack."
    stat_block_raw: "2 5 x 3 1 — 1 / 3 2 6 5"
    initiative: "5 + 2D6"
    attacks: "4M"
    powers_raw: "Enhanced Senses (Electromagnetic), Immunity (Pathogens, Poisons), Innate Spell (Lightning Bolt, see below), Venom"
    weaknesses_raw: ""
    notes_raw: "Quickness multiplier for flying is 5. Ten or more bees may take a Complex Action to launch a single Lightning Bolt innate spell. These bees may not cast again for D6 turns."
  - id: entity.critter.siberian-firebird
    name: "Siberian Firebird"
    source_page: 43
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "A larger, more potent cousin of the North American firebird, the Siberian version has golden feathers that are greatly valued as telesma material. The Siberian variety grows to a larger size (2.5-meter wingspan, 2-meter length), is carnivorous, and displays more Awakened powers. Firebirds have been known to use their Accident and Desire Reflection powers on those who seek to collect their feathers, giving firebird feathers a reputation as cursed in some circles."
    stat_block_raw: "4 6 x 3 4 — 3 / 4 3 6Z 6"
    initiative: "6 + 2D6"
    attacks: "8M"
    powers_raw: "Accident, Desire Reflection, Flame Aura, Immunity (Fire), Movement, Search"
    weaknesses_raw: ""
    notes_raw: ""
  - id: entity.critter.siren
    name: "Siren"
    source_page: 43
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "A ferocious predator that feeds on terrestrial mammals, the siren resembles a small pterodactyl, with a 2.5-meter wingspan. Hunting in flocks, sirens prefer to lair in caves in desolate mountainsides; a single lair will contain one or more small family groups. The siren can emit a high-pitched song to which some have attributed a hypnotic effect that makes the listener draw near."
    stat_block_raw: "3 8 x 2 4 — 3 / 5 5 5Z 5"
    initiative: "5 + 1D6"
    attacks: "4M"
    powers_raw: "Enhanced Senses (Low-Light Vision), Hypnotic Song, Immunity (Pathogens, Poisons) 4 3"
    weaknesses_raw: ""
    notes_raw: ""
  - id: entity.critter.specter
    name: "Specter"
    source_page: 44
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "A specter is a hostile ghost able to affect the physical world to some degree. Specters can manifest like elementals and nature spirits, and they have various paranormal powers at their command. Many specters have some task they wish to see completed, after which they vanish forever. Other specters are driven by an apparent hatred for living things."
    stat_block_raw: "F+ 1 (F+2)x 3 F- 2 F F F (F)A F + 1"
    initiative: "F + 11 + 1D6"
    attacks: "Special"
    powers_raw: "Immunity (Normal Weapons), Materialization. Other powers vary but may include: Accident, Compulsion, Confusion, Fear, Magical Skills, Noxious Breath, Paralyzing Touch (or Howl) and Psychokinesis."
    weaknesses_raw: "Some specters exhibit an allergy to certain things significant to their living selves."
    notes_raw: "The statistics above apply to the specter in manifest form. In astral form, use Force for all tests. As long as the person or object anchoring a specter to the physical world exists, the specter is"
  - id: entity.critter.spider-beast
    name: "Spider-Beast"
    source_page: 44
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "These unusual beasts, native to Amazonia, incubate inside the Brazilian kiwi fruit. They grow extremely rapidly, to an average adult length of half a meter. Their mottled brown bodies are covered with sharp spines, and each of their eight legs ends in a long, curved claw. A double set of mandibles delivers a powerful hallucinogen to anyone unlucky enough to be bitten."
