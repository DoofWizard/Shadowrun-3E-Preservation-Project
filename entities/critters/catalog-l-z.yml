    explicit_catalog_supersession: true
    description: "The omnivorous stormcrow is a large raven with a 1.5-meter wingspan. Its plumage is glossy black, its beak sharp and powerful, and its talons long and curved. The stormcrow generally congregates in huge flocks of more than 100 individuals, though it is not uncommon to see them hunting or scavenging alone."
    stat_block_raw: "2 6 x 2 1 — 3 / 4 3 6 (6Z) 4"
