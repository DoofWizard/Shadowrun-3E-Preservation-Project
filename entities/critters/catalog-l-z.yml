    explicit_catalog_supersession: true
    description: "Mainly a land dweller, this small, tailed amphibian measures 15 centimeters, plus a 10-centimeter tail, and weighs .15 kilograms. It is black with an irregular yellow patch between its eyes, a yellow streak on its underbelly, and wide orange stripes running along its side and the dorsal surface of its tail. Nimue's salamander is in increasing use as a guard animal."
    stat_block_raw: "1 3 x 2 0 — 1 / 2 2 6Z 2 3 7"
