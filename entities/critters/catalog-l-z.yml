    name: "Storm Dolphin"
    source_page: 45
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This Awakened common dolphin averages almost 3 meters in length and weighs 60 kilograms. Hostile toward humans and metahumans, these creatures use their powers to attack small vessels, shipwreck survivors and victims of air crashes. They also use their weather-affecting powers to reduce their targets' visibility and their electrical and biomagnetic manipulation abilities to affect navigational instruments."
