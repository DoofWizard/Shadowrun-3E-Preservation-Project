    name: "Talis Cat"
    source_page: 45
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "The talis cat is a rare Awakened animal that seems to shift between two forms at will: a small house cat and a fast, powerful, big cat similar to the cheetah. In reality, the cheetah form is a powerful mask spell, although the cat does gain in physical prowess when the spell is active. Preferring urban environments, the talis cat spends daylight hours in tabby form but typically switches to its larger form at night."
    stat_block_raw: "1 4 x 4 1 — 2 / 4 4 6Z 5"
    initiative: "5 + 2D6"
    attacks: "2L, -1 Reach"
    powers_raw: "Desire Reflection (Self, Cheetah Only), Enhanced Physical Attributes (Quickness, Body, and Strength; Only in cheetah \"form\"), Enhanced Reaction (Only in cheetah \"form\"), Enhanced Senses (LowLight Vision), Innate Spell (Mask), Movement (Self Only)"
    weaknesses_raw: ""
    notes_raw: "Treat Innate Spell (Mask) as a Force 12 spell. Once the power is activated, the talis cat can use the cheetah statistics."
  - id: entity.critter.thunderbird
    name: "Thunderbird"
    source_page: 45
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "A day creature, the lesser thunderbird resembles a red-brown eagle but has a wingspan of up to 3 meters. Able to generate and project an electrical field for defense, the lesser thunderbird relishes the static-charged air of electrical storms."
    stat_block_raw: "3 6 x 4 3 — 2 / 5 3 6Z 46"
    initiative: "6 + 1D6"
    attacks: "3L"
    powers_raw: "Enhanced Senses (Low-Light Vision), Innate Spell (Lightning Bolt), Weather Control (Electrical Storms) Notes: Flying multiplier is 4."
