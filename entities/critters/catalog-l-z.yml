    source_page: 44
    relation: defines_sr3_catalog_entry
    explicit_catalog_supersession: true
    description: "This Awakened bat is dull gray in color, with a long, barbed tail and a wingspan just under 1 meter. Its tail is poisonous, and its saliva contains an enzyme that calcifies any living tissue it touches. The stonebinder can spit accurately to a range of more than a meter, and its saliva will penetrate almost all types of clothing."
    stat_block_raw: "2 4 x 4 1 — 1 / 4 2 6Z 4"
