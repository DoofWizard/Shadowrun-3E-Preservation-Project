    explicit_catalog_supersession: true
    description: "This creature resembles a large heron, standing just under 3 meters tall. Its four-toed feet have retractable claws, and it also has a long, serrated beak. Among its gray wing feathers are red “arrow feathers,” which it fires at prey from the air. The stymphalian uses the feathers to track its prey, which it knocks unconscious with its toxic breath."
    stat_block_raw: "3 4 x 3 2 — 2 / 4 4 6 3"
    initiative: "3 + 1D6"
