id: catalog.critters.yotc-surge-paranormals
record_type: entity_catalog
name: "Year of the Comet SURGE Paranormals"
domain: critters
status: ingested
source: source.fanpro-10650
printed_pages: "35-41"
pdf_pages: "36-42"
entries:
  - id: entity.critter.demon-rat
    name: "Demon Rat"
    origin: "SURGE expression of devil rat"
    descriptive_traits:
      - "Larger than ordinary devil rats, commonly around 1 meter long with an additional meter of tail."
      - "Pair of short sharp horns, dark fur, high disease/poison resistance and corrosive saliva."
      - "More predatory, organized and aggressive than ordinary devil rats; dexterous hands can manipulate simple mechanisms."
  - id: entity.flora.glomoss
    name: "Glomoss"
    origin: "Awakened/SURGE moss variation"
    descriptive_traits:
      - "Dual-natured flora sensitive to astral magical activity."
      - "Glows luminescent green when it detects astral activity or mana concentration."
      - "Used as low-cost astral security/detection, sometimes paired with cameras/light sensors."
      - "Vulnerable to mana magic and detects wards, bound spirits or other astral constructs that approach closely."
  - id: entity.critter.horned-bear
    name: "Horned Bear"
    origin: "SURGE bear variant"
    descriptive_traits:
      - "Very large bear, reported around 4 meters tall when erect, with curled ram-like horns and dark fur."
      - "Dual-natured; unusually fast, strong and resilient."
      - "Territorial behavior includes a challenge display before attack."
  - id: entity.critter.night-manta
    name: "Night Manta"
    origin: "Awakened manta-ray variant"
    descriptive_traits:
      - "Airborne nocturnal hunter rather than aquatic."
      - "Uses magical levitation; approximately 1.8 meters long with wingspan approaching 3 meters."
      - "Jet-black coloration, tail stinger with virulent venom, rows of sharp teeth."
      - "Dual-natured but described as showing little interest in astral forms of magicians or spirits."
  - id: entity.flora.sangre-del-diablo
    name: "Sangre del Diablo"
    translation: "Blood of the Devil"
    origin: "SURGE variant related to Sangre del Drago"
    descriptive_traits:
      - "Huge carnivorous tree, reported up to roughly 40 meters."
      - "Magically compels nearby victims, envelops them and uses corrosive sap to dissolve prey."
      - "Porous wood is unusually durable; source describes resistance to conventional removal and magical effects."
  - id: entity.critter.shambler
    name: "Shambler"
    origin_status: "Initially speculated SURGE ghoul/goblin variant; source states captured specimens are not HMHVV-infected."
    descriptive_traits:
      - "Pale nocturnal creature around 1.4 meters tall and 150 kg with four near-sighted eyes."
      - "Produces extremely sticky neck/chest secretion to immobilize prey."
      - "Builds an external shell from corpses and secretions; feeds through vein-like structures connected to the shell."
      - "Shell hardens into a resinous armored mass; source suggests possible asexual reproduction by shedding a shell to an offspring."
surge_nature_notes:
  - "SURGE expression also occurs in ordinary fauna, flora and insects; effects can be individual rather than species-wide."
  - "Researchers use 'Novo' in nomenclature for identified SURGE variants."
  - "The chapter gives descriptive ecology but defers formal game statistics to later Game Information."
sources:
  - {source: source.fanpro-10650, printed_pages: "35-41", pdf_pages: "36-42", relation: defines_entities}
