data:
  publication:
    title: Year of the Comet
    publisher: FanPro
    catalog_number: FanPro10650
    edition: Shadowrun Third Edition
  name: Year of the Comet SURGE Paranormals
  domain: critters
  entries: &id001
  - id: entity.critter.demon-rat
    name: Demon Rat
    origin: SURGE expression of devil rat
    descriptive_traits:
    - Larger and more organized than ordinary devil rats; hunts in swarms and can
      direct mundane/devil rats.
    intrinsic:
      stat_block:
        body: 5/4
        quickness: 6 x 3
        strength: 5
        charisma: 5
        intelligence: 4/6
        willpower: 4
        essence: 6Z
        reaction: 6
      initiative: 6 + 2D6
      attacks: 6M
      powers:
      - Animal Control (Mundane Rats, Devil Rats)
      - Concealment (Personal)
      - Corrosive Saliva
      - Immunity (Pathogens, Poisons)
      weaknesses:
      - Allergy (Sunlight, Moderate)
      notes:
      - 1 in 6 chance of Pestilence (VITAS-3); infected rats are immune to the virus
        and act as carriers.
      - 1 in 6 chance of Regeneration.
      swarm_behavior:
        smaller_swarm:
          size_less_than: 12
          tendency: Hunts stealthily, using the concealment powers of devil rats and
            demon rats.
        larger_swarm_tendency: Often attacks collectively, relying on numbers.
        rule_kind: Encounter behavior, not a fixed modifier or compulsory action.
  - id: entity.flora.glomoss
    name: Glomoss
    origin: Awakened/SURGE moss variation
    descriptive_traits:
    - Dual-natured astral alarm moss that glows when it senses astral magical activity.
    intrinsic:
      force_rated: true
      force_limit: Force may not exceed area in square meters x 5.
      powers:
      - Magic Sense (astral plane only)
      weaknesses:
      - Dietary Requirement (Water)
  - id: entity.critter.horned-bear
    name: Horned Bear
    origin: SURGE bear variant
    descriptive_traits:
    - Large territorial bear with a ritualized challenge response.
    intrinsic:
      stat_block:
        body: 13/6
        quickness: 6 x 4
        strength: 13
        charisma: null
        intelligence: 4/6
        willpower: 5
        essence: 6Z
        reaction: 5
      initiative: 5 + 2D6
      attacks:
      - 10M Stun without claws
      - 13S Physical with claws
      - +2 Reach
      powers:
      - Enhanced Physical Attribute (Strength)
      - Enhanced Reactions
      behavior_rule:
      - If the ritual single-opponent melee challenge is violated by multiple attackers,
        ranged weapons or offensive spells, it activates enhanced abilities and fights
        to the death.
      dual_natured: true
      challenge_trigger:
        condition: A creature the bear regards as threatening enters its designated
          territory.
        territory_entry_planes:
        - physical
        - astral
        response: Issues a ritual combat challenge.
        resolution_record: rule.critters.yotc-glomoss-horned-bear-exceptions-p144
  - id: entity.critter.night-manta
    name: Night Manta
    origin: Awakened manta-ray variant
    intrinsic:
      stat_block:
        body: 6
        quickness: 6 x 4
        strength: 6
        charisma: null
        intelligence: 4/4
        willpower: 4
        essence: 6
        reaction: 5
      initiative: 4 + 1D6
      attacks: 8M
      powers:
      - Innate Spell (Levitate)
      - Shadow Cloak
      - Silence
      - Venom (6S, Speed 1 Combat Turn)
      dual_natured: true
      hunting_behavior: Typically hunts silently from above with its sting; often
        surprises prey. No additional automatic surprise modifier is specified.
  - id: entity.flora.sangre-del-diablo
    name: Sangre del Diablo
    translation: Blood of the Devil
    origin: SURGE variant related to Sangre del Drago
    intrinsic:
      stat_block:
        body: 16/8
        quickness: 5 x 0
        strength: 14
        charisma: null
        intelligence: 2/5
        willpower: 6
        essence: 8
        reaction: 3
      initiative: 3 + 1D6
      powers:
      - Compulsion
      - Corrosive Secretions
      - Engulf
      - Immunity (Fire)
      - Magical Guard
      notes:
      - Treat Engulf as sludge engulf (Critters p.9).
      hunting_behavior: Uses Compulsion to attract prey; when close enough, uses Engulf.
        No special numeric range is supplied in this profile.
  - id: entity.critter.shambler
    name: Shambler
    origin_status: Initially speculated SURGE ghoul/goblin variant; captured specimens
      are not HMHVV-infected.
    intrinsic:
      stat_block:
        body: 4/*
        quickness: 5 x 3
        strength: 6
        charisma: 1
        intelligence: 4/5
        willpower: 5
        essence: 6
        reaction: 5
      initiative: 5 + 1D6
      attacks: 4M
      powers:
      - Engulf
      - Hardened Armor
      - Innate Spell (Glue)
      - Paralyzing Touch
      weaknesses:
      - Allergy (Sunlight, Severe)
      shell_growth:
        armor_gain: Gain 1 point of armor for every 6 points of Body added to the
          shell.
        reproduction_threshold: At 13 points of armor, sheds shell and produces a
          new shambler.
        per_4_armor_modifiers: +2 Body, -1 Quickness, -1 Reaction.
      hunting_behavior: Uses Glue to immobilize prey, then approaches and uses Paralyzing
        Touch before attaching the prey to its shell. Apply the existing powers; this
        description specifies no extra test or fixed interval.
  surge_nature_notes: &id002
  - SURGE expression also occurs in fauna, flora and insects; effects can be individual
    rather than species-wide.
  - Researchers use 'Novo' in nomenclature for identified SURGE variants.
  - Formal game statistics are defined in Game Information pp.143-145.
  sources: &id003
