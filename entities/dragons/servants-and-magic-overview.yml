id: reference.dragons.servants-and-magic-overview
record_type: reference
name: "Dragon Servants and Magic Overview"
domain: dragons
status: ingested
servants:
  drakes:
    - "Original drakes were magically created servants bound to dragon creators."
    - "Later bred drake lines reproduced naturally; Sixth World descendants may awaken from metahuman form into drake heritage."
    - "Only great dragons and very few adult dragons are said to know the creation process; modern created/non-breeding drakes remain tightly controlled by their masters."
  spirits:
    - "Dragons commonly summon and command spirits and may cultivate recurring relationships with particular spirits."
    - "Ally spirits are described as rare among dragons."
    - "Great dragons may possess true names of free spirits and use them as powerful but potentially resentful servants."
  awakened_creatures:
    - "Some dragons employ Awakened creatures as guards/servants through magic, bargaining, protection or territory."
    - "Rhonabwy, Hualpa and Mujaji are identified as notable users of Awakened-creature servants."
  other_dragons:
    - "Adult dragons may pledge service to a great dragon in relationships resembling lord/vassal or teacher/student arrangements."
    - "Naheka is cited as a feathered serpent sworn to Ryumyo."
  metahumans:
    - "Metahumans are widely used as deniable, inconspicuous and specialized operatives."
    - "Dragons also influence or employ organizations ranging from policlubs and criminal groups to governments and megacorporations."
magic_overview:
  evidentiary_status: "In-world Talon commentary/observation rather than the later formal Game Information rules."
  observations:
    - "Magic is described as common and possibly universally learnable among dragons; great dragons are portrayed as exceptionally powerful magicians."
    - "Some magical knowledge appears instinctive; dragons also teach one another telepathically."
    - "Draconic magical practice is described as a distinct tradition predating modern metahuman paradigms."
    - "Observed dragons summon elementals, nature spirits, watchers and other spirit types."
    - "Dragons, especially great dragons, commonly favor power sites for lairs, which may be aspected in their favor."
  canonical_rule_links:
    - rule.dragons.magic
    - rule.magic.power-sites
    - rule.magic.aspected-power
sources:
  - {source: source.fanpro-10666, pages: "20-23", relation: defines_overview}
notes:
  - "Formal mechanical values are taken from the later Game Information chapter, not inferred from this in-world commentary."
