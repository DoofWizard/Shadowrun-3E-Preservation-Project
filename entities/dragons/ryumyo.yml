status: ingested
intrinsic:
  classification: "great eastern dragon"
  sex: "male"
  coloring: "gold with a white underbelly, black scales, and red-tipped horns"
  metahuman_forms:
    - "uses nondescript forms for major metahuman races; no stable public identity"
