profile:
  - "Awakened publicly in Japan in 2011 and became a major hidden influence in Japanese political, criminal and magical affairs."
  - "Was raised and instructed by Lung in an earlier age; their later break developed into a long-running rivalry."
  - "Treats the Ring of Fire's dragon-line network as a source of magical power and strategic influence."
  - "Uses selected Yakuza organizations, spirits, political agents and corporate connections rather than controlling all Yakuza."
  - "Maintains strong influence in Japan and varying interests around the Pacific Rim, including Hawai'i, western North America, Peru and other Ring of Fire regions."
