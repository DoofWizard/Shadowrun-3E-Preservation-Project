    profile: "Public-facing, thrill-seeking adult dragon known for metahuman social activity, travel and high-risk recreation."
  - id: world.character.dzitbalchen
    name: "Dzitbalchen"
    type: "adult feathered serpent"
    pages: "162"
    profile: "Feathered serpent involved in Aztlan/Yucatan affairs and resistance to Aztechnology policy."
  - id: world.character.eliohann
    name: "Eliohann"
    type: "adult western dragon"
    pages: "162-164"
