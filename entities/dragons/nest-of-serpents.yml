  - id: world.character.nebelherr
    name: "Nebelherr"
    type: "adult western dragon"
    pages: "168-169"
    profile: "Bavarian dragon with a relatively sociable public reputation, intelligence interests and historical involvement in the Kaltenstein conflict."
  - id: world.character.perianwyr
    name: "Perianwyr"
    type: "adult western dragon"
    pages: "169-171"
    profile: "Denver-associated dragon, former shadowrunner and passionate music patron; inherited a major music collection from Dunkelzahn."
  - id: world.character.pobre
    name: "Pobre"
    type: "adult feathered serpent"
    pages: "171"
    profile: "Yucatan rebel-associated feathered serpent whose condition and methods are reported as increasingly erratic; toxic-magic claims remain disputed."
  - id: world.character.schwartzkopf
    name: "Schwartzkopf"
    type: "great western dragon"
    pages: "171-173"
    profile: "Prague-based academic great dragon, lecturer and patron of magical scholarship; closely associated with development and promotion of Unified Magic Theory."
  - id: world.character.sirrurg
    name: "Sirrurg"
    type: "great western dragon"
    pages: "173-174"
    profile: "Highly violent great dragon associated with attacks on corporate/government targets and terror activity; earlier ties to Amazonia are noted."
  - id: world.character.tjurjunga
    name: "Tjurjunga"
    type: "adult dragon, type unknown"
    pages: "174"
    profile: "Reclusive Australian dragon linked to Aboriginal magical interests and the Outback; strongly defensive of territory and privacy."
notes:
  - "This catalog preserves source-period claims and uncertainty. Rumors are not promoted to confirmed status."
  - "The section explicitly notes that many other adult dragons exist beyond those listed."
