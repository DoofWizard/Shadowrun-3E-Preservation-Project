profile:
  - "Emerged from the Watergate/Dunkelzahn astral rift in DeeCee on 24 December 2061 and flew west."
  - "Manifested physically in Denver and launched a targeted campaign against Aztlan, corporate, political and military targets across the Front Range Free Zone."
  - "By 27 January 2062 forced a new political settlement in Denver and assumed ultimate authority over the Front Range Free Zone."
  - "Allowed sector governments and the Council of Denver to continue day-to-day administration subject to his authority and veto."
  - "Expelled Aztlan from Denver; the former Aztlan sector passed to CAS control."
  - "Exercises authority through the Zone Defense Force, Council of Denver, Nicholas Whitebird and other agents while also employing spirits and shadow assets."
  - "The sources contain extensive speculation about identity, lineage, losses, secret meetings and motives; those claims remain attributed rather than asserted."
