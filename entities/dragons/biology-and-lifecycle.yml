id: reference.dragons.biology-and-lifecycle
record_type: reference
name: "Dragon Biology and Lifecycle"
domain: dragons
status: ingested
taxonomy:
  class: Reptilia
  subclass: Herpetavia
  orders:
    Tetrasauria:
      genera:
        Draco:
          - {species: "D. orientalis", common_name: "eastern dragon"}
          - {species: "D. occidentalis", common_name: "western dragon"}
    Alatophidia:
      genera:
        Alatuserpens:
          - {species: "A. quetzalcoatlus", common_name: "feathered serpent"}
          - {species: "A. pili americanus", common_name: "North American wyvern", transcription_confidence: "medium; species epithet from scan OCR"}
    Magnavaranus:
      genera:
        Neovaranus:
          note: "Firedrakes and icedrakes were reclassified from Draco into Neovaranus in 2058."
physiology:
  size:
    adult_length: "Approximately 20 m for feathered serpents to nearly 40 m for western dragons; tail is roughly half total length."
    adult_mass: "Several tonnes."
    great_dragons: "Usually at least half again as large as regular adult counterparts."
  anatomy:
    - "Dexterous paws with opposable digits."
    - "Western dragons have forelimbs, hindlimbs and wings."
    - "Eastern dragons and sirrush have forelimbs and hindlimbs but no wings."
    - "Feathered serpents have wings and hindlimbs."
    - "Typical wingspan is about 15-30 m and approximately three-quarters total body length."
    - "Draco species possess keratinous scales/scutes; some develop hard bony plates."
    - "Dragon eggshell structural material is keratinoid fiber related to dragon scale."
    - "Natural weapons include teeth, talons and commonly a tail barb; some individuals possess flaming or toxic breath."
    - "Dragons are incapable of ordinary vocalization but possess acute hearing, sight and smell."
  metabolism:
    - "Warm-blooded and capable of metabolic thermoregulation."
    - "Reptilian two-chambered heart is supplemented by an auxiliary contractile pump on the aorta serving flight muscles."
    - "Can digest and metabolize most biological matter."
    - "Draco species can lift scales to trap insulating air; feathered-serpent plumage provides insulation."
  flight:
    - "Wing anatomy includes crescent shape, controllable leading-edge scales and muscular trailing edges for airflow/shape control."
    - "The source treats draconic flight as requiring subconscious or unconscious magical assistance in addition to aerodynamics."
ecology:
  diet: "Primarily animal protein, but dragons can subsist omnivorously."
  territory: "Large hunting territories help prevent local prey depletion."
  reproduction_rate: "Source assumes a relatively slow reproductive rate, consistent with long lifespan."
reproduction:
  mating:
    - "No fixed mating season; an adult female may choose to conceive at any time."
    - "Female chooses a male primarily for qualities such as intelligence and wisdom."
    - "Mating may last days and can resemble combat to observers."
    - "Pair does not remain mated for life."
  eggs:
    clutch: "Three or four speckled eggs."
    initial_size: "Approximately 30 cm long."
    caregiver: "Female entrusts clutch to a chosen great dragon rather than tending it herself."
    incubation: "Great dragon maintains a warm hidden environment; multiple clutches/dozens of eggs may be kept together using geothermal heat, magic or technology."
    growth: "Eggs grow to more than 1 m before hatching."
    imprinting: "Caretaker telepathically teaches and shapes hatchlings while still in the egg."
    phenotype: "Hatchling takes the physical dragon type of its caregiver rather than its genetic parents."
    duration_evidence:
      status: "reported estimate, not established fact"
      detail: "Shadowtalk cites Universal Omnitech shell analysis suggesting roughly 50 years of egg growth, with possible longer incubation."
  hatchlings:
    - "Over 3.5 m long at birth, serpent-like, with wings, stubby hind legs and no forelimbs."
    - "Tail ends in a poisonous barb."
    - "Use fiery breath to weaken/break the eggshell; failed hatching can be fatal."
    - "Need instruction in hunting, magic, social custom and etiquette."
development:
  adolescence: "Physical and mental adulthood takes several centuries; adolescents are described as territorial, obsessive and more volatile than adults."
  adulthood: "Adolescent returns to hatching place and undergoes a magically assisted metamorphosis into adult species form; afterward no longer under caregiver authority."
  great_dragon: "Great dragonhood is described as a later, distinct life stage beyond ordinary adulthood; exact transition is unknown."
  lifespan: "Exact maximum unknown; dragons live at least centuries and likely millennia."
reported_sites:
  madagascar_egg_repository:
    status: "shadowtalk report / unverified"
    detail: "A runner report describes a deep Madagascar cave repository with dozens or hundreds of eggs guarded by a female great feathered serpent nicknamed Fanany."
sources:
  - {source: source.fanpro-10666, pages: "10-17", relation: defines_overview}
notes:
  - "Main-text Foundation/parazoology statements are separated from explicitly speculative or shadowtalk-only claims."
