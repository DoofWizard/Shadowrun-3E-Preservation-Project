id: reference.dragons.culture-hoards-and-lairs
record_type: reference
name: "Dragon Culture, Communication, Hoards and Lairs"
domain: dragons
status: ingested
culture:
  etiquette:
    - "Draconic society relies heavily on formal etiquette to acknowledge rank and prevent conflict."
    - "Ritualized custom covers greeting, parting, mating, raising young, communication, conflict resolution, spirituality, magic, life and death."
    - "Dragons generally avoid using one another's familiar public names in direct formal address; indirect titles may be used instead."
  loremaster:
    - "Dragons preserve accumulated knowledge in magical memory crystals rather than primarily in books."
    - "One dragon holds the formal role of Loremaster and safeguards a collective store of dragonkind's knowledge."
    - "Dunkelzahn was Loremaster for this age; his death and unconventional succession triggered a major draconic contest."
communication:
  - "Dragons use modern telecom/Matrix tools indirectly, spirit messengers and astral projection as circumstances require."
  - "Because ordinary draconic anatomy cannot vocalize metahuman speech, dragons commonly rely on interpreters."
  - "Dragons can communicate telepathically; electronic channels do not directly carry the telepathic exchange."
  - "Dragons also use an elaborate body-language system of posture and pose conveying agreement, submission, challenge and relationship."
matrix_context:
  - "Most dragons use the Matrix at least indirectly."
  - "Common access methods include a metahuman form with trodes, custom natural-form interfaces, or telepathically riding with a metahuman decker."
hoards:
  - "A hoard is not merely wealth: individual objects serve as personally significant mnemonic anchors tied to events and memories."
  - "Memory crystals may constitute part of a dragon's hoard."
  - "Dragons also hoard information and maintain extensive data/intelligence collections."
lairs:
  - "Most dragons maintain more than one lair."
  - "Common sites include mountains, caves, undersea grottoes, volcanoes and metahuman residences for dragons using metahuman form."
  - "Lairs may combine magical protection, paracritters, drones, cameras and metahuman guards."
  - "The source states dragons possess an innate awareness of activity within their own lairs."
sources:
