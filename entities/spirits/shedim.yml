id: entity.spirit.shedim
record_type: entity
name: "Shedim"
domain: spirits
status: ingested
source_period: "Year of the Comet"
conceptual_profile:
  classification: "Unknown astral/metaplanar spirit type; media name means 'undead'."
  first_confirmed_period: "Late 2061; reports spread internationally by early 2062."
  physical_interaction:
    - "Unable to materialize in the ordinary manner described for many spirits; instead seek uninhabited bodies."
    - "Can inhabit dead metahuman or animal bodies and animate them."
    - "Living bodies cannot normally be possessed because a living soul is present."
    - "A magician's body may be vulnerable while the magician is astrally projecting and the body is uninhabited."
  host_behavior:
    - "Once inhabiting a corpse, shedim are dual-natured."
    - "They appear to prefer relatively fresh corpses, but corpse condition does not absolutely prevent habitation."
    - "Observed hosts cease or greatly slow normal decay after possession, though source reports remain provisional."
    - "A shedim appears unable or unwilling to voluntarily leave an occupied corpse."
  behavior:
    - "Many observed shedim travel in groups/packs and seek bodies en masse."
    - "They are described as predatory toward living beings and may feed on life force and flesh."
    - "Individual shedim vary; some appear more potent or intelligent than others."
provisional_handling_observations:
  wards: "Wards and magical security can limit an inhabiting shedim."
  magic_resistance:
    - "Observed shedim show strong resistance to magic."
    - "Mana-based attacks can affect the spirit rather than merely damaging the host."
  regeneration:
    - "Shedim can regenerate damage to an occupied corpse but cannot restore it beyond roughly the body's condition when first inhabited."
    - "If the host body is totally destroyed, the shedim is forced back to the astral plane."
  banishing:
    - "Standard banishing techniques can affect shedim."
    - "When inhabiting a corpse, the spirit must first be forced/exorcised from the body; source reports indicate a further banishing is then required to destroy/disrupt it."
    - "An exorcised shedim cannot reoccupy the same body."
  corpse_denial:
    - "Public-health guidance recommends cremation soon after death and warded storage for bodies awaiting disposal."
    - "Religious Last Rites are reported to delay entry into a corpse but not necessarily prevent it indefinitely."
social_consequences:
  - "Zombie attacks trigger witch hunts and violence against voudoun practitioners despite source experts distinguishing shedim from loa-controlled zombies."
  - "CAS restrictions and bounty policy target practitioners associated with creating/controlling animated dead, escalating Caribbean political tension."
  - "Shipping and trade are disrupted by corpse/shedim fears and security measures."
formal_rules_status:
  status: "deferred"
  note: "This record preserves the chapter's in-world observations only. Formal shedim statistics, powers and possession rules must come from the later Game Information chapter."
sources:
  - {source: source.fanpro-10650, printed_pages: "87-96", pdf_pages: "88-97", relation: defines_overview}
