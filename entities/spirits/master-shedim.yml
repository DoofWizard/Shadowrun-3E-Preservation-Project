id: entity.spirit.master-shedim
record_type: entity
name: "Master Shedim"
domain: spirits
status: ingested
source_period: "2062"
classification:
  type: "shedim variant"
  relationship: "Uses the standard shedim framework from Year of the Comet with the Threats 2 modifications recorded here."
traits:
  - "More intelligent than ordinary shedim and capable of infiltrating living society."
  - "Requires a physical vessel to remain anchored in the physical world."
  - "Can inhabit dead vessels and may inhabit living vessels under the standard shedim rules referenced by this source."
powers:
  standard:
    - Aura Masking
    - Compulsion
    - Deathly Aura
    - Fear
    - "Immunity (Age, Pathogens, Toxins)"
    - Inhabitation
    - Karma Drain
    - Regeneration
  possible_additional:
    - Magical Guard
    - Noxious Breath
    - Shadow Cloak
    - Silence
rules:
  inhabitation: rule.spirits.master-shedim-inhabitation
campaign_use:
  - "Master shedim can use an inhabited body's identity and memories as a social disguise."
  - "The source presents them as selective about vessels and capable of operating from within society."
sources:
  - {source: source.fanpro-10652, pages: "53-54", pdf_pages: "53-54", relation: defines}
notes:
  - "Threats 2 explicitly points to Year of the Comet pp.149-153 for the standard shedim rules; those referenced rules are not treated here as newly defined by Threats 2."
