id: world.character.art-dankwalther
record_type: world
name: "Art Dankwalther"
domain: characters
status: ingested
profile:
  - "Former Fuchi Industrial Electronics accountant/economic analyst who was laid off during Fuchi's decline."
  - "After years of addiction and isolation, received a massive Dunkelzahn-will inheritance: 34,586,224,739.58 UCAS dollars before later tax/legal reductions."
  - "Attempted unsuccessfully to return to corporate employment at Novatech, then turned his wealth and financial expertise toward revenge."
  - "Used distributed investments, brokers, covert influence, legal/political pressure and shadow assets to conduct economic warfare."
  - "Tokugawa Technologies was used as a small-scale test; Gunderson Corporation as a larger rehearsal before his intended campaign against Novatech."
motivation:
  primary: "Revenge against the corporate system that discarded him, with Novatech as the intended principal target."
  source_interpretation: "Game Information explicitly frames his behavior as deliberate systematic economic warfare rather than ordinary profit-seeking."
sources:
