id: world.character.yasuhito
record_type: world
name: "Yasuhito"
domain: characters
status: ingested
profile:
  title: "Emperor of Japan"
  age_at_accession: 14
  accession: "January 2062, following confirmation of Emperor Kenichi's death in the Unzen disaster."
  regent: "Taro Yonekura, Sessho"
  succession_context:
    - "Described by the government as Emperor Kenichi's grandson and sole surviving direct descendant."
    - "Source reports that he was present near Ariake-kai/Unzen during the disaster and survived without obvious injury."
    - "Medical/magical examinations reported him as mundane; explanations for his survival remain speculative."
  politics:
    - "Rapidly builds support among younger Diet members, Shinto/Buddhist leadership and reform-oriented politicians."
    - "Supports freer trade, relaxed immigration and reduced discrimination against kawaruhito."
    - "Attempts to expand practical Imperial influence from a traditionally symbolic role."
  security:
    - "Faces repeated assassination attempts and political hostility during the source period."
    - "Yonekura recruits oni into the traditional Imperial Guard, alarming conservative nobles."
  dynastic_alliance:
    - "By March 2062, Tadashi Shiawase's daughter Hitomi is betrothed to Yasuhito for marriage after his sixteenth birthday."
