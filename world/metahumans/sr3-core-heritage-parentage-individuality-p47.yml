    / How much does race matter?
  source_period_narrator_assertions:
    interbreeding: The fictional rulebook narrator says the metahuman groups can have
      children together and describes all of them as belonging to one species.
    mixed_parentage: The narrator says a child of parents from different metahuman
      groups is a member of one parent group, rather than a distinct half-breed hybrid
      category.
    same_group_parentage: The narrator says parents from the same metahuman group
      can occasionally have a child of another group, giving two dwarf or two troll
      parents having a human child as examples; the phenomenon is described as becoming
      rarer.
    individual_variability: The narrator cautions that individuals within and between
      metahuman groups vary and that group averages or stereotypes should not determine
      assessment of an individual.
  no_added_game_mechanics: These source claims do not supply a dice test, inherited
    racial Attribute distribution, random offspring table, universal probability,
    legal constraint, character option or numerical modifier. Original p47 descriptive
    Metahuman Characteristics Table and p56 racial modifiers are separately indexed.
