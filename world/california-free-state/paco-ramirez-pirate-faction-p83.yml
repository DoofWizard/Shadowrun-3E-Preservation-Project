  background: The book identifies Paco Ramirez as a fictional former employee of Captain
    Monday, later an independent pirate leader and smuggling competitor.
  secession: Paco reportedly broke from Monday in 2051 after commandeering a fleet
    of fast-running boats to Concepcion, where he established a new smuggling operation.
    The narrator says Grania refused to authorize Monday to cross her airspace in
    response.
  assets: By the source period, Paco's people were occupying and repairing buildings
    at Isla Vista airfield, potentially extending their operations into airborne trade.
  relationships: 'The narrator frames a three-way balancing situation: Paco threatens
    Monday''s commercial position, Monday is hostile to Paco, and Grania calculates
    that allowing their rivalry to continue benefits her operation.'
  unverified_support: The source says some of Monday's employees suspect Grania secretly
    funded Paco's initial independence, but they cannot prove it.
