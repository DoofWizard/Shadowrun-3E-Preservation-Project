    commentators, uncertain hearsay, and optional GM scenarios. No Third Edition conversion
    or real-world instruction is inferred.'
  established_narrator_claims: The source narrator calls Grania O'Malley a dwarf and
    the wealthiest of three major fictional Big Sur smuggling bosses. She controls
    territory around former Vandenberg AFB and Oak Knolls airfield. Her personal origin
    and birth identity are not established.
  organization: The narrator portrays her as a proficient organizer and negotiator
    whose operation has air-freight and smuggling advantages. She recruits and pays
    freetrader pilots and specialists, and ex-employees are described as rarely returning
    openly to her area.
  rival_strategy: The narrator says she benefits from conflict between Captain Monday
    and Paco Ramirez, sometimes supporting one and sometimes the other, while both
    regard her as a potentially valuable partner.
  identity_uncertainty: The narrator says Grania O'Malley is likely an alias and mentions
    rumors of a Tír Tairngire past or shipping association; the named Shadowland identifications
    of Anna Smythe and Grace Tallchief directly contradict one another and remain
    separately attributed.
