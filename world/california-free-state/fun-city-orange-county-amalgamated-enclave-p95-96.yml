  editorial_method: Reference reporting of a fictional tabletop-RPG sourcebook, distinguishing named
    sourcebook contributors, narrator statements, attributed in-world Shadowland assertions, and optional
    game material; no real-world claims or Third Edition conversion.
  narrator:
    speaker: Orangeman, titled Fun City section, plus sourcebook contributor description
  geography:
    area: Fun City occupies a substantial part of Orange County in the fictional Los Angeles, including
      Anaheim, Garden Grove, Stanton and Buena Park. Tourist attractions mentioned include Virtual
      World Disney, Knott’s Berry Farm, the Crystal Cathedral and wax museums.
    bounds: The source describes California Highway 91 to the north, California Highway 57 to the
      east, California Highway 22 to the south, and Valley View Avenue to the west.
  corporate_origin:
    incorporation_year: 2020
    ownership: Amalgamated Studios acquired much of the local land during the fictional 2010–2020
      period; a separate portion remains Virtual World Disney property. Fun City enjoys extraterritorial
      arrangements and operates on visitor revenue.
    entrance_fee:
      amount: 5000
      currency: CFS dollars
      unit: per visitor per day
      payment: advance
      access_condition: visitors must pass screening; the source says entry must be paid before admission
    visitor_comment: The source’s FunGuy post says the pass includes accommodation, food and access
      to attractions; this statement is attributed to the poster, not stated as a comprehensive contractual
      guarantee.
  business_and_residents:
    services: The city is a tourist and film/simsense production center, with corporate entertainment
      studios, technicians and residents housed inside controlled compounds.
    castle_cricket: MagicMind operates a gated residential and work compound called Castle Cricket,
      with homes at the perimeter and studios and laboratories in more restricted inner rings.
    municipal_center: The main Administration Center near Stanton and Katella Streets contains city
      government, a police facility, a jail and records infrastructure. The narrator describes unusual
      movable offices and tightly managed site access, without supplying game-resolution or security-bypass
      mechanics.
  disputed_ownership: Denny’s comment separately claims Virtual World Disney is the sole internal
    landholder beyond Amalgamated control; the narrative supports independent VWD holdings but does
    not establish every boundary of corporate control.
