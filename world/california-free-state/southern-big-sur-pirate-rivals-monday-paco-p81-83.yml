  editorial_method: 'Fictional Shadowrun tabletop-RPG archival account: sourcebook
    narration, named in-world claims, and optional game scenarios remain separate;
    not real-world advice.'
  sourcebook_narrative:
  - pages: 81-82
    account: Grania O'Malley remains the leading pirate queen of southern Big Sur.
      The two principal rivals are Captain Monday and Paco Ramirez, who expend their
      efforts competing with each other while O'Malley alternately assists each in
      attempts to challenge the other. The narrator presents this as a continuing
      balance, not their defeat.
  - pages: 82-83
    account: Captain Monday is the pirate king around Morro Bay and San Luis Obispo.
      He and O'Malley earlier divided regional smuggling, with Grania operating chiefly
      in the air and Monday by sea. The narrator identifies his former name as Joseph
      McCabe, once mayor of San Luis Obispo, who remained in office after California
      Secession and later changed his name. Monday has demonstrably held the captain
      identity since 2046, according to the narrated account.
  - pages: '82'
    account: 'The narrator likens Monday to Errol Flynn in eccentric dress and behavior:
      ruffled-sleeve shirt, eye patch, heavy boots, and a bird on his shoulder. This
      description does not establish the species or any supernatural capacities claimed
      for the bird by commentators.'
  - pages: '83'
    account: The narrator recounts Monday firing a Sidewinder missile at vessels belonging
      to Paco Ramirez; the leading craft was struck, and Paco chose not to escalate.
      Monday retained control over Morro Bay. This is a narrated historical confrontation,
      not an instruction or game procedure.
  - pages: '83'
    account: Paco Ramirez was formerly one of Monday's employees. In 2051 Paco seized
      fully loaded fast-running boats stranded by their crew near his home town of
      Concepcion, then built an independent base there. The narrator says Grania had
      refused permission for the fast boats to make the overland route through her
      area. Paco's followers subsequently moved onto Isla Vista airfield and began
      repairing hangars and outbuildings. The narrator describes his interest in expanding
      from sea transport into aircraft and jamming.
  source_distinctions: Fictional narrator facts are separated from unproven financing,
    personal-relationship, corporate and magical allegations recorded in companion
    speaker-claim records.
