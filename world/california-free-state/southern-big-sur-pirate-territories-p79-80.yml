  editorial_method: Historical fictional tabletop-RPG reference reporting; book narrator,
    named Shadowland speakers, and optional gamemaster possibilities are distinguished.
    No Third Edition conversion is implied.
  southern_coast:
    p: 80
    book_narrator: Unlike toxic northern Big Sur, the sparsely populated southern
      coastal stretch retains scenic bluffs, reasonably clean water and hills. The
      source portrays limited formal government or corporate presence, maritime trading
      groups, some isolated former military units and competing informal authorities.
      Wealthy outsiders increasingly purchase or seek local land and water, raising
      conflict with freetraders.
  pirate_kings:
    p: 80
    book_narrator: The chapter says three major pirate kings dominate regional freetrading,
      alongside numerous small independent operators and competitors. Their asserted
      control is not formal state sovereignty, and the narrator describes fragile
      rivalrous market arrangements.
  grania_omalley:
    p: 80
    book_narrator: Grania O’Malley is described as a notably wealthy regional pirate
      queen. The narrator presents the name Grania as a possibly assumed identity,
      refers to her control of much of the former Vandenburg Air Force Base and territory
      north and east toward Santa Maria, and identifies Oak Knolls airfield as a significant
      airborne-smuggler drop-off site. Her origin, prior name, Tír history and links
      to High Prince Aithne Oakforest’s relations are explicitly presented as speculation
      rather than established biography.
