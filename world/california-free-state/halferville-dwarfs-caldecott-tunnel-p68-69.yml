    "editorial_method": "Source-reviewed FICTIONAL Shadowrun tabletop-RPG reporting. First-person book narrator, separately named in-world speakers and disputed allegations are distinct; no real-world instructions or Third Edition conversions are implied.",
    "settlement": "According to the chapter narrator, dwarf refugees leaving San Francisco soon after Japanese marines arrived in 2037 established a dispersed underground society east of the Bay, extending from near Walnut Creek toward Fremont and Livermore. The dwarfs came to use the nickname 'Halferville' (or 'Halfer-ville') with pride.",
    "physical_form": "The narrator describes an expanding underground network of dwarf-sized halls, dwellings, tunnels, ornamental carvings, indirect illumination and preserved visible mineral deposits, and emphasizes that many taller visitors must crouch.",
    "earthquake": "The narrator says the Great Bay Quake of 2048 severely damaged the Caldecott Tunnel between the Diablo Valley communities and San Francisco. While California Transportation Authority (CalTrans) and corporate operators debated liability, East Bay dwarfs repaired the tunnel three days after the joint assessment commission had been formed.",
    "ownership_and_rights": "The dwarfs demanded payment before reopening the repaired tunnel. San Francisco corporations offered payment in return for exclusive proprietary rights, but remaining Free State officials instead ceded mineral, access and other rights to former national and state park lands in the Bay Area to the dwarfs, conditional on maintaining the tunnel and paying a modest mineral tax; the dwarfs accepted the state offer.",
    "ensuing_status": "The narrator says the dwarfs retain control of the Caldecott Tunnel and charge a moderate fee for corporate armored commuter rail use. The ceded lands largely contain dwarf settlements; the narrator reports tunnel fortifications including heavy artillery, mortars and rockets, and mainly isolated clashes with local orkish go-gangs.",
    "uncertainty": "The narrator explicitly says it has no trusted evidence the dwarfs intend broad hostile action. A separate speaker, Liberator, alleges corporate complicity; that allegation must not be promoted into narrator fact."
