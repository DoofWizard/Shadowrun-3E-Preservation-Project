  editorial_method: Historical fictional tabletop-RPG reference reporting; book narrator,
    named Shadowland speakers, and optional gamemaster possibilities are distinguished.
    No Third Edition conversion is implied.
  coastal_extent_and_contrast:
    printed_pages: 72,74
    book_narrator: The chapter covers the coast around Santa Cruz, Monterey and Salinas
      through Los Padres National Forest and Santa Barbara, distinguishing the severely
      contaminated northern region from comparatively clean, sparsely populated southern
      Big Sur; the narrator describes small detoxifying farm communes and a more southerly
      area of unregulated private power.
  historic_ecological_decline:
    printed_pages: 72,74
    book_narrator: Before the Secession, farm and tourism economies and resort towns,
      including Carmel, depended on a scenic coast. Salinas- and Monterey-based agribusiness
      acquired agricultural land and overused engineered agricultural techniques and
      chemical pesticides, contaminating the water table. By 2030 the account describes
      widespread sterile soil and toxic vegetation; corporations and the Free State
      government abandoned much of northern Big Sur. The narrator describes small
      toxic animals and plants becoming prominent as most people departed.
  post_secession_southern_region:
    printed_page: 74
    book_narrator: The formerly less populous southern coast had comparatively fewer
      corporate farm holdings; UCAS military installations including the Hunter-Liggett
      Military Reservation and Camp Roberts were vacated with Secession and not replaced
      by California National Guard units. Without major business security presence,
      lawlessness and displaced residents increased, and wealthy private landowners
      retained influence.
  commune_reclamation:
    printed_pages: 74-75
    book_narrator: In the early 2040s magically capable settlers began detoxifying
      soil and water around the Salinas and Carmel rivers and establishing small farms.
      Over roughly fifteen years the chapter says approximately fifty communes arose
      there and in the foothills of the Sierra de Salinas, Santa Lucia, and Gabilan
      mountains.
  ownership_conflict_and_public_response:
    printed_pages: 74-75
    book_narrator: Agribusinesses retained legal title to much of northern Big Sur
      and sought to reclaim land cleaned by the communes. Farmers resisted buyout
      demands and threats of prosecution. The corporations sought central-government
      intervention; Sacramento declined direct involvement but let corporations raise
      forces themselves. Corporate-paid mercenaries and shadowrunners were deployed
      against communes, which successfully defended themselves using primarily magical
      forces, and repeated confrontations caused casualties on both sides. The narrator
      portrays the struggle as ongoing and escalating, not as a concluded conflict.
  source_qualifications:
    printed_pages: 74-76
    note: Named forum statements about who finances the farmers, specialized creatures,
      and an individual toxic shaman remain attributed claims in companion reference
      records, not narrator-confirmed facts.
