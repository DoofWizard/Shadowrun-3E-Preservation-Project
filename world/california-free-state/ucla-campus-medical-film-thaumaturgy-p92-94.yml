  editorial_method: Reference reporting of a fictional tabletop-RPG sourcebook, distinguishing named
    sourcebook contributors, narrator statements, attributed in-world Shadowland assertions, and optional
    game material; no real-world claims or Third Edition conversion.
  narrator:
    speaker: Little Lulu, UCLA section, fictional first-person contributor
    scope: Sourcebook narrative describes the imaginary 2057 campus and opinions; not actual present-day
      UCLA.
  campus:
    physical_setting: The fictional UCLA campus is a walled enclave spread across about 170 hectares
      of the Santa Monica Hills; the contributor reports that the formerly open campus became heavily
      fortified following early-21st-century changes and is financially influenced by corporations.
    education_economics: Teaching continues; substantial corporate financing is concentrated in medical
      studies, the School of Film and Sim, and Thaumaturgy. The account says many other undergraduate
      departments have dwindled.
  medicine:
    programs: The fictional medical center still teaches and conducts research while corporate interests
      increase the research share. The contributor identifies biotech and engineering as particularly
      well-funded departments, including support from Shiawase and Yamametsu.
    offcampus_service: The contributor says the research hospital continues to serve local communities
      beyond the walls, in part because public goodwill supports corporate and university goals.
  film_and_sim:
    programs: The School of Film and Sim added simsense early in ASIST development and maintains an
      influential production reputation.
    sponsorship: The narrative describes studios associated with Amalgamated and Affiliated Artists
      recruiting, supporting, or employing film students, and says Amalgamated sponsors an annual
      amateur film festival offering a scholarship and living allowance conditional on the student
      working for the studio after graduation. This is the narrative’s account, not a general rule.
  thaumaturgy:
    founding_date: 2025
    founding_claim: Little Lulu credits the fictional UCLA with the first dedicated Department of
      Thaumaturgy in 2025 and says rival institutions, including USC, CalTech, Loyola Marymount and
      roughly twenty additional schools or colleges, later established their own departments.
    academic_rivalry: The contributor describes escalating magical academic rivalry and reports a
      sequence of retaliatory incidents. The narrative says recent confrontations caused injuries,
      but specifically reports no deaths as of the account.
    astral_environment: The contributor describes unpredictable fluctuations in local astral conditions
      and links them speculatively to long-running rivalry. This perceived causal connection is neither
      an exact game mechanic nor independently proved.
