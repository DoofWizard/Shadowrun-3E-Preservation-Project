  editorial_method: 'Fictional Shadowrun tabletop-RPG archival account: sourcebook
    narration, named in-world claims, and optional game scenarios remain separate;
    not real-world advice.'
  credited_narrative_sources:
  - printed_pages: 85-86
    voice: Urban Critter chapter introduction, framed by Captain Chaos
    statement: The fictional Los Angeles chapter describes a city disrupted by earthquakes,
      pollution, gang conflict and economic divides. Following the Shiawase extraterritoriality
      decision, the California government reportedly designated Los Angeles a Free
      City in 2046. A Los Angeles City Authority was left to maintain services, but
      the account criticizes successive officials for favoring entertainment and aerospace
      corporations while allowing law enforcement and medical services to deteriorate
      for poorer residents.
  - printed_pages: 86-87
    voice: WilE Coyote, named contributor to Where the Better Half Lives
    statement: Describes fortified wealthy enclaves including Hollywood, Mulholland
      Drive, Westside, environs of the UCLA campus and Fun City. The account contrasts
      protected luxury housing, media companies and leisure districts with distressed
      neighborhoods beyond the walls.
  - printed_pages: 87-89
    voice: WilE Coyote, named contributor
    statement: Describes Studio City as a central entertainment enclave, comprising
      West Hollywood, Universal City and Beverly Hills. Its boundaries are California
      highways 101/134 to the north, Interstate 5 to the east, Interstate 10 to the
      south and Beverly Glen Boulevard near Stone Canyon Reservoir to the west. The
      district contains film, video, trideo and simsense facilities, tourist sites,
      and residential compounds, with Amalgamated Studios owning most land through
      affiliated realty businesses. The report highlights extreme social inequality,
      isolation from environmental conditions and an extravagant party culture; these
      are in-world descriptions, not modern factual statements.
  - printed_pages: 88-89
    voice: WilE Coyote, named contributor
    statement: Provides a lavish mansion description for simsense celebrity Winona
      Flying Horse, including palatial residential fixtures and a large lawn; calls
      attention to entertainment-sector social competition, indebtedness and consumption.
      The passage continues on p89 before introducing Amalgamated Studios.
  fidelity_note: These are fictional chapter narratives with identified narrating
    contributors, not independent real-world socioeconomic findings. Specific contested
    background claims are stored in speaker-claim records.
