    or real-world instruction is inferred.'
  industry: The narrator describes aquaculture as one of the northern Big Sur coast's
    few profitable industries. Corporate fish farms occupy Monterey Bay and other
    Southern Big Sur waters, supplying seafood to San Francisco, Los Angeles and destinations
    outside California.
  biotech: Improved genetics enabled industrial farms to cultivate unusual large fish
    and other seafood; the chapter attributes many alterations to corporate genetic
    engineering and chemical husbandry.
  pollution: The narrator says industrial effluent polluted northern coastal waters,
    requiring corporations to use magic, pharmaceuticals, hormones, antibiotics and
    heavy security to keep aquaculture operations productive.
  hazards: The source describes attacks by fictional awakened sea creatures and terrestrial/underwater
    spirits, with a mix of narrator reports and named speakers; it does not publish
    a new dice/target-number rule on these pages.
