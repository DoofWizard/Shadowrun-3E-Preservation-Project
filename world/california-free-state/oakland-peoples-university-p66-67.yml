    "editorial_method": "Source-reviewed FICTIONAL Shadowrun tabletop-RPG reporting. First-person book narrator, separately named in-world speakers and disputed allegations are distinct; no real-world instructions or Third Edition conversions are implied.",
    "founding": "According to the fictional regional narrator, the October 25 Alliance was the principal force behind establishing the People's University in Berkeley as a distributed educational and civic-service network rather than a conventional single campus.",
    "organization": "The university is described as a loose collective of teachers, organizers and students. Classes change location to protect instructors and pupils from corporate intelligence and the narrator's alleged violent reprisals; by contrast its free medical clinic and food pantries maintain fixed sites.",
    "care_and_food": "The narrator says the clinic treats those in need free of charge without questions and that food pantries supply staple items to requesters. The book presents these as a meaningful response to persistent local poverty.",
    "educational_program": "The source lists literacy, computer technology, metahuman history, radical politics, medicine, law, sociology, political discussion forums and public-organizing workshops; it also mentions instruction in weapons technology, demolitions, hand-to-hand combat, tactical magic, decking, rigging, intelligence gathering, espionage and urban guerrilla warfare. These are descriptive categories in fictional curricular narration; no procedures are supplied here.",
    "disputed_security": "The narrator maintains that corporate agents infiltrate classes and that the decentralized structure prevents sustained attacks; its claim that ordinary food pantries and the clinic have not been attacked is specific and does not mean all classes or participants were safe."
