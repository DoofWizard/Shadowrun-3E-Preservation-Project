  editorial_method: Historical fictional tabletop-RPG reference reporting; book narrator,
    named Shadowland speakers, and optional gamemaster possibilities are distinguished.
    No Third Edition conversion is implied.
  regional_industry:
    p: 77
    book_narrator: Coastal aquaculture remains one of northern and southern Big Sur’s
      few profitable corporate operations. Large and small fish farms in Monterey
      Bay and further south produce thousands of pounds of seafood daily for San Francisco,
      Los Angeles, and other markets. Genetic engineering made the industry commercially
      viable; the narrative describes industrial contamination, pharmaceutical treatment
      of fish, security expenditure, and threats from Awakened marine life.
  kalamari_incorporated:
    p: 78
    book_narrator: Kalamari Incorporated operates the principal aquasphere offshore
      of Pacific Grove, a self-contained underwater city with capacity for up to 15,000
      people. The site houses aquaculture operations and a genetic-engineering laboratory,
      producing, according to the book, 60-pound salmon, 20-pound squid, sea urchins
      as large as a troll’s head, and 15-pound prawns; these are product descriptions,
      not character or animal stat blocks.
  aqua_arcana:
    p: 78-79
    book_narrator: 'Aqua Arcana is a much smaller aquaculture-related company (about
      thirty-five people according to official records) specializing in magical mediation
      and dealing with Awakened sea creatures. Its staff are described as around ten
      or eleven magically active workers, others serving as boat crews or security.
      Its base is an aquacity off San Simeon Point with part above water. The account
      says it negotiated a settlement with merrow clans: the clans provide underwater
      security and receive residential access and a limited share of fish harvests,
      with the parties agreeing not to prey on one another.'
  aqua_arcana_history:
    p: 79
    book_narrator: The book describes Aqua Arcana mediating an escalated conflict
      between Kalamari fish farms and merrow clans after the farms were built above
      merrow hunting grounds, and says the arrangement expanded its business. Distinguishes
      its reported company practices from unverified claims regarding shareholders,
      startup money or supernatural ownership.
