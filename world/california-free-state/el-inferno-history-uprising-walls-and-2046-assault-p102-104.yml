  editorial_method: Third-person sourcebook reference reporting of the fictional tabletop RPG. Source
    narration, named Shadowland allegations and optional scenarios are not conflated; no real-world
    claims or inferred SR3 conversions.
  source_scope: Fictional Los Angeles setting commentary in FASA Corporation California Free State,
    1996 original/Second Edition; source narrator historical account and in-world allegations distinguished.
  historical_narrative:
  - period: early twenty-first century
    account: The narrator recounts poverty, organized gang influence, racial discrimination, and repression
      in what became El Inferno, naming Compton, Gardena, Hawthorne and Watts. The text links the
      city’s growth in gang influence to organized crime networks and youth unemployment.
  - period: '2022'
    account: The narrator describes a turf conflict between a Seoulupa-affiliated group called the
      Tigers and a yak-connected group called the Green Dragons, with severe urban losses and newer
      metahuman gangs attempting to claim territory.
  - period: 2023 VITAS II outbreak
    account: The fictional MLK-Drew Medical Center was rumored to hold quantities of VITAS II antiserum;
      a crowd overran the facility without obtaining the rumored stocks. Some characters circulated
      a baseless allegation of government-sponsored extermination aimed at poor residents; the source
      presents this as rumor, not a proven medical crime. Unrest escalated and the governor placed
      the area under martial law.
  - period: 2023 casualty account
    account: The narrator gives casualties after the National Guard intervention as exactly 23 soldiers,
      89 police officers, and 619 civilians; much of central Los Angeles lay damaged. These are sourcebook
      figures, not external historical findings.
  - period: post-2023 redevelopment
    account: Corporations offered to purchase devastated districts, including Watts, for about ten
      percent of pre-unrest value, and the account says many homeowners were pressured or lacked practical
      means to refuse. Redevelopment and displacement pushed low-income residents toward Compton and
      Gardena.
  - period: 2036-2038 legal isolation
    account: Following the fictional California secession in 2036, Los Angeles officials limited welfare
      support to people in designated El Inferno housing projects, concentrated poverty and erected
      a physical barrier. By 2038 checkpoints and a nightly 11 p.m. to 5 a.m. curfew controlled access;
      the narrator says police were reassigned to the outer roads.
  - period: 2046 so-called Lost Election
    account: The Sacramento government alleged El Inferno gangs tampered with gubernatorial election
      data and ordered a state and mercenary incursion, with looting and civilian casualties in the
      resulting attacks. After two days Sacramento publicly deemed the operation a defeat, declared
      Los Angeles a Free City, and effectively abandoned El Inferno. The narrator distinguishes official
      allegations of tampering and cleanup from described casualties and discriminatory propaganda.
  no_rules_conversion: Dates, numbers and conditional claims are historic fictional setting detail;
    no Third Edition mechanics created.
