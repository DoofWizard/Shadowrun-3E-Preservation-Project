    "narrative_voice": "The first-person regional chapter narrator describes the Oakland/Berkeley sprawl as a major center of the Free State's metahuman-rights and anti-Japanese-corporate-occupation movements; the narrator compares its activism with earlier civil-rights and antiwar movements.",
    "population_and_politics": "The narrator calls the metropolitan area home to one of the largest metahuman populations in North America and characterizes many residents as affiliated with or supportive of organized anti-occupation and rights groups. An informal coalition of leaders from several political and guerrilla resistance organizations is said to administer local tensions.",
