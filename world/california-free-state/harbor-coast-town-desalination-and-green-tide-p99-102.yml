  editorial_method: Third-person sourcebook reference reporting of the fictional tabletop RPG. Source
    narration, named Shadowland allegations and optional scenarios are not conflated; no real-world
    claims or inferred SR3 conversions.
  narrative_scope: Published fictional Los Angeles regional account, Harbor and Coast Town, in historical
    FASA7209 original/Second Edition setting.
  harbor:
    geography: The imaginary harbor/aerospace industrial district runs from I-405 south to docks between
      California Highway 107 and Interstate 710; the text names Torrance, Carson, Lomita, Harbor City,
      Wilmington and San Pedro.
    corporate_economy: Lockheed competes with other aerospace suppliers and giant shipping facilities,
      shipyards and warehouses; private security dominates business premises. The city police are
      depicted as minimally involved in guarding corporate assets.
    barrens: The fictional Barrens occupies an east-of-110, south-of-405 area associated with Carson,
      Sepulveda, Main and Avalon, described as heavily polluted and structurally damaged in the 2028
      earthquake. The contributor describes dangerous chemical wastes and organized gangs.
    steppin_wulfs: The contributor describes a particularly violent gang called the Steppin’ Wulfs,
      whose members are rumored to be affected by substances or magic; the various proposed explanations
      are not settled.
  coast_town:
    geography: Beyond Harbor, the imaginary Coast Town extends between the Pacific, I-405, Hawthorne
      and Western Streets, including Marina del Rey, El Segundo and Redondo Beach; the account contrasts
      corporate waterfront beaches with widespread waste.
    water: The narrator describes coastal desalination and fictional cold-fusion power plants as crucial
      sources of municipal water and associates their operations with salt and chemical contamination
      along public beaches; no real-world energy science claim is intended.
    restricted_site: The City Authority has a guarded polluted zone between Highway 10 and Western
      Avenue, described as approximately 3 km long. The explanation for contamination and whether
      reactor activity caused it are disputed rather than mechanically defined.
    green_tide: In the narrated fictional 2045 period a damaged automated research installation was
      followed by a green coastal algal event called Green Tide. Published forum speakers disagree
      over radiation, industrial pollutants, biology and corporate responsibility; avoid a definitive
      causal assertion.
    residents_and_health: The narrative depicts squatters, extreme poverty, ill-health linked to pollution,
      and the informal nonprofit Hospitalers running scattered free clinics. The City Authority’s
      CityMed clinics are described as legally obligated but closed after budget restrictions; this
      is a fictional care-access problem, not real medical advice.
