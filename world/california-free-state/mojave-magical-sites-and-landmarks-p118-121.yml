    "editorial_method": "Independently inspected original page images of the FICTIONAL Shadowrun tabletop RPG sourcebook. The book narrator and named in-world speaker assertions remain distinct; no real-world instructions or Third Edition conversions.",
    "four_locations": "The desert narrator identifies four prominent magical locations: Ubehebe Crater, Saratoga Springs, the Lost Mine and Joshua Tree National Monument; describes unusual magic concentrations, unusually numerous spirits and unfamiliar local spirit behavior.",
    "ubehebe": "The narrator locates Ubehebe in northwestern Death Valley at an extinct volcanic feature, characterizing it as barren, dry, fiercely hot by day and freezing at night; reports paracritters, spirits, unusual manifestations, and accounts of painful lightning-like encounters. No literal in-world background-count number is printed here.",
    "saratoga_springs": "Located near southwestern Death Valley, it attracts wildlife to freshwater. The narrator describes vegetation said to grow strangely large and says some locals attribute it to a lake spirit, while others speculate about carnivorous plants; attacks and spiritual causes are disputed.",
    "lost_mine": "The narrator reports a LEGEND of a mine supposedly holding child-fist-sized orichalcum nuggets. No reliable verified location or even existence is established. Rumored candidates include Wild Rose Canyon and Jubilee Pass; the narrator says spirit-related hazards and disappearances are reported by prospectors.",
    "joshua_tree": "The Joshua Tree National Monument is described as a forest of sacred/desirable Joshua trees valued for talisman materials. A previous incident of large-scale tree cutting is said to have resulted in a fictional Anasazi band guarding the area with former marine Desert Rats. Reports of hostile tree spirits or literally moving trees remain attributed speaker accounts.",
    "scope": "This is sourcebook setting context, not verified factual geography/safety guidance or a self-contained magical-gameplay subsystem."
