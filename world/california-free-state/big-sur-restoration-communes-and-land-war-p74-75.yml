  editorial_method: 'First-pass page-image-reviewed FICTIONAL Shadowrun tabletop RPG
    archival reporting: sourcebook-narrator assertions are separated from named fictional
    commentators, uncertain hearsay, and optional GM scenarios. No Third Edition conversion
    or real-world instruction is inferred.'
  reclamation: In the early 2040s, magically aided settlers cleaned plots around the
    Salinas and Carmel rivers, building small farming communes. Over about fifteen
    years the narrator reports roughly fifty communes, also including land in the
    Santa Lucia, Gabilan and Sierra de Salinas foothills.
  land_claims: Fictional agribusiness corporations retained legal title to much of
    northern Big Sur land and attempted to reclaim communally restored land, initially
    through acquisition offers and subsequently through threatened prosecution.
  government_response: The Free State government declined to undertake the requested
    forced eviction campaign, leaving corporations to seek private armed intervention.
  armed_conflict: Corporate hired forces attacked the restoration communes but retreated
    after magical resistance. The text reports escalating reprisals, many casualties
    among both corporate forces and local defenders, and sustained conflict without
    a decisive outcome.
  certainty: This record follows the sourcebook narrator; Shadowland commentators
    dispute underlying motives and outside intervention in separate attributed-claim
    records.
