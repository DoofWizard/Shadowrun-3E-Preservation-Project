    or real-world instruction is inferred.'
  region: The book narrator treats Big Sur Coast as a larger fictional coastal region,
    not only the small place labeled Big Sur on some maps, and contrasts its northern
    polluted stretches with comparatively clean, sparse southern coastal territory.
  agricultural_history: Before severe contamination, towns including Carmel attracted
    tourists while Salinas and Monterey supported agriculture. By the late twentieth
    century, large agribusinesses had purchased arable land. Irrigation practices
    and chemical pesticides increasingly damaged the water table; the narrative dates
    severe contamination by 2030.
  ecological_condition: The source describes northern land as largely sterile, with
    aggressive mutated or toxic plants and wildlife; only some farming communes reclaim
    plots. The chapter uses dystopian comparisons to convey the extent of damage,
    not a quantitative environmental measurement.
  political_vacuum: After California secession, government and agribusiness retreated
    from the north; American military personnel left Hunter-Liggett Military Reservation
    and Camp Roberts, with no California National Guard replacement. Corporate security
    and newly independent gangs displaced or menaced civilian residents.
  southern_condition: Southern Big Sur remained comparatively unpoisoned and had little
    central government or corporate security, but private freetraders and competing
    local groups controlled much of the territory.
