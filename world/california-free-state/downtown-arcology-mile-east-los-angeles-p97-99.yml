  editorial_method: Third-person sourcebook reference reporting of the fictional tabletop RPG. Source
    narration, named Shadowland allegations and optional scenarios are not conflated; no real-world
    claims or inferred SR3 conversions.
  narrative_scope: 'Historical fictional sourcebook contributor, Los Angeles: Real City Life, Downtown
    and East Los Angeles; the account is not a real description of Los Angeles.'
  social_observations: The contributor portrays severe insecurity and social division but also residents
    working to maintain homes, community, and dignity despite poverty. This is the contributor’s broad
    opinion, not an event or an NPC rule.
  downtown:
    neighborhoods: The district called Downtown or Arcology Mile contains Belvedere, Maywood, Huntington
      Park, Bell, Southgate and Watts in this fictional setting.
    urban_form: Narration reports closely spaced corporate-owned arcologies with sophisticated earthquake-proofing,
      partly private police, frequent well-armed corporate patrols and high security around employers.
      Corporate control effectively supersedes civic authority within compounds.
    history: Some downtown areas were damaged during the fictional 2023 serum riots, and residents
      who lost property were displaced toward Harbor, Coast Town or El Inferno.
    conflict: The account says corporate security and local gangs clash near holdings; the contributor
      alleges firms sometimes benefit from gangs as equipment-test environments. These institutional
      motives are an authorial accusation, not a tested game rule.
  east_los_angeles:
    bounds_and_places: The fictional East Los Angeles extends east of Downtown between California
      Highway 60 and Interstate 5, incorporating Montebello, Pico Rivera, Whittier, La Habra and La
      Mirada.
    industry: The author depicts factories, energy facilities and heavily polluted urban districts.
      Lockheed Corporation controls or owns much of the developed area in the account.
    chronology: Narration links demographic dislocation to post-Aztlan tensions, departure of many
      Latino families, Lockheed acquisition of property, and by 2041 redevelopment into industrial
      buildings and tenements. The contributor also alleges land acquisitions occurred through coercive
      offers and arson; this is a serious published fictional claim, not voluntary agreement.
    social_conditions: Residents are portrayed as poorer working-class populations, including humans
      and metahumans; local youth, neighborhood watches and municipal officers contest gang activity
      and drug distribution, with conflicting assessments of policing.
