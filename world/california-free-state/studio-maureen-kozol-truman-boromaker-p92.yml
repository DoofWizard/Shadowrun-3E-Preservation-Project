  editorial_method: Reference reporting of a fictional tabletop-RPG sourcebook, distinguishing named
    sourcebook contributors, narrator statements, attributed in-world Shadowland assertions, and optional
    game material; no real-world claims or Third Edition conversion.
  narrative_source:
    speaker: WilE Coyote, Los Angeles contributor
    published_page: 92
  affiliated_artists:
    leadership: The contributor identifies Maureen Skogan as a skilled, influential studio fixer and
      Mike Kozol as her long-serving senior associate at Affiliated Artists. Skogan is described as
      short, deceptively strong, observant and forceful; Kozol as tall, Black, middle-aged, courteous
      and administratively important.
    relationship_certainty: The contributor explicitly notes rumors of a personal relationship between
      Skogan and Kozol but says nobody knows for certain; not established as fact.
  truman_technologies:
    chronology: Following the Chicago Containment Zone crisis in late 2055, the fictional company
      lost its Chicago facilities. Daniel Truman relocated its headquarters to Los Angeles in mid-2056
      and spent roughly the following year and a half maintaining the company and pursuing entertainment-sector
      footholds.
    corporate_position: The contributor reports that a number of Truman staff remained loyal through
      the relocation; Amalgamated Studios and Affiliated Artists had watched the company, while competing
      approaches for its talent or assets were still uncertain.
  boromaker_brilliant_genesis:
    reported_industry_accounts: According to Variety reports for the preceding two quarters, Chicago-based
      Boromaker recruited much of Living Life Productions staff. The narrator says Boromaker representatives
      approached Brilliant Genesis, another Chicago-based production house whose recent success made
      it a possible partner or acquisition target; an outcome is not established.
    industrial_scope: The account treats the movement of displaced Chicago simsense and trideo artists
      into Los Angeles as an ongoing economic competition, not a settled studio merger.
