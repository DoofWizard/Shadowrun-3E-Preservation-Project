  editorial_method: 'Fictional Shadowrun tabletop-RPG archival account: sourcebook
    narration, named in-world claims, and optional game scenarios remain separate;
    not real-world advice.'
  narrator_account:
  - pages: 83-84
    group: Sons of Liberty
    facts: Based at the Hunter-Liggett military reservation. Formed from former US
      Army soldiers who did not accept orders to leave California after Secession
      and the UCAS merger. The narrator says they declared independence from outside
      authority except their own command structure; the group is relatively small
      and under-equipped, with inconsistent effectiveness. Its leader is Major Samuel
      Hackett, portrayed as passionate about US constitutional history and ambivalent
      toward the pirate factions depending on circumstances.
  - pages: 83-84
    group: California Legion
    facts: Based at Camp Roberts and commanded by Captain Frances Hobbs. Also composed
      of former US Army personnel who remained after Secession. The narrator credits
      the Legion with relatively consistent defense against waterjackers and roaming
      go-gangs, while treating local pirates as economic actors whose operations the
      Legion generally avoids interfering with.
  - pages: 84
    group: regional_context
    facts: The narrator states neither the Sons nor the Legion has legitimate statewide
      governmental authority, and neither serves as a general national-law-enforcement
      replacement in southern Big Sur.
  editorial_distinction: Allegations that either commander sought UCAS intervention
    or received payments from Grania O'Malley are separate named commentary, not narrator-proven
    policy.
