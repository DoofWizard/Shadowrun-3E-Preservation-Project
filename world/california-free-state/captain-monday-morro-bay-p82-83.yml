  editorial_method: 'First-pass page-image-reviewed FICTIONAL Shadowrun tabletop RPG
    archival reporting: sourcebook-narrator assertions are separated from named fictional
    commentators, uncertain hearsay, and optional GM scenarios. No Third Edition conversion
    or real-world instruction is inferred.'
  narrator: The book narrator identifies Captain Monday as the smuggling leader of
    Morro Bay and San Luis Obispo, largely controlling sea traffic rather than the
    airfreight area associated with Grania O'Malley.
  historical_identity: The narrator reports he previously operated under the name
    Joseph McCabe and once served as mayor of San Luis Obispo; exactly when he changed
    roles and adopted the pirate name is uncertain.
  timeline: The source says he had significant smuggling funds by the early 2040s
    and was established as Captain Monday no later than 2046.
  personality_and_signs: He appears to imitate an exaggerated literary pirate persona,
    with clothing, a pistol, an eye patch and a bird on his shoulder. The page does
    not establish that the bird has magical powers.
  rivalry: The source reports a long rivalry with Grania and later Paco Ramirez. Monday
    expelled Paco's vessels from Morro Bay after a confrontation, maintaining his
    seaborne domain.
  rumor_distinction: Claims that the bird is an enhanced miniature eyekiller or that
    Monday uses magical animal surveillance are attributed to named commenters and
    not treated as narrator-confirmed facts.
