  editorial_method: 'First-pass page-image-reviewed FICTIONAL Shadowrun tabletop RPG
    archival reporting: sourcebook-narrator assertions are separated from named fictional
    commentators, uncertain hearsay, and optional GM scenarios. No Third Edition conversion
    or real-world instruction is inferred.'
  region: The narrator describes a fictional sparsely populated southern stretch of
    Big Sur with little corporate or recognized government authority. Many residents
    fled during California Secession, and later settlers occupied the region.
  independent_forces: Military units said to have abandoned or become independent
    around Hunter-Liggett and Camp Roberts enforced local arrangements according to
    commanders rather than a central state authority.
  resources: Private coastal retreats, clean water and undeveloped scenic property
    attracted wealthy outsiders; freetraders and waterjackers contested territory
    and commerce. The narrator reports waterjackers taking clean water from local
    waterways.
  pirate_kings: 'Three principal pirate bosses or privateering rivals control much
    of the profitable smuggling economy: Grania O''Malley, Captain Monday of Morro
    Bay, and Paco Ramirez. Smaller operators may be independent or work under them.'
  relative_control: Grania leads the strongest operation and controls the former Vandenberg
    Air Force Base and surrounding area north and east to Santa Maria; she also operates
    Oak Knolls airfield, which the source describes as a common drop-off point for
    airborne smugglers.
