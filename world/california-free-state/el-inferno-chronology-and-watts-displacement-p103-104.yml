    "editorial_method": "Independently original-page-reviewed FICTIONAL Shadowrun sourcebook reporting; book narrator, named attributed in-world allegations, and speculative claims remain distinct. No real-world instruction or Third Edition conversion.",
    "locality": "The fictional setting locates El Inferno around Hawthorne, Gardena, and Compton, separated by policy and walls from wealthier Los Angeles districts.",
    "narrative_2022": "The sourcebook's narrator describes 2022 narcotics-trade fighting between the yakuza-associated Green Dragons and Seoulpa-affiliated Tigers, followed by smaller gangs and emerging metahuman-only groups.",
    "narrative_2023": "During the 2023 VITAS II epidemic, a rumor that the MLK-Drew Medical Center in Watts had government serum prompted a crowd to enter; the alleged serum was not there. Rumors of an intentional mass-killing program circulated amid riots. The narrator states 23 soldiers, 89 policemen, and 619 civilians died after Governor Treacle declared martial law.",
    "property_and_displacement": "Corporations reportedly offered to buy destroyed Watts property at about 10 percent of pre-riot valuations; insurers did not cover many owners' losses. The narrator characterizes their sales as effectively involuntary under financial pressure. Rebuilt corporate arcologies and malls displaced former Watts residents toward Compton and Gardena within five years.",
    "later_policies": "The narrator says California's 2036 secession preceded laws limiting food, housing and medical welfare to designated El Inferno housing projects. Local police shifted from protecting neighborhoods to checkpoints and perimeter control. In 2038, authorities established an 11 p.m.–5 a.m. curfew.",
    "lost_election_2046": "Rumors, explicitly not independently substantiated, blamed El Inferno gangs for altered gubernatorial election results in 2046. Sacramento dispatched California State Guard, loaned Lone Star officers and corporate mercenaries; the narrator describes extensive destruction and civilian casualties. Troops withdrew after failing to suppress resistance, and Sacramento declared Los Angeles a Free City two days after the invasion began."
