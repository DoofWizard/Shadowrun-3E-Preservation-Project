    "editorial_method": "Source-reviewed FICTIONAL Shadowrun tabletop-RPG reporting. First-person book narrator, separately named in-world speakers and disputed allegations are distinct; no real-world instructions or Third Edition conversions are implied.",
    "organizations": "The fictional October 25 Alliance and Metahuman People's Army (MPA) are described as the two largest Oakland/Berkeley anti-occupation and metahuman-rights organizations. The regional narrator estimates approximately twenty-five to thirty smaller groups, nearly all affiliated with one of these two.",
    "relations": "The source narrator describes occasional Alliance–MPA competition over recruiting and funds but generally a united opposition to the Japanese megacorporate occupation.",
    "mpa_actions": "The narrator associates the MPA with attacks against Imperial troop transportation and facilities, corporate installations, and corporate employees, including sabotage, bombings and assassination. It also says the organization sometimes kidnaps senior corporate or military officials for ransom or to exchange them for metahuman prisoners held by the San Francisco authorities. Captivity and involuntary detention are not framed as voluntary arrangements.",
    "mpa_resources": "The narrator says the MPA uses funds for its armed campaign and for humanitarian assistance to families of its members killed in guerrilla operations.",
    "alliance_political_strategy": "The narrator distinguishes the October 25 Alliance's wider political organizing from the MPA's more military emphasis. The Alliance regards removal of the occupation as insufficient without building a just local society, although it also acknowledges conducting guerrilla operations.",
    "community_services": "The narrator credits the Alliance with helping local enterprises use the fictional Bay Area's tax framework, creating employment, funding and operating healthcare clinics, cooperative housing and schools at all grade levels, and expanding social assistance formerly supplied by the Sacramento government before secession; the MPA reportedly began limited similar services.",
    "scope": "The political and violent events are invented-world descriptions in a published Shadowrun setting book, not operational guidance."
