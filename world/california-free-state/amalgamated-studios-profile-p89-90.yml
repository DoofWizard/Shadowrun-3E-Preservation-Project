    facts: Amalgamated Studios (AS) dominates Studio City entertainment. The source
      describes it as formed from smaller studios during the 2030s and controlling
      land, media production facilities and resources. Member studios retain distinct
      accounts, so profits and losses are treated separately; AS leadership pressures
      studios to maintain positive results.
  - printed_pages: 89-90
    voice: WilE Coyote narrative
    facts: 'Technical and creative workers are described as highly valuable compared
      with short-lived performers. The source attributes protective systems to AS:
      monitored access, security guards and critters, hardened installations and heavily
      protected Matrix connections.'
