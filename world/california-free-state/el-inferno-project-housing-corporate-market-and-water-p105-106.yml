  editorial_method: Third-person sourcebook reference reporting of the fictional tabletop RPG. Source
    narration, named Shadowland allegations and optional scenarios are not conflated; no real-world
    claims or inferred SR3 conversions.
  source_narrator: Continuation of fictional Los Angeles chapter, described from sourcebook narrator
    perspective.
  gang_dominated_blocks: After official abandonment, local gangs divided blocks and reportedly maintained
    their own protection arrangements; the account notes that residents rarely challenged their rulers
    and that disputes brought violence and collateral damage.
  corporate_subsidized_projects: The narrator alleges that corporate sponsors furnish very limited
    housing, food, basic health care and consumer provisions to marginalized residents in exchange
    for using that captive population for hazardous consumer-product testing, sometimes without informed
    consent or adequate safety checks. This is exploitative experimentation in fiction, not charitable
    care or a voluntary employment arrangement.
  el_whitney_tower:
    construction_year: 2013
    sponsor: Fuchi
    storeys: 6
    unit_description: Two-room apartments in floors two through five, each main room roughly six meters
      by three meters, with shared toilet and food-dispenser facilities.
    amenities: The account describes unsanitary, damaged, inadequately maintained facilities, a small
      health clinic, poor security and communal sanitary arrangements.
    water_service: The narrator reports that water can be unavailable for twenty hours per day; the
      remaining four hours vary unpredictably rather than following a stable schedule.
  distributional_water_priorities: Sourcebook contributors describe an unequal water system favoring
    corporate enclaves and Downtown before East Los Angeles, Harbor, Coast Town and El Inferno; secondary
    claims about theft or recycling are kept attributed elsewhere.
  setting_limit: All described institutions and quantitative details refer to the fictional 2050s
    setting; no real-world corporate or medical allegation intended.
