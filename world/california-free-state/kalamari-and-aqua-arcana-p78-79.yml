  kalamari: Kalamari Incorporated operates a large fictional self-contained underwater
    aquasphere just offshore from Pacific Grove, said to hold as many as 15,000 people.
    The facility houses aquaculture and genetic engineering operations. The narrator
    gives examples of engineered seafood weighing approximately 60 pounds for salmon,
    20 pounds for squid, and a 15-pound prawn.
  aqua_arcana: Aqua Arcana is described as a smaller magical aquaculture-services
    firm that specializes in negotiation and diplomacy with awakened aquatic creatures.
    Official records reportedly list around 35 employees, approximately 10 or 11 magically
    active; others are pilots, deckers and armed support.
  kalamari_merrow_conflict: Merrow clans attacked Kalamari fish pens because the farms
    overlapped clan hunting areas. Aqua Arcana mediated after recognizing that the
    merrow treated this as theft of food resources.
  agreement: After negotiations, the source says the merrow clans gained permanent
    residence near Kalamari pens, received a limited share of catches and unused laboratory
    stock, and served as underwater guards. The original story distinguishes a negotiated
    agreement from a violent removal of the clans.
  vessels: A named commentator describes Aqua Arcana as using two Otters, a GMC Riverine,
    and a custom modified H&C Classique Yacht; this vessel inventory is attributed
    commentary rather than official vehicle-stat publication.
  business_model: Aqua Arcana is reputed to resolve problematic creatures and negotiate
    safer coexistence instead of assuming extermination is necessary.
