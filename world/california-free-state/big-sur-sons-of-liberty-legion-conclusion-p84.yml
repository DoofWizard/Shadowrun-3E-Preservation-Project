    "historical_narration": "The Big Sur chapter narrator identifies the Sons of Liberty as former U.S. Army personnel who resisted the transition to the UCAS and refused to leave the independent California Free State. They stayed at Hunter-Ligett and Camp Roberts with limited military equipment and, in the book's account, no subsequent UCAS operation came to remove them.",
    "force_and_leadership": "The Sons' leader is Major Samuel Hackett. He is portrayed as carrying and frequently reading a copy of the U.S. Constitution, with an interest in United States history, and as having inconsistent views about the coastal pirate organizations depending on what he has most recently read.",
