  local_people_and_organizations:
    Katoz:
      identity: Fictional farmer from the Tooth in Cascade Ork territory.
      belief: Initially believes the powerful entity called the Old One is under his
        control and can repel smugglers.
      narrator_distinction: 'The adventure says the opposite is true: the Old One
        is manipulating Katoz; Katoz is unaware.'
    Old One:
      identity: A man-of-the-woods free nature spirit, not bound to a conjurer, shaman
        or domain.
      motives: The spirit says it will avenge damage to the forest; its precise motivations
        are deliberately left partly to the gamemaster.
      optional_variants: Alternative degrees of the spirit's hostility, judgment or
        interest in metahuman communities are proposed as GM options, not established
        facts.
    Pentagon:
      identity: A fictional group of professional smugglers that carries rare magical
        telesma for the Cascade-based meeting described in the published adventure.
      incident: The smuggling party survived a clash with the Tooth Warriors and the
        Old One but lost its cargo.
    Daisy Quallin:
      identity: Fictional elven talismonger with Native American and European family
        heritage; the source describes her parents as an elf and an Amerindian.
      origin: Born in the disputed northern California Free State and later living
        in Seattle.
      trade: Operates a talismonger store called the Magic Touch, near the Renton
        district's Salish-Shidhe border.
      motivation: Needs her rare magical supplies returned to conduct her magical-foci
        business and regards the players as more trustworthy than the smugglers.
      scope: The source distinguishes her willingness to employ runners for the shipment
        from her general lack of interest in dangerous shadowrunning work.
  geography:
    The Tooth: Mountain area in the Cascade Ork lands, bordering the remote smuggling
      paths west of the greater UCAS.
    Magic Touch: A suburban talismonger shop in Renton, near the Salish-Shidhe border;
      the back room contains a ritual circle.
    Denny Creek: An early road access point north/east of the Seattle border, identified
      as the approach to the trails leading to the Tooth.
  narrative_boundaries: The fictional history is established only as the First Run
    adventure presents it; player decisions and optional gamemaster changes are not
    asserted as accomplished outcomes.
