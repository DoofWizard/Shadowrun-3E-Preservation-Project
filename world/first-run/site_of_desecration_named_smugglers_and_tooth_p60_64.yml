  narrator_characters:
  - names:
    - Daisy Quallin
    page: 60
    book_narrator: An elf enchanter who produces magical items; the source suggests but does not resolve
      how she obtains information linked to a dragon, leaving those details as potential future adventure
      hooks.
  - names:
    - The Pentagon
    page: 60
    book_narrator: A fictional smuggling team moving between New Orleans and Seattle, sometimes via Denver
      or Minneapolis; known for dependable low-profile delivery and prior work for Daisy.
  - names:
    - Pounder
    page: 60
    book_narrator: Black dwarf who founded and leads the Pentagon; laid-back until annoyed, specializing
      in contacts, negotiations and locating illicit shipments.
  - names:
    - Breetva
    pages: 60-61
    book_narrator: Russian-born negotiator whom Pounder recruited after observing her handling of a shipment
      and her capability in a violent dispute with double-crossing suppliers. Her New Orleans business
      reputation is described as formidable and contested.
  - names:
    - Heeley
    page: 61
    book_narrator: Pentagon rigger whose GMC Banshee is named Creole Lady and has been damaged; a longtime
      associate of Pounder who previously served as an intermediary between smuggling groups, with a penchant
      for deceptive betting competitions.
  - names:
    - Red-Scale-Snake
    - Night-Strike-Woman
    pages: 61-63
    book_narrator: Two Pueblo ork sisters who formerly belonged to the Pueblo Corporate Council territory.
      The narrator states they were trafficked as enslaved people for sexual exploitation by a wealthy
      fictional CAS landowner; they killed that landowner upon arrival, later became homeless in New Orleans
      and were recruited by Pounder, who opposes the trafficking trade. Red follows Snake as a shaman;
      Night-Strike-Woman is the older protective sister and an adept. The sisters work together in smuggling
      and tribal-cultural travel.
  - names:
    - The Old One
    page: 63
    book_narrator: A rare powerful man-of-the-woods, a non-conjured forest spirit attached to the physical
      plane that may appear as a human figure, deep shadow, tree or woodland animal. The author leaves
      its motives to the gamemaster; the source says it can return after combat and serve as an enigmatic
      recurring character.
  - names:
    - Kaztok
    pages: 63-64
    book_narrator: A charismatic troll organizer of the Tooth Warriors who resents the smuggling community.
      The narrator establishes that he uses the spirit as a perceived ally to intimidate crews, seize
      cargo and gather adherents.
  - names:
    - Crescent Eye
    page: 64
    book_narrator: An ork farmer whose personal conscience opposes Kaztok’s plans despite pressures of
      loyalty to the Tooth Warriors and Black Dogs.
  publication_context: These are fictional book-narrator descriptions of invented-world events and characters,
