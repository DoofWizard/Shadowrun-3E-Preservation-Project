{"id":"world.first_run.supernova_chavez_nigel_novatech_renraku_case_revelations_p33_36","record_type":"world","status":"reviewed_forward_unindexed","source":"source.fasa-7329","printed_pages":"33-36","pdf_pages":"34-37","edition_scope":"FASA Corporation First Run, FASA7329 (1999), original Shadowrun Third Edition FICTIONAL tabletop RPG adventure; no later-edition conversion","content_class":["world_fact"],"data":{"publication":{"title":"First Run","publisher":"FASA Corporation","author":"Michael Mulvihill","copyright_year":1999,"catalog_number":"FASA7329","source_id":"source.fasa-7329","edition":"original Shadowrun Third Edition","cataloged_original_pdf_sha256":"222cb911ef86b0ddf2a853d622068859fe09a078d23c881a32cee0100eaf0c5e","printed_pages":"33-36","physical_pdf_pages":"34-37"},"original_page_mapping":{"printed_33":34,"printed_34":35,"printed_35":36,"printed_36":37},"fictional_setting":"Original 1999 Shadowrun Third Edition Supernova adventure. Authorial GM revelations are distinguished from what fictional participants tell others and from branching player choices.","people":[{"name":"Nigel Terwilliger","setting_role":"Fictional TekLon employee and inexperienced Mr. Johnson who had done covert work for Renraku and Novatech.","agency":"The author reveals that Nigel copied TekLon research files into the switched case and hired the runners to regain it after Chavez's intervention.","certainty":"GM explanation established in scenario, rather than Nigel's earlier cover story."},{"name":"Elizabeth Chavez","setting_role":"Fictional corporate courier and employee associated with Novatech; initially appears as the target of the Four Corners rescue/exchange.","agency":"Chavez discovered missing or destroyed research files, confronted Nigel, recognized his behavior and made an alternative exchange plan. After claiming a package and fleeing, she arranged for Nigel to be given a case involving a Novatech contact. The scripted encounter leaves her dead at her vehicle.","uncertainty":"Player decisions may alter the encounter; presented as the source's authored sequence."},{"name":"Richard Villiers","setting_role":"Fictional owner/CEO of Novatech, introduced as one of the megacorporation's leaders; orchestrates the meeting and attempts to obtain the valuable case.","agency":"He questions the team, commands the conversation, pays the agreed fee with black credsticks, confronts Nigel about his actions and the source-script depicts him allowing Lanier to kill Nigel.","certainty":"In-scene authored scenario, not real-world allegation."},{"name":"Miles Lanier","setting_role":"Fictional security leader and ally to Villiers; appears at the meeting and handles information from Chavez's PDA.","agency":"He handles security, reads Chavez's PDA, explains how the corporate-case transfer unfolded, and, in the authored script, fatally shoots Nigel with a suppressed pistol.","certainty":"Source's narrated encounter; not a mandatory outcome if play branches."}],"corporate_relationships":{"Renraku":"Fictional corporation whose elite Red Samurai and hired assets pursue a disputed case.","Novatech":"Fictional corporation led by Villiers with employee Chavez; corporate property and interests are central to the affair.","TekLon":"Fictional research corporation whose missing files, Alpha Wing and original contract are implicated.","ambiguity":"Some characters act on mistaken or incomplete beliefs about which case contains what; the source distinguishes Renraku's intended case, a Novatech-marked package and the valuable microtronic head."},"documents_and_meetings":{"pda":"Chavez's fictional PDA points toward a payout meeting and carries entries that establish how the cases were changed.","penthouse":"The written scenario stages the encounter at a downtown penthouse where Villiers and Lanier examine the case and discuss Nigel's actions.","payment":"The written agreement is settled through the GM-authored exchange; variations depend on whether player characters bring the case, the PDA, both or neither.","red_samurai":"An earlier Red Samurai confrontation is explicitly an enemy corporate action in the scripted scenario, not something every playthrough must reproduce."},"editorial_notes":"Fictional in-world accusations, false cover stories, and the narrator's GM knowledge are not merged into historical real-world fact. A character's death, persuasion and money transfer are scenario events conditional on player responses."},"headline":"Supernova — fictional case-switch chronology and character/corporate revelations","summary":"Original-page reviewed First Run (FASA Corporation, FASA7329, 1999), original Shadowrun Third Edition fictional world reference, printed pp33–36/PDF34–37; Nigels's dual-corporate work, Chavez's agency, Villiers/Lanier disclosures and alternative player outcomes.","framing":"newsroom_neutral"}
