{"id":"world.first_run.supernova_fuchi_teklon_terwilliger_chavez_p20_22","record_type":"world","status":"reviewed_forward_unindexed","source":"source.fasa-7329","printed_pages":"20-22","pdf_pages":"21-23","edition_scope":"FASA Corporation, First Run (FASA7329, copyright 1999), original Shadowrun Third Edition fictional tabletop RPG adventure; no later-edition conversion","content_class":["world_fact"],"data":{"publication":{"title":"First Run","publisher":"FASA Corporation","author":"Michael Mulvihill","copyright_year":1999,"catalog_number":"FASA7329","source_id":"source.fasa-7329","edition":"Shadowrun Third Edition","cataloged_original_pdf_sha256":"222cb911ef86b0ddf2a853d622068859fe09a078d23c881a32cee0100eaf0c5e","printed_pages":"20-22","physical_pdf_pages":"21-23"},"original_page_mapping":{"printed_20":21,"printed_21":22,"printed_22":23},"scope":"Fictional sourcebook historical background and GM-only scenario relationships from First Run's Supernova chapter, set in the game's year 2061. Narrator-established background, attributed corporate claims, and hypothetical later events are explicitly differentiated.","published_world_background":{"year_in_setting":2061,"locale":"Seattle, with a later fictional laboratory in Auburn","corporate_conflict":"The source describes the Renraku-Fuchi corporate conflict and Fuchi's breakup into three divisions.","fuchi_divisions":[{"division":"Americas","executive":"Richard Villiers","outcome":"Creation of Novatech after Fuchi's collapse."},{"division":"Asian","executive":"Shikei Nakatomi","outcome":"The division joins rival Renraku."},{"division":"Pan Europa","executive":"Korin Yamana","outcome":"The division joins Shiawase."}],"renraku_fate":"Novatech's and Renraku's subsequent competition is depicted alongside Renraku's sealed Seattle Arcology, where the book says almost one hundred thousand people were trapped; the adventure is not a definitive explanation of the Arcology's events."},"orphan_corporations":{"published_definition":"Companies whose ownership and funding became opaque through nested holding or shell firms; Fuchi's breakup removed some of the paper trails for such businesses.","example":"TekLon Electronics, fictional microelectronics/cybertechnology firm; the book says employees were unaware of the full scope of Fuchi's investment.","competing_claims":"Renraku and Novatech each claim to be TekLon's legitimate parent company; these are their claims, not separately adjudicated corporate rights.","source_qualifier":"The company's management seeks independence while the rival corporations seek its research; the source describes their opposing intentions."},"characters_and_relations":[{"name":"Nigel Terwilliger","role":"A cleanup specialist secretly associated with Novatech; appears to players as Mr. Johnson.","narrator_established":"Fictional corporate operative who had penetrated TekLon and obtained one case with a prototype cybernetic head, then arranged to redirect its value to Renraku.","agency":"His double-dealing is his own action. The book says Renraku learned of it and arranged to secure his information; neither rival's stated claim to ownership is silently accepted as narrator fact."},{"name":"Elizabeth Chavez","role":"TekLon research scientist loyal to Novatech.","narrator_established":"She discovers Terwilliger's double-dealing and leaves with a case she believes belongs to Novatech. The source clarifies the case contains copies of research files Novatech already has rather than the prototype it seeks.","belief_vs_fact":"Chavez wrongly assumes the taken case is the novel property, while the source says the actual prototype remains in a different case at TekLon."},{"name":"Richard Villiers","role":"Novatech owner.","scenario_position":"An intended later recipient of the prototype case; the published adventure has a confrontation after the associated meeting."},{"name":"Miles Lanier","role":"Novatech security leader.","scenario_position":"Accompanies or meets Villiers in the described later scene; the source's outcome depends on player characters' actions."}],"fictional_plot_structure":{"initial_task":"Terwilliger offers the runners a case-retrieval job in TekLon.","intervening_actions":"The published scenario anticipates Renraku activity against TekLon and a proposed exchange involving Chavez's case.","conditional_later_stages":"The source outlines a chase/encounter with Red Samurai, a downtown meeting with Villiers and Lanier, and an eventual dispute over the case. These are GM-provided narrative events subject to player choices, not fixed historical outcomes.","provenance_distinction":"The p22 timetable summarizes scenario scenes, not a canonical assertion that the characters inevitably succeeded."},"cross_reference":"The introductory TekLon corporate-contact rumor/examples appear earlier in this book, printed pp8–9; those are examples of attributed contacts and not overridden by these GM-only background facts."},"headline":"Supernova — TekLon, corporate succession and fictional character relationships","summary":"Source-reviewed historical Shadowrun Third Edition world reference from FASA Corporation's First Run (FASA7329, 1999), printed pp20–22/PDF pp21–23: fictional source-narrator background, attributed ownership claims and optional scenario outcomes.","framing":"newsroom_neutral"}
