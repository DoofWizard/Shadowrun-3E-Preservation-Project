  characters:
  - name: Richard Villiers
    printed_pages: 42-43
    source_period_role: Owner and CEO of fictional Novatech, Inc.
    narrator_history:
    - First developed a small Boston gray-market cyberdeck company.
    - Following mysterious deaths of two owners and damage to that company, sold its cyberdeck concepts
      and remaining assets to Fuchi in exchange for one-third ownership.
    - Later exploited rival megacorporate conflicts, left Fuchi with enough strength to found Novatech,
      and became known for the “Villiers Maneuver.”
    - Moved corporate operations from New York to Boston following Novatech creation.
    personality: Narrator describes a ruthless, calculating strategist who can charm and leverage shadowrunners
      but puts business first; generally travels alone.
    physical_description: Appears at the height of his powers, slightly shorter than Miles Lanier, sturdy
      build, black hair and olive-cast skin, no obvious cyberware.
    source_attributed_memory_claim: Narrator credits Villiers with a photographic memory.
  - name: Miles Lanier
    printed_pages: 42-43
    source_period_role: Novatech head of corporate and personal security and longtime Villiers ally
    narrator_history:
    - Built highly effective Fuchi and then Novatech corporate security systems, regarded as an especially
      difficult adversary by fictional deckers and shadowrunners.
    - Became a public figure after Dunkelzahn’s testament left him a seat on the Renraku board.
    - While serving on Renraku’s board, secretly worked in the interests of Villiers and Fuchi and exposed
      a planned Renraku Matrix crash.
    - After Novatech’s creation, sold his Renraku shares and joined as Novatech head of security.
    attributed_contested_claim: Lanier publicly claimed no prior contact with Dunkelzahn; fictional investigators
      reportedly corroborated that statement. This is an attributed claim, not established proof of his
      private history.
    physical_description: Mid-forties, youthful, taller than average, slightly built, chestnut hair, very
      dark brown eyes, intense manner.
    uncertain_rumor: Other people speculate that his eyes are cybernetic, but the text does not confirm
      this.
  relationship_and_ethics: Narrator establishes Richard Villiers and Miles Lanier as business partners
    and longtime friends. The source frames their strategic ruthlessness and manipulation of runners as
    fictional historical characterization, not real-world allegations.
  note_on_personality: Published narrator treats these characters as major institutional powers and shadowrunner
    patrons/adversaries; no unsupported fixed attributes are created.
