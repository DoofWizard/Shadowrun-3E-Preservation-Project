execution:
  executor: "Nadja Daviar"
  role: "Executor of Dunkelzahn's estate and chair of the Draco Foundation, with authority to appoint trustees and oversee execution of the will."
  bulk_estate: "Left to Nadja Daviar except for property specifically named elsewhere in the will."

bequests:
  - {recipient: "Akira Kageyama", bequest: "Vancouver complex and the money in the trust fund established in his name."}
  - {recipient: "Holder of the patent for the twentieth-century open-flame popcorn process described as Speedy Pop/Quick Pop or similar", bequest: "20,000,000 nuyen", condition: "Renew the patent and resume production."}
  - {recipient: "Astral Space Preservation Society", bequest: "Establishment directed through the Draco Foundation and DIMR", purpose: "Monitor abuses of astral space, protect astral denizens, define working parameters between spirits and metahumanity, and create an astral sanctuary."}
  - {recipient: "VisionCrafters", bequest: "20,000,000 nuyen", purpose: "Research into advanced optics."}
  - {recipient: "Research into magical phenomena dangerous to metahumanity", bequest: "4,000,000 nuyen administered by the Draco Foundation", examples: "The foveae in Aztlan and the recent Chicago tragedy."}
  - {recipient: "Markus Dummemermum", bequest: "A small token of esteem distributed by the Draco Foundation."}
  - {recipient: "Ancient Wisdom Fund for Education", bequest: "10,000,000 nuyen", purpose: "Scholarships in scientific and technological fields."}
  - {recipient: "Government of Tir Tairngire or Tir na nOg, whichever first publicly discloses complete personal histories of all high government officials", bequest: "The First Key of Power", condition: "Disclosure supervised by the Draco Foundation."}
  - {recipient: "Aden", bequest: "The Shroud of Shadows."}
  - {recipient: "Lone Star or Knight Errant, whichever first develops an inexpensive effective non-lethal stun technology accurate at 100 meters", bequest: "A five-pound brick of orichalcum."}
  - {recipient: "John Timmons Memorial Foundation for the Advancement of Equality", bequest: "12,000,000 nuyen", purpose: "Equal rights for all peoples regardless of physical appearance, beliefs or origin."}
  - {recipient: "NewsNet", bequest: "2,000,000 nuyen", purpose: "Investigate Dunkelzahn's death and produce a comprehensive documentary."}
  - {recipient: "Lorelei Angel", bequest: "3,000,000 nuyen", condition: "Donate it in her name to a charity of her choice."}
  - {recipient: "Dunkelzahn Institute for Magical Research Consortium (DIMC)", bequest: "100,000,000 nuyen", purpose: "Study magic in all its aspects through a multi-institution management team."}
  - {recipient: "Dunkelzahn Institute of Magical Research", bequest: "Dunkelzahn's body for research."}
  - {recipient: "Yakishima Technologies", bequest: "150,000,000 nuyen", purpose: "Biotechnology research and products intended to benefit the world."}
  - {recipient: "Althine Oakforest", bequest: "The Rose Crystal."}
  - {recipient: "First party to develop a plant hardy enough to flourish in and eventually clean heavily smog-damaged cities such as Tenochtitlan", bequest: "20,000,000 nuyen."}
  - {recipient: "Named individuals to be rescued from the Chicago Containment Zone", bequest: "100,000 nuyen each", named_people: "James Delany, Dr. Edward Oden, Gregory Artwimster, Protacio Corcoran, Katherine Sitsu and Sissel McCarthy."}
  - {recipient: "Brock Higginbotham", bequest: "Controlling interest in the Pleasure Dome Hotel, Palm Springs", condition: "Spend one full moon-to-full-moon stay at Ubehebe Crater in the Mojave Desert."}
  - {recipient: "Alamais", bequest: "The fruitcake exchanged every Christmas since 2020."}
  - {recipient: "Party that locates Dunkelzahn's headless dragon skeleton", bequest: "Choice to keep the bones or surrender them to the Draco Foundation for a reward", provenance: "The will supplies five candidate coordinate sets and requires independent verification as dragon remains."}
  - {recipient: "Amy Park", bequest: "Title to the Buhne Building."}
  - {recipient: "Matrix-capable party who discovers the place described as 'where a Rock meets the Sky'", bequest: "2,000,000 nuyen plus amulets and weapons at the site", condition: "Complete the task contained in accompanying datachips within one year of Dunkelzahn's death."}
  - {recipient: "Ryumyo", bequest: "The Ring Ouroboros."}
  - {recipient: "Group or individual who ensures the safe return of Mary-Beth Tyre to her home", bequest: "1,000,000 nuyen."}
  - {recipient: "Any person born 8 December 1980", bequest: "One wish granted through the Draco Foundation."}
  - {recipient: "Fund established in the name of the Misguided Six", bequest: "250,000 nuyen", purpose: "Assist victims of magical crimes and their families."}
  - {recipient: "American Association for the Advancement of Thaumaturgy", bequest: "500,000 nuyen", purpose: "Public education about the nature of magic."}
  - {recipient: "Robert J. Hermetics", bequest: "A small token of esteem distributed by the Draco Foundation."}
  - {recipient: "Person who can prove he or she shook hands with John F. Kennedy", bequest: "One wish granted through the Draco Foundation."}
  - {recipient: "Beatrice Wilder of Paris", bequest: "Dunkelzahn's mountain retreat at Rikon near Zurich."}
  - {recipient: "Holder of a ticket stub to Maria Mercurial's only foray into country music at My Brother's Place in the Nashville sprawl", bequest: "One wish granted through the Draco Foundation."}
  - {recipient: "Robert Khamdeng", bequest: "The Weeping Stone of Ta'bel and optical chip BK-924."}
  - {recipient: "Sean Laverty", bequest: "Dunkelzahn's estate in Tir Tairngire."}
  - {recipient: "George 'Locomotive' Fenamore", bequest: "Locked steel box number 412 at Manhattan Citibank Depository", condition: "Not to be opened until he deems it absolutely necessary or successfully survives another Double Tuesday."}
  - {recipient: "Bethlehem Steel", bequest: "2,000,000 nuyen plus 500,000 nuyen danger pay", purpose: "Destroy fifteen specified steel boxes unopened if delivered to the main furnace crew boss."}

