id: world.project.ares-complex-68g
record_type: world
name: "Ares Complex 68G insect-spirit research"
domain: corporations
status: ingested
source_period: "2062"
game_information:
  organization: "Ares"
  public_cover: "Freshwater aquaculture research under the Consumer Aquaculture Research Program."
  hidden_program:
    - "The facility is used to study captured insect spirits and insect shamans."
    - "The project experiments with non-metahuman hosts, including ordinary and paranormal animals, to produce insect-spirit guard creatures."
    - "The source says the project has primarily used the resulting hybrids for guard duties so far."
    - "The project avoids relying on true-form spirits where possible and favors controllable flesh-form results."
  security_and_secrecy:
    - "The facility is deliberately isolated and unusually well protected for its public cover."
    - "Its Matrix access is physically constrained; the source-period account describes local transfer between separated systems rather than straightforward remote access."
  risk:
    - "The GM-facing section explicitly warns that insect spirits remain self-interested and may eventually exploit or escape the controls placed on them."
campaign_use:
  - "The source suggests exposing the facility, corporate counter-runs, internal corporate conflict, or deployment of hybrid guard creatures as adventure hooks."
