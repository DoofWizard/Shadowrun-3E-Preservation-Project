framing: newsroom_neutral

name: "Gang tiers and subcultures"

tiers:
  third_tier:
    label: "local"
    scale: "typically a handful to a few dozen members"
    scope: "specific neighborhood, turf or local area"
    role: "small local organizations often used by larger groups as intermediaries, contractors or expendable support"
  second_tier:
    label: "metroplex player"
    scale: "membership may reach into the hundreds"
    scope: "usually one metroplex or a smaller city"
    role: "large enough to participate directly in local illicit markets and to work as distributors or intermediaries for larger syndicates"
  first_tier:
    label: "multi-city player"
    scope: "chapters or influence in multiple metroplexes"
    examples:
      - Ancients
      - Cutters
    role: "significant organizations with cross-city distribution and enough structure to participate in major markets while still remaining below the principal syndicates"

culture:
  - "Gang identity is commonly expressed through territory, symbols, colors, language and initiation traditions."
  - "Leadership models vary from personality-driven groups to paramilitary or corporate-style structures."
  - "The source presents leadership quality and continuity as major factors in whether a gang grows, fragments or collapses."
  - "Some gangs develop relationships with larger syndicates, spirits or other Sixth World patrons."

specialized_types:
  go_gangs:
    - "Mobile road and highway gangs place prestige on riding ability, equipment and mobility."
  wizzer_gangs:
    - "Magic-focused gangs consist largely of young magical talent and are portrayed as volatile because of strong personalities and uneven training."
  matrix_gangs:
    - "Matrix-focused gangs use inexpensive or improvised cyberdecks and software for low-level Matrix activity, territorial display and digital nuisance work."

mechanics_audit:
  protected_classes_found: []
  findings:
    - "These tier descriptions are setting taxonomy here; the formal gang-creation and gang-stat rules appear later in the source."
    - "No target number, dice-pool modifier, damage code, Availability value, cost, formal test, character option or stat block is defined on printed pp.68-72."

