entries:
  - id: world.location.chicago-2062-awakened
    name: "Chicago"
    profile:
      - "Recovery from the Cermak blast and insect-spirit crisis continues."
      - "Strain III remains an anti-magic hazard and bug remnants persist."
      - "Black-market trade, research, escort, salvage and security work remain active."
  - id: world.location.dunkelzahn-rift
    name: "Dunkelzahn's Rift"
    profile:
      - "UCAS authorities enclosed and warded the rift in DeeCee and planned a permanent containment and research facility."
      - "The rift reportedly stabilized and became less dangerous in ordinary astral space."
      - "UCAS-sponsored explorers were attempting transit and reporting different destinations, suggesting links to uncatalogued metaplanes."
      - "Claims that something prevents the rift from being closed remain unverified."
  - id: world.location.dunvegan-castle
    name: "Dunvegan Castle"
    profile:
      - "Clan MacLeod ancestral castle in Scotland, situated on the Scythe Ley."
      - "Home of the Fairy Flag of Dunvegan, traditionally said to summon Sidhe aid up to three times; the source says it has supposedly been used twice."
      - "Security increased after Tir na nOg reportedly attempted to purchase the flag in 2035."
      - "Astral observers report the flag glows brightly."
  - id: world.region.egypt-awakened-2062
    name: "Egypt"
    profile:
      - "Power-site reports and magical manifestations increased along the Nile and around major ancient monuments."
      - "Astral echoes or remnants of ancient structures are reported."
      - "Spirits resembling Egyptian religious figures and ancestral-memory or reincarnation experiences are increasingly reported."
  - id: world.location.mojave-desert-awakened
    name: "Mojave Desert"
    profile:
      - "Spirit and paranormal activity increased after Halley's Comet, especially around Ubehebe Crater and desert sites."
      - "Some expeditions disappeared or were found destroyed without clear cause."
      - "Demand rose for magical experts able to handle hostile spirits and dangerous paranormal fauna."
  - id: world.location.mount-shasta
    name: "Mount Shasta"
    profile:
      - "Hestaby became increasingly public and politically active from her Mt. Shasta lair."
      - "The Shasta Lodge expanded recruitment and regional magical influence."
      - "The area received metahuman refugees fleeing General Saito's California expansion."
      - "Reports describe increased magical activity and unusual auroral displays."
  - id: world.location.salem-massachusetts-awakened
    name: "Salem"
    profile:
      - "Salem experienced a renewed influx of witches, Wiccan and neo-pagan practitioners, tourists and Awakened residents."
      - "Solstice celebrations and rising magical interest increased population and real-estate pressure."
      - "Tension grew between long-time residents and newly arrived Awakened communities."
  - id: world.location.tehran-ruins
    name: "Tehran"
    profile:
      - "The source recounts Aden's 2020 destruction of Tehran after a jihad was declared against the Awakened."
      - "By the source period the abandoned ruins are described as a haven for criminals, smugglers, ghouls, spirits and other dangerous entities."
      - "Stories of walking dead and intense ghost activity remain reports, not formal mechanics."
sources:
  - {source: source.fanpro-10651, printed_pages: "94-98", pdf_pages: "95-99", relation: defines_edge_reports}
notes:
  - "Posts From the Edge mixes observation, rumor and shadowtalk; unverified reports are not promoted to rules."
