id: world.location.target-wastelands-underwater-sites
record_type: world
name: "Target: Wastelands Underwater Sites"
domain: locations
status: ingested
source_period: "2062"

overview:
  oceanic_development: "By 2062 major corporations operate underwater mining, aquaculture, power, research and military facilities, with most deep installations depending on specialized pressure-control, life-support and security systems."
  access: "Surface rigs, submersibles, supply craft, docking facilities and dedicated Matrix or satellite links are the normal access paths; deep facilities may be isolated from ordinary local networks."

sites:
  ares_sigsbee_plain_platforms:
    operator: "Ares Macrotechnology"
    location: "Sigsbee Plain, Gulf of Mexico"
    function: "high-pressure construction and testing of heavy modules for space habitats"
  renraku_underwater_city:
    operator: "Renraku Underwater Living"
    location: "off Luzon and Negros, Philippines"
    function: "planned 25-square-kilometer domed city and offshore arcoblock program"
    source_period_status: "construction delayed after the Pacific Rim / Renraku crisis; projected completion had been 2065"
  renraku_java_trench_facility:
    operator: "Renraku Underwater Living"
    location: "Java Trench"
    depth: "about 1,500 meters"
    source_period_status: "facility exists but was evacuated after a lethal pressure-control incident"
  yamatesu_kuroshio_offshore_power_plant:
    operator: "Yamatesu"
    location: "east of Japan"
    function: "hydroelectric and current-driven power generation using the Kuroshio current"
  yamatesu_drake_passage_project:
    operator: "Yamatesu"
    location: "Drake Passage"
    source_period_status: "planning-stage megaproject"
  aquapothecary_cocos_ridge_station:
    operator: "Aquapothecary"
    location: "Cocos Ridge, off the Galapagos"
    function: "aquatic biotech research"
  arboritech_vanguard_station:
    operator: "Shiawase Envirotech / Arboritech"
    habitat_type: "mobile aquaculture research station"
    location: "Chatham Rise, east of New Zealand"
    personnel: 30
    notes:
      - "Transportable modular facility operating in a nitrox-derived pressurized environment."
      - "Used for ecosystem research, pollution monitoring and endangered-species genetic sampling."
  ares_trident_aquacology:
    operator: "Ares Macrotechnology"
    habitat_type: "research aquacology"
    location: "Guiana Basin, east of the Greater Antilles and Caribbean Sea"
    function: "oceanic weapon development"
    personnel: 3000
    notes:
      - "Large military/R&D complex protected by Knight Errant and dedicated underwater defenses."
      - "Primary Matrix systems are in the submerged half and outside access depends on controlled uplinks."
  cadmus_deep_habitat_colony:
    operator: "Saeder-Krupp Heavy Industries & Chemicals"
    habitat_type: "experimental mining colony"
    location: "Iberian Abyssal Plain"
    depth: "about 3,200 meters"
    personnel: 2000
    notes:
      - "One-atmosphere self-sufficient colony supporting automated deep-mining operations."
      - "Defended by drones, mines, torpedo racks and submarine support."
  mitsuhama_aqualogic_platform_17:
    operator: "Mitsuhama-Benguet Mining"
    habitat_type: "partially submerged mining platform"
    location: "Cape Verde Shelf"
    submerged_depth: "about 1,700 meters"
    personnel: 500
    notes:
      - "Submerged work section uses an ambient-pressure trimix environment."
      - "Facility is also used for Atlantean Foundation/Pentacle archaeological work in the source-period narrative."

