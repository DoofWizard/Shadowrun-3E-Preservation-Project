entries:
  - id: world.location.chaco-canyon-anasazi
    name: "Anasazi Ruins / Chaco Canyon"
    printed_pages: "78-81"
    profile:
      - "Large Anasazi ruin complex centered on Chaco Canyon, culturally and spiritually important to the Pueblo."
      - "Reports include a ghost-river effect, dense spirit activity, visions, spontaneous manifestations, shamans and underground ritual chambers."
      - "The Pueblo Corporate Council closed the site to outsiders in September 2061 and brought in shamans and scientists."
      - "Ute interest in the site created political friction with the Pueblo."
    confidence:
      - "Extraterrestrial explanations are shadowtalk speculation."
  - id: world.location.angkor
    name: "Angkor"
    printed_pages: "81-82"
    profile:
      - "Historic Khmer temple-city in Cambodia near Tonle Sap."
      - "The source-period government feared rebel activity there and hired mercenaries."
      - "A first-hand runner account reports Angkor controlled by nagas with other paranormal beings, including merrow."
      - "The naga-led force appeared organized and magically capable."
  - id: world.location.bermuda-triangle
    name: "Bermuda Triangle"
    printed_pages: "82-84"
    profile:
      - "The source reports continuing disappearances, strange storms or fog, lights, voices and anomalous ship or aircraft incidents."
      - "After the Yucatan earthquake, reports of possible mana-storm-like disturbances increased."
      - "Astral-rift explanations are discussed but not established."
      - "The Atlantean Foundation is reported to investigate the Bimini Road and maintain activity around Bermuda."
  - id: world.location.callanish
    name: "Callanish"
    printed_pages: "84-86"
    profile:
      - "Ancient standing-stone circle on the Scythe/Sickle Ley on the Isle of Lewis."
      - "On the Winter Solstice of 2061 an unauthorized ritual left the circle blood-marked with a sacrificed Black Angus bull."
      - "The ritual used old Celtic forms and appears to have been conducted by experienced practitioners."
      - "Rumors connect the event to the Holy Circle of Alba; ley activity was reported unusually strong afterward."
  - id: world.location.crater-lake
    name: "Crater Lake"
    printed_pages: "86-88"
    profile:
      - "Tir Tairngire treats Crater Lake and Tesetelinestea as highly sensitive magical sites."
      - "A military cordon operated from May 2054 to November 2055, including air-elemental protection and anti-surveillance measures."
      - "After Dunkelzahn's assassination, the Tir again tightened security."
      - "A 2061 auroral display and continuing ceremonial activity were reported."
    confidence:
      - "Orichalcum and dragon-hoard explanations are shadowtalk speculation."
  - id: world.location.mount-kilimanjaro
    name: "Mount Kilimanjaro"
    printed_pages: "88-89"
    profile:
      - "Sacred mountain associated with local spirits and a proposed Corporate Court mass-driver launch complex."
      - "Survey and negotiating teams encountered spirits warning them away from the summit."
      - "Six corporate negotiators were later found dead after failed talks."
      - "Corporate interests reportedly shifted toward spirit suppression while local and Awakened groups opposed the project."
  - id: world.location.nasca-lines
    name: "Nasca Lines"
    printed_pages: "89-91"
    profile:
      - "Large geoglyph complex on the Nasca plateau in Peru."
      - "Before late 2061 the lines were astrally vivid but not especially powerful."
      - "During the 21 December 2061 solstice, a ritual coincided with the lines glowing physically and astrally and with a surge in visions and shamanic experiences."
      - "Peru cordoned the site and restricted access to research teams."
  - id: world.location.tai-shan
    name: "T'ai Shan"
    printed_pages: "91-92"
    profile:
      - "One of China's sacred mountains and a long-standing Taoist pilgrimage site associated with powerful chi."
      - "Competing regional powers moved toward the mountain after its magical importance increased."
      - "The great dragon Lung intervened, declared the mountain under his protection and established his lair at the summit Temple of the Jade Emperor."
  - id: world.location.teotihuacan
    name: "Teotihuacan"
    printed_pages: "92-94"
    profile:
      - "Major pre-Aztec ceremonial complex northwest of Tenochtitlan."
      - "Aztlan treats the site as a national and religious treasure and resumed ritual use there."
      - "The site is treated with unusual caution even by Aztlan magicians and security."
      - "A high-ranking shaman, Quauhtlatoa, performed a conspicuous ritual after Yucatan disturbances; increased spirit activity was reported afterward."
      - "Conjuring is rumored to be prohibited and magically enforced."
sources:
