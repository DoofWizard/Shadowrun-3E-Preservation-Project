id: world.location.target-wastelands-underwater-installations-detail
record_type: world
name: "Target: Wastelands Underwater Installation Detail"
domain: locations
status: ingested
source_period: "2062"

installations:
  arboritech_vanguard_station:
    canonical_parent: world.location.target-wastelands-underwater-sites
    operator: "Shiawase Envirotech / Arboritech"
    location: "Chatham Rise east of New Zealand"
    function: "Mobile aquaculture research station"
    personnel: 30
    structure:
      - "Six cylindrical modular sections."
      - "Can operate at any depth described by the source with interior pressure up to ten atmospheres using a nitrox-derived environment."
      - "Sections separate docking/maintenance, life support and supplies, crew habitation/recreation, control/medical, research, and sample/document storage."
      - "A surface vessel supports weekly data/sample retrieval and emergency assistance."
    operations:
      - "Six-month to one-year research tours."
      - "Crew receives periodic surface leave, medical checks and psychological evaluations."
  ares_trident_aquacology:
    canonical_parent: world.location.target-wastelands-underwater-sites
    operator: "Ares Macrotechnology"
    location: "Guiana Basin east of the Greater Antilles and Caribbean Sea"
    function: "Oceanic weapon development"
    personnel: 3000
    structure:
      - "Three interconnected Egyptian-style pyramidal towers, each about seventy stories."
      - "Lowest ten floors contain high-ceiling work bays and major mechanical systems."
      - "Next twenty floors are work areas, research labs and weapon-development space."
      - "Five dead-space floors separate weapon research from adjoining occupied sections."
      - "Upper floors contain residential, commercial, entertainment and office functions."
      - "Critical systems include redundant power generation, filtration and other life-support machinery."
    security:
      - "Described as a military-grade compound with Knight Errant internal security."
      - "Dedicated underwater weapons are developed and deployed on site."
      - "Hydrostatic pulse cannon technology is described as operational at the facility in the source-period narrative."

