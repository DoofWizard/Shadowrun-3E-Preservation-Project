id: world.location.target-awakened-lands-sites
record_type: world
name: "Target: Awakened Lands — Game-Information Sites"
domain: locations
status: ingested
source_period: "2062"
sites:
  uluru:
    provenance: {source: source.fanpro-10651, printed_page: 116, pdf_page: 117}
    power_site_rating: 5
    aspecting: "Aboriginal magic; also aspected against all other forms of Conjuring, but not Sorcery."
    intruder_spirit_effects: "Spirit powers may target outsiders at Force 6, especially Accident."
    spirit_caves:
      barriers: "Permanent/quickened Force 8 physical and astral barrier spells."
      opal_capstones: "Power foci from Force 1 to Force 6+; must be bonded; removing one frees imprisoned spirit(s)."
  kata_tjuta:
    provenance: {source: source.fanpro-10651, printed_page: 117, pdf_page: 118}
    power_site_rating: 4
    aspecting: "Aboriginal magic; acts as background count against all other magic."
    rifts: "Temporary irregular astral rifts may permit non-magicians astral/metaplanar access."
  lasseters_reef:
    provenance: {source: source.fanpro-10651, printed_page: 117, pdf_page: 118}
    type: alchera
    special: "Its free great ancestor spirit has Wealth and Personal Domain and can allow gold/orichalcum to leave."
  lake_mungo:
    provenance: {source: source.fanpro-10651, printed_page: 117, pdf_page: 118}
    background_count: 1
    near_alchera_background_count: 2
  chambers_pillar_castle_rock:
    provenance: {source: source.fanpro-10651, printed_page: 117, pdf_page: 118}
    power_site_rating: 1
    aspecting: "Gecko shamans"
    flare: "On certain nights rises as high as Rating 3."
    spirit_release_ritual: {equivalent_force: 8, sending_linking_tn: 8, drain: "8D", requirements: "All participants spill blood; leader koradji knows Sacrificing."}
  kakadu:
    provenance: {source: source.fanpro-10651, printed_page: 118, pdf_page: 119}
    power_sites: "Numerous Rating 1-4 plus spirit caves."
    wild_magic:
      trigger: "At sunset roll 2D6; on 10+, roll 2D6 on this table for an event in the next 24 hours."
      table:
        2: "Astral rift deposits a free solitary insect-spirit Mother: 1D6 Force and (1D6 / 2) Spirit Energy; it has 2D6 days to find a host and summon another Mother before the rift closes and the original is returned."
        3: "Alchera appears."
        4: "Magical mist radius 1D6 km; creatures/characters suffer Confusion as if from a critter with 1D6 Essence."
        5: "Nearby Aboriginal paintings step out as materialized spirits."
        6: "Paranormal creatures driven into random attacks."
        "7-8": "Mana surge."
        9: "Using spells/metamagic/Magical skills attracts a spontaneously appearing spirit."
        10: "A spirit summoned or asked for service/favor gets one free Opposed Test, Force vs summoner Charisma; if spirit wins it goes free."
        11: "Great spirit of the waters uses Storm to divert a river, overflow a pool or flash-flood the area."
        12: "Astral shallow radius 1D6 km."
  tasmania_ghost_tribes:
    provenance: {source: source.fanpro-10651, printed_page: 118, pdf_page: 119}
    background_count: 2
    nature_spirits: "Cannot be summoned in the haunted areas."
  maralinga_emu_junction:
    provenance: {source: source.fanpro-10651, printed_page: 118, pdf_page: 119}
    mana_warp_rating: 6
    core_radius_m: 100
    gradient: "Background count decreases 1 per additional 100 m, minimum regional background count 1."
    domain: "Toxic; toxic nature spirits, including toxic spirits of man."
  chaco_canyon_anasazi_ruins:
    provenance: {source: source.fanpro-10651, printed_page: 120, pdf_page: 121}
    power_site_rating: 3
    aspecting: "Native American magic; normal background count for other magic."
    feature: "Astral river construct."
    rift: "Temporary irregular astral rift may let mundanes project and access metaplanes."
  bermuda_triangle:
    provenance: {source: source.fanpro-10651, printed_page: 121, pdf_page: 122}
    background_count: "Average 2; usually 3 during tropical storm/hurricane."
  callanish:
    provenance: {source: source.fanpro-10651, printed_page: 121, pdf_page: 122}
    ritual_site_rating: 4
    aspecting: "Celtic/druidic"
    scythe_ley: "Rating 3 manaline"
  crater_lake:
    provenance: {source: source.fanpro-10651, printed_page: 121, pdf_page: 122}
    mana_ebb_rating: 3
    note: "Long-duration and increasing."
  nasca:
    provenance: {source: source.fanpro-10651, printed_page: 122, pdf_page: 123}
    power_site_rating: 5
    aspecting: "Shamanic and nature magic."
    figures: "Magic in contact with animal figures gains the figure's Totem modifiers in addition to power-site modifiers."
    rift: "Allows mundane/Awakened projection; bird=Sky metaplane, whale=Waters, human=Man."
  tai_shan:
    provenance: {source: source.fanpro-10651, printed_page: 122, pdf_page: 123}
    rating: "1 at base temple, +1 per 1,000 steps, Rating 7 at summit/Jade Emperor temple."
    aspecting: "Not normally aspected."
  teotihuacan:
    provenance: {source: source.fanpro-10651, printed_page: 122, pdf_page: 123}
    power_site_rating: 4
    aspecting: "Shamanic; normal background count for hermetic/other styles."
    holy_days: "Rating/background count rises to 5."
    lunar_low: "Roughly once per lunar cycle rating temporarily drops to 3."
    quests: "Shamanic-metaplane astral quests reduce quest rating by 1, minimum 1."
    restriction: "Attempts to project to hermetic/other metaplanes always reach a shamanic metaplane."
sources:
  - {source: source.fanpro-10651, printed_pages: "116-122", pdf_pages: "117-123", relation: defines_site_mechanics}
