  - "It is a major Pacific Rim trade center and the primary default urban setting presented by SR3."
  - "The metroplex is divided into ten districts and governed by a governor, mayor/district councils, a cabinet and a Seattle Congress."
  - "Lone Star Security Services is the primary contracted police provider in the metroplex during the core-book period."

