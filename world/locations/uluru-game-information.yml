id: world.location.uluru-game-information
record_type: world
name: "Uluru — Game Information"
domain: locations
status: ingested
source: source.fanpro-10651
printed_page: 116
pdf_page: 117
site:
  power_site_rating: 5
  aspect:
    favored: "Aborigine magic"
    opposed: "All other forms of Conjuring"
    sorcery: "Not included in the opposing aspect stated by the source."
hazards:
  hostile_spirits:
    force: 6
    behavior:
      - "Spirits of the Dreamtime and land around Uluru are hostile toward non-Aborigines."
      - "Intruders may suffer spirit powers such as Accident: equipment failures, vehicle trouble, falls and similar mishaps."
  protective_option:
    - "A magician capable of summoning a desert or mountain spirit with Guard may use it for protection if able to overcome local summoning penalties."
spirit_caves:
  access: "Certain caves in Uluru's rock face require a difficult climb or flight."
  barriers:
    force: 8
    type: "Permanent (quickened) physical and astral barrier spells."
    purpose:
      - "Protect sacred caves."
      - "Prevent trespassers from reaching deeper chambers containing imprisoned dangerous spirits."
    response: "Attack or penetration provokes a rapid response from the Mimi guardians."
  central_cavern:
    - "Each cave route leads toward a central cavern with a deep pool and a narrow stone bridge."
    - "The pool contains a bunyip that attacks anyone attempting to cross the bridge and fights to the death."
    - "The chamber contains many deep wells in the rock, strongly warded and capped with opals."
  opal_caps:
    - "Some opal capstones are human-fist sized."
    - "Each functions as the equivalent of a power focus in a magician's hands."
    - "Ratings range from Force 1 for smaller stones to Force 6 or higher for the largest."
    - "The focus must be bonded before use."
    - "Removing a capstone can release one or more imprisoned spirits."
imprisoned_spirits:
  - "Exact inhabitants are left to the gamemaster."
  - "They share the qualities of free spirits and magical threats of varying power."
  - "Examples include insect spirits, toxic spirits, corruptors, blood spirits, shedim and powerful nomads."
  - "Many have been imprisoned for centuries; some may still be dazed or magically restrained."
sources:
  - {source: source.fanpro-10651, printed_page: 116, pdf_page: 117, relation: defines_site_mechanics}
notes:
  - "Only details visible on printed p.116 are asserted here; later-page continuation is not inferred."
