neighborhoods:
  ballard:
    facts:
      - "Upper-middle-class Scandinavian neighborhood with relatively low crime in the source period."
      - "The Berserkers protect local turf and have ties to smugglers using a minor Puget Sound route from Salish-Shidhe territory."
    source_pages: {printed: 32, pdf: 33}
  capitol_hill:
    facts:
      - "Bohemian neighborhood with a visible artistic and Awakened population and several talisman shops."
    source_pages: {printed: 32, pdf: 33}
  elven_district:
    facts:
      - "Predominantly elf/dwarf neighborhood with a Night of Rage memorial and strong metahuman cultural identity."
    source_pages: {printed: 32, pdf: 33}
  international_district:
    facts:
      - "Japanese, Chinese, Korean and Southeast Asian district."
      - "A source-period yakuza stronghold associated with Hanzo Shotozumi; Triad activity is described as growing and contested."
    source_pages: {printed: 32, pdf: 33}
  queen_anne_interbay_magnolia:
    facts:
      - "Queen Anne and Magnolia include substantial corporate housing."
      - "Interbay has an active ork community and is home to the Seattle Ork Rights Committee."
      - "Magnolia Bluff includes the governor's mansion and, during the source period, Rowena O'Malley's private estate."
    source_pages: {printed: "32-33", pdf: "33-34"}
  university_district:
    facts:
      - "University of Washington computer-science and corporate research activity anchors the district."
      - "The Ave openly sells electronics, computers, software, skillchips and many legal skillsofts useful to shadowrunners."
    source_pages: {printed: 33, pdf: 34}

key_sites:
  council_island:
    status: "Sovereign Salish-Shidhe embassy territory created from former Mercer Island under the Treaty of Denver."
    population: "about 3,000 in the source period"
    access:
      - "Reached by I-90 bridge and ferry routes."
      - "Checkpoint pillboxes guard I-90 exits; visitors are subject to extensive contraband and equipment screening."
    jurisdiction:
      - "Seattle and Lone Star have no jurisdiction on the island."
      - "Salish-Shidhe maintains an extradition treaty with Seattle."
    magical_access:
      - "Medicine Hollow Lodge is a major shamanic lodge."
      - "Non-resident shamans may receive advance Grand Council permission to use the lodge."
      - "Permits may be arranged for gathering talismongering materials in Salish-Shidhe territory."
    source_pages: {printed: "33-34", pdf: "34-35"}
  grand_council_lodge:
    address: "32nd Street and 78th Avenue, Council Island"
    facts:
      - "Office of the Salish-Shidhe ambassador to Seattle."
      - "Jon Moses is identified as ambassador in the source period."
    source_pages: {printed: 34, pdf: 35}
  metroplex_hall:
    address: "4th Avenue and Seneca Street"
    facts:
      - "Houses the governor, Downtown mayor and metroplex government; the Metroplex Congress meets here."
      - "Security is described as extremely tight."
    source_pages: {printed: 34, pdf: 35}
  metroplex_supreme_court:
    address: "Spring Street and 5th Avenue"
    facts:
      - "Highest metroplex court, described as analogous to a state supreme court."
    source_pages: {printed: 34, pdf: 35}
  seattle_federal_building:
    address: "Seneca Street and 1st Avenue"
    facts:
      - "Seattle headquarters for UCAS federal offices including FBI, NSA and IRS functions in the source period."
      - "The source emphasizes continuing federal/local jurisdiction friction."
    source_pages: {printed: 35, pdf: 36}
  club_penumbra:
    address: "5th Avenue and Yesler Way"
    facts:
      - "Shadowrunner meeting venue with private booths and loud music that helps mask conversations."
      - "The Renraku arcology shutdown changes the immediate patrol environment in this source period."
    source_pages: {printed: 35, pdf: 36}
  dantes_inferno:
    address: "5th Avenue and Madison Street"
    facts:
      - "Private rooms in the Hell level use white-noise systems and magical wards."
      - "A night in the Hell level costs upward of 1,000 nuyen in the source period."
    source_pages: {printed: 35, pdf: 36}
  eye_of_the_needle:
    address: "410 West Thomas Street"
    facts:
      - "Private dining rooms include anti-surveillance equipment and magical wards."
      - "Security is discreet rather than absent."
    source_pages: {printed: 37, pdf: 38}
  matchsticks:
    address: "4th Avenue North and Denny Way"
    facts:
      - "Private club with secluded booths and a members' back room available for a small fee."
    source_pages: {printed: 37, pdf: 38}
  federated_boeing_shipyards:
    address: "SW Florida Street and 26th Avenue SW"
    facts:
      - "Harbor Island plants build military and commercial hydroplanes and hovercraft."
      - "Clients include the Salish-Shidhe Council, ferry operators and corporate buyers."
    source_pages: {printed: 37, pdf: 38}
  lone_star_security_building:
    address: "2nd Avenue and Union Street"
    facts:
      - "Seattle executive/business offices sit above twenty sub-basement levels containing reserve vehicles, aircraft and equipment."
      - "The facility can support a heavy security mobilization when required."
    source_pages: {printed: 37, pdf: 38}
  omnidome:
    address: "Pier 64"
    facts:
      - "Renraku-owned tri-vid facility near the arcology."
      - "Used as a staging and command location by Renraku personnel investigating the shutdown."
    source_pages: {printed: 37, pdf: 38}
  renraku_arcology:
    address: "1 Renraku Avenue"
    source_period_state:
      - "In complete lockdown during the book's 2060 snapshot."
      - "Entrances are sealed and automated security is active."
      - "Normal Matrix connections are offline and magical wards obstruct astral entry."
      - "About 100,000 people are believed trapped inside; the source presents the number and cause with uncertainty."
      - "By 31 August 2060 UCAS military forces have cordoned the site with Renraku support."
    source_pages: {printed: "37-38", pdf: "38-39"}
  sea_tac_international_airport:
    facts:
      - "Served by thirty-nine airlines and air-freight services in the source period."
      - "Physical screening includes systems intended to reveal concealed cyberware or restricted equipment plus chemical screening for contraband."
      - "Security combines Lone Star with rotating UCC megacorporate forces."
    source_pages: {printed: 38, pdf: 39}

