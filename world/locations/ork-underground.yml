id: world.location.ork-underground
record_type: world
name: "Ork Underground"
domain: locations
status: ingested
source_period: "2060"
world_type: "subterranean Seattle district/network"
parent: world.location.seattle
extent:
  - "A maze of tunnels, basements and chambers beneath the Seattle metroplex."
  - "Known portions extend beneath Downtown, Tacoma, Everett and the Puyallup Barrens; not every enclave is connected or politically unified."
population_context:
  - "Home primarily to orks with a smaller troll population."
  - "A 2020s schism between underground orks and dwarfs ended with the violent expulsion of the dwarf minority; the source presents this as local history, not a current mechanical rule."
access:
  safe_for_non_orks:
    - "Official tour entrance in the basement of the old Seattle Utilities Building."
    - "Official tour entrance inside the Big Rhino Restaurant."
    - "Official tour entrance in the basement of Lordstrung's Department Store at Fifth Avenue and Pine Street."
  restrictions:
    - "Official tours cover only a fraction of the Underground."
    - "Other entrances are scattered across the metroplex and are closely guarded."
    - "The memorial-service area near the docks is normally closed to the public except on the Night of Rage anniversary."
  rumored_pass:
    - "Shadowtalk describes an old-time penny worn on a thong as a supposed permanent pass, but explicitly treats its authenticity as uncertain."
shadowrunning_context:
  - "The Underground is generally sympathetic to shadowrunners and can provide hiding places, storage and recovery space."
  - "Ork-operated smuggling pipelines move goods and people through Seattle while avoiding surface attention."
  - "Polite treatment, favors or bribes may sometimes secure local help or access; this is source-period social guidance rather than a formal test modifier."
sources:
  - {source: source.fanpro-10657, pages: "58-59", pdf_pages: "59-60", relation: defines_world_state}
