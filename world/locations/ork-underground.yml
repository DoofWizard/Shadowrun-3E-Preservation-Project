id: world.location.ork-underground
record_type: world
name: "Ork Underground"
domain: locations
status: ingested
source_period: "2060"
location_type: "subterranean Seattle community/network"
source_period_facts:
  extent: "A discontinuous network of tunnels, basements and chambers beneath multiple parts of the Seattle metroplex; not every enclave is connected or politically unified."
  population: "Primarily orks with some trolls during the source period."
  known_public_access:
    - "Official tour entrance in the basement of the old Seattle Utilities Building."
    - "Entrance inside the Big Rhino Restaurant."
    - "Entrance in the basement of Lordstrung's Department Store at Fifth Avenue and Pine Street."
  access_control:
    - "Official tours cover only a small historical portion of the Underground."
    - "The memorial area near the docks is public for the Night of Rage anniversary service and otherwise closed."
    - "Many unofficial entrances are deliberately kept from public knowledge and guarded by local residents."
  shadowrunning_context:
    - "Some sections are sympathetic to shadowrunners and can be used to hide, stash gear and recover."
    - "Smuggling routes move goods and people through Seattle without drawing surface attention."
shadowtalk_claims:
  - claim: "Some outsiders allegedly possess informal permanent-pass tokens that can secure access or favors."
    verification: "unverified_shadowtalk"
sources:
