data:
  section: Age Rejuvenation
  narrator_treatment_condition: 'The genetic therapy requires a clean DNA sample as its basis.'
  narrator_risk: 'If the sample is not clean, treatment risks retaining or worsening genetic damage acquired by the patient.'
  narrator_context: 'The source describes degradation of DNA through aging and industrial-city life, and describes affluent families storing samples at birth for later rejuvenation.'
  interpretation_limit: 'Birth storage is an example, not a mandatory collection date. No additional test, target number, automatic failure, numerical penalty or cost is specified here.'
