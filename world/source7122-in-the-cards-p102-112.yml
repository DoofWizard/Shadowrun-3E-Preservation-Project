title: "In the Cards"

principal_figures:
  talon:
    role: "street mage and narrator"
  miles_swinburne:
    role: "hermetic scholar and magician"
    notes:
      - "The source identifies Professor Miles Swinburne as an early major European hermetic magician after the Awakening."
      - "His book Fundamentals of Hermetic Magic is described in-story as a definitive theoretical text."
  kazuo:
    role: "street shaman consulted by Talon"

swinburne_history:
  - "When magic returned in 2011, Swinburne was a British expatriate teaching history in Paris and already an expert on hermetic traditions."
  - "During the Euro-Wars he served as a military magician."
  - "A battlefield magical incident left him critically injured."
  - "Emergency medical procedures, drugs, cyberware and implants saved his life but severely damaged his ability to channel magic."
  - "For years afterward he functioned as a magical burnout and withdrew from active magical practice."

dunkelzahn_bequest:
  item: "old tarot deck"
  recipient: "Professor Miles Swinburne"
  notes:
    - "Swinburne says he had never met Dunkelzahn and did not initially understand why the deck had been left to him."
    - "Talon's examination does not identify the deck itself as enchanted."

tarot_spirit_events:
  - "Swinburne experiences apparently predictive tarot readings and encounters spirits corresponding to tarot imagery."
  - "Talon observes and confronts manifestations associated with cards including the Devil."
  - "The story treats the phenomenon as real magical activity but supplies no separate tarot-spirit game statistics."

epilogue:
  - "Kazuo concludes that Swinburne had been subconsciously summoning the tarot spirits with the remaining magical ability he believed he had lost."
  - "The tarot deck is interpreted as a catalyst that forced Swinburne to confront his self-imposed mental block rather than as the source of the magic."
  - "By the end of the story, Swinburne has again demonstrated active magical ability."
  - "The characters speculate that Dunkelzahn intended the bequest as a personal lesson about self-imposed limits and, possibly, a broader symbolic message; that interpretation remains explicitly speculative."

mechanics_audit:
  protected_classes_found: []
  findings:
    - "The story depicts wards, astral perception, conjuration and spirit conflict using established-setting concepts but does not print a new spell, spirit stat block, target number, dice pool, Force, Drain Code, Karma cost, character option or formal resolution procedure."
    - "No new tarot-divination game mechanic is defined on printed pp.102-112."

