id: world_source.seattle.new_seattle_medical_facilities_17_19
headline: Archival reference to fictional Seattle medical facilities, FanPro LLC New
  Seattle (FanPro10657, Shadowrun Third Edition corrected Third Printing 2001), printed
  17-19/PDF18-20
summary: Third-person sourcebook narrative of hospitals and clinics by fictional Seattle
  district in Shadowrun 2060, with uncertain and alleged information explicitly classified.
  No real medical service or guidance is described.
data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: corrected Third Printing (2001)
    fictional_source_context: Fictional tabletop RPG city sourcebook; all names and
      allegations describe the invented Shadowrun 2060 Seattle, not current medical
      facilities or real people.
  provenance:
    source_id: source.fanpro-10657
    original_pdf_sha256: 837fd681bd6cbe822c902f57c9dc55ecd2d33084d21e363dfa3bc7925cfa4f97
    printed_pages: 17-19
    physical_pdf_pages: 18-20
    original_page_images_reviewed_independently: true
  source_section: Welcome to Seattle — Medical Facilities
  general_context:
    services: The narrator says most hospitals and clinics require proof of a valid
      SIN and insurance before admitting patients, while some medical personnel circumvent
      those rules for a price.
    medical_market: The book distinguishes hospitals and clinics from legal and illegal
      cyberware/body-shop services in its fictional metroplex.
  districts:
    Downtown:
      hospitals_and_clinics_count: 12
      named_facilities:
      - Harborview
      - Seattle Health Maintenance Organization
      - Seattle General
      - DocWagon
      - MCT Public Health
      - University Hospital
      named_body_shops:
      - Executive Body Enhancements
      - Nightengale’s Body Parts
      - Body+Tech
      - Fast Freddie’s Surgery
      specific_framing: The last named surgery is described by the narrator as an
        illegal body-shop operation by the docks, distinct from legal named shops.
    Bellevue:
      hospitals_and_clinics_count: 11
      named_facilities:
      - Overlake Medical Research Center
      - Cougar Mountain Hospital
      uncertainty: The narrator says Overlake and Cougar Mountain are rumored to conduct
        unlawful organ procurement and sell body parts to illicit markets including
        Tamanous and the Mafia. This is expressly a rumor, not a narrator-confirmed
        transaction.
    Tacoma:
      major_hospitals_and_clinics_count: 6
      named_facilities:
      - Doctors’ Hospital of Tacoma
      - Humana Hospital
      - Margaret Bridge Child Health Hospital
      - Tacoma Charity General
      research: Margaret Bridge Child Health Hospital researches childhood diseases
        among metahuman children and has a lobby memorial to the victims of the Night
        of Rage.
    Everett:
      hospitals_and_private_clinics_count: 15
      named_facilities:
      - Billings Medical Services
      - Everett General
      - Travis Memorial
      - Everett Naval Hospital
      - DocWagon
      chronology: Everett Naval Hospital has been open to the public since 2040, according
        to the source narrator.
    Renton:
      hospitals_and_clinics_count: 13
      named_facilities:
      - Auburn General
      - City Health South
      - Maple Valley General
      - DocWagon
      - Cross Bio-Medical
      corporate_ownership: The narrator says most Renton clinics are corporate-owned,
        including a DocWagon clinic and Cross Bio-Medical biotech facilities; some
        legitimate hospitals also supply organs and biomaterials to illicit markets,
        largely serving the Yakuza, with occasional rival syndicate interference.
    Auburn:
      hospitals_and_clinics_count: 7
      named_facilities:
      - Algona Community Hospital
      - Community General
      - Lake Wilderness Hospital
      comparison: Community General receives many Puyallup Barrens emergencies, while
        Lake Wilderness is described as a more private hospital for patients who can
        afford it.
    Snohomish:
      hospitals_and_clinics_count: 8
      named_facilities:
      - Mountlake Veterans Memorial
      - Snohomish Medical Center
      - Turner Clinic
      service_note: The narrator notes local reliance on holistic and magical healers
        for minor injuries and ailments.
    Redmond:
      functioning_hospitals_and_clinics_count: 6
      largest: Redmond General
      resources: The narrator describes the six as understaffed, overworked and under-budgeted;
        Redmond General was built and supported by the United Corporate Council as
        a public-relations effort.
    Puyallup:
      hospitals_and_clinics_count: 6
      named_facilities:
      - Good Samaritan
      - Deireadh An Tuarthell
      Good_Samaritan:
        construction_year: 2048
        funding: Grants from the metroplex government and United Corporate Council.
        qualifications: The narrator says the hospital struggles to attract qualified
          personnel and is alleged to have ties to black-market organ procurement;
          the allegation is not promoted to a confirmed event.
      Deireadh_An_Tuarthell:
        population_served: Elves of the Tarislar enclave.
        resources: Small center with poor staffing and supply, reliant on geothermal-derived
          power from an illicit Gaeatronics connection and using herbal and country
          remedies with assistance from community magical healers.
  content_classification: No game-mechanical dice, target numbers, modifiers or statistics
    appear in the Medical Facilities prose; hospital counts and source-period dates
    remain exact.
framing: newsroom_neutral
