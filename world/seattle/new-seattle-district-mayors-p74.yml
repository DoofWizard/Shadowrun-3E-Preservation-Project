  provenance_note: The Real Deal and Backers columns contain the game publication’s
    subjective characterizations, insider allegations and predictions; they are not
    independently verified facts. Terms of association and uncertainty are kept.
  row_count: 10
  district_entries:
  - district: Downtown
    mayor: Catherine DeBurke
    party: Technocrat
    real_deal_source_commentary: Described as efficient in administration and politics
      and strongly supportive of Governor Lindstrom, apparently in public and private.
      The column insinuates financial benefit but gives no named payor.
    backers_source_commentary: Beyond Lindstrom, no prominent named individuals or
      corporations are identified.
  - district: Bellevue
    mayor: Daniel Reynolds
    party: Technocrat
    real_deal_source_commentary: Local businessman said to have received his position
      through the UCC and to be acting for its interests. His predecessor, Tian Campbell,
      is said to have ties to the Divine Revenge Seoulpa Ring and to intend using
      that syndicate’s influence to bring Reynolds down.
    backers_source_commentary: United Corporate Council members and other Bellevue
      businesses.
  - district: Tacoma
    mayor: Eva W. Pratt
    party: Republican
    real_deal_source_commentary: The column credits a ten-year administration with
      continuing political survival despite alleged rampant corruption and support
      from the yakuza.
    backers_source_commentary: Fear of Japanacorps is described as keeping Pratt aligned
      with yakuza plans; yakuza influence is described as keeping the Mafia out of
      Tacoma.
  - district: Everett
    mayor: Tyler C. Combs
    party: Democrat
    real_deal_source_commentary: The narrator depicts Combs as advocating metahuman
      rights and economic growth without concern for the NAN’s views.
    backers_source_commentary: Former Mayor Samantha Tillian selected Combs as her
      successor. The source conjectures that this endorsement may have harmed him
      and claims Republican and Archconservative opposition would obstruct his measures
      in spite.
  - district: Renton
    mayor: '"Smiling Sam" Usinski'
    party: Archconservative
    real_deal_source_commentary: The narrator characterizes Usinski as undermining
      Renton’s racially harmonious public atmosphere and promoting anti-metahuman
      attitudes and policies.
    backers_source_commentary: The Humanis Policlub and smaller affiliated groups
      described disparagingly in the source.
  - district: Auburn
    mayor: Ellen Danquist
    party: Republican
    real_deal_source_commentary: The source claims Danquist promotes local business
      at the environment’s expense while balancing pressure from organized crime.
    backers_source_commentary: Described as elected on her own merits, owing no political
      obligations and apparently intending to retain that independence.
  - district: Snohomish
    mayor: Karl Feddersen
    party: One World Party
    real_deal_source_commentary: The source says both his father and his predecessor
      are believed to have died at the hands of Humanis and that Feddersen bases policy
      decisions on those events. These deaths are explicitly reported as a belief.
    backers_source_commentary: His campaign against racism throughout Seattle is described
      as discouraging potential backers; the column also alleges organizations are
      trying to discredit him and remove him from office.
  - district: Fort Lewis
    mayor: Colonel Ben O’Neil
    party: N/A
    real_deal_source_commentary: Presented as a duty-focused district administrator
      with no interest in politics, who is said to be a probable successor to General
      Coloton.
    backers_source_commentary: O’Neil maintains a low political profile; most outside
      influence on Fort Lewis government is said to be solicited by his administration.
      The military district-major position is described as an effective advancement
      route sought by senior officers.
  - district: Redmond
    mayor: Jeffrey Gasston
    party: Independent
    real_deal_source_commentary: The narrator depicts Gasston as an idealistic young
      orc political figure whose disillusionments have not yet extinguished his intent
      to help Redmond, although he has achieved little.
    backers_source_commentary: Former Governor Schultz is identified as Gasston’s
      mentor, an impressive pedigree with a substantial political benefit; the column
      notes uncertainty about Schultz’s current fate.
  - district: Puyallup
    mayor: Jason Connors
    party: Technocrat
    real_deal_source_commentary: Described as a familiar district figure with previous
      bids for mayoralty, struggling to revitalize the Barrens area.
    backers_source_commentary: The source warns Connors’s political ambition makes
      him a target for possible manipulation by yakuza, Mafia, corporations and other
      powerful district entities.
