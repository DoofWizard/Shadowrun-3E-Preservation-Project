{"id":"world.seattle.new_seattle_tir_tairngire_seattle_trade_portland_p12_13","record_type":"world_source","status":"ingested","source":"source.fanpro-10657","printed_pages":"12-13","pdf_pages":"13-14","edition_scope":"Fictional tabletop-RPG setting reference \u2014 FanPro LLC, New Seattle (FanPro10657), Shadowrun Third Edition corrected Third Printing (2001), printed pp12-13/physical PDF pp13-14; no real-world city/government assertion or implicit edition conversion.","content_class":["world_fact"],"data":{"publication":{"title":"New Seattle","publisher":"FanPro LLC","catalog_number":"FanPro10657","edition":"Shadowrun Third Edition","printing":"corrected Third Printing (2001)","genre":"fictional cyberpunk tabletop role-playing game setting sourcebook"},"provenance":{"source_id":"source.fanpro-10657","original_pdf_sha256":"837fd681bd6cbe822c902f57c9dc55ecd2d33084d21e363dfa3bc7925cfa4f97","printed_pages":[12,13],"physical_pdf_pages":[13,14],"source_review":"Independently inspected the original page scans and verified names, relationships, chronology, narrator/side-comment distinctions before baseline freeze."},"section":"The Pacific Northwest \u2014 Tir Tairngire, Seattle trade and Portland","narrator_setting_facts":[{"printed_page":12,"subject":"Tir Tairngire statehood and population","facts":["The name Tir Tairngire is glossed as Land of Promise and its territory includes much of former Oregon plus portions of Washington and California.","Following secession of the C\u00e9nest\u00e9 elves from the Native American Nations, the setting describes disputes over whether to establish a separate metahuman state; by 2037 the Tir was recognized as sovereign and admitted to the United Nations.","An influx of metahumans, especially elves and dwarfs, migrated from elsewhere in North America to the new nation, whose government portrayed it as a homeland for magic."]},{"printed_page":12,"subject":"government","facts":["High Prince Lugh Surehand rules as absolute monarch and is advised by the Council of Princes; the source states its council members rule smaller domains, most are elves, and the great dragon Lofwyr holds a seat but\u2014according to Surehand\u2019s insistence\u2014rules no Tir territory."]},{"printed_page":13,"subject":"border policy and coercion","facts":["The narrator describes stringent immigration restrictions, rare visas generally favoring metahumans and elves, and borders patrolled with sophisticated security and magic.","People who cross illegally are, according to this fictional sourcebook\u2019s narrator, deposited back beyond the border with little or no memory after administration of the memory-erasing drug la\u00e9s; this is an involuntary measure, not consent.","The nation\u2019s borders reportedly became still tighter after the 2057 assassination of President Dunkelzahn."]},{"printed_page":13,"subject":"Seattle\u2013Tir trade agreements","facts":["In 2050 Seattle Governor Schultz signed an exclusive trade agreement with the Council of Princes, making Seattle a central port through which Tir goods passed toward the UCAS, NAN and overseas destinations.","In 2054 a further agreement made Seattle the Tir\u2019s primary source for importing and exporting; Tir-registered ships and freight operators use Seattle as a transshipment point, and goods for Tir are handled through commercial freight channels.","The narrator reports that this trade provides economic leverage to Seattle\u2019s metroplex government and that Tir withdrawal would affect that trade."]},{"printed_page":13,"subject":"Portland","facts":["Portland lies near Tir\u2019s NAN border and is separated from the rest of the Tir by the Portland Wall; the source says outsiders can visit Portland without the strict screening imposed by the Tir Immigration Department elsewhere in the nation.","Portland is described as under modified martial law overseen by the Council of Princes and a military tribunal, with heavily armed local policing.","The Portland Wall is ten meters high. Outside it, beyond the Sunset Gate, lies Royal Hill, the seat of the Council of Princes and a heavily guarded district."]}],"source_boundary":"Unsigned sourcebook narration is recorded here. Comments by Findler-Man, Bay Jewel, Eriksen, Andy Android and others are separate fictional speakers\u2019 assessments and are not substituted for narrator facts.","mechanics_boundary":"Dates, ten-meter wall height and political arrangements are setting references, not combat statistics, spell mechanics or a declaration of applicability to later Shadowrun editions."},"framing":"newsroom_neutral","headline":"Fictional tabletop-RPG setting reference \u2014 FanPro LLC, New Seattle (FanPro10657), Shadowrun Third Edition corrected Third Printing (2001), printed pp12-13/physical PDF pp13-14: The Pacific Northwest \u2014 Tir Tairngire, Seattle trade and Portland","summary":"Source-reviewed fictional Shadowrun Third Edition setting extraction from printed pp12-13/physical PDF pp13-14, distinguishing the printed book narrator, individually attributed fictional Shadowland commentary and unsupported real-world interpretations."}
