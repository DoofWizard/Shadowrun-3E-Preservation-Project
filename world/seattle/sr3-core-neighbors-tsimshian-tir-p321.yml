  original_fictional_neighbor_profiles:
    tsimshian:
      secession_year: 2037
      political_status: Seceded from the fictional Native American Nations and is
        described by the narrator as a conservative, anti-Anglo state.
      head_of_government: Great Chief Deborah Jim, described as a mage governing for
        more than twenty years.
      source_period_population: Narrator describes Tsimshian and Tlingit as the majority,
        with smaller Haida and Kwakiutl minorities.
      minority_coercion: The source explicitly describes Haida and Kwakiutl people
        being treated as second-class citizens and links systematic oppression to
        resistance movements.
      named_movements:
      - Haida National Front
      - Long House Brotherhood
      movement_attribution: The original narrator alleges that both groups engage
        in terrorist activities; this is a source-period published fictional attribution,
        not an independent real-world finding.
      punitive_law: The source describes harsh criminal penalties and slavery termed
        enforced servitude; neither coercion nor agency is minimized.
      industry:
      - logging
      - mining
      - shipping and smuggling in the source narrative
      officials_rumor: The narrator labels alleged government-official profits from
        illicit shipments as rumor, not established proven conduct.
    tir_tairngire:
      name_gloss: Land of Promise
      territory: Most former Oregon and portions of Washington and California in the
        original fictional setting.
      ruler: High Prince Lugh Surehand
      council: Council of Princes, fifteen seats, most held by elves; great dragon
        Lofwyr is also described as holding a seat.
      migration_history: The source describes immigration of elves and other metahumans
        during formation of the nation.
      border_and_immigration: The original source describes restrictive immigration
        law, patrolled borders and harsh expulsion of unauthorized entrants, without
        presenting any operational instructions.
      source_period_change: The narrator says security tightened after the assassination
        of President Dunkelzahn in 2057.
      seattle_trade_history: The Seattle metroplex signed a 2050 exclusive trade agreement,
        followed by a 2054 Council of Princes agreement making Seattle a major Tir
        imports/exports hub.
      economic_qualification: Narrator describes broad Tir-linked commerce and economic
        influence but does not state that Tir conquered Seattle.
    portland:
      location: Tir Tairngire border city linked to the outside world through Seattle
        and foreign trade.
      border_features: Portland Wall and Sunset Gate, the latter near Royal Hill.
      city_governance: The source describes a modified martial-law environment, a
        military tribunal, Council of Princes oversight and highly armed local policing.
      visitation: Narrator describes separate Tir immigration scrutiny for entrants,
        contrasted with other Tir borders.
  source_fidelity_and_class_limits:
