  original_fictional_neighbor_profiles:
    tsimshian:
      secession_year: 2037
      secession_claim: Narrator says Tsimshian seceded from the Native American Nations.
      government: Narrator portrays a conservative, anti-Anglo government under Great
        Chief Deborah Jim, a mage who has ruled for over twenty years.
      population: Narrator says the nation consists mostly of Tsimshian and Tlingit
        peoples, with Haida and Kwakiutl minorities.
      coercion: The book describes systematic oppression of Haida and Kwakiutl people
        and their second-class treatment.
      resistance_movement_names:
      - Haida National Front
      - Long House Brotherhood
      allegation: The fictional source narrator alleges both resistance groups engage
        in terrorist activities; this is source attribution, not an independently
        verified real-world statement.
      criminal_penalties: The narrator describes severe punishment and slavery under
        the local euphemism enforced servitude.
      economic_activities:
      - logging
      - mining
      - shipping
      - smuggling along the Alaska and Bering route
      transport_context: Source-period cargo circulates via Seattle, Russia, Siberia
        and Vladivostok; no operational instructions are preserved.
      officials_rumor: The narrator specifically presents officials receiving profits
        from illicit shipments as a rumor, not established fact.
    tir_tairngire:
      name_gloss: Land of Promise
      territory: Fictional elven nation occupying most former Oregon and parts of
        Washington and California.
      migration: Narrator describes an influx of elves and other metahumans during
        its formation.
      high_prince: Lugh Surehand
      governing_council: Council of Princes, with fifteen seats, most occupied by
        elves and one held by Lofwyr, a dragon.
      borders: Restrictive immigration policies and closely patrolled borders are
        described, including forcible expulsion and coercion of nonauthorized arrivals.
      chronology: Source says security tightened after President Dunkelzahn was assassinated
        in 2057.
      seattle_trade: The Seattle governor signed a 2050 exclusive trade agreement,
        followed by a 2054 Council of Princes arrangement making Seattle a primary
        Tir import/export hub.
      qualified_politics: Narrator describes significant Tir economic influence; possible
        takeover is presented as speculation, not an event that occurred.
      outside_relations: Seattle is portrayed as a buffer and border-trade outlet,
        with some undesirables exiled there.
    portland:
      position: Border city of Tir Tairngire, tied to Seattle and the world beyond
        Tir.
      physical_features:
      - Portland Wall
      - Sunset Gate
      - Royal Hill outside the wall
      governance: Source says modified martial law, a military tribunal and Council
        of Princes oversight are in effect.
      immigration: Portland is a special path to entry; the source describes distinct
        immigration scrutiny, not a universal legal exemption.
      enforcement: The original narrator portrays military-grade policing and security
        along the wall.
      fictional_context: Source treats Portland as a trade link and shadow-business
        environment, without supplying new dice or TN mechanics.
