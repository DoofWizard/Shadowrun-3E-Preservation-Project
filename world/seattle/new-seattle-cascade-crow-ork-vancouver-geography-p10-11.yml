ure."]},{"printed_page":10,"subject":"Cascade Ork tribe","facts":["Predominantly ork, with trolls and some Cascade Crow dwarfs and humans; holds a small part of the Cascades just north of the eastern road out of Seattle.","Chief Pawl Shaggy Mountain is described as a troll; chief shaman Skink is described as an ork. Sheep husbandry, mining, smuggling and raids against East-road traffic are named economic activities.","After leaving its former tribal alignment following the NAN formation, the tribe established its own mountainous territory; its livestock and mining operations are described as falling short of other tribes\u2019 Salish-Shidhe Council ecological standards.","The narrator identifies routes through its territory as a regular channel for smugglers traveling between Seattle, Denver and points south and east; this is source-period fictional setting context, not real-world travel advice."]},{"printed_page":11,"subject":"Vancouver","facts":["At the mouth of the Fraser River on the Pacific Coast, Vancouver is called the Salish-Shidhe Council\u2019s gateway to the East and most important seaport.","Its Burrard Inlet handles cargo and shipments associated with California, Japan and Hong Kong; the Council exports lumber, fish, oil, foodstuffs and other goods through this port.","The narrator describes Cascade Crow efforts to keep Vancouver clean, attractive and safe, and also says its commercial role has attracted corporations and organized crime interests to port and trade sectors."]},{"printed_page":11,"subject":"Cascades","facts":["Mountain range runs through much Salish-Shidhe Council territory and toward Tir Tairngire; the source describes hiking, camping and sightseeing activity and a tourism economy.","The narrator calls the area a major passage between Seattle and the outside world for in-world illicit cargo, centered on Cascade Ork territory near old Interstate 90; this is a fictional geographic assertion, not operational guidance.","Both Salish-Shidhe and Tir Tairngire groups view mountains and active volcanoes as spiritually/magically important, with shamanic sites and Awakened plant and animal life."]}],"speaker_boundary":"Separate named Shadowland comments about tribal motives, smuggling, magical beings and crime are already indexed for printed p10 and independently represented for p11 onward; no signed comment is elevated here to unsigned narrator fact.","mechanics_boundary":"No combat rules or dice, costs or equipment statistics were printed in these cited narrative subsections; tribe race and officer names are setting facts, not player-character statistics."},"framing":"newsroom_neutral","headline":"Fictional tabletop-RPG setting reference \u2014 FanPro LLC, New Seattle (FanPro10657), Shadowrun Third Edition corrected Third Printing (2001), printed pp10-11/physical PDF pp11-12: The Pacific Northwest \u2014 Cascade Crow, Cascade Ork, Vancouver and the Cascades","summary":"Source-reviewed fictional Shadowrun Third Edition setting extraction from printed pp10-11/physical PDF pp11-12, distinguishing the printed book narrator, individually attributed fictional Shadowland commentary and unsupported real-world interpretations."}
