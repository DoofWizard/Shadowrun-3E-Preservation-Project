data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_copyright: FASA Corporation (1999)
    world: Fictional Seattle Metroplex and fictional organizations, not real-world corporate reporting
  section: The Corporate Sector / Megacorporations
  book_narrator_organizations:
  - organization: Cross Applied Technologies (CAT)
    president_or_ceo: Lucien Cross
    headquarters_in_fiction: Montreal, Republic of Quebec
    seattle_division: Cross Advanced Electronics (CAE)
    local_address: Cross Plaza, 3600 Evergreen Way, Everett
    division_head: Nicholas Aurelius
    narrator_facts:
    - 'Cross Advanced Electronics began constructing its Seattle facility in 2056, with production focused on advanced
      consumer electronics: computers, simsense players, recording decks, home electronics and appliances.'
    - Lucien Cross first assigned his nephew Bernard to direct the division. The narrator describes Bernard as poorly
      prepared and consistently mismanaging it despite supervision; Lucien recalled Bernard to Montreal under an
      ostensible promotion as executive assistant, in reality a demotion.
    - Nicholas Aurelius replaced Bernard. He is the son of Leonard Aurelius, formerly chairman of Ares Macrotechnology’s
      board and now on the Cross board. The narrator dates Nicholas’s transfer around Leonard’s divestment of remaining
      Ares stock and decision to support Damien Knight’s corporate rivals.
    - The CAE building uses marble-clad walls, mirrored armored glass and Cross’s golden-cross emblem. Its facility
      defenses include electronic detection, maglock-equipped checkpoints, biometric scans, trained guards and a
      rigged security installation.
  - organization: Draco Foundation
    director: Nadja Daviar
    headquarters_in_fiction: Federal District of Columbia, UCAS
    seattle_division: Draco Foundation Northwest
    local_address: Terrace Street and 12th Avenue, Downtown
    division_head: Sassinian
    narrator_facts:
    - The Draco Foundation was established to administer the bequests, requests and petitions arising from the great
      dragon Dunkelzahn’s final will and testament, using the substantial money he left. The Foundation operates
      branch offices in several cities and metroplexes.
    - Because many of the dragon’s bequests concern Seattle, the Foundation’s downtown offices occupy five floors
      of a building in the University District according to the publication.
    - The Seattle offices handle foundation operations for the Pacific Northwest including Tir Tairngire; the source
      states the Council of Princes refused requests to open a foundation office in Salem or Portland.
    - Sassinian is the Salish-area sasquatch whom the Draco Foundation board appointed to manage the Seattle division.
      Known as “Sassy,” she communicates verbally through a Salish sign-language interpreter and otherwise handles
      the division’s daily operations herself.
