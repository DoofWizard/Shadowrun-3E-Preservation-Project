headline: Wuxing and Yamatetsu — fictional Shadowrun Third Edition Seattle megacorp profiles
summary: Source-reviewed fictional-world corporate histories from FanPro LLC, New Seattle (FanPro10657,
  corrected Third Printing 2001, Shadowrun Third Edition), original printed p96/PDF97; book-narrator assertions
  are kept separate from attributed shadowtalk.
data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_publication_copyright: FASA Corporation (1999)
    nature: Fictional tabletop RPG sourcebook describing an invented Seattle Metroplex and corporations
  section: The Corporate Sector / Megacorporations
  book_narrator_organizations:
  - organization: Wuxing, Inc.
    president_or_ceo: Wu Lung-Wei
    headquarters_in_fiction: Hong Kong Free Enterprise Enclave
    seattle_division: Wuxing North America, Roosevelt Way and 50th Street, Downtown
    division_head: Gao Kien
    narrator_facts:
    - Wuxing purchased the twin blue-and-red downtown Seattle skyscrapers from Haukshorn Chemical the
      preceding year, refurbished them, and replaced their former emblem with its five-petaled lotus-flower
      logo; extensive renovation continued.
    - The corporation is relocating company personnel daily and recruiting aggressively in the fictional
      metroplex.
    - As the driving force of the Pacific Prosperity Group, Wuxing is becoming more active in Seattle
      economic and political affairs, promoting trade with Pacific Rim countries including Hong Kong,
      Korea, Singapore and Russia, as well as other non-Japanese interests.
    - The source contrasts Wuxing’s competition with the established Japanese megacorporations and with
      Federated-Boeing, a Pacific Prosperity Group member and significant regional corporate presence.
    provenance:
      printed_pages: '96'
      pdf_pages: '97'
  - organization: Yamatetsu
    president_or_ceo: Saru Iwano
    headquarters_in_fiction: Vladivostok, Russia
    seattle_division: Yamatetsu Seattle
    division_head: Mary Luce
    narrator_facts:
    - The source describes Yamatetsu’s recent leadership change to an ork chairman and the relocation
      of world headquarters from Japan to Vladivostok.
    - The corporation has capitalized on a newly metahuman-friendly, magically aware public reputation,
      hiring metahumans in Seattle and advertising its “Awakened” corporate identity.
    - The narrator reports internal conflict with more traditionalist employees and power struggles throughout
      the corporate structure resulting from these changes.
    - The sourcebook anticipates substantial management reorganization as leadership responds to internal
      tensions; this is a statement of source-period expectations, not a claim about later canon.
    provenance:
      printed_pages: '96'
      pdf_pages: '97'
status: ingested
