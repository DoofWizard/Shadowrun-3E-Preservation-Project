  medical_facilities:
    source_quantity: Narrator says Seattle has more than fifty hospitals and clinics.
    access_condition: Most formal establishments demand a valid SIN; the narrator
      describes exceptions where providers overlook this condition.
    shadow_clinics: Separate informal clinics and black-market body shops exist alongside
      conventional hospitals.
    docwagon: DocWagon is described as the primary Seattle HMO and paramedic organization,
      operating clinics and armed medical response teams for customers.
    agency: The narrator states that characters choosing informal services assume
      risk; this is historical fictional setting context, not real-world medical advice.
  source_period_information_organizations:
    independent_information_network:
      abbreviation: IIN
      scope: Worldwide investigative news organization with reporters and information
        sellers across the fictional setting.
      source_owner: The original narrator says it is owned and run by metahumans,
        with reporting access in metahuman communities.
      fictional_game_use: Source describes lead gathering and source acquisition as
        possible story relationships, not fixed tests or guaranteed player income.
    newsnet:
      size_claim: Narrator describes NewsNet as the largest independent news network
        in the fictional world.
      ownership: Described as neither owned nor controlled by a megacorporation.
      reporting: Narrator characterizes investigations and occasionally antagonistic
        exposure of corporate activity.
    ksaf:
      role: Small local independent Seattle trid broadcaster.
      reputation: Narrator notes extraordinary apparent access to newsworthy events
        without explaining its source of advance knowledge.
    trid_pirates:
      categories: Narrator distinguishes independent camera-driven exposure, profit-oriented
        recordings and unauthorized broadcasts.
      source_examples: Some material is sensational or illicit, including broadcasts
        described as fatal contests; no performance mechanics are supplied.
  required_edition_provenance:
    source_period_only: Claims reflect the 1998 FASA Third Edition fictional setting,
      not current media entities or later sourcebooks.
    qualified_claims: Separate uncertain rumors about leaked reports, paid tips, malicious
      conduct and illicit clinics remain source-attributed, not established as independent
      facts.
