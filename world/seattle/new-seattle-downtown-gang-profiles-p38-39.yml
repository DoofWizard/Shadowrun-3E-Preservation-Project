data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_copyright: FASA Corporation (1999)
    scope: Fictional tabletop role-playing-game Seattle, not contemporary real-world
      Seattle.
  section: Downtown Seattle / downtown gangs
  provenance:
    printed_pages: 38-39
    physical_pdf_pages: 39-40
    source_page_images_reviewed: true
  reference:
    source_intro: The chapter introduces prominent Downtown gangs, not an exhaustive
      or stable roster; gang composition changes over time.
    gangs:
    - name: The Halloweeners
      territory: Downtown Seattle, including docks south of the Renraku arcology
      source_description: Described as the largest Downtown gang. Its early record
        includes thefts from wealthy people followed by a failed attack on a Renraku
        executive. Renraku operatives attacked the gang’s hideout and set it on fire,
        killing most members; leader Slash-and-Burn and two others survived. The gang
        then made retaliatory threats against corporations, particularly Renraku.
      identity: Colors orange and black; members use Halloween masks and flamboyant
        clothing. Slash-and-Burn wears masks to cover burn scars. The narrator notes
        members claim unusually broad racial diversity.
    - name: The First Nations
      territory: Docks north of the Renraku arcology and portions of Everett waterfront
      leader: Salish elf Blood-of-the-Buffalo
      identity: Entirely Native American membership, according to the source; insignia
        is a raven over a howling coyote.
      relations: Proud of Native American Nations and tribal heritage; yakuza has
        supplied nuyen and weapons for years. The gang serves as foot soldiers for
        Shotozumi-rengo and disputes Everett’s Choson Ring.
    - name: Troll Killers
      territory: Lake Washington near Wolf Bay
      identity: Human-only gang, described as Human Nation youth cadets; targets trolls
        and orks and collects horns and tusks as trophies.
      relations: Often fights metahuman gangs and sometimes works as hired muscle
        for cross-lake smugglers.
    - name: Bloody Screamers
      territory: Ravenna area near Green Lake
      identity: Ork gang whose members began organizing after the Night of Rage. Many
        have ties to the Ork Underground and participate in the smuggling trade.
      relations: Principal rivals of Troll Killers; the book describes anti-human
        hostility focused especially on Troll Killers.
    - name: The Disassemblers
      territory: South Seattle near a substantial illicit organ market
      identity: Mostly ork and troll members with smaller numbers of humans and dwarfs.
        White skull face paint or tattoos and skull-bladed emblem.
      source_description: The source describes illegal chop shops and a trade in body
        parts obtained from hospitals and so-called “donors” (the original puts donors
        in quotation marks); consent or coercion is not resolved by that phrase.
  source_review_limits: The Doc-U-Dub commentary about alleged Tamanous connections
    is separately attributed; the book narrator does not establish that relationship
    as a proven fact. The source’s scare-quoted “donors” are retained without assuming
    voluntary or involuntary participation.
