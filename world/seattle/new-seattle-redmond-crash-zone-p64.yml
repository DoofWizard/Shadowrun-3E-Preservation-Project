{"id":"world.seattle.new_seattle_redmond_crash_zone_p64","record_type":"world_source","status":"ingested","source":"source.fanpro-10657","printed_pages":"64","pdf_pages":"65","edition_scope":"Historical fictional tabletop RPG: FanPro LLC New Seattle (FanPro10657), Shadowrun Third Edition corrected Third Printing (2001), printed p64/PDF65.","content_class":["world_fact"],"data":{"publication":{"title":"New Seattle","publisher":"FanPro LLC","catalog_number":"FanPro10657","edition":"Shadowrun Third Edition","printing":"corrected Third Printing (2001)","nature":"Published fictional tabletop-roleplaying game setting, not present-day geography or advice."},"provenance":{"printed_pages":"64","pdf_pages":"65","original_page_images_reviewed":true},"section":"The Barrens / Redmond: 2059 Crash Zone chronology and former reformatory","narrator_history":{"disaster_2059":"The book locates the Crash Zone at Monroe along the Salish-Shidhe border, north of the Snoqualmie River. A spaceplane carrying Corporate Court Justice David Hague crashed there in 2059. The explosion and fires devastated a roughly three-kilometer radius, killing most of the area's few thousand inhabitants.","prison_damage":"The same disaster damaged the nearby Seattle Metroplex Reformatory. Hague's plane struck the site during a riot, destroying prison systems; a mass jailbreak left most guards and staff dead and surviving inmates in control of the facility, described as the largest mostly intact nearby building.","state_response":"Metroplex Guardsmen and Franklin Fire Services initially contained the physical damage. Before Governor Schultz could decide what to do with the devastated area, she disappeared inside the Renraku arcology. Governor Lindstrom is then described as preoccupied with larger concerns.","later_occupation":"Squatters occupied the damaged zone. Former reformatory inmates led by a heavily cybered fictional human calling himself King Chrome claimed control of the Crash Zone and scavenged it. The group defends its claim but allows squatters to settle provided they recognize King Chrome's authority."},"attribution_limit":"Signed in-world remarks by Silicon Surfer and Wiz Kid about remaining debris and astral activity are not elevated to narrator fact. The published source contains no quantitative game mechanics for this site on printed p64."},"headline":"Fictional Shadowrun Third Edition sourcebook, FanPro LLC New Seattle (FanPro10657, corrected Third Printing 2001), printed p64/PDF65: The Barrens / Redmond: 2059 Crash Zone chronology and former reformatory","summary":"Source-reviewed archival report of fictional tabletop setting material, New Seattle (FanPro LLC, Shadowrun Third Edition, corrected Third Printing 2001), printed p64/PDF65; sources and provenance are explicit.","framing":"newsroom_neutral"}
