  section: Around Town / Everett / Red Rovers, Kabuki Ronin and Scatterbrains gang
    profiles
  narrator_facts:
    district_pattern: The narrator says go-gangs are common around Everett, many working
      for local syndicates. The major money-making activity of Everett gangs, apart
      from violence, is smuggling from the northern border or shore.
    red_rovers:
      type: Largest Everett go-gang
      territory: Most of Interstate 9 along the Everett–Snohomish line.
      appearance: Members dye their hair red and wear red warpaint.
      relationships: Conduct smuggling on I-9, sometimes run NAN border patrols or
        work as outriders for smugglers. Often work for the Mafia, but also serve
        Seoulpa Rings including the Choson Ring and other paying parties. Sometimes
        fight the First Nations over Seoulpa Ring business.
    kabuki_ronin:
      type: Largest Everett thrill gang
      territory: In and around Everett dockyards
      appearance: A Kabuki Ronin shaves the head except for one scalp lock and tattoos
        the scalp white in imitation of Japanese noh-theater style.
      membership_and_work: A majority of members are Japanese; the group is no longer
        allied with the Seattle yakuza and accepts a more varied set of jobs.
    scatterbrains:
      type: Fictional thrill gang with a clown motif
      leader: Giggles, described by narrator as a troll with a severe clown fixation
        and erratic conduct.
      appearance: Members wear clown costumes; their emblem is a skull with red Bozo-style
        hair, separately illustrated in monochrome on printed p50.
      activities: The narrator says they stage practical jokes and sometimes paint
        a crude caricature on the Renraku arcology during protest or social events.
  source_boundary: This is narrative sourcebook gang description, not a real-world
    organization profile, conduct advice, or independent stat block.
