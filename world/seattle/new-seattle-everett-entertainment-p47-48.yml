  section: Around Town / Everett / Places to Be
  places:
  - name: Casino Corner
    address: Evergreen Way and Route 526
    narrator: Concentration of gambling houses, nightclubs and hospitality houses
      outside Federated-Boeing territory in central Everett. Includes modest venues
      and more exclusive clubs such as the Gates; the district's nightlife draws hundreds
      of patrons.
    organization_relationships: Described by the source narrator as the stronghold
      of the Everett Mafia's Ciarniello Family, which runs clubs and casinos as fronts
      for funds from its other fictional operations. Yakuza interests repeatedly challenge
      for a presence, but the Mafia has retained control.
  - name: The Rubber Suit
    address: Upper Ridge Road and 18th Street SW
    narrator: Largest and most exclusive nightclub in Everett; a conspicuous entertainment
      destination and meeting place for younger members of the Shotzumi yakuza clan.
      First Nations gang visitors sometimes meet local yakuza here regarding business,
      payments and news.
  context: Corporate arrivals and local disposable income have expanded entertainment
    choices in an otherwise predominantly residential and industrial district.
