  narrator_or_columnist_descriptions:
    precipitation:
      average_annual_cm_approx: 90.76
      weather_pattern: The weather columnist says it does not rain in Seattle all
        the time; most rain falls in winter and the least in summer, when storms tend
        to be shorter.
      regional_comparison: The columnist characterizes annual precipitation as somewhat
        above the average across most of the northeastern UCAS.
    temperatures_celsius:
      average_summer: 21
      average_winter: 4.5
      occasional_summer_high: 31
      winter_qualification: Winter temperatures seldom fall below freezing, according
        to the publication.
    air_quality:
      general_condition: The columnist describes air as relatively clean by the standards
        of major UCAS cities, attributing this in part to nearby Olympic Peninsula
        weather patterns.
      stage_one_smog_alerts_per_year_up_to: 30
      comparison: The publication contrasts these alerts with more frequent pollution
        warnings in cities such as Los Angeles.
    seasonal_and_other_hazards:
    - Seattle weather is described as generally mild, with occasional heavy thunderstorms
      during spring and summer and windstorms in autumn.
    - Snowfall is described as fairly rare.
    - The Cascades volcanoes occasionally send enough ash into the air to produce
      persistent rain and spectacular sunsets.
  editorial_boundaries:
  - The signed Thunder Dancer claim that Great Ghost Dance magic or free storm spirits
    cause unusual weather is separately preserved as attributed commentary, not silently
    merged with this descriptive weather column.
  - The numerical climate values and qualifications here are source-era fictional
    setting statistics; the publication does not attach a standalone dice test, target-number
    modifier or environmental damage rule to them on these pages.
