{"id":"world.seattle.new_seattle_redmond_gang_profiles_p66_68","record_type":"world_source","status":"ingested","source":"source.fanpro-10657","printed_pages":"66-68","pdf_pages":"67-69","edition_scope":"Historical fictional tabletop RPG: FanPro LLC New Seattle (FanPro10657), Shadowrun Third Edition corrected Third Printing (2001), printed p66-68/PDF67-69.","content_class":["world_fact"],"data":{"publication":{"title":"New Seattle","publisher":"FanPro LLC","catalog_number":"FanPro10657","edition":"Shadowrun Third Edition","printing":"corrected Third Printing (2001)","nature":"Published fictional tabletop-roleplaying game setting, not present-day geography or advice."},"provenance":{"printed_pages":"66-68","pdf_pages":"67-69","original_page_images_reviewed":true},"section":"The Barrens / Redmond: five named gang profiles in historical fictional source","narrator_gang_profiles":[{"name":"Rusted Stilettos","territory":"Southern Redmond near Glow City along Route 202","composition_and_appearance":"Primarily orks and trolls; colors black and rust red. The source describes radiation-affected appearance among some members.","conduct":"The narrator describes recruitment from Glow City squatters, protection rackets against nearby inhabitants, and trade in contraband BTLs and other illicit goods. Members generally keep rival gang operations localized rather than coordinating with other Redmond gangs."},{"name":"Crimson Crush","territory":"Bargain Basement area of Touristville around 228th Avenue","composition_and_appearance":"Ork gang wearing red leathers, presenting itself as a neighborhood watch for local orks.","conduct":"The narrator reports clashes against Humanis Policlub and Human Nation gangs, extortion of local businesses, and smaller-scale smuggling and dealing. It describes tension with Mafia and yakuza while Triads supply BTL chips; the phrase Kong-chips appears as a source-period street product."},{"name":"Brain Eaters","territory":"Touristville","composition_and_appearance":"Mixed-race technology-oriented scavenger gang, colors black or white with red fezzes.","conduct":"The narrator states members scavenge Redmond technology, operate Matrix access points, sell computer hardware and pirated software, and participate in smuggling. It qualifies the notion that the gang is helping yakuza expansion as recent indications, not settled proof."},{"name":"Red Hot Nukes","territory":"Hollywood along Route 202","composition_and_appearance":"Dwarf go-gang described as a neighborhood association, with gray and red colors and a mushroom-cloud symbol. Its leader Grinder is identified as an African-American dwarf who retired from a short shadowrunning career.","conduct":"The narrator describes a violent initiation tradition involving explosives and an interest in demolition-related rackets, protection and intimidation; no actionable explosive procedures are provided."},{"name":"Spiders","territory":"Headquarters reported in Brain Heaven, south of Beaver Lake and Glow City","composition_and_appearance":"A large, relatively new gang of people the narrator says suffered harm through the fictional Universal Brotherhood. It is led by Widow, a human Spider shaman; members wear black or dark brown with red web patterns and may wear spider-style tattoos.","conduct":"The narrator describes the gang as violently fixated on hunting insect spirits, claiming all Redmond as their protected area, coercively recruiting people from the streets and subjecting them to intense brainwashing. The gang's self-declared claim of protection is not established as legitimate authority."}],"source_distinctions":"Signed Shadowland commentators' allegations about individual gang members, organ trading, radiation effects, and recruitment practices remain separate claims rather than unqualified narrator facts. The Puyallup district begins on printed p68 after the final Spiders comment."},"headline":"Fictional Shadowrun Third Edition sourcebook, FanPro LLC New Seattle (FanPro10657, corrected Third Printing 2001), printed p66-68/PDF67-69: The Barrens / Redmond: five named gang profiles in historical fictional source","summary":"Source-reviewed archival report of fictional tabletop setting material, New Seattle (FanPro LLC, Shadowrun Third Edition, corrected Third Printing 2001), printed p66-68/PDF67-69; sources and provenance are explicit.","framing":"newsroom_neutral"}
