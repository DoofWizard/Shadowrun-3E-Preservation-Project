        "name": "Night Hunters",
        "narrator": "Renton’s largest thrill-gang confederation, composed of splinter gangs of roughly twenty to thirty members using one name. The source says the group, led by a sociopathic man identified as Stiv, embraces anti-metahuman prejudice and technofetishism. Members wear black leather, chains, chrome studs and typically green-dyed mohawks; their emblem is a clawed hand across a white moon. The narrator describes cyberware and vocal or ear modifications, distribution of BTL chips, intimidation, abduction and torture of victims, especially metahumans.",
