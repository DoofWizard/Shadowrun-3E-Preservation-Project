        "narrator": "Described as Renton’s largest go-gang, said to claim almost all of Intercity 169 as territory. Members embrace a self-styled tribal identity, wear warpaint, ritualized scars or tattoos and permanent face/arm tattoos. The gang participates in the illegal chip trade, taking errands for Mafia or yakuza contacts, and also celebrates nights of alcohol and older-fashioned drugs.",
