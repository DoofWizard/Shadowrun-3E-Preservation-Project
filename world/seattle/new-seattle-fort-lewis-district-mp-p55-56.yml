    security_authorities: Metroplex Guard, UCAS Military Police and Lone Star patrol
      Fort Lewis; jurisdiction is disputed. Metroplex Guard and UCAS MPs consider
      their respective areas approximately one rating higher than Lone Star ratings.
    district_ratings:
      AA:
      - Spanaway Lake Housing (officer housing)
      A:
      - Bridgeport (military housing)
      - Grey and Madigan Housing (military housing)
      - Parkland (non-military housing)
  narrator_overview:
    district_landscape: Fort Lewis Military Reservation consists of forested rolling
      hills; Army and Metroplex Guard maintain a military installation where much
      forest undergrowth is cleared.
    command: General Colloton, newly described as senior military commander in Seattle,
      has sought to eliminate Mafia and Lone Star influence over some of the post
      and forested areas.
    main_post: The principal post buildings, housing and exchanges are south of Interstate
      5, with soldier and family residences largely west of the main post.
    north_fort: North Fort lies north of Interstate 5 and became a UCAS Army headquarters
      and garrison under Joint Task Force Seattle.
    military_police: On-post traffic control, military checkpoints and ordinary policing
      are handled by UCAS Military Police rather than Lone Star. The Criminal Investigation
      Division handles investigations of crimes on the post; the text describes its
      personnel as military investigators with attached federal agents and UCAS marshals.
    jurisdiction: Interstate 5 crosses Fort Lewis and is under Lone Star jurisdiction,
      producing disputes between Lone Star and the military police when incidents
      cross jurisdictional boundaries.
    additional_patrols: General Colloton ordered military police to provide routine
      courtesy patrols in areas frequented by soldiers off-post, especially the neighborhoods
      of Parkland, Lakewood, Steilacoom and Tillicum, contributing to friction with
      Lone Star.
    local_mafia: The book describes Bigio-associated Mafia operations serving soldiers
      around Tillicum; General Colloton investigated corruption and restricted their
      activity on post, disrupting illicit vending routes. Colloton resisted pressure
      from Mafia representatives.
