es not attribute every attack to every member."},"human_nation":{"type":"Secretive social-Darwinist group of wealthy members, distinct from Humanis.","publication_claim":"The book's narrator describes the group as using wealth to finance nonconsensual experiments on captive metahumans, aiming to eliminate or exploit them, while also funding public charities. These are fictional in-world allegations presented by the publication, not real-world events."},"ork_rights_commission":{"abbreviation":"ORC","leader":"Jasper Squashright","position":"Grassroots organization advocating equal rights for all metahumans, with particular emphasis on orks.","funding":"The book describes donations and government grants, and contrasts ORC's limited finances with Humanis's wealthy backers.","scope":"Narrator notes criticism of an ork-centered emphasis even though the group's stated platform covers all metahumans."},"empowerment_coalition":{"leader":"Libby Chalmers","founder":"Anne Penchyk, a former presidential candidate","institutional_funding":"Dunkelzahn's will established the Timmons Memorial Fund; Penchyk became its director and brought the Coalition under its umbrella.","mission":"Civil-rights lobbying and bringing aligned political and civic organizations together, including ORC and Mothers of Metahumans; the source also mentions contact with the North American Civil Liberties Union, National Association for the Advancement of the Awakened, and Outright."}}}
