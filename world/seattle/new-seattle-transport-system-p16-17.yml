data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: corrected Third Printing (2001)
    fictional_source_context: Published fictional cyberpunk tabletop role-playing
      game sourcebook; assertions describe the invented 2060 Seattle setting, not
      modern Washington state.
  provenance:
    source_id: source.fanpro-10657
    source_pdf_sha256: 837fd681bd6cbe822c902f57c9dc55ecd2d33084d21e363dfa3bc7925cfa4f97
    printed_pages: 16-17
    physical_pdf_pages: 17-18
    source_page_images_reviewed_independently: true
  section: Welcome to Seattle — Getting In / Getting Around
  arrivals:
    air: Sea-Tac International Airport is depicted as the main air-traffic hub; there
      are numerous smaller airports. Airport-security inspection is noted as relevant
      to arriving passengers.
    land: The Salish-Shidhe Council has authorized North, South and East Roads into
      and out of the metroplex. North and South follow old US Interstate Highway 5;
      East follows old I-90 to the Yakima Trading Center at Ellensburg, joining I-82/84.
    maglev: A sealed-tube maglev line passes from San Francisco to Seattle through
      Tir Tairngire and the Salish-Shidhe Council; the narrator says the passenger
      service takes about two hours and that much of the route is opaque or underground.
    sea: Passenger and commercial craft use Seattle harbor. The fictional Port of
      Entry Complex is described as an arrival checkpoint.
  air_taxi:
    named_services:
    - Emerald City Air
    - Renraku Air
    - Sea-Tac Express
    - Quetzal Shuttle Services
    - Federated-Boeing Air Carriers
    corporate_parent_reported: The book describes Quetzal Shuttle Services as Aztechnology-owned.
    service_scope: The fictional services fly to the city major buildings, Sea-Tac
      and corporate centers.
    typical_short_airport_hop_nuyen_approx: 100
    typical_cross_town_flight_nuyen_approx: 150
    monitoring: The narrator describes control-tower flight plans and local/corporate
      radar monitoring for air taxis; this is setting information, not actionable
      navigation guidance.
  roads_and_traffic: Grid-Guide-managed electric cars form most traffic. Light traffic
    permits Everett to southern Puyallup in about three hours; peak commuting congestion
    lasts roughly two or three hours in the morning and evening. The narrator cautions
    that Barrens grid-guidance and road maintenance can be unreliable.
  ferries:
    system_boats_reported: 20
    downtown_pier_hub: Pier 66
    departures: Depart on the hour during daytime for Tacoma and Everett.
    fare_large_ferry_car_nuyen: 12
    fare_passenger_nuyen: 2
    fare_new_express_hydrofoil_nuyen: 5
    typical_trip_everett_or_tacoma_ferry_minutes: 40
    typical_trip_express_hydrofoil_minutes: 15
  metro_transit:
    provider: Metro Transit Company
    subway: No subway described.
    bus_fare_downtown_nuyen: 0
    bus_fare_outside_downtown_nuyen: 1
    service: Bus routes through metroplex; bus schedules available via public Seattle
      data terminals.
  monorail:
    route: Elevated downtown ring with Seattle Center and King Street Station stops.
    ticket_nuyen: 1
    historical_status: The book says the monorail formerly stopped at the Renraku
      arcology but no longer does.
  edition_note: These fares, operators and routes describe the 2001 publication 2060
    fictional setting, not current prices or travel availability.
