headline: Brackhaven, Dassurn and Federated-Boeing — fictional Seattle corporate profiles
summary: Source-reviewed fictional Shadowrun Seattle publication material in FanPro LLC New Seattle, FanPro10657,
  Third Edition, corrected Third Printing (2001), printed pp83-84/PDF pp84-85; narrator statements and named speaker
  claims are kept distinct.
data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_copyright: FASA Corporation (1999)
    world: Fictional Seattle Metroplex of Shadowrun, not real-world business reporting
  section: The Corporate Sector / Seattle Corps
  source_period_corporate_context:
  - The book describes a broad range of Seattle-based corporations, especially in investments, computers, telecommunications,
    aviation and agriculture. It states that local firms employ a higher proportion of the metroplex population
    than megacorporations and influence the city character.
  - The book notes that local firms have home-field advantages while competing with megacorporations such as Ares
    and Aztechnology.
  corporations:
  - corporation: Brackhaven Investments
    president_or_CEO: Kenneth Brackhaven
    headquarters_in_fiction: 3rd Avenue and Union Street, Downtown Seattle
    sourcebook_narrator_facts:
    - The narrator calls Brackhaven Investments an umbrella corporation holding Kenneth Brackhaven’s various business
      interests and identifies Kenneth as a former UCAS presidential candidate.
    - Kenneth developed the family fortune into a wide portfolio across Seattle, including Wordsworth department
      stores, Golden Lion Inns, MiniMarts and shopping malls.
    - 'The narrator reports Kenneth’s substantial philanthropy: research centers, youth havens, crisis hotlines,
      hospital wings, museum wings and gifts of rare collections.'
    - The narrator identifies Karl Brackhaven as Kenneth’s uncle and president of the Seattle chapter of the Humanis
      Policlub. It explicitly says no evidence has been uncovered proving Kenneth belongs to that organization;
      his presidential campaign platform appeared to indicate anti-metahuman sympathies. The distinction between
      kinship, a campaign impression and unproven participation is retained.
    affiliation_certainty:
      uncle_karl_humanis_leadership: stated_by_narrator
      kenneth_humanis_membership: not_proven_by_available_evidence
      campaign_platform: source_narrator_interpretation
  - corporation: Dassurn Securities and Investments
    president_or_CEO: Alberta Johnson
    headquarters_in_fiction: 4th Avenue and University Street, Downtown Seattle
    sourcebook_narrator_facts:
    - DSI handles financial instruments including stocks, bonds and securities. The narrator presents financial
      markets as an important arena of corporate influence.
    - The narrator reports the firm seeks to influence markets for its advantage, including insider trading, junk-bond
      operations and illegal stock transactions, and sometimes hires shadowrunners as special consultants.
  - corporation: Federated-Boeing
    president_or_CEO: Jessica Sirianni
    headquarters_in_fiction: Corson Avenue and East Marginal Way, Downtown Seattle
    sourcebook_narrator_facts:
    - The narrator identifies Federated-Boeing as Seattle’s largest corporation and employer, with widespread plants
      and facilities across the metroplex.
    - Its products include aircraft from the Boeing 828 to aerial drones, helicopters, tilt-rotor craft, jet planes,
      military fighters and remote-piloted aircraft; the company also builds ships and other vehicles.
    - Though smaller than Ares and Mitsuhama, Federated-Boeing competes with and subcontracts for both. The narrator
      states both larger firms attempted and failed to buy Federated-Boeing, while future takeover remains possible.
    - The firm undertakes government contracts for the UCAS, CAS and NAN. The source highlights UCAS Raven and Eagle
      fighter programs and reports corporate espionage and internal rivalry around project secrecy.
