data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_copyright: FASA Corporation (1999)
    world: Fictional Shadowrun Seattle, not real-world contemporary business reporting
  section: The Corporate Sector / Megacorporations
  book_narrator_organization_profiles:
  - organization: Saeder-Krupp Heavy Industries
    president_or_ceo: Lofwyr
    headquarters_in_fiction: Rhine-Ruhr Megaplex, German Alliance
    seattle_division: None officially
    division_head: None officially
    narrator_facts:
    - The source identifies Saeder-Krupp as the world’s largest megacorporation, with no official Seattle offices
      or facilities but a strong indirect presence through affiliated factories, foundries and discreet offices
      supporting information collection for headquarters in Germany.
    - Local watchers support Lofwyr’s interest in Pacific Coast affairs. Saeder-Krupp is banned from business in
      Tir Tairngire and California, making Seattle important to the corporation’s Northwest positioning.
  - organization: Shiawase Corporation
    president_or_ceo: Tadashi Shiawase
    headquarters_in_fiction: Osaka, Japan
    seattle_division: Shiawase Towers
    local_address: 6th Avenue South and J Street, Tacoma
    division_head: Shigeru Aoyama
    narrator_facts:
    - Shiawase’s two steel-and-mirrored-glass Seattle towers were built after the Night of Rage and administer its
      Pacific Northwest operations and subsidiaries.
    - Business interests include a fusion plant near Redmond, a public-works contract with the Seattle metroplex
      government and expanding biotechnology activity.
    - The narrator describes factional disputes across Shiawase divisions and continued attention from Japan as
      central features of local governance.
    - Security has tightened following the acquisition of former Fuchi assets and expansion into cyberware; facilities
      have sensor systems and more automated defenses. The book describes these measures as generally less lethal
      than Mitsuhama’s, including capture-oriented devices and agents that render prisoners unconscious.
  - organization: Wuxing, Inc.
    president_or_ceo: Wu Lung-Wei
    headquarters_in_fiction: Hong Kong Free Enterprise Enclave
    seattle_division: Wuxing North America
    local_address: Roosevelt Way and 50th Street, Downtown
    division_head: Gao Kien
    narrator_facts:
    - Wuxing acquired the former Haukshorn Chemical twin blue-and-red skyscrapers in Downtown Seattle the preceding
      year and renovated them with its five-petaled lotus logo.
    - The narrator describes rapid local hiring, renovations and changing personnel. Wuxing is an increasingly active
      Seattle presence, backed by the Pacific Prosperity Group and seeking closer economic and political relations
      with Hong Kong, Korea, Singapore, Russia and other non-Japanese Pacific Rim interests.
    - Wuxing’s rise has generated opposition from local Japanese megacorporations and Federated-Boeing, itself a
      Pacific Prosperity Group member; the company intends to remain in the market.
  - organization: Yamatetsu
    president_or_ceo: Saru Iwano
    headquarters_in_fiction: Vladivostok, Russia
    seattle_division: Yamatetsu Seattle
    division_head: Mary Luce
    narrator_facts:
    - After appointing its new ork chairman and relocating its world headquarters from Japan to Vladivostok, Yamatetsu
      has become the focus of corporate discussion.
    - The narrator describes a shift toward greater metahuman inclusion and magical awareness. Yamatetsu is hiring
      metahumans in Seattle and advertising itself as an “Awakened” corporation.
    - Traditionalist employees oppose the changes, causing leadership conflicts and calls for internal reorganization;
      the source describes future succession and market opportunities as uncertain.
