data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_copyright: FASA Corporation (1999)
    world: Fictional Shadowrun Seattle, not real-world contemporary business reporting
  section: The Corporate Sector / Megacorporations
  book_narrator_organization_profiles:
  - organization: Mitsuhama Computer Technologies (MCT)
    president_or_ceo: Toshiro Mitsuhama
    headquarters_in_fiction: Kyoto, Japan
    seattle_division: Mitsuhama North America
    local_address: Martin Luther King, Jr. Way and 68th Avenue, Downtown
    division_head: Tamatsu Sakura
    narrator_facts:
    - MCT’s Seattle headquarters comprises six black-and-silver skyscrapers near Lake Washington, with an MCT logo
      and company name on each. The grounds resemble a Japanese garden, with decorative waterscapes and concealed
      security sensors.
    - The collapse and difficulties of Fuchi and Renraku gave MCT an opportunity to compete for leadership among
      major computer corporations.
    - The narrator says the secession of the Seattle yakuza left MCT unable to rely on its former local yakuza connections
      for resolving problems; hostility to outsiders creates added difficulties.
  - organization: Novatech
    president_or_ceo: Richard Villiers
    headquarters_in_fiction: Boston, UCAS
    seattle_division: Novatech Compound
    local_address: 21st Avenue South and Massachusetts Street, Downtown
    division_head: Samantha Villiers
    narrator_facts:
    - Novatech formed from one-third of Fuchi combined with Richard Villiers’ existing business. Its Seattle facility
      is the former Fuchi compound, retaining a prominent position in Downtown Seattle.
    - The corporation is undergoing substantial restructuring and hires shadowrunners while rebuilding its public
      standing and competing to retain research and staff.
    - Samantha Villiers, Richard’s former wife, manages Novatech Seattle; despite their divorce, the narrator says
      they maintain a cordial professional relationship. She visits headquarters in Boston for consultation.
    - The facility dates to 2018, was destroyed during the Night of Rage and rebuilt in 2042. Damage from recent
      Fuchi conflict has largely been repaired; the seven towers of differing heights encircle a taller eighth structure.
      Novatech removed Fuchi branding and uses the facades for nighttime trideo advertisements for simsense and
      Matrix products.
  - organization: Renraku Computer Systems
    president_or_ceo: Inazo Aneki (indefinite leave); interim CEO Haruhiko Nakada
    headquarters_in_fiction: Chiba, Japan
    seattle_division: Renraku Research Compound
    local_address: 6th Street SE and 112th Avenue SE, Bellevue
    division_head: Tadashi Marushige, acting director
    narrator_facts:
    - Renraku’s corporate fortunes in Seattle worsened following the arcology shutdown. Its alliance with the Nakatomi
      family and acquisition of a Nakatomi share of the former Fuchi business permitted it to acquire a Bellevue
      Fuchi research compound and its data.
    - After the Seattle Arcology shutdown, Renraku moved its Seattle offices to the Bellevue compound; staffing
      is strained because some former Renraku staff were inside the shutdown and reinforcements arrived. It is expanding
      the compound.
    - The source describes Renraku as anxious to regain control of the downtown arcology but says some observers
      interpret expansion in Bellevue as an admission it may never regain control.
    - The narrator reports that Renraku’s regional response has become increasingly security-conscious and aggressive
      after the arcology crisis.
