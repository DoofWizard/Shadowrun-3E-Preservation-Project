    "section": "Vancouver, Tsimshian and Tir Tairngire / Pacific Northwest neighbors",
    "narrator_reported_facts": [
      "The sourcebook situates Vancouver in Salish-Shidhe territory near the Fraser River mouth and Burrard Inlet, describing its harbor as a Pacific gateway for trade with California, Japan and Hong Kong and identifying Cascade Crow political influence. The Cascade Mountains form a tourism and wilderness corridor east of Seattle; the original source describes the Cascade Ork border route near former Interstate 90.",
      "Tsimshian separated from the Native American Nations in 2037. Its government is nominally democratic, but the narrator describes Great Chief Deborah Jim and her political party as maintaining de facto authoritarian and military control.",
      "Tsimshian and Tlingit residents are depicted as the dominant groups, with Haida and Kwakiutl minorities suffering second-class treatment. The book describes citizenship exclusions for non-Native residents; a harsh criminal justice system including involuntary servitude, sentences enforced by cranial explosives and paramilitary policing; logging and mining, including environmentally destructive practices, support its economy. These are sourcebook statements about an invented state, not recommendations."
    ],
    "attribution_boundary": "Unsigned Vancouver/Cascades/Tsimshian account is distinguished from the explicitly Spes-signed Tir Tairngire article on printed pp12-13 and separately signed comments.",
    "in_world_spes_signed_article": [
      "The Spes-signed in-world overview describes Tir Tairngire emerging from Cénesté separation and gaining UN recognition in 2037. Its territory includes much of former Oregon and parts of Washington and California; High Prince Lugh Surehand governs with a Council of Princes, including Great Dragon Lofwyr, who has no territory.",
      "Spes describes Tir as strictly restricting immigration, with preference for elves; border guards include technology, magic and other forces (the paranormal-creature assertion is expressly framed as a rumor). Spes describes failed unauthorized entrants as having lost memory after being returned across the border, identifying the substance laés. The article dates Governor Schultz’s exclusive trade agreement with the Council of Princes to 2050, a further Seattle primary import/export agreement to 2054, and tighter Tir borders following President Dunkelzahn’s death in 2057.",
      "Portland occupies a distinctive Tir border position, separated from the rest of the nation by the Portland Wall; it permits more outsiders than most of Tir. The Portland Wall and Sunset Gate are defended, and Royal Hill is a heavily patrolled district. The printed section is signed by the in-world contributor Spes; its claims must be attributed to that narrator."
    ]
