  narrator_locations:
  - name: Blackstone's Museum and Zoo of the Paranormal
    printed_page: 54
    location: 118 East Avenue B
    description: Privately owned museum and zoological facility showing paranormal
      animals on loan from the larger Fort Lewis and Woodland Park zoos. The source
      reports popularity with local visitors and recent attacks by anti-Awakened groups
      that regard the site as a convenient target.
  - name: Edmonds Instruments
    printed_page: 55
    location: 76th Avenue West & 212th Street SW
    description: 'Precision aircraft and ship instrument manufacturer with contracts
      to Federated-Boeing. It sought expansion through profitable work; Federated-Boeing
      attempted a buyout in 2051 that Edmonds resisted. The source describes an ongoing
      tense contractual relationship: Edmonds relies on Federated contracts, while
      Federated cannot afford to lose Edmonds as a supplier.'
