  section: Around Town / Everett
  narrator_facts:
    location: Northernmost Seattle metroplex district, bordering Salish-Shidhe territory
      along the north; port on Puget Sound with the Everett Naval Shipyards, docks
      and a major Federated-Boeing plant.
    economy: Industrial and port work, including renewed corporate interest in land
      and production, made Everett an emerging competitor with Tacoma.
    border: Former US military reservation north of Everett on North Road became a
      smaller Salish-Shidhe border-patrol base and checkpoint for traffic entering
      or leaving the metroplex.
    coastline: Salish-Shidhe maritime patrols encounter numerous small inlets, bays
      and channels; Deception Pass is a named major water route patrolled by Salish-Shidhe
      gunboats.
    entertainment: Workers and corporate employees contributed to growing local nightlife,
      though most residents visit malls and shopping complexes such as Everett Beacon
      Mall.
