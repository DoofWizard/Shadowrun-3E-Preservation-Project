  original_source_period_corporate_facts:
    megacorporate_overview: The original Seattle chapter describes interests and holdings
      of established and newly expanding megacorporations; it does not provide a new
      numeric game modifier or universal corporate-control ranking.
    Ares_Macrotechnology:
      seattle_businesses:
      - shipping and air-freight businesses
      - Knight Errant Security Services local security work
      - WeaponsWorld retail stores
      - aerospace subcontracts with locally owned Federated Boeing
      local_headquarters: The original source describes Ares Seattle headquarters
        as operating extensive security and defense systems.
    Aztechnology:
      regional_role: Seattle is the headquarters of its Northwestern Division and
        a major North American location.
      landmark: Aztechnology Pyramid, with a magical research laboratory on upper
        levels.
      source_legal_scope: The book describes Aztechnology as legally barred from doing
        business in California and Tir Tairngire, while separately reporting continuing
        interests there.
      military_presence: The original narrator places at least one battalion of Aztlan
        soldiers in Seattle guarding the Pyramid and corporate interests.
    Cross_Applied_Technologies:
      seattle_facility_construction_began_year: 2056
      electronics_division: Cross Applied Electronics produces computer hardware,
        simsense players and recording decks.
      head_of_local_division: Nicholas Aurelius, son of Leonard Aurelius, identified
        by this source as a rival of Ares leader Damien Knight.
    Mitsuhama_Computer_Technologies:
      seattle_offices: Six black and silver skyscrapers on the shore of Lake Washington.
      described_activities: High-technology goods and computer/electronics business.
    Novatech_Incorporated:
      predecessor_relationship: The publication describes Novatech as the successor
        to the Fuchi Industrial Electronics North American branch.
      seattle_presence: Former Fuchi North American Seattle interests, with Richard
        Villiers as the named owner.
      source_period_expansion: The narrator says the corporation has expanded further
        toward Pacific Rim and Asian markets.
    Renraku_Corporation:
      seattle_presence: Retains a Seattle market position after the shutdown of its
        Seattle arcology.
      fuchi_acquisition: A friendly takeover brought roughly one-third of Fuchi into
        Renraku, according to the narrator.
      acquisition_business: The source describes the corporation as working to restore
        control of the arcology.
    Saeder_Krupp_Corporation:
      leader: Lofwyr, the great dragon, described by the source as the corporation
        owner.
      local_facilities_condition: The corporation itself is described as having no
        facilities in Seattle; subsidiaries own smaller factories and foundries, and
        liaison offices are maintained in the city.
      seattle_role: The narrator characterizes Seattle as an information-gathering
        location for Pacific Coast operations.
    Shiawase_Corporation:
      seattle_office: Two steel and mirrored glass towers.
      regional_facilities:
      - fusion plant in Redmond
      - biotechnology division
      source_position: The narrator describes internal conflicts among Shiawase divisions
        and a new push into cyberware using former Fuchi assets.
    Wuxing_Incorporated:
      origin: Hong Kong-based megacorporation with a growing Seattle presence.
      headquarters_actions: The narrator reports Seattle headquarters renovation and
        a local hiring program.
    Yamatetsu_Corporation:
      headquarters_change: Its global headquarters moved from Japan to Vladivostok
        in the setting.
      local_recruiting: The narrator reports a Seattle hiring initiative for metahumans
        and resulting internal tensions.
    local_corporations:
      Federated_Boeing: Named as Seattle metroplex largest employer and an aerospace
        enterprise.
      Brackhaven_Investments: Attributed to former UCAS presidential candidate Kenneth
        Brackhaven.
      Global_Technologies: A small high-tech business specializing in simsense and
        skillsoft technology.
      Mega_Media: Described as the largest Seattle simsense producer, including connections
        to Hollywood entertainment.
      Microdeck_Industries: Produces low-priced computer hardware and software and
        has a licensing deal with Mitsuhama.
      Pacific_Rim_Communications: Operates the Seattle LTG.
      Telestrian_Industries: Tir Tairngire-owned conglomerate active in several high-technology
        fields.
      Universal_Omnitech: Holds bioware patents, which the source says generate substantial
        revenue.
      VisionQuest_Entertainment: A simsense production company previously associated
        with the great dragon Dunkelzahn before his death.
  source_uncertainty_and_separate_classes:
  - Corporate intentions and forecasts (for example future competitive outcomes or
    hiring intentions) are narrator-qualified source-period reports, not independently
