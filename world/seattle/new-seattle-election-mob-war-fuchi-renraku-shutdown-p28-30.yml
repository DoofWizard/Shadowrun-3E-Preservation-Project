        "facts": "Republican candidate Franklin Yates was murdered in a Seattle hotel; the source identifies a possessed FBI agent as the killer. Running mate Anne Penchyk campaigned in his place. Dunkelzahn won but was killed by an explosion outside Washington's Watergate Hotel on inauguration night. Vice President Kyle Haeffner assumed the presidency amid civil unrest and invoked martial law."
      },
      {
        "date": "2058",
        "facts": "After Mafia leader James O'Malley was killed outside his Seattle home on New Year's Day, his daughter Rowena sought to lead the Finnigan Family and wider Seattle Mafia. Competing families and rival syndicates fought for influence. The Commissione ultimately installed Maurice 'the Butcher' Bigio as metroplex Don while recognizing Rowena as Finnigan Family capo. These are narrative historical claims, not fictional crime instructions."
