        "facts": "Corporate conflict between Renraku Computer Systems and Fuchi Industrial Electronics escalated after Miles Lanier, a former Fuchi security executive, took a Renraku board position through Dunkelzahn's bequest. Richard Villiers opposed him. Lanier sold his Renraku stake to Zurich-Orbital Gemeinschaft Bank and became Vice President of Operations at Novatech."
      },
      {
        "date": "2059",
        "facts": "Richard Villiers established Novatech Incorporated as a leading rival following Fuchi's disintegration. Yamana aligned with Shiawase Corporation, Nakatomi's Fuchi Asia holdings joined Renraku, and the Seattle United Corporate Council became embroiled in organizational and contract disputes."
      },
      {
