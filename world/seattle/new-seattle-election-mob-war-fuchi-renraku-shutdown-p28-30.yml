        "facts": "President Thomas Steele won the 2056 UCAS election amid widespread suspicions about the result. After a compromised remote-voting system became public, Speaker Betty-Jo Pritchard invalidated the election and scheduled a replacement for August 2057. The great dragon Dunkelzahn ran, with Seattle businessman Kenneth Brackhaven also campaigning as a Republican on traditionalist, anti-metahuman themes."
