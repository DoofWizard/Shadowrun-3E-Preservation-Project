  section: Around Town / Everett / Places of Interest
  facilities:
  - name: Everett Naval Shipyards
    address: 'Main Gates: Rucker Avenue and Pacific Avenue'
    narrator_facts: Built in the 1990s as a home port for a carrier battlegroup and
      shipyard for repair and resupply of US Navy ships. The yard experienced long-term
      decline and potential closure in the 2030s. A 2042 UCAS Military Improvements
      Act focused the refurbishment of Seattle-area military facilities on Everett
      and Fort Lewis. In the book's period, Everett hosts a UCAS nuclear carrier battlegroup
      centered on the supercarrier USS Koontz under Rear Admiral Jennifer McNair.
      Salish-Shidhe defense cutters occasionally dock for repairs under the Treaty
      of Denver and Seattle metroplex agreements.
  - name: Federated-Boeing Everett Facility
    address: 938 84th Street SW
    narrator_facts: The company's Everett aircraft and spaceplane campus comprises
      ten factories, including five of the world's largest buildings and the Boeing
      828 assembly line. Factories and Paine Field are surrounded by Boeingville,
      a corporate neighborhood housing about one-quarter of Federated-Boeing employees.
      The corporation provides selected personnel company housing, utilities, entertainment
      and police protection, with continuous patrols of company neighborhoods.
  - name: Bicson Biomedical
    address: Beverly Park Road and 117th Street SW
    narrator_facts: Fictional pharmaceutical manufacturer and research laboratory
      focusing on medicines and compounds for cyber-implant procedures and maintenance,
      including immunosuppressants, viral nano, synthesized hormones such as beta-endorphins,
      and certain bioware artificial glands. Cross Biomedical acquired Bicson in 2055,
      making it a subsidiary of Cross Advanced Technologies. Bicson products retain
      the old branding; management reports to Cross Biomedical in Boston and the main
      Cross office in Montreal.
  - name: Dadson Vision Entertainments
    address: 7th Avenue and Everett Mall Way SE
    narrator_facts: California-based simsense and trideo media producer, with an Everett
      studio that recruits performers from local clubs and venues, creates a range
      of entertainment programming and concentrates on racy, lightweight productions;
      the narrator contrasts its output with California media corporations.
