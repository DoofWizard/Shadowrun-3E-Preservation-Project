headline: Saeder-Krupp and Shiawase — fictional Shadowrun Third Edition Seattle megacorp profiles
summary: 'From FanPro LLC, New Seattle (FanPro10657, Shadowrun Third Edition, corrected Third Printing
  2001), printed pp94-96/PDF95-97: historical sourcebook narrator descriptions of two fictional corporations,
  their local activities, leadership, facilities and security; named character remarks are indexed separately.'
data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_publication_copyright: FASA Corporation (1999)
    nature: Fictional tabletop RPG sourcebook describing an invented Seattle Metroplex and corporations
  section: The Corporate Sector / Megacorporations
  book_narrator_organizations:
  - organization: Saeder-Krupp Heavy Industries
    first_occurrence_printed_page: 94
    president_or_ceo: Lofwyr
    headquarters_in_fiction: Rhine-Ruhr Megaplex, German Alliance
    seattle_division: None (officially)
    local_division_head: None
    narrator_facts:
    - Although no Seattle division or official facilities are acknowledged, Saeder-Krupp has a presence
      in the fictional metroplex through subsidiaries, including small factories and foundries, and small
      inconspicuous offices.
    - The narrator differentiates offices providing support information to the German headquarters from
      others used as bases for corporate observers chosen by Lofwyr to monitor regional activity.
    - The publication says Saeder-Krupp is barred from conducting business in Tir Tairngire and California,
      making Seattle strategically valuable for observing North America’s Pacific Coast.
    provenance:
      printed_pages: 94-95
      pdf_pages: 95-96
  - organization: Shiawase Corporation
    first_occurrence_printed_page: 95
    president_or_ceo: Tadashi Shiawase
    headquarters_in_fiction: Osaka, Japan
    seattle_division: Shiawase Towers, 6th Avenue South and I Street, Tacoma
    local_division_head: Shigeru Aoyama
    narrator_facts:
    - The twin steel-and-mirrored-glass Shiawase Towers were built shortly after the Night of Rage and
      house the fictional Seattle branch, which oversees company operations and subsidiaries across the
      Pacific Northwest.
    - The corporation’s Seattle activities include a fusion plant near Glow City in Redmond, a public-works
      contract with the metroplex government and an expanding biotechnology division.
    - The source describes occasional conflict among divisions that typically cooperate, including struggles
      for resources and attention from headquarters in Japan; some of these disputes can generate fictional
      shadowruns.
    - The corporation tightened security at the towers and other facilities while acquiring former Fuchi
      assets, entering the cyberware market and treating Seattle projects as top secret.
    - The towers use laser detection grids and motion sensors, with increasing automation. The source
      contrasts Shiawase’s preference for net-guns and knockout gas, intended to preserve captives for
      interrogation, with more lethal methods used by Mitsuhama; this is a fictional sourcebook depiction,
      not a real-world recommendation.
    provenance:
      printed_pages: '95'
      pdf_pages: '96'
status: ingested
