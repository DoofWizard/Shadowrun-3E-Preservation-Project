  contract_system:
    metroplex_taxes_and_contracts: The government raises tax money from residents
      and local businesses to hire private contractors for essential services; the
      narrator describes competition for awards and concerns about influence on renewal
      decisions.
    emergency_dispatch: The city’s emergency services connect to the PANICBUTTON system,
      linked through public telecommunications, to dispatch police, fire and emergency
      personnel.
    district_sanitation: Individual districts hire sanitation contractors to handle
      refuse and oversee waste facilities; the narrator describes substantial criminal-syndicate,
      especially Mafia, influence over bidding.
    fire_and_rescue: Franklin Associates first operated as an insurance company, acquired
      firefighting vehicles and equipment, and offered paid firefighting and rescue
      services, subsequently obtaining the city fire-and-rescue services contract.
    health_care: City Health and Group Medical (CHGM) is a metroplex-government-run
      HMO that subcontracts much emergency service work to Franklin Associates, DocWagon
      and CrashCart.
  power_supply:
    gaeatronics: The narrator describes Gaeatronics as supplying a large majority
      of metroplex electricity from an Olympic Peninsula fusion plant and geothermal
      and solar installations in the Cascades.
    shiawase_atomics: The narrator describes Shiawase Atomics as supplying the remainder
      from a small Redmond fusion plant.
    interdependence: A named source commenter on printed p76 explains that Shiawase
      maintains the metroplex power grid while Gaeatronics generates most electricity;
      this is attributed separately.
  public_information_and_traffic:
    renraku: Renraku retains a contract for maintaining public database systems such
      as Sea-Net, although the Renraku arcology incident is said to have prompted
      municipal consideration of reassignment.
    pacific_rim_communications: Pacific Rim Communications maintains the Seattle telecommunications
      system; the narrator describes expansion along the Pacific Coast, progress in
      Vancouver and contracts in California Free State cities, but unsuccessful expansion
      into Tír Tairngire.
    mitsuhama: Mitsuhama Computer Technologies has the Grid-Guide contract, a system
      used to handle most motor traffic on the metroplex streets.
    narrator_category: The source characterizes the contracted database, telecom and
      traffic providers as three major Japanese corporations.
