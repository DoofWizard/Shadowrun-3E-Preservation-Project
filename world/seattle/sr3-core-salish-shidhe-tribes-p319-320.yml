  council:
    geography: The printed fictional Council controls much of former Washington, Idaho
      and portions of former British Columbia, including Vancouver.
    relation_to_seattle: The source describes it as a significant Seattle electricity
      supplier, but as generally avoiding interference when its own borders are respected.
    constituent_tribes: Tribes hold territories governed by local chiefs and send
      representatives to the Council; the original source does not describe a single
      undifferentiated tribal leadership.
  printed_tribe_profiles:
    salish:
      predominant_race: Human
      territory: Most of region west and south of Puget Sound
      chief: Harold Gray Bear
      chief_shaman: Leaping Salmon
      commercial:
      - power generation
      - fishing
      - tourism
      corporation: Gaeatronics, described as founded and owned by the Salish, with
        regional power production.
    sinsearach:
      predominant_race: Elf
      territory: Southwest of Seattle, including Mount Rainier
      chief: Gillian Morningsong, a Coyote shaman
      chief_mage: Ryan Highbrow
      commercial:
      - natural forest products
      - crafts
      - tourism
      - animal husbandry
      setting_lineage: The source describes the tribe as arising from an internal
        elven dispute after the Sovereign Tribal Council welcomed metahuman applicants;
        Cénesté subsequently separated and founded Tir Tairngire with other elven
        immigrants in 2035.
    makah:
      predominant_race: Human
      territory: Northwest Olympic Peninsula
      chief: George Lodgepole
      chief_shaman: Black Otter
      commercial:
      - forestry
      territory_facilities: Controls forest land, former US Navy bases, a Trident
        submarine base and former military facilities; exports wood products through
        Seattle and Vancouver.
    cascade_crow:
      predominant_race: Human
      territory: Most territory east of Seattle as far as Cascade Mountains
      chief: Frederick Eye-Like-Eagle
      chief_shaman: Red Buffalo Woman
      commercial:
      - livestock
      - agriculture
      - shipping
      source_position: The original source reports political advocacy to expel outsiders
        and claim Seattle, while explicitly indicating those proposals had not been
        adopted by the Council.
    cascade_ork:
      predominant_race: Ork
      territory: Small holding in Cascades north of eastern route out of Seattle
      chief: Pawl Shaggy Mountain, a troll
      chief_shaman: Skink, an ork
      commercial:
      - raising sheep
      - mining
      - smuggling
      origin: Narrator describes the group as a breakaway from Cascade Crow soon after
        NAN formation; members include orks, trolls and some dwarfs and humans.
  surrounding_landmarks:
    vancouver: Located at the mouth of Fraser River, a major Salish-Shidhe seaport
      and Pacific trade hub; the source also presents contested shipping and underworld
      activity as fictional setting claims.
    cascades: The mountain range extends through Council territory past Seattle into
      Sinsearach lands and Tir Tairngire; the source describes spiritual and magical
      importance, including volcanoes, shaman lodges, awakened plants, animals and
      fire spirits.
  conditions_and_limits:
    unresolved_politics: Trade rivalry, proposed seizures, border and ecological disputes
      are reported original-setting conditions or forecasts, not accomplished actions
      or universal game rules.
    separate_historical_sources: Existing later FanPro New Seattle tribal narratives
      are different source/printing evidence, not a replacement for the original FASA7001
      printed profile fields.
    no_new_mechanic: Printed race/territory/chief/activity labels describe source-period
      world facts, not player character priority restrictions, encounter modifiers
      or numerical tests.
  first_pass_editorial_source_review:
    original_images: Original SHA-matched 345-page FASA7001 physical PDF327-328, printed
      pp319-320, visually inspected the original tribe headings, five profile rows
      and two geographic subsections.
