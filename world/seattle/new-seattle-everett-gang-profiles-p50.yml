  section: Around Town / Everett Gangs
  narrator_context: Everett gang activity is centered on downtown; go-gangs and thrill
    gangs may work for organized syndicates, while shoreline and northern-border smuggling
    is a recurrent sourcebook setting element.
  gangs:
  - name: Red Rovers
    type: go-gang
    territory: Intercity 9 along Everett/Snohomish line
    distinguishing_features: Everett's largest go-gang; red attire, dyed red hair
      and red warpaint.
    relationships: Associated with fictional smuggling along I-9, border patrol activity
      and work for Mafia and the Choson Ring or other employers. Occasional disputes
      with First Nations over Seoulpa Ring activity.
  - name: Kabuki Ronin
    type: thrill gang
    territory: Everett dockyards
    distinguishing_features: Everett's largest thrill gang; stylized shaved hair with
      one scalp lock and white Noh-theater-influenced head markings. Membership includes
      many Japanese members, but most members are not Japanese.
    relationships: No longer affiliated with the Seattle yakuza; members perform a
      broader range of jobs.
  - name: The Scatterbrains
    type: thrill gang
    territory: Everett; rumor of dockside hideout is a separate speaker allegation
    leader: Giggles, a psychotic troll, as described by the source narrator
    distinguishing_features: The book describes elaborate clown costumes, skull insignia
      with red Bozo-like hair and a fixation on clown imagery.
    activities: Pranks and satirical protests, ranging from public rallies to graffiti
      on the Renraku arcology; named speaker claims about their conduct are not adopted
      as established narrator facts.
