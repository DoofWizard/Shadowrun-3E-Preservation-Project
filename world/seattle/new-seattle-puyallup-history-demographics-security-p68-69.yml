  section: 'The Barrens: Puyallup origin, geography and district statistics'
  narrator_history:
    eruption_2017: The fictional Mount Rainier eruption in 2017 buried agricultural areas and towns
      beneath ash and lava. The district became a refugee destination following the Night of Rage,
      with metahuman enclaves established.
    landscape: Southern Puyallup contains black lava fields, altered Puyallup River watercourses,
      geysers and pools of toxic, boiling mud. Industrial recovery is limited, and local factories
      contribute to gray haze.
    social_conditions: The narrator describes more than half the district as metahuman, pronounced
      racial tensions, human vigilantes and an entrenched Mafia/yakuza presence; Seoulpa rings seek
      members among metahumans.
