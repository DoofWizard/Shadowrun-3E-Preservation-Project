  reference:
    grand_council_lodge:
      address: 32nd Street and 78th Avenue, Council Island
      role: Office of the Salish-Shidhe Council ambassador to Seattle.
      ambassador: Jon Moses
      narrator_history: Jon Moses has held the position nearly twenty years and continues
        cooperative relations with Seattle. Not all advisers and staff agree; some
        support a growing Native American Nations movement seeking stronger pollution
        controls to limit contamination of Salish-Shidhe territory. Chief Moses has
        contained those factional tensions so far.
    metroplex_hall:
      address: 4th Avenue and Seneca Street
      building: Thirty-story Charles Royer Building
      offices: Houses the governor, Downtown Seattle mayor and metroplex governmental
        offices. Metroplex Congress meets there for major decisions.
      front_statuary: Two bronze statues depict Chief Sealth and metroplex founder
        Charles C. Lindstrom.
      source_security_description: Security is described as extremely tight.
    metroplex_supreme_court:
      address: Spring Street and 5th Avenue
      architecture: Dark marble exterior and twin six-meter statues of hooded, robed
        justices at the entrance.
      legal_role: Powers of a state Supreme Court; the source describes an especially
        heavy caseload due to Seattle’s distinctive legal situation.
    seattle_federal_building:
      address: Seneca Street and 1st Avenue
      height_stories: 72
      federal_role: Seattle headquarters for UCAS federal government. FBI, National
        Security Agency, Internal Revenue Service and other federal agencies maintain
        offices here; the building also contains a federal bookstore and public datastore.
      fictional_official: FBI director Marian Tudor
      jurisdiction_tension: Federal and Seattle local authorities dispute jurisdiction,
        including FBI versus Lone Star investigations of organized-crime cases.
  source_review_limits: Source-narrator institutional descriptions only; claims attributed
    to Smiley, Ridge Runner, The Dead Deckers Society, X-Star and Spook are recorded
    separately.
