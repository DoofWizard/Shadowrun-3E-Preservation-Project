  section: 'The Barrens: Puyallup named venues and constituent areas'
  named_places:
  - name: The Crime Mall
    address: 136th Street East and 122nd Avenue East
    narrator: A former three-story commercial mall became a market for contraband after the 2029
      Crash. The narrator describes stalls for drugs, chips, software, electronics, cyberware, weapons
      and talismans, sporadic Lone Star raids, warning networks, and occasional damage to merchants.
  - name: The Spirit Focus
    address: Spanaway-McKenna Highway and 208th Street
    narrator: A Loveland jazz nightclub, described as owned and controlled by the yakuza, with visiting
      musicians and controlled entry.
  - name: Underworld 93
    address: 4819 96th Avenue East
    narrator: Downtown Puyallup concert club in a converted concrete warehouse, with a concert hall,
      broad stage and advanced lighting and sound systems; the book lists performers including Concrete
      Dreams, Jetblack, Maria Mercurial and Lorelei Angel.
  - name: Carbonado
    narrator: Eastern ork-majority area in disused strip mines, pits and tunnels near the NAN border.
      Residents use remaining mine structures and sell extracted metal; the narrator qualifies rumored
      storage of contraband in tunnels as rumor.
  - name: Hell’s Kitchen
    narrator: Lava fields, ash dunes, steam vents and geysers west of Carbonado along the Puyallup
      River; abandoned geothermal plants remain after the Crash. Few residents and some Awakened
      creatures are reported.
  - name: Loveland
    narrator: District by Route 7 along the western border, depicted as a rough commercial area affected
      by Mafia/yakuza competition and violence.
  - name: Puyallup City
    narrator: District administrative center where a substantial local government and middle-class
      population remain; the book portrays public officials as compromised by rival syndicates.
  - name: Tarislar
    narrator: Elven neighborhood between Silver Lake and Harts Lake; the source explains its name
      as Sperethiel for remembrance, connects its origins to Night of Rage refugees, and describes
      social resentment involving Tir Tairngire and the Salish-Shidhe Council.
  source_controls: Names, addresses and narrative claims are from the fictional setting narrator.
    The separate speaker record retains individually attributed Shadowland allegations.
