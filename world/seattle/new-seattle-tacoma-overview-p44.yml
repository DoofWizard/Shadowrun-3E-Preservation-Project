    "section": "Around Town / Tacoma overview",
    "source_narrator": "Tacoma, once strongly blue-collar with mills and metal smelters, now combines heavy industry, newer corporate offices, transportation infrastructure and eighteen major factories. Its ports move raw materials and manufactured goods, and Charles Royer Station is the Seattle passenger-train station for bullet trains to and from San Francisco. Sea-Tac airport is nearby.",
