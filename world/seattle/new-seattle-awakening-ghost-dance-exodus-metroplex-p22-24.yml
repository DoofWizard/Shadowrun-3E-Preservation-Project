        "description": "The source traces settlement from Alki Beach and the name Duwamps to a town renamed Seattle in honor of Chief Sealth. It describes the 1855–56 Puget Sound War as leading to forced relocation of local Indigenous communities onto reservations; 1897 Klondike trade, industrialization, union organizing and Seattle's 1919 general strike follow."
