data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: corrected Third Printing (2001)
    nature: Fictional tabletop role-playing-game sourcebook; historical source-period
      facts, not a modern field guide.
  provenance:
    printed_pages: 56-58
    physical_pdf_pages: 57-59
    original_images_reviewed: true
    section: Fort Lewis Urban Combat Simulator, McChord Air Field and Zoological Gardens
  military_training:
    urban_combat_simulator:
      address: 213 West Outer Drive
      location: South of McChord Air Field, east of ammunition storage depots
      operator: UCAS Army
      character: Urban-warfare simulation/training facility built on a model of city
        conditions.
      construction_started: 2035
      construction_finished: 2038
      army_units_rotating_since: 2039
      deployment_pattern: Army regularly rotates soldiers from outside Seattle through
        the simulator for readiness; a typical rotation is around a month, with about
        two weeks in the simulated environment.
      typical_trainee_population: Approximately two thousand soldiers at a time, usually
        one regiment from one of the UCAS Army five divisions.
      simulator_environment: Recreates Seattle urban landmarks such as the Space Needle,
        Aztechnology Pyramid and Renraku arcology, with changes for training. Soldiers
        use laser-tag emitters on barrels and vests with sensors; a successful simulated
        hit produces a pulse/high-pitched audible feedback.
      source_reported_surveillance: Source narrator says cameras and closed-circuit
        simsense are installed and information goes to a Spacefleet HQ bunker supercomputer
        operated locally; an orbiting satellite feed is explicitly only a rumor.
  mcchord_air_field:
    historic_formation: Originally separate from Fort Lewis, McChord was absorbed
      into Fort Lewis during the formation of the Seattle metroplex.
    historical_air_guard: 'The Washington Air National Guard was absorbed into Metroplex
      Guard and operated two fighter squadrons: one of eighteen Federated-Boeing Eagles
      and the other eighteen Eurofighter air-superiority fighters, plus a tanker squadron.'
    joint_task_force_activity: Joint Task Force Seattle has increased McChord activity;
      heavy transport aircraft regularly arrive and depart at its 4,000-meter runway
      carrying troops, equipment and supplies.
    after_renraku_lockdown: UCAS brought two squadrons of tanker/cargo transports
      from Scott AFB, Illinois, and a group of RE-24C electronic-surveillance aircraft
      when the Renraku arcology went into lockdown.
  zoological_gardens:
    address: 1011 West Jackson Avenue
    project_begun: 2023
    original_agency: Defense Advanced Research Projects Agency (DARPA)
    original_purpose: Research into goblinization and paranormal animal changes
    transferred_to_metroplex_guard: 2030
    later_role: Semi-public zoological preserve, education and a breeding/export revenue
      source.
    restricted_areas: Some compound sections remain closed except to military personnel
      and researchers with high-security clearances; patrolled and guarded; exact
      secrets remain unconfirmed.
    public_trails: Trails use proximity sensors and animal-containment measures to
      keep visitors away from potentially dangerous species.
    breeding: Gardens breed animals for other nations, including Salish-Shidhe Council
      and other NAN members; breeding areas are away from public exhibitions.
    paranormal_creatures: The narrator describes the Fort Lewis Zoo as a prominent
      breeder of golden unicorn, cockatrice and phoenix, alongside other paranormal
      animals.
