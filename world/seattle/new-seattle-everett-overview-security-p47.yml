  source_period_narrator:
    geography: Everett is the northernmost Seattle district, on Puget Sound beside
      the Salish-Shidhe border; it includes the Everett Naval Shipyard, industrial
      docks, and a major Federated-Boeing presence.
    economy: New workers, corporate operations, and a recently growing regional economy
      have replaced the quieter district of earlier years; the text describes corporate
      intrigue and rival criminal syndicates within the fictional setting.
    border_context: The North Road passes an SSC military base and border-control
      point a few miles north of Everett; the same source describes SSC coastal patrols,
      inlets, and Deception Pass as a heavily patrolled route from the Pacific Straits.
    entertainment: The narrator portrays limited nightlife despite new employment,
      with Everett Beacon Mall and Casino Corner attracting visitors.
