  narrator_reported_fictional_setting:
    syndicate_overview: The Seattle source lists Mafia, Yakuza, Triads and Seoulpa
      Rings as major in-world underworld syndicates; their competition and smaller
      local gangs are not character combat modifiers.
    mafia:
      current_don: Maurice Bigio
      current_family: Bigio family
      area: Southern Seattle metroplex, including Tacoma docks
      historic_connections: The source describes an earlier role in local docks and
        labor organizations and later expansion into fictional rackets.
      other_named_leaders:
      - Rowena O’Malley of the Finnigan family, described as the previous Don daughter
      - Vince Numbers Ciarnello, capo of the Ciarnello family
    yakuza:
      setting_entry: The source traces regional Seattle operations to Japanese corporate
        expansion near the turn of the century.
      current_oyabun: Hanzo Shotozumi
      source_event: Shotozumi recently declared organizational independence from Japan-based
        leadership, with a possible future conflict presented by the narrator rather
        than an established outcome.
    triads:
      organizational_origin: The source describes Chinese syndicates with Hong Kong
        and mainland China links and growing interests in fictional Seattle.
      named_seattle_groups:
      - Yellow Lotus
      - Eighty-Eights
      - Octagon
      source_reported_market_competition: The Triads compete with the Yakuza and Mafia
        in the source narrative, especially in the fictional BTL chip market.
    seoulpa_rings:
      historical_origin: Described as forming after a fictional 2040s Yakuza purge
        of Korean members.
      organization_style: The source characterizes these rings as smaller groups rather
        than a single centralized hierarchy.
      named_groups:
      - Choson Ring, called the largest Seattle ring
      - Komun’go Ring, described as using magic
      - Tartarus Ring, associated in the narrative with contraband body parts
    major_gangs:
      ancients: An all-elf go-gang with North American chapters; the narrator reports
        influence over Seattle, Tir Tairngire/Salem and Portland smuggling links.
      cutters: The narrative reports a diminished Seattle branch rebuilding recruitment
        and describing itself as a business.
      merlyns: Described as Seattle oldest and largest wizard gang, and as primarily
        working for the Mafia.
  attribution_and_scope:
    narrative_qualification: Named organizations, affiliations, historic events and
      possible future conflicts are printed-book claims within a fictional tabletop
      game, not present-day factual accusations or instructions.
    separate_other_source_classes: Medical Facilities and Newsnets begin on printed
