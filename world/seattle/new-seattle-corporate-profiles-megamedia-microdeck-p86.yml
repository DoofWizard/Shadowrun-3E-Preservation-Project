data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_copyright: FASA Corporation (1999)
    world: Fictional Seattle Metroplex of Shadowrun, not real-world business reporting
  section: The Corporate Sector / Seattle Corps
  corporations:
  - corporation: MegaMedia
    president_or_CEO: William Welsh
    headquarters_in_fiction: 4th Avenue and Stewart Street, Downtown Seattle
    sourcebook_narrator_facts:
    - The narrator calls MegaMedia Seattle’s largest entertainment corporation. Its downtown office tower has four
      large outdoor trideo screens showing clips from company programs.
    - It invests in video, audio, text and simsense. The narrator identifies Amalgamated Studios and Brilliant Genesis,
      both in California, as its major rivals; it describes local competition as effectively nonexistent.
    - Company talent scouts routinely visit Seattle clubs and theaters to recruit performers.
  - corporation: Microdeck Industries
    president_or_CEO: Brian W. Gates III
    headquarters_in_fiction: Microdeck Plaza, Main Street and 124th Avenue NE, Bellevue
    sourcebook_narrator_facts:
    - Microdeck was one of the leading computer-systems corporations in the early 21st century, with Redmond facilities
      supporting the local economy.
    - The Crash of ’29 compromised the corporation’s systems and destroyed most of its valuable data.
    - Charles Gates, then the CEO, oversaw a recovery and a gradual return to the computer market.
    - Rather than competing directly with state-of-the-art systems from companies such as Fuchi or Renraku, Microdeck
      continued producing inexpensive computer hardware and software for consumers and small businesses.
    - The narrator identifies Charles’s son Brian Gates III as current leader and reports licensing agreements with
      Mitsuhama; Fuchi and Renraku’s difficulties create potential growth opportunities for Microdeck.
