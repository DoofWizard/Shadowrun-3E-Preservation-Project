    "section": "Welcome to Seattle / Entertainment, Music, Sports and Newsnets",
    "narrator_facts": [
      "Seattle trideo reception is described as broadly comparable to other UCAS cities, with eight local public trideo stations and numerous cable and satellite channels; the published list includes KONG, KOMA, KORO, KSPS, KSTS, KKR U, KSAF and KTX X, plus KPUB for metroplex affairs and NABS/NSSL network offerings. The channel names are period-specific fictional media.",
      "Seattle's simsense industry is smaller than California's. The source calls MegaMedia the biggest local simsense house and names performers Reah Blackwraith and Nicky Saitoh. Amalgamated and Virtual World-Disney are mentioned as film studios shooting in and around Seattle.",
      "The music scene includes Concrete Dreams, a Seattle-origin act living on a private estate in Salish territory; other named performers include Lorelei Angel, Speed Coma, Til Es Hault, Darkvine, and troll thrash-rock band Skuzzy and the Gonzos.",
      "The Seattle Kingdome is home to the Seahawks, Supersonics and Mariners, and also supports the Tacoma Tigers and Everett Giants minor-league baseball teams. Portland Lords are a Tir Tairngire team; their matches against the Mariners are depicted as popular.",
      "The Tacoma Dome houses Tacoma Timberwolves combat-biker and Seattle Screamers and Tacoma Wings urban-brawl teams.",
      "The Seattle division of Independent Information Network (IIN) is in Everett at 36th Avenue West and 179th Street SW. Its worldwide headquarters are in New York City, its president/CEO is Albert Roseau (dwarf in the fictional metatype taxonomy), and Seattle division head Carla Gassina is an ork. The publication describes its journalism as notably metahuman-friendly.",
      "NewsNet is listed with president/CEO Tanner Deveraux, worldwide headquarters Atlanta CAS, Seattle bureau on Maple Valley Road in Renton, and division head Matt Westerly. The narrator describes a large independent investigative news organization.",
      "KSAF is listed with president Helena Rossum and headquarters at North 21st Street and Old Tacoma Way in Tacoma; the narrator describes its news gathering as unusually prescient and its crews as accompanying remarkable events.",
      "The narrated trideo-pirates subsection distinguishes activist networks Orks First! and Green-Watch, commercial pirates selling unauthorized pay-per-view content, and smaller hobbyist broadcasters. These are fictional media-faction descriptions, not operating instructions."
    ],
