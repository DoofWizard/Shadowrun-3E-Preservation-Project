  narrator_setting:
    district: Snohomish
    landscape: The source describes Snohomish as Seattle metroplex farmland and the
      remaining substantial green expanse, on a different footing from most of the
      sprawl.
    municipal_history_2048: The source says Snohomish's mayor was assassinated in
      2048 by his son, who was married to an elf and who had criticized his father's
      outspoken Humanis Policlub stance.
    current_government_and_tensions: The Humanis Policlub is described as entrenched
      in the district. Mayor Karl Feddersen, son of the former mayor, and his wife
      Jassila seek better racial relations but face opposition.
    agricultural_economy: Smaller farmers compete with large agribusinesses, particularly
      Meyers Agriculture, Society Farms, Berkley Soy Foods and High-Yield Industries.
      The book says agricorporations own 39 of the 50 largest district farms.
    river_economy: The banks of the Snohomish River support fifteen separate aquaculture
      facilities; Ingersoll Aquaculture, Farm-the-Sea and Aqua Arcana are named examples.
      The facilities raise aquatic crops ranging from seaweed and krill to crayfish.
