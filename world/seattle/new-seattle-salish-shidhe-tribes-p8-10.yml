    "section": "Salish-Shidhe Council / Salish, Sinsearach, Makah, Cascade Crow and Cascade Ork",
    "narrator_reported_facts": [
      "The Salish-Shidhe Council comprises several constituent tribes, each with representatives; it surrounds the Seattle Metroplex and has distinct domestic interests. The book describes the Salish as predominantly human, located west and south of Puget Sound; Chief Harold Gray Bear and chief shaman Leaping Salmon are named. Its principal industries are electricity, fishing and tourism.",
      "The Salish tribe founded and owns Gaeatronics; David Gray Bear, chief Harold Gray Bear’s brother, directs the company. Its Olympia fusion facility and solar, wind and geothermal generation contribute electricity sold to other jurisdictions, including California and Tir Tairngire.",
      "The Sinsearach tribe is described as predominantly elven, southwest of Seattle including Mount Rainier, led by Chief Gillian Morningsong, a coyote shaman, and chief mage Ryan Highbrow; forest products, handcrafted goods, tourism and animal husbandry are described as important. The Cénesté faction split away and founded Tir Tairngire in 2035; the remaining Sinsearach emphasize care of their traditional lands.",
      "The Makah are described as predominantly human in the northwestern Olympic Peninsula, with Chief George Lodgepole and chief shaman Black Otter. Forestry and naval/military activity are important; former US naval installations, including the Trident-submarine base, are now part of Makah-controlled defenses.",
      "The Cascade Crow are described as predominantly human, east of Seattle toward the Cascades, led by Chief Frederick Eye-Like-Eagle and chief shaman Red Buffalo Woman. Their agriculture, ranching and equestrian economy trades with Seattle. The book describes political efforts to restrict Seattle’s foreign presence as unsuccessful Council proposals.",
      "The Cascade Ork tribe is predominantly ork, also including trolls and some dwarfs and humans, occupying a smaller Cascades territory around the eastern land route. Chief Pawl Shaggy Mountain is a troll and chief shaman Skink an ork. Sheep ranching, mining, tourism and crafts are among the described industries. The sourcebook describes illicit trade through the East road, generally moving toward Seattle, and Council concern over BTL and Cal Hot traffic."
    ],
