data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_copyright: FASA Corporation (1999)
    world: Shadowrun fictional Seattle Metroplex; these are not current real-world corporations or business claims
  section: The Corporate Sector / Seattle Corps and Megacorporations
  book_narrator_corporate_profiles:
  - organization: VisionCrafters
    president_or_ceo: Charles Glasswalker
    headquarters_in_fiction: Vancouver, Salish-Shidhe Council
    seattle_division: VisionCrafters Optics
    local_address: 228th Street SE and 45th Avenue SE, Snohomish
    division_head: Homer Rhodes
    narrator_facts:
    - The Vancouver optics firm produces cybereyes, optical vehicle sensors, laser optics and optical-computing
      technology. The book names Argus-brand cybereyes and cosmetic modifications among its products.
    - VisionCrafters expanded into the fictional Seattle metroplex through its purchase of Snohomish Optics. It
      retained the Snohomish facility as a smaller research/development center, protected by Eagle Security; the
      narrator judges the center’s computing systems first-rate and speculates they support optical-computer development.
  - organization: VisionQuest Entertainment
    president_or_ceo: Holly Brighton
    headquarters_in_fiction: Lake Louise, NAN
    seattle_division: VisionQuest Studios
    local_address: 2400 Beaux Arts Road, Bellevue
    division_head: Valerie Keene
    narrator_facts:
    - VisionQuest Studios produces simsense programs, especially for its VisionQuest theme park near Lake Louise.
    - Holly Brighton, described as a former confidante of the great dragon Dunkelzahn, inherited VisionQuest under
      his will and pursued expansion and marketing after taking control.
    - Attendance at the theme park increased, and the company marketed sims based on park material and Dunkelzahn’s
      life. The newest product, “Interview with a Dragon,” is described as a North American bestseller.
    - The narrator explicitly leaves the duration of Brighton’s eventual ownership speculative; her emotional connection
      to the bequest is not itself proof of future corporate policy.
  - organization: Ares Macrotechnology
    ceo_and_board_chair: Damien Knight
    headquarters_in_fiction: Detroit, Michigan, UCAS
    seattle_division: Bellevue Way SE and 16th Street SE, Bellevue
    division_head: Karen King
    narrator_facts:
    - Ares has no major direct Seattle investment in the publication’s description. Many of its aviation and military-vehicle
      business interests in the metroplex are controlled by Federated-Boeing.
    - The narrator instead describes Ares as involved in other Seattle industries, including Weapons World retail
      outlets and subcontract arrangements with Federated-Boeing.
    - Karen King is described as a former UCAS Marine who directs a tight local organization. The Ares Seattle headquarters
      is a dark red artificial-stone/tinted-glass structure near Lake Washington, managing subsidiaries including
      Knight Errant and Ares-owned freight companies.
    - The site’s protection is provided by Knight Errant out of Tacoma; the headquarters has rigged building-security
      systems and magical defenses.
  - organization: Aztechnology
    home_office: Tenochtitlán, Aztlan
    president_or_ceo: Juan Atzcapotzalco
    seattle_division: Northwestern Division
    local_address: Broadway Avenue East and East Harrison Street, Downtown
    division_head: Maximilian Lozano
    narrator_facts:
    - The Seattle site is headquarters for Aztechnology’s Northwestern Division, including Seattle and the NAN.
      It is an important North American beachhead because Aztechnology is legally forbidden to do business in California
      and Tir Tairngire but retains interests in both.
    - The Aztechnology Pyramid is a Seattle skyline landmark, with Aztec-style carvings and carved artificial quartz.
      Its interior houses offices, a mall on the three lowest levels, and headquarters operations of major divisions;
      the narrator also places a magical research laboratory in upper levels.
    - The book states that at least one battalion of Aztlan troops is stationed in Seattle under Reynaldo Martinez.
