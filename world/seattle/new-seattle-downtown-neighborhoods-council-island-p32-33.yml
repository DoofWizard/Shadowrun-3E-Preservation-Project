data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_copyright: FASA Corporation (1999)
    fictional_context: Sourcebook for the fictional Shadowrun tabletop-RPG Seattle;
      not real-world contemporary conditions.
  section: Downtown Seattle / Neighborhoods / Council Island
  attribution: Primary descriptive setting paragraphs within the book; the introductory
    first-person observer is signed SPD, while named Shadowland comments are treated
    separately.
  security_and_jurisdiction:
  - The sourcebook depicts central Downtown as a heavily guarded commercial core with
    Lone Star patrols examining conspicuous military-style weapons and extensive corporate
    security presence.
  - Corporate hosts in Downtown are described as protecting important systems by isolation
    from the public Matrix or by use of private local telecom grids (PLTG) and corporate
    intranets inside facilities.
  districts:
  - name: Ballard
    source_period_facts:
    - Upper-middle-class, heavily Scandinavian-heritage district north of the Lake
      Washington Ship Canal; Swedish/Norwegian festivals and continuing ties to Poulsbo
      in Salish-Shidhe territory.
    - The Berzerkers gang focuses on defending its neighborhood turf; a smuggling
      route from Salish-Shidhe territory crosses Puget Sound.
  - name: Capitol Hill
    source_period_facts:
    - Bohemian district with historic buildings, artists, chic residents and many
      Awakened residents; the source describes relatively inexpensive older housing,
      private coffeehouses, restaurants and talisman shops.
  - name: Elven District
    source_period_facts:
    - South of Lake Union and west of Seattle Center, long-standing elven and dwarven
      community adapted a former middle-class district with ivy, painted/carved façades,
      pre-Awakening graffiti and unofficial Night of Rage memorials.
  - name: International District
    source_period_facts:
    - South of the city center, with substantial Japanese, Chinese, Korean and Southeast
      Asian communities and Asian restaurants.
    - The sourcebook identifies the district as a Seattle yakuza center, home to oyabun
      Hanzo Shotozumi; Triad inroads are disputed in a named comment, not established
      as uncontested control.
  - name: Queen Anne / Interbay / Magnolia Bluff
    source_period_facts:
    - Lower Queen Anne is middle-class near Seattle Center; Upper Queen Anne has wealthy
      residential developments and corporate executives.
    - Interbay is near the Burlington Train Yards and has a politically active ork
      community associated with the Seattle branch of the Ork Rights Committee.
    - Magnolia Bluff is a wealthy residential enclave; the governor mansion is on
      West Blaine Street and the source identifies a private estate owned by Rowena
      O’Malley, an invented-world Mafia leader.
  - name: Seattle Center
    source_period_facts:
    - Waterfront commercial and tourism center with high-rise megacorporate structures,
      the Renraku arcology, helicopter and tilt-rotor traffic, World’s Fair remnants
      and Space Needle.
    - The source also names Aquarium, Evergreen Park and Pike Place Farmer’s Market
      as attractions.
  - name: University District
    source_period_facts:
    - Around the University of Washington north of Lake Washington Ship Canal and
      east of Interstate 5; university shopping along University Way NE, the U-Bookstore,
      student/faculty residences and a computer-sciences program.
    - The book says corporate-funded campus research exists but the most sensitive
      projects are housed in separate secured corporate facilities outside the campus.
  - name: Council Island
    source_period_facts:
    - Formerly Mercer Island in Lake Washington, ceded by the Treaty of Denver for
      Salish-Shidhe Council use as an embassy in Seattle (UCAS territory).
    - Salish-Shidhe residents renamed and renovated many buildings, restoring island
      flora/fauna and rebuilding with Salish-style structures.
    - Island access is by Interstate 90 bridge or ferry. Security posts at both ends
      of the bridge conduct thorough visitor checks for contraband and weapons.
    - A 2041 breach by the Leather Devils go-gang involved property destruction and
      injured residents; security remains strict, while some other go-gangers attempt
      attacks as unlawful initiation challenges.
    - Approximately three thousand island inhabitants are chiefly diplomats/families
      from the Salish-Shidhe Council and other Native American Nations, with rangers
      and wildlife scientists. Non-Native residents are chiefly translators, attachés
      and vital embassy staff.
