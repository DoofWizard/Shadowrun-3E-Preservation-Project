    section: Ork Underground origin, community structure, and public tours
  narrator_facts:
    extent_and_structure: A loosely connected network of underground tunnels and inhabited
      enclaves beneath the Seattle metroplex, including Downtown, Tacoma, Everett
      and even the Puyallup Barrens; not all enclaves connect or share political interests.
    inhabitants: Primarily orks, with some trolls, and varying internal politics and
      customs.
    historic_buildings: The Underground originated beneath nineteenth-century Seattle;
      twentieth-century Downtown redevelopment buried some old buildings and basements
      that were later rediscovered and used.
    night_of_rage: During the Night of Rage, metahumans fleeing burning warehouses
      sought refuge in underground storm drains and sewers and found older buried
      buildings and basements; some settled there and restored or expanded them.
    dwarf_expulsion: The narrator says a split developed in the 2020s between Underground
      orks and dwarfs that culminated in the violent expulsion of the dwarf minority.
      Motivations and responsibility are separately disputed in a named speaker comment.
    public_tour_entrances:
    - Basement of old Seattle Utilities Building
    - Inside the Big Rhino Restaurant
    - Basement of Lordstrung's Department Store at Fifth Avenue and Pine Street
    tour_scope: Official tours show only a fraction of the Underground and focus on
      historical sites related to Seattle and metahumans.
    memorial: The area near the docks hosts an annual service commemorating the Night
      of Rage but is otherwise closed to the public.
    other_entrances: Knowledge of other underground access points is closely guarded
      by communities in the Underground.
  source_distinction: The book narrator does not establish the later shadowtalk assertions
    about paid refuge, trafficking routes or special passes as independently verified.
