 the narrator characterizes as a de facto military dictatorship."]},{"printed_page":12,"subject":"population and civil status","facts":["The sourcebook says the nation bars non-Natives from citizenship and immigration, a policy described as helping precipitate its separation from the NAN.","Most inhabitants are described as Tsimshian and Tlingit, with a Haida and Kwakiutl minority of no more than 20 percent; the book says minority inhabitants are usually treated as second-class citizens or worse."]},{"printed_page":12,"subject":"punishment, coercion and armed institutions","facts":["The narrator describes criminal penalties involving slavery or forced servitude, not voluntary labor, and a practice of implanting criminal convicts with cranial explosives keyed to a special transmitter for coercive prisoner control.","Tsimshian police are described as a paramilitary force with military-specification armor and weapons."]},{"printed_page":12,"subject":"industry and natural resources","facts":["The economy is largely logging and mining; the narrator describes clear-cut forestry and strip mining, with weak environmental safeguards unlike several other NAN nations.","The source separately describes cross-border black-market traffic, Tsimshian\u2019s northern location and connections to sea and transcontinental routes; this archival geography is not guidance for real-world smuggling."]}],"attribution_boundary":"Statements made in named sidebar comments\u2014such as rumors about Deborah Jim, minority resistance, inspections, official corruption and criminal groups\u2014are distinct from unsigned narrator narration and must be evaluated as in-world allegations, not documented real events.","no_rules_inference":"Demographic percentage and historical dates are source-period setting details, not dice mechanics; no new numeric tabletop rule is inferred."},"framing":"newsroom_neutral","headline":"Fictional tabletop-RPG setting reference \u2014 FanPro LLC, New Seattle (FanPro10657),