data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_copyright: FASA Corporation (1999)
    scope: Fictional tabletop role-playing-game Seattle, not contemporary real-world
      Seattle.
  section: Downtown Seattle / places to be and places of interest
  provenance:
    printed_pages: 35-38
    physical_pdf_pages: 36-39
    source_page_images_reviewed: true
  reference:
    venues:
    - name: Club Penumbra
      address: 5th Avenue and Yester Way
      narrator: Long-established shadow-oriented club with black walls, artificial
        lunar surface flooring, astronomical décor, updated laser effects, private
        booths, and loud dance music; near the Renraku arcology. Source describes
        mixed audiences, including shadowrunners and corporate employees.
    - name: Dante’s Inferno
      address: 5th Avenue and Madison Street
      owner: Dante Passini
      narrator: Nine huge glass dance floors descend through spiral ramps, with dramatic
        light and music; the bottom floor is called Hell. High-status clientele and
        private rooms feature white-noise generators and magical wards.
      fee: Dante charges upwards of 1,000 nuyen per night for a night in Hell; optional
        services are billed separately.
    - name: Eye of the Needle
      address: 410 West Thomas Street
      narrator: Exclusive restaurant atop the Space Needle, immediately beneath the
        observation deck; rotates for a panorama. Private dining rooms use anti-surveillance
        equipment and magical wards.
    - name: Matchstick’s
      address: 4th Avenue North and Denny Way
      manager: Carl Steward
      narrator: Private jazz-era-themed nightclub and bar near Seattle Center; live
        jazz on many evenings, sound-insulated secluded booths and a back room available
        to members for a fee.
    facilities:
    - name: Federated-Boeing Shipyards
      address: SW Florida Street and 26th Avenue SW
      narrator: Harbor Island waterfront factories build military and commercial hydroplanes
        and hovercraft. The company supplies the Salish-Shidhe Council, several ferry
        companies and corporations including Lone Star, Ares, Aqua Arcana and Ingersoll
        & Berkley.
    - name: Lone Star Security Building
      address: 2nd Avenue and Union Street
      narrator: Dark-blue pyramid-form office complex containing Lone Star executive
        and business offices plus a public law-enforcement museum. The source describes
        twenty sub-basement levels, fleet vehicles, helicopters and extensive weapons
        inventory.
    - name: The Omnidome
      address: Pier 64
      narrator: Renovated warehouse next to Seattle Aquarium, converted to a large
        trid theater offering panoramic three-dimensional movies; owned by Renraku,
        near its arcology. The book calls it a staging location for Renraku security
        operations.
    - name: The Renraku Arcology
      address: 1 Renraku Avenue
      narrator: Huge truncated-pyramid structure roughly 1,000 meters tall, occupying
        more than ten city blocks on each side; at publication date sealed under lockdown.
        Armored entrances, automated security, offline Matrix connections and magical
        wards are described; UCAS military cordons the area while governor refuses
        a large-scale corporate deployment. Many occupants remain trapped, estimated
        in-book at roughly 100,000.
    - name: Sea-Tac International Airport
      address: Perimeter Road
      narrator: Large airport with thirty-nine airlines and air-freight services,
        expanded capacity and corporate guarding arrangements. The source describes
        two-level main terminal, X-ray scanning, chemical detectors and rotating security
        forces from United Corporate Council members; not procedural guidance.
  source_review_limits: Source-period descriptive reference, not a modern venue guide
    or bypass instructions. Named in-world commentary on these sites is separately
    attributed. Ownership of the Eye of the Needle is reported by named speaker Dante
    the Man, not asserted here as primary narration.
