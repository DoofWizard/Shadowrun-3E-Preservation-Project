  section: Around Town / Everett / Everett naval, aerospace, biomedical and media
    facilities
  narrator_facts:
    everett_naval_shipyards:
      entrances: Rucker Avenue and Pacific Avenue
      chronology:
      - Operated as a carrier battlegroup home port and ship-repair facility in the
        1990s.
      - A 2042 UCAS Military Improvements Act helped retain Everett Shipyards and
        the Fort Lewis army base as major UCAS military sites in the metroplex.
      source_period: Home base for the UCAS nuclear carrier battlegroup around supercarrier
        USS Koontz, under Rear Admiral Jennifer McNair.
      border_agreement: Treaty of Denver arrangements allow Salish-Shidhe naval cutters
        to dock for repairs at the yards; book narrator distinguishes this from the
        named posters’ military speculation.
    federated_boeing_everett_facility:
      address: 938 84th Street SW
      industry: Ten factories around Paine Field build aircraft and spaceplanes, including
        the assembly line of the large Boeing 828.
      boeingville: Company housing near the airfield holds about one-quarter of Federated-Boeing
        employees, including some subsidized apartments and houses and company entertainment
        and utilities.
      security: Federated-Boeing Security provides round-the-clock policing for its
        private corporate neighborhoods.
    bicson_biomedical:
      address: Beverly Park Road and 117th Street SW
      industry: Pharmaceutical manufacturer and laboratory supporting cyber-implant
        maintenance, including immunosuppressants, viral nanotechnology, synthesized
        hormones and some bioware such as artificial glands.
      chronology: Cross Biomedical purchased Bicson in 2055, making the Everett operation
        a Cross Advanced Technologies subsidiary; management reports to Cross Biomedical
        in Boston, then to its Montreal headquarters.
    dadson_vision_entertainments:
      address: 7th Avenue and Everett Mall Way SE
      industry: California-based simsense and trideo studio recruiting young performers
        and electronic/sim-developers in the Seattle metroplex.
      content: Produces both higher- and lower-grade programming, especially racy
        and mindless entertainment marketed as California-style media.
  attribution_boundary: Corporate surveillance, fictional military intelligence disputes,
    the Cybertram trial story, and allegations concerning Dadson distribution appear
    in named Shadowland commentary, not as certified narrator facts.
