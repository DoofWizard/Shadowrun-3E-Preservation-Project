  narrator_reported_core_setting:
    metroplex_districts_count: 10
    district_governance: Each district is governed by a mayor and a district council.
    metroplex_governance: One governor administers the metroplex and is advised by a twenty-one-member Cabinet.
    seattle_congress_elected_representatives: 100
    fort_lewis_district: Under UCAS military jurisdiction; the Metroplex Guard commander traditionally serves
      as district mayor.
    acting_governor: Ivar Lindstrom
    predecessor_governor: Marilyn Schultz
    predecessor_status: Recent disappearance inside the closed Renraku arcology preceded Lindstrom taking office.
    police_primary_provider: Lone Star Security Services
    supplementary_private_security: Other private security firms offer services to customers who can pay; the
      book does not assert an active change in the metroplex police contract.
    named_rival_security_company: Knight Errant Security
    knight_errant_relationship: Original FASA7001 p314 describes Knight Errant as the brainchild of Damien Knight
      of Ares Macrotechnology, and says it already provides security for several corporate installations in
      Seattle; no new corporate ownership hierarchy inferred.
  book_narrator_uncertainty_separated:
    governor_futurity: Lindstrom may remain in office for the foreseeable future; the source conditions this
      on the possible reappearance of Schultz and does not establish permanent succession.
    lone_star_contract_rumor: A source-reported rumor says Lindstrom is considering ending Lone Star contract;
      this is not a confirmed government decision.
    security_expansion_intent: Knight Errant would welcome expanded authority in Seattle; not an assertion that
      this authority was awarded.
