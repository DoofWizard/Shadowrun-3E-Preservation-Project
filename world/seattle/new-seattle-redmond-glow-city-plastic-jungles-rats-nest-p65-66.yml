oil suitable for growing food. The narrator says scavengers and gangs target the groups' scarce food supplies."},{"name":"Rat's Nest","other_name":"North Seattle Refuse Center","location":"North of the Snoqualmie River near the Salish-Shidhe territory boundary","description":"An open-air refuse dump several kilometers wide, sheltering nearly a thousand squatters who salvage usable and saleable goods. Ordinary rats, devil rats and other scavengers inhabit the dump; the source says local Rat shamans sometimes help the inhabitants."}],"editorial_limits":"These are historical fictional-world environmental and social facts only. No practical radiation remediation or illegal-market operating instructions are inferred."},"headline":"Fictional Shadowrun Third Edition sourcebook, FanPro LLC New Seattle (FanPro10657, corrected Third Printing 2001), printed p65-66/PDF66-67: The Barrens / Redmond: Glow City, Plastic Jungles and Rat's Nest sites","summary":"Source-reviewed archival report of fictional tabletop setting material, New Seattle (FanPro LLC, Shadowrun Third Edition, corrected Third Printing 2001), printed p65-66/PDF66-67; sources and provenance are explicit.","framing":"newsroom_neutral"}
