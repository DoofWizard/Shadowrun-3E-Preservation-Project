    "section": "History / Goblinization Day, the Crash, Night of Rage and From the Ashes",
    "source_narrator_chronology": [
      {
        "date": "April 30, 2021",
        "fact": "Goblinization Day: about one in ten inhabitants is described as transforming into orks or trolls. Governor Charles C. Lindstrom orders the Metroplex Guard to detain metahumans and families in camps; scientists subsequently find goblinization is not contagious. Released from quarantine in August 2022, detainees return to an atmosphere of racial violence and distrust."
      },
      {
        "date": "February 2023",
        "fact": "Seattle Police Department officers strike after riots and severe stress. Lindstrom fires all SPD members and contracts Lone Star Security Services for metroplex law enforcement. The narrator distinguishes the forced labor/contract transition from voluntary decisions by individual former SPD officers."
      },
      {
        "date": "2028–2029",
        "fact": "Charles Lindstrom retires in 2028, succeeded by Charles S. Kross. The Crash of '29 devastates global telecommunications and local businesses; the book specifically says Redmond never fully recovers from its economic consequences."
      },
      {
        "date": "2036",
        "fact": "Kross retires. Victor 'Vic the Quick' Allenson, a former Tacoma Timberwolves combat biker, wins the metroplex governorship after an anti-metahuman campaign and inspires recruitment by racist organizations."
      },
      {
        "date": "February 7, 2039",
        "fact": "Governor Allenson directs the Metroplex Guard to detain the city's metahumans and move them to Tacoma waterfront warehouses. Explosions and fires follow, killing hundreds amid locked buildings and panicked escape. The source says no one knows with certainty who initiated the gunfire or bombs; witnesses alleged Hand of Five involvement. The Guard's refusal to intervene as the fires spread is asserted directly by the narrator."
      },
      {
        "date": "Days following the Night of Rage",
        "fact": "Public anger centers on Allenson and Lone Star. Members of the United Corporate Council demand action; Allenson refuses and is subsequently found dead in his office. The narrator states neither who killed him nor the guilt of rumored conspirators."
      },
      {
        "date": "After Allenson's death",
        "fact": "Marilyn Schultz, mayor of Bellevue, wins a special election for governor, not Ivar Lindstrom, who had been widely expected to win. Schultz orders Lone Star to arrest Hand of Five leaders. The narrator states most Seattle leaders were dead or jailed by the end of the so-called Week of Sirens."
      }
    ],
