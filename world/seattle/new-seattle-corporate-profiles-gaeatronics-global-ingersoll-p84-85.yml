headline: Gaeatronics, Global Technologies, and Ingersoll and Berkley — fictional corporate profiles
summary: Source-reviewed fictional Shadowrun Seattle publication material in FanPro LLC New Seattle, FanPro10657,
  Third Edition, corrected Third Printing (2001), printed pp84-85/PDF pp85-86; narrator statements and named speaker
  claims are kept distinct.
data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_copyright: FASA Corporation (1999)
    world: Fictional Seattle Metroplex of Shadowrun, not real-world business reporting
  section: The Corporate Sector / Seattle Corps
  corporations:
  - corporation: Gaeatronics
    president_or_CEO: David Gray Bear
    headquarters_in_fiction: Olympia, Salish-Shidhe Council
    sourcebook_narrator_facts:
    - The corporation is owned and operated by the Salish-Shidhe Council; it supplies most of Seattle’s power via
      its Olympic Peninsula fusion plant.
    - Gaeatronics invests in alternative solar, wind and geothermal energy throughout the Olympic Peninsula and
      Cascade Mountains. Its research yields geographical and environmental data sold to corporations and research
      foundations.
    - Its primary competitor is Shiawase Atomics, which controls much fusion-power production along the eastern
      seaboard of North America and in Asia; Gaeatronics holds a comparable position in the Seattle market and has
      difficulty expanding outside it.
    - The multi-level ivy-covered Bellevue headquarters is nicknamed “Gaeatronics Mountain”; trees and shrubs grow
      on rooftop terraces. David Gray Bear spends most of his time at the Olympia facility and makes regular Seattle
      visits.
    - The narrator characterizes the company’s public advertising as environmentally friendly; this is a description
      of its marketed image, not independent certification of environmental performance.
    seattle_division:
      address: 119 West Groat Point Drive, Bellevue
      division_head: Deborah Joshua
  - corporation: Global Technologies
    president_or_CEO: Urlan Manes
    headquarters_in_fiction: 1903 South 100th Avenue SE, Bellevue
    sourcebook_narrator_facts:
    - Global is a smaller high-technology firm specializing in simsense and skillsoft technology. The narrator says
      it made several developments in ASIST simsense technology, including combinations of simsense and skillwire
      systems.
    - Its products include sims, mainly educational and training software, along with skillwires and skill-chips.
    - The narrator says larger corporations have offered to acquire Global but Urlan Manes has refused to sell.
  - corporation: Ingersoll and Berkley
    president_or_CEO: Donovan Giotti
    headquarters_in_fiction: Aurora Avenue and Mercer Street, Downtown Seattle
    sourcebook_narrator_facts:
    - This conglomerate includes Ingersoll Aquaculture and Berkley Soy Products Unlimited, supplying much of Seattle’s
      native foodstuffs.
    - Its output includes cultured soy, krill, fish, crustaceans and other crops from farms in Snohomish and along
      the Pacific Coast.
    - Following corporate mismanagement and near-bankruptcy, Universal Omnitech acquired the conglomerate in 2057.
      The narrator reports Omnitech brought investment and restored operational efficiency.
    - The new parent corporation developed a biotechnology research division.
