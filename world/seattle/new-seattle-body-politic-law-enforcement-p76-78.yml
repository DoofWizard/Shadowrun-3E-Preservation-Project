{"id":"world.seattle.body_politic_law_enforcement_p76_78","record_type":"world_source","status":"ingested","source":"source.fanpro-10657","printed_pages":"76-78","pdf_pages":"77-79","edition_scope":"Historical fictional Seattle as published in FanPro LLC New Seattle (FanPro10657), corrected Third Printing 2001; Shadowrun Third Edition, not current real-world agencies or later rules.","content_class":["world_fact"],"framing":"newsroom_neutral","headline":"Fictional Shadowrun Third Edition Seattle — law enforcement and licensed security providers (FanPro10657)","summary":"Source-reviewed law enforcement and licensed security providers from FanPro LLC New Seattle, corrected Third Printing (2001), printed pp76-78/PDF pp77-79; fictional tabletop-RPG setting claims, with named allegations not treated as independent fact.","data":{"publication":{"title":"New Seattle","publisher":"FanPro LLC","catalog_number":"FanPro10657","printing":"Corrected Third Printing (2001)","game":"Shadowrun Third Edition","original_copyright":"FASA Corporation (1999)"},"section":"law enforcement and licensed security providers","lone_star":{"official_role":"The book identifies Lone Star Security Services as Seattle Metroplex's official policing contractor following dissolution of the Seattle Police Department; smaller security firms guard private customers, but Lone Star holds general legal enforcement authority.","ceo":"Theodore W. D. Winslow","headquarters":"Austin, Texas","seattle_division_address":"Lone Star Seattle, 2nd Avenue and Union Street, Downtown","seattle_division_head":"William Loudon, Chief of Police","deputy_chief":"Tyler Grummet","enforcement_division":"Captain Kyle Palmer","corporate_division":"Captain Angela Dumont","paranormal_investigation_division":"Captain Walter Westcott","leadership":"William Loudon has led Lone Star Seattle since 2049 and continued through two corporate administration changes.","contract":"Governor Lindstrom first hired Lone Star after dissolving the Seattle Police Department. Governor Schultz later renegotiated the policing contract at least twice; the book describes uncertainty over renewal under Lindstrom.","magical_policing":"The Department of Magical Investigation, nicknamed the Dips, is led by Captain Walter Westcott, handles crimes involving magic and magical licensing/certification in Seattle, employs approximately 80 magicians, and has forensic magical-crime expertise. Tactical divisions employ their own wizards; Tactics SWAT combat mages and Demolitions clairvoyance/telekinesis specialists are mentioned."},"knight_errant":{"name":"Knight Errant Security","president":"Roger Soaring Owl","headquarters":"Detroit, UCAS","seattle_division":"Knight Errant Seattle Training Academy, 715 NE 3rd (main gate), Renton","division_head":"Ellen Ward","standing":"Second-largest private security provider in Seattle; Ares CEO Damien Knight's company trains personnel in Renton and sells private security services throughout the metroplex.","equipment":"Knight Errant agents receive high-quality equipment supplied by other Ares subsidiaries; Ares Arms tests some new weapons prototypes through Knight Errant. The book describes their black uniforms and public image."},"other_providers":{"minimum_active":"At least twenty private security providers are described as operating in Seattle.","named":"Eagle Security; Hard Corps, Inc.; Wolverine Security; Emerald City Security; Nightingale Security; Olympic Security.","jurisdiction":"Private contractors ordinarily act on their customers' sites and hold suspected offenders until Lone Star arrives; Lone Star has metroplex-wide enforcement responsibility."}}}
