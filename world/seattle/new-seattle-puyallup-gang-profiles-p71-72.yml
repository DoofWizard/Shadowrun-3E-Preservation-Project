  section: Puyallup Gangs, by Social Adept, in published fictional setting
  narrator_intro: Puyallup gangs are territorial and concentrated near habitable enclaves. The source
    distinguishes metahuman gangs from human vigilante and Humanis-affiliated groups.
  profiles:
  - name: Black Rains
    territory: Carbonado, an ork-majority neighborhood
    composition: All-ork gang; black and gold colors. Leader Billy Mura has Japanese ancestry, blue-tinted
      skin and prominent oni-like eyes. The narrator reports a rumor of yakuza parentage but says
      it has not seen supporting evidence.
    activity: Local protection rackets, smuggling and chip distribution; the narrator credits neighborhood
      isolation with allowing the gang to operate.
  - name: The Princes
    territory: Tarislar
    composition: Elven gang, formerly Princes of the Blood. Led by an elf called the Black Prince,
      who wears a patch over an eye lost fighting Lord Torgo; red leather and black clothing.
    activity: Described as determined territorial defenders, with strained relations with the Ancients
      and former conflict with the Spikes and Silent Ps.
  - name: Forever Tacoma
    territory: Loveland
    composition: Ork and troll gang wearing red and orange, often orange rain slickers over armor.
    activity: Works in low-level protection and gambling for the Mafia and yakuza, currently leaning
      toward the Mafia, and holds some Loveland street-level vice.
  - name: Reality Hackers
    territory: Puyallup City, near Puyallup River and Tacoma
    composition: Technology-oriented gang recruiting from runaway corporate children, some with visible
      cyberware.
    activity: The narrator describes theft of chips, dataslats and pirated software, operation from
      an abandoned riverside warehouse, and parties using sophisticated electronics.
  source_controls: Uncorroborated personal assertions by named Shadowland posters are in a separate
    record. No new equipment/attack mechanics are inferred.
