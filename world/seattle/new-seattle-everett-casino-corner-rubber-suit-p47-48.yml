  section: Around Town / Everett / Casino Corner and the Rubber Suit
  narrator_facts:
    casino_corner:
      street_reference: Evergreen Way and Route 526
      place: Collection of casinos, nightclubs and hospitality houses in central Everett
        just outside Federated-Boeing territory.
      relative_status: Entertainment options range from ordinary businesses to upscale
        alternatives; this district draws visitors during most hours.
      criminal_context: The fictional Ciarniello Mafia family holds this area as a
        stronghold and uses some clubs to launder earnings from other operations.
        Rival yakuza groups have attempted to claim business there.
    rubber_suit:
      street_reference: Upper Ridge Road and 18th Street SW
      place: Large, exclusive nightclub and a social venue associated with younger
        members of the Shotozumi yakuza clan.
      organization_relationships: Some First Nations gang members visit to meet a
        yakuza kobun for orders or to deliver tribute; narration presents these interactions
        as gang relationships, not player instructions.
  attribution_boundary: The details of a rumored yakuza buraku brothel and multiple
    Mafia shootings at the Rubber Suit are statements by named in-world posters on
    printed p48, not additional certified narrator history.
