  original_source_period_transport_assertions:
    air_taxi:
      count_city_services: 5
      destination_pattern: The printed narrator says five air-taxi services carry
        passengers from Sea-Tac or major corporate centers to important city destinations.
      monitoring_and_response_as_narrated: Within the fictional setting, air-taxis
        file flight plans with Sea-Tac control and are monitored by local and corporate
        radar; the narrator describes a warning followed by Lone Star helicopter attention
        for deviations. This is not a real-world procedure.
      aircraft_facilities: The printed narrator says most major corporate and government
        facilities have heliports.
    driving:
      light_traffic_cross_metroplex_hours_approximately: 3
      heavy_traffic_qualifier: The source says rush-hour travel takes longer, without
        specifying a fixed number or test modifier.
      local_road_conditions: The source contrasts generally maintained city roads
        with damaged or missing grids in rundown areas such as the Redmond Barrens;
        it reports local motorcycle preference and source-period gang hazards.
    ferry:
      schedule_scope: The original says daytime ferries leave hourly from Pier 66
        in downtown Seattle for Tacoma and Everett.
      largest_mentioned_ferry_vehicle_capacity: 50
      capacity_unit: cars
      service_types: Some vessels carry automobiles; others are passenger ferries
        or express hydrofoils.
    public_transit:
      operator: Metro Transit Company
      modes:
      - bus routes through the metroplex
      - monorail
      monorail_route: The source says the elevated monorail circles downtown and stops
        near Seattle Center and the Renraku arcology.
    maritime_entry:
      source_period_reporting: The printed narrator describes a Port of Entry Complex
        for commercial and passenger transit and notes illegal entry as fictional-setting
        context, without giving a test, TN, game bonus or actionable travel instructions.
