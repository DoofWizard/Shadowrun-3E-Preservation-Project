data:
  publication:
    title: New Seattle
    publisher: FanPro LLC
    catalog_number: FanPro10657
    edition: Shadowrun Third Edition
    printing: Corrected Third Printing (2001)
    original_copyright: FASA Corporation (1999)
    world: Shadowrun fictional Seattle Metroplex; these are not current real-world corporations or business claims
  section: The Corporate Sector / Seattle Corps
  book_narrator_corporate_profiles:
  - organization: Pacific Rim Communications Unlimited (PRC)
    president_or_ceo: Yoshi Anjiro
    headquarters_in_fiction: Tokyo, Japan
    seattle_division: Pacific Rim Communications Northwest
    local_address: 6th Avenue and Union Avenue, Tacoma
    division_head: Cassandra Paul
    narrator_facts:
    - PRC operates large-scale telecommunications systems for corporations and governments, including municipal
      telecom grids; it runs Seattle’s local telecommunications grid (LTG). The narrator describes its network influence
      as considerable though smaller than a first-rank megacorporation.
    - Its influence concentrates around the Pacific Rim; PRC seeks growth in North America and Asia. After Fuchi’s
      collapse PRC acquired regional telecom contracts rapidly, though it lacks the capacity to acquire all Fuchi
      assets and must contend with competitors.
    - Its Tacoma complex occupies former Pacific Northwest Bell land bought in 2046; the complex services its Seattle
      branch and answers to the North American branch in San Francisco.
    - The Tacoma facility uses conventional physical access controls and its own armed security force, while the
      narrator describes its Matrix security as first-rate.
  - organization: Telestrian Industries Corporation (TIC)
    president_or_ceo: James Telestrian III
    headquarters_in_fiction: Portland, Tir Tairngire
    seattle_division: Telestrian Industries Seattle
    local_address: Denny Way and Boren Avenue N, Downtown
    division_head: Sean Telestrian
    narrator_facts:
    - The narrator calls TIC the largest and most aggressive conglomerate in Tir Tairngire, diversified into nearly
      every cutting-edge industry.
    - TIC holds contracts with the Tir military and government branches and important patents for Tir food crops.
      It is almost entirely owned by the wealthy Telestrian family; its CEO promotes family leadership.
    - TIC controls much of the business transporting goods from Tir Tairngire to Seattle for global distribution,
      works with local biotechnology corporations and agribusinesses, and sells some of its patented crops to farms
      in Snohomish.
  - organization: United Oil (UniOil)
    president_or_ceo: Gerald Byrne
    headquarters_in_fiction: Dallas, Texas, CAS
    seattle_division: UniOil Research and Development
    local_address: 900 Forest Ridge Drive SE, Auburn
    division_head: James V. Rinchnik
    narrator_facts:
    - UniOil is among the setting’s largest petrochemical firms. Its Seattle operations research new petrochemical
      products and extraction/refinement techniques, including new fuels, polymers and plastics.
    - Its drilling operations extend through western North America, the southern CAS, the Pacific coast and elsewhere;
      the narrator says its corporate security has generally handled ongoing trouble involving eco-terrorist groups.
    - The White River research compound is an armed, fenced facility with monowire, sensor boxes and a guard force
      numbering at least one hundred; the narrator explicitly connects this security to the protection of sensitive
      fuels and petrochemical research.
  - organization: Universal Omnitech
    president_or_ceo: Hamilton Grimes
    headquarters_in_fiction: Vancouver, Salish-Shidhe Council
    seattle_division: Universal Omnitech Seattle
    local_address: Aurora Avenue and Mercer Street, Downtown
    division_head: Donovan Giotti
    narrator_facts:
    - Universal Omnitech achieved biotechnology breakthroughs and earns substantial patent revenue, though the book
      narrator says it has not yet reached true megacorporation status.
    - It acquired smaller biotechnology facilities and businesses, including Ingersoll and Berkley in Seattle, seeking
      research facilities, study data and broader finances.
    - Its business also includes agriculture and aquaculture. See the earlier independent source-period record for
      Ingersoll and Berkley rather than inventing a later-edition history.
