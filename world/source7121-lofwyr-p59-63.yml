name: "Lofwyr"

source_period_profile:
  - "The source presents Lofwyr as the great dragon who controls Saeder-Krupp and sits on Tir Tairngire's Council of Princes."
  - "His influence is described as spanning megacorporate, political, magical and personal networks, with ordinary participants often unaware that a plan ultimately serves him."
  - "The gamemaster is encouraged to use Lofwyr as a remote patron, adversary or 'wheels of fate' figure rather than as a conventional encounter-level opponent."

rules_guidance:
  - "No fixed Lofwyr stat block is provided in this chapter."
  - "The gamemaster should treat his multiple plans, long time horizon and willingness to absorb local setbacks as the important campaign mechanics."
  - "Characters working for Lofwyr may gain wealth and reputation, but continuing association can become increasingly difficult to escape."

