data:
  source_scope: The fictional East Asia association briefing supplies the central case study; its analysts
    and narrator are distinct from Shadowtalk commentary.
  competitive_strategy: Aztechnology reportedly uses hostile acquisition of competitors and their subsidiaries,
    including subsidiaries of major megacorporations; the briefing characterizes countermeasures to competition
    as disproportionate escalation.
  padua_venice_case:
  - sequence: 1
    event: Second-tier Komatsu Corporation acquired an obsolete petroleum-processing plant in Padua-Venice
      and repurposed it to make advanced chemical fertilizers, challenging Aztechnology’s local dominance.
  - sequence: 2
    event: Komatsu underpriced the slow-to-adapt local Aztechnology operation and gained a large market
      share.
  - sequence: 3
    event: Aztechnology sold products below its normal prices across European markets where Komatsu competed,
      sustaining losses to pressure Komatsu.
  - sequence: 4
    event: Aztechnology acquired three local companies that were Komatsu’s sole nearby raw-material suppliers
      for the Padua-Venice plant and raised their prices.
  - sequence: 5
    event: Komatsu closed the plant; Aztechnology acquired it at below-market price, and ended its own loss-making
      price reductions after Komatsu conceded.
  analyst_cost_estimate: Various in-world analysts estimate almost 200 million nuyen spent on the episode;
    not a verified exact transaction ledger.
  mechanics_review: The case study contains in-world economic figures, but no target numbers, dice pools,
    damage codes, equipment prices or other gameplay resolution mechanics.
