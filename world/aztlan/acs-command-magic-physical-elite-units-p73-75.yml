data:
  document_origin: Fictional Knight Errant competitive-security report, framed by Captain Chaos; in-world
    reporting rather than neutral external confirmation.
  corporate_security: Aztechnology Corporate Security (ACS) provides internal and external site protection
    and is also Aztlan’s primary civilian law-enforcement organization. Individual units ordinarily
    obey local facility management unless senior ACS officers countermand. ACS has its own command,
    personnel structure and promotion system and its overall managing director reports to Aztechnology
    chief operating officer.
  command: Thibault identifies Carmel Vega as managing director of ACS and describes her as a Desert
    Wars veteran and second-generation corporate employee, daughter of an ORO expediter; this named
    detail originates in attributed commentary.
  magical_security: The Knight Errant briefing reports that ACS embeds mages and shamans in ordinary
    platoons, rather than isolating all magic users; it uses paired watcher spirits as sentries and
    fields other magical defenses. Sensitive sites may have hellhounds, piasmae, nagas, cockatrices
    and basilisks. An unexplained mana field is reported at some locations; the source does not identify
    a proven technique behind it.
  physical_security: 'The briefing characterizes ACS guards as procedurally trained rather than unusually
    imaginative, often with better weapons/armor than comparable Knight Errant personnel. It gives a
    hypothetical low-threat comparison: ACS medium combat armor and assault shotguns versus Knight Errant
    light armor and machine pistols; this is a fictional qualitative example, not formal equipment table.'
  elite:
  - organization: Leopard Guards
    scope: Worldwide sensitive-site protection, including Seattle Aztechnology pyramid, according to
      attributed Carter
    description: Elite ACS special-forces-style cadre, many Desert Wars veterans; estimated over half
      cybernetically augmented and many of the remainder physical adepts; roughly compared to Renraku
      Red Samurai. Estimates and comparisons are not exact character statistics.
  - organization: Jaguar Guards
    scope: Only inside Aztlan, including Tenochtitlan headquarters and ceremonies
    description: Even more intensively trained/equipped ACS personnel, compared with the debated Black
      Daggers of Tir Tairngire. Knight Errant estimates battalion strength, four companies of three
      platoons each; platoon officers are lieutenants, company officers captains. Lieutenant Colonel
      Enrico Silva leads the battalion, nominally ACS but seconded from the corporation’s military.
      These are estimates, not verified staffing counts.
  mechanics_review: Ratings and precise Matrix benchmarks are preserved separately as rule_exact; no
    dice, target numbers, damage codes or cost/Availability table on these pages.
