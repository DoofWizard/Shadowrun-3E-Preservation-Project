    "context": "These are fictional world-setting facts presented by Aztlan (FASA7213, 1995) for the historical Shadowrun Second Edition setting, not allegations about real people, and not advice on criminal conduct.",
    "broadcast_and_culture": "The narrative states that government/Aztechnology owns or operates all television networks directly or through subsidiaries, while reportedly independent networks are indirectly controlled; foreign entertainment distribution is restricted. The main national programming network is Televisa, a former ORO acquisition. The book mentions numerous in-world state-promoted music stars; Teatro Figueroa hosts theatre, La Cámara mounts stage works, and Las Opera de Tenochtitlán stages opera, with government support.",
    "music_and_dance": "The New Palace of Performing Arts hosts Ballet Folklórico and Aztlan's National Symphony Orchestra; the ballet is advertised as preserving cultural dance, though source characters contest its authenticity and discuss augmentation or magic in performances.",
    "sports": "The narrator says the nation's two dominant sports are ollamaliztli and fútbol (soccer). Tenochtitlán will host the 2056 World Cup finals at Aztec Stadium; Aztlan participates in the quadrennial tournament. National and domestic teams play football, while urban brawl is marginal.",
    "ollamaliztli": "Ollamaliztli is an in-world indigenous team game. Two teams of three on a long stone court attempt to send a rubber ball through elevated wall rings using knees, elbows and hips. Local commentary describes severe injuries and death, even in professional matches; the game has schools-to-major leagues, city teams and special exhibition tournaments. The narrator says Aztechnology handles legal betting while other betting is alleged.",
    "organized_crime": "The book's narrator disputes the claim that there is no organized crime, stating that Yakuza, Mafia families and Caribbean-based pirate groups operate in the market while remaining much less powerful than Aztechnology. The narrator describes the Yakuza and Mafia as having limited local reach, with the Mafia more associated with smuggling, stolen goods and minor gambling; no new real-world crime instructions are given.",
