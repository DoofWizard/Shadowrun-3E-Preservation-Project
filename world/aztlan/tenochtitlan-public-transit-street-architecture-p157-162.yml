  "data": {
    "context": "Aztlan (FASA7213) describes the invented Shadowrun city Tenochtitlán in 2056; these are sourcebook world facts, not real-world transit or public-safety advice.",
    "transport": {
      "bus": "Automated Autobús lines run cross-city and suburban express routes using road-embedded GridGuide; fares are zone-based: one zone 1,000 pesos (1,200 peak), two contiguous zones 1,800 (2,000 peak), three zones 2,200 (2,500 peak). The book describes an Autobús as seating 24 passengers, normally travelling around 50 kph and reaching 85 kph when an internal PANICBUTTON alert is triggered; the use is described as reckless endangerment.",
      "monorail": "Elevated maglev tracks follow century-old rail right-of-way, with emergency and fire roads under the guideway; fares vary by route, distance and time, approximately 500–4,000 pesos.",
      "air": "Air Montezuma's Mariposa scheduled short-hop services link outer hubs with the center using small V/STOL craft such as the Osprey II, generally costing more than bus travel.",
      "parking": "The book's narrator calls central parking expensive and largely cashless; the exact 3,000 pesos/6 nuyen half-hour rate and barcoded parking process are claims attributed to the named in-world speaker Dilbert, not an independently confirmed tariff."
    },
    "street_and_districts": "The guide calls the city densely populated, severely polluted and unequal; the Zócalo-adjacent Aztechnology Corporate Sector is a clean, busy, heavily policed corporate downtown. Lower-class outer districts receive less predictable services and protection.",
    "police": "Policía are described as heavily armed and equipped through Aztechnology Corporate Security; corporate core patrols and response are strongest, with other districts receiving differing enforcement. Vehicle color-coding is an in-world commentator's observation, not official regulation.",
    "fashion": "Source narrator describes breathable air filters/respirators as common fashion accessories, with traditional clothing also present; pollution-conscious design shapes attire and branded protective clothing.",
    "architecture": "The book describes periodic earthquakes (minor shakes roughly once per decade, major ones every 50–60 years), the 2029 earthquake and fire damage, varied Aztec-inspired and retro architecture, reinforcement of surviving structures, hardened shelters and fire stations.",
    "communications": "The corporate core has public high-bandwidth fiber-linked booths and reliable cellular access permitting full public-access cyberdeck connections; service and access degrade in poorer suburbs.",
    "emergency_services": "The corporate core has public PANICBUTTON booths linked to Policía, fire services and medical response. The narrator describes weaker provision outside the core.",
    "social_services": "Two publicly funded agencies are named, the Ministry of Health and Welfare and the Social Security Institute; the source narrator contrasts official public control with effective Aztechnology administration.",
