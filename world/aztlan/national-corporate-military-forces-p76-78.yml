content_class:
- world_fact
data:
  narrator: Arctic White, introduced by Captain Chaos (in-world Shadowland comments), NOT a neutral
    authorial military census.
  reported_personnel:
    aztlan_national_force: Approximately 50,000 personnel; Arctic White says an estimate, NOT an
      exact census
    aztechnology_corporate_military: Close to 150,000 personnel, approximately triple the national
      force, based on Arctic White’s claim
    national_branches_best_guesses:
      ground: about 35,000
      naval: about 10,000
      air: close to 5,000
      estimated_support_fraction: maybe 40 percent noncombatant support personnel
      estimated_combat_fraction: roughly 30,000 personnel out of 50,000, not a precise count
  separation_and_tension: Arctic White describes national and corporate military chains of command
    and tables of organization as nominally distinct but sometimes cross-directed by Aztechnology.
    He recounts an unverified rumor of allied units fighting each other in the Yucatán. He alleges
    Aztechnology officers sometimes supersede national commanders; do not treat the rumor as confirmed
    history.
  differentiation: Arctic White says national troops generally retain heavy weapons and armor, including
    tanks and artillery, while corporate units tend toward specialized technologically sophisticated
    equipment, drones, advanced armor, and fictional laser/missile devices. These are qualitative
    narrative examples; no formal weapon statlines occur in this passage.
  major_bases:
    north:
    - Ensenada
    - Matamoros
    - Manchaca (south of Austin)
    - El Paso
    - San Diego
    - Hermosillo
    central:
    - Mazatlán
    - Veracruz
    - Puebla
    - Oaxaca
    yucatan:
    - Progreso
    - Campeche
    south:
    - Panama
    - Cartagena
    - Cali
  ground: The fictional national ground forces are predominantly mechanized infantry with armored
    support; Arctic White distinguishes defensive/tactical emphasis from faster Operational Maneuver
    Groups, with reference to Soviet-era doctrine; he alleges Texas Rangers took losses from national
    artillery.
  navy: Arctic White calls national assets a frigate navy of frigates, destroyers, patrol boats and
    a few 688-equivalent fast attack submarines; he says the force has no aircraft carriers, strategic
    missile submarines, or large battleships, and is much stronger in coastal defense than long-range
    projection.
  uncertainty: All numbers, relative capabilities and battlefield anecdotes originate in Arctic White’s
    fictional post; not independently sourced military facts and not real-world tactical advice.
