      "locks": "Six locks are doubled. Three Gatun Locks raise the ship 25.9 meters to Gatun Lake (almost 26 meters above sea level), Pedro Miguel lowers it 9.4 meters to Miraflores Lake, and two Miraflores Locks lower it 16.8 meters to the Pacific.",
