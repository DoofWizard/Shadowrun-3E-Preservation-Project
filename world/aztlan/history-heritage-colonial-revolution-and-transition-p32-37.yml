data:
  narrator_scope: Fictional Aztlaner institutional historical account republished
    by Captain Chaos, whose editorial introduction calls it selective and biased.
    Pre-2011 references are this source’s historical narrative, not independently
    checked real-world history.
  ancient_cultures:
  - date: 21,000 BCE (claimed)
    account: The institutional narrator says hunting peoples inhabited its lands by
      this point.
  - date: 8000 BCE (claimed)
    account: The narrator credits early local peoples with squash cultivation, describing
      it as possibly a North or South American first.
  - date: 1500–200 BCE
    account: Olmec civilization is located in the later fictional states of Veracruz
      and Tabasco, with ceremonial architecture at La Venta.
  - date: 1400 BCE and later
    account: Mayan language/cultural ancestors appear in Yucatán, Campeche, Chiapas,
      Belize and Guatemala; the narrator describes their Classic period as 300–900
      CE, monuments at Palenque, Tikal and Copán, mathematical, astronomical and artistic
      accomplishments, and domestication of turkey and dog.
  - date: approximately 700 CE
    account: Teotihuacán near the later Tenochtitlán is described with the Pyramid
      of the Sun, Pyramid of the Moon, Avenue of the Dead, more than 70,000 inhabitants,
      and over 1.3 million hectares; these are the narrator’s figures.
  - date: approximately 900 CE
    account: The narrator says Maya communities withdrew from major urban centers;
      reasons are explicitly unknown.
  - date: around 1000–1200 CE
    account: Toltec empire in Mexico’s valley centered on Tollán/Tula, temple associated
      with Quetzalcóatl; a legend contrasts Tezcatlipoca and Quetzalcóatl. The account
      says Toltec decline and Chichén Itzá settlement followed, while Mayan traditions
      absorbed Toltec elements.
  - date: 1325 and 15th century
    account: The Mexica/Aztec founding of Tenochtitlán and later predominance are
      presented by the narrator as an idealized cultural ancestor of Aztlan.
  colonial_chronology:
  - date: 1517–1519
    account: Explorer Francisco Fernández de Córdoba reaches Yucatán in 1517; Juan
      de Grijalva follows in 1518; Hernán Cortés leads an expedition in the next year.
      Captain Chaos states that a much larger conquest narrative has been excised.
  - date: Colonial period to 1859
    account: The narrator reports Spanish colonial Catholic missionary orders including
      Jesuit, Franciscan, Augustinian and Dominican groups. It claims the Church held
      33 percent of land and property by 1859, with colonially coerced Indigenous
      labor discussed in attributed commentary.
  - date: 1810–1811
    account: Miguel Hidalgo y Costilla leads a rebellion against caste oppression
      in Dolores; the narrative says Hidalgo was captured and executed in 1811.
  - date: 1814–1821
    account: José María Morelos y Pavón proclaims independence and a republic; leadership
      passes to Vicente Guerrero. The Plan of Iguala in 1821 promises a limited monarchy,
      equal rights for Spanish and Creole populations, and the Roman Catholic Church
      as state church; the Treaty of Córdoba is signed in July 1821.
  - date: 1829, 1836, 1846 and 1848
    account: The narrative ties abolition of slavery by President Santa Anna and attempts
      at centralization to Texan resistance and the 1836 rebellion, followed by U.S.
      declaration of war in May 1846 and an 1848 border settlement losing Texas, California
      and New Mexico. The chapter explicitly editorially skips several later historical
      leaders.
  turn_of_century_to_aztlan:
  - date: '2001'
    account: PRI remains dominant amid scandals, while FDN and PAN oppose it. Restrictions
      on the Roman Catholic Church are described as reducing its urban influence.
  - date: 2004–2005
    account: The source narrator says PRI president Miguel Ávila and associates face
      bribery/corruption allegations, cartel links, and a labor-leader controversy.
      A PAN–FDN coalition replaces PRI after an election.
  - date: 2005–2009
    account: The PAN–FDN coalition increases business restrictions and faces challenges
      from major corporations including Pemex; business leaders withdraw support and
      public disaffection rises.
  - date: '2010'
    account: VITAS epidemic destabilizes the government; Pemex and ORO supply aid.
      The narrator claims the Roman Catholic Church loses influence during disputes
      over metahumanity, while commenters challenge this interpretation.
  - date: 2011–2015
    account: Corporations form a caretaker government for four years, after which
      Aztlan adopts a Matrix-based system of direct public voting. ORO builds and
      services it. Francisco Pavón and the Aztlán Party take office after the May
      5, 2015 election; the narrator says the party has kept office since.
  mechanics_review: Source pp32–37 present narrated history and dated political claims.
    No test procedure, damage rating, character option, price, Availability or numerical
    game-resolution mechanic appears.
