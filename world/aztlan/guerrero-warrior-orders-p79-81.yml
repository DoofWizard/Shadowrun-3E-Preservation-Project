data:
  speaker: Arctic White in the fictional Shadowland narrative, openly acknowledging ignorance and
    limited contact with the orders.
  orders_in_his_stated_approximate_ascending_status:
  - Jaguar
  - Eagle
  - Otontin
  - Quachic (Shorn Ones)
  cross_branch_and_rank: He reports guerreros across the fictional national military, ground, naval
    and air personnel of different ranks; warrior affiliations are not exclusive military units or
    ordinary decoration awards. Members generally wear their regular service uniform plus an order-identifying
    shoulder flash or emblem, and are accorded informal deference beyond nominal rank.
  association: Arctic White describes orders as semi-secret military social associations with separate
    messes, social spaces and lodging, and recurring lodge meetings at least monthly often around
    full/new moon. He explicitly says he does not know their true activities.
  membership: Arctic White cannot identify clear entry criteria; describes both reputed decorated
    veterans and new recruits, says all known members are combat troops rather than support/administrators,
    and says members appear born in Aztlan to citizen parents but he does NOT know how far ancestry
    requirements extend. Historical captive-taking and sacrifice is mentioned as his uncertain description
    of earlier Aztec precedent, not a confirmed contemporary requirement or a user instruction.
  observed_personality_claims: His own strongly opinionated stereotypes characterize Jaguars as glory
    seekers, Eagles as unusually order-proud, Quachic as quiet/intense, and Otontin as comparatively
    enigmatic. These are subjective fictional narrator descriptions, not verifiable group traits.
  magical_claim_not_confirmed: Jones separately alleges all warriors possess magical talent and speculates
    that orders form mystical initiatory ranks, while Arctic White questions that inference; Pyramid
    Watcher asserts Aztechnology links, without definitive narrative validation. Preserve as attributed,
    contested speculation, not a proven eligibility rule.
  not_rules: No printed class/attribute modifiers, magic initiation target numbers, equipment costs,
    or other character mechanics appear in these pages.
