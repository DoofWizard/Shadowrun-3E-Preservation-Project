data:
  context: The Aztlan sourcebook’s fictional Tenochtitlán statistical block and descriptive
    civic-government account. Figures are presented as printed without real-world
    verification; Captain Chaos warned that material could be outdated.
  vital_statistics_as_printed:
    population: 17766900
    metatype_percentages:
      human: 65
      elf: 15
      dwarf: 7
      ork: 9
      troll: 1
      other: 3
    density_populated_districts_per_square_kilometer: 490
    per_capita_income_pesos: 19200000
    below_poverty_percent: 30
    on_fortunes_active_traders_list_percent: 4
    megacorporate_affiliation_percent: 66
    felonious_crime_per_1000_per_annum: 15
    education_percent:
      high_school_equivalency: 34
      college_equivalency: 31
      advanced_studies_certificates: 17
    hospitals: 75
  civic_structure:
    council: A city mayor plus six City Council members; members are directly elected
      through an electronic ballot and serve terms up to three years.
    mayor_appointment: The mayor is appointed by the governor of the Distrito Federal
      for up to three consecutive four-year terms.
    governance: The mayor chairs City Council meetings, casts a vote to break ties,
      and may propose council resolutions.
    current_mayor: Simon Xaltepec was reappointed in 2054 for his third and final
      four-year term.
  provenance: Printed p154 / PDF163, headings VITAL STATISTICS and GOVERNMENT; narrator
    statements, separate from speaker skepticism and precinct ratings.
