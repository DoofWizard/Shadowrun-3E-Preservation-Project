data:
  scope: Fictional institutional history, with contested or censored issues retained
    separately as named commentary. National self-justification is not independently
    endorsed.
  political_formation:
  - period: 1980–2011
    event: Francisco Pavón y Gutiérrez del Córdoba is said to have been born in Córdoba
      in 1980, educated by Jesuits in Mexico City, and to have rejected Catholic ritual
      by age 25. Following the return of magic in 2011 he embraced the Old Ways and
      Quetzalcóatl.
  - period: 2014–May 2015
    event: Pavón founded or led the Aztlán Party, which appealed to historical traditions
      and became nationally influential by 2014. The document says he won the first
      direct presidential election on May 5, 2015.
  - period: '2033'
    event: The account states that Pavón was called home by the Plumed Serpent; it
      does not itself describe a proven death mechanism. Later posters interpret the
      euphemism as possible assassination or power transfer.
  national_relations:
  - period: 2010s–2018
    event: Pavón supports the Sovereign American Indian Movement against the United
      States; the narrator says Aztlan offered sanctuary, material support and moral
      support. In 2017–18 Aztlan was invited to join the Sovereign Tribal Council
      of the newly forming Native American Nations.
  - period: '2034'
    event: The narrator says Aztlan leaves the NAN/STC after disputes and an official
      censure about treatment of aboriginal peoples. Posters dispute the causal explanation
      and connect the rupture to Texas.
  - period: '2035'
    event: After CAS secession from UCAS, Aztlan claims territory in Texas and occupies
      areas including Austin and San Antonio. The narrative says Texas petitions CAS,
      UCAS and STC for support, finds none, declares independence, then returns to
      CAS after an unsuccessful campaign.
  - period: '2036'
    event: Aztlan military forces move into San Diego amid California’s separation
      from UCAS. The source narrates failed appeals for UCAS help; it frames this
      as recovery of territory, while later comments dispute legitimacy.
  - period: 2040–2048
    event: The narrator claims growing stability and accession of Mesoamerican states;
      Guatemala, Belize, Honduras, El Salvador and Nicaragua enter Aztlan during 2045–47
      and Panama during 2048.
  economic_conflict:
  - period: '2044'
    event: Aztlan nationalizes foreign-owned corporate businesses operating inside
      its territory. Aztechnology and Pemex support the government; several foreign
      corporations dispute jurisdiction, citing extraterritorial rights.
  - period: '2048'
    event: The narrative says the Veracruz Settlement resolves much of the clash between
      Aztlan and large foreign corporations; the settlement details are in a separately
      attributed alleged Ares document.
  amazonia:
  - period: 2049–2050
    event: According to the Aztlaner account, Amazonia moves into Colombia and Venezuela;
      Aztlan aids defenders, defends about half Colombia and retakes a small Venezuelan
      area in 2050. The remaining independent Colombia portion petitions to join Aztlan
      and is accepted in 2050. Commenters dispute which side was the aggressor.
  mechanics_review: Narrative chronology and geopolitical claims only; no source game-resolution
    tests, TN, weapon stat line or equipment table on original printed pp38–41.
