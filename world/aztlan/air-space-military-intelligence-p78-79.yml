data:
  narrator: Arctic White’s fictional in-world account with distinct Shadowtalk rebuttals, estimates
    and rumored claims.
  national_air_force: Arctic White describes moderate numbers of reliable aircraft, with emphasis
    on maintenance turnaround and interception/territorial defense rather than long-range offensive
    operations; explicitly states no strategic or theater bombers. Aztechnology corporate air capability
    is characterized differently.
  national_space_assets: Arctic White asserts that Aztlan as a nation has no dedicated national military
    space assets, including no spy satellites or space-based strike systems; he says Aztechnology
    corporate satellites cover that role.
  intelligence: Arctic White claims Aztlan outsources intelligence to Aztechnology military; this
    includes political/military/industrial information, human-intelligence case officers, electronic
    intelligence and space-based observation; he identifies General Paolo Batiste as head of Aztechnology
    military intelligence with an office in Tenochtitlán pyramid, while a later speaker says Batiste
    was recalled; do not treat his continued tenure as established.
  reported_personnel_and_events: He speculates on a large corporation espionage/counterespionage
    network, including an unverified named executive-action team and an unverified Raven-identity
    rumor. Later commenters separately describe a shakeup among senior intelligence officials, with
    no independently established causal account.
  surveillance_claims: Arctic White alleges routine monitoring of communications, attempts to collect
    information from fiber-optic networks, and extensive corporate sensor satellites (visible/infrared/radar),
    including an assertion about multiple satellites monitoring the Seattle pyramid. These are broad
    fictional capability claims, not actionable instructions or authenticated real capabilities.
  interpretation: The narrative mentions surveillance, encryption and warfare only as historically
    published fiction, without translating them into real-world technical procedures.
