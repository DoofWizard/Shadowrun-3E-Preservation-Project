data:
  narrator_intercorporate_status:
  - organization: Mitsuhama Computer Technologies
    status: The briefing says Mitsuhama alone among AAA megacorporations appears on reasonable terms with
      Aztechnology at the report date, despite prior conflicts.
  - organization: Saeder-Krupp
    status: The briefing describes unusually tense relations; the parent corporate holdings had not directly
      clashed by publication, but tensions between subsidiary interests were increasing.
  recruitment:
  - scope: All positions, even menial
    requirement: Aptitude/personality tests lasting most of one day.
  - scope: Particularly sensitive positions
    requirement: Longer test periods.
  - scope: External candidates for senior roles
    requirement: Typically three days of computer-administered testing plus at least one personal interview;
      exceptionally five or more interviews.
  - scope: Key positions
    requirement: Candidates are asked to submit to an additional paranatural screening; they have a formal
      right to decline, but the narrator knows of no candidate who declined and was subsequently hired.
      Request is not represented as consent to coercion.
  - scope: All applicants
    requirement: Detailed personal and professional references are supplied and checked.
  retention_and_extraction: The briefing reports a preference to promote senior personnel internally, a
    near-lifetime employment culture and high loyalty. Aztechnology is comparatively reluctant to extract
    unwilling staff from rivals and is especially forceful in its response to extraction attempts against
    its own employees.
  source_status: Report-level claims rather than an independently verified current hiring policy; the coercive
    meaning of any screening is disputed by commenters.
