data:
  epistemic_scope: Fictional newsFAXday draft attributed to Nicola Forberger, with strikeouts and replacement
    text. Travel observations are the fictional first-person narrator’s account; historical timeline is
    the draft narrator’s account, not a real Mexican history. Shadowtalk allegations are recorded separately.
  travel_and_location:
  - Forberger describes approaching the Yucatán through Progreso, a fishing port on the north coast with
    a large military base. She reports Aztechnology Corporate Security (ACS) and Aztlan Armed Forces (AAF)
    personnel, with a stylized serape distinguishing the ACS uniform.
  - The narrator drives an armored civilian Hummer east and inland along Autoroute 261, passing Temax
    and Tizimín toward Kantunilkín, approximately 70 kilometers inland from Cancún. This is narrative
    geography, not travel guidance.
  - In the draft’s account the Yucatán has a limestone base with shallow, relatively infertile soil, and
    traditionalist communities burn undergrowth to return soil nutrients. Named commentators disagree
    sharply over whether this is environmental harm or agricultural necessity.
  - On the return inland route she observes isolated villages, limited road signage and unreliable civilian
    network coverage, and later reaches Tizimín. The reporter presents these as personal observations,
    not exhaustive conditions throughout the region.
  chronology_as_told_in_report:
  - period: Early 1990s
    report: An uprising in Chiapas brings ignored complaints of traditionalist and mestizo inhabitants
      to broad attention.
  - period: Around 2001
    report: The governors of Chiapas, Campeche and Quintana Roo are assassinated within two weeks; the
      Distrito Federal governor narrowly escapes an attack. Additional killings and protests take place.
  - period: '2002'
    report: A government crackdown captures or kills more than two dozen rebel leaders; the dispute persists
      underground.
  - period: '2010'
    report: A new and more organized uprising centers on Campeche and Yucatán. The report contrasts local
      militias and coordinated actions with earlier unrest, and depicts attacks on government officials
      amid multiple competing explanations of external support.
  - period: 2010 VITAS crisis
    report: The fictional VITAS epidemic strikes Mexico City and strains the medical system. By Christmas
      2010, the report says more than 12 percent of its population is dead or dying. A commenter separately
      alleges more than 2.5 million deaths in Mexico City and additional deaths elsewhere; this is not
      a narrator-verified number.
  - period: January 2011
    report: The Mexican government collapses and the country descends into anarchy, followed by a long
      recovery under the name Aztlan.
  - period: 2035, 2039, 2045, 2050
    report: The editor-added account reports uprisings in Tizimín, Celestún and Xpujil and an assault
      on Campeche in 2050. Older text crossed out in the leaked draft characterizes other Yucatán rebel
      actions and government repression differently; do not conflate the original and edited accounts.
  political_context: The draft names the Frente Democrático Nacional (FDN), Partido de Acción Nacional
    (PAN) and Partido Revolucionario Institucional (PRI) and depicts a contested government coalition,
    political scandals and economic disruption. In-world commenters speculate about drug-cartel involvement
    and official culpability; these are not the report’s established facts.
  mechanics_review: The reviewed original printed pages 15–20 have no standalone dice tests, target numbers,
    numerical game statistics, modifiers, prices, or mechanically operative options. Vehicles and equipment
    are described as setting narrative.
