data:
  publication_context: In-universe political analysis by Carmen Hidalgo in Living
    in Aztlan; institutional descriptions and the analyst's opinions are distinct,
    and real-world assertions are not intended.
  national_structure:
    executive: The fictitious president appoints cabinet members, subject to confirmation
      by Congress; Hidalgo says confirmation is usually routine and offices are politically
      patronage-driven.
    senate: The Aztlan Congress includes an upper Senate of 64 directly elected senators
      serving six-year terms, with half facing election at the same time as the president
      and the other half at the midterm.
    deputies: The lower Chamber of Deputies has 500 members, elected for three years;
      senators and deputies may not serve consecutive terms, though re-election after
      an interval is possible.
    legislative_process: According to Hidalgo, a lower-house proposal becomes law
      after simple-majority approval by the Senate; defeating that Senate-approved
      bill then requires a two-thirds majority of the Chamber of Deputies. Her description
      is presented as a critique of weak lower-house power.
    local_government: 'The source describes 40 administrative divisions: 39 states
      and the Distrito Federal. Each state elects a governor for a six-year term without
      a stated re-election limit and a local legislature of deputies, typically around
      40 seats (Colombia is described as having 12). State deputies serve three years
      without a stated re-election limit.'
    federal_district: The Distrito Federal is described as having no elected legislature;
      its governor is appointed by the president and ratified by Congress.
  parties_as_described_by_hidalgo:
    aztlan_party: The ruling Aztlan Party is said to have held power since its 2011/2012
      takeover following the VITAS crisis. Hidalgo depicts elections as lacking effective
      competition.
    PAN_FDN: Hidalgo names Partido de Acción Nacional (PAN) and Frente Democrático
      Nacional (FDN) as major opposition parties. She reports PAN's former Catholic
      links and adaptation after the church's suppression, and describes ideological
      divisions within FDN rather than treating it as a unified bloc.
    PRI: Partido Revolucionario Institucional (PRI) is described as formerly dominant
      and subsequently marginalized, with Hidalgo attributing little electoral influence
      to it. A speaker disputes how marginalized it really is.
    other_parties: Hidalgo lists smaller ideological and heritage parties, but dismisses
      their practical influence and speculates that some may have rebel connections;
      those connections are not established as fact.
  elections_and_disputed_oversight:
    method: In Hidalgo's account, Aztlan uses Aztechnology-built electronic direct
      voting, nicknamed Dial-a-Vote, allowing votes via home or other terminals and
      aggregating counts centrally.
    criticism: Hidalgo alleges that centralized records and later released audit trails
      are vulnerable to corporate control; the text does not independently establish
      the specific alteration of any individual ballot.
    public_claims: Named Shadowtalk participants argue over whether external oversight
      exists and whether electronic records provide reliable accountability; store
      their statements separately as attributions.
