data:
  context: In-universe urban transport account in the historical Second Edition-era
    city guide, excluding Shadowtalk speakers’ anecdotal driving instructions and
    contested opinion.
  getting_around: The narrator lists car, bus, monorail and short-hop air travel as
    ways of traveling around fictional Tenochtitlán.
  by_car:
    urban_structure: A multilevel city with elevated superhighways, typically called
      autoroutes, on stanchions over major surface streets; sweeping overroutes allow
      travel across broad parts of the city without descending to ground level.
    roadway_support: The narrator states that all major overroutes and surface streets
      have internationally standard GridGuide hardware installed.
  provenance: Printed p156 / physical PDF165, headings GETTING AROUND TENOCHTITLÁN
    and BY CAR. Claims of nonstandard systems are elsewhere and attributed to Henry
    IV.
headline: Fictional Tenochtitlán transport, FASA Aztlan FASA7213 (1995 Second Edition),
  printed p156/PDF165
summary: Retains the source’s transportation categories, multilevel autoroutes, and
  GridGuide hardware claims without conflating speakers’ conflicting accounts.
