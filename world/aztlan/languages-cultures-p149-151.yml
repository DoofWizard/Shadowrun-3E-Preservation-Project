data:
  fictional_source_frame: The language section is explicitly introduced by Captain
    Chaos as a purported entry from Compton's HyperMedia Encyclopedia (2052 edition).
    Numeric and social descriptions are the publication's invented-world statements;
    subsequent Shadowtalk challenges some figures.
  national_languages:
    official: Aztlaner Spanish is described as the official language. The text compares
      it to Mexican Spanish, notes drift from Castilian Spanish and a claimed disappearance
      of much of the subjunctive, and states that government, legal and other official
      activity occurs in this dialect.
    english: English is reported widely spoken, though rural communities may have
      very few fluent speakers. The text says it is not an official state-school curriculum
      subject but is taught in many places.
  indigenous_language_groups:
    overview: The in-world reference describes thirteen distinct Mesoamerind languages
      spoken mainly in indigenous enclaves, and identifies Aztec, Maya, Mixtec and
      Tarascan among significant groups. Its description of subsistence farming and
      literacy is a source viewpoint, not a generalized statement about actual Indigenous
      peoples.
    aztec_nahuatl: Nahuatl (Aztec-Nahua), identified as part of the Uto-Aztecan family,
      is described as spoken in Aztlan and used by priests of the state religion.
      The purported encyclopedia estimates about one million people of Aztec descent,
      mostly around Tenochtitlán; attributed speakers dispute sweeping claims about
      their lives.
    maya_yucatec: Yucatec (Mayan) is described as spoken by perhaps two million people
      around Yucatán and the former Guatemala and Belize regions. Socio Pat contests
      whether that total combines many different languages and suggests around half
      a million speak Yucatec.
    mixtec: Mixtec is described in Oaxaca, Guerrero and Puebla as Oto-Manguean; the
      book presents its surviving population as comparatively small and praises its
      metalwork, stonework, polychrome pottery, and artistic influence.
    tarascan: Tarascan is described as a distinct language family with fewer than
      a quarter-million speakers, particularly in Michoacán southwest of Tenochtitlán.
      The text reports influence on folk and popular music.
  cross_reference: The civil-war characterization and the question whether it constitutes
    a Maya-versus-Aztec cultural clash are debated by named in-world commentators
    rather than established here.
