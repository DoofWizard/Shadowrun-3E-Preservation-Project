  section:
    title: 'Stickball: Rules of the Game'
    chapter: Culture Shock
    in_world_sport: a-ne-jo-di (stickball)
    classification: Rules for an organized fictional-world sport, not a new core SR3 skill, damage or combat subsystem.
    scope: The narrator specifically cautions that these organized competition rules may not apply to ceremonial
      or religious variants.
  match_structure:
    period_count: 2
    period_duration_minutes: 30
    break_minutes: 5
    replacement_players_allowed_per_game: 2
    players_per_team: 12
    field: Open playing field, with goal pole in its center
    roles: No formally designated offensive or defensive positions; an officiating priest and team conjurors have
      nonplayer roles.
    injury_response: Team conjuror immediately applies magical healing on the sidelines when a player is injured;
      such healing is described for the in-world contest.
  equipment:
    ball: Small hard ball; traditionally deer hair and hide in ceremonial play, tightly wrapped cord and a leather
      cover in organized competition.
    mens_sticks: Two hooked sticks, each slightly more than 60 centimeters long; traditionally handcrafted hickory
      with leather lacings making a net; competition versions use wood, lightweight metal or plastic.
    womens_play: Women use their hands instead of sticks in the source’s description of the women’s league.
    clothing: Light shirts, shorts, athletic shoes; women additionally wear lightly padded leather gloves.
  officials_and_magic:
    officiating_priest: Required for each game, whether or not it is a religious competition; throws the ball in
      to start play, stops the game if necessary for injury, safeguards the game’s ritual character and provides
      opening prayers.
    team_conjurors: Comparable in role to coaches, traditionally shamans specializing in health spells; permitted
      to enchant their own players, but not to affect opposing players, the ball or the field by magic.
    spirit_rule: Spirits are not allowed on a team.
    augmentation_rule: Cyberware and bioware enhancements are strictly prohibited.
    limit_on_magic: Magical aid is valued but is not considered a substitute for athletic teamwork or skill.
  scoring:
    center_pole_height_meters: 8.3
    goal: Center-field pole topped with a symbol, often an animal depiction.
    points_hitting_top_symbol: 7
    points_hitting_pole: 2
    win_condition: Accumulate the greatest number of points.
  fouls:
    general: When a foul occurs, the game stops and possession of the ball transfers to the other team.
    deliberate_attacks: Deliberately attacking another player is a foul and may cause expulsion depending on severity
      and recurrence.
    prohibited_magical_effects: Magic affecting the opposing players, ball or playing field is a foul; consequences
      range from loss of possession to magically ejecting the offending conjuror, depending on severity.
  coverage_limit: Only the named boxed source sport rules spanning printed pp119–120/PDF120–121. Urban Brawl news,
    travel ads and adjacent character interviews are distinct unnormalized content. Exact sport numbers are not
    presented as Shadowrun tabletop dice targets.
