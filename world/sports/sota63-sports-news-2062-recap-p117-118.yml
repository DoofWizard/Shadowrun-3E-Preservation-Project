{"id":"world.sports.sota63-sports-news-2062-recap-p117-118","record_type":"world_reference","status":"source_reviewed","source":"source.fanpro-10664","printed_pages":"117-118","pdf_pages":"118-119","edition_scope":"Original FanPro Shadowrun Third Edition fictional setting reference, printed in 2003; no real-world claims or mechanically inferred conversions","content_class":["world_fact"],"headline":"Fictional Shadowrun Third Edition tabletop setting — FanPro State of the Art: 2063 (FanPro10664, 2003), Sport News: The 2062 Recap, printed 117-118/PDF 118-119","summary":"Source-reviewed fictional sports reporting in FanPro State of the Art: 2063 (FanPro10664, Shadowrun Third Edition), printed pp117–118/PDF118–119. Corrects league-specific eligibility and distinguishes reported admissions, allegations, denials, and sporting outcomes. No universal tabletop rule inferred.","data":{"provenance":{"published_title":"State of the Art: 2063","publisher":"FanPro","year":2003,"edition":"Shadowrun Third Edition","catalog_number":"FanPro10664","source_id":"source.fanpro-10664","original_source_sha256":"a49f6c0030ed18e8541a7d45ca2a263ada608e6a22689287a4d234caa471265a","printed_pages":"117-118","physical_pdf_pages":"118-119","chapter":"Culture Shock","section":"Sport News: The 2062 Recap","reference_type":"fictional tabletop-roleplaying sourcebook"},"byline":"Staff of the fictional Sports Today! hostzine","items":[{"sport":"baseball","article_date":"July 2062","teams":["Chicago White Sox","Denver Ghosts"],"report":"The fictional article reports that NAL spokesperson Julia Weiss publicly identified White Sox pitcher Mike Dutton as an adept. Dutton acknowledged the charges and said the franchise had known his abilities before hiring him. Manager Ian Yamaguchi allegedly arranged minor cybernetic modifications to avoid media suspicion while Dutton masked his magical aura. The White Sox owners denied the allegations; the investigation was still pending.","denver_ghosts":"In their first Central Division season the Denver Ghosts recorded 65 wins and 96 losses; manager Manuel Clemente expressed optimism for 2063."},{"sport":"basketball","article_date":"January 2062","teams":["Golden State Warriors"],"report":"The fictional Sports Today! column describes a controversy over the Warriors’ metahuman-heavy lineup and recruitment in the NABA. Formerly the leading scorer with a reported average of 24 points per game, forward Evan Kresler was now appearing for fewer than five minutes per half.","unresolved_context":"Coach Aaron Wu declined comment. A protest was reported with 44 injured. The article says that the roster change coincided with local San Francisco political changes, without establishing causation."},{"sport":"combat biker","article_date":"August 2062","teams":["Commandos","Denver Marauders"],"result":"Commandos defeated Marauders 15–0. Linebiker Alina Bowman reportedly set a new team record for distance carried in one game; coach Augustus Vega described a changed playing style.","named_commentary":{"speaker":"Buzz","type":"unverified speculation","claim":"Buzz alleges that the changed performance is linked to the fictional drug kamikaze, with Charlie Bravo as the local supplier; this remains a named commentator’s claim."}},{"sport":"drone football","article_date":"July 2062","teams":["Montreal Mecanicien","Detroit Rustbelts"],"result":"Montreal Mecanicien defeated Detroit Rustbelts 27–13 in the second annual NADF championship.","background":"The article says previous team financial problems followed an ex-employee embezzling hundreds of thousands of nuyen. Cross Industries acquired the club mid-season; Lucien Cross publicly congratulated the team."},{"sport":"football","article_date":"January 2063","teams":["Tampa Bay Buccaneers","Houston Oilers","New Orleans Saints"],"report":"Representatives of three teams petitioned the fictional Freedom League commissioners for changeling inclusion. Buccaneers receiver Tracy Keller underwent SURGE, developing elongated, extra-jointed arms and digitigrade legs. The report says league officials disqualified individuals affected by SURGE from competition. Keller and the Buccaneers appealed, joined by representatives of the Houston Oilers and New Orleans Saints; the petition outcome is not given. This is a league-specific eligibility condition, not a universal SR3 character or sports restriction.","named_commentary":{"speaker":"Street Knight","type":"attributed in-world alarm","claim":"Warns about threats from Humanis-linked hate groups should the league admit changelings."}},{"sport":"hockey","article_date":"December 2062","teams":["Detroit Red Wings"],"report":"The fictional article reports that, with more than six months until the Stanley Cup, new Red Wings goaltender Peter Nguyen faced game-fixing charges after teammate Leroy van Buren collapsed. Van Buren was in serious condition at DocWagon–St. Mark’s Hospital in Detroit following a near-fatal reaction to an unidentified compound. The report says traces of an unknown compound were found among Nguyen’s possessions; he denied responsibility and an arraignment was scheduled for the next day.","named_commentary":[{"speaker":"Goalkeeper","type":"unverified allegation","claim":"Attributes a three-way player trade among the Red Wings, Canadiens and Stars in the previous year to a series of fictional shadowruns and retaliations over a long weekend."},{"speaker":"Puck","type":"in-world question","claim":"Questions whether Red Wings management are pleased with their recent trade."},{"speaker":"Cutter","type":"unverified defense and insinuation","claim":"Claims Nguyen was not responsible and implies the evidence might have been placed by another party; later disclaims responsibility for the purported circumstances. The comments establish neither an alternative perpetrator nor a death."}]},{"sport":"soccer","article_date":"October 2062","teams":["Cheyenne Coyotes"],"report":"The fictional report states that players Dane Abby, Raphael Lorange and 2051 league MVP Marcel Kuns were permanently removed from the Coyotes roster after unsuccessful implant surgeries. Club sources described the procedures as standard reflex modification surgery. A spokesperson expressed condolences for the deaths; Sioux officials were investigating and had not issued a statement.","named_commentary":{"speaker":"The Smiling Bandit","type":"unverified accusation","claim":"Alleges the players’ records were altered and that the implants were fine; neither claim is established by the newspaper text."}}],"coverage_limit":"Covers the seven Sports Today! sports-news fields on printed pp117–118/PDF118–119, excluding the distinct Sports Zine Calgary Flames boxed feature and the stickball game resumed on printed pp118–120. Numeric facts in this record describe fictional sports outcomes, not tabletop resolution mechanics."},"framing":"newsroom_neutral"}
