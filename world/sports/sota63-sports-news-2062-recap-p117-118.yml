{"id":"world.sports.sota63-sports-news-2062-recap-p117-118","record_type":"world_reference","status":"source_reviewed","source":"source.fanpro-10664","printed_pages":"117-118","pdf_pages":"118-119","edition_scope":"Original FanPro Shadowrun Third Edition fictional setting reference, printed in 2003; no real-world claims or mechanically inferred conversions","content_class":["world_fact"],"headline":"Fictional Shadowrun Third Edition tabletop setting — FanPro State of the Art: 2063 (FanPro10664, 2003), Sport News: The 2062 Recap, printed 117-118/PDF 118-119","summary":"Original-page-reviewed fictional-world Sport News: The 2062 Recap material from FanPro State of the Art: 2063 (Shadowrun Third Edition, FanPro10664, 2003), printed 117-118/physical PDF 118-119; publication narration, named in-world allegations, and unresolved rumors are distinguished, not adopted as real-world findings.","data":{"provenance":{"published_title":"State of the Art: 2063","publisher":"FanPro","year":2003,"edition":"Shadowrun Third Edition","catalog_number":"FanPro10664","source_id":"source.fanpro-10664","original_source_sha256":"a49f6c0030ed18e8541a7d45ca2a263ada608e6a22689287a4d234caa471265a","printed_pages":"117-118","physical_pdf_pages":"118-119","chapter":"Culture Shock","section":"Sport News: The 2062 Recap","reference_type":"fictional tabletop-roleplaying sourcebook"},"byline":"Staff of the fictional Sports Today! hostzine","items":[{"sport":"baseball","article_date":"July 2062","teams":["Chicago White Sox","Denver Ghosts"],"report":"Fictional NAL spokesperson Julia Weiss alleged in a press conference that White Sox pitcher Mike Dutton was an adept and that the franchise knew; manager Ian Yamaguchi was accused of arranging minor cybernetic modifications to conceal his magical aura. The White Sox deny the allegations; investigation results were still pending.","denver_ghosts":"In their first Central Division season the Denver Ghosts recorded 65 wins and 96 losses; manager Manuel Clemente expressed optimism for 2063."},{"sport":"basketball","article_date":"January 2062","teams":["Golden State Warriors"],"report":"The fictional Sports Today! column describes a controversy over the Warriors’ metahuman-heavy lineup and recruitment in the NABA. Forward Evan Kresler was said to average 24 points per game despite appearing for fewer than five minutes per half.","unresolved_context":"Coach Aaron Wu declined comment. A protest was reported with 44 injured. The article says that the roster change coincided with local San Francisco political changes, without establishing causation."},{"sport":"combat biker","article_date":"August 2062","teams":["Commandos","Denver Marauders"],"result":"Commandos defeated Marauders 15–0. Linebiker Alina Bowman reportedly set a single-game meters-carried mark; coach Augustus Vega said the club was pursuing a changed playing style.","named_commentary":{"speaker":"Buzz","type":"unverified speculation","claim":"Suggests the Commandos’ changed approach involves a dangerous sponsor or local supplier named Charlie Bravo."}},{"sport":"drone football","article_date":"July 2062","teams":["Montreal Mecanicien","Detroit Rustbelts"],"result":"Montreal Mecanicien defeated Detroit Rustbelts 27–13 in the second annual NADF championship.","background":"The article says previous team financial problems followed an ex-employee embezzling hundreds of thousands of nuyen. Cross Industries acquired the club mid-season; Lucien Cross publicly congratulated the team."},{"sport":"football","article_date":"January 2063","teams":["Tampa Bay Buccaneers","Houston Oilers","New Orleans Saints"],"report":"Representatives from three teams petitioned the fictional Freedom League for changeling inclusion after SURGE. Former Buccaneers receiver Ricky Keller had received elongated arms and digitigrade legs during a SURGE episode; officials disqualified him and other transformed players. Keller appealed, joined by Oilers and Saints representatives.","named_commentary":{"speaker":"Street Knight","type":"attributed in-world alarm","claim":"Warns about threats from Humanis-linked hate groups should the league admit changelings."}},{"sport":"hockey","article_date":"December 2062","teams":["Detroit Red Wings"],"report":"With six months until the Stanley Cup, the Red Wings installed rookie goaltender Peter Nguyen after the collapse of fellow goalie Leroy van Buren. Van Buren was in serious condition at DocWagon–St. Mark’s Hospital in Detroit after a near-fatal response to an unidentified chemical. The article reports traces of an unknown compound among Nguyen’s belongings, his denial of responsibility, and an arraignment scheduled for the next day.","named_commentary":[{"speaker":"Goalkeeper","type":"unverified allegation","claim":"Claims a three-way player trade among Red Wings, Canadiens and Stars followed hostility over a weekend."},{"speaker":"Puck","type":"in-world question","claim":"Questions whether Red Wings management are pleased with their recent trade."},{"speaker":"Cutter","type":"unverified insinuation","claim":"Speculates about the suspicious death; comments do not establish responsibility."}]},{"sport":"soccer","article_date":"October 2062","teams":["Cheyenne Coyotes"],"report":"Following reported unsuccessful implant surgeries, players Dane Abby, Raphael Lorange and 2051 league MVP Marcel Kuns were permanently removed from the Coyotes roster. A spokesperson expressed condolences for the deaths. Sioux officials were investigating but had not issued a statement.","named_commentary":{"speaker":"The Smiling Bandit","type":"unverified accusation","claim":"Alleges the players’ records were altered and that the implants were fine; neither claim is established by the newspaper text."}}],"coverage_limit":"Covers the seven Sports Today! sports-news fields on printed pp117–118/PDF118–119, excluding the distinct Sports Zine Calgary Flames boxed feature and the stickball game resumed on printed pp118–120. Numeric facts in this record describe fictional sports outcomes, not tabletop resolution mechanics."},"framing":"newsroom_neutral"}
