  druidism:
    estimated_connaught_share: Narrator says more than 80% of Tir druids live and
      work in Connaught.
    source_interpretation: Druidic craft is part of the Western Way and mystical Book
      of Invasions, but non-elf druids are marginalized by some Danaan-family factions.
    disagreement: Some elves treat non-elven druids as rivals; others treat their
      shamanic tradition as incompatible with Tuatha interpretation. Danaan families
      have humans opposed to crackdowns and the druids generally do not actively challenge
      the state.
    college_and_texts: Druids preserve interpretations of Irish history that differ
      from state-approved university courses; narrator frames them as quiet intellectual
      challengers.
  independent_hermetic_organizations:
    exist: Exist outside official Ways and Paths, welcoming members of all races.
    government_response: Families and magical authorities watch these groups but have
      not settled on an overt policy because Tir benefits economically from exported
      magic-related products and independent organizations are varied.
  shamanism:
    urban_and_street: Narrator describes general elven distrust and harassment of
      urban/street shamans; rural shamans receive some scrutiny similar to druids;
      universities favor hermetic curriculum.
    toxic_shamans: Fictional narrator attributes to Tir authorities extreme fear of
      toxic shamans; states EcoSat helps locate toxic magical activity, and the state
      sometimes shares reports with foreign governments.
    legal_consequences: The fictional legal code is described as imposing an automatic
      death sentence by vivisection on persons found by a court to be toxic shamans
      or to have supplied them material assistance; this is a narrated coercive legal
      punishment, not an endorsement or operational instruction.
  unsettled_questions: No explicit target numbers or dice modifiers appear on these
    pages.
  forward_status: Source-reviewed ahead-of-boundary and unindexed; FASA7212 Denver
    remains source-integrity blocked. This record grants no main-manifest activation
    or contiguous page credit.
