  in_world_instruments:
  - name: Uilleann pipes
    book_description: Small bagpipes supplied with air by bellows rather than the
      breath, with bag, bellows, chanter, drones and regulators; the book gives a
      phonetic pronunciation.
  - name: Fiddle
    book_description: A bowed string instrument related to violin, characterized by
      played position, bowing flexibility, tuning and frequently steel strings.
  - name: Flute
    book_description: Commonly wooden, with family-associated decorative carvings.
  - name: Tin whistle
    book_description: The source distinguishes conical whistles pitched in C from
      cylindrical versions available in different keys.
  - name: Button accordion
    book_description: A button or melodeon instrument, not specifically the piano
      accordion; the second row of buttons is a semitone apart and may offer chromatic
      notes.
  - name: Harp
    book_description: The narrator describes Bard–Druid disagreement about its historical
      legitimacy; druids continue to use harps as private music while Bards often
      reject public performance on them.
  - name: Bodhrán
    book_description: A shallow, one-sided drum played with hand or stick and sometimes
      delegated to accompaniment.
  - name: Spoons
    book_description: A rapid rhythm instrument featured in some céilí ensembles but
      not generally considered a Bardic instrument by the narrator.
  - name: Electronic instruments
    book_description: The narrator portrays fictional traditionalists as regarding
      electronic music as lacking the proper spirit; the text mentions some performers
      nevertheless use such instruments for commercial recording and criticizes a
      style called Celtic metal.
  performance_etiquette: In fictional Tír Bardic customs, audiences generally must
    not interrupt a song with applause, yelling, snapping or other noises; applause
    follows the finished song after the performer leaves the stage. A patron buys
    the performer a drink by telling the bartender to arrange a round for the Bard,
    not by demanding service from the Bard. Buying such a drink does not confer reciprocal
    drinks.
  editorial_scope: Cultural practices are fictional in-book claims about the Tír and
    should not be generalized as universal rules for actual Irish music or etiquette.
  forward_status: Verified forward source-review record, not indexed or credited as
    contiguous source authorization.
