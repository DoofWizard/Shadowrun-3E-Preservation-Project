    "scope": "Author Niall O’Connor reports many factions competing with the nominal government and Danaan institutions. Political descriptions are claims within the invented Shadowrun setting.",
    "protestant_paramilitaries": {
      "groups": [
        "Ulster Revolutionary Force (URF)",
        "New Ulster Resistance Movement (NURM)"
      ],
      "book_account": "Limited political base but strong access to arms; narrator characterizes both as hostile to metatypes."
    },
    "republican_brigades": {
      "groups": [
        "Official IRA",
        "Irish National Liberation Army (INLA)"
      ],
      "official_ira": "Stated membership is estimated at more than 300, with cells in Wexford, Cork, Killarney and Limerick. Lacks clear goals beyond opposing elven rule; leader Douglas de Valera named. Book describes an assassination campaign against Danaan family leaders, a bombing of Thomas O’Neill outside Interior offices in Armagh, and uncertain attribution of other acts.",
      "inla": "Narrator describes predominantly criminal activities, including racketeering, extortion, kidnappings, contraband and violent conduct affecting bystanders; not equivalent to political opposition."
    },
    "religion": {
      "catholic_church": "Book says Rome and Vatican lost influence, while the local Church of Ireland and some Catholic orders retain strong rural influence; St. Sylvester followers are associated with tolerance and reconciliation, and some clerical adepts reconcile their gifts with Christian faith.",
      "druids": "More than 80 percent of the country’s druids are said to live and work in Connaught. Disputes concern whether non-elves may practice druidic craft; elven families differ and the largely human druids generally avoid openly challenging state power.",
      "hermetics": "Independent hermetic groups are permitted but watched by the Danaan government, which benefits from magical exports; government mages monitor groups and spiritual leaders report unusual magical activity.",
      "shamans": "Urban/street shamans are subject to cultural distrust and harassment; rural shamans face milder official scrutiny. Book says toxic shamans are pursued and, if proven in court, subject to a death sentence by vivisection."
    },
    "other_groups": {
      "unseelie_court": "The narrator denies the alleged Unseelie Court is a formal organization; describes loose oppositional alliances promoting democratization, while a first-person anonymous passage denies violent aims.",
      "policlubs": "The book says continental-style policlubs are officially disallowed; allowed cultural organizations include the Dandies, Baby Eaters and Endgame (the latter described as officially proscribed). Some Shadowland commenters challenge that account and allege clandestine political groups."
    },
