  source_narrator:
    economic_risk: Narrator describes smaller street groups, political paramilitaries
      and organized crime as distinct, with some organizations able to disrupt the
      fictional Tir economy.
    inla: Irish National Liberation Army is described as the most dangerous active
      Ulster organization, ideologically anti-regime, operating in cells without coherent
      command, with armed and magical members of several metatypes. It has been alleged
      responsible for robberies and violence; the account says TRC investigation involves
      magic and intelligence.
    other_named_groups:
    - Official IRA
    - URF
    - NURM
    other_groups: Other armed groups are said to engage in violent theft and overseas
      funding; the source suggests some alleged connections to organized crime but
      no confirmed network or operational instructions.
    street_gangs: Urban street gangs occur in Dublin, Belfast, Cork, Wexford, Derry,
      Armagh and other cities; narrator says police response can involve heavy magical
      surveillance, medical strike teams and government-controlled publicity.
    justice_coercion: Captured gang members may be sentenced to indefinite or extended
      detention and compulsory purported re-education by court/psychiatric determination;
      these are coercive measures, not voluntary assistance.
  named_gangs_per_speaker:
    source: Dead Meat, on printed p63; not independent book-narrator confirmation
    Ballincollig Bastards: Cork shoreline group described as mixed orks, trolls and
      humans with distinctive street attire.
    Waterford Kristals: Waterford mostly female biker gang described as predominantly
      human.
    Shannon’s Squeezeheads: Mixed-metatype gang excluding elves, reported stealing
      from airport warehouses and using gang status symbols.
  source_fidelity_note: Reproduces claims as fictional setting history and testimony,
    omitting instructional detail about attacks, surveillance evasion or weapon procurement.
  forward_status: Reviewed-forward-unindexed while FASA7212 Denver original is integrity-blocked.
    No source activation, contiguous authorization, or page credit.
