  source_context: Historical fictional Shadowrun RPG source; speaker claims and optional
    GM scenarios distinguished from book-narrator facts.
  scope: Fictional setting account of mostly human and some ork, dwarf, and troll
    druids who live separately from the official elven Path of the Druid.
  distribution: Non-elven druids are described as living mainly in western and southwestern
    Tir na nÓg, with ties to mainland Celtic Druids, especially Wales and Scotland.
  relations: Tir elves tolerate non-elven druids because of shared protection of land,
    but the book depicts reciprocal mistrust. Elves disparage non-elven totem use;
    non-elven druids avoid interfering with elven Path organizations.
  source_narrated_law: Book claims killing any druid, of any metatype, carries an
    automatic death sentence in the fictional Tir jurisdiction, and a brehon does
    not consider mitigating circumstances.
  practices: Most non-elven druids are portrayed as impoverished, humble, devoted
    to land and not interested in the wider world. Experienced human druids sometimes
    use spirits to communicate with British cohorts.
  official_surveillance: The narrator says neither the Tir nor British governments
    know the purpose of these cross-channel connections and both monitor their respective
    druid populations.
  magic_regime: Non-elven druids use the same cairn-line energy mechanics as elven
    Druid Followers (Path Magic p134), although elven beliefs challenge this; non-elven
    druids have no formal orders and do not create ogam stones.
  other_magic: For other rules, use druid rules in Grimoire II and London Sourcebook.
  totem_list:
  - Bear
  - Boar
  - Bull
  - Horse
  - Serpent
  - Stag
  earlier_references:
    bear: Same standard Bear totem description from earlier book (book p120).
    serpent: Tir Serpent is equivalent to Wyrm from Grimoire II/London Sourcebook
      with local modifications.
