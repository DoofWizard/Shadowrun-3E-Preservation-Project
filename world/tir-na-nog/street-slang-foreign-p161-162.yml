  source_method: Third-person reference extraction from this fictional Shadowrun tabletop RPG sourcebook; treat
    its invented-world language and maps as setting material, not proof of modern real-world Irish usage or geography.
  chapter: Street Slang
  section: Foreign Slang
  narrator_observations:
  - The published guide presents Anglo-American words as borrowed into the fictional Tír, often with altered or
    reversed colloquial meanings.
  - Asterisk in the source glossary indicates usage marked as street-slang-only; unmarked expressions may appear
    outside street settings.
  - Government and political influence are central to the source-specific broader sense of pixie.
  entries:
  - term: whizz
    meaning_in_source: Although it sounds like an American word of approval, the book presents it as disapproval
      or poor quality in the Tír.
  - term: drek
    meaning_in_source: Rubbish in its conventional sense; in some specified contexts or pronunciations may mean
      the opposite.
  - term: pixie
    meaning_in_source: An elf; also, in colloquial usage, anything the speaker associates with government influence
      or control.
  - term: Ace / acing
    meaning_in_source: Rubbish; marked as street slang only.
    role: adjective
  - term: Aggro
    meaning_in_source: Trouble, particularly violence.
    role: noun
  - term: Baldrick
    meaning_in_source: Derogatory term for an ork.
    role: noun
  - term: Banging
    meaning_in_source: Superb.
    role: adjective
  - term: (The) box
    meaning_in_source: Trideo screen.
    role: noun
  - term: Demi-tech
    meaning_in_source: Cannibalized technology; marked street slang only.
    role: noun
  - term: Dodgy
    meaning_in_source: Risky, unsafe or at the borderline of illegality.
    role: adjective
  - term: Gonk (out)
    meaning_in_source: To sleep.
    role: verb
  - term: Open
    meaning_in_source: Area with many Garda officers, generally unsafe; marked street slang only.
    role: adjective
  - term: Plazzy
    meaning_in_source: Derogatory term for a useless person; marked street slang only.
    role: noun
  - term: Rak / rakkie
    meaning_in_source: Derogatory reference to a jerk or suburbanite; marked street slang only.
    role: noun
  - term: Rak off / rakking
    meaning_in_source: Dismissive go-away expression; rakking can mean useless; marked street slang only.
    role: verb/adjective
  - term: Rub / rubbing / rub off / rub out
    meaning_in_source: Rub as a verb means sexual intercourse; associated forms described as rubbing, rub off and
      rub out.
    role: verb/adjective
  - term: Sandal
    meaning_in_source: Derogatory term for a non-elven druid, sometimes a druid generally.
    role: noun
  - term: Sep
    meaning_in_source: An American.
    role: noun
  - term: Slamming
    meaning_in_source: Fast or good.
    role: adjective
  - term: Splash
    meaning_in_source: To blow up, hit or strike a target, especially in discussion of fictional terrorist action.
    role: verb
  - term: Steamed / steaming
    meaning_in_source: Drunk.
    role: adjective
  - term: Trancer
    meaning_in_source: Person addicted to a substance; marked street slang only.
    role: noun
