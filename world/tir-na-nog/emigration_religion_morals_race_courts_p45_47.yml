data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition_scope: historical Shadowrun original/Second Edition publication
    printed_pages: 45-47
    physical_pdf_pages: 54-56
  emigration:
    legal_to_emigrate: true
    annual_funds_transfer_ceiling_pounds: 10000
    excess_money_property: Narrator asserts confiscation if people try to move more
      than annual limit; no claim that citizens are legally barred from departure.
  religion:
    constitution: Fictional Constitution Acts purport to protect worship but require
      citizens to actively oppose organizations considered threatening to state stability
      or religious freedom.
    proscribed_group: Universal Brotherhood, described as proscribed under this provision.
    establishment_acts_years:
    - 2036
    - 2049
    designated_state_religion: Church of Ireland
    catholic_status: The source states Catholicism is excluded by the Establishment
      Acts; not a statement about actual religious practice.
    reported_church_ireland_followers_percent_of_non_elven_citizens: 67
  moral_family_law:
    divorce: Allowed after two years mutually agreed separation.
    remarriage: Legally permitted.
    cohabitation: Absent marriage contract, no formal property rights in the other
      partner’s estate after relationship ends, according to narrator.
    abortion_medical_condition: Fictional NHS abortion available when mother has completed
      less than 40% of a normal gestation and medical risk exists; social grounds
      require agreement of three Tir doctors that a specified risk exists.
    metatype_selective_abortion: Fetus having metatype different from mother is treated
      as an infanticide offense if aborted; source penalty three to fifteen years
      imprisonment. Record reflects coercive fictional state policy and does not imply
      maternal consent.
  discrimination:
    constitutions_years:
    - 2035
    - 2044
    formal_rule: Expressly prohibits discrimination based on metatype in employment,
      housing and public organizations and all public life.
    actual_in_world_enforcement: Narrator says proof falls on affected complainant,
      making lawsuits difficult; public-office availability arguments and private
      credit systems are described as ways discrimination persists.
    gender_comment: In-world commenter Sinéad F alleges the society is sexist despite
      formal gender protections; retain as an allegation, not narrator fact.
  hazard_law: Fictional Tir courts may try citizens for actions abroad that would
    violate Tir law if performed at home. The statutory claim is extraterritorial,
    not an operational guide.
  judiciary:
    criminal_cases: Major cases heard by three judges brehons; lesser criminal cases
      handled by fo-brehon magistrate; appeals are possible, rarely used, when grounds
      or new evidence exist.
    civil_cases: A fo-brehon magistrate aided by five jurors; the magistrate determines
      verdict, and parties must bear costs according to financial capacity and submit
      preliminary documentation.
    court_danaan: Council of Stewards’ internal, secret arbiter of disputes within
      the Danaan Families, without formal public records.
  source_period: FASA fictional Tir history; distinctions of rights, conditions and
    coercion preserved.
  forward_indexing_note: Verified forward-unindexed record while predecessor FASA7212
    Denver remains source-integrity blocked. No source activation, authority to advance
    a main manifest, or page credit.
