  macroeconomy:
    data_secrecy: Narrator says Tir authorities do not publish GDP or GNP, officially
      out of concern British intelligence might exploit figures; secrecy also conceals
      family ownership and government-licensed enterprises.
    income_measure_comparison: British financial analysts HKB estimate per-capita
      income at 84% of comparable United Kingdom figure, or 127.5% using purchasing-power
      parity.
    interpretation: Food/clothing/schoolchild meals subsidies, socialized medicine,
      culture and education benefits affect comparisons; narrator cautions public
      statistics may mislead.
  trade:
    foreign_manufactured_imports_percent: 70
    imports_exceed_or_lag: Narrator says exports exceeded imports by 24% throughout
      the 2040s, and trade balance remained healthy.
    food_export_income_percent: 44
    food_export_subset: More than half food export income derives from beef and dairy
      products.
    grain_origins:
    - CAS
    - Britain
    - Ukraine
    other_trade: Tourism, licenses for cultural/art products, college/university tuition,
      specialized arms, intelligence-gathering/software, and EcoSat SES are also named.
  corporate_governance:
    family_control: Narrator says government-controlled or licensed corporations largely
      follow Danaan family spheres of influence; the government does not publicly
      acknowledge all family control.
    foreign_subsidiaries: Foreign megacorporation subsidiaries may operate provided
      Tir government holds at least 51% of their shares, according to source, thus
      considered Tir-owned.
    board_rule_allegation: Paper Chaser alleges businesses with over fifty employees
      or annual turnover above £100,000 have government-appointed board director.
      Distinguish from narrator-confirmed statutory clause.
    private_military: Narrator says no corporation is legally allowed a private military
      force, despite agreements granting a small foreign market presence.
  eight_family_specialties:
    O’Neill: armaments and military hardware
    O’Donnell: security and surveillance systems
    O’Toole: communications and transport
    O’Byrne: general industry
    MacMurrough: agriculture, SES, finance and food especially baked goods
    Fitzgerald: media and entertainment
    MacCarthy: literature, poetry and musical publishing
    O’Brien: education, educational software and EcoSat system
    O’Connor: advanced software systems
  source_qualifier: The text says the leading spheres are listed by family and includes
    nine family labels despite elsewhere identifying eight Danaan-mór; retain printed
    list without rewriting its count.
  forward_status: Source-reviewed ahead-of-boundary and unindexed; FASA7212 Denver
    remains source-integrity blocked. This record grants no main-manifest activation
    or contiguous page credit.
