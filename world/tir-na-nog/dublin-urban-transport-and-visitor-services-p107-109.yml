  source_voice: The chapter narrator describes fictional Dublin transport and tourism services; named Shadowland posts
    and monetary amounts are separately preserved.
  road_policy:
    city_center: Private cars are prohibited in the central city on both sides of the River Liffey; taxis and emergency
      vehicles are exceptions. Garda may confiscate vehicles of disobeying motorists. The restriction reduced reported
      congestion and air pollution.
    routes: Outside the central city, roads connecting the country are described as broad and maintained. Central streets
      are compact and pedestrian walking is emphasized. The road pattern is not a numbered grid, and roadside video signs
      alert motorists to congestion.
    parking: Edge-of-center parking is scarce; underground facilities under Phoenix Park are a last-resort option.
  transit:
    tram_and_bus: The fictional operator Bus Átha Cliath-Dublin (BACD) replaced petrol-powered central buses and coaches
      with electric tram loops. Route service is generally 06:00–midnight, with city-center entry/exit links operating
      around the clock. Tram token cards are debited on boarding and alighting; buses use similar fares.
    BACD_visitor_contact: BACD depot on Cork St., Dublin 8; LTG 81-954622; Central Bus Station on Store St., Dublin 4,
      LTG 41-706540.
    DART: Dublin Area Rapid Transport links the north and south sides on a 23-mile circular loop; a western oval route
      opened in 2048. Superconducting trains run on ceramic rails with peak intervals of about five minutes and off-peak
      intervals of 15 minutes. A full route takes about half an hour; city route operates 24 hours, bay route from 06:00
      to midnight. Bay route runs via Tara Street, Pearse Street and Lansdowne Road, then passes Howth and reaches Bray,
      with ferry service links and views over Dublin Bay.
    railway: Iarnród Éireann–Tír Rail (IETR) links Dublin with other towns and cities. The chapter identifies Connolly
      Station (Amiens St., Dublin 1) for north, northwest, and east routes, and Heuston Station (Kingsbridge, Dublin
      8) for west and south routes.
    taxis: Taxis are licensed and City Corporation-regulated, permitted inside the private-car ban, and gathered at ranks
      beside hotels, theatres and transit centers rather than cruising for customers.
  visitor_support:
    agency: Tír Tourist Board (TTB), 14 Upper O’Connell Street, Dublin 1, LTG 11-444000; also branches at airport and
      Dún Laoghaire ferry terminal.
    services: Travel information, local event guides and fee-based hotel booking; ongoing event guide is the TET (Treuntas
      Éireann-Tír) Matrix area, and weekly publication Go Dublin!
    emergency: The book explicitly says Dublin has no PANICBUTTON service; emergency services respond to telecom calls
      to 999.
  weather: Frequent rain, comparatively mild winters, rare prolonged snow in County Dublin mountains; central air described
    as cleaner because of private-car restrictions.
  forward_status: Verified review of out-of-order source segment; no contiguous-page authorization.
