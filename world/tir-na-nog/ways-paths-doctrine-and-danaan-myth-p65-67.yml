  terms:
    path: Possibility for developing a spirit; to Walk is to pursue development on
      a Path.
    way: Broad concerns of each of the five orientations.
    seeker: Person who Walks a Path but lacks magical aptitude.
    follower: Person who Walks a Path with magical aptitude and is spiritually pursuing
      Ascension.
    ascension: Narrator describes a mythic process of soul growth through five Paths,
      reincarnation and eventual return as Bright Shining Spirit to the Northern Islands,
      not actual metaphysical fact.
  narrated_myth_history: Within the fictional Tir, Ways and Paths doctrine is associated
    with the book Walking to the Light first circulated in winter 2018, attributed
    to James Michael Killearn, a possibly fictitious recluse whom source commentators
    dispute.
  tuatha_de_danaan_six_verses:
  - verse: 1
    story: Tuatha de Danaan live in Northern Islands learning magical wisdom before
      surpassing pagan sages.
  - verse: 2
    story: They study lore in four cities Falias, Gorias, Murias and Findias.
  - verse: 3
    story: Falias provides Stone of Fal, Gorias Spear of Lugh, Findias Sword of Nuada
      and Murias Cauldron of Dagda; each is depicted as a mythic treasure.
  - verse: 4
    story: Tuatha de Danaan allied with Fomoire to enter Tir na nÓg.
  - verse: 5
    story: They sail from Islands and disembark in Tir land of Firbolg, then burn
      ships to prevent retreat, with smoke and cloudlike imagery.
  - verse: 6
    story: Tuatha de Danaan Walk Ways and Paths across lives and times, then ultimately
      return to Northern Isles and Ascend.
  interpretive_readings:
    northern_islands: Spiritual metaplane or home of ancestral elves in narrative
      interpretation.
    four_cities: Narrator says spiritual states of mind rather than literal metaplane
      cities.
    arcana: The four mythic treasures are discussed as symbolic Arcana associated
      with four directional Paths.
    fomoire: Interpretations differ, including mental world or nature spirits/elements,
      and the text describes elven attitudes to human and non-human beings as discriminatory
      beliefs rather than objective realities.
    fleet_and_firbolg: Interpreters debate physical arrival versus metaphor of spiritual
      return; smoke and clouds are interpreted by some as secrecy and illusion.
    wheel: A three-age reincarnational Wheel (Heretofore, Herenow and Hereafter) points
      to completion of the five Paths; final central Rígh Path marks Wizard level
      and Ascension as Bright Shining Spirit.
  in_world_magical_prevalence_claim:
    narrator_or_scholarly_comparison: Book passage claims 7.8 percent of fictional
      Tir elves are magically active versus 1 percent for other races; contextual
      setting statistic, not an invented game dice modifier.
  fidelity: These descriptions are beliefs and the author’s in-world interpretations;
    they are not asserted as real world sacred history or actual practices.
  forward_status: Reviewed-forward-unindexed while FASA7212 Denver original is integrity-blocked.
    No source activation, contiguous authorization, or page credit.
