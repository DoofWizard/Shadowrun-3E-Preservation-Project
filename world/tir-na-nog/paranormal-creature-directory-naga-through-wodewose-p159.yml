  source_context: Published tabletop game fiction; source-narrator description, attributed
    beliefs, rumors and optional gamemaster scenarios kept distinct.
  fictional_critter_observations:
  - name: Naga
    account: Some followers of Druid and Rígh Paths imported nagas for guardianship
      during magical rituals. Elven hermetic magicians house and feed some, regarding
      them as sentient; elven households sometimes hide them due to human beliefs
      linking snakes with St Patrick.
  - name: Nature Spirit
    account: Common across the Tír except the most intense Ulster combat zones.
  - name: New Boar
    account: Allegedly introduced on a handful of private hunting estates; rumored
      successful wild breeding in County Meath. Narrator warns of ecological harm,
      predicts government action.
    certainty: Introduction and breeding alleged
  - name: Nomad
    account: Narrator describes predation on every metahuman species except magically
      active elves.
  - name: Phoenix
    account: Non-indigenous; government imported a few for a protection program.
  - name: Salamander
    account: Rumor alleges Order of Brigid uses salamanders in sacred ritual; rumor
      unconfirmed. Some elves believe creatures related to Great Spirits of Fiery
      Firmament.
    certainty: Order use rumor unconfirmed; elven interpretation a belief
  - name: Sasquatch
    account: Non-indigenous; small numbers enter; many elves disparage or question
      their sentience, Bards frame animal mimicry as degraded artistry.
    certainty: Attributed elven attitudes
  - name: Sea Drake
    account: Sea drakes, sea serpents and freshwater serpents reported as occurring
      around coasts, loughs and rivers, secluded and avoiding metahuman contact. Para-zoologists
      do not know why inactive periods seem longer than similar species.
  - name: Shadowhound
    account: Common livestock pest in Connaught, frequent rural hunts.
  - name: Shapeshifter
    account: Rare; takes forms of Irish druidic totems. The book proposes that some
      so-called human druids may be shapeshifters.
    certainty: Druid identity conjectural
  - name: Stonebinder
    account: Regional variant virtually identical to North American animal; evolved
      from European pipistrelle bat Pipistrellus pipistrellus. Lives in coastal cave
      systems, ruins and dense dark forests.
  - name: Stormcrow
    account: Highly territorial toward intruders near rookeries; farmers use anti-creature
      shotguns known colloquially as stormcrow guns.
    classification: Fictional equipment reference, not instructions
  - name: Talis Cat
    account: Very rare compared with more numerous blackberry cats (Paranormal Animals
      of Europe p18).
  - name: Toxic Spirits
    account: Elves seek to suppress toxic activity; fiction describes few polluted
      areas and therefore extremely rare toxic spirits.
  - name: Unicorn
    account: Wild unicorns in western Tír forests are guarded by elven and non-elven
      druids. Druids use horns for rituals ONLY after a unicorn dies of natural causes;
      hunters occasionally kill living unicorns under the mistaken belief they can
      sell horns to druids. Fictional druids retaliate against such hunters, preferring
      ritual sorcery.
    agency: Source distinguishes druid use of naturally dead creatures from hunter
      killing and retaliatory acts.
  - name: Unicorn Fish
    account: Occasionally sighted along Tír Atlantic seaboard.
  - name: Vampire
    account: A few vampires may exist; the lack of local vampire legends is treated
      as evidence of their scarcity. Among native carriers of HMHVV virus the bean
      sidhe has been far more prevalent.
    certainty: Possible but unconfirmed
  - name: Wodewose
    account: None reported anywhere in Tír despite prevalence of similar munchkin
      species.
    certainty: No reported sightings
