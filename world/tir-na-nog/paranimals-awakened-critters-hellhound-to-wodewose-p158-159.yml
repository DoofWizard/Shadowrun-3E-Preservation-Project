  source_context: FASA 1993 fictional Tír in-world animal and spirit catalog; listed
    occurrences are from book narration, unverified reports, disputed theories or
    elven beliefs as attributed.
  creatures:
  - name: Hell hound
    status: source_narration
    detail: Scattered small packs in isolated rural regions.
  - name: Incubus
    status: reported
    detail: Periodic city reports; Tír government places a £20,000 bounty on them.
  - name: Kraken
    status: occasional_reports
    detail: Sighted in deep Atlantic waters offshore, outside ordinary Tír vessel
      routes.
  - name: Leshy
    status: source_narration_and_elven_religious_belief
    detail: Common, protected by ruling elves who regard them as nature spirits; helps
      safeguard rural environments, with territories in several locations.
  - name: Lesser roc
    status: source_narration
    detail: Spring congregations along western coastline and western Munster; some
      remain all year, most winter in Europe or across Atlantic.
  - name: Leviathan
    status: source_narration
    detail: Most appear off western coast, sometimes northwest toward Icelandic waters.
  - name: Loup-garou
    status: apparently_eliminated
    detail: TRC and other military personnel have apparently eliminated this creature
      from the Tír; qualifier retained.
  - name: Man-of-the-woods
    status: speculative
    detail: Existence in the Tír is uncertain; elves see it as a simple and uninteresting
      free spirit if present.
  - name: Megalodon
    status: very_rare_reports
    detail: Deepest Atlantic waters; very rare sightings.
  - name: Mermaid
    status: reported
    detail: A few sightings off western coast.
  - name: Merrow
    status: unverifiable_reports
    detail: Virtually unknown except scattered reports that cannot be verified.
  - name: Munchkin
    status: source_narration
    detail: Common; Tír elves regard them half companion and half pet. They do not
      attack elves and often warn outsiders who enter secluded protected woodland
      reserves.
  - name: Naga
    status: source_narration
    detail: Imported by Druid and Rígh Path followers; powerful hermetic magicians
      keep them as ritual companions and guardians. Some elven magicians acknowledge
      naga sentience and care for them, but conceal them because many humans fear
      reptiles through St Patrick-linked folklore.
  - name: Nature spirit
    status: source_narration
    detail: Common except in the worst combat zones of Ulster.
  - name: New boar
    status: allegation_and_forecast
    detail: Allegedly imported to some private hunting estates. A small group is believed
      to have escaped in County Meath and may be breeding; ecological harm is possible,
      and future state intervention is expected rather than observed.
  - name: Nomad
    status: source_narration
    detail: Throughout Tír; seems to prey on most metahumans except magically active
      elves.
  - name: Phoenix
    status: source_narration
    detail: Not native; Tír government imported a few for a species-protection program.
  - name: Salamander
    status: unconfirmed_rumors_and_elven_theory
    detail: Unconfirmed rumors allege Order of Brigid ritual use. Some elves speculate
      these elusive creatures relate to Great Spirits of the Fiery Firmament.
  - name: Sasquatch
    status: source_narration_and_elven_prejudice
    detail: Not indigenous; very few enter. Many elves regard them as inferior and
      some deny sentience; Bards in particular complain that copying songs does not
      constitute artistic merit.
  - name: Sea drake
    status: source_narration_with_scientific_uncertainty
    detail: Sea drakes, sea serpents and freshwater serpents in coastal waters, lochs
      and rivers are reclusive and avoid metahumans; longer inactivity than comparable
      Scottish creatures remains unexplained.
  - name: Shadowhound
    status: source_narration
    detail: Livestock-snatching pest in Connaught, hunted by rural residents.
  - name: Shapeshifter
    status: rare_and_speculative
    detail: Rare and said to take forms only of Irish Druid totems; some so-called
      human Druids may be shapeshifters.
  - name: Stonebinder
    status: source_narration
    detail: Local version nearly identical to North American stonebinder, derived
      from the European pipistrelle bat; occupies coastal caves, ruins and dark thick
      forests.
  - name: Stormcrow
    status: source_narration
    detail: Extremely territorial around rookeries; farmers call antique shotguns
      used for defense stormcrow guns. No practical weapon procedure is provided.
  - name: Talis cat
    status: source_narration
    detail: Rare compared with more common blackberry cats; points to Paranormal Animals
      of Europe p18.
  - name: Toxic spirit
    status: source_narration
    detail: Nearly absent because of Tír anti-pollution vigilance and comparatively
      few contaminated locations.
  - name: Unicorn
    status: source_narration
    detail: Common in western forests, protected by elven and non-elven Druids. Some
      hunters wrongly believe their horns can be taken without waiting for natural
      death; Druids retaliate against killings with ritual sorcery. This describes
      fictional conduct rather than offering ritual instructions.
  - name: Unicorn fish
    status: occasional_sightings
    detail: Sighted sometimes along Atlantic shore.
  - name: Vampire
    status: qualified_uncertainty
    detail: A few may exist; few local vampire legends suggest very low numbers. HMHVV
      carriers have other disease varieties more commonly.
  - name: Wodewose
    status: not_reported
    detail: None reported to date, despite prevalence of related munchkin creatures.
