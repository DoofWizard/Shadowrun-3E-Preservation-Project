  - term: Fern
    meaning_in_source: Foreign.
    role: adjective
  - term: (In) Fiddler's green
    meaning_in_source: In serious trouble.
  - term: Fierce
    meaning_in_source: Unacceptable or extreme.
    role: adjective
  - term: Fog feed
    meaning_in_source: Lavish meal.
