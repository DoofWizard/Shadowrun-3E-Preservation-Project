  chapter: Street Slang
  section: Native Slang
  narrator_observations:
  - Sourcebook says regional usage differs across provinces; a term may be common in one province and used only
    as street slang in another.
  - The author contrasts the smaller number of derogatory expressions in this list against the Anglo-American-derived
    list.
  - Terms below are source-period invented-setting glossary usage, not independently verified real-world dialect
    claims.
  entries:
  - term: Assay
    meaning_in_source: An attention-getting greeting comparable to hello.
  - term: Auld Flutter Guts
    meaning_in_source: Fussy person or stickler for details / small print.
    role: noun
  - term: Away and shite!
    meaning_in_source: Exclamation that the other person is speaking nonsense.
  - term: Ballyhoooley
    meaning_in_source: A reprimand or telling-off.
    role: noun
  - term: Bap
    meaning_in_source: Head; also a soft white bread roll.
    role: noun
  - term: Bi
    meaning_in_source: Abbreviation of the emphatic oath bejasus.
  - term: Blow-in
    meaning_in_source: Foreigner or outsider.
    role: noun
  - term: Boggin'
    meaning_in_source: Polluted.
    role: adjective
  - term: Boke
    meaning_in_source: To vomit, often from excessive alcohol.
    role: verb
  - term: Caution
    meaning_in_source: Wild, unpredictable, devil-may-care person.
    role: noun
  - term: Chawing the rag
    meaning_in_source: Arguing.
    role: verb
  - term: Chick
    meaning_in_source: Child; sourcebook cautions American visitors about a different North American interpretation.
    role: noun
  - term: Clever
    meaning_in_source: Neat or appropriate.
    role: noun
  - term: Coggley
    meaning_in_source: Uncertain or unsteady.
    role: adjective
  - term: Crack
    meaning_in_source: Fun, lively chat, enjoyment.
    role: noun
  - term: Craw thumper
    meaning_in_source: Hypocritical religious zealot.
    role: noun
  - term: Deed
    meaning_in_source: Dead.
    role: adjective
  - term: Dingle
    meaning_in_source: Dent or mark.
    role: noun
  - term: DJ
    meaning_in_source: Originates in District Judge; the source extends it to judges or legislative officials and
      in some areas clerical public employees.
    role: noun
  - term: Doley little fella
    meaning_in_source: Affectionate term for a nice person.
    role: noun
  - term: Eegit / eejit
    meaning_in_source: Fool.
    role: noun
  - term: Fairly
    meaning_in_source: Excellent.
    role: adjective
  - term: Feed
    meaning_in_source: Meal.
