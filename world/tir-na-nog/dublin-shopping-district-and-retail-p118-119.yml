  narrator_reporting: These are a historical fictional sourcebook’s urban-shopping districts and directory, not modern
    recommendations.
  shopping_geography: Commercial corridors include Dawson and Grafton streets, O’Connell Street, Hearth Center by the
    former Mansion House, Powerscourt Town House Center, Nassau Street fashion and Irish craft stores, and the Liberties/Temple
    Bar market and bohemian district. The narrator contrasts traditional goods, specialist electronics and tourist wares
    and notes government export-profit levies on British chains.
