data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: historical original/Second Edition compatibility
    printed_page_context: 36-39
    physical_pdf_context: 45-48
  section: GOVERNMENT, LAW & POWER; information describes the fictional Tir na nÓg
    constitutional system and domestic politics.
  institutions:
    formal_head: State President elected by universal suffrage; 2035 and 2044 Constitutional
      Acts leave the presidency primarily ceremonial.
    parliament: Oireachtas, comprising the Dáil and Senate (Seanad Éireann-Tír); the
      source says Danaan Families exercise more practical influence than the democratic
      form reveals.
    dail:
      total_seats: 222
      majority_vote_seats: 111
      proportional_representation_seats: 111
      counties: 31
      majority_constituencies: One parliamentary constituency per majority-elected
        member; proportional representatives serve county electorates.
    senate:
      total_seats: 55
      appointed_by_taoiseach: 11
      elected_by_special_interest_groups: 44
      appointed_fraction_percent: 20
      electorates: Education, arts/culture, business, and metahuman groups; voting
        among populations varies by group.
    taoiseach: Elected by Dáil/Senate joint conclave; appoints 11 of the 55 senators
      and has extensive influence in the dominant Senate.
  legislative_process:
    senate_initiates_most_legislation: true
    dail_first_chamber_initiative: Dáil ordinarily sends proposals via joint Senate-Dáil
      House Committees.
    dail_can_amend_or_return_to_senate: Once per bill within 30 days.
    dail_can_delay_senate_bill_maximum_days: 90
    shift: 2035 and 2044 Constitutional Acts shift real legislative power from Dáil
      to Senate.
  incumbents_printed_p38:
    state_president: William O’Dunn
    taoiseach: Martin O’Connor
    minister_of_interior: John O’Molloy
    treasury_minister: Richard Brinsley O’Toole
    foreign_secretary: Samuel O’Kennedy
    environmental_regulation_minister: Richard Burke (human)
    minister_of_arts_and_culture: Gerry O’Brien
    minister_of_state_for_trade_and_industry: Kieran MacMurrough
    minister_of_state_for_health_and_social_welfare: Elizabeth Duffy (human)
  local_government:
    provinces: 5
    counties: 31
    assemblies: Each province has an assembly elected by universal adult suffrage,
      with size depending on population and constituent counties.
    funding: Approximately 75 percent of local government expenditure comes from centrally
      controlled Dublin Treasury funds; local tax raising is limited.
    responsibilities:
    - Street cleaning
    - Road repair
    - Garbage collection/disposal
    - Organizing provincial féilla celebrations
  political_parties:
  - name: Fianna Fáil
    approx_national_vote_percent: 40
    position: Traditional Republican party; 1932–2035 dominant; Niall’s source account
      describes covert Danaan support and large elven share of party representation.
  - name: Fine Gael
    approx_popular_support_percent: 31
    position: Middle-of-the-road party with few elven supporters and relatively little
      institutional power.
  - name: Ulster United Protestant Party (UUPP)
    approx_population_support_percent: 19
    position: Almost exclusively human Ulster Protestant constituency; source alleges
      disruption by staged walkouts; narrator distinguishes UUPP from URF and NURM
      paramilitaries.
  - name: Labour/SDLP Alliance
    electoral_support: Not yet double-digit in elections; the narrator says it is
      growing as a protest vehicle among non-elven metatypes.
    position: Combined Labour and Ulster SDLP, social-democratic platform; its policy
      overlaps with Danaan family welfare priorities.
  senate_party_affiliation: Senators are legally barred from claiming party affiliations
    under the described post-scandal constitutional rules.
  forward_status: Verified forward extraction during unresolved FASA7212 Denver source-integrity
    block; does not activate FASA7211, authorize contiguous pages, or modify the completed
    FASA7213 manifest/checkpoint.
