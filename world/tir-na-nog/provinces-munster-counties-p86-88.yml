  province:
    name: "Munster"
    gaelic: "Cuige Mumhan"
    region: "Southwestern Tir; the Shannon River, Slieve Bloom range and Offaly bogs separate it from surrounding regions; described as largest of five provinces but with lowest population."
    culture: "The book associates the province with poetry, crafts and storytelling; Courts of Poetry, frequently patronized by the magical Order of Brigid."
  counties:
    -
      name: "Clare"
      claims: "Nickname Singing County; high representation of Order of Brigid bards, ruined Firbolg strongholds, Burren limestone region regarded as magically powerful. Ennis county town, Shannon International Airport in southern corner."
    -
      name: "Cork"
      claims: "The Tir's largest county; Cork city's artistic festivals, music school, island canals and rivalry with Dublin in the arts; Blarney Castle is a visitor attraction."
      attributed_speaker: "Moleman separately alleges Cork contains Social Benefit Registry surveillance and scams."
    -
      name: "Kerry"
      claims: "Rural mountainous coastal county with Killarney lakes, Dingle inlets and west-coast islands; Ring of Kerry follows Iveragh Peninsula for 170 kilometers; Tralee, annual Rose of Tralee celebration."
    -
      name: "Limerick"
      claims: "Shannon forms northern boundary; Limerick city contains Shannon International Airport and Éireann-Tír publishing house, arts and poetry schools."
    -
      name: "Tipperary"
      claims: "Large rich agricultural inland county, Ormonde/Butler family history, fertile Golden Vale, Tipperary town and sacred Rock of Cashel."
    -
      name: "Waterford"
      claims: "South coast between Waterford Harbour and County Cork; bustling commercial Waterford city contrasted with inland communities."
  forward_status: "Verified source-reviewed forward record; not indexed as authoritative contiguous source coverage."
