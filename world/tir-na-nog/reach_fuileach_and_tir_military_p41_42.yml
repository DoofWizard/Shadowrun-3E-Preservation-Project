  unit_reach_fuileach:
    in_world_gloss: Bloody body
    parent: Elite Tir Republican Corps sub-unit
    number_of_members: 36
    membership: Elves, all Path of the Warrior followers and physical adepts, according
      to narrator.
    assignment: Each Steward recruits a personal bodyguard from this fiercely loyal
      unit; narrator reports about half a dozen at any given time assigned to Ulster,
      often operating as assassins.
  standing_military:
    size_personnel: 7000
    status: Small volunteer army of the fictional Tir, defending state institutions
      in Ulster and supporting TRC unrest control; recruits screened for police-style
      suitability.
    navy: Small, capable coastal patrol force also involved in immigration/smuggling
      enforcement.
    air_force: Small force of French Mirage-37000 jets; the book claims an air-force
      response to an intruder normally begins with a challenge, rather than a preemptive
      attack.
    magical_support: In-world speaker JAFO claims magic is fully integrated in tactical,
      strategic and operational planning, not separately verified by the narrator.
  provenance_caution: Source narrator statements are separate from Cleasaiche, Torc
    Talk and JAFO allegations; no detailed technical targeting instructions are extracted.
