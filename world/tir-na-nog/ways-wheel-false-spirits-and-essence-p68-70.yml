  wheel_of_spirits:
    narrator_belief: 'The book describes reincarnation as central to the fictional
      elven religion. Low-mana eras limit the possibility of incarnating as magical
      elves: less-developed spirits may Seek a Path in nonmagical bodies but, in the
      Danaan scheme, do not rise to the highest positions without later magical development.'
    historical_figures: The narrator reports a Danaan belief that revered figures
      from Celtic-Irish traditions and brilliant Irish scholars may have been reincarnated
      spirits; liberal scholars and dissenters disagree about eligibility and evidence.
    dual_beings: Within the setting, the narrator distinguishes reincarnating spirits
      from dual beings such as dragons, said to have both a persistent spiritual identity
      and a bodily form shaped by mythic imagery and human emotional associations.
    human_roles: In the Danaan worldview humans are called Firbolgs, spiritually inferior
      in this ideology but necessary stewards of the land during low-mana ages; some
      Danaan families have human relatives and some humans are described as Seekers
      of the Warrior Path. This is discriminatory fictional ideology, not the archival
      editor’s evaluation.
  false_spirits:
    three_categories:
    - toxic spirits or creatures, including toxic shamans in the fictional setting
    - banshees, whose nature and culpability are disputed in-world
    - non-tuatha spirits, a polemical label often applied to elves of Tír Tairngire
    toxic: In-world Danaan doctrine treats toxic beings as threats across physical,
      mental and spiritual planes and claims that a true spirit should oppose their
      influence; it is religious characterization, not a real-world operational instruction.
    banshees: The Tír government is said to offer a bounty. Some in-world elves seek
      to destroy banshees, whereas others describe them as spirits cursed by past
      wrongdoing and advocate rescuing them from an alleged karmic cycle. Shadowland
      posters dispute both explanations.
    non_tuatha: The narrator reports that many Danaan elves view some Tír Tairngire
      elves as misleading imitators of the true Tuatha; they are not automatically
      portrayed as evil. Some speakers offer alternative theories and allow that particular
      Tír Tairngire elves may be true spirits.
  magic_and_essence:
    activity_comparison: The narrator cites a fictional consensus estimate that 7–8
      percent more Tuatha elves are magically active than members of other metatypes;
      preserve that wording separately from the earlier page-66 7.8 percent total
      estimate.
    approach: Magically active Tuatha follow hermetic disciplines as magicians or
      adepts, generally reject shamanism as a true route, and interpret totems as
      psychological archetypes rather than external totem spirits.
    improvisation: The narrator contrasts average hermetic intellectual discipline
      with the Path Follower’s improvisational magical practice, which the source
      interprets as alignment of action and the nature of the Path; no game-system
      target number is stated on these pages.
    essence_and_technology: Within the Danaan tradition, Essence is treated as a spiritual
      condition that cyberware is believed to diminish, with supposed karmic consequences
      across reincarnations; many elven Followers shun extensive implanted technology.
      This preserves in-world belief, not a mechanical modification to existing Essence
      rules.
    bioware_claim: A named Shadowland commentator, Doc Dresden, discusses a proposed
      Essence-Integrity theory claiming auric-template misalignment from cybernetic
      or biological augmentation; treat this as an attributed speculative theory,
      not as an independently established rule.
  forward_status: Verified forward source-review record, not indexed or credited as
    contiguous source authorization.
