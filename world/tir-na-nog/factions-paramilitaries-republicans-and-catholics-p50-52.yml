  protestant_paramilitaries:
    organizations:
    - URF
    - NURM
    description: Narrator calls two Protestant paramilitary factions limited in numbers
      and political base but still influential because of weapons; describes them
      as racist and hostile to all metatypes.
  republican_organizations:
    names:
    - Official IRA
    - INLA (Irish National Liberation Army)
    source_characterization: Narrator describes two surviving Republican factions
      taking violent action against the fictional Tir state, while expressing distinct
      goals and behaviors.
    official_ira: Narrator estimates more than 300 active members in Wexford, Cork,
      Killarney and Limerick; includes humans and a few orks/trolls. It favors broad
      socialist policies but lacks a clear route forward; Douglas de Valera is described
      as charismatic new leader.
    violence_context: Narrator reports a recent assassination campaign against Danaan-family
      leaders and bombing of Thomas O’Neill outside Ministry offices in Armagh, potentially
      outside ordinary Official IRA operations. These are historical fictional allegations,
      not procedures.
    inla: Narrator accuses its current incarnation of criminal racketeering, trafficking
      in contraband, kidnapping and extortion. Narrator explicitly distinguishes it
      from its former freedom-fighter self-image and alleges it deliberately harms
      bystanders.
  catholic_church:
    narrated_position: Catholic Church lost institutional dominance after metahuman
      controversies and elven political ascent, but rural faith and the Church of
      Ireland’s competition preserve some influence.
    saint_sylvester: Rural worshippers show respect to followers of St. Sylvester
      because they preach tolerance and reconciliation.
    other_orders: Some scholarly or monastic Catholic orders remain revered; some
      more militant anti-elf Catholic sects are described as small fringe groups.
    historical_source_only: true
  page_52_hermetic_transition: Religious commentary carries over on printed p52 and
    the Druidism section begins there.
