  — fictional alternate-Ireland historical chronology and named actors'
summary: Archival world_fact reference from the FICTIONAL Shadowrun sourcebook Tir
  na nÓg, published by FASA Corporation in 1993, FASA7211/source.fasa-7211, printed
  pp27–32 (physical PDF28–33). Reported sourcebook setting facts are distinguished
  from named in-world commentary; mechanical quantities remain source-period exact.
data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog: FASA7211
    source_id: source.fasa-7211
    edition: original and Second Edition Shadowrun-era sourcebook
    printed_pages: 27-32
    pdf_pages: 28-33
  chapter: HISTORY — alternate-history timeline in the fictional 1993 sourcebook.
  narrative_authority: This chapter opens explicitly in the voice of the fictional
    dissident Niall O’Connor. The following are events as his text depicts them, not
    independently corroborated present-day history; actual twentieth-century references
    are woven into an invented future.
  pre_2010_p27_28:
    irish_partition: Describes 1922 Irish independence/partition and subsequent political
      sectarian conflict among Ulster, the Republic, and Britain. Cites Fianna Fáil/Fine
      Gael as mid-twentieth-century major parties.
    combatants_and_agency: Differentiates British military and security operations,
      paramilitary violence, Republican factions, and civilian impacts. Does not merge
      all groups into an undifferentiated community or normalize coercion.
    political_frame: The chapter writer Niall distinguishes government versions, sectarian
      agendas and his elven-identification perspective.
  awakening_and_env_changes_p28_29:
    vitas_2010_2011: The source asserts 22.4% of Ireland’s population died during
      a fictional VITAS epidemic from 2010 to 2011.
    nuclear_disaster: The narrator describes radiological contamination along the
      eastern coastal areas after fictional 2011 disasters elsewhere; regional landscape
      alteration follows.
    foci_of_environmental_change:
    - Antrim
    - Down
    - Cork
    - Kerry
    - Limerick
    - Connaught
    - Meath
    forest_change_pct_2011: 5.1
    forest_change_pct_2020: 12.75
    registered_elven_births_pct_2010_2020: 41
    registered_dwarf_births_pct_2010_2020: 4.1
    dragon_report: In this narrative, no dragons were officially reported in Tir during
      this period; the text does not claim universal proof of absence.
  republic_and_union_p29_30:
    irish_republican_conflict_2011: Alternate-history armed confrontation is depicted
      amid renewed tension in Ulster and upheavals elsewhere in the British Isles.
      The narrator discusses changes to IRA groups and military policing; these are
      fictional events, not real operational advice.
    belfast_armed_incident: The narrative describes an April 14 2011 Belfast incident
      in which thirteen British security personnel and eleven Protestant paramilitaries
      died; source depiction, not independently established fact.
    alder_shot_2013: The source recounts a fictional elemental manifestation near
      Aldershot in 2013; no game-test procedure accompanies this narrative.
    fictional_referendum_2014: A referendum in 2014 is reported as approving negotiations
      for reunification by 78%.
    act_of_dissolution: The chapter places the Act of Dissolution on June 16, 2014
      and associates it with a Galway agreement creating the United Free Republic
      of Ireland. Preserve act, date and institutional framing as alternate-world
      claims.
  liam_oconnor_ir_a_schism_p30_31:
    person: Liam O’Connor, fictional Republican leader distinct from Niall O’Connor
      the narrating author.
    split: The narrative portrays Liam as rising within Republican movement factions
      after the Awakening; factional division involving Official and Provisional IRA
      and elven issues.
    state_reorganization: The Provisional IRA is reported eventually brought into
      official republican security institutions, including the Tir Republican Corps,
      amid political and social change. State coercive powers and partisan labels
      retained.
    political_reforms: Government programs address ecology, metahuman rights, expanded
      magical studies and surveillance/security changes; these are separate categories
      not synonyms.
  scandals_p31_32:
    period: 2015–2034 fictional political/financial/religious scandals, framed by
      Niall’s critical account.
    molyneaux_2018: The text calls the alleged 2018 medical-equipment procurement/finance
      case the Molyneaux Scam; names the government minister and fourteen other department
      officials.
    kavanaghgate_2022: The chapter names 2022 Kavanaghgate, involving agricultural-sector
      corruption with seventeen convicted.
    claims_elven_prosecutions: Reported adult elves figure at 0.6% among convictions
      despite elven adult population around 12.5%; do not infer a causal explanation
      beyond Niall’s observations.
    partisan_office_distribution:
    - Fianna Fáil 41.5%
    - Fine Gael 36.8%
    - Ulster Party and others 21.7%
    foreign_business_fraction: Source attributes around 62.5% of persons implicated
      in business scandals to multinational institutions; preserve percent but do
      not generalize to real firms.
    niall_conspiracy_allegation: Niall suggests Seamus O’Kennedy and Liam O’Connor
      used institutional/scandal responses to concentrate power; this is his attribution,
      not settled motive.
    religion_and_2034: Church and political influence is presented through fictional
      papal succession, disputes over nonhuman metatypes and theological reactions;
      source reports allegations of abuse and a fictional priest/bishop suicide. These
      are historical fictional claims, not allegations against actual persons or religious
      institutions. Avoid blending real-world 1993 authority with invented dates.
  reference_boundary: Printed p33 introduces another full-color image not included
    in this 27–32 content slice.
  forward_status: Reviewed before FASA7212 Denver because its cataloged PDF cannot
    render; NOT an activated FASA7211 source, NOT contiguous page authorization, and
    does not advance Aztlan manifest/checkpoint.
