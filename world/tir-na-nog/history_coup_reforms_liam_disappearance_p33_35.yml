  and Niall’s closing assessment'
summary: Archival world_fact extraction from the fictional FASA sourcebook Tir na
  nÓg (FASA7211, 1993), printed 33-35/PDF 42-44; fictional book-narrator claims and
  named in-world commentary are separated. These forward records do not advance the
  active Aztlan/Denver boundary.
data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog: FASA7211
    source_id: source.fasa-7211
    edition: historical original/Second Edition compatibility
    printed_pages: 33-35
    physical_pdf_pages: 42-44
  source_voice: Fictional dissident author Niall O’Connor presents the closing History
    chapter as his own interpretation. Political motives and covert actions attributed
    to him remain allegations, not independent narrator omniscience.
  narrative_chronology:
  - printed_page: 33
    date: June 2034
    account: State President Charles McGoldrick was impeached amid reported corruption,
      covert surveillance of opponents, and politically damaging recordings. Niall
      attributes a key organizing role to Liam O’Connor and says Seamus O’Kennedy
      served as the charismatic public advocate.
  - printed_page: 33
    date: 11 December 2034
    account: State President Eamonn McCarthy imposed a state of emergency during constitutional
      unrest. Niall says Liam used the emergency to secure sweeping institutional
      changes.
  - printed_page: 34
    date: Christmas 2034
    account: Seamus O’Kennedy delivered a radio/tri-d address endorsing the new Tír
      na nÓg state. The book recounts public appeals to Irish history, environmental
      restoration, cultural destiny, elven service, social programs, and national
      unity; these are framed as the fictional speech and Niall’s account of its influence.
  - printed_page: 34
    date: March 2035
    account: Following McCarthy’s resignation on health grounds, Liam O’Connor became
      State President; Seamus O’Kennedy became Minister of the Interior and Thomas
      O’Brien became Minister of State for Industry and Commerce.
  - printed_page: 34
    date: March 2042
    account: Liam organized his election as High Steward; his spouse Brane Deigh was
      already positioned as a Prionsa in the Court of Stewards.
  - printed_page: 34
    date: May 2043
    account: Liam O’Connor disappeared from public life at age 64. No definitive public
      explanation is given. Brane Deigh subsequently called herself Rian (queen) of
      the Seelie Court; James O’Brien was appointed State President and William O’Dunn
      High Steward.
  constitutional_changes: The chapter describes expanded Senate power and restricted
    Dáil/local-government power, central information/currency controls, education,
    health, environmental policies and social services; the account simultaneously
    questions genuine public participation.
  seelie_court_distinction: The Court of Stewards is a temporal institution; the Seelie
    Court is presented as a distinct mystical nonlegislative institution headed by
    Brane Deigh.
  reported_2040s_figures:
    economic_growth_annual_average_percent: 3.7
    unemployment: described by Niall as very low
    social_spending: described as higher than other European states
    urban_population: described as comparatively low
  final_warning: Niall praises improvements in living standards and ecology but warns
    that elven exceptionalism and anti-non-elven attitudes may turn the fictional
    state into an oppressive, exclusionary polity.
  ingestion_status: Source-image reviewed forward record; not source-activated or
    indexed while the earlier Denver source remains integrity-blocked.
framing: newsroom_neutral
