  cuirt_danaan:
    function: Arbitrates disputes among and between Danaan Families, except rare formal
      family-conclave votes.
    brehon: Martin MacNamara, appointed by Council for his natural lifetime; must
      come from outside the Danaan-mór.
    hearing: Brehon hears all sides and issues a judgment; MacNamara judgments are
      guidelines for resolving disputes.
    appeal_rule: A dissatisfied party may seek another hearing one year and one day
      after the original judgment; disputes lasting less than one year and one day
      are not appealable except by formal vote.
    formal_vote: A disputant may demand a family-conclave formal vote but risks loss
      of face and influence; the narrator says most families instead interpret Brehon
      judgments to their own ends.
    limits: Judgment seldom contains explicit prohibitions or commands, but the family-held
      belief is that its existence may not be contravened; narrator says no one has
      tried.
  seelie_court:
    ruler: Queen Lady Brane Deigh
    status: The narrated mystical heart of Tuatha de Danaan power; Council of Stewards
      is temporal counterpart.
    location: No definable physical map location; the source calls it a fractured
      metaplane or hidden otherworld and likens it to a limbo.
    entrance: The narrator says a seeker cannot find it unaided, though an initiated
      guide may bring others; prisoners seldom escape.
    court_members: Leshy, gruagach, munchkins, other faerie folk and elven advisers;
      many elves renounced ordinary temporal life to follow Paths or meditate at the
      Court.
    agency: Lady Brane does not issue ordinary political or temporal commands; narrator
      claims she subtly influences followers’ spirits and thereby the Stewards’ decisions.
    arcana: The Arcana are said to be archetypal treasures of mystical cities and
      ritual artifacts associated with the Court’s authority. Followers contemplating
      Ascension test fitness against these Arcana; detailed procedure is deferred
      to the Ways and Paths section.
  belief_status: The setting’s in-universe narrator presents the faerie/metaplane
    descriptions as fictional cosmology, not objective real-world claims.
  forward_status: Source-reviewed ahead-of-boundary and unindexed; FASA7212 Denver
