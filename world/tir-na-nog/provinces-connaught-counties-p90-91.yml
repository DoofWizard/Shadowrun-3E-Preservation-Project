  province:
    name: "Connaught"
    gaelic: "Cuige Chonnacht"
    narrator: "West of the Tir, noted for Gaelic traditions, elf and non-elf druids, Atlantic coast, mountainous lakes, isolation and the Gaeltachta Gaelic-language region; in-world source says elves are vigilant about non-elven druids."
  counties:
    -
      name: "Galway"
      narrator: "Second largest county; Lough Corrib bisects it, Lough Mask north, offshore islands and west coast; Galway city noted for cultural and seafood scenes."
      speaker_claim: "Mulligan warns of aggressive fish in the loughs and anthropophagic behavior."
    -
      name: "Leitrim"
      narrator: "Northern shore, history of IRA and Protestant URF resistance; northern half from border by Sligo to Fermanagh is an SRZ under Garda and TRC, and source reports anti-metahuman militant presence; Carrick-on-Shannon is county town."
      attribution: "The narrator's conflict framing is part of the fictional setting, not a real-world current report."
    -
      name: "Mayo"
      narrator: "Mountains, lakes, bogland and limestone plain; legend places mythic Moytura battle here in the 303rd year of the world. In-world recent sabotage attributed to the Official IRA destroyed the Marushima Corporation chemical-textile plant at Killala; site now restricted by government."
      attribution: "The attribution belongs to the fictional source narrative."
    -
      name: "Roscommon"
      narrator: "River Shannon eastern border, River Suck western, fertile cattle and sheep land; O'Connor ruling family and disputed ancestral sites at Clongalis; O'Connor and MacDermot rivalries are presented as fictional dynastic history."
    -
      name: "Sligo"
      narrator: "County associated with William Butler Yeats, epic Táin Bó Cuailnge, Queen Medb traditions and music; Sligo is major town on northwest shore."
  forward_status: "Verified source-reviewed forward record; not indexed as authoritative contiguous source coverage."
