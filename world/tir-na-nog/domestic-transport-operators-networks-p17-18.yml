summary: Independent original-page source review of the historical fictional Shadowrun
  publication Tír na nÓg, FASA Corporation 1993, catalog FASA7211/source.fasa-7211;
  printed pp17-18/physical PDF pp18-19. fictional air, road, rail and water transportation
  institutions and restrictions. Facts apply to the invented setting, not contemporary
  Ireland; no conversion to Third Edition is implied.
data:
  publication:
    title: Tír na nÓg
    publisher: FASA Corporation
    publication_year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: Historical Shadowrun original/Second Edition-compatible setting source;
      no inferred Third Edition conversion
    fresh_cataloged_source_pdf_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: 17-18
    pdf_pages: 18-19
  section: FACTS AT YOUR FINGERTIPS — GETTING AROUND
  book_narrator:
    air:
      characterization: Domestic air service is depicted as costly and uncommon for
        ordinary Tír residents; senior government, Danaan-family and business travelers
        commonly use private or charter aircraft.
      domestic_airports:
      - Dublin
      - Shannon
      - Derry
      - Limerick
      - Killarney
      - Cork
      - Galway
      carrier: Aer Lingus operates the principal domestic flights; the book reports
        on average two flights per day between these airports.
    road:
      network: The national motorway system is described as connecting relatively
        few major cities, with roads otherwise well maintained.
      operators: Intercity coach operators and urban bus/tram operators are government
        licensed and subject to environmental regulation.
      examples_of_named_bus_operators:
      - Bus Tír-Éireann
      - Bus Átha Cliath-Dublin
      - Bus Belfast
      vehicle_access: Government measures discourage private automobiles, including
        license and purchase taxes and fuel subsidies for rail/trams. Most central
        city areas exclude ordinary private cars; permitted exceptions include taxis
        and medical vehicles, with park-and-ride from satellite lots. Drivers use
        the left side of the road.
    rail:
      national_operator: Iarnród Éireann-Tír Rail, as named in the printed source,
        runs almost all rail routes; only scenic/rural routes of 20 kilometers or
        less are occasionally outside this national operator.
      exceptions: Small rail lines may be operated by local enthusiasts or government-supported
        for social purposes.
      long_distance_train_routes:
      - Cork
      - Dublin
      - Wexford
      - Galway
      - Killarney
      - Armagh
      - Enniskillen
      local_network: Dublin DART (Dublin Area Rapid Transit) is mentioned as a scenic
        local commuter rail network.
    water:
      geography: Shannon River and lakes support a freight barge network, including
        livestock and bulk raw materials, and commercial passenger package tours.
      boat_hire_requirement: For short rented or hired riverboat trips, the narrator
        says travelers need an appropriate permit and an itinerary filed with the
        Office of Placements.
  attribution_boundary: Named Shadowland participants dispute railway ownership and
    allege improper transport influence, policing and surveillance on printed p18.
    These are separately represented as attributed claims in reference.tir_na_nog.visitor_claims_entry_transport_money_p13_18,
    not adopted as narrator facts.
  historical_fiction_only: true
framing: newsroom_neutral
