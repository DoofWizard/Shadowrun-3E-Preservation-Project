data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: historical original/Second Edition compatibility
    printed_page_context: 39-40
    physical_pdf_context: 48-49
  law_and_order:
    legislation: Constitution Acts of 2035 and 2044, not a UCAS-style Bill of Rights
      or a Freedom of Information Act.
    rights_as_positive_entitlements:
    - Gainful employment suited to ability/talent (Article 1.4)
    - Shelter
    - Sustenance
    - Education
    - Health care based on need, not ability to pay
    - Participation in cultural life
    responsibilities: Article 9.4 requires a citizen to demonstrate availability for
      gainful work and accept offered suitable work; the narrative explicitly conditions
      enjoyment of employment rights on reciprocal obligations.
  registries:
  - name: Central Crime Registry
    authority: Garda
    location: Arbour Hill, Dublin 7
    scope: Central Garda crime database; the separate Tir Republican Corps system
      is in Derry and its specific datanet location is secret.
  - name: Social Benefit Registry
    location: Cork
    scope: Education, employment, benefits, and health records concerning citizens.
  - name: Interior Affairs Registry
    location: Dublin
    scope: Includes registered hermetic DNA codes, surveillance/counter-surveillance
      records, information on British government and important individuals, and minor
      corporate practices; much counter-surveillance material is held by the TRC,
      which may access the registry.
  - name: Environmental Regulation Registry
    location: Not specified on the reviewed page
    scope: Environmental data for Tir and abroad; supports an Eco-Net database, tracking
      regulated corporate conduct and environmental compliance, with forecasts and
      advanced security.
  law_enforcement:
    garda: Civil police with national jurisdiction; most officers outside conflict-prone
      areas generally do not carry firearms, though stations maintain armories.
    tir_republican_corps: Elite police/security agency within the Garda framework,
      with national reach and substantially broader powers of search, seizure, and
      arrest; depicted as having greater access to heavily armed equipment.
  certainty_note: Security details are fictional institutional description; operational
    or speculative assertions by Shadowland speakers belong in a separate attributed-claim
    record.
  forward_status: Verified forward extraction during unresolved FASA7212 Denver source-integrity
    block; does not activate FASA7211, authorize contiguous pages, or modify the completed
    FASA7213 manifest/checkpoint.
