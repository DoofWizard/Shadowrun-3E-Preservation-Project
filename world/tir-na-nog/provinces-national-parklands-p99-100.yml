  oversight:
    authority: "Tir national parks may be administered by elven or non-elven druids or by corporations."
    narrator: "Industrial exploitation of forest sites prohibited; other commercial uses tightly regulated."
    sacred_permits: "Foreigners and most Tir citizens require appropriate permits for sacred elven burial sites; unauthorized entries may face prosecution for trespassing. No numeric law penalty is specified on these printed pages."
  parks:
    -
      name: "Connemara National Park"
      location: "County Mayo"
      details: "Tourist landscape with Connemara ponies and Letterfrack village accommodation; Quaker artisan community."
    -
      name: "Glenariff Forest Park"
      location: "County Antrim"
      details: "Government declared park out of bounds; TRC claims pursuit of Protestant paramilitary training, while unnamed rumors claim contagious illness among forest animals. Perimeter patrol is heavy."
      attribution: "Government stated rationale and contrary rumors are not confirmed as one fact."
    -
      name: "Glenveagh National Park"
      location: "County Donegal"
      details: "Includes Ards Forest Park; local Gaelic-speaking administration, Derryveagh Mountains, paranimal attacks, nontrivial magical Awakening frequency; source reports elf hunters and military wildlife control."
    -
      name: "John F. Kennedy Memorial Park"
      location: "Wexford/Waterford vicinity"
      details: "Extensive 800-acre memorial near Dunganstown and Slieve Coillte, tourist arboretum; the fictional source comments on Irish-descended UCAS/CAS politicians' visits."
    -
      name: "Lough Key Forest Park"
      location: "County Sligo"
      details: "SES corporation research base under druid management, tight security and valuable biological resources; rhododendrons, azaleas and bog plants."
    -
      name: "Tollymore/Castlewellan Forest Parks"
      location: "County Down"
      details: "Mourne Mountains forest parks with reports of free spirits."
  source_context: "Historical real geographical names appear as adapted settings in an explicitly fictional future; avoid treating altered ownership, supernatural or security assertions as verified present-day facts."
