data:
  publication:
    title: "Tir na nÓg"
    publisher: "FASA Corporation"
    year: 1993
    catalog_number: "FASA7211"
    source_id: "source.fasa-7211"
    edition: "Historical Shadowrun original/Second Edition-compatible, not an inferred Third Edition conversion"
    file_sha256: "8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4"
    printed_pages: "100-101"
    physical_pdf_pages: "109-110"
  overview: "The fictional source describes three major Tír post-Awakening phenomena: cairn lines, magical storms called daoineann draoidheil, and ancient slighe roads. No dice tests, target numbers, damage codes or game procedure are presented in these two pages."
  cairn_lines:
    definition: "Metaphysical pathways of force linking ancient cairn burial sites; claimed to differ from straight British ley lines by irregular branches, sometimes only a few kilometers long."
    four_cairn_classes:
      -
        type: "Court cairns"
        shape: "Oval, coffin-shaped or trapezoidal grave mound with forecourt"
        quantity_at_least: 400
        magical_fraction: "Approximately one fifth claimed to have definite magical power"
      -
        type: "Portal tombs"
        shape: "Upright stones covered by one or two capstones, sometimes earth-covered"
        quantity_approximate: 200
      -
        type: "Wedge tombs"
        shape: "Rectangular graves with large stone roofs under wedge-shaped earthen mounds"
        quantity_at_least: 440
      -
        type: "Passage tombs"
        shape: "Round mounds with central burial chamber"
        quantity_at_least: 360
    spiritual_interpretation: "In-world elven belief describes ancient cairns as repositories of ancestors, magic and myth; not an established archaeological or supernatural claim."
    major_path: "Power line from Knocknarea (Sligo) through Keshcoran and Camfree to Loughcrew and Newgrange (Meath); proceeds south to Motte Stone and Browne's Hill Dolmen, with additional scattered branches."
    newgrange: "Newgrange complex also includes Knowth and Dowth; fictional narrator attributes post-Awakening transformations to quartz façade, passage stones and carvings; source reports unproven belief that hundreds of ancient elves may be buried here, and site is closed and guarded."
    solstice: "Central Newgrange passage allows winter-solstice sunlight to reach inner chamber around 9 a.m. for a few days before and after solstice, according to narration."
  magical_storms:
    gaelic_name: "daoineann draoidheil"
    description: "Localized standing chaotic mana flux; magical effectiveness and safety vary by location/time."
    documented_regions: "One 10-kilometer coastal reach east and west of Giant's Causeway, another northern Dingle Bay, another southern Donegal Bay."
    movement_and_size: "Sometimes only a few hundred meters wide, stormfronts shift position, recede or extend outward."
    risk: "Narrator cautions only powerful mages can use magic near storms without severe harm; Shadowtalk warns of backlash/drain but no exact numerical mechanics are stated."
  slighe_roads:
    origin_story: "Ancient road network rediscovered after landscape regrowth; elven belief claims Roman road builders unconsciously followed magical pathways."
    transport_claim: "The fictional source reports that vehicles travel significantly faster along slighe roads than ordinary motorways, but supplies no numeric speed multiplier in pp100-101."
    map_note: "Source directs reader to appended slighe-road map; this map is not reproduced or treated as reviewed in this record."
  forward_status: "Verified source-reviewed forward record; not indexed as authoritative contiguous source coverage."
