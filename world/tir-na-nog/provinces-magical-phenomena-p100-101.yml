headline: "FICTIONAL Shadowrun tabletop RPG — FASA Corporation Tir na nÓg (FASA7211, 1993 historical original/Second Edition), source.fasa-7211, printed pp100-101/PDF pp109-110: Cairn lines, daoineann draoidheil and slighe roads"
