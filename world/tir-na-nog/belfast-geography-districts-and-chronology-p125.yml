  source_context: Fictional Shadowrun-setting material from a published tabletop RPG.
    Distinguish book-narrator descriptions, in-world speakers’ allegations and speculation;
    no claims about real contemporary Belfast.
  geography: Fictional 2054 Belfast is located where the River Lagan meets Belfast
    Lough, with land west rising toward the Antrim Plateau. Westlink/A12 joins M2
    north and M1 south; the Lagan separates central Belfast from eastern docklands
    and housing districts.
  history: Belfast rose in 18th-century industry and became a city under Queen Victoria
    in 1888. The fictional account describes 20th- and 21st-century industrial decline
    and disinvestment. It reports the Garda destroyed much of the former Belfast Castle
    after repeated terrorist explosions, in 2039.
  landmarks:
    city_centre: Donegall Square, Cornmarket shopping area, the Entries, Great Victoria
      Street known as Golden Mile, and a guarded Garda headquarters nicknamed the
      Castle.
    west: Falls Road, long-standing Catholic neighborhood described as enclosed by
      defensive barriers following conflict; nearby Milltown Cemetery.
    north: Shankill, described as a predominantly Protestant enclave.
    east: Old docklands along River Lagan and fortified Stormont Castle.
    south: University complex near Great Victoria Street, Malone and Balmoral residential
      neighborhoods.
  sourcebook_perspective: The printed descriptions present sectarian divisions and
    fictional political repression as sourcebook geography and history, not modern-world
    Belfast guidance.
