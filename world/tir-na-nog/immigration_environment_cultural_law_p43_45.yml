data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition_scope: historical Shadowrun original/Second Edition publication
    printed_pages: 43-45
    physical_pdf_pages: 52-54
  visa_regime:
    visa_types:
    - visitor
    - student
    - work
    - immigration
    visitor_validities_days:
    - 7
    - 14
    - 28
    visitor_fixed_length_option: true
    visitor_rate_per_week_pounds: 50
    visitor_unfixed_deposit_pounds: 200
    visitor_deposit_refund: No refund if visitor departs early; renewal at Office
      of Placements after 28 days for unfixed-duration visitors; overstay may lead
      to immediate deportation.
    student_visa_rate_per_year_pounds: 10
    student_visa_requirements: Official invitation and evidence of finance for approved
      educational program.
    work_visa: Rare, normally for essential foreign-corporation employees and exceptional
      contacts.
    immigration_visas_annual_ceiling: 11000
    naturalization_probation_years: 3
    narrator_described_selection: Claimed Irish descent required; source says practice
      grants immigration visas almost exclusively to elves from expatriate communities
      in Britain, Tir Tairngire and Australia; more than 99 percent of new immigrants
      are described as originating from those places. False papers bring immediate
      deportation.
  environmental_law:
    example_oil_leak_penalty: £5,000 fine or a fortnight in jail
    unlicensed_vehicle_without_catalytic_converter: Mandatory 6 months in jail plus
      a minimum £10,000 fine
    battery_disposal_into_stream: Five-figure fine plus months of imprisonment; no
      exact count specified
  cultural_heritage_law:
    offense: Debasing, demeaning or devaluing protected heritage or profiting from
      unlicensed exploitation of such heritage; definitions are narrator-reported
      and culturally contingent.
    general_fines_pounds: £500–£5,000 or higher
    defacing_protected_public_library_book_pounds: 1000
    vandalizing_protected_book_owned_by_offender_pounds: 500
    protected_ritual_objects: Danaan torcs, scabbards and insignia have protected
      combinations of design/form/material; narrator distinguishes copying bare design
      form from copying ritual-sensitive form-and-material combination.
    other_restrictions: Obscene, defamatory or scurrilous portrayals of protected
      figures and themes may be criminal; no objective definition offered.
  certainty: Official source narrator assertions, not claims about actual Ireland
    or applicable law.
  forward_indexing_note: Verified forward-unindexed record while predecessor FASA7212
    Denver remains source-integrity blocked. No source activation, authority to advance
    a main manifest, or page credit.
