    original_pdf_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
  armaments_eireann_tir:
    head_office: Armagh, Ulster
    ceo: Thomas O’Neill
    ergonomic_weapon_systems_division_head: John Cornelius O’Neill
    integrated_security_systems_division_head: James Patrick O’Donnell
    product_categories: Personal, heavy and military weapons; weapon-control systems;
      military intelligence analysis; personal weapons
    narrator_business_profile: TRC security guards Armagh plant; company handles government
      weapons commissions and also limited foreign security-agency sales. Manufacturing
      is subcontracted to General Industrial Corporation, which also produces military
      vehicles. AET performs classified research and government orders relieve it
      of public financial disclosure.
  eireann_tir_publishers:
    head_office: Limerick, Munster
    ceo: Joseph P. MacNamara
    products: Educational and cultural software, skillsofts, databases, archives and
      cultural artifacts
    narrator_business_profile: Enterprise balancing O’Brien and McCarthy family interests;
      licensed book, VR-CD, chip, skillsoft, sculpture, music and literature production,
      schools, cultural festivals and marketing. Personnel oversee specialist divisions
      yet are expected to know general Tir culture.
  hermetic_services_inc:
    head_office: Not applicable
    ceo: Thomas Sheridan O’Connor
    products: Magical foci, hermetic libraries and unique magical artifacts
    narrator_business_profile: Unadvertised specialist company with access to governmental
      databases of magicians and magical creatures. Advises Tir on licensing and monitoring
      magical practitioners; employs 30 enchanters, and often accepts favors and information
      as payment.
  otoole_transcom:
    head_office: Dublin
    ceo: Seamus O’Toole
    communications_division:
      head: Máire O’Toole
      products: Telecommunication software, hardware, printing, trideo and radio networks
    transport_division:
      head: Bridgit O’Toole
      products: Bus, rail, coach, plane and ferry services
    narrator_business_profile: Family corporation with exclusive government concession
      for large communications, media and transportation systems; the book characterizes
      competition as very limited.
  sculpted_environmental_systems_inc:
    head_office: Boyle Abbey, Lough Key Forest Park, Connaught
    ceo: Dominic O’Brien
    products: Ecological research and SES plant/landscape systems
    narrator_business_profile: Experimental ecosystems spanning underground caverns,
      ground buildings and treehouses in Lough Key. Research includes soil pH, mineral
      uptake, carbon-dioxide and nitrogen processing by engineered or bred plants,
      adaptation of landscapes, and customer ecological installations. The narrator
      describes consumer and international work; no specific method is reproduced
      as a real-world protocol.
  software_simulations_eireann_tir:
    head_office: Athlone, Meath
    ceo: Brendan O’Dunn
    products: Experimental software systems
    narrator_business_profile: Clearinghouse for government-supported software research;
      does research and licenses designs to Tir corporations and some foreign firms.
      Its fictional Matrix installations are heavily guarded by TRC and Reach Fuileach
      units, use black IC and complex shifting node routes. The narrator describes
      EcoSat remote environmental monitoring and projected ecosystem events; some
      confirmations are only rumored.
  profile_scope: The printed corporate directory and product categories are game-world
    description, not instructions to produce weapons, bypass security, or create surveillance
    tools.
  forward_status: Reviewed-forward-unindexed while FASA7212 Denver original is integrity-blocked.
    No source activation, contiguous authorization, or page credit.
