  source_context: Fictional Shadowrun-setting material from a published tabletop RPG.
    Distinguish book-narrator descriptions, in-world speakers’ allegations and speculation;
    no claims about real contemporary Belfast.
  security_estimates:
    presentation: One in-world post gives estimates from supposed intercepted Belfast
      Security Committee communications, January–July 2053; these are NOT narrator-certified
      actual force counts.
    Garda_personnel: 3500
    TRC_officers: 500
    TRC_surveillance_personnel: 500
    Army_troops: 1500
    URF_members: 300
    URF_active_in_city: 140
    NURM_members: 150
    NURM_active_service: 60
    scope: Figures refer to Belfast; the speaker suggests overall provincial group
      membership may be four or five times larger and cautions that official estimates
      may be inflated.
  in_world_factions:
  - name: Ulster United Protestant Party (UUPP)
    description: The sourcebook describes informal neighborhood control by street-level
      paramilitary allies, including extortion of businesses and violent retaliation.
      The party depicts URF actions as freedom-fighter acts and fails to condemn attacks
      on civilians.
  - name: Ulster Revolutionary Force (URF)
    description: Older organized paramilitary splinter of the UUPP based substantially
      in western Protestant neighborhoods including Shankill; leadership and support
      scattered through Shankill, Armagh, Omagh and Coleraine. The book depicts URF
      as drawing ex-Royal Ulster Constabulary members or their sons, obtaining external
      British-linked funding and firearms, and preferring strikes against military
      and government targets, while also having killed civilians.
  - name: New Ulster Revolutionary Movement (NURM)
    description: Hardline eastern splinter with a base in Ballymacarrett, including
      a Derry cell and activity reaching northwestern Connaught. Source narration
      describes NURM attacks on military and economic targets AND civilians, racial
      persecution of metahumans including elves, and sectarian targeting of non-Protestant
      communities.
  - name: Irish Volunteer Faction (IVF)
    description: Extremist splinter of the Official IRA described as targeting metahumans,
      with fewer than one hundred active members in Belfast. The source claims occasional
      cooperation with the URF on government targets.
  - name: Spear of Trogan
    description: The faction has publicly claimed responsibility for the deaths of
      nearly a dozen members of URF and NURM over approximately two years, mostly
      in Belfast. The source explicitly states no witnesses emerged; rumor variously
      names IRA, INLA or covert TRC operatives as responsible. Treat all identifications
      as disputed.
  civilian_harm_distinction: The historical fictional account differentiates attacks
    on military and government targets from murders or attacks on civilians; it does
    not present affected people as consenting participants.
