  council_of_stewards:
    membership: 30
    allocation: Two Stewards from each of the eight Danaan-mór and one from each of
      fourteen other families.
    selection: Chosen by internal family conclave, often family elder but not always;
      Steward serves one to five years according to family wishes, may temporarily
      yield seat to another family member suited to a question.
    responsibility: Sets Senate policy and legislation; small meetings formulate policy,
      full ritualized conclaves of all Stewards occur at equinoxes and on vital issues.
    presiding_high_steward: William O’Dunn at the time of the fictional account; chiefly
      administrative.
    meeting_place: Council meets at mystical Tara, not a fixed geographic site. Hill
      of Tara exists in Meath, while mystical Tara manifests through ritual and Great
      Spirits; a Great Spirit of the Tuatha is said always present at equinoctial
      conclaves.
    family_elder: Family elders retain influence over their Stewards; aging Seamus
      O’Kennedy reportedly rarely attends Council meetings yet remains powerfully
      present in conclaves.
  degree_of_certainty: Descriptions are attributed to the book narrator. Magical explanations
    are source-world claims, not independently verified real-world history.
