  narrated_power_structure:
    public_vs_hidden: The narrator depicts public government as subordinate to a less
      visible Danaan-family power structure through the Council of Stewards and Seelie
      Court.
    family_count: 22
    danaan_mor_count: 8
    composition: Largely indigenous Irish, Norman and other bloodlines; many families
      include humans, but only elves serve as family Stewards.
    awakening: The source says unusually many elven children were born in these families
      during the Awakening, but supplies no confirmed genetic explanation.
    families_influence: Eight Danaan-mór families are said to have greatest influence
      by perceived innate quality, not headcount; O’Kennedys are influential outside
      the eight and have tensions with O’Connors.
    provincial_distribution:
      Ulster:
