  source_context: Published tabletop game fiction; source-narrator description, attributed
    beliefs, rumors and optional gamemaster scenarios kept distinct.
  fictional_critter_observations:
  - name: Hell Hound
    account: Patchily distributed in small packs in isolated rural areas.
  - name: Incubus
    account: Periodic reports of incubus activity filter in from Tír cities. The fictional
      Tír government places a $20,000 bounty on these creatures.
    certainty: Periodic reports
  - name: Kraken
    account: Occasional sightings off Atlantic coast in deep waters inaccessible to
      Tír vessels.
    certainty: Reported sightings
  - name: Leshy
    account: Common, given protected status; ruling elves regard them as nature spirits
      and work with them to protect rural environments. Some have territories.
  - name: Lesser Roc
    account: Aggregates west coast and western Munster in spring; some stay, most
      winter on European lands across the Atlantic.
  - name: Leviathan
    account: Most sightings off west coast, sometimes Icelandic waters to northwest.
  - name: Loup-Garou
    account: TRC and other military reportedly eliminated the creature from Tír.
    certainty: Apparently succeeded; not certain extinction
  - name: Man-of-the-Woods
    account: If this personification of Nature exists, elves know it under a different
      name/aspect and regard it as a simple, uninteresting free spirit.
    certainty: Existence conditional
  - name: Megalodon
    account: Deepest Atlantic waters; extremely rare sightings.
  - name: Mermaid
    account: A few sightings reported off the western coast.
  - name: Merrow
    account: Scattered unverified reports; virtually unknown otherwise.
    certainty: Unverified
  - name: Munchkin
    account: Common and considered half-companion/half-pet by elves; avoids attacking
      elves, warns them about intruders in secluded or protected forests.
