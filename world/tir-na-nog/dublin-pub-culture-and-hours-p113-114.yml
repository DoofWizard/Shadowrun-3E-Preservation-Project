  narrator_reporting: The book describes an imagined mid-21st-century Dublin where Guinness remains brewed, a drink named
    corma is culturally established, and it estimates approximately 850 pubs.
  pub_custom: Celtic/Irish pubs range from small traditional rooms to newer tourist-friendly venues. The narrator describes
    a custom in which a person entering an established group conversation is expected to buy a round for the whole group.
    Many new dance clubs also host performance art and galleries.
  city_center_hours:
    pubs: Monday–Saturday around the clock; on Sundays from 12:30 until 23:00
    bars: Some named central establishments stay open continuously
    outside_center_pubs: Often close before midnight on weekdays and occasionally on weekends
    nightclubs: Typically from 20:00 until early morning; upscale venues may close around 02:00, many last to dawn
  locations_for_nightlife: Leeson Street, Dawson Street, O’Connell Street, and the Liberties/Temple Bar district.
  accessibility: The narrator notes drinking and driving restrictions and suggests walking for intoxicated patrons. This
    is a sourcebook setting observation, not current advice.
