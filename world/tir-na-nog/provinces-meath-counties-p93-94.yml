  province:
    name: "Meath"
    gaelic: "Cuige Righ"
    formation: "Following fictional Tir reunification in early 2035, Danaan elves formed a fifth province out of Cavan and Monaghan (previously Ulster) and counties previously belonging to Leinster."
    social_context: "Humans often refer to four traditional provinces while elves and many metahumans acknowledge the fifth; Tara is regarded as ancient heart of kingship and a symbolic hub of Danaan government."
    sources_of_dispute: "County borders, Danaan claims to Tara and rival O'Connor/O'Kennedy family legacies are presented as in-world political claims, not as unqualified real-world assertions."
  counties:
    -
      name: "Cavan"
      observations: "Unspoiled lakes, mountains, drumlins and woodland with Shannon rising on mountain slopes; some in-world elves treat Magh Sleacht at Ballyconnell as a sacred site."
      politics: "Disputed transfer from Ulster to Meath; older humans seek Ulster allegiance while some young elves favor integration into the ancient kingdom of Breffni."
    -
      name: "Longford"
      observations: "County of forested Shannon basin, lakes and islands."
      politics: "Previously called Annaly under O'Farrel prince; a later-day O'Farrel campaigns to restore the name."
    -
      name: "Louth"
      observations: "Smallest county; Boyne Valley and historic Battle of the Boyne, Cooley peninsula and Táin Bó Cúailnge geography; the source ties the region to Cú Chulainn and Queen Medb mythology."
    -
      name: "Meath"
      observations: "The province's name-bearing central county, homeland of the narrator's O'Connor family, contains Tara, Slane, Uisneach, Knowth, Newgrange, Kells and other sites."
      historic_change: "Modern fictional county Meath incorporates Westmeath, divided in 1542, bringing Tara and Uisneach under the same county for the first time in centuries."
    -
      name: "Monaghan"
      observations: "Wooded and boggy county bordering Armagh and Fermanagh; Hope Castle near Castleblayney hosts TRC headquarters."
      conflict: "The source reports refugee and sectarian political struggles between Republican and Protestant paramilitary factions, with alleged Firbolg ancestry used by some commentators to explain local appearance; these are source-attributed in-world assertions, not biological reality."
  forward_status: "Verified source-reviewed forward record; not indexed as authoritative contiguous source coverage."
