summary: Archival world_fact reference from the FICTIONAL Shadowrun sourcebook Tir
  na nÓg, published by FASA Corporation in 1993, FASA7211/source.fasa-7211, printed
  pp22–25 (physical PDF23–26). Reported sourcebook setting facts are distinguished
  from named in-world commentary; mechanical quantities remain source-period exact.
data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog: FASA7211
    source_id: source.fasa-7211
    edition: original and Second Edition Shadowrun-era sourcebook
    printed_pages: 22-25
    pdf_pages: 23-26
  matrix_p22_23:
    operator: Fictional Tir governmental Post Office is presented as the Matrix network/telecom
      operator, with local telecom grids (LTGs), no separately portrayed regional
      telecom grid (RTG) in the book passage.
    public_information_system: TET, treuntas Eireann-Tir, shares public news/weather/event
      information; other access described as restricted.
    iconography: Tir Matrix use of Celtic-symbolic node imagery appears in book narrative
      and Analyzer commentary; do not convert interface descriptions into exact software
      rules.
    rating_reference: Source mentions “Red-5” security in its Matrix discussion. The
      named rating is preserved exactly in the separate protected rule-exact record.
  festivals_p23_24:
    rose_of_tralee: A week-long late-August pageant/fair with horses and cultural
      ceremonies; specific crowds/endowment in commentary not verified narrator.
    galway_oyster_festival: Described as a ten-day mid-September festival with oyster
      contests, a timed opening competition and corporate hospitality contacts.
    yeats_summer_school: June–September seminar/arts study; source gives Sligo and
      a County Armagh location wording; leave geographic discrepancy as source text
      rather than silently correcting to a real map.
    sports: Gaelic football and hurling described as 15-a-side and a small hurling
      ball (sliotar); promotional description of metatype athletic participation is
      source-period narrator perspective, not actual human physical taxonomy.
    game_fishing: Licensable high-end fishing packages, reported up to £2,000/week
      on selected rivers.
    related_city_habits: Urban sporting and coastal recreational venues described
      under source-period culture.
  names_p25:
    formal_names:
    - Tir na nÓg
    - Tir
    old_names:
    - Éire
    - Ireland
    official_vs_colloquial: Old names persist but are described as increasingly avoided
      by governmental institutions.
    demonyms: The book describes “tuatha” as a term citizens use, with noble-associated
      “Tuatha de Danaan” as a specific elven aristocratic family/ruling-class concept
      (linked to Danu); do not conflate common citizenship with noble elite.
    language: Gaelic, Sperethiel and English-language forms co-exist; city/rural usage
      and naming conventions vary; claims of Gaelic names as exclusive birthright
      are disputed in-world.
    rhetoric: Source-book attitudes toward metatypes and names are fictional speakers’
      social positions, not objective ethnography.
  source_narrator_reliability: Factual statements are bounded to the 1993 fictional
    source publication; no SR3 extrapolation.
  forward_status: Reviewed before FASA7212 Denver because its cataloged PDF cannot
    render; NOT an activated FASA7211 source, NOT contiguous page authorization, and
    does not advance Aztlan manifest/checkpoint.
framing: newsroom_neutral
