  emergency_rule:
    instituted: 2034
    authority: Belfast is said by the sourcebook to operate under the State of Emergency
      Regulations imposed under martial law.
    constraints: The printed regulations include indefinite imprisonment of terrorist
      suspects, denial of the right to silence, jury trial, access to a lawyer and
      civil-liberties groups. The fictional TRC can impose a curfew from 10 p.m. to
      6 a.m. with as little as two hours of notice.
    court_procedure: The TRC may submit Petitions of Protection under the law referenced
      on printed p19; the sourcebook states trials then need not be heard in open
      court.
  formal_government: The text names Dáil and Senate appointees or elected members
    representing Ulster, the Ulster Provincial Assembly and Belfast City Corporation,
    but says assembly participation has become largely nominal because of abstentions.
    The Ulster United Protestant Party (UUPP) declines to take seats, and the Social
    Democratic and Labour Party (SDLP) has struggled to form effective alliances.
  city_corporation: The Belfast City Corporation was suspended in autumn 2045. Its
    formal powers remain on paper, but the Defence Secretariat under junior minister
    Maeve Fitzgerald has handled city government decisions.
  current_de_facto_administration: Belfast Security Committee, made up of various
    government officials, TRC leaders, the head of the Ulster Garda and unnamed members;
    sources do not establish the full membership.
