  urban_character:
    gaelic_name: Baile Átha Cliath
    identity: Ancient Tír capital and seat of government described as combining historic buildings, monuments and museums
      with contemporary artistic life, commerce and social diversity.
    arts: The book describes a city known for Irish traditional music, literary culture, poetry, underground theatre,
      modern music, galleries and workshops; its cultural movements sometimes criticize national authority.
    residents: The book portrays an overwhelmingly young population, with roughly half younger than 25 and many more
      younger than 40. It presents human and elven residents as living and working together, while also describing class
      and generational tensions.
    political_context: Although government ministries are located in Dublin, the narrator portrays comparatively less
      strict municipal oversight of artistic dissent than elsewhere in the Tír, and contrasts public tourist culture
      with local underground groups and hidden conflicts.
