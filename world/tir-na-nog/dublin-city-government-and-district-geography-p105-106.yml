  source_voice: The fictional book narrator describes institutions and streets; comments by named Shadowland speakers
    are preserved separately.
  city_corporation:
    structure: Nominal City Corporation composed of 44 elected councillors, theoretically reporting to the Leinster Assembly;
      in practical administration it has responsibility mainly for civic amenities while substantive policy rests with
      the central Tír government.
    mayor: Graeme Patrick Finnegan is Mayor of Dublin, whose Fianna Fáil associates hold a reported balance of power.
    committees: Transport Committee, Culture Committee and smaller groups run civic functions while reporting to the
      council and relevant departments.
    central_government: Many departments retain Dublin mailing addresses but occupy extensive complexes on the urban
      edge. The Upper Merrion Street offices of Government Information Services are a conspicuous central exception.
    presidential_residence: The book says an area of Dublin Castle immediately south of the River Liffey was restored
      as an official presidential residence, used for visits by senior Danaan leaders.
  city_geography:
    river: The River Liffey flows west to east through the center and forms a principal north/south division before Dublin
      Bay.
    south_side: Grafton Street and Westmoreland Street mark a primary city axis; Trinity College, Fitzwilliam Square,
      St Patrick’s Cathedral, the Liberties, Guinness Brewery, Kilmainham Hospital and Jail are named landmarks. Residential
      neighbourhoods extend south to the South Ring Road and Grand Canal.
    north_side: The narrator describes heavy redevelopment, preserved Phoenix Park frontage, commercial corridors and
      formerly industrial warehouses near the ferry terminal; North Circular Road and DART corridor mark an outer boundary.
    postal_codes: North-side center outward uses odd Dublin postal-district numbers and south-side center outward uses
      even numbers; some outlying areas use community names such as Blackrock and Glenageary.
    social_character: The chapter characterizes northern neighborhoods as more socially mixed, with notably poorer districts
      near the airport, and describes a coastal route towards Howth.
  forward_status: Not a currently indexed or source-completed chapter.
