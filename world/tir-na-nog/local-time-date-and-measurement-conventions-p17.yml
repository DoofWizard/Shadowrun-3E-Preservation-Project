  section: FACTS AT YOUR FINGERTIPS — TIME / MEASUREMENTS
  source_narrator_facts:
    local_time_system: The sourcebook describes Greenwich Mean Time (GMT), also called
      Tír Mean Time (TMT), from late October into early April. A one-hour-advanced
      Tír Summer Time (TST) is described as operating from mid-April through September.
    relative_time_reported_in_setting:
      tmt_ahead_of_north_american_eastern_hours: 5
      tmt_ahead_of_north_american_central_hours: 6
      tmt_ahead_of_north_american_pacific_hours: 7 or 8, as printed
      tmt_behind_most_european_countries_except_britain_hours: 1
    calendar_convention: Tír dates generally put day before month. The source contrasts
      North American 9/16/52 for September 16, 2052 with Tír 16/9/52.
    clock_usage: 'The source describes a 24-hour clock in travel timetables and some
      business settings: 7 A.M. is 07:00 and 7 P.M. is 19:00. Elsewhere A.M./P.M.
      wording remains common.'
    measurement_system: The sourcebook narrator reports metric units as the norm and
      describes British-imperial feet, yards, pounds and ounces as culturally disfavored.
  attribution_note: Analyzer and Captain Chaos offer separately attributed reactions
    on printed p17; these opinions are not converted into universal narrator-established
    rules.
  not_real_world_guidance: true
