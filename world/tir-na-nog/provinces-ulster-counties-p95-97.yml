  province:
    name: "Ulster"
    gaelic: "Ulaidhster"
    source_frame: "The fictional book narrates centuries of sectarian conflict and security zoning. It reports the TRC incorporated older IRA remnants and the Protestant URF and NURM remain feared; it also distinguishes most local civilians, who desire peace, from extremists."
    security: "Source describes Belfast and parts of Derry, Newry, Armagh as security risk zones (SRZs); does not provide a numerical mechanical security rating in these pages."
  counties:
    -
      name: "Antrim"
      narrator: "Giant's Causeway, Nine Glens, Slemish Mountain, Belfast and fort/historical Dál Riada traditions; conflicting clan associations."
    -
      name: "Armagh"
      narrator: "Smallest of seven Ulster counties, wooded mountains and apple farms near Lough Neagh; a large central area and Crossmaglen environs designated SRZs. Armagh town includes military installations, research/manufacturing facilities for Arma-ments Éireann-Tír, and TRC/Reach Fuileach outposts."
      security: "Narrator describes virtual martial-law conditions, intelligence and armaments role."
    -
      name: "Derry"
      narrator: "Previously Londonderry; walled town, stormy coast and mountains, under TRC and army SRZ. Bogside/Waterside tension, prolonged historical disinvestment then new technology industries."
      report: "Narrator estimates about 95 percent of Protestant and Republican inhabitants coexist peacefully and attributes violence to a small minority; this is a fictional narrative assessment."
    -
      name: "Donegal"
      narrator: "Gaeltacht county with mountains, Donegal Bay, Slieve League, Inishowen and rich farming; O'Neill/O'Donnell/MacDonnell family influence with local independent political traditions."
    -
      name: "Down"
      narrator: "Mourne Mountains, Bangor resort, Belfast, Carlingford and Strangford loughs; rural agricultural lands and investments, tourism under risk from Troubles."
    -
      name: "Fermanagh"
      narrator: "Lough Erne lakes divide county; mountain/bogland, relatively sparse settlement; source reports dangerous fictional creatures in remote areas."
      speaker: "Griswold's posts assert Fomorians, hostile freshwater predators and escaped beavers."
    -
      name: "Tyrone"
      narrator: "Named after Eoghan, son of Niall of Nine Hostages; lowest population among seven, Sperrin Mountains, County Omagh bardic school and poetry traditions."
      organization: "Source describes a so-called Ginsberg Collective of dwarf social activists using apocalyptic poetry."
  attribution_guard: "All conflicts, political categories and militant claims refer to the invented Shadowrun 2050s setting; nothing implies a current real-world operational report."
  forward_status: "Verified source-reviewed forward record; not indexed as authoritative contiguous source coverage."
