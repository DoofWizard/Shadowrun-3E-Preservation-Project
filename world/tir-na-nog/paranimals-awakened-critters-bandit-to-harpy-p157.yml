  source_method: 'Fictional tabletop-game sourcebook reporting: rules are historical
    game mechanics; narrator facts, disputed in-world theories, and optional gamemaster
    decisions are distinct.'
  source_context: FASA fictional 1993 Tír na nÓg in-world zoological survey; claims
    distinguish confirmed descriptions, rumors, disputed identifications and source-reported
    legal bounties.
  creatures:
  - name: Bandit
    status: source_narration
    detail: Awakened marbled polecat, similar to North American bandit; found in wooded
      hills.
  - name: Bean sidhe
    status: source_narration_and_rumor
    detail: Government offers £50,000 bounty for destruction. Hermetic mages using
      spirit assistance have almost eliminated banshees in the Tír; rumors place one
      or two in the western Connaught isles, with some elven families allegedly protecting
      them.
  - name: Barghest
    status: disputed
    detail: Parazoologists dispute whether supposed black hounds of local tales are
      barghests; numerous reports lack a precise match to the published creature.
  - name: Birdman
    status: source_narration
    detail: Common in rural regions.
  - name: Blood kite
    status: reported
    detail: Observers report flocks in the mountains and hills of Ulster and Munster.
  - name: Bogie
    status: source_narration
    detail: Similar creatures fairly common in rural areas; folklore and reports exceed
      their actual numbers.
  - name: Bombardier
    status: source_narration_with_scientific_uncertainty
    detail: Native variant of the Tír native red squirrel, rather than the imported
      gray squirrel; parazoologists do not know why Awakening affected indigenous
      but not foreign squirrel populations.
  - name: Century ferret
    status: source_narration
    detail: Once common, now eliminated by the aggressive bulldog stoat; references
      Paranormal Animals of Europe p22.
  - name: Cockatrice
    status: source_narration
    detail: A handful live in isolated western and southern forests.
  - name: Corpselight
    status: source_narration
    detail: Frequent marshes, peat bogs and boggy terrain.
  - name: Devil rat
    status: source_narration
    detail: Increasing in northern towns and cities; rare elsewhere.
  - name: Dracoforms
    status: source_narration_as_of_publication
    detail: No reports of dracoforms appeared in the Tír during the Awakening; the
      source states that the country appears to have no indigenous dragons.
  - name: Dzoo-noo-qua
    status: unconfirmed
    detail: Presence is uncertain; this creature may be confused with the European
      fomorian (Paranormal Animals of Europe p46), preventing certain identification.
  - name: Elemental
    status: source_narration
    detail: All varieties are described as common throughout the Tír.
  - name: Fideal
    status: source_narration
    detail: Found in the far southern waters during warm summers.
  - name: Firebird
    status: qualified
    detail: Not native; some may have been imported by elves for species-protection
      programs, analogous to phoenix imports.
  - name: Gabriel hound
    status: source_narration
    detail: Prefers outskirts of poorer towns and cities, especially Ulster and southwestern
      Tír.
  - name: Gargoyle
    status: unverified
    detail: One or two reports have been received but remain unverified.
  - name: Ghost
    status: reported_and_elven_belief
    detail: Reported in castles, ruins and historic buildings. Tír elves regard ghosts
      as cursed rather than Wheel of Spirits entities and show little interest because
      they regard humans poorly.
  - name: Ghoul
    status: infrequent_reports
    detail: Reports of small groups from rural areas; no widespread infestation is
      known in the source period.
  - name: Gloaming owl
    status: contested
    detail: Common in woods; reports of an additional illusion power for the local
      subspecies are unresolved because spontaneous illusions also occur in these
      habitats.
  - name: Greater unicorn
    status: unverified_suppression_allegation
    detail: Unicorns are common, but greater unicorn sightings are unverified; some
      suspect the government suppresses reports to discourage hunters.
  - name: Harpy
    status: source_narration
    detail: Small groups live in isolated forests.
framing: newsroom_neutral
