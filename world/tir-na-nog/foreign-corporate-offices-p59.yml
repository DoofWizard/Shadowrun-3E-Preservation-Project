    executive_director: Sean MacMurrough, Taibhseach White Wolf
    products: Sculpted Environmental Systems (SES) designs
    narrator_business_profile: Gaeatronics alone is licensed to export SES designs
      to North American nations. The narrator describes intelligence exchange with
      Salish-Shidhe Council officials in connection with trade access to Tir Tairngire.
