    printed_pages: '157'
    physical_pdf_pages: '166'
  source_context: Published tabletop game fiction; source-narrator description, attributed
    beliefs, rumors and optional gamemaster scenarios kept distinct.
  fictional_critter_observations:
  - name: Bandit
    account: An Awakened form of the marbled polecat, described with the printed Latin
      label “vormela peracusa”; similar to the North American bandit; inhabits wooded,
      hilly Tír.
  - name: Bean Sidhe
    account: Fictional Tír government has a $50,000 bounty for destruction of these
      beings; hermetic mages searching with spirit aid have almost extinguished them.
      Rumors say one or two survive on Connaught western isles and a few elven families
      may protect a bean sidhe.
    certainty: Survivors expressly rumors
  - name: Barghest
    account: Researchers disagree whether the Tír black-hound stories are barghests;
      reports frequent but do not match the published description.
    certainty: Unresolved identity
  - name: Birdman
    account: Common in rural regions.
  - name: Blood Kite
    account: Observers report flocks in mountains and hills of Ulster and Munster.
    certainty: Reported
  - name: Bogie
    account: Similar creatures reasonably common rurally; their tall tales exceed
      actual numbers according to the narrator.
  - name: Bombardier
    account: An indigenous Tír variant of the red squirrel Sciurus vulgaris, not the
      foreign gray squirrel; para-zoologists have not established whether Awakening
      originated in native or foreign species.
    certainty: Awakening origin undecided
  - name: Century Ferret
    account: Once common, described as having been eliminated by aggressive bulldog
      stoat, citing Paranormal Animals of Europe p22.
  - name: Cockatrice
    account: A handful in isolated western and southern forests.
  - name: Corpselight
    account: Common in marshes and boggy terrain, particularly near peat bogs.
  - name: Devil Rat
    account: Increasingly common in northern cities and towns, rare elsewhere.
  - name: Dracoforms
    account: No reports of any dracoforms appearing in the Tír during the Awakening;
      narrator describes Tír as unusual in having no indigenous dragons.
    certainty: Absence of reports, not categorical impossibility
  - name: Dzoo-noo-qua
    account: May or may not occur; easily confused with European fomorian (Paranormal
      Animals of Europe p46); cannot be identified confidently.
    certainty: Unverified
  - name: Elemental
    account: All types are common throughout Tír.
  - name: Fideal
    account: Rare creature inhabiting southernmost waters during warm summers.
  - name: Firebird
    account: Like phoenix, non-indigenous; possibly imported as part of elven preservation
      project.
    certainty: Possible import
  - name: Gabriel Hound
    account: Prefers margins of poorer towns and cities, especially Ulster and southwest
      Tír.
  - name: Gargoyle
    account: One or two reports, none verified.
    certainty: Unverified
  - name: Ghost
    account: Reported from castles and ruins; Tír elves describe these as cursed departed-human
      beings rather than part of Wheel of Spirits.
    certainty: Fictional reports plus attributed elven belief
  - name: Ghoul
    account: Infrequent reports of small groups in rural districts; no widespread
      infestation stated.
    certainty: Reported
  - name: Gloaming Owl
    account: Common in woods; some reports suggest extra illusion powers but para-zoologists
      have no conclusion.
    certainty: Extra abilities unconfirmed
  - name: Greater Unicorn
    account: Ordinary unicorn widespread, greater type not reported; possibility that
      Tír elves conceal sightings is explicitly conjecture.
    certainty: No verified greater sightings
  - name: Harpy
    account: A few small groups in isolated forests.
framing: newsroom_neutral
