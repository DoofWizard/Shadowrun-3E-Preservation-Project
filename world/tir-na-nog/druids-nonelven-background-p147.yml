  non_elven_druids:
    metatypes:
    - human
    - ork
    - dwarf
    - troll
    frequency: Mostly human; the source identifies only occasional non-human examples
      beyond humans.
    population_area: Primarily western and southwestern Tír regions, with ties in
      northern Connaught and Ulster.
    practices: Celtic shamanic druid traditions centered on protecting rural land;
      many lead isolated, materially modest lives, and are unfamiliar with the wider
      world.
    relations: Elven authorities tolerate these scattered druids because they support
      land protection and are unlikely to organize broad resistance. Relations are
      wary, sometimes contemptuous on the elven side.
    elven_claim: The book attributes dismissive language about non-elven shamans to
      elven prejudice, while elven druids also respect the power of their totems.
    protection: In-world Tír legal narration states that killing a Druid of any metatype
      attracts an automatic death sentence without brehon consideration of mitigating
      circumstances.
    overseas_links: Some Tír druids have family ties to British Celtic druids; older
      human druids sometimes communicate through spirits with British counterparts
      across the Irish Sea.
    uncertainty: The book states that neither the Tír nor British government knows
      the reason for some of these spirit communications.
