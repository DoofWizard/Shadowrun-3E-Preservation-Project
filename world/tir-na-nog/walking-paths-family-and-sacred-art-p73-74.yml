data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: Historical Shadowrun original/Second Edition-compatible publication,
      not a Third Edition conversion
    file_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: 73-74
    physical_pdf_pages: 82-83
  paths:
    seeker_and_follower_correspondence:
    - way: North
      seeker: Path of the North
      follower: Path of the Warrior
    - way: East
      seeker: Path of the East
      follower: Path of the Steward
    - way: South
      seeker: Path of the South
      follower: Path of the Bard
    - way: West
      seeker: Path of the West
      follower: Path of the Druid
    - way: Center
      seeker: Path of the Center
      follower: Path of the Rígh (King)
    initiatory_status: The fictional narrator distinguishes magically active Followers
      (hermetic magicians or adepts) from Seekers lacking magical aptitude. A Way
      provides both mundane and magically active approaches to spiritual practice.
    sequence: The Center or Rígh Path is customarily Walked last; the four cardinal
      Paths need not be completed in any fixed order. The narrator expressly describes
      exceptions where an elf pursues Center early to restore spiritual balance; Seekers
      may Walk Center before becoming Followers.
    warrior_view: Some advanced Followers regard the Northern Warrior Path as an early-stage
      Path most Seekers follow; the book distinguishes the Followers’ assessment from
      Seekers’ own hope of returning to that Path in later incarnations.
  giving_of_honour:
    ceremony: At a family ceremony on coming of age, a magically active Danaan elf
      announces a personal oath to follow a Path and adopts its ritual symbols. Elders
      of the family witness this lifelong spiritual declaration.
    source_permitted_game_consequence: The source says that after Giving Honour an
      elf may join the magical group or order of the Path and, as an initiate, may
      learn to use metamagic; separate rule_procedure record preserves this mechanic.
    timing: The fictional narrator says most young elves undergo the rite after early
      education, often following years with a foster family. Some prodigies, such
      as Padraic Byrne, are said to complete it as early as age 11; others may do
      so at age 25 or later.
  sacred_visual_culture:
    themes: The narrator says Danaan Family clothing, household objects, corporate
      Matrix imagery, sculpture, jewels and ritual art use symbols of each family’s
      Way. Northern families favor restrained earth-colored designs; southern families
      tend toward brighter fire-associated imagery; these are described general tendencies.
    materials: The narrator associates eastern and southern families with gold as
      an emblem of dawn or noon, and northern families with silver or platinum to
      evoke evening or night; significance is principally symbolic.
    torcs_and_lunulae: The book says elaborately decorated thin precious-metal torcs
      are characteristic of Danaan-mór families. Other Danaan families more commonly
      wear thicker torcs or crescent-shaped lunulae/gorgets. Social etiquette concerning
      these symbols can signal business expectations.
    personal_arcana: Elves carry images of sword, stone, spear or cauldron as jewelry,
      clothing decoration, weapon markings and Matrix-persona motifs, with regional
      and family affinities.
    shadow_cloaks: The text describes fictional enchanted ceremonial cloaks worn by
      politicians or diplomats, intended to represent the wearer’s spiritual nature,
      conceal aspects from magical observation and include protective foci.
  followers_and_fostering:
    population_estimate: The narrator estimates about 1.3 million elves in the fictional
      Tír; fewer than 100,000 are magically active. Excluding dissenters, the narrator
      estimates 90 percent of magically active elves are Followers; these are source
      estimates, not a census of actual people.
    recognition: Many magically active children are recognized as potential Followers
      in their first or second year, sometimes through birthmarks or reported memories
      of former incarnations, which generally fade around age six or seven in the
      fictional belief.
    family_arrangements: According to described Danaan social customs, young Followers
      commonly reside with foster families from roughly age five or six until around
      fifteen or longer, especially if they mature slowly in their Path. Placement
      may take account of the child’s spiritual affinity, alleged earlier incarnation,
      and political kinship.
    fostering_kinsmen: The narrator says foster families customarily have a child
      of the same gender and broadly similar age, intended to create lasting inter-family
      bonds; this is a reported tradition and not a claim that children consented
      to each political purpose.
    post_rite_roles: Following Giving Honour, families may arrange training, university
      study, research, security service or corporate positions appropriate to a Follower’s
      skills. Personal development is described as continuing across lifetimes.
  forward_status: Verified forward source-review record, not indexed or credited as
    contiguous source authorization.
