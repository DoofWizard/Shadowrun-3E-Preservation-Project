  bard_path_and_order_of_brigid:
    identity: The Bard Path is linked in the fictional source to art, media, poetry,
      music, education, performance, writing and imagery; its own self-description
      invokes the changing energy of Fire.
    order: The Order of Brigid nurtures art and cultural life, and its ceremonies
      include spiral/knotted designs, vivid colors and a burning spear emblem of inspiration.
      The group may contest cultural authority with druidic orders.
    holy_dates: Alban Heruin (June 21) and Lugnasad (August 1). The narrator says
      their celebrations mark summer’s culmination and its decline toward autumn.
    ordeals: For higher status an initiate usually creates an original work such as
      a moving poem, song, sculpture or other artistic artifact.
    ritual: The sample Giving of Honour pledges to use art and speech to bring joy
      and understanding to the homeland.
  druid_path_and_order_of_ogma:
    identity: The book distinguishes magically active elven Druid Followers from non-elven
      druids and from historical Irish druids. These Followers are cast as scholars,
      judges, historians and teachers who tolerate chaos as a source of learning but
      generally prize careful speech.
    sacred_stewardship: The Order of Ogma is described as guardian of ritual sites,
      cairns, dolmens and spiritual pathways. The narrator says some high-ranking
      followers control magical flux along cairn lines and that the order may use
      watchers or spirits to monitor sacred sites.
    clothing_and_symbols: The order favors muted blue, green, pale brown, silver,
      knotwork, ritual animal and bird figures, and cauldron symbols, with senior
      initiates using distinct foci and brooch designs.
    ritual_oath: A sample Giving of Honour promises scholarship, judgment and stewardship
      guided by Ogma.
    sacred_dates: Alban Elued (September 21) and Samhain (November 2) are the two
      principal dates; Imbolc, Beltane and Lugnasad are additional sacred dates. The
      order’s ordeals to attain higher grades almost always involve composing a thesis.
    status: The book portrays the order as publicly recognized for education and environmental
      protection even while other groups regard its occult authority with unease.
  righ_path_and_order_of_sun_moon_stars:
    identity: The Path of the Rígh or High King is described as the most advanced
      Path. Followers, honored as spiritual elders and guardians, balance public duties
      against an ultimate spiritual return to the Northern Islands.
    in_world_counts: The narrator says fewer than 40 Rígh Followers lived in the fictional
      Tír and three people initiated into the Path during fictional year 2052; the
      Order of the Sun, Moon and Stars has an independent estimated membership of
      28 in its printed statistics.
    narrator_claimed_powers: In the source, Rígh Followers are said to moderate magical
      storms and mana surges at sacred sites; masters of elementals and spirits allegedly
      can summon the Wild Hunt. These are fictional sourcebook claims rather than
      real-world magical assertions.
    giving_honour: The example Rígh ritual is attended by other Followers; the initiate
      relinquishes possessions, accepts ceremonial artistic equipment and order support,
      and takes an oath framed as humility and service rather than social lordship.
    order_purpose: The Order of the Sun, Moon and Stars has spiritual and political
      authority over other magical orders, but its narrator says it usually exercises
      power indirectly by advice rather than ordinary command. Initiates interpret
      the world through both magician and shaman perspectives.
    symbols: The book describes simple garments symbolizing light and dark, Dagda
      and Morrigan, with sun, moon, stars and the sword prominent; the narrator says
      the order holds one sacred date, Samhain on November 2.
    spiritual_rites: Members choose their initiation ordeals according to personal
      inclination and engage in ritual sorcery concerned with ancestors, elementals
      and spirits. The GM note defers character creation and Path special-ability
      mechanics to Game Information, Path Magic beginning p134.
  forward_status: Verified forward source-review record, not indexed or credited as
    contiguous source authorization.
