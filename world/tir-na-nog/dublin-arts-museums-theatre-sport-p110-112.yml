    focus: Traditional and modern elven art and artifacts
  sport:
    leading_events: Gaelic football and hurling, with All-Ireland finals at the national stadium in Lansdowne Park; soccer,
      rugby, and traditional martial/bardic contests are also cited.
    tournament: Ring of Macha tournament grounds on outskirts of Dublin
    racing_sites:
