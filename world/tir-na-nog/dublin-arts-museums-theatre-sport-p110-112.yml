    - National Library (Kildare Street, Dublin 2)
    - Civic Museum (South William Street, Dublin 2)
    genealogy:
      place: Government Genealogy Bureau
      address: 2 Kildare Street, Dublin 2
      use: Visitors consult family-history collections and records.
