  mystic_ways:
    description: The sourcebook describes five Ways as directions and spiritual worldviews
      that influence Danaan families, province affiliations, fictional academic and
      business institutions, and Path specializations.
    directions:
      North:
        path: Warrior
        theme: Conflict, strife, combat, pride and ambition; linked to Ulster.
      East:
        path: Steward
        theme: Farming, prosperity, hospitality, communication, transportation, commerce
          and wealth; linked to Leinster.
      South:
        path: Bard
        theme: Poetry, minstrelsy, technical and intellectual knowledge, communication,
          media and diplomacy; linked to Munster.
      West:
        path: Druid
        theme: Learning, judgement, scholarship and druidic arts; linked to Connaught.
      Center:
        path: Rígh / King
        theme: Kingship, stability, sacred stewardship, renown and judgment; linked
          to Meath.
    eight_core_aspects:
    - Element
    - Logos
    - Arcanum
    - Hour
    - Season
    - Zenith
    - Province
    - Hero
    aspects_explained:
      Element: The first four Ways invoke Earth, Air, Fire, and Water; the fifth corresponds
        to pure Spirit.
      Logos: The source calls it the underlying cosmic pattern governing each Way
        and its Paths.
      Arcanum: Sacred objects associated with the mythic Arcana; ritual symbols in
        Danaan art.
      Hour: The time of day and corresponding heavenly bodies considered meaningful
        by believers.
      Season_and_zenith: The season and the seasonal midpoint or festival date associated
        with the Way; described as important for the magical orders.
      Province: The fictional provincial association shapes Danaan ideology concerning
        livelihoods, culture and institutions.
      Hero: A patron archetype from Irish/Celtic myth; the source explicitly describes
        debate over how myths and fictional elven interpretations fit together.
