  gang_source: Names and overlapping district associations appear in attributed M
    O’S and Billy Whiteside posts, not a certified law-enforcement registry. Posters
    describe the groups as violent and some as using motorcycle, automobile and armed
    street intimidation; no specific tactics are represented as advice.
  movement_and_checkpoints: The fictional sourcebook says civilian automobile access
    to central Belfast is barred, with public trams and military vehicles passing
    street barriers. Security personnel check entry papers at gates; Garda and TRC
    can block streets and enforce emergency curfews. In-world witnesses report especially
    severe access checks and danger after dark.
  private_vehicles: Red-marked Garda security-sensitive areas restrict vehicles; the
    sourcebook reports vehicle confiscation as a possible consequence for violations.
    Parking on the outskirts and transit inward are described as the city’s ordinary
    infrastructure.
  rail_street_risk: M1, Westlink and M2 road approaches are described as unsafe at
    night amid repeated mobile-gang attacks on motorists; this is an in-world fictional
    narrative, not a real travel advisory.
