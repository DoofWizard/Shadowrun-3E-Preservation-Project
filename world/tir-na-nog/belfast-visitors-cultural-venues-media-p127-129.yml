data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: Historical original/Second Edition-compatible; no inferred Third Edition
      conversion
    source_pdf_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: 127-129
    physical_pdf_pages: 136-138
  source_context: Fictional Shadowrun-setting material from a published tabletop RPG.
    Distinguish book-narrator descriptions, in-world speakers’ allegations and speculation;
    no claims about real contemporary Belfast.
  visitor_regime: The sourcebook says visitors to Belfast Security Risk Zone require
    special permits issued by the Office of Placements associated with the Defence
    Secretariat, with advance medical-insurance fees and identity papers. Garda/TRC
    can perform additional searches and detain persons without papers.
  visitor_services:
    Tir_Tourist_Board:
      address: 53 Castle Street, Belfast 1
      LTG_phone: 021-229555
    emergency: No PANICBUTTON service in Belfast; the sourcebook instructs fictional
      callers to dial 999 or contact a Garda patrol.
  healthcare: The book describes Belfast hospitals treating injuries from repeated
    violence and having specialists in shrapnel removal, skin grafts, knee replacements
    and burn care; it gives no operating procedure.
  weather: The sourcebook portrays Belfast as somewhat cooler than the rest of the
    Tír, with occasional bad-air haze associated with pollution from northwest Britain,
    including an episode termed the standing heatwave of 2044.
  cultural_landmarks:
  - City Hall at Donegall Square
  - Linenhall Library with records of the Troubles
  - Church of St. Malachy
  - University grounds and Botanic Gardens
  - Ulster Museum (destroyed in a 2044 URF firebombing and later rebuilt, per the
    sourcebook)
  - Grand Opera House on Great Victoria Street
  - Lyric Players Theatre on Stranmillis Avenue
  - King’s Hall on Lisburn Road
  press_and_broadcast:
    general: The narrator says most official Belfast media adopts a pro-government
      line and that editorial censorship pressure is exerted through TRC guidance.
      It contrasts occasional dissenting community newspapers.
    television:
    - TV Éireann — TVE-Belfast
    radio:
    - REB-1
    - REB-2
    newspaper: Belfast Telegraph (described as a former major newspaper diminished
      by refusal to report terrorist activities)
  retail_and_entertainment: Narrator describes a small selection of public cultural
    events, mainstream pubs, restaurants and Cornmarket boutiques; it emphasizes the
    danger of going out amid the fictional insurgency.
