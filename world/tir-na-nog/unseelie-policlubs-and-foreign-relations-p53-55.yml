  unseelie_court:
    narrated_status: Narrator denies an organized Unseelie Court as a formal institution,
      while admitting diverse loose affiliations of opponents to the Tir regime.
    opponent_letter: A first-person author describing themselves as an opponent says
      their own network is non-violent, distributes information via bulletin boards,
      independent Trid producers and publishers, and supports other opinions; do not
      falsely label the whole organization violent.
  policlubs:
    formal_ban: Book says Continental-style policlubs are not permitted by Tir authorities.
    approved_cultural_examples:
    - Dandies — theater devoted to Oscar Wilde
    - Baby Eaters — anti-British group celebrating Jonathan Swift
    targeted: Endgame club devoted to Samuel Beckett is officially banned as nihilist/culturally
      criminal.
    counterclaims: Siobhan Snakehead asserts covert political organizations, including
      Ork Resistance Movement and Defenders of the Fomor, exist. Analyzer alleges
      the Sons of Ogam group receives state backing and conducts cultural exchanges
      with intelligence-gathering benefits; neither is a narrator-confirmed fact.
  foreign_trade_context: Narrator estimates foreign trade at 63% of fictional Tir
    GDP; despite insularity, the country depends on relations with outside powers.
  britain:
    relations: Relations strained by history, expatriates and British support for
      Protestant groups; relations warmed slightly after Green Party election, and
      heads of government met only once in prior 16 years.
    commerce_and_security: Trade ministers meet frequently; British and Tir governments
      share intelligence about Celtic groups, non-elven druids, and English hermetics,
      while the Tir protests alleged British-linked paramilitary aid.
  vatican:
    relationship: Mutually hostile and wary; elves view Catholic Church as rival,
      Vatican resents Years of Scandal and the loss of power to homegrown Church of
      Ireland.
    templers: Tir families reportedly fear the Vatican’s sinister Templar Order as
      a formidable potential foe despite their own magical strength.
  france:
    status: Principal European ally, partly due to shared antipathy to Britain; France
      is second-largest consumer of premium Irish food exports after Britain, with
      reciprocal agreements.
  ucas:
    relationship: Substantial Irish diaspora in UCAS fosters cultural ties and public
      support despite concerns about Tir insularity. The relationship is cordial but
      occasionally cool.
  tir_tairngire:
    status: Official ties absent; Danaan family elites disdain Tairngire state and
      elven customs, while Tairngire sources also doubt Tir ambitions; no official
      relationship.
    disagreements: Danaan elite regards Tairngire as an inauthentic version of Northern
      Islands tradition, while Tir Tairngire commenters express concerns about interference
      and historical identity.
  forward_status: Source-reviewed ahead-of-boundary and unindexed; FASA7212 Denver
    remains source-integrity blocked. This record grants no main-manifest activation
    or contiguous page credit.
