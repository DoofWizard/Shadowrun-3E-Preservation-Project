data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition: Historical Shadowrun original/Second Edition-compatible publication,
      not a Third Edition conversion
    file_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: 65-67
    physical_pdf_pages: 74-76
  beliefs_in_source:
    reincarnation: The in-world Danaan belief states that elven spirits reincarnate
      into successive bodies; growth moves a spirit up the Wheel of Spirits and, after
      completing its Paths, permits ascension as a Bright Shining Spirit to the Northern
      Islands in the metaplanes.
    five_paths_by_direction:
      North: Warrior
      South: Bard
      East: Steward
      West: Druid
      Center: Rígh or King
    technical_terms:
      Path: One particular spiritual-development course or possibility.
      Way: An overarching orientation and group of concerns corresponding to one of
        five directions.
      Walk: Develop oneself spiritually along a Path.
      Walker: An elf engaged in this development.
      Follower: A Walker with magical aptitude who actively progresses toward Ascension.
      Seeker: A Walker lacking magical aptitude, seeking eventual magical rebirth
        to pursue the Paths as a Follower.
    narrator_stance: The fictional source narrator admits difficulty explaining these
      metaphysical beliefs in English and presents the system as the Danaan elven
      creed, not independently established real-world religion.
  mythic_narrative:
    attribution: The in-world account is described as a reinterpretation of the Tuatha
      de Danaan myth from The Battle of Moytura, within The Book of Invasions; its
      six verses are presented as sacred teaching for the fictional Danaan families.
    six_stages:
    - The Tuatha de Danaan lived in the Northern Islands, studying magic, druidic
      arts, and spirit knowledge until surpassing the pagan sages.
    - 'Their learning is connected to four cities: Falias, Gorias, Murias, and Findias.'
    - Falias provided Fal’s stone, Gorias Lugh’s spear, Findias Nuada’s sword, and
      Murias the Dagda’s cauldron.
    - The Tuatha allied with the Fomoire to enter the land of Tír na nÓg.
    - They sailed from the islands, took the Tír from the Firbolg, then burned their
      ships; their smoke is represented as mist obscuring their arrival.
    - The Tuatha lived many lives, walked the Ways and Paths through different times
      of day, and at the end of their lives returned as Bright Shining Spirits to
      the Northern Islands and Ascended to the cities.
  in_world_scholarly_interpretations:
    northern_islands: Interpreted as a metaplane where spirits dwell, not an agreed
      geographical location.
    four_cities: The narrator says the four cities represent states of mind rather
      than literal metaplanar towns; they serve as visualizations for meditation and
      spiritual deepening.
    arcana: Four symbolic sacred objects, called the Arcana, are associated with four
      of the five aspects; their symbolism is explained further under Mystic Aspects.
    fomoire: Interpreted as the mental/spiritual realm or alternative natural spirits;
      some elves accept aid from free spirits, elemental beings, and, controversially,
      ally spirits.
    firbolg: Treated by the fictional belief as land-bound people and a manifestation
      of the physical world; the narrator describes the belief system’s hierarchical
      attitudes toward other metatypes rather than endorsing them.
    claim_about_mana: An in-world comparison reports 7.8 percent of Tír elves as magically
      active versus 1 percent of other races; this is a fictional setting statistic,
      not a real population statistic.
    ships_and_mist: The account debates whether the ancient fleet is literal, symbolic
      of a metaplanar voyage, or imagery of water; burning ships symbolizes that elven
      return to their metaplane awaits fulfillment of purpose.
    wheel_and_ascension: The sixth stage connects eras of past, present and future,
      five Paths, and the Center Path of the Wizard or Rígh, followed by an end to
      reincarnation as a Bright Shining Spirit.
  forward_status: Verified forward source-review record, not indexed or credited as
    contiguous source authorization.
