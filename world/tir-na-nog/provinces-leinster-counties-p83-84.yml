  source_voice: "The fictional book narrator describes the province and counties; historical or legendary attributions are distinguished."
  province:
    name: "Leinster"
    gaelic: "Cuige Laighean"
    scope: "Eastern seaboard north toward Ulster; described as most prosperous and populous province, with commuter towns, transport links to Dublin and growing megacorporate headquarters."
  counties:
    -
      name: "Carlow"
      observations: "Small fertile lowland county; castle/hedges, town Carlow connected by navigable rivers to St Mullins and Muine Bheag; Tullow is the largest town and known for salmon and trout fishing."
    -
      name: "Dublin"
      observations: "City occupies more than half its county; suburbs, coastal resorts and inland farms; western fields rise toward the hills and the Meath border."
    -
      name: "Kildare"
      observations: "Crowded east-central county west of Dublin; River Liffey bisects it, Grand Canal links Liffey and Shannon, Bog of Allen lies north of Liffey, and Wicklow Hills rise in the southeast; Naas is county town and the Curragh is famed for horse racing."
      historical_claim: "The source recalls the powerful ancient kingdom of Uí Dúnlainge; some in-world residents believe Kildare should recover this importance."
    -
      name: "Kilkenny"
      observations: "Agricultural county south of Laois; Kilkenny city takes its name from Cill Chainnigh, Saint Canice's church, and holds an annual August cultural festival; Gowran hosts a racecourse and Callan stands southwest on the Kings River."
      historical_claim: "The source recounts Ossory, MacGiolla Phadruig/Fitzpatrick rule, Norman incursions, later Butler and Ormonde leadership, and a renewed FitzGerald-Butler rivalry."
    -
      name: "Laois"
      observations: "Slieve Bloom mountains border the south, Barrow and Nore waterways traverse lowlands; Portlaoise is county town with a notorious prison, Abbeyleix retains a Norman/French-derived name."
    -
      name: "Offaly"
      observations: "Bogland, Shannon River to the west, Slieve Bloom Mountains south, Bog of Allen northeast; Tullamore on the Grand Canal is county town and famed for whiskey."
      historical_claim: "The text recounts O'Connor kings, forced seventeenth-century relocation to Kerry and subsequent O'Carroll leadership."
    -
      name: "Wexford"
      observations: "South Leinster: Rosslare Harbour and ferry traffic, farmland, beaches, low hills; Wexford city is an ancient settlement associated with an October Opera Festival and a naval and intelligence station."
      historical_claim: "The book attributes an early local Celtic settlement to the Manapii."
    -
      name: "Wicklow"
      observations: "South of Dublin, hills, forests, glens and commuter north; Wicklow, Bray and Arklow are largest named towns."
      historical_claim: "The book recounts centuries of O'Byrne and O'Toole resistance from upland castles and says descendants retain political influence."
  forward_status: "Verified source-reviewed forward record; not indexed as authoritative contiguous source coverage."
