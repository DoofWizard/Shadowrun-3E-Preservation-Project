  narrator_reporting: The source states that Dublin media answers to the Arts and Culture Ministry’s Government and Information
    Services department, headed locally by junior minister Kieran Fitzgerald.
  broadcasting:
    institution: RTET corporation
    narrator_claim: Government-controlled entity administers and produces scattered Tír broadcasting offices, including
      Radio Dublin; its standard programming is described as generally bland.
  local_newspapers:
  - name: Dublin Standard
    description: Daily national/local newspaper owned by O’Toole publishing interests, described as highly pro-big-business.
  - name: Dublin Evening Press
    description: Advertising-focused tabloid with an extensive What’s On listing.
  - name: Inflame
    description: Underground collaborative performance-community newspaper distributed at fringe events; named speaker
      Cian Fear-Tearmainn alleges its possession violates Tír cultural-heritage laws.
  distinction: Comments alleging European broadcast reception loopholes, Hammer Party satellite broadcasts and Minister
    Fitzgerald’s motives are individual speaker claims; they are preserved in a separate attributed-claims record.
