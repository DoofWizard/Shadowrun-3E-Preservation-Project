  — fictional legal institutions, health and visitor economy'
summary: Archival world_fact reference from the FICTIONAL Shadowrun sourcebook Tir
  na nÓg, published by FASA Corporation in 1993, FASA7211/source.fasa-7211, printed
  pp19–22 (physical PDF20–23). Reported sourcebook setting facts are distinguished
  from named in-world commentary; mechanical quantities remain source-period exact.
data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog: FASA7211
    source_id: source.fasa-7211
    edition: original and Second Edition Shadowrun-era sourcebook
    printed_pages: 19-22
    pdf_pages: 20-23
  section: Law and Order / Health / Prices / On the Town; fictional 2050s national
    institutions, not actual Irish institutions.
  security_government_p19:
    policing: Garda portrayed as national police. Independent local police agencies
      and private security are forbidden under the setting description.
    tir_republican_corps: TRC is described as an interior-ministry arm with extensive
      police powers, separately from ordinary Garda; the text distinguishes their
      search and interception authorities.
    detention: An Oifigeach (officer of sergeant rank or above) may detain a person
      for up to 72 hours in specified national-interest cases without ordinary outside
      contact; a ministerial Petition for Protection may extend the period to 7 or
      14 days, subject to source-described court process.
    search_and_data: The setting says TRC can search/seize without normal warrant
      requirements while ordinary Garda generally require warrants; police can monitor
      telephone/data under broad authorities. These are fictional legal conditions,
      not instructions.
    jurisdiction: Cuirt Danaan jurisdiction over Danaan-family elves differs from
      ordinary courts; emergency laws affect Ulster.
  visitor_legal_assistance_p19:
    civil_defence_union: Civil Defence Union described as an organization offering
      defense-counsel resources in Belfast, Dublin, Derry.
    source_fictional_contacts:
    - Derry LTG#072-766765
    - Belfast LTG#022-311300
    - Dublin LTG#13-444546
    legal_insurance: Compulsory Legal Insurance Fund payment for entry, generally
      covering criminal but not ordinary civil legal representation; attorneys licensed
      and contingency arrangements prohibited.
  license_and_emergency_p20:
    pub_hours_weekdays: 10:30–15:00 and 17:30–23:00 outside specified exceptional
      locations; weekends may close at midnight; local rules vary.
    alcohol_driving_limit: The fictional legal blood-alcohol driving threshold is
      stated as 0.01%, not contemporary road safety advice.
    smoking: Tobacco is licensed and regulated; smoking/chewing is disallowed in public
      vehicles/buildings as depicted.
    btls: Possession/distribution of fictional Better-Than-Life chips is criminalized
      with severe penalties.
    emergency_number: 999; source describes tracking/routing systems.
  health_services_p20:
    national_health_service: A government national health system largely free for
      eligible citizens, except elective services; private medical clinics are generally
      illegal with narrow corporate exceptions.
    foreign_visitor_insurance: Visitors are required to obtain health insurance covering
      entire visit, with age/medical/cyberware-dependent risk assessment and no early-termination
      refund.
    consent_and_coercion: The compulsory visitor medical examinations, insurance and
      biometric measures are not described as voluntary choices.
  economy_accommodation_p21:
    relative_city_cost: Dublin is described as costing 5–10% more for merchandise
      and as much as 25% more for certain services than elsewhere; Ulster is variable.
    lodging: Single-room moderate accommodation typically £45–£80 per night excluding
      meals, double room approximately 50% more; Dublin typically 25% more; highest-priced
      executive suite up to £5000/night and can accommodate up to six people.
    hotel_privacy: Unverified allegations of telephone surveillance belong to the
      attributed-claims record, not narrator-established facts.
  source_quality: This data records what the 1993 fictional setting says. It should
    not be generalized to actual legal, insurance or health systems.
  forward_status: Reviewed before FASA7212 Denver because its cataloged PDF cannot
    render; NOT an activated FASA7211 source, NOT contiguous page authorization, and
    does not advance Aztlan manifest/checkpoint.
