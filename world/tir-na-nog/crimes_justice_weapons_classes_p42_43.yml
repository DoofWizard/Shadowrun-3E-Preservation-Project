data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog_number: FASA7211
    source_id: source.fasa-7211
    edition_scope: historical Shadowrun original/Second Edition publication
    printed_pages: 42-43
    physical_pdf_pages: 51-52
  criminal_law: Narrator reports no ordinary local laws apart from emergency provisions
    for Ulster, with national laws on criminal offenses; distinguishes possession,
    threat/danger and actual use. Transport alone is not a separate offense.
  rights_and_penalties: Permits a limited selection of personal weapons for defense,
    but excludes heavy/automatic weapons from that justification. Actual use is treated
    differently from intention and intoxication is not an accepted defense in this
    fictional legal system.
  judicial_discretion:
    fines_and_imprisonment_variation_percent: 50
    direction: Judges may increase or reduce standard punishment by up to fifty percent;
      narrator alleges more lenient treatment for elves and powerful Danaan family
      connections.
  restricted_items: Dealing in restricted items has imprisonment terms described as
    6 months to 20 years depending on item; some trafficking offenses carry maximums
    as high as 20 years.
  terrorist_org_membership: Membership in a proscribed organization is criminalized;
    minimum 2 years imprisonment, maximum indefinite detention described as beneficial
    to national security. The URF, NURF, INLA, Official IRA and disputed Unseelie
    Court appear in the fictional context. The in-world narrator explains some murder
    cases produce harsher sentences if membership in a proscribed organization is
    established.
  specific_code_labels:
    M1: Addictive controlled substances or biotechnical devices
    M2: Nonaddictive controlled substances excluding alcohol, possibly legal elsewhere
    CD: Unregistered cyberdecks and Matrix software
    N: Unregistered magical items such as fetishes, grimoires and spell foci
  source_limit: Numerical table entries are preserved exactly in separate protected
    rule_exact record; not modern real-world legal advice.
  forward_indexing_note: Verified forward-unindexed record while predecessor FASA7212
    Denver remains source-integrity blocked. No source activation, authority to advance
    a main manifest, or page credit.
