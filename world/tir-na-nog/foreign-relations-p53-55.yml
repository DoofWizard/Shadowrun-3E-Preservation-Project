    "economic_context": "Book reports foreign trade as 63 percent of fictional Tír GDP, despite its isolationist political culture.",
    "britain": "Book describes difficult relations with UK; Protestant paramilitaries and expatriate Irish people in Britain complicate relationships. Official ties are distant but thawed somewhat after election of the British Green Party. Government representatives exchange information on non-elven druids and elven groups, while the author alleges some British nobles sympathize with Tír. The book says right-wing Conservative supporters and certain Scottish Protestant groups provide funds, weapons and logistical support to Ulster terrorists despite British official disapproval.",
