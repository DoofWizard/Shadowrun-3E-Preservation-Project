summary: Archival world_fact reference from the FICTIONAL Shadowrun sourcebook Tir
  na nÓg, published by FASA Corporation in 1993, FASA7211/source.fasa-7211, printed
  pp13–16 (physical PDF14–17). Reported sourcebook setting facts are distinguished
  from named in-world commentary; mechanical quantities remain source-period exact.
data:
  publication:
    title: Tir na nÓg
    publisher: FASA Corporation
    year: 1993
    catalog: FASA7211
    source_id: source.fasa-7211
    edition: original and Second Edition Shadowrun-era sourcebook
    printed_pages: 13-16
    pdf_pages: 14-17
  section: FACTS AT YOUR FINGERTIPS / Travelling to the Tir / On Arrival / Money /
    Information and Media
  reported_visitor_climate_p13:
    favorable_season: Late May through September; temperate climate, westerly winds,
      occasional winter blizzards and severe snow.
    temperature_reported: January and February averages 11°C; July averages 21°C.
    humidity: Generally below 50%, exception Meath.
    precipitation: 30–50 centimeters of annual rainfall over most of country, as the
      original fictional tourism text states; wetter west/southwest.
    source_voice: Opening tourist narration followed by a separately attributed Analyzer
      response, not a real-world forecast.
  air_access_p14:
    international_passenger_airports:
    - Dublin
    - Shannon near Limerick
    cargo_ports:
    - Wexford
    - Cork
    - Dunmore
    domestic_airports:
    - Derry
    - Limerick
    - Killarney
    carrier: Aer Lingus is described as the only international carrier; foreign companies
      use interline/recriprocity arrangements; one-way travel prices are recorded
      separately.
  sea_access_p14:
    ferries: O’Toole Ferries serves several mainland/UK routes; prices separately
      indexed.
    ocean_liners: Describes King George or King Charles service Cork-Ringaskiddy to
      New York via Southampton, 6–7 days, separately priced.
  required_entry_p14_15:
    documents:
    - current passport
    - current visa issued by Office of Placements
    - proof of purpose and intended duration
    - current medical condition record
    - medical and legal insurance payment receipts
    - permits for regulated/classified items and licensed magic, as applicable
    medical_evidence: The printed source demands a recent medical report certified
      by qualified physicians, with an additional Tir-citizen doctor report or designated
      embassy medical examination in particular cases; entry medical status can affect
      insurance penalties.
    licenses_and_compulsion: The fictional government requires licensing for cyberware,
      classified equipment, controlled substances, and certain magic practice. Noncitizen
      arrivals are described as undergoing DNA typing/tissue sampling and an implanted
      removable location chip; the compulsory nature is not voluntary consent. The
      source says the implant is removed on request before departure.
    visitor_movements: Office of Placements and Garda registration/conditions control
      where visitors may travel; distinctive allegations by Paper Chaser are NOT narrator-established
      universal rules.
  currency_p16:
    name: Irish punt (symbol £), divided into 100 pennies; common note and coin amounts
      are described in the historical setting.
    coins: Copper denominations 1p, 5p, 10p; white metal 20p and 50p; copper £1 and
      £2; special rectangular £5 milch and £10 cumal ingots/bars (about 1 by 0.4 inches).
    banknotes: £5, £10, £20, £50, £100, £200, and £500; denominations have distinct
      colors and motifs.
    exchange: Fictional source cost tables use £2.20 per ¥1. Currency exchange bureaus
      described with variable commissions, 2.5% for large exchanges and 5% or more
      for small, with double foreign-currency surcharge.
    spending: Most shops accept punts; some accept British sterling/nuyen; US dollars
      generally not accepted.
  media_p16:
    tourist_bureau: £5 information packets from government Tourist Bureau; availability
      varied by province.
    broadcast: RTET operates four national radio stations and three trideo channels
      in the source period.
    newspapers:
    - Eireann Times
    - Irish Independent
    - Press Eireann
    - Sceal Danaan
    political_editorial_characters: The source describes government-supportive viewpoints
      and elite Sperethiel-language court reporting; these are source-period setting
      portrayals, not recommendations.
  reliability: Facts above are assertions by the sourcebook narrator for a fictional
    future nation. Contested claims and Shadowland replies are separately indexed.
  forward_status: Reviewed before FASA7212 Denver because its cataloged PDF cannot
    render; NOT an activated FASA7211 source, NOT contiguous page authorization, and
    does not advance Aztlan manifest/checkpoint.
