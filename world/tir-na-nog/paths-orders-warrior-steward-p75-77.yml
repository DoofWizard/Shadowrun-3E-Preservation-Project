headline: 'FICTIONAL Shadowrun tabletop RPG — FASA Corporation Tir na nÓg (FASA7211,
  1993 historical original/Second Edition), source.fasa-7211, printed pp75-77/PDF
  pp84-86: Paths and Orders: Warrior Cu Chulainn and Steward Etain organizations'
