      not a Third Edition conversion
    file_sha256: 8f43a61e0130466e7f707b9907e961945de4e9ae3a16cd3c88caac88ed523ee4
    printed_pages: 75-77
    physical_pdf_pages: 84-86
  general_order_structure:
    membership: The fictional source says a Path Follower is urged to join a matching
      magical order. A follower-initiated member gains access to group resources and
      metamagic, while a Seeker without magical aptitude remains at the lowest informal
      rank. Separate from family achievement and affiliation, these magical orders
      have no formal public titles or ranks in the book’s description.
    exceptional_mage_adept_paths: Magically active followers may normally be hermetic
      mages or adepts; the source explicitly excepts Warrior (adepts, not mages) and
      Rígh (mages, not adepts).
    paths_to_orders:
      Warrior: Order of Cu Chulainn
      Steward: Order of Etain
      Bard: Order of Brigid
      Druid: Order of Ogma
      Rígh: Order of the Sun, Moon, and Stars
  warrior_path:
    practitioners: The narrator says followers of the Warrior Path are combat-trained
      adepts charged with protecting the fictional Tír. Most Warrior initiates have
      roles in Tír security services or the TRC. Once admitted, breaking with the
      order is described as dishonorable and dangerous in-world.
    cu_chulainn_oath: An example Giving of Honour pledges defense of land and people,
      strength against their enemies and loyalty to Cu Chulainn; the printed oath
      is an in-world ritual sample, not directions for real action.
    order_practice: The secretive Order of Cu Chulainn favors nighttime rituals, earthy
      colors, angular Celtic insignia and meetings at sites of historical battles;
      it is depicted as stern and sometimes merciless. The narrator says the group
      summons earth elementals and uses combat ordeals.
    holy_dates: Alban Arthuan (December 21, winter solstice) and Imbolc (February
      2); the narrator links these ceremonies to winter and spring respectively.
    ordeal_content: The source gives fictional initiation ordeals involving severe
      personal danger, including assassinating a designated in-world terrorist, attacking
      a perceived foreign enemy of the Tír, or killing a marauding paranimal. These
      are source assertions about a fictional militant group, with no operational
      method prescribed.
    initiation: The source states that participation in a suitable ordeal leads to
      Grade 0 initiation and later advancement requires further personal demonstration;
      formal numerical group statistics are preserved in a separate rule_exact record.
  steward_path:
    practitioners: The narrator describes Stewards as facilitators of trade, agriculture,
      finance, diplomacy and public life who enrich the fictional nation, but notes
      some may work as spies or commercial agents overseas.
    etain_oath: The sample Giving of Honour invokes Etain, reason and the material
      prosperity of the homeland; recorded as a fictional oath, not a binding real-world
      pledge.
    order_practice: The Order of Etain forms loose networks of business-oriented members
      whose economic interests sometimes conflict. It has commerce-focused purposes,
      decentralized small meetings, limited ceremonial sorcery near dawn, eastern
      Air imagery, serpentine patterns and blues/yellows.
    holy_dates: Alban Eiler (March 21) and Beltane (May 1); the narrator says these
      mark spring and summer transitions for the order.
    ordeals: The narrator says Etain ordeals commonly involve business or commercial
      achievements, sometimes using in-world magic or clandestine influence; no real-world
      operational steps are supplied.
    stat_box: The order’s source-printed roster and individual/group strictures appear
      in the separate rule_exact record.
  forward_status: Verified forward source-review record, not indexed or credited as
    contiguous source authorization.
