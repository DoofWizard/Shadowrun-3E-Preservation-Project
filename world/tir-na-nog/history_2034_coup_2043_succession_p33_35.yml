  chapter: HISTORY conclusion; narrative explicitly voiced by fictional dissident
    Niall O’Connor.
  chronology_as_related_by_niall:
  - when: June 2034
    event: The fictional Irish state impeaches State President Charles McGoldrick;
      Niall alleges video surveillance of opponents, corruption and a strategy by
      Liam O’Connor and Seamus O’Kennedy to expose the president and manipulate the
      political response.
  - when: 11 December 2034
    event: The account says the elderly State President Eamonn McCarthy declares a
      state of emergency after pressure from Liam O’Connor, while the Dáil and Senate
      move toward constitutional changes.
  - when: Christmas 2034
    event: Seamus O’Kennedy gives a televised trid address promoting the fictional
      Tir identity, history, ecological restoration and national purpose; Niall treats
      it as a persuasive tool supporting constitutional change.
  - when: March 2035
    event: Eamonn McCarthy resigns citing ill health. Liam O’Connor becomes State
      President, Seamus O’Kennedy Minister of the Interior, and Thomas O’Brien Minister
      of State for Industry and Commerce.
  - when: '2042'
    event: Liam O’Connor wins election as High Steward in March. The account dates
      his marriage to Brane Deigh to about two years before his May 2043 disappearance.
  - when: May 2043
    event: Liam O’Connor, aged 64 according to this narrator, disappears from public
      life. His wife Brane Deigh later proclaims herself Rian (Queen) of the Seelie
      Court. Niall describes appointments of James O’Brien as State President and
      William O’Dunn as High Steward.
  political_reforms: Niall describes a consolidation of Senate and Danaan family powers,
    reduced Dáil and local government authority, and increased governmental influence
    over information and currency; the text distinguishes the security force, public
    institutions and private Danaan families.
  source_reported_conditions_2040s:
    average_annual_economic_growth_percent: 3.7
    period: 2040s
    reported_conditions: Growing economy, relatively low unemployment, strong education,
      healthcare and welfare, low pollution and public safety; Niall simultaneously
      criticizes Danaan domination and exclusionary ideology.
  certainty_limits: The unseen circumstances and motives of Liam O’Connor’s disappearance
    are explicitly unknown within Niall’s narrative. His Walking a final Path, secret
    family arrangements, and any planned future harm are speculation, not narrated
    certainties.
  forward_status: Verified forward extraction during unresolved FASA7212 Denver source-integrity
    block; does not activate FASA7211, authorize contiguous pages, or modify the completed
    FASA7213 manifest/checkpoint.
