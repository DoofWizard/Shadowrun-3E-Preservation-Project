  narrator_in_world_parentage:
    intermetatype_parents: The source narrator describes the fictional human and metahuman
      races as able to have children together, rather than separate species unable
      to reproduce.
    children_of_mixed_metatype_couples: The text says their child has one parent's
      distinct metatype; an elf and an ork, for example, may have an elf or ork child,
      not an intermediate half-elf/half-ork race created by mixing.
    same_metatype_couple_exception: The original source says a couple whose parents
      share the same metatype can still rarely have a child of another metatype, associated
      by the narrator with the setting's recent racial emergence; such outcomes are
      becoming less frequent.
    source_examples:
    - Two fictional human parents may have a child of a different metatype.
    - Two fictional dwarf parents or two troll parents may have a human child.
    usual_outcome: Most same-metatype couples have children of their own metatype.
  prohibited_inferences:
  - No fixed odds, inheritance table, genetic assay, GM die test or fertility rule
    is printed in this paragraph.
