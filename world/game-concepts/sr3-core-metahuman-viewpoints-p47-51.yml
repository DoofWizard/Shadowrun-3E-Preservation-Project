headline: 'FASA Corporation Shadowrun Third Edition FASA7001 fictional Game Concepts
  pp47-51/PDF48-52: five distinctly attributed metahuman viewpoints'
summary: Historical fictional-source transcript digest of five expressly bylined viewpoints
  in FASA Corporation Shadowrun Third Edition (FASA7001), printed pp47-51/PDF48-52.
  Their personal experiences, impressions, stereotypes and rumors are attributed to
  the speakers rather than converted into universal narrator facts or mandatory game
  modifiers.
