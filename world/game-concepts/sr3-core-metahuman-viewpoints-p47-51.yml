  printed_source_section: Game Concepts — bylined Metahuman Characteristics viewpoints
  bylined_in_world_speakers:
  - byline: Thaddeus
    source_heading: Dwarves
    in_world_role: Trid pirate and sometime decker
    printed_pages:
    - 47
    - 48
    physical_pdf_pages:
    - 48
    - 49
    epistemic_class: personal_account_and_opinion
    attributed_assertions:
    - Thaddeus describes daily difficulties and distinctive opportunities caused by
      being short in a city and workplaces designed for taller people, including counters,
      crowd sightlines and small passages.
    - He objects to reductive in-world stereotypes of dwarves as gold-obsessed storybook
      figures, and reports patronizing or intrusive reactions to dwarf children and
      adults in ordinary social encounters.
    - He characterizes the unequal treatment of dwarves as a source of irritation
      and social exclusion, while sometimes viewing small physical size as useful
      in particular fictional circumstances.
  - byline: Roweena
    source_heading: Elves
    in_world_role: Rigger
    printed_pages:
    - 48
    - 49
    physical_pdf_pages:
    - 49
    - 50
    epistemic_class: personal_account_and_opinion
    attributed_assertions:
    - Roweena describes a public expectation that elves be beautiful, gracious and
      somehow superior, which can isolate elves who do not meet or accept those expectations.
    - She reports prejudice, resentment, fetishization and romantic expectations affecting
      elves, including those living in poverty; she distinguishes the stereotype from
      ordinary individual lives.
    - She mentions rumors about exceptionally long-lived elves and a hidden elven
      conspiracy as beliefs voiced by others, not as corroborated historical facts.
      Her narrative challenges such claims.
  - byline: Jason
    source_heading: Humans
    in_world_role: Street samurai
    printed_pages:
    - 49
    - 49
    physical_pdf_pages:
    - 50
    - 50
    epistemic_class: personal_opinion_and_observation
    attributed_assertions:
    - Jason observes that human bodies and social conventions are often treated as
      the default, making normal access and workplace design harder for other metatypes.
    - He discusses majority advantage, resentment and hostility between fictional
      human and other metahuman communities, including people who oppose the collective
      term metahuman.
    - Jason argues that fears and prejudices can persist even when individuals consciously
      reject them; he offers a personal interpretation rather than a game rule about
      every human.
  - byline: Stella
    credited_publication_or_affiliation: Star
    source_heading: Orks
    in_world_role: Mage
    printed_pages:
    - 49
    - 50
    physical_pdf_pages:
    - 50
    - 51
    epistemic_class: personal_account_with_historical_claims
    attributed_assertions:
    - Stella describes fictional orks being stereotyped as violent or unintelligent
      and receiving unequal treatment in employment, education, communities and policing,
      while objecting to those generalizations.
    - Her account refers to the mass goblinization of April 2021 and subsequent persecution
      and social displacement as formative experiences for the ork community.
    - She describes pressure toward separation and distinct community organization,
      while questioning whether wider society will readily grant equal acceptance;
      these are her assessments.
  - byline: Daniel
    source_heading: Trolls
    in_world_role: Bear shaman
    printed_pages:
    - 50
    - 51
    physical_pdf_pages:
    - 51
    - 52
    epistemic_class: personal_account_and_opinion
    attributed_assertions:
    - Daniel rejects the claim that trolls' large bodies imply low intelligence or
      inherent aggression, and describes such public attitudes as unfair stereotypes.
    - He reports that fictional furniture, doorways, vehicles, hotels and employment
      settings are often made for smaller bodies, with associated exclusion from housing
      and everyday services.
    - He describes how employment exclusion, hostile public reactions and social pressure
      can constrain trolls' choices, while some people perform the stereotypes expected
      of them; he distinguishes his observations from universal facts about trolls.
