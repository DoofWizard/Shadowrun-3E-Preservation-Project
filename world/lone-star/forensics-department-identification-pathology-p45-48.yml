data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog: FASA7115
    year: 1994
    setting: fictional Shadowrun tabletop role-playing game
    edition: original and Second Edition compatible
  source_anchors:
  - {printed_page: 45, pdf_page: 45, heading: Department of Forensics introduction}
  - {printed_page: 46, pdf_page: 46, heading: Identification Section}
  - {printed_page: 47, pdf_page: 47, heading: Forensic Pathology Section}
  - {printed_page: 48, pdf_page: 48, heading: Medical-legal autopsy and legal versus estimated time of death}
  organizational_role:
    parent: Lone Star Division of Investigation
    establishment: The sourcebook narrator identifies a separate Forensics Department, with a full-service laboratory in Austin, Texas.
    reputation: The narrator calls the Austin facility one of the leading forensics laboratories in the setting, surpassed only by the UCAS FBI laboratory in Washington.
    local_laboratories: Most Lone Star offices use local laboratories for ordinary forensic evidence. Cases those labs cannot evaluate are sent to Austin.
    sections:
    - Questioned Documents
    - (Meta)Human Identification, including fingerprints and DNA sampling
    - Ballistics and Firearms Investigations
    - Toolmarks and Fibers
    - Forensic Chemistry and Biochemistry
    - Forensic Toxicology
    - Forensic Photography
    - Forensic Pathology
    separately_assigned_specialties:
      forensic_thaumaturgy: Division of Paranormal Investigations oversees magical forensic work.
      forensic_technomancy: Division of Matrix Security oversees forensic technomancy.
  identification_section:
    function: Identification officers and crime-scene technicians gather and preserve physical evidence and coordinate crime-scene investigation for Forensics.
    mobile_units: Mobile Crime Scene Units commonly use Bulldog Step-Vans equipped for evidence identification, collection, storage, and transport.
    evidence_scope: The narrator describes physical objects, marks, impressions, and other trace evidence; Identification collaborates with Forensic Thaumaturgy and Matrix Security personnel where relevant.
    source_boundary: The first-person lengthy practical discussion on printed pp46-47 belongs to a named in-world speaker, Dirk, and is not an independent narrator-verified procedure or a Shadowrun dice rule.
  forensic_pathology_section:
    scope: Under suspicious circumstances, the section performs medical-legal autopsies, supplies court-usable findings, and informs a local coroner's death-certificate decision.
    investigation_categories:
    - accidental deaths
    - murder
    - suicide
    - deaths under suspicious circumstances
    - death in police custody
    - deaths during medical or biotechnology procedures
    - death attributed to magical assault
    - death while connected to the International Telecommunications Grid or an independent network
    - otherwise unexplained death
    jurisdiction: Lone Star normally conducts medical-legal autopsies for its own investigations but sometimes accepts cases from regional or federal police or other corporate security services, billing the originating organization.
    described_autopsy_scope: Source-era fictional pathologists document identity, external and internal findings, photographic and imaging records, tests and samples, cyberware inventory, and a bonded Lone Star mage's astral examination before reporting cause of death.
    completion: Completed medical-legal findings go to the local coroner, who records the official cause of death and issues the certificate; the body is then released for burial or cremation.
    clearance: Homicide members are given high-level access to Forensics records and facilities because the two departments work closely.
    time_of_death_distinction: The book separates legal time of death, when the body is found, from estimated actual time of death; its technical discussion continues beyond printed p48 and is not fully extracted into this organizational record.
  context_boundary:
    facts: The above institutional details are presented by the source narrator as events or organizational claims in a fictional 2050s setting.
    speaker_claims: Dybuk, Dirk, Raven, Rest, YT, Boxer, Zig, Argent, Moxie and an uncredited advertiser make distinct fictional in-world claims across these pages; preserve those in a separate attributed record.
    real_world_limit: This is historical game-world reference, not present-day law, forensics advice, or independently confirmed external science.
