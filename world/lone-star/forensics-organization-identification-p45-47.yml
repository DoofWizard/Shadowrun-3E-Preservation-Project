  source_narrator_dept:
    organizational_scope: The fictional Lone Star corporation created an independent Department
      of Forensics with its own central forensic laboratories in Austin, Texas.
    reputation: The narrator describes the central labs as among the best in the Sixth World,
      exceeded by the fictional UCAS FBI facilities in Washington.
    local_escalation: Local offices use their own laboratories for scene material, forwarding
      items beyond those facilities' analytical abilities to the central Austin labs.
    local_lab_functions:
    - Questioned-document analysis
    - Metahuman identification, including fingerprints and DNA sampling
    - Ballistics and firearms examination
    - Toolmark and fiber analysis
    - Forensic chemistry and biochemistry
    - Forensic toxicology
    - Forensic photography
    pathology: Each Lone Star lab handles its own forensic pathology matters.
    other_division_responsibilities: The fictional Division of Paranormal Investigations oversees
      magical forensics; forensic technomancy is under the Division of Matrix Security.
  identification_section:
    office_scope: In each Lone Star office the Forensics Department assigns an Identification
      Section to scene examination and preservation of physical evidence.
    personnel_names: Employees are described as identification officers or crime-scene technicians.
    working_environment: They travel to crime scenes, using Mobile Crime Scene Units also called
      Bulldog Step-Vans with identification and evidence-storage equipment.
    source_examples: The narrator describes work on weapon traces, fibers and footwear impressions,
      and requiring coordination with the fictional Forensic Thaumaturgy and Matrix Security specialists.
    procedure_status: This is a sourcebook depiction of fictional occupational roles, not a
      real-world field handbook or independently verified crime-scene protocol.
  forensic_pathology_entrance:
    role: The Forensic Pathology Section investigates deaths classified as suspicious and produces
      medical-legal autopsy findings for in-world courts and coroner documentation.
    listed_case_categories:
    - Accidental deaths
    - Homicide
    - Suicide
    - Suspicious or unexplained death
    - Death in police custody
    - Death during medical or biotechnology procedures
    - Death attributed to magical assault
    - Death while connected to the International Telecommunications Grid or another Matrix system
    service_boundary: Generally handles cases Lone Star itself investigates; other police and
      corporate-security authorities may sometimes transfer cases and pay Lone Star for services.
    formal_death_reporting: A completed medical-legal autopsy informs the local coroner's
      cause-of-death certification; subsequent release for burial or cremation is described on p48.
  authority_boundary: Historical fictional book-narrator organization and jurisdiction facts. Named
    2054 Shadowtalk allegations about political rivalry, contractor outsourcing and forensic
    departmental billing are separate attributed records. Detailed pathology and death-estimation
    discussions extend into printed pp48-50 and are not claimed complete here.
