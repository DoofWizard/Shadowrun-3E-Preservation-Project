  department: Lone Star Department of Organized Crime
  founding_date_as_printed: 2044
  founding_context: The fictional source narrator says that, during the late 2030s
    and early 2040s, organized-crime groups grew influential in various Lone Star
    jurisdictions. Previously, Homicide, Vice, and Robbery units took such cases in
    the ordinary course.
  agency_and_authority: The book attributes the decision to create a specialized organized-crime
    department to CEO James Wilson, rather than the board’s earlier preference for
    expanding existing departments. The board objected to the expense; the narrator
    does not supply a complete account of its deliberation.
  mission: The department coordinates investigations and responses to major organized
    groups such as gangs, Mafia organizations, the yakuza, Seoulpa Rings and other
    fictional criminal enterprises.
  rumered_future_unit: The book explicitly identifies a proposed Seattle task force
    addressing growing Triad influence as a rumor, not an established operational
    unit.
  organization:
    task_force_approach: The department assigns a task force to each major problem
      or organization.
    regular_staff: Management personnel, case officers sometimes given the internal
      designation special agents, and administrative personnel.
    requisitioned_resources: Task forces temporarily requisition personnel, investigative
      or street resources, computer access, forensic and analytical services from
      other Lone Star enforcement divisions and departments.
  undercover_network: Although borrowed staff furnish ordinary investigative resources,
    the book describes the department’s separate network of undercover personnel embedded
    in fictional criminal organizations. It portrays some operatives as destabilizing
    those groups from within; this is a setting description, not real-world operational
    guidance.
  attribution_boundary: Budget figures, assertions about specific managers and corporate-board
    pressure, task-force influence, and alleged insider knowledge are opinions or
    claims of named fictional forum speakers on pp53-54, preserved separately.
