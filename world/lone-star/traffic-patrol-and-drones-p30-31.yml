  department: Department of Traffic Patrol
  narrator_operations:
    duties: Enforces speed, safe-driving, parking rules and helps direct vehicle flow
      using helmet cameras and drone types.
    officer_cameras: A video camera is embedded in the lining of a standard-issue
      Lone Star helmet near the officer’s left temple; the source describes evidence
      use in accidents and violations.
    stationary_and_autonomous_radar: Fixed radar drones identify speeders; their integrated
      cameras read vehicle barcodes and issue tickets through cellular LTG connections.
      The narrator says interference with a drone’s radar triggers a barcode scan
      and a maximum-speeding fine plus an additional restricted-equipment fine.
    condor_radars: The common airborne radar drone is the inexpensive AeroDesign Systems
      Condor gas-bag drone. It is more expensive than a fixed radar system and deployed
      at higher-risk accident locations; task-specific sensors are intended for speed
      enforcement, not general surveillance.
    signal_drones: Portable automated traffic guidance drones display high-visibility
      signs and semaphore arms. They direct traffic away from accidents, violence,
      destroyed traffic lights and other obstructions.
  source_limits: Aero’s suggested game-system color/rating for signal drones, Ringer’s
    statement about taser-like guards, and Gear-Jammer’s sensor commentary are speaker
    claims, not book-narrator-certified mechanics.
