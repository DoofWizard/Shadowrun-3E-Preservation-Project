  division_of_penology:
    source_book_narrator: The printed division introduction describes an administrative
      Lone Star unit that works closely with the UCAS and CAS corrections departments,
      providing consulting and rehabilitative support.
    in_world_tracking: According to that introduction, the division also keeps track
      of people whom Lone Star cannot keep incarcerated.
    only_named_department: Department of Parole and Probation is identified as the
      sole departmental subdivision of the Division of Penology.
    scope_boundary: These are 2054 fictional setting descriptions, not a statement
      about real correctional agencies.
  penal_theory_source_editorial_exposition:
    narrative_voice: The unsigned, conversational in-book penal-theory exposition
      makes historical and policy claims; they are preserved as what the FASA book
      says, not independently verified real-world scholarship.
    jurisdictional_variation: The exposition places UCAS, CAS, Québec and NAN justice
      systems in a loose British-common-law lineage while distinguishing Aztlan and
      individual corporate jurisdictions; it expressly warns that practices vary across
      jurisdictions.
    fictional_aztlan_description: The text alleges that Aztlan regards prisons as
      economically wasteful and instead uses harsh confinement, forced labor and corporal
      punishments; this is the sourcebook’s setting characterization, not an external
      factual claim.
    illustrative_penal_history: The exposition contrasts retaliatory or symbolic historical
      punishments with imprisonment and later rehabilitation, mentioning Hammurabi,
      16th-century English workhouses, transportation of convicts and penal colonies,
      and the introduction of incarceration in British common-law practice.
    specific_early_statistical_claims_as_printed:
      1971_inmates_mentioned: 180000
      1986_inmates_more_than: 500000
      2002_inmates_more_than: 700000
      qualifier: Numbers are reported by the sourcebook’s editorial voice as part
        of its historical account and are not independently authenticated here.
    security_and_cost: The text attributes escalating prison costs to overcrowding,
      violence, medical conditions, cyberware and magic, including the asserted need
      for secure facilities and guards able to supervise magically capable prisoners.
    transferred_custody_responsibility: The source describes UCAS and CAS federal
      authorities shifting responsibility for people awaiting trial, appeals, and
      sentences shorter than two years to state, municipal and county authorities.
    emerging_rehabilitation: The section says corrections policy increasingly emphasizes
      life-skills workshops, psychotherapy, group therapy and other rehabilitative
      programs, without establishing their effectiveness.
  attribution_boundaries:
    named_forum_claims: references/lone-star/penal-theory-shadowtalk-p72-74.yml
    next_distinct_topic: The first-person MENTAL TECHNIQUES section begins on printed
      p74; its coercion and speculative claims are treated in separate attributed
      records.
    mechanics: No dice tests, target numbers, game modifiers, equipment statistics
      or procedures occur in this extracted natural section.
