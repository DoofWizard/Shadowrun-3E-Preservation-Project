data:
  publication:
    title: Lone Star Sourcebook
    publisher: FASA Corporation
    catalog: FASA7115
    publication_year: 1994
    edition: historical Shadowrun original/Second Edition (p5 compatibility statement)
    medium: fictional cyberpunk tabletop role-playing game
  source_anchors:
  - printed_page: 70
    pdf_page: 70
    heading: DIVISION OF ADMINISTRATION; PUBLIC RELATIONS DEPARTMENT
  - printed_page: 71
    pdf_page: 71
    heading: PUBLIC RELATIONS DEPARTMENT continued; PERSONNEL DEPARTMENT; DEPARTMENT
      OF RECORDS
  division_administration_narrator: The book describes Administration as handling
    large volumes of information, communications between field headquarters in different
    cities, personnel-file updates and substantial criminal records; its specialized
    departments are not all described in this section.
  precinct_support: The book says office and precinct administration is tailored to
    local requirements while supporting interdepartmental communication and ready
    access to information. Each Lone Star precinct has Public Relations, Personnel
    and Records functions.
  public_relations_narrator: The narrator credits public relations with supporting
    police enforcement contracts by managing public goodwill among community, corporate
    and municipal figures; the department has funding and professional staff whose
    work can improve the public appearance of company actions.
  personnel_department_narrator:
    responsibility: Maintains staff files across departments and divisions. A file
      contains employee credentials, commendations, official reprimands (black marks)
      and a slide number.
    reprimand: The narrator describes a black mark as a reprimand when an officer
      violates procedure or a superior wishes to imply a fault; five black marks terminate
      the officer’s enforcement career.
    commendation: The narrator says exceptional bravery or effective criminal investigation
      theoretically earns a commendation that erases one black mark, but emphasizes
      this rarely works that way in difficult superior-officer disputes.
  records_department_narrator: The department maintains extensive charge and conviction
    records for persons within Lone Star jurisdiction, claims priority access to federal
    records in its covered countries and maintains barcode records of private and
    corporate property insured by Lone Star Insurance Corporation and subsidiaries.
  attribution_boundary: Criticism of public relations, claims about slide numbers
    and tissue samples, tissue preservation as magical links, insurance profit, and
    a Tir Tairngire scientist’s alleged offenses appear in named, dated fictional
    Shadowland posts. These are preserved in a separate attributed-claim record and
    not stated as narrator facts.
  mechanics_boundary: The page describes fictional administrative practices and five-black-mark
    personnel consequences, but prints no dice-pool, test TN, equipment-stat line
    or separate tabletop procedure; do not invent a Shadowrun Third Edition mechanic.
headline: Fictional Shadowrun Administration, PR, Personnel and Records — FASA Corporation
  Lone Star Sourcebook (FASA7115, 1994), original/Second Edition, printed pp70–71/PDF70–71
summary: Historical narrator-established fictional corporate administrative structure,
  personnel files, five-black-mark consequence, commendation qualifier and Records
  department; separate from dated allegations. FASA Lone Star pp70–71/PDF70–71.
