    heading: DED enforcement culture, strike teams and investigator autonomy
  organization: Drug Enforcement Division (DED)
  period: Late 2032 to 2054 setting era
  reorganization: Clay Wilson reorganized the division as part of Lone Star municipal-policing services, retaining the old DEA data and selected
    personnel and equipment, with a contracted role in drug and BTL-chip offenses.
  operational_scope: Narrator characterizes DED as paramilitary, with specially equipped and trained teams intended to confront drug and
    chip-laboratory incidents and distribution facilities.
  comparative_training: Book compares some strike squads with Lone Star FRT and SWAT teams while describing DED troopers as only somewhat
    less lethal.
  investigator_discretion: Narrator says DED investigating officers have unusual autonomy; a DED investigator may call out a trooper squad
    without obtaining higher approval in advance.
  workforce_culture: Book characterizes DED officers as proud of independent authority and notes antagonism with other Lone Star departments
    that can affect case cooperation.
  strategic_limit: The narrator says the supply-focused DED approach has not solved the underlying fictional drug and BTL demand problem.
  attribution_boundary: Specific embezzlement/expense-account and corrupt-activity comments, force reputation, street chip names, and case
    anecdotes occur in separate dated speaker posts.
  mechanical_boundary: No official DED unit stat line, troop rating, damage code, dice pool or TN is printed in this narrative slice; do
    not infer any from generic FRT or SWAT comparisons.
