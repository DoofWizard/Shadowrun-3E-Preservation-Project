    heading: CORPORATE SECURITY DIVISION
  fictional_narrator_facts:
    organization: Lone Star Security Services
    division: Corporate Security Division, or CorpSec
    history: The source narrator calls CorpSec the only Lone Star division virtually
      unchanged since Clay Wilson began building the organization. This describes
      broad continuity, not an assertion that no changes ever occurred.
    original_purpose: Clay Wilson originally planned Lone Star Security Services to
      supply security personnel to corporate clients; the narrator says CorpSec still
      performs that role.
    training_scope: CorpSec personnel are trained as firearms experts and in hand-to-hand
      combat, with some surveillance and rudimentary police-procedure training.
    academy_distinction: Unlike the Enforcement Arm’s street personnel, CorpSec officers
      do not take the 16-week Lone Star Academy course.
    local_training: Instead, the narrator describes a two-week training program at
      their local Lone Star precinct house.
  attribution_boundary: Six dated in-world Shadowland comments on CorpSec placement,
    internal transfers, comparative quality, and Military Liaison belong in a separate
    attributed-claim record; the narrator does not independently verify those comments.
  image: Printed p87/PDF95 includes a large monochrome fictional action illustration
    of an armored Lone Star officer confronting another figure; the image alone establishes
    no named identity or game statistics.
  mechanics_boundary: The section supplies organization and training-duration facts
    but no weapon statistics, combat modifiers, tests, costs, legality or Third Edition
    conversion.
