  tactical_division:
    name: Lone Star Tactical Division
    abbreviation: TacDiv
    departments_as_printed:
    - Special Weapons and Tactics (SWAT)
    - Department of Demolitions
    - Riot Control
    - Dispatch
    - Irregular Assets
    scope: The sourcebook identifies these as distinct organizational components,
      not all interchangeable SWAT units.
  special_weapons_and_tactics:
    full_name: Special Weapons and Tactics
    abbreviation: SWAT
    printed_operations_manual_summary: Lone Star's fictional operations manual assigns
      SWAT high-risk situations where coordinated tactics are intended to minimize
      collateral damage; the narrator describes situations threatening noncombatants
      and corporate image.
    relationship: Distinct from the Division of Patrol's Fast Response Teams, with
      a history of jurisdictional rivalry described earlier in the same source.
    standard_team:
      personnel_total: 16
      assigned_roles:
      - role: riflemen
        count: 8
      - role: combat decker
        count: 1
      - role: combat mage
        count: 1
      - role: snipers
        count: 4
      - role: spotters
        count: 2
      total_check: 8+1+1+4+2 = 16 personnel, directly reflecting the printed roster
        without inferring game statistics.
    training: The book narrator describes intensive simsense-based tactical training
      intended for coordinated small-unit action, which SWAT personnel do not uniformly
      concede may be less representative than real scenarios.
    usual_transport:
      vehicle: Chrysler-Nissan G12A hovercraft
      modifications_as_printed:
      - Sophisticated communications suite
      - Three rack-mounted spotter drones
    specialization: Unlike Fast Response Teams, SWAT personnel tend to remain specialists,
      with snipers serving sniper roles and riflemen serving rifle roles; narrator
      calls this limited cross-training.
    limits: This is source-era fictional organizational background and inventory,
      not a modern law-enforcement training manual or a complete set of Shadowrun
      Third Edition rules.
