  department: Department of Air Patrol
  source_narrator:
    function: Lone Star air patrol officers perform patrol functions similar to auto
      patrol, faster and generally carrying greater firepower.
    crew_and_craft: Most fly single-seat rotorcraft, usually Northrop PRC-50F Wasp
      or Yellowjacket models; this allows a strong airborne presence with relatively
      few personnel.
    rigging: Nearly all air-patrol officers are riggers, according to the narrator.
    drones: Air-patrol officers with the necessary augmentations also operate about
      two hunter or surveillance drones during a shift, slaved to their vehicle control
      rigs, flying alongside or carried by the patrol craft.
  separation: SPD and Clutch offer attributed claims about implants, incentives and
    purchasing choices; those remain a separate record.
