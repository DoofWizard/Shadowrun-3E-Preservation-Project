    heading: Tissue Archives
  policy_as_narrated:
    employer: Lone Star
    affected_people: All employees, from street operations and administration to corporate
      executives
    condition: Blood and tissue samples are mandatory conditions of employment.
    collection: All employees must provide blood and tissue samples to the corporation.
    storage: The company flash-freezes samples and keeps them in a secure vault.
    refusal_consequence: An incoming employee refusing to provide samples immediately
      loses the job.
  official_corporate_explanation: 'Lone Star represents this compulsory policy as
    an employee-health measure: if an employee is injured in the line of duty, the
    company may supply matched blood, tissue-typing data, and DNA samples to the hospital
    providing care.'
  narrator_limit: The narrator reports the mandatory condition, cold storage, claimed
    medical purpose and employment consequence. Alleged covert identification, magic
    rituals and security vulnerabilities are speaker-attributed and separately classified,
    not established institutional policies.
  consent_distinction: Submission is a coerced employment requirement rather than
    a purely voluntary personal donation.
  edition_rules_boundary: No game-system sample-procedure dice test, success threshold,
    cost, equipment rating or Third Edition upgrade is printed here.
