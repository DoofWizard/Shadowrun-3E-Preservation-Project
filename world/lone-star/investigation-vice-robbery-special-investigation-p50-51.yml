data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog: FASA7115
    year: 1994
    game: fictional Shadowrun tabletop role-playing game
    edition: original/Second Edition compatible
  source_anchors:
  - {printed_page: 50, pdf_page: 50, heading: Department of Vice and Morality; Department of Robbery}
  - {printed_page: 51, pdf_page: 51, heading: Department of Robbery continuation; Department of Special Investigation}
  organizational_parent: Lone Star Division of Investigation
  vice_and_morality:
    case_scope:
    - prostitution
    - rape
    - domestic abuse
    cross_department_work: Personnel frequently work with Homicide, Robbery and Drug Enforcement.
    victim_support: The source narrator emphasizes that victims may need more assistance than offenders; the department has access to crisis hotlines, resource centers and outreach programs.
    organizational_status: The narrator says Lone Star's militarized corporate culture undervalues emotional support and Vice's less visible work.
    occupational_pattern: Long-tenured Vice investigators may become cynical; the narrator says investigators with less capacity to cope sometimes transfer or retire after roughly one or two years, while others serve many years.
  robbery:
    primary_scope: Investigates robberies and seeks recovery of stolen property.
    investigative_method_as_narrated: Relies on informants, investigative contacts, case paperwork, computer records, serial numbers, barcodes and commercial distribution information; criminal conspiracies crossing other departments' jurisdiction are reassigned.
    source_specific_jurisdiction: Organized criminal activity, illicit BTL dealing and prostitution rings may appear in robbery inquiries but are normally turned over to the appropriate division after recognition.
    property_handling: Recovered property becomes evidence, cataloged by the Department of Records and transferred to federal safekeeping until a court proceeding ends, then returned to its rightful owner if established.
    source_status: The narrator describes Robbery as under-resourced, less prestigious and less profitable than Vice because its activity is less visible and does not directly generate much corporate revenue.
  special_investigation:
    role: Catchall investigative department for cases not within another department's scope and for cases requiring multi-department cooperation or long-term undercover investigation.
    private_contracts: Handles one-time private inquiries for organizations and individuals seeking Lone Star personnel.
    staffing: Special Investigation solicits suitable officers and investigators from other departments rather than maintaining an entirely separate large assigned workforce for each contract.
    contract_outcome: If necessary personnel cannot be made available, the organization refers the prospective client to another security provider and receives a small referral commission.
    distinction: The source expressly distinguishes temporary Special Investigation contracts from the long-term security engagements of the separate Corporate Security (CorpSec) arm.
  authority_boundary:
    narrator: These are in-book fictional organizational descriptions, not present-day real-world police practices.
    attributed_speakers: X-Star, Imager, Binky, Bonejolt, Hangover, SPD, Blue Light, Jax and Montage offer distinct fictional commentary on these departments, which is preserved separately.
    mechanics: No original dice rolls, damage codes or game-rule conversion is introduced in the reviewed two-page institutional narration.
