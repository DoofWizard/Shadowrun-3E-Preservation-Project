summary: Chronological account of fictional Lone Star’s original veteran recruitment,
  early two-week training, 2004 academy acquisition, eleven academies total, and later
  sixteen-week course. Fictional FASA Lone Star Sourcebook, FASA7115 (1994), original/Second
  Edition, printed pp91-93/PDF pp99-101.
