data:
  publication:
    title: Lone Star Sourcebook
    publisher: FASA Corporation
    catalog: FASA7115
    publication_year: 1994
    genre: fictional Shadowrun cyberpunk tabletop role-playing game
    edition: original/Second Edition historical source; no inferred SR3 conversion
  source_anchor:
    printed_pages: 91-93
    pdf_pages: 99-101
    heading: Recruiting and Training
  narrator_earliest_recruiting:
    founder: Clay Wilson
    approach: The fictional narrator attributes recruitment preferences to Wilson’s
      militaristic attitude about policing, prioritizing candidates’ attitude and
      military bearing over prior criminology knowledge.
    early_recruit_pool: Mostly young United States Army veterans recently out of service
      who sought another career.
    early_course: Initially a two-week introductory course covering criminology and
      police procedure; sometimes omitted during urgent hiring.
  professionalization:
    reason: Growth in municipal contracts and service responsibilities drove demand
      for recruits trained in police procedure and criminology.
    academy_acquisition_context: In the fictional 2004 institutional chronology, Lubbock
      disbanded its municipal police department and the State of Texas phased out
      South Plains Police Academy facilities near Lubbock in favor of consolidated
      training based in Houston and Dallas/Fort Worth.
    founder_offer: Wilson offered to take South Plains Police Academy training materials,
      AV, furniture and staff; offered academy staff five-year contracts if they moved
      to Austin and established the institution on Lone Star-owned facilities.
    rejection_rate: About 25 percent of academy faculty and staff declined the offer,
      largely unwilling to work for a corporation; remaining staff accepted amid poor
      regional employment prospects.
    first_academy: The first Lone Star Academy opened on Burnet Road within nine months,
      with a sixteen-week introductory course.
  additional_academies:
    count: 10
    cities:
    - Milwaukee
    - New York
    - Philadelphia
    - Baltimore
    - Macon
    - Jackson
    - Shreveport
    - Memphis
    - Louisville
    - Seattle
    timing: Subsequently established as the corporation expanded.
  modern_curriculum:
    duration_weeks: 16
    subject_emphasis:
    - criminology
    - psychology
    - basic anthropology
    - sociology
    - relevant technical subjects
    combat_comparison: The narrator describes less emphasis on combat than the corporation’s
      earlier training.
  later_recruitment: The narrator says military veterans remain the largest recruitment
    source, but by this point Lone Star also courts university and college graduates.
  editorial_boundary: The narrator does not establish that the recruitment or weapon-certification
    allegations printed in Shadowtalk are actual corporate policy. No RPG dice-roll
    target number or equipment stat is printed in the narrator’s section.
headline: Fictional Shadowrun tabletop RPG — Recruiting and Training; FASA Corporation
