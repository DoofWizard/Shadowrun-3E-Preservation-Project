    heading: Department of Demolitions (narrator)
  organization:
    name: Lone Star Department of Demolitions
    parent: Lone Star Tactical Division
    narrator_role: Fictional bomb response and explosives-threat department; the narrator
      describes urban terrorism and public bomb threats as serious corporate-policing
      business.
    portrayed_threat_environment: The narrator refers to extremist groups, heavy weapons,
      and compact explosives as concerns of urban response teams; no actual specific
      attack is thereby independently documented.
    commercial_assessment: The narrator calls the Demolitions Department a source
      of corporate revenue in response to heightened demand.
    activation: The source says squads are dispatched on suspected or actual explosive
      threats, including reports involving unattended parcels or vehicles and telephoned
      or televised bomb threats.
    public_security_context: In the fictional setting, Lone Star and federal governments
      respond with inspections on demand in dense commercial districts, restrictions
      on street parking, and surveillance drones used to observe public spaces.
    uncertainty_boundary: The narrator explicitly says incidents still occur despite
      these policies; the measures are source-era fictional claims, not modern public-safety
      recommendations or game-resolution procedures.
