  authority: Unattributed in-world sourcebook narrator. All procedures and legal predicates are fictional
    setting descriptions, not real-world legal guidance or Shadowrun 3E game tests.
  deathbed_statement:
    legal_role: Described as an exception permitting a dying victim’s testimony to be heard after
      death despite ordinary common-law evidentiary difficulties.
    jurisdiction: Derived from English common-law practice, with an explicit possibility of different
      law in the fictional Republic of Québec.
    knowledge_condition: The speaker must actually know they are dying; if that awareness is uncertain,
      the officer is described as ensuring the speaker understands their condition before a statement
      is taken.
    death_condition: After the statement the speaker must in fact die for the special deathbed-statement
      status described to apply.
    testimony: An officer may later testify in court as to what the deceased said.
  searches:
    federal_standard: The text attributes authority to a federal officer to search a public or private
      area with probable cause, expressly calling that standard elastic and subject to the circumstances.
    lone_star_public_space: Lone Star officers may search public places without a warrant.
    lone_star_private_space: The private corporation’s officers are described as needing a search
      warrant from a federal bureau before searching private property.
    corporate_extraterritorial_exception: Lone Star officers are described as unable to search corporate
      property under this rule; the source says FedPol or FBI investigators with proper documentation
      may investigate corporations.
  search_warrant:
    supporting_affidavit: The officer’s claimed reason, expected evidence and the significance of
      that evidence are presented in an affidavit prepared in duplicate.
    copies: The narrator describes a triplicate warrant, together with the affidavit, submitted to
      a judge; the signing judge retains an affidavit copy.
    judicial_review: The fictional judge evaluates the written probable-cause showing before signing.
    knock_or_no_knock: The narrator distinguishes ordinary announced service from a requested no-knock
      order where delay is believed likely to permit evidence destruction.
  mechanical_boundary: No skill dice pool, target number, die roll, test modifier, resource cost
    or Shadowrun 3E conversion is specified on this page.
