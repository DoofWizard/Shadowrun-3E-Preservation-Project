  narrator_established:
    historical_portrayal: The source narrates Lone Star Security Services’ early history as notorious for corruption
      when functioning as Clayton Wilson’s personal coercive enforcement organization, including physical intimidation
      and accepting bribes.
    change_over_time: As the corporation acquired a more professional public image and organizational culture,
      the form of corruption changed; the narrator assesses corruption as less widespread than in the earliest
      years without declaring it absent.
    official_counterclaim: In-world official corporate management statements assert that corruption no longer
      exists in the organization. The book narrator explicitly treats these statements skeptically.
    attribution: These historical statements are the published narrator’s fictional setting account; they are
      not claims about an actual security company or evidence of real-world conduct.
