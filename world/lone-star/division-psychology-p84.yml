  source_anchor: {printed_page: 84, pdf_page: 92, heading: DIVISION OF PSYCHOLOGY}
  organization: Lone Star — Division of Psychology (DivPsych)
  account:
    mandate: The narrator says the division originated partly to answer critics who thought Lone Star cared only about imprisonment, by presenting rehabilitation and outreach as additional institutional interests.
    departments_or_services:
      - Outreach programs and counseling
      - Behavioral research
    recognized_work: The narrator credits the division with government grants and awards in behavioral science and genetics.
    speculative_fictional_science: The historical fictional narrator presents then-current medical scans and genetic mapping as identifying predispositions toward violent, antisocial, compulsive and theft-related behavior. Such predictions are source-era fictional assertions, not established real-world science.
    company_goal_as_described: Division personnel suggest the studies could help create a practical response to criminal behavior; the source does not establish any specific proposed intervention.
  attribution_boundary: Flashpoint and Full of Questions speculate about coercive prenatal intervention and gene manipulation in adjacent dated Shadowland replies. Those are preserved as attributed commentary, not narrator-established institutional plans.
  adjacent_sections: The Department of Counseling belongs under the Psychology division and is separately indexed, with further attributed comments extending onto printed p85.
  mechanics_boundary: No rules-level test, target number, dice pool, spell, equipment stat, or SR3 conversion is printed in this section.
