data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog_number: FASA7115
    year: 1994
    game: Shadowrun
    edition: original and Second Edition compatible historical source
    fiction_status: fictional cyberpunk tabletop RPG sourcebook; 2054 speakers are invented-world
      commentary
  source_anchor:
    printed_page: 43
    pdf_page: 43
    heading: Irregular Assets
    voice: sourcebook narrator, not dated in-world forum commentators
  usage_trigger: Within the fictional setting, Lone Star supplements its officers when a specialized
    skill is unavailable internally or a matter receives too little priority to justify deploying
    regular personnel.
  categories:
    information_assets: Narrator distinguishes information-gatherers and members of an informant
      network informally called the net; a later section describes these informants in greater detail.
    active_assets: Narrator identifies freelance bounty hunters as the main active irregular assets.
  recruitment_and_records:
    responsible_division: In most cities the Tactical Division retains the network of freelancers
      under individual contracts.
    discovery_sources:
    - Existing informants
    - Local intermediaries (fixers)
    - Continuing Division of Investigation casework
    investigation_reporting: Narrator says the standing procedure requires Investigation to forward
      bounty-hunter leads to Tactical Division databases.
    specialist_selection: Tactical Division searches its fictional database for contractors with
      the needed special skills and regional familiarity, then a Lone Star liaison negotiates the
      contract.
  compensation:
    usual_structure: Typically a small initial retainer and the balance after completion.
    per_diem: The narrator says the corporation rarely pays a per diem.
    expenses: Individual contractors may sometimes negotiate reimbursement of relevant expenses.
  contract_scope:
    narrator_claim: Despite Lone Star denials, the narrator says the fictional corporation sometimes
      issues contracts allowing delivery of the subject dead or alive.
    relative_frequency_as_printed: The book says nine times out of ten the subject of such a contract
      ends up dead.
    provenance_boundary: This is an assertion in a historical fictional tabletop game source, not
      a real procurement policy or instruction.
  forum_boundary: Named 2054 speaker views about low pay, suspect conduct, inter-city rivalries and
    contractor status are preserved separately and are not promoted to narrator-certified fact.
framing: newsroom_neutral
headline: Fictional Shadowrun irregular assets — FASA Corporation Lone Star Sourcebook FASA7115 (1994),
