    section: Research and development and relative size
  narrator_authority: Company economics and divisions below are source-narrator statements,
    not assurances that dated in-world forum criticisms are true.
  funding_and_municipal_enforcement:
    financing: The narrator describes Lone Star as a corporation without direct government-source
      funding but earning fees from government enforcement contracts; payment for
      contracts is not equated here to a subsidy.
    business_obligations: Revenues must cover payroll and overhead, market competition
      and shareholder dividends.
    contract_types: Major metropolitan enforcement agreements and limited or piecework
      municipal enforcement contracts.
    mission: The narrator characterizes urban enforcement as the corporation's chief
      publicly recognized mission while acknowledging other commercial operations.
    cost_problem: Enforcement contracts have extensive overhead, and media rights
      or other associated earnings do not fully cover policing costs.
  corporate_security_division:
    name: Corporate Security Division
    abbreviation: CSD
    activities: Hires out civilian security personnel to other corporations and independent
      organizations, similar in broad business type to Knight Errant.
    relative_scale_and_revenue: The narrator says CSD is smaller than Lone Star's
      municipal enforcement organization yet supplies a substantially larger share
      of corporate revenue.
  magical_security:
    name: Division of Paranormal Investigation
    street_name: Dips
    function: Contracts wage mages as astral-security consultants to identify problems
      in customer magical protection and recommend changes.
  matrix_security:
    name: Division of Matrix Security
    street_name: GridSec
    function: Contracts computer-security specialists as consultants to clients.
  research_and_development:
    name: Research and Development Division
    development: Produces new internal equipment, especially telecommunications and
      surveillance gear, plus weapons and other designs.
    commercialization: Senior Lone Star management evaluates projects for licensing
      to outside companies willing to manufacture and market approved designs.
  financial_position:
    relative_profits: The narrator says Lone Star earns much less profit than AAA
      megacorporations such as Ares and Renraku but remains solvent and competently
      managed.
    size: The book categorizes Lone Star as a stable mid-sized corporation despite
      competitors' marketing pressure.
    printed_tension: The source describes metropolitan policing as a dominant revenue/mission
      activity while later saying smaller CSD yields a greater percentage of revenues;
      both formulations are preserved rather than silently harmonized.
framing: newsroom_neutral
headline: Fictional Lone Star business divisions, FASA Corporation Lone Star Sourcebook
