  narrator_established:
    restriction: The fictional corporation writes broad anti-competition clauses into its employee contracts.
    duration_years: 4
    scope: On the face of the clause, a former employee may not work for a corporation that directly, indirectly,
      or substantively competes with Lone Star Security Services.
    all_employee_levels: The text expressly includes former staff sergeants, data-processing clerks and senior
      vice presidents.
    enforceability_uncertain: The book narrator says Lone Star finds enforcement difficult if not impossible
      despite the wording, and explains that contracts are executed under the national and corporate jurisdiction
      in which the employee is currently working.
    extraterritorial_conflict: Other extraterritorial corporations generally do not recognize Lone Star employment
      contracts as binding inside their own corporate jurisdiction.
  legal_context: A fictional 2054 corporate-jurisdiction description; not current legal advice or a universal
    Shadowrun Third Edition player restriction.
  mechanics_check: No dice pool, target number, or character creation rule is printed in this passage; four
    years is a described contractual term rather than a game turn duration.
headline: Fictional Lone Star employment restrictions — FASA Lone Star Sourcebook (FASA7115, 1994), Second
