    heading: Dispatch Office continuation and emergency call procedures
  organizational_role: Central dispatch function sending Lone Star units to emergency
    calls and maintaining radio contact with field officers.
  stated_equipment_policy: The narrator says a recent Lone Star policy requires an
    officer to accept cyber-radio and smartgun-link implants at the beginning of a
    tour of duty; anonymous in-world discussion disputes actual compliance, so this
    is policy rather than an independently measured installation rate.
  ordinary_emergency_call_sequence:
  - A dispatch officer answers the caller and elicits the details needed to respond.
  - A dispatcher checks a datafile of last known positions of available patrol officers.
  - The dispatcher relays the caller information to an available field officer, who
    evaluates immediate risks and contacts available responding units.
  - The dispatcher updates the caller and may remain on the line to reassure them.
  panicbutton_response:
    alarm: When a PANICBUTTON alarm is received, the narrator says Dispatch attempts
      to send at least two units.
    automation: In dense precincts experiencing many such alarms, a subprocessor with
      synthetic voice automatically records the transmission location and dispatches
      two units.
  uncertain_unit_availability:
    conditions:
    - More than two units appear available for one incident.
    - Location data are stale, defined as more than five minutes since the last recorded
      location.
    procedure: Dispatch posts a bulletin identifying location and incident type; available
      officers decide whether they can assist, then contact Dispatch to take the assignment.
  records_and_accountability: Dispatch keeps significant radio-communication logs,
    downloads vehicle black-box data daily, forwards material to Department of Records,
    and may testify about dispatch records in a trial.
  emergency_medical_beacons: The source says a Lone Star medical beacon on most employees
    can generate a Code 00 signal for serious or life-threatening injury, with Lone
    Star Biotech or DocWagon responding depending on local arrangements. An officer
    beacon going dead remains a Code 00 emergency, rather than proof of survival.
  cross_records:
