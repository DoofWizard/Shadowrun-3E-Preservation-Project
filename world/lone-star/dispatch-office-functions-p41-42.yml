    forum_claims: references/lone-star/dispatch-office-shadowtalk-p41-42.yml
  attribution_boundary: Policy and described department procedures are fictional sourcebook
    narrator reporting; actual compliance, private hospitals, implementation pitfalls,
    and special unofficial codes are distinct in-world Shadowtalk claims.
