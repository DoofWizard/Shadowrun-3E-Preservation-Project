data:
  publication: {title: Lone Star Sourcebook, publisher: FASA Corporation, catalog: FASA7115, year: 1994, medium: fictional cyberpunk tabletop RPG sourcebook}
  source_anchor: {printed_page: 86, pdf_page: 94, heading: RESEARCH AND DEVELOPMENT DIVISION and three department headings}
  parent_organization: Lone Star
  division: Research and Development
  narrator_established_fictional_structure:
    early_history: The division grew out of research facilities and technical groups Clayton Wilson folded into Lone Star while seeking extraterritoriality in 2032.
    location_distribution: Unlike many other divisions it does not have a local laboratory or office in every Lone Star jurisdiction. Austin headquarters has the largest R&D concentration of labs, workshops and computer systems, followed closely by Milwaukee.
    departments:
      - Psychological Research
      - Computer Research
      - Technical Research
  psychological_research_department:
    source_description: The narrator presents this research department as an institutional orphan dating to Wilson's 2032 extraterritoriality strategy, with little budget or upper-management influence compared with Lone Star's Division of Psychology.
    management: Managers exercise considerable autonomy with relatively little direct supervision and may shift between projects without immediate practical application.
    institutional_distinction: The Psychological Research Department under R&D is distinct from the Division of Psychology's applied services and Department of Counseling, which are indexed separately.
  computer_research_department:
    origin: The narrator says this department originated as Absolute Software, a computer-security consulting company purchased by Clayton Wilson in 2016.
    core_work: Develops enhanced fictional intrusion countermeasures, or IC programs, for Lone Star computers and for sale or licensing to outside customers.
  technical_research_department:
    funding: Described as the largest and best-funded department within R&D.
    development_scope:
      - New fictional weapons
      - Communications technology
      - Surveillance technology
    commercial_role: Technology developed here may be sold or licensed to other corporations; the narrator credits licensing with bringing in recurring revenue and keeping Lone Star field officers technologically competitive.
  attribution_boundary: Commentary on Seattle laboratories, the Thunderbolt pistol, speculative magical-drain studies, GridSec budgets, reverse engineering, the performance of Expert IC and outside manufacturing belongs to dated Shadowland speakers in a separate attributed-claim record.
  mechanical_boundary: This section does not print the statistics, legality, Availability, cost, damage, rules modifier, or rating needed to instantiate its mentioned gear and IC programs. Do not infer Shadowrun Third Edition statistics from the institutional descriptions.
