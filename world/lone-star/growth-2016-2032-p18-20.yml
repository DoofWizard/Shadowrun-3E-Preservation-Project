  source_authority: Book-narrator account only; separate pseudonymous comments on
    the pages are not promoted to established history.
  2016_consolidation:
    expansion: Clay Wilson bought Bartholomew Security, Inc. and Absolute Software,
      Inc., two Austin businesses.
    bartholomew: Provided low-grade property security, including unarmed guards and
      nighttime construction-site watchmen.
    absolute: Specialized in computer-security audits and software addressing deficiencies
      found in local corporations.
    restructuring: Wilson dismissed most managers of the acquired businesses and merged
      them into Lone Star Security Services, Inc.
  2017_growth:
    event: In August 2017 Mount Hood, Mount Rainier, Mount St. Helens and Mount Adams
      erupted simultaneously within the fictional setting.
    effect: Surging demand for corporate protection benefited Lone Star's expanded
      workforce and accelerated its Austin-area growth.
    branch_offices:
    - Lubbock
    - San Antonio
    - Houston
    - Corpus Christi
    - Texarkana
  2020_corpus_christi_contract:
    milestone: First full metropolitan law-enforcement contract, Corpus Christi, Texas,
      in 2020.
    labor_context: The incumbent police union had been without a contract for eleven
      months, went on strike after the city declined renegotiation, and the city dismissed
      striking officers and extended Lone Star's agreement.
    aftermath: City police management and some non-striking personnel remained, but
      the depleted operation proved inadequate and the city dissolved its own department
      within weeks.
    subsequent_expansion: Between 2020 and 2030 Lone Star gained five further full-service
      metropolitan contracts, including Seattle, and more than six dozen limited-service
      contracts.
    limited_service_scope: Services covering particular duties or parts of a metropolitan
      jurisdiction, rather than full-area policing; several contracts covered affluent
      residential developments.
  2029_crash_and_computer_systems:
    network_decision: Before the Crash of '29 Wilson isolated Lone Star's central
      Austin computer systems from the global Grid.
    technical_architecture: Mostly autonomous computers and asynchronous, largely
      one-way communication paths, including packet-switched radio used for vehicle
      dispatch and tracking.
    reported_outcome: The Crash virus damaged autonomous systems, but the isolated
      central Austin data core remained intact.
    response: Lone Star expanded computer and infotech-law capacity after the Crash
      and pursued the Matrix-era developments associated with the Echo Mirage program.
  2032_extraterritoriality:
    cross_border: Lone Star expanded into Canada and Quebec through subsidiaries;
      the Quebec operation remained nominally independent after the United Canadian
      and American States formed, because Quebec stayed separate.
    jurisdictional_problem: Headquarters sat in Confederate territory while many important
      contracts were in UCAS cities; the Shiawase Decision of 2001 prevented the desired
      extraterritorial status under the earlier corporate arrangement.
    acquisitions: Within two months in 2032 Wilson bought, absorbed or otherwise acquired
      seven other corporations while maintaining majority or voting control over the
      targets.
    growth: Lone Star's holdings increased by nearly 25 percent.
    legal_status: The source says the UCAS government declared Lone Star extraterritorial
      on September 28, 2032.
