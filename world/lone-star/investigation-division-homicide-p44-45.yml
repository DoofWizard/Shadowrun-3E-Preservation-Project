    heading: Division of Investigation
  - printed: 45
    pdf: 45
    heading: Division of Investigation continued; Department of Homicide
  origin_and_purpose:
    formed_year: 2045
    trigger_as_narrated: The narrator links its formation partly to Lone Star public-image concerns
      after a decade of criticism over enforcement practices, disproportionate force, and detention
      or deaths of innocent persons.
    prior_practice: For years Lone Star assigned criminal guilt/innocence investigations chiefly
      to federal investigation agencies.
    scope: Investigation division employs detectives to collect evidence, conduct undercover inquiries
      and work without routinely relying on the armed patrol approach.
  leadership_and_staffing:
    chairman: John S. Patrelli
    tenure_wording: Source says he has chaired for eight years since the division began; retains
      the book’s chronology without inferring a corrected appointment date.
    resources: Patrelli seeks greater staffing and funding; narrator characterizes the effort as
      unsuccessful because corporate enforcement priorities favor force-oriented approaches.
    hiring: Early staff transfers came from government investigation bureaus. Later recruitment includes
      Lone Star Academy graduates and criminology/technical-school students.
    experience: Investigators include academy-trained patrol veterans, transfers from government
      or security organizations, and technical criminology graduates.
  organization_and_coordination:
    subunits: Multiple departments specialize by investigation type.
    information_sharing: The source says departments should coordinate and share case information;
      rivalries and career incentives often frustrate the intended cooperation.
    investigator_operating_style: Compared with patrol officers, detectives use personal inference
      and field inquiry, sometimes undercover and without nearby armored backup.
  homicide_department:
    jurisdiction: Investigates murder and suspected murder; a suspected homicide shifts the leading
      investigation to Homicide or adds a Homicide detective to the case team.
    interdepartmental_example: Narrator illustrates cooperation among Homicide, Vice, and Drug Enforcement
      in the fictional homicide of a sex worker whose pimp is associated with illegal BTL chips;
      case teams are expected to share information but may withhold it when objectives conflict.
    magical_assault_law: Within the source-era fictional law, a death attributable to magical assault
      is automatically classified as first-degree murder because that form of crime is treated as
      premeditated.
    certainty: Narrator-established fictional corporate procedure and legal setting, not real law
      or tactical guidance.
  authority_boundary: The sourcebook’s institutional narrative is separate from pseudonymous Shadowtalk
    reactions on p45; the later Department of Forensics begins p45 and continues beyond this record.
framing: newsroom_neutral
