    medium: Trid-magazine program Manuel Jardine Tonight
    event: The program's reporters described Lone Star's suppression of the Manhattan
      Bridge uprising, depicting heavily armed aerial shore-patrol personnel confronting
      a militant gathering of homeless people living beneath the bridge.
    narrator_assertion: The source states that this broadcast generated extensive
      publicity for the division; it does not endorse the show's portrayal or establish
      the unverified motives later alleged by commenters.
  commercial_aftermath:
    contracts: Requests for shore-patrol services increased sharply following the
      televised coverage.
    capacity: The narrator says Lone Star had difficulty equipping shore patrol units
      sufficiently quickly to satisfy the resulting demand.
