  section: Department of Street Patrol, cycle and auto-patrol vehicle equipment
  cycle_and_vehicle_models:
    standard_cycle: Harley Electroglide
    uncommon_cycle: Honda-GM 3220 ZX Turbo
    typical_auto: Chrysler-Nissan Patrol One
    other_auto:
    - Modified Ford Americar
    - Modified Honda-GM 3220 ZX Turbo
  harley_side_compartment_inventory_as_printed:
    metal_handcuffs_pairs: 6
    plastic_strip_restraint_packets: 2
    plastic_strip_heat_fuser: 1
    mage_masks: 2
    containment_manacles_or_pulse_cuffs_pairs: 3
    headjammers: 2
    jackstoppers: 5
    skilltwitchers: 2
    DNA_scanner: 1
    blood_tester: 1
    cyberware_scanner: 1
  patrol_vehicle_features:
    dash_microcomputer: Cellular link to a subprocessor in the precinct system; fold-up
      monitor and optional heads-up windshield display; online data, encryption and
      decryption.
    video_displays: Three color LCD monitors display car and surveillance-drone video.
    vehicle_defenses: Exterior security shock plates and full-length electrified rear-seat
      pad described as taser-like protection.
    officer_weapons:
    - Defiance Super Shock taser pistol (most patrol officers)
    - Two Mossberg CMDT/SM Combat Shotguns, each with a smartgun adapter (one per
      officer)
    extra_armor: Two armored torso plates attachable for heavy combat
    other_systems: Front and rear Flash-Paks integrated with the roof light/siren
      assembly, controllable from inside the automobile.
    standard_equipment: Auto patrol carries the same testing and restraining gear
      as cycle patrol.
  limitations: These are fictional historical inventory descriptions, not a real-world
    equipment recommendation; the detailed vehicle computer ratings are independently
    preserved in the original-edition Matrix statistics record.
