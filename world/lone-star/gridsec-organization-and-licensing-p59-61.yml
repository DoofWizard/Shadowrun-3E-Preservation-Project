  name: Division of Matrix Security
  short_name: GridSec
  parent: Lone Star fictional private policing corporation, Enforcement Arm
  staffing:
    terminology: GridSec officers are described as console cowboys and cyberdeck users; some previously were criminals or shadowrunners.
    military_hierarchy: The book says this division uniquely rejects ordinary military-style hierarchy by rank and job position.
    sidearm_exception: GridSec officers are not required to qualify with a sidearm as a condition of employment.
    training_exception: GridSec officers need not complete basic Lone Star Academy training.
    recruitment:
    - technical institutes
    - other corporations
    - rehabilitation programs
    - probation programs
  source_narrator_corporate_economics:
    revenue: Officers buy optional extra Matrix hardware and program modifications from Lone Star at corporate-discount rates under
      available payment plans; the narrator attributes substantial income to these employee purchases.
    offsite_work: Many GridSec officers prefer operating from homes covering their patrol areas, reducing office-space and other overhead.
  Matrix_persona_policy:
    issued_persona: A standard central-Austin-issued fictional Matrix persona visually represents a conventional uniformed police officer.
    minor_customization: The book describes mostly tolerated minor personalized alterations.
    major_customization: Extreme modifications can result in disciplinary action.
  fictional_licensed_activity_architecture:
    scope: The book describes legal Matrix activity as requiring a licensed terminal or cyberdeck.
    license_chip: A licensed terminal or cyberdeck contains a motherboard license chip that provides fictional audit-trail identifiers
      to Matrix system access nodes (SANs).
    audit_information:
    - time
    - date
    - system address
    - operator license number
    - operator name
    - Matrix sessions and related activities
    source_narrator_GridSec_review: For a GridSec investigation, the narrator describes comparing licensed-device audit information
      with logs at the corresponding Matrix system access nodes.
    rights_and_abuse_boundary: The book explicitly questions the neutrality of an operator being investigated for alleged wrongdoing
      when corporations may themselves decide what constitutes misconduct, including leaks or viewing information that corporations
      dislike.
  speaker_boundary: The ex-shadowrunner quotation and 2054 Shadowtalk accounts about Clay Wilson, managerial retaliation, persona modifications,
    and corporate economics are attributed remarks, separately indexed in the companion record.
  mechanics_boundary: This passage gives no TNs or dice procedures for a GridSec license check. Preserve its setting details without
    fabricating a playable Shadowrun Third Edition test.
