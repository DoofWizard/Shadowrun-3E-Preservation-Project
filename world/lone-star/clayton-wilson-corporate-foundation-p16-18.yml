          "Wilson shifted his acquisitions from information technology to private security businesses. He took over two Austin companies: Bartholomew Security, Inc., providing low-cost, mainly unarmed guards and night watch at construction and other lower-security sites; and Absolute Software, Inc., providing local corporate computer-security audits and customized software.",
