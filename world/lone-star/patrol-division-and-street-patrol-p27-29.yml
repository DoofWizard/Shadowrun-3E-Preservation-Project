  section: Enforcement Arm / Division of Patrol / Department of Street Patrol
  narrator_setting_facts:
    enforcement_structure: Each enforcement-arm division has a divisional chief who
      reports to deputy chiefs in each city or market served by Lone Star.
    patrol_frontline_role: Largest and most visible enforcement division, and the
      first regular contact between civilians and Lone Star. Precinct dispatch responds
      to an emergency by assigning patrol officers; the officers assess the situation
      and request support as needed.
    financial_priority: Patrol has received a large share of corporate funds since
      Lone Star began. The narrator identifies division executive chairman Thomas
      Macmillan, regularly at Austin headquarters, as an advocate of increasing patrol
      budgets and lethal-force equipment.
    new_communications_proposal: Austin divisional conveners reviewed a two-year communication-system
      study; the narrator reports a proposal to prioritize upgraded communications
      in the next budget and require patrol officers to undergo radio/recording implants.
      This is a proposal, not proof every officer was implanted.
    street_patrol_department: The 2053 Hausser Life Survey characterizes patrol as
      a high-risk enforcement role; street patrol officers are first at an incident
      and are expected to contain or diffuse situations until specialists arrive.
    street_patrol_sections:
    - Foot Patrol
    - Cycle Patrol
    - Auto Patrol
    foot_patrol: Foot officers patrol public gatherings (including urban brawl games
      and concerts), monitor crowds and contact vehicle-based patrol for assistance
      or specialist teams if needed.
    cycle_patrol: Fewer officers than auto patrol; cycles offer less protection and
      capacity for heavy equipment. The narrator states Lone Star has reduced this
      patrol type in favor of auto units, while using cycles against vehicle-mounted
      gang incidents.
    auto_patrol: Typically two officers per car; usually a Chrysler-Nissan Patrol
      One, with modified Ford Americars in some areas and modified Honda-GM 3220 ZX
      Turbos for specialized units.
  source_claim_separation: Statements attributed to Sergeant Anne Weitzmann and named
    Shadowtalk speakers are separately preserved. Weapons/equipment counts and exact
    Matrix system ratings are in their own source records; this is setting/reference
    history, not real policing advice.
