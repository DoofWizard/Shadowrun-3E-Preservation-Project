    heading: Department of Riot Control continuation
  organization: Lone Star Riot Control Force
  narrator_defined_status: A distinct department within the Tactical Division, rather
    than ordinary patrol or criminal investigation.
  narrator_described_remit:
  - Containing and controlling riots
  - Dispersing violent public demonstrations
  - Responding to public demonstrations that officials believe may escalate into violence
  subject_distinction: The book explicitly contrasts riot-control units facing civilians
    who may become lawbreakers if enforcement fails with other officers confronting
    already identified criminals.
  public_assembly_context:
    planned_events: Municipal governments call on riot-control troops for large planned
      marches, protest meetings, and outdoor concerts even where violence is not expected.
    spontaneous_events: After an unplanned public gathering begins, the source says
      units mobilize on the first report of crowd formation; more officers may be
      sent than to an organized protest.
    comparison: The narrator attributes different deployments to the belief that spontaneous
      crowds have fewer checks against disorder.
    typical_outcome: The source says that in the great majority of cases riot troops
      observe until crowds disperse, then return to their stations without using force.
  authority_boundary: These descriptions are sourcebook narrator assertions about
    a fictional 2054 corporate-policing organization. Allegations about particular
    incidents, misconduct, personnel policy, surveillance, press coverage, or riot
    equipment appear separately in attributed Shadowtalk.
headline: Fictional Lone Star Riot Control Department — FASA Corporation, Lone Star
