  narrator_scope: The in-world sourcebook narrator introduces the Intelligence Gathering chapter,
    contrasting knowledge of suspects with direct police tactical capability.
  narrator_facts:
  - subject: operational intelligence
    description: Successful investigations are described as depending on identifying suspects, methods
      and locations before force can be effective; even Fast Response Teams and SWAT are ineffective
      without a target to investigate.
  - subject: fictional detective mythology
    description: The narrator contrasts cinematic or simsense instant deduction with mundane casework;
      sporadic clue-based breakthroughs are acknowledged, but most cases require available evidence
      and remain unresolved without it.
