    section: Department of Parole and Probation
  narrator_organization:
    title: Department of Parole and Probation
    functions: In the fictional corporate-policing setting, the department oversees probation as an alternative to a prison term and parole as shortening a custodial term after part has been served.
    relationship: The narrator additionally associates many parole officers with the Lone Star Division of Penology; jurisdictional variations and whether Seattle contracts all work to the company are contested in distinct Shadowtalk.
  probation_as_printed:
    definition: Supervision by a court-appointed agent instead of imprisonment, traditionally associated with first-time offenses and misdemeanors in this source account.
    prison_overcrowding: The book narrator says overcrowding has led courts sometimes to use probation for more serious offenses as well.
    reporting:
      remote: Telephone or telecom contact every two days.
      in_person: Personal meeting with the assigned probation officer once a week.
      conditions: Accused offenders are described as obliged to respond truthfully about their conduct and subject to case-specific limitations.
    restriction_examples: May prohibit otherwise lawful weapons, associating with specified persons, or entering certain areas.
    termination: Further criminal activity may result in loss of probation and imprisonment.
    corporate_relationship: Narrator says probation officers, formerly agents of the courts, are now commonly Lone Star employees in the described setting.
  parole_as_printed:
    definition: Conditional release into the community after serving a specified portion of a custodial sentence; distinct from probation.
    process: A parole committee reviews the person's record and interviews the person at a hearing, deciding whether release poses unacceptable danger.
    conditions: Reporting, behavior, residence and associates are controlled under the parole terms.
    reporting:
      remote: Telephone or telecom contact every two days.
      in_person: Personal meeting weekly.
    violations: The narrator states violation can return the released person to prison for the remainder of the term; it says some jurisdictions refuse re-release after any parole violation.
    institutional_link: In many of the fictional jurisdictions, parole officers belong to the Lone Star Division of Penology.
  authority_boundary:
    - This is the published fictional 2054 setting's legal system and not a description of current actual law.
    - Named speakers on printed pp81-83 debate jurisdiction, officers' conduct, recidivism and simulated parole; their allegations are not narrator-established rules.
    - The Shadowtalk's claims about searching homes, extraterritorial corporations and alleged coercive simulations do not create mechanical modifiers or real-world legal advice.
