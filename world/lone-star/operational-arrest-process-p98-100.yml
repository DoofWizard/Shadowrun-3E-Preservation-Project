  source_voices:
    opening: An in-world officer narrates that officers memorize Lone Star's Operational
      Procedures Manual, informally called The Book; the following italicized passages
      present fictional institutional procedures, not contemporary legal advice or
      standalone Shadowrun dice rules.
    manual_attribution: Italicized sourcebook text gives the in-universe manual-style
      arrest and follow-up requirements. The ordinary prose surrounding it is the
      in-world police officer narrator.
  manual_arrest_conditions:
  - situation: An officer personally witnesses someone committing an offense.
    stated_condition: Immediate arrest permitted in the fictional procedure.
  - situation: Officer arrives after an offense without witnessing it.
    stated_condition: Must obtain a preponderance of non-circumstantial evidence to
      support that the individual committed it.
  - situation: Evidence suggests a person was conspiring to commit an offense.
    stated_condition: Arrest may also occur when the officer can produce a preponderance
      of evidence for the conspiracy.
  arrest_and_booking_sequence:
  - Officer displays their badge, identifies themselves, and states intention to arrest;
    the described policy allows necessary force to subdue the person.
  - Officer informs the arrested person of the nature of the crime and must ensure
    the person’s safety from the point of arrest.
  - Officer transports the person to the nearest Lone Star precinct house for processing;
    a person without an existing SIN is immediately assigned one.
  - After formal charge, the fictional system performs cyberware scanning, a blood
    test, DNA scanning, fingerprinting, hair sampling, and retinal scanning to establish
    identity.
  - The identity checks take place in a precinct biotech ward under supervision of
    the arresting officer; illegal cyberware worn by the person is described as promptly
    disabled or removed.
  non_immediate_apprehension:
  - For a call, consult the complainant for further information about the crime.
  - If a suspect is attempting to escape, pursue and request backup when necessary.
  - If the suspect has escaped, demarcate the crime scene, limit access to Lone Star
    personnel, and keep witnesses separate to prevent mutual influence on recollections.
  - Report to dispatch; dispatch coordinates a department-specific response, including
    homicide or crime-scene investigation as appropriate.
  - Produce an initial report and be available to testify in court.
  scope_limit: These are 2054 fictional-law-enforcement descriptions and in-world
    legal claims; the pages specify no dice tests, target numbers, skill requirements,
    or player action modifiers.
headline: Fictional Lone Star arrest and booking procedure — FASA Lone Star Sourcebook
