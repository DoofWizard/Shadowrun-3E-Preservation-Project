  narrator_established:
    structure: 'The fictional security corporation has three distinct employee salary tracks: street officers,
      administrative staff, and management/executives; pay progression is chiefly based on seniority.'
    street_officers:
      newly_sworn_annual_nuyen_approx: 20000
      variation: Newly sworn peace officer pay varies by locale.
      peak_precinct_captain_annual_nuyen_approx: 48000
      top_rank_in_track: precinct captain
    administrative:
      starting_annual_nuyen_approx: 16000
      office_manager_ceiling_annual_nuyen_approx: 35000
    management_executive:
      entry_annual_nuyen_range:
      - 34000
      - 40000
      division_managers_annual_nuyen_at_least_approx: 90000
      junior_vice_presidents_annual_nuyen_up_to_approx: 150000
      differential: At entry, the management range is only somewhat above the senior administrative range;
        the curve steepens at higher management ranks.
    employee_health_cover:
      plan: DocWagon
      all_employees_covered: true
      administrative_and_off_duty_peace_officers: Basic
      on_duty_peace_officers: Gold; Lone Star Security Services pays costs over and above plan coverage
      executives: Gold as a base benefit; individual negotiations can secure Platinum or Super-Platinum.
  source_caveat: These are fictional 2054 setting compensation and benefits descriptions, not an automatically
    applicable Third Edition player-character salary mechanic; monetary qualifiers (roughly, region, as much
    as) are deliberate.
