  Matrix_field_operations:
    book_narrator_scope: GridSec uses specialized fictional combat utilities to identify and locate alleged Matrix offenders and to
      support in-world law-enforcement responses.
    comparison: The programs are compared by the book to IC (intrusion countermeasures) but are presented as smaller utilities that
      run in conjunction with officers’ cyberdecks.
    resource_constraint: The book emphasizes unusually large available memory requirements on even expensive fictional cyberdecks.
    legal_and_attribution_caution: The source describes these fictional programs as subject to possible misuse. No real-world surveillance,
      malware, or intrusion procedure is offered by this archival reference.
  computer_virus_setting:
    role: In the 2054 setting, GridSec deploys computer-virus programs as a form of IC.
    claimed_distribution: The book says these fictional utilities are often difficult to detect and may be encountered during a Matrix
      data exchange.
    mechanical_boundary: No dice/test target number, Rating, damage code, Availability, or activation cost is specified by the narrator
      in these paragraphs.
  data_worm_setting:
    name: Data Worms
    classification: Fictional Matrix microprograms discussed by the source narrator.
    claimed_role: The narrator presents them as persistent records of a cyberdeck user’s Matrix activity, rather than as character or
      vehicle entities.
    source_description: The worm is portrayed as difficult for ordinary Matrix detection software to distinguish from benign activity;
      its record is described as containing times, dates, LTG numbers, SAN addresses and passcodes.
    reported_outputs: The in-world narration says accumulated information may be relayed to Lone Star; the text describes fictional
      program behavior rather than a real-world construction or distribution recipe.
    provenance_caution: External Shadowtalk accounts about file sizes, technical counters, and variants remain disputed speaker assertions
      in the linked commentary record.
  eschers_loop:
    as_printed: Escher’s Loop
    nickname: looper
    classification: Fictional Matrix-affecting microprogram linked by the narrator to Data Worms.
    source_narrator_effect: The narrator describes a recurring visual-cortex illusion presented to an affected decker as an endless
      image sequence. In the fiction, this can impair consciousness and create danger when the person is operating a vehicle.
    possible_outcomes: The text explicitly mentions severe injury or death as possible outcomes, including innocent bystanders; these
      are fictional story consequences, not game damage codes or a confirmed event.
    end_conditions_as_described: The source describes interruption upon loss of consciousness or removal of the character’s datajack;
      no numeric test or time threshold is given.
    speaker_boundary: The narrated effects are separate from Sounder’s unverified anecdote and claims by other forum writers about commercial
      variants.
  exact_rules_boundary: All numerical values about IC size or chip pricing in this section are attributed Shadowtalk statements, not
    independently established character-creation prices or mechanical source tables. Do not convert this account into SR3 mechanics.
