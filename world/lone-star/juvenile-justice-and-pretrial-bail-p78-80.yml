data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog_number: FASA7115
    publication_year: 1994
    edition_context: Original and Second Edition historical Shadowrun tabletop RPG material
    fictional_setting_period: Corporate law-enforcement discussion in the source-era 2050s
  source_anchors:
    - {printed_page: 78, pdf_page: 78, section: Juveniles in the System begins}
    - {printed_page: 79, pdf_page: 79, section: Juveniles in the System continues; Legal Recourse and Making Bail}
    - {printed_page: 80, pdf_page: 80, section: Making Bail commentary and illustration; parole heading begins at foot}
  juvenile_justice_narrator:
    historical_claim: The fictional publication describes a common-law tradition of treating young offenders differently because of developing responsibility and understanding of consequences.
    age_threshold: Its account calls persons younger than sixteen juveniles for this purpose; not a universal statement about actual law.
    court_and_disposition: The narrator describes a separate Juvenile Court and historically more lenient outcomes, sometimes probation rather than incarceration.
    confinement_and_reform: Young offenders sent to reform school or juvenile hall are described as separated from adult offenders, with rehabilitation an intended rationale.
    historical_trend_as_source_claim: The narrator asserts rising juvenile crime since the 1960s and a relatively faster rise in violent juvenile offenses over the previous two decades. This is fictional-source-era reportage, not an independently established real-world statistic.
  legal_recourse_narrator:
    scenario: A person arrested and arraigned in the described common-law system might await trial for months or years because of crowded courts.
    presumption: The narrator invokes a presumption of innocence before trial when explaining why courts use bail rather than automatic pretrial confinement.
    jurisdiction_limit: Narrator's discussion is about the fictional version of British-derived common-law jurisdictions; its applicability outside those jurisdictions is expressly contested in the separate speaker commentary.
  making_bail_narrator:
    definition: Bail or bond is described as a financial guarantee that an accused person released before trial will return to the legal authorities for the hearing.
    forfeiture: The narrator says the monetary guarantee is forfeited if the defendant fails to appear.
    judicial_discretion: Bail is described as a discretionary privilege rather than an automatic entitlement, with the court considering precedent and seriousness of charges and possibly denying bail.
    scope_limit: Detailed 2054 Seattle financial examples, bondsman fees and disputed corporate control are speaker-attributed material, not established here as universal narrator facts.
  subject_boundaries:
    - This is historical fictional legal worldbuilding, not current real-world legal advice.
    - Neither the book-narrator trend statements nor the comment forum's predictions establish real statistics.
    - Dated fictional shadowtalk, including sexual-offense allegations and bail-finance examples, is preserved separately without promoting speakers to narrator authority.
