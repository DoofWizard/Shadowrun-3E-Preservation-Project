    "institutional_role": "The fictional D.P.I. narrator presents its paranormal animal-control unit as one of its relatively community-oriented departments, protecting residents from potentially harmful creatures appearing in city environments.",
    "initial_response": "A removal officer usually tries to tranquillize and contain an identified creature; the book describes a different response when it has severely injured or killed a person. This reports fictional source procedure, not advice for real-world animal handling.",
    "investigation": "After containing or killing an animal, the officer traces its movements to locate a den and determine whether mates or offspring remain nearby. The book says the officer combines direct survey with remote electronic sensors and/or an astral sweep.",
    "recovery": "If other paranormal animals are found, the narrator says a tranquilized creature may be transported elsewhere. Remains are taken for forensic assessment of disease, toxic contamination or magical influence.",
    "restricted_species": "The D.P.I. maintains and revises a list of dangerous paranormal animals. The narrator refers to Paterson's Paranormal Creatures of North America, also called Paterson's Guide: generally carnivorous species or those likely to injure humans appear on its restricted list.",
