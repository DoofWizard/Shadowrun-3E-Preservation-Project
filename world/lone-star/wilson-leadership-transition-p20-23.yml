  narrative_authority: Book-narrator account; separate dated Shadowtalk speculation
    is preserved in another record, not promoted here.
  pre_2035_culture:
    leadership_style: The source describes Clay Wilson's Wild West approach affecting
      street security and administrative personnel.
    police_practices: The narrator describes vigilante justice, assaults on suspects,
      and reports that suspects were shot while supposedly attempting escape; these
      are source-described conduct and reports, not endorsed procedures.
    prejudice: The book describes institutional racism, especially toward metahumans,
      with company attitudes initially tolerated by part of the public but increasingly
      challenged.
  corpus_christi_2035:
    decision: In 2035 Corpus Christi terminated Lone Star's municipal law-enforcement
      contract and contracted with a subsidiary of Houston Police Corporation.
    reasons: The narrator attributes the loss to the city's objections to racial prejudice
      and harsh policing, not simply a price dispute.
    relative_finances: The lost contract was small compared with Lone Star's other
      major operations, but its symbolic effect harmed the company's standing and
      threatened other contracts.
    board_reaction: Directors and senior managers reconsidered Clay Wilson's leadership
      as other municipalities expressed dissatisfaction.
  board_balance_and_removal:
    clayton_2035: Chairman and CEO Clayton Wilson retained about one quarter of voting
      shares, not a controlling majority.
    wendy: Venture capitalist Wendy Manderscheid had influence with multiple major
      shareholders and opposed the reputational and financial impact of Wilson's prejudices.
    james_wilson: Clay's younger brother James followed his example in business and
      owned roughly 10 percent of voting shares by 2036.
    coalition: Wilson family shareholdings totaled approximately 35 percent; an additional
      roughly 20 percent was held by Clay's personally loyal investors, forming a
      55-percent bloc before the vote.
    board_meeting: On April 8, 2036 Manderscheid moved to remove Clayton as CEO; James
      unexpectedly sided with Manderscheid, reversing the 55-to-45 voting balance
      against Clay.
    succession: Manderscheid replaced Clayton as board chair and named James Wilson
      CEO. Clayton lost both executive and chair positions, but retained his shares.
  james_reforms_2036_2038:
    executive_changes: James dismissed, transferred or demoted several senior managers
      loyal to Clay and appointed his own supporters.
    training_and_policy: The source credits James with expanding sensitivity and psychology
      instruction at the Lone Star Academy, curbing explicit institutional racism
      and sexism, and shifting treatment of suspects toward legal rights and police
      duties.
    commercial_result: Within eighteen months of his appointment Lone Star regained
      the Corpus Christi contract and gained five additional municipal contracts from
      jurisdictions leaning toward Knight Errant.
  2051_transition:
    wendy_retirement: Wendy Manderscheid retired as board chair in June 2051, after
      arranging James Wilson's succession to that chairmanship.
    ceo_succession: James Wilson appointed Theodore W. D. Winslow CEO, rather than
      remaining CEO as well as chair.
    equity_context: The accompanying stock offer put substantial shares into Winslow's
      personal holdings; the narrator does not state this was a consensual transfer
      from Clayton.
