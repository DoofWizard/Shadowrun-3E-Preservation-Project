data:
  publication:
    publisher: FASA Corporation
    title: Lone Star Sourcebook
    catalog_number: FASA7115
    publication_year: 1994
    game_context: Fictional Shadowrun tabletop roleplaying game
    edition: Historical original/Second Edition compatibility, not SR3-derived
  source_anchors:
  - printed_page: 33
    pdf_page: 33
    heading: Fast Response Teams; jurisdiction and earlier conflict
  - printed_page: 34
    pdf_page: 34
    heading: Fast Response Teams continued; founding and command jurisdiction
  - printed_page: 35
    pdf_page: 35
    heading: Fast Response Teams continued; roster, equipment and cross-training
  organization:
    name: Fast Response Teams
    abbreviation: FRT
    parent: Lone Star Division of Patrol (DivPatrol)
    contrasting_unit: Lone Star SWAT, in the Tactical Division
    authority: The narrator says ordinary patrol officers may request FRT support
      in urgent and dangerous confrontations; FRT and SWAT compete over responsibility
      for high-risk incidents.
  historical_foundation:
    period: Late 2030s in Austin
    rival_leaders:
    - Connie Bannister, Division of Patrol
    - Bryce Ward, Tactical Division
    dispute: Ward's SWAT organization was reluctant to support patrol divisions, leading
      Bannister to create a separate patrol-aligned unit.
    founding_year: 2038
    formation: Bannister removed a patrol squad from routine street duties, supplied
      it with the strongest armor and weapons available to her and reserved it for
      support assignments; the squad acquired the nickname Brute Squad.
    subsequent_status: The source narrator says Bannister obtained formal designation
      as a Fast Response Team before Ward could terminate the program, and the organization
      developed a sustained departmental role.
    conflict_afterward: SWAT and FRT continued to compete for jurisdiction and recognition;
      the narrator contrasts SWAT's specialist response to complex high-risk situations
      with FRT's priority on speed when the risk of collateral harm is judged lower.
    decision_boundary: Neither organization's jurisdiction is a universal game rule
      or a real-world police operational recommendation.
  standard_team:
    personnel: 12 officers
    armor: Heavy armor and fully active helmets
    communication: Active helmets; the precise heads-up display attributes occur in
      an attributed commentary record rather than narrator-proven manufacturing specifications.
    equipment:
      sidearm_choice: Colt Manhunter or Ruger Thunderbolt; the narrator describes
        the latter as becoming Lone Star's standard sidearm.
      personal: Shock gloves with cutaway palms accommodating a smartgun rig, spare
        ammunition clips, stun baton, and optionally a stun or concussion grenade,
        normally carried in web belt or bandolier.
      squad_allocation:
      - personnel_count: 8
        item: H&K 227-S submachine guns
        note: Smartgun links and recoil compensation
      - personnel_count: 2
        item: AUG-CSL assault rifles
      - personnel_count: 1
        item: CMDT combat assault shotgun
        note: Smartgun link
      - personnel_count: 1
        item: MA 2100 sniping rifle
      source_exactness: These are explicitly source-era fictional default equipment
        assignments and headcounts, not complete weapon statistics or mechanically
        inferred capabilities.
    transportation:
      typical: Citymaster vehicle
      alternate: Heavily armored WK-2 Stallion rotorcraft when necessary
    training: Regular cross-training lets unit personnel change posts and responsibilities
      rather than remain in one specialized role.
  next_section: Tactical Division begins near the bottom of printed p35/PDF35; its
    independent source facts are outside this FRT record.
