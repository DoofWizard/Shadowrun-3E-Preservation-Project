  organization: Drug Enforcement Division (DED)
  parent: Lone Star fictional private policing company / Enforcement Arm
  fictional_legal_predecessor:
    name: U.S. Drug Enforcement Administration (DEA)
    founded_year: 1973
    original_role: Combined four predecessor agencies and attempted to reduce production/import of illegal drugs while regulating limited
      legal trade in narcotic and dangerous drugs.
    narrator_trajectory: Book narrator characterizes later public war-on-drugs campaigns as a failure to curb demand, accompanied by enlarged
      punitive interventions and later transfer of functions.
  narrator_historical_events:
  - era: '2010'
    event: The book says DEA increasingly resembled a paramilitary agency instead of a conventional law-enforcement body.
  - era: beginning of 21st century
    event: The source says ASIST technology and BTL chips became a major new focus for DEA enforcement.
  - era: 2021 and Crash of 2029
    event: Indian War, the fragmentation of North America and the Crash of 2029 changed the succeeding UCAS fiscal and political circumstances.
  - era: UCAS restructuring
    event: Federal domestic enforcement mandates were reduced or shifted to FBI and state/municipal jurisdictions; armed forces took over
      much of the former DEA interdiction and fast-strike mission.
  - era: Clayton Wilson acquisition
    event: The UCAS government privatized the remaining hollow DEA organization to Lone Star founder Clay Wilson, including select hardware,
      personnel and especially existing computer data files.
  - era: late 2032
    event: Lone Star expanded its Drug Enforcement Division (DED) after Wilson chose to keep a name he liked.
  - era: '2033'
    event: The book says that by 2033 every Lone Star operation across North America maintained its own Drug Enforcement Division.
  source_narrator_interpretation: The book depicts Wilson prioritizing compulsory enforcement and supply reduction over public education
    or counseling to address addiction and market demand; it does not claim his strategy eliminated the underlying problem.
  attributed_claim_boundary: Forum comments disagree about drug-war policy, aircraft incidents, privatization and chronology; those remain
    separately attributed, not narrator-certified facts.
  game_mechanics_boundary: This narrator history contains no target numbers, dice rules or equipment stat block; retain historical setting,
    do not invent SR3 mechanics.
