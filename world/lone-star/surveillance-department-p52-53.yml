  department: Lone Star Department of Surveillance
  setting: Fictional corporate law-enforcement organization in the Shadowrun source-period
    setting; not present-day policing guidance.
  creation_and_role: The book says surveillance duties formerly fell to ordinary detectives
    and investigators. As surveillance and counter-surveillance became specialized,
    Lone Star created a separate department to meet demand for personnel with advanced
    equipment and technical skills.
  personnel: The department can request personnel from other divisions, but most recruits
    volunteer for surveillance duty. Officers in this department are informally called
    the Watchers by other Lone Star personnel.
  initial_training:
    specialized_course_duration: eight weeks in addition to the standard sixteen-week
      Academy curriculum
    areas: Surveillance and counter-surveillance technology, its strengths and weaknesses,
      tracking, stealth, and teamwork.
  remote_surveillance_section:
    staff: Riggers perform specialist remote surveillance operations in the fictional
      setting.
    equipment_role: The narrator describes aerial drones carrying advanced sensors
      that transmit scanned recognition information to precinct systems for computer
      searches; no game statistic or target number is printed in this section.
  attribution_boundary: The detailed Watcher anecdotes, claimed technologies, children’s
    alleged tracking devices, spirit assistance and contract-monitoring allegations
    are shadowtalk comments, not certified department-wide facts; they are preserved
    separately.
