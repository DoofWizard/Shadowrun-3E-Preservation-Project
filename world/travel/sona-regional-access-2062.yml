id: world.travel.sona-regional-access-2062
record_type: world
name: "Shadows of North America Regional Access and Border Procedures"
domain: travel
status: ingested
source_period: "2062"
scope: "Source-period regional entry, customs and patrol guidance used alongside the dedicated border-crossing mechanics."

regions:
  algonkian_manitou_council:
    access: "Customs are generally swift unless a traveler is flagged; borders are comparatively open, especially in winter."
    infrastructure: "Calgary and Saskatoon handle international semiballistic/suborbital traffic."
    security: "Major-city approaches receive more attention; the Manitou-controlled Churchill River line is much more closely watched by both sides."

  athabaskan_council:
    access: "Visitor restrictions are minimal, but weather can make travel difficult or impossible."
    infrastructure: "Juneau, Anchorage and Fairbanks are international airports; the Ares SpacePort on Kodiak handles restricted semiballistic/suborbital traffic."
    security: "Tsimshian and Manitou-adjacent borders are watched with inherited radar/listening systems plus aerial, ground and some water patrols."

  california_free_state:
    access: "Outside Saito's Protectorate, border control is sparse."
    airports: "San Francisco, Oakland and Sacramento take international flights and are guarded by Saito's forces."
    customs: "Visitors do not need visas, but customs are strict; metahumans may be refused entry without special corporate dispensation."
    sea: "Sea travel is mostly unrestricted; Monterey is a common alternative for avoiding Protectorate inspection."

  confederation_of_american_states:
    access: "International air, bus and train routes are common."
    security: "Aztlan and Florida borders are heavily militarized; other borders rely heavily on sensors and vehicle patrols."
    smuggling_guidance: "The source identifies the less militarized approaches as better choices for illicit entry."

  denver:
    access: "Entry and exit depend on the sector; each sector applies its parent nation's patrol, customs and visitor standards."
    infrastructure: "Denver has seven international airports and major road approaches from Sioux and Pueblo territory."
    internal_crossing: "Sector-to-sector travel requires correct airspace authorization or use of vehicle/pedestrian checkpoints; some pedestrian gates allow motorcycles."
    enforcement: "The ZDF has increased pressure on illegal cross-country smuggling."

  pueblo_corporate_council:
    legal_entry: "Legal entry requires purchase of a preferred share; the source-period rate is 100¥ and may fluctuate."
    infrastructure: "Santa Fe and Long Beach are international airports; regular travel links serve neighboring states."
    security: "All borders are heavily patrolled, with Aztlan, Ute and California especially strict; stealth drones investigate disturbances and response teams scale to the apparent threat."

  quebec:
    visit_limit: "Non-resident visits are normally limited to about one month, especially for metahumans and non-Francophones."
    customs: "Checks are strict on entry and comparatively lax on exit."
    infrastructure: "Montreal and Quebec City are international airports and major ports."
    patrols: "Typical patrols use two guards in a Patrol One, supported by aerial patrols and specialized drones/vehicles."

  salish_shidhe_council:
    visas: "No national visa is required, but individual tribes may deny entry or expel non-residents."
    inspections: "Sioux, AMC, Tir Tairngire and Ute borders receive light vehicle inspection; the Seattle border receives thorough checks/searches."
    tsimshian_border: "The border is closed and heavily militarized."
    infrastructure: "Vancouver is the sole international airport and primary trade port."

  sioux_nation:
    visas: "Travel, work and immigration visas are generally straightforward, but UCAS, CAS, Aztlan and megacorporate applicants receive special scrutiny."
    customs: "Denver and UCAS crossings receive more thorough physical searches and scans."
    infrastructure: "Casper is the sole international airport."
    patrols: "Four-person patrols use scout vehicles and microskimmer drones; shamans are common and Wildcats may reinforce responses."

  tir_tairngire:
    visas: "Tourist visas are easier than in earlier periods; most visitors are funneled through Portland, with more thorough checking for other destinations."
    infrastructure: "Portland is the sole international airport; Portland and Boise provide regular routes to the SSC and Seattle."
    patrols: "Border patrols emphasize stealth, spirits, detection/illusion magic and advanced sensors; some northern/southern patrols are Great Hunt paladins."

  tsimshian:
    visas: "Travel and visa restrictions are strict. Tsimshian/Tlingit members and approved megacorporate citizens have privileged access; other applicants face extensive paperwork."
    preferred_shadow_access: "The source suggests forged or genuine megacorporate credentials or illegal entry for shadowrunners."
    infrastructure: "No international airport accepts semiballistic/suborbital traffic; long-distance travelers connect to Kitimat from Anchorage, Seattle or Calgary."
    patrols: "Routine patrols are mundane three-person light-scout units, while the Salish-Shidhe border receives heavy military coverage."

  ucas:
    visas: "Legitimate entry is relatively easy with valid passport and visa; tourism is encouraged."
    customs: "Routine in normal cases, with travel movements logged in the Matrix."
    infrastructure: "Many international airports and broad air, bus, train and road connections."
    patrols: "Smuggling detection relies heavily on sensors; patrols commonly use GMC Banshees, Northrup Yellowjackets and trained dogs."

  ute:
    visas: "Travel visas for non-Amerindians are strict; Anglo applicants face particular difficulty, while Las Vegas-only visas are somewhat easier."
    corporate_exception: "Megacorporate employees with local holdings encounter fewer barriers."
    salt_lake_city: "As a sovereign state, Salt Lake City requires no visa."
    infrastructure: "Salt Lake City, Las Vegas and Provo are international airports."
    enforcement: "Border patrols are sparse, but internal security compensates with random traffic stops, temporary checkpoints and strict identity checks."

links:
