travel:
  - "International work, tourism and relocation are routine but require local knowledge, contacts and documents."
  - "Commercial travel includes air, rail, sea, bus and private road transport, each with different security, cost and convenience profiles."
  - "Passports, visas, SIN-linked records and other documentation may be required depending on destination and citizenship."
  - "Culture, language and local etiquette remain important even in a highly networked world."

shadow_travel:
  - "Shadow travelers use both ordinary commercial routes and illicit methods depending on legal status, cargo and destination."
  - "The chapter identifies forgery, concealment, bluffing, bribery and unauthorized border crossing as broad approaches to illicit travel."
  - "Smuggling networks and local contacts become increasingly important across controlled borders."

regional_overview:
  - "The chapter provides 2063 travel and shadow-context updates for Africa, Asia, Europe, North America, South/Central America and Oceania."
  - "Regional entries focus on border conditions, local instability, economic opportunities, shadow activity, travel hazards and notable urban hotspots."

