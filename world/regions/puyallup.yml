sites:
  crime_mall:
    address: "136th Street East and 122nd Avenue East"
    profile: "Abandoned mall converted to a black-market bazaar for illegal goods and services."
    security_context: "Lone Star raids periodically, but vendors use effective early warning and local political protection."
  spirit_focus:
    address: "Spanaway-McKenna Highway and 208th Street"
    profile: "Loveland jazz club owned/controlled by the yakuza and protected as a syndicate venue."
  underworld_93:
    address: "4819 96th Avenue East"
    profile: "Major downtown Puyallup concert/nightclub venue."
    security_context: "Manager Al Castanzo pays yakuza protection according to source-period commentary."
  carbonado:
    profile: "Ork-dominated former mining area with extensive surviving tunnels."
    smuggling_context: "Some tunnels extend under the Salish-Shidhe border and are used as cross-border smuggling routes."
  hells_kitchen:
    profile: "Lava flats, boiling mud fields, steam geysers and ash dunes west of Carbonado."
    awakened_context:
      - "Source commentary describes the area as useful for spirit-quests."
      - "Enchanters may find crystals, metals, stones and other natural materials; no numeric availability modifier is supplied."
  loveland:
    profile: "High-crime western border neighborhood used for vice, syndicate business and a smuggling route toward Tacoma."
  puyallup_city:
    profile: "Relatively clean, safer district center and seat of local government."
    corruption_context: "Source-period commentary portrays local government and industry as heavily influenced by Mafia/yakuza money."
  tarislar:
    profile: "Predominantly elven southern enclave."
    security_context: "Knight Errant contract raises its effective security rating from C to A."
gangs:
  black_rains:
    profile: "All-ork Carbonado gang; protection, smuggling and chip-dealing."
    relationship_note: "Tied to the Cascade Ork tribe and an ork smuggling network using Carbonado tunnels."
  princes:
    profile: "Elven Tarislar gang ('Princes of the Blood') led by the Black Prince; street-fighter/defender identity and hostility toward rival gangs."
  forever_tacoma:
    profile: "Ork-and-troll Loveland gang working protection, gambling and street-level vice; source says it has worked for both Mafia and yakuza."
  reality_hackers:
    profile: "Techno-gang near the Puyallup River/Tacoma border specializing in theft, datasteals, chips, pirated software and cyberware."
    matrix_note: "Local poor Matrix infrastructure forces many jobs to combine physical intrusion with decking; the gang is described as capable at both."
