id: world.region.california-protectorate-2062
record_type: world
name: "California Protectorate"
domain: regions
status: ingested
source_period: "2062"
leadership:
  - "General Keiji Saito leads a new political-military force centered on the Bay Area and Central Valley."
  - "The Game Information section states that Saito rejected the new Japanese Emperor's policy changes, went absent from Imperial command and formed the Protectorate as his own power base."
agenda:
  - "The Game Information section identifies Saito's concealed objective as an exclusionary state directed against metahumans."
  - "His public-relations program is intended to conceal the full extent of that agenda."
alliances_and_operational_context:
  - "The Human Nation is identified as a source of backing for Saito."
  - "Corporations and Yakuza interests may pursue compatible objectives independently and are more willing than Saito to employ shadowrunners."
  - "Saito himself prefers his own soldiers for important work and views shadowrunners as unreliable."
campaign_use:
  - "Runners can be drawn in indirectly through corporate, Yakuza or apparent third-party jobs."
  - "The chapter warns that runners may be manipulated into actions whose political meaning differs from the stated job."
  - "Characters visibly associated with pro-metahuman groups may face increased official scrutiny."
