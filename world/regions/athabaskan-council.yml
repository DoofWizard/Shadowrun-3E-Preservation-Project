government:
  structure: "Two elected councils select ten delegates to the Grand Council; an elected Governor serves a five-year term."
  governor: "Chief Delas Skyseeker"
  elections: "Lower Council represents municipal zones; Upper Council is elected by general ballot. Political parties are illegal."
  voting_eligibility: "Only citizens who are officially tribally affiliated may run for office or vote."

timeline:
  - {year: 2020, event: "Athabaskan Oil is established and receives land rights for active oil fields."}
  - {year: 2022, event: "First recorded sea-wolf attack at Goodnews Bay leads to an official bounty."}
  - {year: 2040, event: "The Council recognizes sasquatch as a sentient being."}
  - {year: 2044, event: "Iris Firmware develops redundant relay, satellite and microwave Matrix links."}
  - {date: "18 June 2048", event: "The Trans-Athabaskan Pipeline reopens after repairs."}
  - {date: "October 2061", event: "Astral space becomes visible around the Harding Icefield."}

matrix_and_transport:
  - "Edmonton is the only municipal zone described as having reliable ground-line connections to the outside world."
  - "Other zones rely heavily on satellite links that are unreliable in severe weather."
  - "Roads are sparse outside major cities; remote travel often depends on aircraft and sea craft built for extreme weather."

law_enforcement:
  - "Municipal zones handle police, fire and other local services; some contract these services, but many remote communities rely on local watches and militias."
  - "Government reach is weakest in isolated communities."

economy:
  major_resources: ["oil", "uranium", "platinum", "iron", "timber"]
  athabaskan_oil:
    profile: "Nominally private but tribally owned; central to national oil development and the Trans-Athabaskan Pipeline."
    tap_fund: "A major share of profits is distributed annually in equal shares to tribal citizens."
  communications: "Iris Firmware is the principal communications and entertainment provider named in the source."
  tourism: "Eco-tourism is a significant industry."

places:
  Anchorage:
    role: "Major transport and shadow-market center; not the political capital."
  Edmonton:
    role: "Political capital and seat of Council Hall."
    council_hall_security: "Concealed security systems include sniffers, assensing, scans, probes and physical surveillance."
  Fairbanks:
    role: "Oil-field and research center near the Trans-Polar Aleut border."
  Kodiak_Island:
    role: "Ares-dominated military/aerospace center; former US installation and Alaska Spaceport."
  Nome:
    role: "Bering Strait port with strong Russian-descended population and heavy Vory influence."

wilderness_and_magic:
  - "Remote wilderness is treated as strategically and spiritually important; wilderness travel can be extremely hazardous."
  - "Denali is described as a major power site where the barrier between worlds is unusually thin."
  - "The Harding Icefield is another power site; after the 2061 comet event, its astral plane is described as visible."
  - "Sasquatches are recognized as sentient and may receive citizenship."
  sea_wolves:
    profile: "Awakened/Goblinized marine predators associated with toxic-exposure mutation."
    bounty: "1,000¥ per sea wolf; proof of death requires the pelt with head."

