historical_context:
  - "The chapter presents coastal West Africa as politically fragmented after colonial, environmental, epidemic, economic and resource shocks."
  - "English and French remain common trade languages beside local languages."
  - "Baule-Anyi and Asante-Fanti rivalries shape later regional politics."

resource_and_trade:
  - "From 2004, severe agricultural disruption reduced staple and export production while mining and industry expanded."
  - "Earthquakes on 10 December 2005 exposed major Black Volta gold and diamond deposits and intensified the Ghana-Cote d'Ivoire dispute."
  - "Political collapse and later trade restrictions increased the role of coastal informal trade routes for gold, diamonds, bauxite, coffee and cocoa."
  - "The source names Shiawase, Dow Chemical and Keruba among early corporate entrants."

public_health_and_awakening:
  - "VITAS-1 in 2011 is described as causing exceptional regional mortality and overwhelming public-health systems."
  - "Source-cited primary-infection estimates are about 13.5 million fatalities in Cote d'Ivoire and 16.8 million in Ghana, with additional coastal losses from secondary disease; these remain in-setting estimates."
  - "Magical and traditional healing gained political legitimacy during the Awakening; competing explanations for survival differences remain attributed commentary."

population_and_normalization:
  - "Goblinization in 2021 disrupted several young ethnonational states and created new metatype-based political divisions."
  - "The source reports an Akan-speaking ghoul population of roughly 25,000 moving north toward the Upper Volta region."
  - "Asante received UN recognition in 2026 and reopened international trade while attempting to limit direct corporate political control."
  - "Accra and independent Sekondi are described as principal trade centers by the 2050s; much of the interior remains comparatively isolated."
  - "Post-Awakening ecological and terrain changes are presented partly through speculative scientific commentary and are not generalized into a magic rule."

