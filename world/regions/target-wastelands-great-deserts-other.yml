atacama_desert:
  location: "Western South America between Chile and Peru."
  environment:
    - "Salt basins, sand, geysers and lava flows; described as the driest place on Earth."
    - "The source calls the region a major mana ebb."
  corporate_activity:
    - "Pemex/Aztechnology and Mitsuhama-Benguet Mining exploit mineral deposits."
  commentary_only:
    - "Ares testing Martian and lunar explorer drones is posted commentary."

kara_kum_and_kyzyl_kum:
  location: "Central Asia from the Caspian region toward Omsk."
  infrastructure: "The Trans-Caspian railway and Kara-Kum Canal cross the desert region."
  awakened_changes:
    - "Significant geothermal and seismic activity is reported since the Awakening."
    - "Kyzyl Sink Holes cover roughly 500 square kilometers, with the deepest reaching about 400 meters, revealing extensive limestone caverns."
  waste_legacy:
    - "The deserts are described as a major Eurasian waste-dumping region."
    - "Toxic pools, contaminated areas and sealed repositories for hazardous industrial, nuclear, chemical and military waste are reported; some have leaked or been damaged."

lout_desert:
  location: "Central Iran."
  environment:
    - "Described as one of the hottest places on Earth, with long droughts interrupted by violent flash floods."
    - "The interior is nearly devoid of vegetation and surface water; five salty springs and an ancient western aqueduct are named as water sources."
    - "Some areas are described as having very low background count."
  political_status: "Few settlements exist on the fringes and the source says the Iranian government refuses major corporate access."
  commentary_only:
    - "Black Scorpion underground camps and covert aid networks are posted claims, not established facts."

taklimakan_desert:
  location: "Central Xinjiang between the Tien Shan, Kunlun and Pamir mountain systems."
  environment: "Highly isolated sand desert with the Tarim River running toward the Lop Nor marshes."
  economic_history:
    - "Halley's Comet-era orichalcum discoveries triggered a short-lived Orichalcum Rush."
    - "Ruby and star-sapphire finds in the Kashmir Mountains continued after the rush."
  source_period_status: "Despite resource discoveries, the source describes the region as sparsely populated and largely isolated."
  commentary_only:
    - "Claims about unusual gem properties, a Monobe arcology, and Wuxing searching for buried civilizations are posted commentary."

