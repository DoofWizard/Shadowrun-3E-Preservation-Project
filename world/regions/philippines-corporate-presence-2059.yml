id: world.region.philippines-corporate-presence-2059
record_type: regional_corporate_presence
name: "Philippines Corporate Presence"
status: ingested
source_period: "2059"
source: source.fasa-7124
canonical_region: world.region.philippines-2059
printed_pages: "68-72"
pdf_pages: "69-73"

major_corporations:
  - id: corporation.mitsuhama-computer-technologies
    source_period_role:
      - "MCT is presented as the largest corporate employer in the islands and as a major landholder, manufacturer and military supplier."
      - "Its Philippine operations include electronics and computer production, heavy industry, oil refining, mining, munitions and security support."
      - "The source associates MCT with Clark Air Force Base, Subic Bay Naval Base and other Imperial military facilities."
    regional_units:
      - name: "Parashield"
        role: "paranormal-animal breeding, veterinary work and security support"
        fauna:
          - "hellhounds"
          - "barghests"
          - "buwaya (Awakened saltwater crocodiles)"
          - "kiwigs (boar-like piasmae)"
          - "pythons"
          - "king cobras"
      - name: "Mitsuhama factories"
        role: "plastics, textiles, computer parts, programs and sim products"
  - id: corporation.shiawase
    source_period_role:
      - "Shiawase is described as the second major corporate power in the islands, with fewer sites than MCT but strong influence through energy, medicine and environmental services."
      - "Its nuclear-power holdings are treated as a major source of leverage with the prefectural government."
    regional_units:
      - name: "Shiawase Environtech"
        role: "logging, agriculture, planned forestry and environmental services"
        locations:
          - "Palawan"
          - "Bukidnon-San Fernando"
      - name: "Shiawase medical services"
        role: "hospitals and subsidized health care tied to employment"
  - id: corporation.renraku-computer-systems
    source_period_role:
      - "Renraku's local presence is less visible than its economic importance."
      - "The source associates Renraku with the Philippine Matrix infrastructure, computer/deck parts, machine tools and sim-player production."
      - "Two underwater laboratories are described as researching magic, natural medicine, awakened coral and plankton-related mana effects."
    regional_projects:
      - name: "Underwater Living"
        status: "partially complete in 2059"
        description: "A large domed underwater settlement project near Negros with aquaculture and resident behavioral research."
  - name: "Fuchi Industrial Electronics"
    source_period_role:
      - "Fuchi is described as having a comparatively small Philippine footprint centered on entertainment and communications."
      - "The source associates it with live entertainment, trid/vid/radio outlets and the remote-voting system."
      - "Recent purchases of sugar refineries and logging companies are presented as a source-period development."
    provenance: "Historical corporation name retained as printed; no supersession is inferred from later corporate history."
  - id: corporation.yamatetsu
    source_period_role:
      - "Yamatetsu is represented mainly through subsidiaries rather than a strong direct branch."
      - "Its holdings include urban planning, construction, agribusiness, tourism and geothermal power."
    regional_units:
      - name: "Meta-Ergonomics"
        role: "segregated neighborhood and city planning"
      - name: "Shibata Construction and Engineering"
        role: "construction and engineering"

local_and_smaller_firms:
  - "The source says many smaller Japanese firms were absorbed by larger corporations or arrived too late to establish major Philippine holdings."
  - "Some independent Filipino corporations remain, though the chapter portrays their position as constrained by Japanese corporate power."
  - "Saeder-Krupp, Ares and Aztechnology are described as disadvantaged by strong tariffs and other market restrictions."

source_attribution:
  - "Claims in Shadowland commentary about pollution, corruption, covert projects, corporate motives and internal rivalries remain attributed unless presented as direct setting description."
  - "Corporate facilities and divisions are recorded as source-period regional facts without treating every commentator claim as verified."

sources:
