timeline:
  - {date: "31 October 2010", event: "Québec secedes from Canada and becomes a republic."}
  - {date: "7 February 2011", event: "French becomes the only legal business language."}
  - {date: "3 May 2011", event: "Québec Riot burns down the Latin Quarter."}
  - {date: "27 January 2014", event: "Treaty of Kahnawake is passed to preempt Amerindian dissidence."}
  - {date: "1 May 2021", event: "Harmful Paranormals Act is passed."}
  - {date: "28 June 2053", event: "Cross Applied Technologies reaches AA extraterritorial megacorporate status."}
  - {date: "15 April 2060", event: "CATCo reaches AAA status and gains a Corporate Court seat."}
  - {date: "1 January 2061", event: "The Démocrates Mondains become the ruling party."}
  - {date: "19 September 2061", event: "The Harmful Paranormals Act is amended to include SURGEd species and exclude dragons."}
  - {date: "March 2062", event: "Republic borders open wider to tourism, trade and immigration."}
  - {date: "July 2062", event: "English begins a trial period as a legal business language."}

government_and_politics:
  national_assembly:
    seats: 125
    election: "Voters elect one deputy; the party with the most deputies forms the majority, the second-highest becomes the Opposition, and the remainder form the lower tier."
  ruling_party_2062:
    name: "Démocrates Mondains"
    president: "Hélène Bard"
    policy: "Opening Québec to international trade, reducing isolationist restrictions and loosening business-language rules."
  opposition:
    name: "Parti Québécois"
    leader: "Joel Jénache"
  minor_parties:
    - "Greens"
    - "Alliance Francophone"
    - "Alliance Métahumaine"
  corporate_influence:
    CATCo: "Major domestic AAA megacorporation and political actor associated with Lucien Cross."
    Ares: "Increasingly visible commercial and political influence, especially through Anglophone interests."

language_and_trade:
  historical_policy: "French-language business requirements and isolationist trade policy were central features of the Republic."
  2062_transition: "The government is reducing trade barriers and testing English as a second legal business language."
  currency_transition: "The government announces that the nuyen will replace the New Franc as public currency by the end of 2062."

security:
  gendarmerie:
    role: "Primary national law-enforcement provider and holder of the Québec City police contract."
    ownership: "Lone Star subsidiary operating under Québec restrictions rather than extraterritorial status."
    national_scope: "Patrols the sprawls, border and customs duties; it also absorbed Québec Defense Force functions."
    headquarters: "Québec City Citadel"
    security_zones: "Uses Lone Star security-rating practice, including a W-zone designation for wilderness territory it will not willingly patrol under normal circumstances."
  border_2062:
    status: "Borders are more open than before but remain actively policed."
    measures: ["small patrol teams", "drones", "reserve response units", "customs gates", "cargo X-ray screening"]
  emergency_medical:
    restriction: "The source states that DocWagon and competitors do not operate in Québec."

enterprise_zones:
  concept: "Walled urban parcels leased to megacorporations after government approval."
  extraterritoriality: "A tenant's extraterritoriality begins at the wall and lasts only for the duration of the lease."
  allocations_2062:
    Quebec_City: {authorized: 12, claimed: 11}
    Montreal: {authorized: 18}
  local_law_outside: "Corporate holdings outside an Enterprise Zone remain ordinary Québec territory and must comply with local law and Gendarmerie authority."
  language_inside: "Corporations inside an Enterprise Zone may use any language."
  customs: "Temporary unannounced customs posts may be placed at Enterprise Zone access points."

organizations_and_factions:
  seraphim:
    affiliation: "Lucien Cross / CATCo"
    profile: "Source presents them as a high-reputation global intelligence organization; much operational detail is supplied through shadowtalk and remains report-level rather than independently verified."
  biker_gangs:
    Hellsouls: "Long-established Montréal biker power with multiple subordinate gangs."
    Spine_Breakers: "Fast-growing rival based around Laurier Station."
    Devil_Riders: "Large western-Québec gang linked in the source to a smuggling pipeline toward Toronto/UCAS."
  force_populaire: "Radical Francophone underground associated in the source with violent attacks on Anglophone targets."

places:
  Quebec_City:
    role: "Capital, seat of the National Assembly, Gendarmerie headquarters and a major Enterprise Zone market."
    Institut_Thaumaturgique_de_Quebec: "Corporate-backed thaumaturgical school; the source associates top students with Seraphim recruiting."
  Montreal:
    role: "Industrial sprawl with extensive Enterprise Zones and a large underworld/biker presence."
  Bouclier_des_Laurentides:
    role: "Sparsely policed northern wilderness and important hydroelectric region; also a major smuggling corridor."
    hydroelectricity: "A chain of major Hydro-Québec dams supplies most national power and exports substantial electricity to the UCAS."
    installations: "The source states there are twelve major hydroelectric installations."

