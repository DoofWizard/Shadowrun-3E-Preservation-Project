government_and_law:
  structure: "The SSC is strongly tribal and decentralized. Each tribe sends a representative to the Council while retaining extensive autonomy and its own laws."
  federal_law_scope: "The Council maintains a limited set of nation-wide laws for major crimes and common weapons, cyberware and travel restrictions."
  tribal_law_scope: "Offenses such as theft, controlled substances, hacking, smuggling and bribery are largely left to individual tribal law."
  enforcement: "Salish Border Patrol and Rangers enforce national rules; larger tribes also maintain their own police forces."
  punishment_variation: "Penalties vary substantially by tribe and can range from minor punishment through banishment or indentured servitude."
  corporate_policing: "The source states that corporate rent-a-cops are not used for ordinary SSC law enforcement."

timeline:
  - {year: 2018, event: "The Treaty of Denver forms the Salish-Shidhe Council."}
  - {year: 2029, event: "The SSC opens its borders to all metahumans; the Sineserach elf tribe is founded."}
  - {year: 2035, event: "The Cénesté branch of the Sineserach establishes Tir Tairngire and immediately secedes."}
  - {date: "3 December 2059", event: "An earthquake levels Richmond outside Vancouver."}
  - {year: 2060, event: "Border tensions with Tsimshian escalate after Salish hikers are arrested and tried as spies."}
  - {date: "2-4 May 2062", event: "Open conflict breaks out on the Tsimshian border; the source reports thousands of SSC military casualties while the cause of the unusual deaths remains disputed."}
  - {date: "5 May 2062", event: "The SSC signs a cease-fire with Tsimshian."}
  - {date: "July 2062", event: "The cease-fire is broken by renewed attacks."}

military:
  salish_rangers: "Historically a militarized police force handling both civil and military duties."
  border_and_coast_patrols: "Handle routine border crossings, customs and patrol duties."
  self_defense_force: "The SSC re-created the Self-Defense Force for dedicated military operations during the Tsimshian conflict, drawing personnel from the Rangers."
  command_trend: "The SDF is intended to centralize regional military branches under a common command, though tribal autonomy complicates that process."

border_and_travel:
  open_borders:
    neighbors: ["Sioux Nation", "Algonkian-Manitou Council", "Ute Nation"]
    procedure: "Incoming traffic normally receives a routine inspection; travelers with proper identification and licenses do not require special visas or passports."
    presence: "Checkpoints and patrols are described as relatively sparse."
  restricted_borders:
    neighbors: ["Seattle/UCAS", "Tir Tairngire", "Tsimshian"]
    outbound: "Outgoing traffic generally receives a cursory visual and license check."
    inbound_seattle_and_tir: "Incoming traffic from Seattle and Tir Tairngire is inspected; approximately one vehicle in four may receive a comprehensive inspection using chemical sniffers and on-duty shamans."
    northern_alert: "During the source-period conflict, traffic from Tsimshian and the Athabaskan Council is heavily restricted and controlled by Border Patrol with Ranger/SDF support."

corporate_policy:
  extraterritoriality: "Megacorporate extraterritorial presence is limited because a tribe must agree to surrender land for that status."
  regulation: "Many tribes enforce strict environmental and safety standards that discourage megacorporate operations."
  common_structure: "Several major corporations operate through subsidiaries rather than large extraterritorial enclaves."

magic_and_environment:
  power_sites: "Following the comet-era disturbances, dozens of new power sites are reported across SSC territory while some older sites disappeared."
  disputed_sites: "Some power sites became intertribal disputes, including Whidbey Island claims contested between tribes."
  surge: "The source reports a comparatively smaller share of changeling transformations than neighboring countries and no comparable panic riots."

places_and_economy:
  Vancouver: "Major commercial center and Pacific trade port; Richmond remains devastated after the 2059 earthquake."
  Boise: "A major transit point near Tir Tairngire and a large tax- and duty-free merchant zone."
  energy: "Gaeatronics is a major SSC power producer, including fusion, wind, geothermal and solar generation."

