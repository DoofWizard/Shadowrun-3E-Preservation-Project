governance:
  - "The Caribbean League is a loose association of islands and territories rather than a unitary state."
  - "Individual member governments retain substantial practical autonomy."
  - "League-wide policy is uneven when local governments decline to enforce it."
  - "The League legislature meets in Havana and uses island-based voting."

regional_notes:
  - "South Florida joined the League after separating from the CAS."
  - "Cuba is presented as the strongest organized state actor in the League."
  - "Borinquen, Jamaica, Haiti and the Dominican territories have distinct local power structures."
  - "Bermuda is outside the League and remains under British law."

magic_notes:
  - "The chapter describes obeah as related to voudoun while less centered on named loa or formal temple organization."
  - "Bermuda is associated with reported magical instability; these reports remain attributed setting claims rather than confirmed mechanics."

