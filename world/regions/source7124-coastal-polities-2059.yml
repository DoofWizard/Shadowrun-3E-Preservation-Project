entities:
  - id: world.polity.asante-nation-2059
    name: "Asante Nation"
    ruler: "Osei Agyemang"
    major_cities:
      - "Accra"
      - "Kumasi"
      - "Koforidua"
      - "Tema"
    major_river: "Volta"
    source_notes:
      - "The source describes the Asante Nation as the principal organized state in the region, centered in southeast Ghana."
      - "Accra is described as its principal port and an important trade hub."
      - "Corporate access is restricted compared with neighboring territories, and foreign commercial activity is politically sensitive."

  - id: world.region.fanti-territories-2059
    name: "Fanti Territories"
    source_notes:
      - "The Fanti territories lie west of the Asante Nation and are described as decentralized coastal communities rather than a unified state."
      - "Small maritime settlements and informal trade networks are central to the region."
      - "Relations with Asante are hostile and periodically violent in the source period."

  - id: world.city.sekondi-2059
    name: "Sekondi"
    status: "independent city"
    source_notes:
      - "Sekondi is described as a heavily corporatized independent city and major port."
      - "Its economy and security are shaped by multiple megacorporate presences and local authorities."
      - "The city serves as an important employment, trade and transit center for independent operators."

  - id: world.polity.asamando-2059
    name: "Asamando"
    ruler: "Thema Laula"
    major_city: "Nyamkopon"
    major_river: "Black Volta"
    source_notes:
      - "The source describes Asamando as a ghoul-ruled polity in northern Ghana."
      - "Thema Laula is presented as the central political authority and as rebuilding settlements and state institutions."
      - "Source commentary disputes the character of the regime and the reliability of outside accounts."

  - id: world.region.baule-anyi-lands-2059
    name: "Baule Empire and Anyi Lands"
    source_notes:
      - "The source describes continuing Baule-Anyi territorial conflict and competition over land, trade and political authority."
      - "Corporate and mercenary involvement is presented as an important factor in the conflict."
      - "Claims about atrocities, motives and covert support remain attributed to source commentators unless stated directly in the regional description."

