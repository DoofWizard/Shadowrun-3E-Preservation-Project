id: world.region.denver-front-range-free-zone
record_type: world
name: "Denver / Front Range Free Zone"
domain: regions
status: ingested
source_period: "2062"

at_a_glance:
  population: 3911000
  population_mix: {Human: "61%", Elf: "13%", Dwarf: "5%", Ork: "19%", Troll: "1%", Other: "1%"}
  per_capita_income: "22,500¥"
  estimated_SINless: "15%"
  below_poverty_level: "30%"
  corporate_affiliation: "36%"
  education: {less_than_twelve_years: "20%", high_school_equivalency: "50%", college_degree: "23%", advanced_degree: "7%"}
  major_languages: {English: "83%"}
  currency: "Nuyen; sectors also use their national currency"
  docwagon_coverage: "100%"
  guaranteed_response_time: "10 minutes"

timeline:
  - {year: 2019, event: "Treaty of Denver establishes the Front Range Free Zone under the Council of Denver and divides the city among Aztlan, Pueblo, Sioux, Ute and the United States."}
  - {year: 2023, event: "US representative Marlene Weiss withdraws and the US creates an autonomous defense zone; the FRFZ fragments further."}
  - {year: "2025-2027", event: "Treaty land-harmonization provisions reduce sector size; the Aurora Warrens remain untouched."}
  - {year: 2034, event: "The CAS enters Denver following its secession from the UCAS."}
  - {year: 2037, event: "Denver Data Haven begins operation."}
  - {year: 2043, event: "Medical-services contract is awarded to DocWagon."}
  - {year: 2055, event: "Universal Brotherhood chapterhouse is destroyed by a Firewatch team, damaging part of the Aurora Warrens."}
  - {date: "24 December 2061", event: "Ghostwalker appears and begins his assault on Denver."}
  - {date: "January 2062", event: "Ghostwalker and the Council meet; Ghostwalker assumes control, Aztlan is removed, its sector is divided, and the Zone Defense Force is created."}

government:
  council_of_denver:
    role: "Day-to-day governing body for the FRFZ under Ghostwalker's oversight."
    sector_representatives_2062:
      CAS: "Elizabeth Kalheim"
      Pueblo: "Jonathan Popé"
      Sioux: "Lucinda Gray Arrow"
      UCAS: "Jeremy Falloon"
      Ute: "William Huhuseca"
    voting: "Majority threshold falls from three votes to two because the Aztlan seat is gone."
  ghostwalker:
    status: "De facto sovereign power above the Council; sometimes attends Council meetings and otherwise works through representative Nicholas Whitebird."
    liaison_office: "Handles Council business, petitions and other official dealings with Ghostwalker."
  administrative_branch:
    role: "Municipal bureaucracy for budgets, sanitation and city services."
    workforce_change: "Reduced from about 10,000 employees to just under 6,000 after Ghostwalker's takeover."
    contracted_services:
      medical: "DocWagon"
      sanitation: "BIF, Inc."
      power: "Pueblo nuclear-fusion plant in Greenland"
      transit: "Front Range Transit International"

tax_and_services:
  free_zone_income_tax: "15% of income; source instructs residents to remit it immediately to the Revenue and Taxation Service."
  tax_incentive: "Eligible taxpaying citizens receive free Basic DocWagon service; higher service levels are paid out of pocket."

matrix:
  operator: "Pueblo Corporate Council"
  infrastructure: "Approximately three dozen networked state-of-the-art mainframes support the Denver grid."
  post_2061_changes:
    - "Ghostwalker and the Council receive some top-level access."
    - "Top-heavy architecture was reorganized and hardened with local intrusion countermeasures."
  sector_notes:
    pueblo: "Pueblo sector grid is presented as the model for broader Denver redesign; local decker talent is strong."
    sioux: "Warpdrive Pyramid remains a major local Matrix landmark and corporate/technical center."

zone_defense_force:
  abbreviation: "ZDF"
  role: "Standing multinational military and security force for the FRFZ."
  composition: "Units are loaned from the five Council nations; personnel serve rotating one-year ZDF tours."
  command: "More permanent command cadre, approved by Ghostwalker."
  duties:
    - "Protect Administrative Branch and Council facilities."
    - "Conduct multi-sector investigations and resolve disputes."
    - "Interdict smuggling."
    - "Maintain detachments at major airports, Fort Carson and the old Rocky Mountain Arsenal."
    - "Patrol the outer FRFZ boundary and Interstate 25."
  jurisdiction: "Only city security force explicitly described as able to pursue a suspect across sector boundaries."

travel_and_border_security:
  airports:
    - "Stapleton serves the UCAS sector."
    - "Denver International serves the Sioux sector."
    - "Lowry serves the CAS sector."
  interstate_25: "Functions as sector demarcation until the CAS sector; there it is treated as international territory handled by the ZDF."
  crossing_procedure:
    - "Sector crossing is restricted to designated checkpoints."
    - "Only some checkpoints permit vehicle traffic."
    - "Travelers can be subject to ID checks, body scans and questioning about their cover story."
  frequent_traveler_passcard:
    effect: "Allows a faster checkpoint lane."
    limitation: "Holder is still scanned; card broadcasts identity data to sensors and movements are logged."
  demarcator_security:
    common_measures: ["approximately 50-meter no-man's land", "tripwires", "sensors", "mines", "electrified fences", "razor-wire walls"]
    variation:
      CAS: "Coverage is described as incomplete and temporarily thinner after sector expansion."
      Pueblo: "Leans on technology and fewer personnel."
      Sioux: "Uses foot patrols, Sikorsky-Bell ACVs, Microskimmer drones and field-trained animals."
      UCAS: "Uses similar technological measures plus Yellowjackets and ECCM support."
      Ute: "Leans heavily on watcher spirits, elementals and nature spirits, with Citymasters and LAVs as backup."

sector_law_and_security:
  CAS:
    security: "Knight Errant is sector security; CAS military support is temporary after the 2061-62 transition."
  Pueblo:
    security: "Pueblo-sector corporate/security environment is comparatively orderly and closely tied to PCC institutions."
    intoxicants: "Alcohol and legal simchips are relatively lightly restricted."
    BTLs: "Illegal."
    offense_under_influence: "A crime committed while intoxicated is treated as premeditated; source states penalties can be up to five times harsher than possession."
  Sioux:
    security: "Eagle Security Services is named as local security."
    cyberware_policy: "Class A cyberware is tolerated; smartlinks, hand razors, dermal armor and VCRs are cited as common legal examples."
  Ute:
    security: "More magically oriented than other sectors."
    gambling: "Source states gambling is legal throughout the FRFZ."

places_and_conditions:
  Aurora_Warrens:
    profile: "High-density slum and persistent shadow zone heavily damaged by the 2055 Universal Brotherhood/Firewatch incident."
  Fort_Logan_Medical_Center:
    profile: "Mental institution nicknamed the Asylum; security emphasizes hidden technology."
  Lakewood_Correctional_Institution:
    profile: "Pueblo-sector prison known as the Can."
  Fort_Carson:
    profile: "ZDF base and training ground; former US Air Force academy."
  Nexus:
    profile: "Major data haven associated with the former academy site; security increased after prior extraction incidents."
  Sioux_Hub:
    profile: "Non-contiguous Sioux/UCAS downtown enclave containing Ghostwalker's liaison office and Warpdrive Pyramid."
  Draco_Foundation_Denver:
    profile: "New Denver office in the UCAS side of the Hub; its relationship with Ghostwalker is presented as distant and uneasy."
  Flatirons:
    profile: "Ute-associated sacred/power-site area near Boulder."
  Lakeside_Amusement_Park:
    profile: "Abandoned park in the Ute sector redeveloped into a gambling and entertainment district after Ghostwalker's purge of the site."

