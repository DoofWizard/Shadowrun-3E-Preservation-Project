id: world.region.target-wastelands-sahara-kalahari
record_type: world
name: "Target: Wastelands — Sahara and Kalahari"
domain: regions
status: ingested
source_period: "2062"

sahara:
  extent: "Across northern Africa from the Atlantic to the Red Sea."
  environment:
    - "Strong trade winds create extensive mobile dune systems; rocky mountains, badlands, oases and major underground aquifers also occur."
    - "The source identifies the Sahara as a major Desert Wars region."
  residents:
    - "Bedouin, Tuareg and Fellahin are described as major nomadic populations."
    - "Fellahin communities are described as largely metahuman, changeling or Awakened refugees displaced from other societies."
  paranormal_ecology:
    - "The source names flame jackals, scorpyrines, afancs, rockworms, sand chameleons and sandworms."
    - "Formal statistics for sand chameleons and sandworms are normalized in catalog.critters.target-wastelands-desert."
  corporate_activity:
    - "Mining, petroleum extraction, refineries, manufacturing, research facilities, clinics and training sites are widespread."
  magic:
    - "Mana ebbs and surges, apparitions and astral structures are reported across the Sahara."
    - "Former Libya is specifically described as an area where ghosts, heavy background count and toxic conditions are expected."
  commentary_only:
    - "A reported metaplanar gate near Nabta is presented as unverified."

kalahari:
  environment:
    - "The Kalahari is described as trending from desert toward savanna, with increasing rainfall and more stable vegetation."
    - "Awakened plants and animals are said to have reshaped the local ecosystem."
  residents:
    - "The !Kung San are described as having returned toward a hunter-gatherer lifestyle after earlier disruptions."
    - "They are described as strongly protective of local wildlife."
  commentary_only:
    - "Specific claims about eco-activist training camps and unusual paracritter research appear as posted commentary."

sources:
