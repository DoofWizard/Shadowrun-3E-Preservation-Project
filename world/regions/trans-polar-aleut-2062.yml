  "2013": "The shaman Ininook forms the Sovereign Northern Tribal Alliance and applies for symbolic SAIM membership."
  "2014": "Aleut shaman T'singilik begins consolidating the Aleutian bands."
  "2018": "Treaty of Denver; T'singilik monopolizes SNTA representation, and the new nation is christened the Trans-Polar Aleut."
  "2020": "Capital is established at Inuvik."
  "2029": "Iceland turns to the T-PA for relief during economic crisis and is adopted as a protectorate."
  "2050": "The Trans-Polar Aleut withdraws from active participation in the NAN."

government:
  structure: "A loose collection of tribal governments; the Polar Council is nominally central, while village elders and regional coalitions hold substantial practical power."
  peace_force: "A small combined military and police service used for border patrol, anti-smuggling, anti-poaching, rescue and wilderness duties."

