government:
  council_of_chiefs:
    membership: "20 members, one from each officially recognized tribe."
    appointment: "Chiefs are appointed to five-year terms by a Council of Elders consisting of one elder from each of the twenty tribes; elders serve for life."
    powers: "Appoints bureau leadership, sets policy and passes legislation."
    voting_rule: "Decisions require a two-thirds majority, specified by the source as 14 votes."
  tribal_balance: "No single tribe formally dominates all branches of society, though the source describes continuing informal tribal patronage and social stratification."

military_and_police:
  defense_service:
    compulsory_service: "Citizens at age 18, male and female, owe one year of service with the Sioux Defense Force followed by four years of reserve duty."
    pacifist_alternative: "Some pacifists may perform two years of social service instead."
    sinless_exception: "The source says SINless residents generally escape the compulsory-service system."
    criminal_sentence_option: "Minor criminal punishment may include extended military service instead of probation."
  sioux_defense_force: "The SDF is described as the largest military force in the NAN and handles border, airport and customs security as well as national defense."
  sioux_national_police:
    jurisdiction: "National civil-police force with jurisdiction in cities and the countryside."
    private_police: "The Council of Chiefs does not permit privatized police agencies."
    coordination: "The SNP trains and coordinates with the SDF and uses broadly similar equipment, with greater emphasis on civil control."
  office_of_military_intelligence: "National intelligence and counter-intelligence/security organization."
  wildcats: "Elite Sioux special-forces units; the source emphasizes training and magical support over heavy cyberware, except among riggers."
  matrix_warband: "SDF elite decker/computer-intelligence unit used for defensive security testing and intelligence operations."

timeline:
  - {year: 2026, event: "The Bureau of High Technology rules that only Sioux-based corporations may license technology from the University of Cheyenne."}
  - {year: 2054, event: "The Office of Military Intelligence undergoes scandals, an internal purge and reorganization under Sinopa."}
  - {year: 2055, event: "Numerous insect-spirit hives are uncovered and destroyed; paranoia contributes to accidental shootings."}
  - {year: 2057, event: "The Council of Chiefs holds two secret meetings with UCAS President-elect Dunkelzahn before his assassination."}
  - {year: 2057, event: "Wind River Corporation completes the first underground hydroponics complex, Shoshoni Hydroponics Farm."}
  - {date: "September 2061", event: "Changeling riots in Cheyenne lead to temporary martial law."}
  - {date: "September 2061", event: "Devil's Tower undergoes unexplained growth and magical disturbances become common."}
  - {date: "June 2062", event: "Participants in the Sun Dance ritual at Devil's Tower report unusually strong visions; some disappear."}

technology_and_matrix:
  university_of_cheyenne: "The University is a major state-funded technology and Matrix research center."
  licensing_rule: "Source-period Sioux law limits licensing of University of Cheyenne technological advances to Sioux corporations."
  stc_grid: "The Sovereign Tribal Council maintains an internal private LTG in Cheyenne with progressively more difficult access tiers and security imported largely from Pueblo systems."
  nan_sin_registry: "The STC grid contains the NAN SIN Registry, described as the central database for legally registered NAN citizens."

magic_and_sacred_sites:
  devils_tower:
    status: "Major Lakota sacred site and annual Sun Dance location."
    anomaly: "After the 2061 comet period the tower is reported to have grown from 262 meters to 356 meters without recorded seismic activity."
    mana_effect: "The local mana level is described as strong enough to cause dizziness and visions."
  black_hills_yellowstone_badlands:
    status: "Major sacred and talislegging areas rich in unusual natural materials."
    enforcement: "Unauthorized grave robbing and talislegging in sacred areas are treated extremely harshly."
  funeral_policy: "Following reports of restless dead, the Council temporarily orders corpses cremated; the order is described as unpopular and often ignored."

corporate_and_infrastructure:
  environmental_policy: "Strict environmental standards limit or shape much corporate activity."
  docwagon: "The Sioux Nation is identified as the first NAN state to allow DocWagon service, with complete source-period coverage."
  wind_river:
    project: "Shoshoni Hydroponics Farm near Boysen Reservoir is a massive multilevel underground agricultural complex."
    scale: "The source describes roughly 20,000 square kilometers of farm area and more than 1,000 drones with fewer than 20 personnel needed to operate it."
  gaeatronics: "Operates major geothermal power development under Sioux environmental testing requirements."

