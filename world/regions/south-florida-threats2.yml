name: "South Florida After Gunderson's Collapse"
domain: world
status: ingested
source_period: "Threats 2"
effects:
  - "Gunderson's collapse destabilizes Miami and the Sovereign State of South Florida."
  - "Atlantic Security remains active but weakened by financial/personnel cuts and low morale."
  - "Crime, gangs, cartels and competing corporate/security interests move into the vacuum."
  - "Named interested actors include Wuxing, Ares/Knight Errant, Global Oil, the Gambione Mafia family, Caribbean pirate gangs, CAS and Aztlan."
campaign_use:
  - "Runners may exploit instability as cover for operations against Florida-based targets."
  - "Communities or facilities may hire runners for protection."
  - "Gunderson may hire runners for recovery operations while rivals hire them to keep the corporation down or seize remaining assets."
