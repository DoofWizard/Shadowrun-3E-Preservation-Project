id: world.region.target-wastelands-toxic-zones
record_type: world
name: "Target: Wastelands Toxic Zones"
domain: regions
status: ingested
source_period: "2062"

scope: "Selected contaminated regions presented as source-period examples of toxic-zone operations."

sites:
  north_sea:
    summary: "Industrial contamination, offshore extraction and damaged coastal ecosystems create persistent toxic conditions."
    activity: "Corporate cleanup, environmental activism and hazardous offshore operations overlap."
  tripoli_hot_zone:
    summary: "A major contaminated zone around Tripoli with severe environmental and public-health effects."
  tsimshian:
    summary: "Industrial contamination is severe enough to affect local astral conditions and spirit activity."
    magic_note: "The chapter presents the area's magical effects as an ongoing source-period concern rather than a universal rule."
  arcology_mile_los_angeles:
    summary: "Los Angeles combines long-term air and industrial pollution with severe social and infrastructure disruption."
    magic_note: "City and hearth spirits are described as differing sharply between protected enclaves and devastated districts."
  yucatan:
    summary: "Large areas have become unstable ecological and magical zones following recent conflict and environmental damage."
    magic_note: "The source describes both toxic domains and areas of rapid natural regrowth with unusually active spirits."
  sox:
    name: "Saar-Lorraine-Luxembourg Special Administrative Zone"
    summary: "A sealed contaminated zone used by the controlling corporate council for research and testing."
    astral_condition: "The source classifies the SOX as a mana warp, with local severity estimated as high as Rating 8."
    access: "The perimeter is walled and controlled; legal access is tightly restricted."

hazard_overview:
  pollutant_sources:
    - "Industrial byproducts."
    - "Waste storage and disposal."
    - "Routine urban and transport pollution."
    - "Accidental releases."
  operational_guidance:
    - "Use protective clothing and respiratory protection appropriate to the contaminant."
    - "Carry known-safe water and test local supplies before use."
    - "Treat food, water and dust exposure as separate contamination vectors."
    - "Do not assume contamination is visible or evenly distributed."
  mutation_context: "The chapter distinguishes ordinary/paranormal life from organisms altered by mutagenic exposure; full mutation mechanics are deferred to Game Information."

links:
  interacts_with:
    - rule.magic.mana-warps
    - rule.magic.toxic-domains
    - subsystem.critters.weaknesses-mutation-toxicity
    - rule.hazards.diseases-and-toxins

sources:
  - {source: source.fanpro-10653, pages: "6-27", pdf_pages: "7-28", relation: defines_world_state_and_guidance}

notes:
  - "The source explicitly warns that Shadowland commentary can contain rumor, contradiction or misinformation; this record excludes disputed poster claims."
  - "Rules-bearing toxic-zone, biohazard, radiation, mutation and toxic-magic procedures are reserved for the Game Information extraction."
