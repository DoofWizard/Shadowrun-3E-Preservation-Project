government:
  model: "The PCC functions as both sovereign state and for-profit corporation."
  board: "A twelve-member Board of Directors governs the nation, develops policy and appoints the president and major staff."
  chairman: "Miguel Lusie'dzil"
  president: "Emilio Cajeme"
