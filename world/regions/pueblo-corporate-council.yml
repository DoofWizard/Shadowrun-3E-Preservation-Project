share_system:
  preferred:
    eligibility: "Anyone may purchase preferred shares, including non-Pueblo residents."
    rights: "Investment/dividend rights but no voting rights."
    residency: "A preferred share grants the holder the right to enter and live in Council territory."
    identity: "A purchaser does not need a prior SIN; Pueblo issues one when required."
  residential:
    eligibility: "Pueblo citizens only; dual citizenship is not permitted."
    citizenship_share: "Every Pueblo citizen holds at least one residential 'citizenship share'; children of citizens receive one at birth."
    voting: "Residential shares carry voting rights on a logarithmic scale: 1 share = 1 vote, 10 = 2 votes, 100 = 3 votes, and so on."
    emigration: "A citizen taking another citizenship forfeits Pueblo citizenship and sells residential shares back to the Council at current market value."
    minimum_status: "The original citizenship share cannot be sold while remaining a citizen; selling all additional residential shares makes the holder a non-resident alien who must obtain preferred-share residency or leave."
  conditional:
    origin: "Issued to residents of newly annexed Los Angeles and southern California."
    value: "No market value and no voting rights."
    residency: "Allows residence in Pueblo territory for up to one year."
    expiry: "Source specifies expiration on 19 December 2062; holders then need another valid status or must leave."

corporate_regulation:
  extraterritorial_employees: "Residents and employees on extraterritorial property must hold at least one preferred share."
  operating_license: "Extraterritorial corporations require a Pueblo operating license."
  audits: "License terms require two fair-trade audits each year: one scheduled and one unscheduled."
  audit_duration: "Typical audits last about three to four days."
  unscheduled_notice: "Unscheduled audits receive 24 hours' notice."
  enforcement: "Failure to meet requirements may result in warnings, corrective action or license revocation."
  council_finance: "The Council invests public capital through venture finance, banking, insurance and reduced-rate industrial lending, often retaining ownership interests and veto rights over major financial decisions."

timeline:
  - {year: 2014, event: "The Kachina Society publicly advocates Southwest tribal alignment with Daniel Howling Coyote."}
