timeline:
  - {year: 2014, event: "The Kachina Society publicly appears; Daniel Howling Coyote is among those associated with it."}
  - {year: 2017, event: "The Great Ghost Dance occurs."}
  - {year: 2022, event: "Goblinization and gang violence destabilize Los Angeles; California contains much of the violence in El Infierno."}
  - {year: 2028, event: "An earthquake destroys Los Angeles International Airport."}
  - {year: 2033, event: "Tablelands Software releases the Dreadnaught Matrix operating system."}
  - {year: 2046, event: "A decker gang erases California gubernatorial election results; the crisis contributes to Los Angeles becoming the Greater Los Angeles Free Metropolitan District."}
  - {year: 2053, event: "A media exposé alleges an inner Kachina circle called the Soyoko is manipulating the Board; the allegation remains source-period controversy rather than verified fact."}
  - {year: 2057, event: "President Maria Alonzo retires and Emilio Cajeme becomes president."}
  - {date: "20 November 2061", event: "An attack during a Kachina ceremony kills Board chairman Carlos Estefan; Miguel Lusie'dzil becomes acting chairman."}
  - {date: "2 December 2061", event: "A major earthquake strikes Los Angeles, followed by rioting and looting."}
  - {date: "8 December 2061", event: "Pueblo forces enter Los Angeles and claim the city and much of southern California."}
  - {date: "19 December 2061", event: "Pueblo issues conditional shares to residents of the newly occupied California territories."}
  - {date: "18 April 2062", event: "Miguel Lusie'dzil is confirmed as Board chairman; Carlos Pomodre fills the vacated directorship."}

corporate_state:
  structure: "The Council is simultaneously a sovereign government and a for-profit corporation."
  board_of_directors:
    seats: 12
    role: "Sets policy, selects the president and senior staff, and appoints departmental and regional vice presidents."
    chairman_2062: "Miguel Lusie'dzil"
  share_classes:
    preferred:
      eligibility: "May be bought by anyone; a SIN is not required, and Pueblo issues one if necessary."
      voting_rights: "None."
      rights: "Functions as an investment and as authorization to enter and reside in Pueblo territory."
      extraterritorial_requirement: "Residents and employees of extraterritorial corporate property must hold at least one preferred share even when their work site is outside Pueblo jurisdiction."
    residential:
      eligibility: "Only Pueblo citizens may hold them; Pueblo does not permit dual citizenship."
      citizenship_share: "Every citizen holds at least one original citizenship share, normally received at birth."
      alienation: "Additional residential shares may be traded, but selling the original citizenship share ends citizenship and converts the holder to non-resident alien status unless a preferred share is obtained."
      emigration: "A departing citizen forfeits citizenship and sells residential shares back at market value; the transaction occurs in Pueblo territory and is subject to capital-gains tax."
      voting_scale:
        rule: "Voting power increases logarithmically rather than one vote per share."
        examples: ["1 share = 1 vote", "10 shares = 2 votes", "100 shares = 3 votes"]
    conditional:
      holders: "Residents of the newly annexed California territories."
      market_value: "None."
      residence: "Allows residence for up to one year."
      expiration: "19 December 2062"
      consequence: "At expiration the holder must choose citizenship or leave; otherwise deportation is the stated consequence."

economy_and_corporate_regulation:
  investment_model: "Pueblo provides venture financing, insurance and business loans while retaining an ownership interest and veto rights in financed developments."
  performance: "The source states annual returns above 16 percent over the preceding eight years."
  extraterritorial_operating_license: "An extraterritorial corporation requires a Pueblo operating license for Pueblo land."
  fair_trade_audits:
    frequency: "Twice yearly: one scheduled and one unscheduled."
    duration: "Typically three to four days."
    unscheduled_notice: "24 hours for an extraterritorial corporation."
    cost: "Paid by the audited corporation."
  insurance_limit: "Many Pueblo insurance riders cease to apply once the insured leaves Pueblo jurisdiction, including some extraterritorial enclaves."
  aztechnology_2062:
    status: "Following Aztlan's ejection from Denver, Pueblo revokes Aztechnology operating licenses for Pueblo facilities and cancels relevant policies."
    exit_window: "Six months to vacate affected facilities."

politics_and_society:
  president_2062: "Emilio Cajeme"
  kachina_society:
    official_role: "Not a state religion; described as a cultural and spiritual-advisory institution especially influential among Hopi and Zuni communities."
    awakened_practice: "Some ceremonies are magical rituals; the chapter explicitly associates at least one described ceremony with the metamagical technique Channeling."
    soyoko: "An alleged inner circle is repeatedly discussed in source-period reports and shadowtalk; its claimed control of Pueblo government is not treated here as verified fact."
  koshari:
    role: "Major Pueblo organized-crime network descended from dissident Kachina Society elements."
    activities: ["BTLs", "drugs", "prostitution", "gambling", "vice protection"]
    centers: ["Albuquerque", "Phoenix", "Pueblo sector of Denver"]
    expansion_2062: "The source describes expansion pressure in Los Angeles and Denver."

military_and_technology:
  aerospace:
    kirtland_aeronautical_laboratories: "Former USAF facility converted into a major aeronautical research and manufacturing center."
    capability: "Pueblo is presented as a leading Native American aeronautical developer with extensive use of combat drones and electronic warfare."
  matrix_and_electronics:
    albuquerque: "Primary research-and-development center for Matrix technology, avionics, solar energy, lasers, computers and electronics."
    sandia_laboratories: "Major nuclear/computer/electronics research site with tight protection of proprietary research."
  phoenix:
    role: "Major manufacturing center; research focuses on Pueblo Grid infrastructure, telecommunications and industrial electronics."

places_and_conditions:
  Santa_Fe:
    role: "National capital and seat of the Board in the Palace of Governors; former New Mexico capitol operates as a stock exchange."
  Los_Alamos:
    history: "Abandoned after the 2014 Redondo Peak eruption and ashfall; former nuclear-research area."
    astral_reports: "The text contains shadowtalk claims about unusual local astral manifestations; these remain unverified reports."
  Albuquerque:
    role: "Technological capital and major research center."
  Gallup:
    role: "Kachina Society center near Chaco Canyon, an Anasazi cultural site contested in Pueblo-Ute relations."
  Eastern_Pueblo:
    role: "Sparsely populated uranium-mining and nuclear-testing region with increased military activity near the Aztlan border."
  Trinity:
    role: "Historic first-nuclear-test site; the source describes a contemporary Atomic Kiva cult active around it."
  Phoenix:
    role: "Large manufacturing and industrial center."
    south_mountain: "Pueblo operates a gold mine described as also supporting enchanting work; the area is heavily guarded."
  Los_Angeles:
    status_2062: "Recently annexed Pueblo territory after the 2061 earthquake and civil disorder."
    strategic_value: "Provides direct Pacific access and a major entertainment/technology market."
    underworld: "The Koshari, Mafia and Triads compete for influence; source-period faction claims are preserved without projecting later outcomes."
  UCLA:
    role: "Major medical, simsense and thaumaturgical university; the chapter presents the surrounding area as unusually magically unstable after the comet."
  El_Infierno:
    role: "Former containment zone in south Los Angeles; Pueblo maintains military containment rather than the old physical wall system."

