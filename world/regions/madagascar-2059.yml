  - {name: "Antananarivo", role: "former inland capital shown on the source map"}

fort_dauphin:
  - "Fort-Dauphin is described as one of the largest surviving settlements, built through and around decaying pre-collapse urban structures."
  - "Barter and direct exchange are important to the local economy."
  - "A local contact language is described as drawing from Thai, Malagasy, Hindi, English, French, Afrikaans and numerous African and Asian languages."
  - "The language is strongly gesture-supported and varies among local communities."

tamatave:
  - "Tamatave is described as more heavily ruined than Fort-Dauphin, with large areas reduced to rubble after 2020s conflict."
  - "The remaining population is largely transient."

regional_groups:
  - id: organization.mananjary-network
    name: "Mananjary"
    type: local_maritime_group
    leader: "Khamla"
    source_notes:
      - "The source calls Mananjary the leading organized group on the island and estimates it at almost one thousand members, excluding children."
      - "Khamla is described as half-Thai and half-Malagasy and as an experienced older leader."
  - id: organization.sangoma-madagascar
    name: "Sangoma"
    type: mobile_zulu_group
    source_notes:
      - "The source describes a Zulu group called the sangoma as a recent regional presence."
      - "Claims about broader political ambitions remain attributed poster commentary."

