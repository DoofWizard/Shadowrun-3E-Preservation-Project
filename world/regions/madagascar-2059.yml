world_state:
  - "The source presents Madagascar as largely outside normal state administration after severe VITAS-era population loss and later coastal resettlement."
  - "Contemporary databases may still describe the island as unoccupied or contain outdated information."
  - "No island-wide government is described; authority is local and fragmented."
  - "The island has more than 3,000 kilometers of coastline, with dry southern and western zones and tropical rainforest in the northeast and interior."
  - "Abandoned pre-collapse cities remain important coastal landmarks and settlements."

