id: world.region.imperial-japan
record_type: world
name: "Imperial Japan"
domain: regions
status: ingested
source_period: "2061-2062"
profile:
  government:
    emperor: "Symbolic and dynastic head; political power formally rests with the Diet and Cabinet, though Yasuhito begins seeking greater practical influence."
    diet: "Bicameral House of Representatives and House of Councillors; primary lawmaking body."
    cabinet: "Executive government led by the Prime Minister."
  disaster_2061:
    - "On 27 October 2061, Unzen Volcano erupted catastrophically amid a major earthquake sequence."
    - "Shimabara and surrounding Kyushu communities suffered catastrophic destruction, ashfall, tsunami and casualties."
    - "A major Yokohama earthquake and northern-coast tsunami compounded losses."
    - "The crisis disrupted ports, air traffic, markets and Japanese corporate operations."
  military_response:
    - "Imperial forces shifted heavily into domestic disaster relief, security and reconstruction."
    - "Imperial Marines were ordered to pull out of San Francisco and return home during the crisis."
    - "Other overseas commitments were reduced as Japan recalled forces and resources."
  political_transition:
    - "The government confirmed in January 2062 that Emperor Kenichi and most of his immediate family died in the Unzen disaster."
    - "Fourteen-year-old Yasuhito succeeded to the throne, represented during his minority by Sessho Taro Yonekura."
    - "The transition creates a major power struggle among Imperial Household factions, Diet politicians, Japanacorps and military interests."
  early_yasuhito_agenda:
    - "Pushes lower tariffs and trade restrictions and a more open-market posture."
    - "Seeks relaxation of immigration restrictions and discrimination against kawaruhito/metahumans."
    - "Reclaims a stronger concept of imperial divinity and symbolic authority."
    - "Uses popular support and military loyalty to build influence in the Diet."
    - "Initially confronts Shiawase over failures surrounding the Unzen disaster, though relations later improve."
  corporate_context:
    - "Japanese markets and Japanacorps suffer a major immediate shock after the disaster."
    - "Yamatetsu is widely rumored to support Yonekura/Yasuhito's reform coalition, but the source does not establish covert control as fact."
    - "By March 2062 Shiawase has improved relations with the throne; Tadashi Shiawase's daughter Hitomi is announced as Yasuhito's future bride."
  foreign_context:
    - "Imperial retrenchment weakens or changes Japanese military pressure in San Francisco, the Philippines, Peru and northern Australia."
sources:
  - {source: source.fanpro-10650, printed_pages: "97-105", pdf_pages: "98-106", relation: updates_world_state}
notes:
  - "Rumors about hidden sponsors, Yamatetsu control, unusual survival, secret siblings and assassination conspiracies remain attributed."
