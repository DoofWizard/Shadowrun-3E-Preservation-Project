id: world.region.australia
record_type: world
name: "Australia"
domain: regions
status: ingested
source_period: "2062"
current_state:
  government:
    - "Federal government is seated in Canberra."
    - "A referendum on replacing the monarchy with a republic is being prepared under Prime Minister Sheila Powell and the New Century Party."
    - "Federal authority is strongest in the settled coastal regions and weak across much of the Outback."
  population:
    estimate: "roughly 20-25 million; the source says an accurate census is unavailable"
    notes:
      - "Immigration is substantial and Australia has a comparatively high metahuman population."
      - "The source describes social prejudice as often directed more toward perceived foreignness than metatype."
  indigenous_population:
    total_estimate: "about 300,000 Aboriginal Australians, including mixed ancestry"
    outback_traditional_estimate: "about 80,000"
    notes:
      - "Many Outback communities preserve semi-nomadic lifeways, family-group organization, and local languages."
      - "Source narration says at least thirty Aboriginal dialects remain in use."
  water:
    - "Urban water is rationed by household allocation and drought conditions can reduce those allocations."
    - "Legal service normally requires a SIN; water theft, illegal hookups and smuggling are recurring criminal markets."
  transport_and_infrastructure:
    - "Australia drives on the left and uses 230-250V AC power."
    - "Settled coastal areas have conventional Matrix and urban infrastructure; the interior has much poorer coverage."
  magic_and_outback:
    dreamtime_and_dreaming:
      - "The source presents Dreamtime as a primordial, timeless spiritual/metaplanar reality associated with ancestral creation and the land."
      - "It distinguishes an individual's Dreaming from Dreamtime: a personal spiritual identity and relationship to the world rather than a separate universal realm."
    koradji_and_totems:
      - "Koradji are Aboriginal magical practitioners whose local names, training and rites vary by community."
      - "The source describes a koradji as being called by a totem and trained by an established practitioner; initiation accounts are cultural narrative, not standalone game mechanics."
      - "Ancestor and totem relationships are tied closely to kinship, land, personal identity and traditional obligations."
    enchanting_and_compounds:
      - "The Outback is described as rich in natural materials useful for enchanting and talismongering, especially in remote or magically active regions."
      - "Wudu'aku is a traditional preparation described as heightening awareness of spirits and ancestral songs."
      - "Kuman-nhepa is a bark-and-resin preparation described as improving endurance and stamina."
      - "Atyerre is an ochre-red preparation described as opening access to the Dreamtime even for a non-koradji."
      - "These descriptions are qualitative in this section; no numerical game statistics are provided here."
    song_lines:
      - "Song lines or Dreaming tracks are traditional routes encoded in songs and stories that function as oral maps across the land."
      - "The source gives them a magical mnemonic significance and says koradji can sense that significance."
      - "It qualitatively warns that non-koradji may find magic more difficult on or near a song line, but gives no numerical modifier in this section."
    mana_storms:
      - "Mana storms are presented as wild, uncontrolled magical disturbances concentrated mainly in the Outback."
      - "They can create magical effects and physical-weather-like phenomena, develop rapidly, remain localized and vary greatly in duration and intensity."
      - "Reliable prediction is not established in this section."
      - "Claims that damage to the land or sacred places causes mana storms are presented as theory rather than established fact."
    storm_wraiths:
      - "Storm wraiths are spirits associated with mana storms and are generally described as hostile."
      - "The source says they can be fought astrally or magically while immaterial, affected by physical weapons when materialized, and banished by a magician."
      - "Their apparent power is described as corresponding to the strength of the mana storm that produced them; no statistics are supplied in this section."
    alchera:
      - "Alchera are transient, past-like magical pockets or landscapes that can appear and disappear in the Outback."
      - "They may contain apparently physical features or resident spirits, and their disappearance can strand or disorient people who entered them."
      - "This section treats alchera as a qualitative magical hazard; formal mechanics are deferred to later Game Information if provided."
    sacred_sites:
      - "Uluru is presented as an exceptionally sacred and magically significant location."
      - "Kata Tjuta (the Olgas) is presented as another major Aboriginal sacred landscape; extraordinary danger claims there are primarily shadowtalk and are not promoted to neutral fact."
      - "The Great Australian Bight includes extensive caves and sinkholes, some treated as sacred and bearing markings described as having a magical aura."
      - "Kakadu is presented as a major biodiversity refuge with extensive Aboriginal rock art, sacred sites and reported magical power sites."
      - "Specific extraordinary incidents around Uluru and other sacred sites are frequently presented through shadowtalk or anecdote and are not promoted here to neutral fact."
    regional_ecology:
      - "The Great Barrier Reef remains ecologically stressed but shows recovery after the Awakening, including hardy Awakened coral growth; a prolific parasitic barnacle is reported to damage wood and metal on marine structures and vessels."
      - "Tasmania is described as heavily rewilded after VITAS and the Awakening, with abandoned settlements, extensive wilderness and numerous Awakened species; the source says many remain unidentified."
      - "Corporate and scientific teams maintain Tasmanian research sites, while a monthly Roving Market supports illicit trade among crews using remote coves and settlements."
      - "Maralinga and Emu Junction remain former atomic-test landscapes; claims of spiritual or magical contamination there are presented as reports and anecdote rather than established mechanics."
    magical_threats:
      - "Australian urban and Outback environments include insect-spirit activity; the section adds setting examples but no new insect-spirit mechanics."
      - "Toxic shamans are described in two broad source-period patterns: those who embrace pollution and those who weaponize toxic methods against polluters while risking corruption themselves."
      - "The source also describes despair and social misery as possible spiritual pollution in urban enclaves, but this is presented as in-world interpretation rather than a new quantified rule."
    parazoology:
      catalog: "catalog.critters.target-awakened-lands-australia"
      notes:
        - "The source surveys Australian marine, urban and Outback fauna, including several new or regionally important paranormal creatures."
        - "Formal statistics for source-specific creatures are not supplied in this descriptive section and remain to be captured from Game Information if present."
sources:
  - {source: source.fanpro-10651, printed_pages: "21-25", pdf_pages: "22-26", relation: defines_current_state}
  - {source: source.fanpro-10651, printed_pages: "44-59", pdf_pages: "45-60", relation: expands_magic_and_outback}
