notes:
  - "Qualitative setting facts only; shadowtalk claims are not promoted to fact unless supported by neutral narration."
  - "Historical detail from printed pp.14-20 remains separately pending normalization."
  - "Printed pp.44-77 contain qualitative rules-bearing hooks but no standalone numeric rules or rules tables; exact mechanics remain to be captured from the later Game Information section."
