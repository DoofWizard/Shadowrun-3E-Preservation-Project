id: world.region.australia
record_type: world
name: "Australia"
domain: regions
status: ingested
source_period: "2062"
current_state:
  government:
    - "Federal government is seated in Canberra."
    - "A referendum on replacing the monarchy with a republic is being prepared under Prime Minister Sheila Powell and the New Century Party."
    - "Federal authority is strongest in the settled coastal regions and weak across much of the Outback."
  population:
    estimate: "roughly 20-25 million; the source says an accurate census is unavailable"
    notes:
      - "Immigration is substantial and Australia has a comparatively high metahuman population."
      - "The source describes social prejudice as often directed more toward perceived foreignness than metatype."
  indigenous_population:
    total_estimate: "about 300,000 Aboriginal Australians, including mixed ancestry"
    outback_traditional_estimate: "about 80,000"
    notes:
      - "Many Outback communities preserve semi-nomadic lifeways, family-group organization, and local languages."
      - "Source narration says at least thirty Aboriginal dialects remain in use."
  water:
    - "Urban water is rationed by household allocation and drought conditions can reduce those allocations."
    - "Legal service normally requires a SIN; water theft, illegal hookups and smuggling are recurring criminal markets."
  transport_and_infrastructure:
    - "Australia drives on the left and uses 230-250V AC power."
    - "Settled coastal areas have conventional Matrix and urban infrastructure; the interior has much poorer coverage."
  history_and_politics:
    pre_awakening:
      - "Australia remains a Commonwealth monarchy under the British Crown despite substantial practical autonomy."
      - "Aboriginal Australians retain surviving cultures despite colonization, disease, displacement and ecological damage; the source emphasizes that no treaty with the indigenous population had been signed by the source period."
    corporate_sovereignty:
      - "Australia moved quickly to accept the implications of the 2001 Shiawase Decision."
      - "Within two years, Aurora Biofacilities, Broken Hill Proprietary, Mount Isa Mines, Shiawase and Tesseract were among the corporations granted extraterritorial status."
      - "A reform government elected in 2011 attempted to curb corporate excesses but could not reverse established corporate sovereignty."
    indigenous_land_conflict:
      - "A legal movement won recognition of Aboriginal traditional ownership, rejecting terra nullius."
      - "Resource Rush mining expansion nevertheless intensified disputes over Aboriginal land; conflict included sabotage, raids, arrests and police repression."
      - "Shadowtalk claims that Aboriginal koradji knew mana storms were coming are presented as anecdote, not neutral fact."
    vitas:
      - "Australia suffered less catastrophic VITAS losses than many nations because of low population density and isolation of remote communities."
      - "The healthcare burden accelerated privatization of medical services."
    awakening_and_mana_storms:
      - "The first major mana storm struck the New South Wales Outback on 24 December 2011."
      - "Repeated storms rendered much of the Outback dangerous, disrupted travel and pushed the federal government to withdraw many interior services."
      - "From 2012-2014 census-taking in much of the Outback was abandoned and the region was treated administratively as a disaster area."
      - "In April 2012 a major mana storm devastated Sydney for roughly two weeks; a persistent storm pattern remained around the city afterward."
      - "Claims that Aboriginal people caused or summoned the storms are explicitly contested in the source."
    metahuman_policy:
      - "Australia followed New Zealand in granting metahumans full citizenship and human rights."
      - "Refugees fleeing persecution elsewhere increased Australia's metahuman population."
      - "The source describes prejudice as often cultural/national rather than strictly metatype-based, while still documenting Humanis and racist violence."
    regional_and_political_crises:
      - "The 2018 America orbital disaster caused debris to strike Longreach, Queensland, killing about 300 residents."
      - "Australia and New Zealand entered a mutual-support arrangement in 2022 that became the Australia and New Zealand Allied Confederation (ANZAC), later expanding into an economic, social and military alliance."
      - "Sydney declared independence in 2030 after prolonged conflict with the Commonwealth over the continuing mana-storm crisis; Canberra became the New South Wales capital while the Sydney Metropolitan Council governed the city."
      - "AISE was formed in 2031 by merging the Australian Secret Intelligence Organization and Federal Police."
      - "Also in 2031, BHP and Mount Isa Mines amalgamated into Tanamyre Resources."
    japan_and_southeast_asia:
      - "Japanese corporate withdrawal from tourism caused a recession and intensified anti-Japanese sentiment; remaining Japanese interests established a protected corporate enclave in Cairns."
      - "Regional instability in the 2020s, including the collapse of China, Imperial Japanese expansion and conflict with Indonesia, placed pressure on Australia and contributed to Western Australian separatist sentiment."
    crash_of_2029:
      - "The Crash of 2029 severely damaged Australian government and corporate systems, destroying records and spawning identity-fraud markets."
      - "Japanese corporations used the recovery period to expand their Australian foothold."
      - "Renraku acquired Telstra and combined it with other providers to create Baird Communications, which became central to the Australian Matrix."
    crime_and_universal_brotherhood:
      - "Organized crime diversified during the 2030s and 2040s, with South African, Greek, Yakuza, Triad, Vietnamese and Seoulpa interests noted."
      - "The Universal Brotherhood established a major Australian presence in the 2040s; government raids in the 2050s exposed insect-spirit hives, with at least one Brisbane hive breaking loose."
      - "Later insect-spirit activity is presented as suspected rather than confirmed."
    water_crisis:
      - "A severe drought peaked in 2057, draining reservoirs and producing mandatory urban water rationing."
      - "The water-smuggling and illicit-water market expanded rapidly."
    late_2050s_and_comet:
      - "Australia was active in the late-2050s Corporate Court/corporate-war turmoil, with Cairns a significant shadowrunning center."
      - "Renraku's presence declined while Novatech and Wuxing/Yamatetsu-Pacific Prosperity Group interests expanded."
      - "Halley's Comet coincided with intensified mana storms and other magical phenomena; SURGE changelings were generally absorbed into Australian society with comparatively limited large-scale violence."
    timeline:
      - {date: "1999-11-06", event: "Republic referendum fails; Australia remains a monarchy."}
      - {year: 2003, event: "Extraterritoriality granted to some megacorporations."}
      - {year: 2006, event: "Commonwealth Scientific and Industrial Research Organization clones living Tasmanian tiger samples from frozen tissue."}
      - {date: "2011-12-24", event: "First mana storm strikes the New South Wales Outback."}
      - {years: "2012-2014", event: "Outback census-taking abandoned in severe mana-storm regions; disaster-area designation expands."}
      - {date: "2012-04", event: "Major Sydney mana storm isolates and devastates the city for two weeks; recurring storm remains afterward."}
      - {year: 2014, event: "Japanese tourism pullout contributes to recession and anti-Japanese/anti-Asian violence."}
      - {date: "2018-07-24", event: "Debris from the America orbital disaster strikes Longreach, Queensland, killing about 300 residents."}
      - {year: 2022, event: "Australia and New Zealand form the ANZAC alliance."}
      - {year: 2030, event: "Sydney declares independence; Canberra becomes New South Wales capital."}
      - {year: 2031, event: "AISE formed from ASIO and Federal Police; BHP and Mount Isa Mines amalgamate into Tanamyre Resources."}
  cities_and_economy:
    organized_crime:
      - "The source presents a fragmented Australian underworld rather than one national syndicate hierarchy."
      - "Italian Mafia families operate primarily by city; Don Hawkes in Melbourne is described as a senior capo among local families."
      - "The Saiki-rengo dominates much of Australia's Yakuza activity, especially in the northeast, with the Kawaru-gumi as an ork/troll Yakuza faction in Queensland."
      - "Triad activity is widespread; the Golden Triangle Society, Grass Sandals and Green Gang are highlighted, with the Green Gang particularly tied to smuggling/talismongering."
      - "Vietnamese gangs are concentrated around Darwin and the eastern seaboard and are associated with firearms, illicit betting, organlegging/chips, robberies and blood sports."
      - "Vory v Zakone is a smaller Sydney/Melbourne presence focused on prostitution, illegal fighting, smuggling and synthetic-drug markets."
      - "Greek Mafia interests are especially strong in Melbourne; the Stefanopoulos family is presented as the city's dominant Greek criminal family."
      - "South African syndicates dominate much of Perth's underworld and construction-related rackets."
      - "Australia also has extensive biker/go-gang networks; the Crows, Thor's Hammers, Apaches, Scales and Hell's Angels are named national-level clubs."
    sydney:
      - "Sydney remains encircled by a persistent mana-storm system dating from 2012, with periodic total disruption of travel and communications."
      - "The city declared political independence from the Commonwealth after years of conflict over storm relief and is governed by the Sydney Metropolitan Council."
      - "Corporate representatives on the Metro Council wield major influence; Knight Errant provides policing."
      - "Central Sydney is largely closed to road traffic and relies on light rail/trams; remote-controlled trains outside the core are described as dangerous after hours."
      - "The damaged Sydney Harbour Bridge contains a large autonomous squatter community and black-market economy."
      - "World Square is a largely self-contained arcology owned by Tanamyre; its disused underground carpark became the Emporium, a 24-hour informal market."
    melbourne:
      - "Melbourne is presented as Australia's major financial center and home of the Australian Stock Exchange after the Crash of 2029."
      - "Corporate rivalry is strongly shaped by the PacRim Bank/Mitsuhama bloc versus Pacific Prosperity Group interests led locally by Wuxing/Yamatetsu/MIB."
      - "Archon Enforcement is Melbourne's contracted local security provider."
      - "Italian and Greek Mafia interests are especially influential in the city's underworld."
    brisbane:
      - "Brisbane's culture is described as unusually close-knit and socially networked."
      - "Large Asian immigrant/metahuman communities support strong Asian corporate and criminal presences."
      - "Lone Star holds the municipal policing contract; local procedures differ from UCAS practice."
      - "The Aosaki-gumi is a leading local Yakuza presence, competing with the Grass Sandals, Golden Triangle Triad and Kawaru-gumi."
    canberra:
      - "Canberra remains Australia's capital, dominated economically by government, diplomacy and public-service activity."
      - "Security is unusually dense because of government, embassy and corporate liaison activity."
      - "Federal police are described as powerful and systemically corrupt in the source-period account; organized crime has comparatively little foothold because police suppress competitors."
    perth:
      - "Perth is a major western port, heavy-industry/mining center and staging point for Outback expeditions."
      - "Saeder-Krupp/Kinesys Heavy Industries and other mining interests are prominent."
      - "Renraku/Harlan-Wolff is important in local boat manufacturing."
      - "Talismongering and expedition support are major shadow-economy activities."
      - "South African syndicates dominate the underworld."
    cairns:
      - "Cairns became a Japanese-corporate enclave after extensive extraterritorial expansion; Imperial Marines openly patrolled the city until recall orders following the change in Japan."
      - "After the Imperial withdrawal, Wolverine Security and corporate forces filled the security vacuum and Cairns reopened itself more aggressively to tourism."
    darwin:
      - "Darwin grew into a diverse high-tech northern city after Outback refugees and Asian/metahuman immigration."
      - "It hosts major Australian military forces, shipping/smuggling routes and magical/environmental research institutions."
      - "Named research actors include DIMR, Mitsuhama Thaumaturgical Research, the Atlantean Foundation, Awakened World Research and the Maui Institute."
      - "Vietnamese gangs and Yakuza are major underworld actors."
    corporate_land_and_resources:
      - "Mana storms displaced many rural landholders and enabled corporations to accumulate large tracts of Outback land."
      - "The source says five corporations collectively owned just over half of Australia's rural land by the 2050s: Austrafarm, Kinesys Heavy Industries, DIBAL Holdings, Tanamyre Resources and Shiawase."
      - "Outback corporate facilities rely heavily on automation, underground construction, magical protection and specialized security but remain vulnerable to mana storms, spirits, paracritters, Aboriginal opposition, bandits and biker gangs."
      - "Major resource activities include mining, petroleum, agriculture, water, opal mining and power generation."
      - "The source notes continuing speculation that Outback land acquisitions may be motivated by mana-storm research or rare magical resources, but does not establish that as fact."
    major_corporate_profiles:
      - "Aztechnology Australasia operates through Sydney and nominally competing Austrafarm and Nature-Taste agribusiness units."
      - "Shiawase's Australian interests include fusion/alternative power, uranium, agriculture, logging and aquaculture; Shiawase Atomics and Arboritech are named."
      - "Saeder-Krupp Australia, headquartered in Perth, is heavily involved in mining, industrial services and energy through units including Kinesys Heavy Industries and Vulcan Systems."
      - "Tanamyre Resources, headquartered in Brisbane, is Australia's principal home-grown megacorporation, with mining, exploration, military manufacturing, environmental services and other diversified businesses."
      - "Yang Su Enterprises/DIBAL Holdings is a growing Korean agribusiness with strong Western Australian operations and increasing ties to Eastern Tiger Corporation and the Pacific Prosperity Group."
      - "Shiawase and Novatech maintain Australian launch facilities; Novatech's Woomera compound is a major aerospace/deep-space tracking facility."
      - "Yamatetsu is the dominant private medical provider through Lifestar Health Services; CrashCart has public ambulance contracts in most major cities except Cairns."
      - "Aurora Biofacilities, owned by Universal Omnitech, is the main large-scale competitor in biotech/cybernetics medicine."
  magic_and_outback:
    dreamtime_and_dreaming:
      - "The source presents Dreamtime as a primordial, timeless spiritual/metaplanar reality associated with ancestral creation and the land."
      - "It distinguishes an individual's Dreaming from Dreamtime: a personal spiritual identity and relationship to the world rather than a separate universal realm."
    koradji_and_totems:
      - "Koradji are Aboriginal magical practitioners whose local names, training and rites vary by community."
      - "The source describes a koradji as being called by a totem and trained by an established practitioner; initiation accounts are cultural narrative, not standalone game mechanics."
      - "Ancestor and totem relationships are tied closely to kinship, land, personal identity and traditional obligations."
    enchanting_and_compounds:
      - "The Outback is described as rich in natural materials useful for enchanting and talismongering, especially in remote or magically active regions."
      - "Wudu'aku is a traditional preparation described as heightening awareness of spirits and ancestral songs."
      - "Kuman-nhepa is a bark-and-resin preparation described as improving endurance and stamina."
      - "Atyerre is an ochre-red preparation described as opening access to the Dreamtime even for a non-koradji."
      - "These descriptions are qualitative in this section; no numerical game statistics are provided here."
    song_lines:
      - "Song lines or Dreaming tracks are traditional routes encoded in songs and stories that function as oral maps across the land."
      - "The source gives them a magical mnemonic significance and says koradji can sense that significance."
      - "It qualitatively warns that non-koradji may find magic more difficult on or near a song line, but gives no numerical modifier in this section."
    mana_storms:
      - "Mana storms are presented as wild, uncontrolled magical disturbances concentrated mainly in the Outback."
      - "They can create magical effects and physical-weather-like phenomena, develop rapidly, remain localized and vary greatly in duration and intensity."
      - "Reliable prediction is not established in this section."
      - "Claims that damage to the land or sacred places causes mana storms are presented as theory rather than established fact."
    storm_wraiths:
      - "Storm wraiths are spirits associated with mana storms and are generally described as hostile."
      - "The source says they can be fought astrally or magically while immaterial, affected by physical weapons when materialized, and banished by a magician."
      - "Their apparent power is described as corresponding to the strength of the mana storm that produced them; no statistics are supplied in this section."
    alchera:
      - "Alchera are transient, past-like magical pockets or landscapes that can appear and disappear in the Outback."
      - "They may contain apparently physical features or resident spirits, and their disappearance can strand or disorient people who entered them."
      - "This section treats alchera as a qualitative magical hazard; formal mechanics are deferred to later Game Information if provided."
    sacred_sites:
      - "Uluru is presented as an exceptionally sacred and magically significant location."
      - "Kata Tjuta (the Olgas) is presented as another major Aboriginal sacred landscape; extraordinary danger claims there are primarily shadowtalk and are not promoted to neutral fact."
      - "The Great Australian Bight includes extensive caves and sinkholes, some treated as sacred and bearing markings described as having a magical aura."
      - "Kakadu is presented as a major biodiversity refuge with extensive Aboriginal rock art, sacred sites and reported magical power sites."
      - "Specific extraordinary incidents around Uluru and other sacred sites are frequently presented through shadowtalk or anecdote and are not promoted here to neutral fact."
    regional_ecology:
      - "The Great Barrier Reef remains ecologically stressed but shows recovery after the Awakening, including hardy Awakened coral growth; a prolific parasitic barnacle is reported to damage wood and metal on marine structures and vessels."
      - "Tasmania is described as heavily rewilded after VITAS and the Awakening, with abandoned settlements, extensive wilderness and numerous Awakened species; the source says many remain unidentified."
      - "Corporate and scientific teams maintain Tasmanian research sites, while a monthly Roving Market supports illicit trade among crews using remote coves and settlements."
      - "Maralinga and Emu Junction remain former atomic-test landscapes; claims of spiritual or magical contamination there are presented as reports and anecdote rather than established mechanics."
    magical_threats:
      - "Australian urban and Outback environments include insect-spirit activity; the section adds setting examples but no new insect-spirit mechanics."
      - "Toxic shamans are described in two broad source-period patterns: those who embrace pollution and those who weaponize toxic methods against polluters while risking corruption themselves."
      - "The source also describes despair and social misery as possible spiritual pollution in urban enclaves, but this is presented as in-world interpretation rather than a new quantified rule."
    parazoology:
      catalog: "catalog.critters.target-awakened-lands-australia"
      notes:
        - "The source surveys Australian marine, urban and Outback fauna, including several new or regionally important paranormal creatures."
        - "Formal statistics for source-specific creatures are not supplied in this descriptive section and remain to be captured from Game Information if present."
