official_description:
  - "The Imperial government's stated position describes Yomi as an experimental Awakened society in which metahumans judged to have criminal potential form separate communities."

shadowland_description:
  - "A source commentator instead describes Yomi as approximately 2,400 square kilometers with about 1.5 million impoverished inhabitants."
  - "The same account describes a ten-meter metal wall and an external cleared strip monitored by Imperial guards."
  - "These measurements and population figures are retained as attributed testimony rather than independently verified census data."

campaign_relevance:
  - "The Huk's Metahuman Rights Faction is presented as concentrating on people exiled to Yomi and on support for escapees and residents."
  - "The section does not provide new SR3 environmental or detention mechanics."

