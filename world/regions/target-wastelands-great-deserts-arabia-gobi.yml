id: world.region.target-wastelands-great-deserts-arabia-gobi
record_type: world
name: "Target: Wastelands — Arabian and Gobi Deserts"
domain: regions
status: ingested
source_period: "2062"

arabian_desert:
  extent: "Covers much of the Arabian Peninsula, including the Empty Quarter, with large dune fields, salt flats, gravel plains and mountain regions."
  climate: "Summer temperatures are described near 49 C; winter temperatures around 23 C; sandstorms are frequent, especially in the east."
  political_economy:
    - "The Islamic Unity Movement unified the Arabian countries in 2055 and selected King Kalim Sa'ud of Saudi Arabia as the first Caliph."
    - "Oil remains important but the regional economy has diversified into banking, shipping, electronics manufacturing and alternative energy."
    - "Major corporate participants named in the source include Ifrit Services, Xenel-Oman, Arabian Future Industries, Yamatesu Middle East, Wuxing and Saeder-Krupp."
    - "Remaining oil fields, drilling sites and refineries along the eastern desert are heavily secured while exploration pushes farther inland."
  residents:
    - "Bedouin communities remain major desert guides, herders and transport intermediaries."
    - "The source identifies the Awakened ghazu horse as a prized Bedouin breed; full game statistics are normalized under entity.critter.ghazu-horse."
  shadows:
    - "Smuggling, archaeological work, exploration support and transport through Bedouin territory are presented as recurring runner opportunities."

gobi_desert:
  extent: "High-elevation desert across southeastern Mongolia and much of northern China, averaging about 1,200 meters."
  environment:
    - "Low hills, gravel plains, springs, forest remnants, Great Wall ruins and glaciers occur within the broader desert."
    - "Severe dust and sandstorms and chronic water scarcity are major operating concerns; winter cold is described as more dangerous than summer heat."
  corporate_activity:
    - "Eastern Tiger, Global Oil, Seven Arrows and Yamatesu are named among corporations exploiting petroleum, natural gas, turquoise, jade and crystal resources."
    - "Yamatesu operates refining sites and a roughly 2,500-kilometer pipeline carrying crude oil and natural gas toward Vladivostok."
    - "The Gobi's elevation and low electromagnetic/light pollution make it valuable for ground-based deep-space and orbital tracking facilities."
  residents_and_ecology:
    - "Mongol and Chinese residents are described as largely nomadic herders."
    - "Wildlife recovery includes both mundane species and Awakened animals; the source names lynxes, shapeshifters and humped horses among the paranormal fauna."
  commentary_only:
    - "Claims about Monobe recovering prehistoric specimens and reconstructing organisms are posted commentary rather than established source-period fact."

