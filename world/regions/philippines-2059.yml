name: "Philippines"
status: ingested
source_period: "2059"
source: source.fasa-7124
printed_pages: "54-60"
pdf_pages: "55-61"

political_context:
  - "The chapter presents the Philippines as formally governed through a Japanese Imperial prefectural system with extensive corporate and military influence."
  - "Filipino political participation, language use, employment access and private movement are described as constrained by the occupying system."
  - "The source repeatedly distinguishes the official state narrative from Filipino opposition accounts; claims from rebel manifestos and Shadowland posts are retained as attributed perspective."
  - "Piracy in this chapter is framed primarily as part of a broader anti-Imperial resistance economy rather than as the commercial Caribbean model."

regional_conditions:
  - "The islands combine dense urban areas, remote island chains, rain forest, coral reefs and difficult maritime terrain."
  - "Small boats and local maritime knowledge remain important despite legal restrictions on private craft in many areas."
  - "The chapter portrays corporate facilities, military bases and controlled ports as major strategic features."
  - "The source notes that local communities, labor networks and informal supporters can provide information, shelter, food and transport to resistance cells."

masaru:
  id: person.masaru
  name: "Masaru"
  type: eastern_great_dragon
  cultural_name: "Mameieu"
  source_notes:
    - "Masaru publicly identifies with the Filipino population and is presented as an important symbolic and coordinating figure for the anti-Imperial movement."
    - "The source attributes to him a public declaration opposing Japanese rule and describes his involvement with resistance leaders."
    - "Claims about his covert activities, vendettas and intelligence reach are treated as attributed setting material unless independently established."

piracy_context:
  - "Local pirate crews are described as needing political ties, community support and knowledge of resistance networks to survive."
  - "Operating independently of all factions is presented as possible but substantially harder because both state forces and resistance groups may treat unaffiliated crews with suspicion."
  - "Revenue-generating raids, smuggling and seized cargo are described as important funding mechanisms for resistance activity."
  - "The chapter emphasizes that local piracy is tightly linked to political identity, family risk and community reputation."

provenance_policy:
  - "Masaru's manifesto, rebel commentary and Shadowland posts are not treated as neutral narration."
  - "Claims about abuses, covert sponsorship, criminal affiliations and faction motives remain source-attributed where the chapter presents competing accounts."

