timeline:
  - {year: 2031, event: "The Act of Union merges Canada and the United States into the UCAS."}
  - {year: 2032, event: "Representatives from eleven southern states meet at the Atlanta Secession Convention; Kentucky withdraws from the convention."}
  - {date: "10 November 2034", event: "Secession Day: the convention states, excluding Kentucky, leave the UCAS and form the CAS."}
  - {date: "19 December 2034", event: "Treaty of Richmond recognizes the CAS; Missouri is divided and the UCAS cedes part of its Denver sector."}
  - {year: 2035, event: "Aztlan invades Texas; Texas leaves the CAS while fighting the occupation."}
  - {year: 2036, event: "Texas applies for readmission after its failed campaign against Aztlan."}
  - {year: 2040, event: "The Democratic Reform Party breaks from the Southern Democratic Party."}
  - {year: 2060, event: "Republicans and Democratic Reformers form the True American Coalition, which wins Congress and the presidency."}
  - {year: 2062, event: "The CAS acquires the former Aztlan sector of Denver during negotiations involving Ghostwalker."}

government:
  structure: "Federal system modeled on the former United States and UCAS, with Cabinet Departments called Bureaus."
  electoral_college: "Restored for presidential elections."
  senate: "Each state has three senators."
  term_limits: "Presidents are limited to two terms; senators to four."
  dominant_coalition_2062: "True American Coalition, formed by the Republican Party and Democratic Reform Party."
  other_major_parties: ["Southern Democratic Party", "Southern Conservative Party"]

agencies:
  ERLA:
    name: "Extraterritoriality Registry and Liaison Agency"
    parent: "Bureau of Commerce"
    functions:
      - "Registers extraterritorial corporations and their CAS domains."
      - "Tracks corporate real-estate issues and approves real-estate transactions involving extraterritorial corporations."
      - "Maintains liaison with extraterritorial corporations and the Corporate Court."
      - "Performs intelligence collection and covert activity focused on corporations; may contract shadowrunners."
    legal_leverage: "Leased corporate land can expose an extraterritorial tenant to eviction if a lease is revoked."
  DSI:
    name: "Department of Strategic Intelligence"
    role: "Chief CAS intelligence agency for foreign intelligence and covert operations other than megacorporate espionage and battlefield intelligence."
  DDI:
    name: "Department of Domestic Investigation"
    role: "Federal criminal and counterintelligence service broadly analogous to the FBI."
    additional_functions:
      - "Operates the Confederation Secret Service for senior political protection."
      - "Investigates Matrix-related crimes."
      - "Maintains the Criminal Deterrence Operations group for active-prevention operations against disruptive threats."

military:
  organization: "Falls under the Bureau of Defense."
  order_of_battle: "Six active Army divisions, two Marine expeditionary forces and sixteen air-combat squadrons are stated."
  doctrine: "Training and tactics are emphasized over leading-edge equipment; magical combat capability is described as roughly comparable to the UCAS."
  navy:
    profile: "Brown-water navy centered on Gulf and coastal defense, using frigates, corvettes, patrol craft and land-based naval aviation."
    carriers: "Two approximately 50,000-ton carriers are retained for limited offshore air operations, based at Mobile and Charleston."
    submarine_force: "Described as the world's largest submarine force by conventional and missile-submarine count."
    aviation_submarine: "A newly developed submarine type is described as able to launch manned and unmanned combat aircraft, displacing almost 35,000 tons and carrying six fighters."

economy_and_regulation:
  foreign_investment: "Foreign investment increased after Aztlan setbacks and the Year of the Comet period."
  biotech_regulation: "The 2062 administration is described as tightening regulation of bioware, nanotechnology and gene technology."
  CDC_certification: "The independent CDC continues to certify biotech-related products, including pharmaceuticals, cyberware and bioware."

places_and_conditions:
  Atlanta:
    role: "National capital and Georgia capital; major center of political intrigue, corporate competition and research."
    Georgia_Tech: "Major science, engineering and thaumaturgical university with heavy corporate funding and runner-facing research competition."
    CDC: "Independent disease-research and product-certification institution; may hire runners for independent verification or bioterrorism-related work."
    Dome: "Former stadium turned research site and squatter enclave; source describes a persistent insect-spirit presence contained within the local community."
  Gulf_Coast:
    privateering: "CAS issues letters of marque to selected pirate groups, giving them safe haven and limited amnesty in Confederate ports; terms vary by group."
  New_Orleans:
    world_state: "Magically active underworld conflict among local krewe groups, organized crime and voodoo-linked factions disrupts smuggling and shadow activity."
  Tampa_Bay:
    role: "Major commercial harbor with significant megacorporate presence."
  Pensacola_and_Mobile:
    role: "Primary CAS naval bases; Pensacola supports most naval air operations."
  Texas:
    world_state: "Border with Aztlan remains militarized; the source describes active patrols, rebel support across the border and a divided Austin."
    Austin: "Colorado River divides CAS-held north from Aztlan-held south; Lone Star Security Services is headquartered in the CAS half."
    Dallas_Fort_Worth: "Functions as provisional political center for Texas and a major manufacturing/electronics sprawl."
  Missouri:
    world_state: "Missouri remains divided between UCAS and CAS; South Missouri is the CAS state, with Springfield as capital."
  Nashville:
    role: "Rising entertainment and trideo center with a substantial BTL and vice economy."

