main_text:
  - "Keiji Saito is presented publicly as Protectorate General over the Bay Area and Central Valley."
  - "His interview describes expanded security operations, arrests, relocations and designated residential zones while framing them as crime-control and reconstruction measures."
  - "The interview acknowledges corporate financial assistance and tension with outside forces around Protectorate borders and assets."
  - "Saito names multiple political and activist groups as security threats; these are his attributed claims rather than neutral findings."

commentary_only:
  - "Shadowland posts allege broader corporate, criminal and political support networks, discriminatory enforcement, covert manipulation and staged incidents."
  - "Those posts are preserved as unverified commentary unless the chapter's Game Information section independently confirms them."

yotc_2061_attributed_reporting:
  ares_intelligence:
    - "Ares assessed Saito's expanding Bay Area force as a threat to Silicon Valley and reported support from several San Francisco Corporate Council interests."
    - "Ares reported cooperation with Berkeley/Oakland metahuman resistance, Triad suppliers and Big Sur pirates as ways to constrain Saito; these are Ares operational claims, not omniscient narration."
  resistance_material:
    - "A Metahuman People's Army pamphlet accuses Saito's regime of anti-metahuman persecution, ghettos and killings; these are propaganda claims and are preserved as attributed."
  shadowland_commentary:
    - "Posts dispute the existence and location of internment camps and speculate about Rangers, pirates, corporate sponsors and criminal alliances; these remain unverified commentary."
