id: world.region.antarctica-2062
record_type: world
name: "Antarctica"
domain: regions
status: ingested
source_period: "2062"

overview:
  area: "about 14 million square kilometers"
  population: "fewer than 10,000 in summer and fewer than 5,000 in winter"
  settlement: "roughly 90% of residents are concentrated near the coasts"
  legal_history: "The 1959 Antarctic Treaty originally restricted military activity, weapons testing, dumping and resource exploitation; the source says the Resource Rush around 2006 effectively ended that protective regime."
  current_activity: "Research, resource extraction, prospecting and isolated settlements coexist under extreme environmental conditions."

geography_and_magic:
  western_antarctica: "Includes the Trans-Antarctic Mountains and Antarctic Peninsula."
  eastern_antarctica: "A high plateau comprising about two-thirds of the continent, buried under very deep ice."
  polar_plateau: "Glaciers continually renew and push ice toward the coasts, feeding large ice shelves."
  orichalcum: "Halley's Comet-era discoveries triggered a short-lived prospecting rush in the Trans-Antarctic and Queen Maud Mountains."
  bentley_subglacial_trench: "A very deep subglacial feature where 2062 surveys reported geometric radar anomalies near Mt. Kirkpatrick; the source treats interpretations as unresolved."
  cold_magic: "Mana levels are described as ebbing and flowing unpredictably across the continent; this is a local source-period condition rather than a universal magic rule."
  sliap_imua: "A locally reported Awakened snow-storm entity; full creature mechanics are deferred to Game Information."

isolates:
  summary: "Small independent communities of survivalists, cultists and other long-term residents live away from major stations."
  support: "Many are technologically capable and depend on local food production, energy systems, magic and occasional outside resupply."

stations:
  high_threat_facilities:
    operator: "Revlup Security"
    summary: "Remote, heavily automated incarceration sites use drones, expert systems and encrypted remote monitoring; severe weather can isolate them."
  mcmurdo:
    affiliation: "UCAS / Ares"
    summary: "Largest major base described in the source, supporting roughly two hundred researchers and security personnel."
  vostok:
    affiliation: "Russia / Yamatesu"
    summary: "Extremely remote station near a subglacial lake; Yamatesu received permission to reopen and operate it in 2060."
  halley:
    affiliation: "Britain"
    summary: "Mobile Brunt Ice Shelf research station with roughly 150 researchers/security staff and extensive aurora/geospace observation."
  showa:
    affiliation: "Imperial Japan"
    summary: "Long-running Japanese research facility and hub for automated satellite stations."

sources:
  - {source: source.fanpro-10653, pages: "59-65", pdf_pages: "60-66", relation: defines_world_state}

notes:
  - "Claims explicitly presented as poster rumor or speculation are not promoted to established fact."
  - "Formal cold, mana and Awakened-entity mechanics remain for the Game Information extraction."
