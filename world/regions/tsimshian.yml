government_and_corporate_power:
  form: "Dominant-party state led by the Great Chief and Progress Party, with strong Tsimshian/Tlingit control over political institutions."
  great_chief: "Deborah Jim"
  corporate_influence: "Mitsuhama Computer Technologies is the dominant foreign corporate power and supports the regime through investment, training and security relationships."
  2053_arrangement: "Tsimshian opened to foreign investment; Mitsuhama received broad access to mining and other natural resources and favorable operating terms in exchange for economic support, military equipment and training."
  opposition: "Moderation and Potence parties remain legal but weak; both criticize the Progress Party and Mitsuhama from different positions."

timeline:
  - {year: 2018, event: "The Tsimshian nation forms; the New Haida Nation movement is suppressed."}
  - {year: 2037, event: "Tsimshian secedes from the Native American Nations."}
  - {year: "2041-2042", event: "Haida National Front organizers are arrested; surviving members move underground."}
  - {year: 2043, event: "Annual public state executions begin during potlatch ceremonies."}
  - {year: 2053, event: "Tsimshian opens to international corporations; Mitsuhama receives major mining rights and favorable access."}
  - {year: 2060, event: "Salish-border tensions escalate after hikers are arrested and tried as spies."}
  - {date: "2-4 May 2062", event: "Tsimshian forces invade Salish-Shidhe territory; fighting ends in a cease-fire."}
  - {date: "5 May 2062", event: "The Salish-Shidhe Council signs a cease-fire with Tsimshian."}
  - {date: "July 2062", event: "The cease-fire breaks down amid renewed attacks."}

law_security_and_information:
  police_state: "Security patrols, curfews, citizen identification and political pacification are routine parts of source-period policing."
  minority_restrictions: "Haida, Kwakiutl, Kitksan, Niska and other minority tribes face formal and informal restrictions on residence, employment, assembly and political activity."
  assembly_and_weapons: "Minority communities are barred from public gatherings or protests and from carrying weapons, including for self-defense."
  sedition: "Membership in or material support for the Haida National Front is treated as sedition."
  media_control:
    authority: "The government Information Department controls and censors domestic media."
    external_feeds: "External datafeeds are either prohibited or routed through government-controlled filtering."
    monitoring: "Data transfers, calls and electronic mail are routinely logged and monitored."
    outlawed_sites: "Citizens can be prosecuted for accessing prohibited Matrix sites."
    encryption: "Strong encryption is heavily restricted except for approved business or national-security uses."
  punishment:
    forced_labor: "Indentured service is a standard punishment for many offenses; prisoners are assigned labor and electronically monitored."
    compliance_devices: "Prisoners may be fitted with transmitter-linked control devices that enforce a limited movement radius."
    capital_punishment: "Severe crimes can carry capital punishment, including ceremonial public executions during the annual potlatch."
  firearms: "Civilian guns are illegal; the state actively suppresses gun possession."

military_and_border:
  force: "The Tsimshian military is small but well-equipped, heavily nationalistic and strengthened by Mitsuhama support."
  2062_border_war: "The Salish-Shidhe conflict dominates current security planning and border policy."
  foreign_support: "Mitsuhama provides materiel support described by the source as defense of corporate assets."
  infrastructure: "Key roads and approaches are prepared for military defense; source-period conditions emphasize heavy security around military facilities."

society_and_factions:
  haida_national_front:
    type: "Underground resistance organization rooted in Haida communities."
    objective: "Opposes state discrimination and corporate resource exploitation."
    structure: "Uses clandestine supporters and cells; splinter factions vary in tactics."
  long_house_brotherhood:
    type: "Secret society of shamans."
    objective: "Opposes environmental destruction and Mitsuhama/Progress Party dominance."
  discrimination: "Source-period Tsimshian and Tlingit elites dominate government, civil service and military institutions while minority tribes are treated as second-class citizens."
  magic: "The source describes a comparatively low share of shamans in official institutions and significant magical/ecological disruption in polluted regions."

economy_and_environment:
  resource_model: "Mining, timber, petroleum and related extraction dominate the economy."
  environmental_policy: "The Progress Party removed or weakened environmental restrictions to attract and support corporate extraction."
  pollution: "Mining waste, industrial emissions and deforestation have damaged waterways, forests and local astral conditions."
  mitsuhama_structure: "A dedicated MCT Tsimshian branch coordinates numerous subsidiaries active in mining, industrial technology, distribution and chemicals."

places:
  prince_george: "Largest Tsimshian city; ethnically diverse and a major Haida National Front/security focus."
  kitimat: "Capital and primary Mitsuhama corporate enclave; heavily patrolled."
  ketchikan: "Island-linked naval and smuggling hub with strong local security presence."
  quesnel: "Small military-support city and focal point for border defense planning."

shadow_activity:
  bribery: "Bribery is described as widespread enough to affect routine official interactions."
  organized_crime: "Large syndicates operate mainly where protected by corporate or government relationships; smaller local groups dominate much of the black market."
  common_smuggling: "Contraband electronics, communications gear and people move through coastal and cross-border routes."
  runner_constraints: "Because firearms are illegal and surveillance is pervasive, runners often rely on concealment, low-tech weapons, magic and trusted local contacts."

