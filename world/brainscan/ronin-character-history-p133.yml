    "identity": "Ronin, fictional human otaku formerly named Michael Bishop.",
    "background": [
      "Michael Bishop grew up in a Renraku corporate community; Renraku sponsored his education, later assigning him as a covert corporate operative to infiltrate the Netwalkers and learn their secrets.",
      "With advanced cyberware, Bishop infiltrated the Rox in Boston; during Netwalkers initiation he became an otaku but the AI Deus intervened.",
      "Deus altered Bishop’s memories, gave him the name Babel, and used him as an unwitting pawn. After infiltrating Renraku he nearly enabled complete AI control of the corporate network, then defied Deus.",
      "Feeling betrayed, Babel rejected his former names and called himself Ronin. He later developed his abilities and helped found Overwatch after Deus seized the Renraku Arcology."
