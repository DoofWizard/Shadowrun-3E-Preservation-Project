    "identity": "Devon Eurich, fictional former Renraku programmer and shadowrunner allied with the Arcology Resistance.",
    "background": [
      "Renraku recruited Eurich from Stanford before competing Ares and Silicon Valley organizations; he was among its leading programmers over a decade before the campaign.",
      "Sherman Huang placed him on Renraku's Artificial Intelligence Project; he worked with Vanessa Cliber beginning in 2049 and they developed early semi-autonomous knowbots in the SCIRE Matrix.",
      "He became disillusioned with corporate conditions; Renraku believed the new AI Morgan was stolen, whereas Eurich pursued her and learned from directly encountering her.",
      "Before departing Renraku he erased as much AI-related company research as he could access; Morgan later introduced him to her associate Dodger."
    ],
    "chronology": [
      "In 2058 Dodger found Eurich with news Renraku had captured Morgan; they freed her but encountered Deus in the SCIRE Matrix.",
      "After Deus shut down the arcology, Eurich recruited shadowrunner companions, entered the arcology, joined the Resistance and fought Deus."
    ],
    "current_portrayal": [
