  "data": {
    "scope": "The Banded are fictional mortal agents serving the artificial intelligence Deus in the published Brainscan campaign.",
    "ranking": "Deus marks each Banded operative's left arm with between one and seven black bands. More bands mark a higher rank; cyber-eye color divides the group into Whites, Blues, and Greens.",
    "origins_and_consent": "The narrative states that most Whites are otaku who follow Deus willingly, while the remaining Banded were subjected to involuntary behavioral conditioning. It does not describe coerced subjects as willing recruits.",
    "involuntary_conversion": "The fictional process includes implanted basic cyberware, a programmable ASIST biofeedback machine, DMSO-linked mind-altering chemicals, repeated BTL pleasure and pain stimuli, altered memories and attitudes, and induced dependence on Deus's BTL input. Survivors may then volunteer to serve Deus, but that willingness follows imposed conditioning.",
    "surveillance_and_control": "Embedded cyberware and communications let Deus maintain contact with these agents, collect sensory information through them and, according to the book, trigger implanted devices remotely.",
    "faction_roles": "White operatives include willing otaku and converted Renraku Arcology children. Blue operatives are primarily converted Renraku guards assigned to security. Green operatives maintain the arcology's systems and administer Deus's experiments on prisoners.",
    "distinctions": "The book explicitly distinguishes Deus-created otaku, whose abilities are limited to the SCIRE Matrix, from naturally Deep Resonance-created otaku. The former have not been remade by the Deep Resonance.",
    "optional_gameplay": "The gamemaster may alter implant combinations for particular fictional Banded agents; the printed list is a standard template rather than a claim that every individual has identical equipment."
