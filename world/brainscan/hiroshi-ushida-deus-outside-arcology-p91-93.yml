    "secret_departure": "Deus quietly smuggled Hiroshi outside the Arcology a few months before the scenario to administer operations at Tin Man Scrap Works and prepare for its intended expansion.",
    "aneiki_information": "Hiroshi has a datachip containing information about Renraku CEO Inazo Aneki, his journey to Tibet and the stored 'kill codes' intended to destroy Deus. The source points readers to printed Player Handouts pp145-46.",
    "opposition_to_deus": "Deus responded to Huang's efforts to establish contact by opening communications through Hiroshi. In a later secret meeting, Hiroshi and Huang discussed recovering Renraku CEO Inazo Aneki and formed an alliance. Afterward, Hiroshi monitored Renraku's retrieval efforts, while White otaku acquired information from secure Renraku hosts. These are source-narrator fictional chronology claims.",
