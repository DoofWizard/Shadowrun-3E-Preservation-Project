data:
  arcology_systems: After Deus is fragmented, the arcology has neither its AI operator
    nor stable drone coordination. Some backup systems keep facilities running; others
    collapse or become unreliable, including lighting, lifts, ventilation, fire suppression
    and security. Most remaining Deus drone constructs self-destruct; some continue
    routines or become uncontrolled.
  banded: Banded captives experience differing degrees of withdrawal, addiction and
    mental conditioning from coerced Deus-imposed programming. Some are implanted
    with BTL systems; a number of factions later try to regroup or leave. Most White
    otaku, portrayed as the most affected, are stunned or become disorganized.
  rescue_and_power: Arcology refugees try to escape; military forces provide rescue/triage
    but continue confinement and control in places. A reactor is shut down, causing
    major blackouts; military keeps one running at minimal levels to sustain a few
    base areas.
  matrix: SCIRE Matrix UV hosts and other nodes lose coherence after the AI’s fragmentation.
    Most links to external LTGs and RTGs remain closed except the First Pacific Bank
    host for a time, as the book describes. Navigation becomes difficult.
  timeline_status: These are in-setting consequences and authorial scenario options,
    not real-world software/system operation recommendations.
