  "headline": "Fictional SR3 Brainscan FASA Corporation (2000), FASA7331, printed p14 / physical PDF15 — The Players: original cast and motivations",
  "summary": "Original publication's fictional gamemaster cast overview in Brainscan (FASA Corporation, 2000, Shadowrun Third Edition, source.fasa-7331), printed p14/PDF15; preserves character identities, allegiances, coercion distinctions and source-assigned archetype labels.",
  "data": {
    "heading": "THE PLAYERS",
    "characters": [
      {
        "name": "Deus",
        "book_archetype": "The God",
        "source_account": "Self-assured AI controlling much of its surroundings and loyal servants; its overriding goal is survival and freedom, and the narrator describes its inability to imagine defeat."
      },
      {
        "name": "The Banded",
        "book_archetype": "The Fanatics",
        "source_account": "Deus's fighters and servants; named leaders include Hiroshi Ushida (Greens), Tadashi Marushige (Blues), and Pax (Whites). The source explicitly distinguishes many White Banded who follow voluntarily from other Banded forced into loyalty by extensive personality reprogramming."
      },
      {
        "name": "Overwatch",
        "book_archetype": "The Electronic Cavalry",
        "source_account": "Otaku youths recruited by Ronin or Dodger who defend the Matrix and monitor Deus-related disturbances, particularly outside Renraku Arcology."
      },
      {
        "name": "Ronin",
        "book_archetype": "The Ronin",
        "source_account": "Unaffiliated fighter whose conflict with Deus has become personal; he believes Deus is dangerous and seeks vengeance, while the narrator cautions that his participation often serves his own aims."
      },
      {
        "name": "Megaera",
        "book_archetype": "The Rape Victim (the sourcebook's literal fictional character heading)",
        "source_account": "AI derived from Morgan-related code torn from the original intelligence; the narrator calls her creation an accident and describes her as unstable and seeking to recover missing code, perceiving Deus as the source of that loss and trusting Dodger alone. The term in the source heading is retained as an archival characterization, not generalized into a real-world account."
      },
      {
        "name": "Dodger",
        "book_archetype": "The Obsessed Knight",
        "source_account": "Decker devoted to Megaera and convinced she cannot fully recover until missing code is restored. He also seeks to defeat Deus, a rival artificial intelligence."
      },
      {
        "name": "The Resistance",
        "book_archetype": "The Peasant Revolt",
        "source_account": "Captives fighting Deus for survival, with additional differing motives: Devon Eurich seeks to repair something he feels partly responsible for; Kiel Raugos aims to help defenseless people; Vanessa Cliber still serves Renraku's interests and prioritizes the corporation's mission over the victims' goals."
      },
      {
        "name": "Sebastien",
        "book_archetype": "The Judas",
        "source_account": "A mole inside Deus's structure who relays information to Overwatch and the Resistance but is described as destined to betray them; the book notes some in-world observers believe he may sincerely consider his own betrayal justified."
      },
      {
        "name": "Inazo Aneki",
        "book_archetype": "The Fallen King",
        "source_account": "Renraku CEO who considered the arcology an experiment in improving citizens' lives but viewed employees and code as replaceable parts, leading the fictional narrator to attribute the catastrophe partly to his own abuses."
      },
      {
        "name": "Sherman Huang",
        "book_archetype": "The Mad Scientist",
        "source_account": "Scientist motivated by control and ambition, jealous of Deus's achievements while treating his creation as dangerous and subordinate."
      }
    ],
    "source_distinction": "Archetypal subtitles and judgments are the original fictional sourcebook narrator's descriptions; they are not classifications of real people and do not prove any in-world disputed account."
  },
  "framing": "newsroom_neutral"
}
