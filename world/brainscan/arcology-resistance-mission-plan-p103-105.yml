data:
  ark_infiltration: The chapter presents the Ork Underground tunnel leading to an access point in
    the Renraku Arcology’s B4 parking level. Ork guides Tholm and Slant take the team through sewers
    and maintenance corridors, guarded at one point by four armed trolls. The entrance is intentionally
    away from populated Underground areas.
  resistance_199th_floor: The runners encounter a Resistance group on the 199th floor. In the scenario,
    the core Resistance cell includes the elf Kiell Rauglos and the human Devon Eurich. Their concealed
    meeting point is an abandoned entertainment-district bar called Durruti’s, watched for surveillance;
    members discuss access to the core host.
  two_cell_operation: Kiell displays a trid map of levels 201, 202 and 272. The team proposes to
    recover Cham Lam Won and his Mousetrap from the 272nd floor, descend, then split into a team
    restoring air circulation for level 202 and a team attempting to reach and jack into the SCIRE
    AEP host.
  mousetrap_location: The Resistance identifies Cham Lam Won as held in the arcology’s upper floors
    by Deus-controlled otaku called the Whites; Cham wears an ankle cuff and carries a cyberdeck
    described as the Mousetrap. Kiell’s account that Cham holds the device is in-world Resistance
    information, not proof that all actors fully understand the AI’s motives.
  gas_atmosphere: The narrator describes the 202nd floor as filled with gases in place of breathable
    air. The proposed atmospheric restoration requires taking valves and tanks located on the 201st
    floor; Cliber’s Resistance cell is intended to cover the retreat.
  competing_allegiances: The book’s Resistance members credit Cliber with helping Cham design Deus,
    while other Resistance members mistrust her and her Renraku links. Dodger and Devon dislike her,
    but the scenario asks them to cooperate despite those differences.
  ucas_offensive: The UCAS/Renraku force controls approximately the first five floors, prepares an
    upward offensive and seeks the basement B21 fusion reactors. Other floors are under forces associated
    with Deus. These are the original campaign’s fictional control descriptions.
