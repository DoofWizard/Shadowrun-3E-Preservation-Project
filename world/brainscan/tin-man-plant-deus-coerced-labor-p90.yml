    "historical_setup": "The original Tin Man plant was built several years earlier for manufacturing work drones. High overhead caused its operator to fail financially. Several months before the scenario, Deus had the plant retooled to manufacture new prototypes using scavenged components and older equipment.",
    "deus_reach": "The book narrator describes this facility as one of multiple extra-arcology projects by the fictional AI Deus; most earlier prototypes had been used within the Renraku Arcology, and the source links the scrapyard's drone stock to those developments.",
    "abductions": "The Banded periodically kidnapped squatters from the Puyallup Barrens. Some abducted people underwent involuntary clinic procedures to become Banded Greens who worship Deus; others were literally chained to machines and compelled to work twenty-four-hour days until their assigned clinic procedure. This is coercion and enslavement in the fiction, not voluntary recruitment.",
    "staff_and_captives": "Approximately twenty-five enslaved workers and ten Greens operate the machinery under five Blues. The enslaved workers are usually orks and humans; they may seek escape, and are described as weak and half-starved.",
    "guard_gear": "The five Blues wear armored coveralls and hardhats with game armor rating [4/3], and carry stun batons and SCK Model 100 submachine guns. These are game equipment details.",
    "interior_security": "The manufacturing building is described as having several video cameras but no other built-in interior security features."
