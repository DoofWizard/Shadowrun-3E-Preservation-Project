data:
  hiroshi_history: Hiroshi Ushida, former director of the Renraku Arcology, was subverted
    and placed in charge of the Banded’s Green administrative apparatus. He oversaw
    involuntary detentions, conversion and experiments inside the arcology and is
    depicted as enjoying and directing some of these abuses. Deus installed specialized
    skillwires with customized hardwired programs; this enables him to use technical
    skills equivalent to Rating 6 skillsofts without conventional chipjack-slotted
    chips.
  external_activity: Deus smuggled Hiroshi out months before the adventure to coordinate
    its projects outside the arcology and prepare its expansion. Hiroshi is currently
    in charge of Tin Man Scrap Works and holds a datachip containing information about
    Inazo Aneki and his return from Tibet, which would assist Overwatch. The book
    says the damage to Aneki’s brain conceals the Deus kill codes.
  contingency: If the runners capture Hiroshi alive, Deus will seek to prevent interrogation
    by remotely activating a preinstalled injector that kills him. The original scenario
    specifically depicts an involuntary lethal medical intervention; this is fiction,
    not ordinary treatment or voluntary action.
  glynis_identity: Glynis Taki, a Cat-following researcher whose will and spirit were
    corrupted through Deus conditioning, was assigned as Hiroshi’s protective toxic
    shaman. She has degraded physical appearance, conspicuous cybernetic eyes, and
    distorted predatory behavior.
  glynis_conditional: If Hiroshi is endangered Glynis may summon a Great Form Toxic
    City Spirit, assembling its fictional body from surrounding industrial debris
    and even site drones. Exact spell/creature statistics are separately recorded.
  scenario_attribution: Narrator-level campaign facts are distinct from optional gamemaster
    contingencies and from character dialogue; page p93 may exclude player characters
    who refuse Overwatch’s mission from later chapters.
