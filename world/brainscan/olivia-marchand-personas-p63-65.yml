  "summary": "FASA Brainscan (2000), fictional original Shadowrun Third Edition campaign, FASA7331/source.fasa-7331, printed pp63-65/PDF64-66: Involuntary fictional persona fracture, Charlie/Sisi/Legion/Olivia distinct motives and claims, Flora\u2019s care and spiritual explanation, GM-dependent outcomes.",
  "data": {
    "source_context": "Original fictional Shadowrun Third Edition Brainscan narrative of Dr Olivia Marchand, printed pp63-65/PDF64-66. Characterized psychological effects are caused by invented Matrix technology, not real diagnostic guidance.",
    "narrator_fact": "An involuntary Project Legion experience fragmented Dr Olivia Marchand\u2019s awareness. Marchand remains a person affected by severe stress and cannot consciously control all her alternate personas. Her grandmother Flora Rochambeau, a Voodoo mambo, offers protection and care.",
    "personas": {
      "Charlie": "A fearful childlike persona. Brisbie-era sources refer to Charlie as a childlike voice; at first contact Charlie seeks reassurance and to reach safety, mistrusts some adult motives, and reacts poorly to intimidation. Kind persuasion may gain cooperation.",
      "Sisi": "A frightened and highly suspicious persona who knows about Overwatch and believes its distributed-decking knowledge may help oppose Deus. She seeks escape and possible contact with Overwatch but lacks the full story; her distrust makes her reluctant to risk herself, and her paranoia is narrator-described rather than objective proof of all suspicions.",
      "Legion": "A cold, calculating persona that identifies with the distributed Matrix concept and claims to be the genuine Olivia. Legion may cooperate pragmatically with the group in hopes of escape and is dismissive of the other personas, especially Charlie and Sisi.",
      "Olivia": "The outward doctor persona interprets the situation as a rival-corporation kidnapping, resents losing her research, challenges the apparent operators about their credentials, technology and compensation, and may complain of fatigue and recurrent nightmares."
    },
    "floras_role": "Flora believes the frightening effects on her granddaughter may be related to malicious spirits; she invokes her own magical allies and may choose to help the runners keep Marchand calm if convinced they offer safety. These are in-world religious interpretations distinct from the sourcebook narrator\u2019s Matrix explanation.",
    "gm_variability": "The text instructs the gamemaster to choose which persona emerges based on game stress, stimuli and player behavior. No specific persona response is inevitable; consent and coercion must not be conflated."
  },
