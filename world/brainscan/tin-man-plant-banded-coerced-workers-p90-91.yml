data:
  background: FASA Brainscan describes Tin Man Scrap Works as a former factory for
    a new work-drone line; high overhead drove the original company into financial
    ruin. Deus later retooled it for improvised drone prototypes using recycled components
    after taking control of the Renraku Arcology.
  coerced_workforce: The Banded have repeatedly abducted people from the Puyallup
    Barrens. Some victims were involuntarily altered at the facility clinic and made
    into Greens serving Deus; others are physically chained to machines and forced
    to work 20-hour days, living there until death. These are not voluntary employees.
    The plant has approximately 25 enslaved workers and 10 Greens, guarded by five
    Blues. The slaves are mostly orks and humans, weakened and malnourished; the book
    says they cannot contribute much to a fight, though an escape opportunity may
    arise.
  plant_security_and_layout:
    workers: Banded armored coveralls and hardhats [4/3]; Blues carry stun batons
      and SCK Model 100 submachine guns. No building defenses beyond several interior
      cameras are identified.
    office_building: Converted into the Banded operations center. Main doors unlocked;
      back entrance is near the kennels of cybered barghests.
    security_office: Two Blues continuously monitor cameras at site gates and plant;
      hardwired drone-control deck connects to security panel.
    clinic: Used for coerced conversion of abductees into Banded Greens; source describes
      one ork victim restrained for a surgical procedure, with a Deus-directed implanted
      datajack/sim connection. The clinic also contains fictional game chips and equipment,
      indexed separately.
    bunk_room: Former offices converted into roughly a dozen bunk beds for Blues and
      Greens.
    work_room: Maps, computers, chips and files about Tin Man and other corporations,
      with evidence connecting the site to additional business partners.
  deus_strategy: The operation is one segment of an external network built by Deus,
    designed to extend its activity beyond the arcology; this discovery is presented
    to runners as consequential for Overwatch.
