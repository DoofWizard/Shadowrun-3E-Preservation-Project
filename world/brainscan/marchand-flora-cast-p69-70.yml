    "dr_olivia_marchand": {
      "origin": "From New Orleans; grew up during a local resurgence of magic and Voodoo practices. As a girl she underwent a ritual performed by her grandmother that made her a serviteur of the loa, yet Olivia avoided further magical involvement and favored computers.",
      "education": "Learned to use a cyberterminal as a small child and became an accomplished decker/programmer by twelve. Cross Applied Technologies sponsored her at CalTech for degrees in Computer Science and Engineering.",
      "cross_career": "Began at Cross's Montreal facility after graduation, earned attention for Babel-series cyberdeck and software work, and made Project Legion her signature project.",
      "description": "Woman in her middle thirties of Creole background; coffee-colored skin, wavy black hair, everyday business wear.",
      "persona_structure": "Sisi sees herself as a guardian angel and has spoken with Ronin and Dodger; claims Overwatch may help save Olivia but withholds details. Legion presents itself as a servant of Deus, contacts the runners' employer and claims to be the real Olivia. Charlie acts as a frightened young child; core Olivia assumes the circumstances involve rival corporations.",
      "narrator_discretion": "Personas coexist unconsciously and emerge under sleep and stress; game masters choose which persona appears. When none is specified, the core Olivia persona dominates. These fictional events are not general psychiatric guidance."
    },
    "meme_flora_rochambeau": {
      "relationship": "Olivia's maternal grandmother and only living relative; both parents died when Olivia was seven. Flora raised her.",
      "heritage": "Creole Voodoo mambo from New Orleans, learned her own magical traditions from her mother; wanted Olivia to inherit the tradition, but the child chose computers and Matrix work instead.",
      "motive": "Believes technology and negative spiritual influence damaged Olivia. Flora's interpretation of Olivia's condition is her in-world belief, distinguished from the narrator's techno-psychological account.",
      "care_and_agency": "Leaves New Orleans to find her granddaughter; offers to accompany an escape to care for her; does not freely assent to a harmful handover.",
      "description": "Older Creole woman with a stubborn streak; loves Olivia, even when angry about her life choices."
    },
