  "data": {
    "identity": "Dodger, fictional elven decker; the campaign describes him as a pre-Awakening “spike baby.”",
    "background": [
      "Trained as a decker in the service of Sean Laverty in Tir Tairngire, Dodger broke away from Laverty’s inner circle for personal reasons and became a prominent shadowrunning decker.",
      "During Renraku Arcology Matrix incursions around 2050, he encountered the self-aware AI Morgan; their attachment became romantic, but his extended Matrix sessions damaged his health and he could not remain with her as a physically embodied metahuman.",
      "Morgan told Dodger about Renraku’s AI program and Devon Eurich; Dodger helped her escape and introduced Eurich to the shadows.",
      "In 2058 Dodger lost contact with Morgan, concluded Renraku had captured her and worked with Eurich to free her. She suffered extensive alteration of her code and personality, assuming the identity Megaera."
    ],
    "motivations_and_perspective": [
      "Dodger believes Renraku removed essential aspects of Morgan’s personality that might have been incorporated into Deus. This is his conclusion, not a mechanically demonstrated certainty.",
      "He seeks to defeat Deus and recover those aspects to restore Morgan, whom he continues to love."
    ],
    "portrayal": [
      "Dodger presents a witty, confident public manner and frequently adopts Dickensian English language.",
      "His Matrix icon resembles an ebony-colored boy in a cloak of swirling stars."
    ]
  },
