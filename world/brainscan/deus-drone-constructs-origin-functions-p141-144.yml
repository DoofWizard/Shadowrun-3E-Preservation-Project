  "data": {
    "context": "Fictional Sourcebook description of Deus's mechanical constructs in FASA Corporation Brainscan (2000), an original Shadowrun Third Edition campaign; not real technological claims.",
    "origin": "Deus designs physically unsettling robotic drones using innovative combinations of existing materials, smart materials, electrical/mechanical engineering, biotechnology and nanotechnology rather than a wholly new invention. The campaign treats the constructs as highly autonomous.",
    "command_network": "Deus can transmit to and receive from constructs. Each has a 50 percent chance of connection to one of its subscriber remote-control networks at a given time. Bumblebees, Dolls and Spiders often connect to Green Banded networks; Dervishes, Mantas and Medusae connect to drone networks. The book references Renraku Arcology: Shutdown p76.",
    "bumblebee": "A near-silent, flying insect-sized construct. Its appearance is deliberately deceptive; a moving one requires a successful fictional Perception (10) Test to spot, with +2 to the target number when still and -3 when using thermographic vision. Maximum flight time 5 Combat Turns, range 50 meters. It carries two single-use cutter-nanite 'stinger' charges; can return to a fictional hive for a reload taking 5 Combat Turns. Its printed autosofts are Clearsight 3 and Implant Weaponry 2.",
    "dervish": "Fast, armored, cylindrical spinning construct. Its armor-piercing spikes can be ejected with a semi-auto, shotgun-like fictional weapon. Drive-by-wire structural agility grants +2 Pilot on Handling Tests. Autosofts Clearsight 2 and Sharpshooter 4. Fictional spikes are listed [shotgun, SA, 8S (f), 50(m)] and the source describes chemical payload variants without presenting real-world procedures.",
    "doll": "Construct resembling a child's toy issued within the fictional arcology; immobile and Body 0, destroyed by any successful hit. The book also states they are used to monitor children and people. Its role is surveillance and companionship under coercive AI governance, not independent child consent.",
    "gorgon": "Ambush construct usually folded into a magnetic carapace attached to walls/ceilings. Ruthenium polymer camouflage, target must succeed fictional Perception (10) to spot. Four jack-equipped legs can leap 2 meters per Handling success; arms have Strength 9, Reach 2 claws; also four telescoping tentacles and a chemical sprayer. Can ignore up to six boxes of wound penalties, applies all penalties beyond that. Listed autosofts: Clearsight 4, Implant Weaponry 4, Sharpshooter 3.",
    "manta": "Large aerial skimmer resembling an aquatic ray; can fly several meters above ground. Drive-by-wire construction grants +2 Pilot for handling. Fictional turret-mounted launcher and an aerial sprayer can produce a 25 x 25 x 10 cubic-meter mist cloud as a Complex Action. Listed autosofts: Clearsight 3, Sharpshooter 3.",
    "medusa": "Large four-legged, two-armed primary combat construct with serrated claws and chrome sensory cilia. Claw-arm Strength 9, 9M with +1 Reach, two extra points ablative armor (adding 4 to Armor rating) and maneuver controls ignoring up to six boxes of wound penalties. Leaps 3 meters per Handling success and has a fictional electric anti-theft shock system. Listed autosofts Clearsight 5 and Implant Weaponry 4, sometimes Sharpshooter 3.",
    "renraku_arachnoid_minidrone": "A 17-centimeter Renraku-built arachnoid reused by Deus as Resistance hideout scouts or sentries, augmented for the fiction's autonomous operations.",
    "skellbots": "Human-sized skeletal machines guarding prisoners and important personnel, wield standard fictional equipment; slow but mobile, arm Strength 6 and built-in recoil-compensating gyroscopes. Autosofts Clearsight 2, Implant Weaponry 3, Sharpshooter 3.",
    "spider": "Construction and maintenance robot resembling a monstrous ellipsoid-bodied spider with four to twelve flexible arms, each equipped with tools. Each arm normally Strength 4, some Strength 8; tool attacks may have +1 Reach. The machine carries a built-in electronic toolkit and technical autosofts.",
    "provenance_note": "All weapon, engineering and other parameters are in-world tabletop game fiction; detailed original mechanical stats are preserved separately in the p144 stat-table and p141–142 rules records."
