    "setting_timeline": "After earlier missions in which the player-character runners unknowingly served Deus, Overwatch learns enough to confront the AI; Deus recognizes them as potential threats but also potential instruments.",
    "overwatch_intent": "Overwatch intends to retrieve a young Banded White otaku known as a White who is attempting to leave the Renraku Arcology. Overwatch decides that its best chance of testing the runners' loyalty is to ask for their help; the runners are not initially aware the two parties manipulating them are opposed.",
    "deus_plan": "Deus wants to destroy Overwatch, which is hard to trap within the Matrix, and instead targets its physical hideout. Deus deliberately permits an Overwatch spy within the Banded, a boy named Sebastien, to discover a proposed escape plan for a Banded child. He predicts Sebastien will alert Overwatch, that Overwatch will retrieve the White with other escaped children, and that its helpers will lead Deus to the safehouse.",
