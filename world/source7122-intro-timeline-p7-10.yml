source_use:
  - "The book treats Dunkelzahn's will as a campaign framework rather than one fixed adventure."
  - "The introduction says the will contains more than 200 bequests of money, stocks, magical items, art, titles, responsibilities and other gifts."
  - "The Players section is a gamemaster reference for organizations and individuals affected by the will; later sections present investigations and campaign hooks."

timeline:
  - {date: "mid-2056", event: "UCAS Congress formally recognizes great dragon Dunkelzahn as a legal UCAS citizen; a public handshake with President Thomas Steele helps elevate the Steele-Dunkelzahn ticket."}
  - {date: "November 2056", event: "President Thomas Steele and Vice President James Booth are overwhelmingly re-elected."}
  - {date: "December 2056/January 2057", event: "The 2056 results are found to be rigged; House Speaker Betty Jo Pritchard declares the election null and void, and a new Election Day is set for 7 August 2057."}
  - {date: "January/February 2057", event: "Five major candidates emerge: Arthur Vogel, Dr. Rozilyn Hernandez, James Booth, General Franklin Yeats and Kenneth Brackhaven."}
  - {date: "1 February 2057", event: "Kenneth Brackhaven formally announces his candidacy at a Seattle rally."}
  - {date: "28 February 2057", event: "James Booth and Franklin Yeats meet in a New Hampshire town-meeting debate; the source records Booth as the loser."}
  - {date: "15 March 2057", event: "Dunkelzahn announces on a historic broadcast of Wyrm Talk that he will run for President."}
  - {date: "March-July 2057", event: "The UCAS campaign continues with Dunkelzahn, Booth, Yeats, Hernandez and Brackhaven as the principal contenders."}
  - {date: "10 July 2057", event: "General Franklin Yeats is assassinated in a Seattle hotel room."}
  - {date: "18 July 2057", event: "Anne Penchyk, Yeats's running mate, declares that she will continue the campaign as a presidential candidate."}
  - {date: "1 August 2057", event: "Deadline for receipt of absentee ballots."}
  - {date: "7 August 2057 23:23:34 EST", event: "Election Day result: Dunkelzahn is declared the winner by a narrow margin."}
  - {date: "8 August 2057", event: "Pro-Awakened celebrations occur in cities across the UCAS."}
  - {date: "9 August 2057", event: "President Dunkelzahn and Vice President Kyle Haeffner are formally sworn into office in Washington, FDC."}
  - {date: "9 August 2057 22:23:08 EST", event: "Dunkelzahn is assassinated in the presidential limousine as he leaves the Watergate Hotel."}
  - {date: "9 August 2057 22:24:57 EST", event: "An astral rift appears above the site of Dunkelzahn's death."}
  - {date: "9 August 2057 22:28:01 EST", event: "FBI headquarters receives the first claim of responsibility, from Red Dawn; authorities label the claim a hoax because the caller's details are obviously false."}
  - {date: "9 August 2057 23:14:46 EST", event: "UCAS military mage Tanya Reilly becomes the first recorded casualty of the new magical phenomenon when her astral body is drawn into the rift."}
  - {date: "9 August 2057 23:31:20 EST", event: "Public astral space near the site is blocked off as hazardous and government mages post astral warning signs."}
  - {date: "10 August 2057 02:32:37 AM EST", event: "Kyle Haeffner is sworn in as President of the UCAS."}
  - {date: "10 August 2057 07:35:12 AM EST", event: "Haeffner meets Chief Justice Richard Scott to form the Scott Commission on Dunkelzahn's assassination."}
  - {date: "10-11 August 2057", event: "Riots gather momentum in major UCAS cities; rumors describe a second Night of Rage, with Ares Macrotechnology security support used alongside public authorities."}
  - {date: "12 August 2057", event: "Haeffner nominates Nadja Daviar for Vice President; confirmation is delayed pending the Scott Commission."}
  - {date: "15 August 2057 09:31 AM EST", event: "Nadja Daviar reads Dunkelzahn's will at the Watergate Hotel; some certificates are distributed immediately, while most bequests are scheduled for September."}
  - {date: "15 August 2057 09:31:07 AM EST", event: "The will appears on multiple online user groups including Shadowland; the source says no one knows who uploaded it or where the text came from."}
  - {date: "15 August 2057 16:53:34 EST", event: "Daviar issues her first press release as chair of the Draco Foundation board."}
  - {date: "18 August 2057", event: "President Haeffner proposes a full Cabinet slate rather than replacing one office at a time."}
  - {date: "22 August 2057", event: "Captain Chaos uploads the first Shadowland investigation material concerning the will."}
  - {date: "25 August 2057", event: "The names of the Scott Commission are released; hearings with President Haeffner are scheduled for 5 September."}
  - {date: "31 August 2057 02:55:23 AM", event: "The Players of the Awakened World is uploaded to Shadowland by Captain Chaos."}
  - {date: "1 September 2057", event: "Daviar releases the names of the Draco Foundation board of directors."}
  - {date: "3 September-10 November 2057", event: "The Draco Foundation begins operating from newly christened headquarters and receives inheritance claims."}
  - {date: "5 September 2057", event: "The Scott Commission begins hearings with President Haeffner."}
  - {date: "2 October 2057", event: "Captain Chaos begins posting a series of investigations into will bequests."}
  - {date: "3 November 2057", event: "The Draco Foundation closes until 3 December; thereafter the Foundation opens for exactly seven days beginning on the third of each month to process inheritance claims and other public business."}
  - {date: "8 November 2057", event: "The Scott Commission publishes Alpha Interview #1, clearing President Haeffner of involvement in Dunkelzahn's assassination."}
  - {date: "12 November 2057", event: "The Scott Commission begins questioning Nadja Daviar."}
  - {date: "14 November 2057", event: "Congress begins the approval process for President Haeffner's Cabinet appointees."}

