organizations:
  - name: "Ares Macrotechnology"
    leadership: {president_ceo: "Damien Knight", chairman: "Leonard Aurelius"}
    headquarters: "Detroit, Michigan, UCAS"
    profile: "AAA megacorporation; Dunkelzahn's holdings and Nadja Daviar's proxy alter the internal voting balance."
    source_specific:
      - "Knight and Aurelius are each described as owning 22 percent before the will-related proxy shift."
      - "The chapter states that Daviar's proxy rights raise Knight's effective control to 34 percent."
  - name: "The Atlantean Foundation"
    leadership: {president: "Sheila Blatavska"}
    headquarters: "Atlanta, CAS"
    profile: "International archaeological and magical-research organization founded in 2012 around the Atlantis thesis; increasingly studies magical sites and artifacts generally."
    will_relevance: "The will leaves the Foundation 5,000,000 nuyen and a relic identified as the fingerbone of St. Dunstan."
  - name: "Brackhaven Investments"
    leadership: {president: "Kenneth Brackhaven"}
    headquarters: "Seattle, UCAS"
    profile: "Umbrella organization for Kenneth Brackhaven's broad business holdings and corporate connections."
    attributed_context:
      - "Shadowland commentary links Brackhaven's business network to Humanis-aligned political influence; those claims remain attributed."
  - name: "Carras Communications"
    headquarters: "Minot, North Dakota, UCAS"
    profile: "Very small low-frequency communications firm and R&D shop."
    will_relevance: "Dunkelzahn leaves Carras Communications 1,000,000 nuyen for marketing."
