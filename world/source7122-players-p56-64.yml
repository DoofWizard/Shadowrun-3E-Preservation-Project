      - {name: "Cross Matrix Technologies", location: "Montreal, Quebec", head: "Lucien Cross"}
      - {name: "Cross Biomedical", location: "Boston, UCAS", head: "Sandra Wright"}
      - {name: "Cross Advanced Electronics", location: "Seattle, UCAS", head: "Bernard Cross"}
