    "camouflage_profiles": [
      {
        "item": "Ghillie suits",
        "report": "Picador describes cloak-like suits with cloth strips, netting and foliage elements intended to disrupt a wearer's outline. The article describes them as helpful for concealed static observation but cumbersome while moving.",
        "speaker_comments": [
          {
            "speaker": "Longarm",
            "claim": "Says a full ghillie suit greatly hinders running and recommends a slow crawl."
          },
          {
            "speaker": "Grogmement",
            "claim": "Discusses a lighter stalker suit found in some adventure catalogs, which allows a slow jog at the cost of concealment compared with a full suit."
          },
          {
            "speaker": "Bateau",
            "claim": "Claims a ruthenium-fabric poncho could offer greater concealment while moving, but is expensive and scarce."
          }
        ]
      },
      {
        "item": "Camouflage nets",
        "report": "Picador describes diamond- or hexagonal-section camouflage netting interwoven with imitation foliage, synthetic coverings and sensor-baffling material. It is presented as covering vehicles, tents and other large objects.",
        "speaker_comment": {
          "speaker": "Soodan",
          "claim": "Says netting should break up the concealed subject's overall shape; cites distance from the subject's surface as a field observation, not a tabletop rule."
        }
      }
    ],
    "load_bearing_gear": {
      "report": "The article distinguishes rucksacks, combat vests, harnesses, loops, belts and interchangeable equipment pouches, and says Picador's unit uses modular combat vests for short operations and reserve rucksacks for extended field deployments.",
      "speaker_comment": {
        "speaker": "Dancin' Hanson",
        "claim": "Describes military rucksack quick-release fittings as useful when a wearer must shed a heavy pack quickly."
      }
    },
