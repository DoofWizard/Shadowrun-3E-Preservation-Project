        "report": "Picador identifies a Salish–Tsimshian border war, possible civil war within the Algonkian–Manitou Council, Saito's California campaign, Pueblo involvement in the Mojave conflict, and an ongoing Mexican standoff in Texas as active or prospective contract theaters. The Algonkian–Manitou war is expressly presented as possible, not underway."
