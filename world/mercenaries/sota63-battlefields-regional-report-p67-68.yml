        "region": "Philippines",
        "source_page": 67,
        "report": "Following the withdrawal of Imperial Japanese military forces, Picador says the Huk gained reach across the islands. Japanacorps facing rebel retaliation have turned to mercenary security, and Picador doubts that peace will promptly return."
