      },
      {
        "region": "Kenya and East Africa",
        "source_page": 67,
        "report": "Picador describes plans by megacorporations for a mass driver at Mount Kilimanjaro as suspended following an attack by spirits native to the mountain. The narrator reports local warlords crossing from Somalia, Ethiopia, and Tanzania into Kenya and attacking corporate holdings amid the turmoil."
