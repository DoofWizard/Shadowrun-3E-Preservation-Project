data:
  publication:
    publisher: FASA Corporation
    title: Prime Runners
    catalog: FASA7116
    year: 1994
    edition: Shadowrun Second Edition
    setting: fictional in-world Shadowrun discussion board
  subject: Corey Martin
  source_anchors:
  - printed_page: 86
    pdf_page: 95
    section: Two comments below the character biography
  - printed_page: 87
    pdf_page: 96
    section: Six continuing in-world messages before Hooks
  messages:
  - speaker: Gnasher
    timestamp: 14:41:30/10-13-55
    printed_page: 86
    pdf_page: 95
    assertion: Claims Corey commits postmortem mutilation of victims, specifically
      removing or consuming their livers and spleens, and describes alleged circumferential
      neck wounds characterized by the commenter as ritual partial decapitation. The
      original message takes a taunting tone that this archival reference does not
      endorse.
    certainty: Unverified fictional forum allegation, not narrator-established forensic
      evidence.
  - speaker: Mass
    timestamp: 18:12:19/10-17-55
    printed_page: 86
    pdf_page: 95
    assertion: Disputes an explanation of Corey's conduct based only on reported abuse
      and neglect, suggests that an unknown accomplice may be responsible for greater
      violence, and argues that the known profile is incomplete.
    certainty: Speculation about cause and a possible partner, not a confirmed relationship.
  - speaker: Vale
    timestamp: 18:29:50/10-17-55
    printed_page: 87
    pdf_page: 96
    assertion: Speculates about a multiple-personality disorder and a divided personality,
      alternating between a nonviolent and violent state, to explain inconsistencies
      in the profile.
    certainty: Dated in-world psychological conjecture, not a diagnosis or book-narrator
      fact.
  - speaker: Mass
    timestamp: 18:34:17/10-17-55
    printed_page: 87
    pdf_page: 96
    assertion: Rejects Vale's psychological theory, claims that the APA had removed
      it from an in-world DSM-V manual four decades earlier and replaced the term
      with Hysterical Dissociation Reaction with Associated False Memory Syndrome,
      and argues that undisclosed information may become available only after Corey
      is apprehended.
    certainty: Argument by a participant, not a narrator-certified account of psychiatric
      history.
  - speaker: Fedeye
    timestamp: 06:11:22/10-28-55
    printed_page: 87
    pdf_page: 96
    assertion: Reports that Ohio State Troopers and the FBI have increased the number
      of killings credited to Corey to 24, while 19 other deaths fitting less of the
      known profile remain uncredited.
    certainty: In-world updated count attributed to the speaker, not confirmation
      of every incident.
  - speaker: Ghost Man
    timestamp: 01:13:00/11-01-55
    printed_page: 87
    pdf_page: 96
    assertion: Says an Eagle Security squad tracked the suspect in Chicago in late
      2054, discharged more than 60 shots without killing him, and reportedly attributed
      unusual operational problems to magical interference; expresses uncertainty
      about the explanation.
    certainty: Secondhand in-world security-account allegation, not verified proof
      of a supernatural cause.
  - speaker: Worried
    timestamp: 00:04:16/11-03-55
    printed_page: 87
    pdf_page: 96
    assertion: Reports possibly seeing a withdrawn, green-haired ork youth squatting
      in unfinished condominiums near 13 Mile Road and Ryan Road in Warren, Michigan;
      notes a gaunt appearance, recently healed scratches and unusual red eyes, and
      asks others whether the youth is Corey.
    certainty: Unconfirmed reader sighting, not proof of identity or residence.
  - speaker: Citizen
    timestamp: 00:05:58/11-03-55
    printed_page: 87
    pdf_page: 96
    assertion: Urges the previous writer to call emergency services immediately.
    certainty: Response to an unverified sighting; no resulting emergency call is
      established.
  authority_boundary: These dated 2055 pseudonymous comments are fictional claims
    and disagreements, kept separate from the character biography and the gamemaster-facing
    shella possession premise.
