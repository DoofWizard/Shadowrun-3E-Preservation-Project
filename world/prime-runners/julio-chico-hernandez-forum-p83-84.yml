    certainty: Threatening forum comment, not evidence that a group was actually dispatched.
  - speaker: Collector
    timestamp: 03:19:11/10-20-55
    assertion: Alleges one or two foreign governments arranged incidents attributed
      to Chico, that some Western insurers profited from covering aircraft disasters,
      and that insurance companies passed costs onward.
    certainty: Unverified conspiratorial claim by a pseudonymous participant.
  - speaker: Bitter Lemon
    timestamp: 04:16:07/10-21-55
    assertion: Criticizes the source commentator's framing of Chico's putative ecological
      causes and questions the sincerity of that premise.
    certainty: Rhetorical disagreement.
  - speaker: Trap Man
    timestamp: 03:33:31/10-27-55
    assertion: Recounts a 2052 Fort Pierce incident in Florida concerning a Saeder-Krupp
      train, corporate water-development operations, public environmental protests,
      track sabotage, fatalities and injuries. Describes a planted identifying message
      purporting to implicate a radical environmental faction, an inquiry into local
      activists that led to detention but no charges, an alternative claim that the
      corporation benefited by suppressing criticism of its project, and an insurer
      payment by Cord Mutual to the employer after employee losses.
    certainty: Long-form forum anecdote and interpretation; the author expressly says
      they do not know whether the insurer was complicit.
  attribution_rule: Pseudonymous forum comments are claims, not independently confirmed
