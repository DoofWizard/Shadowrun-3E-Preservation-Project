data:
  subject: Shella
  source_anchors:
  - printed_page: 87
    pdf_page: 96
    heading: Hooks
  - printed_page: 88
    pdf_page: 97
    heading: Notes
  supernatural_identity:
    classification_as_printed: Spectral wendigo
    source_description: The gamemaster-facing narrative calls it a personification
      of cruel winter winds and describes a supernatural possessing entity.
    scope: Fictional entity in the historical Second Edition setting, not a real-world
      supernatural assertion.
  host_relationship:
    named_host: Corey Martin
    first_encounter:
      date_as_given: February 2053
      host_age_as_given: 15
      circumstances: Corey traveled away from home on a motorcycle, became stranded
        in cold terrain west of Portsmouth after the motorcycle failed, and attempted
        to survive the freezing night outdoors.
      entity_action: The shella entered Corey as he became severely chilled and near
        death, supplying supernatural power and preserving his life.
      source_status: Narrator assertion in the Hooks section, not merely an in-world
        forum allegation.
    influence: The spirit uses Corey as a host, imposes powerful feeding urges, and
      draws sustenance from the deaths of people.
    host_and_spirit_agency:
    - Corey and the shella are distinct agents rather than interchangeable identities.
    - During possession the host can fail to recognize danger or a need to abandon
      pursuit, while the spirit stays aware and can leave the host if needed.
    - The spirit may leave and seek another host; its strength outside a host is limited.
    - The source does not describe possession as permanent or continuously active.
    lunar_pattern:
      full_moon: The narrative describes strongest control by the shella, leaving
        Corey unable to resist possession.
      new_moon: The spirit's ability to enter Corey is reduced or temporarily absent.
      mechanical_numbers: Exact lunar intervals, game tests, modifiers, power list,
        and banishment Force are in the linked source-reviewed rule record; they must
        not be replaced with inferred later-edition equivalents.
  present_context_at_source_date:
    location: North-side Detroit squat among other itinerant orks and trolls.
    resources: Very little money and a used automobile; the book attributes the money
      to prior victims.
    host_demeanor: Corey is portrayed as slight, nondescript and withdrawn while his
      eyes unsettle observers.
    ethical_scope: The narrative depicts killings and supernatural predation; these
      are fictional setting events, not an endorsement or practical guidance.
    possible_story_outcomes: Gamemaster hooks posit that player characters might encounter
      him, seek to help him separate from the spirit, or experience a dangerous encounter;
      these are hypothetical adventures, not established later chronology.
  separate_rules_records:
  - rules/prime-runners/corey-martin-possession-stats-p87-88.yml
  - rules/prime-runners/corey-martin-stats-p87-88.yml
  attribution_boundary:
    source_narrator: The supernatural identity, possession, first encounter and present-state
      descriptions come from gamemaster-facing Hooks/Notes.
    distinct_discussion: In-world posts debating Corey's psychology, whereabouts and
      alleged crimes remain attributed speculation and are not promoted into narrator
      facts here.
