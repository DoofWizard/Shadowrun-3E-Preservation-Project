data:
  subject: Hoodlum Priest
  form: In-world forum claims distinguished from the narrator's description and historical
    game mechanics.
  posts:
  - speaker: The Granite Butcher
    timestamp: 19:32:41/10-11-55
    printed_page: 36
    claims:
    - Testifies that the Priest brings hope and spiritual salvation to distressed
      residents, with children especially expressing renewed hope in their community.
    certainty: Devotional endorsement, not independently verified supernatural effect.
  - speaker: Cronkite
    timestamp: 16:44:30/10-15-55
    printed_page: 36
    claims:
    - Challenges the positive account, saying followers continue to conduct raids
      and cause deaths among the people they profess to help.
    certainty: Accusation by speaker, not a confirmed finding of particular responsibility.
  - speaker: Gnasher
    timestamp: 02:12:50/11-01-55
    printed_page: 36
    claims:
    - Says many followers formerly belonged to the Murphy's Law gang, but contends
      that the Priest has established an effective community service for impoverished
      Noose residents.
    - Contrasts the new organization with the counterfactual fate of a couple of hundred
      street children who, Gnasher believes, might otherwise have starved or been
      abducted for an organ market. The speaker credits the Priest with preventing
      that outcome; no such outcome is claimed to have occurred to those children.
    - Distinguishes the Priest from an ordinary organized-crime subordinate and speculates
      that removing the current faction could change Chicago's balance of power.
    certainty: Speaker's local-history account, comparison and counterfactual speculation.
  - speaker: The Benedictine Burner
    timestamp: 00:34:07/11-05-55
    printed_page: 37
    claims:
    - Says no known church ordained the Priest, but asserts that he nevertheless displays
      an unusual form of power.
    certainty: Speaker's personal assertion and acknowledgment of incomplete knowledge
      of church ordination.
