data:
  publication:
    title: Prime Runners
    publisher: FASA Corporation
    catalog_id: FASA7116
    year: 1994
    game_edition: Shadowrun Second Edition
    printed_page: 80
    pdf_page: 89
  printed_profile:
    header_name: Mary Jo Doonan
    source_role_label: Terrorist
    birth_date: August 21, 2023
    birthplace: Lafayette, Louisiana
    nationality_metatype_gender_as_printed: CAS/Caucasian Human/Female
    current_residence: Unknown; rumored New Orleans, CAS
    height_cm: 180
    weight_kg: 59
    hair: Light brown
    eyes: Green
    identifying_features: Small round scar on left temple; tips of last two fingers
      missing on right hand
    psychology_traits_as_printed: Cold, detached, ruthless, borderline sociopath,
      paranoid
    psychology_motivation_as_printed: Unable to analyze, but definitely complex
    lifestyle: Unknown
  source_narrator_history:
    career_context: The fictional source narrator describes Doonan as an American
      intelligence-service field operative trained for covert assignments, and reports
      the agency's expectation that operatives eventually move to less sensitive duties.
    final_cia_mission:
      location: Back bedroom at the Beirut Imperial
      other_people: Three high-ranking members of the British diplomatic corps
      disputed_source_event: The source narrator states that Doonan shot the three
        diplomats in the backs of their heads, killing them during her assignment;
        this is a fictional-world narrator assertion, not an independently verified
        real event.
      materials_taken: An experimental suitcase of BTLs and an attache case of blueprints
        for a new prototype attack aircraft
      disappearance: The narrator says Doonan disappeared that night with both items.
      subsequent_sale: The narrator reports that the BTLs were sold in Italy; the
        ultimate fate of the blueprints is not stated.
      narrator_explanation: The narrator speculates she tired of increasingly unaccountable
        assignments, rather than establishing a proved motive.
    observed_and_unobserved_periods:
    - event: The CIA next sighted Doonan in Zurich in late 2049.
      certainty: Reported sighting in the source narrator account.
    - event: The CIA next sighted her in Honduras during 2050.
      certainty: Reported sighting in the source narrator account.
    - event: Her trail then went cold for four years; the narrator supposes the agency
        put her file aside.
      certainty: Four-year gap reported; agency handling is inference.
    - event: She is believed to have returned via South America to Louisiana, possibly
        operating from swampland around Vermilion Lake or Six Mile Bay.
      certainty: Source narrator belief and possible locality, not a confirmed residence.
    subsequent_activity:
      smuggling: The narrator reports that Doonan has been moving illicit chips, prohibited
        weapons and drugs into the CAS.
      methods: The source says she employs varied methods, vehicles and names.
      named_aliases:
      - Dawn McMurty
      - Reba Nelson
      purported_goal: Outside observers believe she is seeking enough money to elude
        security agencies permanently; the source does not establish her private intention.
    late_2052_media_episode: The source narrator reports a trid offer to the New York
      Times and subsequent publication restraint; detailed rights and custody chronology
      is retained in world/prime-runners/mary-jo-doonan-media-rights-p80.yml.
    skills_and_pursuit: The narrator describes Doonan as highly trained in weapons
      and covert activities, willing to conduct killings without apparent emotional
      attachment, and able to evade detection for years; it reports that the CIA is
      again trying to locate her.
  editorial_evidence_boundaries:
  - The header's role label and psychological descriptors belong to a fictional tabletop
    RPG character panel, not to a living person.
  - Beirut assignment, killings, theft, movement and agency pursuit are narrator-presented
    setting facts; Doonan's motive, presumed route, rumored location and observers'
    beliefs have weaker stated certainty.
  - The first-person in-world dated Ernie forum claim on this page is preserved separately
    under attributed_claim and must not be treated as narrator-confirmed.
  - Exact equipment and rules for printed pages 81-82 remain in rules/prime-runners/mary-jo-doonan-stats-p81-82.yml;
    no unprinted mechanics or SR3 supersession is asserted.
