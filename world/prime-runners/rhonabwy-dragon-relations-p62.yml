data:
  provenance:
    printed_heading: Rhonabwy (Welsh Great Dragon)
    printed_page: 62
    pdf_page: 63
    narrator_scope: Historical fictional-source narrator with explicitly marked reported
      myths, assessments, and uncertain names; not an omniscient statement about real
      beings.
  contemporary_dragon_relationships:
    celedyr:
      name: Celedyr
      narrative_relationship: Rhonabwy is curious about and distrustful of this dragon.
      setting: Celedyr is said to have his lair southeast of Rhonabwy's region, behind
        a high-technology installation and a contingent of Rastafarians at Caerleon.
    dunkelzahn:
      name: Dunkelzahn
      attributed_view: The narrator says Rhonabwy considers Dunkelzahn a poseur of
        no consequence; this is the fictional dragon's alleged private assessment,
        not objective truth.
    lofwyr:
      name: Lofwyr
      attributed_view: The narrator says Rhonabwy regards Lofwyr with something approaching
        fear, without claiming that their relations are confirmed to be hostile.
    direct_contacts:
      scope: The narrator explicitly states that Rhonabwy has had no direct dealings
        with any of the three other dragons named above.
  cardigan_bay_sea_dragon_legend:
    counterpart:
      designation: Sea Dragon of Cardigan Bay
      name: Unknown to the source's speakers
      gender: Unknown; the source explicitly says no one knows the dragon's name or
        gender.
    rumor: A recurring myth claims Rhonabwy and the Sea Dragon were locked in an eternal
      magical struggle for eons before the emergence of the Sixth World.
    interpretation: Some in-world storytellers connect the two with dragons in Arthurian
      myth.
    certainty: The narrator explicitly says Rhonabwy has never confirmed, denied,
      or even hinted at the truth or falsity of the tale.
  source_boundaries:
    mechanics: Historical dragon statistics are separately indexed in rules/prime-runners/rhonabwy-dragon-stats-p62-63.yml.
    campaign_hooks: Separately indexed in references/prime-runners/rhonabwy-dragon-hooks-p62-63.yml.
    editorial_status: These are in-universe relationship descriptions and rumors in
      a published tabletop game; they are not claims about actual living individuals
      or a literal supernatural dispute.
