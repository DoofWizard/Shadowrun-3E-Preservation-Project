  identity_as_printed:
    name: Peter James Self
    born: February 5, 2026
    birthplace: Cleveland, UCAS
    nationality_metatype_gender: UCAS/Caucasian Human/Male
    residence: Seattle
    height_cm: 185
    weight_kg: 69
    hair: Black, long, worn in a ponytail
    eyes: Brown-green
    distinctive_physical_features: Cadaverous appearance, handsome, chain-smoker
    narrator_personality_labels: Voyeuristic; possibly idealistic; perhaps a disappointed
      romantic
    motivations_as_printed: Writing
    lifestyle: Medium
  published_work_and_reception:
    first_novel:
      title: Rage Turned Within
      year: 2052
      reception: Developed a cult following among European student circles.
    breakthrough_novel:
      title: The Privacy of Nobodies
      publisher: Random-Viking
      publication_date: Late 2053
      reception: The narrator says literary tastemakers praised and debated the novel
        while tabloids and critics also made it controversial.
      fictional_subject: One day among homeless and marginalized people in Milan,
        including people struggling with addiction, survival sex and self-injury;
        these are characters inside Self's fictional novel, not independent gameworld
        assertions about identifiable real people.
      style_and_criticism: The novel combines philosophical digression with close
        depictions of inner lives; admirers valued its psychological insight while
        detractors called its reasoning overwrought.
  personal_and_professional_history:
    education: The narrator reports Self was expelled from an Ivy League college after
      drug sales and affairs involving professors' spouses.
    european_studies: He later lived in Europe for several years, including study
      of cyber-psychoanalysis at the Sorbonne with Francoise Lacan and neurology in
      Rome.
    relationships: The narrator reports romantic involvement with Francoise Lacan
      and later a Russian ballerina who subsequently died by suicide; the text does
      not establish that Self caused her death.
    treatment: After the latter loss he spent three months in therapeutic care for
      transient traumatic psychosis, according to the fictional narrator.
    upcoming_work: He is working on a trid screenplay adaptation of Nobodies and a
      third book whose provisional title is withheld by his publishers.
    professional_concerns: His publishers worry about a self-destructive pattern,
      his frequent time among Seattle's marginalized residents and his exposure to
      dangerous fictional corporate circles; these are their fears about potential
      events, not events established to have occurred.
