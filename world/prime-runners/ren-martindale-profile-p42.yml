data:
  provenance:
    printed_heading: Ren Martindale (Media Jock)
    printed_page: 42
    pdf_page: 43
    source_voice: Historical fictional sourcebook narrator and identity panel, not
      the signed in-world forum posts on pp42-43 or optional gamemaster hooks and
      exact statistics on p43.
  identity_as_printed:
    name: Ren Martindale
    birth_date: December 31, 2019
    birthplace: Dark Harbor, Maine, UCAS
    nationality_metatype_gender: UCAS/Caucasian Human/Male
    current_residence: Boston, UCAS
    height_cm: 178
    weight_kg: 100
    hair: Brown
    eyes: Blue
    identifying_physical_features:
    - Pock-marked cheeks
    - Limp in left leg
    - Severe scarring up left side
    - Bullet scars on right side, right shoulder and left buttock
    printed_personality_traits:
    - Reliable
    - Honest
    - Trustworthy
    - Determined
    - Sociable
    printed_motivations: Investigating; sensation-seeking
    lifestyle: Middle
  television_program:
    schedule: Thursday nights, 10 PM to midnight
    co_worker: Alfie Gash, the sturdy dwarf camera operator associated with Martindale's
      investigations.
    home_studio: Boston-based, NBS-affiliated trid station.
    distribution: The narrator says the show was licensed to more than 128 outlets,
      mainly known along the eastern seaboard and farther afield.
    opening: A recurring staged teaser in a rain-streaked alley followed by a preview
      of the night's investigation; this is television presentation, not a real occurrence
      of the alleged wrongdoing.
    live_status: Some shows are recorded in advance, while most are described as broadcast
      live.
    topics: Sensationalistic investigations of crimes, scandals involving sex or celebrities,
      alleged misdeeds by powerful corporations and street-level swindles.
    reception: Narrator depicts the show as capable of unusually intense, personally
      committed coverage but also uneven in quality and susceptible to sensationalism.
  public_contests_and_limits:
    libel_counts_as_reported:
      upheld: 14
      not_proved: 2
      source_scope: The narrator's reported current score of on-screen accusations
        resulting in libel proceedings; not a public legal docket or all completed
        investigations.
    public_manner: Martindale sometimes acts like a one-person judge and jury while
      discussing the accused, according to the narrator, with potentially serious
      consequences.
    perspective: The book narrator says his instincts have proved reliable on many
      occasions but that he sometimes sees conspiracies where none may exist.
    political_episode: An investigation involving two local UCAS senators the previous
      June reportedly led his producers to bar further stories about senior political
      figures; this describes an internal television restriction, not an adjudicated
      finding against those senators.
  private_interests:
    recreation: Experienced sailor and game fisherman.
    boat: Night Spray
    residence_since_divorce: He has lived aboard the Night Spray for roughly half
      a decade following his divorce.
    mooring: Usually Port Norfolk or Dorchester.
    social_reputation: Narrator describes Martindale as a hard-drinking loner despite
      the sociable printed trait list.
  separate_content_classes:
    historical_stats: rules/prime-runners/ren-martindale-stats-p42-43.yml
    speaker_attributed_posts: world/prime-runners/ren-martindale-forum-p42-43.yml
    optional_gamemaster_hooks: references/prime-runners/ren-martindale-guidance-p43.yml
    camera_operator_cross_reference: Alfie Gash, profiled in the following section.
  source_boundary: All names, dates, newsroom activities, institutions, allegations
    and numerical claims belong to the published 1994 fictional tabletop RPG, not
    to actual broadcasters, viewers or legal cases.
