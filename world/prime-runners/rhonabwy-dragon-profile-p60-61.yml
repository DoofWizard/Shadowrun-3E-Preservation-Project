  book_narrator_claims:
    first_public_appearance:
      date: February 22, 2012
      place: Outside Caerfyrddin (Carmarthen), western Wales
      event: Rhonabwy emerged from a subterranean lair, creating a large crater and destroying hundreds
        of buildings. The narrator reports more than 150 deaths caused by this emergence.
      public_response: A rare public bulletin from Rhonabwy expressed considerable regret and said he
        was suffering post-hibernation trauma.
      reparations: Over subsequent years he paid substantial nuyen toward rebuilding the eastern sections
        of the affected town.
    new_lair_and_neighbors:
      location: Outside Llandovery, Wales
      time_relative_to_emergence: One week after the Carmarthen incident, the dragon issued the Llandovery
        ultimatum; he then spent about two months leveling the cleared land and began tunneling.
      relocation_demand: Everyone living within a five-mile radius was ordered to leave permanently within
        72 hours; almost all complied.
      later_arrangement: He occupies an extensive underground residence beneath Llandovery; he paid double
        value for property and possessions appropriated, which partly placated local residents.
      guardians: Nature spirits are described as patrolling his territory and deterring hostile critters
        from adjacent farms and fringe settlements.
    wealth_and_technology:
      unverified_gold_deposit: A popular belief is that Rhonabwy dug more than three miles underground
        and found an enormous cache of gold; the narrator does not establish this as true.
      investments: He invested an undisclosed fraction of his wealth through HKB and GA financial corporations
        and Swiss banking institutions. Holding companies conceal exact ownership.
      attributed_financial_analysis:
        ares_stock_percent: 4
        shiawase_stock_percent: 6 to 7
        other_corporations: Approximately 10 percent of each of at least 30 midsized European corporations;
          analysis, not ownership audit.
      early_advisers: Shortly after his Awakening, he obtained financial advice from HKB and other entities
        and quickly learned finance.
      media_and_secrecy: His subterranean residence has modern media-network systems, frequently refreshed;
        he monitors wide-ranging business reporting while concealing his particular holdings.
    welsh_alliances:
      artisans: Rumor, rather than narrator-confirmed fact, says artisans and workers from Snowdonia and
        Gwynedd are assisting excavations.
      countess_and_elves: Those rumors suggest an alliance with the Countess of Harlech and secessionist
        elves of northern Wales.
      orichalcum: Sources described as reliable report he helped the Countess locate orichalcum and helped
        elves restore magic to their lands, but this remains a rumor.
      advisers_and_couriers: Financial advisers visit his Welsh territory, but visiting couriers seldom
        disclose meeting details.
      unverified_neural_implant: Word among observers is that couriers carry neural implants preventing
        them from discussing the dragon’s deals unless the implants are deactivated by a complex sound-and-visual
        code; the source states this as hearsay, not independently verified technology, and offers no
        game procedure.
    political_characterization:
      authorial_distinction: The narrator says Rhonabwy often opposes powerful elven elites or restrictive
        political control, but explicitly warns against reading this as universal hostility toward elves.
      tir_na_nog: The narrator says his financial support has reached non-elven Protestant paramilitary
        factions in Tir na nÓg.
      tir_tairngire: His financing supports factions opposing the current Council of Princes; he is also
        described as deeply suspicious of Lofwyr.
      zulu_nation: The narrator describes fictional arms and logistical support for some Swazi bandit
        groups at the Zulu Nation border, while acknowledging broadly positive relations between elves
        and other metahumans there have limited his actions.
      northern_wales: He generally supports elven secessionist groups in northern Wales.
      other_metahumans: He may support groups of other metahumans even against metahuman rulers when he
        regards the authorities as totalitarian.
      scope_and_limits: He may even accept elven government when he does not object to its political form;
        the narrator characterizes his influence campaigns as political, not purely anti-elf.
    business_interventions:
      strategies_attributed_to_dragon: In the fictional setting the narrator says he uses market and political
        pressure, including stock sell-offs, financing local terrorist activity and action against local
        corporate executives, to loosen a large corporation’s hold on a relatively small country. These
        are descriptive source claims, not player or real-world directions.
      limited_scope: The narrator expressly says even Rhonabwy cannot use those methods everywhere; the
        targeted country must be relatively small.
      example: The book suggests considering Aztechnology’s unsuccessful involvement in some areas of
        the Caribbean League.
    intermediaries_and_long_reach:
      reciprocal_secrecy: Rhonabwy and antagonists normally deal indirectly through intermediaries.
      envoys: The narrator describes allies, guardians and free spirits, including a personal envoy acting
        as Johnson, as contacts for shadowrunners.
      opposed_runner_teams: He is said to hire separate runner teams for mutually opposed aims, sometimes
        having one group attack a location and another defend it, thus exposing the defense’s capabilities
        through the conflict.
      geographic_scope: His plans are not confined to Wales and can reach regions including Aztlan, Tir
        Tairngire and the Caribbean.
      face_to_face_access: The narrator states only around a dozen mortals have met Rhonabwy in person
        since the Awakening; even trusted corporate advisers frequently use trid connections rather than
        personal contact.
