    claim: Briefly expresses hope that someone knows Teachdiare’s motives; does not
      claim to know them.
  - speaker: Name deleted by request
    posted: 23:17:32/08-30-55
    printed_page: 89
    pdf_page: 98
    claim: Claims participation in an Atlanta assignment involving an Aztechnology
      liaison seeking recruits from competing corporations, with the commenter’s group
      providing logistical support. Describes Teachdiare as extraordinarily fast,
      quiet and not sounding Irish in the encounter. Says a mage in the group attempted
      to read Teachdiare’s aura but abandoned the attempt; the speaker reports that
      Teachdiare departed before the group could react. The speaker did not personally
      verify his identity beyond the assignment.
  - speaker: Siegfeld
    posted: 20:16:37/09-01-55
    printed_page: 90
    pdf_page: 99
    claim: Alleges that Teachdiare has contacts within Irish communities in Massachusetts
      and values whether a commission appeals to him more than the fee offered. This
      is an in-world commenter’s assertion, not endorsed real-world guidance.
  - speaker: Doktor Freeman
    posted: 17:11:15/09-05-55
    printed_page: 90
    pdf_page: 99
    claim: Offers a terse warning that those who cross Teachdiare will be killed;
      predictive opinion, not a confirmed event.
