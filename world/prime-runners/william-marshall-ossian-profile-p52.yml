data:
  character: William Marshall Ossian
  profession: Rock Star
  nicknames:
  - Billy Ossian
  - Oz-man
  printed_identity:
    date_of_birth: May 1, 2029
    birthplace: Monmouth, Tír Tairngire
    nationality_metatype_gender: Tír Tairngire / Caucasian Elf / Male
    current_residence: Necanicum, Tír Tairngire
    height_cm: 183
    weight_kg: 73
    hair: White, often dyed
    eyes: True eye color unknown; always wears silver corneal shields
    distinctive_features:
    - Multicolored angel tattoo down right side of face
    - Black leather jacket with painted angel wings on back
    psychology:
      traits: Unknown
      motivation: Unknown
    lifestyle: High, with resources for Luxury
  narrator_account:
    band: Anhedonia
    leadership: Ossian is the band's frontman and principal creative and marketing
      influence
    origin_and_growth: Anhedonia rose from an obscure Portland club to major attention
      on the West Coast rock scene, attracting many disaffected suburban-mall youth
    musical_character: Blends electronic hardness and noise with melancholic, nearly
      Celtic folk-influenced melodies; source compares the result with experimental
      music emerging in Tír Tairngire
    public_image_vs_business: Portrays a flashy, apparently empty-headed showman but
      is described by narrator as extremely sharp and intensely involved in decisions
      about his career
    purported_long_term_plan:
      assertion: A rumor claims Ossian and manager Edwin Pound planned a nine-year
        strategy before the group formed
      certainty: Source marks the nine-year planning story as rumor, not established
        history
    management:
      manager: Edwin Pound
      manager_prior_background: Trid production licensing, described as shadowy
      funding: Narrator credits Pound with providing seed money for Anhedonia and
        the band's recording and marketing company
      division_of_roles: Pound expertly manages finances while Ossian supplies the
        creative and marketing ideas
    recording_label: Chrome Damage
    developments:
    - Ossian's house at the edge of Clatsop Forest northwest of Portland now contains
      his recording studio
    - Chrome Damage has signed several new performers, whose future recordings are
      planned under the label
    clubs:
      management_company: Chrome Wall
      ownership: Narrator says Ossian and Pound jointly own both clubs through Chrome
        Wall; trusted managers operate them
      venues:
      - name: Chrome Rat
        location: Salem
      - name: Chrome Stallion
        location: San Francisco
      purpose: Clubs have promoted Anhedonia's music and are expected to promote new
        label signings
  separation_of_source_voices:
    narrator: The biography's statements are period narrator claims rather than guaranteed
      future outcomes
    attributed_forum: The two posts following the biography on printed page 52 are
      DJ Jeff's music/collaborator discussion and Nazir's unverified financial allegation;
      not included as established facts
    later_forum: Further forum posts on printed page 53 dispute financial backing
      and a reported death; not treated as confirmed facts here
    separate_mechanics: Original printed page 53/PDF 54 gives character stats, skills,
      cyberware, equipment and an elven Low-Light Vision note; do not conflate those
      mechanics with the biography
framing: newsroom_neutral
headline: William Marshall Ossian — source-period biography and Chrome Damage business
  relationships
summary: Narrator-sourced historical Second Edition portrait of Ossian, Anhedonia,
  Edwin Pound, Chrome Damage and Chrome Wall, with a stated rumor kept attributed.
