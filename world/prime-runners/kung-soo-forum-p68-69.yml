data:
  subject: Kung Soo, also referred to as Grandfather Soo, fictional London-based Tong leader
  source_format: Five signed fictional discussion-board comments in original print order,
    with Mallin's p68 comment continuing at the top of p69
  comments:
  - speaker: Chung
    timestamp_as_printed: 20:49:18/10-4-55
    original_page: {printed: 68, pdf: 77}
    assessment: Asserts Kung Soo was born in the Year of the Rat and applies the poster's
      astrological personality generalizations about people born under that sign.
      Chung associates Rat-born people with charm, self-control, underlying temper,
      ambition, integrity and persistent effort, and claims Soo shows these traits.
    epistemic_status: Speaker's subjective astrological explanation, not narrator-established
      psychology, proof of motives or a rules-bearing metatype trait
  - speaker: Mallin
    timestamp_as_printed: 00:08:41/10-7-55
    original_pages:
    - {printed: 68, pdf: 77}
    - {printed: 69, pdf: 78}
    position: Opinion urging caution about an invitation from Grandfather Soo
    assessment: Says an invitation to the Temple of the East should be treated seriously.
      Speculates it may be meant to persuade visitors to abandon activity that attracted
      Soo's attention, or to recruit them for something special. Frames attending as
      accepting consequences or rewards; avoiding it may require leaving the country
      or facing threatening enforcers, according to the poster.
    epistemic_status: In-world warning and hypothetical choices, not an established
      sequence or an instruction for real-world conduct
  - speaker: Sister Ray
    timestamp_as_printed: 00:34:14/10-13-55
    original_page: {printed: 69, pdf: 78}
    position: Warning against confrontation at the Temple of the East
    assessment: Claims attempts to penetrate the Temple's security have ended badly
      for intruders. Says Kung Soo has agents throughout central London's Overground
      and can be contacted indirectly by trusted intermediaries; warns that hostile
      approaches may bring forceful retaliation, including from descendants.
      Contrasts his Year-of-the-Rat label with her characterization of him as a tiger.
    epistemic_status: Poster allegations and rhetorical warning; no confirmed death
      counts, source narrator verdict or universal protection mechanic
  - speaker: Kirin
    timestamp_as_printed: 04:50:28/10-26-55
    original_page: {printed: 69, pdf: 78}
    position: Claimed explanatory outline of a fictional London Tong hierarchy
    claims:
      rank_families:
      - source_name: Hung Kwan
        translated_title: Red Pole
        claimed_role: Leader of fighters, described by the poster as directing violent
          enforcement, punishment and extortion; calls this an elder-brother role.
        fingers_as_alleged_in_world_sign: First two fingers out; ring and little fingers in.
        rank_number_as_alleged: 426
      - source_name: Pak Tsz Sin
        translated_title: White Paper Fan
        claimed_role: Administrator and planner, including the organization's criminal
          and apparently legitimate functions; second-brother role.
        fingers_as_alleged_in_world_sign: Index finger in; other three fingers out.
        alternative_rank_numbers_as_alleged: [415, 451]
      - source_name: Cho Hai
        translated_title: Grass Sandal
        claimed_role: Intermediary or liaison between outsiders and the organization;
          youngest-brother role.
        fingers_as_alleged_in_world_sign: First three fingers out; little finger in.
        rank_number_as_alleged: 432
      - source_name: Sze Kau
        translated_title: Blue Lantern
        claimed_role: Rank-and-file member with possible duties as fighter, dealer,
          transporter, shopworker or servant.
        fingers_as_alleged_in_world_sign: All four fingers out.
        rank_number_as_alleged: 49
      leadership_and_numerals:
        stated_numeral_convention: The poster says rank numbers are often led by 4.
        dragon_head: Grandfather Soo
        dragon_head_rank_number_as_alleged: 489
        variation: The speaker notes some fictional families vary these titles and
          numbers and says additional combinations exist beyond the short list.
    epistemic_status: Kirin's purported source-specific account of an invented
      Shadowrun-era organization, not independently verified real-world gang practice,
      player instructions, universal setting mechanics or confirmed identity tests
  - speaker: Tan
    timestamp_as_printed: 11:03:10/10-26-55
    original_page: {printed: 69, pdf: 78}
    position: Ominous warning in response to Kirin's disclosure
    assessment: States that the penalty for revealing the organization's secrets
      is death and follows with an image of a long night and a sharp blade.
    epistemic_status: Threatening in-world speaker warning, not narrator-certified
      consequences or a real-world recommendation
  epistemic_separation:
    narrator_account: Kung Soo's fictional identity, London chronology and business
      history on printed p68 are separately maintained as historical narrator facts.
    game_master_scenarios: Potential hospitality, paid contracts and intimidation
      are optional GM hooks and not already-established outcomes of these five comments.
    detailed_mechanics: Attribute values, Initiative, combat/threat ratings, bioware
      and cyberware, equipment, and exceptions are preserved as historical Second
      Edition rules in the separate rules/prime-runners/kung-soo-stats-p68-69.yml.
    source_roles: Claims about clan titles, hand gestures and rank numbers belong
      to Kirin, a fictional in-world poster; do not promote these as independently
      authenticated universal rules or facts about present-day organizations.
