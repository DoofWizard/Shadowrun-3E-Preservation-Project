  family_and_institution:
    family_firm: Microdeck Industries, a computer-software firm controlled by six
      generations of the Gates family, is described as a leading software publisher.
    father: Brian W. Gates III, chairman of Microdeck Industries and one of its powerful
      senior figures.
    mother: Deborah, identified as Brian W. Gates III’s wife and one of the research
      department’s chief Matrix programmers. This passage does not print a surname
      for her.
    uncle: Jeff R. Gates, younger brother of Brian W. Gates III, directs the Microdeck
      research department.
    age_in_source: The narrator identifies Alexander as the couple’s eleven-year-old
      son.
    research_context: Microdeck’s research group explores advanced programming and
      Matrix construction; its work serves as the institutional setting for Alex’s
      unusual capabilities.
    source_ranking_caveat: Page 24 explicitly identifies Brian as chairman and father.
      Page 25 calls Alex the child of the second most powerful man at Microdeck, without
      naming that man in that sentence. Retain both statements; do not substitute
      his uncle or invent a reconciliation.
  development_and_experience:
    first_matrix_experience: At age three months, Alex used the Matrix in a carefully
      controlled test of infant-oriented virtual playroom software.
    education: Most standard schooling has come through computer-based tutorials.
      The narrator considers his conventional education weak relative to his extraordinary
      Matrix fluency.
    personal_environment: He initially explored Microdeck’s internal Matrix, then
      other Matrix locations as his confidence developed; the Matrix became a natural
      experiential environment for him.
    virtual_play_space: His den is in a dim part of Microdeck’s Matrix. To those lacking
      full access it is only a workstation; at progressively lower levels it is a
      playroom containing abandoned games, toys and unidentified objects. His digital
      friends began as animated toys and evolved into limited-level AI simulations
      with defined personalities and behavior patterns; they retain teddy-bear, rabbit
      and train forms.
    abilities_as_described: The book portrays Alex as unusually able to navigate and
      respond intuitively to Matrix environments and access information in ways that
      standard software procedures do not fully anticipate; these are setting descriptions,
      not new numerical game rules.
    understanding_of_privacy: His curiosity takes him into secure Matrix datastores,
      but the narrator says he is almost always disappointed to find adult secrets
      that do not interest him. Hooks separately illustrate his childlike priorities
      and lack of adult concern for the protected data.
    future_company_interest: As Alex grows older, Microdeck is beginning to take a
      professional interest in his talents and anticipates assigning research activity
      framed as play and schooling. This is a prospective plan, not a source-confirmed
      adult career.
    offline_social_limitations: Although adept in the Matrix, Alex has serious difficulty
      relating to physical streets, shops, open spaces and people; the text presents
      him as an unusual, socially inexperienced child rather than an ordinary adult
      professional.
    parental_protection: The Hooks predict the powerful corporate father’s strong
      objection if someone interferes with his son and with a research investment
      that has cost Microdeck a tremendous amount. This is a predicted reaction, not
      an established confrontation.
  attribution_and_rules_boundary:
    narrator_facts: The character-profile and main biography establish parentage,
      age, development and described abilities within the historical fictional setting.
    forum_claims: Speculation about future Matrix-literate generations and unconsented
      corporate experimentation belongs to named forum speakers on pages 24-25; it
      is not incorporated as confirmed history.
    rules: Exact historical statistics, programs, cyberware, and cumulative Hacking
      Pool bonuses from page 25 are preserved in existing mechanical records; no edition
      conversion is implied.
    hypotheticals: Hooks suggest possible assistance to runners and complications
      from his curiosity; those are proposed scenario outcomes, not established past
      events.
