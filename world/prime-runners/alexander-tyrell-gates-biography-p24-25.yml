headline: 'Fictional Shadowrun Second Edition character: Alexander Tyrell Gates (Prime
  Runners, FASA7116, pp24-25)'
summary: Archival biography of the invented child decker in FASA's 1994 Shadowrun
  tabletop RPG supplement Prime Runners. Printed pp24-25/PDF pp25-26; not a real child’s
  dossier. Original fictional parentage, source uncertainties, development and digital
  surroundings are preserved; historical game statistics and attributed forum claims
  remain separately linked.
