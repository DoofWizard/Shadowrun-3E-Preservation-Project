  person:
    printed_name: Richard Petrosian
    designation: Scientist
    birth_date: June 15, 2007
    birthplace: Kiev, Ukraine
    nationality_metatype_gender_as_printed: "Ukrainian/Caucasian; Human/Male"
    ancestry_as_described_by_narrator: "Part Ukrainian, part Russian, and part Turkish"
    current_residence: Unknown
    height_cm: 175
    weight_kg: 79
    hair: "Black, short, very curly"
    eyes: Brown
    distinguishing_features:
      - "Deep nicotine stains on the index and second fingers of the left hand"
      - "Heavy limp when walking"
    psychological_traits_as_printed:
      - Obsessive-compulsive
      - Intense spider phobia
      - Depressive temperament
    motivations_as_printed:
      - Scientific research
      - Revenge
    lifestyle: Currently unknown
  scientist_career:
    employer: Bioenergetica Ukraine (BU)
    defection: "The book's narrator states that Petrosian defected in spring 2055."
    work: "He researched tactical computers; the narrator calls the work reportedly brilliant."
    publication: "The narrator states that his theoretical paper in the April 2053 International Journal of Neurotechnology established foundations for a new approach to tactical implants."
    research_practice: "The narrator says he worked almost entirely alone, trusted no one with hard-copy or computer records, and retained his research in memory."
    social_assessment: "The narrator depicts him as contemptuous of what he regarded as others' lesser intelligence, with few friends back in Ukraine."
    related_periodical_record: world/prime-runners/international-journal-neurotechnology-p56.yml
  spouse_and_bu:
    spouse: "The narrator identifies his wife as Turkish; her personal name is not supplied."
    motive_for_defection: "The narrator attributes Petrosian's defection to BU having killed his wife."
    allegation_about_wife: "An in-world story alleges BU discovered that she was a sleeper agent of a foreign organization; the narrator explicitly says that allegation remains speculative."
    bu_decision_in_narrator_account: "The account says BU suspected Petrosian would reject its evidence and react aggressively, so it did not confront him."
    death_in_narrator_account: "Instead, the narrator states that BU arranged her death in a motor-vehicle incident presented as an accident."
    discovery_unknown: "The narrator explicitly says it is unknown how Petrosian learned of the incident's alleged orchestration."
  flight_and_search:
    abilities_assessment: "His actions suggest greater street skills than the narrator expected from his academic background."
    unverified_route_reports: "Reports claim he fled to émigré White Russian groups in Paris and then to a similar group in London; the narrator notes that Petrosian himself is not purely Russian."
    predicted_aid: "The narrator expects those groups would assist a person fleeing Ukraine, without establishing a documented act of assistance."
    whereabouts: "His current whereabouts are unknown in the source."
    izmir_report: "An explicitly unconfirmed report claims he works as a street doctor in the back streets of Izmir."
    family_possibility: "The narrator suggests he may seek his late wife's family to assist his effort to avenge her."
    rumored_officially_disavowed_reward:
      organization: Bioenergetica Ukraine
      amount_nuyen: 250000
      condition: "Petrosian returned alive"
      source_certainty: "The narrator says BU is unofficially offering this reward; the payment is not independently demonstrated."
    separate_speaker_claim: "Collector's distinct claim about 100000 nuyen for his body and intact internal memory is in world/prime-runners/richard-petrosian-forum-p56-57.yml, not a narrator-established reward."
  page_relation:
