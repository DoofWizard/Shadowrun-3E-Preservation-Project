  posts_in_printed_order:
  - speaker: Watcher
    posted: 07:03:36/09-16-55
    printed_page: 48
    pdf_page: 49
    claim: Sarcastically claims BBC programming about Muller is motivated by unflattering
      treatment of France.
    certainty: Speaker opinion, not narrator fact.
  - speaker: Carol K
    posted: 23:17:31/09-19-55
    printed_page: 48
    pdf_page: 49
    claim: Rebuts Watcher with the account that a Muller documentary on British Lake
      District orks embarrassed the British government and helped secure development
      funds from a regional aid program, after local activists had worked for approximately
      twenty years.
    certainty: In-world poster testimony; distribution of funds and causal link not
      independently confirmed here.
  - speaker: Moleman
    posted: 01:42:48/09-21-55
    printed_page: 49
    pdf_page: 50
    claim: Argues Muller knows even more about corporate corruption than appears on
      air, alleging that she uses some information as leverage over corporations to
      induce them to correct wrongdoing.
    certainty: Speculation and accusation by speaker, not proven methodology.
  - speaker: MesoStim
    posted: 03:11:02/09-28-55
    printed_page: 49
    pdf_page: 50
    claim: Claims Muller conducts much local research herself, once nearly faced physical
      harm in Marseille about four years earlier, and now uses additional protection.
      Repeats a rumor that Aztechnology had taken out a contract against her, while
      also offering an alternative explanation that security protects her from obsessive
      admirers.
    certainty: Pseudonymous account including explicitly unconfirmed rumor and alternative
      hypothesis.
  - speaker: Cynic
    posted: 04:44:23/10-02-55
    printed_page: 49
    pdf_page: 50
    claim: Predicts that Muller will pursue control of a medium-to-major trid network
      after marriage, driven by ambition and requiring substantial financial backing.
    certainty: Future prediction, not an established transaction or marriage.
  attribution_boundary: Preserve each poster’s perspective, timestamp and degree of
    certainty; neither a rumor of corporate pressure nor a prediction of marriage
    or acquisition is confirmed by the biography narrator.
