  biography_as_narrated:
  - Shoot-to-Kill first encountered Hammerhead while he was repeatedly striking a human stranger against a brick wall; she introduced him to Wolfram about a month after their association began.
  - At that time he had worked as a street samurai for roughly two years, following service as a corporate mercenary seconded to Central America.
  - Disenchanted with his employer and its shortcuts, Hammerhead left corporate service by holding his superior upside-down outside a sixth-story window until he received three months of pay as severance.
  - The book describes Hammerhead as the group's strong, silent, physically violent member, slow and methodical rather than indiscriminately reckless during the planning and execution of criminal jobs.
  - He specializes in heavy weapons and demolitions; unlike Shoot-to-Kill, who favors indiscriminate firepower, he carefully inspects job locations to determine equipment needs before an operation.
  - In his free time he exercises and reads developments in weapons and explosives; socially he can drink heavily and remain taciturn until provoked, when the narrator says he may become extremely violent.
  - He shares an apartment with Shoot-to-Kill; the narrator reports no confirmed occasions on which others have seen him without his heavy armor and boots.
