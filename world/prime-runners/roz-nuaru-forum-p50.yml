  subject: Roz Nuaru (Researcher; the spirit using that public identity)
  posts_in_printed_order:
  - speaker: Cobalt Blue
    timestamp_as_printed: 05:12:07/07-12-55
    claim: The speaker asserts Roz is prepared to help an unlucky magician on a metaplanar
      quest through her Astral Gateway, while supervising the person's vulnerable
      body during the journey; an attributed example of assistance, not evidence that
      any specific quest occurred.
    certainty: Speaker's attributed description and possibility.
  - speaker: MesoStim
    timestamp_as_printed: 01:11:44/07-16-55
    claim: Says Roz refuses to assist people who are affiliated with corporations
      or who have ever worked for the UCAS, CAS or CFS governments in any capacity;
      speaker adds that Roz has many Melanesian and Polynesian friends who continue
      to bear the consequences of American nuclear experimentation in Pacific homelands
      and against their ancestors.
    certainty: Attributed broad eligibility assertion and historical perspective;
      source's narrator does not independently enumerate every person refused.
  - speaker: Mogman
    timestamp_as_printed: 19:14:43/07-28-55
    claim: Claims that even weak students of shamanism should recognize that Roz is
      not an ordinary Cat shaman, except that her Aura Masking is impressive. Speculates
      that her cat detects the suspicions of observers and has a disturbing effect
      on their minds; speaker expresses personal belief, not a confirmed universal
      test or additional mechanic.
    certainty: Forum analysis and colorful speculation, not narrator-established mind-reading
      capability or unprinted game statistics.
