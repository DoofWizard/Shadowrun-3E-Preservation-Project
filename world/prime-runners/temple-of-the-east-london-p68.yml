data:
  venue: Temple of the East
  city: London, United Kingdom
  placement: Corner of Panton Street, just off the main thoroughfare of London's Chinatown.
  public_function: Chinese restaurant described by the historical source as imposing,
    discreet, luxurious and refined.
  linked_people: Kung Soo (Grandfather Soo) and his extended family.
  linked_organization: London Tong organization under Kung Soo.
  attributed_function: The narrator identifies the venue as the family's headquarters.
  building:
  - Tall and ornate structure, but the restaurant signage is comparatively simple.
  - Upstairs offices have closed shutters; restaurant-level windows are darkened,
    limiting views inside.
  - A traditional coiled Chinese dragon sculpture stands above the main entrance.
  - Uniformed Chinese doormen are present at the entrance throughout day and night.
  narrator_description: The decor and arrangement are presented as reflecting Soo's
    personality and the extended family organization.
