  professional_role:
    specialty: Prestigious fixer arranging introductions to highly regarded Swiss
      medical experts, European shadowclinics, and global research laboratories for
      exceptional or experimental cybernetic augmentation in the fictional setting.
    editorial_work: Editor of the influential in-universe Bulletin of Advances in
      Cybermedicine, publishing research by leading practitioners in the field.
    professional_gatherings: The source describes the journal organizing three conventions
      annually in Zurich, Berne and Strasbourg, enabling meetings with practitioners.
    education: Educated at Cambridge and Berlin.
    client_network: The narrator says he brokers specialized medical/cybernetic contacts
      for wealthy clients and is accessible for discreet, individually arranged requests.
    discretion: He directs clients to institutions that do not advertise their wares,
      and he can broker special arrangements on their behalf.
  disposition_and_limits:
    social_attitude: The book narrator describes Kaminsky as snobbish and patronizing,
      with particular prejudice against orks and trolls. This describes a fictional
      person's prejudice, not an assertion about a real person or an endorsed view.
    greed_and_prestige: The narrator calls greed his major weakness but distinguishes
      salary from reputation; he has refused high-level corporate jobs because they
      lacked the prestige and public visibility of his present position.
    geographic_limits: He reluctantly makes short journeys within Europe but, owing
      to his intense fear of flying, has never traveled outside continental Europe
      and the United Kingdom according to the source.
