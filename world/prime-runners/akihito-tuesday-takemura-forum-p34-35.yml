data:
  subject: Akihito 'Tuesday' Takemura
  form: In-world forum exchange; assertions and suspicions remain those of the named/pseudonymous
    speakers.
  chronological_posts:
  - speaker: O'Brien
    source_timestamp: 14:08:28/10-08-55
    printed_page: 34
    claims:
    - Describes Takemura as unusually composed and seemingly unreadable, with an almost
      instantaneous readiness to use a weapon in Hiroshige's defense.
    - Attributes this conduct to an extremely strict, impersonal code and says the
      bodyguard's presence helps Hiroshige negotiate.
    certainty: Speaker's impression and hypothetical characterization, not narrator-established
      observed events.
  - speaker: null
    source_timestamp: 03:17:21/10-09-55
    printed_page: 34
    claims:
    - Characterizes Takemura as nihirisuto, glossed by the speaker as a laughing samurai
      who faces death without fear.
    - Claims Takemura views readiness to die while protecting his patron as an honorable
      ideal, making other setbacks seem inconsequential.
    certainty: Speaker's cultural interpretation and assessment, not independently
      authenticated motivation.
  - speaker: Miras
    source_timestamp: 19:20:22/10-09-55
    printed_page: 34
    claims:
    - Questions why an elf serves a person the speaker characterizes as hostile to
      metahumans.
    certainty: Question and speaker characterization; does not independently prove
      Hiroshige's beliefs.
  - speaker: null
    source_timestamp: 01:17:54/10-11-55
    printed_page: 35
    claims:
    - Offers honor and lifelong upbringing in loyalty to the master and oyabun as
      an explanation for Takemura's service.
    - Asserts that late-stage social contact with other elves was very limited and
      that Hiroshige regards elves as culturally noble relative to other metahumans.
    certainty: Speaker's explanation and assertion, not a direct narrator account.
  - speaker: Ake
    source_timestamp: 10:16:39/10-17-55
    printed_page: 35
    claims:
    - Relays a rumor that Tuesday has questioned his life and begun discreet contact
      with members of the elf community around Chicago.
    - Speculates that he may be reconciling his metatype with Japanese upbringing
      and duty to Hiroshige and may encounter conflicting ideas from new acquaintances.
    certainty: Rumor and speculation, not established change of allegiance.
  - speaker: Anonymous
    source_timestamp: 04:16:50/10-22-55
    printed_page: 35
    claims:
    - States that Nicky Takagi, formerly known in Chicago yakuza circles before Hiroshige's
      takeover, believed he could prove Takemura was responsible for the death of
      Hiroshige's daughter Michiro.
    - Says the family does not discuss the death and relates hearsay via Takagi through
      a friend-of-a-friend about a drinking conversation in which Tuesday allegedly
      regretted not running Tadashi over when he had the opportunity.
    - Reports that official accident accounts say Michiro was struck by a vehicle
      left in gear without identifying the driver; the speaker infers a possible connection
      but offers no proof.
    - Says Takagi reportedly died by suicide four days after Hiroshige assumed control,
      allegedly by traditional seppuku; the speaker doubts that manner-of-death account.
    certainty: Multiple layers of unattributed hearsay, inference, and explicitly
      disputed allegations; not accepted as factual guilt, motive, or manner of death.
  - speaker: ADSR
    source_timestamp: 23:11:18/10-22-55
    printed_page: 35
    claims:
    - Warns Anonymous that Takemura may retaliate if he sees the post.
    - Explicitly says the accusation has not been verified by ADSR, while expressing
      a personal belief that Tadashi has suspicions about it.
    certainty: Warning, disclaimed certainty, and unverified inference.
