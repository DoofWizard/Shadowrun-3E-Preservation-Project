  biography:
  - As a child and school student, Adams was unusually inquisitive about other people's private affairs.
  - During university, Adams wrote gossip for the student paper; she nearly faced suspension for an illustrated
    report about a senior lecturer's association with four Bourbon Street topless dancers.
  - After completing her education, Adams took a trainee reporter position at the Tattler headquarters outside Baltimore.
  - Senior editor Maxwell Roberts trained her in investigative reporting practices, including disguise, surveillance,
    gathering discarded materials as evidence and responding to defamation litigation.
  - Her reporting skill and curiosity brought promotions to a senior correspondent who traveled internationally
    after stories.
  - She repeatedly declined promotion to an editor's chair, preferring field assignments; coworkers have not all
    welcomed her ambition or New Orleans accent.
  - Adams lives near Baltimore's harbor, keeps an upscale apartment and a smart car, and undertakes difficult field
    reporting with disguises or recording equipment to investigate leads.
