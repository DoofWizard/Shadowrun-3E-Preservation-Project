data:
  source_anchor:
    printed_page: 26
    pdf_page: 27
    section: Jonty Geldenhuys (Bounty Hunter) identity and biography
  identity:
    name_as_printed: Jonty Geldenhuys
    role_as_printed: Bounty Hunter
    birth_date_as_printed: November 14, 2013
    birthplace_as_printed: Bloemfontein, Oranje-Vrystaat, Confederated Azanian Nations
    nationality_metatype_gender_as_printed: Dutch/Caucasian Elf/Male
    residence_as_printed: None; travels constantly
    height_cm: 188
    weight_kg: 79
    hair_as_printed: Dark blonde, frequently dyed
    eyes_as_printed: Green, frequently tinted with corneal filters
    distinguishing_features:
    - Slightly protuberant eyes
    - Large triangular scar on the left shoulder blade
    - Right cyberarm
    psychology_traits:
    - Controlled
    - impassive
    - extremely thorough
    motivation_as_printed: Hunter-killer
    lifestyle_as_printed: High
  family_and_early_life:
    narrator_birth_context: Born an elf amid rapidly increasing anti-metahuman attitudes in Oranje-Vrystaat.
    parental_action: His parents smuggled him abroad to distant relatives in Holland, where he grew up.
    loss: The source narrator says Vrystaat prejudice prevented him from growing up with his parents.
    contradictory_attachment: He despises the Vrystaat's anti-metahuman prejudice but also seeks acceptance
      from the Vrystaat's authorities.
    contract_history: The narrator says he completed more contracts for the Vrystaat than for any other
      state.
  tracking_and_contract_reputation:
    characterization: Narrator calls him exceptionally implacable and persistent once engaged to find
      someone.
    named_historical_quarry:
      name_as_printed: Keppler Malan
      described_role: A man who exposed information about the Vrystaat's secret-government Broederbond.
      pursuit_length: Seven and a half years
      narrated_result: The fictional narrator states he 'got him in the end' after seven and a half years;
        it does not specify whether Malan was captured alive or killed.
    persistence_boundary: The narrator says a paid pursuit continues until Geldenhuys dies, the subject
      dies, or he apprehends the subject; these are alternatives, not an assertion that every quarry is
      killed.
    political_animosity: He strongly dislikes Anglos, knowing and recounting historic humiliations of
      the Boers by the British; the narrator reports he believes an Anglo conspiracy threatens the Vrystaat
      and its people.
    epistemic_guard: The claimed Anglo conspiracy is Geldenhuys's belief, not an independently established
      narrator fact.
    employers: He nevertheless takes jobs in the American states and has several corporate clients there.
    preference: Prefers dead-or-alive contracts; the narrator estimates that ninety percent of persons
      he pursues return dead.
    special_prejudice: When a target is Anglo, he reportedly interprets a dead-or-alive contract as permitting
      only a dead outcome.
  personal_habits_and_characterization:
    few_weaknesses_or_vices: Narrator characterizes him as having few weaknesses or vices apart from hostility
      toward Anglos and his uneasy connection to the Vrystaat.
    stated_abstentions: He does not smoke, drink, consume chips, or use drugs.
    romance: The fictional narrator says he would rather accept pay to shoot a woman than enter a romantic
      relationship with her. This is a hypothetical comparison illustrating Jonty's avoidance of intimacy,
      not a documented incident.
    vanity: Narrator explicitly says he has no personal vanity or conceit that can be exploited.
    self_sufficiency: A highly resourceful wilderness survivor in the narrator's characterization; surviving
      in the Sahara a hundred miles from water is offered as a hypothetical illustration, not an event.
    meticulousness: Narrator cautions anyone charged with protecting his quarry that he thoroughly plans
      to remove obstacles in his path.
  attribution_and_rules_boundaries:
    publication_setting: All of the above are source-narrator assertions about a fictional tabletop RPG
      character, not independent real-world claims, endorsements, or operational guidance.
    numerical_context: The estimated death percentage and seven-and-a-half-year pursuit describe fiction;
      they are not independent dice mechanics.
