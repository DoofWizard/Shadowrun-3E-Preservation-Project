data:
  character: Jonty Geldenhuys
  source_role: Bounty Hunter
  source_anchor:
    printed_page: 26
    pdf_page: 27
    sections:
    - Identity and psychology
    - Narrator biography
  identity_as_printed:
    birth_date: November 14, 2013
    birthplace: Bloemfontein, Oranje-Vrystaat, Confederated Azanian Nations
    nationality_metatype_gender: Dutch/Caucasian Elf/Male
    current_residence: None; travels constantly
    height_cm: 188
    weight_kg: 79
    hair: Dark blonde; frequently dyed
    eyes: Green; frequently tinted with corneal filters
    distinguishing_features:
    - Slightly protuberant eyes
    - Large triangular scar on left shoulder blade
    - Right cyberarm
    psychology:
      traits:
      - Controlled
      - impassive
      - extremely thorough
      motivation: Hunter-killer
    lifestyle: High
  background:
    birth_context: Born an elf in the rapidly anti-metahuman Oranje-Vrystaat.
    childhood_migration: His parents smuggled him from the country to distant relatives
      in Holland, where he spent his formative years.
    nationality_ambivalence:
      rejection: The source narrator describes resentment toward the Vrystaat's anti-metahuman
        bias, which kept him from growing up with his parents.
      acceptance: The same narrator says he wants recognition from the Vrystaat government
        and has fulfilled more contracts for it than for any other state.
  bounty_hunter_reputation:
    description: Narrator portrays him as a highly persistent, implacable tracker
      who continues a paid pursuit until the subject dies or he captures the subject.
    kepler_malan:
      named_target: Kepler Malan
      target_context: Malan is described as having exposed damaging information about
        the Vrystaat secret-government Broederbond.
      pursuit_duration: Seven and a half years.
      outcome: The narrator reports that Geldenhuys eventually found Malan; it does
        not give details of Malan's subsequent fate here.
    contracts:
      vrystaat: Receives contracts from the Vrystaat powers-that-be despite their
        anti-metahuman ideology.
      united_states: Also works for corporate clients in American states despite his
        anti-Anglo attitudes.
      dead_or_alive: Prefers contracts permitting a dead-or-alive return; narrator
        estimates 90 percent of his targets are returned dead.
      target_ethnicity_qualification: Narrator says the distinction between capture
        and killing is especially unfavorable for Anglo targets, reporting that an
        Anglo subject marked dead-or-alive is treated by Geldenhuys as dead.
  beliefs_and_prejudices:
    anti_anglo_animus: Narrator says he resents Anglos due to his understanding of
      historic British humiliations of Boers.
    conspiracy_belief: He believes an Anglo conspiracy threatens the Vrystaat and
      its people. This is his in-world belief, not an asserted narrator-confirmed
      conspiracy.
  personal_habits:
    abstentions: Does not smoke, drink alcohol, consume chips or take drugs.
    relationships: Narrator presents him as avoiding romantic involvement and indifferent
      to common forms of vanity or exploitable conceits.
    provocative_comparison: Narrator uses an extreme comparison between being paid
      to shoot a woman and pursuing a romantic involvement to characterize his isolation;
      this is not a report of a specific real-world act.
    survival: Narrator emphasizes his resourcefulness, speed and toughness, suggesting
      as an illustrative exaggeration that he could survive in the Sahara a hundred
      miles from water.
    meticulousness: Narrator characterizes his pursuit and removal of obstacles as
      extremely methodical.
  attribution_and_scope:
  - These are historical source-narrator fictional biography assertions, not independent
    real-world factual claims or an endorsement of the character's prejudices.
  - Source's percentage and duration are part of the narrator's in-world description,
    not converted game statistics.
  - Four separate forum speakers on printed pages 26–27, GM hooks and all numerical
    SR2 gameplay statistics are maintained in separate records.
