data:
  archival_provenance:
    source_heading: Keiji Hiroshige (Gangster)
    subject: Fictional Shadowrun tabletop role-playing game character
    printed_page: 32
    pdf_page: 33
    narrator_scope: Character identity panel and book narrator; opinions of signed forum speakers on page 33 are
      recorded separately.
  identity_as_printed:
    name: Keiji Hiroshige
    birth_date: September 4, 2007
    birthplace: Osaka, Japan
    nationality_metatype_gender: Japanese/Asian Human/Male
    residence: Chicago, UCAS
    height_cm: 157
    weight_kg: 60
    hair: Black
    eyes: Dark brown
    physical_features: Traditional Japanese tattoos cover his body except his face, hands and feet and are concealed
      by everyday clothes.
    traits: Meticulous, well-mannered, very difficult to read
    motivations: Criminal ambition; revenge when made to lose face
    lifestyle: High to Luxury
  ancestry_and_career:
    lineage: The fictional sourcebook traces Hiroshige to several prominent Japanese families, singling out the
      Inagawa as one of the leading yakuza families in the latter part of the previous century; it says the Inagawa
      still have strong influence at all levels of the yakuza world.
    migration: His family relocated to the United States when he was twelve, living in San Francisco and later Detroit.
    recruitment_status: The narrator says it is believed a family member recruited him into the yakuza at age fifteen;
      this is qualified, not a confirmed recruitment account.
    appointment: He rose through the ranks and took command of the Chicago operations in 2047.
    chicago_context: The narrator portrays Chicago as a longstanding yakuza project despite entrenched Mafia influence
      and secret deals between that influence and City Hall.
    chicago_position: The narrator calls Hiroshige the city's most visible oyabun; he took command of the Chicago
      operations in 2047.
  outlook_and_private_life:
    organization_style: Despite growing up in America, he favors older traditions over a newly centralized American
      yakuza syndicate; he prefers smaller numbers of directly controlled staff recruited for individual jobs.
    traditions: He favors the old yakuza code of giri-ninjo and encourages ritual tattoos and yubitsume; the published
      fiction identifies the latter as severing a fingertip to atone for a mistake and demonstrate continuing loyalty.
      His offices are styled traditionally with paper doors, low tables and a Zen garden.
    prejudice_qualified: The narrator describes him as very right-wing and secretly contemptuous of orks and trolls,
      while reporting only rumors that he donates to local extremist political clubs.
    family: The narrator states he has a son and was widowed the previous year, without assigning a cause of death
      here; the in-world forum attributes additional disputed family details to named speakers.
    property_and_interests: He is said to possess several houses in select city neighborhoods and reportedly practices
      karate and other traditional Japanese arts to remain fit.
  chicago_business_and_power:
    growth: The narrator describes significant gains in Chicago under Hiroshige, in part after Mitsuhama's expansion
      created a base for black-market operations.
    industries: The book narrator states that the Chicago yakuza supply the fictional Dream Town black market with
      services ranging specifically from hard drugs to brothels.
    corporate_influence: The narrator says he placed associates among shareholders of major Chicago corporations,
      including UCAS Steel, and predicts that this will become influential.
    rivalry: Yakuza-controlled lenders are competing with Don Patrick Murphy's mob-connected lenders for the poor-area
      loan market.
    local_influence: The narrative also credits the Chicago yakuza with influence among go-gangs and other Noose
      street groups.
    expansion_scope: The source narrator describes the Chicago yakuza as steadily extending its influence into almost
      every aspect of the city's organized crime, an ongoing trend rather than an already completed takeover.
