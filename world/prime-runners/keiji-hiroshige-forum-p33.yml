data:
  character: Keiji Hiroshige
  source_anchor:
    printed_page: 33
    pdf_page: 34
    section: Five in-world forum posts preceding Hooks
  posts:
  - speaker: 'Null'
    in_world_timestamp: 05:56:48/10-08-55
    attribution_and_claims:
    - Null characterizes Hiroshige as combining professed traditional honorable yakuza
      values with entrepreneurial exploitation of new trends, citing designer drugs,
      simsense and other industries.
    - 'Null names the deceased wife Sunito and attributes her reported death the previous
      year to a disputed explanation: allegedly heartbreak over their estranged son
      Tadashi.'
    - Null says Tadashi had been isolated from the family for more than six years
      after refusing his father's intended yakuza succession path; Keiji reportedly
      threatened disownment and Tadashi accepted the break.
    - Tadashi is said to work as a freelance decker in the Noose.
    - Null also mentions a daughter who died in a car accident at age fifteen.
  - speaker: O'Brien
    in_world_timestamp: 11:14:57/10-10-55
    attribution_and_claims:
    - O'Brien links Tadashi Hiroshige to attempts by competing yakuza factions to
      destabilize his father.
    - The speaker explicitly frames the suggestion that Tadashi wants a greater prize
      than street-running as an interpretation, not a verified plan.
  - speaker: ADSR
    in_world_timestamp: 04:55:46/10-12-55
    attribution_and_claims:
    - ADSR reports Tadashi describing himself as a ronin, a masterless samurai.
    - According to Tadashi as relayed by ADSR, his father replaced Tadashi in his
      affections with elder Hiroshige's personal bodyguard and apprentice, Akihito
      Takemura.
    - ADSR reports that Tadashi alluded to plans to challenge or expose his father's
      views on the yakuza and its traditions; no definite plot is established.
  - speaker: Anonymous
    in_world_timestamp: 07:16:12/10-13-55
    attribution_and_claims:
    - Anonymous recounts a freelance assignment from Hiroshige's associates involving
      a sting against three men encroaching on the operation in Park Ridge.
    - The speaker says the patrons fronted cash, weapons and vehicles; the work was
      judged lucrative, while the initial approach intimidated the speaker's team.
    - The assertion is one participant's experience, not evidence of a generally safe
      or lawful contracting practice.
  - speaker: Slater
    in_world_timestamp: 00:15:15/10-21-55
    attribution_and_claims:
    - Slater alleges that Hiroshige contributes money to local racist political clubs,
      but attempts at firmer association have been rejected.
    - Slater interprets that rejection as reflecting the clubs' hostility toward Japanese
      people as well as toward orks and trolls, rather than as Hiroshige voluntarily
      declining association.
  uncertainty_and_provenance:
  - Preserve individual speaker attribution and printed dates; Null, O'Brien, ADSR,
    Anonymous and Slater do not constitute a single narrator.
  - The heartbreak cause of Sunito's death and the alleged political contributions
    or maneuvering are claims, not omniscient facts.
  - The language on ethnically hostile views is archival description of in-universe
    prejudice, not endorsement.
  - The separate narrator biography is printed page 32/PDF 33; related scenario hooks
    and statistics are separately recorded.
