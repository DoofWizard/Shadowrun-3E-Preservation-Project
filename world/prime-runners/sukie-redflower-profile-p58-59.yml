    motivation: Sensation seeker
    lifestyle_range: High to Luxury
  narrator_description_and_social_context:
    professional_role: A combat mage and mercenary who offers magical support for hire; the narrator
      regards her as capable and courageous.
    personal_style: Wears black, violet and metallic clothing, favors strong visual effects, talks
      unusually fast and intensely, and uses humor about her own vanity while reacting badly to criticism
      from others.
    temperament: The narrator says she has a powerful temper and maintains longstanding grudges,
      figuratively likened to the length of the Golden Gate Bridge.
    recent_movement: The narrator says she moved to Seattle only around a year earlier, settled in
      Tacoma and intends to move to Bellevue.
    employment: The narrator states she has found sufficient money and Johnson employers in Tacoma
      to remain financially comfortable.
    city_conflicts: The narrator says she has avoided making enemies who threaten her life during
      her time in Seattle, despite being confrontational.
    professional_reliability: The narrator reports that she gains respect through competent work
      and does not desert partners when an operation goes wrong.
    critical_accusation_and_narrator_negation: Although some people call her dishonest or claim she
      cheats, the narrator explicitly rejects that accusation, observing instead that she uses professionally
      drafted written contracts whose fine print should be read carefully.
    contract_counsel: The narrator says she hires a lawyer to prepare her employment agreements.
  narrator_notes_on_printed_page_59:
    style_and_public_impression: Metallic face cosmetics and a conspicuous appearance are part of
      her style; she speaks incessantly, notably about politics, literature and major ideas, and
      can be both impressive and exhausting to colleagues.
    extra_finger_lineage: The narrator identifies her six-fingered left hand as a recessive hereditary
      trait from her father’s family.
    hand_gesture_and_joke: The narrator says she jokes about the usefulness of the additional little
      finger while making an unmistakable, threatening hand gesture; this is a characterization of
      her humor, not an instruction.
    low_light_vision: The source explicitly says she has natural elven Low-Light Vision.
    exceptional_quickness: The narrator remarks that her Quickness is exceptional even for an elf;
      the exact historical rating and modifications are in the existing Second Edition statistics
      record.
    centering_ritual: The narrator describes Sukie’s centering ritual as an altered Cascade Crow
      war dance and says she performs it with particular attention to visual effect. The source does
      not establish it as an authentic traditional ceremony.
  provenance_boundaries:
    narrator_facts: Narrator biography and notes on printed pp58-59 are reported as facts about an
      explicitly fictional source-period character.
    forum_allegations: Five separately attributed in-world speaker opinions and secondhand reports,
