headline: Opening Shadowland directory discussion
summary: The in-world compilers and commenters offer qualified, conflicting assessments of the directory.
data:
  source_anchors:
  - printed_page: 6
    pdf_page: 7
    section: Welcome to the Freak Show
  - printed_page: 7
    pdf_page: 8
    section: Welcome to the Freak Show
    page_art_only: true
  attributed_posts:
  - speaker: Doktor Freeman and the Deathcore Kid
    source_context: In-universe Shadowland introductory posting, dated 03-22-55.
    assertion: The compilers first assembled a directory of sought-after shadow-community contacts, later broadening it to
      include people they considered dangerous or otherwise worth warning readers about.
    source_characterization: The compilers say they drew on tips, rumors and accounts from unnamed associates and that the
      material is a varied directory of metahuman and human characters.
    certainty: source-claimed; testimonies and rumors are not independently verified.
  - speaker: Bitter Lemon
    source_context: Forum response, dated 03-25-55.
    assertion: Questions the authors' judgment and reliability.
    certainty: opinion by the named commenter.
  - speaker: Juggler
    source_context: Forum responses, dated 03-29-55 and 04-15-55.
    assertion: Claims the core biographical material is generally accurate and that the compilers distinguish speculative
      material from established material.
    certainty: attributed endorsement; not independent verification.
  - speaker: Rubbisher
    source_context: Forum response, dated 04-01-55.
    assertion: Makes a joking claim about the compilers' educational credentials.
    certainty: presented as sarcasm, not a verified biographical fact.
  rule_bearing_material: No target numbers, modifiers, equipment stats, spell data or dice procedures in these opening pages.
  source_page_7_mechanics_check: Full-page illustration without additional game rules.
