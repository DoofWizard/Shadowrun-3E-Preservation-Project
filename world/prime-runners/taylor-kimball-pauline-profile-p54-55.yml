data:
  subject: Taylor Kimball Pauline
  role: Contract Arranger
  source_anchors:
  - printed_page: 54
    pdf_page: 55
    section: Narrator biography, identity and motivation
  - printed_page: 55
    pdf_page: 56
    section: Notes on meeting places
  identity_as_printed:
    birth_date: July 24, 2021
    birthplace: Coney Island, New York, UCAS
    nationality_metatype_gender: UCAS / Caucasian Human / Male
    current_residence: Toronto, UCAS
    height_cm: 180
    weight_kg: 78
    hair: Gray, with prominent black streak
    eyes: Brown
    distinguishing_features:
    - Gray goatee
    - Prominent black streak in otherwise gray hair
    traits_as_printed:
    - Charming and charismatic
    - Quick-thinking under extreme pressure
    motivations_as_printed: Lives to make deals that link customers with suppliers
      and shadowy clients with shadowrunners; the published narrator describes his
      central motivation as surviving, arranging another deal and collecting commission.
    lifestyle: High
  family_and_early_connections:
    coney_island: His family members are significant shareholders in a revitalized
      theme park at the fictional setting's Coney Island resort.
    family_background: The narrator places Pauline in a long family line of carnival
      and fairground workers; he acquired their talents for showmanship and persuasive
      speech.
    networking: These skills took him into offices and boardrooms of mid-ranking corporations
      and contributed to extensive business contacts.
  employment_and_independent_arranging:
    original_employer: Honshu-McDougal Systems, Baltimore
    starting_role: Rising executive assigned liaison responsibilities between the
      weapons research-and-development division and freelance field-testing groups.
    departure_context: The original book describes a later proven genuine, blameless
      misunderstanding about aspects of contract procedure; Pauline then established
      his independent freelance agency. The account should not be rewritten as proven
      intentional misconduct or a criminal conviction.
    retained_corporate_relation: Continued to serve as a liaison for the corporation
      while expanding his services to outside clients.
    client_network: Connects corporate clients with freelancers across the shadow
      market, including deckers, hackers, fixers and other shadowrunners.
    newcomers: May be valuable to freelance operators who have not yet established
      contacts with the source's corporate Mr. Johnson employers.
    standard_fee: The narrator states his standard rate is 5 percent of the fee, presented
      as a modest arrangement fee because he wants to invest in runners who may win
      larger work later.
  appearance_and_presentation:
    clothing: Usually immaculately dressed, with a taste for conspicuous and flashy
      style
    accessories: Recently adopted a cape and a silver-topped cane
    facial_hair: Black-streaked gray hair and pointed gray beard
    effect: The narrator says his appearance can look cultivated or cadaverous
  offices_and_meetings:
    printed_page: 55
    pdf_page: 56
    toronto_office: Small office in a nondescript business block on the east side
      of Toronto
    new_york_office: Second office in New York
    discretion: The printed Notes allow gamemasters to have him meet runners in other
      public places
    ordinary_option: Standard office space is sufficient for a meeting with him
  distinct_source_voices:
    narrator: Biography on printed p54 supplies source-period description of career
      and relationships
    forum: Separately attributed Whistler, Ghost Man, SSD and Slater comments on printed
      pp54-55 present competing evaluations and are not narrator-certified.
    game_master_hooks: The printed p55 Hooks are optional game-master scenarios, including
      potentially unfavorable or deceptive contracts and their consequences. They
      should not be reported as outcomes that already happened.
    historical_mechanics: Exact Second Edition attributes, specializations, cyberware,
      equipment and game statistics appear on printed p55, separately indexed.
