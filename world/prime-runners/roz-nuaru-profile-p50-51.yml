data:
  provenance:
    source_heading: Roz Nuaru (Researcher)
    first_page:
      printed: 50
      pdf: 51
    concluding_notes:
      printed: 51
      pdf: 52
    source_voices: The original human's published identity panel and narrator's account
      of a successor free spirit are distinguished, as are later sourcebook Notes
      and pseudonymous in-world forum posts.
  public_identity_as_printed:
    name: Roz Nuaru
    birth_date: June 12, 2018 (for original human version)
    birthplace: Reporoa, New Zealand
    nationality_metatype_gender_as_printed: New Zealander/appears as Mixed Race (Maori/Caucasian)
      Human/Female (actually a Free Spirit of Man)
    current_residence: Sacramento, CFS
    height_cm: 157
    weight_kg: 45
    hair: Black, very long and curly
    eyes: Dark brown
    physical_features: Long hands, broad shoulders in proportion to rest of body
    psychology_traits_as_printed:
    - Restless
    - Sociable
    - Impulsive
    motivations_as_printed:
    - Research
    - Teaching
    lifestyle: Middle
  identity_and_history:
    academic_role: Occupies the Chair of Shamanic and Metaplanar Historical Studies
      at the University of Sacramento while presenting as an ordinary human researcher
      and Cat shaman.
    identity_secret: The narrator says the original human Roz Nuaru is no longer living
      and the person using her identity is a free spirit of Man.
    initial_death_uncertainty: The main narrator passage on printed p50 offers two
      possibilities for the human original, either death by suicide or disappearance
      on a metaplanar journey in 2047 and never returned.
    later_notes_detail: The Notes on printed p51 give a more definite account in which
      the original Roz, a human Cat shaman, voluntarily released this free spirit
      before dying by suicide after a failed romantic relationship; the released spirit
      assumed the original Roz's identity at her suggestion.
    epistemic_boundary: Preserve the original passage's uncertainty and the later
      Notes' stronger asserted explanation as separately attributed source statements,
      rather than erasing one or claiming an independent account reconciles them.
    present_spirit: The new Roz is described as a free city spirit who has lived with
      humans for years, practices sorcery but is not herself a shaman.
  scholarship_and_character:
    core_fields:
    - Pre-Awakening spike births
    - History of occultists and magicians before the Sixth World
    - Metaplanar topography
    - Teaching students and assisting magicians and shamans
    pedagogy: Narrator portrays her as friendly, kind, effective in teaching and generous
      with obscure historical and magical knowledge.
    travel_and_affinities: Later Notes describe her journeys to New Zealand and western
      Pacific islands and her close ties to Polynesian communities; the narrator says
      she sympathizes with difficulties caused by nuclear experimentation and colonial-era
      harm to homelands and ancestors.
    worldview: Narrator portrays the spirit as curious, eager to learn, optimistic
      and philanthropic, with genuine concern for others rather than an assigned hidden
      ulterior motive.
  cat_companion:
    name: Carruthers
    origin: British black cat by the narrator's account.
    name_story: Roz said the cat appeared while she read about John Dee and meowed
      loudly; she interpreted it as British and named it Carruthers.
    public_role: Helps preserve Roz's public explanation that she is a human Cat shaman
      rather than a spirit.
    extraordinary_role: Source Notes state Carruthers is the animal vessel associated
      with the spirit's Hidden Life and benefits from their exchange; the cat is intelligent
      and has its own extraordinary game statistics.
  separate_source_classes:
    exact_game_mechanics: rules/prime-runners/roz-nuaru-stats-p50-51.yml
    carruthers_mechanics: rules/prime-runners/carruthers-cat-stats-p50-51.yml
    carruthers_world_facts: world/prime-runners/carruthers-cat-profile-p50-51.yml
    attributed_forum: world/prime-runners/roz-nuaru-forum-p50.yml
    optional_gm_guidance: references/prime-runners/roz-nuaru-guidance-p51.yml
  source_boundary: All persons, spirits, academic roles and past-world episodes in
    this profile are fictional content in a historical tabletop RPG; no claims about
    real metaphysical phenomena or real-world clinical events are made.
