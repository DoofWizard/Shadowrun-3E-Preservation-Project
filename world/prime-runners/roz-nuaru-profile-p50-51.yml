headline: Fictional Shadowrun Second Edition researcher and free spirit Roz Nuaru
  — FASA Prime Runners (1994), printed pp50-51/PDF51-52
summary: Archival fictional sourcebook account distinguishing the original human shaman
  from the free spirit using her identity, with main-narrator uncertainty and later
  Notes preserved separately, plus scholarly role and Carruthers relationship.
