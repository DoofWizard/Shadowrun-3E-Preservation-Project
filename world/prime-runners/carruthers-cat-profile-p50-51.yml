data:
  name: Carruthers
  kind: Black cat; not an ordinary mundane animal in the source-period setting.
  place_of_origin: Britain
  source_anchor:
    first_mentions: {printed: 50, pdf: 51}
    hooks_and_notes: {printed: 51, pdf: 52}
  relationship_to_roz_nuaru:
    principal: Roz Nuaru, the free spirit who maintains a human identity at the University of Sacramento.
    first_meeting_story: Roz says the cat appeared while she was reading material about John Dee, meowed loudly, and seemed to her to be British.
    name_explanation: The narrator says that Roz called him Carruthers because of this first meeting.
    social_role: Travels or stays with Roz, helping her present the public identity of a human Cat shaman.
    supernatural_pact: The narrator describes Carruthers as the animal vessel for the free spirit's Hidden Life and states that the two have made an exchange that benefits his development.
    mechanical_boundary: The separate rules profile holds his exact powers, attribute notation, damage code, Reach modifier and Karma/Hidden Life implications; this world profile does not substitute new game procedures.
  personality_as_narrated:
    observation: Highly intelligent and more resilient than ordinary cats.
    narrator_descriptors: [Smart, Curious, Calculating, Manipulative, Cynical]
    concealed_nature: The character's supernatural significance is not apparent to ordinary observers, and the source's scenario advice asks gamemasters not to reveal it prematurely.
  linked_records:
