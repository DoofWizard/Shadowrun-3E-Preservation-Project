data:
  subject: Karl-Heinz Zessler (Hessler)
  posters_in_printed_order:
  - speaker: Serena D.
    timestamp: 02:16:44/03-04-55
    printed_page: 76
    claim: Warns that the magical environment around the Glastonbury zodiac is powerful
      and has its own inscrutable purpose. Says a mage without suitable knowledge
      should not approach magical work there.
    certainty: speaker warning, not established cosmology
  - speaker: MesoStim
    timestamp: 03:35:11/03-06-55
    printed_page: 76
    claim: Advises visitors not to carry weapons when approaching Hessler; alleges
      that he abhors violence and refuses to assist people carrying offensive weaponry.
    certainty: forum advice/opinion, not established universal rule
  - speaker: Name deleted by request
    timestamp: 00:00:01/03-25-55
    printed_page: 77
    claim: The unnamed in-world speaker alleges that after a small group of associates
      provoked Aztechnology during operations in Ciudad Obregón, the corporation used
      ritual sorcery against them. The speaker reports two friends died after a strange
      magical manifestation, with one person affected at each full moon. With Raul,
      the speaker approached Hessler the day before the third full moon; while they
      sheltered inside protective circles, an entity appeared. The speaker says
      Hessler sent a brilliantly lit and forceful spirit against it, removing the
      threat, then compared the action to a trace-and-burn program. The speaker closes
      by asserting the group would defend Hessler in the future.
    certainty: anonymous fictional firsthand account and attribution of corporate
      responsibility, not an independently verified killing chronology, combat result,
      or mandatory tabletop ritual-sorcery rule
  additional_source_context:
  - The anonymous poster states they had previously angered Aztechnology during
    unspecified operations in Ciudad Obregón. The source claims one victim per full
    moon and a summons to Hessler before the third full moon, but supplies no
    independent witnesses or confirmed attribution of the alleged magical attacks.
  - Forum claims about threats, motivations and people are not reclassified as authoritative
    biography.
