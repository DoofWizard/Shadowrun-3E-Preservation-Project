  employment_and_relationships:
  - subject: Alfie Gash
    relationship: Cameraman and regular working partner
    object: Ren Martindale
    source_characterization: Martindale narrates on screen while Gash normally operates the portable trid
      camera or broadcasts by means of a satellite link carried in a backpack.
  - subject: Alfie Gash
    relationship: Previously worked as cameraman and technical specialist for several East Coast investigative
      reporters
    examples:
    - Robert Barry
    - E. E. Valez, now deceased
    certainty: Narrator-stated work history.
  - subject: Alfie Gash
    relationship: Earlier working partner
    object: KRRR reporter Woody Williams
    history: The source states that Williams died in an explosion from which Gash narrowly escaped; Gash
      joined Martindale’s show afterward.
  characterization_by_narrator:
  - Gash is quiet, taciturn, dour and habitually smokes pungent cigars; the narrator says his expression
    often appears gloomy or scornful.
  - He generally avoids public attention and leaves the on-camera spotlight to Martindale.
  - His quick thinking has sometimes prevented serious harm to Martindale in tense investigations.
  - He can handle a firearm when required but prefers situations that do not demand it.
  - His camerawork and partnership with Martindale helped increase his public recognition; Martindale
    frequently names him on air.
  - Gash is uncomfortable with his increased fame and persistently rejects requests to be interviewed.
