data:
  source_anchor:
    printed_page: 9
    pdf_page: 10
    heading: Alice Adams forum comments
  subject: Alice Adams
  posts:
  - speaker: Edmonds
    timestamp: 08:33:10/10-14-55
    claim: Adams reportedly avoids personal on-camera appearances on the Tattler trid show to preserve anonymity;
      photographs accompanying her byline instead depict a tall, blonde, white West Coast woman, reportedly to misdirect
      prospective subjects.
    certainty: attributed_speculation
  - speaker: Vim
    timestamp: 02:20:11/10-17-55
    claim: The commenter says that the byline photograph was Adams's idea, alleges a relationship with a married
      man in Washington and rivalry with Channel 7's Celebrity Exposure, and alleges that a three-page Tattler article
      presenting child-procurement accusations against an Exposure reporter was arranged by Tattler intermediaries
      as retaliation. These are allegations, not established events.
    certainty: unverified_allegations
  - speaker: Collector
    timestamp: 03:16:01/10-18-55
    claim: A Tattler employee reportedly included a model photograph at the top of Adams's first report by mistake;
      editors allegedly kept the image and later reproduced it with her byline.
    certainty: disputed_alternative_explanation
  - speaker: Doler
    timestamp: 06:16:57/10-20-55
    claim: The commenter reports that Adams frequented informal Washington-area social gatherings, cultivating lower-ranking
      department contacts and investigating unverified claims involving a senator and the senator's secretary.
    certainty: attributed_rumor
  - speaker: Cable
    timestamp: 10:42:18/10-21-55
    claim: The commenter credits Adams with publicly criticizing a campaign by an Illinois congressman described
      in the post as a white supremacist, reportedly damaging his attempt at election.
    certainty: attributed_claim
  - speaker: Bethan
    timestamp: 11:06:19/10-21-55
    claim: The senator mentioned in the earlier discussion has not been established to be male.
    certainty: attributed_correction
  - speaker: Cable
    timestamp: 11:08:11/10-21-55
    claim: The commenter taunts Bethan about unknown information.
    certainty: attributed_reply
  - speaker: Bethan
    timestamp: 11:12:02/10-21-55
    claim: The commenter suggests that Alice Adams may clarify the senatorship rumor.
    certainty: attributed_reply
  note: Forum statements are disagreements and allegations, not verified biography.
framing: newsroom_neutral
headline: Alice Adams — attributed 2055 forum discussion
summary: Dated in-universe claims, contested explanations, and replies; allegations remain unverified and are not
  promoted to fact.
