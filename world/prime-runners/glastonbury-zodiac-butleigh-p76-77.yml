data:
  site_name: Glastonbury Zodiac
  setting_placement:
    narrator_account: The unnamed first-person account on printed page 76 describes
      a stone-circle zodiac centered on the village of Butleigh, a few miles southeast
      of Glastonbury in Britain.
    zodiac_relationship: The account says that in the proposed zodiac arrangement,
      Glastonbury itself lies adjacent to the Water Carrier figure.
    source_status: Description presented by an unnamed acquaintance of Karl-Heinz
      Zessler, not an externally established survey or published game map.
  associated_person:
    source_name_variants:
    - Karl-Heinz Zessler (printed heading)
    - Hessler (body text on both pages)
    role: Historical elf mage, occult consultant and researcher.
    relationship: The acquaintance describes the site as Zessler/Hessler's longstanding
      obsession and says he resides in Glastonbury.
    attributed_interpretation: The acquaintance reports that he considers his connection
      with the site significant in light of his birth date; the text does not establish
      that interpretation as true.
  magical_research:
    attribution: The page 77 Hooks section attributes to Hessler the suspicion that
      the zodiac might be a powerful portal to the metaplanes.
    certainty: Suspicion, not a confirmed working portal or a fixed magical mechanism.
