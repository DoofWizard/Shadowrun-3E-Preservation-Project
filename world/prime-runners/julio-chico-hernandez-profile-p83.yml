data:
  publication: FASA Corporation Prime Runners (FASA7116, 1994), historical Shadowrun Second Edition fictional tabletop role-playing game
  subject: Julio "Chico" Hernandez
  printed_source_label: Terrorist
  source_anchor: {printed_page: 83, pdf_page: 92, section: identity panel and narrator biography}
  identity_panel:
    birth_date: November 19, 2027
    birthplace: Havana, Cuba
    nationality_metatype_gender: Multiple travel passports and aliases; officially Cuban/Hispanic Human/Male
    current_residence: Unknown
    height_cm: 178
    weight_kg: 74
    hair: Black
    eyes: Brown
    distinguishing_features: None
    traits_as_printed: Psychopathic traits, charming, manipulative
    motivations_as_printed: Self-hatred, destructiveness
    lifestyle: Unknown
  narration:
    reputation: Source narrator describes Chico as a notorious, well-disguised figure blamed for many attacks and known principally through indistinct photographs.
    public_identity_uncertainty: The narrator reports speculation and many false or manipulated identities rather than a publicly authenticated biography.
    publicly_claimed_involvement: Narrator alleges he was responsible for numerous killings, including corporate executives and ordinary people, and the 2051 Cajun Cataclysm affecting Aztechnology facilities and river workers. These are period in-world setting claims.
    organized_response: The narrator describes UCAS and CAS counterterrorism agencies carrying out raids against alleged associates, with an asserted reduction in his resources.
    disputed_ideology: Narrator explicitly argues the portrayed anti-American Cuban communist eco-activist identity is an invented corporate image, not Chico's genuine origin or ideology.
    reported_birthplace_conflict: The panel lists Havana as birthplace; the subsequent narrator claims an origin in Mazatenango, Aztlan. Preserve both conflicting printed assertions without reconciling them.
    alleged_employment: The narrator portrays him as a corporate contractor used to undermine opponents, promote public fear of activists, and intervene in disputes among corporations.
    attributed_clients: Aztechnology, Saeder-Krupp and Shiawase are named as organizations reported to have used his services; neither each alleged assignment nor the identity of a single controller is independently established.
    program_controller: The narrator says the identity of Chico's immediate programmer or controller is uncertain, possibly a freelancer; alleged political sponsors remain unverified.
  source_voices_separate:
