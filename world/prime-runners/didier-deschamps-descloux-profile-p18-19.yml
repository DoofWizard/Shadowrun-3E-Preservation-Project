  narrator_history:
  - An exceptionally skilled sports agent who first found commercial success working with small bands
    in entertainment before entering sports representation through a European agency.
  - The narrator says he earned his first million by age nineteen, built a reputation as a gifted persuader,
    and negotiated complex clauses giving him control of client advertising contracts.
  - He built his organization Tri-D Global around football, Urban Brawl, jetball, baseball, sumo wrestling,
    cricket, and other sports including ostrich racing in Azania.
  - The source characterizes his contracts as complex, often tying modest athlete salaries to lucrative
    advertising rights and demanding ongoing performance.
  - Tri-D Global employs staff to provide media, security, legal and promotional support for high-profile
    athletes.
  - The narrator attributes his longstanding finger injury and limp to his youth but contrasts his claimed
    sporting injuries with alternative accounts of growing up on the streets of Marseille.
  - The narrator portrays him as fiercely protective of his adopted name and resentful of being reminded
    of the birth name.
  historic_business_competition:
    rival_name: Marc McLaughlin
    rival_firm: TransInternational Sport agency (TIS)
    time: Approximately three years before the in-world 2055 forum dates
    source_description: The source recounts the CAS agency losing executives after heart attacks, a diabetic
      coma and a fatal traffic collision, followed within six months by Tri-D Global taking over clients
      including Australian Rules and cricket stars.
    causation: The narrator states that wrongdoing could never be proved. No causation between Tri-D Global
      and the illnesses/accidents is established.
  associated_brand:
    brand: Tri-D
    products:
    - Designer clothing
    - Perfume
    - Jewelry
    - Accessories
    sales: Promoted wherever he travels, especially European engagements
    labor_and_environmental_claims: The narrator says many goods are made in less developed countries
      by poorly paid workers and allows that some operations may be illegal or involve endangered/protected
      or sentient paranormal species.
    uncertainty: The source describes possible illegal practices, not a proven finding against every product
      or supplier.
  company_entourage_as_printed:
