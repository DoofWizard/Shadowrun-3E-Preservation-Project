  subject_as_printed: Michael James Sutherland (Decker)
  identity_as_printed:
    birth_date: August 17, 2025
    birthplace: Chelmsford, United Kingdom
    nationality_gender_metatype: British/Caucasian Human/Male
    current_residence: Manhattan, New York, UCAS
    height_cm: 188
    weight_kg: 73
    hair: Blonde
    eyes: Light blue; has reportedly used corneal filters to appear hazel-eyed
    distinguishing_physical_features: Significant weakness in lower back attributed
      to shotgun injuries; wears a thick supportive waist corset
    psychology_traits: Ultra-rational, cool under pressure, intensely curious about
      computer systems, meticulously mannered and bantering; his manner can appear
      emotionally unreadable
    source_quoted_self_description: into S & M—being shallow and meaningless
    narrator_motivation: Unknown and difficult for other characters to read
    lifestyle: High, with resources sufficient for Luxury
  fictional_background:
    family_wealth: The narrator says he grew up in a wealthy family whose fortune
      came from stock investments in light industry, with personal wealth estimated
      at some 12 million nuyen excluding the value of his decks.
    reputation: The fictional narrator characterizes him as one of the world's foremost
      deckers, with virtually every megacorporation having commissioned work from
      him.
    divided_clients: The book says he has worked for corporate rivals against one
      another, but follows a tacit agreement not to extract ultra-sensitive data;
      his personal value and standing are offered as reasons firms have not attempted
      to force his exclusive employment, including by kidnapping. Those are narrator
      assertions within the fictional setting, not real-world advisories.
    professional_rise: Through individual technical skill, diplomacy and apparent
      lack of pretense, he rose to a high level of the fictional freelance Matrix
      profession and has so far avoided major enemies; this is not a guarantee against
      later GM events.
    circuitous_intrusions: His specific fictional Matrix strength is disguise of one
      system's activity as originating on another system, usually a small company's,
      using smart-frame behavior and rerouted traffic. The historical game mechanics
      and hypothetical hacking encounters remain in other records, not real-world
      procedures.
    discretion: The narrator says he does not boast about his work, will not reveal
      details of past commissions and is difficult to entice into discussing those
      runs.
    personal_routine: He dresses impeccably, appreciates aesthetics, favors early
      European and Bulgarian choral music as well as J. S. Bach and Verdi, and drinks
      fine wines, gin and malt whisky in moderation. The narrator says he does not
      smoke or abuse electronic chips and has had few relationships with women.
    motivation_and_limits: Difficult Matrix puzzles attract him irrespective of their
      consequences; his curiosity, not only financial profit, affects whether he accepts
      work. The book cautions that people should not underestimate his skill or attempt
      to evade payment.
    fictional_service: The narrator presents him as an unusually capable contact for
      otherwise intractable Matrix assignments, whose charges may be less than his
      resources would suggest because puzzles interest him.
  source_boundaries:
    in_world_commentary: world/prime-runners/michael-james-sutherland-forum-p72-73.yml
