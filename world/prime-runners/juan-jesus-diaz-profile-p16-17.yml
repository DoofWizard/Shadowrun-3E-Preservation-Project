  narrator_characterization:
  - The narrator depicts Diaz as a Houston street ganger whose unusual chess ability attracted attention
    in a setting where gangers often face danger before adulthood.
  - His aggressive board manner, rapid calculation, use of space, and deliberately forceful play distinguish
    him from more conventional chess personalities.
  - The source distinguishes traditional FIDE-regulated human chess, played without cybertechnology, from
    computer chess and cybernetically assisted opposition; this is fictional chess-world context, not
    a Shadowrun tabletop resolution rule.
  - Source compares the character’s competitive style to Garry Kasparov and other championship players;
    the comparison is characterization rather than a game-system bonus.
  - The narrator says his appearance and unusual public persona made him appealing to sponsors and media
    channels, and he had become a high-profile chess figure.
  - The profile calls him a grandmaster at age 16 and predicts, rather than establishes, a potential UCAS/CAS
    senior title and a possible championship contest with Anatoly Grishkin in 2058.
  - Both the narrator and GM notes stress that his volatility and lack of a conventional chess support
    team leave him vulnerable even as his skill draws attention.
  - He relies on a collection of chess books, rather than a computer database or an analysis staff, for
    his preparations.
  - The notes emphasize his empathy and capacity to become a complex recurring character; use only as
    source characterization, not clinical inference.
  prospective_titles:
    ucas_cas_senior_title: Narrator says Diaz is poised for a possible senior title, not a confirmed later
      result.
    possible_world_title_2058: A future meeting with Anatoly Grishkin is conditional on surviving and
      being selected; not established as history.
  gang_relationship:
