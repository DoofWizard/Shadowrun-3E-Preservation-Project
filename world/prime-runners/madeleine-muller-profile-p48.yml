  identity_as_printed:
    name: Madeleine Muller
    birth_date: September 11, 2028
    birthplace: Aachen, Germany
    nationality_metatype_gender: Dual national French-German/Caucasian Human/Female
    current_residence: Zurich, Switzerland
    additional_apartments:
    - Strasbourg
    - Paris
    - Aachen
    - Berlin
    - London
    - Manhattan
    - Nogoya
    height_cm: 173
    weight_kg: 58
    hair: Honey blonde
    eyes: Gold flecked with hazel (cybereyes)
    physical_characterization: Perfection, called cheekbone heaven by the narrator
    personality_traits_as_printed:
    - Curiosity
    - Great determination
    - Extreme cool
    motivations_as_printed:
    - Investigative work
    - Self-promotion
    lifestyle: Luxury
  professional_reputation:
    specialty: Narrator calls her Europe's top observer of corporate schemes and politics
      and says roughly half of European media outlets use her as a resident expert
      on corporate maneuvering.
    abilities: Described as exceptionally knowledgeable, intelligent, perceptive and
      capable of exposing corporate dishonesty; the narrator considers her beauty
      an advantage because interlocutors underestimate her determination.
    personal_impact: Narrator uses exaggerated imagery of overwhelming charm and a
      poetic 2000-carat diamond to describe responses to her, but this is figurative
      narration and not an established magical effect.
    access: Said to obtain meetings with influential corporate staff in exclusive
      clubs, theatres, restaurants and other venues, sometimes despite protective
      entourages.
    media_methods_as_reported: Narrator says she can use disguises, except that her
      conspicuous golden cybereyes can reveal her identity; no real-world evasion
      or surveillance procedure is provided.
  historical_investigations:
    naples_2050: Narrator credits her with exposing a fictional toxic dumping scandal
      in Naples in 2050.
    marseilles_2051: Narrator credits her with work concerning controversial experiments
      in Marseilles in 2051.
    russian_government: Narrator says she has investigated Russian governmental concealment
      of long-term nuclear and toxic hazards in the Baltic states and Ukraine for
      several years.
    other_topics: Her reports have addressed urban decay, local-government scandals
      and environmental threats and damage.
    media_employers: Produced an acclaimed sequence of early programs for the BBC
      in London and worked for several major European media outlets.
  safety_and_future_claims:
    attacks: The narrator says at least two attempts on her life occurred during the
      previous three years, without specifying perpetrators or circumstances in this
      passage.
    response: She refuses to end her investigative work because of these events.
    future_media_ownership: The narrator reports a rumor that she is planning acquisition
      of a major European media corporation, not an accomplished purchase.
  other_existing_source_classes:
    exact_historical_statistics: rules/prime-runners/madeleine-muller-stats-p48-49.yml
    attributed_forum: world/prime-runners/madeleine-muller-forum-p48-49.yml
    optional_campaign_guidance: references/prime-runners/madeleine-muller-guidance-p49.yml
  boundaries: This is a source-faithful reference to an adult fictional media personality
    in a published tabletop RPG. Corporate allegations are about invented institutions,
    narrator figurative comparisons are not literal supernatural rules, and real-world
    actions are not prescribed.
