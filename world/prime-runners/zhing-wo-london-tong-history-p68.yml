data:
  source_anchor: Narrator biography of Kung Soo, printed p68 / PDF p77; not the attributed forum comments or gaming guidance
    on p69.
  organization: Zhing Wo
  classification: London Tong organization, described by the book as a criminal network in the central-London Overground.
  setting: London, United Kingdom, historical Second Edition setting.
  origin_and_membership:
    after_1997: The source situates Soo's immigration to London after Hong Kong's transfer to Chinese administration, amid
      economic recession and anti-immigrant conditions; he entered the London Tong network.
    role_of_kung_soo: Soo initially protected extortionists and later worked as an administrator and assistant to a senior
      figure.
    change_2006: Soo replaced that figure after an internal dispute in 2006 and coordinated much of Zhing Wo's London network
      for more than a decade.
  faction_change_2017:
    conflict: The source describes open conflict with Manchester-based Xiao Ziang family.
    allegiance: Soo and his closest associates switched to the northern side.
    later_position: The narrator describes Soo as the leading London Tong figure in subsequent decades; this is not a claim
      that Zhing Wo independently remained unchanged.
    other_named_family: Si Peng is another powerful northern-based family named in the comparison.
  source_period_activities: The narrative includes illegal gambling, drug dealing, illicit chips and bioware, firearms, prostitution,
    and extortion within the network's activities; these are setting facts, not real-world instructions.
  institutional_links:
    police: The narrator asserts widespread corruption of senior London police officers.
    corporate_security: Small UK corporate-security units are described as almost certainly penetrated; the source expresses
      a lower degree of certainty here.
  public_positioning: In a source-attributed London Times interview roughly five years before the narrated present, Soo predicted
    future influence through the Matrix rather than local business owners; this was a forecast.
