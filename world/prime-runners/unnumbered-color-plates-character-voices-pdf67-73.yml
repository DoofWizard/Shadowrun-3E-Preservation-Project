edition_scope: FASA Corporation Prime Runners (FASA7116, 1994), historical Shadowrun
  Second Edition; unnumbered illustrated character speech panels and no inferred SR3
  conversion
content_class:
- attributed_claim
data:
  source_form: Seven printed color portrait panels, each bearing a character name
    and an in-character first-person statement; these are character voices in a fictional
    published tabletop RPG, not independent narrator facts.
  printed_pagination: Eight unnumbered PDF plates follow printed page 64; this record
    covers seven speeches on PDF67-73, before printed page 65 resumes at PDF74.
  speech_panels:
  - pdf_page: 67
    attributed_character: Ariel Almodovar
    rhetorical_characterization: Self-assured professional observer who argues that
      people, even the wary, expose telltale behavior without realizing someone may
      be watching.
    claim_boundary: A boast of fictional observation skill, not a real-world surveillance
      procedure or verified universal principle.
  - pdf_page: 68
    attributed_character: Martin de Vries
    rhetorical_characterization: Fiercely condemns fictional vampires, compares their
      treatment to removing dangerous animals from society, and declares himself without
      guilt about hunting them.
    claim_boundary: The character's hostile moral argument and prejudice in an invented
      supernatural setting, not the publication narrator's objective ethical judgment.
  - pdf_page: 69
    attributed_character: Jonty Geldenhuys
    rhetorical_characterization: Impatient contractor scolds a person delaying the
      job, boasts that employers paid him to retrieve that person from Tir, and states
      indifference to their survival.
    claim_boundary: A menacing fictional quotation; neither an accomplished abduction
      nor a real-world plan is established by the speech panel.
  - pdf_page: 70
    attributed_character: Susan Hands-as-Wings
    rhetorical_characterization: Confident mechanic-driver offers to drive, repair,
      and custom-paint a vehicle, but emphatically rejects novelty fuzzy dice on its
      rear scanner display.
    speech_texture: Colloquial and irritable humor, including the setting-specific
      colloquialism fraggin'.
    claim_boundary: Personal sales patter and a comic preference, not mechanical modifiers
      or an actual vehicle transaction.
  - pdf_page: 71
    attributed_character: McBean
    rhetorical_characterization: Bad-tempered figure repeatedly tells Fancy to leave,
      mocks the listener's hearing or electronic ears, then responds to defiance by
      referring to the listener's lungs.
    claim_boundary: Fictional brusque dialogue with an implied personal threat; no
      resulting injury or completed attack is depicted as fact.
  - pdf_page: 72
    attributed_character: Sukie Redflower
    rhetorical_characterization: In urgent technical slang orders a bystander to move
      aside during a prearranged fictional combat operation, mentions a fifty-by-twenty
      system, hardsuits, a line of fire, and sarcastically calls the outcome clean.
    claim_boundary: In-character science-fiction combat jargon, not a usable real-world
      weapon procedure, statistical weapon entry or adjudicated result.
  - pdf_page: 73
    attributed_character: Michael James Sutherland
    rhetorical_characterization: Criticizes conventional blunt-force approaches to
      fictional Matrix security and boasts that his advantage lies in unconventional
      expectations rather than the ordinary approach used by hired specialists.
    claim_boundary: Character viewpoint about imaginary Matrix systems; no technological
      method, executable sequence or numeric game rule is supplied by the panel.
  visual_page_index: references/prime-runners/unnumbered-color-plates-visual-index-pdf66-73.yml
  speaker_separation: Every speech is attributed to its printed named character, not
    a real person, anonymous forum commentator, or the sourcebook's omniscient narrator.
headline: Fictional Shadowrun Second Edition portrait voices — FASA Prime Runners
  (1994), unnumbered PDF67-73
summary: Seven paraphrased in-character speech panels with named fictional speakers,
  genre-specific context, speech character, and qualified claims distinct from narrator
  facts.
framing: newsroom_neutral
