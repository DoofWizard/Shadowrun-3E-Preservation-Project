    timestamp: 01:17:06/10-17-55
    claim: Claims BU offers 100000 nuyen for Petrosian's body, wanting his internal
      memory intact; warns that his headware is the object of the pursuit. The claim
      is independent from the narrator's reported 250000 nuyen reward alive.
  - speaker: Trap Man
    source_page: 56
    timestamp: 04:11:17/10-25-55
    claim: Questions how a conspicuous person could evade Bioenergetica Ukraine and
      asks whether BU's pursuers have located him.
  - speaker: Cobalt Blue
    source_page: 56
    timestamp: 05:00:05/10-29-55
    claim: Claims to hear continued reports of pursuit, and speculates that Petrosian
      may obtain appearance-altering treatment through bioware and medical contacts,
      but might be identifiable through his habits and spider phobia.
  - speaker: Bitter Lemon
    source_page: 57
    timestamp: 22:17:15/11-04-55
    claim: Speculates that corporate parties might compete for Petrosian's internal
      research, making his whereabouts a contested matter.
