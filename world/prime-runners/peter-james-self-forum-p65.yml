  publication_year: 1994
  edition: Shadowrun Second Edition
  subject: Peter James Self, fictional author
  source_anchors:
  - printed_page: 65
    pdf_page: 74
    section: Three interleaved in-world comments before optional Hooks; eight intervening unnumbered image
      plates PDF66-73
  messages:
  - speaker: Sister Ray
    timestamp: 01:06:59/11-02-55
    opinion: Severely criticizes Self as an emotionally exploitative and self-destructive person whose relationships
      cause women distress.
    uncertainty: The speaker predicts suicide as a possibility and hopes he does not end up dead; this is
      a hostile projection, not narrator-confirmed self-harm or diagnosis.
  - speaker: Reader
    timestamp: 22:19:52/11-05-55
    opinion: Disagrees with Sister Ray’s characterization, defends Self’s portrayal of marginalized people
      in Nobodies as psychologically and socially connected to broader ideas.
    literary_example: Describes Giancarla, a fictional dealer who spends hours in Milan’s train station
      considering the names and destinations of trains, as a subtle instance of the literary theme.
    certainty: This is the reader’s interpretation of a fictional fictional-universe book.
  - speaker: Collector
    timestamp: 23:12:11/11-08-55
    claim: Reports seeing Self perform a strange stand-up monologue in a Berlin cabaret in late 2051. The
      performance narrated a supposed shipwreck, a deserted island, a rowboat and a slice of fruit cake
      whose raisins had been picked out.
    certainty: Collector reports attending the performance but does not confirm that Self’s story of being
      shipwrecked is true; the poster takes it as a sign of unusual habits of thought.
  authority_boundary: Dated fictional reader reactions, reported cabaret performance and hypothetical outcomes
    are not independent biographical facts in the main narrator voice.
headline: Fictional three-comment Peter James Self forum — FASA Prime Runners (FASA7116, 1994), Shadowrun
