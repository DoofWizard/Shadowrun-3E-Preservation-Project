data:
  service_description: Unnamed independent vehicle, rigging and drone customization practice of Susan
    Hands-As-Wings; the source supplies no registered business or workshop name.
  operator:
    name: Susan Hands-As-Wings
    occupation_as_printed: Rigger/Mechanic
    home_base: Redmond, Seattle
  source_anchor:
    profile:
      printed_page: 30
      pdf_page: 31
    hooks_and_notes:
      printed_page: 31
      pdf_page: 32
  scope_of_work:
  - Vehicle and rig rebuilding, stripping to components, reassembly and technical customizations, including
    improvements beyond original customer expectations.
  - Repairs, construction and customization of control rigs, drones, aircraft and vehicles; the narrator
    describes her repeatedly rebuilding a rig to gain a marginal extra one percent, as characterization
    rather than a universal numeric game modifier.
  - The narrator describes Susan as able to supply or install new Hyundai-CSA advanced air-to-air missiles;
    this is a fictional equipment-service reference, not a standalone rule or real-world procedure.
  - Susan can provide vehicle upgrades, removal of serial identifiers from fictional borrowed vehicles,
    remote drone surveillance and scenario equipment preparation. These are high-level fictional services;
    no method is supplied.
  - The narrator describes her enthusiasm for paid explosive-drone commissions and their fictional destructive
    effects; no real construction or operation procedure is supplied.
  - She maintains permanent repair/build facilities and carries field kits when traveling.
  professional_characteristics:
    quality: The narrator praises her mechanical ingenuity and ability to exceed customer expectations,
      but these are descriptive judgments, not guaranteed numeric performance bonuses.
    working_style: Prefers to perform the technical work herself and may pursue surprising modifications.
    access: According to the narrator, she knows virtually everyone involved in dishonest activities at
      points east of Seattle; this is wider than merely eastern Seattle and identifies no particular business
      premises.
    geographical_reach: The source presents her as broadly mobile and able to work as a fixer in Salish-Shidhe
      lands, especially Cascade Lands.
    relationships: She has highly placed friends among the Cascade Ork tribe and dislikes elves generally,
      avoiding travel through Sinsearach lands unless necessary.
  source_limits:
    no_official_name: Descriptive archival label only; the book does not name or register her workshop
      as a separate corporation.
    no_invented_service_stats: No prices, mechanical bonuses, availability ratings or physical weapon
      specifications are inferred from broad descriptions.
    separate_mechanics: Exact character skills, gear and vehicle equipment values are in dedicated game-stat
      and equipment references.
    conditional_hooks: Possible contract assignments, accusations and conflicts described as hooks are
      optional, not established world history.
