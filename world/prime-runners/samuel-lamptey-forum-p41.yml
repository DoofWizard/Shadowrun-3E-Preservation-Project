data:
  character: Samuel Lamptey
  source_anchor:
    printed_page: 41
    pdf_page: 42
    section: Three anonymous in-world forum messages preceding Hooks
  claims:
  - speaker: Gnasher
    timestamp_as_printed: 21:02:41/07-03-55
    claim: Claims to have served as a paid chaperone on a Seahawks outing. During
      a Panthers encounter, Lamptey allegedly reacted enthusiastically after the Panthers
      damaged the limousine’s titanium-steel armor barrier, grabbed the chaperone’s
      shoulders, and praised his new muscle implants and bone reconstruction paid
      for by the team accountant, despite also saying the prior version had been satisfactory.
    certainty: First-person anecdote by this forum speaker; not an independently confirmed
      narrator fact
    speaker_warning: Advises other chaperones to be careful because Lamptey becomes
      physically excited.
  - speaker: Edger
    timestamp_as_printed: 03:17:50/07-11-55
    claim: Says Lamptey likes the thrill of anything illicit and has a serious gambling
      habit. Speaker worries the Seahawks have reason for concern given organized
      gambling, imagining that Lamptey might be drugged, entrapped, or otherwise sabotaged.
    certainty: Speaker assessment and hypothetical risks, not a confirmed incident
    economic_assessment: Reports chaperone fees are excellent, while questioning whether
      the money compensates the risk.
  - speaker: Ghost Man
    timestamp_as_printed: 01:17:12/07-15-55
    claim: Claims the Seahawks spent millions equipping Lamptey and paid substantial
      legal fees in an NFL dispute over the legality of titanium bone lacing, which
      the team won.
    certainty: In-world assertion, unverified by narrator in this comment
    inference: Suggests the team is prepared to pay runners to keep Lamptey happy.
  attribution_guard: All three entries are separate in-world voices and dated claims;
    do not promote Edger’s feared sabotage to a historical event or import their claims
    as mechanical rules.
  mechanical_guard: References to implants and bone lacing in testimony do not modify
    the separately recorded exact Second Edition statistics.
