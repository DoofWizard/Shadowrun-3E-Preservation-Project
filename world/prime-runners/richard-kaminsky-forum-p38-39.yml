  speaker_posts:
  - speaker: Analyzer
    timestamp_as_printed: 01:17:32/07-17-55
    printed_page: 38
    pdf_page: 39
    claim: The poster calls Kaminsky an influential cyberware contact but characterizes
      him unfavorably as a self-interested and unreliable professional.
    epistemic_status: Subjective opinion of an in-world poster.
  - speaker: Chiphead
    timestamp_as_printed: 00:40:19/07-21-55
    printed_page: 38
    pdf_page: 39
    claim: The poster says a friend visited Kaminsky after an especially profitable
      acquisition of corporate database information. Kaminsky allegedly referred that
      friend to Silicon Glen in Scotland for expensive wired reflexes, while the poster
      obtained a C2 head computer; the poster asserts that Kaminsky kept 15 percent
      of the fee.
    epistemic_status: Secondhand account and first-person claim, not narrator-established
      fact.
  - speaker: Bitter Lemon
    timestamp_as_printed: 19:30:11/07-25-55
    printed_page: 38
    pdf_page: 39
    claim: Most customers, in the poster’s view, are affluent fashion enthusiasts
      seeking commercially available augmentations such as Dikote cheekbones and color-changing
      cybereyes, paying about three times ordinary cost for prestige.
    epistemic_status: Attributed generalization, illustrative examples and estimated
      price premium.
  - speaker: Rubbisher
    timestamp_as_printed: 19:11:01/08-02-55
    printed_pages: 38-39
    pdf_pages: 39-40
    claim: The poster says Kaminsky sometimes appears in entertainment gossip about
      celebrity cosmetic alterations and publicly disavows involvement.
    epistemic_status: Forum report; gossip and denials are not independently established.
  - speaker: Legless and Bleeding
    timestamp_as_printed: 20:11:51/08-11-55
    printed_page: 39
    pdf_page: 40
    claim: The poster has heard that Kaminsky avoids direct illegal work, prioritizes
      appearances and is heavily guarded at his clinic; the poster warns against visiting
      without invitation.
    epistemic_status: Expressly secondhand rumor and the poster’s warning.
  attribution_guard: No in-world post is elevated to narrator-established history;
