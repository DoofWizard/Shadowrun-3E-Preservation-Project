    interests: Fascinated by American consumer spectacle, cyberware, glitz and neon;
      wants to see shadowrunners in action, treating imagined adventures as entertainment.
    simsense: Seahawks management keeps him away from simsense under his contract,
      fearing that dependency could impair his performance.
    anxiety_over_illicit_thrills: Narrator says management discreetly arranges comparatively
