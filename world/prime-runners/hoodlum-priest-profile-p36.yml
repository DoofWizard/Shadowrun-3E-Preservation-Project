  setting_and_activities:
  - The narrator portrays a troll dressed as a Catholic priest who carries an Ingram
    smartgun and has an extraordinary and affecting speaking voice.
  - His congregation gathers in a ruined church on the border of Chicago's Shattergraves;
    the narrator characterizes many of the orks and trolls in attendance as poor,
    marginalized, and sometimes violent.
  - The narrator describes a damaged piano accompanying the religious services, communion
    with wine, and followers who address him as Father rather than by a known real
    name.
  - The narrator estimates a roughly thousand-person community of devoted followers
    and considers their willingness to protect him exceptional.
  - Magicians who have assensed his aura reportedly describe it as resembling a shamanic
    adept's but with an unusual pattern; this is their reported impression, not an
    independently established magical tradition.
  - His preaching emphasizes solidarity among oppressed creatures and asserts a divine
    entitlement to recover resources from oppressors, without providing a precise
    theological definition of that entitlement.
  - The narrator describes ghouls and spectres from the Shattergraves observing his
    work without harming him and on some occasions bringing supplies or accepting
    a blessing.
  - The narrator, who claims psychological training, says the Priest's influence differs
    from ordinary image management or advertising manipulation and wonders rhetorically
    whether a power beyond ordinary explanation may be involved.
