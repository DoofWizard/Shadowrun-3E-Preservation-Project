data:
  character: Martin de Vries
  public_moniker: Vampire Hunter
  source_anchors:
  - printed_page: 14
    pdf_page: 15
    sections:
    - Biographic profile
    - Narrator history
  - printed_page: 15
    pdf_page: 16
    sections:
    - Source context under Hooks and Notes; mechanics separately preserved
  biography:
    birth_date: June 16, 2011
    birthplace: Nijmegen, Netherlands
    nationality_metatype_gender_as_printed: Dutch/Caucasian Human (Vampire)/Male
    current_residence: Unknown; believed to be in UCAS
    height: 188 cm
    weight: 72 kg
    hair: Black
    eyes: Dark hazel
    distinguishing_features:
    - Pronounced stoop
    - Youthful appearance, looks late twenties
    - Severely chewed fingernails
    - Very pale skin
    psychology_traits:
    - Obsessive-compulsive
    - Wholly goal-oriented
    - Chain smoker
    - Hypertensive
    motivation: Vampire hunting
    lifestyle: High
  education_and_affiliations:
  - Studied hermetic magic at Nijmegen, Oxford, and Yale; regarded as exceptionally gifted.
  - At Oxford he joined the Ordo Maximus as an initiate and left his studies; narrator says he
    devoted more time to an older drinking circle than magic threats.
  - Peers characterized him as paranoid, antisocial, and obsessive. A wealthy uncle reportedly
    left him funds used for independent research into magical threats.
  historical_activity:
  - period: 2040-2051
    claim: Conducted an extensive succession of vampire hunts across Europe while convinced of
      a secret vampire society planning to awaken a metaplanar monstrosity. Peers ridiculed the
      theory.
  - period: 18 months after 2051
    claim: Disappeared from public view for approximately eighteen months.
  - period: Following absence
    claim: Later understood to have contracted vampirism; the source states he is a vampire who
      predominantly sustains himself on other vampires and takes other targets only under severe
      necessity.
  - period: '2045'
    claim: Located an unusual magical artifact during a trip to Indonesia, reportedly useful against
      vampires; source explicitly says its nature is unknown.
  - period: 2053-2054
    claim: The narrative raises the abrupt end of reported Minneapolis vampire-related violence
      as possible indirect evidence of his activity, not a documented causation.
  vampirism_origin_theories:
  - hypothesis: A vampire knowingly infected a vampire hunter despite his known identity.
    certainty: Source narrator finds this surprisingly implausible; not established.
  - hypothesis: He deliberately sought transformation to learn the enemy from within.
    certainty: Attributed to some European runners; unverified.
  - hypothesis: He offered magical training in exchange for induction.
    certainty: Attributed to some observers; unverified.
  methods_and_risks:
  - Commonly prefers close-range, hand-to-hand contests against vampires, draining their Essence
    and blood.
  - Against especially dangerous opponents, is known to employ highly trained samurai equipped
    with explosives and fragmentation weaponry.
  - Source warns that encountering him as an adversary could expose a runner to serious danger,
    including the possibility of becoming prey.
  - Maintains grimoires in bank vaults; is a skilled mage with an obsessive interest in magical
    methods against vampires.
  - The narrator also describes de Vries as willing to attack people imitating vampire appearance,
    whom he may view as prey even when they are not actual vampires.
  uncertainty_guard: Keep narrator facts distinct from runners’ theories, disputed forum assertions,
    and hypothetical adventure hooks.
  related_records:
  - npc.prime_runners.martin_de_vries.sr2_stats
  - npc.prime_runners.martin_de_vries.sr2_forum
  - npc.prime_runners.martin_de_vries.sr2_guidance
  source_tension_note: The source narrator also says he takes non-vampire targets only in extreme
    need; that statement is preserved alongside the separate statement about targeting vampire
    imitators, without resolving the tension.
headline: Martin de Vries — historical profile of the vampire hunter
summary: Biographical account of a former Ordo Maximus initiate, vampire-hunting campaigns, disputed
  transformation, uncertain targets, and competing in-world explanations; retains the narrator’s
  internal tension about his choice of prey.
framing: newsroom_neutral
