data:
  subject: Taylor Kimball Pauline
  source_form: In-world Shadowrun forum commentary; source order retained
  messages:
  - speaker: Whistler
    timestamp: 00:07:48/10-01-55
    source_printed_page: 54
    position: Strongly distrustful
    claims:
    - Alleges Pauline requires substantial initial payments and passes along later
      mounting costs to runners.
    - Alleges inaccurate planning and dangerously understated opposition in jobs he
      arranges.
    - Claims Pauline favors established corporate hiring clients at the expense of
      freelance workers, and advises dealing with an employer in person.
    certainty: speaker accusations and advice; not a narrator-certified outcome
  - speaker: Ghost Man
    timestamp: 14:17:21/10-09-55
    source_printed_page: 55
    position: Strongly favorable
    claims:
    - Reports four jobs arranged by Pauline for this speaker and business associates,
      each allegedly producing major returns.
    - Reports Pauline initially contributed his own money toward equipment and partial
      expenses.
    - Acknowledges not knowing the actual ultimate employer for those jobs, attributing
      secrecy to powerful corporate clients.
    - Recommends Pauline to people who want corporate clients to obtain desired results.
    certainty: speaker report of own experiences
  - speaker: SSD
    timestamp: 23:09:5/10-14-55
    source_printed_page: 55
    position: Cautionary
    claims:
    - Advises obtaining a written agreement before taking work through Pauline.
    - Advises learning the corporate client or employer identity.
    - States such jobs inherently involve chances and distrusting corporate hiring
      agents in general.
    certainty: speaker opinion and advice
  - speaker: Slater
    timestamp: 01:16:22/10-15-55
    source_printed_page: 55
    position: Hostile
    claims:
    - Disputes Ghost Man’s favorable assessment.
    - Alleges Pauline withholds vital job details, including mission risks and capability
      of opposition.
    - Alleges he does not share all of the client payments with runners and can disguise
      costs.
    - Characterizes him as untrustworthy while conceding he presents himself convincingly.
    certainty: speaker allegations; not narrator-certified facts
  source_anchors:
