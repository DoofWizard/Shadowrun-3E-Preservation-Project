  - printed_page: 31
    pdf_page: 32
    section: 'Notes: biographical and personal observations'
  identity_as_printed:
    role: Rigger/Mechanic
    birth_date: March 17, 2012
    birthplace: Somewhere on Highway 90, east of Seattle
    nationality_metatype_gender: Salish-Shidhe; Cascade Ork/Amerindian Dwarf/Female
    residence: Redmond, Seattle
    height_cm: 124
    weight_kg: 41
    hair: Dark brown
    eyes: Hazel
    distinguishing_features: Tattoos of eagles and stags along her forearms.
    psychology_traits:
    - Highly curious
    - Fearless
    - Reckless
    motivations: Meddling; finding new rigger gear and using, wrecking, or repairing it.
    lifestyle: Low to Middle
  name_background:
    observation: The narrator says Susan does not know why she received the name Hands-As-Wings.
    her_attributed_explanation: The narrator explicitly says she blames her parents for listening to too
      much countercultural music in California and becoming confused. This is Susan’s attributed blame,
      not the narrator independently establishing the cause of her name.
    contrast: The narrator contrasts her comfort with machine oil against patchouli, reinforcing the difference
      from the parental image.
  personal_characterization:
    abilities: The narrator praises her mechanical resourcefulness, willingness to dismantle and rebuild
      machinery repeatedly, and confidence in her own repairs and enhancements.
    disposition: Sensation-seeking, brave almost to fearlessness, and possessed of a dark, dry sense of
      humor.
    professional_style: She prefers hands-on independent work and may install unconventional improvements
      instead of following a customer's initial expectations precisely.
    discretion: Narrator says she knows when to avoid attention from Knight-Errant Security, Lone Star,
      and comparable authorities.
    caustic_humor: The Notes say Susan freely insults almost anyone for the amusement of it and occasionally
      gets herself into trouble; her ability to stay discreet around named security forces is an explicit
      counterpoint.
    narrator_stereotype: The opening adopts and then challenges a claim that a dwarf would make an unsuitable
      rigger because of conventional foot-pedal reach; the narrator says modern control rigs no longer
      use foot pedals. This is the narrator’s rhetorical setup, not a genuine restriction on dwarf player
      characters.
  activities_and_community:
    vehicle_interests: The narrator offers Susan as a fast getaway driver for runners and praises her
      Eurocar as able to outperform virtually anything on the road. As of the narrator’s last information
      she was working on an oil-dispersing exhaust; neither a completed installation nor measured results
      are established by that statement.
    contacts: The narrator describes connections to virtually everyone involved in dishonest activities
      at points east of Seattle, not merely in the eastern part of the city.
    social_attachments: The narrator identifies influential friends in the Cascade Ork tribe. Susan strongly
      dislikes elves generally and avoids Sinsearach lands unless necessary; the dislike is not restricted
      to Sinsearach elves.
    mechanical_work: The narrator calls Susan uniquely able to repair almost anything quickly and praises
      her willingness to repeatedly strip, rebuild and improve rigs; her mechanical services and optional
      equipment projects are indexed in their own service record.
    fictional_drone_projects: The narrator specifically characterizes Susan as enjoying paid commissions
      to build heavily customized explosive-carrying drones and watching their fictional destructive effects.
      This preserves the character's stated tastes, not real-world construction instructions or a confirmed
      event.
    fictional_missile_service: The narrator also describes her as able to locate new military-grade Hyundai-CSA
      air-to-air missiles, inspect them and install them on a customer's drone or aircraft; exact fictional
      equipment and service references remain separately indexed and no numeric game bonus is inferred.
  attribution_and_scope:
    forum_boundary: Four individual forum comments on printed page 30 are attributed observations or opinions
      and not independently established biography facts.
    hooks_boundary: Page 31's suggestions for employing Susan and hypothetical smuggling accusations are
      optional gamemaster scenarios, not completed events.
    mechanics_boundary: All printed character attributes, equipment, cyberware, vehicles, skills, Initiative,
      Threat Ratings and professional rating are in the independently recorded historical Second Edition
      rule_exact profile.
