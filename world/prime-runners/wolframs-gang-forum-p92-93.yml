data:
  organization: Wolfram’s Gang
  source_anchors:
  - printed: 92
    pdf: 101
    section: Shadowtalk
  - printed: 93
    pdf: 102
    section: Shadowtalk continued
  attributed_comments:
  - speaker: Slam
    timestamp: 10-06-55 09:18:15
    claim: Passes along street speculation that gang members evade prosecution because
      an influential corporate patron protects them so long as they harm rival interests.
  - speaker: Cityboy
    timestamp: 10-06-55 23:57:53
    claim: Reports a theory that Shoot-to-Kill’s estranged father is a senior executive,
      but immediately acknowledges this does not explain a purported attempt by Shoot-to-Kill
      against the father ten months earlier.
  - speaker: Sevan
    timestamp: 10-08-55 01:12:11
    claim: Alleges work for over one quarter of leading Manhattan Consortium corporations,
      apparently with opposed corporate interests; offers as an example a Villiers-funded
      assignment against a telecommunications firm followed by the opposite arrangement
      in a later week. The speaker presents speculation, not proof of a continuous
      sponsor.
  - speaker: De Lorean
    timestamp: 10-08-55 03:20:38
    claim: Adds a jocular willingness to work for multiple rival clients; not evidence
      of gang employment.
  - speaker: Brand
    timestamp: 10-10-55 04:15:27
    claim: Claims that after Wolfram was injured in a confrontation with Fuchi security
      last August, Shoot-to-Kill and Hammerhead spent about two weeks consuming alcohol,
      shooting into bars or clubs, and confronting a weapons dealer. Brand says Wolfram
      later resumed negotiation and repaired relationships with paid sources; the
      speaker fears consequences if Wolfram is seriously hurt.
  - speaker: BRT
    timestamp: 10-12-55 01:00:52
    claim: Says they worked with the trio on four heists and found the gang more professional
      than its reputation, especially toward allies treated respectfully; a first-person
      testimonial, not independent verification of those four crimes.
  - speaker: Barry Normal
    timestamp: 10-19-55 21:14:32
    claim: Suggests a 2054 NBS Primetime Theater Special titled “The Bride Wore Bloodstains”
      as a dramatized source for the wedding incident, expressly warning that most
      details of the portrayal were invented; not reliable evidence of event details.
  certainty_boundary: Speaker claims conflict and contain obvious hyperbole; neither
    corporate patronage nor a particular employment arrangement is established by
    this record.
