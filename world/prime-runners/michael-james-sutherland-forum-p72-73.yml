data:
  subject: Michael James Sutherland, Matrix specialist; five in-world forum comments
  speakers_in_printed_order:
  - speaker: Snorbitz
    timestamp_as_printed: 16:32:11/9-22-55
    printed_page: 72
    assertions:
    - Describes Sutherland as technically brilliant but socially eccentric and exceptionally
      courteous.
    - Recalls a tense Matrix session involving corporate opponents during which Sutherland
      stopped for Earl Grey tea and fruit scones before returning to work.
    - Attributes a pun about high tea and Jamaica to Sutherland.
    certainty: Speaker anecdote and subjective characterization, not an independent
      transcript.
  - speaker: Ghost Man
    timestamp_as_printed: 23:11:17/9-30-55
    printed_page: 73
    assertions:
    - Dismisses Sutherland’s reputation as largely attributable to his Fairlight cyberdecks
      rather than his ability.
    certainty: Dismissive opinion.
  - speaker: Slater
    timestamp_as_printed: 20:51:52/10-5-55
    printed_page: 73
    assertions:
    - Disputes Ghost Man; argues Sutherland possesses genuine skill and has modified
      his own decks.
    - Claims Sutherland has developed sophisticated self-programmed nested smart-frame
      systems.
    - Jokes that Sutherland would expect an expensive fee and a visitor in tweed clothing.
    certainty: Forum counterclaim and joking advice; not a formal game statistic.
  - speaker: De Rigeur
    timestamp_as_printed: 17:02:42/10-9-55
    printed_page: 73
    assertions:
    - Portrays Sutherland as refined, and advises visitors not to arrive with chewing
      tobacco or spit on the carpet.
    - Describes him as English and civilized.
    certainty: Speaker opinion and etiquette recommendation.
  - speaker: Analyzer
    timestamp_as_printed: 20:20:41/10-22-55
    printed_page: 73
    assertions:
    - Warns against trying to take Sutherland’s decks without consent even if his
      condominium security is passed.
    - Claims protective systems on the decks could gravely harm unauthorized Matrix
      users and send their locations to Sutherland.
    certainty: Unverified speaker warning about fictional protective technology; not
      a game-mechanical rule or confirmed outcome.
  attribution_note: Forum posts are discrete attributed claims; character biography
    and numeric decking equipment are preserved in separate records.
