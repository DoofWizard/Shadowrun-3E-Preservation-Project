  subject_as_printed: Frank Marshall Wendall (Private Detective)
  identity_as_printed:
    birth_date: August 14, 2017
    birthplace: Savannah, Georgia
    nationality_metatype_gender: CAS/Caucasian Human/Male
    current_residence: Atlanta, CAS
    height_cm: 180
    weight_kg: 77
    hair: Sandy brown
    eyes: Blue-gray
    distinctive_physical_features: Bullet entry scar over right nipple and bullet
      exit scar beneath right shoulder blade
    psychological_traits: Obsessive-compulsive, perfectionist, remorseless
    psychological_motivations: Pursuit of criminals and social justice
    lifestyle: Medium
  narrated_career_and_cases:
  - period: Police career
    account: Wendall formerly served in the Atlanta Police Force. He was rapidly promoted
      through its homicide division and commended for locating suspects in difficult
      cases.
  - period: Kris Columbus case and subsequent retirement
    account: During the investigation into the fictional notorious serial killer Kris
      Columbus, Wendall was seriously injured during an arrest. The ordeal led to
      early retirement with disability pension, and he withdrew for more than three
      years to a residence at the edge of Okefenokee Swamp.
  - period: Return from retirement
    account: The narrator says no one knows who persuaded Wendall to return to investigations.
      Soon after accepting his first new case he attracted city authorities' notice
      by locating people in local and neighboring areas.
  - period: Missing Renraku executive's children
    account: When the Atlanta Police Force could not locate the missing twin sons
      of a Renraku executive, Wendall was hired. He located the boys' bodies buried
      in a remote North Georgia mountain valley. Authorities briefly suspected him,
      but he cleared his name by tracking down and presenting the alive murderer,
      Gracey McKimson, to investigators.
  - period: Later well-publicized cases
    account: Wendall has participated in multiple widely publicized investigations
      and some that attracted little media attention. He refused to help recover the
      missing financial director William Cruise of the fictional company Cathy Hall
      despite the case's public exposure.
  working_methods_and_limits:
    autonomy: He reserves the right to choose whether to take an investigation and,
      once decided, resists efforts to change that decision.
    investigative_psychology: The narrator compares his methods to acting; Wendall
      absorbs the psychological point of view of his subjects and at times acquires
      or shares psychological traits or problems that they possess.
    personal_cost: Particularly distressing cases may affect him profoundly. The book
      says he sometimes withdraws from public activity for as long as a year after
      such a case before being drawn back to work.
    narrator_characterization: The chapter's opening summarizes his talent for finding
      people, regardless of whether they wish to be found.
