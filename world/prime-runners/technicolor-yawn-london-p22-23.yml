    heading: Hooks
  location_as_printed: Earl’s Court, London, UK
  type_and_theme: Australian-themed barbecue and steamboat bar; the narrator calls
    its location an Australian enclave.
  source_period_status: Celebrating its first anniversary at the narrated time; the
    publication does not give an exact opening day.
  atmosphere_and_patronage:
  - Narrator describes a noisy, lively venue visited by London socialites and by runners,
    Johnsons, and patrons seeking discretion.
  - The high noise level is described as preventing casual eavesdropping on nearby
    conversation; this is a setting description, not an equipment or stealth rule.
  - Most regular drinks are lager; management also maintains a cocktail bar.
  personnel_and_patrons:
  - person: Alfredo Garcia
    role: Sasquatch bartender and cocktail mixer, called Alf and Fred by some patrons;
      he can understand conversations that others assume he cannot hear.
  - person: Gwendolyn Robinson
    role: Owner of the Technicolor Yawn; portrayed by the narrator as charismatic
      and supportive of Alfredo.
  decor_and_business_history:
  - Gwendolyn imports Australian Aboriginal art to decorate the venue.
  - She has also recently begun bringing in Native American art for a separate, planned
    Amerindian-themed club; the second club is not stated to have opened.
  related_source_account:
    narrator_reports: The owner additionally participates in unlawful transactions
      involving culturally significant artifacts and magical goods, using proceeds
      for further illicit activity; this is the fictional source narrator’s account,
      not a real-world procedure.
    alfredo_awareness: Alfredo has only recently learned of these activities and is
      angry at the perceived exploitation and worried about the venue’s future.
    scenario_status: The prospect of the bar closing or needing intervention is a
      future scenario possibility, not a completed event.
