    heading: Erik Vernon Dreyfuss (Runner)
  family_and_ownership:
    former_owner: Arthur Peabody Dreyfuss, described by the narrator as a Connecticut
      defense-telecommunications magnate who has died.
    inheritance: Arthur left his corporation to his son Erik Vernon Dreyfuss.
    current_administration: A committee chaired by Erik's unnamed mother runs the
      inherited firm until the committee judges him sufficiently mature to take over.
    timing_and_control: The narrator doubts Erik will take control of the board in
      the near future; the source gives no transition date.
    family_context: After Arthur's death, Erik's mother became highly protective of
      Erik, described as her only child.
  business_and_contacts:
    industry_context: Arthur's defense-telecommunications business background is explicit;
      the book does not provide the firm's legal name or full product portfolio.
    technology_access: Contacts at Arthur's corporation occasionally supply Erik with
      experimental technology, including only partly tested weaponry.
    external_network: Erik also has contacts at many levels of the East Coast defense
      industry; these outside contacts are not necessarily employees of the inherited
      corporation.
