  - speaker: Bitter Lemon
    timestamp_as_printed: 22:16:30/08-07-55
    printed_page: 30
    pdf_page: 31
    claim: Questions why a mechanic as accomplished as Susan purchased a commercial performance engine
      instead of making her own.
    certainty: A question challenging a choice, not independent engineering evidence.
    not_narrator_fact: true
  - speaker: Cylinderhead
    timestamp_as_printed: 03:25:07/08-22-55
    printed_page: 30
    pdf_page: 31
    claim: Argues that no one can match a factory high-performance upgrade and that even Susan could not
      quite make her own as reliable; softens the comment while directly addressing Sue. This is an opinion
      about quality and reliability, not a measured production-consistency test.
    certainty: Speaker opinion; no demonstrated technical test.
    not_narrator_fact: true
  - speaker: Crusher
    timestamp_as_printed: 20:16:12/09-02-55
    printed_page: 30
    pdf_page: 31
    claim: Reports that the Eurocar is garaged somewhere in Redmond. Calls it a protective survival bubble,
      claims bullets virtually bounce off it and the interior is a sealed environment, compares its speed
      extravagantly to a dragon on stimulants, and says Sue charges high rates for a run but is worth
      it. These are enthusiastic testimony, not independently measured statistics or a passenger-ride
      price.
    certainty: Speaker's enthusiastic testimony and reported location; not verified specifications.
    not_narrator_fact: true
