data:
  person: Hammerhead
  role: Street Samurai and member of Wolfram’s Gang.
  identity:
    birth_date: May 12, 2028
    birthplace: New York, UCAS
    nationality_metatype_gender: UCAS / Caucasian Troll / Male
    residence: New York, UCAS
    height_cm: 277
    weight_kg: 320
    hair: Fluorescent orange, Mohican brush
    eyes: Light brown
    distinctive_marks:
    - Missing two smallest fingers and the first thumb joint on right hand
    - Numerous burn and shrapnel scars on both legs, buttocks and lower back
    psychological_traits: Unknown
    motivation: Unknown
    lifestyle: Medium to High
  prior_employment: Former corporate mercenary seconded to Central America for two
    years; became disillusioned with the profession and with employers’ judgment.
  joining_the_group: Met Shoot-to-Kill while working as a street samurai; she introduced
    him to Wolfram roughly one month later. He resigned, arranging three months of
    severance pay from his superior, and joined the group.
  group_role: The group’s principal physical enforcer, heavy-weapons and demolitions
    specialist. Source distinguishes his deliberate, strategic approach to assignments
    from Shoot-to-Kill’s more impulsive approach.
  preparation_and_personality: Source narrator describes Hammerhead as usually taciturn
    and deliberate, evaluating situations ahead of time; outside work he maintains
    his fitness and reads weapons-research developments.
  personal_relationships: Close relationship with Shoot-to-Kill; the pair share an
    apartment. Source narrator says he generally cooks and cleans, while his habitual
    armor and boots and sleeping in them are reported as rumor.
  uncertainties: His actual name is not known; the text speculates that Shoot-to-Kill
    may know it. Attributed stories about his nickname and injuries remain distinct
    from biography.
