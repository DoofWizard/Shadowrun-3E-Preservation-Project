  printed_subject:
    heading_name: Karl-Heinz Zessler
    alternate_name_used_in_body: Hessler
    class: Mage
    name_distinction: The 1994 source heading and body differ in spelling; neither form is silently erased or corrected, and the separate variant index records both.
  original_character_panel:
    birth_date: January 16, 2011
    birthplace: Kaiserslautern, Germany
    nationality_metatype_gender: German/Caucasian Elf/Male
    current_residence: Glastonbury, United Kingdom
    height_cm: 183
    weight_kg: 73
    hair: Silvery gray
    eyes: Green-blue
    physical_features: Widow's peak, pale skin and shuffling gait
    source_traits: Kind, charming, unselfish, modest
    motivation: Magical research
    lifestyle: High
    provenance: Printed page 76 / PDF page 85 identity panel, within a fictional Second Edition tabletop game
  testimonial_description:
    narrator_identity: Unnamed first-person observer in the published prose, distinct from named dated forum commenters
    impression: The observer says Karl-Heinz appears substantially older than his official 2011 birth certificate would imply and personally estimates him to be very old, even for an elf.
    personality: Observer reports that he is tolerant, gentle, good-mannered and nonjudgmental; even a violent former samurai reportedly described him as a saint.
    epistemic_limit: These are impressions and recollections of the unidentified narrator, not guaranteed metaphysical proof of age or saintliness.
  livelihood_and_research:
    inherited_money: The observer describes inherited personal wealth.
    consultancy: Occasionally offers consultation on obscure occult and magical matters in the fictional setting.
    major_study: Has long investigated the Glastonbury Zodiac and the stone-circle pattern associated with Butleigh southwest of Glastonbury.
    intuition: He believes the Zodiac site's significance is related to his birth date and his attraction to the region; the observer credits many of his intuitions but does not establish the theory as fact.
    contact_role: Source prose proposes he can identify unusual magic, investigate curses, research free spirits and advise characters about occult history, with services shaped by optional campaign scenarios.
    separate_site_record: world/prime-runners/glastonbury-zodiac-butleigh-p76-77.yml
  historical_home_and_habits:
    source_page: {printed: 78, pdf: 87}
    apparent_age: Notes say he is probably eighty to one hundred years old, substantially older than his official birth date suggests; past events are left to gamemaster discretion.
    languages: Fluent in German (native language) and English.
    residence: Deliberately archaic domestic setting with an extensive and cherished library, grimoires, candles and oil lamps; the house nevertheless has electricity.
    avoided_equipment: Dislikes gadgetry, including trid, computers, microwave ovens and radio.
    book_protection: The source reports that visitors taking books without permission tend to return them after several days and experience amnesia and disorientation; the cause is not given as a defined mechanical rule.
    guardian_ally: Has a powerful guardian he calls Merlin; its specific statistics and background are reserved to the gamemaster.
    quiet_manner: Described as polite, considerate, measured and appreciative of books.
  historical_magic_relationships:
    magical_order: Described as an initiate of an unnamed magical order; its purposes and membership remain unspecified.
    spirit_friends: Knows many free spirits and some great spirits, and generally prefers asking for information rather than treating spirit assistance as routine.
    rules_and_limitations: Exact tests, services, target numbers, library ratings, spell ratings, initiation grade, centering and guardian details remain in the separate protected rule_exact record.
  cross_references:
