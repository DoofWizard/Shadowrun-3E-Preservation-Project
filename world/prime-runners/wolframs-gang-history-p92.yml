data:
  name: Wolfram's Gang
  source_anchors:
  - printed_page: 92
    pdf_page: 101
    heading: Wolfram's Gang; introductory history (narrator text, distinct from forum
      posts)
  location: Post-quake New York City, notably Manhattan; the background also describes
    enhanced urban disorder and restored natural law in inner cities.
  organization_name: No official name; street residents use the informal label Wolfram's
    gang.
  roster: Three trolls led by the troll Wolfram, whose partners are Shoot-to-Kill
    and Hammerhead.
  role_and_methods:
  - Recurring fictional criminal gang, associates of urban law-avoidance and corporate
    targets.
  - Specialties include armed robberies, extortion, illegal-dealer operations, abductions,
    explosives, and paid violent engagements.
  - The source describes Wolfram as the planner; his two partners supply heavy physical
    force.
  first_public_incident: 'Approximately four years before the source setting, a corporate
    wedding banquet robbery: prior wiring of explosives, taking jewelry/drinks/cake,
    kidnapping the newly married couple, and escaping in two luxury sports cars from
    the parking area; the narrator reports the authorities failed to catch them and
    a substantial ransom was extorted from NJG Cybersystems.'
  source_specific_incident_distinctions: The introductory narrative (not an attributed
    forum claim) reports this debut in the past of the setting; it does not verify
    any later fan comments about sponsors.
  ongoing_history: Narrator describes subsequent increasingly specialized heists,
    kidnappings and corporate blackmail.
  associated_characters:
  - Wolfram
  - Shoot-to-Kill
  - Hammerhead
  source_attribution: Sourcebook setting narrator only. Dated shadowtalk claims following
    this introduction are separate, contested in-world statements and are not promoted
    here to narrator-level fact.
