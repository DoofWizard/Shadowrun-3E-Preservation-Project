    narrator_status: Published in-world sourcebook narrator and printed character
      identity panel; separate from the following named forum opinions and optional
      GM hooks.
  identity:
    name: Ren Martindale
    occupation: Media Jock, investigative trid host
    birth_date: December 31, 2019
    birthplace: Dark Harbor, Maine, UCAS
    nationality_metatype_gender_as_printed: UCAS/Caucasian Human/Male
    residence: Boston, UCAS
    height_cm: 178
    weight_kg: 100
    hair: Brown
    eyes: Blue
    distinguishing_features: Pock-marked cheeks; limp in left leg; severe scarring
      up left side; bullet scars on right side, right shoulder, and left buttock.
    traits_as_printed:
    - Reliable
    - Honest
    - Trustworthy
    - Determined
    - Sociable
    motivations_as_printed: Investigating, sensation-seeking
    lifestyle: Middle
  program:
    collaborator: Alfie Gash, a dwarf camera operator.
    schedule: Every Thursday night, 10 PM to midnight.
    equipment_in_narrator_description: Shoulder-mounted trid system, old raincoat,
      handheld microphone.
    producing_station: WNKS, Boston-based NBS-affiliated trid station.
    distribution: Licensed to more than 128 outlets; well known along much of the
      eastern seaboard and beyond.
    opening_sequence: Begins with a staged dark-alley rain scene and Martindale's
      on-camera introduction, followed by previews of investigations.
    transmission: Some shows are prerecorded, but most are transmitted live.
    editorial_focus: Sensational investigations of crime, famous people, sexual scandals,
      and corporations exploiting ordinary citizens, with subjects selected for audience
      appeal.
  reputation_and_limits:
    public_image: The narrator describes a gruff, outspoken, old-fashioned media figure
      who often frames himself as an investigator of injustice.
    libel_record_as_printed: The narrator reports fourteen libel cases upheld against
      him and two not proved; this is fictional sourcebook reporting, not an allegation
      about a real journalist.
    reliability: The narrator says some investigations uncover reliable misconduct
      while others reflect perceived conspiracies without adequate evidence.
    political_restriction: After an investigation involving two local UCAS senators
      in June, his producers barred further stories involving senior political figures.
    current_lifestyle: Reputation as a hard-drinking loner, keen sailor and game fisherman.
    residence_vessel: Night Spray, a boat where he has lived for half a decade since
      his divorce, usually moored at Port Norfolk or Dorchester.
