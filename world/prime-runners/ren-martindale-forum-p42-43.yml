data:
  subject: Ren Martindale, Media Jock
  posts_in_printed_order:
  - speaker: Williams
    posted: 15:48:04/09-28-55
    page: printed 42/PDF 43 continuing printed 43/PDF 44
    claim: Attributes Martindale’s recurrent broadcasts criticizing alimony, child
      support and perceived judicial welfare to his divorce from Marta Swenson. Claims
      a Suffolk County judge bore a grievance against Martindale, and reports he twice
      served short jail terms for missed child support; says Swenson successfully
      sued him for defamation after on-air statements about her and their son. Describes
      the derogatory indirect nicknames he reportedly still uses for Swenson.
    status: Williams allegation and personal criticism; not independent narrator-confirmed
      legal history.
  - speaker: Miranda
    posted: 23:07:17/10-01-55
    page: printed 43/PDF 44
    claim: Sarcastically argues that a father should meet his support obligations,
      and mocks Martindale’s attempts to seek sympathy.
    status: Speaker opinion.
  - speaker: Williams
    posted: 04:15:46/10-03-55
    page: printed 43/PDF 44
    claim: Alleges Martindale has drawn substantial physical hostility from subjects
      of investigation, including an attack by several bat-carrying people following
      a New Jersey exercise-spa investigation and repeated shootings, stabbing, and
      beatings. Says bounties were placed on him but few local criminal figures tried
      to collect.
    status: In-world attributed report, not separately verified narrator chronology.
  - speaker: January
    posted: 01:15:11/10-04-55
    page: printed 43/PDF 44
    claim: Jokes that a slow WKNS news week prompts Martindale and Gash to invite
      fresh stories and offer ready financial incentives.
    status: Sarcasm, not a documented offer or procedure.
  - speaker: Slater
    posted: 06:55:32/10-11-55
    page: printed 43/PDF 44
    claim: Defends Martindale and Alfie Gash as useful contacts for runners. Alleges
      that in autumn 2051, Dryden Steel’s board initiated a sustained program of covert
      runner-led actions against purported rival KRN Inc. The speaker characterizes
      this as a scheme to eliminate several leading runners; two runners then alerted
      Martindale, who publicized the operation along with additional alleged illegality
      by Dryden Steel executives, reportedly triggering a stock crash damaging Dryden
      Steel. Slater explicitly describes the original two informants as self-interested
      while asserting the exposure had a positive public outcome.
    status: Speaker’s account, not independently established source narrator fact.
  - speaker: George Liquor
    posted: 03:19:15/10-13-55
    page: printed 43/PDF 44
    claim: Mocks the mention of Ren and his cameraman by a singsong remark.
    status: Humorous reaction, not factual testimony.
  - speaker: J.P. Morgan
    posted: 03:28:18/10-14-55
    page: printed 43/PDF 44
    claim: Dismisses Martindale and Gash as nostalgic simsense obsessives and advocates
      leaving them to be punished by opponents.
    status: Hostile opinion, not a statement that an event occurred.
  attribution_rule: Each line is attributable only to its printed pseudonymous speaker.
    Distinguish the main biography narrator’s statements from independent forum allegations.
    Preserve printed chronological order as presented.
