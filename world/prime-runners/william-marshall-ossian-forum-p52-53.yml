data:
  subject: William Marshall Ossian (Billy Ossian / Oz-man), fictional rock star
  printed_section: In-world forum commentary associated with William Marshall Ossian
  original_page_anchors:
  - printed_page: 52
    pdf_page: 53
    location: right column following narrator biography
  - printed_page: 53
    pdf_page: 54
    location: left column and top of right column, before Hooks
  posts_in_print_order:
  - speaker: DJ Jeff
    timestamp_as_printed: 04:23:26/10-4-55
    printed_page: 52
    pdf_page: 53
    stance: Personal music criticism with attributed artist and collaborator information
    report: Recommends Anhedonia releases She Will Be Leaving (2051), Across a Thousand
      Blades (2052), and Sad-Eyed Angel Falls (2054), while judging the band's genre-blending
      music derivative and commercially calculated. Names fellow members Jerry De
      Wulf (keyboards), Ian I. Banks (keyboards), Paul Cline (percussion), and Angela
      Kostelanetz (vocals and keyboards). Says most members follow Ossian's direction,
      and repeats a rumor that Ossian records album tracks before they learn live
      performances; presents De Wulf as an exception because he helps design unusual
      keyboard rigs.
    epistemic_status: DJ Jeff's in-world review and report; the solo-recording practice
      is explicitly rumor, not narrator-confirmed
  - speaker: Nazir
    timestamp_as_printed: 12:00:34/10-5-55
    printed_page: 52
    pdf_page: 53
    stance: Unverified media-industry financial report and prediction
    report: Says media circles believe Chrome Damage is financially troubled after
      an extravagant tour and a costly delay in Ossian's completion of a recent ambitious
      record. Predicts major Californian music companies may purchase the business
      if it collapses.
    epistemic_status: Hearsay and conditional prediction, not independently established
      insolvency or acquisition
  - speaker: Beth B
    timestamp_as_printed: 00:07:38/10-7-55
    printed_page: 53
    pdf_page: 54
    stance: Counterclaim about secret financial support
    report: Replies that Chrome Damage would be badly overextended as an independent
      concern without strong support from unnamed sleeping partners in Tír Tairngire;
      reports that another source pays most costs and leaves Ossian free to concentrate
      on his art.
    epistemic_status: Reported rumor concerning unnamed backers, not confirmed financing
      arrangements
  - speaker: Shamu
    timestamp_as_printed: 03:12:20/10-7-55
    printed_page: 53
    pdf_page: 54
    stance: Sarcastic suggestion
    report: Suggests Kokura Biotech might be the financial source Beth B means, then
      sarcastically calls the suggestion an excessive disclosure.
    epistemic_status: Named in-world poster's insinuation, not proof of Kokura Biotech
      investment
  - speaker: DJ Jeff
    timestamp_as_printed: 04:14:50/10-7-55
    printed_page: 53
    pdf_page: 54
    stance: Investor speculation and local event notice
    report: Predicts Ossian and Edwin Pound will need fresh investment. Describes
      their new Portland venue Chrome Edge, gives its address as 112 NE Killingsworth,
      and relays word that Anhedonia plans a one-off official launch there on New
      Year's Eve, with a fashionable crowd expected.
    epistemic_status: Speaker prediction, address as reported by speaker, and unverified
      proposed event; not narrator-confirmed completion or attendance
  - speaker: Minna
    timestamp_as_printed: 01:54:44/10-19-55
    printed_page: 53
    pdf_page: 54
    stance: Report of a possible death and media coverage
    report: Says Janna Dream, described as a starlet and someone close to Ossian,
      was recently reported dead in a gutter outside the Chrome Stallion in San Francisco.
      Notes that some press coverage is publicly identifying Ossian as the club's
      owner.
    epistemic_status: Reports about a death, relationship, and press coverage from
      an in-world poster, not independent verification of death or responsibility
  - speaker: Ryder
    timestamp_as_printed: 18:08:19/10-19-55
    printed_page: 53
    pdf_page: 54
    stance: Speculation about why a reported death occurred
    report: Claims to have heard that Janna Dream's reported death was meant as a
      warning to Ossian from an unidentified person motivated by both romantic and
      business disputes.
    epistemic_status: Secondhand allegation about intention and perpetrator, not a
      confirmed cause or actor
  - speaker: Zanti
    timestamp_as_printed: 05:14:17/10-21-55
    printed_page: 53
    pdf_page: 54
    stance: Competing unverified explanation featuring gang involvement and coercion
    report: Counters that Janna Dream's reported death was intended as a warning to
      her from a former boyfriend who denigrated her. Says she had ridden with the
      Rituals, an in-world gang, and alleges that the group treated her as property
      and resented her decision to leave with another man. The source uses contemptuous
      gendered and ethnicized language for these people; the account's coercive ownership
      claim is the poster's characterization, not a statement that Janna consented.
    epistemic_status: Rival secondhand account and coercion allegation; former boyfriend's
      actions and the Rituals' involvement are unverified
  - speaker: Wolf
    timestamp_as_printed: 17:50:21/10-22-55
    printed_page: 53
    pdf_page: 54
    stance: Recaps conflicting reports and offers another political rumor
    report: Says both preceding accounts have circulated. Adds a rumor that Tír Tairngire
      authorities disapproved of a rising elven star's relationship with a famous
      human, because it might project an undesirable image to young local admirers.
    epistemic_status: Multiple rumors and a hypothesized official motive, not confirmation
      of any government role
  - speaker: Zag
    timestamp_as_printed: 02:02:30/10-23-55
    printed_page: 53
    pdf_page: 54
    stance: Question about travel privileges
    report: Asks how Ossian regularly travels into and out of Tír Tairngire while
      running a San Francisco club and performing concerts throughout America.
    epistemic_status: In-world rhetorical question, not evidence of an unlawful privilege
      or special arrangement
  - speaker: Card
    timestamp_as_printed: 03:13:12/10-23-55
    printed_page: 53
    pdf_page: 54
    stance: Skeptical follow-up and speculation about connections
    report: Disputes the claim that the travel is easy but suggests Ossian may have
      powerful connections, and wonders if he can operate his San Francisco club for
      a strategically important reason.
    epistemic_status: Speculative question; no confirmed sponsor, purpose, or travel
      permission
  - speaker: Karelis
    timestamp_as_printed: 12:07:31/10-24-55
    printed_page: 53
    pdf_page: 54
    stance: Conditional commercial explanation
    report: Suggests that if Ossian is profitable and the company is likely to expand,
      parties interested in its future revenues might be inclined to ease his travel
      or business access.
    epistemic_status: Hypothetical inference conditioned on profitability and growth,
      not established intervention
  attribution_and_assertion_boundaries:
    narrator_vs_forum: These are separately authored in-world comments with timestamps
      and individual speakers. They do not override the book narrator's Ossian biography.
    conflicting_death_accounts: Minna reports a death; Ryder, Zanti and Wolf circulate
      incompatible explanations for possible motives. Do not promote any account to
      established fact or suggest that Janna Dream consented to gang ownership.
    finance_and_investment: Nazir, Beth B, Shamu, DJ Jeff and Karelis make conflicting
      or conditional statements about company finances, possible funders and future
      opportunities.
    scenario_vs_report: The separately printed GM Hooks for Ossian's protection and
      investigations are optional fictional campaign premises, not confirmations of
      these rumors.
    fictional_world: All in-world characters, alleged events, companies, groups and
      political institutions are part of FASA's fictional Shadowrun tabletop RPG publication;
      not real-world allegations or advice.
