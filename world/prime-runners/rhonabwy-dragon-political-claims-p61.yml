data:
  person: Rhonabwy
  source_anchors:
  - printed_page: 61
    pdf_page: 62
    heading: Rhonabwy continuation; historical narrator and dated Matrix commentary
  narrator_accounts:
  - attribution: Narrator
    claim: Rhonabwy uses intermediaries with neural communication implants. The passage
      claims a complex audiovisual code must deactivate the implants before the couriers
      can disclose dealings, limiting third-party access to his plans. This is a fictional
      information-control claim, not a player procedure.
  - attribution: Narrator
    claim: He is politically active rather than simply isolationist; the narrator
      rejects the view that Rhonabwy indiscriminately attacks elves and instead portrays
      him as attacking concentrations of political control, including elven-led institutions.
  - attribution: Narrator
    claim: The narrator reports financial support to non-elf Protestant paramilitary
      factions in Tir na nÓg and financial backing to factions in Tir Tairngire opposed
      to the present Council of Princes; Rhonabwy is said to distrust Lofwyr.
  - attribution: Narrator
    claim: The author describes arms and logistical support to Swazi bandit groups
      near the Zulu Nation border, while noting that Rhonabwy simultaneously aids
      elven secessionists in northern Wales.
  - attribution: Narrator
    claim: 'His support to elven factions is conditional: he may support elves facing
      discrimination but oppose those in control when their authority is coercive
      or concentrated. The narrator says he also funds other metahuman groups, including
      groups using rigid social control.'
  - attribution: Narrator
    claim: His corporate finance interventions are described as seeking to undermine
      concentrated political influence in certain states; the fictional account includes
      sponsor-backed unrest against corporate authorities. This is an account of alleged
      motives and actions, not a real-world tactic recommendation.
  - attribution: Narrator
    claim: The author says Rhonabwy works through intermediaries, has allies and guardian
      spirits including named envoys, and sometimes recruits multiple runner teams
      with conflicting immediate assignments, using their interactions to learn about
      targets and loyalties.
  - attribution: Narrator
    claim: The narrator says his reach includes Aztlan, Tir Tairngire and the Caribbean
      despite his residence in Wales. These are source-period claims, not mechanically
      granted capabilities.
  forum_commentary:
  - speaker: Merchant Banker
    timestamp_as_printed: 22:27:02 / 06-30-55
    claim: Disagrees with an appearance of paradox in Rhonabwy’s political alignments;
      speculates that the dragon avoids fragile non-elven control structures, citing
      his intervention in West Rhine-Luxembourg mineral-water business.
  - speaker: Bitter Lemon
    timestamp_as_printed: 21:45:13 / 07-10-55
    claim: Asks whether Rhonabwy’s name is literal or dragon slang; no answer is established
      on this page.
  - speaker: Zeitgeist
    timestamp_as_printed: 00:00:00 / 07-23-55
    claim: Speculates that Rhonabwy’s international financial activities help explain
      how Welsh orichalcum reached some Caribbean League shamans; the causal link
      remains unconfirmed.
  - speaker: Bitter Lemon
    timestamp_as_printed: 22:15:30 / 07-15-55
    claim: Describes Rhonabwy as calculating and dangerous; subjective opinion, not
      neutral narrator confirmation.
  source_provenance_rule: Preserve Second Edition period and each speaker’s certainty;
    no transformation into current SR3 setting or practical real-world advice.
