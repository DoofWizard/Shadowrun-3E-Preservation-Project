  fictional_profession_and_history:
    role: The narrator calls her an exceptionally capable talismonger who sells and
      evaluates supernatural material in the Shadowrun game world.
    evaluation: The narrator describes her appraisals as honest and accurate, and
      her assessments of value as reliable; she does not tend to exploit buyers or
      sellers.
    research_specialty: She is particularly knowledgeable about Eastern European talismans
      and relics. She has spent several years excavating in southern Ukraine for reasons
      she declines to discuss. The narrator says what she finds there is not for sale,
      without establishing why.
    provenance_policy: She is reluctant to purchase stolen goods, especially from
      gangs and organized-crime groups. Before buying, she prefers to learn how an
      object was obtained. When asked only to appraise an item, she may not insist
      on its origin; her motivation is interest in the object rather than a blanket
      permission for wrongdoing.
    dealing_with_clients: She prefers honest, polite buyers, dislikes aggressive behavior
      and false expressions of interest, and expects reciprocal respect. She has a
      broad network of contacts who can locate rare supplies relatively quickly.
    fictional_risk: The narrator notes that a character buying from her need not fear
      being pursued by an item's hostile former owner; this is a source-period characterization,
      not a general immunity mechanic.
