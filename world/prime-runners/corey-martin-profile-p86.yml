  narrator_biographical_account:
    source_period_age: 17
    status: Orphaned, homeless young ork with a series of killings attributed to him
    narrator_attribution: The book describes Corey as directly or indirectly responsible
      for the deaths of more than 20 people, including both parents; the location
      of his current residence has not been conclusively established.
    family: He was born to a household of six existing children already dependent
      on welfare. The narrator reports that his parents and older siblings physically
      abused him.
    adolescence: Corey grew increasingly isolated, learned motorcycle repair from
      books or experimentation, and began making long trips by motorcycle lasting
      several days.
    evidence_boundary: The childhood account is presented as pieced together by federal
      agents from testimony by surviving Martin family members rather than direct
      eyewitness narration.
    first_attributed_victim: Investigators believe his first victim was Arlon Morrow,
      a homeless drifter whose body was found in a shallow stream near Norwood, west
      of Toledo.
    subsequent_sequence: Investigators believe Corey killed several more people before
      attacking members of his family.
    sister_testimony:
      witness: Layla Martin, Corey's sister
      testimony: Layla reported that their father attacked Corey upon his return from
        a trip, Corey fought him with a knife and the father died, and their mother
        and eldest brother Rowan then tried to restrain Corey.
      claimed_coercion: Layla testified that Corey demanded that she stop the two
        people restraining him; she initially refused but ultimately used her father's
        pistol against them before turning it on herself.
      aftermath: Layla briefly lost consciousness. She later found two deceased family
        members and Rowan alive but seriously injured; Corey had departed.
      certainty: Attributed surviving-witness testimony, not independent confirmation
        of all mental states or causal explanations.
    later_pattern:
      geography: Investigators traced the subsequent incidents around Ohio and north
        into Michigan.
      victim_groups: Travelling businessmen, female motel desk clerks and itinerant
        people; victims included humans and orks.
      columbus_period: Corey was reportedly part of an ork commune in Columbus for
        three months near the end of the previous year.
      prominent_victim: The highest-profile victim identified by the narrator was
        an elven senior executive of Pavis Systems Inc., a Toledo corporation.
      uncertain_whereabouts: Investigators believe Corey may live among itinerants
        in Detroit, where homelessness complicates attempts to locate him.
      narrator_forecast: Law-enforcement officials fear additional killings before
        his apprehension; this is a contemporary fear, not an established later event.
  source_authority_limits:
  - This is a fictional 2055 in-world narrator account from a historical Shadowrun
    Second Edition source, not real-world crime reporting.
