data:
  subject: Frank Marshall Wendall
  source_anchors:
  - printed_page: 74
    pdf_page: 83
  - printed_page: 75
    pdf_page: 84
  posts_in_print_order:
  - speaker: Icepick
    timestamp_as_printed: 14:54:32/09-28-55
    printed_page: 74
    claim: 'Says an Atlanta Police Force psychologist believes Wendall reacts to prospective
      cases unpredictably: he either declines after learning all the details or urgently
      pursues them. Alleges that payment depends on what clients can afford; says
      local officials suspect him but ordinary residents regard him as a troubled
      saint.'
    certainty: Secondhand clinical assertion and Icepick personal assessment, not
      a confirmed diagnosis.
  - speaker: Rewind
    timestamp_as_printed: 04:03:33/09-30-55
    printed_page: 74
    claim: Tells a tragic story in which Wendall’s police work displaced his wife
      and child; his former wife married a man described as kind but alcoholic; the
      second husband allegedly killed the child while intoxicated, and Wendall subsequently
      hunted down and killed that man while working as a runner.
    certainty: Explicitly qualified by Rewind as a story that may only be rumor; not
      an independently established family history or killing.
  - speaker: Slater
    timestamp_as_printed: 11:08:59/10-02-55
    printed_page: 75
    claim: Remarks that everyone knows the story just told by Rewind.
    certainty: Acknowledgement of circulating rumor; does not confirm it.
  - speaker: Rewind
    timestamp_as_printed: 05:01:14/10-03-55
    printed_page: 75
    claim: Replies that wide circulation does not make the story untrue.
    certainty: Argument about plausibility; no evidence offered.
  - speaker: Doog
    timestamp_as_printed: 22:44:01/10-03-55
    printed_page: 75
    claim: Believes Wendall still keeps a stilt house in the south near Highway 84
      west of Waycross; says would-be clients should not turn up at his door but contact
      acquaintances, and Wendall will respond if he wants the work.
    certainty: Hearsay and practical suggestion, location qualified by speaker’s uncertainty.
  - speaker: Io
    timestamp_as_printed: 00:22:54/10-14-55
    printed_page: 75
    claim: Says they heard Wendall was a major drug user.
    certainty: Unsubstantiated rumor, not established diagnosis or behavior.
  - speaker: Icepick
    timestamp_as_printed: 17:01:29/10-16-55
    printed_page: 75
    claim: Disputes Io’s allegation, arguing Wendall’s abilities are natural and describing
      him instead as a troubled man.
    certainty: Opinion and rebuttal, not independently proved.
  attribution_guard: Speaker-by-speaker uncertainties, chronology, negation and competing
    accounts are retained; neither family rumor nor alleged substance use becomes
    narrator-established biography.
  source_separation: Character statistics, equipment, Hooks and Notes appear on printed
    75/PDF84 and are separate from this forum record.
