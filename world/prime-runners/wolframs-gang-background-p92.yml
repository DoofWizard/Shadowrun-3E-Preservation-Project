data:
  section: Wolfram’s Gang
  source_anchor:
    printed_page: 92
    pdf_page: 101
    heading: Wolfram’s Gang
  setting: Post-quake New York, especially Manhattan, has law-enforcement departments
    preoccupied with each other’s activities and corporate inhabitants retreating
    to secured properties; the source describes opportunity for organized gangs.
  group_identity:
    name: Wolfram’s Gang
    official_name: None; bystanders and law-abiding people use Wolfram’s name as an
      unofficial label
    composition: Three-person group led by Wolfram, a troll
    members:
    - Wolfram
    - Shoot-to-Kill
    - Hammerhead
    area: Manhattan, New York; GM guidance permits relocation in play
    activities: Source describes armed robberies, coercive payments, illicit chip
      dealing, abductions, explosives expertise and contract violence. This is setting
      fiction rather than real-world advice.
  first_publicized_incident:
    time: Four years before the 2055 discussion in this section
    setting: Corporate wedding banquet in New York
    account: The gang prepared the banquet hall with explosives, stole jewelry, refreshments
      and the wedding cake, abducted the married couple, and escaped in the two most
      expensive sports cars on site despite a corporate-security pursuit. They collected
      a large ransom from NJG Cybersystems.
    status: Narrator’s description of fictional history
  subsequent_history: Since that early raid, the narrator credits the gang with theft
    of goods and money, kidnappings, and corporate blackmail; says Wolfram’s intelligence
    and the violent capability of his partners made the group unusually successful.
  source_claim_status: Narrator-established past and setting conditions, contrasted
    with separately attributed and disputed in-world forum remarks on printed page
    92.
