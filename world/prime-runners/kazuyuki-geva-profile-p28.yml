  identity:
    name: Kazuyuki Geva
    birth_date: February 7, 2029
    birthplace: Santa Rosa, California
    nationality_metatype_gender_as_printed: CFS/Asian Ork/Male
    current_residence: Saratoga, CFS
    height_cm: 177
    weight_kg: 68
    hair: Peroxide white
    eyes: Dark brown
    physical_features: Hair shaved at sides, plaited and braided at back; large burn scar on outside of
      right thigh.
    psychology_traits:
    - Ruthless
    - violent
    - borderline paranoid
    motive_label_quoted: '"Freedom fighter"'
    lifestyle: Low
  family_chronology:
    parents: Japanese parents naturalized as Americans, employed in the computer industry; Kazuyuki grew
      up identifying as American in a comfortable San Francisco apartment overlooking Candlestick Park.
    occupation: Japanese forces assumed control of San Francisco on his ninth birthday; his family initially
      hoped their Japanese connections would improve their prospects.
    goblinization: Geva became an ork one year after the occupation; his parents lost jobs due to the
      occupying authorities' institutional anti-metahuman prejudice.
    forced_displacement: Authorities compelled the family to surrender their home and relocate to a rundown
      Oakland condominium with hundreds of other displaced families, including those with ork and troll
      children.
    parents_deaths: Both parents' health declined and both died in 2046, within four months of each other;
      the source does not state the order.
  affiliations_and_incidents:
    adolescence: As a teenager Geva lived on the streets, supporting himself by shoplifting, mugging and
      deliveries for arms and chip dealers.
    underground: Recruited to the outer fringes of the anti-occupation Underground. Some members shared
      his hostility to the occupiers but rejected violent tactics.
    split: In 2051 Geva and his associates set off several bombs on BART tracks; the central Underground
      group banished Geva afterwards.
    faction: He founded the Burakumin, a breakaway group taking its name from a Japanese expression the
      narrator glosses as beggars and street people; he recruited around six trusted followers.
    members_characterization: The book narrator describes the followers as gangsters and runners, not
      political soldiers; they accepted Geva's rhetoric while seeking disruption and repeated bank robberies.
    police_confrontation: The narrator dates the shootout to 'last year', without a calendar year in that
      sentence. An SFPD squad challenged the gang while it was returning from testing heavy weaponry in
      hills beyond Concord. The gang killed seven officers; ensuing publicity forced it out of sight for
      a while.
  reported_objectives_and_certainty:
    stated_goal: Force Japanese occupying forces to withdraw from his home, by whatever means necessary,
      in the fictional source setting.
    apparent_strategy: The narrator says Geva apparently hopes to disrupt ordinary life so severely that
      Japanese security imposes harsh restrictions prompting a civilian uprising; this is his presumed
      intention, not a successful uprising.
    reported_effect: The narrator says the campaign has made little impact on the general population.
    media_portrayal: The in-world news organizations are described as portraying the Burakumin as a renegade
      ork terrorist group intent on maiming innocent humans. This remains an attributed portrayal, not
      a verified independent finding about every allegation.
    access_and_cover: The narrator says an ordinary Bay Area citizen barely notices Geva, especially in
      his usual disguise as a laborer heading to a shift. Passes from contacts still in the Underground
      seem to allow him and his associates almost unlimited access to many parts of the city; the apparent
      scope is qualified, not guaranteed access everywhere.
    prospective_rumor: Rumors of another more severe act were circulating; the publication does not confirm
      that any anticipated future attack happened.
  preserved_boundaries:
    fiction: Invented people, dates, associations and incidents in the historical published Shadowrun
      tabletop game setting; no claims concerning actual people or events.
    mechanic_reference: Exact historical Second Edition NPC mechanics and equipment are maintained separately
