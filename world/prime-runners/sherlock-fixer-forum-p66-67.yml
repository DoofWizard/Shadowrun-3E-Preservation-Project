data:
  subject: Sherlock, fictional ork fixer based in the DC area
  original_source_form: Four dated in-world forum comments interleaved between the narrator's
    biography on p66 and GM notes, Hooks, and rules on p67
  speakers_in_print_order:
  - speaker: Crusher
    timestamp_as_printed: 19:32:18/06-26-55
    printed_page: 66
    pdf_page: 75
    stance: Familiar recommendation and account of an alleged past legal proceeding
    claims:
    - Alleges Sherlock testified in a 2049 prosecution of the gang called Baudelaire's
      Bastards, whose alleged offenses included extortion and murders of business figures.
      The poster describes Sherlock as a remarkably accurate prosecution witness who
      helped put much of the gang away.
    - Says Sherlock acquired government-issued Fedpol body armor through the case.
      The origin and legality of that equipment are the speaker's report, not facts
      established by the source narrator.
    - Repeats a rumor of a police contact who passes Sherlock valuable confiscated
      items from criminals, adding that this is why his equipment is reliable and
      inexpensive. The poster does not establish an authenticated supplier.
    - Expressly claims Sherlock refuses to supply illicit drugs or BTL chips to clients.
    epistemic_status: Poster testimony, inferred motives and secondhand reports;
      not independently verified legal case history or narrator-confirmed police conduct
  - speaker: Majeure
    timestamp_as_printed: 21:00:11/07-10-55
    printed_page: 66
    pdf_page: 75
    stance: Corrective aside about accent and films
    claims:
    - Says Sherlock attempts to imitate an English accent, without presenting him
      as a genuinely English speaker.
    - Confirms the speaker's impression that Sherlock loves vintage movies.
    epistemic_status: In-world speaker's characterization, separate from narrator
  - speaker: Shandor
    timestamp_as_printed: 02:17:51/07-17-55
    printed_page: 67
    pdf_page: 76
    stance: Brief recommendation focused on community ties
    claims:
    - Recommends sending an ork to conduct dealings with Sherlock, asserting that
      he prefers to deal with other orks.
    epistemic_status: Speaker's ethnic/metatype preference allegation, not an
      unconditional rule for gamemasters or a narrator-certified restriction
  - speaker: Gnasher
    timestamp_as_printed: 01:18:32/07-27-55
    printed_page: 67
    pdf_page: 76
    stance: Humorous skepticism about casino advantage
    claims:
    - Claims Sherlock is barred from most or virtually all blackjack operations
      in Washington, DC, and appears in databases shared by the fictional casinos.
    - Attributes the bans to photographic recall of every revealed card, while
      arguing that Sherlock lacks the calculation speed and gaming skill to exploit
      such memory for a consistent gambling edge.
    - Jokes that he would be expelled from a casino almost immediately, including
      gaming premises in his own home neighborhood.
    epistemic_status: Unverified casino-ban gossip and jocular assessment, not a
      new tabletop gambling bonus, penalty or hard rules override
  source_distinctions:
    narrator: The book narrator describes Sherlock's personal history and memory
      on printed p66; these claims remain distinct speaker opinions on pp66-67.
    source_rules: Game statistics, equipment, price percentages, target numbers,
      special skills and availability options are separately preserved with exact
      historical Second Edition values.
    optional_gm_hooks: Hypothetical GM encounters and Sherlock's police contact
      appear separately in the campaign guidance; no forum allegation is proof
      that every proposed fictional scenario occurred.
    period_and_media: Dates use in-world 2055 board stamps; the original publication
      is the 1994 FASA sourcebook with printed pp66-67 mapping to PDF75-76.
