  identity:
    display_name_as_printed: “Alfredo Garcia”
    name_status: The published name appears in quotation marks; the source does not
      establish a birth name.
    role: Barman at the Technicolor Yawn
    nicknames: Some patrons address him as Alf or Fred.
    birth_date: Unknown
    birthplace: Unknown
    nationality_metatype_gender_as_printed: Salish Shidhe/Sasquatch/Male
    current_residence: London, UK
    height_cm: 269
    weight_kg: 143
    hair: Dark brown (fur)
    eyes: Brown
    distinguishing_physical_description: Sasquatch
    psychology_traits_as_printed:
    - Sociable
    - Friendly
    - Slightly wary
    - Expansive
    motivations_as_printed: Unknown
    lifestyle_as_printed: Middle
  known_personal_history:
    recruitment: Gwendolyn Robinson, owner of the Technicolor Yawn, charmed Alfredo
      during a visit to Spokane. He traveled to London to work at her bar.
    social_context: The narrator calls Alfredo lonely when Robinson meets him in Spokane.
      The source does not establish social isolation, a birth history or a prior employer.
    immigration_uncertainty: The source does not establish how his entry to Britain
      was arranged; a separate in-world comment raises the question.
  work_and_interaction:
    venue: Technicolor Yawn, a noisy Australian-themed bar in Earl’s Court, London.
    bar_service: Alfredo is an unusually accomplished cocktail mixer; the narrator
      highlights his dexterity and dancing while preparing drinks and says he never
      forgets a recipe, in contrast to the venue’s predominantly lager-drinking clientele.
    understanding_and_communication: The narrator says Alfredo cannot speak aloud
      but can understand patrons’ conversations. Some visitors mistakenly take his
      silence for inability to comprehend, while he can write perfectly well; sign
      language is also mentioned as helpful.
    hearing_and_social_insight: He overhears discussions among socialites, runners
      and Johnsons despite patrons believing the room’s noise or his silence shields
      them. His heightened hearing is represented mechanically in a separate exact-statistics
      record.
    trust_and_discretion: After getting to know someone who is regularly friendly
      and courteous, Alfredo may share interesting information. Sharing is conditional,
      not an established exchange or a guaranteed response.
    presentation: The source urges respectful roleplay, noting Alfredo dislikes being
      patronized and is decent, kind and honest.
  personal_interests:
    astronomy: He treasures an old gold-banded mahogany telescope and a large fold-out
      map of the northern sky, uses the former to study the stars, and finds the scale
      of the universe difficult to express.
    screen_arts: He enjoys old Hollywood musicals and silent movies.
    trid_technology: Despite enjoying cinema, he does not understand trid units well,
      owns no trid recorder or playback unit and may respond warmly to patient instruction
      in using one.
  magic_identity:
    narrator_status: The narrator establishes that Alfredo is a Dog shaman but only
      dimly realizes it.
    practice: His magical effects are described as intuitive rather than based on
      clear technical understanding.
    scenario_conditional: The notes predict a favorable response to runners who include
      a Dog shaman; this is optional campaign guidance, not a recorded encounter.
    mechanics_boundary: Exact spells, magical attribute, special skills and reach/hearing
      modifiers remain in rules/prime-runners/alfredo-garcia-stats-p22-23.yml rather
      than being silently restated or converted here.
  source_distinctions:
    narrator_vs_commenters: Birth, appearance, activities and reported habits above
      are narrator-established profile content. Separately attributed claims about
      immigration, naming and Friday cabaret work remain in world/prime-runners/alfredo-garcia-forum-p22-23.yml,
      not promoted here to independent facts.
    recruitment_vs_business_conduct: His recruitment and residency are biographical;
      the owner’s separate trade and Alfredo’s response to it are preserved in references/prime-runners/alfredo-garcia-guidance-p23.yml.
      Do not infer that he caused or approved the owner’s activity.
    historical_edition_only: No SR3 conversion or later-edition supersession is claimed.
