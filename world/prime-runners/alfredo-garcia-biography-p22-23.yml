summary: Source-reviewed archival biography of the fictional sasquatch bartender in
  FASA's published 1994 Shadowrun tabletop RPG supplement Prime Runners. Printed pages
  22-23 correspond to PDF pages 23-24. Character details concern the game setting,
  not a real individual; exact Second Edition statistics, attributed forum posts,
  venue history and campaign guidance remain in separate linked records.
