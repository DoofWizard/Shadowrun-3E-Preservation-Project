  identity_as_printed:
    public_name: McBean
    first_name: Long forgotten, according to the narrator.
    birth_date: June 17, 1987
    birthplace: Centralia, Washington, UCAS
    nationality_metatype_gender: UCAS/Mixed-Race (American Indian/Caucasian) Human/Male
    current_residence: Shrine Pass, Colorado, Ute Nation
    height_cm: 185
    weight_kg: 75
    hair: White
    eyes: Blue-yellow
    physical_features:
    - Long, off-white, straggly hair
    - Weather-beaten skin
    - Arthritic hands
    - Slight, constant hand tremor
    personality_traits_as_printed:
    - Curious
    - High-spirited
    - Devil-may-care personality
    - Seemingly fearless
    - Alcoholic
    motivations_as_printed: Inscrutable
    lifestyle: Low
  early_journalism:
    historical_periods: The narrator places McBean's reporting around the Awakening,
      the Night of Rage and the rebuilding of the former American nations.
    career_start: Worked as a journalist for a succession of short-lived multimedia
      magazines, which lacked reliable advertising and contributors, while developing
      an ability to write forceful stories rapidly.
    later_employer: Joined the political magazine New Rolling Stone as a staff writer
      and covered conflicts, parties, rock bands, New York food riots and disputed
      political campaigns in an idiosyncratic style.
    family_heritage: The narrator reports McBean told friends that his mother was
      half Crow Indian; the book does not independently document that ancestry.
  howling_coyote_and_tribal_history:
    great_ghost_dance: The source narrator says McBean accompanied Daniel Coleman,
      also called Howling Coyote, to the Great Ghost Dance at Abilene in 2011, risking
      his life to relay the event; the resulting account appeared only years later.
    underground_period: In 2012 he disappeared with Howling Coyote and returned about
      two years later as part of Coyote's supporting cadre.
    treaty_of_denver: After the Treaty of Denver, McBean became involved in conflict
      over the Sovereign Tribal Council, later criticizing members who opposed political
      power for Native Americans with less than full-blood ancestry.
    later_article: He reappeared in New Orleans in late 2021 with a Time feature describing
      a close friend's goblinization, as named in the original fantasy setting.
  writing_and_politics:
    gonzo_book: His cult-classic Looking for Gonzo continued Jerry 'Gonzo' Petersen's
      experience becoming a troll and confronting others' prejudice, according to
      the narrator.
    political_employment: He served for a period as assistant to Louisiana Governor
      Edna Wallace, later left despite possible advancement and subsequently alleged
      discrimination against a non-Southerner and a Native American in political posts.
    later_book: The narrator calls In Search of Howling Coyote critically acclaimed
      and describes it as a semi-fictionalized search for family origins with a character
      modelled on Daniel Coleman.
    move_west: His reported research and personal history led him to a residence at
      the eastern edge of the Ute Nation, just west of Denver.
  retreat_and_present_reports:
    reduced_contacts: The narrator says McBean has had much less contact with wider
      society during the previous decade; after rare erratic stories he stopped filing
      articles.
    old_rumor: Younger journalists circulated an unverified belief that he had sealed
      himself indoors with supplies, dogs and firearms while waiting for catastrophe.
    sightings: More recent local observers reportedly see McBean hunting and scavenging
      near Highway 6, with occasional potshots at traffic; these are third-party reports,
      not a confirmed record of attacks.
    appearance: The narrator describes weathered, folded skin and a wild, unkempt
      traditional-hermit appearance.
    recollection: Despite isolation, he is said to remember important past events
      in unusual detail.
  separate_accepted_classes:
    exact_game_statistics: rules/prime-runners/mcbean-stats-p46-47.yml
    forum_attributed_claims: world/prime-runners/mcbean-forum-p47.yml
    campaign_guidance: references/prime-runners/mcbean-guidance-p47.yml
  historical_fiction_boundary: All people, imagined events, ancestries, institutions
    and past-world chronology in this record belong to the 1994 tabletop RPG setting
    and are not real-world historical assertions or advice.
