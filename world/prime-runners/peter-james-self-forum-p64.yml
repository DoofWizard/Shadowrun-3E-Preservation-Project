  attributed_comment:
    speaker: Cobalt Blue
    timestamp: 04:19:13/11-01-55
    assessment: Praises Nobodies and recommends the novel despite suggesting ordinary readers may not understand
      it.
    novel_plot_description: Says the novel's central literary character is a young Rat shaman living
      in Milan with the aftereffects of childhood polio and a desire to get down in the dirt like a rat.
      The commenter says the character's ork identity becomes explicit on page 140, though readers may
      infer it earlier from the viewpoint. These are Cobalt Blue's claims about a novel-within-the-game.
    autobiographical_identity_speculation: The commentator parenthetically wonders whether the novel's
      central character represents Peter James Self himself; the book narrator does not settle that idea.
    community_and_reading_claim: The commentator makes a broad and unverified claim about American households
      not reading books for several decades; this is the speaker’s in-world rhetoric, not a narrator-established
      statistic.
  authority_boundary: The claims are statements by one fictional 2055 board commentator about another in-world
    novel, not independent real-world facts or a reliable synopsis of every detail of the book.
