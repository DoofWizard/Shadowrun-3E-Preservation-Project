  subject: Mary Jo Doonan
  posts_in_printed_order:
  - speaker: Ernie
    timestamp_as_printed: 18:08:25/10-5-55
    printed_page: 80
    pdf_page: 89
    claim: Ernie says he encountered a woman resembling Doonan, thought to be in her
      early thirties, blond and locally accented, while crewing a rigged vessel called
      Nowhere Girl that carried assault rifles to Mobile. The speaker describes her
      as controlled and professional.
    encounter: Ernie alleges that she announced an unplanned cargo stop, and she and
      her companions insisted when the crew objected. Ernie says the crew lacked an
      effective choice, and that they met another vessel and exchanged five small
      crates for a holdall he assumes contained money, before returning ashore.
    crew_and_followup: Ernie says two very large troll deckhands accompanied her;
      he received an apology for the disruption, but a later attempt to reach her
      for another job failed because the contact number was disconnected.
    certainty: First-person alleged encounter with uncertain identification, assumed
      cash, and claimed coercive pressure; none independently corroborated by the
      source narrator.
  - speaker: Sugar D
    timestamp_as_printed: 04:14:53/10-6-55
    printed_page: 81
    pdf_page: 90
    claim: Sugar D states a belief that Doonan has been taking increasingly regular
      runs, reports knowing people who dealt illicit chips through a well-stocked
      intermediary, and says unspecified men in plain dark suits and a sedan are questioning
      people.
    interpretation: The poster worries the activity may damage her secrecy and suggests
      hostile investigators could find her first; it does not independently verify
      who the questioning men are.
  - speaker: Skink
    timestamp_as_printed: 07:08:12/10-6-55
    printed_page: 81
    pdf_page: 90
    claim: Skink notes that swampy Louisiana terrain extends over more than a thousand
      square miles and suggests it could conceal a person.
    certainty: Poster suggestion about hiding terrain, not confirmation of Doonan's
      current residence.
  - speaker: Moon
    timestamp_as_printed: 08:14:23/10-6-55
    printed_page: 81
    pdf_page: 90
    claim: Moon argues that Doonan or her associates must interact with local traders
      and that many witnesses could leak descriptions, clothing details, names or
      likely locations to federal agents for reward money.
    certainty: Poster's inference and warning, not proof that an informant has reported
      Doonan.
  - speaker: King Snake
    timestamp_as_printed: 14:13:08/10-17-55
    printed_page: 81
    pdf_page: 90
    claim: King Snake alleges that two local runners, Ennio Franzetti and Jackie Forester,
      were found dead, face down in Lake Pontchartrain the previous year after publicly
      describing their contact for a major arms-smuggling operation. King Snake asserts
      they were murdered for revealing that contact.
    attribution_limit: The poster suggests Doonan arranged their disappearance, but
      offers inference rather than independent evidence of her involvement; neither
      name nor source allegation is silently turned into a confirmed homicide finding
      against her.
  - speaker: Cam
    timestamp_as_printed: 07:32:12/10-22-55
    printed_page: 81
    pdf_page: 90
    claim: Cam recommends consulting Most Wanted files from FedMat in Atlanta, says
      Doonan ranks near the top of a Have You Seen This Woman grouping, and says page
      6 encourages unsettling inferences.
    attribution_limit: The post does not reproduce the purported file or establish
      its allegations as fact.
  - speaker: Rouen
    timestamp_as_printed: 00:06:50/10-23-55
    printed_page: 81
    pdf_page: 90
    claim: Rouen proposes that Ernie's troll associates came from stilt-village communities
      across the Mississippi Delta, describes inhabitants as very large and partly
      Creole in origin, and suggests expertise with fishing nets and gutting knives.
    certainty: Poster speculation about the identity and community of particular in-world
      trolls; no identity or ethnic background is verified.
  - speaker: Bounty Killer
    timestamp_as_printed: 00:00:02/10-24-55
    printed_page: 81
    pdf_page: 90
    claim: Bounty Killer thanks Rouen and says the claim could be a lead to Doonan's
      whereabouts.
    certainty: Poster interpretation; the source does not confirm an actual location.
  source_voice_boundaries:
  - All speakers are fictional in-universe forum commenters reproduced in the published
    1994 tabletop RPG sourcebook; their statements are not real reports or real-world
    operational advice.
  - Ernie's account distinguishes his crew's compliance under pressure from voluntary
    agreement and does not establish the cash contents of the exchanged holdall.
  - King Snake's two named dead runners are a forum allegation, while assigning the
    deaths to Doonan remains the speaker's unproven inference.
  - Posters' later interpretations and Doonan location speculation remain distinct
    from the sourcebook narrator's character history and optional GM hooks.
