  social_and_professional_background:
    role: Young, wealthy would-be shadowrunner, described by the narrator as prominent on the East Coast
      novice circuit; not certified by the source as a competent professional.
    father: The late Arthur Peabody Dreyfuss, a Connecticut defense-telecommunications magnate.
    family_status: Erik is described as Arthur and his surviving mother's only child; after Arthur's
      death his mother became extremely protective.
    college: Graduated from an unnamed small private college near Providence. Harvard rejected him,
      to his family's displeasure; the source does not specify the precise chronology of that rejection.
    inheritance_and_management: Arthur bequeathed his corporation to Erik, but a committee chaired by
      Erik's mother currently manages it and will decide when he can assume control. The narrator doubts
      that transfer will occur soon.
    current_occupation: Erik spends considerable free time pursuing the identity and lifestyle of a shadowrunner,
      with access to money and equipment through his family resources.
    financial_arrangements: He lives in his family's ancestral home; a monthly trust fund covers purchases
      of current hardware and software. His day-to-day living expenses are provided for.
    technological_contacts: Contacts in his father's corporation sometimes give him experimental technology,
      including partially tested weapons; other contacts extend through multiple levels of the East Coast
      defense industry.
    narrator_evaluation: The narrator contrasts Erik's enthusiasm, material resources and desire for
      approval with his lack of reliable operational experience; forum criticisms are separately attributed
      in their own record.
  separation_of_claims:
    narrator_statements: Birth, residence, family arrangements, education, resources and contacts are
      presented in the publication's introductory narrative or printed profile.
    not_narrator_facts: Five hostile or sympathetic forum posts on this page express distinct speakers'
      opinions and are preserved separately as attributed_claim.
    not_procedural_rules: Exact character statistics and the page-21 Willpower (6) skillsoft/reflex activation
      test belong to separately reviewed Second Edition mechanical records.
    not_completed_future_event: Corporate handover is conditional on the managing committee and not asserted
      as having occurred.
