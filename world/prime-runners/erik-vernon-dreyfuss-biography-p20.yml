  Archival biography of an entirely fictional character in FASA's published
  Shadowrun: Prime Runners tabletop role-playing supplement (1994, Second Edition).
  All names, dates, places, family history, assets, affiliations and events
  refer to the invented Shadowrun game setting, not a real person. This
  reference preserves the printed character facts and attribution; game
