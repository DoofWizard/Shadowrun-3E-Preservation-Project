data:
  name: Rhonabwy [Welsh Great Dragon]
  source_anchors:
  - printed_page: 61
    pdf_page: 62
    heading: Setting narrator political context and conflicts
  narrator_interpretation:
  - The narrator portrays Rhonabwy as political, secretive and strongly involved with
    organizations and conflicts across multiple nations.
  - The narrator explicitly warns that characterizing Rhonabwy as simply hostile toward
    all elves would oversimplify his actions; opposing concentrations of power, rather
    than elf identity itself, is the proposed pattern.
  - When elves control a community or country, he frequently supports opponents of
    that control; when elves are oppressed or lack political power, he may support
    them.
  illustrative_political_actions_as_narrated:
  - Financial support for non-elf Protestant paramilitaries in Tir na nÓg.
  - Support for factions in Tir Tairngire opposed to incumbent Council of Princes
    powers, accompanied by specific suspicion of Lofwyr.
  - Arms and logistical support to some Swazi bandits at the Zulu Nation’s borders;
    narrator notes favorable relations between elves and other metahumans in that
    nation limit the scale.
  - Generous support for northern Welsh elven factions, especially secessionists.
  - Support to other metahuman groups in many countries, even when those groups exercise
    rigid and totalitarian local control.
  corporate_engagement_as_narrated:
  - Where a corporation gains unusual dominance in a state or country, Rhonabwy is
    portrayed as employing financial pressure and sponsorship of local terrorist activity
    targeting corporate executives to weaken that dominance.
  - The narrator cites Aztechnology’s unsuccessful involvement in parts of the Caribbean
    League as a possible analogy, without stating a confirmed causal attribution to
    Rhonabwy.
  intermediaries_and_deception:
  - Narrator describes conflicts with Rhonabwy’s opponents as generally indirect through
    parties’ representatives and allies.
  - Various allies, guardians and free spirits are said to associate with Rhonabwy,
    especially the spirit Johnsons who may recruit runners.
  - The narrator describes Rhonabwy’s occasional recruitment of multiple runner teams
    for conflicting assignments, making it difficult to attribute their activities.
  narrator_distinction: These are source-period narrative descriptions, not real-world
    events or tactical directions; narrator interpretations and uncertain analogies
    remain labeled.
