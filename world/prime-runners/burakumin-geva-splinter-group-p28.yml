data:
  faction: Burakumin, the fictional splinter group founded by Kazuyuki Geva
  name_scope: This is the name used by the fictional character for his own faction;
    it is not a description of real-world communities who have used the term.
  source_anchor:
    printed_page: 28
    pdf_page: 29
    heading: Kazuyuki Geva (Terrorist)
  setting: San Francisco, California Free State, in the source-period fictional setting.
  origins:
    prior_association: After working among marginalized residents of Oakland, Geva
      joined the fictional anti-occupation Underground.
    separation: The narrator reports that when Geva and his associates conducted an
      attack on Bay Area transit tracks in 2051, he was expelled from the Underground's
      central group.
    founder: Kazuyuki Geva subsequently formed a separate faction he called the Burakumin.
    initial_recruits: Approximately six people whom Geva trusted to follow his leadership;
      the narrator portrays them as motivated primarily by disruption rather than
      a coherent political program.
  stated_and_attributed_purposes:
    founder_claim: Geva describes himself as resisting the occupying Japanese forces
      and seeking their withdrawal from his home.
    narrator_assessment: The narrator depicts the faction as pursuing destructive
      attacks and frequent bank robberies, and characterizes its rhetoric as distorted.
    public_response: According to the narrator, news organizations have depicted the
      faction as a renegade group whose violence harms bystanders; this describes
      their portrayal, not a legal finding.
    effectiveness_as_narrated: The narrator judges that the faction has not obtained
      substantial support from ordinary San Francisco residents.
  narrated_events:
    san_francisco_police: The narrator reports an encounter with SFPD officers near
      Concord, after which seven officers were killed, provoking publicity and a period
      of reduced public activity by the faction.
    reported_future_plans: Rumors of a more serious planned action are described as
      circulating; the source does not establish that such a future event occurred.
  attribution_and_limits:
    narrator_vs_commentary: The above description is the page 28 narrator account,
      not the separate, attributed in-world forum exchanges printed on page 29.
    no_operational_detail: This record indexes factional history and relationships
      rather than actionable attack methods or weapon-making instructions.
    edition: No claim that the organization persists unchanged into SR3 is made.
