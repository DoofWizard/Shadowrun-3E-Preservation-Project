data:
  provenance:
    printed_heading: Sherlock (Fixer)
    printed_page: 66
    pdf_page: 75
    narrator_scope: Historical fictional sourcebook narrator and identity panel, distinct
      from forum testimony and GM notes on pp66-67.
    page_mapping: After eight unnumbered color plates (PDF66-73), printed p66 maps
      to PDF75.
  identity_as_printed:
    known_name: Sherlock
    birth_date: November 16, 2031
    birthplace: Rockville, Montgomery, DC
    nationality_metatype_gender: UCAS/Caucasian Ork/Male
    current_residence: Rockville
    height_cm: 188
    weight_kg: 97
    hair: Black
    eyes: Brown
    distinctive_features: Missing little finger on left hand
    narrator_traits: Friendly; gregarious; easily bored; extraordinary mnemonic skill
    motivation: Sensation-seeker
    lifestyle: Low to Middle
  social_and_cultural_background:
    family_tie: The narrator identifies Sherlock as a distant cousin of the fictional
      Farrell the Barrel, described in the source as an unusually heavy ork in Washington
      DC.
    favorite_location: Frequently attends Farrell's Kingdom Seven nightclub.
    adopted_persona: Obsessively watches old black-and-white Sherlock Holmes films
      featuring Basil Rathbone; imitates the detective through tweed dress, deerstalker
      hat, affected English expressions and mannerisms.
    comic_confusion: The book narrator says he has also confused the detective Sherlock
      Holmes with Shakespeare's Shylock after watching Rathbone in a Merchant of Venice
      adaptation, leading to incongruous references to payment; a character misunderstanding,
      not a literal debt-collection threat.
  work_as_a_fixer:
    extraordinary_recall: Remembers remarkably precise details of old negotiations,
      people, the denomination of notes used as payment and serial numbers of firearms
      that he has seen, even after years.
    payments: The narrator says he does not accept credstick payments, allowing him
      to observe and later recall physical currency denominations.
    contact_brokerage: Remembers contact details and general interests of people offering
      work or seeking runners in and around DC and across UCAS or CAS areas, sometimes
      connecting parties as an information exchange.
    reputation: The narrator characterizes him as diplomatic and trustworthy, useful
      for introductions and nonexclusive goods but not the broker for military-grade
      weaponry or items found only in experimental shadowclinics and laboratories.
    information_storage: The source portrays his unusual memory as personal rather
      than a digital or cyberware database; the published game mechanics are preserved
      separately.
  source_boundaries:
    mechanics: rules/prime-runners/sherlock-fixer-stats-p67.yml
    optional_hooks: references/prime-runners/sherlock-fixer-hooks-p67.yml
    source_discussion: Statements made in the forum on printed pp66-67 are attributed
      to their speakers and not promoted here as narrator-established facts.
    archival_context: This record describes a fictional professional and imagined
      institutions in a tabletop role-playing book; it is not a real person's profile
      or instructions for obtaining illegal products.
headline: Fictional Shadowrun Second Edition fixer Sherlock — FASA Prime Runners (FASA7116,
