  fictional_history:
  - period: 1997
    narrator_account: The narrator says his family emigrated from Kowloon to London
      when the British Crown Colony of Hong Kong reverted to Chinese administration.
      London recession and anti-immigrant sentiment made lawful employment difficult
      for the arrivals.
  - period: Before 2006
    narrator_account: In central London's Overground, Kung Soo joined Zhing Wo, a
      London Tong controlling organized crime, initially acting as a street fighter
      protecting extortionists. He became an administrator and assistant to the local
      chief extortionist and drug dealer.
  - period: 2006
    narrator_account: The narrator says the local leader lost authority through internal
      infighting and Kung Soo replaced him.
  - period: 2006 to 2017
    narrator_account: Kung Soo organized much of Zhing Wo's illegal activities throughout
      London for more than a decade.
  - period: 2017
    narrator_account: During a violent conflict involving the Manchester-based Xiao
      Ziang family, Kung Soo switched his and his trusted associates' allegiance to
      the northern side, becoming its new London gang leader.
  - period: Thereafter through the source period
    narrator_account: The text calls him dominant over London's Tongs and says he
      rebuilt the city's organized-crime network, competing with Xiao Ziang and Si
      Peng family organizations.
  narrated_fictional_operations:
    categories: Gambling, illegal narcotics, illicit chips and bioware, firearms trafficking,
      assassinations, prostitution and extortion.
    local_power: The narrator attributes a substantial London organized-crime network
      to Kung Soo, rather than making a claim about any real-world person or organization.
    corruption: The narrator states he instigated widespread corruption among senior
      London police officers and almost certainly infiltrated smaller corporate security
      teams.
  temple_of_the_east:
    location: Panton Street corner near the main thoroughfare of London's Chinatown.
    establishment: A large upscale Chinese restaurant with an ornate tall building,
      simple signage, shuttered upstairs windows, dark-tinted restaurant windows,
      traditional dragon sculpture above the entrance and uniformed Chinese doormen
      at all hours.
    fictional_purpose: Narrator identifies it as the extended family's headquarters
      and a symbol of Kung Soo's standing.
  personal_description:
    presentation: Small, gray-haired, tan and unusually youthful-looking; often wears
      western clothing and likes modern pursuits.
    public_statement: According to the narrator, in a London Times interview five
      years before the source-period account, Kung Soo said he expected his organization's
      future to lie largely in manipulation of the Matrix rather than ownership of
      local businesses. This is the reported belief of a fictional interviewee, not
      a confirmed future outcome.
  distinct_source_classes:
