data:
  name: Wolfram
  role_as_printed: Street Shaman
  source_anchors:
  - printed_page: 94
    pdf_page: 103
    heading: Wolfram (Street Shaman), identity, psychology and narrator biography
  source_era_identity:
    birth_date_as_printed: June 29, 2027
    birthplace_as_printed: Staten Island, New Jersey, UCAS
    biography_birthplace_wording: Born on Staten Island; the narrative does not restate
      a state.
    nationality_metatype_gender_as_printed: UCAS/Caucasian Troll/Male
    current_residence: New York, UCAS
    stature_cm: 262
    weight_kg: 281
    hair: Shaved skull and eyebrows
    eyes: Brown
    distinguishing_features:
    - Bullet indentation along the upper-left area of the skull
    - Two bullet scars across the right thigh
    - Unusually long fingernails
    lifestyle: High
  source_described_personality:
    traits:
    - Cool
    - calculating
    - well-mannered
    - selfish
    - aesthetic
    - fastidious
    motive: Power-seeking
    source_characterization: The book describes his outwardly poised and cultivated
      personality alongside his deliberate, self-interested decisions and his willingness
      to use criminal violence.
    historical_psychology_term: The printed psychology field uses the label schizoid
      psychopath; this is the source's fictional characterization, not an external
      diagnosis.
  childhood_and_uncertainty:
    family: He was raised by his father, who worked in financial markets.
    early_history: The narrator says little is known of his childhood or early life.
    disputed_first_name: Rumor says his first name is Stephen, but the narrator says
      he never uses it; not independently established.
    shamanic_development: The source says the origin of his shamanic abilities and
      any association with others following the same totem are unknown.
  life_and_relationships:
    first_meeting_with_shoot_to_kill:
      timing: Before the gang's present source-era arrangement; no exact calendar
        date provided.
      place: A respectable apartment building in the Village, New York.
      financial_context: The narrator states he paid rent with proceeds from illicit
        activities, described broadly as corporate espionage and bank robberies.
    team_formation:
      associates:
      - Shoot-to-Kill
      - Hammerhead
      rationale: Wolfram judged that prospective targets could be exploited with his
        strategic and social skills combined with his two associates' physical capabilities.
      role: Leader and planner; source draws a distinction between his sophisticated
        corporate connections and his associates' physical roles.
      source_separation: The gang's broader history, roster and separate early incidents
        are preserved in organization records; they are not claimed here as independent
        biographical episodes.
    style_and_access:
      cultivated_image: Maintains an impression of education, wealth and personal
        dignity, including in difficult periods.
      social_interactions: The book contrasts his apparent polish with an emotionally
        reserved, intimidating presence.
      professional_connections: The source depicts him as comfortable dealing with
        business counterparts and social elites, but does not name particular patrons
        here.
  attributed_or_unverified_narrative:
    residence_rumor: Reports of a large luxurious apartment at the Cloisters in Newtown
      are explicitly called rumors; no residence is established there by the narrator.
    successes: The narrator states that the gang's few setbacks have not generally
      arisen from errors of Wolfram's planning; this is source-narrator appraisal
      rather than a quantitative performance statistic.
  cross_records:
    organization_history: world/prime-runners/wolframs-gang-profile-p92-93.yml
    forum_discussion: world/prime-runners/wolfram-street-shaman-forum-p94-95.yml
