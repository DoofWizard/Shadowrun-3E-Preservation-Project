    scenario_guidance: references/prime-runners/wolfram-street-shaman-guidance-p95.yml
    separation_rule: Dated forum opinions, game statistics, exact spells and scenario
      hooks are independent records; do not silently promote forum claims into biography
      or convert historical mechanics into SR3.
