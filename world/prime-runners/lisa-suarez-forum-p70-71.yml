data:
  subject: Lisa Suarez (Talismonger)
  forum_postings:
  - speaker: Cobalt Blue
    source_page: 70
    printed_timestamp: 04:12:17/09-12-55
    account: Reports a pair of princely-looking elves associated by the observer with
      Tir Tairngire visiting Lisa's Queens apartment. A couple of weeks later, the
      observer saw what seemed to be a similar pair, but with Irish accents; the poster
      conjectures they came from Tir na nOg. The later pair apparently stayed overnight
      and one left carrying a small parcel under a cloak. Lisa declined to explain
      the visitors; their identities and purpose remain unverified.
    certainty: Claimed firsthand sightings, speculative affiliations and motivations.
  - speaker: Scintillator
    source_page: 70
    printed_timestamp: 00:18:18/09-17-55
    account: Says Lisa has useful connections among Native American Nations, particularly
      shamans; the poster claims she has returned items stolen from them years before
      and refuses to traffic in such items. The poster describes her as scrupulous
      about provenance and helpful as a contact.
    certainty: Forum contributor's report, not independent narrator confirmation.
  - speaker: Ghost Man
    source_page: 70
    printed_timestamp: 01:51:58/09-20-55
    account: Asks why Lisa remains in New York.
    certainty: Question; does not establish a factual reason.
  - speaker: Sister Ray
    source_page: 71
    printed_timestamp: 03:17:11/09-27-55
    account: Suggests that Lisa might prefer solitude in a cabin farther north in
      UCAS, but speculates that customers would not travel there; also reports she
      likes opera and ballet, while doubting that high culture alone explains her
      decision to remain in New York.
    certainty: Speculation and claimed personal knowledge, not narrator-established
      biography.
  segregation: Narrator profile, optional adventure hooks, and mechanical statistics
    are separate sources of assertions; these posts do not upgrade rumors into verified
    events.
