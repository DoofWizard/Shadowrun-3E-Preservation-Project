  claims:
  - speaker: January
    timestamp: 00:19:18/10-7-55
    claim: Says Wolfram can match Shoot-to-Kill and Hammerhead in savagery but differs
      by deliberate restraint, strategic intelligence and varied responses to a situation.
    certainty: speaker assessment, not an omniscient fact
  - speaker: Arch
    timestamp: 20:08:02/10-8-55
    claim: Claims Wolfram enjoys theater and galleries, patronizes rising artists,
      and may use such refined company partly as an indulgence alongside his partners’
      brutality.
    certainty: in-world observation and speculation
  - speaker: Gage
    timestamp: 05:12:34/10-10-55
    claim: Disputes Wolfram’s cultivated benevolent image, characterizes the gang
      as dangerous criminals despite public affectations, and rejects the notion that
      cultured behavior excuses brutality.
    certainty: hostile opinion
  - speaker: Trump
    timestamp: 10:12:09/10-14-55
    claim: Reports meeting Wolfram several times and finding him charming, but suspects
      a concealed plan; interprets his goal as power and influence beyond the immediate
      thrill of violence.
    certainty: first-hand social observation combined with speculation
  attribution_rule: Keep distinct speakers, timestamps, attitudes and uncertainty.
    Forum claims do not become narrator-certified facts.
