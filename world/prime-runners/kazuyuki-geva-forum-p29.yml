headline: 'Fictional Shadowrun forum: Kazuyuki Geva — FASA7116 (1994), printed p29/PDF30'
summary: Source-reviewed eight posts from seven fictional speakers. Restores the age-seventeen allegation,
  removes an unsupported robbery, preserves the conditional rumor, and correctly attributes the final
  payment-related accusation to civilians rather than to the speaker.
