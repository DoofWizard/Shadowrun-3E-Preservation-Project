data:
  discussion_target: Kazuyuki Geva and Burakumin
  source_anchor:
    printed_page: 29
    pdf_page: 30
    section: Signed in-world forum posts
  comments_in_print_order:
  - speaker: Skid
    timestamp: 02:15:44/10-06-55
    certainty: Hostile opinion and figurative insult
    claim: Describes Geva as unstable and violent, using politics as an excuse for violence rather than seeking a stated political goal. The phrase "ten million bees short of a hive" characterizes him as irrational; it does not assert that a bounty exists.
  - speaker: Brandon
    timestamp: 12:41:09/10-08-55
    certainty: Opinion about criminal contacts
    claim: Says Geva has access to an arms supply network and can arrange unusually heavy fictional weaponry. Brandon claims Geva does not care who buys it and instead enjoys hearing the ensuing disorder.
  - speaker: Ween
    timestamp: 22:19:30/10-08-55
    certainty: First-person anecdote, not independently corroborated
    claim: Says the speaker's partner lost three fingers when Geva began throwing pins and grenades in multiple directions during a robbery in the downstairs room at ShadowJack's squatclub.
  - speaker: Aweder
    timestamp: 03:16:58/10-09-55
    certainty: Second-hand rumor and speculative contingency
    claim: Reports having heard that Geva hides in an abandoned condominium under Highway 101 near the airport, containing an arms cache that allegedly includes about half a dozen surface-to-air missiles. Speculates, without evidence of an actual event, that Geva might fire on aircraft if cornered by Imperial Marines.
  - speaker: Greyward
    timestamp: 00:10:15/10-11-55
    certainty: Attributed description of a fictional communiqué
    claim: Reports that the Underground formally disassociated itself from the violent actions of the Burakumin in a communiqué dated June 7, 2053; according to that communiqué, Geva is a gangster using the group's name while pursuing robbery and murder rather than its professed aims.
  - speaker: BrainDrain 400
    timestamp: 02:24:31/10-24-55
    certainty: Speculative mocking rumor
    claim: Guesses that a bridge could be the group's next prominent target and expresses eagerness for such an event; no attack or plan is established by the post.
  - speaker: Zuvuya
    timestamp: 02:34:32/10-24-55
    certainty: Rebuke and moral argument
    claim: Condemns the previous poster's indifference to civilians and rejects the idea that explosives resolve the political conflict; asks the poster to consider harm to innocent people.
  - speaker: BrainDrain 400
    timestamp: 02:38:02/10-24-55
    certainty: Self-interested rebuttal
    claim: Dismisses the concerns about civilian harm, says ordinary people cooperate with occupying forces, and explicitly prioritizes personal payment over their safety.
  source_limits:
  - These are eight signed in-world statements, not narrator-confirmed facts.
  - The spoken insult about bees is not a cash bounty, and no financial reward is attested by this source.
  - Rumored arms, a location, and an attack on aircraft remain assertions and speculation rather than verified occurrences.
  - The Underground statement is reported as a communiqué, not independently established history.
