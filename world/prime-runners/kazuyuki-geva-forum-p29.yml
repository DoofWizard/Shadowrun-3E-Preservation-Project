data:
  discussion_target: Kazuyuki Geva and Burakumin
  source_anchor:
    printed_page: 29
    pdf_page: 30
    section: Dated in-world forum discussion
  comments_in_print_order:
  - speaker: Skid
    timestamp: 02:15:44/10-06-55
    certainty: Hostile speaker opinion
    claim: Calls Geva a violent, unpredictable person without coherent political objectives; describes his politics
      as a pretext and his anger and behavior as dangerous. Uses the insult 'ten million bees short of a hive' to
      mean irrational; the speaker does NOT say that a reward or bounty has been offered.
  - speaker: Brandon
    timestamp: 12:41:09/10-08-55
    certainty: Subjective tactical assessment
    claim: Acknowledges Geva's instability but says his contacts might provide unusually heavy fictional armaments
      and that he does not scrutinize clients' purposes. These are the forum speaker's claims, not narrator-certified
      facts.
  - speaker: Ween
    timestamp: 22:19:30/10-08-55
    certainty: First-person anecdote
    claim: Says the speaker's partner was injured when Geva's mood suddenly changed during a robbery at ShadowJack's
      squatclub, with projectiles and explosives thrown in different directions; this is an attributed anecdote, not
      corroborated history.
  - speaker: Aweder
    timestamp: 03:16:58/10-09-55
    certainty: Unverified rumor
    claim: Alleges a hideout under Highway 101 near the airport, including a cache of military armaments; speculates
      about attacks on aircraft if Geva is cornered, without presenting verification or an observed event.
  - speaker: Greyward
    timestamp: 00:10:15/10-11-55
    certainty: Quoted fictional-organization communiqué
    claim: Says the Underground publicly disassociated itself from the Burakumin and accused Geva of using its name
      as cover for robbery and murder rather than its professed aims; cites a communiqué dated June 7, 2053.
  - speaker: BrainDrain 400
    timestamp: 02:24:31/10-24-55
    certainty: Speculative and mocking rumor
    claim: Speculates about a future high-profile target, perhaps a bridge; no later event is verified here.
  - speaker: Zuvuya
    timestamp: 02:34:32/10-24-55
    certainty: Rebuke and moral argument
    claim: Condemns the previous speculation, asks the poster to consider harm to ordinary civilians, and argues that
      indiscriminate explosives cannot solve the problem.
  - speaker: BrainDrain 400
    timestamp: 02:38:02/10-24-55
    certainty: Self-interested rebuttal
    claim: Rejects the rebuke, asserts that civilians are cooperating with occupying forces, and puts payment ahead
      of their safety; this is the speaker's own rationalization.
  safety_and_attribution_rule: All eight statements are dated in-world opinion, anecdote, rumor or argument. The figurative
    'bees short of a hive' expression must not become a factual cash reward. No rumored location, armament, planned
    attack, or casualty is independently verified.
