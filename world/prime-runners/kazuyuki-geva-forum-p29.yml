data:
  discussion_target: Kazuyuki Geva and Burakumin
  source_anchor:
    printed_page: 29
    pdf_page: 30
    section: Dated in-world forum discussion
  comments_in_print_order:
  - speaker: Skid
    timestamp: 02:15:44/10-06-55
    certainty: Hostile speaker opinion
    claim: Calls Geva dangerous, unstable and unmotivated by organized political plans;
      attributes incidents to rage and recklessness; claims a large reward has been
      offered.
  - speaker: Brandon
    timestamp: 12:41:09/10-08-55
    certainty: Subjective tactical assessment
    claim: Acknowledges Geva’s instability but says his contacts might obtain heavy
      fictional armaments and do not strongly screen customers; not narrator-certified.
  - speaker: Ween
    timestamp: 22:19:30/10-08-55
    certainty: First-person anecdote
    claim: Says Geva’s mood shifted during a ShadowJack squatclub robbery and fellow
      participants fled. The report is one speaker’s account.
  - speaker: Aweder
    timestamp: 03:16:58/10-09-55
    certainty: Unverified rumor
    claim: Alleges an airport-area hideout and a collection of military equipment,
      speculating that Geva might attempt an attack on aircraft if under pressure.
      Not independently established.
  - speaker: Greyward
    timestamp: 00:10:15/10-11-55
    certainty: Quoted fictional-organization communiqué
    claim: Says the Underground publicly disassociated itself from the Burakumin and
      accused Geva of pursuing predatory violence instead of its professed cause;
      cites a communiqué dated June 7, 2053.
  - speaker: BrainDrain 400
    timestamp: 02:24:31/10-24-55
    certainty: Speculative and mocking rumor
    claim: Predicts a future high-profile target, perhaps a bridge; no verified future
      event.
  - speaker: Zuvuya
    timestamp: 02:34:32/10-24-55
    certainty: Rebuke and moral argument
    claim: Tells BrainDrain 400 to consider ordinary civilian casualties and argues
      that indiscriminate explosives cannot fix social problems.
  - speaker: BrainDrain 400
    timestamp: 02:38:02/10-24-55
    certainty: Self-interested rebuttal
    claim: Rejects that criticism, rationalizes civilian losses as part of occupation,
      and prioritizes personal payment over the consequences; this is the speaker’s
      view only.
  safety_and_attribution_rule: All statements are historical in-world claims about
    fictional events; do not treat hideout/weapon rumors or hypothetical attacks as
    verified narrator facts or practical advice.
