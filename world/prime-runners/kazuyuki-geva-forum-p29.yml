data:
  discussion_target: Kazuyuki Geva and Burakumin
  source_anchor:
    printed_page: 29
    pdf_page: 30
    section: Signed in-world forum posts
  comments_in_print_order:
  - speaker: Skid
    timestamp: 02:15:44/10-06-55
    certainty: Hostile opinion and unverified personal allegation
    claim: Calls Geva unstable, without real plans, and driven by rage; says politics supplies an excuse
      for violence in crowded places. Alleges Geva has been a beetlehead since seventeen and sometimes
      thinks only of his next score. The bees-and-hive insult describes irrationality, not a monetary
      bounty.
  - speaker: Brandon
    timestamp: 12:41:09/10-08-55
    certainty: Attributed assessment of contacts and motives
    claim: Tentatively accepts Skid's warning but argues these are exceptional times. Says Geva has a
      contact on an arms-supply network who can obtain heavy weaponry; alleges Geva is indifferent to
      the buyer's identity and wants to hear that the buyer causes mayhem.
  - speaker: Ween
    timestamp: 22:19:30/10-08-55
    certainty: First-person anecdote, not independently corroborated
    claim: Says the speaker's partner lost three fingers when Geva threw grenade pins and grenades in
      different directions in the downstairs room of the ShadowJack squatclub. The post does not state
      that a robbery was occurring.
  - speaker: Aweder
    timestamp: 03:16:58/10-09-55
    certainty: Hearsay about a location and a conditional intention
    claim: Reports hearing that Geva's hideout is an abandoned condominium under Highway 101 near the
      airport, with an alleged stockpile including half a dozen surface-to-air missiles. Says supposedly,
      if anything goes wrong, Geva is ready to barricade himself there and attack aircraft until Imperial
      Marines come for him. No such attack, verified cache or enacted plan is established.
  - speaker: Greyward
    timestamp: 00:10:15/10-11-55
    certainty: Attributed account of a fictional communique
    claim: Reports that a communique dated June 7, 2053 formally dissociated the Underground from the
      murderous actions of the faction calling itself Burakumin. Attributes to the Underground the judgment
      that Geva is a gangster devoted to robbery and murder, and that the Underground shares none of his
      group's professed aims.
  - speaker: BrainDrain 400
    timestamp: 02:24:31/10-24-55
    certainty: Reported street rumor and the speaker's approval
    claim: Reports street gossip that the next target will be a major one, possibly a bridge. Expresses
      eagerness and approval of anything that angers the Imperial Marines; this does not establish an
      actual target or attack.
  - speaker: Zuvuya
    timestamp: 02:34:32/10-24-55
    certainty: Moral rebuke and argument, not an independent incident report
    claim: Rebukes the preceding speaker as immature and invokes innocent civilians, orphaned children,
      and people maimed or injured. Rejects treating events like a John Wayne film and rejects the idea
      that detonating simple explosives solves the problems.
  - speaker: BrainDrain 400
    timestamp: 02:38:02/10-24-55
    certainty: Attributed moral rationalization and contempt
    claim: Challenges the civilians' innocence because they work for occupying forces, argues they could
      refuse that work and keep a clean conscience, and instead judges money more important to them. Expresses
      contempt for ordinary people. The money claim concerns those civilians' supposed priorities, not
      an explicit claim that the speaker is being paid.
  source_limits:
  - Eight signed posts from seven distinct speakers; none is promoted to narrator-confirmed fact.
  - Preserve allegations, hearsay, conditional intentions, estimates, questions of innocence and opposed
    moral positions as attributed.
  - The bees insult is not a bounty; the grenade anecdote does not establish a robbery.
  - Fictional locations and violent incidents are indexed as source claims, not operational instructions.
  related_records:
  - npc.prime_runners.kazuyuki_geva.sr2_profile
  - rules/prime-runners/kazuyuki-geva-stats-p28-29.yml
