data:
  organization: Microdeck Industries
  source_anchors:
  - printed_page: 24
    pdf_page: 25
    heading: Alexander Tyrell Gates (Decker)
  - printed_page: 25
    pdf_page: 26
    heading: Hooks
  ownership_and_leadership:
    ownership_as_narrated: Owned by the Gates family and directed through six generations
      of that family.
    chairman: Brian W. Gates III
    research_director: Jeff R. Gates, younger brother of chairman Brian W. Gates III
    research_programmer: Deborah, wife of Brian W. Gates III and one of the advanced
      research department’s chief Matrix programmers
    family_relationship: The source explicitly identifies Alexander Tyrell Gates as
      the eleven-year-old son of Brian and Deborah.
  business_as_characterized_by_narrator:
  - Leading producer and publisher of affordable contemporary computer software, known
    for design and marketing.
  - Operates an advanced research department regarded as a testing ground for forward-looking
    programming and Matrix construction.
  research_and_projections:
  - Research staff conducted a carefully controlled test of prototype infant-level
    virtual playroom software involving Alexander at the age of three months.
  - The narrator portrays Alexander as exploring the firm’s internal Matrix environment
    and subsequently other parts of the Matrix; these are setting claims, not a bypass
    algorithm or a game test.
  - The narrator expects Microdeck to take greater interest in Alexander’s abilities
    as he grows and to channel those abilities toward future research through activities
    portrayed to him as play and schooling; this is a projection, not a completed
    program or result.
  source_internal_attribution_caveat: Printed page 25 later calls Alexander the child
    of the firm’s second most powerful man without naming him in that sentence. That
    ranking appears inconsistent with printed page 24 identifying Brian as chairman
    and father; do not silently equate the later unnamed person with Jeff or invent
    an explanation.
