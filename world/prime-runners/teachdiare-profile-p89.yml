    fictional_setting: 2055 Shadowrun cyberpunk tabletop role-playing game
  subject: Teachdiare
  printed_label: Assassin
  anchors:
  - printed_page: 89
    pdf_page: 98
    section: Identity panel and main narrator biography
  - printed_page: 91
    pdf_page: 100
    section: Notes, personality and motivations
  printed_identity_panel:
    date_of_birth: Unknown, believed circa 2011
    birthplace: Derry, Ulster, Tir na nÓg
    nationality_metatype_gender: Caucasian Elf/Male
    passports_reported:
    - Ukrainian
    - Irish
    - Tir Tairngire
    - British
    - Azanian (Cape Republic)
    - other possible nationalities
    residence: Unknown
    height_cm: 196
    weight_kg: 85
    hair: Dark blonde, frequently dyes it
    eyes: Light blue, uses corneal filters to change appearance
    distinguishing_feature: A 33-centimeter scar running almost the full length of
      the left forearm
    lifestyle: High to Luxury
    psychology_panel_as_printed:
      traits: Cold and aloof, little capacity for rapport; the text uses the stigmatizing
        term schizoid psychopath and alleges indifference to the age of targets, contrasted
        with tenderness toward cats and affection for the art of Vincent van Gogh.
      motivations: Unknown
      authority: Source's fictional identity panel characterization, not a real-world
        clinical finding or independently proven diagnosis.
  main_narrator_description:
    prowess: The book portrays Teachdiare as exceptionally fast and stealthy, highly
      capable with a sniper rifle and in unarmed combat, and prepared to leave before
      witnesses react.
    rhetoric_boundary: Descriptions of firing several shots before anyone else moves
      are qualitative fictional narration, not a new measured initiative or rate-of-fire
      mechanic.
    name: The book says his name means messenger in Irish Gaelic; what message, if
      any, he carries is unknown.
    origin_and_allegiance: Described as Irish by birth, with no established proof
      whether he serves the Tir na nÓg government.
    political_theories:
      visible_augmentation: His cyberware is said to contrast with Tir na nÓg elven
        ideology and the Northern Path physical-adept model.
      suspected_provision: The narrator reasons conditionally that, if half the reports
        about his augmentations are true, access to customized clinics may suggest
        backing by influential Tir na nÓg interests.
      hypothetical_controller: Some observers believe government officials deploy
        him, but no specific government patron is verified.
    inconsistent_public_accounts:
      languages_or_accents: Witnesses variously report Irish, Azanian Afrikaner and
        Eastern European accents, among others; these incompatible descriptions are
        not reconciled into one public identity.
      memory_issues: Accounts are described as difficult to verify because witness
        recollections sometimes require hypnosis; the narrator suggests Teachdiare
        can rapidly hypnotize witnesses.
    reported_clients: The narrator says Teachdiare has been known to work for corporate
      interests, without establishing an exclusive employer.
    hostility_to_aztechnology: He is rumored to dislike Aztechnology, to have killed
      at least five Aztechnology executives or technical experts, and to be the subject
      of a 250000-nuyen corporate bounty. The claimed events and reward are treated
      as source-period narrative reports.
    associates: Some reports say he occasionally works with other shadowrunners on
      missions he would undertake independently; the source portrays these as rare
      arrangements.
  notes_section_portrayal:
    natural_metatype_sense: The gamemaster notes explicitly state that he has natural
      Low-Light Vision as an elf; exact rule treatment remains in the linked statistics.
    unusual_equipment_access: The notes report he obtained customized bioware through
      elite Tir na nÓg shadow clinics and cite the older Tir na nÓg sourcebook, printed
      p152; this raises political questions, without independently identifying a government
      handler.
    behavior: The notes portray normally calculating detachment interrupted by unpredictable
      emotional episodes involving unseen enemies, described by the source as mad
      passions. The gamemaster determines their frequency rather than the text prescribing
      a probability.
    programming: The gamemaster notes attribute his attitudes to eugenic and psychological
      programming endured in Tir na nÓg, and say that perceived anti-elven factions
      and persons can provoke action.
    overriding_preference: Opposition to Aztechnology is singled out as a particularly
      strong motivation, while the identity-panel entry leaves the full motivation
      unknown.
    certainty_boundary: This gamemaster-facing fictional characterization must remain
      distinct from rumors about specific assassinations or undisclosed sponsors.
  connected_accepted_records:
    reader_commentary: world/prime-runners/teachdiare-forum-p89-90.yml
    optional_game_hooks: references/prime-runners/teachdiare-hooks-p90.yml
    exact_second_edition_statistics: rules/prime-runners/teachdiare-stats-p90-91.yml
    ring_artifact_and_exact_use_procedure: equipment/prime-runners/teachdiare-ancient-gold-ring-p91.yml
  authority_boundary: The source's fictional narrator biography, pseudonymous message-board
    accounts, potential scenarios, and exact Second Edition mechanics have different
    evidentiary statuses; none constitutes a real-world profile or inferred Shadowrun
    Third Edition revision.
