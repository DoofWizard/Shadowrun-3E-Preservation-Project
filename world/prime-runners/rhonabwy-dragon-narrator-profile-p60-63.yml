data:
  name: Rhonabwy
  designation: Welsh Great Dragon
  chronology_and_identity:
    source_page: {printed: 60, pdf: 61}
    birth_date: Unknown; first public appearance February 22, 2012
    birthplace: Unknown
    species_gender: Great Western Dragon / Male
    nationality_field: Not applicable
    residence: Llandovery, Wales, UK
    shoulder_height_m: 4
    total_length_m: 28
    tail_length_m: 24
    weight_kg: 737
    skin: Scarlet, small-scaled
    eyes: Green
    distinctive_features_field: Source's joking response is 'Yeah, right'; no
      discrete additional physical feature is identified.
    psychological_traits_as_printed:
    - Secretive
    - Territorial
    - Fast learner
    motivation_as_printed: Pseudo-anarchist
    lifestyle_as_printed: Extreme Luxury
  arrival_and_territory:
    source_page: {printed: 60, pdf: 61}
    awakening_location: Outside Caerfyrddin (Carmarthen), western Wales
    emergence: The narrator dates Rhonabwy's emergence from a subterranean lair to
      February 22, 2012, leaving a substantial crater at the site.
    initial_destruction: The narrator says Rhonabwy destroyed hundreds of buildings
      and killed more than 150 people immediately after emerging.
    later_account: Rhonabwy expressed regret in an occasional public bulletin, attributing
      that destructive conduct to post-hibernation trauma. This is his own explanation.
    rebuilding: The narrator credits him with spending considerable sums rebuilding
      Caerfyrddin's shattered eastern sections.
    relocation: Approximately one week after emergence, Rhonabwy ordered residents
      within five miles of Llandovery to depart within 72 hours, then spent about two
      months leveling and excavating the area for his lair.
    property_compensation: The narrator says he paid twice the assessed value of
      affected property, somewhat mollifying residents of the adjacent area.
    continuing_residence: He still occupies the extensive burrow and excavation
      network below Llandovery during the book's source period.
    security_and_ecology: His nature spirits patrol the territory, restricting the
      access of hostile paranormal creatures and helping neighboring residents.
  economic_interests:
    source_page: {printed: 60, pdf: 61}
    speculative_gold_cache: Most people reportedly believe he excavated more than
      three miles until reaching a large gold reserve; the narrator does not certify
      either the depth or treasure as observed fact.
    financial_intermediaries: HKB, GA financial corporations and Swiss banks are
      described as holding parts of his extensive investments via controlled companies;
      exact ownership remains secret.
    estimates_not_confirmed_ledgers:
      ares_share_percent: 4
      shiawase_share_percent_range: 6-7
      european_mid_size_corporate_stakes: Approximately 10 percent in at least thirty
        mid-sized European corporations
      confidence: Source describes careful financial analysis and estimates, not
        public authenticated shareholder disclosures.
    business_learning: The narrator says he obtained financial counsel from HKB and
      others after Awakening and quickly learned market operations.
    headquarters: His excavated and developed lair receives frequent media-technology
      upgrades and is equipped to collect business reporting from many sources.
    disclosure: Rhonabwy withholds the precise targets of his commercial interests.
  uncertain_welsh_alliances:
    source_page: {printed: 60, pdf: 61}
    excavation_assistance: Rumors place artisans and workers from Snowdonia and Gwynedd
      in the excavations; this is not a narrator-certified workforce roster.
    possible_alliance: If the excavation rumors are true, the book says they suggest
      cooperation among Rhonabwy, the Countess of Harlech and secessionist elves of northern Wales.
    magical_contributions: A further report, attributed to sources called reliable
      by the narrator, alleges Rhonabwy helped the countess locate orichalcum and
      helped elves regenerate their lands through magic; the account is still marked
      as rumor rather than direct narrator observation.
    information_policy: Couriers carrying messages from his financial advisers do
      not discuss their meetings openly; the source separately describes a fictional
      neural-implant communication restriction, indexed with political context.
  relationship_to_politics:
    source_page: {printed: 61, pdf: 62}
    narrator_interpretation: The narrator depicts Rhonabwy as a political actor who
      alternately opposes or supports elven institutions according to the concentration
      of control, not simply the ethnicity of those involved.
    existing_world_fact_record: world/prime-runners/rhonabwy-politics-p61.yml
    separately_attributed_discussion: world/prime-runners/rhonabwy-dragon-political-claims-p61.yml
    caution: Narrator political descriptions and named posters' disputed opinions
      should not be conflated.
  limited_personal_contact:
    source_page: {printed: 61-62, pdf: 62-63}
    face_to_face_report: The narrator says fewer than or about a dozen mortals had
      met Rhonabwy in person since his Awakening.
    intermediated_advice: Even company advisers and couriers usually communicated
      through trid links, leaving Rhonabwy control over interactions.
    rare_runner_encounter: A hired runner team reportedly reached his lair after
      an operation associated with Tír Tairngire; he is said to have appreciated their
      skill at penetrating his territory despite its dangerous defenses.
    reported_gift: The narrator says he gave that team's mage a small power focus,
      surprising its recipient. This is a specific source-period report, distinct
      from an available player-character reward or an automatic game rule.
  other_dragon_relationships:
    source_page: {printed: 62, pdf: 63}
    existing_world_fact_record: world/prime-runners/rhonabwy-dragon-relations-p62.yml
    source_distinction: Views of Celedyr, Dunkelzahn and Lofwyr are narrator-attributed;
      the Sea Dragon of Cardigan Bay and ancient struggle are expressly unconfirmed lore.
  artistic_interest:
    source_page: {printed: 63, pdf: 64}
    music_preference: The game notes Rhonabwy is enchanted by choral music, especially
      Welsh male choirs, and may appear in human form to attend a performance.
    scenario_separation: A runner with outstanding Singing might meet him, become
      his protege or receive requests; those are optional GM scenario branches, not
      source-period historical events.
  separately_preserved_mechanics_and_scenarios:
    rules: rules/prime-runners/rhonabwy-dragon-stats-p62-63.yml
    hooks: references/prime-runners/rhonabwy-dragon-hooks-p62-63.yml
    rules_scope: Exact Second Edition attributes, powers, spell Force ranges, skill
      ratings and equipment are retained in the separate protected rule_exact record.
  epistemic_boundary: This is historical narration and explicitly labeled rumor
    from a fictional Shadowrun tabletop book, not allegations about actual people,
    a modern canonical rewrite or a game-mechanical conversion.
