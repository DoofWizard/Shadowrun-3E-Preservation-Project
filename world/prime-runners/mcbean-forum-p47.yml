data:
  subject: McBean (Exile)
  source_anchor:
    printed_page: 47
    pdf_page: 48
    forum_position: Left column following McBean biography; the fifth comment continues
      into the right column before the Hooks heading.
  posts_in_print_order:
  - speaker: Io
    timestamp_as_printed: 06:15:43/10-1-55
    stance: humorous analogy
    claim: Compares the apparently always-present McBean to the old actor Dustin Hoffman,
      suggesting he was around for virtually every major historical disaster. This
      is not a literal history of every event.
  - speaker: Slater
    timestamp_as_printed: 06:24:08/10-1-55
    stance: joke posed as a question
    claim: Responds by asking whether Io means a Ronald Reagan story, an in-world
      media/pop-culture allusion, not an independent identification.
  - speaker: Gator
    timestamp_as_printed: 00:12:15/10-8-55
    stance: subjective character assessment
    claim: Says McBean may have become a legend in his own lifetime by appearing across
      many places and events without achieving the greatness others expected of him;
      speculates he repeatedly moved on instead of securing promotion or an enduring
      role.
  - speaker: Django
    timestamp_as_printed: 07:38:30/10-21-55
    stance: secondhand report and moral interpretation
    claim: Reports a local-board notice concerning McBean’s relationship with local
      police and skinhead-like extremists from across the Aspen border. Claims he
      intervened after one such group harmed the daughter of the head of a visiting
      Saudi Arabian trade delegation, risking a diplomatic incident. The speaker says
      police believed this escalated a conflict and that the extremists might move
      their activities elsewhere because of him. The local-board account and interpretation
      are not corroborated narrator facts.
  - speaker: Sunmi
    timestamp_as_printed: 20:47:01/10-25-55
    stance: first-person anecdote with explicit uncertainty
    claim: Says they sought McBean’s help with research on the Great Ghost Dance.
      An intermediary, Ed Stratton, formerly of the National Park Service, arranged
      contact. The speaker describes McBean’s unusual self-presentation, a long visit
      and extensive historical knowledge, but says he refused to quote sources directly
      and appeared fearful of something connected with Howling Coyote and opponents.
      Sunmi reports McBean disappeared the second day, later returned with an injured
      deer attributed to a truck collision, and on the third day became agitated and
      fired at the side of Sunmi’s departing pickup; Sunmi fled. The personal account
      is not independently verified.
  attribution_and_negation_guard: Do not convert anecdote, local-board hearsay, nickname
    joking, speculation about his psychology or reported weapon discharge to narrator-confirmed
    facts. The user’s source records the final post crossing a column break; no printed
    page change occurs.
  content_separation: This forum does not replace McBean’s printed biography, scenario
    hooks, exact attributes, skill ratings, equipment or Notes on printed 46–47.
