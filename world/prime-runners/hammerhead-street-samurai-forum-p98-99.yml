data:
  character: Hammerhead [Street Samurai]
  claims:
  - speaker: Ungawa
    timestamp: 10:10:04/10-11-55
    printed_page: 98
    pdf_page: 107
    claim: 'Ungawa reports a 2051 story explaining the nickname Hammerhead: at a drunken
      gathering at Bloody Mary’s he reportedly struck his forehead into five nails
      in a concrete wall; later that night another troll robbed him in an alley. He
      was found two days later, without his cash, possessions, boots and red leather
      jacket.'
    certainty: street anecdote recounted by speaker, not independently confirmed
  - speaker: Geena
    timestamp: 23:14:15/10-11-55
    printed_page: 98
    pdf_page: 107
    claim: Geena claims that three months later Hammerhead encountered the troll who
      stole his leather jacket at the Lion’s Den in the Bronx, killed him by tearing
      off his head, and ruined the jacket in the course of the revenge.
    certainty: speaker’s reported follow-up story; disputed provenance
  - speaker: Alon
    timestamp: 02:14:18/10-15-55
    printed_page: 99
    pdf_page: 108
    claim: Alon speculates that a career incident involving a superior officer may
      explain Hammerhead’s hostility toward elves, and asserts he can become violent
      around pointed ears, especially when he has been drinking.
    certainty: speculation concerning cause and claimed behavior
  - speaker: Gorm
    timestamp: 02:17:50/10-15-55
    printed_page: 99
    pdf_page: 108
    claim: Gorm asks Alon to clarify the earlier assertion.
    certainty: direct question without an independent factual claim
  - speaker: Alon
    timestamp: 02:18:28/10-15-55
    printed_page: 99
    pdf_page: 108
    claim: Alon reiterates that Hammerhead attacks elves, using a warning to Gorm
      as emphasis.
    certainty: speaker assertion
  - speaker: Spara
    timestamp: 14:04:17/10-21-55
    printed_page: 99
    pdf_page: 108
    claim: Spara, claiming past service in the same unit in 2048, regards Hammerhead
      as highly competent with explosives and large-caliber weaponry, careful about
      applied charges, and calm under fire despite troubling personal behavior. Spara
      invites Hammerhead for a drink and asks him not to bring Shoot-to-Kill.
    certainty: speaker personal-history claim and opinion
  source_anchors:
