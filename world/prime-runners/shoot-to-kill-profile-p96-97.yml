  narrator_account:
  - Her parents, described as corporate wage laborers for IIS, migrated north seeking work other than agricultural labor.
  - After Shoot-to-Kill experienced goblinization at twelve years old, the family remained in their human-only corporate apartment for three years, until her changed metatype became known; her parents had to choose between retaining employment and housing her, and they retained the apartment, leaving her without it.
  - She grew up afterward on streets of the Lower East Side, later moved north to Neon City after conflict with a gang, and associated with Hammerhead and other street criminals.
  - Before meeting Wolfram she earned money by street robberies of commuters and other easily victimized targets.
  - The narrator describes her as the group's unpredictable and impulsive member, prone to prolonged confrontations and enjoying intimidation and violence; she has a reputation for torturing captives for information such as passwords or safe combinations and for biting people when ammunition is exhausted.
  - She drives for the group when a separate professional getaway rigger is not hired.
  - Since their meeting she and Hammerhead have been nearly inseparable, despite frequent heated and sometimes violent arguments; she often covers his retreat during gang jobs while he handles explosives or safe-breaking.
  - The two share an apartment near Central Park and, unlike Wolfram, spend much of their proceeds on partying, gadgets, and luxuries rather than maintaining an upper-class public image.
  attributed_uncertain_accounts:
  - attribution: unnamed street legend reported by narrator
    epistemic_status: Not a confirmed occurrence
    report: A widely told account says Wolfram and Shoot-to-Kill independently attempted the same bank robbery, briefly agreed to divide their take, and that she later found he had taken more than his agreed half. The legend says she confronted him at his Times Square lodging, left a purported booby-trapped parting message, and later joined him with Hammerhead.
  - attribution: unnamed rumor
    epistemic_status: Unverified
    report: She initially belonged to the Sisters Sinister gang and gained a reputation for betraying them during armed confrontations.
