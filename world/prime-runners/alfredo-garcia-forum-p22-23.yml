data:
  subject: Alfredo Garcia, sasquatch barman at the Technicolor Yawn
  source_context: In-world forum comments following the character's profile, with
    Ghost Man's entry continuing across a page break.
  speaker_attributed_comments:
  - speaker: Collector
    timestamp_as_printed: 02:11:17/08-14-55
    printed_page: 22
    pdf_page: 23
    stance: unanswered question
    assertions:
    - Asks how anyone arranged British immigration clearance for a Salish-Shidhe sasquatch.
    claim_status: No explanation or actual travel method is supplied.
  - speaker: Ghost Man
    timestamp_as_printed: 03:15:55/08-21-55
    printed_pages: 22-23
    pdf_pages: 23-24
    stance: humor and attributed hearsay
    assertions:
    - Says he also wants an answer to Collector's immigration question and jokes that
      he would disguise himself as a sasquatch.
    - Reports that British acquaintances tell him Alfredo is a genuine contact; this
      is attributed hearsay.
    - Claims Alfredo reacts to questions about his name by signing an allusion to
      the film title Bring Me the Head of Alfredo Garcia, wearing an Australian-style
      hat with hanging corks, dancing and smiling.
    - Suggests the performance refers to an old film and that Alfredo appears amused
      by it.
    language_boundary: The source's word Drek is an exclamation at the beginning of
      Ghost Man's statement, not a character, informant or named contact.
    claim_status: Humor, secondhand assertions and Ghost Man's interpretation; neither
      the anecdotes nor the immigration means are independently established.
  - speaker: Slater
    timestamp_as_printed: 19:44:44/08-27-55
    printed_page: 23
    pdf_page: 24
    stance: descriptive report with subjective inference
    assertions:
    - Reports regular early visits by eco-activists and metahuman-rights advocates
      checking that Alfredo was content with his new position.
    - Generalizes that sasquatches can appear cheerful even when their actual feelings
      are unclear; this is Slater's assessment, not an independently demonstrated
      universal fact.
    - Says Alfredo is happy at work and the club management has recently given him
      a Friday-night cabaret engagement for illusions and magical performances.
    claim_status: Attributed speaker account; Alfredo's private feelings are not separately
      verified.
  chronology_guard: Follow printed post order and preserve each printed time without
    normalizing or inventing missing dates.
  attribution_guard: No speaker's jokes, hearsay, or character assessments are treated
    as unqualified source-narrator facts.
