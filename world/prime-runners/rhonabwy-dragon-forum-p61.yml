    printed_page: 61
    pdf_page: 62
    claim: 'Argues that Rhonabwy’s seeming contradictions follow a concern about political systems. Uses
      the dwarf-run Grand Duchy of Westrhine-Luxembourg as a case: according to the poster, the country
      was impoverished and its democracy vulnerable; Rhonabwy purchased most of its mineral-water exports
      at inflated prices, subsidizing and stabilizing the country. The speaker says he knows how to stabilize
      governments as well as destabilize them.'
  - speaker: Bitter Lemon
    timestamp: 21:45:13/07-10-55
    printed_page: 61
    pdf_page: 62
    claim: Replies to an unnamed prior interlocutor by questioning whether that speaker’s displayed name
      is genuine or rhyming slang. This is an in-world aside, not a factual assertion about Rhonabwy.
  - speaker: Bitter Lemon
    timestamp: 22:15:30/07-15-55
    printed_page: 61
    pdf_page: 62
    claim: Calls Rhonabwy exceptionally devious after the narrator explains his use of opponents and allied
      runner teams; this is the poster’s judgment rather than an independent event report.
  - speaker: Zeitgeist
    timestamp: 00:00:00/07-23-55
    printed_page: 61
    pdf_page: 62
    claim: Speculates that Welsh orichalcum was acquired by shamans in the Caribbean; the speaker presents
      no independent confirmation of the alleged transfer.
