data:
  character: Erik Vernon Dreyfuss
  source_heading: Hooks
  scenario_hook:
    need: Player characters need funds to finance a job.
    offer: Dreyfuss can finance the job but wants to accompany the runners.
    limit: He lacks the forcefulness to insist if the runners will not bring him.
    choices: The runners may leave him behind, even during the job; the text flags potential liability and complications
      if they do.
    counterpoint: He may unexpectedly rescue companions from difficulty, at least by offering financial help.
    tone: Narrator considers him a lovable but inept potential companion whom patient, cash-strapped runners may
      value.
  financial_oversight:
    controller: Accountant employed by Dreyfuss’s mother, who monitors his trust fund.
    trigger: Attempts to obtain large amounts of Dreyfuss’s money are detected.
    response: The accountant prefers to hire freelance security personnel, drawing on his financial-community contacts.
  mechanical_separation: The Willpower (6) skillsoft/reflexes test and equipment list on this page are preserved
    independently in npc.prime_runners.erik_vernon_dreyfuss.sr2_gear_activation.
