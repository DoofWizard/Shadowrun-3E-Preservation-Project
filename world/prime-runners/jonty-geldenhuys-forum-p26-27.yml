  claims:
  - speaker: Blues Cruiser
    timestamp_as_printed: 09:44:00/09-17-55
    printed_page: 26
    pdf_page: 27
    claim: Speaker claims Jonty hired them for a surveillance contract with detailed encrypted
      reports every 48 hours, docked their daily fee by 10 percent for each minute a report
      was late, and demanded extensive documentation. The speaker says the target was eventually
      found.
    certainty: first-person claim; uncorroborated
    not_narrator_fact: true
  - speaker: Cobalt Blue
    timestamp_as_printed: 04:09:02/09-19-55
    printed_page: 26
    pdf_page: 27
    claim: Speaker says Jonty normally relies on agents for preliminary reconnaissance, avoids
      visibility until intervening, and favors identifying weaknesses in his targets; the stated
      scenarios are examples or speculation rather than verified events.
    certainty: speaker interpretation and hypotheticals
    not_narrator_fact: true
  - speaker: Trap Man
    timestamp_as_printed: 01:07:41/09-24-55
    printed_page: 27
    pdf_page: 28
    claim: Speaker recalls a particular earlier incident involving a cake at a wedding attended
      by Walter Marshall in Chicago and describes Jonty as having a dry sense of humor.
    certainty: anecdotal recollection, not narrator-confirmed
    not_narrator_fact: true
  - speaker: MesoStim
    timestamp_as_printed: 05:52:11/10-01-55
    printed_page: 27
    pdf_page: 28
    claim: Speaker replies that the wedding anecdote is old and claims Jonty now prefers direct,
      personally conducted engagements and dislikes the earlier indirect tactic.
    certainty: unverified contemporary assessment
    not_narrator_fact: true
  attribution_guard: Preserve all four speaker attributions and dates; claims and speculation
