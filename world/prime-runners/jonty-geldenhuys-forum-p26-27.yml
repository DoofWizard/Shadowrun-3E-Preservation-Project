content_class:
- attributed_claim
data:
  source_scope: Four fictional in-world forum messages under the Jonty Geldenhuys
    (Bounty Hunter) character entry, spanning printed pp26-27.
  chronological_claims:
  - speaker: Blues Cruiser
    timestamp_as_printed: 09:44:00/09-17-55
    source_anchor:
      printed_page: 26
      pdf_page: 27
    first_person_report:
      engagement: Says Jonty hired the speaker to carry out routine surveillance on
        a person Jonty intended to capture; the subject was not named.
      confidentiality: Says the arrangement forbade disclosure of names or broader
        team details.
      reporting: Says Jonty required precisely scheduled encrypted reports every 48
        hours, with recordings, transcriptions, photographs and even soil samples.
      fee_condition: Says each minute of report lateness would cost the speaker ten
        percent of the daily fee.
      outcome: Says Jonty found the person he sought.
    provenance: An uncorroborated first-person speaker account; this fee clause is
      not a general Second Edition game rule.
  - speaker: Cobalt Blue
    timestamp_as_printed: 04:09:02/09-19-55
    source_anchor:
      printed_pages: 26-27
      pdf_pages: 27-28
    assessment:
      uses_other_agents: Speaker suggests Jonty sometimes relies on other agents or
        spies for advance reconnaissance to avoid being exposed prematurely.
      illustrative_hypotheticals:
      - speaker speculates about employing a team around a defended fictional corporate
        site.
      - speaker speculates about using a target's predictable opera attendance.
      - speaker speculates about an abduction involving a target's daughter at her
        private school.
      - speaker speculates about a distant attack on a subject during a social outing.
      personal_preference: The speaker says Jonty prefers undertaking a final encounter
        alone, bringing in others for a hit or capture only when needed.
      stated_reason_for_working_alone: The speaker attributes that preference to his
        reluctance to accept the risks of depending on other operatives he thinks
        less capable than himself.
    epistemic_status: Attributed fictional-world characterization and hypothetical
      examples; none of these examples is asserted to have occurred, nor is it a game
      procedure.
  - speaker: Trap Man
    timestamp_as_printed: 01:07:41/09-24-55
    source_anchor:
      printed_page: 27
      pdf_page: 28
    claim: Claims to have heard that Jonty had a laconic sense of humor, and recalls
      an exploding wedding cake incident said to have taken Walter Marshall out at
      a Chicago wedding.
    outcome_guard: This speaker's expression does not independently establish whether
      Walter Marshall died.
    epistemic_status: Unverified anecdote rather than source-narrator history.
  - speaker: MesoStim
    timestamp_as_printed: 05:52:11/10-01-55
    source_anchor:
      printed_page: 27
      pdf_page: 28
    claim: Calls the wedding story an older episode and says Jonty now has a strong
      preference for a direct personal encounter. Claims the cake killed six other
      people, which the character disliked on grounds of crude inefficiency, not remorse.
    epistemic_status: MesoStim's allegation and interpretation, not a confirmed casualty
      report or verified access to Jonty's internal motives.
  classification_guards:
    speaker_count: 4
    separates_source_narrator_from_comments: true
    quoted_incident_outcome_is_speaker_allegation: true
    distinct_game_mechanics: The numerical Second Edition attributes, equipment, and
      modifiers are preserved in rules/prime-runners/jonty-geldenhuys-stats-p26-27.yml.
    real_world_usage: Fictional historical source transcription, not real-world instructions
      or verified events.
framing: newsroom_neutral
