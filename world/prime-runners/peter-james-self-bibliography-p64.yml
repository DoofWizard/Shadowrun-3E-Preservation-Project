data:
  author: Peter James Self
  published_works:
  - title: Rage Turned Within
    year_of_publication: 2052
    publication_context: First book; acquired a cult following among a European student fraternity.
  - title: The Privacy of Nobodies
    short_title_in_source: Nobodies
    publisher: Random-Viking
    publication_date: Late 2053
    form: Novel described as a fictionalized documentary of a single day in the internal and external lives of a group of marginalized people in Milan.
    reception: Divisive among critics and public commentators; praised by literary readers for its psychological characterization, while subject to sharply negative philosophical criticism.
    narrator_interpretation: The narrator credits Self with an ability to represent the emotions and interior lives of his characters despite its self-conscious literary style.
  projects_in_progress_as_of_source:
    film: Screenplay for a trid-movie adaptation of The Privacy of Nobodies.
    third_book: A third book in progress for approximately two and a half years; provisional title not supplied, with publishers said to be keeping it confidential.
  attribution: The publication dates, publisher and work descriptions are narrator-led statements in Prime Runners p64, not the opinions of the separately attributed 2055 forum commenters.
  provenance_note: The author biography, dated forum reactions, original game statistics and potential scenario hooks are separate semantic classes. The source does not provide specifications or an SR3 adaptation for these works.
headline: Peter James Self — recorded novels and works in progress
summary: Source-period bibliography, publication chronology, publisher, reception and projected adaptations.
