  printed_identity:
    name: Akihito "Tuesday" Takemura
    birth_date: October 28, 2031
    birthplace: Waipahu, Hawaii
    nationality_metatype_gender: UCAS/Asian Elf/Male
    current_residence: Chicago, UCAS
    height_cm: 178
    weight_kg: 66
    hair: Black; very long, usually tied back
    eyes: Dark brown
    distinctive_features: Sword-wielding samurai tattoo from right shoulder to lower left back, derived from traditional
      Japanese design; smaller chrysanthemum tattoo around left thigh.
    described_traits: Fanatically determined; loyal; ruthless
    stated_motivation: Preservation of honor through loyalty to his oyabun
    lifestyle: High
  origin_and_kinship:
    recruited_as_kobun: The fictional narrator says Keiji Hiroshige took Takemura under his wing when the boy
      was eight, becoming his kobun or apprentice.
    kinship: Takemura's father is Hiroshige's second cousin.
    reported_reason: The narrator speculates that family pride probably influenced Hiroshige's decision; it does
      not establish Hiroshige's private motive as fact.
    nickname: The book narrator says his nickname "Tuesday" comes from the day of the week on which he was born.
  upbringing_and_abilities:
    cultural_setting: Raised with both Japanese and American cultural influences under Hiroshige's tutelage.
    training: Received instruction in iaido (Japanese swordsmanship) and ninjutsu from highly regarded practitioners
      outside Japan.
    expertise: Narrator describes him as a master swordsman, adept in unarmed combat and weapons, fitting the
      role of the Chicago yakuza leader's bodyguard.
  chicago_roles_and_uncertainty:
    personal_security: He watches over Hiroshige's personal safety and oversees security at his patron's home
      and office, where the narrator says several dozen guards are regularly stationed.
    internal_assignments: Hiroshige sometimes assigns Takemura to settle disputes with disloyal yakuza members;
      he rarely risks this valued bodyguard in external conflicts or firefights.
    prospective_succession: The narrator attributes to many observers the belief that Takemura has supplanted
      Tadashi Hiroshige as possible heir to the Chicago leadership, not that an appointment has occurred.
    factional_objection: The narrator says other yakuza factions would probably object if Takemura tried to become
      oyabun; this is a predicted reaction, not a completed dispute.
  separate_accepted_records:
    game_statistics: rules/prime-runners/akihito-tuesday-takemura-stats-p34-35.yml
    attributed_forum: world/prime-runners/akihito-tuesday-takemura-forum-p34-35.yml
    campaign_guidance: references/prime-runners/akihito-tuesday-takemura-guidance-p35.yml
  preservation_boundary: This record is a reference profile of a fictional adult character from a published tabletop
    RPG; actions, organizations, family relations and chronology belong to the invented setting and are not assertions
    about real people.
