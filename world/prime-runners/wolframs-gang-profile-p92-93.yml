data:
  name: Wolfram's gang
  source_anchors:
  - printed_page: 92
    pdf_page: 101
    heading: Wolfram's Gang
  - printed_page: 93
    pdf_page: 102
    heading: continuation and Hooks
  setting: Post-quake New York, especially Manhattan inner-city districts amid corporate
    withdrawal, overstretched law enforcement and competing criminal groups.
  group_identity:
    formal_name: No official name established in the source
    nickname: Wolfram's gang
    members: 3
    leader: Wolfram
    member_relationships:
    - Wolfram (leader)
    - Shoot-to-Kill (troll)
    - Hammerhead (troll)
    reputation: A small and durable organized gang distinguished from transient competitors.
  documented_activities:
  - armed robberies and bank robberies
  - extortion
  - illegal trading
  - kidnapping
  - demolitions-related offenses
  - hired killings and corporate-backed assignments
  early_history:
    timing: Approximately four years before the source-era account
    event: A highly publicized disruption of a corporate wedding banquet in New York;
      guests were robbed and the wedding party abducted. The source describes loss
      of food and drink and removal of two luxury cars.
    aftermath: The members evaded corporate security, extracted a 50,000-nuyen payment
      from NJG Cybersystems and escaped.
  subsequent_history: Following that episode the group continued to carry out larger
    and more specialized operations with Wolfram handling complex arrangements and
    his partners supplying physical force.
  relative_capabilities: Wolfram is presented as intellectually capable, while Shoot-to-Kill
    and Hammerhead contribute aggressive physical prowess.
  public_reputation: Gang’s repeated survival and prominence stands out amid otherwise
    short-lived street gangs; source narrator, not proof of any specific corporate
    sponsorship.
  source_boundary: Attributions or unconfirmed claims of protection by specific corporations
    occur in separately preserved forum material; do not treat those as narrator-established
    facts.
