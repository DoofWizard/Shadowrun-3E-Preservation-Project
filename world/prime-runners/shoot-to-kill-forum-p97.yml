  subject: Shoot-to-Kill (Anna Santamaria), fictional gang member
  posts:
  - speaker: MM
    timestamp_as_printed: 00:31:40/10-9-55
    attribution_class: Named fictional forum opinion with explicit rhetorical hyperbole
    report: MM depicts Shoot-to-Kill as extraordinarily unstable and violent, using a counterfactual about the nonexistence of machine guns to exaggerate her eagerness to shoot people; MM urges others to avoid her.
  - speaker: Bart
    timestamp_as_printed: 03:40:59/10-11-55
    attribution_class: Explicitly unverified street myth repeated by a named fictional forum speaker
    report: Bart says Hammerhead left after a violent argument two years earlier and lived for a month with a former girlfriend in Queens. Bart reports a street myth that Shoot-to-Kill located them, decapitated the girlfriend while Hammerhead was absent, and left the head in their refrigerator with a photograph of herself and a threatening note to Hammerhead. This is a fictional speaker's uncorroborated allegation, not sourcebook-certified fact.
  - speaker: Geena
    timestamp_as_printed: 02:14:53/10-23-55
    attribution_class: Named fictional forum street gossip
    report: Geena claims Shoot-to-Kill and Hammerhead once interrupted their flight from a crime scene, remained in an alley while a police officer passed by, and resumed a public sexual encounter after he left. Geena treats this as evidence of their impulsive appetite for risk.
  - speaker: Gnasher
    timestamp_as_printed: 11:30:17/10-26-55
    attribution_class: Named fictional forum response
    report: Gnasher responds sarcastically to Geena's preceding story without presenting an independent factual account.
  distinctions:
  - The four named forum speakers express separate assessments or uncorroborated street stories; neither their opinions nor the alleged killing constitute narrator-established history.
  - The printed page also contains optional GM hooks, exact historical Second Edition game statistics, cyberware and equipment; those are independently preserved in separate source-class records.
