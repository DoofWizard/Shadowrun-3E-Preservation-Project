data:
  subject: Shoot-to-Kill (Gang Member)
  forum_contributions:
  - speaker: MM
    timestamp_as_printed: 00:31:40/10-9-55
    substance: Insults Shoot-to-Kill as exceptionally erratic and vicious; uses a hyperbolic counterfactual about
      firearm invention to emphasize his view that she should be avoided.
    epistemic_status: Speaker opinion and hyperbole, not independently verified fact.
  - speaker: Bart
    timestamp_as_printed: 03:40:59/10-11-55
    substance: Recounts an alleged incident after an argument with Hammerhead two years earlier, claiming Shoot-to-Kill
      later attacked Hammerhead's former girlfriend at her home and left a threatening message; explicitly presents
      the episode as street myth.
    epistemic_status: Unverified street rumor about a past attack, not independently corroborated.
  - speaker: Geena
    timestamp_as_printed: 02:14:53/10-23-55
    substance: Relates gossip about Shoot-to-Kill and Hammerhead's impulsive conduct and their decision to remain
      at a crime scene, and alleges a public sexual encounter after a police officer left the immediate area.
    epistemic_status: Street gossip attributed to Geena, not an independently established event.
  - speaker: Gnasher
    timestamp_as_printed: 11:30:17/10-26-55
    substance: Responds sarcastically to the preceding speaker's account.
    epistemic_status: Speaker reaction rather than independent evidence.
  provenance_notes:
  - Preserve the four distinct names and their ordering; none is the book's unsigned profile narrator.
  - The forum anecdotes and gossip are not upgraded to confirmed biography.
  - The subsequent Hooks section is campaign guidance, and the right-hand game stat block is historical rules material,
    not part of these claims.
