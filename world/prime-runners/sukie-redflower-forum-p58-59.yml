    heading: continued inline forum
  subject: Sukie Redflower
  source_form: In-world Shadowrun forum posts, printed in the order below
  attributed_posts:
  - speaker: Cobalt Blue
    printed_timestamp: 04:44:17/07-13-55
    position: strongly negative
    assertions:
    - Complains that Sukie continually criticizes colleagues' performance, appearance,
      and equipment.
    - Regards hiring her as acceptable only for people able to tolerate her fast-paced
      criticism.
    - Ends with hostile hyperbole directed at her; this is a hostile opinion, not
      a narrated occurrence.
  - speaker: Cracker
    printed_timestamp: 11:16:32/07-20-55
    position: critical of Cobalt Blue and qualified support for Sukie
    assertions:
    - Affirms her competence, patience from coworkers, and professionalism.
    - Claims good Salish-Shidhe talismonger contacts and says she can become helpful
      when approached respectfully.
    - Claims unusually quick movement, without resolving whether it reflects cyberware,
      drugs, or normal skill.
  - speaker: Sister Ray
    printed_timestamp: 01:16:11/07-22-55
    position: admiration
    assertions:
    - Offers a short positive comment on Sukie's physical attractiveness, without
      stating any event.
  - speaker: Cityboy
    printed_timestamp: 01:01:07/07-27-55
    position: cautionary allegation
    assertions:
    - Claims Sukie uses her attractiveness and personal identity to persuade romantic
      partners.
    - Alleges several relationships and unresolved resentment in Seattle and Salish-Shidhe.
    - Predicts future romantic complications; these remain this speaker's opinions.
  - speaker: Bitter Lemon
    printed_timestamp: 18:44:51/08-04-55
    position: warning and speculation
    assertions:
    - Warns against an overly durable professional relationship with Sukie.
    - Says former Salish-Shidhe associates have grievances against her.
    - Reports secondhand rumors involving Cascade Crow associates, money, and ritual
      favors; acknowledges uncertain sourcing.
  chronology_and_certainty:
  - Maintain all five original timestamps and the source's printed speaker order.
  - Do not promote hostility, allegations, predictions, or secondhand rumors into
    narrator-verified historical events.
headline: Sukie Redflower — five attributed forum assessments
summary: Distinctive speakers and original timestamps preserved alongside hostile,
  supportive, admiring and speculative appraisals.
framing: newsroom_neutral
