  - speaker: Bitter Lemon
    timestamp: 20:19:14/11-21-55
    claim: Defends virtual simsense experiences as comparatively safe and preferable
      to some real-world encounters.
    certainty: attributed_opinion
  - speaker: Marguerita and Tom
    timestamp: 23:16:15/11-22-55
    claim: Alleges that Baggio's performer-response technique involves intimate acquaintance
      with simsense actors of both genders, rather than exclusively technical observation.
    certainty: attributed_unverified_claim
  - speaker: Cobalt Blue
    timestamp: 05:12:00/11-23-55
    claim: Reports a rumored project for interactive simultaneous experience of multiple
      performers by a single recipient, crediting Baggio with unusual command of qualitative
      EC/PC and Emotive synchronization and noting the project's speculative nature.
    certainty: attributed_project_rumor_and_evaluation
  - speaker: Rubbisher
    timestamp: 16:25:44/11-25-55
    claim: Questions whether the proposed multiple-perspective experience is physiologically
      possible and dismisses it as expensive adult entertainment.
    certainty: attributed_dissent
  - speaker: Cobalt Blue
    timestamp: 05:54:52/11-28-55
    claim: Clarifies a speculative alternate interpretation in which a recipient experiences
      several performers' sensations concurrently through a program measuring and
      reconstructing response patterns, rather than simultaneously occupying both
      sides of an encounter.
    certainty: attributed_hypothesis
  - speaker: Kingdome Veteran
    timestamp: 12:08:51/11-29-55
    claim: Jokingly imagines the sensation of being part of an entire Seattle Seahawks
      offensive line during a football play.
    certainty: attributed_humorous_speculation
  - speaker: Cobalt Blue
    timestamp: 06:16:00/11-30-55
    claim: Responds disapprovingly to the preceding joke.
    certainty: attributed_reaction
