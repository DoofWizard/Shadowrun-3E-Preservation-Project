    source_voice: Five separate, timestamped in-world forum posts; opinions, allegations,
      rumors, and personal observations are not claims made by the sourcebook's omniscient
      narrator.
  posts_in_printed_order:
  - speaker: Bestyet
    timestamp_as_printed: 00:45:48/10-04-55
    printed_page: 44
    allegations:
    - Calls Gash fearful and says his reputation for intervening courageously in dangerous
      incidents is undeserved.
    - Asserts Gash formerly prioritized protecting camera equipment during a dangerous
      investigation while Ren Martindale was injured by an iron bar; this anecdote
      is attributed to Bestyet and not independently verified.
    certainty: Speaker's accusations and characterization, not a reliable account
      of all prior encounters.
  - speaker: Miranda
    timestamp_as_printed: 14:21:40/10-06-55
    printed_page: 44
    allegations:
    - Criticizes what the speaker portrays as invasive camera framing of women and
      younger girls, including filming from unwanted angles during investigations.
    - Says Gash has never been convicted, but alleges one or more complaints by mothers
      regarding his conduct toward their daughters and a substantial out-of-court
      settlement.
    certainty: Serious in-world accusations by Miranda with explicit lack of a reported
      conviction; neither misconduct nor a settlement is established independently
      by the sourcebook narrator.
  - speaker: Bestyet
    timestamp_as_printed: 11:55:12/10-11-55
    printed_page: 45
    allegations:
    - Suggests Gash is a danger to investigative partners, referring to the deaths
      of earlier colleagues and claiming he panicked and accidentally shot former
      co-worker E. E. Valez during a confrontation with local people over a suspected
      ticket-scalping inquiry.
    certainty: Speaker's account, not narrator-confirmed cause of Valez's death; the
      narrator separately states that former colleague Woody Williams died in an explosion
      Gash survived.
  - speaker: Slater
    timestamp_as_printed: 02:03:31/10-20-55
    printed_page: 45
    assertions:
    - Says access to Ren Martindale generally entails dealing with Gash, who remains
      close behind the broadcaster even during one-to-one meetings.
    - Describes Gash as continuously filming or preparing to film while smoking cigars.
    certainty: Speaker's characterization and reported experience, not a universal
      source rule.
  - speaker: JJ
    timestamp_as_printed: 19:33:50/10-22-55
    printed_page: 45
    allegations:
    - Distinguishes Gash's printed Flint birthplace from an alleged upbringing in
      an Italian-American Brooklyn neighborhood.
    - Suggests that his family retains contacts there and may owe or be owed favors
      in Brooklyn organized-crime circles; no specific relationship is independently
      established by this speaker.
    certainty: In-world hearsay and inference, not an amendment to the printed birthplace
      or a proven Mafia affiliation.
  source_separation:
    narrator_biography: world/prime-runners/alfie-gash-biography-p44.yml
