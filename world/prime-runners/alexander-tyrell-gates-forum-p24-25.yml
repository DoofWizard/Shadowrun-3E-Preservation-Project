data:
  character: Alexander Tyrell Gates
  source_anchors:
  - printed_page: 24
    pdf_page: 25
    section: Forum commentary following the biography
  - printed_page: 25
    pdf_page: 26
    section: Continuation of forum commentary
  claims:
  - speaker: Jarrold
    timestamp_as_printed: 00:14:12/10-11-55
    printed_page: 24
    pdf_page: 25
    claim: Asks whether Alex apparently manipulates parts of the Matrix unconsciously
      and naturally, as ordinary people manipulate familiar physical surroundings
      and tools.
    certainty: inference posed as a question
    not_narrator_fact: true
  - speaker: Hawk
    timestamp_as_printed: 00:15:58/10-11-55
    printed_page: 25
    pdf_page: 26
    claim: Agrees tentatively. Says researchers predicted Matrix-raised children would
      treat it as their natural home but assumed they remained bound by its apparent
      natural laws. Interprets shortcuts used by Alex and a generation of other children
      as contrary evidence. Claims current Matrix security cannot prevent their kind
      of access and manipulation. Says Alex presently snoops and defeats locks without
      concern for protected information; forecasts possible trouble when he grows
      older or someone persuades him to retrieve information.
    certainty: attributed interpretation, generalization and conditional forecast
    not_narrator_fact: true
  - speaker: Morse
    timestamp_as_printed: 05:17:30/10-14-55
    printed_page: 25
    pdf_page: 26
    claim: Questions the assertion that an entire generation exists, and asks how
      many children are as Matrix-adept and virtually Matrix-dependent as Alex.
    certainty: question, not an established population estimate
    not_narrator_fact: true
  - speaker: Hawk
    timestamp_as_printed: 05:28:51/10-16-55
    printed_page: 25
    pdf_page: 26
    claim: Says accurate estimation is difficult. Alleges major corporate research
      departments generally do not restrict trials to adult volunteers and says some
      federal safety laws require all-ages pre-launch trials for many products. Further
      alleges corporations sometimes conduct tests on children in Asia, Africa or
      other permissive locations even without that requirement, to establish product
      safety for children at home. Mentions software, biotechnology and other testing.
      Declines an accurate estimate of Matrix-literate children, but speculates hundreds
      could exist if other corporations have people as deeply involved with Matrix
      development as the Gates family.
    certainty: speaker-attributed research and legal claims, allegations and conditional
      speculation; not narrator confirmation or verified demographics
    not_narrator_fact: true
  attribution_guard: Preserve each speaker’s agency, questions, legal assertion, allegations
    and conditional estimate; none is independently confirmed biography, a real-world
    procedure, a formal SR2 rule or an SR3 rule.
framing: newsroom_neutral
headline: 'Fictional Shadowrun forum commentary: Alexander Tyrell Gates (FASA7116
  pp24-25)'
summary: Archival attribution of four dated fictional discussion posts in FASA's 1994
  Prime Runners tabletop RPG book. The speakers’ claims about the imagined Matrix
  and corporate research are preserved as attributed claims, not statements about
  real people or real organizations.
