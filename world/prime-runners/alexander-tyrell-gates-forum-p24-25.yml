  claims:
  - speaker: Jarrold
    timestamp_as_printed: 00:14:12/10-11-55
    printed_page: 24
    pdf_page: 25
    claim: Jarrold asks whether Alex is unconsciously manipulating Matrix environments as naturally
      as people use everyday physical surroundings and tools.
    certainty: inference posed as a question
    not_narrator_fact: true
  - speaker: Hawk
    timestamp_as_printed: 00:15:58/10-11-55
    printed_page: 25
    pdf_page: 26
    claim: Hawk says researchers predicted Matrix-raised children could treat the Matrix as
      their natural environment but had assumed its apparent internal laws would bind them.
      Hawk argues Alex’s behavior challenges that assumption, particularly ordinary locks and
      security; current activity is described as childlike curiosity, while later access could
      become problematic.
    certainty: attributed interpretation and forecast
    not_narrator_fact: true
  - speaker: Morse
    timestamp_as_printed: 05:17:30/10-14-55
    printed_page: 25
    pdf_page: 26
    claim: Morse questions how many other children may be as Matrix-adapted and dependent as
      Alex.
    certainty: question, not an established population estimate
    not_narrator_fact: true
  - speaker: Hawk
    timestamp_as_printed: 05:28:51/10-16-55
    printed_page: 25
    pdf_page: 26
    claim: Hawk says the number cannot be accurately estimated, notes limited access to corporate
      testing information, speculates that unethical research involving children may occur,
      and suggests the possible number of similarly Matrix-literate children could be in the
      hundreds.
    certainty: speculation; not verified by narrator or independent demographic evidence
    not_narrator_fact: true
  attribution_guard: Forum questions, interpretations, forecasts and allegations must not be
    rewritten as confirmed biographical facts, formal SR2 rules or SR3 facts.
