  psychology:
    traits: [Vigilant, cautious, distrustful, aloof, neurotic under pressure]
    motivation: Survive and accumulate enough money to leave this line of work
    lifestyle: Middle
  investigative_work:
    former_employer: Cord Mutual in downtown Atlanta
    initial_role: Discreet investigations of corporate insurance claims involving small and medium businesses
    travel: Acquired experience and contacts while working around the CAS
    discovery: Uncovered a conspiracy of medium-sized businesses acting with Cord Mutual to defraud competing insurers
    turning_point: Found charred remains of children killed in an arson attack planned by a local group involved in that conspiracy
    departure: Cashed in company chips, obtained a UCAS passport through a financially motivated marriage to a man with drug dependency, and quickly left him
    current_city: Indianapolis, where she had lived for the preceding four years
    preferences: Avoids public attention and values operational discretion
    investigative_specialty: Surveillance, magical detection, analysis, and covert information gathering
    advertised_scope: The fictional description says clients may hire her for surveillance or to arrange a target's death or disappearance, or the removal of an item, if adequately paid
    client_screening: Requires sound references from potential clients
    corporate_work: Avoids corporate assignments when possible but may accept them for financial reasons
    concerns: Greater concern about being double-crossed or used as a decoy than about nonpayment
    planning: Expects clients to have a coherent plan and contingency measures before involving her
    independence: Prefers to work by herself rather than travel with a runner group
  family:
    daughter: Gloria
    care_during_assignments: Leaves Gloria with a female friend during runs
    fallback_contacts: Friend can summon former CAS shadowrunner associates if the daughter is in danger
