assassination_aftermath:
  - "The chapter reviews competing theories about who killed Dunkelzahn without adopting any one suspect as established fact."
  - "Red Dawn's early claim is treated as a discredited public claim; later corporate, political, magical and personal theories remain attributed speculation pending the Scott Commission."
  - "The astral rift and incomplete physical evidence are repeatedly identified as major obstacles to a simple explanation."

treasure_hunt:
  - "Dunkelzahn's conditional bequests create an immediate global claims rush involving individuals, corporations, governments, magical groups and shadow talent."
  - "The Draco Foundation becomes the clearinghouse that verifies claims, judges whether conditions were met and releases rewards."
  - "The chapter explicitly frames many will items as ready-made shadowrun hooks: searching for people/objects, protecting researchers, transporting items, investigating sites, corporate extraction, recovery and competition between claimants."

dragons_hoard:
  - "The estate is described as far larger and stranger than the published will alone, mixing cash, corporate holdings, real estate, art, magical artifacts, Matrix assets, research data and undisclosed property."
  - "The source stresses that several bequests may expose assets no one previously knew Dunkelzahn owned."
  - "Commentary treats the published will as only a partial map of the dragon's resources and repeatedly warns that hidden lairs and unlisted caches may remain."

corporate_connection:
  - "The will shifts stock, board seats, promissory notes, corporate subsidiaries and other ownership rights across major corporations and individuals."
  - "These transfers create new incentives for boardroom maneuvering, takeover attempts, internal-security work and deniable outside contracting."
  - "The source highlights Miles Lanier's new Renraku position and the wider uncertainty created by Dunkelzahn's ownership stakes across multiple megacorporations."
  - "Shadowland commentary claims Nadja Daviar controls a 12-percent interest in Ares Macrotechnology after the will's transfers; this is preserved as an attributed source claim rather than independently reconciled here."

draco_foundation:
  establishment:
    - "The first provision of the will establishes the Draco Foundation as the holding organization administering Dunkelzahn's estate and the will's other provisions."
  resources:
    - "The remaining estate gives the Foundation resources described as rivaling those of a megacorporation, with billions of nuyen as the chapter's conservative estimate."
    - "Foundation resources include liquid capital, investments, bank accounts, corporate holdings and assets still being identified."
  governance:
    board: "Seven-member Board of Trustees"
    executor_chair: "Nadja Daviar"
    vice_chair: "Aina Dupree"
    notes:
      - "Daviar appoints the trustees as executor; Shadowland commentary says Dunkelzahn may have selected several members in advance."
  responsibilities:
    - "Judge applicants for conditional bequests and determine whether Dunkelzahn's requirements were satisfied."
    - "Locate and identify named beneficiaries."
    - "Handle claims, litigation and distribution of named bequests."
    - "Manage and invest the remaining estate."
    - "Use consultants and experts when judging technical, magical or legal claims."
  influence:
    - "The Foundation rapidly becomes a significant corporate and political actor because it controls enormous assets and access to the will."
    - "The chapter anticipates substantial use of shadow talent for data acquisition, surveillance, courier work, sensitive investigations and protection."
    - "Its UCAS political position is strengthened by Daviar's nomination as Vice President, though the book distinguishes institutional facts from Shadowland speculation about hidden agendas."

