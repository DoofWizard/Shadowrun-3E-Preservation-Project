name: "Cause-driven organizations"

policlubs:
  council_to_rebuild_america:
    president: "J.R. 'Bob' Dobbs"
    headquarters: "Detroit, Michigan"
    membership_reference: "minimum donation 45 nuyen per year"
    notes:
      - "Self-described movement favoring restoration of the former United States."
      - "Rumors of a more militant splinter are presented as attributed claims."
  magical_reform_society:
    president: "Dr. Conrad Jellico"
    headquarters: "Toronto, Ontario"
    membership_reference: "50 nuyen per year"
    notes:
      - "Publicly advocates interests of the magically active."
      - "The source identifies it as a division of the Illuminates of the New Dawn and treats some courier/support claims as underworld reporting."
  mothers_of_metahumans:
    president: "Betsy Grant-Masterson"
    headquarters: "Federal District of Columbia"
    notes:
      - "Metahuman-rights organization with support groups and substantial political activity."
      - "The source links recent work to the Timmons Memorial Fund."
  peta_awakened:
    full_name: "People for the Ethical Treatment of the Awakened"
    leaders:
      - "Jahn Winding-Way"
      - "Deborah Bailey"
    headquarters: "Federal District of Columbia"
    membership_reference: "35 nuyen per year"
    notes:
      - "Advocates legal recognition and protections for sapient or intelligent Awakened beings."
      - "The chapter attributes direct-action activity to more radical members."

cults:
  children_of_the_dragon:
    leader: "David 'Dragonson' Emerson"
    headquarters: "Prince Edward Island, UCAS"
    notes:
      - "Fast-growing post-Dunkelzahn religious movement."
      - "Claims concerning Emerson's magical powers are explicitly presented through rumor and commentary rather than settled fact."

environmental_groups:
  major_named_groups:
    - TerraFirst
    - Save Our Seas
  notes:
    - "The source distinguishes legal environmental activism from illegal direct-action splinters and notes that radical groups sometimes possess sophisticated technical resources."
    - "Claims connecting Arthur Vogel to command structures are presented as rumors, not established facts."

mechanics_audit:
  protected_classes_found: []
  findings:
    - "The 45, 50 and 35 nuyen annual membership figures are source-period reference prices, not universal character-creation costs."
    - "No target number, dice-pool modifier, damage code, Availability value, formal test, character option or NPC stat block is defined on printed pp.81-86."

