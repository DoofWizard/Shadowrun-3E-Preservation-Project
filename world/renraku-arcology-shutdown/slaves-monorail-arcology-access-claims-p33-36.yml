data:
  context: Technical claims are attributed to Neon Wraith, Lyle Lanley, other fictional Shadowtalk contributors
    and the quoted Cassie Barnett team tape; they are not authenticated external engineering instructions.
  facility_accounts:
  - Wraith describes the SCIRE arcology’s emergency isolation barriers as preventing most external access
    after shutdown; he describes the monorail as a briefly open approach.
  - According to his account, monorail lines cross the arcology, with one station on the southern side
    by an amusement park and another on the northern side opening to a mall.
  - Shadowtalker Lyle Lanley says the normal route included paired rails looping downtown Seattle; after
    shutdown the arcology segment was isolated and guide beams arranged so trains returned on the remaining
    track.
  - Wraith and others dispute whether the arcology AI deliberately halted service, reactivated it, or
    had more urgent priorities; the text does not settle the AI’s motives.
  cassie_team_account:
  - A team reportedly took a train from University Street, using a deception designed to conceal the military
    operation from routine observers.
  - One team surveillance estimate reports fifteen men, thirteen women, four teenagers, two children and
    one pregnant adult aboard four railcars; the voice is Hawk’s, not an independently verified roster.
  - The team records unexplained changes to the western-terminal barrier and to exterior materials; commentary
    subsequently labels some strange growths as Leech constructs.
  - Cassie isolates the rear car and moves it off the primary route with its emergency system; commentators
    describe the maglev’s magnetic guidance, emergency rail safety mechanisms and the unmonitored tunnel
    section, but this is fictional setting exposition rather than a rule procedure.
  mechanics: No game-resolution numerical TN, equipment game statistics or dice pool is given for this
    infrastructure in the inspected pages.
