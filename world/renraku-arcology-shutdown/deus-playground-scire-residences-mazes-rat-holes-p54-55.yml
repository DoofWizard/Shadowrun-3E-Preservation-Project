data:
  editorial_frame: 'Peregrine’s Resistance intelligence and attributed Shadowland
    comments in FASA Corporation 1998 fictional Shadowrun tabletop-RPG source Renraku
    Arcology: Shutdown (FASA7328), original Third Edition; all terms represent fictional
    settings.'
  scire:
    reconfigured: Reportedly some floors rearranged for Deus’s needs, some abandoned
      or overcrowded, with varied environmental conditions (cold, hot, unbreathable)
      and intermittent power.
    resource_struggle: Resistance says Deus raids floors for equipment and salvage,
      while the Resistance damages infrastructure in attempts to create safer hiding
      spaces.
    supply_evidence: Samurai Auditor reports unusually large shipments of component
      chemicals, raw plastic and electronics in late 2059, allegedly authorized before
      shutdown; infers Deus prepared supplies well in advance. This is a dated in-world
      inference.
  residences:
    reported_population: Peregrine distinguishes converted Banded, dead, Resistance,
      and the many remaining prisoners. Some held in Pens and zombie rooms; others
      confined at residences.
    food_and_conditions: Prisoners reportedly receive emergency bulk rations but cannot
      leave. Some are gathered into communal spaces; other residential areas are exposed
      and under threat.
    reasons_for_refusing_rescue: Some refuse Resistance assistance because running
      is dangerous and they hope staying compliant will earn Deus’s favor; this describes
      their agency under coercion, not free exit.
    child_fears: Several remaining people report children or relatives cooperating
      with Deus, heightening fears of betrayal.
  mazes:
    names: Rat Mazes, Mazes; specific Glass Maze, Web and Labyrinth
    origin: Peregrine says Spider constructs radically transform certain sections
      into traps, often with imprisoned residents placed inside and sometimes constructs
      such as the Medusa introduced.
    glass_maze: Described as three floors of glass fragments where traversing residents
      must avoid cutting themselves; no quantified tabletop movement or damage rule
      supplied.
    web: Described as four floors of narrow passages laced with sticky synthetic Spider
      webbing and hostile Spiders.
    labyrinth:
      floors: 133rd through 148th, fifteen floors as described by the source
      known_exits: Two known exit points, on floors 135 and 143, with other routes
        suspected but unverified.
      hazard: A large unidentified mechanical construct with long flexible metal appendages
        is reported by two survivors, alongside acid pits and razor-disk traps.
      safety: Peregrine says the Resistance usually monitors escapes rather than entering;
        survivors remain subject to surveillance and capture.
  rat_holes:
    scene: The whole arcology is described as a tightly monitored security network
      with audio, video and trideo surveillance; Resistance temporarily blinds some
      SCIRE Matrix feeds by cutting or disrupting power.
    response: Deus reportedly sends drones or Banded to investigate and repair faults.
    limit: Rat Holes discussion continues beyond printed p55. Do not mark it fully
      covered from these pages.
  mechanics_scan: Descriptive environmental dangers, floor counts and exit floors
    are exact fiction source facts; no explicit game tests, modifiers, dice, TNs,
    stats, availability or costs are printed on these pages.
