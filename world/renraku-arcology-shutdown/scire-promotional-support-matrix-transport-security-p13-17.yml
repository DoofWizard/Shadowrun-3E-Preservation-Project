data:
  document_identity: Fictional Renraku SCIRE promotional brochure and separate Shadowland
    comments. Infrastructure and safety descriptions are corporate claims unless attributed
    explicitly to an in-world commenter.
  support_and_power:
    self_sufficiency: 'Brochure claims most needs are produced within the complex:
      food grown hydroponically, power and water processing, waste handling, ventilation
      and circulation.'
    water: Brochure claims more than 90 percent of water is reused, and rainwater
      and aquaculture byproducts are collected for further use.
    fusion: Brochure claims three Stein-Henneman fusion reactors, one routinely offline
      for maintenance, power the complex independently of the Seattle regional grid.
    outside_grid_dispute: Renraku Fox claims Renraku cut its dependency on the outside
      grid after brownouts in 2056 and sells surplus power; treat as a speaker assertion,
      not an independent system specification.
  matrix:
    company_description: Brochure claims SCIRE hosts Renraku Computer Systems main
      North American data hub, disaster-recovery capacity for company operations,
      a private LTG and connectivity to Seattle LTG and Renraku Worldwide LTG.
    external_hosting: Brochure lists hosting, programming assistance, storage and
      analysis for other corporations and public databases, including SeaSource.
    expert_system: Arcology Expert Program (AEP) is described as an assistant for
      work throughout SCIRE, not an independently statted game program.
    commentary: X-Arc reports unease about AEP control; Woodridge and The Charmed
      Accountant present competing opinions about corporate outsourcing and outside-host
      security.
  transport:
    advertised_architecture: Brochure asserts the complex holds 320 floors and uses
      more than 400 elevators; elevators are placed roughly every 35 meters, with
      Heightened IntEleGence destination routing and horizontal movement by walkways
      and PeopleCarrier trams.
    height_dispute: One commenter gives a total building height of 969 meters and
      says an average floor is less than three meters; another disputes this calculation
      because of floor/ceiling structure. Preserve as attributed competing claims
      rather than a verified exact engineering schematic.
    connections: Brochure describes twelve helicopter landing pads at mall level and
      twelve on upper floors, Seattle monorail access, parking on five underground
      levels, downtown transit, public ferry and taxis.
    upper_floor_access: Specific upper floors are described as more restricted; visitor
      access is not unrestricted.
  security:
    company_claims: Brochure advertises trained private guards, cameras, perimeter
      measures, secure entrances, protected refuge booths branded Safe Zone with panicbutton,
      and HearSay voice recognition for authorization above the sixth floor.
    crisis_claim: Brochure advertises sealed glass, emergency procedures, fire suppression
      via SnuffIt extinguishers and evacuation support; these are PR assurances, not
      guaranteed conditions during shutdown.
    commentary: Insider/other Shadowland commenters question the accuracy and implications
      of the security promises, including earlier incidents. Do not infer who controlled
      later events from the brochure.
