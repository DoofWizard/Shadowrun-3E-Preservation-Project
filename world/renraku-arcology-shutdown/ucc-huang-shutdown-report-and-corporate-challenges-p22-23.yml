data:
  provenance: Fictional UCC committee minutes from FASA7328, not an objective field investigation. Each allegation
    is assigned to its named in-world speaker.
  renraku_huang_report:
    loss_of_control: Dr. Sherman Huang announces that Renraku Computer Systems no longer controls the Seattle
      arcology. The committee expresses alarm.
    december_19_incident: Huang states that at about 1800 hours on December 19, 2059, power, telecom and Matrix
      links throughout the building briefly went offline for roughly four minutes; renewed power coincided with
      security systems locking down the whole complex. He reports injuries and deaths amid the alarms and lockdown.
    contact_status: Huang says outside communications to residents have remained unreliable; penetration teams
      have had minimal success and no group has claimed responsibility or issued ransom demands.
    occupancy: Answering James Rinchik, Huang says there were 90,000 residents; counting pre-Christmas visitors
      and shoppers he suspects more than 100,000 people were inside. These are his estimates, not confirmed casualty
      figures.
    escapees: Huang says a few dozen people appear to have escaped and Renraku is sheltering the individuals it
      contacted elsewhere, a point challenged by Jessica Sirianni.
    suspected_adversary: He describes reports of arcology security units and Red Samurai operating against Renraku
      responders, some inhabitants apparently fighting alongside them, armed drones and possible external control,
      including cyberware. These are incomplete observations and hypotheses, not a confirmed perpetrator.
  attributed_counterclaims:
  - speaker: Siony Ecklund
    claim: Declares that she suspected trouble and attempts to use a communication device; chair King admonishes
      her and emphasizes confidentiality.
  - speaker: Jessica Sirianni
    claim: Challenges whether escaped residents are being silenced; raises the impact on Renraku stock and makes
      a pointed comparison to Fuchi-related corporate tensions.
  - speaker: Nicholas Aurelius
    claim: Warns that a sudden takeover could endanger other major corporate complexes; challenges dismissive
      responses by Maximillian Lozano.
  - speaker: Samantha Villiers
    claim: Denies Fuchi involvement, rejects insinuations about herself and the arcology, and distinguishes Fuchi
      internal affairs from her own former husband Richard Villiers.
  - speaker: William Loudon
    claim: Points out that Renraku built the heavily armed facility and the people holding the internal weapons
      are unknown; he emphasizes possible danger to downtown Seattle.
  - speaker: Masaru Shirokawa
    claim: Says Renraku did not approve or condone the controversial Fuchi-linked project alluded to by William
      Loudon; he disputes an internal conspiracy without proving its absence.
  evidentiary_limit: Do not convert theories about outside conspiracies, shareholder rivalry, mutiny, machine
    control or a cyberware-linked threat into definitive lore on the basis of this dialogue. No game-rule modifiers
    are specified.
