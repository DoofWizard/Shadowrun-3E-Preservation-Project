data:
  document_identity: A Renraku promotional brochure for the fictional Seattle SCIRE
    (Self-Contained Industrial-Residential Environment), introduced as a leaked source
    by Captain Chaos; its positive claims are corporate representations, interleaved
    with separate Shadowland commenters.
  corporate_speaker: Dr. Sherman Huang, identified in the brochure as President and
    Divisional Manager, Renraku America, welcomes residents; the brochure asserts
    SCIRE is a combined living/work/learning complex.
  residential_claims:
    claimed_population: More than 90,000 Renraku employees and family members live
      there.
    building_blocks: Residential blocks are presented as eighteen or twenty consecutive
      stories, approximately 600 residents on each floor, with about half of each
      floor containing suites and an average suite exceeding 200 square meters.
    services: Brochure describes reconfigurable suites, smart-home fixtures and entertainment
      modules, indoor parks, shopping complexes, fresh produce, seafood supplied by
      aquaculture, schools from prekindergarten through grade twelve, and the planned
      2062 Renraku University.
    medicine: Brochure describes small clinics on residential floors and fifteen fully
      staffed hospitals in residential zones.
    leisure: Mentions arcology zoos, game arcades, sim rides, nightclubs, FunZone
      amusement park and Grand Mall.
  industrial_claims:
    manufacturing: Brochure describes SCIRE as Renraku North America headquarters
      and manufacturing center; lists mainframes and computer components, software
      labs, consumer electronics, and cyberware as in-building products.
    software: Renraku Worldwide PLTG virtual labs and mass-production/distribution
      are claimed; one of its quoted taglines is Programs For People Like You.
    laboratory: The PureFlow IV datajack is advertised as designed and made in the
      arcology, but not provided as a game-stat item here.
    worker_safety: Brochure and Anderson claim safe, efficient manufacturing, while
      an identified Shadowland commenter X-Arc disputes this using an alleged March
      2059 factory fire with 27 worker deaths and alleged quality pressure. These
      are competing claims, not a resolved casualty finding.
  commentary_examples:
  - speaker: Anderson
    role: Shadowland commenter
    substance: Comments favorably on reconfigurable residential units and manufacturing
      safety.
  - speaker: X-Arc
    role: Shadowland commenter
    substance: Describes residential income stratification and disputes the company
      account of its workplace safety.
  - speaker: Renraku Fox
    role: Shadowland commenter
    substance: Questions the claimed benefits of retaining employees within the corporation-controlled
      environment.
  edition_limit: The page contains promotional product names but no character equipment
    ratings, game target numbers, or item purchase costs; no mechanics are inferred.
