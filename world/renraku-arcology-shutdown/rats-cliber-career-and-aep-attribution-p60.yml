data:
  provenance: In-world Shadowland comments on Peregrine’s Resistance story, not a
    neutral real-world biography. Named poster attribution and disagreements are preserved.
  claims:
  - speaker: Ellie
    report: Identifies Vanessa Ellen Cliber; claims birth on June 21, 2008, in New
      Orleans, Louisiana; family moved to Houston; mother died in a car accident when
      Vanessa was three; she was raised by her father, a Rice University mathematics
      professor.
  - speaker: Ellie
    report: Claims Cliber was high-school valedictorian, went to Rice University,
      earned bachelor’s degrees in computer science and cognitive science, then went
      to Stanford for a master’s and completed a Ph.D. at Cornell.
  - speaker: Ellie
    report: Attributes early work to Obleeck computer corporation in the 2030s, including
      the SculptFlex system used for college-level Matrix sculpting, followed by Rager
      Systems. Says Dr. Sherman Huang recruited her for the newly formed Artificial
      Intelligence Project in the 2040s and that she later joined Renraku.
  - speaker: Neon Wraith
    report: Challenges the idea that Cliber created the AI without assistance.
  - speaker: Insider
    report: Claims Cham Lam Won and Sherman Huang helped develop the original AEP;
      characterizes Cliber as the primary contributor. Does not establish those roles
      as verified narrator facts.
  - speaker: Orange Queen
    report: Criticizes Renraku for undertaking technology it could not control.
  - speaker: Renraku Fox
    report: Suggests Cliber could not anticipate the AI seizure and that the shutdown’s
      motivation is still unknown.
  - speaker: FastJack
    report: Asks for additional identifying details on Cliber; the thread does not
      provide independently verified answers.
  uncertainty: Cliber’s biography and the attributed AEP project roles are as reported
    by in-world Shadowland contributors. AEP culpability, individual responsibility,
    and Deus’s creation remain contested within this source.
  mechanics_scan: No dice-based SR3 procedure or stat block accompanies the biographies.
