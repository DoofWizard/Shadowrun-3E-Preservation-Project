data:
  source_frame: 'Peregrine and named in-world Shadowland contributors in the historical
    FASA Corporation Shadowrun tabletop-RPG source Renraku Arcology: Shutdown (1998,
    FASA7328, original Third Edition). Descriptive security lore is not a modern procedural
    instruction.'
  rat_holes_continuation:
    security: Arcology described as intensely monitored by multiple video, trideo
      and audio systems; Resistance sometimes disrupts SCIRE feeds by power interruption.
    refuges: Peregrine names elevator and ventilation shafts and little-watched areas
      as temporary Resistance shelters, as well as an aquatank supporting a cell,
      and some hydroponics/agriculture sections, though the AI increasingly monitors
      them.
    risk: The AI reportedly can repurpose drones for reconnaissance of once-unwatched
      floors and has flooded or burned locations used as shelters; escaped paranormal
      zoo animals present a separate hazard.
  communications:
    jamming: Peregrine says the AI attempted to block incoming and outgoing communications
      after the shutdown, monitored transmission bands and used electronic interference
      selectively, while remaining dependent on communications for its agents.
    resistance: The Resistance attempts to interfere with those links; no specified
      game check or numerical modifier is provided.
    named_comment: Flak says UCAS Army intercepted drone/snakes-eye transmissions
      but could not decode them, then says the military jammed some primary frequencies
      for over a day. The transmission remains an alleged in-world report.
  exits:
    overview: The Resistance seeks to evacuate captive innocents; Peregrine describes
      entrances/exits sealed, with an occasional escape through an orc/ork tunnel.
    reported_barriers: Peregrine discusses fortified street access, bus and monorail
      stations, underground links, helipads and five elevated Interstate-5 on-ramps,
      each said to be guarded or obstructed; these are historical fictional setting
      descriptions, not a detailed real-world bypass plan.
    speculative_weakness: Peregrine regards some mall and ground-floor accesses as
      relatively vulnerable but describes Blues, drones and released paranormal creatures
      there. Other speakers debate possible routes, including a disputed blocked ramp
      and danger at the mall.
    participants:
    - name: Kapitan Krude
      position: Speculates the Arcology Expert Program knew all architectural defenses.
    - name: Link
      position: Lists possible public entrances but is corrected about their fortification.
    - name: Renraku Fox
      position: Describes designed exterior defenses; comments on risk.
    - name: Kagehika
      position: Claims a barrier on a southeast ramp remained partially open after
        a Rolls Prairie Cat collision; no independent verification.
    - name: Edge
      position: Speculates about viral-sample access after reports of dzoo-noo-qua-like
        creatures; allegation and identification unproven.
  rules_scan: No quantified game checks or stats on p55–57. The named floors and locations
    are setting geography, not equipment performance mechanics.
