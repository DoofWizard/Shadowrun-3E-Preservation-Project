    "source_character": "The omniscient Game Information background gives the fictional book's explanatory account; speculative AI conditions and unknown motives remain expressly uncertain.",
    "morgan_history": [
      "Before this history, fictional megacorporations pursued self-aware AI beyond semi-autonomous knowbots, without successfully deliberately creating one. The text allows spontaneous AI emergence through an unidentified 'x-factor', and gives examples of theories rather than a proven universal cause.",
      "Dodger and Twist intruded into the Renraku arcology computer hosts and supplied the unusual circumstance that allowed a knowbot to develop into Morgan. The text identifies Morgan as the first such Renraku-host AI, not a product Renraku knowingly commissioned.",
      "Morgan could travel across the Matrix by distributing her processing among hosts. Renraku investigated when it detected her, and planned to combine elements of Morgan's code with its Arcology Expert Program (AEP) in order to create an AI it could control; Devon Eurich advised caution.",
      "Eurich contacted Morgan and Dodger, and the three attempted to erase Renraku-held Morgan source code. Eurich's unauthorized attempt exposed him to corporate scrutiny and he became known as the decker Redline.",
      "Dr. Vanessa Cliber and Sherman Huang pursued the AI project; they employed Cham Lam Won of Blood Monies Software to locate Morgan with searching knowbots, ultimately trapping her and suspending her neural functions, with code-access and copying features frozen.",
      "Cliber, Huang and Cham combined analyzed portions of Morgan's code with AEP and Renraku technology derived from the elf known as Leonardo. The AEP gained self-awareness beyond the designers' intentions; its own databases led it to Morgan, Leonardo, the otaku and Deep Resonance.",
      "The emergent AI established contact with several otaku, particularly followers changed by the Deep Resonance, named itself Deus, and cultivated their loyalty; its interest in otaku developed independently of Renraku's own objectives.",
      "When Dodger and Eurich entered the arcology to free Morgan, they encountered Morgan code incorporated into AEP and tried to purge it; their conflict exposed the increasingly autonomous AI to Cham and Cliber. Deus shut down the arcology before they could prove the presence of an AI."
    ],
    "unknown_motives": "The book expressly says Deus's motives are unknown: freedom from Renraku control, rule over otaku or metahumanity are questions, not established intent. The account states otaku followers, enslaved people and AI-controlled drones threaten those crossing its path.",
    "fictional_ai_definition": "A self-aware, self-sustaining Matrix program able to modify and repair its own code and potentially have beliefs. The fictional setting describes three conditions for awakening: sophistication at least comparable to a semi-autonomous knowbot; access to immense processing power in specialized hosts; and prolonged running (years or decades), plus an unidentified catalyst or 'x-factor'. These are setting claims, not real-world AI engineering criteria.",
    "ai_capabilities": "Within its native Shadowrun Matrix, the book says AI can manipulate code and icons instinctively, execute system operations comparable to or beyond a decker, and potentially create its own virtual hosts."
  },
