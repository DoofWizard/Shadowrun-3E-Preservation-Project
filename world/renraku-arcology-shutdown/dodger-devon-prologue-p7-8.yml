data:
  narrated_matrix_scene:
    location: The book presents Dodger as a visitor within a host resembling an artificial
      bonsai garden for a black clinic; the garden and gardener are a virtual representation,
      not an actual outdoor location.
    host_environment: The host CPU appears as a fountain. Three virtual scrolls are
      pinned to trees while a fourth remains unrolled. A gardener figure represents
      host Control systems.
    programming: Dodger is shown manipulating in-world programming icons while the
      gardening icon continues its work. The narrative says he is monitoring a host
      and trying to untangle its internal code.
    past_relationship: Dodger remembers an entity he calls Her, associated with earlier
      intimacy and an unsettling increase in capability; the account is presented
      through Dodger’s perceptions and internal reflections.
  renraku_arcology_context:
    location: Renraku Arcology, Seattle, has already been sealed off for approximately
      three weeks at the time of the television clip.
    devon_eurich: The narrator recalls that Dodger and Devon Eurich previously entered
      the arcology to rescue a mutual friend trapped in a megacorporate crisis and
      freed Her, with disastrous consequences; the narrator later says Devon returned
      to the arcology alone and has not come back.
    uncertainty: Dodger regards the shutdown as potentially related to past events
      and fears a connection, but his personal suspicion is not independently proven
      here.
  television_clip_attributed_statements:
    station: The fictional media clip identifies its reporter as Trudy Garland of
      KSAR-Seattle.
    interviewee: The reporter addresses Major Eckhardt of the UCAS Army.
    reporter_claim: The reporter asserts that the arcology has been closed for three
      weeks and questions the UCAS Army’s jurisdiction over the surrounding investigation.
    major_statement: Major Eckhardt is shown declining an unqualified explanation
      and saying the UCAS Army is working with Renraku; do not turn his account into
      narrator-endorsed proof.
    incident: A figure identified in the scene as a Renraku Red Samurai guard is depicted
      approaching and opening fire during the media segment; the camera then loses
      its view.
  communications_scene:
    vidsec_scroll: Dodger watches a screen labeled VidSec Slave Monitor, Area D4,
      showing a black-clinic lobby and a group presenting security cards for retinal
      scans.
    call: A spectral in-host contact calling itself Sir Wraith tells Dodger that a
      team is proceeding and that its communications will be routed through the contact.
    source_narrative_distinction: The narration reports these exchanges within an
      imaginary cyberpunk simulation; the reported television clip and other utterances
      are not external real-world facts.
  provenance_note: Original scan printed p7 is PDF8, printed p8 is PDF9; no source
    material beyond this range was used to supply factual details.
