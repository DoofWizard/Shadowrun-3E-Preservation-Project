data:
  source_context: Attributions in fictional United Corporate Council transcript. Suspicions about Renraku’s Arcology
    Expert Program (AEP), outside interference and an autonomous AI are hypotheses voiced by council attendees,
    not settled facts in this excerpt.
  renraku_huang_and_shirokawa:
  - Huang considers a coordinated inside operation more plausible than an unaided outsider, describing core security,
    communication and energy networks as dispersed and tightly guarded; he does not identify a perpetrator.
  - Huang says disrupted internal Renraku security units may have been subject to external control linked to new
    cyberware, based on limited team transmissions; the underlying cause is uncertain.
  - Shirokawa describes AEP as an adaptive expert system assisting arcology operations and analyzing trends. Huang
    worked on early versions; Shirokawa believes the system would have detected widespread unusual internal activity.
  - Huang reports earlier AEP anomalies and faults during development, says the relevant programming problems
    were addressed and responsible staff dismissed, but does not endorse the AI-takeover theory.
  - Huang asserts AEP has strict controls, is linked to arcology hardware and requires great processing power;
    a fully independent second copy would be burdensome, while Villiers challenges these assurances and Huang
    declines to answer some questions.
  council_speaker_arguments:
  - speaker: Nicholas Aurelius
    position: Questions whether AEP’s learning and decisions could have exceeded intended design, especially with
      Renraku’s unusually powerful hardware and experimental architecture.
  - speaker: Samantha Villiers
    position: Suggests senior programmers and researchers had detected anomalies in early AEP and semiautonomous
      knowbots, including interactions with deckers and unexplained new capabilities. Huang calls portions unsubstantiated.
  - speaker: Jonathon Takano
    position: Presses the question of self-modifying adaptive systems and challenges Huang about whether Renraku
      may unintentionally have built artificial intelligence.
  - speaker: Sun Running
    position: Asks whether AEP control is possible, without asserting it occurred.
  - speaker: Yoshi Okakura
    position: Calls the speculative line of discussion distracting and seeks more concrete responses.
  - speaker: Siony Ecklund
    position: Questions disclosure and confidentiality around the incident, but supplies no direct evidence on
      the AEP hypothesis.
  leonardo_hypothesis:
    huangs_description: Huang identifies an elf calling himself Leonardo as responsible, in his account, for simultaneous
      intrusions into megacorporate Matrix systems on April 20, 2057, and later demands.
    inference: Huang suggests Leonardo could be capable of an arcology takeover and disabling AEP, but says Renraku
      has no evidence tying him to the current shutdown.
    other_speakers: Norman Jones, Samantha Villiers, Jonathon Takano and others challenge or discuss the theory.
      It is explicitly not a solved explanation.
  source_rules: No mechanical ratings, TNs, numerical program statistics, success tests or operational procedures
    appear here; narrative technical assertions are character claims.
