    presentation: Boxed original narrator historical/event chronology with rhetorical
      introductory question; distinct from Captain Chaos main-text narration on p25.
  fictional_dated_events:
  - year: 2003
    event: A North Sea-region flash flood in Germany spreads toxic water; Hamburg
      is flooded in sewage and several nuclear power plants undergo emergency shutdowns.
  - year: 2004
    event: A nuclear meltdown in Kent, Great Britain creates a local irradiated zone
      and kills more than 6,000 people.
  - year: 2005
    event: An earthquake in New York City kills 200,000 people and causes billions
      of nuyen in damage.
  - year: 2008
    event: A meteor strikes the Mir II space platform, which the source says the Russians
      recently sold to Harris-3M Corporation; two crew die in the impact and the other
      crew members later die after a failed Harris-3M rescue launch.
  - year: 2009
    event: A meltdown at the Cottenom French nuclear plant near Germany contaminates
      Luxembourg, French Lorraine and German Saarland.
  - year: 2011
    event: Hurricane-strength winds drive contaminated North Sea water into the Elbe
      River, breaking dams and dikes and flooding the Netherlands and parts of Belgium,
      Germany and Denmark; western England, Wales and central Scotland suffer separate
      floods, landslides and an earthquake, followed by toxic leaks and river spills;
      two British nuclear plants melt down, killing thousands.
  - year: 2016
    event: A group identified by the narrator as terrorists causes a major North Sea
      oil spill penetrating more than 20 miles inland and creating the fictional Scottish
      Fringe Toxic Zone.
  - year: 2028
    event: A major earthquake in Los Angeles destroys LAX.
  - year: 2039
    event: A chemical spill in London’s Teeside district kills more than 70,000 people,
      as the source names the district.
  - year: 2042
    event: The source reports the Polydopa scandal and says Zeta-ImpChem appears to
      have dumped neurotoxins in central Africa for the preceding four years; listed
      consequences are 4,000 deaths and 35,000 cases of irreversible brain damage.
      The dumping allegation retains the original “seems” uncertainty.
  - year: 2051
    event: A major earthquake affects the San Francisco Bay Area.
  - year: 2053
    event: A United Oil tanker discharges millions of gallons of petrochemicals into
      Boston Harbor; the source describes surviving marine life as severely mutated.
  classification_and_limits:
    content_class: world_fact
    no_game_mechanics: The boxed list provides fictional calendar years, geography,
      casualties and damage context; it contains no TN, test, player option, rules
      procedure or mandatory game modifier.
    certainty: The named corporation and cause claims are source-qualified; the 2042
      item explicitly reports suspicion, not a confirmed finding. Chronology is original
      edition-specific fictional history.
    coverage: Only the original p25 boxed dated event list; main prose and the p26-35
      historical narrative are separate canonical audit tasks.
