  source_location:
    chapter: Welcome to the Shadows / And So It Came to Pass...
    source_subheading: Magic on the Cutting Edge
    printed_page: 26
    physical_pdf_page: 27
    presentation: Original boxed date-indexed magical research and lore reports, separate
      from the Wyrm Turns box and the main historical prose.
  fictional_historical_entries:
  - year: 2021
    source_assertion: Sheila Blatavska founds the Atlantean Foundation, which advocates
      a return to what it calls the enlightened days of Atlantis.
    qualifier: The narrator is skeptical of the Foundation’s claim about such days,
      and does not establish Atlantis as independently historical.
  - year: 2025
    source_assertion: UCLA starts the first undergraduate program in occult studies.
      Within three years, similar programs appear at Texas A&M, the University of
      Chicago, MIT (renamed MIT&M, or Mind and Magic), Oxford, Edinburgh University
      and several German universities.
  - year: 2039
    source_assertion: A detective-mage in Charleston, South Carolina captures a serial
      killer after questioning the ghost of one of the killer’s victims; the ghost’s
      actions reveal evidence leading to an arrest and conviction.
    qualifier: The narrator says the ghost-derived evidence was upheld in the fictional
      courtroom; the account does not provide any tabletop test or legal procedure.
  - year: 2053
    source_assertion: Newly published magical theories describe an anchoring skill
      by which a mage could cast a spell that remains inactive until particular circumstances
      trigger it.
    qualifier: This is a reported in-world development, not the operative tabletop
      rules for anchoring, its tests or prerequisites.
  - year: 2054
    part: I
    source_assertion: Boston scholars and archaeologists report a find about 130 miles
      off Crete, in an area associated in the narrative with the island of Thera.
      The Atlantean Foundation finances the expedition, which discovers artifacts
      claimed by some to be connected with lost Atlantis.
    qualifier: The narrator explicitly questions whether the site has that significance;
      experts dismiss claims that the artifacts are magical.
  - year: 2054
    part: II
    source_assertion: In Tir Tairngire a self-described mage-historian named Lacrimo
      claims the eruption that formed Crater Lake occurred on July 22, 3454 B.C. Weeks
      later, the Tir military closes Crater Lake; a Sioux-registered airbus entering
      the area suffers engine failure and crashes with no survivors.
    qualifier: The exact ancient eruption date is Lacrimo’s declaration, not verified
      narratorial chronology. The printed page does not establish a cause for the
      engine failure.
  source_class_limits:
    content_class: world_fact
    source_caveats: The entries include narrator skepticism, reported allegations,
      court and academic claims and an unproven date; those degrees of certainty are
      not normalized into absolute fact.
    mechanical_boundary: No actual spell anchoring procedure, TN, Force, Drain, metamagic
      cost, rating or rule option is present in this boxed historical list. Existing
      FASA7001 magic source and procedure records remain authoritative for mechanics.
    scope: Only p26/PDF27 Magic on the Cutting Edge box; other p26 narrator claims
      and p27-35 are separately tracked.
