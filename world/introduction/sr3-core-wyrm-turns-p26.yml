  original_fictional_chronology:
  - year: 2012
    source_assertion: Lofwyr appears in Germany and begins making moves toward becoming
      a major corporate player.
  - year: 2020
    source_assertion: After the ruling ayatollah in Iran calls for jihad against the
      emerging metahuman races, the dragon Aden destroys the city of Tehran; the book
      states this as its own fictional history, not as a real-world event.
  - year: 2039
    source_assertion: Dunkelzahn’s second interpreter resigns. Nadja Daviar, an Eastern
      European elf with no personal history on file, replaces the interpreter.
    qualifier: The narrator adds a subjective aside about looking into her past; the
      book does not explain the resignation or prove a hidden history.
  - year: 2041
    source_assertion: EuroAir Flight 329, travelling from London to Atlanta, is destroyed
      over the Atlantic. A garbled last transmission and recovered tapes indicate
      an attack by a dragon, tentatively identified as Sirrurg, and a passenger using
      sorcery to hold the creature off for several minutes.
    qualifier: The dragon identification and sequence are based on a damaged report
      and recovered recordings; the attribution to Sirrurg is explicitly tentative.
  - year: 2042
    source_assertion: Dunkelzahn launches Wyrm Talk, a twice-yearly video program
      with celebrity interviews and commentary on culture and society; the narrator
      directs viewers to reruns on Seattle’s Channel 62.
  - year: 2053
    source_assertion: Tir Tairngire attempts to capture Shasta Dam in northern California.
      Hestaby forces the elven troops to withdraw and takes control of the dam and
      surrounding land.
