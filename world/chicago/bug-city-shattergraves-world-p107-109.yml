    historical_location: Former IBM Tower site within Chicago's Loop and the surrounding collapsed and burned blocks.
    source_period_history: The reproduced Neo-Anarchist's Guide account dates the destruction of the IBM Tower to three days after the Night of Rage, attributing it to the Alamos 20,000 using magic and explosives. It reports 26,000 deaths in the collapse and resulting fire; these are in-universe source claims.
