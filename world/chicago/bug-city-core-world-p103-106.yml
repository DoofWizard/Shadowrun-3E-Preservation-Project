  sites:
    - id: place.chicago.ghoultown
      name: Ghoultown / Cabrini Refuge
      printed_page: 103
      source_role: Closing section of Ghoultown entry
      described_features: Ghoul hospital with medical needs; competing nationalist and coexistence-oriented community currents; residents oppose insect incursions.
      relations: [organization.humanis_policlub, organization.volk]
      related_guidance: reference.chicago.bug_city.ghoultown_hooks_p103
    - id: place.chicago.goose_island
      name: Goose Island
      printed_pages: '103-104'
      geography: Mile-long island between a Chicago River channel and the main river, formed by cutting a channel between Chicago Avenue to the south and North Avenue to the north.
      historical_reference: A reproduced 2020 city guide says the island was created in 1850 by Chicago Land Company and that early residents raised geese; it also describes a former brewery.
      source_status: Historical city-guide excerpt plus separate 2055 network testimony; present-day gang control is not independently established by the historical excerpt.
      related_claims: world.chicago.bug_city.core_claims_p103_106
    - id: place.chicago.grant_park
      name: Grant Park / Haymarket Nation
      printed_pages: '104-105'
      geography: Former Grant Park near Balbo Drive and Michigan Avenue, Chicago.
      historical_reference: A reproduced 2023 city guide recounts the 1968 anti-war demonstrations; a separate reproduced New York Times account dated May 5, 1886 concerns the Haymarket gathering.
      source_status: The location is an entry in the 2055 gazetteer; Haymarket Nation's governance, security and market activity are characterized in in-world commentary and a UCAS Section 3 assessment, not proven by the old guides.
      linked_organizations: [organization.haymarket_nation, organization.panthers]
      related_claims: world.chicago.bug_city.core_claims_p103_106
    - id: place.chicago.leos_lunchbox
      name: Leo's LunchBox
      printed_page: 106
      historical_address: 1809 W. Division St., Chicago
      historical_phone: '312/555-1969'
      historical_reference: The reproduced 2019 Akbar restaurant guide describes a modest storefront restaurant, varied dishes, low prices and a notable sweet-potato burrito.
      source_status: Restaurant existence and pre-Containment description come from the old guide; operating hours, protection and UCAS intelligence connections during the Zone are separately attributed network claims.
      related_claims: world.chicago.bug_city.core_claims_p103_106
    - id: place.chicago.little_earth
      name: Little Earth / University of Chicago
      printed_page: 106
      geography: Southeast lakefront portion of the University of Chicago campus, formerly Jackson Park.
      historical_reference: Reproduced Neo-Anarchist's Guide material associates the area with a fringe magical community near the university.
      source_status: A network respondent supplies the more detailed 2055 account of adepts, faculty, foci, mutual aid and barter; these are attributed in the linked claims record.
      related_claims: world.chicago.bug_city.core_claims_p103_106
  mechanical_status: No new game-resolution tables, target numbers, tests, modifiers, costs or equipment statistics appear in these printed pages.
