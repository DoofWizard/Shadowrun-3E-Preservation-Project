data:
  hanna_uljaken:
    p: '148'
    pdf: '157'
    background: Former special assistant to Truman Technologies CEO Daniel Truman. Stayed when the family evacuated
      to coordinate an unsuccessful search for Melissa. Escaped Truman Tower's insect invasion, met Teller near
      blast ground zero, and now helps run Wrigley Dome.
    traits: Tall, slender, Nordic ancestry, almost-white blond hair; perceptive, discreet, naturally charismatic,
      little prior magical experience but learning rapidly through friendship with Teller.
  melissa_truman:
    p: '148'
    pdf: '157'
    identity: Sixteen-year-old youngest daughter of Daniel Truman; previously worked in international modeling.
    family: Close to brother Mitch, abducted and ultimately killed by insect spirits. Both resented restricted privileged
      lives and believed their father did not care personally for them.
    disappearance: Evaded Knight Errant guards and missed family evacuation; location within the Zone unknown.
    traits: Dark hair and eyes, quick-witted, sharp-tongued, restless, dissatisfied, easily bored and seeking excitement
      without clear goals.
    search: Parents offer substantial money for return or reliable information; continued survival remains uncertain.
  linda_hayward:
    p: 148-149
    pdf: 157-158
    identity: Human identity survives only as memories retained by a mantis spirit inhabiting her body.
    human_history: Born Chicago 2019; parents died 2039; lived alone until records cease in 2051.
    affiliation: Desolation Angels, all female mantis spirits able to adopt the outward form of human or metahuman
      women.
    appearance: Human host has blue eyes and dark hair.
    relationship: While in human form began a romance with Daniel Truman's seventeen-year-old bisexual son Mitchell,
      originally intending him as host for a male mantis. Became attached and did not perform that investment. Her
      explanation of his death is a separate attributed claim.
    current_location: Whereabouts and activity in the Zone unknown.
  jerome_standish:
    p: '149'
    pdf: '158'
    office: Former Chicago mayor; lost last election before the Wall. Subsequently became a powerful Zone warlord.
    appearance: Pale, wasted frame and detached behavior; apparent mid-forties, exact age uncertain.
    background: Chicago native with a period as mercenary for an unidentified Caribbean League government. Parents
      died when movers accidentally dropped a sofa from a fifth-floor balcony onto them. No marriage or children
      recorded; defended seven paternity suits while mayor.
    uncertainty: Ambitions, motives, alleged occult affiliations and undead nature are not established.
  catherine_cunningham:
    p: 149-150
    pdf: 158-159
    canonical_id: person.chicago.cathy_cunningham
    identity: Human warlord, also called Catherine the Terrible; Russian maternal ancestry, proud of heritage and
      regards nickname ironically.
    traits: Intelligent, charismatic, ruthless toward actual or perceived enemies. Susceptible to flattery and easily
      angered by minor slights, but retains rational judgment. No apparent racial prejudice toward followers.
    background: UCAS Intelligence service; little else known. Rapidly gained major Zone influence.
    appearance: Tall, slender, light-gray eyes, very pale blond hair; appears 30-40, age unconfirmed.
    magic: Hermetic status not established; preserve alternative game profiles separately.
  king_vlad:
    p: '150'
    pdf: '159'
    canonical_id: person.chicago.king_vlad
    identity: Very large ork warlord, self-styled King of the Orks.
    governance: Intelligent, brutal and suspicious; some lieutenants killed for excessive initiative. Unpredictably
      rewards or punishes capable followers, keeps close knowledge of his domain and uses overwhelming force against
      rebellions.
    prejudice: Despises non-orks, assigns them menial utility, and especially enjoys humiliating elves; these are
      his attitudes, not narration endorsing them.
    appearance: Half the left ear is missing; its cause is contested.
  tamir_grey:
    p: 150-151
    pdf: 159-160
    role: Ghoul-rights spokesman and principal Ghoultown leader
    history: Before Cabrini Refuge, volunteered three years helping sewer-dwelling people afflicted with what later
      became known as Krieger Strain HMHVV. Earned ghoul trust and safe passage. After infection was cared for by
      those he had helped; prior health and will helped him retain personality despite transformation.
    advocacy: Continued for the next five years as a ghoul; early petitioner to Metahuman Rights Coalition for formal
      recognition of ghouls as a metahuman race. Honored when Grey became one of the first ghoul names.
  blaine_hammond:
    p: '151'
    pdf: '160'
    role: Militant ghoul-nationalist leader responsible for Ghoultown security
    history: Born and raised a second-generation ghoul, outwardly ordinary enough to interact with humans; left
      sewers at twelve and learned from people he treated as prey. Early asylum applicant after Special Order 162,
      organized watch and resistance to extremist attacks, later led resident security when Knight Errant declined
      to renew its Refuge contract.
    appearance: Displays scars from confrontations with racists and police.
