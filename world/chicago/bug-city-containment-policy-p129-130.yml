data:
  permanent_solutions_p129:
    context: After Chicago-related Matrix disclosures, international pressure rises for UCAS to resolve the Chicago Containment
      Zone crisis.
    advising_actors:
    - Tir Tairngire government
    - Great Dragon Lofwyr
    position_attributed_to_advisers: Conventional military action would not liberate Chicago from insect spirits; a large-scale
      magical strike could rouse dormant spirits; wait for a different solution.
    source_epistemic_limit: The text does not establish when or whether the promised solution appears.
  wall_character_p129: The Zone barrier primarily consists of unstable loose debris, difficult to climb or penetrate and not
    primarily engineered to prevent movement in.
  security_posture_p130:
    units:
    - UCAS military
    - Illinois National Guard
    - counterforce teams
    counterforce_membership: Mixture of combat mages, street samurai, cyber-enhanced mercenaries and similar trained operatives,
      recruited from UCAS military ranks.
    external_patrol_and_reinforcement: Encampments, aircraft assets, carrier support, and staging bases occupy perimeter rather
      than all being at the wall.
    guards_personal_view: Some serving troops believe the containment policy preserves outside lives but may hesitate at lethal
      attacks on trapped civilians.
  source_scope: In-universe setting and attributed advisory claims, not an endorsement of military policies.
summary: Source-period setting account of the Zone perimeter and attributed policy advice.
