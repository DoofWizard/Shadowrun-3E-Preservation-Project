data:
  setting_era: 2055 Chicago Containment Zone
  chapter: Warlords
  chapter_prepared_by: Hawkeye
  background:
    approximate_warlord_count: 50-60
    scale_variation: Some control large territories with small armies, while others command little more than a single
      gang.
    economic_relationship: Tribute in supplies and supporters, interception of air-dropped supplies, taking abandoned
      stock, and payments extracted from smaller factions are described as typical sources of power.
    strongest_named_rivals:
    - Catherine the Terrible
    - King Vlad
    relation_to_gangs: Major warlords subjugate subordinate local gangs and levy contributions from them.
  figures:
    catherine_the_terrible:
      canonical_id: person.chicago.cathy_cunningham
      source_printed_page: 124
      personal_name: Cathy Cunningham
      sobriquet: Catherine the Terrible
      prior_occupation: UCAS intelligence operative
      region: Large area south of the Noose, shown on the upper map of printed page 124.
      subordinate_gang_count_approximate: 150
      supporters: A mixed human, ork and troll force, with a small group of combat mages.
      material_resources: Armored vehicles and military-specification weapons.
      source_qualifier: Continued UCAS intelligence-service contacts are believed possible by the book's narrator,
        not independently verified.
      governance: Challenges to her position are met harshly; people who acknowledge her authority are described
        as receiving preferential treatment.
      conflict: Principal rival of King Vlad within the Zone.
    king_vlad:
      canonical_id: person.chicago.king_vlad
      source_printed_page: 124
      identity: Self-proclaimed ork king
      primary_force: Raging Horde
      canonical_force_id: org.chicago.raging_horde
      region: Large northwest sector of the Containment Zone, shown on the lower map of printed page 124.
      territorial_activity: Horde members are described as periodically attacking smaller settlements and rival
        gangs outside their core territory.
      materiel:
        firearms:
        - rifles
        - handguns
        vehicles:
        - modified old cars
        - trucks
        - motorcycles
        military_specification_weapons_or_armored_vehicles: Not described as available to this force, in contrast
          with Cunningham's army.
      governance: Violent toward opponents but tolerant and generous toward those loyal to him; must contend with
        internal opposition among subordinate gangs.
