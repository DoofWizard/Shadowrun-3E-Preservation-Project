id: world.chicago.bug-city-core-hospital-dodger-claims-p93-95
record_type: attributed_matrix_commentary
status: source_reviewed
source: source.fasa-7117
printed_pages: '93-95'
pdf_pages: '102-104'
edition_scope: Historical Shadowrun Second Edition setting; no inferred SR3 supersession
content_class: [attributed_claim]
data:
  comments:
    - speaker: Jasper
      printed_page: 93
      certainty: rumor
      subject: Core art collections
      account: Says wealthy collectors are commissioning recovery of art left in the Core, including works that changed hands during earlier unrest.
    - speaker: Zapatista
      printed_page: 93
      certainty: local_report
      subject: Corporate properties
      account: Says some evacuated corporate facilities still hold abandoned equipment and other valuables, and that independent scavengers and returning security units may be present.
    - speaker: Dreyfus
      printed_page: 93
      certainty: inference
      subject: Matrix data
      account: Reports Chicago Matrix nodes failed when the Wall went up and speculates that corporations could not retrieve all their stored information.
    - speaker: Flynt
      printed_page: 93
      certainty: dismissive_reply
      subject: Matrix data
      account: Rebukes Dreyfus without supplying independent evidence.
    - speaker: Ripsaw
      printed_page: 94
      certainty: local_report
      subject: Dr. Nemur at Cook County Hospital
      account: Claims former military surgeon Dr. Nemur remained at the depleted hospital and provides medical care with limited supplies, giving priority to those offering money or barter.
    - speaker: Hawkmann
      printed_page: 94
      certainty: local_report
      subject: Dr. Nemur at Cook County Hospital
      account: Disputes the characterization of Nemur as purely profit-driven; says she sometimes cares for people without compensation, while outside military and local groups supply her and receive favored access.
    - speaker: Vince D
      printed_page: 94
      certainty: hearsay
      subject: Dr. Nemur at Cook County Hospital
      account: Says Nemur accepts services or favors promised for later repayment and issues vouchers for later work; gives an example involving 50 ampoules of metacyclin.
    - speaker: BeBop
      printed_page: 94
      certainty: local_report
      subject: Dr. Bob cyberware clinic
      account: Says Dr. Bob operates a costly body shop out of the hospital, can work on clients' existing cyberware, and sometimes offers used cyberware without guarantees.
    - speaker: JOCKO SWEAT
      printed_page: 94
      certainty: unverified_question
      subject: Hospital morgue
      account: Asks whether insects reportedly inhabit the Cook County morgue; no confirmation is provided.
    - speaker: Roy Ko
      printed_page: 94
      certainty: local_report
      subject: Daley Gardens
      account: Says the intended corporate residents did not arrive and a subsequent government leasing arrangement converted the complex into low-income residences, benefiting the developers.
    - speaker: Subject 32 NS-R (Squeaky)
      printed_page: 95
      certainty: first_person_account
      subject: Daley Gardens insect infestation
      account: Describes a night visit to the former residential complex in which a mage noticed another group, an insect creature appeared, and an injured centipede-like creature split into two independently moving portions; narrator fled. This is an in-world recollection, not corroborated fact.
    - speaker: Rat Boy
      printed_page: 95
      certainty: opinion
      subject: Daley Gardens
      account: Contrasts the site's initial luxury aspirations with the reported later infestation.
    - speaker: Markos
      printed_page: 95
      certainty: local_report
      subject: The Dodger
      account: Says the venue no longer features live bands but still supports dancing, with parking now available.
    - speaker: Scenester
      printed_page: 95
      certainty: local_report
      subject: The Dodger
      account: Says the venue was looted; DJ Nicky plays old vinyl records instead of live acts, and visitors bring their own beverages.
    - speaker: Harvester
      printed_page: 95
      certainty: warning
      subject: The Dodger
      account: Claims the crowd changed after the nearby Kaleidoscope club burned the previous month and advises caution regarding associates.
  qualification: All comments are attributed in-world assertions; they are not independent proof of current site conditions.
framing: broadcast_safe
headline: Attributed Core district accounts
summary: Named in-world commentators describe contested conditions at three historic Chicago sites.
