data:
  source_anchor: Insect Spirit Profiles introduction; Ant; Beetle opening
  profile_scope: Typical behavior of common insect spirits and statistics for their classifications; statistics
    are preserved in separate protected records.
  ant:
    society: Ant spirits cooperate exceptionally well within a hive comprising many workers and soldiers and a single
      Queen; territorial instincts often cause intense rivalry between hives.
    construction: Complex multilevel warrens, usually below ground in excavated or modified cavities; their organization
      is not decipherable by humans.
    habits: Clean, tidy and quiet; rarely act alone. Usually act en masse under direction of Queen or her shaman.
    subtle_activity: Groups of two to four when needed, provided the shaman persuades the Queen that deploying the
      army would be counterproductive.
  beetle:
    social_type: Solitary
    appearance: Males superficially resemble horned stag beetles; infertile females resemble common ground beetles;
      Mothers usually combine both appearances.
    nesting: Live in or around nests overseen by one, occasionally two Mothers; usually tunnel into damp or moist
      ground.
    continuation: Beetle account continues on printed p.139/PDF148.
