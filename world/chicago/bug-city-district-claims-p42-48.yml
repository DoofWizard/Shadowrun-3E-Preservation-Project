    subject: Northside industry
    claim: Notes that factories employ replacement workers while Zone residents are
      unable to commute.
    certainty: local_report
  - printed_page: 45
    speaker: Aldercritter
    subject: Skarz Mob
    claim: Reports a shift from credit lending to goods markets.
    certainty: local_report
  - printed_page: 46
    speaker: Big Shoulders
    subject: Business Village
    claim: Criticizes the enclave's insulation from hardship inside the Containment
      Zone.
    certainty: personal_opinion
  - printed_page: 46
