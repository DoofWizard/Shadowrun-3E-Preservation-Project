    speaker: Road Kill
    subject: Jack Strong
    claim: Reports that Jack Strong died recently, possibly in a paranormal attack.
    certainty: rumor
  - printed_page: 43
    speaker: Janie B.
    subject: Jack Strong
    claim: Reports that National Guard personnel confronted Strong while he was crossing
      Irving Park.
    certainty: secondhand_report
  - printed_page: 43
    speaker: Algren
    subject: Noose control
    claim: Describes several self-declared leaders competing after Strong's reported
      demise.
    certainty: local_observation
  - printed_page: 43
    speaker: Jax
    subject: Noose ambience
    claim: Compares its street environment with earlier Chicago cultural districts.
    certainty: personal_opinion
  - printed_page: 43
    speaker: Hammer of Thor
    subject: federal response
    claim: Characterizes UCAS policy as containment and disregard of Chicago.
    certainty: attributed_interpretation
  - printed_page: 43
    speaker: Algren
    subject: Shattergraves
    claim: Reports ghosts persisting but ghouls withdrawing; speculates the insects
