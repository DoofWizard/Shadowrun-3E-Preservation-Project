data:
  comments:
    - speaker: Dr. Fisher
      printed_page: 81
      pdf_page: 90
      subject: mosquito saliva
      claim: >-
        Says female mosquitoes inject saliva that prevents coagulation and may carry
        infections such as malaria, yellow fever, dengue and filariasis
      certainty: speaker_explanation
    - speaker: Dr. Fisher
      printed_page: 81
      pdf_page: 90
      subject: filariasis
      claim: >-
        Describes threadlike parasitic worms and possible delayed symptoms over
        weeks or months
      certainty: speaker_explanation
    - speaker: Geena D.
      printed_page: 82
      pdf_page: 91
      subject: roach nests
      claim: >-
        Advises caution in basement spaces, recounting roaches occupying unexpected
        hiding places
      certainty: personal_warning
    - speaker: Vermann
      printed_page: 82
      pdf_page: 91
      subject: roach nests
      claim: >-
        Reports that odor can indicate a roach nest nearby
      certainty: anecdotal_observation
    - speaker: Josea O.
      printed_page: 82
      pdf_page: 91
      subject: roach behavior
      claim: >-
        Describes roaches appearing to watch intruders and reacting to changes in
        movement or air pressure
      certainty: personal_interpretation
    - speaker: Georgie
      printed_page: 82
      pdf_page: 91
      subject: roach perception
      claim: >-
        Speculates that insects relying on motion perception may assume other
        creatures perceive in the same way
      certainty: speculation
    - speaker: Marlon P.
      printed_page: 83
      pdf_page: 92
      subject: wasp queen intelligence
      claim: >-
        Alleges seeing a wasp queen direct subjects to start a building fire and
        seize inhabitants
      certainty: eyewitness_allegation
    - speaker: Trevor Corn
      printed_page: 83
      pdf_page: 92
      subject: wasp behavior
      claim: >-
        Describes wasps as highly aggressive and quick to react to perceived
        threats around a hive
      certainty: personal_assessment
