  messages:
    - {speaker: Zapatista, date: '2055-12-01', certainty: criticism, substance: Complains that preferential admissions perpetuate divisions between people with scarce and plentiful resources.}
    - {speaker: Marcia L., date: '2055-12-05', certainty: rebuttal, substance: Says the Dome refuses no one but may process some applicants faster according to their contributions.}
    - {speaker: BeBop, date: '2055-12-09', certainty: prediction, substance: Warns that increased demand could overwhelm Ravenheart and that some aides might not apply her standards fairly.}
    - {speaker: Trance, date: '2055-12-13', certainty: disputed_rumor, substance: Mentions, but doubts, a rumor that an Ares team contributed to the Containment Zone disaster; speculates hostile outsiders may still retaliate against Dome residents.}
    - {speaker: Corp Killer, date: '2055-12-18', certainty: unverified_allegation, substance: Argues the founders are more than ordinary Knight Errant troopers and may include an Ares combat team; reports wreckage of combat-support vehicles near Randolph and Sangamon and asks about their link to the day containment began.}
    - {speaker: JonRon, date: '2055-12-19', certainty: unverified_secondhand_report, substance: Says VTOL aircraft have used the Dome's retractable roof for supply drops and speculates that at least one craft was a stealth-capable Ares vehicle.}
