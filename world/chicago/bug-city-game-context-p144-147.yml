data:
  spider:
    p: '144'
    pdf: '153'
    characterization: Great Weaver, a builder linking life, death and change, with creator, destroyer and trickster
      aspects. Patient, deliberate and intricate in planning, capable of sudden merciless action; mood can seem
      benevolent or fearsome. Spider shamans are described as becoming involved in larger plans and mysteries.
    canonical_id: option.magic.totem-spider
  torpor:
    p: '144'
    pdf: '153'
    established: Cermak Blast left many insect spirits, including many then existing solely astrally, dormant. Some
      smaller immature nests or hives were wholly affected; mostly insects active away from their nests were affected.
    cermak: Largest known Chicago collection of torpid insects; radiation and background count make access virtually
      impossible.
    uncertainty: Cause and possibility of spontaneous awakening remain unknown, preserved separately as hypotheses.
  cermak_event:
    p: '145'
    pdf: '154'
    context: A nuclear weapon detonated within an insect hive's magical barrier while roughly 1000 new spirits were
      in final investment stages. Shamans were creating the barrier or ward to exclude intruders until investment.
  kyle_teller:
    p: '146'
    pdf: '155'
    identity: 37-year-old man of Anglo and Amerind ancestry; powerful hermetic mage.
    arrival: Investigating disappearance of CEO Daniel Truman's son; trapped when UCAS army sealed the city.
    current_role: Lives at Wrigley Dome and helps maintain magical defenses.
    background: Freelance missing-persons mage; formerly UCAS FBI Department of Paranormal Affairs. Resigned after
      an affair with a senator's wife became public; subsequently divorced. Ex-wife and daughter moved to Chicago;
      regular visits gave him familiarity with the city.
    motivation: Ex-wife and daughter disappeared during the insect infestation. Fears them dead but continues searching
      with former ally Seeks-the-Moon until certain.
    personality: Intelligent, skilled, usually favors plans that preserve life but can be ruthless. Protective of
      others, dislikes deception, usually truthful, inclined to lead; follows respected people only when agreeing
      with the work.
  anne_ravenheart:
    p: 146-147
    pdf: 155-156
    identity: Sioux woman in her mid-thirties, short black military haircut; captain in Knight Errant security,
      talented mage and skilled marksman.
    role: Trapped with old friend and classmate Kyle Teller. Runs Wrigley Dome, the four-block-square haven between
      Irving Park, Addison, Halsted and Clark; highest-ranking founding Knight Errant officer, directing operations,
      defense and admissions.
    background: Former Sioux Special Forces member; studied magic at Columbia College on military scholarship. After
      years in Special Forces joined Knight Errant and rose quickly. Natural, calm crisis leader and commander of
      an elite FireWatch team.
    prior_insect_work: Her team monitored insects for years and identified the Chicago hive as the major North American
      hive.
    current_priority: Helping local people against insects since the hive bombing; company loyalty has weakened
      in connection with her suspicion recorded separately.
  seeks_the_moon:
    p: '147'
    pdf: '156'
    origin: Formerly Teller's ally, became free when Teller nearly died during an unsuccessful Knight Errant attack
      on the main hive. Voluntarily remained to aid the family search and opposition to insects.
    astral_exposure: Insects can sense his powerful astral presence; spends most time manifested and masked for
      protection.
    creation_method: Rigetti method, named after a mage influenced by Jungian universal-unconscious theory; reflects
      repressed aspects of Teller's personality.
    personality: Intelligent, quirky, sarcastic, increasingly independent since liberation.
    appearance: Tall Amerind man just past middle age, black ponytail; black jeans and sneakers, sleeveless worn
      blue denim jacket, two silver bracelets on one wrist and a leather band on the other, black hat with a red-white-black
      band.
