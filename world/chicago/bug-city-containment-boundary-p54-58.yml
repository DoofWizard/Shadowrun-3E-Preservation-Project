data:
  section: Living in Oblivion
  opening_art: Printed 54 is a full-page illustration of Zone conditions, with no new mechanics.
  source_perspectives:
    introduction: SYSTEM 05, dated October 1, 2056
    wall_report: R. Victor, using Vengeance, in The Wall
    supply_report: Uncle Leeche, Getting What You Need begins on printed 58
  containment_boundary:
    land: Northern alignment follows Irving Park Road from the lake; western boundary follows Harlem Avenue; southern stretch follows 115th Street and crosses the Core toward the lake.
    lake: Boundary uses floats and sensor buoys approximately one kilometer offshore, linked by cable and mesh according to the source.
    construction: Debris barriers from demolished roadside buildings alternate with conventional concrete and wire barricades in open areas.
    barrier_width: Reported thickness varies from around six meters to ten or twenty meters depending on location.
  guard_infrastructure:
    towers: Steel, reinforced wood, and adapted-building platforms; reported height approximately twelve meters and separation thirty to one hundred meters.
    typical_equipment: Night-vision or thermographic observation equipment, multiband communications, floodlights or amplified announcements, and standard armed security equipment.
    personnel: Primarily described as UCAS Army personnel; a separate elite Counterforce organization supports higher-priority responses.
    shore_support: UCAS Coast Guard and Navy presence, including Wolverine light aircraft carrier and Lucan and Voight frigates, with patrol craft and helicopter support.
    magical_patrol: Narrator reports magicians, watchers and elementals tasked with astral monitoring; Sioux and Ute shamans are also mentioned.
  life_inside:
    economy: The zone's market is described as barter-dominated, with informal trades and scarce manufactured goods.
    deliveries: Government supply parcels are reportedly dropped by aircraft at changing sites, roughly once every five days per area.
    supplies: Described deliveries include preserved food, hygiene products, medicine, blankets, clothing, tents, heating materials and insect-deterrent products.
    variation: Author notes some deliveries are contested, intercepted or dispersed and security intervention varies.
    timing: Reported deliveries and patrol behavior are setting descriptions, not player-facing dice or combat procedures.
  continuity: Part of the Containment Zone as described in 2056; source reports and disputed allegations are handled separately.
framing: newsroom_neutral
headline: Bug City boundary infrastructure and local logistics
summary: Source-period containment geography, guard facilities, and deliveries for the Chicago campaign.
