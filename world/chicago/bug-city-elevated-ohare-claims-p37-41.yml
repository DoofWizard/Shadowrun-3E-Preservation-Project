data:
  claims:
  - speaker: Janie B.
    subject: District statistics
    claim: Published figures for the Containment Zone may be unreliable.
  - speaker: Roy Ko
    subject: Mortality
    claim: Questions whether mortality is counted in the population figures.
  - speaker: Phranc S.
    subject: District demographics
    claim: Expects changed income and poverty figures inside the Zone.
  - speaker: VOX
    subject: Elevated population
    claim: Suggests refugee concentrations outside the Zone affect counts.
  - speaker: Trial
    subject: Corporate departures
    claim: Attributes disappearances to advance warning received by some corporations.
  - speaker: Council Warz
    subject: Core geography
    claim: Claims the Wall divided the Core and left northern corporate properties
      inaccessible.
  - speaker: Lizzie V.
    subject: Residential areas
    claim: Disputes the earlier description of safety, referring to insect-related
      deaths and abandoned buildings.
  - speaker: Sunday Driver
    subject: Corporate goods
    claim: Speculates corporations knowingly left harmful chip stockpiles behind.
  - speaker: Schooner
    subject: Corporate goods
    claim: Disputes assertions that corporations deliberately produced a coordinated
      conspiracy.
  - speaker: Phranc S.
    subject: O’Hare Sub-Sprawl
    claim: Calls the outside district a key staging area for travel toward the Zone.
  - speaker: Business Major
    subject: Corporate enclaves
    claim: Alleges enclaves function as logistical bases for organized activity, without
      independent corroboration.
  - speaker: Beat Cop
    subject: Residential neighborhoods
    claim: Relays reports of refugees, crowding and recent property changes.
  status: In-world dialogue attributed to fictional commenters; unverified claims
    should not be promoted to historical facts.
