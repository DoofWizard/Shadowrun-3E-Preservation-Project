  insect_spirit_characterization:
    metaplane_origin: The book proposes that insect spirits originate in an unknown
      metaplane; the text explicitly says no one knows the true nature of this location,
      or whether their forms follow human archetypes.
    insect_shaman_summoning: Most insect shamans summon Queen or Mother insect spirits;
      the text notes an insect shaman may perceive a greater totem, or may respond
      to such spirits.
    alien_quality: The text portrays insect spirits as alien to the human metahuman
      consciousness; an insect shaman can become progressively focused on the insect
      hive/nest at the expense of human concerns.
    colloquial_source_comparison: The book contrasts the comparative straightforwardness
      of traditional totems (such as Coyote or Raven) with insect totems.
  social_patterns:
    hive:
      organization: Hive spirits follow one Queen; their actions are directed toward
        growth of the hive.
      included_types: Ants and wasps are hive insect spirits for game classification;
        most hive rules apply to these.
    solitary:
      organization: A fertile female called Mother births solitary insect spirits;
        they defend the home nest compulsively, may range elsewhere after birth, and
        most remain near nests.
      comparison: Mothers do not exert the same kind of control over offspring that
        hive Queens exert.
      variation: Different solitary insect types follow different behavior profiles.
