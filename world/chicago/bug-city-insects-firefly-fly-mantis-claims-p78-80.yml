pdf_pages: '79-81'
edition_scope: Historical Shadowrun Second Edition setting; no inferred SR3 supersession
content_class:
  - attributed_claim
framing: newsroom_neutral
headline: Commentary on fireflies, flies and mantises
summary: Competing fictional eyewitness claims and opinions about insect-spirit behavior.
data:
  claims:
    - printed_page: 78
      speaker: Skank
      subject: Firefly colony
      claim: Reports luminous fireflies on upper floors of a high-rise by Belmont Harbor, moving in patterns that appear coordinated.
      certainty: local_observation
    - printed_page: 78
      speaker: Duce Deluxe
      subject: Firefly colony
      claim: Suggests directing Bug Hunters toward the site; his opposition to the spirits differs from the narrator's benign impression.
      certainty: advocated_action
    - printed_page: 78
      speaker: Claudia B.
      subject: Firefly behavior
      claim: Objects to indiscriminate hostility and cites the fireflies' aesthetic appearance.
      certainty: personal_opinion
    - printed_page: 79
      speaker: Warlock in Chains
      subject: Fly spirits and contagion
      claim: Speculates that the spirits' spread of disease challenges the role traditionally associated with Rat shamans.
      certainty: speculative_comparison
    - printed_page: 79
      speaker: Candide
      subject: Host relationships
      claim: Disputes Warlock's framing and focuses instead on insect spirits occupying human bodies.
      certainty: counterclaim
    - printed_page: 79
      speaker: Dogster 501
      subject: Fly habitats
      claim: Adds dumps as another location frequented by flies.
      certainty: anecdotal
    - printed_page: 80
      speaker: Slayer
      subject: Mantis danger
      claim: Says mantis spirits sometimes threaten people as well as other insects.
      certainty: attributed_warning
    - printed_page: 80
      speaker: Rat Boy
      subject: Mantis encounter
      claim: Relates an encounter in which a mantis severely harmed a troll and resisted intervention.
      certainty: uncorroborated_eyewitness_account
    - printed_page: 80
      speaker: Mr. George
      subject: Mantis intelligence
      claim: Claims mantises behave as intelligent beings and usually avoid attacking humans unless their interests are disturbed.
      certainty: contested_firsthand_interpretation
    - printed_page: 80
      speaker: Tiger Faux
      subject: Vixen
      claim: Reports meeting a mantis group leader named Vixen, describes a female human disguise and portrays her as intelligent, dangerous and sardonic.
      certainty: personal_encounter_claim
  note: Comments represent dated fictional Matrix dialogue and cannot be silently elevated to facts or SR3 game mechanics.
