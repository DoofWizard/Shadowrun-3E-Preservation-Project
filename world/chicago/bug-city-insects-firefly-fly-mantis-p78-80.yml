headline: Firefly, fly and mantis insect spirits
summary: Period description of firefly, fly and mantis spirits and the alleged leader Vixen.
data:
  source_context: In-world descriptive reports on three fictional insect spirit types, with no complete game statistics or target numbers on these pages.
  firefly:
    printed_page: 78
    distribution: A reported colony occupies the upper levels of a lakeside residential high-rise near Belmont Harbor.
    behavior: The compiler describes night-time luminescence, collective hovering and rhythmic light patterns; no direct harm was known to this observer.
    uncertainty: Other commenters dispute whether a visually appealing colony is safe.
  fly:
    printed_page: 79
    habitat: Decaying matter, neglected wooden structures, dumps and the vicinity of bodies.
    city_location: The old Chicago city morgue is reported as a possible major hive, though the narrator labels the location speculative.
    grouping: The narrator describes flies as travelling in groups of at least six.
    disease_risk: Reports of illness after contact with fly spirits are anecdotal, with no game disease test or numerical effects specified.
  mantis:
    printed_page: 80
    caste: Classified by the compiler as a loner rather than a standard nest or hive spirit.
    group: Small social groups have one dominant female mantis and several assistant spirits.
    ecological_role: Often reported preying on other insect spirits, with contested reports of risk to humans.
    reproduction: The source describes female mantis spirits reproducing by consuming male mantis spirits.
    relative_power: The compiler and commenters describe mantises as comparatively intelligent and dangerous; no quantifiable ranking is stated.
  related_entity:
    name: Vixen
    printed_page: 80
    kind: Reported female mantis group leader in the Containment Zone
    reported_disguise: Average-height woman, just-over-shoulder-length strawberry-blond hair, green eyes, often wearing green and black leather with a stylized winged-angel design.
    attribution: Tiger Faux's encounter account, not independently corroborated.
  lineage: Reference narrative only; preserve later SR3 critter statistics separately if a source supplies them.
