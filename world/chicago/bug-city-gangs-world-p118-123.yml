id: world.chicago.bug_city.gangs_p118_123
record_type: source_period_organization_reference
status: source_reviewed
source: source.fasa-7117
printed_pages: 118-123
pdf_pages: 127-132
edition_scope: Historical Shadowrun Second Edition Chicago Containment Zone sourcebook, 2055; no inferred
  Shadowrun Third Edition supersession
content_class:
- world_fact
data:
  setting_era: 2055 Chicago Containment Zone
  chapter: Gangs
  prepared_by: Patty Day
  gangs:
    blue_boyz:
      canonical_id: org.chicago.blue_boyz
      source_pages:
      - 118
      - 119
      origin: Former Lone Star and Eagle Security personnel, ex-military personnel, and former corporate
        operatives left in the Zone after the containment wall was established.
      principal_activity: Intercepting military supply drops and controlling smaller gangs through tribute.
      resources: Security vehicles used for mobile teams; specialized combat and demolition training remains
        available among members.
      headquarters: Old Burbank MegaMall, near Narragansett Avenue and 87th Street.
      territory_boundaries:
        north: 75th Street
        south: 87th Street
        west: Harlem Avenue
        east: Cicero Avenue
      membership:
        experienced_core_approximate: 25
        lower_level_members_approximate: 25
        core_backgrounds:
        - law enforcement
        - corporate security
        - military
        specialist_roles:
        - assassins
        - demolitions specialists
        - weapons specialists
      affiliation_and_attitude:
        bias: Anti-metahuman
        friendly_relation: Volksville enclave
        government_intelligence_connection: Alleged only; attributed separately.
    fleshmongers:
      canonical_id: org.chicago.fleshmongers
      source_pages:
      - 119
      - 120
      relationship: One of two mobile Ghoultown-associated groups that the book labels butchers.
      members_approximate: 15-20; fluctuates
      headquarters_territory: Old Oak Park neighborhood; large semi-truck as mobile headquarters; travel
        along the old Eisenhower Expressway.
      methods_summary: Supplies Ghoultown residents with human or metahuman victims and receives weapons
        and ammunition; the book characterizes this faction as relying on numbers.
      affiliation: Ghoultown residents
    living_dead:
      canonical_id: org.chicago.living_dead
      source_pages:
      - 119
      - 120
      relationship: The other mobile Ghoultown-associated group identified as butchers.
      members_approximate: 10-15; fluctuates
      headquarters_territory: Northern half of the Containment Zone, with appearances elsewhere in the
        Walled City; no fixed headquarters.
      transport: Armored trucks and former delivery vans.
      activity_period: Usually at night.
      methods_summary: Obtains victims through deception, including impersonation of service intermediaries;
        supplies Ghoultown residents and obtains weapons and ammunition.
      affiliation: Ghoultown residents
    jolly_rogers:
      canonical_id: org.chicago.jolly_rogers
      source_pages:
      - 120
      - 121
      category: Riverboat gang
      size_approximate: 10-20; changes continually
      headquarters: Goose Island, northwest corner of the Noose.
      territory: Northern branch of Chicago River, from just north of Wacker Drive to the northern containment
        boundary at Irving Park Road.
      transport: Modified motorboats, including former police patrol craft and sightseeing boats.
      revenue_sources:
      - unlicensed simsense chips
      - passenger ferries into and out of the Noose
      - theft from travelers near river crossings
      - recovered river property
      affiliates: No formal partners established in the source text; alleged contact with the Nasty Grrrls
        is separately attributed.
    nasty_grrrls:
      canonical_id: org.chicago.nasty_grrrls
      source_pages:
      - 121
      - 122
      epistemic_status: Existence and details disputed by source; some consider the group an urban legend.
      territory_claim: Wicked Park neighborhood, bounded generally by Milwaukee, Western and Chicago avenues,
        with alleged activities extending to Armitage and Kedzie.
      headquarters_claim: Former Everleigh Club at Milwaukee and Damen; rumored, not confirmed.
      size_claim: 5-10 members, rumored
      known_affiliations: No verified alliances; purported exchange with Jolly Rogers remains attributed.
    swamp_thangs:
      canonical_id: org.chicago.swamp_thangs
      source_pages:
      - 123
      leader:
        canonical_id: person.chicago.foul_one
        name: Foul One
        role: reputed roach shaman
      approximate_members_excluding_leader: 10-15
      headquarters: Calumet toxic swamp on the north end of Lake Calumet, several miles east of the Core
        and along the southern containment boundary.
      historical_environment: Industrial waste-disposal area for almost 200 years, largely uninhabited
        before the group's recent arrival.
      source_described_relation: Operates with insect-associated spirits, contrary to the common taboo
        against such contact in the Zone.
      methods_summary: The source describes abductions for the Foul One's use of captives as spirit hosts.
      affiliations: No known ties to other groups.
  protected_mechanics_check: No independent target numbers, dice-pool tests, damage codes, equipment prices
    or quantified tactical modifiers on printed pages 118-123. Group sizes and named equipment are setting
    descriptions, preserved above.
  related_claims: world.chicago.bug_city.gang_claims_p118_123
framing: newsroom_neutral
headline: Blue Boyz, Ghoultown crews and other Zone gangs
summary: Historical in-world faction index with map boundaries, staffing estimates and group relationships.
