edition_scope: Historical Shadowrun Second Edition Chicago setting; no inferred SR3 supersession
content_class: [attributed_claim]
data:
  setting_era: 2055 Chicago Containment Zone
  provenance_rule: Statements below are attributed to their in-world speakers or report authors; uncorroborated claims are not independent historical facts.
  threads:
    - location: Goose Island and Chicago River
      printed_pages: '104'
      claims:
        - speaker: Kostow
          timestamp: '2055-11-29 23:04:25'
          certainty: in_world_assertion
          substance: Says a gang called the Jolly Rogers claimed Goose Island, operates boats and hovercraft on the Chicago River and its north branch, and treats the northern river as its turf; claims the polluted riverbanks attract insects and vermin.
        - speaker: Wanda
          timestamp: '2055-11-30 22:03:55'
          certainty: firsthand_story_unverified
          substance: Recounts the gang leaving a former member suspended from a river structure and later encountering a badly injured body with unusual organisms attached; she reports the incident as an extraordinary sighting rather than an identified creature.
    - location: Grant Park / Haymarket Nation
      printed_pages: '104-105'
      claims:
        - speaker: Hippie Chick
          timestamp: '2055-12-03 23:44:31'
          certainty: speaker_interpretation
          substance: Describes Haymarket Nation as a self-policing community in and around Grant Park, with the loosely organized Panthers acting as security; portrays government, corporate and freelance authority figures as unwelcome.
        - speaker: Robbie the Red
          timestamp: '2055-12-03 22:30:45'
          certainty: historical_interpretation
          substance: Associates the group's chosen name with the 1886 Haymarket Incident and Chicago labor-organizing history, referring to the Industrial Workers of the World and the workers killed or sentenced after the unrest.
        - speaker: Robbie the Red
          timestamp: '2055-12-03 24:34:52'
          certainty: speaker_historical_summary
          substance: Says a bomb at the 1886 Haymarket gathering was followed by police firing into a crowd, seven dead officers and roughly 70 injured people, then trials and executions of labor activists; interpret as the speaker's summary alongside the reproduced dated newspaper account.
        - speaker: Rebecca Washington
          institutional_source: UCAS Chicago Section 3 report to Commander Romero
          certainty: intelligence_assessment
          substance: Reports human and metahuman residents in the former Grant Park, self-appointed leaders and an approximately 20-member security force restricting military, government and corporate-security entry; assesses that the group lacks expansionist territory aims.
        - speaker: Rebecca Washington
          institutional_source: UCAS Chicago Section 3 report to Commander Romero
          certainty: intelligence_assessment
          substance: Reports a continuing conflict with a roach infestation in old subway tunnels under the Noose and apparent hostility toward the Volk.
        - speaker: Rebecca Washington
          institutional_source: UCAS Chicago Section 3 report to Commander Romero
          certainty: intelligence_assessment
          substance: Reports tacit leadership approval of a Chicago Harbor market trading illegal simsense chips, supplies, medical goods, weapons, vehicles and hardware; suspects smuggler access to the former harbor and recommends surveillance rather than immediate intervention.
    - location: Leo's LunchBox
      printed_pages: '106'
      claims:
        - speaker: Gourmand
          timestamp: '2055-12-10 19:45:39'
          certainty: reported_current_condition
          substance: Says the restaurant remains open despite the Containment Zone, with irregular hours and a severely limited menu.
        - speaker: Gourmand
          timestamp: '2055-12-13 21:33:20'
          certainty: rumor_and_personal_belief
          substance: Suggests it had served UCAS intelligence personnel before containment; claims those patrons sometimes helped cook Lydia and that nearby residents still protect the business; believes it may be the Zone's only operating restaurant.
    - location: Little Earth / University of Chicago
      printed_pages: '106'
      claims:
        - speaker: BlackStone
          timestamp: '2055-12-11 04:33:21'
          certainty: in_world_account
          substance: Says the district includes mages, shamans, adepts, faculty and students who failed to leave after the Wall; reports collected magical artifacts and foci, a mutual-aid community, guarded interactions with outsiders and availability of some magical supplies through barter.
  mechanical_status: These pages give no new resolution mechanics for reported encounters or locations.
