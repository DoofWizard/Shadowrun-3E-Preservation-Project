headline: Insect-spirit colonies, cocoons and forms
summary: Historical fictional taxonomy distinguishing nests, loners, true forms, and flesh forms.
data:
  documentation_scope: In-world narrator's described taxonomy; direct rules and creature statistics are not specified on these pages.
  categories:
    hives:
      printed_page: 72
      organization: Many colony spirits have distinct functional roles, including procuring nourishment and guarding a queen or colony.
      leadership: Their coordinated behavior is described as depending on queens or shamans; exact cognition varies by spirit form.
    nests:
      printed_page: 72
      examples: Solitary-associated insect types include mosquitoes and roaches.
      reproduction: Female spirits maintain nests around cocoons, with other spirits protecting the nest and bringing resources.
      female_count: More than one female may coexist; the narrator has not heard of a nest containing more than four, but does not assert a hard limit.
    loners:
      printed_page: 72
      example: Mantis spirits
      organization: The compiler reports a group with a dominant female and assistants, without a conventional nest or hive.
    cocoons:
      printed_pages: '72-73'
      use: Every known spirit type is described as using a cocoon to incubate a spirit in a selected human host.
      host_relationship: Coercive and nonconsensual in the described reports; a host's original self is displaced.
      timing: The summoning, incubation and emergence periods vary by insect type; this passage supplies no numerical duration.
    true_forms:
      printed_page: 73
      essence: An actual spirit whose physical form resembles a human-sized member of its insect type.
      capabilities: Can assume a physical form while retaining the abilities ordinarily associated with spirits.
      comparison: The compiler regards this form as usually more cognitively capable and faster than a flesh form.
    flesh_forms:
      printed_page: 74
      appearance: A variable human-insect hybrid, sometimes concealed beneath clothing or by magic.
      comparison: Usually moves at roughly human pace and is less intellectually capable than a true form.
      host_outcome: The narrator states that the original host consciousness or identity is extinguished or overridden.
  lineage: Source-period narrative ecology, not a new SR3 game-stat block.
