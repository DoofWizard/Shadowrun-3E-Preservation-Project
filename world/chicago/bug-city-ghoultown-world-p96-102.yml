data:
  site:
    printed_page: 96
    name: Ghoultown / Cabrini Refuge
    original_name: Cabrini Green
    location: Chicago, former Cabrini Green low-income residential development
    map_reference: Ghoultown map in the Core; location numbered 2, with Daley Gardens numbered 1
    source_section: GHOULTOWN (HAVEN) pixfile prepared by Happyjack
  historical_chronology:
  - printed_page: 96
    date: '2039'
    event: Mather Group bought the Cabrini housing development from the city and attempted to evict occupants. The ensuing riot caused 32 deaths and damage valued in millions of nuyen. The company abandoned ordinary redevelopment plans, retained a landlord role, and collected a share of income from local gangs it had hired for purported security.
  - printed_page: 96
    date: '2053'
    event: Justice Network exposed a Mather-related syndicate arrangement in a pay-per-view trideo report. City government did not recognize residents’ leases and declared the buildings abandoned, relieving itself of maintenance obligations.
  - printed_page: 96
    date: '2053'
    event: Metahuman Rights Coalition and Mayor Ronald Quince supported Special Order 162, known as the Cabrini Refuge Act, establishing a protected enclave for ghouls.
  refuge_policy_as_reported:
    printed_page: 97
    source: CHI TRIB>NEWSNET report of 15 Nov 2053 by Jace Brennan
    special_order_number: 162
    designation: Cabrini Refuge Act
    legal_claim: Contemporary report says the UCAS government recognized rights and legal protections for ghouls as a metahuman group.
    site: Former Cabrini Green Public Housing Development, Chicago
    judge_city_security_deadline_days: 60
    planned_temporary_relocation: Robert Taylor Megaplex
    estimated_existing_squatters: 600
    qualification: A contemporaneous article describes passage and relocation intentions, not proof of completed relocation.
  defensive_geography_and_equipment:
    printed_pages: 101-102
    perimeter: Pre-fabricated UCAS enclosure originally intended to limit ghoul movement; residents reinforced it against the insect threat with elevated walks and guard towers.
    guards: Pairs patrol elevated walls and occupy towers. The text describes a large resident defense force and substantial ammunition stocks.
    named_firearms:
    - Crusader machine pistols
    - Colt M22A2 assault rifles
    - Walther MA 2100 sniper rifles with telescopic sights
    - Vindicator minigun
    sniper_positions: Rooftops of three principal buildings
    heavy_emplacement: Improvised central rooftop pillbox with a Vindicator minigun
    air_defenses: Two surface-to-air missiles concealed by rooftop ventilation cowls
    note: Equipment is a descriptive defense inventory, without new equipment statistics or tests on these pages.
  magical_environment:
    printed_page: 102
    ghoul_nature: The source describes ghouls as dual-natured, able to perceive and affect the astral plane while being vulnerable to astral threats.
    insect_spirit_history: Ghoul astral perception helped residents identify the insect spirits after their activity lessened and remove dormant forms from the refuge.
    astral_area: The section portrays Ghoultown astral space as relatively safe and no longer toxic, unlike much of the Containment Zone.
    limitation: Few resident magicians are available to dispel hostile spirit attacks.
framing: newsroom_neutral
summary: Historical geography, change of tenure, refuge status, guards and astral environment.
headline: Ghoultown historical core
