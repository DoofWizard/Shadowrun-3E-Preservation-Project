data:
  section: Windy City / History / Chicago Districts
  early_city:
    printed_page: 34
    incorporation_year: 1833
    population_at_incorporation: Fewer than 100 inhabitants
    original_urban_role: Inland port and interregional commercial crossroads
    narrator_characterization: Established commerce hub and site of social conflict.
  asist_and_business:
    printed_page: 34
    scientific_discovery: ASIST technology associated with Dr. Hosato Hikita of ESP Systems, Inc.
    financier: Dan Truman
    company_relations:
      - ESP Systems became connected to Truman Technologies after Truman's acquisition and early investment.
      - ESP later became a Truman Technologies subsidiary and is described as absorbed into the parent following an intellectual-property lawsuit involving Fuchi.
      - Truman Technologies and Fuchi are depicted as continuing to compete for research staff and commercial advantage.
    disputed_claims: Allegations that Truman secured ESP using unlawful pressure are rumors in the source, not established narrator facts.
  urban_development_and_displacement:
    printed_pages: '35'
    chronology: Within seven years of Truman's business growth, substantial redevelopment of Chicago's Southside began.
    setting_changes:
      - Land redevelopment and eviction disrupted low-income communities and increased commercial and industrial building.
      - Southside became a concentration area for Awakened/metahuman residents, including ork, troll, dwarf and elf enclaves.
      - Expansion of the Loop and increased property values displaced additional working-class and metahuman populations toward city margins.
    attribution: This is an in-world historical narrator account of displacement and civil exclusion.
  night_of_rage_and_tower:
    printed_page: 35
    linked_background_event: Night of Rage in Seattle, 2029; anti-metahuman persecution and warehouse fires are described as preceding later Chicago violence.
    implicated_group: Alamos 20,000, also called Alamos 20K
    group_attribution: Source states it was widely believed that the Hand of Five wing of Alamos 20,000 was responsible for Seattle warehouse fires.
    interval_before_chicago_event_days: 3
    chicago_incident:
      building: Sears Tower in Chicago Loop
      owner_at_time: IBM
      event: Tower destroyed by multiple explosive events during a weekday lunch hour.
      source_attribution: Source narrator attributes the event to Alamos 20K, while its false-front framing of retaliation is described as a cover story.
      tower_units_described: 9
      collapse_description: The source describes disruption of the structural balance of nine units making up the tower, using magical and explosive effects.
      death_toll_reported_approximately: 26000
      consequence: Surrounding structures and utilities failed, and fires spread before magical assistance reportedly contained them within an hour.
    ensuing_city_changes:
      - City government and businesses created separated projects on the Northside for metahuman and poor populations.
      - Displacement and labor division intensified after the tower disaster.
  aftermath_geography:
    printed_page: 36
    shattered_area: Shattergraves, the name given to the zone crushed by the Sears Tower collapse.
    rumors: Reports of spirits and other beings in Shattergraves are presented as reports rather than confirmed taxonomy.
    noose: The remaining Loop district under criminal influence, described as expanding west to Western Avenue in the eleven years after the tower collapse.
    six_nonpolitical_city_sections: [Elevated, O'Hare Sub-Sprawl, Noose, Northside, Westside, Southside]
    classification_basis: The six sections were socially and economically descriptive and were not separate government wards.
    zone_boundary_source: Forum annotations distinguish the Containment Zone's actual perimeter from these older six descriptive sections.
  mechanics_assessment: This history and map-orientation segment supplies setting chronology and names rather than dice tests, game combat or spell stat blocks.
  lineage: Source-period Second Edition historical world reference, not a Third Edition rules update.
framing: newsroom_neutral
headline: Chicago history, industries, displacement and informal district labels
summary: ASIST industry history, redevelopment, the 2029 tower disaster and Chicago's informal district geography.
