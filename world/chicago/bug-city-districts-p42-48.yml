data:
  noose:
    printed_pages: 42-43
    geography: Former Loop and surrounding neighborhoods, Lake Michigan to Western
      Avenue and North Avenue to Cermak Road.
    history: After Sears Tower's fall and corporate moves to the Southside, vacant
      premises were occupied informally and basic services deteriorated.
    activities: A center of the city's informal markets and networks, including magic
      and decking specialists, with substantial deprivation and local racketeering.
    security: Eagle Security generally patrols the perimeter rather than the interior;
      rival local groups claim authority.
    jack_strong: Murphy's Law gang leader and self-styled Noose arbiter, associated
      with the former Circuit Court Building; narrative notes his authority but later
      commenters dispute whether he remains alive.
    shattergraves: Rubble field around the former Sears Tower where nine smaller towers
      collapsed; the narrative describes unsettled ghosts and scavenging ghouls, followed
      by their later departure.
  northside:
    printed_pages: 44-46
    geography: North of the Noose along the lake toward the intersection of Route
      60 and Interstate 94, extending west beyond Interstate 290.
    character: Industrial district with crowded housing, strained infrastructure,
      and many separate metahuman communities.
    industry: Plastics, metalwork, chemicals, steel and meat processing; strike activity
      and outside security contractors are recurring features.
    blood_town: Ork- and troll-majority neighborhood around Fast-Flesh's large slaughterhouse
      east of Interstate 94; company-built housing and reported dependency on Skarz
      Mob lenders.
    business_village: Former Evanston executive enclave with walls, private security
      and amenities, also identified with Northwestern University and Kellog Business
      School.
    terror_principle: Kellog's fictional method for competitively grading and allocating
      student financial resources; describes a corporate-recruitment culture, not
      a player character mechanic.
  westside:
    printed_pages: 46-47
    geography: From the Noose west to Route 59 and from under O'Hare to 55; socially
      and economically varied residential districts.
    corporate_research: Ares, Truman and Mitsuhama research parks and computer factories,
      including Truman Technologies' simsense operations.
    dream_town: Simsense/entertainment district associated with studios Fox Simsense,
      Brilliant Genesis and Living Life; distributors include Truman Technologies.
    security: Residential grades differ considerably across wealthy areas and neglected
      neighborhoods.
  southside:
    printed_page: 48
    geography: From Interstate 294 toward the Indiana border, with the Chicago sprawl
      extending into Gary, Indiana.
    economy: Steelworks, manufacturing, and municipal power plants; UCAS Steel operates
      comparatively better-serviced residential areas.
    security: Stronger security grading is concentrated nearer the Elevated.
  cross_reference: Windy City district descriptions; continued government and corporate
    chapters begin at printed page 49.
