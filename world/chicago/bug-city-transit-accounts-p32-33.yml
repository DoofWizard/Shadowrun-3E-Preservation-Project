data:
  section: Windy City / public transit and water-air transport commentary
  posts:
    - printed_page: 32
      poster: Lizzie
      date: '2055-10-08'
      report: People use former elevated tracks on foot, while informal elevated-rail cars run by the Angels are an exception; the post warns that enclosed subways are dangerous due to insect infestation.
    - printed_page: 32
      poster: Little Jake
      date: '2055-10-10'
      report: Describes a few armored buses attempting old routes while alleging that other vehicle crews may prey on travelers.
    - printed_page: 32
      poster: Smith 'n' Jones
      date: '2055-10-11'
      report: Contradicts surviving bus service as an ordinary option, claiming buses have been appropriated by insect-associated individuals, local gangs and other groups.
    - printed_page: 33
      poster: Algren
      date: '2055-10-09'
      report: Says the Coast Guard is intercepting lake travel, mentions rumored small unauthorized craft, and disputes reports of regular commercial sightseeing cruises.
    - printed_page: 33
      poster: Mirth 'n' Girth
      date: '2055-10-09'
      report: Responds skeptically to the claim that ordinary tourist boats are still active.
    - printed_page: 33
      poster: Big Shoulders
      date: '2055-10-11'
      report: Relays reports of people attempting water entry via diving gear, without confirming outcomes.
    - printed_page: 33
      poster: Wingman
      date: '2055-09-22'
      report: Reports restricted airspace over the Containment Zone and an armed response to unauthorized aircraft.
    - printed_page: 33
      poster: Stealth Bomber
      date: '2055-09-27'
      report: Suggests aid-delivery flight timing may create opportunities for unauthorized entry; unverified personal advice, not formal operational guidance.
    - printed_page: 33
      poster: Aldercritter
      date: '2055-09-30'
      report: Warns that such attempts could lead to cancellation or suspension of food shipments by the authorities.
  status: Attributed and sometimes contradictory posts; do not convert into established security policy or transport availability.
  lineage: Preserve historical resident perspective independent of modern mechanical rules.
