  setting_era: 2055 Chicago Containment Zone
  provenance_rule: Speakers, anecdotes, warnings, predictions and rumors are preserved as attributed claims, not promoted to confirmed geography, rules or events.
  threads:
    - site: Little Earth and the Calumet Swamp
      printed_page: 107
      claims:
        - {speaker: Kee Ho Tay, date: '2055-12-13', certainty: opinion, substance: Considers Little Earth an idealistic district and suggests help with just causes may be offered without charge.}
        - {speaker: BlackStone, date: '2055-12-15', certainty: purported_observation, substance: Describes Earthling wizards confronting insects and says participants oppose the Calumet Roach shaman called the Foul One.}
        - {speaker: Johnny Q, date: '2055-12-17', certainty: personal_warning, substance: Warns that entering the toxic Calumet Swamp is exceptionally dangerous and that some local threats deter even insect creatures.}
        - {speaker: Hawkeye, date: '2055-12-19', certainty: editorial_opinion, substance: Criticizes the idealism described by Kee Ho Tay.}
        - {speaker: BlackStone, date: '2055-12-28', certainty: local_report, substance: Describes Little Earth as a marketplace for magical gear with several independent magical healers.}
        - {speaker: Conrad, date: '2055-12-29', certainty: local_counterclaim, substance: Disputes claims of many powerful magicians in Little Earth; believes only a few remain, though they are resourceful.}
    - site: Shattergraves
      printed_page: 109
      claims:
        - {speaker: Squatter, date: '2055-11-29', certainty: local_report, substance: Describes Shattergraves expanding toward Lake Street, Polk and State streets and an expressway; the quoted west/south directions are internally inconsistent. Claims the ghouls moved out and insects avoid local specters.}
        - {speaker: Barnabus, date: '2055-11-30', certainty: personal_warning, substance: Describes restless and hostile spirits as risks to human and metahuman visitors.}
        - {speaker: Lovecraft, date: '2055-12-02', certainty: unverified_anecdote, substance: Estimates 15 to 20 isolated inhabitants and relates a disturbing anecdote about a paranoid resident who later disappeared.}
        - {speaker: Lovecraft, date: '2055-12-07', certainty: follow_up_anecdote, substance: Says the resident walked away without warning the day after the earlier account.}
        - {speaker: Polly Esther, date: '2055-12-08', certainty: counterclaim, substance: Disagrees with severe danger reports, claiming visitors who tolerate frightening phenomena can spend days in Shattergraves without permanent effects.}
        - {speaker: Uncle Vince, date: '2055-12-09', certainty: personal_interpretation, substance: Considers Shattergraves a temporary hiding place from Big Momma Roach and associated creatures.}
        - {speaker: Lou D., date: '2055-12-20', certainty: unconfirmed_rumor, substance: Asks whether a banshee is now present in the Shattergraves.}
        - {speaker: Earth Mother, date: '2055-12-21', certainty: speculation, substance: Speculates that city isolation could attract supernatural creatures, including vampires, if Chicago appears safe to them.}
