data:
  setting_era: 2055 Chicago Containment Zone
  entry: {site_id: place.chicago.wrigley_dome, site: Wrigley Dome, category: HAVEN, source_prepared_by: Nighthunter under duress}
  location:
    northern_zone_edge: true
    previous_use: Former sports complex with a secured elevated rail station.
    boundaries: {north: Irving Park Road, south: Addison Street, east: Halsted Street, west: Clark Street}
    lake_shore_drive_distance: less than half a mile
    site_map_page: 116
  defenses:
    mundane:
      wall_material: ferrocrete
      outer_wall_height_meters: approximately 15
      dome_material: transparent plasti-crete
      full_roof_enclosure: true
      entrances:
        Clark_Street: {total: 4, permanently_sealed: 3, open: 1}
        other_sides: {entrances_per_side: 3, all_sealed_except_Halsted_Street: 1}
      equipment_at_open_entrances: [fixed heavy machine guns, antivehicle missile launchers]
      wall_patrol: approximately ten guards with high-powered sniper rifles and assault rifles
      other_equipment: [at least one surveillance drone, defensive grenades, concussion grenades, offensive grenades]
      founders: 15 Knight Errant officers and troopers
      founders_on_security_duty: approximately half at any given time
      resident_security_helpers: approximately 15 similarly trained residents
      founders_expertise: [armed combat, unarmed combat, demolition, surveillance, command]
      sidearms: All security-force members carry sidearms; some also carry light machine guns.
    magical:
      experienced_combat_mages: 1
      adept_trainees: three or four
      source_uncertainty: Captain Anne Ravenheart's alleged magical ability is an unconfirmed rumor, separately attributed to the text's rumor wording.
  leadership: {name: Captain Anne Ravenheart, position: haven leader, affiliation: Knight Errant founding group}
  entry_policy: Sanctuary applicants are admitted if they surrender personal weapons, recognize Ravenheart's authority, observe basic UCAS law, accept work assignments, and take an intake interview; useful medical and mechanical skills and supplies gain priority.
  population:
    approximate_residents_excluding_founders: 450
    composition: Predominantly human residents with some metahumans, from former corporate employment and varied street backgrounds.
