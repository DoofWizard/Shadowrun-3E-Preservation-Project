id: world.chicago.bug-city-cermak-magic-reports-p62-68
record_type: attributed_cermak_and_magical_city_accounts
status: source_reviewed
source: source.fasa-7117
printed_pages: '62-68'
pdf_pages: '63-69'
edition_scope: Historical Shadowrun Second Edition Bug City setting; no inferred SR3 mechanics or supersession
content_class:
  - attributed_claim
data:
  incident_and_testimony:
    - printed_page: 62
      author: J. Q. Public
      section: The Common Enemy
      claim: Argues residents of the Zone should put aside rivalries, help neighbors, and support one another when facing insect spirits; this is advocacy, not an enacted city ordinance.
      certainty: personal_political_appeal
    - printed_page: 62
      author: Dr. T. Alloman (Prof.Ted)
      section: Beware the Bomb
      claim: Describes an October 1 blast at an electrical facility near Cermak and Racine; speculates the location housed an insect-spirit nest and that the blast had unusual consequences.
      certainty: attributed_investigation_and_hypothesis
      disputed_details:
        reported_yield: Below one kiloton, according to the author's inference; unconfirmed.
        crater_radius: Less than 100 meters, according to the author's estimate; unconfirmed.
        interpretation: Author doubts a conventional blast explains the full fictional incident; reports uncertainty about magical involvement.
    - printed_pages: '63-65'
      author: Night Walker
      section: The Big Bug Sleep
      claim: Presents an approved paraphrase of a discussion with an unnamed magician who says the Cermak event destroyed a nest, cocoons and manifest forms but left many insects dormant in astral space.
      certainty: attributed_interview
      forum: CORE/CITY/MAGIC/BUGS
    - printed_pages: '63-65'
      author: Anonymous magician as reported by Night Walker
      section: The Big Bug Sleep
      claim: Describes a tentative link between nearby active magic and the awakening of dormant insect spirits; suggests conjuring or banishing may have stronger effects than some other magical manifestations.
      certainty: uncertain_magical_testimony
      rule_status: No printed target number, dice test, modifier or deterministic trigger is supplied; do not elevate this interview into an SR3 rule.
    - printed_pages: '65-66'
      author: Fat Max
      section: Madmen
      claim: Gives a first-person account of disturbed sleep, unsettling changes in memory and attitude, and uncertainty about whether prolonged confinement affects residents' perceptions.
      certainty: personal_experience
    - printed_page: 66
      author: Jane Oblivion
      section: The Magical City; Background Count
      claim: Reports increasing astral background counts, usually modest but greater in specific locations including the Cermak blast site, Randolph and Sangamon, parts of the University of Illinois campus, and camps near Irving Park Road.
      certainty: local_observation_and_interpretation
      mechanics_status: No numeric background-count rating is printed in this discussion.
    - printed_page: 66
      author: Jane Oblivion
      section: Bug Stuff
      claim: Suggests some insect spirits lack clear direction while their queens or nest-mothers are missing or dormant; speculates about future leadership and changes in insect-shaman activity.
      certainty: speculation
    - printed_page: 67
      author: Jane Oblivion
      section: Metaplane Busy Signal
      claim: Reports that astral quests and access to metaplanes feel more difficult throughout the Zone and speculates whether effects of the blast or other magic are responsible.
      certainty: observation_plus_speculation
    - printed_page: 67
      author: Jane Oblivion
      section: Conjuring Chaos
      claim: Says conjuring is more difficult than before, except perhaps for nature spirits; speculates about disturbed relationships between the astral environment and insect torpor.
      certainty: attributed_magical_observation
      mechanics_status: No additional explicit target number or spell modifier is provided.
    - printed_page: 67
      author: Jane Oblivion
      section: Toxic Totems
      claim: Reports more toxic or altered shamanic traditions in the Zone and wonders whether astral disturbances may be related.
      certainty: reported_trend_and_uncertain_cause
  illustration: Printed 68 is a full-page insect-themed drawing with no new textual game mechanics.
  editorial_note: This is source-era fictional commentary. The reported blast and magic theories are not treated as confirmed modern real-world facts or canonical SR3 mechanics.
framing: newsroom_neutral
headline: Cermak event and astral reports from Zone narrators
summary: Distinct narrators preserve uncertainty around the Cermak event, astral reports, and local morale.
