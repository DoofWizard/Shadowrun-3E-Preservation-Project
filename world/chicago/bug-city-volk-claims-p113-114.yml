content_class: [attributed_claim]
data:
  setting_era: 2055 Chicago Containment Zone
  place: {id: place.chicago.volksville, name: Volksville, source_header: VOLKSVILLE, prepared_by: Harvester}
  sources:
    - form: signed_propaganda_leaflet
      printed_page: 113
      attributed_author: The Volk
      certainty: faction_claim_and_threat
      substance: The faction denounces magicians and metahumans, blames them for the insect plague, and urges violent exclusion and persecution of these groups as well as insects. These are hostile group claims and exhortations, not setting facts or endorsed guidance.
    - form: UCAS_Section_4_intelligence_assessment
      printed_page: 114
      author: Agent Jane Rutherford
      recipient: Commander Trenn
      certainty: institutional_assessment
      claims:
        - Volk leadership is divided and the group remains largely disorganized; it promotes anti-metahuman, anti-magic and anti-UCAS positions, and is assessed as currently incapable of overthrowing the government.
        - The report attributes the deaths of at least three UCAS agents and numerous informants to the Volk.
        - The group reportedly began as a barter-supported evacuation and protection collective near an abandoned rail yard north of I-55 at the southern edge of the Westside Zone.
        - Original founders reportedly included former UCAS personnel, Eagle Security and Knight Errant members; the report says they secured a small area using equipment from an abandoned Illinois National Guard armory.
        - Former members of the Chicago chapters of Alamos 20K and Humanis Policlub allegedly took over the group's leadership, expelled metahuman and magical refugees, and renamed it the Volk.
        - The group is reported to recruit stranded former security and military staff and control an I-55 corridor plus the Sanitary and Ship Canal between the western Zone border and Pulaski Avenue.
    - form: network_discussion
      printed_page: 114
      claims:
        - {speaker: Partisan, date: '2055-12-07', certainty: warning, substance: Describes the Volk as an armed exclusionary faction hostile to most nonhuman and magical residents, visitors and freelance runners.}
        - {speaker: The Professor, date: '2055-12-07', certainty: rumor, substance: Reports a substantial fence with concertina wire and circulates unverified reports that people attempting to leave were killed.}
        - {speaker: Stone, date: '2055-12-07', certainty: unconfirmed_allegation, substance: Repeats a claim that UCAS secretly provides food and supplies in exchange for intelligence on the Zone, its insect infestation, ghoul population and government opponents; says anti-government recruitment may facilitate informant collection.}
        - {speaker: Chompski, date: '2055-12-07', certainty: reaction, substance: Responds that the rumored UCAS relationship would not be surprising.}
  provenance_rule: Political propaganda, official intelligence assessments and anonymous network comments have distinct evidentiary status; none is independently verified by this excerpt.
  mechanical_status: No game-resolution mechanics, damage figures, costs, modifiers or combat statistics are supplied in the entry.
framing: newsroom_neutral
headline: Volksville faction, institutional assessment and rumors
summary: The Volk pamphlet, UCAS Section 4 evaluation and unverified network accounts are separately attributed.
