content_class:
- attributed_claim
data:
  setting_era: 2055 Chicago Containment Zone
  scope: Reported faction activity, conflicting public messages and rumors concerning gangs; allegations
    are not confirmed merely by publication.
  official_in_world_reporting:
  - source_pages:
    - 118
    speaker: Agent Justicia Jones
    recipient: Commander Trenn
    institution: UCAS Chicago Containment Zone Section 3
    form: Field intelligence report
    statements:
    - Estimates approximately 100 active gangs in the Zone from informant reports.
    - Says available personnel can examine only a small fraction of those groups and advises against immediately
      recruiting any one group for covert cooperation because intelligence is inadequate.
  attributed_claims:
  - source_pages:
    - 119
    speaker: T-Bone
    date: '2055-11-29'
    subject: Blue Boyz
    certainty: speculation
    substance: Associates the gang's military-grade equipment and supply intelligence with an undeclared
      relationship to federal authorities.
  - source_pages:
    - 119
    speaker: Buzzcock
    date: '2055-12-13'
    subject: Blue Boyz
    certainty: rebuttal
    substance: Counters that the members were abandoned by their former employers and rejects the alleged
      federal partnership.
  - source_pages:
    - 119
    speaker: Stone
    date: '2055-12-21'
    subject: Blue Boyz
    certainty: speculation
    substance: Suggests the equipment and repeated awareness of drop locations could indicate continued
      service to former employers.
  - source_pages:
    - 119
    speaker: Shriekin' Sheila
    date: '2055-12-27'
    subject: Blue Boyz
    certainty: hostile_commentary
    substance: Advocates confronting members over suspected outside allegiances; not evidence of such
      allegiances.
  - source_pages:
    - 119
    speaker: P Body
    date: '2055-12-30'
    subject: Blue Boyz
    certainty: reply
    substance: Responds skeptically to the preceding call for confrontation.
  - source_pages:
    - 119
    speaker: Scream Queen
    date: '2055-12-11'
    subject: Flesh Mongers and Living Dead
    certainty: allegation
    substance: Criticizes their collaboration with Ghoultown and alleges captives may also be handed to
      insect creatures.
  - source_pages:
    - 120
    speaker: Julia C.
    date: '2055-12-10'
    subject: Flesh Mongers and Living Dead
    certainty: commentary
    substance: Describes rumors of occasional reprisals against gang members.
  - source_pages:
    - 121
    speaker: Kap'n Krunch
    date: '2055-12-17'
    subject: Jolly Rogers
    certainty: criticism
    substance: Accuses the river gang of reckless use of recreational simsense and poor boat discipline.
  - source_pages:
    - 121
    speaker: unnamed sourcebook narrator
    subject: Jolly Rogers and Nasty Grrrls
    certainty: rumor
    substance: Reports unconfirmed contact with the Nasty Grrrls, a small all-female gang allegedly active
      in Wicked Park.
  - source_pages:
    - 121
    speaker: Sir Isaac
    date: '2055-12-02'
    subject: Jolly Rogers and Nasty Grrrls
    certainty: skeptical_question
    substance: Questions why the two groups would be associated.
  - source_pages:
    - 121
    speaker: Muzik Man
    date: '2055-12-06'
    subject: Jolly Rogers and Nasty Grrrls
    certainty: insinuation
    substance: Suggests the alleged relationship is driven by risky recreational trading.
  - source_pages:
    - 121
    speaker: Zigmund Floyd
    date: '2055-12-17'
    subject: Jolly Rogers and Nasty Grrrls
    certainty: commentary
    substance: Follows up with a jocular reply that does not add a verified factual claim.
  - source_pages:
    - 121
    speaker: sourcebook account
    subject: Nasty Grrrls
    certainty: urban_legend
    substance: Gives an unconfirmed account in which a small group impersonates people in need of rescue
      to attract male runners, after which those targets disappear.
  - source_pages:
    - 121
    speaker: P Body
    date: '2055-12-01'
    subject: Nasty Grrrls
    certainty: rumor
    substance: Alleges the gang members are nonhuman mantid spirits; not established as fact.
  - source_pages:
    - 121
    speaker: Gloria S.
    date: '2055-12-10'
    subject: Nasty Grrrls
    certainty: rebuttal
    substance: Dismisses the supernatural interpretation and attributes the accounts to deceptive human
      tactics.
  - source_pages:
    - 122
    speaker: sourcebook account
    subject: Nasty Grrrls and Jolly Rogers
    certainty: rumor
    substance: Reports an alleged exchange of unlawful simsense chips for abducted people.
  - source_pages:
    - 122
    speaker: Gloria S.
    date: '2055-11-20'
    subject: Nasty Grrrls and Jolly Rogers
    certainty: skepticism
    substance: Questions why an allegedly skilled group would partner with the river gang.
  - source_pages:
    - 123
    speaker: Razorback
    date: '2055-12-19'
    subject: Swamp Thangs
    certainty: commentary
    substance: Describes the gang as spirits in embodied form and therefore outside the ordinary social
      taboo against working with the insects.
  relationship_to_world: world.chicago.bug_city.gangs_p118_123
  mechanical_status: No new formal game-resolution procedures or weapon statistics in these reports.
framing: newsroom_neutral
headline: Attribution ledger for Chicago gang reports
summary: Claims ledger preserving uncertainty about official intelligence, group identities, and network
  posts.
