id: world.chicago.bug-city-corporations-claims-p51-53
record_type: attributed_corporate_and_local_commentary
status: source_reviewed
source: source.fasa-7117
printed_pages: '51-53'
pdf_pages: '52-54'
edition_scope: Historical Shadowrun Second Edition Bug City setting; no inferred SR3 supersession
content_class:
  - attributed_claim
data:
  corporate_narrator_reports:
    - printed_page: 51
      subject: Brilliant Genesis Studios
      claim: The narrator reports talk of a Mafia controlling interest in the simsense studio; ownership is not independently confirmed.
      certainty: rumor
    - printed_page: 51
      subject: Fast-Flesh Enterprises
      claim: The narrator relays allegations of improper FDA approval, contested product safety studies, stimulant sales outside the livestock sector, and research into illicit enhancement serums.
      certainty: attributed_allegations
    - printed_page: 52
      subject: Living Life Productions
      claim: The narrator reports that rapid scenario production and impressive stunts may rely on computer-animated sequences instead of live actors.
      certainty: rumor
    - printed_page: 52
      subject: UCAS Steel and Manufacturing
      claim: The narrator speculates that Linda Jenkins may acquire an independent simsense studio and use Fuchi distribution rather than Truman Technologies.
      certainty: source_narrator_speculation
  matrix_commentary:
    - printed_page: 51
      speaker: Wolf
      subject: simsense personnel inside the Containment Zone
      claim: Reports that studios are offering substantial compensation to retrieve performers and producers from behind the Wall and regain access to stranded properties.
      certainty: local_report
    - printed_page: 51
      speaker: Cynik
      subject: recruitment of stranded simsense talent
      claim: Alleges employers are conditioning assistance with evacuation on employment contracts transferring talent to their companies.
      certainty: allegation
      consent: pressured_employment_choice
    - printed_page: 51
      speaker: Mario A.
      subject: Fast-Flesh facility
      claim: Alleges the site is now occupied by insect entities and its previous processing operations have changed drastically.
      certainty: uncorroborated_claim
    - printed_page: 51
      speaker: Lizzie
      subject: Mario A. report
      claim: Asks whether Mario has personally visited the Fast-Flesh location, challenging the report's basis.
      certainty: skeptical_question
    - printed_page: 51
      speaker: Big Shoulders
      subject: insect entities and chemical enhancement
      claim: Relays hearsay that insect entities may employ rumored enhancement compounds while creating flesh-form manifestations.
      certainty: rumor
    - printed_page: 52
      speaker: Algren
      subject: Dan Truman and family
      claim: Repeats rumors that Truman's son suffered severe consequences from an insect encounter, his daughter disappeared, and Ares and Fuchi have become involved in competing attempts to influence Truman.
      certainty: layered_rumor
    - printed_page: 52
      speaker: Janie B.
      subject: Ares at Wrigley Dome
      claim: Reports hearing that an Ares combat team is guarding Wrigley Dome and wonders why.
      certainty: hearsay_question
    - printed_page: 53
      speaker: CurlyMoe
      subject: Zone supply routes
      claim: Claims that additional technology and supplies are being brought clandestinely into the Zone.
      certainty: local_report
    - printed_page: 53
      speaker: Lizzie
      subject: fictional insect encounters
      claim: Offers the opinion that close-combat weapons are preferable against insect threats and reports that she and associates offer training at Discovery Depot.
      certainty: personal_opinion_and_local_report
      mechanical_status: Not an independent game-rule modifier.
    - printed_page: 53
      speaker: Road Kill
      subject: organized-group competition
      claim: Claims internal Mafia rivalries coexist with Yakuza competition, and describes numerous groups competing to bring goods into the Zone for advantage and profit.
      certainty: local_report_and_opinion
  source_boundary: Printed 51-53, corresponding to PDF pages 52-54; comments and uncertain statements remain attributed.
framing: newsroom_neutral
headline: Chicago corporate claims and attributed Matrix discussion
summary: Claims separated from confirmed fictional source-period profiles, preserving speakers and uncertainty.
