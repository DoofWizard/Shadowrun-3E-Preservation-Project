data:
  section: The Outside World; Time Line
  visibility_note: Parenthesized entries in this timeline denote matters not publicly or commonly known at the time.
  accounts:
  - anchor: August 22 late afternoon
    actor: Callers to Eagle Security
    claim: Giant insects were present in Chicago after the west-of-Noose incident.
    status: Reported calls before official acknowledgment.
  - anchor: August 23 late afternoon
    actor: UCAS federal authorities
    claim: Chicago was quarantined because of a new strain of VITAS.
    status: Official public explanation; the retrospective distinguishes it from the insect-spirit emergency.
  - anchor: August 23 early morning
    actor: Sourcebook's internal chronology
    claim: Government intelligence personnel disrupted news relays and pressured media organizations to limit reports.
    status: Presented as behind-the-scenes historical setting information, not a public admission.
  - anchor: October 1
    actor: Unspecified circulating rumors
    claim: The Cermak-Halstead detonation involved a corporate strike team.
    status: Unverified; responsibility explicitly remains unassigned by the source.
  - anchor: October 5
    actor: Unnamed government factions
    claim: Further detonations should be considered after reports of the impact on insect spirits.
    status: Sourcebook reports discussion only; the National Security Council proposal lacks presidential endorsement.
  - anchor: November to December 2055
    actor: World Health Organization and circulating Matrix/Shadowland commentators
    claim: The official VITAS explanation may not accurately describe Chicago's crisis.
    status: Questions and speculation; no blanket endorsement of every rumor.
headline: Public accounts and disputed 2055 Chicago reports
summary: This historical source distinguishes official quarantine messaging, nonpublic government accounts, unassigned
  responsibility for a detonation, and later skepticism.
framing: newsroom_neutral
