data:
  claims:
  - p: '148'
    pdf: '157'
    attribution: Rumors heard by Ares Wrigley Dome guards
    certainty: unconfirmed
    claim: Melissa Truman has become associated with a warlord; neither warlord identity nor rumor is verified.
  - p: '148'
    pdf: '157'
    attribution: Game-information narrator
    certainty: inference from vanished records
    claim: Linda Hayward was probably possessed in 2051
    when records of her disappear.: null
  - p: '149'
    pdf: '158'
    attribution: Mantis spirit using Linda Hayward's identity
    certainty: her account
    claim: Other insect spirits caused Mitch Truman's breakdown and death; she claims she is fighting those spirits.
  - p: '149'
    pdf: '158'
    attribution: Zone rumor mill
    certainty: rumor
    claim: Standish may seek de facto mayoral rule of the whole Zone; suggested motives range from megalomania to
      a secret plan for zombie control.
  - p: '149'
    pdf: '158'
    attribution: Allegations dating from Standish's mayoral term
    certainty: unverified
    claim: Standish is empowered by bad juju and is some kind of undead being; Caribbean mercenary service is linked
      by rumor to voodoo practitioners.
  - p: '149'
    pdf: '158'
    attribution: Catherine Cunningham's opponents
    certainty: hostile appraisal
    claim: Her conduct earned the Catherine the Terrible nickname.
  - p: '149'
    pdf: '158'
    attribution: Cunningham's loyal followers
    certainty: belief and circulating stories
    claim: She deeply cares for them; accounts describe generosity and personal sacrifice on their behalf.
  - p: '150'
    pdf: '159'
    attribution: Many Cunningham supporters
    certainty: belief without objective evidence
    claim: She is a powerful hermetic mage; neither ability nor its absence is established.
  - p: '150'
    pdf: '159'
    attribution: King Vlad
    certainty: self-reported history
    claim: Grew up in Blood Town; father's preventable Fast Flesh Enterprises accident left his mother dependent
      on prostitution to feed the family. Claims he walked to school barefoot each winter because shoes were unaffordable
      and lost half his left ear to the winter of 2035.
  - p: '150'
    pdf: '159'
    attribution: Persistent rumors
    certainty: disputed alternative
    claim: Vlad's ear injury came from a knife fight
    contrary to his frostbite account.: null
