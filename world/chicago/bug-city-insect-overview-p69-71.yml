pdf_pages: '70-72'
edition_scope: Historical Shadowrun Second Edition setting; no inferred SR3 supersession
content_class:
  - attributed_claim
framing: newsroom_neutral
headline: Bug City insect-spirit observations, pp. 69-71
summary: In-world descriptions and disputed explanations of insect spirits, shamans, perception, and hives.
data:
  file_context:
    printed_page: 69
    document_header: File header damaged; initial data partly missing
    narrator: Unidentified in-world compiler of insect-spirit reports
    provenance: Reports from inside the Chicago Containment Zone, with dated Matrix responses
  narrator_reports:
    - printed_page: 69
      subject: Insect-spirit motives and summoning
      claim: Most observed insect spirits emphasize feeding and reproduction; the compiler believes insect shamans summon queens or females but may later lose control of them.
      certainty: compiler_interpretation
    - printed_page: 69
      subject: Origin theories
      claim: Competing hypotheses place the spirits beyond astral space or in a distinct Insect realm, while another hypothesis treats spirits as magically willed into existence.
      certainty: competing_speculations
    - printed_page: 70
      subject: Behavior and intelligence
      claim: Workers and soldier spirits are described as generally less intellectually adaptable than queens and elder females; unusual perceptions and behavior may confound human expectations.
      certainty: compiler_observation
    - printed_page: 71
      subject: Insect shamans and hives
      claim: The compiler associates insect-shaman identity with personal dependence on queens and an eventual loss of control; many nests are believed dormant after the Cermak event.
      certainty: interpretation_and_uncertain_report
    - printed_page: 71
      subject: Hives
      claim: Ant- or wasp-like spirits form colonies with differentiated functions; one queen is typical, but multiple queens or cooperative types are mentioned as possibilities.
      certainty: qualified_report
  matrix_commentary:
    - printed_page: 69
      speaker: Jana
      subject: Summoning origin
      claim: Questions whether all insect spirits originate with human shamans; alternative access to the world may exist.
      certainty: explicit_uncertainty
    - printed_page: 69
      speaker: Warlock in Chains
      subject: Responsibility
      claim: Disputes the idea that humans cannot be responsible for the spread of insect spirits.
      certainty: opinion
    - printed_page: 70
      speaker: J.T. Public05
      subject: Containment
      claim: Wonders whether residents can be freed from the insect threat.
      certainty: question
    - printed_page: 70
      speaker: Hawkeye
      subject: Spirit perception
      claim: Says insect senses may use smell, touch or air-pressure cues unlike human sight-based expectations.
      certainty: advice_from_report
    - printed_page: 71
      speaker: Tiger Faux
      subject: Shaman distinction
      claim: Argues insect shamans interact with material-world spirits directly, unlike familiar shamanic totem practice.
      certainty: interpretation
    - printed_page: 71
      speaker: Ares 101
      subject: Universal Brotherhood
      claim: Endorses an unverified possible connection between complex hives and the Universal Brotherhood.
      certainty: allegation
  note: Every speaker's statement is fictional in-world commentary, not independent historical certainty or a current SR3 mechanical rule.
