data:
  claims:
    - printed_page: 55
      author: SYSTEM 05
      subject: Containment Zone status
      claim: Describes an indefinite quarantine, abandonment by public officials and employers, and a precarious struggle to survive.
      certainty: first_person_editorial
    - printed_page: 56
      author: R. Victor (Vengeance)
      subject: barrier surveillance
      claim: Reports secondhand information about hidden heat and motion detectors at certain sections of the barrier.
      certainty: attributed_rumor
    - printed_page: 56
      author: R. Victor (Vengeance)
      subject: tower equipment
      claim: Says posts have military observation equipment and claims some locations hold heavier weaponry.
      certainty: attributed_field_report
    - printed_page: 56
      author: R. Victor (Vengeance)
      subject: guard conduct
      claim: Observes variation between warning, restraint, and severe enforcement; reports officers differing in willingness to intervene.
      certainty: personal_observation
    - printed_page: 57
      author: R. Victor (Vengeance)
      subject: astral containment
      claim: Relays military magic assignments, elemental assistance and non-UCAS shamans contributing to surveillance around the Zone.
      certainty: secondhand_report
    - printed_page: 57
      author: R. Victor (Vengeance)
      subject: covert units
      claim: Says elite Counterforce Teams are deployed near the boundary and sometimes conduct operations inside the Zone.
      certainty: attributed_account
    - printed_page: 58
      author: R. Victor (Vengeance)
      subject: military reserves
      claim: Relays sightings or rumors of additional aircraft, armored assets and preparations for possible large-scale operations.
      certainty: rumor_and_observation
    - printed_page: 58
      author: Uncle Leeche
      subject: local barter and drops
      claim: Describes barter transactions, irregular supply-drop locations and prices determined by scarcity and control of goods.
      certainty: attributed_local_account
  editorial_note: All eight entries identify the narrator; rumors and observed details are not interchangeable with verified source-world fact.
