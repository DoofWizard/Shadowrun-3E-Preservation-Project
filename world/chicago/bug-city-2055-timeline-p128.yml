data:
  section: The Outside World; Time Line
  provenance_rule: This is the sourcebook's gamemaster-facing retrospective; parentheses designate information not
    generally public at that stage.
  events:
  - date: Before August 2055
    event: Missing-person reports increase in major North American cities; the source cross-references Double Exposure
      and insect-hive recruitment.
    visibility: Retrospective gamemaster-only context.
  - date: August 22, 2055, late afternoon
    event: A major hive west of the Noose emerges after a Knight Errant confrontation, and Eagle Security receives
      reports of giant insects.
    visibility: Hive cause is parenthetical background.
  - date: August 22, early evening
    event: Authorities in Washington, F.D.C. receive the Chicago emergency report.
    visibility: Behind-the-scenes government response.
  - date: August 22 late evening to August 23 early morning
    event: UCAS mobilizes Army and National Guard units and assumes control of Eagle Security during a public-information
      campaign.
    visibility: Mobilization and messaging are described in the retrospective chronology.
  - date: August 23, early morning
    event: UCAS intelligence personnel disrupt three major Chicagoland Matrix/newsgrid relays while officials seek
      to control additional reporting.
    visibility: Parenthetical nonpublic chronology entry.
  - date: August 23, late afternoon
    event: UCAS military and National Guard establish the perimeter and announce a military quarantine publicly
      framed as a new VITAS strain.
    visibility: Official public notice differs from the gamemaster chronology.
  - date: August 23, early to late evening
    event: Civilians attempt to flee; rioting and military gunfire occur and the source reports at least 50 deaths;
      wall construction starts.
    visibility: Historical sourcebook timeline.
  - date: August 26
    event: Supply drops into the contained city begin.
    visibility: Sourcebook chronology.
  - date: October 1, early morning
    event: A detonation occurs north of the Core near Cermak and Halstead; the source does not assign responsibility.
    visibility: Uncertain perpetrator.
  - date: October 4
    event: The physical Containment Zone walls are effectively in place while competing territorial leaders gain
      power.
    visibility: Sourcebook chronology.
  - date: October 5
    event: UCAS officials learn the Cermak explosion damaged many insect spirits, with some sent to another plane.
    visibility: Parenthetical nonpublic chronology entry.
  - date: October to November 2055
    event: Public understanding continues to reflect the claimed VITAS outbreak as Chicago factions consolidate
      and an internal BBS stabilizes.
    visibility: Public account is explicitly distinguished from the behind-the-scenes history.
  - date: November to December 2055
    event: Public scrutiny of the VITAS account increases and the World Health Organization questions its validity.
    visibility: Public skepticism and setting rumors.
  - date: Late December 2055
    event: City under Siege material reaches a Denver Nexus, is validated by system operators, and is distributed
      to Shadowland nodes and a broader audience.
    visibility: Disclosure becomes public.
headline: Chicago Containment Zone 2055 chronology
summary: Dated sourcebook chronology from the hive emergency and UCAS quarantine through public disclosure in late
  December 2055.
framing: newsroom_neutral
