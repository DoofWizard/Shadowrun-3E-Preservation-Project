id: claim.chicago.bug-city-windy-city-accounts-p23-31
record_type: attributed_claim_register
status: ingested
source: source.fasa-7117
printed_pages: '23-31'
pdf_pages: '24-32'
edition_scope: Historical Shadowrun Second Edition Bug City, fictional Shadowland posts dated September-November 2055; not automatic Third Edition truth
content_class: [attributed_claim]
data:
  section: Windy City and Getting Around forum annotations
  evidence_status: Attributed, in-universe communications; posts can conflict and should not be promoted to narrator-established world facts.
  posts:
    - pages: '23-24'
      poster: Phranc S.
      dates: ['2055-09-15']
      claim: Introduces a curated account of Chicago within the Containment Zone, distinguishes outside-world reports from local first-person commentary, and credits original material to Defcon 1.
    - pages: '23-24'
      poster: Unnamed neo-anarchist local narrator
      claim: Describes widening economic divisions, disputed responsibility of city officials and private power, Northside grassroots organizing and paid-or-charitable shadowrunner assistance; presented as partisan local analysis.
    - pages: '23-24'
      poster: CurlyMoe
      date: '2055-09-18'
      claim: Disputes a simple wealthy-versus-poor account and instead emphasizes differences between residents inside and outside the Wall.
    - page: 23
      poster: VOX
      date: '2055-09-22'
      claim: Estimates roughly a dozen competing self-appointed leaders after disruption of city authority.
    - page: 24
      poster: Schindler
      date: '2055-09-19'
      claim: Reports that opportunistic local resellers have stockpiled donated food and raised prices substantially.
    - page: 25
      poster: Pretty Boy Floyd
      date: '2055-10-02'
      claim: Speculates that persistent cloud cover reflects deliberate action by UCAS authorities to impede satellite observation; no source proof offered.
      contradicted_by:
        poster: VOX
        date: '2055-10-02'
        response: Expresses skepticism about the extraordinary claim.
    - page: 25
      poster: Boss Daley
      date: '2055-10-07'
      claim: Suggests unusually mild weather may have delayed anticipated winter electricity and heating problems; prospective, not verified forecast.
    - page: 26
      poster: Wingman
      date: '2055-10-05'
      claim: O'Hare and Midway are effectively unavailable for normal inbound travel, with armed checkpoint restrictions, contrary to the older travel description.
    - page: 26
      poster: Da Mayor
      date: '2055-10-28'
      claim: Claims Midway remains accessible through a VTOL/maglev-related exception; contradicts Wingman's broad closure claim.
    - page: 26
      poster: Road Kill
      date: '2055-10-02'
      claim: Asserts roads stop at the Zone perimeter and unauthorized road crossings face armed security and dangerous local groups.
    - page: 27
      poster: Ms. Mestopheles
      date: '2055-10-01'
      claim: Reports Amtrak service ending at the containment perimeter and people sheltering in stranded train cars.
    - page: 27
      poster: Big Shoulders
      date: '2055-10-07'
      claim: Describes formerly affluent hotels in the Noose as private fortified enclaves rather than routine lodging.
    - page: 27
      poster: VOX
      date: '2055-10-12'
      claim: Says private homes and barter may offer lodging when formal hotels cannot be trusted.
    - page: 28
      poster: Roy Ko
      date: '2055-10-15'
      claim: Mocks the usefulness of conventional legal aid within the Containment Zone.
    - page: 28
      poster: Wandering Kid
      date: '2055-10-15'
      claim: Refers residents seeking assistance to a dedicated CORE/CITY/SPECIAL.HELP forum.
    - page: 29
      poster: Mario A.
      date: '2055-10-08'
      claim: Reports roadblocks and reinforced military security at the containment perimeter.
    - page: 29
      poster: Sunday Driver
      date: '2055-10-24'
      claim: Describes potholes, abandoned roadway damage and armored vehicle travel inside the Zone.
    - page: 29
      poster: Hawkeye
      date: '2055-11-02'
      claim: Reports at least fifteen commercial armored-cab operators and ad hoc tolls inside the Zone; number and specific anecdotes are informant claims, not confirmed census.
    - page: 29
      poster: Max.D
      date: '2055-11-10'
      claim: Warns that a group called the Flying Circus impersonates police in marked vehicles; account remains attributed.
    - page: 31
      poster: Rat Boy
      date: '2055-10-12'
      claim: Expresses pessimism about restoring conventional train service.
    - page: 31
      poster: Kommuter
      date: '2055-10-14'
      claim: Says an operator group called the Angels uses generator-powered older elevated trains, with fare beginning at 1000 nuyen and possible payment in traded goods; reports that underground lines are inaccessible.
      fare_minimum_nuyen: 1000
  lineage: Preserve date-stamped conflicts as separate historical assertions; none is evidence of an automatic SR3 revision.
framing: newsroom_neutral
headline: Windy City — attributed Shadowland commentary
summary: Dated 2055 resident assertions about the Containment Zone, including explicitly unresolved reports about travel restrictions and services.
