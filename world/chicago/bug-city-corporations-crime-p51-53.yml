data:
  corporations:
    brilliant_genesis_studios:
      printed_page: 51
      home_office: Chicago, Illinois, UCAS
      president_ceo: Victor Marquette
      products: Simsense scenarios
      profile: First studio dedicated exclusively to simsense scenario production; formerly maintained a lean budget and is now investing heavily in new talent.
      security: Recently changed to Knight-Errant Securities.
      claim_cross_reference: world.chicago.bug-city-corporations-claims-p51-53
    fast_flesh_enterprises:
      printed_page: 51
      home_office: Chicago, Illinois, UCAS
      president_ceo: Virginia Kidd
      principal_division: Fast-Flesh Processing
      division_head: Evan Gore
      products: Slaughter and processing of cattle and other livestock; patented, FDA-approved steroid and growth-stimulant products for livestock.
      growth_report: Livestock reportedly reaches full growth in a little more than one month; this is a source claim, not an RPG game-effect statistic.
      retail_brand: Johnson's Old Fashioned Meats
      security: Standard corporate security forces.
      claim_cross_reference: world.chicago.bug-city-corporations-claims-p51-53
    living_life_productions:
      printed_page: 52
      home_office: Chicago, Illinois, UCAS
      president_ceo: Charna Halpburn
      products: Simsense scenarios, particularly action and adventure productions.
      security: Recently changed to Knight-Errant Securities.
      claim_cross_reference: world.chicago.bug-city-corporations-claims-p51-53
    truman_technologies:
      printed_page: 52
      home_office: Chicago, Illinois, UCAS
      president_ceo: Dan Truman
      origin: Dan Truman previously grew ESP Systems of Chicago into a multibillion-dollar business.
      divisions:
        simsense_systems:
          head: Mike Malony
          products: Primarily simsense hardware, with limited production of lower-end cyberdeck equipment.
        truman_distribution_network:
          head: Julie Miller
          products: Distribution of simsense chips.
      commercial_model: Manufactures its own simsense hardware and distributes or manufactures chips based on scenarios created by independent Westside studios, including BTL chips that are illegal within the setting.
      security: Standard corporate security forces, except the Westside research park is described as more heavily organized along paramilitary lines.
      claim_cross_reference: world.chicago.bug-city-corporations-claims-p51-53
    ucas_steel_and_manufacturing:
      printed_page: 52
      home_office: Chicago, Illinois, UCAS
      president_ceo: Linda Jenkins
      products: Steel processing, manufacturing and distribution.
      profile: Jenkins is wealthy and influential and is interested in the entertainment industry's independent simsense studios.
      security: Standard corporate security forces.
      claim_cross_reference: world.chicago.bug-city-corporations-claims-p51-53
  organized_groups:
    yakuza:
      printed_page: 53
      location: Chicago, including Dream Town and the Westside.
      activities: New gambling establishments and commercial sex operations around Dream Town, described as part of the group's growing local presence.
      contest: Faces opposition from established Mafia organizations, including a racially prejudiced campaign against Japanese residents and businesses described by the source narrator.
      economic_context: Mitsuhama has recently established operations in the Elevated and is creating computer-factory employment on the Westside; the narrator associates this with increasing acceptance of Japanese corporate activity.
      predicted_outcome: The source narrator expects the Yakuza to contest the City Hall, Mafia and corporate balance; this is a forecast, not a recorded outcome.
    mafia:
      printed_page: 53
      described_leader: Don Jim O'Toole
      commerce: Involvement in distribution of Truman-branded BTL chips on the Northside.
      civic_relationship: Source narrator describes an arrangement in which Chicago officials overlook Mafia activity and aldermen give advance notice of impending FBI actions in exchange for profits or political benefits.
      fuchi_dispute:
        setting_year: "'45"
        trigger: Fuchi sought land without reaching terms with the aldermen controlling the area.
        development: The narrator describes coercive political pressure, violence, a prolonged work stoppage, and Fuchi's eventual decision to relocate operations away from Chicago.
        aftermath: City government obtained payments from Fuchi; 120 lower-class households lost residences when the affected property was redeveloped.
      claim_cross_reference: world.chicago.bug-city-corporations-claims-p51-53
  editorial_scope: Source-period in-universe corporate and political reference material; reported rumors and pseudonymous commentary are held separately rather than promoted to established facts.
framing: newsroom_neutral
headline: Chicago corporate and organized-group profiles
summary: Source-era corporate leadership, entertainment and manufacturing activity, civic relations, and Chicago underworld landscape.
