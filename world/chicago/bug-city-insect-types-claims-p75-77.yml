pdf_pages: '76-78'
edition_scope: Historical Shadowrun Second Edition setting; no inferred SR3 supersession
content_class:
  - attributed_claim
framing: newsroom_neutral
headline: Attributed reports on ant, beetle, and cicada spirits
summary: Named witness reports and opinions about insect-spirit species and encounters.
data:
  comments:
    - printed_page: 75
      speaker: Honor Guard
      subject: Ant-column coordination
      claim: Says ants follow column leaders and may temporarily lose cohesion after a leader is removed.
      certainty: purported_observation
    - printed_page: 75
      speaker: Black Ranger
      subject: Spirit durability
      claim: Warns that ordinary attacks may affect a physical hybrid differently from a manifested spirit.
      certainty: uncertain_nonmechanical_advice
    - printed_page: 75
      speaker: Jack the Killer Giant
      subject: Ant foraging
      claim: Says sugary food has attracted ant spirits in his observations.
      certainty: anecdotal
    - printed_page: 76
      speaker: Electric L
      subject: Beetle materialization
      claim: Reports that beetles sometimes remain physically manifested while searching for food or other items.
      certainty: firsthand_claim
    - printed_page: 76
      speaker: Betty V.
      subject: Beetle encounter
      claim: Describes a horned beetle colliding with an armored vehicle near Ashland and Irving, then disappearing after a security response.
      certainty: eyewitness_claim
    - printed_page: 76
      speaker: Warlock in Chains
      subject: Beetle response to fire
      claim: Thinks aversion relates to heat rather than light, without establishing a spirit rule.
      certainty: hypothesis
    - printed_page: 76
      speaker: Teddy W.
      subject: Beetle nesting
      claim: Hears that some beetles collect miscellaneous objects, seemingly without discernible purpose.
      certainty: hearsay
    - printed_page: 76
      speaker: Ven Q.
      subject: Roach behavior
      claim: Responds that roach spirits also gather objects.
      certainty: informal_observation
    - printed_page: 77
      speaker: Paul L.
      subject: Cicada concentration
      claim: Reports hundreds of cicadas at the old Lincoln Park zoo.
      certainty: attributed_local_report
  note: No attributed observation is a verified universal game rule; preserve source-specific uncertainty.
