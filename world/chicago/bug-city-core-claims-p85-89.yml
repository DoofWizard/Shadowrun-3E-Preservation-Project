id: world.chicago.bug-city-core-commentary-p85-89
record_type: attributed_media_and_matrix_claims
source: source.fasa-7117
printed_pages: 85-89
pdf_pages: 94-98
edition_scope: Historical Shadowrun Second Edition Bug City setting (2055 context); lineage only, no inferred
  SR3 supersession
status: source_reviewed
content_class:
- attributed_claim
data:
  claims:
  - printed_page: 85
    speaker: Chicago Seven
    type: introductory_matrix_post
    subject: Zone conditions and locations
    claim: Asserts breakdown of order and supplies, names Ghoul Town, Wrigley Dome and Sanctum as key
      refuges, and describes possible abandoned corporate property in the Core.
    certainty: attributed_overview
  - printed_page: 85
    speaker: Endocrine
    type: matrix_reply
    subject: refuge safety
    claim: Disputes the suggestion of safe havens from insect threats anywhere in the Zone.
    certainty: opinion
  - printed_page: 85
    speaker: NeverReady
    type: matrix_reply
    subject: containment scope
    claim: Questions whether the outbreak is truly contained and whether the insects are confined to Chicago.
    certainty: speculation
  - printed_page: 85
    speaker: Endocrine
    type: matrix_reply
    subject: UCAS containment
    claim: Speculates that infection may have reached outside Chicago and that authorities are concealing
      a broader problem.
    certainty: speculation
  - printed_page: 86
    speaker: NeverReady
    type: matrix_post
    subject: Volksville barter
    claim: Reports hearing that a location called Volksville accepts barter for entry.
    certainty: hearsay
  - printed_page: 86
    speaker: Bolo Boy
    type: matrix_post
    subject: Ghoultown
    claim: Reports visiting Ghoultown and describes a hostile environment.
    certainty: personal_report
  - printed_page: 86
    speaker: SYStem 05
    type: matrix_warning
    subject: outside-media documents
    claim: Questions how purported outside-zone media transcripts and memos entered the Zone, and warns
      that some may be misleading lures.
    certainty: cautionary_interpretation
  - printed_page: 86
    speaker: AP/Newsnet/Pyle
    type: published_report
    subject: corporate quarantine response
    claim: Reports that spokespeople for Ares Macrotechnology, Federated Boeing, Fuchi America and Truman
      Technologies jointly criticized the UCAS Chicago quarantine on August 23, 2055.
    certainty: published_media_report
  - printed_page: 86
    speaker: Elaine Taylor, Truman Technologies spokeswoman
    type: quoted_press_remarks
    subject: corporate access
    claim: Describes the UCAS prohibition on corporate site access as an unfair penalty on Truman Technologies
      and other firms.
    certainty: attributed_corporate_position
  - printed_page: 87
    speaker: Dumpster Diver
    type: matrix_comment
    subject: Core abandoned assets
    claim: Suggests valuable Ares prototypes, equipment and biotech may remain at company facilities inside
      the Zone.
    certainty: speculative
  - printed_page: 87
    speaker: Scavenger
    type: matrix_comment
    subject: Fuchi abandoned assets
    claim: Speculates that Fuchi prototypes, new cyberdeck hardware and experimental IC may have been
      left at facilities in the Core.
    certainty: speculative
  - printed_page: 87
    speaker: Miss Turee
    type: matrix_reply
    subject: corporate site defenses
    claim: Questions why corporations would leave costly prototypes unprotected.
    certainty: skeptical_question
  - printed_page: 87
    speaker: Dumpster Diver
    type: matrix_reply
    subject: corporate evacuation
    claim: Argues corporate staff received little warning about containment and that their security operations
      may have been disrupted.
    certainty: interpretation
  - printed_page: 88
    speaker: Dumpster Diver
    type: matrix_comment
    subject: corporate security after isolation
    claim: Speculates that unpaid corporate guards may no longer remain loyal.
    certainty: speculation
  - printed_page: 88
    speaker: John Running Bull to Daniel Truman
    type: attributed_corporate_memo
    subject: Truman Tower assets
    claim: Memo claims Truman staff were trapped in the Tower when quarantine began and authorized personnel
      and outside contractors to attempt property protection and recovery.
    certainty: purported_internal_memo
  - printed_page: 89
    speaker: 'New World Books, “Truman and Chicago: The Inside Story,” 2054'
    type: published_secondary_account
    subject: ESP acquisition and Fuchi dispute
    claim: Reports ESP’s owners resisted Daniel Truman’s purchase overtures, later allegedly received
      threats, and states Truman Technologies brought a failed ASIST-related lawsuit against Fuchi, with
      ongoing corporate rivalry.
    certainty: published_allegation
  - printed_page: 89
    speaker: Bystander
    type: matrix_comment
    subject: Fuchi-Truman rivalry
    claim: Suggests Fuchi and Truman personnel pursued asset acquisition and interference after the containment.
    certainty: speculation
  - printed_page: 89
    speaker: Gusenberg
    type: matrix_comment
    subject: garage incident
    claim: Alleges Truman operatives posing as security personnel confronted Fuchi-associated group members
      in an underground parking site on Clark Street and shot several.
    certainty: unverified_incident_allegation
  - printed_page: 89
    speaker: AP/Newsnet/Robbins
    type: published_report
    subject: Zone fatalities
    claim: Reports 34 alleged gang members killed in an abandoned parking garage in the northern Zone,
      according to sources inside the Zone; authorities declined comment. Dated September 3, 2055.
    certainty: published_attributed_report
  - printed_page: 89
    speaker: Not-Saying-I-Was-There
    type: matrix_comment
    subject: corporate recruitment
    claim: Warns that offers from Truman or Fuchi may present serious personal risks and that approaches
      to Truman Tower should be treated cautiously.
    certainty: personal_warning
  - printed_page: 89
    speaker: Buzz Grrl
    type: matrix_comment
    subject: corporate recruitment
    claim: Speculates that rival corporations could recruit people inside the Zone, who might gain access
      to corporate assets.
    certainty: speculation
  editorial_principle: Fictional matrix commenters, printed excerpts and purported messages are independently
    attributed and are not silently promoted into established historical fact.
framing: newsroom_neutral
headline: 'The Core: attributed public reports and matrix commentary'
summary: Source-attributed accounts from 2055, separating commentary, speculation and reported events.
