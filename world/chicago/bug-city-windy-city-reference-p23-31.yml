data:
  section: 'Windy City / Basic Information / Getting Around, pp23-31'
  narrative_form: In-universe travel and city guide with dated Shadowland commentary and reprinted transport references; historical pre-isolation descriptions do not establish post-isolation access.
  city_social_context:
    pages: '23-24'
    location: Chicago, UCAS, within and outside the Chicago Containment Zone
    basis: Dated in-world accounts distinguish the part of Chicago sealed within the Wall from neighborhoods outside it; these are perspectives, not universal census findings.
    neo_anarchist_activity: A local narrator describes Northside grassroots groups and charitable shadowrunner arrangements as emerging after the containment disruption.
  climate:
    printed_page: 25
    seasonal_conditions: Chicago is described as prone to rapid weather changes and severe winter blizzards.
    snowdrift_maximum_reported: Three and a half meters or more.
    lake_reference: Lake Michigan is named as a longstanding influence on local weather.
  air_access:
    printed_pages: '25-26'
    airport_primary: O'Hare International Airport
    primary_setting: O'Hare Sub-Sprawl and North American cargo/passenger connections
    other_airport: Midway International Airport, associated with corporate Elevated-area travel
    inspection_as_described: Airport screening includes firearms inspections and some BTL-related searches; narrative indicates heightened security after the prior year's assassination of the German Chancellor.
    baseline_domestic_fare_usd: {minimum: 100, maximum: 500}
    domestic_fare_variables: [ticket_class, season, city_of_origin, departure_time]
    international_multiplier_source_wording: 'Multiply domestic prices by 100 to 500 percent for international flights.'
    timing_note: The quoted travel market predates or is disrupted by the containment restriction; late-2055 forum comments disagree on airport operation.
  road_and_bus:
    printed_pages: '26-30'
    bus_fare_usd: {minimum: 150, maximum: 250}
    bus_fare_depends_on: Departure location
    pre_isolation_access: Road and bus access to Chicago is described before containment; later accounts describe barriers and restrictions on movement across the Zone perimeter.
    highway_guide:
      cited_in_world_publication: "Fodorr's '28 Chicago (Fodorr's Travel Publications, Inc., 2028)"
      printed_page: 28
      count_expressways_to_core: 6
      lake_shore_drive: Eight lanes along lakefront
      interstate_90: Twelve lanes, crosses North/Northwest to Southeast corridor
      interstate_94: Twelve lanes, crosses North/Northwest to Southeast corridor
      interstate_290: Twelve lanes across Westside
      interstate_57: Enters city from South
      expressway_map: 'Chicago>Transportation>Maps>Expressways, printed page 30, PDF31; shows Containment Zone, routes and interchanges.'
    government_notice:
      printed_page: 28
      dateline: '2055-08-24'
      publication_path: AP>NEWSNET>TAGLI
      subject: Zone Isolated
      attribution: UCAS military commander for Chicago, quoted through spokesman William Smiley
      announced_policy: Entry and departure along Chicago expressways, rail lines and waterways to be prevented; responsibility disclaimer attributed to the UCAS announcement.
  rail:
    printed_pages: '27,30-31'
    passenger_provider: Amtrak Inc.
    domestic_illinois_ticket_usd: {minimum: 20, maximum: 50}
    other_states_ticket_usd: {minimum: 50, maximum: 300}
    accommodation_classes: [first_class, second_class, tourist]
    inspection_as_described: Weapons screening described as stronger than general spot checks for contraband.
    service_caveat: In-world post-isolation comments say tracks stop at the Wall; these statements are attributed claims, not proof that rail remains officially available.
    metropolitan_network:
      provider_names: [Metrorail, Skytrack]
      types: [bus, subway, elevated_rail]
      original_service: Most rapid-transit lines described as operating 24 hours, with exceptions noted by the source.
      map: 'Chicago>Transportation>Maps>Rapid Transit Systems, printed page 31, PDF32.'
  lodging:
    printed_page: 27
    northside_hotel_usd_per_night: 30
    ym_wca_usd_per_night: {minimum: 2, maximum: 5}
    metahuman_hostels: Similar nightly cost to the YM/WCAs per narrator.
    noose_high_security_hotel_usd_per_night: 100
    post_wall_caveat: Post-isolation comments report shelter disruption, different hotel use and private-host lodging, rather than reliable commercial availability.
  civil_legal_services:
    printed_page: 28
    organization: North American Civil Liberties Union
    narrator_description: Has local legal contacts and can generally refer residents to assistance, though the narrator suggests corporate, civic and organized-crime influence can complicate difficult cases.
  mechanics_assessment: No standalone dice, target-number, combat, spell, equipment or movement test rule is printed in this slice; all numeric values above are preserved historical setting references and costs.
  lineage: Historical Second Edition sourcebook setting and travel references; no inferred SR3 mechanical replacement.
framing: newsroom_neutral
headline: Chicago travel and services — historical setting reference
summary: Source-period Chicago geography, weather, transport fares, lodging prices and containment notice; pre-isolation guidance is separated from later forum reports.
