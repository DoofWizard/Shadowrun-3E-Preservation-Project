id: world.chicago.bug-city-core-corporate-claims-p90-92
record_type: attributed_corporate_site_commentary
status: source_reviewed
source: source.fasa-7117
printed_pages: 90-92
pdf_pages: 99-101
edition_scope: Historical Shadowrun Second Edition Bug City setting (2055); no inferred SR3 supersession
content_class:
- attributed_claim
data:
  source_period: 2055
  statements:
  - p: 90
    speaker: Dumpster Diver
    certainty: local_report
    claim: Claims wasp nests occupy upper stories of many Core towers and impede corporate security; names Ares, Aztechnology, Fuchi, Mitsuhama, Saeder-Krupp,
      Yamatetsu and the former Federated-Boeing air-service base as Core sites.
  - p: 90
    speaker: Agent Nadalya Smith, UCAS Chicago Section 5 memorandum to Commander Romero
    certainty: intelligence_assessment
    claim: Says informants indicate sensitive corporate property may remain abandoned in the quarantined Core.
  - p: 90
    speaker: Agent Nadalya Smith, UCAS Chicago Section 5 memorandum to Commander Romero
    certainty: interview_based_speculation
    claim: Believes Ares facilities may still hold prototypes and design chips for the second-generation Alpha Combatgun high-velocity assault rifle and
      Firelance vehicle-laser systems; neither availability nor specifications are established.
  - p: 90
    speaker: Agent Nadalya Smith, UCAS Chicago Section 5 memorandum to Commander Romero
    certainty: recommendation_not_confirmed_event
    claim: Recommends a UCAS recovery mission for such assets, or destruction if recovery is impossible, to deny access to opposing forces.
  - p: 90
    speaker: Smart Shopper
    certainty: speculative_report
    claim: Portrays the former Ares Arms building as a possible source of experimental armor-piercing ammunition, weapon prototypes and advanced surveillance
      equipment.
  - p: 90
    speaker: Signal King
    certainty: skeptical_question
    claim: Questions whether the purported Ares inventory could be reached given potential building defenses.
  - p: 90
    speaker: Tiger Faux
    certainty: inference
    claim: Suggests Ares personnel now working at Wrigley Dome Haven may have relocated some former-site equipment.
  - p: 90
    speaker: Dumpster Diver
    certainty: local_report
    claim: Alleges Aztechnology left behind simsense chips and interface rigs when it departed the Containment Zone.
  - p: 91
    speaker: Zeeblik
    certainty: allegation
    claim: Alleges the Chicago Aztechnology branch had ties to both local Yakuza and Mafia groups, which may be seeking abandoned simsense equipment.
  - p: 91
    speaker: Corleone
    certainty: hearsay
    claim: Has heard Aztechnology also maintained a city warehouse holding illicit simchips.
  - p: 91
    speaker: The Untouchable
    certainty: street_rumor_and_inference
    claim: Says rumors place at least three major BTL warehouses inside the Containment Zone, while doubting that Aztechnology stored such chips in its
      corporate offices.
  - p: 91
    speaker: Koola
    certainty: skeptical_opinion
    claim: Disputes the exaggerated suggestion that every warehouse in the Zone contains illicit simchips.
  - p: 91
    speaker: FireNet
    certainty: concern
    claim: Raises concern that Aztechnology might have left unmonitored magical materials inside its site.
  - p: 91
    speaker: Tubor Joy
    certainty: claimed_astral_observation
    claim: Reports powerful magical wards around the Aztechnology building and infers that an occupant may still be maintaining security there.
  - p: 91
    speaker: Twilight Torn
    certainty: speculation
    claim: Suggests a blood spirit might explain the reported protections; the entity is not confirmed.
  - p: 91
    speaker: Jaeger
    certainty: anecdote_and_rumor
    claim: Reports an experimental Eagle military VTOL was flown from the Federated Boeing site, and relays rumors that additional Eagles and Commander
      military rotorcraft remain there.
  - p: 91
    speaker: Lord Donut
    certainty: skeptical_opinion
    claim: Questions the Federated Boeing aircraft report, citing the adjacent containment Wall and anticipated anti-air defenses.
  - p: 91
    speaker: Viscount Horseman
    certainty: rumor
    claim: Asks whether the Federated Boeing building is haunted, citing its location on the former Mount Olivet Cemetery and an unverified story that burials
      were not exhumed.
  - p: 91
    speaker: Surveyor
    certainty: corrective_counterclaim
    claim: Disputes the non-exhumation story, saying the graves were relocated into subsurface levels, and draws a similar comparison with the Ares site's
      former cemetery land.
  - p: 91
    speaker: Lacombe
    certainty: supernatural_speculation
    claim: Suggests any restless spirits at the Federated Boeing site could remain tied to their former burial place.
  - p: 91
    speaker: Lou C.
    certainty: unverified_report
    claim: Claims Fuchi Americas left prototype cyberdecks and that beetle spirits nesting in its basement may be limiting access to them.
  - p: 92
    speaker: Geekster
    certainty: speculative_claim
    claim: Suggests Fuchi's renowned intrusion-countermeasure software could still be present at the site.
  - p: 92
    speaker: Dr. Leary
    certainty: opinion
    claim: Identifies simsense technology as a particularly valuable potential remnant of the Fuchi site.
  - p: 92
    speaker: Twisted Fiddle
    certainty: skeptical_inference
    claim: Argues Fuchi or scavengers probably removed remaining hardware already, referencing Truman-associated competition.
  - p: 92
    speaker: Pumpkin Head
    certainty: speculation
    claim: Wonders if valuable Fuchi software, including simsense compression algorithms, could remain even if hardware is gone.
  - p: 92
    speaker: Oro Uro
    certainty: secondhand_report
    claim: Says acquaintances recovered autonomous guided vehicles, computer-controlled weapons and remote drones from the Mitsuhama site.
  - p: 92
    speaker: Suzette
    certainty: secondhand_report
    claim: Reports other entrants at the Mitsuhama site were harmed by machines of the same sort.
  - p: 92
    speaker: Tinker
    certainty: inference
    claim: Argues that continuing electricity in the Core could leave automated corporate security systems operational, posing a hazard even at seemingly
      empty sites.
  - p: 92
    speaker: Audrey V.
    certainty: counterclaim
    claim: Says the Mitsuhama Chicago building may have been an administrative facility storing payroll and supply-routing information rather than significant
      hardware.
  - p: 92
    speaker: X-Terminator
    certainty: unverified_report
    claim: Attributes smartgun interface and modified wired-reflex research to Yamatetsu and speculates that records of the work may have been left at its
      site.
  - p: 92
    speaker: Johnny Darke
    certainty: local_report
    claim: Reports two insect-spirit nests inside the Yamatetsu building, involving roach and beetle spirits, with beetles appearing dominant.
  - p: 92
    speaker: Tiger Faux
    certainty: local_report
    claim: Describes targeted fire from the containment Wall near the Yamatetsu building and says personnel are attempting to drive insect spirits away,
      though the effect is limited.
  editorial_note: All items are in-universe 2055 commentary, fictional institutional analysis, hearsay or claims; no statement here establishes present-day
    SR3 facts or actual game-stat modifiers.
framing: newsroom_neutral
headline: Attributed testimony on Chicago Core corporate sites
summary: Distinct reports, rumors, institutional recommendations and counterclaims from the historical Core site listings.
