id: world.chicago.bug-city-insect-forms-claims-p72-74
record_type: attributed_matrix_commentary
status: source_reviewed
source: source.fasa-7117
printed_pages: '72-74'
pdf_pages: '73-75'
edition_scope: Historical Shadowrun Second Edition setting; no inferred SR3 supersession
content_class:
  - attributed_claim
framing: newsroom_neutral
headline: Insect forms and Containment Zone commentary
summary: Attributed and contested in-world observations about the insect-spirit threat.
data:
  claims:
    - printed_page: 72
      speaker: Great Big Bear
      subject: Dormant colony sites
      claim: Says witnesses have seen people deliberately disturbing dormant insect sites after the Cermak event.
      certainty: purported_firsthand_report
    - printed_page: 72
      speaker: Ellen X.
      subject: Universal Brotherhood
      claim: Rejects the claim that the Universal Brotherhood caused Chicago's catastrophe and says she intends to remain to assist residents.
      certainty: contested_opinion
    - printed_page: 72
      speaker: Wall Watcher
      subject: Leaving the Containment Zone
      claim: Responds skeptically to the prospect of crossing the Wall, emphasizing danger.
      certainty: personal_opinion
    - printed_page: 72
      speaker: McCormick's Raider
      subject: Cocoons
      claim: Urges direct destruction of discovered cocoons.
      certainty: advocated_action_not_verified_rule
    - printed_page: 73
      speaker: Milo
      subject: Insect spirit power
      claim: Believes many spirits have become weak after the Cermak explosion or hasty summoning.
      certainty: personal_observation_and_speculation
    - printed_page: 73
      speaker: Tower Terror
      subject: Insect spirit threat
      claim: Disputes minimization of the threat and urges avoidance rather than complacency.
      certainty: counterclaim
    - printed_page: 73
      speaker: Werehouse
      subject: Chicago residents
      claim: Objects to abandoning the city, asserting that remaining residents must reclaim their community.
      certainty: political_position
    - printed_page: 74
      speaker: Adam S.
      subject: Household vulnerability
      claim: Describes the burden of protecting eight children with very few adults.
      certainty: firsthand_context
    - printed_page: 74
      speaker: Park Police
      subject: Collective defense
      claim: Recommends improvised close-range resistance; Warlock in Chains immediately challenges the foreseeable risks to other people.
      certainty: disputed_advice
    - printed_page: 74
      speaker: Traveller 128
      subject: Flesh-form likeness
      claim: Compares observed flesh forms to creatures shown in the earlier simsense production Against the Hive.
      certainty: personal_comparison
    - printed_page: 74
      speaker: Cobol-san
      subject: Magical concealment
      claim: Suggests a disguise spell lock could conceal an insect flesh form.
      certainty: hypothetical
    - printed_page: 74
      speaker: Dweeber
      subject: Host consciousness
      claim: Claims some hosts might rarely persist as subordinated consciousness within the insect spirit.
      certainty: speculative_counterclaim
  note: Claims are fictional Matrix dialogue; no witness advice is a real-world instruction or independent rules mechanic.
