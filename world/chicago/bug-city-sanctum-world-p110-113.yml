data:
  setting_era: 2055 Chicago Containment Zone
  entry: {site: The Sanctum, source_header: THE SANCTUM (HAVEN), prepared_by: Seraph Adelaide, first_printed_page: 110}
  site:
    id: place.chicago.sanctum
    prior_identity: Field Museum of Natural History
    standing: Largest haven in the Containment Zone after Ghoultown and the Wrigley Dome, according to source narration.
    founder: Jason Two Spirits
    founder_details: Owl shaman and professor of magic, who came to Chicago approximately six months before insect spirits appeared and publicly warned of a coming danger.
    purpose: Shelter Zone residents, defend against insect spirits, and investigate means to counter the infestation.
    history: Two Spirits and followers fortified the Field Museum after insects appeared; arrivals included runners, magicians, and ordinary Chicago residents.
    research: The museum's many artifacts and preserved objects are used for magical investigation, experiments, wards and field testing by a mix of shamans, hermetic practitioners, adepts, and nonmagical participants.
    map_reference: Sanctum site map reproduced on printed page 110 (PDF 119) includes the downtown street grid and Lake Shore Drive.
    mundane_security:
      printed_page: 112
      personnel: 10
      weapons: [assault rifles, shotguns, light machine guns]
      fixed_position: One submachine-gun emplacement near the building's single entrance on the north side.
      armed_resident_support: approximately 20 residents armed with light and heavy pistols.
    magical_security:
      printed_page: 113
      supervisor: Jason Two Spirits
      fully_trained_mages: 5
      magic_students: approximately 25
      traditions: [shamanic, hermetic]
      methods: [wards, spells, summoned spirits]
      variability: Magical protections change as residents try differing combinations and experiments.
    inhabitants:
      printed_page: 113
      approximate_population: 270
      includes: [Jason Two Spirits, five fully trained mages, ten mundane security members]
    membership:
      printed_page: 113
      requirement: Volunteers willing to risk themselves opposing insect spirits are welcome.
      recruitment_contacts: [Haymarket Nation to the north, Little Earth near the former University of Chicago campus]
    governance: Charismatic leadership by Two Spirits; the expository source describes most residents following him and viewing challenges to his authority with suspicion.
  related_claims: world.chicago.bug_city.sanctum_claims_p110_113
  mechanical_status: Numerical staffing and defensive equipment describe the haven; no target numbers, dice procedures, game modifiers, weapon stat lines or force ratings are specified.
