data:
  beetle:
    p: '139'
    pdf: '148'
    behavior: Males are generally more aggressive than females, territorial, and travel and hunt alone. They appear
      to engage in nondamaging horn-locking contests. Females tend to travel or hunt in groups of two or three.
  cicada:
    p: '139'
    pdf: '148'
    behavior: Present little danger; males use abdominal membranes for loud buzzing when a Mother or Cicada shaman
      invests new spirits.
  firefly:
    p: '139'
    pdf: '148'
    appearance: Soft-bodied beetle spirits with intermittent yellow-green lower-abdomen light; both sexes exist,
      with infertile females.
    behavior: Males generally glow only when agitated or within a few dozen meters of a Mother. Females flash during
      new-spirit investment by their Mother or shaman. Large male groups sometimes gather in buildings or trees
      for prolonged synchronized flashing.
  fly:
    p: '140'
    pdf: '149'
    society: Hive formations without castes; all members except Queen are male. Males perform worker and warrior
      roles but are less capable at both than ant spirits. Hive reproduction differs from terrestrial flies.
    nesting: Chaotic, noisy, unkempt, strongly smelling of refuse; possible almost anywhere, favoring deteriorated
      locations.
  mantis:
    p: 140-141
    pdf: 149-150
    behavior: Often considered malign and destructive, but consuming other insects is a primary goal, unlike the
      propagation focus of other insect spirits.
    control_relationship: Powerful and difficult to control; males are substantially less intelligent and powerful
      than females and primarily serve them. Male Mantis shamans are nearly unheard of because female spirits resist
      male control; female shamans may form stronger partnerships but remain at risk.
    human_contact: Tend to live among humanity as far as their alien nature permits.
  mosquito:
    p: '141'
    pdf: '150'
    behavior: Females feed on warm-blooded creatures, usually asleep or subdued, and can drain them fatally; they
      gather blood for the Mother. Males are relatively benign and generally protect the Mother.
  roach:
    p: '142'
    pdf: '151'
    nesting: Build nests by preference rather than necessity; males cluster around the Mother that produced them.
      More than one Mother may share a nest depending on female social dynamics, but more than three rarely do.
      Nests may occur anywhere and in unexpected locations.
  wasp:
    p: '142'
    pdf: '151'
    society: Hives without castes; males territorial but not very intelligent. Females are described as malign and
      intelligent, particularly Queens during egg laying. Multiple females may share a hive, but only the Queen
      attains sexual maturity.
    nesting: Physically much smaller hives than other insects, but complex and densely populated; prefer upper building
      floors and elevated open-air locations.
