data:
  mosquito:
    page: {printed: 81, pdf: 90}
    feeding: Female mosquito spirits possess penetrating mouthparts and seek immobilized or sleeping warm-blooded prey; the narrator claims one can drain a full-grown troll in about 20 minutes.
    habitat: Nests and cocoons in stagnant or still water, including lakes and large pools.
    grouping: Usually swarms of three to eight, sometimes more, despite being described as solitary insects; groups may focus on one target.
    prey_selection: Animal blood is sufficient; dogs are described as frequent prey.
    host_process: The female's stinger enters the host during the fictional summoning and inhabitation episode. A relatively thin cocoon covers the host; others periodically exchange fluids with the host, with the purpose undetermined.
  roach:
    page: {printed: 82, pdf: 91}
    habitat: Roach spirit hives favor proximity to people in cool, damp sites such as garbage dumps, sewers, underground garages, basements and subway tunnels.
    sensory_trait: Abdominal cerci detect subtle air motion, alerting roach spirits to a nearby approach from behind.
    food: The narrator lists discarded waste, decaying organic material and other cockroaches.
    zone_distribution: Found across the Containment Zone, from Irving Park Road southward toward the Core; garbage accumulations are noteworthy sites.
  wasp:
    page: {printed: 83, pdf: 92}
    habitat: Wasps build hives in elevated locations including the tall buildings of Daley Gardens and corporate towers in the Core.
    activity: Typically active by day; described as very fast movers.
    queen_host_process: A queen finds a host, uses a paralyzing substance from her abdomen and places a new spirit in the host, modeled on the egg-laying behavior of natural wasps.
    incubation: Hosts are not invariably cocooned; some lie near the queen under worker care. Claims that others resume ordinary activity before incubation ends are presented as anecdotal, not confirmed universal practice.
  page_84: {printed: 84, pdf: 93, material: Full-page monochrome illustration; no standalone game procedures or stat block.}
  mechanics_scope: These pages contain creature behavior and ecological narration, not quantified dice-pool or target-number mechanics.
