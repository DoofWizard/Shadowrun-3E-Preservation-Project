    - printed_page: 60
      speaker: Uncle Leeche
      topic: Commerce inside the Containment Zone
      claim: Reports that street brokers, local group leaders, and informal barter arrangements determine access to scarce goods; advises caution with offers from unknown sellers.
      certainty: first_person_local_report
    - printed_page: 60
      speaker: Swiss Knife
      topic: Rival organized groups
      claim: Describes Yakuza, Mafia, and Triad members as trapped inside the Zone and now competing for local markets and supply access, sometimes against one another.
      certainty: attributed_zone_account
    - printed_page: 60
      speaker: Swiss Knife
      topic: Territorial influence
      claim: Says organized groups continue supplying local leaders and exerting influence over groups claiming neighborhood control.
      certainty: attributed_zone_account
    - printed_page: 61
      speaker: W. Jacobs (NewsHound)
      topic: News in the Containment Zone
      claim: Explains why rumors are difficult to verify and calls for reporting that distinguishes observations from speculation and hearsay.
      certainty: first_person_editorial
      network_locations:
        read_news: GO CITYNEWS
        news_comments: GO CITYNEWS/TALK
        post_comments: CITYNEWS/COMMENT
    - printed_page: 61
      speaker: Firestorm
      topic: Mutual aid
      claim: Offers volunteer support through the Zone data network and distinguishes general assistance from insect-related requests.
      certainty: first_person_notice
      network_locations:
        special_help: CORE/CITY/SPECIAL.HELP
        insect_related_requests: CORE/INSECTS/RAID
