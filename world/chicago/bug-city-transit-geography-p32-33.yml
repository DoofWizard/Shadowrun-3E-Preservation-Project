data:
  section: Windy City / Getting Around / Transit networks
  conventional_city_services:
    elevated_lines:
      Metrorail: Northside to the Noose; published descriptions refer to stations through the Noose being closed and sealed.
      Skytrack: Serves the downtown Elevated; a Southside monorail developed from 2025 onward, following the 2026 trideo boom, on pillars described as seven stories high.
      train_schedule: Both conventional elevated services described as operating around the clock before later containment disruption.
    bus_service: Wind Transit obtained the surface-bus contract approximately ten years before the narrative; buses are described as cleaner south of Noose and less dependable to its north.
    ferry_route: A service links Business Village and the Southside through University of Chicago Pier, subject to weather cancellations.
    helicopter_network: Federated Boeing operates a local route among important Southside government and commercial buildings with helipads.
  temporal_note: Traveler-focused historical city guide coexists with late-2055 comment claims of lines blocked or requisitioned; neither layer should be flattened into unqualified current service availability.
