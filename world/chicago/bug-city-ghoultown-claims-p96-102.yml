      - handle: Garbo
        timestamp: '2053-11-22 12:45:31'
        certainty: hostile_hearsay
        account: Claims not to have visited the refuge, repeats rumors about poor conditions, and voices a proposal to kill the ghoul residents.
      - handle: Mistah Happy
        timestamp: '2053-11-24 03:44:21'
        certainty: hostile_advocacy
        account: Advocates an intentional mass-fatality incident targeting the entire ghoul refuge; the text is a fictional in-world threat, not a confirmed plan or event.
      - handle: SYStem 05
        timestamp: '2053-11-27 23:54:11'
