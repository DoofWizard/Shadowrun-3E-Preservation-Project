  retrospective_accounts:
    - printed_page: 100
      date: '2054-01-04'
      speaker: Doubleday
      format: Diary of a Samaritan
      certainty: first_person_account_not_independently_verified
      account: Describes volunteering to protect the refuge at the end of the Knight-Errant contract despite private misgivings about ghoul rights and the residents' diet. Describes rival political groups arriving, encounters a wandering child whose appearance seems unusual, and later awakening injured in a private hospital. Cronk tells the narrator that the child carried nerve-agent canisters and that Humanis members were attempting to blame the ghouls for a wider disaster. The narrator condemns the refuge's treatment and expresses relief at surviving without ghoul infection.
    - printed_page: 101
      date: '2055-03'
      speaker: hearing_record_editorial_note
      format: SO 162 pretrial transcript context
      certainty: retrospective_source_narration
      account: The excerpt introduces a class action brought by Jonathan Mier against legislative firm Dumas, Alexander, and Tate, which UCAS employed to draft and administer Special Order 162. It says charges were dropped, but Alexander admitted accepting money from alleged Humanis Policlub members to add Article 16's 'fair game' language. Alexander was disbarred, served 16 years of a 25-year sentence as a Justice Department conscripted courier, and died by suicide in March 2055. The source dates and stated service duration are retained even though they appear chronologically inconsistent.
    - printed_page: 101
      speaker: Alexander
      counterpart: Judge Andrew Gregory
      format: SO 162 hearing testimony
      certainty: disputed_legal_testimony
      account: Alexander says early surveys indicated some resistance but not the later level of hostility. He says that 218 refuge residents died within 48 days after Knight-Errant's withdrawal, that available guards were insufficient, and that alternative security contracts were unworkable. He attributes the recommendation to repeal Special Order 162 to inability to protect the residents. Gregory questions the decision, the drafting of Article 16, and its human-rights implications.
  qualification: All interviews, network posts, first-person recollections and quoted legal positions remain attributed in-world accounts. Numbers, dates and quotations belong to their source-era publications and do not prove independent historical fact or present-day setting conditions.
