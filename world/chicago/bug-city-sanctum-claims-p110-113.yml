      assertions:
        - {speaker: Jason Two Spirits, certainty: prediction, substance: Predicts a cataclysm affecting Chicago within a year, with danger to the wider Midwest if people fail to prepare.}
        - {speaker: Jason Two Spirits, certainty: stated_intention, substance: Says he would do everything within his means to help others survive, even if only a few people could be reached.}
        - {speaker: David Bryant, certainty: skeptical_reaction, substance: Questions the severity of the forecast and treats Two Spirits as seeking attention.}
