      assertions:
        - {speaker: Abbot Walker, certainty: firsthand_testimony, substance: Reports witnessing an insect-like attacker and casualties inside the museum, then escaping through exhibition galleries while further visitors were at risk.}
        - {speaker: Abbot Walker, certainty: firsthand_testimony, substance: Reports that Jason Two Spirits repelled the attacker with a powerful magical effect and led survivors through the building with armed supporters.}
        - {speaker: Abbot Walker, certainty: witness_interpretation, substance: Says he initially opposed Two Spirits and now views his preparation and leadership as critical to survival; says he intends to repay him.}
    - form: network_discussion
