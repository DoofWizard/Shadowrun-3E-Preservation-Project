headline: Ant, beetle, and cicada insect-spirit profiles
summary: Source-period Chicago insect-spirit behavior and habitats, without inferred gameplay statistics.
data:
  source_context: In-world observations of fictional insect-spirit types; no numeric game-stat blocks occur in this passage.
  ant:
    printed_page: 75
    grouping: Organized hives typically have a queen surrounded by wingless infertile female workers and fertile males called soldiers, some winged.
    queen_count: Generally one per hive; the author reports hearing of colonies with cooperating queens.
    group_size_reported: 5 to 40 ants in a foraging or hunting column, conditional on hive size and assignment.
    territory: Excavated earth nests with conspicuous mounds and multiple exits; columns collect food and return to the hive.
  beetle:
    printed_page: 76
    grouping: Generally classified as loners, although groups reportedly form near a home nest or in response to a female's call.
    habitat: Cool, damp, dark premises, including basements, sewers and abandoned supermarkets.
    behavior: Compilers describe long concealment in debris or underground and occasional physical activity despite their spirit nature.
    degree_of_certainty: In-world eyewitness descriptions and claims, not universal species mechanics.
  cicada:
    printed_page: 77
    similarity: Described as resembling beetles in behavior except for persistent noise.
    habitat: Lightly wooded parks, forest preserves, isolated large trees, and a reported infestation at the former Lincoln Park zoo.
    seasonal_behavior: The compiler notes reported reduced activity toward winter.
    contested_nesting: Rumors describe one or two cicadas guarding a hive or nest occupied by another spirit type, without confirmation.
  exact_mechanics: No damage codes, dice tests, force ratings, Attributes or numerical combat modifiers supplied here.
