data:
  source_context: Fictional Shadowrun tabletop role-playing game historical source,
    Blood in the Boardroom, FASA Corporation (FASA7327, 1999, original Third Edition-era),
    original printed/PDF pages 72; not a real-world report or modernized ruleset.
  section: 'Track Four: Out of the East — Wuxing/Pacific Prosperity Group and Yamatetsu
    history'
  wuxing_and_ppg:
    independence: The book narrator states that Wu Kuan-Lai believed Japanese domination
      of the Pacific was a threat to Wuxing and spent the 2020s cultivating links
      to non-Japanese companies rather than confront Japanese AAA firms directly;
      he died in 2039 without achieving the proposed alliance.
    successor: His son Wu Lung-Wai revived this plan after a large bequest from Dunkelzahn
      brought Wuxing new capital. The text describes Wuxing growing sufficiently to
      organize a loose Pacific business alliance.
    buttercup_role: After Tadamako Shibanokuji suffered a stroke in January 2059,
      the free spirit Buttercup approached Wuxing and other prospective members about
      building a combined Pacific Prosperity Group (PPG) with Yamatetsu. The text
      attributes negotiations and the pooling of resources to her organizing effort.
    founded: The book states that on July 8, 2059, Yamatetsu, Wuxing, Tan Tien, Eastern
      Tiger, Kwonsham Industries, Malaysian Independent Bank, Shibata Construction
      and Engineering, Lami Look Pagkaon, and PacRim Communications Unlimited jointly
      formed the PPG; two Native American Nations companies, Universal Omnitech and
      Chevalier, joined in September with approximately twelve other smaller companies.
  yamatetsu_foundation:
    formation: In late 2032, roughly a dozen large Japanese and Filipino corporations
      formed Yamatetsu to resist absorption by Fuchi or Mitsuhama, with foundations
      in computers, electronics, cybernetics, military engineering, shipping and finance.
    expansion: The narrator dates Yamatetsu’s entry into the first tier of megacorporations
      to 2042 and attributes its advancement to military electronics research and
      expanded production and distribution.
    ownership: The founding Japanese and Filipino groups had been roughly equal. Over
      the 2040s Japanese interests consolidated board control. The text notes Filipino
      board members remaining, particularly Ramon Dimzon, but says many lost effective
      influence or were bought out.
    corporate_geography: The source says Yamatetsu has no official corporate presence
      in the Philippines despite its founding history, operates in the Americas, Europe,
      Asia and the Pacific, and commonly lets subsidiaries trade in their own names.
  certainty: Historical setting assertions are narrator-supplied; future corporate
    aims are described as plans rather than guaranteed events.
