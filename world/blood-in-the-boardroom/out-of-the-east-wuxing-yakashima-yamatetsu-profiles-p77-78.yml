data:
  source_context: Fictional Shadowrun tabletop role-playing game historical source,
    Blood in the Boardroom, FASA Corporation (FASA7327, 1999, original Third Edition-era),
    original printed/PDF pages 77-78; not a real-world report or modernized ruleset.
  section: 'Track Four: Out of the East — later corporate business profiles'
  wuxing:
    identity: Wuxing, Inc.; president/CEO Wu Lung-Wai; headquarters Hong Kong Free
      Enterprise Zone.
    expansion: The narrator attributes Wuxing’s rapid expansion toward near-AAA strength
      to Dunkelzahn’s large bequest, shareholder confidence, investment, and diversification
      into biochemistry, genetic engineering, agriculture, transport, information
      management, resources and magical research.
    triad_rumors: The source explicitly says rumors persist of Triad involvement;
      tracing corporate cash flow has proved difficult and no substantiating evidence
      has been found.
  yakashima:
    identity: Yakashima Technologies; president/CEO Hiroshi Yakashima; headquarters
      Yokohama, Japan.
    history: The narrator describes a compact hostile-acquisition specialist that
      benefited from Dunkelzahn’s inheritance, then faced unwanted attention from
      AAA companies including Yamatetsu and Ares.
    yamatetsu_departure: With Yamatetsu no longer a direct Japanese rival, Yakashima
      returned to acquisitions, including former Yamatetsu subsidiaries. The book
      reports accusations of layoffs of metahuman workers and describes Yakashima’s
      public-relations effort to recast these acquisitions favorably.
  yamatetsu:
    identity: Yamatetsu Corporation; president/CEO Saru Iwano; headquarters Vladivostok,
      Russian Republic.
    business: The narrator says Yamatetsu maintains a broad corporate empire while
      relying on subsidiary names more than a strong parent-company identity, and
      retains considerable power in the Pacific and South America.
  certainty: These are period-specific fictional sourcebook profiles; corporate motivations
    and rumors should not be treated as timeless facts.
