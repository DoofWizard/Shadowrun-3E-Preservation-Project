data:
  source_context: Fictional Shadowrun tabletop role-playing game historical source,
    Blood in the Boardroom, FASA Corporation (FASA7327, 1999, original Third Edition-era),
    original printed/PDF pages 76-79; not a real-world report or modernized ruleset.
  section: 'Track Four: Out of the East — corporate personalities and supernatural
    figure'
  jessica_sirianni: The book profiles Federated Boeing CEO Jessica Sirianni as a self-made
    aerospace engineer who grew up in poverty in Auburn/Boise, taught herself using
    donated books, attended Seattle Central Community College and earned an aerospace
    engineering degree at the University of Washington. She displaced William Vogel
    in a late-2057 power struggle and directs the corporation as a demanding executive.
    Some personal and business contacts are described as shadowy without their details
    being established.
  wu_lung_wai: 'The narrator depicts Wuxing CEO Wu Lung-Wai as having inherited the
    firm and expanded it extensively. Reports that he is magically active are unconfirmed:
    the text expressly says no confirmed instance of spellcasting or other sorcery
    is known, and observers instead suggest a possible social-adept ability.'
  sun_running: The book describes Sun Running, the head of Wuxing’s newly established
    Seattle division, as a cheerful, seemingly unambitious older businessperson whose
    cultivated leisure persona conceals attentiveness and decisiveness. His apparent
    negligence is described as an impression that has misled rivals.
  buttercup:
    identity: The source identifies Buttercup as a free ally spirit originally summoned
      centuries before the Awakening, manifesting as a young Japanese woman. The source
      recounts her changed understanding of sentient equality after Dunkelzahn bound
      her within an orc body for a year and a day.
    corporate_actions: She acquired stakes in corporations, especially Yamatetsu,
      and began pressing for metahuman equality through the company following Dunkelzahn’s
      death and Tadamako’s incapacitation. The book also notes she can be severe and
      manipulative.
    abilities: The source lists Astral Gateway, Aura Masking, Human Form, Possession,
      Sorcery and Wealth; it says Buttercup may use Sense Link with people feeding
      her Karma, and persons knowing her true name may attempt Telepathic Link. This
      is an attributed fantasy ability list, not a real-world claim of magic.
  yuri_shibanokuji: The source identifies Yuri as Tadamako Shibanokuji’s son, a goblinized
    orc (called an oni in this context) raised in Vladivostok with his mother, Tatiana
    Trigorin. Before taking his father’s shares and board position, he owned a small
    restaurant chain. Buttercup and Newton Chin supported him on the Yamatetsu board;
    he drew on his mother’s votes and those of his father, but was wary of the older
    directors.
  jacques_barnard: The book identifies Jacques Barnard as executive vice president
    of Yamatetsu North America and former Seattle chief, a hermetic mage suspicious
    of spirits he cannot control, who distrusts Buttercup. It says he maintains influence
    in Yamatetsu governance and personal contacts in Seattle’s shadow community.
  mary_luce: The narrator describes Mary Luce as Barnard’s successor directing Yamatetsu’s
    Seattle activities. She retained and expanded his contact network, favors employment
    over freelance field assets, and is rumored to be an adept; the text says those
    rumors remain unverified.
  editorial_note: Game-world classifications and supernatural powers are documented
    as fictional tabletop setting attributes; rumor, narrator description, and optional
    future implications remain distinct.
