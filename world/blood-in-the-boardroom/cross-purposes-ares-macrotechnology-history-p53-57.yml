data:
  source_context: Fictional Shadowrun tabletop-RPG sourcebook Blood in the Boardroom,
    FASA Corporation, 1999, FASA7327, original Third Edition-era, printed pp53-57/PDF
    pp53-57.
  section: 'Track Three: Cross Purposes / What’s Going Down / Ares Macrotechnology
    History'
  narrator_chronology:
  - In 2001 the Shiawase extraterritoriality decision leads Nicholas Aurelius of Detroit
    to consolidate acquisitions as Ares Industries in 2002; by 2012 he is a founder
    of the Inter-Corporate Council, predecessor of the Corporate Court.
  - In 2016 Aurelius buys the United States space program, whose remaining facilities
    and equipment the Ares agreement requires to be returned to a government in 2055.
    His financial gamble expands Ares into orbital salvage and manufacturing.
  - Ares takes over the Freedom space station, builds Apollo, and later sells Freedom
    to Zurich-Orbital; the latter is renamed as part of the Zurich-Orbital corporate
    court setting. These are successive fictional business and orbital-history developments,
    not a single acquisition.
  - Nicholas Aurelius is removed from the CEO chair in 2023 by Sakehisa Tajika; the
    corporation is renamed Ares Macrotechnology in 2024. Nicholas returns in 2028
    and retires in 2030; Leonard Aurelius succeeds him.
  - In 2033 Damien Knight acquires 22 percent of Ares in approximately sixty-three
    seconds during the Nanosecond Buyout; he becomes CEO and chairman. Nicholas Aurelius
    suffers a fatal heart attack that same year.
  - Ares shareholder Gavilan Ventures is linked to Dunkelzahn; Knight and Leonard
    Aurelius each control roughly 22 percent, with Gavilan/Dunkelzahn holding a further
    12 percent, insufficient to grant either Knight or Aurelius sole voting control.
  - 'Knight develops Ares Arms and Knight Errant Security. Leonard Aurelius retains
    board standing and unsuccessfully contests Knight: he loses and regains the chair
    over successive 2041, 2043 and 2049 changes. The dragon’s stock vote influences
    the 2049 arrangement, with Knight remaining CEO.'
  - In the mid-2050s Knight Errant operations near Chicago involve insect spirits
    and a contested quarantine/Containment Zone. The book describes Ares military
    actions, civilian repercussions, UCAS criticism and a failed or incomplete defense.
    Treat the reported outbreak and magic as invented setting events.
  - In 2057–2058 Ares research and Knight Errant forces engage the fictional astral
    organism labeled Strain III-Beta. The book describes troops announcing the Chicago
    Containment Zone cleared; this is invented supernatural campaign chronology, not
    a real biological or military method.
  - Knight supports the Dunkelzahn/Kyle Haeffner campaign. Following Dunkelzahn’s
    assassination and related riots in 2057, Knight Errant assists the new UCAS president
    Kyle Haeffner; the book compares that response favorably to earlier violence in
    Detroit.
  - Nadja Daviar inherits Gavilan Ventures and Dunkelzahn-linked Ares shares; she
    initially grants Knight voting proxies for two years. Knight uses voting control
    to displace Leonard Aurelius from the chair. Daviar’s reasons are unspecified;
    the book reports a rumor of threats or blackmail as rumor rather than proven conduct.
  - Arthur Vogel, an environmental activist, lawyer and former presidential candidate,
    later joins the Ares board under Gavilan/Dunkelzahn-related influence. Leonard
    Aurelius privately sells his own Ares shares to Vogel. Their combined stock may
    rival Knight’s position but an actual joint voting challenge has not taken place
    in this source period.
  source_specific_distinctions:
  - Do not turn unverified in-world suspicions about Dunkelzahn orchestrating insect
    events into established narrator fact.
  - The source reports Knight’s belief that some fictional magical insects escaped;
    distinguish this opinion from direct proof.
  - The precise beneficiary of the Ares space equipment return agreement is historically
    described in terms of the original United States government; later UCAS officials
    dispute ownership and liabilities.
  - 'The book’s shifting chairman and CEO titles are intentionally distinct: Leonard
    may chair while Knight remains CEO; do not compress them into one corporate office.'
