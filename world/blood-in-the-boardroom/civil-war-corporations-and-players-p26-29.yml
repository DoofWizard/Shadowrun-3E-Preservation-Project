data:
  source_context: Original fiction-only Shadowrun Third Edition-era tabletop source
    Blood in the Boardroom (FASA Corporation, FASA7327, 1999), printed pp26-29/PDF
    pp26-29; original-page imagery independently reviewed; all named subjects and
    events are invented-world game material.
  corporate_profiles:
  - entity: Novatech, Incorporated
    chief: Richard Villiers
    headquarters: Boston, Massachusetts, UCAS
    printed_pages: 26-27
    profile: Combines Villiers holdings and Fuchi’s former Americas assets, emphasizing
      Matrix hardware/software, aerospace from orbital and Boston interests, and smaller
      military/security and magical research divisions; Renraku is identified as a
      principal rival.
  - entity: Renraku Computer Systems
    chief: Inazo Aneki
    headquarters: Chiba, Japan
    printed_pages: '27'
    profile: 'Player section refers readers to Track Two: Neck and Neck for further
      operational detail.'
  - entity: Shiawase Corporation
    chief: Tadashi Shiawase
    headquarters: Osaka, Japan
    printed_pages: 27-29
    profile: Family-controlled multinational with large Asian business interests;
      now includes Fuchi assets via Korin Yamana; the core Shiawase family’s personal
      tensions contrast with its public image.
  people:
  - name: Richard Villiers
    printed_pages: 26-27
    description: Founder/leader of Novatech and former Fuchi principal; the narrator
      notes many suspect his involvement in Kiyoshi Nakatomi’s death but no conclusive
      proof exists.
  - name: Miles Lanier
    printed_pages: '27'
    description: Former head of Fuchi security and friend of Villiers, then Renraku
      director and now director of Novatech security, involved in reorganizing physical
      and Matrix security.
  - name: Samantha Villiers
    printed_pages: 26-27
    description: Richard’s former spouse and ally, formerly of Fuchi Northwest and
      currently vice president of Novatech Northwest; sold her pivotal Fuchi stock
      to Korin Yamana.
  - name: Darren Villiers
    printed_pages: '27'
    description: Richard Villiers’s younger brother, dwarf, Grade 3 magical initiate
      and physical adept; former Fuchi Seattle special-operations vice president and
      currently Novatech Seattle director of special assets; employed covertly on
      family and corporate missions.
  - name: Sadato Shiawase
    printed_pages: '28'
    description: Shiawase board chairman and family head, father of Tadashi, in protracted
      hostility with sister Soko, despite public unity.
  - name: Tadashi Shiawase
    printed_pages: '28'
    description: President and CEO of Shiawase; his father Sadato retains de facto
      family power. Tadashi’s daughter Hitomi has a history of dangerous rebellious
      escapades.
  - name: Korin Yamana
    printed_pages: '28'
    description: After acquiring Fuchi’s remaining holdings, entered Shiawase through
      marriage to Mitsuko and now considers his own retirement and role overseeing
      integration.
  - name: Mitsuko Shiawase-Yamana
    printed_pages: 28-29
    description: Soko Shiawase’s younger daughter, vice president over Shiawase Envirotech’s
      Philippine division, now married to Korin Yamana for corporate reasons. The
      book expressly depicts their private relationship as distant, without romantic
      fondness.
  - name: Shigeru Aoyama
    printed_pages: '29'
    description: Shiawase president of Seattle operations; efficient but not exceptionally
      notable. Unsubstantiated exotic/occult underworld identity rumors are explicitly
      unsupported by evidence.
framing: newsroom_neutral
