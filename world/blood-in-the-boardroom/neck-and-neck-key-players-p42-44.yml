  section: The Players — fictional corporate officers and personalities; not real-world
    biographies.
  figures:
  - name: Inazo Aneki
    roles: Renraku President/CEO; previously founded Renraku Holdings to take Keruba
    details: Narrator portrays him as a former aggressive buyer turned more deliberate
      leader. Never married; regards Renraku as his family; resists resigning even
      when corporate fortunes worsen. Received the Seal of the Green Gloves from Dunkelzahn,
      permitting him or a proxy access to Tibet, and appears to have traveled there
      after taking leave in 2060. His intentions and return remain uncertain.
  - name: Yukikako Watanabe
    roles: Renraku chair of board
    details: A Renraku board veteran who assumed the chair when Aneki concentrated
      on operations; the narrator portrays her as intelligent, confident, ruthless
      and devoted to Renraku, with policy agreement between her and Aneki preventing
      the infighting seen at Fuchi. No competing identity is inferred.
  - name: Haruhiko Nakada
    roles: Renraku chief operating officer and acting CEO during Aneki’s absence
    details: An outgoing yet ambitious executive considered Aneki’s chosen successor.
      Nakada expects Aneki’s leave to be temporary; though willing to take over permanently,
      he avoids a premature coup.
  - name: Miles Lanier
    roles: Former Fuchi head of internal security; former Renraku board member; eventually
      Novatech security leader
    details: Former UCAS Army sniper; became friends with Richard Villiers. Was recruited
      onto Renraku’s board following Dunkelzahn’s bequest; some in-world observers
      suspect an orchestrated deception, but the narrator does not confirm that theory.
      His return to Villiers later fuels rumors.
  - name: Sherman Huang
    roles: Renraku-America division manager and Seattle arcology project executive
      director
    details: Devoted considerable time to Arcology Expert Program development, unlike
      many executives. Closely tied to Inazo Aneki, highly perceptive but often underestimated,
      frequents Seattle while based in Renraku’s New York headquarters after the shutdown.
  - name: Hiroshi Ushida
    roles: Seattle arcology project manager from early 2055, later arcology director
    details: Sent from Chiba to reorganize and accelerate Seattle arcology construction,
      and continued operating it after completion. Among those isolated during the
      shutdown, with Huang counting on Ushida’s second-in-command to restore the situation.
  - name: Shikei Nakatomi
    roles: Former Fuchi Asia head, major Renraku shareholder and board member
    details: Joined Renraku after Fuchi’s collapse, attributes his downfall to Richard
      Villiers though Korin Yamana had earlier deprived him of Fuchi control. Book
      depicts prospective campaign for influence and possible revenge against Villiers
      and Novatech; future coup remains a possibility rather than established result.
  - name: Liam Riley
    roles: CEO of Transys Neuronet
    details: Joined Transys Neuronet in 2053 as HKB-appointed board member, previously
      worked in Data Services, became president in 2058. Market analysts regard him
      as intelligent but retain judgment about the interests of HKB; any future motives
      are analysis, not factual certainty.
