  section: What’s Going Down — Renraku History; printed pp37-39.
  corporate_narrator_history:
  - Renraku Computer Systems officially began in 2029, but its predecessor Keruba
    International originated in Slovenia around the turn of the century; Keruba became
    an arms manufacturer and developed a commercially viable vectored-thrust vehicle.
  - Conflicts in Bosnia-Herzegovina and the Russo-Polish Border Wars supported Keruba’s
    military sales and diversification into heavy industry, telecommunications and
    security-oriented hardware/software; computer divisions began as a small sideline.
  - By 2010, Keruba was a significant extraterritorial power; it competed with BMW
    in military LAVs. Keruba’s 2011 military operation against BMW research divisions
    sparked reciprocal strikes and heavy costs, helping form the impetus for the Inter-Corporate
    Council, predecessor to the Corporate Court.
  - About two years later, Keruba fought a major conflict with ORO (later part of
    Aztechnology); losses weakened both sides and made Keruba a takeover target for
    Ares, BMW and Mitsuhama, among others.
  - Keruba CEO Kerpan Ubavie resisted acquisition but died in a midair collision over
    Dulles International during the Crash of 2029, leaving corporate leadership fractured.
  - Inazo Aneki formed Renraku Holdings with support including a loan from Global
    Financial Services, used Keruba’s valuable taxes and other assets as collateral,
    acquired shareholder holdings and later integrated the business into Renraku with
    headquarters relocated to Chiba, Japan.
  - Aneki initially intended to sell Keruba profitably, but stayed as chief executive;
    early management was fragmented and depended on former Ubavie influence.
  - During the 2030s, Renraku profited from Keruba’s patented high-speed data storage/retrieval
    and fractal-compression designs, which gained licensing income after the Crash,
    while its inherited military businesses remained economically important.
  - By 2038, corporate corruption, internal diversion of profits and loans had left
    Renraku distressed; Aneki initially neglected operational details. Shareholders
    maneuvered to replace him.
  - Aneki resisted an attempted board takeover, removed three threatening directors,
    purged corrupt management and sold unprofitable military subsidiaries to focus
    on computing and corporate loyalty. Yukikako Watanabe took the board chair as
    Aneki assumed day-to-day operations.
  - By 2045, the narrator describes Renraku as stable, more efficient and increasingly
    competitive, though less dominant than other major megacorporations.
