data:
  source_context: Fictional Shadowrun tabletop role-playing game historical source,
    Blood in the Boardroom, FASA Corporation (FASA7327, 1999, original Third Edition-era),
    original printed/PDF pages 75-77; not a real-world report or modernized ruleset.
  section: 'Track Four: Out of the East — The Players, corporate entries'
  eastern_tiger:
    identity: Eastern Tiger Corporation; president/CEO Se-Jong Lee; headquarters Pusan,
      Korea.
    business: Unified Korea’s largest single corporation, built on petrochemical and
      heavy manufacturing interests and expanding since 2050 to Australia, Brunei,
      the Salish-Shidhe Council, Seattle and Hawaii. The source describes diversified
      biotechnology, entertainment, consumer goods and agriculture.
    membership: Nominal PPG member but its executive offers limited cooperation. Its
      Seattle division, under nephew Yong-jo Moon, suffered attacks attributed to
      the Red Rovers gang; Lee refused Moon’s request for added security. The narrator
      says Moon considered seeking outside aid but had not yet acted.
  federated_boeing:
    identity: Federated Boeing; president/CEO Jessica Sirianni; headquarters Seattle,
      UCAS.
    ppg_interest: The source identifies Federated Boeing as an unusually large UCAS
      company interested in PPG membership, apparently to resist takeover by Mitsuhama.
      It operates aerospace facilities across Vladivostok, Malaysia, Indonesia and
      other Pacific locations.
    land_disputes: The narrator reports that the company’s purchases and Pacific Rim
      installations have drawn local opposition, including accusations of exploiting
      land, residents and government authorities. PPG members are divided over accepting
      Federated Boeing.
  kwonsham:
    identity: Kwonsham Industries; president Jae-Myung Kim; headquarters Pyongyang,
      Korea.
    history: Formed in 2006 by corporations that banded together amid Korean reunification
      and buyout activity. The narrator describes it as a major unified Korean employer
      with industrial, electronics and agricultural production.
    intent_and_rumors: Kim joined the PPG hoping to build an international corporation
      and pursue a UCAS transport division. The book labels unproved allegations that
      he met Choson Seoulpa Ring representatives during Seattle trips as rumors.
  monobe:
    identity: Monobe International; president/COO Toshio Mitsukuri; headquarters Matsuyama,
      Japan.
    history: The source calls Monobe a smaller A-rated megacorporation with work in
      biotechnology, firearms, cyberdeck components, travel, genetic engineering and
      communication research.
    coup: In January 2059 Mitsukuri displaced president Sho Kubota through a board
      coup; Kubota departed for Sri Lanka and his private aircraft disappeared. Mitsukuri
      denied involvement, and the narrator distinguishes his denial from the speculation
      surrounding the disappearance.
    ambition: The book says Monobe was gathering businesses Yamatetsu left behind
      and might seek AAA status.
  pacific_prosperity_group:
    identity: Pacific Prosperity Group, chaired by Tzu Cheng, headquartered in the
      Hong Kong Free Enterprise Zone.
    membership: The PPG was a Pacific Rim coalition with a board representative from
      each member and chairman chosen by its board; the book likens it to an earlier
      international trade coalition. Membership privileges include Malaysian Independent
      Bank rates, favored member-company trade and joint research programs.
    growth: The source describes centers of commerce in Hong Kong, Singapore, Vladivostok
      and Vancouver, and notes that Federated Boeing and Lockheed had both petitioned
      for membership; their competitive interests complicated a decision.
  pacific_rim_bank:
    identity: Pacific Rim Bank and Financial Services Corporation, president Endo
      Kyoji, headquartered Tokyo, Japan.
    position: The book describes the largest bank in the Pacific as initially maintaining
      neutrality while Japanese government and megacorporations urged financial pressure
      on PPG members. Some PPG companies shifted assets toward the Malaysian Independent
      Bank; the narrator anticipates that the PRB may later lean toward Japan.
  tan_tien:
    identity: Tan Tien, Inc., president/CEO Sau-kok Chu, headquartered Beijing, Republic
      of China.
    specialty: The source characterizes the smaller corporation as a leading researcher
      in protein storage, cranial cyberdecks and noninvasive neural interfaces; most
      research is licensed to megacorporations.
    takeover_attempts: Fuchi, Renraku and Mitsuhama had attempted takeovers but none
      succeeded in the source’s account. Claims that Lung has an ownership stake or
      has intervened are identified as rumors.
    ppg_and_product: Chu brought Tan Tien into the PPG. Observers suggest its parallel
      multi-user cyberdeck interface might be licensed only to members; the text characterizes
      this as speculation rather than a launched product.
  certainty: Executives and headquarters are labeled as source-period profiles; speculative
    future expansion and third-party rumors are attributed rather than independently
    established.
