  section: Renraku History — A Stroke of Genius, Miles to Go, A Very Bad Year.
  historical_narrator_sequence:
  - In mid-2057, multiple AAA megacorporations experienced blackmail involving a highly
    capable unknown Matrix infiltrator; a Renraku decker identified the source as
    the individual calling himself Leonardo.
  - Leonardo first sought funds for a mysterious Great Work, then provided technological
    breakthroughs to Renraku in exchange for support. The narrator says most other
    corporations did not learn his identity or arrangement.
  - Leonardo-derived Matrix programs, cyberdecks and other research advanced Renraku
    beyond Mitsuhama and threatened Fuchi’s market share. Reported rumors of Renraku
    having its own artificial intelligence are explicitly rumors, not confirmed historical
    explanation.
  - After Dunkelzahn’s death, Miles Lanier—Fuchi Industrial Electronics security head
    and former UCAS Army sniper—received shares and a seat on Renraku’s board under
    Dunkelzahn’s bequest, and left Fuchi for Renraku.
  - Lanier and Fuchi CEO Richard Villiers had been close allies, but their public
    dispute after the bequest ended their friendship. Renraku performed intrusive
    background investigation of Lanier, then found no remaining Fuchi ties; his knowledge
    assisted in recruiting Fuchi subsidiaries and countering Fuchi threats.
  - Fuchi engaged in covert attacks on Lanier, and Renraku’s growth continued; by
    late 2058 Renraku was approaching Fuchi’s second-largest megacorporation position.
  - In June 2059, Fuchi convened a Corporate Court meeting on Zurich-Orbital to allege
    industrial espionage by Renraku involving Lanier. The Court ruling resulted in
    Lanier returning to Fuchi security, resigning his Renraku board position and selling
    Renraku stock to the Zurich-Orbital Gemeinschaft Bank at below-market price.
  - The narrator says the bank’s resale and related market effects damaged Renraku’s
    stock and confidence; Leonardo then disappeared and Renraku lost access to considerable
    associated research, weakening Matrix defenses and raising uncertainty about undiscovered
    data gaps.
  - Renraku gained reparations from Fuchi, with the exact figure withheld, and later
    a second Corporate Court justice, Navroz Chandaria, for Renraku Asia, replacing
    deceased Mitsuhama justice Dosan Aburakoji.
  - The Seattle Renraku arcology shutdown began in December 2059, injured people and
    isolated the structure; the corporation publicly claimed to have regained its
    security systems but continued restricting access. The narrator notes insiders
    were more pessimistic about control and that rivals denied involvement; cause
    remains speculative here.
  - In February 2060, CEO Inazo Aneki took indefinite leave citing personal matters,
    delegated operations to COO Haruhiko Nakada and apparently departed for Tibet.
  - In March 2060, Navroz Chandaria died in a bombing in New Delhi that appeared aimed
    at Jawahar Prasad; in the Court succession Yves Aquillon of Cross Applied Technologies
    briefly replaced Chandaria, followed by Francesco Napoli of Renraku Australasia
    in June.
  - Following Fuchi’s internal collapse in April 2060, Fuchi Asia head Shikei Nakatomi
    offered the Zurich-Orbital Gemeinschaft Bank cash for Miles Lanier’s former Renraku
    shares, won a major Renraku stake and board seat, and brought former Fuchi-controlled
    assets into Renraku.
  - By the beginning of the 2060s, Renraku remained a substantial but wounded megacorporation;
    its relationship with Nakatomi represented both investment and potential renewed
    internal conflict.
  attribution_cautions:
  - Lanier’s possible continued espionage for Fuchi and the exact cause of the Seattle
    arcology shutdown are presented as suspicions, not confirmed facts.
  - The book identifies a suspicious terrorist attack against Chandaria but does not
    assign culpability in this section.
  - The source text mentions Renraku’s financial reparations from Fuchi without giving
    their sum.
