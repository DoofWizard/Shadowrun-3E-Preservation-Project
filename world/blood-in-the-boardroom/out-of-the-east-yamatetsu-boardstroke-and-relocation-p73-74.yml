data:
  source_context: Fictional Shadowrun tabletop role-playing game historical source,
    Blood in the Boardroom, FASA Corporation (FASA7327, 1999, original Third Edition-era),
    original printed/PDF pages 73-74; not a real-world report or modernized ruleset.
  section: 'Track Four: Out of the East — A Board Divided; The Big Move; Fall of the
    Rising Sun'
  policy_divide:
    board: The book describes a conservative Yamatetsu board faction headed by CEO
      Saru Iwano and former chairman Hideo Yoshida resisting metahuman inclusion,
      although some minority shareholders and the free spirit Buttercup supported
      change. In 2056 a reform faction began recording limited victories. Vice president
      Newton Chin, whose younger sister Sophia is a dwarf, became Buttercup’s company
      ally.
    public_vs_private: The narrator distinguishes Yamatetsu’s publicly promoted metahuman-friendly
      reputation from entrenched prejudice in its Japanese leadership and actual promotion
      barriers. The narrator presents explanations involving economic motives and
      unspecified magical influence as competing rumors, then provides the Shibanokuji
      family background.
  family_history:
    tatiana_and_yuri: Tadamako Shibanokuji, overseeing Tsuruga International shipping
      operations in Vladivostok, married port official Tatiana Trigorin. After the
      family returned to Kyoto, their approximately two-year-old son Yuri underwent
      goblinization in 2021. Tadamako sent Yuri and Tatiana back to Russia when Yuri
      was able to travel and later divorced Tatiana. The narrator says he did not
      disclose Yuri’s condition, and the family separation shaped his attitudes.
    secret_heir: The text identifies Yuri as Tadamako’s son. He became estranged from
      his father after the forced move; Buttercup learned of Yuri’s existence and
      arranged to observe him, anticipating his importance to Yamatetsu.
  stroke_and_votes:
    January_2059: On January 7, 2059, Tadamako suffered a disabling left-brain stroke.
      His living will assigned control of his shares to Saru Iwano while he was alive
      but incapacitated; Iwano and allies tried to reassert a conservative board policy.
    succession: Tadamako died about six weeks later. The source states his shares
      passed to Yuri, who returned to Kyoto, did not sell, and sought leadership.
      Yuri won voting support from his mother’s block of shares, Buttercup’s purchase
      of minority stakes, and allies including Newton Chin.
    May_3: On May 3, 2059, Yuri convened an emergency board meeting and proposed moving
      Yamatetsu headquarters from Kyoto to Vladivostok. Buttercup’s speech and proxies
      from many minority shareholders enabled the motion to pass by greater than 50
      percent of the voting shares.
  corporate_repercussions:
    buttercup_purchase: Backed by the nascent PPG and Pacific Prosperity Group resources,
      Buttercup bought publicly traded Yamatetsu shares, gaining personal control
      of about 37 percent. With Yuri she controlled the corporation’s voting direction,
      while Saru Iwano remained president and CEO.
    relocation: Yamatetsu began moving headquarters and business functions to Vladivostok,
      while some departments shifted to Hong Kong, Singapore, Taipei and other Pacific
      sites.
    corporate_court: Following Fuchi justice David Hague’s death in July 2059, the
      Corporate Court selected Li Feng, a Wuxing attorney, for the vacant seat after
      considering rival expansion interests. The book states Wuxing’s resulting Corporate
      Court representation elevated it to AAA status.
    japan_response: The narrator describes Japan’s economic and political backlash,
      including a sharp fall in Yamatetsu share prices and rising racial hostility
      after the relocation. The book describes broader occupation-resistance mobilization
      as anticipated but not materializing in late 2059 and early 2060.
  certainty: Described events and temporal sequence follow the fictional source narrator.
    Claims about motives, forthcoming outcomes and conspiratorial magical influence
    remain explicitly uncertain.
