data:
  source_context: Published fictional Shadowrun tabletop RPG Blood in the Boardroom,
    FASA Corporation, FASA7327 (1999), original Third Edition-era publication, printed
    pp8–9/PDF8–9; this is the book narrator’s background summary, distinct from optional
    scenario branches and from the detailed p19 timeline.
  overview: The source frames the fictional Sixth World corporate balance as destabilized
    after President Dunkelzahn’s assassination in August 2057 and the subsequent distribution
    of the dragon’s will. Rival megacorporations maneuver across a roughly two-year
    period.
  fuchi_renraku:
    initial_shift: Dunkelzahn bequeaths Renraku stock to Miles Lanier, then head of
      security at Fuchi Industrial Electronics and a confidant of Richard Villiers;
      Lanier takes a Renraku board seat.
    three_fuchi_ceos: The book identifies Richard Villiers (Fuchi Americas), Shikei
      Nakatomi (Fuchi Asia) and Korin Yamana (Fuchi Pan-Europa) as the three competing
      Fuchi principals; their rivalry had previously been constrained by mutual need.
    internal_war: Villiers quietly and gradually repurchases Fuchi Americas companies
      through a newly organized corporation with himself as head. His rivals contest
      control, corporate hostility escalates, and Lanier and Villiers conduct a two-pronged
      operation that damages Fuchi and Renraku.
    outcome: Renraku’s vulnerabilities force it to seek outside support. The source
      says the unexpected arrival of Shikei Nakatomi’s help did not undo the damage
      or rapidly heal the internal conflict.
  ares_cross:
    board_changes: Arthur Vogel, an eco-lawyer and prior presidential candidate, inherits
      Ares shares and a seat. Damien Knight temporarily gains Nadja Daviar’s Gavin
      Ventures voting rights; both oppose Leonard Aurelius in the Ares board struggle.
    outcome: Leonard Aurelius sells his Ares stake to Arthur Vogel and moves to Cross
      Applied Technologies of Quebec, a former lesser corporation founded and run
      by Dr. Lucien Cross, previously a colleague and adversary of Damien Knight.
    distinction: The narration says Ares remains intact outwardly, even while Knight
      faces newly intensified competition and internal threats.
  yamatetsu_wuxing:
    wuxing: Wu Lung-Wai’s Wuxing Incorporated initially fails to expand rapidly despite
      Dunkelzahn-related opportunities, then benefits from Pacific Prosperity Group,
      formed with backing and alliances linked to Yamatetsu and others.
    yamatetsu: The source says the Big Eight corporation Yamatetsu shifts its headquarters
      to Vladivostok, Russia, and that its Pacific Prosperity Group backing changes
      corporate competition in the Far East.
    uncertainty: The narrator describes future possible advantages and reactions as
      projections, not completed facts.
  player_characters: The book explicitly proposes potential shadowrunner involvement
    on multiple sides; their participation, alliances and outcomes depend on the table’s
    optional campaign, not a predetermined historical claim.
