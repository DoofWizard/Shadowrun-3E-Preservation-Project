data:
  source_context: Fictional Shadowrun tabletop-RPG sourcebook Blood in the Boardroom,
    FASA Corporation, 1999, FASA7327, original Third Edition-era, printed pp57-58/PDF
    pp57-58.
  section: Cross Applied Technologies History
  narrator_chronology:
  - Lucien Cross is introduced as a Quebec-based programmer formerly associated with
    the Acquisition Technologies intelligence division, where he worked with the future
    Damien Knight, using the alias David Gavilan.
  - Knight recruits Cross to design and assist with the 2033 Ares Nanosecond Buyout;
    Cross is paid for his work and saves records detailing the scheme and Gavilan’s
    role as contingency leverage. The book attributes these facts to setting narration,
    not public proof of a real-world case.
  - Cross subsequently builds Cross Applied Technologies from acquisitions of smaller
    Canadian technology companies, eventually assembling Cross Matrix Technologies
    and the Seraphim intelligence network.
  - Dunkelzahn backs Cross’s work with investment and protection, but the dragon’s
    full involvement is initially concealed. The fictional source says Cross’s growth
    benefits from Quebec’s tax and commercial conditions, while the Seraphim contribute
    corporate intelligence and counterintelligence.
  - By 2050 CATCo’s reach includes cybersecurity and biomedical development, consumer
    electronics, entertainment and expanded Matrix systems; by 2052 CATCo is a significant
    third-tier corporation with ambitions toward the second tier and an eventual AAA
    status.
  - Leonard Aurelius becomes a minority investor in CATCo after selling all of his
    Ares shares privately to Arthur Vogel. Cross retains majority ownership; Aurelius
    contributes resources and knowledge of Damien Knight.
  - In 2053 Cross Biomedical buys Bioleve of Buffalo, New York. The text states Bioleve
    is covertly held by Damien Knight through corporate shells, leading to new conflict
    when Cross refuses to sell or compensate Knight.
  - Knight commissions an attempt on Cross’s life; a Seraphim guard saves him. Dunkelzahn
    then warns Knight against pursuing Cross further. The companies continue extended
    espionage, competition, legal maneuvering and business rivalry.
  - After Dunkelzahn’s death, the source describes multiple new attacks or near-fatal
    incidents targeting Lucien Cross; no individual attacker has been independently
    proven in the passage and the wording is careful to distinguish Cross’s suspicions.
  editorial_qualifiers: A story account of fictional corporate history. Distinguish
    private insider claims, suspicion that Knight arranged later attempts, narrator-confirmed
    2053 incident and source-era conditions. No operational real-world wrongdoing
    advice is given.
