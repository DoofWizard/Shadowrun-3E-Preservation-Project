data:
  source_context: Original fiction-only Shadowrun Third Edition-era tabletop source
    Blood in the Boardroom (FASA Corporation, FASA7327, 1999), printed pp24-26/PDF
    pp24-26; original-page imagery independently reviewed; all named subjects and
    events are invented-world game material.
  chronology:
  - date: '2057'
    printed_pages: 24-25
    fact: Dunkelzahn’s will left 4 million Renraku shares to Miles Lanier and 100,000
      Fuchi shares to Richard Villiers; Lanier’s departure for Renraku aggravated
      the long-standing factional balance.
  - date: '2058'
    printed_pages: '25'
    fact: Renraku software resembling Fuchi prototypes exacerbated tensions. Yamana
      and Nakatomi factions sought to weaken Villiers through stock maneuvers and
      staff purges while Villiers developed independent Boston corporate assets.
  - date: early 2059
    printed_pages: '25'
    fact: The book recounts disputed Philippines voting results involving Carlos Consuni
      and the LCVP, accusations against Fuchi election-equipment systems, attempted
      re-voting, and attacks on Fuchi facilities. Opposition fraud allegations and
      sponsorship accusations remain attributed.
  - date: mid 2059
    printed_pages: '25'
    fact: The Corporate Court ordered Miles Lanier to sell his Renraku shares to Zurich-Orbital
      Gemeinschaft Bank below market value, resign from Renraku’s board and submit
      to Fuchi security; it also ordered Fuchi to pay Renraku undisclosed compensation.
      The reported deliberations remain private.
  - date: July 2059
    printed_pages: '25'
    fact: Flight 1118 crashed near Redmond after missing Sea-Tac, killing 153 on board
      and 51 on the ground and injuring many others. David Hague, a Fuchi-associated
      Court justice and Yamana ally, was reported on board but his body was missing;
      Lynn Osborne was later left as Fuchi’s sole Court representative. Villiers was
      suspected by some of involvement, but the book states insufficient evidence
      for arrests.
  - date: October 2059
    printed_pages: 25-26
    fact: Villiers incorporated Novatech, having consolidated most Fuchi Americas
      holdings, and sold Fuchi shares; Nakatomi and Yamana competed for a controlling
      majority as Fuchi’s stock price rose.
  - date: January 2060
    printed_pages: '26'
    fact: With Korin Yamana and Shikei Nakatomi each holding roughly 49 percent and
      Samantha Villiers holding the remaining roughly 2 percent, Samantha sold her
      holding to Yamana in return for a one-year mutual noninterference truce with
      Novatech.
  - date: April 2060
    printed_pages: '26'
    fact: Shikei Nakatomi bought four million Renraku shares and Fuchi Asia formally
      joined Renraku’s corporate empire. Korin Yamana retained Fuchi Pan-Europa, which
      became much smaller than Fuchi at its height.
  - date: July 28, 2060
    printed_pages: '26'
    fact: Korin Yamana arranged to sell remaining Fuchi to Shiawase; his marriage
      to Mitsuko Shiawase was part of the deal, which also brought Yamana a Shiawase
      stake and board seat. The source states Fuchi Industrial Electronics officially
      ceased to exist July 28, 2060.
  attribution_rule: Distinguish narrated corporate chronology from the source’s expressly
    unproved claims about suspected sabotage, election misconduct, and involvement
    in the Flight 1118 crash.
framing: newsroom_neutral
