headline: 'Published fictional Shadowrun tabletop RPG Blood in the Boardroom, FASA
  Corporation, FASA7327 (1999), original Third Edition-era publication — printed pp19/PDF
  pp19: original 32-entry corporate war timeline from 2057 through 2060'
summary: Archival third-person, source-reviewed record of original 32-entry corporate
  war timeline from 2057 through 2060, original fictional Shadowrun source source.fasa-7327,
  published by FASA Corporation in Blood in the Boardroom (FASA7327, 1999), Third
  Edition-era; printed pp19/PDF pp19.
data:
  source_context: Published fictional Shadowrun tabletop RPG Blood in the Boardroom,
    FASA Corporation, FASA7327 (1999), original Third Edition-era publication, printed
    p19/PDF19, original boxed CORPORATE WAR TIMELINE 2057–2060; these dates are in-world
    historical assertions presented by the published narrator and distinct from optional
    GM outcomes.
  date_system: YYYY-MM-DD; dates correspond exactly to printed dated entries and span
    August 2057–July 2060.
  dated_events:
  - date: '2057-08-09'
    source_event: Dunkelzahn is assassinated on the night of his inauguration as President
      of the United Canadian and American States.
  - date: '2057-08-15'
    source_event: Miles Lanier leaves Fuchi to join Renraku Computer Systems’ board
      of directors.
  - date: '2057-08-20'
    source_event: Arthur Vogel announces his acceptance of the presidency of Sierra,
      Inc.
  - date: '2057-08-22'
    source_event: Nadja Daviar grants Damien Knight voting control over Gavin Ventures’
      Ares Macrotechnology stock for two years.
  - date: '2057-09-12'
    source_event: Wu Lung-Wai announces major expansion plans for Wuxing, Inc.
  - date: '2058-02-22'
    source_event: Ares implements Operation Extermination, a physical and magical
      assault on insect spirits in Chicago’s Containment Zone; the Chicago quarantine
      is officially lifted.
  - date: '2059-01-07'
    source_event: Yamatetsu board chairman Tadamako Shibanokuji has a debilitating
      stroke; control of his shares goes to Yamatetsu CEO Saru Iwano.
  - date: '2059-02-22'
    source_event: Tadamako Shibanokuji dies in a Kyoto hospital; stock control reverts
      to his son Yuri Shibanokuji.
  - date: '2059-05-05'
    source_event: Yamatetsu announces relocation of its corporate headquarters to
      Vladivostok, Russia.
  - date: '2059-05-16'
    source_event: Mitsuhama Corporate Court representative Dosan Aburakoji dies by
      suicide at his home in Kyoto.
  - date: '2059-06-06'
    source_event: Fuchi brings Corporate Court action against Renraku, alleging Miles
      Lanier used insider knowledge to steal Fuchi trade secrets; charges are dropped
      within 24 hours. Lanier leaves Renraku and sells four million Renraku shares
      to the Zurich-Orbital Gemeinschaft Bank.
  - date: '2059-06-16'
    source_event: Renraku representative Navroz Chandaria is named to the Corporate
      Court seat vacated by Aburakoji’s death.
  - date: '2059-07-08'
    source_event: The Pacific Prosperity Group officially forms.
  - date: '2059-07-11'
    source_event: Flight 1118 from Tokyo crashes in Seattle’s Redmond Barrens on the
      Salish-Shidhe border; the book reports nearly 200 deaths, hundreds injured,
      and fires beyond control throughout the district for more than 24 hours.
  - date: '2059-07-19'
    source_event: Fuchi Corporate Court representative David Hague is found dead in
      Redmond, Seattle.
  - date: '2059-08-15'
    source_event: Wuxing, Inc.’s Li Feng takes the Corporate Court seat left vacant
      by Hague’s death.
  - date: '2059-08-22'
    source_event: Nadja Daviar regains control of Ares shares owned by Gavin Ventures.
  - date: '2059-09-29'
    source_event: 'White Monday: the Tokyo Stock Exchange experiences its largest
      single-day fall in 70 years.'
  - date: '2059-10-06'
    source_event: Fuchi’s Richard Villiers announces formation of Novatech, Inc.,
      which continues acquiring significant parts of Fuchi; Miles Lanier becomes Novatech
      security director.
  - date: '2059-10-20'
    source_event: Leonard Aurelius sells his Ares shares to Arthur Vogel; Vogel resigns
      as Sierra, Inc. president and Gary Grey succeeds him.
  - date: '2059-10-27'
    source_event: Leonard Aurelius joins the board of Cross Applied Technologies.
  - date: '2059-12-15'
    source_event: Anna Villalobos replaces Domingo Chavez as Aztechnology’s Corporate
      Court representative.
  - date: '2059-12-19'
    source_event: The Renraku arcology closes to visitors indefinitely because of
      computer-system problems, as described in the timeline.
  - date: '2060-02-03'
    source_event: Renraku CEO Inazo Aneki begins indefinite leave; Haruhiko Nakada
      assumes duties as interim CEO.
  - date: '2060-03-19'
    source_event: An unidentified-origin virus attacks Seattle’s Matrix RTG; persons
      accessing it suffer memory loss, psychotic episodes or brain death. The attack
      lasts almost ten minutes and ends without known explanation or aftereffects.
  - date: '2060-03-26'
    source_event: Renraku Corporate Court representative Navroz Chandaria dies in
      a bombing in New Delhi, identified by the fictional timeline as terrorism.
  - date: '2060-04-05'
    source_event: Fuchi’s Shikei Nakatomi purchases four million Renraku shares from
      the Zurich-Orbital Gemeinschaft Bank; Renraku begins acquiring large parts of
      Fuchi.
  - date: '2060-04-15'
    source_event: Cross Applied Technologies’ Yves Aquillon takes the Court seat vacated
      by Chandaria’s death.
  - date: '2060-06-07'
    source_event: Fuchi’s Korin Yamana announces his marriage to Mitsuko Shiawase
      of Shiawase Envirotech.
  - date: '2060-06-14'
    source_event: Shiawase Corporation purchases all remaining Fuchi Industrial Electronics
      assets; Korin Yamana accepts a Shiawase board position.
  - date: '2060-06-15'
    source_event: Neil Benson replaces Francesco Napoli as Renraku’s Corporate Court
      representative.
  - date: '2060-07-28'
    source_event: Fuchi Industrial Electronics is officially dissolved.
  source_status: The preceding printed p18 explains this is the authorial background
    timeline for the published game universe; a particular gamemaster may adapt events
    in an optional table campaign.
framing: newsroom_neutral
