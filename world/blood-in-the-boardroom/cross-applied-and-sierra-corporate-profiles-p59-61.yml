data:
  source_context: Fictional Shadowrun Third Edition-era tabletop role-playing game source, Blood in the
    Boardroom (FASA Corporation, 1999, FASA7327); independently reviewed original printed/PDF page images;
    historical edition, no inferred conversion. Printed pages 59-61 / PDF pages 59-61.
  record_scope: Corporate and organizational source-period profiles for Cross Applied Technologies and
    Sierra, and named executives
  section: 'Track Three: Cross Purposes — corporate and character profiles, printed pp59–61'
  cross_applied_technologies:
    identity: Cross Applied Technologies, Inc. (CATCO); headquarters Montreal, Quebec; President/CEO Lucien
      Cross.
    business: The source characterizes CATCO as Quebec’s largest corporation and a leader in Matrix technology,
      with a provincial home-market advantage and imported-product tariffs; it sells software, medical
      products, cyberware, bioware, electronics, consumer products and entertainment media. Cross Matrix
      Technologies is an important division; Cross Advanced Electronics operates in Seattle.
    lucien_cross: Lucien Cross holds weekly teleconferences with division heads, visits major CATCO sites
      regularly, is described as demanding and attentive to detail, and is a skilled programmer and systems
      designer. He is approaching seventy in the source-period profile.
    leonard_aurelius: Leonard Aurelius is Nicholas Aurelius’s son; after Damien Knight’s takeover struggle
      at Ares, he joined his father’s rival company CATCO. The source describes his ambitions, dissatisfaction
      with his partial Ares takeover, break with his father’s legacy and willingness to challenge Ares.
      He lost his Ares board control to Knight; his youngest daughter remains at Ares.
    bernard_cross: Lucien Cross’s nephew Bernard was running Seattle-based Cross Advanced Electronics
      in 2056. He misconstrued a Mitsuhama takeover attempt; Lucien’s Seraphim intervened and saved the
      division. Bernard was fired over that error, but later was recalled when his managerial abilities
      became valuable. He has a difficult working relationship with Jezebel Surrateau.
    jezebel_surrateau: Jezebel Surrateau heads the Seattle branch of the Seraphim and, following her arrival,
      effectively directs Cross Advanced Electronics in Seattle. She is a physical adept and previously
      acted as one of Lucien Cross’s field agents; she specializes in investigation, infiltration and
      theft in the fictional setting. During an attack in 2053 she was injured and became paralyzed from
      the waist down. She refused invasive surgery or cyberware and spent eight years in a high-tech wheelchair
      while pursuing recovery of adept abilities. Her Seraphim took control of part of Dunkelzahn’s prior
      contacts network. CATCO’s conflict with Ares and Surrateau’s opposition to Ares executive Karen
      King are described as ongoing.
  karen_king: Karen King is supervising vice president of Ares Seattle’s Consumer Electronics division,
    which she has headed for more than ten years; Knight has confidence in her but rarely visits. Her
    current attention is on Cross Advanced Electronics (CAE), a Seattle-based CATCO division, creating
    a contest of interests between that company and Ares. The source states she wants to win control of
    CAE from inexperienced Bernard Cross and is concerned that its conflict with Ares could threaten her
    advancement.
  sierra: Sierra, Inc.; president Gary Grey; headquarters Sacramento, California Free State. The historical
    environmental organization promotes petitions, lawsuits, peaceful resistance and fundraising. Arthur
    Vogel, a prior Sierra leader, is now associated with Ares, having acquired Ares Macrotechnology shares
    through Dunkelzahn’s estate. After Vogel became a majority shareholder in Ares, his former running
    mate Gary Grey became Sierra president. Membership remained around its earlier level but Sierra increased
    public demonstrations, according to the book narrator.
  attribution: These are historical sourcebook narrator profiles; claimed future plans, motives and rumors
    about Vogel, Knight, Leonard Aurelius and the organizations are not asserted as independent completed
    events.
