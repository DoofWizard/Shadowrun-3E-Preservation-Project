  record_scope: Pacific Prosperity Group formation, Wuxing history and independent
    Pacific megacorporations
  section: 'Track Four: Out of the East — What’s Going Down and Pacific Prosperity
    Group History, pp71-72'
  regional_balance: The book narrator says five of the Big Eight at this publication-era
    moment—Fuchi, Mitsuhama, Renraku, Shiawase and Yamatetsu—were based in Japan,
    with broad commercial domination of the Pacific Rim. Wuxing of Hong Kong and Tan
    Tien of China were among important non-Japanese exceptions. The Pacific Prosperity
    Group (PPG) emerged to contest that balance.
  wuxing_origins: Wu Kuan-Lai, Wuxing founder, was influential during Hong Kong independence
    efforts in 2015 and the formation of the Hong Kong Corporate Directorate, which
    became the government of the Hong Kong Free Enterprise Zone. Wuxing later faced
    Japanese rivals’ advantages in regional trade; Wu sought a cooperative non-Japanese
    alliance.
  succession: The Crash of 2029 and economic disruption frustrated that ambition;
    Wu Kuan-Lai died in 2039, and his son and successor Wu Lung-Wai renewed the effort.
    Dunkelzahn’s bequest gave Wuxing capital, but the book says Wuxing still lacked
    the power of the biggest individual Japanese AAA corporations.
  2059_foundation: The book narrates that the free spirit Buttercup approached prospective
    members in January 2059 shortly after Tadamako Shibanokuji’s stroke. Yamatetsu’s
    proposed move to Vladivostok helped attract partners. On July 8, 2059 the PPG
    formally included Yamatetsu, Wuxing, Tan Tien, Eastern Tiger, Kwonsham Industries,
    Malaysian Independent Bank, Shibata Construction and Engineering, Lami Look Pagkaon
    and PacRim Communications Unlimited; in September Universal Omnitech and cheatronics
    joined alongside roughly a dozen smaller businesses.
  group_scope: The book explicitly describes the PPG as a corporate consortium and
    economic challenge to Japanese regional power, not necessarily a sovereign government
    or a single merged megacorporation.
