data:
  source_context: Fictional Shadowrun tabletop role-playing game supplement Blood
    in the Boardroom (FASA Corporation, FASA7327, 1999); historical Third Edition-era
    publication; source-original PDF SHA256 8c32ca7d540110deea9acf8714dc7fb2b92f742beeca004489cd0dc1a472d5e4;
    printed pp71-72/PDF pp71-72. Distinguish narrator, in-world reports, and optional
