data:
  source_context: Original fiction-only Shadowrun Third Edition-era tabletop source
    Blood in the Boardroom (FASA Corporation, FASA7327, 1999), printed pp22-24/PDF
    pp22-24; original-page imagery independently reviewed; all named subjects and
    events are invented-world game material.
  opening_history:
  - printed_pages: 22-23
    fact: The source traces Fuchi Industrial Electronics to Tokyo in 2011, with Korin
      Yamana’s Yamana Electronics and Kiyoshi Nakatomi’s Dekita Industries as important
      precursors; the two groups merged in 2017.
  - printed_pages: '23'
    fact: As the Pacific Rim Bank attempted a takeover of Dekita, Yamana bought 49
      percent of Dekita shares to protect it, angering Nakatomi but strengthening
      their long-running business partnership.
  - printed_pages: '23'
    fact: Fuchi expanded internationally into the United States, Canada, Hawai’i,
      Australia and Hong Kong, and developed early cyberterminal technology with Chobetsu
      intelligence-agency funding.
  - printed_pages: '23'
    fact: Matrix Systems of Boston was established by Ken Roper and Michael Eld, who
      demonstrated a prototype cyberdeck in 2033 and developed the Portal deck in
      early 2034.
  - printed_pages: '23'
    fact: Richard Villiers secured a 49 percent stake in Matrix Systems after its
      founders declined an outright sale and accepted investment.
  - printed_pages: '23'
    fact: Roper’s fatal electrocution, Eld’s subsequent fatal vehicle collision, the
      deletion of Matrix Systems mainframe data and disappearance of remaining hardware
      led to suspicions; the book reports no formal accusations and describes the
      contemporary UCAS-suppression explanation as a widespread belief, not proven
      fact.
  - printed_pages: 23-24
    fact: Villiers bought the surviving Matrix Systems assets after receivership and
      offered Fuchi acquired backup tapes and several Portal cyberdecks in exchange
      for a one-third Fuchi ownership interest and influence over future American
      acquisitions.
  - printed_pages: '24'
    fact: The book says Nakatomi initially opposed Villiers’s entry and used his Fuchi
      voting stake, but after Kiyoshi Nakatomi was killed, his son Shikei Nakatomi
      accepted Villiers’s agreement.
  - printed_pages: '24'
    fact: The Fuchi CDT-1000 commercial cyberdeck released in 2036; Villiers later
      acquired JRJ International in 2038 and folded it into Fuchi Americas, strengthening
      Fuchi’s Corporate Court influence.
  attribution_rule: Speculation and reported suspicions about past deaths, government
    action and motive must not be represented as independently demonstrated historical
    facts.
framing: newsroom_neutral
