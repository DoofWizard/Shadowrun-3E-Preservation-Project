data:
  source_context: Fictional Shadowrun tabletop RPG source Blood in the Boardroom (FASA Corporation, FASA7327,
    1999), original Third Edition-era publication; printed pp37-39/PDF pp37-39; original page imagery
    independently inspected and claims source-attributed.
  section: What’s Going Down — Renraku History; in-book narrator history, not forum rumor.
  events:
  - period: near turn of 21st century
    printed_page: 37
    fact: Keruba International is founded in Slovenia; it grows from military/manufacturing and commercially
      viable vectored-thrust vehicles into heavy industry, global telecommunications, and security-oriented
      computer hardware and software.
  - year: 2010
    printed_page: 37
    fact: Keruba becomes a major extraterritorial corporate power, following Shiawase’s lead.
  - year: 2011
    printed_page: 37
    fact: Competition with BMW in military light armored vehicles produces a violent clash and reciprocal
      retaliation; the source links such costly conflicts to the development of the Inter-Corporate Council.
  - year: 2013
    printed_page: 37
    fact: Keruba and ORO (a predecessor of Aztechnology) clash in an extended corporate confrontation;
      Keruba’s military and financial condition deteriorates and other firms begin evaluating a takeover.
  - year: 2029
    printed_pages: 37-38
    fact: During the Crash of 2029, Keruba CEO Kerpan Ubavie dies in a midair collision near Dulles International,
      leaving the organization without his centralized leadership.
  - period: after the Crash of 2029
    printed_page: 38
    fact: Inazo Aneki, a corporate raider from Chiba, organizes Renraku Holdings, obtains a major loan
      from Global Financial Services, acquires Keruba from its shareholders, and begins reorganizing it
      under the Renraku identity with headquarters in Chiba, Japan.
  - period: 2030s
    printed_pages: 38-39
    fact: Renraku benefits from previously developed Keruba data storage and compression technologies
      after the Crash, licensing improved Matrix applications. Military subsidiaries remain a major business
      while affiliated advisers and shareholders exert costly influence.
  - year: 2038
    printed_page: 39
    fact: Persistent executive corruption, internal instability and debt lead three major shareholders
      to seek to remove Aneki. Aneki instead outmaneuvers the attempted board coup and purges management;
      Yukiko Watanabe becomes chairman while Aneki concentrates on corporate operations.
  - year: 2045
    printed_page: 39
    fact: Renraku has restructured into a smaller, more efficient, relatively stable corporation focused
      on computer hardware, software and services while retaining significant military heritage.
  distinctions: The source uses historical corporate characterization, not real-world claims; exact years
    and named individuals retained. Earlier corruption and the counter-coup are narrated history, not
    optional player outcomes.
