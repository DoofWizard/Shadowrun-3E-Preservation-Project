  section: The Players — corporate business profiles and leaders; original fictional
    game world.
  corporations:
  - name: Fuchi Industrial Electronics
    top_office: Tokyo, Japan
    leaders: Richard Villiers through October 2059; Korin Yamana from at least October
      2059 to 28 July 2060
    position: Fuchi was the second-largest megacorporation in 2057 but had fragmented
      into three effective independent operations before disappearing by mid-2060.
      Villiers-led assets became Novatech; Yamana-side technology interests with Shiawase
      remained; residual cybernetic and military/security businesses divided among
      other firms. The source directs further detail to Track One.
  - name: Renraku Computer Systems
    top_office: Chiba, Japan
    leaders: President/CEO Inazo Aneki (with indefinite leave beginning February 2060);
      COO Haruhiko Nakada operates in his absence
    position: Renraku became a formidable AAA Matrix technology competitor after 2057,
      gained resources from the Fuchi Asia acquisition, and faced new financial, public-relations
      and security uncertainty following the Seattle arcology shutdown.
  - name: Transys Neuronet
    top_office: Edinburgh, Scotsprawl
    leaders: President/CEO Liam Riley
    position: UK-based AA corporation developing Matrix, cyberware and bioware. Backing
      includes the Hildebrandt-Kleinfort-Bernal financial empire and Welsh dragon
      Celedyr. Its Caerleon, Wales research facility supports breakthroughs; its current
      research emphasizes viable Matrix links with paranormal entities rather than
      direct competition with Renraku’s Leonardo-derived development.
