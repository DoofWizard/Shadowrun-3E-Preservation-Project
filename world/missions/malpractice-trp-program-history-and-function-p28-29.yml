  topic: Temporary Response Personnel program for the fictional medical-response corporation
    DocWagon
  publication_history: The original game source describes increased urban danger and
    heightened demand for DocWagon clients after the 2056 election. Responding to
    a shortage of experienced rescue staff, DocWagon establishes TRP in late August
    2057 on a trial basis, with an August 2058 board decision pending.
  recruitment_and_training: The TRP program draws recruits from personal security,
    rudimentary paramedic training, and piloting. A three-week crash course precedes
    assignment to High Threat Response teams. Each TRP serves with a particular HTR
    team for two weeks, joining existing teams as needed.
  employer_policy_and_controversy: Medical staff criticize the trial for recruiting
    mercenaries and for comparatively less stringent background checks than midlevel
    government employees. The text makes these fictional in-world organizational objections,
    not independent real-world misconduct allegations.
  duties: TRPs protect paramedics and clients, provide cover, sometimes serve as a
    diversion, and are expected to have enough Biotech Skill to render immediate emergency
    aid under game conditions.
  time_marker: The book describes conditions as of the fictional 2057 period; future
    success and permanent adoption are not established.
