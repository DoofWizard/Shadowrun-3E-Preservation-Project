data:
  publication_context: 'Fictional tabletop RPG archival source: Missions, FASA Corporation,
    copyright 1996, FASA7325, original Second Edition, source.fasa-7325, printed pp12,13,14,15/PDF
    pp13,14,15,16.'
  source_review_scope: Statements below report this fictional published source; scenario
    options are hypothetical game-master branches, not historical assertions or real-world
    advice.
  original_setting: The fictional MindSound Music shop is presented as the public-facing
    entrance to Dr. Cuca’s concealed medical facility. The neighboring Kennedy’s Cheap
    Electronics and Cafe do Amazonia premises are also Renraku project businesses
    connected to the same underground complex, rather than independently unrelated
    storefronts.
  receptionist: Lindy is the visibly tattooed and pierced elf clerk at MindSound Music.
    The narrator identifies him as an active Renraku agent who screens potential clinic
    patients and has advanced combat-oriented implants; the characters initially need
    not know his actual employer.
  hidden_project: Renraku’s larger facility contains medical rooms and research, monitoring
    and command systems supporting involuntary Futuremen conditioning. The three connected
    street businesses permit discreet in-world transfers of staff and equipment. Some
    employees of the adjacent businesses are likewise Renraku agents.
  cuca_conditional_behavior: When Cuca does not know that the characters are Lone
    Star officers, he presents a street doctor persona and shows only limited clinic
    rooms. If he knows but they continue using a cover identity, he performs heightened
    scrutiny. If Tanner accompanies the team, Marcus Powell can issue commands through
    Tanner’s implanted radio; Cuca attempts to induce an encounter with the Futuremen.
    These are conditional adventure branches and do not establish a single inevitable
    outcome.
  monitoring_and_agency: The research personnel observe patients through one-way windows
    and examine induced command responses. Four beds in the recovery room have specialized
    simsense equipment intended for involuntary conditioning, distinct from consensual
    recreation. The game-master source identifies the controlling implants as concealed
    unknown-purpose devices; Cuca may tell characters the equipment assists recovery,
    a potentially deceptive in-world claim.
  facility_management: Marcus Powell is the Renraku project manager and usually works
    off-site with corporate executives. Dr. Cuca nominally runs day-to-day operations.
    The source describes Powell as having ambitions for corporate advancement; this
    is a narrative motive rather than proof about real people.
  room_functions:
    '1': Surgery room with two operating tables and medical equipment.
    1A: Smaller medical supply room with headware radios and concealed behavior-control
      devices.
    '2': Four-bed recovery area with specialized simsense player installations.
    '3': Observation rooms with one-way viewing windows and monitored recovery rooms.
    '4': Dr. Cuca’s office with medical charts and a terminal linked to the fictional
      Matrix host.
    '5': Ready Room for project security guards.
    '6': Powell’s office with a network-connected terminal.
    '7': Two disguised storage-room entrances beneath adjacent shops.
    '8': Separate guard room.
    '9': Command Center containing monitoring systems and staff.
  workforce: The Command Center usually includes twenty or so noncombat scientists,
    support staff and technicians beyond its security personnel; these are fictional
    NPC population notes.
