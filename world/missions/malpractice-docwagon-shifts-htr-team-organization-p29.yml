data:
  publication_context: 'Fictional tabletop-RPG publication: Missions (FASA7325), FASA
    Corporation (1996), original Shadowrun Second Edition tabletop RPG adventure collection;
    publisher FASA Corporation; catalog/source source.fasa-7325; printed pp29/PDF30.'
  routine_shift: The source describes ordinary DocWagon emergency team shifts as four
    weeks on and six weeks off. While on shift, team members live in company facilities
    and remain on 24-hour call.
  high_threat_response_rotation: High Threat Response teams spend only two weeks on
    EMT duty. Their remaining two weeks are spent training HTR candidates, evaluating
    Standard Response Teams for HTR promotion, filling in for SRTs, or doing clinic
    duty.
  team_lifecycle: The source says teams often disband after a member departs or receives
    promotion; teammates may be reassigned to new teams or other divisions.
  territory: Each HTR gets a defined territory on its first duty day. HTR assigned
    zones are larger than those for standard teams; Expert Teams have no fixed territory,
    provide backup and cross-clinic coverage.
  expert_rotation: Any number of Expert Teams might be on duty. The typical HTR team
    has Expert duty once every four shifts. The fictional Malpractice adventure opens
    on day one of Expert Team Three’s shift.
  source_frame: Historical 1996 Second Edition invented-world description; not actual
    medical shift guidance.
