data:
  publication_context: 'Fictional tabletop RPG archival source: Missions, FASA Corporation,
    copyright 1996, FASA7325, original Second Edition, source.fasa-7325, printed pp5,6/PDF
    pp6,7.'
  source_review_scope: Statements below report this fictional published source; scenario
    options are hypothetical game-master branches, not historical assertions or real-world
    advice.
  scene_frame: The Shooting Star prologue is a fictional narration of Sergeant Franco
    Tanner undergoing a manipulated clinical procedure and a dissociative conditioning
    experience, not a player-character witnessed event or real-world procedure.
  tanner_experience: While unconscious, Tanner imagines a dark arena, a disembodied
    command “Atira,” hostile batlike creatures and a handgun that repeatedly appears
    and vanishes. His disorientation is presented as part of the experiment, not actual
    combat at the clinic.
  clinic_observers:
    Marcus Powell: Observes Tanner behind a one-way window, demands verification of
      conditioning before Tanner leaves the facility and orders modifications integrated
      into a standard procedure.
    Dr. Cuca / Claudio Andrade: An Amazonian expatriate doctor who performs the clinic
      work and reports progress; he tells Powell that drugs and conditioning have
      suppressed Tanner’s independent control.
    Dr. Rampart: Mentioned as having suggested concerns about how well the conditioning
      works outside the clinic; Andrade disputes that concern.
  conditioning_and_agency: The text reveals that Tanner is unknowingly subjected to
    an experimental behavior-control receiver and induced command responses during
    medical treatment; this is not consensual voluntary participation by him. The
    clinicians discuss inducing complex acts and suppressing his subsequent memories.
    Andrade says associated memory fades within roughly twenty-four hours.
  unloaded_pistol_test: After a clinic nurse returns Tanner’s weapon on a tray, a
    voice command prompts him to point the pistol toward her and pull the trigger;
    the chamber is empty. Tanner does not recognize the incident as an attempt to
    harm someone. Powell and Andrade observe this as a coercive conditioning demonstration.
  aftereffects: Tanner believes he received a routine softlink upgrade. He recalls
    investigating a gang called the Futuremen but not the conditioning. The narrative
    specifically distinguishes what Tanner believes from the knowledge held by Powell
    and Andrade.
