data:
  publication_context: FICTIONAL Shadowrun tabletop-RPG adventure Missions (FASA7325),
    published by FASA Corporation (1996), original Second Edition; catalog source.fasa-7325;
    printed pp54-55/PDF pp55-56.
  source_status: These are authored fictional alternate-history events, not claims
    about actual NASA, the US Department of Defense, spaceflight, corporations or
    deaths.
  operation_discovery_aftermath:
    survivors: After the fictional Operation Discovery spacecraft crashed on Mars,
      three astronauts returned to active duty after extensive debriefing; two died
      within the following five years. Lieutenant Colonel James Yavin of the U.S.
      Air Force is the only one alive at the time of the story.
    storage: The fictional NASA and Defense Department concealed the spacecraft, equipment,
      and mission evidence in an abandoned missile silo in Haggard, Kansas, with stone
      and bone samples locked inside.
  nasa_buyout_2016:
    reported_cause: The source narrator says the costly secret mission and misuse-of-funds
      scandal led to the dismissal of senior fictional NASA administrators and a near-bankrupt
      agency.
    corporate_change: Ares Macrotechnology bought the fictional agency’s remaining
      assets in 2016 and took over many of its employees through AresSpace.
  xavier_and_veil:
    employment: Karl Xavier had managed NASA data collection and distribution and
      had also worked for Veil. He transferred to AresSpace while remaining a Veil
      operative, along with other former NASA/Veil staff.
    corporate_project: AresSpace began Project Cydonia in the early 2040s, sending
      unmanned Mars probes to investigate the surface in more detail.
    sabotage: Veil directed Xavier and colleagues to intercept and sabotage incoming
      Cydonia data. They changed the transmission into 200 minutes of static and noise
      and a single fabricated image of a 1950s-style flying saucer over Martian terrain
      with old-fashioned Apollo-mission equipment.
    mufon_deception: AresSpace Security initially inferred involvement by a local
      Mutual UFO Network (MUFON) cell after suspicious evidence. The hired runners
      violently pursued MUFON members without recovering the real data, because Xavier
      and his associates had planted the evidence to redirect investigators.
    later_leverage: Xavier subsequently left AresSpace and Veil, founded Astrotech
      Industries in Houston, retained original Cydonia download data showing the pyramids,
      skeleton and wrecked Operation Discovery ship, and used threatened disclosure
      to leverage government contracts; the source says he threatens officials to
      release the material unless advantageous contracts are awarded.
  benjamin_steele:
    employment: Benjamin Steele was an AresSpace data-transmission and interpretation
      manager. After Cydonia data proved useless he was demoted to a low-paid low-status
      requisitions position; good work later secured him an AresSpace Security role.
    motivation: Steele is convinced more lies lie behind Project Cydonia, and the
      sudden photographs in Dunkelzahn’s will give him a new opportunity to investigate.
  will_reward_and_inquiry:
    reward: 'President-elect Dunkelzahn’s Last Will and Testament offers a reward
      to whoever explains three photographs (two from the 2001 NASA Mars mission and
      one doctored UFO photograph from Project Cydonia), plus 1 percent interest in
      Ares Macrotechnology; the source references Portfolio of a Dragon: Dunkelzahn’s
      Secrets pp29 and 35.'
    uncertainty: Steele and others do not know who supplied the three images for the
      will; the source distinguishes this unresolved question from its narrator-established
      invented history.
    assignment: AresSpace executives approve Steele’s request to investigate, hoping
      to retain the 1 percent interest, and put an AresSpace Security team on the
      case.
