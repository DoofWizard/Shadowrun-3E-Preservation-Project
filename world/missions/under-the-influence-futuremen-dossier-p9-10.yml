data:
  publication_context: 'Fictional tabletop RPG archival source: Missions, FASA Corporation,
    copyright 1996, FASA7325, original Second Edition, source.fasa-7325, printed pp9,10/PDF
    pp10,11.'
  source_review_scope: Statements below report this fictional published source; scenario
    options are hypothetical game-master branches, not historical assertions or real-world
    advice.
  source_frame: The fictional Lone Star dossier and narrative account distinguish
    documented police observations from the narrator’s privately disclosed Renraku
    connection. Unconfirmed member identifications remain investigative leads, not
    proved identities.
  missing_officer_briefing: Captain Burns, who regards the case as a serious threat
    to his career as well as public safety, asks the Lone Star player characters to
    find Sergeant Franco Tanner. Tanner is undercover; he reportedly investigated
    a Ravenna cyberware clinic three days earlier and is more than twenty-four hours
    overdue with his latest report. Burns gives the group case files, Tanner’s undercover
    credentials and related official information.
  case_scope: The gang gained the Futuremen name from a police observer’s description
    of a fast smash-and-grab incident. The narrator gives approximately twelve incidents
    over the preceding two months, from shops to a raid on an Ares-owned warehouse.
    The group numbers roughly twenty; it uses diverse high-end cyberware, coordinated
    timing and dispersal, and appears to evade pursuit without audible verbal coordination.
    No operative has been captured alive.
  public_case_uncertainty: Lone Star investigators see no established pattern in reported
    targets; wounded suspects gave no reliable intelligence, and subsequent interviews
    did not prove the identified people had participated. Investigators treat the
    attacks as random. Some questioned people have no memory of activity involving
    the Futuremen, a fact separately explained by the source’s narrator.
  narrator_private_corporate_context: The source reveals a Renraku project that arranged
    the first Futuremen outing as a test of induced conditioning. Later incidents
    also target the properties of Renraku’s competitors. The published text distinguishes
    this underlying explanation from the investigators’ inability to establish a pattern.
  tanner_undercover_search: Tanner used the longstanding cover identity Frank “Leopard”
    Leonard, contacted criminal associates seeking gang access, checked records of
    deceased suspects and traced multiple patients to Dr. Cuca’s illegal clinic in
    Ravenna. His last report was timestamped thirty hours before the game briefing;
    it records clinic and hotel addresses, and he intended to inspect the clinic.
  tanner_personnel_context: His Lone Star personnel record describes an eight-year
    veteran with four years of extended undercover assignments, numerous commendations
    and some disciplinary citations; detailed personal data were not copied into the
    mission team’s terminals.
