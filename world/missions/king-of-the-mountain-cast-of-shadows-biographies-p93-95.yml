  "headline": "FICTIONAL Shadowrun tabletop RPG adventure Missions, FASA Corporation, copyright 1996, FASA7325, original Second Edition, catalog source.fasa-7325, printed p93-95/PDF p94-96: Jeff Lisbon, Michael Thorndike, and Colonel Lawrence Fenmore fictional character histories.",
