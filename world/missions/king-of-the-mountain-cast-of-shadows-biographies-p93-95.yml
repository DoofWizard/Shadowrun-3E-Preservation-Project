    "jeff_lisbon": {
      "role": "Major Jeff “Heartbreaker” Lisbon, a fictional Anglo elf and UCAS military specialist",
      "history": "He grew up in Seattle’s nouveau-eleven district, endured bullying, joined marine infantry at Fort Lewis, developed an appetite for risky practical jokes, pursued explosive-ordnance-disposal and thaumaturgic training, later served in Green Berets and Delta Force, and was repeatedly moved between units. The book gives his age as 26."
    },
    "michael_thorndike": {
      "role": "Fictional self-styled Archangel Michael",
      "book_narration": "The account says he experienced severe childhood abuse and psychiatric illness, developed magical powers, and was confined to a psychiatric institution. Fenmore recruited him for his magical skills and vulnerability to manipulation. The book establishes that he killed more than one person with his magic. He uses elaborate staged illusions, anchored and quickened spells and a religious persona to control the compound.",
      "in_world_beliefs": "Michael wrongly believes he is the Archangel Michael and interprets his actions as religious judgment; those are the character’s beliefs, not historical or theological fact."
    },
    "lawrence_fenmore": {
      "role": "Fictional UCAS Colonel Lawrence Fenmore, architect of the Fort Ross child-soldier program",
      "chronology": "While in a college military program he experienced the 2021 goblinization and developed resentment of metahumans. After the secessions and a 2050 marital and military career crisis, he plotted to recruit a clandestine magic-using military force. He found Fort Ross and financed his covert project with help from an ex-military hacker using the name Mr. Mo. He recruited Michael Thorndike as a purported spiritual leader.",
      "narrator_facts": "The story describes Fenmore as arranging the abduction and conditioning of magically talented children for a coerced military program; his claimed protective mission is contradicted by the narrator’s account. He threatens retaliatory violence against people who challenge him.",
      "attribution": "Fenmore frames his hatred of magic and metahuman peoples as patriotic or religious obligation; those are fictional character rationalizations, not endorsed historical facts."
    },
