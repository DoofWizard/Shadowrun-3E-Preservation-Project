  source_section: Malpractice — Cast of Shadows
  shawn_ferrer:
    printed_page: 50
    narrator_facts: Shawn grew up a dwarf in the Confederated American States, encountering
      racial slurs and discriminatory behavior. He was tall for his metatype and athletic.
      Shawn joined the CAS military in 2048, trained as a transport pilot, and sought
      acceptance from his human comrades. In mid-2051, three months before completing
      his service, he piloted an LCHC landing craft hovercraft on Florida coastal
      maneuvers when Caribbean League pirates attacked and capsized the craft. He
      nearly drowned. He came to believe the soldiers did not rescue him because they
      did not regard him as an equal due to his dwarf identity. After mustering out,
      Shawn spent incentive money on plastic surgery designed to make his ears look
      human. At an Atlanta unemployment office, his vehicle skills helped him obtain
      a DocWagon rigger post; he received paramedic training in March 2053 and joined
      Expert Team Three nine months later. His traumatic military experience left
      him claustrophobic, but not when rigging. He speaks softly and slowly, rarely
      looks interlocutors in the eyes, and practices yo-yo tricks.
    qualification: Shawn’s belief about his fellow soldiers’ motives is a character
      perspective, not independently established as their actual intent by the narration.
  earl_brown:
    printed_page: 51
    narrator_facts: Earl joined the UCAS Army in the early 2040s and agreed to a cybernetic
      tactical-computer experiment. Military personnel had him use tactical computing,
      laser designation and orientation implants for targeting in clandestine assignments.
      The experiment worked, but the Army lost control of Earl. While on leave he
      engaged in a drunken fight with a dwarf Air Force officer, severely injuring
      the officer’s jaw; the officer was a senator’s son. Earl was dishonorably discharged
      and spent two years in federal prison. Later he operated as a fictional criminal
      intermediary seeking DNA samples. The book says he initially used force in DocWagon
      clinics and hospitals; adverse attention jeopardized his employment, so he changed
      his methods. The implanted tactical computer has increasingly affected his thinking;
      he is portrayed as cold, calculating, proficient with rifles and knives and
      willing to obtain information from unwilling subjects. His speech is ambiguous
      and avoids definite commitments.
    qualification: The fictional source attributes Brown’s cold personality partly
      to the implant; its descriptions of assault, coerced information and concealment
      are fictional narrator facts rather than instructions or endorsement.
