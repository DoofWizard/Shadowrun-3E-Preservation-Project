data:
  publication_context: 'Fictional tabletop RPG published source: Missions, FASA7325,
    FASA Corporation (1996), original Shadowrun Second Edition fictional tabletop
    RPG adventure collection; catalog source.fasa-7325; printed pp26,28/PDF27,29.'
  chapter: 'Malpractice: Wonderful Night—A Prologue and Introduction'
  opening_fiction: The narrative prologue follows fictional Earl Brown, who directs
    Panther, Gentry and Equinox teams against a DocWagon ambulance and later convenes
    them at a rendezvous. The prologue depicts the attack and Brown’s satisfaction
    but does not independently disclose the group’s employer or all motives.
  source_established_chronology:
  - year: 2043
    event: Robert “Doctor Bob” Khamdeng joins DocWagon as a paramedic; he is known
      for attempting to save seriously injured non-clients despite penalties from
      management.
  - year: 2047
    event: KNUS publicizes his rescue work; the Doctor Bob story is aired widely,
      but he continues as a paramedic.
  - year: 2054
    event: A man named Brown offers Khamdeng extensive compensation and a position
      in Brown’s organization in exchange for illicit DocWagon client medical records
      and DNA samples. Khamdeng declines, and informs Brown of his rejection.
  - year: 2054
    event: Within three days, Bob’s High Threat Response team attends what proves
      to be an ambush associated with Brown. Bob survives, his fellow responders die,
      and he departs DocWagon and Seattle after further attempts against him; he eventually
      joins the shadows in Seattle.
  - year: 2057
    event: After reports of another paramedic approached by Brown in 2054, Khamdeng
      contacts Elizabeth Yamato in DocWagon Internal Security. Yamato identifies a
      long-serving HTR team with roughly one Expert Duty call per week since 2054.
      She helps arrange independent player-character investigators.
  person_and_org_relationships:
    Robert Khamdeng: Fictional former DocWagon paramedic, survivor of the original
      attack; now recruits adventurers and seeks accountability for colleagues.
    Brown: Fictional recruiter associated with a shadowy outside group. Prologue identifies
      him as Earl Brown; his employer and project are deliberately mysterious in the
      introduction.
    Elizabeth Yamato: Fictional DocWagon Internal Security officer, personal friend
      of Khamdeng who assists his investigation.
    DocWagon: Fictional mobile emergency medical corporation with High Threat Response
      teams and a newer TRP staffing program.
  distinctions: 'This is a fictional game story: Bob refused the data transaction;
    the response to Brown’s 2054 offer was not consent. Later protagonists’ success
    and the alleged mole’s precise identity remain unresolved optional adventure outcomes.'
