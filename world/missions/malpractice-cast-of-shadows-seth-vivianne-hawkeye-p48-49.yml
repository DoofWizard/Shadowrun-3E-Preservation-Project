data:
  publication_context: 'Fictional tabletop RPG historical reference: Missions (FASA7325),
    FASA Corporation (1996), original fictional Shadowrun Second Edition tabletop
    adventure anthology, catalog source.fasa-7325, printed pp48–49 / PDF49–50.'
  section: Malpractice — Cast of Shadows
  gm_option: 'The published narrator says these profiles omit optional Edges and Flaws
    from Shadowrun Companion: Beyond the Shadows. Gamemasters may choose them to individualize
    the cast and possible links to Brown, or use Edges and Flaws as red herrings;
    these additions are not fixed narrator facts.'
  seth_palatine:
    source_page: 48
    narrator_facts: Seth was born in the mid-2010s. His father and two sisters died
      of VITAS-II before his tenth birthday; his mother could not secure employment
      and relied on government support. She taught him Islam and reverence for the
      prophet Mohammed. Seth became a paramedic to aid people in need, worked in Seattle’s
      Nordstrom Clinic and joined DocWagon in 2043. During a Sons of Sauron response
      to Humanis Policlub strikes in early 2049, 38 people in the Ork Underground
      were killed and hundreds injured. The Sons bombed an almost exclusively human
      low-rent residential facility; Seth’s mother was injured and died soon afterward
      from complications of her already failing health. Seth blames the Sons of Sauron
      and has not forgiven them. After nearly twenty years serving in Seattle’s street
      violence as a paramedic, he masks his emotions, though he can become vulnerable
      or threatening when they surface; fatigue is evident in his facial worry lines.
    attribution_note: The book attributes Seth’s blame for his mother’s death to Seth;
      it does not equate all the losses with a single incident.
  vivianne_geldhausmann:
    source_page: 49
    narrator_facts: Vivianne (Viv) is the DocWagon team psychiatrist. She graduated
      eighth in her Cambridge class, specializes in individuals suffering from cyberpsychosis,
      is also trained in medicine and can relieve other paramedics. Her cheerfulness
      supports the team. She has a slight limp from a gunshot in her left leg sustained
      while rescuing a client from gang violence several years earlier. She married
      Jacob, a photojournalist, in 2051. Jacob worked as a Lone Star informant to
      help pay expenses while pursuing criminals, using his cybercamera to record
      evidence. During an Ancients confrontation in late 2052, he was shot after supplying
      Lone Star with evidence important to prosecuting members of the Ancients. His
      murder remained unsolved; her outlook became more subdued.
    attribution_note: The publication does not identify a proven perpetrator of Jacob’s
      killing.
  gordon_hawkeye_kurtz:
    source_page: 49
    narrator_facts: Gordon was formerly a Crashcart paramedic and was hired by DocWagon
      in late 2052. The narrator depicts him as a persistent flirt across metatypes
      and ethnicities and a person drawn to nightlife. He uses stimulants to manage
      his workload and prolonged social activity, has become dependent on them, and
      is described as diverting money and supplies from DocWagon to finance that habit.
      Although in his late twenties, he looks younger. Usually sociable with fast
      one-liners, he becomes bitter and hostile as his stimulant dose wears off.
    attribution_note: These are fictional character and narrator descriptions, not
      allegations about a real employee.
