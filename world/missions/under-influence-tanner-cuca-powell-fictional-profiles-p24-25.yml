data:
  publication_context: 'Fictional tabletop-RPG publication: Missions (FASA7325), FASA
    Corporation (1996), historical Shadowrun Second Edition fictional tabletop-RPG
    adventure anthology; catalog source.fasa-7325; printed pp24,25/PDF25,26.'
  people:
  - name: Sergeant Franco Tanner
    description: The fictional Lone Star anti-gang task-force officer is experienced
      at undercover gang investigations, but his tendency to take individual risks
      has led to his compromised infiltration of the Futuremen. His aliases include
      Frank “Leopard” Leonard; he has been subjected to Cuca’s involuntary conditioning.
  - name: Dr. Cuca
    name_in_full: Dr. Claudio Andrade
    description: A fictional Amazonian expatriate medical and cybertechnology researcher
      who adopted the street name Cuca. The book says he left Amazonia after a research
      subject proved related to São Paulo’s mayor, jeopardizing his prior practice.
      Renraku recruited him and moved him to the UCAS. The Futuremen are described
      as his first field trial of coercive conditioning and cybernetic behavioral
      modification; he overestimates the importance of his work and underestimates
      its effects on the unwilling subjects. The author directs the GM to portray
      him as brilliant and narrowly focused rather than insane. Cuca has no cyberware,
      given his concern about the susceptibility of implants to outside interference.
  - name: Marcus Powell
    description: A fictional Renraku manager responsible for the Futuremen project.
      Powell wants a rapid promotion, keeps Cuca and the research under restrictive
      supervision, repeatedly seeks additional funding and credit, and maintains scrutiny
      over the underground facility. The book describes him as disliked by personnel
      but unconcerned about their opinion.
  claims_and_scenarios: Character characterizations above are narrated setting facts
    or author GM direction; separately attributed rumors in contact tables are recorded
    in the associated rules record. None is a real-world allegation.
