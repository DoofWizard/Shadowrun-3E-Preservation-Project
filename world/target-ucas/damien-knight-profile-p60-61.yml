{"id":"world.target_ucas.damien_knight_profile_p60_61","record_type":"world","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Historical Second Edition-era Shadowrun fictional tabletop-RPG sourcebook; no assumed Third Edition mechanics"},"printed_pages":"60-61","pdf_pages":"61-62","edition_scope":"Historical fictional Shadowrun Second Edition-era setting, FASA Corporation Target: UCAS (FASA7214, 1997); no inferred Third Edition conversions.","content_class":["world_fact"],"data":{"section":"Detroit / Who’s Who / Damien Knight","narrator_role":"The fictional sourcebook presents Damien Knight as CEO and chairman of the board of Ares Macrotechnology, a skilled programmer and major Detroit power broker whose rise is connected to the Nanosecond Buyout.","background_claims_and_limits":"The narrator says the background is discussed in the earlier History section. The source reports that records give Knight a birth year of 1999, and that he appears little older than he did when first seen publicly about twenty-five years earlier. It states there is almost no record of his life before 2033 except his birth records and SIN registration. Reports of expensive anti-aging and leonization treatments are explicitly rumors, not verified procedures.","augmentations_and_computing":"The narrator explicitly says nobody knows whether Knight possesses cyber-modifications, and notes that he usually handles routine office work by computer terminal and does most other business by videophone. He is credited with strong programming skills and the coordination of the Nanosecond Buyout; the source does not establish the rumored first-decker-team theory as fact.","company_and_management":"The narrator credits Knight with forming or supporting AresArms and Knight Errant, continued support of profitable AresSpace, and setting company executives against one another to compete for resources and his favor. It calls him an able but aggressive administrator whose approach incentivizes both ambition and conflict among Ares subdivisions.","narrative_certainty":"Descriptions above are attributed to the printed fictional guide narrator, with uncertain background, rumored treatments and unknown augmentations explicitly marked rather than asserted."},"headline":"Fictional Shadowrun tabletop RPG source archive: FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition era), printed pp60-61/PDF 61-62 — Damien Knight: Ares leadership and biography","summary":"Independent original-page review of FASA Corporation’s fictional Second Edition-era Shadowrun book Target: UCAS (FASA7214, 1997), printed 60-61, PDF 61-62. Narrator-established information and attributed in-world statements are distinguished; no Third Edition conversion is inferred.","framing":"newsroom_neutral"}
