  "data": {
    "section": "Boston — The Hub: South Boston Blues by Southie Sam; South Boston, the Troubles, Bloody Thursday",
    "narrator_attribution": "The section is presented by fictional in-world writer Southie Sam; character assertions are in-universe reportage, not independent real-world claims.",
    "district": "South Boston is described as a mix of long-established neighborhoods and newer enclaves, including Black, Chinese, Korean, Vietnamese, Hispanic and Irish populations alongside elves, orks, trolls and dwarfs. More prosperous residents occupy waterfront/downtown-adjacent residences; many wage workers, service staff, and low-level corporate employees commute by northbound T trains.",
    "irish_identity": "The Cathedral of the Holy Cross neighborhood became a center of Irish immigration after the 2030s. Southie Sam describes Ireland-linked political disputes as contributing to a series of violent confrontations called the Troubles, rather than reducing tensions to a single ethnic cause.",
    "tir_na_nog_2034": "The writer traces escalating local violence to 2034, after Ireland's elves announced the restoration of their ancestral homeland and the founding of Tir na nÓg. Some non-elf Irish immigrants in Boston regarded the new state as occupation of an Irish homeland, increasing local hostility toward elves. The source also notes that many established Irish-American families had never lived in Ireland and that Irish residents disagreed about the issue.",
    "conflicting_irish_groups": "The narrator describes a smaller faction viewing Tir na nÓg as a return to Celtic tradition and a larger hostile faction who saw elf rule as dispossession; individual community members and metahumans held diverse views.",
    "bloody_thursday_2039": "On St. Patrick's Day 2039, shortly after the Night of Rage, a militant group called the Knights of the Red Branch set off a bomb at a popular elven restaurant on Boston's parade route. Southie Sam reports twenty-four people killed and dozens wounded. The parade became a large-scale riot across nationality and class lines, followed by martial law; several hundred people were dead or injured in the subsequent unrest.",
    "agency_and_harm": "The restaurant patrons and other injured people were victims of an attack, not consenting participants. The Knights' motive is attributed to the militant group, not to all Irish residents. This is alternate-history fiction; the record does not identify actual living persons.",
    "source_note": "The section contains narrative dates, places and casualty counts, not dice modifiers or mechanics."
