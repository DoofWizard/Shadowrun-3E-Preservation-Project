{"id":"world.target_ucas.damien_knight_who_is_who_p60_61","record_type":"world","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"60-61","pdf_pages":"61-62","edition_scope":"Historical fictional Shadowrun tabletop-RPG source; FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era setting; no inferred Third Edition mechanics.","content_class":["world_fact"],"data":{"section":"Detroit — Who’s Who — Damien Knight","corporate_position":"The fictional sourcebook narrator identifies Damien Knight as Ares Macrotechnology’s CEO and chairman of its board, and as the architect of its Nanosecond Buyout. The narrator calls him an unusually capable, aggressive administrator who established AresArms and Knight Errant and backed AresSpace.","biography_and_uncertainty":"Knight’s origins are depicted as exceptionally obscure: the narrator says virtually no records precede 2033 apart from birth and SIN-registration records, whose authenticity the text explicitly questions. Knight’s own records give his birth year as 1999. The narrator says he appears no older than 39 and has changed little during approximately 25 years of public life, attributing his youthful appearance as a possibility—not a proven cause—to costly anti-aging treatments.","technical_ability_and_unknown_augments":"The narrator says Knight has no visible cyber-modifications but does not establish whether he has any; he generally operates through computer terminals, rarely appears in the Matrix and handles business over videophone. He is described as having exceptional programming skill, illustrated by the coordinated computerized Nanosecond Buyout.","management_method":"The narrator describes Knight as assigning Ares executives competing priorities and forcing them to vie for corporate resources and his attention, benefiting perceived competence and toughness at a cost to cooperation. Named participants’ judgments about Knight’s alleged ruthlessness, charity, or criminal conduct are preserved separately as attributed claims.","source_voice":"These are in-world biographical and corporate assertions made by a 1997 fictional Shadowrun publication, not verified assertions about a real-world individual."},"headline":"Fictional Shadowrun tabletop RPG source archive — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition era), printed 60-61/PDF 61-62: Detroit — Who’s Who — Damien Knight","summary":"Original-page-reviewed archival world_fact material from the fictional tabletop-RPG sourcebook Target: UCAS (FASA Corporation, FASA7214, 1997, Second Edition-era), printed 60-61/PDF 61-62. In-world narrator facts, named attributed allegations and uncertainty are kept distinct.","framing":"newsroom_neutral"}
