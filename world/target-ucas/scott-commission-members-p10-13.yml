summary: 'Fictional tabletop-RPG source: Captain Chaos profiles eight commissioners including Chief Justice Richard Scott, political
  representatives, security adviser Carla Brooks, mage Frazer Williams and CIA director Steven Coe Bowling. Published in Target:
