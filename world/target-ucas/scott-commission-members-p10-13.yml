data:
  source_publication: 'FASA Corporation Target: UCAS (FASA7214, 1997), printed pp10–13/PDF11–14.'
  byline: Captain Chaos, compiling an in-world Shadowland reference about the commissioners; judgments, colorful accusations and
    rumors are attributed, not treated as definitive.
  commission: Fictional 2058 Scott Commission investigating the assassination of President Dunkelzahn.
  members:
  - name: Chief Justice Richard Scott
    role: Head of Scott Commission; UCAS Supreme Court Chief Justice
    history:
    - Joined the UCAS Supreme Court in 2044; became Chief Justice after predecessor Malcolm Bayh suffered a debilitating stroke
      late in 2051.
    - As a lawyer, took the 2033 Grumman equality lawsuit to the Supreme Court during 2036; the lawsuit concerned a Tulsa school
      refusing admission to a troll child and fining the family under compulsory-education law.
    - A president appointed him to the Circuit Court during the 2036 campaign season; his judicial profile later rose.
    - A source narrative says Tulsa integration litigation coincided with Oklahoma joining the CAS in 2037 rather than complying.
    attribution: The account of Senator Wendell DeCamp and Scott’s political positioning is Captain Chaos’s commentary, not a formal
      commission finding.
  - name: Senator David Ralph
    affiliation: Democrat, Illinois (D–IL)
    history:
    - Age 62 in the described 2058 setting; a longtime politician and former Chicago West Side 47th Ward alderman elected in 2027.
    - Served as a Chicago alderman for about a decade before election to the U.S. House in 2036 on a California-secession themed
      campaign; later became senator.
    - Described by the narrator as repeatedly winning power while avoiding high-profile action.
    allegations: Rumors linking Mafa-backed campaign literature to a disputed family-financed campaign are discussed as campaign
      intrigue, not proven misconduct by Ralph.
  - name: Senator Melissa Washington
    affiliation: Republican, Maine (R–ME)
    history:
    - Former local trid-news weather reporter in Biddeford, Maine; entered politics after her oldest son was killed in a magical
      accident in 2046.
    - Originally promoted regulation of magical artifacts, talismans, magical materials and magical research; now serving her second
      Senate term.
    - The narrator says a local newspaper exposed her opponent Dale deVere’s bribe from Mitsuhama Corporation to loosen corporate
      magical research regulations; the account concerns a fictional election.
    - The only metahuman member of Congress according to the profile, and one of the two metahumans on the commission; she is an
      elf.
    stance: Responded publicly to rumors of magical involvement in Dunkelzahn’s assassination by urging deliberation and rejecting
      prejudgment of magic users.
  - name: Representative Jess Rummens
    affiliation: Technocratic Party, Iowa (T–IA)
    history:
    - Elected to the U.S. House in 2036 at age 29 on presidential candidate Martin Vincenzo’s coattails.
    - Advocated preserving the UCAS family farm while sponsoring agribusiness tax breaks; the narrator alleges some nominal family
      farms were families only on paper.
    - Known for a failed proposal to create an endowment for hog-calling.
    relationships: Narrator says agribusiness-connected friends protected his political career after the Technocratic Party fell
      in standing.
  - name: Representative Sarah Lynn
    affiliation: Independent, Vermont (I–VT)
    history:
    - Founded the Gaia Awareness Network in 2035 with Arthur Vogel and Gary Grey; the network preceded Vogel’s One World Party.
    - Worked in Europe between 2040 and 2046; returned for a Vermont House race after the sitting Technocratic incumbent died in
      a boating accident.
    - Acknowledged working with European fringe ecological policlubs, framing her environmental involvement as public service;
      won a polling lead the profile says she never lost.
    - Advocated environmental laws and opposed megacorporate influence, while taking less predictable positions on other topics.
    speaker_context: Captain Chaos supplies a sometimes mocking characterization; her quoted campaign reply is her own position.
  - name: Carla Brooks
    role: Dunkelzahn’s former campaign security chief and presidential adviser
    history:
    - Former Knight Errant officer described as strongly committed to protecting clients; promoted into command roles.
    - Left Knight Errant in 2042 to work exclusively for Dunkelzahn at his personal invitation.
    - The text describes her reputation for loyalty and disciplined security work; she was named in Dunkelzahn’s will with a bequest
      of five million nuyen and the dagger Wyrmstooth.
    - She has refused public statements about his death; when named to the commission, she said she intended to find the truth.
    rumor_boundary: Rumors about her covert activity belong to the separate Shadowtalk record and are not accepted as biographical
      facts.
  - name: Professor Frazer Williams
    role: Director of Magic and Occult Studies at Georgetown University; dwarf hermetic mage
    history:
    - Age 38 as of the profile; received a UCLA doctorate in thaumaturgy in 2043 under Aikiko Kano.
    - 'Became Georgetown department chair in 2053, following publication of It’s All in Your Head: A Guide to Magical Disciplines,
      which questions a strict mage/shaman division.'
    - Claims practical knowledge from street mage Nemo, rather than principally from Kano; the profile situates his upbringing
      in Los Angeles’s Harbor Barrens and says he lost his home and mother in the 2028 Quake.
    - Runs free magic classes for gifted children in Georgetown public schools and volunteers as an on-call forensic magician for
      the Georgetown Police Department.
    identity_note: One of the two metahumans on the commission.
  - name: General Steven Coe Bowling
    role: Director of the CIA during the Preston administration
    history:
    - Age 53 according to Captain Chaos.
    - Joined the UCAS Army in 2026 and was discharged December 1, 2028 after less than two years of service; returned to the Army
      in June 2030.
    - Rose through military ranks from 2030, and President Carl Preston appointed him CIA director in 2044.
    - Replaced by a new director chosen by the Adams administration in 2049; the narrator says he managed a quiet tenure.
    rumor_boundary: A supposed friendship with Dunkelzahn dating to Bowling’s Army years is explicitly unconfirmed; Bowling declines
      to confirm or deny it.
  source_accuracy: Biographical assertions are from the sourcebook’s fictional in-world profile; rumor details remain marked as
    rumor or narrated allegation.
headline: 'FICTIONAL Shadowrun tabletop-RPG archival record — Fictional Scott Commission membership and member backgrounds | Target:
