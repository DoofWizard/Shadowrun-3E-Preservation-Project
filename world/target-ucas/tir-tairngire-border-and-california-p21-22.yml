  article: Family of Nations — Tir Tairngire, source-period regional political changes
  source_voice: The bylined in-world Family of Nations narrative, distinct from separately attributed Shadowtalk.
  after_dunkelzahn_election: Following Dunkelzahn’s election, the Council of Princes tightened Tir Tairngire border controls,
    including extraordinary restrictions on incoming and outgoing newsfeeds or broadcasts judged threatening to Tir security.
    These measures followed a period of comparatively relaxed communications and movement.
  after_election_and_succession: Tir leadership formally offered condolences for Dunkelzahn and support for newly inaugurated
    President Kyle Haeffner. Travel and communications restrictions eased somewhat but remained stricter than before the
    election; immigration restrictions also stayed tight. The book reports Tir Defense Forces drills, training and inspections.
  prince_ehran: Prince Ehran the Scribe travelled regularly to Boston on business for the Dunkelzahn Institute for Magical
    Research, of which he was a board member.
  california: Communities in the Northern Crescent and officials in Sacramento warned the Council of Princes against military
    activity in disputed Northern Crescent territory. The narrator describes mounting fears of another Tir move into California
    and increasing anti-elf incidents, not a verified new invasion.
  seattle: Seattle maintained increased border patrols and experienced restricted goods movement from the Tir. The narrator
    contrasts Seattle’s lower concern with California’s greater fear; the opening of printed p22 continues this account.
