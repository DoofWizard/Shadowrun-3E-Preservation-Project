data:
  setting_frame: Book narrator’s account of events in the fictional 2058 Shadowrun timeline, not allegations about real people or present-day institutions.
  leadership:
    past_president: Dunkelzahn (deceased in the fictional setting)
    successor: President Haeffner
    backing: Ares Macrotechnology is described as an important supporter of Haeffner.
    corporate_bequests: Dunkelzahn’s will distributes stock and creates potential corporate control disputes.
  boston:
    historical_role: Long-standing neutral territory associated with the stock exchange, now experiencing destabilizing corporate competition.
    richard_villiers: Richard Villiers, head of Fuchi Corporation, received inherited share holdings that increased his power relative to the corporation’s other two governing executives.
    renraku: 'Villiers’s former head of security gains shares and a board seat at rival Renraku (source cross-reference to Portfolio of a Dragon: Dunkelzahn’s Secrets).'
    uncertainty: The narrator anticipates his Fuchi colleagues may act against him; this is a forecast, not a completed event.
    consequence: The narrator reports escalating shadow activity and intrigue in Beantown.
  detroit:
    industrial_faction: Ares Macrotechnology has its home in Detroit.
    leader: Damien Knight
    conflict: Competitors seek weak points in Ares and Knight, generating political and commercial intrigue; narrator interpretation, not a named historical outcome.
  chicago:
    nickname: Bug City / City of the Damned
    past_incident: The narrator says a tactical nuclear device was detonated in the center to destroy an insect-spirit hive, leaving a large quarantined urban containment zone.
    occupants: Insect spirits, possessed metahumans, gangs and other survivors inside the zone.
    ares_operation: Ares security teams deployed a fictional astral disease attacking bug spirits and also other entities with an astral presence; consequences were broader than insect spirits alone.
    changed_status: The narrator says the Chicago Containment Zone is now open for entry and exit.
  attribution: These are narrator-established or narratorial future-looking statements within FASA’s fictional sourcebook, not claims about actual real-world organizations or historical events.
