data:
  section: Game Information — Facts at a Glance and Getting In/Out, fictional Boston
    and Detroit.
  boston:
    metro_name: Boston Area Metropolitan Complex
    population: 4890000
    population_composition_percent:
      Human: 66
      Elf: 9
      Dwarf: 7
      Ork: 10
      Troll: 7
      Other: 1
    regional_telecomm_grid: NA/UCAS-NE
    local_telecomm_grid: NA/UCAS-NE/BOS
    highways: Route 95 (north–south belt around outer metro), Route 128 (north-of-downtown
      connection), Route 93 (from New Hampshire through downtown and east toward Cape
      Cod), Interstate 495 (wide outer belt joining central and southern Massachusetts
      routes).
    rail: The “T” rail system extends north toward Nashua, New Hampshire, and south
      toward Providence, Rhode Island. The chapter describes its trains as inexpensive
      and ordinary policing as limited.
    air_and_water: Logan International Airport handles flights, suborbital shuttles
      and rapid-transit spaceplane routes. The chapter describes unusually tight airport
      security in its fictional setting. Boston Harbor has moderate shipping and ferries
      serving islands and Cape Cod.
  detroit:
    metro_name: Greater Detroit Metropolitan Complex
    population: 6207000
    population_composition_percent:
      Human: 65
      Elf: 7
      Dwarf: 10
      Ork: 11
      Troll: 6
      Other: 1
    regional_telecomm_grid: NA/UCAS-MW
    local_telecomm_grid: NA/UCAS-MW/DET
    highways: UCAS Route 75 runs north–south through downtown and Route 94 east–west;
      Route 275 passes through Oakland and Route 96 passes Detroit-Windsor.
    air: Detroit City Airport and Detroit Metro Airport handle major commercial traffic;
      downtown private helipads also serve commuters. Knight Errant supplies airport
      security, described as somewhat less restrictive than Seattle–Tacoma security;
      international passengers and cargo receive more scrutiny than domestic traffic.
    rail: Rail connects Dearborn, downtown Detroit, Royal Oaks and Pontiac. A UCASRail
      service passes through Detroit; the book offers it as a possible roleplaying
      location.
