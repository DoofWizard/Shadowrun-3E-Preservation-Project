    "section": "Boston — The Hub: The Catacombs / Working Underground",
    "public_transit": "The fictional Boston metropolitan subway, run by the Massachusetts Bay Transit Authority (MBTA), is called the “T.” The source describes aboveground and underground train service across the metropolis and to nearby New England areas.",
    "historical_expansion": "The narrator identifies major system projects between 2005 and 2013 and between 2030 and 2035, involving rebuilding older tunnels, installing rail infrastructure and extending service to New Hampshire and Rhode Island.",
    "catacomb_origins": "The Catacombs consist of old tunnels, sealed stations, maintenance passages, building basements, sewer and storm-drain connections, abandoned access routes, and forgotten passageways beneath Boston. The source connects their uncertain mapping to roughly 150 years of digging, bureaucratic reshuffling, loss of older subway survey records in a June 2029 Hall of Records fire, and computer records lost in the Crash of that same year.",
    "hidden_economy": "The narrator describes black-market bazaars, fences, smugglers, underground residents, informants, freelance scavengers and criminal operators using the tunnels. Authorities officially deny the Catacombs’ existence but are portrayed as tolerating some markets; the network is also said to offer covert travel across the metropolitan region.",
    "criminal_and_social_context": "The underground is also used by people hiding from law enforcement or discrimination. The guide depicts the tunnels as a mix of refugee spaces, illicit markets and hazardous areas, not a place inhabited solely by criminals.",
    "shadowrun_use": "The sourcebook frames the Catacombs as a fictional setting for concealed movement and shadow-economy dealings. It offers general narrative possibilities, not precise maps, actual access locations, or numerical travel mechanics.",
