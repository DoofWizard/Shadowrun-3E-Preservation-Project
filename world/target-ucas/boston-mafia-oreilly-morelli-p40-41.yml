  "data": {
    "section": "Boston — The Hub: The Boston Underworld / The Mafia / O’Riley and Morelli families",
    "source_voice": "The fictional Shadowland contributor Digger presents this section as an account of Boston organized crime; narrative assertions are retained as sourcebook-report facts, not independent real-world evidence.",
    "criminal_market": "The source identifies the Boston Mafia as dominant in the metropolis's organized criminal businesses. It says Mafia influence is particularly evident in the Rox Combat Zone, where businesses generate illegal income and provide money-laundering opportunities. Major Rox gangs reportedly have Mafia ties and are used as couriers or intermediaries for operations such as BTL distribution.",
    "competing_groups": "The book also describes Triad activity in Boston Chinatown and limited Yakuza operations among Japanese corporations and corporate employees. The narrator presents the internal feud between Irish and Sicilian Mafia families as the largest immediate threat to the Boston Mafia.",
    "succession_and_family": "Conor O’Riley leads the Boston Mafia and holds a seat on its ruling Commissione. He is an elf and is presented as the only metahuman don governing a major North American city Mafia family, and the only metahuman on the Commissione at this point in the historical setting.",
    "oreilly_genealogy": "The O’Riley family arrived in the United States from Ireland early in the twentieth century. Thomas O’Riley, Conor’s great-grandfather, amassed Prohibition-era illegal alcohol revenue; his son and Conor’s grandfather became prominent Boston figures. Conor’s father Jack supported the family’s alliance with the Italian Mafia during the North American mob reorganization.",
    "conor_history": "Conor was born in 2014 during the fictional setting’s first UGE wave. Although contemporary prejudices falsely attributed elves and dwarfs to contamination or radiation, Conor’s influential family provided protection. His father favored him as the successor. Conor progressively took over operations, and by the mid-2040s ran the family business, expanded influence in the Rox and along the strip, cultivated Irish immigrant relationships, and gained Commissione standing.",
    "policies": "The narrator characterizes Conor’s leadership as comparatively progressive within Mafia politics, citing recruitment of metahumans and use of magic, while noting that these policies could antagonize more conservative local mafiosi.",
    "morelli_family": "Anthony “Fat Tony” Morelli is the senior Sicilian Mafia don associated with Boston’s North End. He values traditional Mafia customs, is described as outwardly genial but harsh with disrespect, and resents Conor’s policies. The source describes the North End’s old buildings, restaurants, and the U.S.S. Constitution as neighborhood landmarks. The book speculates that Morelli seeks to diminish O’Riley’s power and may employ shadowrunners.",
    "mechanical_scope": "This section provides setting and organizational history, not new numerical game rules."
