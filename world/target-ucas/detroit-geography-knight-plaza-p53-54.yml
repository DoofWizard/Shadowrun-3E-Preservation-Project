{"id":"world.target_ucas.detroit_geography_downtown_p53_54","record_type":"world","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"53-54","pdf_pages":"54-55","edition_scope":"Historical fictional Shadowrun tabletop-RPG source from FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era setting; not Third Edition mechanics.","content_class":["world_fact"],"data":{"section":"Detroit - What's Where, Downtown, Knight Plaza and Greektown","urban_geography":"Squire describes Detroit's street grid as radiating from its central downtown, with Woodward Avenue separating the East Side and West Side. The Greater Detroit Metropolitan Complex extends north to Sterling Heights, west to Pontiac and Plymouth, and south to Dearborn and Wyandotte. Windsor across the river became part of the Detroit metroplex after the UCAS was formed in 2032.","physical_setting":"The source contrasts older abandoned factories and the Rust Belt image with more modern downtown buildings strongly influenced by Ares redevelopment. Auburn Hills and outer districts retain more visible industrial deterioration.","downtown":"Downtown Detroit borders the river opposite Windsor and functions as a showcase for Ares Macrotechnology, which influences the central area's restoration.","knight_plaza":"Ares headquarters occupies Knight Plaza, formerly Hart Plaza. Nicholas Aurelius bought the property as Ares's NASA operations expanded and made the former Hart Plaza building its world headquarters. When Knight gained Ares control in 2033 he ordered renovations, and the plaza was renamed for him. It contains the Dodge Fountain and hosts the annual Ares-sponsored Detroit Jazz Festival.","people_mover":"An elevated automated rail system, the People Mover, loops through central Detroit, maintained and expanded by Ares. Described stops include Knight Plaza, Greektown, Bricktown, the Exhibition Center and other major destinations. The standard fare is 2 nuyen.","greektown":"Greektown originated with Greek immigrants in the 1880s and later became a social, shopping, eating and entertainment district. The account identifies the International Center for Apparel Design, restored historic buildings, bazaar shopping, Greek Orthodox churches and a bronze statue of the Greek god Ares, donated by Ares Macrotechnology.","corporate_west_side":"The West Side across from Windsor contains corporate towers including General Motors' world headquarters and the art-deco Fisher Building; GM is depicted as important but secondary to Ares. The narrator also mentions Ford facilities in nearby Dearborn.","mechanics":"The People Mover's ordinary fare is precisely 2 nuyen; this contextual monetary fact is not a new target number or procedure."},"headline":"Fictional Shadowrun tabletop-RPG archive - FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 53-54/PDF 54-55: Detroit - What's Where, Downtown, Knight Plaza and Greektown","summary":"Independently source-reviewed historical fictional Shadowrun publication record from FASA Corporation's Target: UCAS (FASA7214, 1997), printed 53-54/PDF 54-55. Book-narrator statements, named in-world claims, and speculation remain distinguished.","framing":"newsroom_neutral"}
