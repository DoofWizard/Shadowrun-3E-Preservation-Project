  article: Boston — The Hub, History of a Corporate Boomtown by Tao Jones
  byline: Tao Jones, a fictional in-world narrator whose period history is summarized without treating separately posted
    rumors as confirmed.
  pre_2005: Boston began the twenty-first century with severe economic stagnation and unemployment; the narrator reports
    broad civil unrest before the following corporate revival.
  2005_manhattan_earthquake: A massive earthquake in 2005 made New York/Manhattan largely uninhabitable. The United Nations
    relocated to Geneva; relocation of the former New York Stock Exchange later became decisive to Boston’s economy.
  east_coast_stock_exchange: Boston offered incentives, and the East Coast Stock Exchange (ECSE) moved to temporary facilities
    within weeks while a permanent financial district exchange building was developed. The book links its move to the Beanplex
    high-technology boom.
  corporate_investment: Corporate offices and high-rise buildings multiplied; the resulting employment drew migrants, including
    displaced New Yorkers. Overcrowding, housing shortages and inequality grew alongside the expansion.
  corporate_political_control: The narrator describes corporate investment in local housing, security and civic projects,
    followed by escalating corporate demands over city policy and the Boston government’s reluctant acceptance of an ECSE/member-company
    ultimatum.
  mid_2020s: By the mid-2020s Boston was again flourishing and rebuilding older districts; the narrator portrays the city
    as a major high-tech center shortly before the 2029 Crash.
  illustration_note: PDF26 is a full-page black-and-white illustration between numbered printed pp24 and 26, not a lost
    prose page; the picture has not been mistaken for narrative text.
