  article: Boston — post-2029 Crash recovery and political events by Tao Jones
  byline: Historical description by fictional in-world author Tao Jones; another speaker’s allegations are separated into
    companion reference.
  2029_crash: The 2029 computer virus disrupted global telecommunications and Boston high-tech industries; the ECSE suspended
    trading early, suffered severe losses in electronic data assets, then adapted as Matrix technology was restored.
  '2032_2034': Boston’s 300th anniversary was in 2032. In 2034 Matrix Systems of Boston introduced the first commercial
    gray-market cyberterminal, according to the narrative.
  metropolitan_expansion: The Greater Boston Metropolitan Complex incorporated Cambridge, Somerville and Brookline, among
    other municipalities, and extended to many communities toward Route 95. Growth alliances included some southern New
    Hampshire communities, Rhode Island, and northern New York.
  economic_restructuring: Following the mid-2030s southern states and California secessions, Boston promoted high-tech businesses
    along Route 128. Its biotechnology and agrifood industries grew, including algae/krill protein and marine-biotechnology
    research; the narrator still describes substantial food imports.
  2050_mayoral_election: In 2050 Mayor Charles O’Neil projected optimism and Boston’s cultural and economic importance.
  2052_unrest: The summer of 2052 saw serious unrest and repeated violence involving multiple human/metahuman and Irish
    communities; the author says police and private security providers were unable to fully end the disorder. The later
    market for private security grew.
  2057_presidential_aftermath: The 2057 presidential election divided Boston’s civic factions; Haeffner received local support.
    Dunkelzahn’s assassination prompted civil disorder, and security contractors, including Knight Errant, enforced order.
    Haeffner later called for unity.
  corporate_neutrality_changes: After the assassination, Boston’s previous corporate status quo shifted; the author describes
    increasing demand for independent shadowrunners amid the changing corporate balance.
  ecse_system: The exchange has a virtual trading floor, worldwide financial feeds and a dedicated internal Matrix-security
    workforce plus physical corporate security. No exact game statistical values are printed in this reviewed portion.
