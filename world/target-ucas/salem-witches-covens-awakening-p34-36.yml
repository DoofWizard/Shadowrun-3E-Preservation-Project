  "data": {
    "section": "Boston — The Hub: The Witches of Salem; narrator-established historical account and setting descriptions",
    "historical_frame": "The fictional book narrator contrasts Salem's seventeenth-century trials with later disagreement about whether any manifestations of genuine pre-Awakening magic occurred. This disagreement is not presented as resolved.",
    "tourism_and_religion": "By the mid-twentieth century Salem's museum, witch-trial reenactments, pagan revival adherents, specialist businesses and tourist sites formed an economy. The town accommodated a local neopagan witchcraft community; its redesigned town seal featured a broom-riding witch against the full moon. Some residents and practitioners criticized that caricature.",
    "twentieth_century_revival": "By the late twentieth century Salem attracted students and seekers, and mainstream media covered the community's rituals, claimed magical abilities, ecological advocacy, and Native American rights.",
    "samhain_2011": "The setting narrator reports increased extraordinary phenomena around Salem in the early twenty-first century. During an outdoor Samhain observance on Halloween 2011 at Salem's Mystery Hill, fog enveloped a witchcraft circle; witnesses observed spectral horses and hounds and a dark, pale, antler-crowned rider on a black steed. The riders circled three times and vanished. Participants were hospitalized with injuries and illness, including bruises, wounds, burns, migraines and one fatal stroke. A physician could not explain their cause beyond speculating that stress from the event played a part.",
    "post_awakened_growth": "Following the appearance of Ryumyo in Japan at the end of 2011, awareness of a magical age transformed Salem into a destination for would-be magical practitioners. Many newcomers sought practical spellcasting without interest in the earlier pagan religion, but some were sincere adherents with inborn magical ability. Both initiatory covens and larger instructional groups operated, and some mundane locals adopted neopagan religion.",
    "modern_salem": "The book calls Salem a major magical center in North America, estimating its magical talent prevalence as about six times the North American average. The community predominantly practices various nature-magic traditions, while a minority follows hermetic and Amerindian or tribal shamanic practices. At least half the city's so-called spell-workers practice clairvoyance, aura reading, fortune-telling or analogous services rather than full magic.",
    "crowhaven_circle": "The Crowhaven Circle is a Salem witchcraft school using comparatively large instructional classes rather than only individualized initiation. Its school is small relative to MIT&T's magical program but reportedly has a long applicant waiting list.",
    "economy_and_recruitment": "Local magic-focused merchants serve practitioners and tourists. MIT&T and corporate headhunters sometimes recruit talented Salem residents, with limited success; the source does not say that all Salem witches oppose corporate employment.",
    "editorial_note": "These are FASA's alternate-history fiction statements, not verification of real-world magical events or historical witch-trial supernatural causes."
  },
