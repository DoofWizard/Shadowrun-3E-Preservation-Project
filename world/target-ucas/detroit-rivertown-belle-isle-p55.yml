{"id":"world.target_ucas.detroit_rivertown_belle_isle_p55","record_type":"world","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"55","pdf_pages":"56","edition_scope":"Historical fictional Shadowrun tabletop-RPG source, FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era setting; no inferred Third Edition mechanics.","content_class":["world_fact"],"data":{"section":"Detroit - What's Where, downtown continuation, Rivertown, Belle Isle","downtown_venues":"The sourcebook narrator identifies Tiger Stadium, Ares Stadium, Joe Louis Arena, Knight Hall, the restored Fox Theatre (more than 120 years old), the Street Pizza chain associated with Dan Illich, the Renaissance Center, and the Detroit Opera House as downtown Detroit attractions supported heavily by local corporations. Damien Knight is described as particularly fond of opera and as attending performances regularly.","rivertown":"East of downtown, the Rivertown district extends along the Detroit River facing Belle Isle. It includes restaurants, bars, small offices, shopping and tourist attractions. Its specialty shops include establishments selling shadowrunner equipment and illegal goods. Rivertown and Greektown serve as meeting places for local information exchange.","belle_isle_location_and_admin":"Belle Isle lies between downtown Detroit and Windsor in the Detroit River. The narrator calls it North America's largest island entirely surrounded by a city. Much of the island has been preserved as a park and nature reserve since Detroit's founding. Ares bought control from the city government in 2036 and administers the tourist facilities; the narrator describes yacht marinas and affluent visitors.","zoo_and_aquarium":"Belle Isle Zoo and Aquarium are major public attractions. Ares expanded their facilities and added exhibits of paranormal fauna; the zoo's mentioned animals include a live phoenix, several hellhounds, a torpedo shark and a pair of nagas. The aquarium includes three 'domesticated' storm dolphins raised from North Sea specimens. The sourcebook narrator reports protests by the People for the Ethical Treatment of the Awakened over the nagas' treatment as sentient beings and states that Ares has not moved them. The facilities remain protected by Knight Errant patrols.","source_voice":"These are fictional 2050s setting facts asserted in the publication's local-guide narration. The actual identity and motives of named real-world brands or businesses are not being asserted."},"headline":"Fictional Shadowrun tabletop RPG archive - FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition era), printed 55/PDF 56: Rivertown, Belle Isle, civic sites, Ares administration","summary":"Source-reviewed fictional 2050s Detroit material from FASA Corporation's historical Second Edition-era Target: UCAS (FASA7214, 1997), printed 55/PDF 56. Narrator statements, named in-world claims and uncertainty are distinguished.","framing":"newsroom_neutral"}
