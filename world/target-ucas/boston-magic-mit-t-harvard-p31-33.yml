    "source_publication": "Fictional Shadowrun tabletop-RPG source: FASA Corporation, Target: UCAS (FASA7214, 1997), historical Second Edition-era setting supplement, printed pp31–33/PDF pp32–34; no implied Third Edition conversion.",
    "source_voice": "Explicitly bylined THAT OL' BLACK MAGIC essay by the fictional in-world author Raven; speaker observations, judgments and predictions belong to Raven.",
    "magical_landscape": "Raven describes Boston's large magical research sector, mentioning Mandacyne, the Massachusetts Institute of Technology and Thaumaturgy (MIT&T), Salem's witches, magical orders, and the then-new Dunkelzahn Institute of Magical Research (DIMR). He contrasts academic hermetic magic with local Wiccan, nature-magic and shamanic practices; he notes that Native American shamanic practitioners are comparatively uncommon in Boston.",
    "mit_t_profile": "Raven places MIT&T in Cambridge on the Charles River and describes it as a premier North American research university, with computer science, robotics, cybernetics, artificial intelligence, biotechnology, hermetic studies and a smaller but reputable shamanic program. He says corporate scholarships and sponsorships are common and that sponsor corporations frequently recruit students after graduation.",
    "mit_t_magical_facilities": "The described MIT&T Thaumaturgy department includes a major hermetic library, conjuring laboratories with circles, an alchemy laboratory, warded lecture halls and a campus magical supply store. Raven presents MIT&T's technical and magical laboratories as significant corporate research environments with substantial security.",
    "mit_t_campus_groups": [
      {
        "name": "Order of the Crystal Moon",
        "description": "An MIT&T magical association; Raven portrays it as one of the more established, staid groups."
      },
      {
        "name": "Fellowship of Isis",
        "description": "An MIT&T magical association; Raven places it with the Order of the Crystal Moon among the oldest/stiffest groups."
      },
      {
        "name": "Faustus Society",
        "description": "An MIT&T magical association; Raven depicts its young mage adherents as favoring dramatic occult imagery and identifies the name with Dr. Faustus."
      },
      {
        "name": "Cambridge Circle Grove",
        "description": "An MIT&T group of nature-oriented magicians, neopagans and shamans, including mundane members; Raven says full magical talent is a minority within the Grove."
      }
    ],
    "harvard": "Raven depicts nearby Harvard University as more focused on liberal arts, business and management than MIT&T, while still offering magical studies and computer science. He highlights Harvard's corporate graduate network, MBA program and academic collaboration/rivalry with MIT&T, while making clear that his comparison reflects his own viewpoint.",
