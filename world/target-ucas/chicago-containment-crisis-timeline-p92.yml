data:
  section: 'Game Information — Chicago: Oblivion’s End? and Timeline'
  source_context: 'Original FASA Corporation Target: UCAS (FASA7214, ©1997), fictional Shadowrun Second Edition-era
    tabletop RPG, printed pp92/PDF pp93.'
  source_substance:
    game_context: The source warns this chapter provides changes and optional campaign directions rather than
      replacing the older Bug City sourcebook. Games may choose which developments affect their version of
      Chicago.
    august_2055: Insect-spirit manifestations and accumulating evidence of a Chicago hive lead to a failed
      Knight Errant assault and an outbreak. Ares then detonates a subtactical nuclear device in the hive (the
      Cermak Blast). The UCAS government quarantines the Containment Zone, publicly invoking the VITAS plague,
      and UCAS Army, National Guard and Knight Errant guard its wall. Hive size is described as possibly the
      largest in North America, not proven.
    year_2057: The blockade largely persists as attention turns to presidential politics. After Dunkelzahn’s
      election and assassination, political pressure over Chicago continues.
    february_2058: Ares scientists produce the Strain-III Beta batch. Without President Haeffner’s prior approval,
      Damien Knight orders Operation Extermination and Knight Errant distributes bacteria into the Containment
      Zone on February 22. The operation destroys many insect-spirit hives but also harms other astrally active
      beings. Ares withdraws troops; President Haeffner formally ends quarantine amid a major refugee flight
      and local panic.
    post_quarantine: Despite formal termination of quarantine, Chicago remains socially and practically isolated.
      The source says changes do not make Bug City obsolete.
