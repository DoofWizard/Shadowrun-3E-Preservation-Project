{"id":"world.target_ucas.arthur_vogel_ares_sierra_p63_64","record_type":"world","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"63-64","pdf_pages":"64-65","edition_scope":"Historical fictional Shadowrun tabletop-RPG source; FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era setting; no inferred Third Edition mechanics.","content_class":["world_fact"],"data":{"section":"Detroit — Who’s Who — Arthur Vogel","identity_and_career":"The fictional sourcebook identifies Arthur Vogel as a former UCAS presidential candidate, ecological attorney, director of Sierra Inc., and member of Ares Macrotechnology’s board after Dunkelzahn’s will awarded him a board position and directorship of Sierra Inc. The narrator describes him as an experienced environmental lawyer who brought suits against corporations, including Ares, for alleged ecological harm and injury.","board_position":"The narrator says Vogel’s arrival on the Ares board has antagonized both Damien Knight and Leonard Aurelius. Vogel describes his strategy as reforming the corporation from within by scrutinizing operations and promoting environmentally friendlier projects. He has reportedly achieved a few smaller changes but lacks voting power for major reform without substantial allies.","alliance_rumor":"The source’s narrator introduces with “Word has it” an unverified possibility that Leonard Aurelius is cultivating Vogel’s support for a later board coup in exchange for backing some ecological proposals; it also says Vogel has not committed himself. The proposed alliance is a rumor, not a settled arrangement.","motives":"Vogel’s ecological ideals and choice to influence Ares internally are presented as his positions; hostile observers claim opportunism, and their claims are separately attributed.","source_voice":"This is fictional 2050s Shadowrun setting history from a published 1997 sourcebook, not an allegation about any real current company official."},"headline":"Fictional Shadowrun tabletop RPG source archive — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition era), printed 63-64/PDF 64-65: Detroit — Who’s Who — Arthur Vogel","summary":"Original-page-reviewed archival world_fact material from the fictional tabletop-RPG sourcebook Target: UCAS (FASA Corporation, FASA7214, 1997, Second Edition-era), printed 63-64/PDF 64-65. In-world narrator facts, named attributed allegations and uncertainty are kept distinct.","framing":"newsroom_neutral"}
