  "data": {
    "source_context": "FASA Corporation's fictional Shadowrun tabletop RPG book Target: UCAS (FASA7214, 1997, historical Second Edition era), printed 98-99/PDF 99-100.",
    "community_and_legal_history": "The book's fictional narrator describes ghouls as often marginalized, with a few living openly among other people, some using cybernetic eyes or plastic surgery to conceal distinguishing traits. Illinois' Special Order 162, passed in 2053, gave Chicago ghouls legal protection and created the Cabrini Refuge, then was repealed under pressure in 2054. Tamir Grey, a ghoul spokesperson trapped in the Containment Zone, had accounts of his relief work smuggled out in 2057; these reportedly increased public sympathy without eliminating widespread hostility.",
    "impact_of_operation_extermination": "Ares' broad release of Strain-III Beta in the Chicago Containment Zone harmed dual-natured ghouls along with insect spirits. Few ghouls at Cabrini Refuge survived. The resulting deaths became a cause for the newly founded Ghoul Liberation League and the Metahuman Rights and Empowerment Coalitions; the book distinguishes public sympathizers from militant participants.",
    "diversity_and_prejudice": "The source explicitly rejects the idea that all ghouls are mindless predators. It says that most retain an ability to function in society, while also describing substantial variation in physical and mental functioning and social acceptance. Its narrator notes fear of infection and a history of dangerous stereotypes. Some socially adapted ghouls use implants to compensate for their poor non-astral vision.",
    "diet_and_medical_uncertainty": "The fictional text states that ghouls require roughly 1 percent of their body weight in metahuman flesh each week for nutrition but may eat substantial amounts of other raw meat; cooked meat can cause illness. Research aimed at synthetic substitutes remains unsuccessful at the date of publication. The explanation involving a metaphysical component of their diet is expressly a popular theory, not a scientific certainty.",
    "disease_and_heredity": "The book reports a change from older goblinization explanations to identifying the communicable Krieger strain of HMHVV as a cause of ghoul transformation. Stories of transmission between people are described, but it says unconfirmed reports of deliberate reproduction by infection remain uncertain, and that most ghoul children are born already infected without proving the pathogen is necessarily inherited.",
    "image_and_source_scope": "The printed p98/PDF99 ghoul illustration accompanies the fiction's rules and social history. These are invented-world sourcebook claims; no real persons, biological diagnosis, or medical advice is asserted."
