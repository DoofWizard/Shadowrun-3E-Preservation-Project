{"id":"world.target_ucas.detroit_auburn_blight_history_p58_59","record_type":"world","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"58-59","pdf_pages":"59-60","edition_scope":"Historical fictional Shadowrun tabletop-RPG source, FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era setting; no inferred Third Edition mechanics.","content_class":["world_fact"],"data":{"section":"Detroit - What's Where, The Auburn Blight","historical_economy":"Auburn Hills formerly housed Chrysler Corporation's North American headquarters and supported local employment and municipal revenue. In 2038, after Chrysler incurred unsustainable losses and Nissan negotiated an alternative to takeover, the companies merged as Chrysler-Nissan. The merged corporation moved its North American headquarters to San Francisco, closed Auburn facilities and dismissed most employees; senior management was largely relocated. The narrator identifies the resulting unemployment as a major contributor to Auburn's continuing depression.","social_conditions":"The sourcebook narrator describes the former industrial district as a devastated low-income community with castoffs, Chicago refugees and other residents unable to relocate. The narrator says some residents work for the Mafia dealing BTL 'beetles', undertake shadowrunning work, or try out for the Detroit Nightmares Urban Brawl team.","security_and_redevelopment":"Corporate security organizations adopt a 'containment policy' toward the district, concentrating on limiting spillover into the surrounding Oakland County neighborhoods rather than addressing all activity within the Blight. Private neighborhood-security service contracts increased by about 35 percent over the decade described; the narrator identifies HardCorps Inc., an Ares Macrotechnology subsidiary, as the largest provider and notes its relationship with Knight Errant.","urban_brawl":"Urban Brawl is portrayed as popular in abandoned Auburn industrial facilities. The Detroit Nightmares team is associated with Auburn and draws about half its players from the district. Team performance, sponsorship and prohibited-equipment allegations belong in separately attributed Shadowtalk.","scope":"The fictional publication's social conditions and corporate relationships are reported as source-period setting facts; they are not claims about actual 1997 companies."},"headline":"Fictional Shadowrun tabletop RPG archive - FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition era), printed 58-59/PDF 59-60: Auburn Blight, Chrysler-Nissan and HardCorps","summary":"Source-reviewed fictional 2050s Detroit material from FASA Corporation's historical Second Edition-era Target: UCAS (FASA7214, 1997), printed 58-59/PDF 59-60. Narrator statements, named in-world claims and uncertainty are distinguished.","framing":"newsroom_neutral"}
