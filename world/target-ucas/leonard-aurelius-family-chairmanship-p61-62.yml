{"id":"world.target_ucas.leonard_aurelius_family_chairmanship_p61_62","record_type":"world","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Historical Second Edition-era Shadowrun fictional tabletop-RPG sourcebook; no assumed Third Edition mechanics"},"printed_pages":"61-62","pdf_pages":"62-63","edition_scope":"Historical fictional Shadowrun Second Edition-era setting, FASA Corporation Target: UCAS (FASA7214, 1997); no inferred Third Edition conversions.","content_class":["world_fact"],"data":{"section":"Detroit / Who’s Who / Leonard Aurelius","succession":"The sourcebook describes Leonard Aurelius as heir to Nicholas Aurelius’s family fortune and former Ares Macrotechnology board chairman. At age 57 he is described as younger than Damien Knight. He was a 29-year-old University of Chicago graduate and business-world rising figure when he succeeded Nicholas as chairman; Nicholas had given him control of the Chicago division while Leonard was at school.","early_management":"The narrator says Leonard initially led Ares competently and cautiously, but avoided many risks during his first three years as chair and slowed some expansion. It reports Knight’s takeover in 2033 and Leonard’s subsequent board and shareholder position. Leonard’s attempt to regain chairmanship by proxy maneuver in 2049 is discussed as a failed bid, not a successful change of control.","later_role":"After Knight took control, Leonard retained enough shares to remain a major shareholder and to have a board voice. The source says the position forced a continuing relationship with Knight despite their rivalry.","family":"Leonard met his wife Susan in Chicago. The source gives their three children as Nicholas (25), Sharon (23) and Evelyn (19). Nicholas works as a manager in AresArms, Sharon as a programmer for Ares Matrix-services, and Evelyn as guitarist with Detroit band Unholy Machine, using the stage name Eve Night. The narrator depicts Evelyn as independent of Leonard’s business expectations.","certainty":"Ages, jobs and relationships are those stated by the historical fictional publication; claims about covert family leverage are retained separately as attributed commentary."},"headline":"Fictional Shadowrun tabletop RPG source archive: FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition era), printed pp61-62/PDF 62-63 — Leonard Aurelius: Ares succession and family","summary":"Independent original-page review of FASA Corporation’s fictional Second Edition-era Shadowrun book Target: UCAS (FASA7214, 1997), printed 61-62, PDF 62-63. Narrator-established information and attributed in-world statements are distinguished; no Third Edition conversion is inferred.","framing":"newsroom_neutral"}
