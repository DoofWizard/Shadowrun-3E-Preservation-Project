  "data": {
    "section": "Boston — The Hub: The Rox; Local Gangs; Urban Tribes",
    "setting": "The Rox, southwest of Boston's downtown, is identified in the fictional source as an impoverished Combat Zone with high crime, violence, corporate neglect and marginalized communities. The district has also housed adult-book stores, sex workers, strip clubs, pornographic entertainment venues, bars, and other illegal or semi-legal businesses; some nightclubs attract visitors seeking dangerous nightlife.",
    "local_gangs": "Numerous groups claim territory and extract money from neighborhood businesses. Major organizations named are the Ancients, the Cutters, the Bane-Sidhe, the Roxx and Mama's Boys. The section describes gang violence without endorsing it.",
    "ancients": "The Boston Ancients have approximately fifty or sixty members, a relatively small chapter, and hold western Rox territory along the highways and toward Route 95. The narrator says they sometimes attack elven rivals or are targeted by the Irish Bane-Sidhe.",
    "bane_sidhe": "The Bane-Sidhe are predominantly Irish and resent elves. They hold the southernmost South Boston and Rox border area and sometimes serve the Knights of the Red Branch as messengers or auxiliaries, a claim framed as street rumor rather than verified universal membership.",
    "cutters": "A relatively small Boston Cutters chapter, about a dozen members, operates sophisticated high-value theft and fencing rather than extensive street rackets, with comparisons to Seoulpa Rings.",
    "roxx": "The Roxx gang occupies central parts of the Rox's Combat Zone, with members from various ethnic and metahuman backgrounds; the source describes its role as a local working team and expendable associates of the Boston Mafia, particularly in work the family avoids performing itself.",
    "mamas_boys": "Mama's Boys answer to a mysterious fixer called Mama and are mostly orks and trolls, with other metahumans represented. The source presents ghoul membership as an unverified rumor and some alleged ghoul relationships as Shadowtalk testimony rather than unequivocal narrator facts.",
    "urban_tribes": "Distinct from territorial gangs, small urban tribes in the Rox live in abandoned buildings, rebuild discarded technology, scavenge materials and cultivate communal, nature-and-city-spirit identities. They often avoid organized conflict but may dispute space with gangs. The text presents several groups with Celtic, Native American and other traditions, not one uniform spiritual system.",
    "community_and_safety": "The broader neighborhood is diverse; the record does not equate ethnic, religious or metahuman identity with gang membership or imply all residents are engaged in crime.",
    "mechanical_scope": "No new dice-based rules are supplied in this neighborhood overview."
  },
