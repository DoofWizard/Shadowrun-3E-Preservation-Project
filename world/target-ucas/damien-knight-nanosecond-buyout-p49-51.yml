{"id":"world.target_ucas.knight_nanosecond_buyout_p49_51","record_type":"world","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"49-51","pdf_pages":"50-52","edition_scope":"Historical fictional Shadowrun tabletop-RPG source from FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era setting; not Third Edition mechanics.","content_class":["world_fact"],"data":{"section":"Detroit - The Nanosecond Buyout and Ares control","introduction":"The source portrays Damien Knight's 2033 arrival at Ares through the Nanosecond Buyout as sudden, highly coordinated stock-market trading.","transaction":"Ares directors learned that Damien Knight had amassed 22 percent of Ares Macrotechnology stock. Leonard Aurelius called an emergency board meeting, but absent shareholders' proxies had passed to Knight. Knight attended uninvited and persuaded the board to install him as CEO and chairman, despite his not possessing an outright majority of all voting shares.","tenure":"From 2033 until 2049 Knight controlled Ares as CEO and chairman, broadening its operations. The narrator names Ares Arms and Knight Errant as important subsidiaries that grew under his leadership.","opposition":"Leonard Aurelius retained a major stake, bought additional shares through intermediaries and front companies, and tried to rebuild voting control while Knight expanded Ares. In 2049 Leonard used his stock leverage to displace Knight from the chairmanship but did not dislodge him as Ares president and CEO.","gavilan":"The narrator describes Gavilan Ventures as a holding company that controlled approximately 12 percent of Ares stock. Its beneficial owner was Dunkelzahn, and the voting proxies could swing control between the two opposing 22-percent blocs. Gavilan's influence persisted until the dragon's death.","later_control":"The narrative on printed p53 states that after Dunkelzahn's death, Nadja Daviar transferred all of Gavilan's voting proxies to Knight; this produced effective control of 34 percent of Ares stock. Knight then removed Aurelius and regained the board chair.","dating":"The 2033 buyout, 2049 displacement and later post-assassination proxy transfer are distinct historical moments in the setting; the 34-percent figure is the narrator's effective voting control, not a claim that Knight personally purchased all these shares."},"headline":"Fictional Shadowrun tabletop-RPG archive - FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 49-51/PDF 50-52: Detroit - The Nanosecond Buyout and Ares control","summary":"Independently source-reviewed historical fictional Shadowrun publication record from FASA Corporation's Target: UCAS (FASA7214, 1997), printed 49-51/PDF 50-52. Book-narrator statements, named in-world claims, and speculation remain distinguished.","framing":"newsroom_neutral"}
