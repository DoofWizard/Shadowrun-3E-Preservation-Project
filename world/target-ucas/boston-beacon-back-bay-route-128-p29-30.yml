    "beacon_hill": "The article locates old-money Beacon Hill between the Charles River, Mount Vernon Street and Cambridge Street, and describes its colonial-European architecture, expensive brownstones and long-established families. It states that many residents work in management roles at the East Coast Stock Exchange (ECSE) or Boston corporations.",
    "back_bay": "According to the sourcebook, the relocated ECSE contributed to Back Bay housing, retail and office growth for middle-income families and white-collar professionals. The neighborhood contains bars, clubs, small theaters and parks. Tenant associations collectively fund private neighborhood security, frequently Knight Errant. The Prudential Center provides offices for smaller corporations.",
    "route_128": "The article places the high-technology Route 128 corridor along the outer Boston area north of downtown and Cambridge, where Route 95 becomes Route 128. It describes businesses from small startups to AAA megacorporations, including Matrix, computing, biotechnology and other research activities.",
    "corporate_environment": "The sourcebook characterizes corporate facilities in this fictional district as extraterritorial, with extensive electronic, magical, biological and physical security. Its setting account also reports frequent shadowrunner activity among Route 128 corporations, including fictional corporate espionage and rivalries; these are setting facts, not real-world recommendations."
