  "data": {
    "section": "Boston — The Hub: Unique Attractions / Boston Harbor and the Toxic Tea Party",
    "environmental_history": "The fictional sourcebook describes Boston Harbor and the surrounding shoreline as severely polluted from decades of neglect. It identifies the 2053 “Toxic Tea Party” spill as a major additional disaster: a United Oil tanker with damaged guidance systems ruptured its hull and discharged millions of gallons of petrochemicals into the harbor.",
    "ecological_effects": "The narrator reports extensive mortality of marine life and unusual mutations in surviving organisms, with occasional carcasses of atypical sea creatures washing ashore. Pollution is described as an ongoing ecological and magical concern.",
    "restoration_work": "Biotechnology firms are developing toxin-resistant plant and animal strains for ecological restoration. Some marine biologists worry that modified algae and other organisms could destabilize Massachusetts Bay. Other companies are investigating contaminant-consuming microorganisms and algae intended to die after cleaning water.",
    "toxic_magicians": "The narrator reports that toxic shamans have appeared around the harbor, with some attempting to spread contamination and others retaliating for ecological harm. It describes painful proximity to polluted waters for some nature-oriented magicians, but supplies no numeric modifier or formal magic-test rule here.",
    "aquarium": "The New England Aquarium is depicted as a famous marine exhibit and research center, displaying marine specimens including mermaids, leatherbacks, torpedo sharks, unicorn fish and devilfish. It participates in research intended to clean the harbor and repopulate the coastal ecosystem.",
    "attribution_limit": "The possibility that a toxic shaman intentionally caused the 2053 tanker accident is only a later in-world commenter’s speculation, not the narrator’s established cause. Source contents are historical fiction, not statements about real Boston."
  },
