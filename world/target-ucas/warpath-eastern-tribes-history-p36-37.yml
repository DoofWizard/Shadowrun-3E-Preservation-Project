    "section": "Boston — The Hub: Warpath, fictional alternate-history narrator account",
    "treaty": "After the Indian Wars ended and the Treaty of Denver created the Native American Nations (NAN), Native American communities with ancestral territories east of the Mississippi felt excluded when the former United States and Canada refused to cede those lands. Some argued for continuing the Ghost Dance until non-Native peoples were driven from the continent. The book says Howling Coyote secured acceptance of the treaty compromise and proposed incorporating eastern tribes into the NAN.",
    "post_rebellion_reservations": "After the Ghost Dance Rebellion, the United States abolished reservations on U.S. soil, including in New England, seized territory there, and gave residents only 24 hours to vacate for transportation to NAN territory or face arrest. These were involuntary forced removals, not voluntary relocation. The book says the government avoided repeating the most notorious abuses associated with re-education camps chiefly because it feared another Ghost Dance.",
    "ancestral_sites": "The narrator describes persistent disputes over eastern tribal ancestral sites, including lands later desecrated by successor governments and unresolved pressure on the NAN Sovereign Tribal Council. Military, economic and social concerns made these disputes a lower priority for that body.",
    "connecticut_2040": "In 2040 a Connecticut casino occupying a former tribal reservation site was struck by an explosion the narrator calls a ritual-magic bomb. Eighteen people died and others were injured. A group calling itself Warpath claimed responsibility, saying the attack concerned seized ancestral lands; the account distinguishes claiming responsibility from independent verification of every perpetrator's identity.",
    "nan_response": "NAN governments denied involvement, and the tribal council promised to cooperate with the UCAS investigation. The setting narrator says UCAS officials later accepted the NAN denial, while tensions over the issue remained.",
    "source_context": "Fictional UCAS and NAN alternate history in FASA7214, not an assertion about actual contemporary governments or real-world incidents."
  },
