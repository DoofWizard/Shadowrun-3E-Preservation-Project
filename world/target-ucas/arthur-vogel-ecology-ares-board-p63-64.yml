ign context and are preserved separately as in-world commentary."},"headline":"Fictional Shadowrun tabletop RPG source archive: FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition era), printed pp63-64/PDF 64-65 — Arthur Vogel: ecology lawyer and Ares board member","summary":"Independent original-page review of FASA Corporation’s fictional Second Edition-era Shadowrun book Target: UCAS (FASA7214, 1997), printed 63-64, PDF 64-65. Narrator-established information and attributed in-world statements are distinguished; no Third Edition conversion is inferred.","framing":"newsroom_neutral"}
