data:
  source_publication: 'FASA Corporation, Target: UCAS (FASA7214, 1997), historical fictional Shadowrun Second Edition-era
    tabletop RPG, printed p22/PDF p23; not an implicit Third Edition conversion.'
  article: Family of Nations — post-Dunkelzahn Aztlan diplomatic dispute
  source_voice: Bylined in-world geopolitical narration (Family of Nations); legal and diplomatic characterizations are
    in-world claims, not real-world findings.
  posthumous_will: Dunkelzahn’s posthumous will promised large rewards for delivery of practitioners of blood magic; the
    Draco Foundation, rather than the UCAS government, administers the controversial rewards.
  aztlan_response: Aztlan’s government treated the rewards as a threat and protested the practical implications for persons
    in Aztlan. The book describes tensions between Aztlan and UCAS leadership.
  haeffner_position: President Haeffner said he would not condone UCAS citizens committing crimes against Aztlan citizens
    and would prosecute offenses. He maintained that the rewards were from a private Draco Foundation, not the UCAS government;
    Aztlan leaders rejected that distinction.
  research_dispute: Aztlan leaders opposed foreign expeditions into its territory, including interest in archaeological
    investigations concerning the dragon’s estate. The narrator describes accusations that the UCAS supported Yucatán rebels;
    the allegations are not verified military findings.
  border_effects: The narrative reports that heightened border security increased demand for intermediaries to move visitors
    without unwanted attention, as source-world context, not an operational procedure or recommendation.
