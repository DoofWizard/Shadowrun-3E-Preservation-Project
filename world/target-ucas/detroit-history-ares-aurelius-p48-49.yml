{"id":"world.target_ucas.detroit_history_ares_aurelius_p48_49","record_type":"world","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"48-49","pdf_pages":"49-50","edition_scope":"Historical fictional Shadowrun tabletop-RPG source from FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era setting; not Third Edition mechanics.","content_class":["world_fact"],"data":{"section":"Detroit - Welcome to Motor City, History, King Ares","voice":"The fictional Shadowland narrator Squire recounts Detroit's history and the emergence of Ares as a major force in the city.","metro_history":"Squire locates the original French trading post of Antoine de la Mothe Cadillac at the later Civic Center and recounts French, British and American control before the UCAS period. The account refers to Henry Ford's invention of the automobile and Detroit's rise as the automobile-industry center.","decline":"The narrative describes increased competition from Japanese carmakers, cuts and layoffs, followed by corporate downsizing, the Ghost Dance Rebellion, the Awakening and the Treaty of Denver, creating economic disruption. It says Nissan acquired Chrysler in the early twenty-first century and shifted much manufacturing elsewhere; Ford and General Motors also moved facilities. Detroit faced unemployment, population movements, overcrowding and growing violence.","nicholas_origin":"Nicholas Aurelius, a former General Motors employee, bought smaller businesses and combined them into Ares Industries in the early twenty-first century. Squire describes his public reputation as a decisive businessman willing to accept major risks and says Ares reached the Fortune 50 within a few years.","nasa_purchase":"During the fictional setting's 2016 privatizations, Ares bought the NASA space program, including launch facilities, shuttle fleet, Hubble telescope and orbiting Freedom space station; the narrator says the transaction cost multiple billions of dollars, without claiming an exact amount.","aerospace_expansion":"Ares and Lloyds of London funded a mission to stabilize Freedom's orbit and retrieve satellites and space equipment for fees. Ares expanded regular shuttle services and became a dominant aerospace-sector firm within a short period; the narrator describes additional acquisitions and the corporate group's rising market position.","corporate_court":"The narrative states that Ares joined the group that established the International Corporate Court and sold the renovated Freedom station to the Zurich-Gemeinschaft Bank; Freedom became the home of the Zurich-Orbital Bank and Court.","succession":"Nicholas Aurelius retired as CEO and chairman in 2030, age 64, and transferred control to son Leonard. He intended to travel to the Daedalus space platform for rejuvenation therapy but died of a fatal heart attack around eight months later. By 2033, Leonard controlled one of the world's five most powerful corporations.","fidelity":"All dates and institutional descriptions belong to FASA's fictional Shadowrun historical setting, not real-world corporate history."},"headline":"Fictional Shadowrun tabletop-RPG archive - FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 48-49/PDF 49-50: Detroit - Welcome to Motor City, History, King Ares","summary":"Independently source-reviewed historical fictional Shadowrun publication record from FASA Corporation's Target: UCAS (FASA7214, 1997), printed 48-49/PDF 49-50. Book-narrator statements, named in-world claims, and speculation remain distinguished.","framing":"newsroom_neutral"}
