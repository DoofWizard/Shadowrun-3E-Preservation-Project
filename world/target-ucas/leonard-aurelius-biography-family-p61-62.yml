{"id":"world.target_ucas.leonard_aurelius_biography_family_p61_62","record_type":"world","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"61-62","pdf_pages":"62-63","edition_scope":"Historical fictional Shadowrun tabletop-RPG source; FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era setting; no inferred Third Edition mechanics.","content_class":["world_fact"],"data":{"section":"Detroit — Who’s Who — Leonard Aurelius","identity_and_career":"The fictional source narrator identifies Leonard Aurelius, age 57, as Nicholas Aurelius’s son and the former Ares board chairman. He graduated from the University of Chicago and took over from his father at age 29, having held an Ares Chicago office position while at school. The narrator says his father encouraged him to work through the corporate ranks. He is described as more cautious than Nicholas about corporate expansion.","control_contest":"Following Damien Knight’s takeover of Ares in 2033, Leonard spent years assembling a proxy campaign that restored him to the chairmanship in 2049; the narrator says he subsequently lost the chair to Knight again. Nonetheless, Leonard retains sufficient stock and influence to sit on the board as a major shareholder and Knight cannot simply remove him. His ongoing interest in restoring control is depicted as motive, not a completed future coup.","family":"Leonard met his wife Susan in Chicago. Their children are Nicholas (25), Sharon (23), and Evelyn (19) in the publication’s setting chronology. Nicholas manages an AresArms division; Sharon programs for Ares Matrix Services; Evelyn plays guitar with the fictional Detroit band Unholy Machine under the stage name Eve Night (the narrator specifically notes that the name is written without the letter K).","certainty":"The source distinguishes its main biographical narrative from named posters’ disputed claims about Nicholas Aurelius’s parenting, the family’s bodyguards, Leonard’s intentions and Damien Knight’s involvement; those claims are archived separately."},"headline":"Fictional Shadowrun tabletop RPG source archive — FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition era), printed 61-62/PDF 62-63: Detroit — Who’s Who — Leonard Aurelius","summary":"Original-page-reviewed archival world_fact material from the fictional tabletop-RPG sourcebook Target: UCAS (FASA Corporation, FASA7214, 1997, Second Edition-era), printed 61-62/PDF 62-63. In-world narrator facts, named attributed allegations and uncertainty are kept distinct.","framing":"newsroom_neutral"}
