{"id":"world.target_ucas.detroit_dragon_riots_p52_53","record_type":"world","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"52-53","pdf_pages":"53-54","edition_scope":"Historical fictional Shadowrun tabletop-RPG source from FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era setting; not Third Edition mechanics.","content_class":["world_fact"],"data":{"section":"Detroit - The Dragon Riots and Ares intervention","event":"The fictional UCAS was shaken by violent unrest after Dunkelzahn's assassination near the Watergate Hotel in August. Squire reports that parties celebrating the dragon's presidential victory became riots following the news of his death.","conflict":"Within the setting, people blamed different groups for the assassination: some humans blamed metahumans, some metahumans blamed humans, and other factions assigned blame to the Awakened, mundanes, archconservatives or New Centurists. These are opposing in-world accusations, not established perpetrators.","detroit":"Detroit experienced severe rioting. Squire attributes the local unrest to fear over Dunkelzahn's death, anger over economic conditions, friction with Chicago refugees and other accumulated grievances.","military_response":"Knight Errant deployed riot-control forces and drew reinforcements from Ares Arms, described as Ares's military branch. At the request of Kyle Haeffner, while Knight was in Washington consulting UCAS officials, additional Ares security and military forces were sent to trouble spots in the UCAS.","methods":"The source names Ares armored personnel carriers and light armored vehicles transporting riot-control personnel, and describes use of tear gas, water cannons, sleep spells and air and water spirits to disperse violent crowds. These are narrative depictions of fictional security conduct, not operational instructions.","outcome":"The narrator portrays a restoration of public order and a large publicity benefit for Ares. The following week, Nadja Daviar's transfer of Gavilan voting proxies to Knight helped him regain the Ares chairmanship, as separately recorded in the Nanosecond Buyout chronology.","later_uncertainty":"Squire describes continuing opposition within Ares from Leonard Aurelius and Nadja Daviar and competing corporations' interests as future threats to Knight's dominance, rather than certainties about later events."},"headline":"Fictional Shadowrun tabletop-RPG archive - FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition-era), printed 52-53/PDF 53-54: Detroit - The Dragon Riots and Ares intervention","summary":"Independently source-reviewed historical fictional Shadowrun publication record from FASA Corporation's Target: UCAS (FASA7214, 1997), printed 52-53/PDF 53-54. Book-narrator statements, named in-world claims, and speculation remain distinguished.","framing":"newsroom_neutral"}
