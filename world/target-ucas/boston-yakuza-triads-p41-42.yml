    "section": "Boston — The Hub: The Yakuza and The Triads",
    "yakuza": "The fictional guide identifies Yakuza operations in Boston as largely restricted to Japanese corporate environments, including major high-technology employers and their neighborhoods. The section identifies Mitsuhama Computer Technologies as a likely vector for larger Yakuza influence, while treating the exact future threat as uncertain. It notes Renraku and Fuchi as other Japan-linked corporations active in Boston.",
    "limits_and_rivalry": "The narrator says the Yakuza have not attempted to displace the dominant Mafia in the broader metropolis. Some commercial illegal markets in corporate enclaves are said to operate with executives’ or managers’ tolerance; a direct open mob conflict is presented as a possibility rather than an accomplished event.",
    "triads": "The book locates Boston’s Triad operations around Chinatown between downtown and South Boston. It states that the organizations publicly depict themselves as defenders of traditional Chinese values while coercing local businesses and fostering hostility toward police and city authorities. This is the source’s description of a specific criminal organization, not a characterization of Chinatown residents generally.",
    "community_and_attribution": "The narrator distinguishes Chinatown businesses and residents from criminal organizations, while describing the groups’ efforts to monitor nightlife and obstruct investigations. No new numeric game rules appear in these sections."
