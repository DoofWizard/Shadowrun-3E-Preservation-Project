{"id":"world.target_ucas.detroit_windsor_history_casinos_p56","record_type":"world","status":"reviewed","source":"source.fasa-7214","publication":{"title":"Target: UCAS","publisher":"FASA Corporation","catalog_number":"FASA7214","publication_year":1997,"historical_edition":"Shadowrun Second Edition-era fictional tabletop-RPG sourcebook; no inferred Third Edition conversion"},"printed_pages":"56","pdf_pages":"57","edition_scope":"Historical fictional Shadowrun tabletop-RPG source, FASA Corporation, Target: UCAS (FASA7214, 1997), Second Edition-era setting; no inferred Third Edition mechanics.","content_class":["world_fact"],"data":{"section":"Detroit - What's Where, Windsor","historic_link":"Before UCAS formation, Windsor and Detroit had a close cross-border relationship. The Detroit-Windsor Tunnel linked downtown Detroit to Windsor's Casino district, where Detroit residents and visitors traveled for gambling.","union_day":"Upon Union Day, when what remained of the United States and Canada formed the United Canadian American States, Windsor joined Detroit. City officials petitioned the UCAS government to preserve legal gambling and prohibit organized gambling establishments in Detroit proper. The publication describes this regulatory distinction as important to Windsor's visitor economy.","metroplex_2036":"As the district grew economically dependent on Detroit public services and Detroit tax income from Windsor's casinos, Windsor formally became part of the Greater Detroit Metropolitan Complex in 2036.","visitor_economy":"The narrator describes Windsor Casino, Windsor Raceway and the Northern Belle Casino, a permanently docked riverboat casino. The first uses modern high-technology games and poker, blackjack and roulette. The Northern Belle emphasizes older-style gaming. The casinos and raceway attract affluent visitors and corporate guests and also employ low-wage labor.","political_groups":"The True Canadians are presented as a small separatist political organization seeking an independent Windsor and greater representation for former Canadian provinces and cities in UCAS government. Former members formed a smaller First Canadians group seeking secession of former Canadian provinces, though the members disagree about whether to reunite with Quebec. The narrator reports public political actions by True Canadians, with larger conflict claims attributed separately.","scope":"This entry preserves the fictional 1997 Shadowrun publication's political history, not real-world Canadian or U.S. events."},"headline":"Fictional Shadowrun tabletop RPG archive - FASA Corporation, Target: UCAS (FASA7214, 1997, Second Edition era), printed 56/PDF 57: Windsor integration, casinos and political organizations","summary":"Source-reviewed fictional 2050s Detroit material from FASA Corporation's historical Second Edition-era Target: UCAS (FASA7214, 1997), printed 56/PDF 57. Narrator statements, named in-world claims and uncertainty are distinguished.","framing":"newsroom_neutral"}
