    source_pdf_sha256: ebe687016c4921013e3c58679d44f36a339e734935ff9ed18c69400d578e2e2e
  editorial_method: Source-reviewed neutral reference record from a FICTIONAL tabletop
    RPG; narrator, named allegations and optional scenarios remain separate.
  rite_of_progression:
    role: An institutional process that determines the social rank of Tír subjects.
      Residents are expected to undergo at least one Rite, on reaching majority or
      after immigrating.
    schedule: Every seven years, on or near May 1. The first occurred May 1, 2036;
      the most recent described took place in 2050; next planned for 2057.
    officer: Conducted under the Proctor of the Rite, a largely ceremonial and patronage
      appointment made by the Council of Princes; James Brennan is identified as incumbent.
    parts: 'Two components: computerized bureaucratic testing and a series of physical
      sporting contests called the Games. Lobbying also affects final classifications.'
  bureaucratic_testing:
    format: Candidates take one-on-one computer examinations over two to three days
      covering fictional nation history, general knowledge, mathematical ability,
      logic, personality measures and IQ.
    confidentiality: Candidates get an overall grade but not individual answers, marking
      criteria, or a precise calculation of the grade. The Bureau of Standards computer
      system administers and stores results.
  physical_games:
    participation: Seven eligible events; candidates select four, from which the Proctor
      and staff assign three competitive events.
    seven_events:
    - sprint running (100–250 m heats)
    - cross-country footrace (15 km overall route)
    - wrestling, using a Greco-Roman-derived style
    - javelin
    - hammer-throwing
    - swimming (50–200 m heats)
    - acrobatics/tumbling (three-minute floor program)
    safety_and_equity: The narration says the Proctor’s staff pairs appropriate competitors
      and requires weapons-like offensive implanted cyberlimb attachments to be disabled
      before physical contests. Candidates are scored for effort and participation
      as well as results; computation is confidential.
