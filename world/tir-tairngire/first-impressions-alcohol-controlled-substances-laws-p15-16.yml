  section: Source-period fictional alcohol, intoxication and controlled-substance regulations
  law_enforcement: Source describes a national Tír Tairngire Peace Force as a paramilitary law-enforcement
    institution; a section of the fictional tourism file on police organization is labeled block-deleted.
  driving_and_public_intoxication:
    public_intoxication: misdemeanor
    driving_while_intoxicated: felony
    blood_alcohol_threshold_percent: 0.03
    if_fatality: Source describes death caused by an intoxicated driver as charged as premeditated murder,
      rather than permitting intoxication as mitigation in vehicular manslaughter.
    certainty: fictional in-world rulebook law, not a statement about present-day statutes
  visitor_alcohol_allowance:
    wine_or_beer_liters: 2
    spirits_liters: 1
    choice: either wine/beer allowance or spirits allowance; personal consumption only
  alcohol_retail:
    beer_wine_mead_grocery_hours: 11:00–24:00 daily, independent of store hours
    hard_liquor: government-run licensed outlets
    hard_liquor_sun_thu_hours: 11:00–18:00
    hard_liquor_fri_sat_hours: 11:00–20:00
  tobacco: Fictional tobacco sales limited to government-licensed outlets, customers older than 20.
  controlled_substances: Possession including restricted fictional chips is described as a minor felony;
    possession with intent to deal is a major felony. Severe enforcement is reported.
  editorial_limits: Technical allegations by commenters about illicit devices are kept as claims and are
    not reformulated into practical bypass directions.
