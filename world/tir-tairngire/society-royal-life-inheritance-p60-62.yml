  editorial_method: Source-reviewed neutral reference record from a FICTIONAL tabletop
    RPG; narrator, named allegations and optional scenarios remain separate.
  royal_lifestyle:
    published_view: The fictional source disputes the popular depiction of Royals
      as merely idle beneficiaries of the stipend. It describes pre-existing substantial
      holdings, rental property, corporate interests and responsibilities for estates
      and ceremonial obligations that often exceed the stipend, with other income
      meeting the gap.
    social_customs: The elite organize formal balls and private social gatherings;
      parental arrangements can influence marriages, and the narrator depicts Royal
      society as closely associating within its own class.
    marriage_and_screening: The narration says a Genetic Screening Board must approve
      closely related marriages; it reports exceptional attention even to unions between
      apparently unrelated people if their family records raise concerns.
    pastimes: Some Royal households retain traditional forest hunts, although the
      source says popularity is declining.
  inherited_rank:
    marriage: Only Ducal and Royal spouses automatically acquire the same rank upon
      marriage; at lower ranks, spouses may hold different ranks. A spouse of a person
      elevated into Ducal/Royal rank after the marriage shares the elevated rank.
    children: Children inherit the same-sex parent’s rank (sons from fathers, daughters
      from mothers). At adulthood they undergo the Rite of Progression to confirm
      it. Refusing the next scheduled Rite results in automatic demotion to Gentry
      and loss of associated higher-rank privileges.
