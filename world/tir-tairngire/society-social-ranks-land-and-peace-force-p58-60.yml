  editorial_method: Source-reviewed neutral reference record from a FICTIONAL tabletop
    RPG; narrator, named allegations and optional scenarios remain separate.
  social_ranks:
    structure: 'Published fictional Tir hierarchy orders six citizen ranks: Gentry,
      Chivalry, Noble, Comital, Ducal, Royal. Council of Princes is distinguished
      from Royal rank and a person holding Royal rank is not automatically a member
      of the Council. The narrator identifies rank as consequential for taxation,
      residence, employment and privileges.'
    gentry:
      official_address: Squire, for men and women
      population: Lowest rank, encompassing the great majority of subjects
      tax: Highest social-rank tax burden
      peace_force: Gentry youth must serve one year in the Peace Force immediately
        after the Rite of Passage or on their eighteenth birthday if they do not undertake
        the Rite.
    chivalry:
      address: Sir or Demoiselle
      population: Approximately one-fifth as numerous as Gentry
      peace_force: Youth must serve, inducted as noncommissioned or commissioned officers,
        whereas Gentry enter as privates.
      horses: Subjects below Chivalry cannot legally own horses.
    noble:
      address: Lord or Lady
      property: First rank permitted to own land. Gentry and Chivalry may lease land
        and own buildings on it, but cannot own land. Nobles cannot own revenue-producing
        land such as apartment buildings.
      peace_force: Noble youth must perform a one-year Peace Force term, inducted
        as junior officers; the narration says only those who wish usually enlist.
    comital:
      address: Count or Countess
      property: The narration reports this rank holds most revenue-generating rental
        property in the nation.
      council: Right to request an audience before the Council of Princes, although
        ordinary scheduling may take months.
      peace_force: The law requires Comital youth to serve in the Peace Force, but
        the narration says enforcement is rare.
    ducal:
      address: Duke or Duchess
      property: By law, achieving Ducal rank carries at least twenty hectares of land;
        after loss of the rank in the Rite of Progression or legal discipline the
        former holder immediately forfeits both the land and buildings on it.
      peace_force: Youth at Ducal rank are exempt from compulsory Peace Force service.
    royal:
      address: Prince or Princess
      property: On reaching the Royal rank subjects receive two hundred hectares of
        land; Royal rank carries an annual stipend averaging 44,000 nuyen.
      rights: Members of Ducal or Royal rank may travel outside the Tir freely and
        may seek Council or High Prince audiences subject to social protocol.
  unranked_irenis: The novel-style narration reports that irenis reject the caste
    rituals, so the administration assigns most to Gentry, sometimes Chivalry if supported
    by birth rank; their own system is not officially recognized.
