  section: 'First Impressions: weather and lawful air, road and sea entry routes'
  climate_fictional:
    west_of_cascade_mountains:
      summer_max_celsius: 39
      winter_min_celsius: -20
      annual_coastal_precipitation_mm: 3500
      description: Ocean-moderated mild humid conditions with seasonal coastal fog.
    east_of_cascade_mountains:
      summer_max_celsius: 43
      winter_min_celsius: -37
      annual_precipitation_mm_range:
      - 250
      - 500
      description: More extreme inland seasonal temperatures and drier climate.
  lawful_arrival_by_air:
    main_airports:
    - Morningstar Field — Portland
    - Mahlon Sweet Airport — northwest of Eugene
    - McNary Field — Salem
    published_route_qualification: Mahlon Sweet and McNary are described as short-haul service to neighboring
      Native American Nations; source says no regular scheduled Seattle service to these smaller fields.
  lawful_arrival_by_road:
    highways:
    - name: Highway 5
      direction: South from Seattle across the Columbia River, also north from the California Free State
        toward Yreka
    - name: Highway 84
      direction: North-northwest into the fictional Tír from Caldwell in the Ute Nation
    responsible_agencies: Tír Customs and Immigration Service with separate paramilitary border-security
      responsibility.
  lawful_arrival_by_sea:
    official_port: Astoria, at the mouth of the Columbia River
    source_qualification: The port chiefly handles cargo, and has limited passenger facilities; Portland
      has some passenger port-of-call activity.
  scope: Only the published sourcebook description of fictional travel options; not advice about evading
    any real border or security service.
