  editorial_method: Source-reviewed narrative from a FICTIONAL tabletop-RPG publication;
    book narrator, named in-world allegations and optional scenario material are distinct.
  narrator_account:
  - The fictional legal framework formally prohibits racial discrimination in employment,
    housing, clubs, transit, restaurants, immigration, emigration, tax, prices, public
    office and social advancement. The narrator states these restrictions are poorly
    enforced in practice and often function to the advantage of elves.
  - The narrator says employers must publicly post openings and choose the best-qualified
    candidate. The evidentiary burden imposed on unsuccessful candidates makes prohibited
    discrimination difficult to prove.
  - Landlords and membership committees can decline candidates labeled unfit or unsuitable
    unless the rejected person can prove racial motives.
  - The source describes everyday social prejudice sometimes expressed through feigned
    ignorance rather than overt hostility.
  - Representative office requires election to the Star Chamber from geographic ridings;
    all but Hells Canyon and Malheur are described as predominantly elven. The narrator
    says no predominantly elven riding had elected a non-elf as of the book’s fictional
    reporting date.
