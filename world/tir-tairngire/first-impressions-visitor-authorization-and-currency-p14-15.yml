  section: 'First Impressions: visitor authorizations and monetary system'
  visitor_requirements:
    listed_documents:
    - valid passport from home country
    - medical records and inoculation evidence dependent on origin
    - one-way airline ticket out of the fictional Tír regardless of intended entry route
    - Visitor’s Authorization Visa with photographic identity card
    application_routes: Personal application to a Tír consulate or electronic submission via the fictional
      Matrix Visa Division when supported by the applicant’s origin.
    identity_disclosures: Detailed personal records, including criminal and military records where applicable,
      photograph and retinal data, cyberware/personal enhancement details and stated purpose of travel
      are requested by the fictional government.
    processing_time_weeks:
    - 4
    - 6
    visitor_authorization_validity_days_max: 30
    carry_card_rule: Source says visitor must carry the identity card and display it on request to Tír
      Tairngire Peace Force officers.
    entry_discretion: Entry is considered a privilege rather than a right, and the government may reject
      an application without explanation.
  currency_system:
    official_currency: 'nuyen / newyen (printed term: nuyen)'
    international_standard_relationship: Source describes official national nuyen as compatible with global
      nuyen units.
    usual_payment: Most ordinary transactions use electronic credit, with limited physical currency.
