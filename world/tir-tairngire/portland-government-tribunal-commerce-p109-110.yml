    "book_narrator_facts": [
      "The city of Portland occupies an ambiguous position within the territorial claim of fictional Tir Tairngire; noncitizens can more readily visit and work there than elsewhere in the nation, while the Portland Wall physically separates the city.",
      "A military tribunal governs Portland and administers a modified martial-law regime. The narrator differentiates especially strict enforcement toward perceived outsiders from inconsistent neighborhood coverage.",
      "The current tribunal consists of Lieutenant Colonel Davis Atkins, Lieutenant Colonel David-John Collins and chairman Colonel Jacob FitzWallace of the Border Patrol. It offers little popular representation or legal recourse to dissenting residents.",
      "After a 2052 trade agreement with Seattle reduced Portland commercial importance, the local business sector advocated change but the tribunal resisted measures it believed would reduce Wall gate security.",
      "Kate Mustaffah, a dwarf who emigrated from Europe in 2040, leads the newly formed Portland Business Council, which lobbies the military tribunal through large petitions."
