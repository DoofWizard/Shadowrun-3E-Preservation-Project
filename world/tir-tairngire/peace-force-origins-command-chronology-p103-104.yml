      {
        "when": "After secession",
        "narrator_fact": "The group initially upheld the laws of the Salish-Shidhe Council; Surehand replaced its well-liked first chief, Amerindian John Big Smoke, with Rainer Grundman, a German elf from Berlin."
      },
      {
        "when": "2033-2034",
        "narrator_fact": "The Peace Force expanded under Grundman and established Columbia River training centers, recruited soldiers including immigrants, and accumulated heavy weapons through unspecified corporate sources. The narrator says the public did not recognize the military function at the time."
      },
      {
        "when": "May 2035",
        "narrator_fact": "Salish-Shidhe forces crossing the newly asserted border encountered military fortified staging sites and the Peace Force operated as an army."
      },
      {
        "when": "late 2036",
        "narrator_fact": "The border situation stabilized and military threats diminished; Surehand retained nominal command while Grundman directed the force in practice."
      },
      {
        "when": "2037",
        "narrator_fact": "Grundman formally retired citing illness and died shortly afterward; this is the source narrator account, not confirmation of competing coup allegations."
      },
      {
        "when": "after Grundman",
        "narrator_fact": "Surehand served temporarily as commander-in-chief, reorganized the force into military and constabulary divisions, and appointed Ellya Therese overall commander, General Martha Gardener over constabulary, and General Rory Harty over military."
