    political_position: The narrative considers her the most publicly open of the
      five about disdain for ordinary humans and the “lesser forms,” its in-world
      expression for other metatypes; this is a description of fictional prejudice,
      not a real-world position.
    family: The profile reports no known family.
    associate: Count Gerard McCoy, formerly a civilian on the Board of Military Advisors,
      was once her frequent companion. He disappeared from public view months before
      the cited Shadowland discussion. His alleged death on a secret mission is explicitly
      rumor, not established fact.
