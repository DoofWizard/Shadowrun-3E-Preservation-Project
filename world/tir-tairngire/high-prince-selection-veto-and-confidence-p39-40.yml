    "editorial_method": "Source-reviewed account of a FICTIONAL Shadowrun tabletop-RPG setting. Book-narrator facts, named in-world commentary and optional hypotheses remain separate.",
    "selection": "The Council selects the High Prince from among its members. The selection occurs by secret or open ballots as the Council decides, and requires a unanimous vote. A dissenting vote sends the choice back to the ballot.",
    "tenure": "The High Prince serves for life unless voluntarily relinquishing office; resignation also ends Council membership but does not remove inherited Royal rank.",
    "offices": "The High Prince is head of state, of the executive and legislative branches, and commander in chief of the Peace Force in its military and police functions.",
    "decrees": "The High Prince may issue decrees that otherwise have binding legal effect; the Council can invalidate a decree by a two-thirds majority with every Council member physically present. A member may request the vote, holding the decree until the full vote is convened.",
    "attendance_limit": "For ordinary deferred participation, the source commentary describes a 72-hour response rule after which a missing Prince’s vote is deemed against a requested veto; this constraint is stated in named commentary and should not be treated as narrator-certified statutory language.",
    "national_emergency": "A High Prince may declare a decree a matter of national emergency. The Council cannot immediately veto such an emergency decree, but a later automatic vote of no confidence must occur at the first mutually convenient time.",
    "removing_high_prince": "A Council vote of no confidence against the High Prince requires three-quarters majority with all Princes voting, with up to 72 hours between call and vote. An absent Prince is counted in favor of removal. An ordinary no-confidence ballot is available once per year, with a special request requiring High Prince assent.",
    "council_decrees_and_confidence": "Council-issued decrees require two-thirds ratification; absent Council members have 72 hours to vote, with nonresponse supporting the decree. High Prince veto of a Council decree automatically triggers no-confidence. The Council may remove an individual Prince by simple majority, and the High Prince’s vote counts as five."
