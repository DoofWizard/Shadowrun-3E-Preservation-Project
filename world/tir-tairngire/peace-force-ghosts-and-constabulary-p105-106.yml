    "narrator_facts": {
      "ghosts": "The Tir Tairngire Peace Force special forces are popularly nicknamed the Ghosts. The narrator identifies trained paratroop commandos, physical adepts, and moderately initiated mages among the group, says they are officially based at the Hayden Slough armory and train elsewhere in the nation, and stresses that their exact organization and capabilities are mostly unknown. A claim that they are untested is attributed to conventional wisdom, not proven fact.",
      "constabulary": "The constabulary division enforces Tír law, deploys armored patrol cars and officers with weapons and protective equipment, and maintains dispatch communications. An officer's uniform buckle carries a PANICBUTTON radio and life-sign monitor, described as automatically notifying dispatch when an officer is seriously injured.",
      "identity_demands": "Within the fictional Tír legal system, officers may question and demand personal identification. Refusal is described as punishable by a 1,000-nuyen fine; non-elves are frequently asked for VAV or residency evidence.",
      "searches": "The narrator distinguishes questioning from personal searches, which require probable cause; a person may pursue a civil complaint if improperly searched. Forcible entry and searches of a privately owned building require a warrant, while owners may voluntarily admit officers without creating a duty to do so.",
      "mages": "The police have an unusually high proportion of magically capable officers, including combat mages; the narrator describes use of such personnel for protective duties."
