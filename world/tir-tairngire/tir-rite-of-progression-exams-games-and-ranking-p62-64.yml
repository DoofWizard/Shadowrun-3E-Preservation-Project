    "editorial_method": "Source-image-reviewed FICTIONAL Shadowrun historical tabletop-RPG source. Narrator facts, named fictional comments, rumors, and optional GM material remain separate.",
    "cycle": "The Rite of Progression recurs every seven years around May 1; the most recent cited was 2050 and the next is scheduled for 2057. James Brennan is named as proctor.",
    "academic_examination": "Bureau of Standards administers approximately two or three days of supervised examinations covering history, mathematics, logic, intelligence and personality. Detailed test results are confidential, with only an overall grade communicated.",
    "physical_games": "Applicants list four choices among seven available events; proctor and staff assign three individual events from those four choices. Choices include sprint, 15-kilometre cross-country, wrestling, javelin, hammer throw, swimming (50–200 metres), and a three-minute acrobatics performance.",
    "equipment_access": "Applicants with cyberware are compared with others bearing similar modifications; offensive cyberlimb features must be disabled during competition. Participating and effort are considered beyond raw performance.",
    "lobbying_and_outcome": "Applicants may lobby for promotion from roughly twelve months until three months before the rite. Decisions are announced approximately two weeks afterward: advancement, no change, or demotion. Official decisions bind the applicant without appeal, although the next cycle offers another chance.",
    "applicants": "New adults, immigrants holding provisional Gentry status, and established higher-rank challengers can seek rank assignment; an established challenger risks demotion.",
    "scope": "This is the in-world civil promotion process, not a Shadowrun dice-resolution procedure or an independent real-life recommendation."
