  editorial_method: Fictional Shadowrun tabletop-RPG source, reported in third person;
    narrator, in-world allegations, and optional hypothetical readings are kept distinct.
  narrator_statements:
  - printed_page: 54
    assertion: The founding charter and legal codes prohibit discrimination on the
      basis of metatype. The narrator reports inconsistent enforcement and a system
      favoring elves despite broad formal protections.
  - printed_page: 54
    assertion: Formal nondiscrimination protections are described for employment,
      accommodation, club membership, transportation, restaurants, migration, taxation,
      pricing, public office, and advancement in social rank.
  - printed_page: 54
    assertion: There is no affirmative-action mandate. Jobs are publicly posted and
      awarded to the ostensibly best-suited applicant; discrimination claims require
      proof of a prohibited motive, making enforcement difficult.
  - printed_page: 54
    assertion: Landlords and clubs can reject a nominally unsuitable applicant unless
      racial motivation can be proven; social harassment may be concealed behind feigned
      misunderstanding.
  - printed_page: 55
    assertion: Public office is by elected representative to the Star Chamber. All
      except two ridings—Hells Canyon and Malheur—have predominantly elven populations;
      neither has elected a non-elf, according to the narrator.
  legal_scope: These are laws asserted within the invented nation, not contemporary
    real-world employment-law advice.
