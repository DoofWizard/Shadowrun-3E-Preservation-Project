data:
  publication:
    title: Tir Tairngire
    publisher: FASA Corporation
    catalog_number: FASA7210
    year: 1993
    game: Shadowrun
    historical_rules_context: Original and Second Edition compatible; not an SR3 conversion
  review_scope: Archival description of a fictional tabletop-RPG source; terms, maps and assertions are
    fictional setting material, not verified real-world contemporary facts.
  section: 'First Impressions: medical service program and Portland access geography'
  emergency_system:
    dial_code_as_printed: '119'
    service: Fictional national emergency vidphone routing to police/Peace Force, medical, fire and similar
      services
    warning: Fictional in-world code; not an emergency number recommendation for the real world
  medical_services_plan:
    name: Medical Services Plan (MSP)
    program_type: fictional public medical service financed in part by wages-based insurance premiums
    benefits: Government MSP pays basic health-care, treatment, physicians and associated hospital costs,
      with prescribed medications generally purchased by patients; medications administered while admitted
      are covered.
    emergency_transport: MSP also operates ambulance response to emergency calls.
    basic_replacement: Government provides malfunctioning cybernetic or tissue-replacement limbs/organs
      at basic-function level.
    higher_technology: Elective upgrades or enhanced replacement technologies require patient payment
      for the difference.
    visiting_premium_per_week_newyen: 500
    visitor_obligation: Fictional foreign visitors must pay for coverage while in the Tír; no reciprocal
      arrangement with external private or national systems.
  portland:
    narrator_role: Portland described as the Tír’s main interface with external trade and visitor business.
    wall_and_checkpoint: A wall divides Portland from other areas of the fictional country; movement is
      managed at guarded checkpoints.
    checkpoint_charlie: The source describes the largest checkpoint under that nickname where Highway
      5 meets Durham in West Portland.
    contestation: Ryushu questions the narrator’s assertion of Portland’s continuing primacy, claiming
      Seattle increasingly serves trade as an alternative; those are separate attributed views.
