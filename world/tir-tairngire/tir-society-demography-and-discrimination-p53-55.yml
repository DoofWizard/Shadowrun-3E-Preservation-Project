    "editorial_method": "Source-image-reviewed FICTIONAL Shadowrun historical tabletop-RPG source. Narrator facts, named fictional comments, rumors, and optional GM material remain separate.",
    "national_claims": "The independence declaration promised a haven for all metahumans, but the sourcebook narrator says the social and political structure at its time does not meet that promise.",
    "settlement": "The narrator credits early elven leadership by Ehran (earlier Walter Bright Water), migration disproportionately by elves, relatively small dwarf migration, and fewer ork and troll migrants. Economic and cross-border barriers disproportionately restricted poorer would-be migrants; influential wealthier elves could travel and establish themselves.",
    "historical_turn": "The book states that in 2036 the elven Council ordered non-elf residents out of captured northern California territories around Redding, driving social and demographic separation.",
    "legal_vs_actual": "Formal law prohibits racial discrimination in employment, housing, commerce, transportation, and civic participation, but enforcement is depicted as limited. The narrator documents continued private discriminatory hiring and rentals, social hostility, unequal commercial practices, and political exclusion in the fictional setting.",
    "employment_and_housing": "The narrator describes nominally open vacancies with selection practices favoring elves, and rentals marketed or priced in ways that exclude non-elves. These are sourcebook descriptions of discriminatory conduct, not recommended procedures.",
    "civic_access": "Star Chamber voting districts are dominated by elves except in the Hells Canyon and Malheur ridings. As of the narrated period, no non-elf has been elected in an elven-majority riding; the narrative does not by itself identify a single definitive causal mechanism for each election.",
    "claim_status": "Includes narrator assertions; exact costs and named witnesses are separated into attributed-claim records."
  },
