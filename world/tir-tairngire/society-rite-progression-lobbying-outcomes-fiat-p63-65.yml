  editorial_method: Source-reviewed neutral reference record from a FICTIONAL tabletop
    RPG; narrator, named allegations and optional scenarios remain separate.
  lobbying:
    procedure: Friends and family may request a target rank for a candidate by visiting
      the Proctor’s office in person or sending a representative; the Proctor personally
      meets select lobbyists.
    window: Lobbying may begin twelve months before the Rite and continue until three
      months before it; lobbying is prohibited during the final three months.
    confidentiality: The identity of lobbyists, people approached and effects of their
      petitions remain confidential within the Proctor’s office.
  results:
    publication: Two weeks after all candidates finish, the Proctor publishes rank
      decisions.
    consequences: Candidates may remain at their existing rank, be elevated or demoted;
      new stipend, land or other privileges take effect immediately.
    appeal: Decisions are final with no appeal. A disappointed candidate must wait
      for the next Rite to participate again.
  participant_categories:
    inheritors: Most are newly adult children confirming inherited ranks, although
      demotion is possible.
    immigrants: Immigrants initially receive probationary status with Gentry-like
      privileges but without voting rights for the Star Chamber; they undertake the
      first Rite after arrival to receive a normal rank.
    challengers: Candidates of Chivalry or higher may seek promotion through extra
      performance; they risk demotion and cannot appeal a negative decision until
      the following seven-year Rite.
  high_prince_fiat:
    authority: The High Prince can elevate a subject through fiat but cannot demote
      by this power. The Council of Princes may veto such a promotion by vote or no
      confidence.
    traditional_date: On Royal Birthday each year, the High Prince normally elevates
      about a dozen subjects, generally described as rewarding public service and
      exceptional accomplishment, although patronage is acknowledged.
