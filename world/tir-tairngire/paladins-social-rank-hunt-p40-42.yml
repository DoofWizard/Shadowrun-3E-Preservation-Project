    "paladin_hunt": "Ehran promoted the Hunt, in which noble or comital volunteers join border patrols. The narrator says patrols sought to verify border security but later acquired the character of hunting alleged border trespassers. The text states captives were sometimes subjected to chemical amnesia or killed; these are fictional sourcebook descriptions, not recommendations.",
    "informal_secret_police_label": "The narrator says ordinary Tír people sometimes equated Paladins with a feared secret police, especially connected with Shen Tathem’s Information Secretariat. This usage is distinct from the uniformed High Prince guard.",
