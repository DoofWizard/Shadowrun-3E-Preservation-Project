  editorial_method: Source-reviewed narrative from a FICTIONAL tabletop-RPG publication;
    book narrator, named in-world allegations and optional scenario material are distinct.
  rite_of_pronouncement:
    timing: Within three months after a child’s birth.
    legal_requirement: Parents must conduct a public Rite of Pronouncement and file
      the relevant papers. The ceremony announces the birth and confers the child’s
      name.
    naming_custom: Most elves have self-selected nontraditional names; the source
      associates formal name selection for many with the later Rite of Passage and
      says this tradition predates the Tír government.
  rite_of_passage:
    timing: Traditionally on or after the eighteenth birthday, marking the end of
      childhood and full membership in the society.
    participation: The text presents the rite as formally optional, but says most
      elves, especially those of higher rank, consider skipping it socially damaging.
    bridging: The participant enters a wilderness area alone and is expected to remain
      there for 72 hours with only what the participant can carry, using the period
      to reflect on a chosen direction and self-selected adult name. Families return
      after approximately 72 hours; the narrative expressly notes reports of serious
      injury and fatalities, while acknowledging that emergency assistance is possible
      but discouraged by pride.
    naming: A public ceremony follows the Bridging. In Sperethiel, the participant
      adopts an adult identity, pledges loyalty to Tír Tairngire and the High Prince,
      and thanks parents for childhood care and guidance.
    legal_effect: The narrator says the new adult name replaces the name granted at
      Pronouncement. It portrays the person as a legally new individual; government
      files other than genealogical records tied to the birth name are said to be
      purged, and past misconduct may be forgiven.
    subjecthood: Council members who attend are said to accept the adult as a Tír
      subject through their participation.
    non_elven_discussion: A named Shadowland allegation disputes equal access for
      non-elves; the narrated mechanics are presented as elven custom and should not
      be universally applied without review.
