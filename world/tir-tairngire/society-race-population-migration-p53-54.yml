  editorial_method: Fictional Shadowrun tabletop-RPG source, reported in third person;
    narrator, in-world allegations, and optional hypothetical readings are kept distinct.
  source_narrator_claims:
  - printed_page: 53
    assertion: The founders publicly offered refuge to all metahumans, including ork,
      troll, dwarf, elf, and other groups; the narrator argues the resulting society
      fell short of that professed ideal.
  - printed_page: 53
    assertion: 'The narrator says elves became the dominant metatype: Ehran the Scribe,
      also called Walter Bright Water in this historical discussion, was an elf; influential
      elves disproportionately accepted invitations. Early dwarven immigration was
      modest, and many other metatypes preferred cities amid perceived exclusion and
      elven social condescension.'
  - printed_page: 53
    assertion: Targeted invitations to prominent elven families and unequal access
      to resources were major factors in immigration. Government emigration restrictions,
      affordability and unavailable jobs constrained some other metatypes.
  - printed_page: 54
    assertion: Before the formal founding, elves were slightly the largest metatype;
      subsequent immigration and emigration increased the proportion of elves. Many
      non-elven residents reported being outnumbered and left.
  - printed_page: 54
    assertion: The in-world narrator dates the Battle of Redding and Tir occupation
      of northern California to 2036, and says the Council ordered all non-elves out
      of newly conquered territory.
  - printed_page: 54
    assertion: The narrator says elves in the occupied area could join Tir Tairngire
      as subjects or leave; most chose to join, while some dissenters moved further
      south and became outspoken opponents. Later elven immigration slowed but continued;
      non-elven emigration exceeded immigration.
  distinctions: The text reports in-world discrimination and ethnic prejudice, not
    scientific facts about real human populations. All statements are limited to the
    fictional 2050s setting.
