    "government_founding": "After announcing independence, Lugh Surehand styled himself High Prince. The Council of Princes formed as the ruling body; Aithne Oakforest, Sean Laverty and Jenna Ni’Fairra were original influential members. The narrator identifies Ehran the Scribe as a secret official Council member.",
    "early_capital": "The temporary national capital was Salem, rather than the trade center Portland, whose proximity to the Salish-Shidhe border made it exposed.",
    "portland_wall": "The Council began construction of the Portland Wall in 2036 and completed it in 2037, sharply restricting movement and commerce with the city’s surrounding country.",
