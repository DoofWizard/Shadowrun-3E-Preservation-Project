    "editorial_method": "Source-image-reviewed FICTIONAL Shadowrun historical tabletop-RPG source. Narrator facts, named fictional comments, rumors, and optional GM material remain separate.",
    "stratification": "The narrator describes a six-level social rank hierarchy beneath the ruling Council: Gentry, Chivalry, Noble, Comital, Ducal, and Royal. Rank determines legal/social privilege, schooling, housing, landholding, travel, and careers.",
