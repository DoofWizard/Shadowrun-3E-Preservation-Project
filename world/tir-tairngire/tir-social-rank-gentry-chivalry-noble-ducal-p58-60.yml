    "chivalry": "Includes the honorific Sir or Demoiselle. Approximately one fifth of Gentry are ranked Chivalry according to the narrative. A year of Peace Force service entails command/NCO roles rather than ordinary privates. The narrative says owning horses is restricted below Chivalry.",
    "noble": "Nobles may own land, whereas Gentry and Chivalry generally lease land (and may own buildings). Nobles may not own income-producing rental property under the described distinctions. Peace Force service is nominally required but many obtain relief.",
    "comital": "Counts and Countesses can own much of the income-producing property and petition for a Council audience. The Peace Force service obligation is nominally present but rarely enforced.",
    "ducal": "Dukes and Duchesses receive at least 20 hectares of land when elevated; the land and its buildings revert upon loss of rank. Ducal rank grants foreign travel and audience rights and is exempt from compulsory Peace Force service.",
    "edition_note": "These are fictional civil/social status rules within the historical sourcebook, not converted character-creation bonuses."
