  editorial_method: Source-reviewed narrative from a FICTIONAL tabletop-RPG publication;
    book narrator, named in-world allegations and optional scenario material are distinct.
  narrator_account:
  - The in-world source describes Tír Tairngire’s charter as announcing a haven for
    all metahuman types, but says the resulting society was strongly dominated by
    elves. The narrator characterizes the gulf between the stated ideal and practice
    as pronounced.
  - The immigration account says Ehran the Scribe, associated with the name Walter
    Bright Water, attracted more elves than other metatypes; dwarves immigrated in
    smaller numbers. It attributes unequal arrivals to wealth, the location of earlier
    populations and unequal resources, not to an explicit universal immigration ban.
  - The text says official invitations were directed chiefly toward wealthy, well-connected
    elves, while many other metahumans faced constraints imposed by their countries
    of origin and the expense of migration.
  - Before independence the elven population had become the largest metatype in the
    Tír region by a small margin; the text says later social exclusion and departures
    increased its share.
  - The source describes a 2036 invasion of northern California during which the Council
    demanded non-elves depart the territory claimed from California. The assertion
    concerns the fictional setting, not a real event.
  - The narrative says residents who rejected the Tír’s offer of citizenship moved
    south, some later becoming opponents of the Tír in California; elven immigration
    subsequently slowed but continued while net emigration exceeded immigration for
    other metatypes.
