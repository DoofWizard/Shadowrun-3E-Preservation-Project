    "lofwyr_nomination": "The source says Lugh Surehand advocated naming the dragon Lofwyr a Prince. Aithne Oakforest, Jenna Ni’Fairra and Ehran opposed the move; Sean Laverty voiced disapproval without leading the resistance.",
