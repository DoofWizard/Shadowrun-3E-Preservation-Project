data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    historical Shadowrun Second Edition-era fictional tabletop RPG sourcebook'
  source_pages:
    printed: 120-122
    pdf: 121-123
  section: Pueblo Corporate Council, board, citizenship, local immigration, fictional
    security/legal system
  byline: Weares Funny Hats (fictional in-world contributor to the section How Pueblo
    Sector Works)
  council:
    dominant_tribes:
    - Zuni
    - Hopi
    non_amerind_population_claim: The contributor says fewer than ten percent of the
      sector’s population are non-Amerinds, despite describing visible Anglos, Asians
      and Africans; this is an in-world statement, not an independently resolved demographic
      fact.
    corporate_governance: The Pueblo Sector is managed as a corporation under the
      Pueblo Corporate Council. Each citizen holds at least one share.
    vote_weight_formula: Shareholders have a number of votes equal to log10(number
      of shares held) + 1, as explained by the contributor; 1 share yields 1 vote
      and 1,000,000 shares yields 7 votes.
    board: Twelve-member governing board elected by Pueblo citizen-shareholders; board
      manages economy, security, justice and law enforcement and may appoint or remove
      executive officers.
    officials_2055:
      board_chair: Juanita Iglala
      sector_president: Julio Caron
  immigration:
    in_world_rules: Immigration is selective and tied to fictional employer skills
      lists. Corporations may sponsor individuals, subject to official verification.
      Successful new citizens must relinquish other citizenship and purchase at least
      one corporate share.
    share_price_reported: 8,252 nuyen at the last price tick, per printed p120.
    work_visa: The source states there is no Pueblo Sector work visa and only citizens
      may legally work there.
    travel_pass: Short-term entry uses electronic or in-person travel passes with
      asserted credstick and database checks; speaker commentary disputes exactly
      how comprehensive the checks are.
  weapons_and_substances:
    weapons: The narrator permits certain personal-defense weapons under licensing,
      while describing heavier weapons as restricted and automatic weapons as prohibited.
    addictives: The narrator distinguishes private personal recreational use from
      harmful conduct involving others and states BTL dealing is illegal.
  fictional_law_enforcement:
    private_force: Pueblo Security Enterprises, Inc. is formally a wholly owned subsidiary
      of sector management, described as a civilian agency under the Treaty of Denver.
    recruitment: The source narrator says its personnel were drawn from Pueblo Corporate
      Council security ranks.
    justice: Shamanic tribunals, each assigned three shamans under a Vice-President
      of Justice, replace the familiar jury, prosecutor and defense-counsel model
      in this fictional sector; source notes allegations of miscarriages of justice.
    cyberware: The narrator states Class A/B modifications require registration or
      licensing; Class C cyberware is illegal in the sector.
