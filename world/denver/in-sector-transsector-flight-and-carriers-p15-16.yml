data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    fictional historical Shadowrun Second Edition-era tabletop RPG; source.fasa-7212;
    no inferred Third Edition conversion.'
  section: GETTING AROUND / Flying
  narrator_distinction:
    in_sector: Starts and ends in the same political sector; due to irregular boundaries,
      a flight may nonetheless pass over a different sector. The fictional guide describes
      potential detours, interception or border checks.
    transsector: Starts in one country/sector and lands in another, with customs/immigration
      requirements depending on bilateral relations; such routes are fewer because
      carriers must hold licenses in both territories.
  original_example: Fictional UCAS flight from Commerce City in northeast Denver to
    Doctors Hospital Medical Center in southwest Colorado Springs can traverse CAS
    airspace; CAS may require diversion or clearance even though endpoints are UCAS.
  carriers:
    Pueblo: Airlink
    Sioux:
    - Table Top
    - Skybus
    - Eagle Feather Transit
    reference: The source directs readers to Dunkelzahn’s Primer on the Native American
      Nations, Volumes 1 and 2, for comparative fictional reliability/cost/comfort.
  attributed_comments:
  - speaker: Sky Pilot
    claim: Claims small businesses avoid transsector operations because origin/destination
      licensing is burdensome.
  - speaker: Polaris
    claim: Describes variation in immigration controls among sectors and claims Aztlan
      security is especially intrusive.
  - speaker: Firelight
    claim: Calls attention to in-world teenagers using homemade rocket-launching devices
      against low-flying craft, generally at night; attributed caution, not a game-mechanical
      rule or real-world instructions.
  - speaker: Bongo
    claim: Warns that an aircraft diverted into another jurisdiction could encounter
      legal trouble for someone with an outstanding warrant.
