  section: Denver Data Haven site, access and core inhabitants
  narrator_facts:
  - page: 80
    assertion: The Haven occupies an old United States Air Force Academy site including
      hangars, storage sheds, support buildings, and an underground bunker dating
      to the Cold War. Buildings look dilapidated, but are described as structurally
      sound and being renovated internally.
  - page: 80
    assertion: The narrator describes an old boundary fence, rusting former vehicles
      in a sensor-filled interior, a southern entrance, and security patrols focused
      on key areas rather than the perimeter as a whole. These details establish fictional
      site atmosphere and defensive posture, not directions for real-world entry.
  - page: 80
    assertion: Visitors to the Nexus are described as unusual and are expected to
      have prior authorization; physical access is less common than cyberspace access.
  - page: 81
    assertion: The author places the surviving gate at the south end of the old site
      near Woodmen Road and an extensive collection of abandoned vehicles beyond it.
      The fictional site’s runways and buildings feature prominently in the security
      discussion.
  - page: 81
    assertion: The original source includes a large signed Rick Harris illustration
      of two armed fictional characters alongside the compound description.
  - page: 82
    assertion: The narrator describes guards and concealed sentries who control arrival
      at the gate and verify the identity and permission of visitors; even expected
      guests are offered little hospitality.
  - page: 82
    assertion: Approximately 100 permanent residents are said to live at the Data
      Haven; about twelve work as systems analysts and system operators, another 24
      in maintenance/support, with the remainder identified as an otaku community.
  - page: 82
    assertion: Four key system operators identified by the narrator are Shiva, Bash,
      Cap’n Kluge, and Spirit, though many other Haven residents are skilled operators.
  context: Protective measures described in a fictional Cyberpunk RPG installation
    are presented as setting facts, not real-site vulnerability analysis or tactical
    entry instructions.
