data:
  publication_context: 'Published fictional tabletop-RPG sourcebook Denver: The City
    of Shadows, FASA Corporation, FASA7212/source.fasa-7212, original Shadowrun Second
    Edition-era text, printed pp63-66/PDF pp64-67; not an SR3 conversion.'
  sections:
  - The Real Power — Smuggling and T-Bird Runs
  - Markets
  book_narrator_facts:
  - According to the fictional setting sourcebook, treaty provisions against nationality-specific
    tariffs and duties and the Free Zone’s access to six nations made Denver a major
    free port and a crossroads for unofficial trade, alongside its geography near
    the Rockies and Great Plains.
  - 'The narrator describes t-bird cargo runs through Denver as serving two overlapping
    markets: residents and organizations inside the Front Range Free Zone, and the
    governments and residents of the surrounding signatory national sectors.'
  - The book reports an official Free Zone population of 3.5 million and estimates
    more than 4 million potential buyers including residents not represented by that
    official count. The larger figure is presented as an estimate, not an official
    census.
  - The source distinguishes a shadow trader, who may handle restricted goods and
    exploit differences in sector law, from a smuggler who carries goods a jurisdiction
    classifies as contraband; many traders operate under the broad local label “smugglers.”
    Goods can be unlawful in one fictional sector but legal in another, including
    at the destination.
  - The narrator describes divergent licensing, regulation and tariff regimes as limiting
    ordinary formal distribution, leaving the Free Zone short of goods and increasing
    prices. Some t-bird deliveries carry lawful products not supplied by conventional
    merchants, while others carry restricted products including recreational drugs,
    BTLs and military-specification weapons.
  - Commercial carriers and t-bird light attack vehicles are described as subject
    to differing licensing or military/security-vehicle restrictions under national
    laws. The source says smugglers may encounter enforcement and legal restrictions
    even when a shipment is lawful at the destination; it does not establish universal
    immunity from law.
  - The narrator identifies sector-to-sector price gaps and demand in national markets
    as additional reasons for trades through Denver; one example describes Ute-manufactured
    California-themed simsense recordings reaching UCAS buyers through the Free Zone.
  source_quantities:
    official_free_zone_population: 3500000
    estimated_potential_buyers: more than 4 million; explicitly narrator estimate
    national_signatories_accessed: 6
    market_categories:
    - Free Zone population
    - surrounding signatory nation markets
  assertion_boundary: These are in-universe narrator descriptions and qualified estimates;
    named Shadowland posters’ examples, claims and counterclaims are separately indexed,
    not promoted into book-narrator fact. No real-world smuggling advice or conversion
    of edition-specific mechanics is provided.
