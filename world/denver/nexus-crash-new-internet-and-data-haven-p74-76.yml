data:
  publication_context: 'Fictional tabletop RPG historical sourcebook Denver: The City
    of Shadows, FASA Corporation (1994), FASA7212 / source.fasa-7212; original Shadowrun
    Second Edition-era setting, not converted to Third Edition. Printed folios are
    cited with their actual one-higher physical PDF pagination.'
  section: Crash of 2029, the Egg, New Internet, and Birth of the Nexus
  book_narrator_timeline:
  - printed_page: 74
    assertion: The historical Shadowland and other bulletin boards were connected
      to the Matrix by the Crash of 2029. The narrator says the United States government
      claimed the destructive virus originated on an independent, unauthorized bulletin
      board, without independently establishing that claim.
  - printed_page: 74
    assertion: The Egg and other loosely connected independent systems were protected
      by indirect access arrangements; the fictional Crash harmed less robust private
      systems and produced lingering smaller problems even at Shadowland.
  - printed_page: 74
    assertion: After the fictional Echo Mirage team defeated the Crash virus, governments
      and corporations rebuilt and reconnected the Matrix during a period described
      as loosely regulated, while independent networks increased their connections
      with protective separation.
  - printed_page: 74
    assertion: In the narrator’s account, the United States government that became
      UCAS reestablished surveillance after reconstruction, but the independent Egg
      and Shadowland nodes had by then become difficult to discover.
  - printed_page: 75
    assertion: By 2037 the Egg is portrayed as a major independent network, connected
      to the Matrix through discrete gateways but operating independently as a web
      of private subsidiary systems.
  - printed_page: 75
    assertion: The book describes Shadowland as among the Egg’s earliest associated
      nodes and says users sometimes applied the name Shadowland to the broader independent
      network.
  - printed_page: 75
    assertion: Following the Treaty of Denver, the Pueblo Corporate Council possessed
      the former United States Air Force Academy site. The council surveyed it,
      removed what officials considered useful, then enclosed the entire facility
      with a fence. Appointed bureaucrats occasionally inspected the site and
      noticed abandoned or wrecked vehicles near its gate; they filed reports
      and cleanup requests, but according to the narrator nothing changed.
  - printed_page: 75
    assertion: The Free Zone branch of the Pueblo government wanted revenue by
      selling the former Academy land. The narrator says interested parties appeared,
      but each offer was withdrawn and other bids disappeared within the Pueblo
      administrative system; the text does not establish why. Rumors subsequently
      circulated that squatters had occupied the base, while government observers
      appeared uncertain who monitored it. The squatters remain a reported rumor,
      not a verified identification.
  - printed_page: 75
    assertion: Around 2038, reports of a Denver Data Haven clearinghouse for
      Shadowland and other networks began to circulate. The narrator says about a
      year passed before corporations and governments recognized that the Haven
      echoed outbound files and received inbound traffic. It became a repository
      for both legitimate and shadow information in North America; files sent for
      storage carried the proviso that, if something happened to the original
      poster, the stored files would be echoed outward again. The Heap also
      retained material that had never been publicly redistributed.
  - printed_page: 75
    continued_page: 76
    assertion: The source presents a story or lore that the Data Haven’s controllers
      reached an agreement with the Pueblo Corporate Council and that this explains
      the government’s continued noninterference. It is framed as network lore, not
      an independently confirmed government treaty.
  - printed_page: 76
    assertion: The source describes Nexus-style independent datanets in other cities
      by its fictional present day, placing Singapore second in size behind Denver
      and The Hague third. This is a ranked in-world claim, with other network sizes
      left to speaker commentary.
  source_qualifiers: Do not conflate the separately attributed theories about the
    origin of the Crash, Nexus funding or control with the narrator’s historical account.
    The fictional narrative does not supply executable rules or modern security recommendations.
