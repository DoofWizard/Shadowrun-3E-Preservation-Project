  section: The Real Power — Black and Shadow Markets
  book_narrator_facts:
  - The book identifies black and shadow markets as the consumer-facing end of the
    fictional Denver Free Zone shadow economy, where residents buy goods introduced
    by illegal distribution channels.
  - It states that all signatory national sectors publicly condemn black markets and
    stage publicized enforcement sweeps every few months; the resulting confiscations
    can be substantial, with confiscated goods described as having inflated street
    prices.
  - 'It distinguishes public enforcement messaging from actual effort: the narrator
    says sectors devote differing resources to enforcement and generally acknowledge
    less effort than their public-relations accounts suggest.'
  - The narrator claims the black market is a functioning component of each sector’s
    economy and that shutting it down would have serious negative consequences for
    economic stability.
  - 'The book contrasts this with sector conduct toward the wider shadow economy:
    although each signatory nation publicly declares opposition, the narrator says
    governments also encourage illegal trade activities when those activities might
    disrupt the economy of a neighboring sector.'
  attribution_boundary: These five statements reflect unquoted publication narration
    after Miss T’s signed contribution and before the subsequent named Shadowland
    replies on printed p69. Miss T, Sam, Prospero, Legal Beagle, Moore and other speakers’
    interpretations of legal categories, incidents or official intention are separately
    attributed and are not treated as independently narrator-established.
  rules_boundary: No game-resolution rule, numeric mechanical modifier or real-world
    market conduct recommendation is supplied by this record.
