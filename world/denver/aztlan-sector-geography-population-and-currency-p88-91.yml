  section: AZTLAN SECTOR introduction, boundaries, 2055 Datafact, currency and culture
  book_narrator_setting_facts:
  - Printed p88 identifies the Aztlan Sector, also called Azzietown, as the smallest Denver national
    sector at nearly 65 square kilometers and states that it has the greatest population density
    among the sectors.
  - Printed p88 describes its northern boundary as East Colfax Avenue with a detour encompassing
    the Civic Center; western boundary as Intercity 25 and the South Platte River; eastern boundary
    as South Colorado Boulevard and the Intercity; southern boundary as Route 285, locally East
    Jefferson or East Hampden.
  - Printed p90 describes a 10-meter-high wall or fence along the demarcation boundary with security
    sensors, and identifies Aztechnology security personnel as patrolling both sides of that perimeter
    in high-risk areas. The text characterizes this as unusually strict sector security, not a real-world
    installation.
  - Printed p91, in the named article by Señor Spud, portrays the sector as dominated by Aztechnology
    corporate influence, business etiquette and urban Central American cultural imagery. The article
    reports that sentient paranormal beings appear publicly and that Aztlan law grants spirits and
    other astral beings the rights and freedoms accorded to (meta)humans.
  - Printed p91 states that Aztlan currency is peso-based, with 500 pesos equaling 1 nuyen; most
    peso transactions are electronic, while hard currency includes coins valued from 100 pesos through
    10,000 pesos and larger paper bills. In-sector purchases using other currencies are prohibited
    and may carry a fine or imprisonment, according to the article.
