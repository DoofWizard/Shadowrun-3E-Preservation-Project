  section: Sioux Sector society, economy, tribal government, immigration, and published
    law enforcement institutions
  narrator_established:
  - The Sioux Sector relies almost entirely on information-based industry and genetic
    engineering; the broader Sioux Nation has an agrarian economy and a more developed
    information industry.
  - The book describes assertive social honor practices among some permanent Sioux
    Sector residents as part of its fictional local culture, rather than as universal
    behavior of all residents.
  - The sector is governed by a Council of Chiefs with representatives of Sioux, Crow,
    Navaho, Hidatsa, and Arapaho peoples; members are named by the Council of Elders
    (mostly shamans) which appoints chiefs governing the Sioux Nation itself. A chief
    may serve only one five-year term per council.
  - Applicants descended from major Sioux Nation tribes, defined more broadly than
    the five Council-represented tribes, may apply for citizenship and permission
    to live and work. Others may apply for Official Resident status and, after three
    consecutive years, citizenship.
  - Work visas are required for the high-technology industry; other economic sectors
    do not require work visas. Visitors visas are generally available.
  - Time-limited travel passes use the same initial process as time-limited visitors
    visas; after approval the period may be extended on request at the border-crossing
    point of entry.
  - The source describes licensing of firearms heavier than light pistols, including
    identity information and a 48-hour waiting period; people may carry light pistols
    in public but not heavier weapons. Hunting weapons have restricted transport and
    use. Bows of draw-weight 13 kilograms or more fall under the same restrictions
    as firearms. Only security forces and authorized agents may carry weapons capable
    of fully automatic fire.
  - The Sioux Nation regulates mind-benders of electronic, narcotic, or alcoholic
    types. Only government-licensed providers may legally sell simsense chips. The
    source contrasts the modulation restrictions with those of the UCAS. Recreational
    drugs are broadly illegal in the fictional sector and possession/use are punished
    differently from trafficking. Wine and beer have government limits of 12 and 4.5
    percent alcohol, respectively; hard liquor is sold only at government Liquor Distribution
    Branch outlets.
  - Law enforcement is a Council of Chiefs-controlled Bureau of Civil Enforcement
    contract assigned to Cheyenne-based Eagle Security Services Inc. (ESSI), initially
    staffed after the Treaty of Denver with former Sioux Nation police and military
    personnel.
  - The Bureau of Justice (BJ) oversees the sector judiciary. A single judge, usually
    a shaman, presides over judiciary councils and the BJ appoints judges for life
    unless removed. Prosecutors, defense counsel, and other lawyers must be licensed
    by the BJ in Cheyenne. The source says judiciary precedent is treated less strictly
    than in the UCAS.
  - The book states Class A cyberware requires no licensing and Class B or C cyberware
    requires licensing with a background check.
  attribution_boundary: This world_fact record reports only book narrator assertions;
    disputing or speculative named Shadowland speakers on these pages are not silently
    promoted into narrator fact.
