data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    published fictional Shadowrun Second Edition-era tabletop-RPG sourcebook; source.fasa-7212;
    no inferred Third Edition conversion.'
  source_context: Historically published in-world fictional setting information; narrator
    facts, attributed Shadowland posts, and hypothetical examples are distinct.
  extraction:
    maglev_route_conclusion:
      sectors_and_stations:
      - The published route swings north along Iola Street beneath Stapleton International
        Airport; the old airport platforms remain but no trains stop there.
      - From the airport it follows Martin Luther King Jr. Boulevard Parkway in CAS
        territory, then Larimer southwest and Broadway south, stopping along each.
      - It then passes beneath the Aztlan Sector Civic Center where the train halts
        against a solid wall and opens doors, rather than using a platform.
      - The train returns to CAS territory and ends at Union Station.
      darwin_attributed_post: Darwin states that the tunnel continues west into Ute
        territory but the train does not, and speculates that subway control software
        diverts it back before the disused tunnel.
    driving_conditions:
      book_narrator: Sector boundaries interrupt minor roads with walls or fences
        and checkpoints; the quality of roads and maintenance varies by sector.
      book_narrator_pueblo: Pueblo Sector road surfaces are particularly degraded
        according to the narrator; potholes and bridge deterioration are cited.
      named_post:
        speaker: The Mad Monk
        claim: Disparages road conditions and the hazards of broken bridge supports.
    outer_boundary_geography:
      description: The fictionally governed Free Zone is roughly kidney-shaped and
        extends from near Mead/Intercity 25 north of Denver to its southern boundary
        in Colorado.
      north_south_extent_km_approx: 175
      width_km_less_than: 90
      land_area_square_km_approx: 17500
      outer_boundary_length_km_approx: 600
      path: Westward and northern portions include Longmont, Lyons, Ward, Rollinsville,
        Golden and Buffalo Creek/Deckers; the route proceeds past Divide, southern
        Colorado Springs and Fort Carson to Yoder and Kiowa, around Denver east of
        Watkins, past Hudson and near Platteville.
      narrative_uncertainty: These distances and places are the book narrator’s published
        approximation, not modern real-world boundaries.
