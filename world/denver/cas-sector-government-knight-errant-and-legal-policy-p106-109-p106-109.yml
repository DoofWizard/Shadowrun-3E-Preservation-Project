  section: Government and law enforcement, KE-FRFZ, in-sector licenses, 2055 historical
  prof_named_exposition:
  - Bianca Cuthbertson is named as manager of the CAS Sector and was previously controller
    of Dallas/Fort Worth; her reform campaign follows a period of Knight Errant Front
    Range Free Zone (KE-FRFZ) security abuses, according to Prof.
  - Prof says KE-FRFZ enforces CAS sector law using command, data collection and analysis,
    investigative, Matrix, physical and astral divisions. Senior leaders include personnel
    with Knight Errant executive backgrounds and others drawn from former CAS Armed
    Forces.
  - CAS game-setting law requires Class A and C cyberware registration even for CAS
    citizens; shops may install only Class A cyberware. Cyberdecks and programs must
    be licensed.
  - Prof distinguishes intent and use minimally for legal purposes, and identifies
    formal possession, transport and use offenses as separately fined.
  - Prof reports strict punishment for trafficking of controlled substances, and oversight
    of legal chips; this material is an in-world fictional law report.
  speaker_notes: Speaker claims about reform, corruption, investigation and security
    tactics are held separately in the attributed commentary record.
