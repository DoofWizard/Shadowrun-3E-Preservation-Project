  section: Mafia, Yakuza, Gangs, Triads and Other Organizations (POWER)
  narrator_established:
  - printed_page: 59
    fact: In the setting, yakuza oversee approximately half of the Free Zone illegal-chip
      distribution channels and maintain a large share of the illegal drug trade;
      Triads and independent distributors control the rest. These fictional categories
      and their extent are recorded as the book narrator states them, not as facts
      about real organizations.
  - printed_page: 60
    fact: The local yakuza develop information-brokerage capability through their
      own fictional deckers, fixers and suppliers, pursuing a technologically intensive
      presence while staying active in extortion, sabotage, assassination-for-hire
      and related criminal services.
  - printed_page: 60
    fact: The narrator distinguishes local and imported gangs from Mafia/yakuza. The
      homegrown Fronts and Godz have the greatest influence locally; the Fronts operate
      mainly in UCAS/CAS sectors in groups called sets with roughly fifty members
      each, mainly human and ork, including violent Warrens groups and business-oriented
      sets called BBs.
  - printed_page: 60
    fact: Godz gangs are concentrated around Pueblo and Ute highways and byways. Boulder
      is described as supporting a major battalion with possibly about one hundred
      members, with smaller detachments west of Interstate 25. The source describes
      gang involvement in protection arrangements with fictional smuggling ventures.
  - printed_page: 60
    fact: Imported gangs include the Hudson Hawks from New York and Brain Eaters from
      Austin, each described as having small Free Zone presences; the Cutters have
      two safehouses and up to eighty members in the UCAS Zone, according to the narrator.
      Their significant reputation involves arms dealing.
  - printed_page: 61
    fact: The three major Triads are the White Lotus, Golden Triangle, and Red Dragon.
      Their fictional Denver headquarters cluster around the Chinatown region in the
      CAS Sector, but the source explicitly says their influence crosses national
      sector demarcators.
  - printed_page: 61
    fact: The Triads engage in protection, extortion, illegal drugs and chips. In
      this setting the narrator contrasts their preference for magic with Mafia/yakuza
      reliance on technology or muscle where magic is ineffective; this does not establish
      actual magical abilities outside the roleplaying fiction.
  scope_note: No real-world operational procedures, routes, methods for smuggling
    or violent wrongdoing are prescribed; this is a historical roleplaying setting
    index.
