data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    published fictional Shadowrun Second Edition-era tabletop-RPG sourcebook; source.fasa-7212;
    no inferred Third Edition conversion.'
  source_context: Historically published in-world fictional setting information; narrator
    facts, attributed Shadowland posts, and hypothetical examples are distinct.
  extraction:
    narrator_security_baseline:
      comparative_security: Varies by adjacent nations and political relations; Pueblo–Pueblo
        Corporate Council boundary has lower security than UCAS–Sioux boundary.
      fence_type: Generally a double fence, approximately 10 meters high, reinforced,
        often capped with razor wire or monofilament cutwire; usually not energized;
        some sectors substitute walls.
      border_entry: Official passage is via posted border crossings; security detects
        fence integrity changes and patrols respond, though coverage is variable.
      border_terrain: May range from cleared open ground to terrain with sensors,
        mines, guard animals, and other security systems; narrative explicitly describes
        varied deployments, not universal measures.
      truckton_ravine: The narrator describes a fictional border obstacle northwest
        of Truckton as a concrete ravine about 30 meters wide and 15 meters deep,
        intended to impede airborne trespass.
    crossing_posts:
      design: 'Ranges from soft weather shelters to hardened bunkers. Most crossings
        use two facilities: one for entering and one for outbound traffic, potentially
        run by rival governments.'
      personnel: The narrator says posts can range from small teams of roughly three
        to four lightly armed officers to a dozen armed customs officials, sometimes
        supported by a fire team and a combat mage.
      vehicles: Supplementary vehicles vary from none to Citymaster armored vehicles;
        air surveillance is mentioned in attributed posts.
    certainty_and_attribution: Specific electrification, astral surveillance, aviation
      support, weapon deployments and patrol thoroughness are disputed or asserted
      by individual Shadowland posters, not universally certified by the sourcebook
      narrator.
