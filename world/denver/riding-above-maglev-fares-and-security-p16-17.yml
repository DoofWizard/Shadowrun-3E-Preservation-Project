data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    fictional historical Shadowrun Second Edition-era tabletop RPG; source.fasa-7212;
    no inferred Third Edition conversion.'
  section: Riding Above
  fictional_book_maglev:
    historical_completion_year: 2011
    system: Elevated maglev linked Boulder through Denver to Colorado Springs, with
      a solar collector-shaded trackbed.
    northern_terminal: Boulder pedestrian mall at Walnut and 14th Streets; maintenance
      yard further west toward Fifth Street.
    route: Boulder to I-25 at Wattenberg; south following I-25 to Denver Union Station;
      along Speer Boulevard to South University; rejoins I-25 in Englewood; ends in
      Colorado Springs at Ivywild.
    parallel_track_beds: 4
    services:
    - commuter
    - nonstop express
    express_boulder_to_colorado_springs: less than one hour
    commuter_stations: 43
    commuter_total_time_hours: 4
    operator: Front Range Transit International, a holding company owned jointly by
      the six countries sharing the Denver area; maintenance/revenue shared.
    in_sector_short_ride_fare_nuyen: as low as 2
    express_full_route_fare_nuyen: 85 or more
  attributed_commentary:
  - speaker: Frasier
    claim: Disputes the implication that maglev is powered mostly by solar cells;
      claims collectors provide only five percent and most electricity originates
      at a nuclear plant at Greenland in Pueblo Sector. This quantitative claim is
      attributed rather than narrator-confirmed.
  - speaker: Margo
    claim: Reports express trains cross eight sector boundaries and commuter riders
      are subject to immigration checks when exiting stations, regardless of where
      they initially boarded.
  - speaker: Chaka Zulu
    claim: Offers a lengthy cautionary hypothetical about station guards, scanning
      and control measures, including disabling gas, and recommends avoiding the system;
      a fictional user’s hypothetical, not tested gameplay procedure or real-world
      advice.
  - speaker: Tor
    claim: Claims watcher spirits patrol some maglev trains and alert security when
      unusual magical activity occurs; fictional speaker allegation, not a general
      rules change.
  - speaker: Ryan
    claim: Alleges attempted attacks against maglev tracks by different fictional
      political extremist groups and says he favors tighter security; such claims
      are not narrator-certified.
  following_section_at_bottom_p17: The next section, Riding Below, begins on printed
    p17 and describes an incomplete subway system; continuation follows on subsequent
    pages.
