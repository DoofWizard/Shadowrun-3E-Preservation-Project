    "publication_context": "Fictional tabletop-RPG sourcebook Denver: The City of Shadows (FASA Corporation, 1994; FASA7212; source.fasa-7212), historical Shadowrun Second Edition-era setting. Printed page numbers map to PDF page number plus one; no Third Edition mechanics conversion.",
    "section": "The Real Power / Other Organizations / Gangs / The Triads / Brokers",
    "book_narrator_facts": [
      "The Fronts and the Godz are described as influential local fictional street gangs. The Fronts operate chiefly in the UCAS and CAS sectors; probably about a dozen sets, averaging about fifty members each, operate around the Free Zone. Members are chiefly male, mostly human and ork. The Trey Eights are identified as a destructive Warrens-area Fronts set, while the BBs participate in drugs and simchips, act as out-of-sector fixers and intermediaries, and provide hired bodyguards.",
      "The Godz operate primarily around the Pueblo and Ute sector highways. The book describes a major group of roughly one hundred members near Boulder and smaller groups west of Intercity 25. Besides road-gang activity, the Godz offer protection and escorts to some lower-profile smugglers and sector travelers, including guarding them against other Godz groups; the narrator also states that they punish those who refuse the offered protection.",
      "The source notes smaller detachments of Hudson Hawks from New York and Braineaters from Austin in the Free Zone. Rumor, rather than narrator-established verification, credits the Cutters with two UCAS Sector safe houses and up to eighty members. The narrator identifies the Cutters as an influential western gang with an arms-dealing reputation.",
      "The three leading Triads in the fictional Free Zone are White Lotus, Golden Triangle and Red Dragon. Their operations and headquarters cluster in the CAS Sector Chinatown area, with influence crossing the Front Range demarcators. They participate in protection, extortion, illicit drugs and simchips.",
      "The Triads are described by the narrator as heavily relying on magic in their operations; in contrast, Mafia and yakuza organizations generally use magic as an adjunct to established methods. Veda disputes a rigid description of Triad choices. Niklaus, a separate in-world speaker, claims the Triads maintain close ties to Far Eastern parent organizations and receive severe discipline for lapses; that assertion is not promoted here into narrator-established fact.",
      "The narrator states that Triad groups attempt to enter portions of the shadow market by putting more freelance T-bird transport pilots, locally called jammers, under contract rather than conducting all their own T-bird runs.",
      "Information brokerage is characterized as the Free Zone underground economy’s largest growth industry. The narrator calls it a multibillion-nuyen-per-year industry growing at almost 10 percent annually; these are fictional 2055 setting estimates, not a source-grounded game mechanic.",
      "Some leading information-brokerage participants are unusually young. The book describes an average age of seventeen among its leading players and some code and decking specialists as young as fourteen. No factual real-world age distribution is asserted."
    ],
