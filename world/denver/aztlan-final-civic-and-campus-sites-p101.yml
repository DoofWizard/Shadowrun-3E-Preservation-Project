data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212; source.fasa-7212),
    fictional Shadowrun Second Edition-era tabletop sourcebook (1994), original printed
    p101/PDF p102; not a Third Edition conversion.'
  section: Aztlan Sector — final named civic and campus sites, before the CAS Sector
    opening
  roving_i_bylined_descriptions:
  - site: State Capitol Building
    map_location: 7
    facts:
    - The Council of Denver Administrative Branch had the earlier Denver State Capitol
      Building demolished in 2048 and replaced it with a new State Capitol Building.
    - The historic predecessor is presented as an architectural landmark, whereas
      the replacement is described as an Early Blockhouse-style modern structure;
      the narration reports many native Denverites regard it as emblematic of the
      Administrative Branch becoming excessive.
  - site: Cheesman Park Conservatory
    map_location: 6
    facts:
    - Formerly the Boettcher Memorial Conservatory, this remodeled geodesic structure
      is a major Aztlan Sector landmark.
    - Existing plants were removed and replaced with vegetation from Aztlan; its geodesic
      dome emits a cool green glow at night.
  - site: Anáhuac University
    map_location: 8
    facts:
    - The Aztlan government claimed and renamed the former University of Denver in
      2027.
    - In the sourcebook period it functions primarily as an Aztechnology training
      campus devoted almost exclusively to college-age children of managers and executives
      at the corporation referred to as Big A.
  attribution_boundary: >-
    The State Capitol, Cheesman Park Conservatory and Anáhuac University
    descriptions continue the PLACES OF INTEREST guide explicitly bylined
    to Roving I on printed p98. That guide ends at printed p101; p102 starts
    CAS SECTOR. The named Shadowland replies on p101 are separate allegations,
    questions, personal observations and speculation, not narrator confirmations.
  rules_scope: These are setting locations and historical claims, not numeric game
    tests or mechanical ratings.
