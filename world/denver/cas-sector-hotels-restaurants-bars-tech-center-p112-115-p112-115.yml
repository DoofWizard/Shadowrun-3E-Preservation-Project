data:
  publication_context: 'Published fictional tabletop RPG sourcebook Denver: The City
    of Shadows (FASA Corporation, 1994, FASA7212 / source.fasa-7212), historical Shadowrun
    Second Edition-era setting; printed pages are one below physical PDF page numbers;
    no Third Edition conversion is inferred.'
  original_printed_pdf_page_map: 112-115/113-116
  section: CAS sector hotels, restaurants, bars and Tech Center
  named_locations:
  - name: Melbourne Hotel
    archetype: Coffin Hotel
    address: 607 24th St.
    manager_or_owner: Gordon Letson, Manager
    contact: LTG 2303 (92-6386)
    map_location: 9
    publication_bias_label: Extreme Bias Against Tribal Shamans
    source_narrator_account: Describes an unpleasant coffin-style hotel near downtown;
      Letson owns and manages it and is outspoken about his grievance against Amerind
      shamans.
  - name: Stouffer Concourse Hotel
    archetype: Average Hotel, 5 floors
    address: 3801 Quebec St.
    manager_or_owner: Cheryle Tutkaluke, Manager
    contact: LTG 3303 (99-7500)
    map_location: 10
    publication_bias_label: Slight Bias Against Amerindians
    source_narrator_account: A former airport hotel burned down, rebuilt in 2003 and
      again in 2034; the narrator describes lost elegance and a now budget-oriented
      clientele.
  - name: Regency Tech Center
    archetype: Luxury Hotel, 10 floors
    address: 7800 Tufts Ave.
    manager_or_owner: Ralph Parr-Peterson, Manager
    contact: LTG 7303 (79-1234)
    map_location: 11
    publication_bias_label: No Racial Bias
    source_narrator_account: A former Hyatt hotel whose sale, rebranding provision
      and later jurisdictional dispute followed the Treaty of Richmond. The narrator
      describes a stakeholder's fatal accident and similar subsequent tragedies, but
      does not independently establish criminal responsibility.
  - name: Grassroots
    archetype: Mid-Sized Restaurant
    address: 1700 Humboldt St.
    owner: Tamira Gaudette
    contact: LTG 8303 (31-7310)
    map_location: 12
    publication_bias_label: Slight Bias Against Amerindians
    source_narrator_account: The narrator reports consistently favorable Rocky Mountain
      Post subscriber reviews, comparatively good value for its fine dining, and an
      extensive wine selection. Victoria speculates about editorial favoritism in
      a separately attributed post.
  - name: Goodfriends
    archetype: Night Club
    address: 3100 E. Colfax
    owner: Brett Mitchell
    contact: LTG 3303 (99-1751)
    map_location: 13
    publication_bias_label: No Racial Bias
    source_narrator_account: The narrator says a restaurant or club has occupied the
      site for over 80 years; describes the current nightclub as a pickup venue frequented
      by underage women and young men and names a dress code prohibiting gang colors,
      black leather, studs and weapons. These are historical fictional setting descriptions,
      not advice or endorsements.
  - name: Rock Solid
    archetype: Small Bar
    address: 6050 E. Colfax
    owner: Elizabeth Grimes
    contact: LTG 3303 (65-2232)
    map_location: 14
    publication_bias_label: Slight Bias Against Metahumans
    source_narrator_account: Very loud rock bar popular among some first-tier fictional
      runners. Hammer's allegation that the owner once operated under the alias Black
      Heart is separately attributed.
  - name: Denver Tech Center
    archetype: Commercial district
    address: Interstate 25 at Belleview Avenue area
    map_location: 15
    source_narrator_account: The former high-tech center expanded into industrial
      parks; suffered downturns in 2012 and after the Crash of 2029. The publication
      describes loss of companies and declining support businesses, with vacant industrial
      properties.
  - name: Ketring Park
    archetype: Public park
    map_location: 16
    source_narrator_account: Small park with a lake and nighttime gang conflict. The
      sourcebook describes Knight Errant personnel establishing perimeters during
      larger fights rather than stopping them; it does not present this as a rule.
  publication_date_context: Fictional 2055 in-world business directory; LTG numbers
    and addresses are not verified contemporary real-world contacts. Venue bias labels
    reproduce the publication's original categories.
headline: 'FASA Corporation (1994) Denver: The City of Shadows (FASA7212), fictional
  Shadowrun Second Edition-era CAS sector hotels, restaurants, bars and Tech Center
