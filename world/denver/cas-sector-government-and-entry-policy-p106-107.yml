    setting; printed page numbers differ from physical PDF page numbers. No Shadowrun Third Edition
    conversion is inferred.'
  section: CAS Sector government, permits, travel and corporate security
  source_attribution: Government and Law Enforcement article by named in-world writer Prof; the
    following are presented as his in-world historical and administrative claims.
  descriptive_statements:
  - Prof identifies Bianca Cuthbertson as the CAS Sector appointed manager, formerly controller
    of the Dallas/Fort Worth metroplex, with less than a year in the Denver position at the time
    of writing.
  - Prof reports her challenge to and restructuring of the sector security contractor Knight Errant
    Front Range Free Zone (KE-FRFZ), including several senior-management removals or expulsions.
  - 'Prof identifies three formally lawful entry approaches: immigration, work visas and temporary
    travel passes.'
  - The author states permanent immigration is processed through the CAS Department of Immigration
    and Naturalization (DIN) in Atlanta, and that legal residence in CAS proper can provide entry
    to the Denver sector.
  - Prof states that CAS citizens and landowning immigrants, not immigrants generally, are the two
    ordinary categories eligible to work legally in the fictional CAS Sector; obtaining either status
    requires direct dealings with CAS authorities in Atlanta. He separately describes a sector-issued
    work visa as an exception for other applicants. The visa is issued by the fictional sector management
    offices at East 31st Avenue and Wilson Court, with identity documentation, no outstanding arrest
    warrants or major felony convictions, and an existing sector job offer among the stated requirements.
    The bylined guide says the visa remains valid only during gainful employment and expires upon
    being laid off, fired, or quitting.
  - The guide says any CAS border-crossing post can issue a temporary travel pass, but sector management
    must pre-authorize it. Applications can be submitted electronically from public or private phones
    or via a virtual visit to the sector-management office through the Matrix. It distinguishes
    applying from receiving approval, noting applications may be denied. CAS Sector authorities
    record citizenship, immigrant status, work visa, or travel-pass credentials on an entrant's
    fictional credstick, which may be checked by Knight Errant sector security.
  - The writer describes a CAS license recorded on a credstick permitting certain personal-defense
    weapons, including a heavy pistol, and a separate license category for owning, transporting,
    and using semiautomatic long arms and certain autofire assault-style weapons, formally restricted
    to hunting. He distinguishes these from importing weapons, which requires additional import-license
    procedures. These are historical fictional setting-law descriptions, not current real-world
    permissions or weapons guidance.
  rights_and_uncertainty: Administrative claims are attributed to Prof, not promoted into contemporary
    law, and the book does not establish an updated Shadowrun Third Edition regime.
headline: 'Fictional CAS Sector work eligibility, travel-pass issuance and licensed weapon classes
  — FASA Corporation, Denver: The City of Shadows (1994, FASA7212, Shadowrun Second Edition-era),
  printed pp106–107/PDF107–108'
summary: 'Source-reviewed correction of Prof''s fictional CAS Sector account: ordinary work eligibility
  specifically requires CAS citizenship or landowning-immigrant status, with a separate work-visa
  exception; preserves exact travel-pass administration and edition-era weapon-license categories
  from printed pp106–107/PDF107–108.'
