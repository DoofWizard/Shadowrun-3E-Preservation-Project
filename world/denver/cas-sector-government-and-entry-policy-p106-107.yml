  section: CAS Sector government, permits, travel and corporate security
  source_attribution: Government and Law Enforcement article by named in-world writer
    Prof; the following are presented as his in-world historical and administrative
    claims.
  descriptive_statements:
  - Prof identifies Bianca Cuthbertson as the CAS Sector appointed manager, formerly
    controller of the Dallas/Fort Worth metroplex, with less than a year in the Denver
    position at the time of writing.
  - Prof reports her challenge to and restructuring of the sector security contractor
    Knight Errant Front Range Free Zone (KE-FRFZ), including several senior-management
    removals or expulsions.
  - 'Prof identifies three formally lawful entry approaches: immigration, work visas
    and temporary travel passes.'
  - The author states permanent immigration is processed through the CAS Department
    of Immigration and Naturalization (DIN) in Atlanta, and that legal residence in
    CAS proper can provide entry to the Denver sector.
  - The author says only CAS citizens or lawful immigrants can ordinarily work in
    the sector, with work visas requiring sector-management authorization and a qualifying
    job offer. The described sector management office is at East 31st Avenue and Wilson
    Court; a visa ceases when lawful employment ends.
  - Temporary travel passes require CAS sector-management authorization in advance;
    applications can be made electronically or at a sector office. CAS officials record
    a resident’s citizenship, immigrant status, visa or travel credentials on the
    fictional credstick system.
  - The author describes licenses associated with some personal-defense weapons and
    certain long arms, with additional import-license obstacles. This prose is an
    edition-era setting law claim, not permission or real-world weapons guidance.
  rights_and_uncertainty: Administrative claims are attributed to Prof, not promoted
    into contemporary law, and the book does not establish an updated Shadowrun Third
    Edition regime.
