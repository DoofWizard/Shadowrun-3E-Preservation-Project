  "data": {
    "publication_context": "Published fictional tabletop RPG sourcebook Denver: The City of Shadows (FASA Corporation, 1994; FASA7212; source.fasa-7212), original Shadowrun Second Edition-era setting. Original printed and PDF page numbers are retained; no Third Edition conversion is implied.",
    "section": "THE REAL POWER: Zone Economics; Organized Crime; Mafia; Yakuza; Other Organizations; Gangs; Triads",
    "book_narrator_facts": [
      "The fictional author Youchai distinguishes official sector economies from unofficial trade. Differing sector definitions of permitted goods and transactions change what appears in official statistics; the Treaty restricts signatory tariff policies without mandating uniform sector legality.",
      "The 2055 text gives California-hot simchips as legal and fashionable in the Ute Sector but illegal in the UCAS Sector, so a chip produced and sold outside the UCAS Sector may not appear in the UCAS official economy when sold there. The example is a setting account, not guidance.",
      "The book says assault-cannon, APDS and explosive rounds are legal for Sioux corporate-security forces, while Aztlan limits assault-cannon purchases/possession to specified government or Aztechnology security; it states authorized users receive certain rounds from Aztlan without a credit transaction. These are historical fictional setting claims, not modern legal advice or SR3 equipment rules.",
      "The source frames the shadow economy as generally crossing sector borders and divides it analytically into organized crime, smuggling and the shadow market. The Mafia and yakuza occupy less of Denver crime markets than in other cities; the Mafia concentrates on gambling, pornography and prostitution, while tending to avoid chip distribution and participating only marginally in illicit pharmaceuticals.",
      "The yakuza control approximately half of the illegal-chip distribution channels in the Free Zone and maintain a major illegal-drug market. They also seek entry into information brokerage by training and equipping their own deckers/fixers, while their described service portfolio includes extortion, sabotage and hired assassinations. The book notes both their reputation for successful contracts and high prices.",
      "The Fronts gang is concentrated in the UCAS and CAS sectors, composed of perhaps a dozen sets averaging approximately 50 members each, described mostly as male and mostly human and ork; Trey Eights and the BBs are distinguished. The BBs trade drugs and chips and act as intermediaries or hired protection for other fictional participants.",
      "The Godz are associated with highways around Pueblo and Ute sectors: a main group near 100 members and smaller groups west of Interstate 25. They provide escort and protection for transporters as described in the fictional setting. A few other North American gangs have Denver detachments, including the Hudson Hawks and Brineaters; the Cutters are described as reputed western arms traders.",
      "Three major Triad organizations—the White Lotus, Golden Triangle and Red Dragon—operate from the Chinatown region of the CAS Sector with a wider influence extending across sector borders. Their portrayed markets include protection/extortion, drugs and chips. Some Triad actors employ local intermediaries while having strong reported links to parent organizations in East Asia."
    ],
