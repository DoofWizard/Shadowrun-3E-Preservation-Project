    "publication_context": "Published fictional tabletop-RPG sourcebook Denver: The City of Shadows (FASA Corporation, 1994; FASA7212/source.fasa-7212), original Shadowrun Second Edition-era setting; printed/PDF source pages retained, no inferred Third Edition conversion.",
    "section": "THE REAL POWER: Zone Economics; Organized Crime; Mafia; Yakuza; Other Organizations; Gangs; Triads",
    "book_narrator_facts": [
      "The fictional book narrator distinguishes the official economies of the Denver sectors from unofficial trade: sectors report different legally permitted goods and transactions even though the Treaty prohibits signatories from levying tariffs and duties. The historical setting account does not assert uniform product legality among sectors.",
      "The source gives California-hot simsense chips as legal and fashionable in the Ute Sector but illegal in UCAS; manufacturing and legal sales in Ute do not make revenue from their later illicit UCAS sales appear in UCAS official statistics.",
      "The book contrasts fictional Sioux corporate-security permissions for assault-cannon, APDS and explosive rounds with Aztlan restrictions limiting assault-cannon purchases and possession to government or Aztechnology security. It says authorized Aztlan users receive some ammunition without a credit transaction. These are original fictional Second Edition-era setting distinctions, not actual laws or converted SR3 equipment rules.",
      "The book describes the shadow economy as crossing sector boundaries and introduces three analytic sections: organized crime, smuggling and the shadow market. It portrays Mafia and yakuza as controlling less local market share than in other North American cities.",
      "The narrator describes local Mafia profit centers as gambling, pornography and prostitution; its operators mostly avoid illegal-chip distribution and participate only marginally in illegal pharmaceuticals. The narrator states Mafia influence over gambling is strong, with gambling laws varying by sector.",
      "The book portrays yakuza as controlling approximately half the illicit-chip distribution channels in the Free Zone and a substantial illegal-drug market. They seek entry into information brokerage by training and equipping their own deckers and fixers; the text also describes extortion, sabotage and assassination-for-hire as their services, with high prices and a reputation for performance.",
      "The narrator places the homegrown Fronts principally in UCAS and CAS Denver sectors and describes probably a dozen sets averaging about fifty members each, predominantly male and human or ork. It distinguishes the violent Trey Eights from the business-oriented BBs; the BBs deal in drugs and chips, intermediate other transactions and offer hired protection.",
      "The narrator locates Godz around Pueblo and Ute highways, with a Boulder group numbering perhaps one hundred and smaller detachments west of Intercity 25. They offer escort/protection arrangements to fictional smugglers and other travelers as portrayed in the setting.",
      "The book identifies the Hudson Hawks (New York) and Braineaters (Austin) as visiting gangs with small Free Zone detachments. It describes the Cutters as influential West Coast arms dealers but attributes their alleged two UCAS-sector safehouses and as many as eighty members to rumor rather than established certainty.",
      "The three named major Triads are the White Lotus, Golden Triangle and Red Dragon, headquartered around Chinatown in the CAS sector yet operating across sector boundaries. Their portrayed markets include protection/extortion, drugs and chips; the narrator contrasts Triad preference for magic with Mafia/yakuza use of technology or muscle when magic is not suitable."
    ],
