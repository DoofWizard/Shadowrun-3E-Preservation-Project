    "book_narrator_facts": [
      "The fictional Free Zone treats information brokerage as its largest growth industry. Because the underground economy is difficult to measure, the source attributes a multi-billion-nuyen annual brokerage volume and almost 10 percent annual growth to responsible guesses, not a measured census.",
      "Proximity to the Nexus and to numerous major computer systems draws deckers and brokers to Denver. The source describes intel brokerage as a competitive, professional local industry rather than only an informal collection of freelance talent.",
      "The narrator says the average age of the principal A-list information-brokerage participants is seventeen; some highly skilled code and warez participants are as young as fourteen.",
      "Each Denver sector and some neighborhoods contain numerous political clubs; the narrator estimates between twenty and more than one hundred in the Free Zone and specifically discusses Humanis and Unity.",
      "Humanis leadership strongly denies organizational connection to Alamos 20K; the narrator characterizes this association as an open secret. The claim is about fictional organizations, not evidence about real-world groups.",
      "Unity arose shortly after the Treaty. The narrator characterizes Unity as anti-metahuman, anti-American, anti-government, xenophobic, homophobic and anti-magic, promoting a narrow Anglo-Saxon heterosexual human-supremacist worldview. These are attributed characterizations of an in-world political club.",
      "The narrator describes actual Unity links with Alamos 20K while also describing sustained mutual hostility between Unity and Humanis. During the preceding months, the narrator says many victims of violence by each organization were members of the other; the chapter does not explain the animosity."
    ],
