  section: 'What Costs What: the publication narrator’s UCAS-sector trade comparison'
  source_role: The unbylined sourcebook narrator introduces and explains the fictional
    UCAS Sector cost-of-living comparison; these are setting-period explanations,
    not named Shadowland speakers’ views or real-world economic claims.
  printed_p143_narration: The printed introduction warns that prices in the adjoining
    UCAS Sector comparison table differ sharply from the Seattle reference prices
    and asks readers to consider the causes of those differences.
  printed_p144_narration:
  - The narrator describes Seattle as a Pacific Rim trading center handling commerce
    and capital from other Pacific Rim nations.
  - The narrator says most legitimate commerce serving the fictional UCAS Sector comes
    instead from the rest of UCAS territory.
  - The publication describes the fictional UCAS proper as technologically advanced
    but possessing very limited natural resources, framing this combination as context
    for regional price differences.
  source_class_boundary: The original percentage-of-Seattle-prices table on printed
    p144 is a separate exact-rule record, rules/denver/ucas-sector-cost-of-living-exact-p144.yml.
    Do not merge, soften, or revalue the table here.
  attribution_boundary: The adjacent Quaestor and Lagtime posts are named fictional
    Shadowland reactions, retained separately in references/denver/ucas-cost-of-living-speaker-reactions-p144.yml.
    Their opinions do not become narrator-certified facts.
  scope_limit: Only the complete narrator-led What Costs What comparison printed from
    the bottom of p143 through the bottom-left continuation on p144 is indexed here;
    the separate Mother Jonah political article starting on p144 continues beyond
    the surviving original PDF and is not treated as complete.
