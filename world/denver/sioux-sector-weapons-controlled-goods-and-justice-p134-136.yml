  section: Sioux Sector weapons restrictions, controlled goods, law enforcement and
    judicial institutions
  source_type: Fictional sourcebook rules and narrative about Sioux Sector circa 2055;
    NOT real-world legal or tactical advice.
  weapons_policy_source_narrator:
  - All firearms heavier than light pistols must be licensed; applicants for such
    licenses supply a SIN and additional personal information. Once an application
    is approved, the purchase is subject to a 48-hour waiting period.
  - 'The narrator distinguishes purchase from carry: individuals may carry light pistols
    in public but may not carry heavier weapons.'
  - The book classifies single-shot, semi-automatic and burst-fire long arms as legal
    hunting weapons, but requires licenses and permits transport only between the
    person’s home and a recognized hunting area.
  - The source states bows of draw weight 13 kilograms or greater fall under the same
    restrictions as firearms.
  - Only security forces and their legal designates may carry weapons capable of full
    autofire.
  licensing_and_controlled_goods_narrator:
  - Only government-licensed purveyors may legally sell mindsim chips in the Sioux
    Sector. The source states modulation-amplitude rules are stricter than in UCAS,
    and chips less edgy than California hots can be illegal; it distinguishes legal
    and illegal chip classes.
  - The sector narrator treats recreational drugs as illegal and gives different consequences
    for possession, private use and dealing.
  - Government-mandated maximum wine alcohol content is 12 percent and beer content
    4.5 percent. Hard liquor can only be bought at government Liquor Distribution
    Branch outlets.
  law_enforcement_narrator:
  - The Bureau of Civil Enforcement, a branch of the Sioux Sector bureaucracy under
    the Council of Chiefs, contracts law-enforcement responsibilities to the Cheyenne-based
    private company Eagle Security Services Inc. (ESSI).
  - The publication dates ESSI’s founding to within weeks of the Treaty of Denver;
    it recruited retired Sioux Nation civilian police and armed-forces personnel,
    then within a year cooperated with the national police and army.
  - The Bureau of Justice (BJ) presides over criminal justice in the sector and is
    described by the narrator as less efficient than ESSI; people held for charges
    may wait months before a judiciary council hears their cases.
  - The narrator states a single judge, usually a shaman, presides over each judiciary
    council, judges serve life appointments unless removed by the BJ, and prosecuting
    and defending attorneys are required to hold BJ licenses in Cheyenne.
  - The narrator describes considerable discretion in judges’ treatment of evidence
    and precedent; this does not establish the later in-world speaker’s allegation
    of bribery.
  cyberware_and_cyberdeck_rules_narrator:
  - There is no licensing requirement for Class A cyberware; Class B and Class C cyberware
    require licenses issued after background checks.
  - Cyberdecks require a Bureau of Civil Enforcement license; applicants must provide
    extensive personal background data and permit chipsets to be inspected so deck
    writes can be identified for the Matrix audit trail.
  - Utility software must be separately licensed. Attack and masking utilities are
    prohibited and all other utilities may not exceed Rating 4.
  - 'Possessing or using illegal software carries the same cited penalty as an unlicensed
    cyberdeck: 25,000 nuyen and one year of jail time, applied separately to each
    piece of illegal software including backup copies.'
  scope_boundary: The complete Sioux weapon fines and punishment table on printed
    p136 is archived as a distinct rule_exact record, and all criminal offenses/sentences
    on p137 are distinct. In-world claims and anecdotes are attributed separately
    rather than silently adopted.
