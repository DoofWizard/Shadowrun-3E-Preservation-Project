  original_printed_pdf_page_map: 101/102
  section: Closing Aztlan Sector sites and Council-adjacent architecture
  book_narrator_setting_facts:
  - State Capitol Building (map location 7) replaced an earlier capitol demolished
    by the Council of Denver Administrative Branch in 2048; the replacement follows
    the Early Blockhouse school of architecture.
  - Cheesman Park Conservatory (map location 6), formerly Boetcher Memorial Conservatory,
    is a remodeled landmark; Aztlan-sector staff replaced local plantings with vegetation
    from the Aztlan region, and the geodesic transplanted dome emits a green light
    at night.
  - Anahuac University (map location 8) was claimed and renamed by the Aztlan government
    in 2027; the institution now serves largely as Aztechnology training for college-age
    children of senior corporate personnel.
  - Aztechnology Building (map location 53) stands on the former Denver Country Club
    grounds near University and Speer, with a sandstone-and-copper/glass exterior
    and at least four helipads. The narrator describes extensive security; various
    attacks are reported as having occurred, including one striking the thirty-second
    floor.
  source_transition: The Aztlan Sector discussion ends on p101; CAS Sector begins
    printed p102.
