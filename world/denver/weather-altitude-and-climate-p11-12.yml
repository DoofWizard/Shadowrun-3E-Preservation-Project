data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    published fictional historical Shadowrun Second Edition-era tabletop-RPG setting,
    source.fasa-7212; no inferred Shadowrun Third Edition conversion.'
  section: WEATHERING THE WEATHER
  fictional_narrator_climate:
    annual_precipitation_centimeters: 40
    rain_share: more than half
    sunshine: The book states Denver basks under 300 days of sunshine in an average
      year; Woppler challenges whether sunshine means rain-free days, and the book
      does not establish an exact count of entirely rain-free days.
    january:
      average_day_high_celsius: 6
      average_night_low_celsius: -8
      average_sunny_days: 22
      description: coldest month
    july:
      average_day_high_celsius: 30
      average_night_low_celsius: 15
      average_sunny_days: 21 or 22 per month
      description: hottest month; August is a close second
    weather_shadow: Westerly precipitation drops as rain or snow in the mountains;
      air descending eastward warms and dries.
    chinook: Warm dry Pacific-origin wind can raise temperatures by more than 20 C
      in one or two hours, particularly in January.
    city_elevation:
      meters: 1609
      feet: 5280
    mountain_vs_city: Winter news reports of half-meter snowfalls can concern surrounding
      mountains rather than the city proper.
    weather_hazards_as_narrated:
    - Fast changes and winter blizzards
    - Lightning storms
    - Hail storms
    - Flash floods
    - Avalanches
    - Occasional tornadoes
    source_caveat: Sourcebook in-world climate figures, not contemporary real-world
      measurements or medical guidance.
  fictional_narrator_altitude_effects:
    altitude_sickness: At the book’s stated Mile-High-City elevation, visitors can
      experience headaches, fatigue, shortness of breath and sleeping difficulties
      after limited activity.
    dryness: The fictional guide notes dehydration symptoms and advises slowing down
      while adjusting, without supplying tabletop modifiers.
    weather_variability: Winter changes can arrive abruptly; the section discusses
      hazards throughout the Free Zone.
