    "publication_context": "Fictional tabletop RPG sourcebook Denver: The City of Shadows, FASA Corporation (1994), catalog FASA7212, historical Shadowrun Second Edition era, source.fasa-7212; page numbers refer to original printed pages and their nominal physical PDF page numbers; no implied Third Edition conversion.",
    "section": "STAYING HEALTHY and medical coverage/response services",
    "narrator_established": [
      "Originally, the Denver treaty signatories determined health services individually; the Pueblo Sector used national-tax-funded care, other sectors allowed market providers, and Aztlan did not establish a comparable publicly managed system.",
      "The Council of Denver designated health care an FRFZ-wide infrastructure issue in 2039. It first directed the Administrative Branch to develop emergency medical and paramedic capabilities, but after predicted costs substantially exceeded the estimates it reversed course and contracted with a private provider.",
      "In 2043 the Administrative Branch awarded the health-services contract to a local DocWagon franchise. Initially basic services were available; by 2046 the franchise offered DocWagon Basic, Standard, Crisis, High-Threat Response, and higher membership levels through Super-Platinum.",
      "Every registered legal FRFZ resident holding a current SIN and not in default of taxation requirements is entitled to Basic DocWagon coverage at no direct membership charge.",
      "DocWagon maintains six main metropolitan response stations, one in each sector; stations operate limited clinics and communications/dispatch/transport-support facilities, while actual response availability varies.",
      "Seven additional response stations serve areas beyond metropolitan Denver, including the Colorado Springs, Boulder, and Palmer Lake regions. The book contrasts urban Boulder stations' predominantly ground transport with rural Palmer Lake's reliance on air transport.",
      "A sector's DocWagon station normally handles incidents inside that sector, subject to severe-disaster exceptions. The two geographically noncontiguous enclaves associated with UCAS and the Sioux Nation must be served from outside; the national authorities demand stringent sector-crossing inspections.",
      "An intersector DocWagon response team, including one attending a patient in critical condition, is required to stop at the crossing post, show appropriate identification, and permit inspections of its response vehicle and staff before proceeding across a demarcator.",
      "Patients can arrange transfers to hospitals in other sectors for additional charges. These are fictional published-world service arrangements; no modern real-world emergency recommendation is implied."
