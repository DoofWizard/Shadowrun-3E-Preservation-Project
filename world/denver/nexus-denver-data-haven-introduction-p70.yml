  section: The Nexus — The Denver Data Haven introductory overview
  narrator_facts:
  - printed_page: 70
    assertion: The book portrays the Denver Data Haven, also known in this chapter
      as the Nexus, as a network with an international reputation; people in cities
      including Danzig, Dakar, and Denver may recognize the name without knowing what
      the organization actually is.
  - printed_page: 70
    assertion: The underlying structure and the identities of people behind the Nexus
      are said to be known to comparatively small circles; the book portrays this
      limited knowledge as intentional.
  scope: These are descriptions within the original fictional Shadowrun setting, not
    factual allegations about any contemporary real-world network.
