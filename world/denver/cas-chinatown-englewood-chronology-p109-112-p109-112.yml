  section: Chinatown community chronology, relations, and magical developments
  book_narrator_setting_facts:
  - Denver Chinatown occupies the Englewood district in southeastern Denver and is
    described as a close-knit community distinct from surrounding CAS society.
  - The book traces migration in the late twentieth century and early twenty-first,
    including people from Hong Kong and Taiwan; immigration continued until about
    2015, after which political developments slowed movement.
  - The 2018 Treaty of Denver effectively barred new immigration, and geographic allotments
    initially placed Englewood on the United States-controlled side of Denver, not
    NAN territory.
  - In 2034 the Treaty of Richmond transferred the sector containing Chinatown to
    the CAS. Local residents maintained their community through this political change.
  - The community reached more than 20,000 residents; accounts in the publication
    mention powerful mages and business ties to megacorporations, alongside rumor,
    not certainty, concerning the mages.
  - Humanis-related riots began in 2048, with repeated looting and vandalism of Chinatown
    establishments. The publication states raids abruptly ended in summer 2052 without
    establishing why.
  - Most present residents are second- and third-generation citizens. The narrator
    describes strong family and community relationships and complex ethnic/metahuman
    relations; this is an in-world narrator viewpoint, not an objective cultural generalization.
  - The book presents disagreement between traditional magic and new technology as
    an ongoing community theme, illustrating it with a family marriage ceremony and
    conflicting musical traditions.
  critical_context: Keep racist allegations and discriminatory in-world descriptions
    attributed; the source contains overtly prejudiced posters whose claims are not
    endorsed as facts.
