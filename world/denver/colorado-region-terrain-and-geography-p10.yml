  section: THE COLORADO REGION
  narrator_geography:
    extent: Front Range Free Zone embraces Denver, Boulder and Colorado Springs and
      territory between them, while the three cities remain physically distinct; open
      areas separate built-up sections.
    identity: The Front Range Free Zone is the Treaty City region; the book distinguishes
      the larger region from the Denver metropolitan core.
    highest_point:
      name: Mount Elbert
      height_meters: 4402
      height_feet: 14433
      approx_distance_outside_free_zone_kilometers: 70
    lowest_point:
      height_meters: 1022
      height_feet: 3350
    average_elevation:
      height_meters: 2100
      height_feet: 6800
    fourteen_thousand_foot_peaks:
      regional_count: 51
      north_american_count: 80
      threshold_meters: 4267
      threshold_feet: 14000
    terrain: Great Plains to the east give way to Rocky Mountain foothills at the
      Front Range; mountains run generally north-south.
    regional_air_travel: The narrator calls Denver a center for fictional t-bird travel,
      and names Route Pack 1, Ho Chi Minh Trail, and Autobahn as in-world travel routes.
    source_caveat: Narrated fictional geographic figures and named routes, not an
      up-to-date real-world Denver geography or aviation guide.
  linked_topographic_illustration: Original map on same printed page cataloged separately.
