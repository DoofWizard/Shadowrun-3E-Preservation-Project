  section: Pueblo Sector geography and source-period fictional border security
  geographic_demarcation:
  - The book traces the Pueblo demarcation east along Highway 70 to south of Golden,
    then Highway 40 toward the city center.
  - The line turns south following Intercity 25, the South Platte River, and Highway
    85 to Route 470, where it turns east.
  - At the Intercity 25 and CAS Sector border the line turns south; near Colorado
    Springs it follows Intercity 25 and the 1986 municipal boundary.
  - Fort Carson Military Reservation lies in Pueblo territory, according to the in-world
    commentary.
  border_security:
    source_byline: Sgt. York, fictional in-world narrator, printed p118
    account: The source contrasts Pueblo patrols in especially sensitive areas with
      extensive electronic boundary monitoring elsewhere. It describes linked sensors,
      alerting, remotely supervised drones and airborne or ground response as fictional
      setting background, without supplying real-world implementation directions.
    border_crossing: The source also describes official crossings having sector security
      guards and possibly response aircraft; lawful and unauthorized movement are
      treated distinctly.
  source_period: The chapter’s fictional discussion dates to May and June 2055.
