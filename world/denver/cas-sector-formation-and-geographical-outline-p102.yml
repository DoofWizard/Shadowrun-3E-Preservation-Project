  section: CAS Sector — 2034 establishment and treaty-era border outline
  book_narrator_facts:
  - The narrator identifies 2034 as the year the UCAS Sector voluntarily ceded a portion
    of its territory to the Confederated American States in a political maneuver,
    creating a sixth Treaty nation in Denver.
  - The fictional CAS Sector includes portions of Denver proper and a connection around
    Colorado Springs. The printed border description follows several major roadways
    and makes an irregular downtown jog rather than an even geometrical division.
  border_description_from_source:
  - Within Denver, the boundary heads east along Highway 70 from its crossing with
    Intercity 25 toward Stapleton, south along Route 225, and along Highway 83 south
    from its intersection with 225.
  - South of the Aztlan Sector, the eastern boundary turns across country to Highway
    24 at Peyton, follows 24 southwest to Colorado Springs, continues around Colorado
    Springs and north on Intercity 25 toward Highway 470.
  - From Highway 470 it runs west to Route 85, then north to Highway 228 (East Jefferson
    Avenue), then east back to Intercity 25. The route merges into South Colorado
    Boulevard, runs east at Colfax, makes an irregular downtown jog, and returns along
    Intercity 25 and Highway 70 toward Stapleton.
  interpretive_limits: This is fictional border geography, not a map of current real-world
    sovereignty or an operational crossing procedure.
