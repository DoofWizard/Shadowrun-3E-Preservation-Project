  section: CAS Sector overview, territorial boundaries and May 2055 Datafact
  setting_history_and_geography:
  - The in-book narrator states that in 2034 the UCAS Sector voluntarily ceded part
    of its Denver territory to CAS, establishing a sixth Treaty nation.
  - The printed p102 territorial line follows Highway 70 east from Intercity 25 near
    Stapleton; Route 225 south; Highway 83 south; Highway 24 near Peyton and around
    Colorado Springs; then Intercity 25 north, Highway 470 west, Route 85 north, Highway
    228 east, Intercity 25 north, South Colorado Boulevard and Colfax, with an irregular
    downtown detour back toward Stapleton.
  - Printed p104 describes a mostly ten-meter sector fence or wall, with some approximately
    five-meter stretches between CAS and UCAS north of Colorado Springs.
  - The narrator describes three-person CAS patrols, sometimes with trained dogs,
    and sophisticated sensor arrays restricted to more sensitive stretches of the
    border.
