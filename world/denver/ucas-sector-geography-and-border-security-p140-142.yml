    "section": "UCAS Sector original boundaries and narrated border infrastructure",
    "narrator_geography": [
      "The historical fictional UCAS Sector runs from the northeast along Highway 76 toward the center, follows Route 6 to Highway 70, then turns east and cuts approximately south along Highway 225 and Route 83.",
      "One non-contiguous portion of downtown is bordered in part by East Colfax Avenue, Pennsylvania Street, East 18th Avenue, and 17th Street.",
      "In Colorado Springs the boundary follows Route 2A toward Intercity 25, then turns east along the old city border."
    ],
    "narrator_security": [
      "The narrator characterizes the UCAS as one of the original Treaty of Denver signatories and says its old physical wall once ran for more than 75 kilometers; modifications to boundaries between 2018 and 2055 mean the wall no longer exactly follows the current sector perimeter.",
      "The fictional border still includes a six-meter-high wall topped with razorwire and monowire, with imaging and detection systems; rural stretches use standard fencing rather than the city walls.",
      "The sourcebook narrator first states on printed p142 that the UCAS does not mine the border no-man’s-land and does not mount manned patrols there during the day; after dark, guard-dog patrols cover the UCAS side. This statement is retained as printed, rather than universalized, because a later paragraph on that same page describes mining in the rural border stretches.",
      "A later narrator paragraph on printed p142 explicitly states that along fence stretches away from the city, the UCAS heavily mines its portion of the no-man’s-land; this specific rural description is preserved alongside the earlier statement that the UCAS does not mine no-man’s-land. The source does not expressly reconcile the apparently contrasting accounts.",
      "Along rural fence stretches away from the city, patrols on the UCAS side operate GMC Banshee LAVs and Yellowjacket rotorcraft with non-standard armor. LAV crews usually extend their surveillance range by keeping one or more drones airborne at all times, according to the printed p142 narrator."
    ],
    "source_scope": "Fictional game-world description from a 1994 published sourcebook, not procedures or advice for contemporary security systems.",
    "attribution_exclusions": "Speculation about surgically altered dogs, tracking collars, nerve sensors, spirit patrols, and emergency response timing belongs only in separate named-speaker claims, not in narrator assertions.",
    "source_assertion_reconciliation": "Original printed p142 contains both the earlier unqualified statement that the UCAS does not mine no-man’s-land and a later statement that it heavily mines its own part along rural fence stretches. This reference preserves both narrator passages and their rural context without inventing a resolution."
