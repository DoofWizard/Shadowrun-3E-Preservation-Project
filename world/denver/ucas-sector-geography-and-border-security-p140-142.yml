    "section": "UCAS Sector original boundaries and narrated border infrastructure",
    "narrator_geography": [
      "The historical fictional UCAS Sector runs from the northeast along Highway 76 toward the center, follows Route 6 to Highway 70, then turns east and cuts approximately south along Highway 225 and Route 83.",
      "One non-contiguous portion of downtown is bordered in part by East Colfax Avenue, Pennsylvania Street, East 18th Avenue, and 17th Street.",
      "In Colorado Springs the boundary follows Route 2A toward Intercity 25, then turns east along the old city border."
    ],
    "narrator_security": [
      "The narrator characterizes the UCAS as one of the original Treaty of Denver signatories and says its old physical wall once ran for more than 75 kilometers; modifications to boundaries between 2018 and 2055 mean the wall no longer exactly follows the current sector perimeter.",
      "The fictional border still includes a six-meter-high wall topped with razorwire and monowire, with imaging and detection systems; rural stretches use standard fencing rather than the city walls.",
      "The publication narrator explicitly says the UCAS does not mine the border no-man's-land and does not mount manned patrols of that area during the day; after dark, guard-dog patrols cover the UCAS side.",
      "Along rural fence segments, narrator describes GMC Banshee LAVs and Yellowjacket rotorcraft with non-standard armor, and airborne drones used for surveillance."
    ],
