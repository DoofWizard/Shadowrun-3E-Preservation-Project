    "publication_context": "Fictional tabletop role-playing sourcebook Denver: The City of Shadows, FASA Corporation (1994), catalog FASA7212, source.fasa-7212; original Shadowrun Second Edition-era setting with no implicit Third Edition conversion.",
    "section": "STAYING HEALTHY (printed p49) and continuation (printed p51; p50 is independently indexed original artwork)",
    "publication_narrator_facts": [
      "Initially the fictional Council of Denver left healthcare in the Front Range Free Zone to the discretion of each Treaty signatory. Independent providers entered and left the market with market-driven prices; the Treaty Commission did not initially establish centralized healthcare.",
      "After the United States created its autonomous defense zone and the city was partitioned, the Pueblo Sector financed national-revenue-funded healthcare, UCAS allowed market-based care, and the Aztlan Sector neglected this issue according to the source's narrator. This describes the publication's invented political history, not a judgment about real contemporary jurisdictions.",
      "In the fictional year 2039, the Council declared healthcare an infrastructure matter crossing the signatory nations' interests and instructed the Administrative Branch to develop zone-wide emergency medical and paramedic response, including on-site care and medical evacuation.",
      "After estimates for establishing the service reached four times the original projections, the Council authorized the Administrative Branch to employ a private provider. In the fictional year 2043 it awarded the Free Zone medical services contract to a local DocWagon franchise.",
      "DocWagon initially offered rudimentary service, subject to its famous ten-minute response guarantee. By 2046 its available tiers extended from Basic to Super-Platinum, including Standard, Crisis, and High-Threat Response.",
      "Every legal Front Range Free Zone resident registered with the Administrative Branch, holding a current System Identification Number (SIN), and not in default of taxation requirements receives Basic DocWagon coverage without an additional service charge.",
      "Seven additional response stations lie beyond metropolitan Denver in areas including Colorado Springs, Boulder and Palmer Lake; equipment and capabilities vary by region. The source specifically contrasts predominantly land-based transport at Boulder with predominantly air-based transport at rural Palmer Lake.",
      "Ordinarily the DocWagon response station assigned to a sector handles emergencies there, except a disaster beyond its capability. The two non-contiguous enclaves at Denver's center, assigned to UCAS and Sioux Nation, are too small for dedicated stations and are supported by teams responding from outside.",
      "The two noncontiguous central seclaves are associated with UCAS and the Sioux Nation, not Aztlan. According to the publication narrator, any DocWagon support team crossing into these enclaves or across other sector borders, including the separate Aztlan Sector, must report at the border-crossing post. Each responder must provide identification, and the vehicle and team are subject to inspection on entry and again on departure, including when a patient is in critical condition.",
      "Patients can arrange transfers to other hospitals at an additional fee, according to the narrator."
    ],
