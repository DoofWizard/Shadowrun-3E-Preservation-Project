  source_context: Historically published in-world fictional setting information; narrator
    facts, attributed Shadowland posts, and hypothetical examples are distinct.
  extraction:
    pass_program:
      narrator: Aztlan Sector pioneered the fictional frequent-traveler program for
        workers regularly moving across multiple sector demarcators. A successful
        applicant must persuade relevant immigration agencies that travel is justified
        and they are not a security risk.
      credential: A special passcard contains a microtransponder with personal data
        and allows faster passage through sensor arch and separate doorway when records
        match.
      retained_security: Data mismatch causes additional questioning; routine scanning
        still applies.
      attributed_cain: Cain warns that borrowed credentials are subject to cancellation
        and expiration; the statement is a comment, not a step-by-step fraud method.
    vehicular_crossings:
      narrator: Crossings handle pedestrians and small motorcycles; many posts lack
        capacity for large vehicles. Vehicular occupants must normally undergo personal
        inspection while luggage and the vehicle can be searched.
      inconsistency: Inspection rigor depends on sector and discretion; the narrator
        contrasts rapid checks with intrusive vehicle disassembly.
      vehicle_passes: Special vehicle passes are mainly for certified deliveries and
        official or corporate vehicles. Encoded data include vehicle configuration,
        weight, appearance, passengers and other identifying details and are compared
        to stored records.
      delivery_advance_notice_hours: 24
      approved_delivery: Certified bonded couriers have special transit paths for
        same-day inter-sector deliveries; the narrator says most firms prefer Matrix
        routing over routine physical carriage.
    claims_separated: Named characters also allege discriminatory scrutiny and inconsistent
      vehicle handling; these claims are preserved in the separate attributed-commentary
      record.
