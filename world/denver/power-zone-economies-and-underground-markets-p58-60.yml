    "publication_context": "Fictional tabletop-RPG sourcebook Denver: The City of Shadows (FASA Corporation, 1994; FASA7212; source.fasa-7212), historical Shadowrun Second Edition-era setting. Printed page numbers map to PDF page number plus one; no Third Edition mechanics conversion.",
    "section": "The Real Power / Zone Economics / Organized Crime / Mafia / Yakuza / Other Organizations",
    "book_narrator_facts": [
      "The fictional Denver Free Zone sector economies differ because individual signatory nations and sectors categorize legal and illicit transactions differently, not principally because they levy intersector customs duties. The same consumer demand and actual trade may be counted in one official sector economy but omitted in another.",
      "The narrator illustrates this discrepancy with California-hot simchip products, which are illegal in the UCAS Sector but permissible in the Ute Sector: the original chipmaker sales appear in Ute official economic figures, whereas dealers’ resale receipts for unlawful UCAS sales are excluded from the UCAS official figures.",
      "For ammunition, the source contrasts corporate-security purchases of assault-cannon rounds, APDS ammunition and explosive rounds under Sioux law with Aztlan restrictions: in the Aztlan Sector only the Aztlan government security forces or Aztechnology security assets may buy, acquire or possess assault-cannon rounds. The source states that authorized government and corporate security users receive rounds from Aztlan government without monetary payment.",
      "Official Free Zone economic accounting, with Aztlan noted as an exception to the published government figures, is based on transactions sanctioned by the source’s fictional Guardians of Public Morals and Marketplace Propriety. The unreported shadow economy generally crosses national and sector boundaries regardless of local legality. The narrator divides it into organized crime, smuggling, and the shadow market.",
      "The narrator identifies traditional organized-crime enterprises in the 2055 Denver Free Zone as including drug and illicit simchip distribution, gambling, pornography, prostitution, extortion, assassination, large-scale computer fraud, and large-scale racketeering or corruption. In the source, larger groups leave much smuggling, arms trading and unlawful intersector purchasing to smaller associations.",
      "The Mafia Families concentrate on gambling, pornography and prostitution rather than on illicit simchip distribution; the narrator describes the Families as dabbling only in the illicit pharmaceutical market. They have expanded the Free Zone illegal-gambling business nearly single-handedly and exclude yakuza organizations from much of that market; legal gambling varies by sector and license.",
      "Yakuza groups control approximately half the fictional Free Zone illicit simchip distribution channels, while independent dealers and Triads control the other half. The yakuza also have a strong position in the illicit drug trade, a market the narrator says they largely developed. To enter information brokerage they have chosen to train their own deckers, establish fixers, and supply both with advanced technology, hoping to attract Denver assets. The narrator characterizes initial results as limited, and longer-term results as uncertain.",
      "The narrator identifies yakuza offerings as paid criminal services involving extortion, sabotage and assassination. The fictional source characterizes them as costly but widely employed by rival shadow-market participants.",
      "In the 2055 setting, Mafia and yakuza organizations remain the two largest influential conventional organized-crime networks, while other groups have a smaller but meaningful presence."
    ],
