  section: CAS Sector 2034 founding, borders, defenses, May 2055 datafacts
  narrator_facts:
  - In 2034, the UCAS Sector voluntarily ceded a portion of its Denver territory to
    the CAS, creating a sixth Treaty nation.
  - In Denver proper the CAS boundary follows Highway 70 east from Intercity 25, moves
    south past Stapleton, follows Route 225 south to Highway 83, then proceeds south
    along Highway 83. South of the Aztlan Sector it turns toward Highway 24 at Peyton
    and follows that highway southwest into Colorado Springs.
  - The border follows Highway 24 around Colorado Springs, then swings north along
    Intercity 25 toward Highway 470, turns west to Route 85, follows Route 85 north
    to Highway 228 (East Jefferson Avenue), returns east and north via Intercity 25,
    then returns toward Stapleton along Highway 70. These are fictional 2055 mapped
    boundaries, not current geography.
  - Printed p104 says CAS border barriers are generally 10-meter fences with some
    walls; the southern stretch near Elbert and Peyton between CAS and UCAS reaches
    5 meters high or less.
  - CAS security teams generally patrol on foot in groups of three, often with attack
    dogs. The book narrator says advanced sensor arrays are concentrated in relatively
    few sensitive locations, primarily along rural stretches.
