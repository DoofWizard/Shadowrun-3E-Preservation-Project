  section: Nexus Matrix Location and virtual environment
  narrator_facts:
  - page: 77
    assertion: The main physical location of the fictional Denver Data Haven is stated
      to be approximately 15 kilometers north of Colorado Springs, deep underground
      at the north end of the former United States Air Force Academy; its computing
      resources have since been distributed to other geographic locations for security.
  - page: 77
    assertion: The site houses powerful computers belonging to Shadowland’s backbone
      but the books says no single on-site data store is indispensable, because data
      stores have been duplicated elsewhere. The source compares the site’s processing
      capability to five Cray-Atari X-52 supercomputers while noting the effective
      total is dispersed among a couple dozen smaller machines.
  - page: 77
    assertion: The physical site also houses key system operators who groom and maintain
      the underground network; despite geographic dispersal, the site is portrayed
      as a major coordination and operational center.
  - page: 77
    assertion: A descriptive metaphor compares system memory to millions of terabytes
      and mass storage to billions of megabytes. This is explicitly an analogy by
      the narrator rather than a tested hardware specification; the narrator calls
      the Nexus cyberspace very high resolution.
  - page: 77
    assertion: The book says the Nexus has no straightforward Matrix-facing access
      SAN; outside connections arrive through other Shadowland nodes and intermediary
      infrastructure.
  - page: 78
    assertion: The Nexus’s cyberspace contains visual constructs described as a solar-system-like
      panorama of planets moving around a central black hole, with planets representing
      individual nodes and the black hole representing data controlled by the Nexus.
  - page: 78
    assertion: Certain private-office and meeting-room nodes have windows into that
      shared view. The narrator says the network visual imagery can change daily while
      the central black-hole motif remains.
  - page: 78
    assertion: The narrator describes the network as enabling access to data from
      its affiliated nodes and external haven partners; the ability to discover any
      particular information is described as conditional on its availability and access
      permissions.
  context: The source describes a fictional Shadowrun cyberspace, not an actual present-day
    computing or cybersecurity system.
