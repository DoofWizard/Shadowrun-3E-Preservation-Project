data:
  publication_context: 'Fictional tabletop RPG sourcebook Denver: The City of Shadows, FASA
    Corporation (1994), FASA7212/source.fasa-7212, original Shadowrun Second Edition-era setting,
    no inferred SR3 conversion. Original printed page labels correspond to physical PDF folios
    one greater.'
  section: Nexus Matrix Location and virtual environment
  narrator_facts:
  - page: 77
    assertion: The main physical location of the fictional Denver Data Haven is stated to be
      approximately 15 kilometers north of Colorado Springs, deep underground at the north end
      of the former United States Air Force Academy; its computing resources have since been
      distributed to other geographic locations for security.
  - page: 77
    assertion: The site houses powerful computers belonging to Shadowland’s backbone but the
      book says no single on-site data store is indispensable, because data stores have been
      duplicated elsewhere. The source compares the site’s processing capability to five Cray-Atari
      X-52 supercomputers while noting the effective total is dispersed among a couple dozen
      smaller machines.
  - page: 77
    assertion: The physical site also houses key system operators who groom and maintain the
      underground network; despite geographic dispersal, the site is portrayed as a major coordination
      and operational center.
  - page: 77
    assertion: The sourcebook's historical fictional hardware description says real system memory
      is measured in terapulses, virtual memory is one million times that amount, and mass storage
      is measured in billions of megapulses. These invented-world units and the specific real-versus-virtual
      distinction are preserved as printed; they are not terabytes/megabytes, modern units,
      a measured present-day specification, or an SR3 conversion. The narrator describes Nexus
      cyberspace resolution as extraordinarily high.
  - page: 77
    assertion: The book says the Nexus has no straightforward Matrix-facing access SAN; outside
      connections arrive through other Shadowland nodes and intermediary infrastructure.
  - page: 78
    assertion: The Nexus’s cyberspace contains visual constructs described as a solar-system-like
      panorama of planets moving around a central black hole, with planets representing individual
      nodes and the black hole representing data controlled by the Nexus.
  - page: 78
    assertion: Certain private-office and meeting-room nodes have windows into that shared view.
      The narrator says the network visual imagery can change daily while the central black-hole
      motif remains.
  context: The source describes a fictional Shadowrun cyberspace, not an actual present-day
    computing or cybersecurity system.
  attribution_boundary_note: The discussion on printed p78 about reaching affiliated Shadowland
    nodes and other data havens is attributed to named Shadowland commentator Rebecca rather
    than stated by the book narrator. Her disputed access claims and the specific Monobe incident
    remain in the separate indexed attributed-claims record for printed pp77–79; this world_fact
    file does not promote them to narrator facts.
