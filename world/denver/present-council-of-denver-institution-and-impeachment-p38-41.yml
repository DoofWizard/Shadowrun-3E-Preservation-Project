    "mandate_and_limits": [
      "The treaty assigns the council the task of maintaining the Front Range Free Zone and enforcing treaty provisions, including land harmonization.",
      "The original narrator characterizes the council as an often-deadlocked institution with limited independent enforcement power.",
      "The council has no troops, police or other standing security force of its own, and cannot directly compel member nations to execute its decisions.",
      "Council resolutions instead rely on diplomatic pressure and signatory nations' mutual self-interest. The text separately distinguishes political negotiations from direct treaty enforcement.",
      "The treaty forbids national military units in the Front Range Free Zone and separately restricts tariffs and excise taxation in the Free Zone; enforcing these limits can depend on voluntary cooperation or threatened reciprocal action."
    ],
    "representative_selection": [
      "The Treaty requires one representative for each signatory but does not prescribe how nations appoint representatives, term length or qualifications.",
      "The current government of each signatory determines its representative.",
      "Ute and Pueblo initially experimented with popular selection; the book notes these procedures ended in 2030 and 2034 respectively.",
      "Only the council itself may impeach a representative under the treaty. Impeachment requires a majority vote, and a representative targeted for removal may vote on that very resolution.",
      "A resolution seeking removal of a particular representative cannot be revisited against that same representative for four months; the source notes the potential for delay or strategic use of the rule.",
      "The Treaty makes no provision for an acting quorum when a nation is slow to replace an impeached representative, so successful removal may effectively paralyze the Council until a successor takes office.",
      "The source narrator states Aztlan twice delayed appointing successors for weeks after a council impeachment."
    ],
