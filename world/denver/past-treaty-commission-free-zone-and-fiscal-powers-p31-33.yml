data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994), a published fictional
    Shadowrun Second Edition-era tabletop role-playing sourcebook, catalog source.fasa-7212; no inferred
    Third Edition conversion.'
  extraction:
    political_settlement:
    - 'After hostilities declined, five claimant governments pressed their rival claims to Denver: Aztlan,
      Pueblo, Sioux, Ute and the United States. Other Native American nations did not secure the city
      in the treaty arrangement.'
    - Denver included the military facilities Fort Carson, Rocky Mountain Arsenal and the U.S. Air Force
      Academy, together with other strategic infrastructure.
    - 'The Treaty Commission chose collective governance: the Council of Denver had one representative
      from each of the five signatories, with a simple majority sufficient for its usual decisions.'
    - The Treaty established an extraterritorial Front Range Free Zone in 2019, governed by the Council
      rather than any single claimant nation. The Council was responsible for core humanitarian services,
      infrastructure and preserving Denver's exceptional status.
    - The nations could not directly levy national taxes on Denver residents or Free Zone business transactions,
      nor impose import/export tariffs there. The Council itself was authorized to levy income, value-added
      and similar capped taxes.
    - The Treaty prohibited claimant nations from placing military forces or moving military personnel
      into the Free Zone; its terms also made Denver generally open to all claimant countries.
    narrator_political_effect: Pueblo, Sioux and Ute formed a three-of-five voting bloc. The treaty initially
      encouraged cooperation, but the United States faced delays meeting relocation obligations and relations
      worsened.
  editorial_review_notes: Fiscal and treaty rules are historical fictional political arrangements, not
    player dice-roll mechanics. Distinguish prohibited national taxation from permitted Council taxes.
