  section: Pueblo-sector Fort Carson military reservation history
  book_narrator_facts:
  - The published fictional setting places Fort Carson Military Reservation south
    of Colorado Springs on the municipal boundary, between Route 115 and Intercity
    25.
  - Before the Treaty of Denver, the reservation housed the United States Fourth Mechanized
    Infantry Division and several independent US Army formations; the chapter describes
    the location as an early twenty-first-century staging base for US rapid-deployment
    forces.
  - During the Indian Wars, the site served as a logistics, supply and command/intelligence
    center for US forces; urban demolition associated with the fictional conflict
    transformed surrounding areas.
  - The narrator reports that US orders to withdraw were rescinded shortly after the
    fictional Genocide Campaign command and forces regrouped at the reservation.
  - After the Treaty, the United States could no longer legally station military forces
    on Free Zone territory. The narrator says the US nominally redesignated some forces
    as civilian security assets but they deserted the reservation within three months.
  - The land lay idle until 2035, when Pueblo took control and began rebuilding; within
    approximately one year the fictional Pueblo Security Enterprises, Inc. staffed
    the base.
  - The narrator says local residents still experience a military presence and reports
    heavy-weapons echoes from testing facilities.
  named_in_world_claims_not_established_by_narrator:
  - speaker: Backlash
    claim: Describes the former Carson vicinity, US military families, and demolition
      of surrounding neighborhoods during the Indian Wars as a personal historical
      account.
  - speaker: Moraya
    claim: Claims explosions also destroyed Air Force Academy facilities; this is
      an attributed assertion, not a confirmed narrator fact.
  - speaker: Jiuhanine
    claim: Disputes whether everything at the Academy was destroyed.
  - speaker: Cyn
    claim: Uses a derogatory racialized phrase for Pueblo personnel; this is the speaker’s
      language, not the archive’s characterization.
  - speaker: Larkspur
    claim: Questions why Pueblo retained the Fort Carson name after demilitarization.
  - speaker: Ripper
    claim: Speculates that the retained name was a political taunt.
  - speaker: The Laughing Man
    claim: Offers a more complex, unexplained interpretation of the site name.
  chronology:
  - Pre-Treaty US occupation
  - Indian Wars and Treaty of Denver
  - Withdrawal and deserted facilities within three months
  - Pueblo takeover in 2035
  - Fictional 2055-era commentary
