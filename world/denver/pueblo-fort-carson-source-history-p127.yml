  section: Pueblo-sector Fort Carson Military Reservation, published fictional history
  book_narrator_facts:
  - The published fictional setting locates Fort Carson Military Reservation south
    of Colorado Springs at the city boundary, flanked by Route 115 and Intercity 25.
  - Before the Treaty of Denver, Fort Carson housed the United States Fourth Mechanized
    Infantry Division and smaller independent United States Army formations. At the
    start of the twenty-first century it served as an important staging base for United
    States rapid-deployment forces.
  - During the fictional Indian Wars, while the conflict described by the book as
    the "Indian Question" became a prolonged guerrilla struggle, Carson provided logistics,
    supplies, and C-cubed-Eye (Command, Control, Communications, and Intelligence).
    As Denver came to seem the principal battlefield, United States forces concentrated
    at the reservation, and construction units demolished surrounding buildings to
    create a broad security zone around the base.
  - The narrator describes a few guerrilla-style engagements, mainly defensive fighting
    near the base against individual missile attackers. Troops then prepared for the
    campaign the text calls the "Genocide Campaign." Military commanders rescinded
    the campaign orders exactly two minutes after H-hour; forces remained at staging
    positions for several days while fallout settled, then returned to Fort Carson.
    The rescinded orders were campaign orders, not orders to withdraw.
  - Following the Treaty of Denver, the United States could no longer legally station
    military forces in the Free Zone. The book says the United States, like other
    Treaty signatories, reclassified military units as "civilian security assets"
    to satisfy its provisions. The forces left Fort Carson within three months after
    the Treaty.
  - The site lay idle until 2035, when the Free Zone's "native sector" split and Pueblo
    assumed control. Pueblo began construction promptly; within approximately a year
    the rebuilt base was staffed by the nominally civilian Pueblo Security Enterprises,
    Inc.
  - 'The narrator says residents of Colorado Springs and Denver perceived little change
    in Fort Carson after 2018: personnel appearing to resemble soldiers remained visible
    on streets, and noise from heavy weapons continued to be heard from testing ranges.'
  named_in_world_claims_not_established_by_narrator:
  - speaker: Backlash
    claim: Offers a personal account of the surrounding Colorado Springs housing,
      military families, and demolition of neighborhoods during the fictional war.
  - speaker: Moraya
    claim: Alleges that explosions destroyed useful material at Fort Carson and at
      the Air Force Academy; this is the in-world speaker's account, not an independently
      established narrator fact.
  - speaker: Huahine
    claim: Qualifies Moraya's claim, suggesting that not everything at the Academy
      was destroyed. The printed speaker name is Huahine, not Jiuhanine.
  - speaker: Cyn
    claim: Sarcastically rejects the "civilian" description of Pueblo Security Enterprises,
      using a self-directed expression about Cyn's own body. This is not a narrator
      characterization or a racialized insult directed at Pueblo personnel.
  - speaker: Larkspur
    claim: Questions why Pueblo kept the Fort Carson name after the earlier violent
      decommissioning.
  - speaker: Ripper
    claim: Guesses that Pueblo kept the Fort Carson name as a political taunt toward
      the UCAS; the guess is explicitly speculative.
  - speaker: The Laughing Man
    claim: Suggests the explanation for the place name is more complex and that renaming
      can diminish a place's power; no definitive motive is supplied.
  chronology:
  - Pre-Treaty United States military presence at Fort Carson
  - Indian Wars, aborted "Genocide Campaign" orders, and Treaty of Denver
  - Reclassification and departure of forces within three months of the Treaty
  - Pueblo control and reconstruction beginning in 2035
  - In-world commentary dated 2055
