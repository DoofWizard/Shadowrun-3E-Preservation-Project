  extraction:
    book_narrator: Before the Indian Wars, the Greater Denver Metropolitan Region grew as a continuous
      urban sprawl encompassing Denver, Boulder, and Colorado Springs. The narrative describes the expansion
      as especially contested by Native groups. During the final phase before the Great Ghost Dance, United
      States military forces razed parts of the sprawl for tactical defense near their installations,
      euphemistically called enforced urban renewal.
    continuation: The source section continues on printed p36/PDF37 after the full-page original illustration
      on p35; later outcomes and land-return restrictions are preserved in distinct continuation records.
  editorial_review_notes: This record preserves only assertions actually present in printed p34; it does
    not pre-empt or manufacture subsequent historical outcomes.
