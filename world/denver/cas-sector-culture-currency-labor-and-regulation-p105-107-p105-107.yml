data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212; source.fasa-7212),
    a 1994 historical Second Edition-era Shadowrun fictional tabletop RPG sourcebook'
  original_printed_pdf_page_map: 105-107/106-108
  section: CAS culture, money, legal entry, work visas, travel passes, and arms/chips
    regulation
  speaker_and_narrator_distinction: Bobby E. authors p105 lifestyle discussion and
    prices; Prof authors p106–107 governance overview, both explicitly identified
    as in-world named writers, not universal narrator guarantees.
  speaker_bobby_e_reported_claims:
  - Bobby E. describes a distinct CAS urban culture with conservative social styles,
    outdoor recreation and relatively low conspicuous consumption, while conceding
    the sector has problems.
  - Bobby E. reports the CAS Sector legally uses CAS dollars, with nuyen also used
    informally; in late May 2055 the quoted exchange rate is about 1 nuyen = 4.75
    CAS dollars, changing day by day.
  speaker_prof_reported_policy:
  - Prof identifies Bianca Cuthbertson as the CAS Sector manager, formerly controller
    of the Dallas/Fort Worth metroplex; she is described as having held this post
    for under a year.
  - Prof reports Cuthbertson challenged upper management of the local Knight Errant
    Front Range Free Zone (KE-FRFZ) security division and expelled some managers,
    claiming its officers became more disciplined.
  - 'Prof describes three legal entry statuses: permanent immigration, work visas
    and temporary travel passes. Permanent immigration is processed by the CAS Department
    of Immigration and Naturalization in Atlanta before relocation to the sector.'
  - Prof states work visas are valid for the duration of gainful employment and describes
    the regional office at E. 31st Avenue and Wilson Court; applications require a
    job in the sector.
  - Prof states travel passes must be preauthorized by sector management and are recorded
    with status information on the traveler’s personal credstick.
  - Prof describes sector licensing requirements for weapons and sector-government
    control of many pharmaceuticals, chips and alcohol. This is fictional in-world
    legal exposition, not contemporary legal advice.
  uncertainty: Do not elevate Prof or Bobby E. viewpoint to independently established
    real-world law.
