  section: How It Came About — Internet, early network opposition, Dawn of the Matrix
  book_narrator_timeline:
  - printed_page: 72
    assertion: The book traces the fictional Nexus’s network ancestry almost one hundred
      years back to early national/international computing networks, initially operated
      privately by governments or universities because of hardware and software costs.
      Public second-generation networks later grew, with the Internet as the chief
      example.
  - printed_page: 72
    assertion: The Internet is portrayed as a decentralized federation of independently
      connected computer hubs, which supported discussion groups and electronic communication
      without a single central controlling hub.
  - printed_page: 72
    assertion: The narrator portrays 1990s United States authorities as objecting
      to unregulated political speech and widely available encryption, while asserting
      that government legal restrictions on speech and electronic communications lagged
      technological changes.
  - printed_page: 72
    assertion: The account describes privately held, corporate and government information
      networks expanding as public Internet infrastructure shrank under economic and
      governmental pressures; it names the Electronic Frontiers Foundation (EFF) among
      groups contesting those pressures.
  - printed_page: 73
    assertion: As key public Internet hubs closed, surviving nodes reportedly became
      overloaded; the public Internet as an independent global system is described
      as failing despite resistance by EFF and independent operators.
  - printed_page: 73
    assertion: Privately operated bulletin-board systems including Shadowland are
      portrayed as continuing after the Internet disintegrated, with different changing
      points of access intended to preserve their independence.
  - printed_page: 73
    assertion: Government and corporate data systems continued to expand into an interconnected
      Matrix with fiber lines, satellite channels, microwave links, and dedicated
      data paths. The narrator associates this change with transmission of data, voice,
      and television over common digital networks.
  - printed_page: 73
    assertion: The EFF is portrayed as creating a private datanet called the Egg and
      cautiously connecting it to the new Matrix, while other independent bulletin
      boards, including Shadowland, later also joined the Matrix.
  - printed_page: 73
    assertion: The narration describes government deckers failing to locate the operators
      of a historical Shadowland board and early security defenses preventing intrusions.
      This is fictional setting history and not real-world cybersecurity guidance.
  edition_history_note: The source portrays an alternate-future history from its 1994
    publication perspective; statements about 1990s governments, encryption policy
    and the later Matrix belong to the fictional book’s account and are not presented
    here as independently verified real history.
