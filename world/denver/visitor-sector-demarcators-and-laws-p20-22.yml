data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    published fictional Shadowrun Second Edition-era tabletop-RPG sourcebook; source.fasa-7212;
    no inferred Third Edition conversion.'
  source_context: Historically published in-world fictional setting information; narrator
    facts, attributed Shadowland posts, and hypothetical examples are distinct.
  extraction:
    treaty_governance:
      book_narrator: The Treaty divided the fictional Denver region into autonomous
        political sectors separated by internal demarcators. There is no unified ordinary
        police force or court with jurisdiction across the entire Free Zone; each
        autonomous sector enforces its own laws.
      demarcator_standard: Demarcators ordinarily use roughly 10-meter reinforced
        and alarmed double fences, rarely electrified, with at least 20 meters between
        the fence lines. A low marking wire may symbolize the precise border.
      restriction_on_hostile_actions: The fictional Treaty forbids hostile conduct
        against persons on the opposite side of the demarcation, even when the person
        is viewed as a criminal or security risk. The book states the restriction
        extends to physical force, weapons and magical attacks.
      individual_law: Entry rules, contraband definitions and permitted technology
        differ by sector. One sector may tolerate an item another prohibits.
      extraterritoriality: The named poster Derek describes megacorporate extraterritorial
        properties as separate sovereign sites, whose internal rules apply regardless
        of the political sector.
    book_narrator_sector_economy:
      cross_border_dependence: Sector economies need connections with neighboring
        sectors for transport and services even when neighboring governments are politically
        antagonistic.
      intersector_trade: Much trade is underground or otherwise unlawful by sector
        codes, and the source presents it as keeping the fictional city functional.
      cross_sector_mobility: Residents often commute between sectors and can be affected
        by border closures or diplomatic incidents.
    claims_with_named_speakers:
    - speaker: Lane
      claim: Estimates 85 percent of inter-sector political incidents arise from guards
        neglecting Treaty protections.
      status: in-world unverified estimate, not narrator-established count
    - speaker: Patty
      claim: Claims cross-border distribution of California hot devices is economically
        motivated by differing local laws, with illegal UCAS sales and lawful Ute
        availability.
      status: attributed fictional commercial scenario, not an instruction or authoritative
        law list
    - speaker: Sydney
      claim: Argues cross-border security policies can differ from those in the corresponding
        parent nations.
      status: attributed comparison
