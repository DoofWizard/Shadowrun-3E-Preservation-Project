    "publication_context": "Fictional tabletop role-playing publication: Shadowrun, Denver: The City of Shadows (FASA Corporation, 1994; FASA7212), historical Second Edition-era setting source, catalog source.fasa-7212; original printed/PDF page mapping, no inferred Third Edition conversion.",
    "section": "Organized Crime: Mafia, yakuza and Triads",
    "narrator_established": [
      "The fictional source states organized crime groups in the Free Zone have a smaller share of shadow commerce than in many other places, but established organizations chiefly concentrate on drugs and chips, gambling, pornography, prostitution, extortion, assassination, computer fraud and racketeering/corruption, leaving arms trade and illegal sector-crossing markets to smaller consortia.",
      "The Mafia Families concentrate on gambling, pornography and prostitution rather than widespread control of all commerce. Gambling law differs between sectors; the narrator says the Families largely avoid chiplegging and only dabble in illegal pharmaceuticals. The Families hold a particularly strong position in illegal Free Zone gambling and compete intensely with the yakuza.",
      "The yakuza control approximately half of the Free Zone channels for illegal chip distribution, while independent operators and Triads control the remainder. The yakuza also maintain a dominant position in illegal drug commerce. They are expanding into data and information brokerage by training their own deckers and fixers and supplying them with advanced technology, with few demonstrated results so far.",
      "The book describes some yakuza outfits as providing for-hire extortion, sabotage and assassination services to fictional shadow-market customers. Their reported success and high charges distinguish this line of business from routine brokerage; the source does not provide real-world instructions.",
      "Three major Triad organizations appear in the Free Zone: White Lotus, Golden Triangle and Red Dragon. Their headquarters and operations center on Chinatown in the CAS Sector, while their influence crosses sector demarcations. The text identifies protection/extortion and illicit drug/chip trade among their markets.",
      "Triad groups have close ties to parent organizations in East Asia, whose leaders permit local autonomy but demand regular reports and impose internal discipline. The narrator characterizes the Triads as favoring magical assistance more readily than the Mafia or yakuza, who sometimes employ magic as a supplemental method.",
      "Triad groups are attempting to expand into portions of the local shadow markets by contracting a growing number of shadow operators, rather than establishing independent transport operations; these remain fictional market descriptions."
    ],
