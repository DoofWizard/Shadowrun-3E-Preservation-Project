    "section": "Other Organizations: gangs and sector activity",
    "narrator_established": [
      "The source treats the Mafia and yakuza as the largest and most influential organized-crime organizations in the Free Zone, but describes numerous local and imported gangs.",
      "The Fronts operate mainly in the UCAS and CAS sectors in approximately a dozen sets across the Free Zone. The average set has about fifty members, predominantly human and ork and mostly male; some are portrayed as committing indiscriminate assaults, while the BBs emphasize drugs, illicit chips, commercial fixing, and hired personal security.",
      "The Godz primarily operate as a go-gang on Pueblo and Ute highways and byways. A large Boulder-area battalion has perhaps one hundred members, with smaller units west of Interstate 25. The book describes both secondary escort activity for fictional smugglers and coercive treatment of people who decline paid protection.",
      "The source names New York’s Hudson Hawks and Austin’s Braineaters as limited franchised presences in Denver, and describes the West Coast Cutters as comparatively prominent in UCAS-sector arms dealing, with two safe houses and up to eighty local members."
