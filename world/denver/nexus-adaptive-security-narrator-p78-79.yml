data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (1994), FASA7212/source.fasa-7212,
    a fictional Shadowrun Second Edition-era tabletop RPG sourcebook, printed pp78-79/PDF
    pp79-80.'
  section: Nexus Security — publication narrator, as distinct from Shadowland commentators
  narrator_facts:
  - printed_page: 78
    assertion: The fictional Denver Data Haven is described as having exceptional
      computer security designed to resist access by governments and megacorporations.
      This is a narrator description of the invented Matrix setting, not a present-day
      security claim.
  - printed_page: 79
    assertion: The book says sophisticated countermeasures can eventually be overcome
      if enough resources are applied, while the Nexus constantly changes its routing.
      The narrator says these changing routes make the Nexus entry points harder for
      would-be intruders to locate and can give system operators advance warning of
      a hostile approach.
  - printed_page: 79
    assertion: 'The author illustrates this with a conditional example: if the Seattle
      hub were attacked by a military-style intrusion team, its operator would warn
      the Denver Data Haven so the operators there could prepare. This is hypothetical,
      not a recorded attack.'
  - printed_page: 79
    assertion: The narrator calls the Haven’s security tight and assesses it as probably
      the only privately held black Ultra system. The qualifying word probably is
      retained; the book does not independently establish a complete inventory of
      other systems.
  - printed_page: 79
    assertion: The narrator describes Nexus access gateway SANs as requiring multiple
      redundant passcodes. The high-single-digit Red rating description and named
      commentator estimates are catalogued separately in the exact-rating and attributed-commentary
      records, not asserted here as verified game stat blocks.
  - printed_page: 79
    assertion: The publication withholds a diagram of the Nexus architecture. The
      narrator describes its configuration as adaptive to system requirements and
      alert status, with numerous operators treating the system as an artistic and
      technical project and frequently changing its structure.
  attribution: These entries reflect book-narrator claims about the fictional game
    world, not factual descriptions of real information systems; named in-world speaker
    comments and hypothetical scenarios are explicitly separated.
