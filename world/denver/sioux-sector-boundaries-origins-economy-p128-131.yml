  section: Sioux Sector boundaries, non-contiguous enclave, origins and economy
  fictional_sector_geography:
  - The Sioux Sector’s principal demarcation follows Intercity 25 south to the Highway
    70 interchange, then Route 85 north, and then Highway 76 northeast beyond Denver.
  - Its non-contiguous sector (NCS) occupies a small part of downtown Denver; the
    source states that the NCS boundary follows 17th Street, Broadway, East 18th Avenue
    and Pennsylvania Street, cutting irregularly across vacant lots and former building
    sites.
  - The source identifies Sioux and UCAS as the Free Zone’s two non-contiguous-sector
    participants.
  narrator_origin_account:
  - A proposed open downtown bazaar or common “Hub” was complicated by the Treaty
    of Richmond, formation of the autonomous UCAS sector and fragmentation of the
    native sector.
  - The council initially proposed an approximate square common marketplace downtown,
    but existing sector borders and demolition created territorial disputes.
  - The in-world narrator says the council assigned roughly half the planned Hub to
    the Sioux Nation and half to UCAS, leaving each government responsible for defining
    its own demarcation.
  sioux_sector_borders_as_described_by_in_world_narrator_Ned_F_Landers:
  - A fictional speaker writing “Crossing the Sioux Line” describes extensive fenced
    or walled border areas and military-style deterrence, including monitoring and
    patrols. This is fictional source-period security context, not real-world instructions.
  - The same account describes sensor-equipped perimeter sections and patrols on foot,
    light scout vehicles and light aircraft.
  society_and_economy_as_narrated:
  - The Sioux Nation is described as having a largely agrarian economy alongside sophisticated
    information-based industry; within Denver, the Sioux Sector relies heavily on
    information-based industries and genetic engineering because agricultural land
    is limited.
  - The narrative describes a highly competitive social culture in the fictional sector
    and a ritualized pattern of confrontation, warning against treating all such exchanges
    as unprovoked violence.
  source_scope: Fictional in-world overview dated around May–June 2055, preserving
    book-narrated narrative separately from Shadowland speaker allegations.
