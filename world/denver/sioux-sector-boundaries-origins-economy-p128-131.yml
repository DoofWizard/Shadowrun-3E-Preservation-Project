    "section": "Fictional Sioux Sector: geographical demarcators, attributed downtown Hub history, bylined border account, sector economy",
    "narrator_geography_from_printed_p128": [
      "The published sourcebook locates the Sioux Sector's principal demarcator along Intercity 25 south to the Highway 70 interchange, east to Route 85, north along Route 85, then northeast along Highway 76 beyond the Denver metropolitan area.",
      "The Sioux non-contiguous sector (NCS) covers a small downtown area; Sioux and UCAS are the Free Zone's two non-contiguous-sector participants. Its north/east demarcators follow east–west and north–south axes although the existing streets follow diagonal alignments.",
      "The NCS demarcator follows 17th Street, Broadway, East 18th Avenue, and Pennsylvania Street, then runs orthogonally through city blocks and former building sites. The sourcebook narrator explicitly criticizes the poor geographical fit."
    ],
    "aesop_named_in_world_account_from_printed_pp128_and_130": [
      "After an introductory Shadowland comment on printed p128, the named fictional speaker Aesop narrates the account that continues on printed p130; it is his attributed explanation, not independently established publication-narrator history.",
      "Aesop reports that the Council initially envisioned a genuinely open downtown bazaar or common 'Hub', with a rough square traced on a digital map so visitors could enter various sectors' commercial territory.",
      "Aesop links the failed Hub proposal to the fictional Treaty of Richmond, the UCAS sector's autonomy, fragmentation of the Native sector, demolition at national demarcators, and territorial disputes over walls, structures, and access.",
      "Aesop states that because the proposed Hub remained entangled in sector border disputes and neighboring sector concerns, the Council apportioned approximately half the disputed downtown area to Sioux and half to UCAS, making those governments responsible for their respective demarcators; his separate speculation about why other nations declined involvement remains attribution-only."
    ],
    "ned_f_landers_bylined_crossing_account_printed_pp130_131": [
      "The fictional bylined essay 'Crossing the Sioux Line' by Ned F. Landers describes substantial sector fencing or walls, contested boundaries, and deterrent defenses as source-period fictional setting reportage, not real-world recommendations.",
      "Landers describes sensors and civilian security patrols on foot, in GMC-Beachcraft Patroller vehicles and Sikorsky-Bell 'Red Ranger' Scout ACVs, or in light aircraft. His commentary distinguishes Sioux security personnel's outwardly amicable demeanor from the fictional border security measures."
    ],
    "publication_narrator_living_in_the_sector_printed_p131": [
      "The Sioux Nation overall is described as having a largely agrarian economy alongside advanced information-based industries; because the Denver Sioux Sector lacks land for crops, its economy depends heavily on information industries and genetic engineering.",
      "The book narrator characterizes Sioux Sector social interaction as highly competitive and ritually confrontational, while arguing that some apparent threats or aggressive exchanges form part of social-order signaling rather than simply random violence."
    ],
    "attribution_boundary": "Named Shadowland users' claims, including Aesop's Hub history and border-technology rumors, are not independently certified publication-narrator facts. Preserve Ned F. Landers's bylined report separately from the impersonal geographical and economic narration."
