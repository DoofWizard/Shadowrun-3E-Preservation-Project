  section: Sioux Sector Council of Chiefs, citizenship, work permits and travel passes
  government_book_facts:
  - 'The fictional Sioux Sector is governed by a Council of Chiefs with one chief
    from each of five named Sioux Nation tribes: Sioux, Crow, Navaho, Hidatsa and
    Arapaho.'
  - Members of the Sector Council of Chiefs are appointed by the same Council of Elders,
    described in the book as mostly shamans, that appoints the Sioux Nation council.
    The source says chiefs may serve only one five-year term.
  - The legal and administrative provisions in this section concern the historical
    fictional sector, not any present-day real nation or tribe.
  citizenship_and_residency_as_printed:
  - An applicant who proves descent from one of the qualifying major tribes (defined
    broadly to include nearly a dozen tribes) may apply for Sioux Nation citizenship
    and the right to live and work in its sector.
  - An applicant without the required ancestry can seek Official Resident status allowing
    work and residence in the nation and sector, then apply for citizenship after
    three consecutive years of residence.
  work_and_visitor_status:
  - The source states that work visas are available and required for workers in the
    high-technology industry, but are not required for other economic sectors, especially
    manual-labor employment.
  - Visitors may receive a limited-duration travel pass through an application comparable
    to other time-limited visitors’ visas; after initial approval, the duration can
    be extended by requesting an extension at the point where the visitor entered.
  scope_boundary: Weapons-specific licenses, carry limits and exceptions start in
    a separate section at the bottom of printed p134 and continue into later printed
    pages; not covered by this record.
