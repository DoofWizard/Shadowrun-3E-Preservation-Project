    "section": "Zone Economics",
    "narrator_established": [
      "The source contrasts sector official economies with the cross-sector shadow market: national authorities do not levy Free Zone tariffs on each other, while sector laws and official reporting categories differ. Demand for portable computers, simsense chips, BTLs and ammunition is described as widespread, with divergent formal legality and recognition of transactions creating different recorded outcomes.",
      "The Ute Sector openly reports trade in California-hot simsense chips; the UCAS Sector classifies the same chips as heavily prohibited. The narrator distinguishes revenue reported from manufacture in the Ute Sector from undisclosed UCAS-sector resale receipts.",
      "The narrator describes assault cannon rounds, APDS and explosive rounds as legally available to authorized corporate security and designated government/security agents in the Sioux sector; it contrasts Aztlan, where only Aztlan government security forces and Aztechnology security assets may lawfully buy, acquire or possess a single round. The source states authorized Aztlan security users receive rounds from the Aztlan government without commercial charge.",
      "Official public figures represent permitted transactions approved by the named Guardians of Public Morals and Marketplace Propriety, whereas the shadow economy disregards many legal categories and sector lines. The narrator groups shadow-economy activity into organized crime, smuggling and the shadow market proper."
