data:
  publication_context: 'Fictional Shadowrun tabletop RPG setting from FASA Corporation''s
    Denver: The City of Shadows (1994, Second Edition-era source), catalog FASA7212,
    source.fasa-7212, printed p58/PDF p59.'
  section: Zone Economics
  narrator_established:
  - The named in-world narrator Youchai says that governments within Denver's Free
    Zone cannot levy tariffs or duties on one another, while sector laws and rules
    for reporting permitted transactions differ. He describes demand for portable
    computers, Nicky Saito simchips, BTLs, and ammunition as broadly comparable across
    sectors, with transactions counted differently in official sector figures and
    informal cross-sector markets.
  - 'The narrator uses California-hot simsense chips as an example: legal and fashionable
    in the Ute Sector but illegal in the UCAS Sector. Revenues from Ute manufacture
    enter that sector''s official economy, while illegal UCAS resale receipts are
    not reported to the UCAS government.'
  - Under fictional Sioux law, assault cannon rounds, APDS rounds, and explosive rounds
    are legally available to corporate security forces and their quoted 'legal designatees'.
    The source does not identify all those designatees as government agents. In fictional
    Aztlan, only Aztlan government security forces or Aztechnology security assets
    may legally buy, otherwise acquire, or possess even one assault cannon round.
    Authorized government and corporate security users receive rounds from the Aztlan
    government without a credit transaction. These are fictional source-period legal
    claims, not game-rule conversions or real-world ammunition guidance.
  - The narrator distinguishes approved transactions underlying published official-government
    economic figures, excluding Aztlan, from the shadow economy. He names Guardians
    of Public Morals and Marketplace Propriety as the approving body, and divides
    shadow-economy discussion into organized crime, smuggling, and the shadow market
    itself, which largely disregards sector legal categories and boundaries.
  game_world_legal_distinctions:
    sioux_covered_ammunition:
    - assault cannon rounds
    - APDS rounds
    - explosive rounds
    sioux_legal_holders: Corporate security forces and their 'legal designatees';
      the source does not equate that entire class with government/security agents.
    aztlan_assault_cannon_rounds_legal_holders:
    - Aztlan government security forces
    - Aztechnology security assets
    california_hot_simsense: Ute-sector legal manufacture and trade distinguished
      from UCAS-sector illegal resale and unreported receipts.
  historical_context: Fictional circa-2055 setting and jurisdictional descriptions,
    not factual present-day laws or independently operational weapon rules.
