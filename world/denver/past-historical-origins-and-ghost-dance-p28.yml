data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994), a published fictional
    Shadowrun Second Edition-era tabletop role-playing sourcebook, catalog source.fasa-7212; no inferred
    Third Edition conversion.'
  extraction:
    sourceboard_editorial_account:
    - The fictional sourceboard narrator says the pre-Awakening United States government secretly cooperated
      with major corporations to transfer federally protected natural resources into corporate use and
      illegally deprived Native American tribes of land granted to them.
    - The narrator says some tribes violently resisted and suffered deaths. One unnamed tribe launched
      a missile from a U.S. nuclear silo; it did not explode, and the reasons were unknown rather than
      proven.
    - The account states that government-directed confinement and re-education camps followed public demands
      against indigenous groups; this is coercive confinement, not voluntary relocation.
    - Daniel "Howling Coyote" Coleman led an uprising out of one such camp on Christmas Eve 2011 using
      newly re-Awakened magical abilities, according to the fictional setting narrative.
    - Years later, Howling Coyote and other Native magical practitioners performed the Great Ghost Dance;
      the narrative attributes the federal retreat and return of a large continental land area to that
      event.
    attributed_epigraph:
      speaker: Professor Linda Twenton-Chen
      work: 'A City Divided: Denver After the Treaty'
      reference: DATTO82-scrn110
      claim: The resulting Front Range Free Zone was produced by a political contest over real estate,
        image and people, with losses imposed upon its population.
      certainty: Attributed fictional professor quotation; not an independent real-world historical assertion.
  editorial_review_notes: Read the sourceboard narration and signed epigraph as distinct fictional textual
    voices. Quoted discriminatory rhetoric in the original is not endorsed. No cause for missile failure
    is asserted.
