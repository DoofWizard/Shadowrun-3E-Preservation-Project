  section: Zone Economics and Organized Crime (POWER)
  narrator_established:
  - printed_page: 58
    fact: Youchai, the named in-world narrator of this fictional chapter, describes
      each national sector's official economy as differing largely because of which
      transactions enter official reports and because sectors treat certain goods
      differently under law; demands for consumer goods are broadly comparable. The
      narration distinguishes approved transactions from the larger shadow economy,
      which often ignores demarcator boundaries.
  - printed_page: 58
    fact: His examples include California-hot BTL/simsense chips manufactured legally
      in the Ute Sector but traded illegally in the UCAS Sector; income from Ute manufacture
      enters Ute official accounting, while unauthorized UCAS resale does not enter
      UCAS government revenue reports.
  - printed_page: 58
    fact: The source describes Aztlan assault, APDS and explosive ammunition as restricted
      to governmental and specified corporate security users under Aztlan law. It
      distinguishes approved provision to security users from possession by unauthorized
      private persons; this is historical fictional legal lore, not a weapon-making
      or acquisition procedure.
  - printed_page: 58
    fact: Youchai divides the fictional shadow economy into organized crime, smuggling,
      and shadow markets. In the Free Zone the established Mafia and yakuza control
      a smaller part of overall unofficial trade than in some other places, especially
      through drugs/chips, gambling, pornography, prostitution, extortion, assassinations,
      computer fraud and large-scale racketeering; independent traders and small groups
      dominate much other contraband and sector-hopping activity.
  - printed_page: 59
    fact: The Mafia in this published fictional Denver setting concentrates on gambling,
      pornography and prostitution, and largely avoids illegal chiplegging while touching
      only a limited portion of the illegal pharmaceuticals trade. The text notes
      that a Free Zone-wide legal-gambling label does not imply all types of gambling
      are legal in every individual sector.
  - printed_page: 59
    fact: The book distinguishes Mafia attempts to influence Administrative Branch
      bureaucrats and UCAS/Aztlan consular subbranches from formal control of Council
      government; the narrator portrays Mafia success in official influence as limited
      while Mafia activity in illegal gambling remains strongly entrenched.
