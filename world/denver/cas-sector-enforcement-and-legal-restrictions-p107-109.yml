  section: CAS Sector law enforcement, cyberware, Matrix controls and legal restrictions
  writer: Prof (in-world writer, Government and Law Enforcement article)
  reported_legal_setting:
  - The source describes controlled government distribution of pharmaceutical substances
    and alcohol other than beer and wine from grocers, and special restrictions on
    illicit chips.
  - Knight Errant Front Range Free Zone (KE-FRFZ) performs CAS Sector law enforcement,
    including command, data collection and analysis, investigations, Matrix security,
    and paranormal/astral security.
  - The article says KE-FRFZ senior management and some enforcement personnel came
    from Knight Errant’s executive and other divisions, with additional personnel
    demobilized from the CAS armed forces under Treaty restrictions.
  - The CAS sector justice system is described as following CAS proper, with a jury-of-peers
    provision and expedited proceedings; the article says it does not distinguish
    intent from use for the relevant listed offenses.
  - All entering persons, including CAS citizens, must register Class A and Class
    C cyberware; Class A or Class C possession may be grounds for refusal of a visa
    or travel pass. Local clinics may legally install only Class A cyberware.
  - Cyberdecks and programs must be licensed when purchased or brought into the sector.
    The source states that inspectors can confiscate an unregistered cyberdeck and
    pursue felony charges if a clandestine identifier is found.
  - Controlled-substance possession is classified by the author as for personal consumption;
    transport of fewer than 15 standard chemical doses or chips is treated as minor
    distribution, while 16 or more is treated as a more serious category. The source
    reports no extenuating-circumstances exception.
  mechanical_scope: Fictional historical legal categories, not modern real-world law
    or a procedure for evasion; exact penalty tables are preserved separately.
