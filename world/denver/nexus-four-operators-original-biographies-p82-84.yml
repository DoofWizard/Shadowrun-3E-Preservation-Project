    correspond to physical PDF folios one greater.'
  section: 'Senior Nexus operators: Shiva, Bash, Cap’n Kluge, Spirit'
  narrator_biographies:
  - name: Shiva
    pages: '82'
    facts: Senior Nexus operator represented by an icon of a tall black-clad man with
      short hair and idealized features. His true identity is not established in the
      narrator’s text. He has been centrally involved for more than ten years, possesses
      extraordinary network expertise and is usually calm and aloof, but is portrayed
      as formidable when provoked. Has a continuing rivalry with Bash whose origin
      is not disclosed.
  - name: Bash
    pages: '83'
    facts: Senior operator whose distinctive icon is a very tall pale Victorian-undertaker-like
      figure with pointed teeth, luminous red eyes, and an old-style morning coat.
      Arrived about the same time as Shiva, is generally thought younger but similarly
      skilled. Narrator describes a volatile temperament, with explanations about
      earlier trauma explicitly speculative.
  - name: Cap’n Kluge (Tom Kwan)
    pages: '83'
    facts: Young operator portrayed through a cartoon-like bouncing ball icon that
      can sprout eyes, hands and feet. Source says Kwan graduated from MIT&M in computer
      science at age 14, was rapidly recruited by Fuchi, gained a reputation in Fuchi-New
      York, and left the company roughly seven years before the 2055 account. The
      source describes two years working under the handle Cap’n Kluge and arrival
      at the Denver Data Haven five years earlier. His prior appearance in the aftermath
      of the disappearance of a decker called Lachesis is mentioned but no responsibility
      for that disappearance is alleged by the narrator.
  - name: Spirit (Nahid Mostafavi)
    pages: 83-84
    facts: Senior operator whose icon resembles a shifting silk scarf, using color
      and light rather than humanoid imagery. She is described as of Iranian descent,
      born and raised in France, formerly associated with the Paris division of Siemens
      AG before independent network consulting; records place her arrival in Denver
      in 2047 for a short contract that became long-term. She values Matrix aesthetics
      and philosophy while remaining capable of pragmatic choices.
  identity_guards: Allegations identifying Shiva as an actual named political dissident
    and statements about why Kwan left Fuchi are attributed to users separately. Do
    not turn them into established biography.
