    "publication_context": "Published fictional tabletop RPG sourcebook Denver: The City of Shadows (FASA Corporation, 1994; FASA7212; source.fasa-7212), original Shadowrun Second Edition-era setting. Original printed and PDF page numbers are retained; no Third Edition conversion is implied.",
    "section": "THE REAL POWER: SMUGGLING AND T-BIRD RUNS / MARKETS",
    "book_narrator_facts": [
      "The fictional 2055 sourcebook differentiates two markets affecting T-bird commerce: the official and unofficial residents of the Denver/Front Range Free Zone, and the signatory governments. It states an official Free Zone population of 3.5 million, and estimates more than 4 million actual potential customers when unofficial residents are counted.",
      "The source calls the Front Range area a crossroads of trade because six distinct national jurisdictions and their different laws create unusual market conditions. The text distinguishes a fictional shadow trader, whose goods can be legal in a destination sector, from a fictional smuggler whose goods are restricted or illegal for the destination. Source examples illustrate how legality depends on jurisdiction rather than describing a universal rule.",
      "The narrator says some customers seek goods that national sectors restrict, while inadequate conventional distribution and inconsistent cross-sector supply also lead operators to carry otherwise legal cargo. Both demand categories belong to the fictional 2055 economy. The source also asserts that practical commercial licenses and vehicle classifications create constraints even for legal cargo.",
      "The text notes that national governments and sector-based commerce constitute a market in addition to individual residents; its example concerns a market for Ute-produced simchips and distinct legal statuses in the UCAS Sector. It is a fictional setting example and not transportation advice."
    ],
