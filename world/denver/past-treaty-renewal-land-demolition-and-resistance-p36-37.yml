  "data": {
    "publication_context": "Fictional historical Shadowrun tabletop RPG publication: Denver: The City of Shadows (FASA Corporation, 1994, FASA7212, Shadowrun Second Edition-era); archival source ID source.fasa-7212; not an SR3 rules conversion.",
    "original_section": "HOW IT GOT THIS WAY / later history through Razing the Sprawl",
    "narrated_history": [
      {
        "printed_page": 36,
        "event": "After the treaty negotiations and the end of the Great Ghost Dance conflict, people displaced from the Denver region attempted to return to homes and businesses; the source describes sharply different prospects after the Treaty of Denver."
      },
      {
        "printed_page": 36,
        "event": "U.S. forces cleared broad security zones around regional military installations in response to vulnerability of military bases near dense tenement neighborhoods during the tribal–Anglo conflict.",
        "agency": "U.S. military decision; involuntary destruction and displacement of existing neighborhoods; neither homeowners nor refugees are represented as consenting to demolition."
      },
      {
        "printed_page": 36,
        "event": "The tribal parties considered much existing Anglo-style urban sprawl unacceptable and pressed for physical renewal of designated territory."
      },
      {
        "printed_page": 36,
        "source_clause": "CCXCVII-A",
        "event": "The Treaty of Denver designated parts of the urban sprawl to be returned to a natural condition, including demolition of existing development within five years. The Treaty also prohibited further construction on such cleared ground and expansion of the cities beyond their traditionally delimited areas.",
        "effects": "Construction prohibition applies to designated or proscribed parcels and was not a blanket ban on all Denver buildings."
      },
      {
        "printed_page": 36,
        "event": "After extended disagreement, the three tribal treaty signatories defined the traditional boundaries of Denver, Boulder, and Colorado Springs using the oldest accurate map available, a 1987 U.S. Geodetic Survey map.",
        "land_rule": "Land depicted as already developed before 1987 could retain or receive development, whereas structures present on parcels marked vacant by that map were subject to removal and further development forbidden. This is the source's fictional treaty interpretation, not real-world land-use guidance."
      },
      {
        "printed_page": 36,
        "event": "The source distinguishes the agreement among tribal signatories from the limited influence of the United States and Aztlan in negotiating that boundary interpretation."
      },
      {
        "printed_page": 36,
        "event": "Following the cessation of fighting but prior to treaty signing, anti-Amerind resistance arose in Denver and its surroundings. The source identifies two principal organizations: the Colorado Volunteers and Unity."
      },
      {
        "printed_page": 36,
        "event": "Colorado Volunteers leadership included retired U.S. military officers, while Unity's founders were later associated with Alamos 20K. The two factions shared opposition to tribal influence but differed in ideology; the narration depicts Unity as more ideologically racist and exclusionary."
      },
      {
        "printed_page": 37,
        "event": "Once the U.S. government cooperated with the tribal nations in removing households from areas designated for demolition, the Colorado Volunteers leadership abandoned its struggle, while some former members continued resistance alongside Unity. Unity expanded the intensity of its activities.",
        "agency": "Government-backed evictions were not voluntary relocations for those removed from homes."
      },
      {
        "printed_page": 37,
        "event": "The described violence and intimidation during relocation continued for years; by approximately 2030 the organized program had diminished, although the source depicts sporadic later incidents."
      },
      {
        "printed_page": 37,
        "event": "The tribal government's term for redevelopment was harmonization. The narrative says it was more or less completed by 2027, following the target date by roughly one or two years."
      },
      {
        "printed_page": 37,
        "event": "Demolition restrictions and changed settlement patterns resulted in dense high-rise residences in some areas and comparatively scarce, costly detached homes in other areas."
      }
