  section: 'Black and Shadow Markets: source-defined distinctions'
  narrator_established:
  - printed_page: 69
    fact: The narrative distinguishes a black market for goods that are illegal or
      stolen in the destination sector from a shadow market trading in goods legally
      saleable at destination but transported through jurisdictions where they are
      prohibited. The book characterizes the difference as more important than the
      distinction between smugglers and shadow traders.
  - printed_page: 69
    fact: The two markets constitute consumer-facing endpoints of the fictional Free
      Zone shadow economy. The book says national sectors formally condemn the black
      market, stage publicized periodic enforcement operations, yet tolerate varying
      degrees of illicit commerce because it materially contributes to local sector
      economic activity.
  - printed_page: 69
    fact: Sector governments are said to treat unofficial markets differently from
      outright illegal ones, with the narration describing policies that may tolerate
      market activity when neighboring sectors would bear economic losses. Named posters
      dispute whether that constitutes active encouragement, passive acquiescence,
      or legitimate defense of territorial sovereignty.
  agency_and_certainty: Government claims in the narrator text are sourcebook-world
    characterizations; conflicting cases and asserted motives are preserved separately
    under named in-world speakers.
