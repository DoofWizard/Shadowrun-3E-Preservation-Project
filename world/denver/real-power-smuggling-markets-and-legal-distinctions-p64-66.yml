data:
  publication_context: 'Historical fictional tabletop-RPG sourcebook Denver: The City
    of Shadows, FASA Corporation (1994), FASA7212 / source.fasa-7212, Shadowrun Second
    Edition-era original; printed/PDF page pairs preserve historical source mapping
    without Third Edition conversion.'
  section: 'Smuggling and T-Bird Runs: markets, legal distinctions and demand'
  narrator_established:
  - printed_page: 64
    fact: 'Within the fictional Free Zone, Youchai describes two overlapping but distinct
      labels: a smuggler transfers goods that are banned or tightly controlled in
      their actual destination sector, while a shadow trader may deal in goods legitimate
      at destination but restricted in jurisdictions through which the consignment
      passes. This is an in-world economic/legal distinction, not real-world advice.'
  - printed_page: 64
    fact: The source says the Free Zone has six distinct national jurisdictions and
      correspondingly different legal restrictions on products. The narrator gives
      official Free Zone population as approximately 3.5 million and estimates more
      than 4 million actual potential consumers including uncounted residents.
  - printed_page: 65
    fact: 'The book juxtaposes two fictional illustrative examples: Joe the Jammer
      transfers a class of designer drugs prohibited at origin and destination, making
      him a smuggler; Roberta the Rodder delivers fictional human growth hormones
      to a destination where the product is legal, but traverses jurisdictions in
      which those goods are restricted, making her a shadow trader. These examples
      illustrate differences of source-defined legal status, not procedures for acquiring
      or transporting prohibited goods.'
  - printed_page: 65
    fact: The fictional narrator distinguishes recreational drugs, BTLs, and military-spec
      weaponry as categories of resident demand, and notes that legal supply chains
      may be uneconomical under conflicting sector restrictions; shadow distribution
      fills some gaps that are not inherently prohibited at final destination.
  - printed_page: 65
    fact: Different sector prices, merchant markups and restricted product categories
      give cross-sector trade an economic dimension separate from blanket illegality.
      Commercial freight licensing and light assault vehicle classifications are described
      as impediments even for lawful commodities; this is Second Edition-era in-world
      law, not instructions.
  - printed_page: 66
    fact: Youchai’s markets discussion distinguishes claimed movement of California-hot
      chips between Ute and UCAS markets and other disputed flows of computer goods;
      individual specific claims about operators belong to named in-world speakers
      rather than narrator-certified figures.
  numeric_details:
    official_population_millions: 3.5
    estimated_true_population_millions: more than 4
  source_classification_note: This is historical fictional law/economic context, not
    an operational guide or contemporary legal claim.
