data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    published fictional historical Shadowrun Second Edition-era tabletop-RPG setting,
    source.fasa-7212; no inferred Shadowrun Third Edition conversion.'
  section: COMING AND GOING / In the Air
  fictional_narrator_transport_facts:
    international_airports: 7
    definition: International airports in this fictional regional guide are described
      as able to accommodate suborbital and semiballistic traffic.
    regional_facilities: More than a dozen additional regional airfields support short-haul
      carriers.
    stapleton: Stapleton Airport serves the UCAS Sector. The source says it was decommissioned
      and closed in the mid-1990s and reopened after the Treaty of Denver.
    peterson: A separate UCAS facility stands on the western outskirts of Colorado
      Springs; the source says its municipal predecessor merged with Peterson Air
      Force Base.
    denver_international: Denver International is identified as a Sioux Sector facility,
      presented as more modern than Stapleton and described as poorly maintained by
      an attributed Sioux official.
    lowry: Lowry, in the CAS Sector, occupies the former Lowry Air Force Base site,
      described as closed in the mid-1990s and converted to a commercial airport after
      the Treaty. The sentence continues on the next printed page.
    scope: Only assertions actually appearing on printed p12 are preserved here; continuation
      of airport descriptions is reserved for the following natural slice.
  attributed_comments:
  - speaker: Leo
    printed_datetime: 05:46:33/5-23-55
    claim: Claims the old Stapleton infrastructure was demolished before UCAS possession
      after the treaty.
  - speaker: Sky Pilot
    printed_datetime: 22:39:33/5-29-55
    claim: Questions whether the reopened Stapleton runway length handles fully laden
      semiballistic carriers.
  - speaker: Zoomy
    printed_datetime: 00:16:36/6-2-55
    claim: Zoomy alleges the UCAS uses Peterson under civilian cover; he claims four
      to twelve fully fueled and armed fighter-bombers, generally F-B Eagles, are
      present at a time and that aircraft rotate in/out in two- and four-ship elements,
      rarely staying more than 10–12 hours. This remains a fictional speaker allegation,
      not an established security fact.
  - speaker: Tommyknocker
    printed_datetime: 03:09:50/6-2-55
    claim: Questions why the other Treaty signatories would permit the alleged Peterson
      aviation activity.
  - speaker: Zoomy
    printed_datetime: 23:58:14/6-4-55
    claim: Responds that the other signatories have tolerated the claimed practice.
  - speaker: Albright
    printed_datetime: 12:37:32/5-28-55
    claim: Albright describes Denver International’s cable-tension canopy and former
      design for triple simultaneous landings, but argues current use is far below
      that planned capacity.
