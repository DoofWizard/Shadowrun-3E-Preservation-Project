    "section": "MOVING AROUND; KEEPING IT LIT; STAYING AFLOAT; Free Zone Water Board",
    "narrator_established": [
      "The original fictional sourcebook describes Front Range Transit International Incorporated (FRTII) as the operating company for the Denver Free Zone maglev. Five Treaty signatories initially owned equal shares; when the Confederated American States and UCAS joined the Council under the Treaty of Richmond, a UCAS representative proposed transferring part of its share to CAS. The FRTII board subsequently issued and sold new shares to CAS at adjusted par value, with the source describing the resulting allocation of proceeds and annual debt among signatories. The Administrative Branch administers the maglev line and track infrastructure although the signatories hold FRTII ownership.",
      "The fictional maglev track has solar panels along its length. Its additional energy needs are purchased per joule from the Greenland fusion plant. The narrator identifies Greenland as supplying the Front Range Free Zone electricity, operated by the Pueblo Corporate Council, and gives the electricity rate as 0.07 nuyen per megajoule, collected by the Administrative Branch.",
      "Denver was originally supplied by Cherry Creek and the South Platte River, supplemented later by reservoirs. By the latter decades of the twentieth century most city water was piped from the western slope of the Rockies. Water conservation practices and yard fashions changed before and after the Treaty, and later the Free Zone metered all water use.",
      "The Administrative Branch Free Zone Water Board handles the system. In the publication, the Water Board, representing the Council of Denver, legally owns nearly all local water rights; it maintains reservoirs, dams and a western-slope pipeline, pays licensing fees to the Ute Nation for that pipeline, and employs electronic and physical meter inspections.",
      "The source differentiates certified potable water from non-certified water and states that both are described by the Board as safe to drink. Potable water is generally priced at 1 nuyen per 5 liters, while non-certified water generally costs 1 nuyen per 12 liters. The book explicitly indicates that actual potable price fluctuates with supply and demand."
