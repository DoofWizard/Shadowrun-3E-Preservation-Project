  section: MOVING AROUND; KEEPING IT LIT; STAYING AFLOAT; Free Zone Water Board
  narrator_established:
  - The original fictional sourcebook describes Front Range Transit International
    Incorporated (FRTII) as the operating company for the Denver Free Zone maglev.
    Initially each of five Treaty signatories held an equal share. After the Treaty
    of Richmond created the Confederated American States (CAS) and CAS took a seat
    at the Council table, the UCAS representative proposed selling the CAS half of
    the UCAS share. Because FRTII operated at a loss, the other signatories opposed
    the proposal. Instead the FRTII board issued new shares, adjusted the par value
    of all shares, and sold the new shares to CAS at the revised par value. The other
    signatories split the proceeds, or applied the revenues toward their shares of
    that year’s debt. The signatories own FRTII; the Administrative Branch manages
    the line and track. The book does not say that UCAS first joined the Council in
    this sequence.
  - The fictional maglev track incorporates solar panels along its entire length.
    Any remaining energy needs are purchased per joule from the Greenland fusion plant.
    The narrator identifies Greenland as the source of the Front Range Free Zone electricity,
    operated by the Pueblo Corporate Council, and gives the rate as 0.07 nuyen per
    megajoule, collected by the Administrative Branch.
  - Denver was originally supplied by Cherry Creek and the South Platte River, supplemented
    later by reservoirs. By the latter decades of the twentieth century most city
    water was piped from the western slope of the Rockies. Water conservation practices
    and yard fashions changed before and after the Treaty, and later the Free Zone
    metered all water use.
  - The Administrative Branch Free Zone Water Board handles the system. In the publication,
    the Water Board, representing the Council of Denver, legally owns nearly all local
    water rights; it maintains reservoirs, dams and a western-slope pipeline, pays
    licensing fees to the Ute Nation for that pipeline, and employs electronic and
    physical meter inspections.
  - The source differentiates certified potable water from non-certified water and
    states that both are described by the Board as safe to drink. Potable water is
    generally priced at 1 nuyen per 5 liters, while non-certified water generally
    costs 1 nuyen per 12 liters. The book explicitly indicates that actual potable
    price fluctuates with supply and demand.
