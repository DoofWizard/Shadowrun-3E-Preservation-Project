data:
  publication_context: 'Historical fictional tabletop-RPG sourcebook Denver: The City
    of Shadows, FASA Corporation, 1994, FASA7212 / source.fasa-7212, original Shadowrun
    Second Edition-era publication. Printed/PDF page references cite the cataloged
