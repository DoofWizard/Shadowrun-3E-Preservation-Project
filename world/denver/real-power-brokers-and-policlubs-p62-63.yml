  section: Information Brokers and Policlubs (POWER)
  narrator_established:
  - printed_page: 62
    fact: The narrator calls information brokerage the largest-growth industry in
      the fictional Free Zone underground economy, giving a qualified estimate of
      a multibillion-nuyen yearly business expanding at almost ten percent per year.
      The source expressly warns that an accurate estimate of any unofficial market
      sector is difficult.
  - printed_page: 62
    fact: The chapter distinguishes raw digital data from monetizable information
      analysis/intelligence and describes Denver as a meeting place for deckers, fixers
      and other information workers because of the Nexus and the concentration of
      major corporate interests. Named commenters dispute the industry size, its community,
      and its composition.
  - printed_page: 62
    fact: 'The source says important Denver information-broker participants are relatively
      young: the average age among its A-list players is seventeen, with novice deckers
      and software enthusiasts sometimes as young as fourteen. The text does not claim
      that all participants have this age.'
  - printed_page: 63
    fact: The Free Zone has many constantly changing policlubs. The narrator specifically
      names Humanis and Unity as two significant groups among estimates ranging from
      twenty to more than one hundred; these are fictional-world organizations.
  - printed_page: 63
    fact: The source distinguishes Humanis leaders' public denial of any link to Alamos
      20K from the book narrator's assertion of a connection; it does not present
      the leadership as admitting the alleged connection.
  - printed_page: 63
    fact: The in-world narrator describes Unity as a post-Treaty organization openly
      opposed to metahumans, Amerindians, government, foreigners, gay people and fictional
      magic (including magophobic and homophobic prejudice); the satirical passage
      also ascribes to it a narrow ideal of Anglo-Saxon heterosexual human gun owners.
      The source explicitly distinguishes the organization's beliefs from the narrator's
      position and does not endorse this extremism.
  - printed_page: 63
    fact: The source describes Humanis and Unity members as victims of one another's
      attacks over the preceding months, with a hostile relationship notwithstanding
      their shared extremist attitudes; those acts are not presented as voluntary
      collaboration.
  - printed_page: 63
    fact: At the bottom of printed p63 the chapter starts a new section titled Smuggling
      and T-Bird Runs. The substantive continuation belongs with the following source-reviewed
      section; it was not used as a shortcut to invent a missing page or a procedural
      smuggling guide.
  editorial_distinctions: Alleged leadership denials, authorial descriptions of discriminatory
    ideologies, and contributors' reports of violent incidents must retain their separate
    provenance and agency.
