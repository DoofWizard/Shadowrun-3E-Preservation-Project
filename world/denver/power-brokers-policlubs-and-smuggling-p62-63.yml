    "publication_context": "Published fictional tabletop RPG sourcebook Denver: The City of Shadows (FASA Corporation, 1994; FASA7212; source.fasa-7212), original Shadowrun Second Edition-era setting. Original printed and PDF page numbers are retained; no Third Edition conversion is implied.",
    "section": "Brokers; Policlubs; Smuggling and T-Bird Runs introduction",
    "book_narrator_facts": [
      "The source narrator portrays information brokerage as the fastest-growing sector of Denver’s unofficial economy, provisionally estimating it as a multibillion-nuyen annual industry growing nearly ten percent per year; figures are presented as estimates rather than independently audited actuals.",
      "The narrator contrasts raw digital data with valuable intelligence and describes fictional information brokerage as encompassing digital analysis, intelligence gathering and other fictional-network services. In the Shadowland speaker material this definition includes references to hacking and sabotage; those remain in-world depictions rather than instructions.",
      "The source states that the average age among major A-list participants in local intelligence brokerage is seventeen, with some highly regarded participants as young as fourteen. These are source-period fictional claims and neither modern demographic statistics nor endorsement of minors’ participation.",
      "The Denver setting has numerous political clubs, described as roughly twenty to more than one hundred, with the Humanis and Unity policlubs singled out. The fictional narrator alleges Humanis leadership denies but is connected with Alamos 20K; this is the source’s allegation, not an assertion about real groups.",
      "The fictional narrator portrays Unity as anti-metahuman, anti-Amerindian, anti-government, xenophobic and discriminatory, and says it formed after the Treaty of Denver; it also portrays violent conflict between Unity and Humanis. Specific causal hypotheses offered by Shadowland posters are separate and speculative.",
      "The text introduces smuggling and T-bird runs as part of a post-Treaty, multi-sector fictional market with uneven tariffs, duties and jurisdictional restrictions. It characterizes the Free Zone as a crossroads of cross-border trade but provides no real-world operational instructions."
    ],
