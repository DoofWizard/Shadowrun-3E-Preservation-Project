data:
  publication_context: 'Published fictional tabletop RPG sourcebook Denver: The City
    of Shadows (FASA Corporation, 1994; FASA7212 / source.fasa-7212), historical Shadowrun
    Second Edition-era source material. Printed pages and physical PDF pages are distinguished;
    no Third Edition conversion is asserted.'
  section: 'Places of Interest: fictional Aztlan hotels, restaurants, location tags
    and LTG listings'
  publication_feature:
    title: Places of Interest
    author: Roving I
    scope: The fictional Aztlan Sector of Denver in the 2055 setting as described
      by FASA, not a real travel recommendation.
  roving_i_bylined_descriptions:
  - venue: Burnsley Hotel
    printed_page: 98
    map_location: 1
    archetype: Luxury Hotel
    floors: 10
    address: 1000 Grant Street
    manager: Ernesto Conger
    listed_bias: Slight bias against Orks and Trolls
    LTG: 1303 (23-3915)
    bylined_description: A few blocks south of the Civic Center, with elaborate salon and
      one-bedroom suites and an on-site lounge/restaurant. The narrative says the
      hotel dates back to the preceding century.
  - venue: Days Inn Capitol Hill
    printed_page: 98
    map_location: 2
    archetype: Average Hotel
    floors: 4
    address: 1150 E. Colfax Avenue
    manager: Monica Perseval
    listed_bias: No Racial Bias
    LTG: 8303 (31-7700)
    bylined_description: An unpretentious downtown hotel whose Aztechnology clientele is
      numerous; the narrator says inquiries have failed to confirm any direct tie
      between management and Aztechnology.
  - venue: Chinampas
    printed_page: 99
    map_location: 3
    archetype: Mid-Size Restaurant
    address: 1313 E. 6th Avenue
    owner: David Maceaultin
    listed_bias: Slight bias against Non-Corp Customers
    LTG: 8303 (39-1414)
    bylined_description: A corporate-favored restaurant with Aztec-themed artworks and a
      mixed Spanish-Mexican-themed cuisine. The description is Roving I’s stated opinion,
      not verification of traditional cuisine.
  - venue: The Serpent’s Feather
    printed_page: 99
    map_location: 4
    archetype: Mid-Size Restaurant
    address: 3333 S. Colorado Blvd.
    manager: Ricardo Valdez
    listed_bias: No Racial Bias
    LTG: 7303 (59-3333)
    bylined_description: A comfortable, somewhat upscale restaurant/bar with booths suitable
      for private conversations, often frequented by local fixers. The official venue
      name and manager must remain distinct from an attributed speaker’s claim about
      a competing business name.
  byline_provenance: >-
    Original printed p98 identifies PLACES OF INTEREST as a guide by Roving I.
    The p98-p99 venue descriptions are presented through this named in-world
    author rather than as unattributed book-narrator claims. Named Shadowland
    replies remain separate and unverified unless the fictional publication
    provides independent corroboration.
  printed_mapping:
    p98: PDF99
    p99: PDF100
