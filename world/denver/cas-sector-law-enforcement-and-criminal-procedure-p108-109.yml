    "section": "Fictional CAS Sector — law enforcement and crime-and-punishment narrative, distinct from separately preserved numerical tables",
    "sourcebook_bylined_guide_facts": [
      "Printed p108 describes Knight Errant Front Range Free Zone (KE-FRFZ) as the fictional CAS Sector law-enforcement division. Personnel cover command, data collection and analysis, investigation, Matrix security, and paranormal or astral security.",
      "The guide describes the division's background as comprising Knight Errant executive senior management, roughly half of middle management and a quarter of street enforcement assets; remaining officers and troops are described as officially demobilized and discharged from the CAS Armed Forces, retaining prior equipment while on active duty. This is the published fictional account, not a real-world organizational description.",
      "Printed p108 describes sellers of legal simsense chips and a fictional illicit chip and pharmaceutical trade. The guide distinguishes chips legal in UCAS but prohibited in CAS owing to their modulation from universally legal goods; it characterizes enforcement against illegal chips and pharmaceuticals as aggressive.",
      "On printed p109 the bylined guide states that the fictional CAS Sector's justice system follows CAS proper and provides trial by jury, with cases processed faster than in the contiguous states.",
      "The p109 'Intent' sidebar asserts the fictional CAS authorities do not distinguish intent from use when considering prohibited conduct, expressed as the guide's characterization rather than an assertion about actual law.",
      "The p109 'Cyberware' section says all entrants, including CAS citizens, must register Class A and Class C cyberware; possession may affect a work visa or travel pass application. It says bodyshops and cyberclinics may lawfully install only Class A cyberware.",
      "The p109 'Cyberdecks' section says all decks and programs require registration upon purchase or entry. The guide further describes KE Matrix officers requiring an identifying trace chipset and confiscating an unregistered stealth-chipped deck, with a felony charge.",
      "The p109 'Addictives' section differentiates possession for personal consumption from transportation/dealing in the fictional CAS setting. The guide defines the former as fewer than fifteen standard chemical doses or fifteen chips, and frames sixteen or more as dealing; it says convicted offenders are imprisoned, including first-time offenders, without mitigating exceptions in the narrator's characterization."
    ],
    "boundaries": "The exact printed weapon-fine table on p108 and criminal-offense table on p109 are independently indexed as rule_exact; this record does not replace or alter their values. Named Shadowland commentators' allegations remain separate attributed_claim records; the p109 Chinatown article begins an independently indexed subsequent section."
  },
