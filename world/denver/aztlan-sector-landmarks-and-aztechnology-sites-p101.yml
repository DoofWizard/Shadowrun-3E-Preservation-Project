  section: Aztlan Sector Capitol and heritage sites
  book_narrator_facts:
  - site: State Capitol Building
    map_location: 7
    details: Administrative Branch of the Council of Denver ordered the old Capitol
      demolished in 2048 and replaced it with the modern Early Blockhouse-style state
      capitol; many native Denverites see it as a symbol of excessive Administrative
      Branch growth.
  - site: Cheesman Park Conservatory
    map_location: 6
    details: Formerly the Boettcher Memorial Conservatory; remodeled as an Aztlan
      Sector landmark. Existing plants were removed and replaced with Aztlan-region
      vegetation; geodesic dome glows green at night.
  - site: Anáhuac University
    map_location: 8
    details: Formerly the University of Denver; claimed and renamed by the Aztlan
      government in 2027. Book characterizes its present function as an Aztechnology
      training institution mainly educating college-age children of the corporation’s
      managers and executives.
  - site: Aztechnology Building
    map_location: 53
    details: On the former Denver Country Club grounds near University and Speer;
      roughly 50–60 stories, spreading toward Cherry Creek. Sandstone base and framework
      with copper/gold glass; narrator-level statement is site description under a
      named section, while surrounding assessments are speakers’ claims.
  unresolved_distinction: Aztec Teocalli at map location 52 is described in an in-world
    commentary paragraph, not adopted as a verified narrator-established account in
    this record.
