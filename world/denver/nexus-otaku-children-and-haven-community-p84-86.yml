  section: Otaku community in the Denver Data Haven
  narrator_facts:
  - page: 84
    assertion: The narrator describes otaku as a group of around sixty children living
      at the Academy site, ranging from approximately five years old to the early
      teens, and identifies their name as revived from an earlier Japanese word for
      computer-focused socially isolated people.
  - page: 85
    assertion: The source portrays otaku as a distinct self-organized social community
      that recognizes Shiva as an important mentor and spiritual guide, without describing
      that relationship as ordinary parentage.
  - page: 85
    assertion: The text states that many otaku voluntarily undergo datajack implantation
      at very young ages. Several surgeon-technicians within the Data Haven perform
      the operations, and the Haven is said not to charge the children directly; in
      return, the children are expected to monitor the Nexus, search data, and undertake
      basic file maintenance.
  - page: 85
    assertion: Older otaku are said to teach newer children to use the terminals and
      computers around the Haven. The book contrasts older implanted children’s Matrix
      expertise with younger children who use terminals without implants.
  - page: 85
    assertion: The narrator describes a relationship in which adults provide material
      support, food and shelter while otaku members provide data searches and maintenance.
      The subculture and adult staff are portrayed as having distinct languages and
      social practices.
  - page: 85
    assertion: When no longer regarded as otaku, the former member is removed from
      membership, sometimes joining technical support or system-operator teams and
      sometimes departing; the text suggests the criteria are not purely chronological.
  - page: 86
    assertion: The narrator and speakers describe a variety of prototype cyberdecks
      tested at the Haven, but the book does not give numeric equipment statistics
      or a universal manufacturing procedure on these pages.
  consent_distinctions: The book describes some children as voluntarily accepting
    implantation and working in exchange for support; a named in-world commenter sharply
    disputes the ethics, calling it child abuse and questioning whether a child can
    give meaningful consent. These distinct source positions are both preserved, without
    normalizing or dismissing exploitation concerns.
