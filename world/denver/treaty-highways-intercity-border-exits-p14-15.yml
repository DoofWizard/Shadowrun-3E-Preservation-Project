data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    fictional historical Shadowrun Second Edition-era tabletop RPG; source.fasa-7212;
    no inferred Third Edition conversion.'
  section: On the Road
  book_narrated_road_network:
  - route: Highway 87 / Intercity 25
    facts: From Sioux Nation to north becomes I-25 on entering Free Zone; after treaty
      line highway serves international demarcation between sectors; at Colfax Avenue
      Exit 210, direct exit routes become border crossing locations.
  - route: I-25 / Speer Boulevard
    facts: Speer westbound off I-25 reaches Ute Sector control, while eastbound joins
      UCAS border controls.
  - route: I-25 / Aztlan and CAS
    facts: At Colfax Exit 210 road travels through Aztlan jurisdiction until Hampden
      Avenue Exit 201; at that point crosses into CAS. The route remains CAS to Academy
      Boulevard Exit 150 north of Colorado Springs; further south, enters Pueblo territory.
  - route: Route 70 western approach
    facts: From Ute on the west; becomes international territory at FRFZ boundary.
      At Exit 262 (Pleasant View), it re-enters Ute while Zone boundary follows Highway
      40/Colfax Avenue. International-route exits generally have sector-controlled
      border posts.
  - route: Route 70 eastern approach
    facts: From Sioux Nation, remains Sioux until the interchange at Exit 282 just
      east of Stapleton, where it becomes an international highway.
  - route: I-25 Pueblo northbound / Exit 194
    facts: I-25 enters the international portion just south of Colorado Springs; at
      intersection of Route 470 Exit 194 border cuts west, and I-25 proceeds through
      CAS.
  - route: Highway 24
    facts: Westbound begins in Pueblo and enters UCAS at border; eastbound begins
      in Pueblo and enters FRFZ still within Pueblo, without a same-country sector
      crossing.
  security_status: The fictional guide emphasizes external sector border crossings
    and security; its narrative describes official-jurisdictional distinctions, while
    unnamed or named Shadowland posts offer opinions about actual enforcement.
  attributed_comments:
  - speaker: Leo
    claim: Says the international highway arrangement is an unpopular Treaty compromise
      among signatories.
  - speaker: Underground Art
    claim: Warns of heavily guarded fictional sector entry/exit checkpoints.
  - speaker: Sturm
    claim: Claims crossing in/out of Free Zone can mean security screening even when
      sectors border one another, though practices vary by locality.
  - speaker: Firelight
    claim: Disputes that Pueblo-to-Pueblo cross-sector boundary is always stringent,
      saying guards often focus on suspicious travelers.
  - speaker: Fickle and Firelight
    claim: Discuss contradictory fictional rumors about aircraft passing Pueblo and
      smuggling; Firelight offers an in-world claim without official corroboration.
