    Third Edition conversion.'
  extraction:
    narrator_chronology:
    - In 2023 U.S. council representative Marlene Weiss concluded Pueblo, Sioux and Ute were using their
      three-vote bloc to disadvantage the United States and discussed a policy response with superiors.
    - At a Council meeting on April 8, 2023, after criticizing the treaty bloc, Weiss withdrew from the
      Council, taking American residents with her from its jurisdiction. The Treaty did not provide a
      quorum mechanism for votes without full attendance, leaving the council temporarily unable to act.
    - The United States declared an autonomous defense zone in its part of Denver, claiming to protect
      Americans against fictional Native American political opponents. U.S. teams used military engineering
      techniques under a civilian designation to construct a barrier more than 75 kilometers long around
      eastern Denver.
    - Pueblo, Sioux and Ute hesitated for four days because each feared unilateral military action would
      be exploited by the others. The barrier neared completion; the tribal bloc then created its own
      defended sector, and Aztlan declared an independent metropolitan territory as the remaining powers
      confronted one another.
    - In 2034 ten southern states seceded from the UCAS as the Confederated American States. Aztlan recognized
      CAS, and the UCAS accepted it through the Treaty of Richmond.
    - The UCAS voluntarily divided its autonomous defense territory, ceding part to CAS. The CAS representative
      gained a seat at the Council after the tribal bloc accepted its legitimacy, increasing the council
      from five members to six and the required simple majority from three to four.
    - Pueblo, Sioux and Ute subsequently disagreed and separated their common native territory into three
      autonomous zones. Council alliances frequently changed, and deadlocks increased. The Treaty requires
      unanimous consent to amend the structure of the Council.
    regional_context: The original barrier alignment later differed from the 2055 sector borders, which
      changed in 2034–2035.
  editorial_review_notes: Retains differences between narrator historical assertions and politically biased
    theories of in-world forum posters. The treaty quorum problem is about voting legitimacy, not a universal
    absence of law.
