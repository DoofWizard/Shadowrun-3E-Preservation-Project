headline: 'Fictional Shadowrun tabletop RPG: FASA Corporation, Denver: The City of Shadows (FASA7212, 1994), Second Edition-era, printed pp140-142/PDF141-143 — UCAS sector boundary, map, defenses and May 2055 statistics'
