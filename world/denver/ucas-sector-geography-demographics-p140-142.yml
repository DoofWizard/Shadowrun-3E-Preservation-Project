data:
  publication: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994); fictional Shadowrun Second Edition-era tabletop RPG source.'
  section: 'UCAS Sector, printed pp140-142, source PDF pp141-143; page 141 consists principally of the original geographic sector map.'
  sector_geography_p140:
    narrator: 'The publication describes the UCAS Sector border as following Highway 76 from the northeast, southwest toward downtown, then Route 6 to Highway 70, eastward and nearly southward along Highway 225 and Route 83.'
    downtown_noncontiguous_area: 'The described non-contiguous downtown area is bounded in part by East Colfax Avenue, Pennsylvania Street, East 18th Avenue and 17th Street; the narrator criticizes the alignment.'
    colorado_springs: 'In the south the boundary follows Route 2A to Intercity 25, then proceeds east along the old city border.'
  map_p141:
    evidence: 'Original full-page UCAS Sector regional map, with geographic roads and shaded sector regions; the map is preserved as publication context, not a source for extrapolated coordinates.'
  border_narration_p142:
    chronology: 'The narrator calls UCAS the first Treaty of Denver signatory to establish an autonomous sector behind walls; original U.S. Sector border alignments were subsequently adjusted between 2018 and 2055.'
    length: 'The initial wall is described as more than 75 kilometers long.'
    physical_defenses: 'The fictional narrator describes an average six-meter wall, razorwire and monowire, imaging systems and sensors; rural segments sometimes use conventional fencing.'
    patrols: 'The publication describes daylight perimeter monitoring without widespread manned patrols, guard-dog patrols after dark, and additional patrols in GMC Banshee LAVs and Yellowjacket rotorcraft with non-standard armor; aircraft surveillance is augmented by drones.'
    source_limit: 'Unusual claims about altered dogs, cybernetic collars and astral animals appear in named Shadowland comments, not as independently verified publication-narrator facts.'
