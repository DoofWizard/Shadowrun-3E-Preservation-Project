    "section": "THE REST OF IT; HEAR YE, HEAR YE; Free Zone Voice; Rocky Mountain Post",
    "narrator_established": [
      "The fictional Denver Administrative Branch contracts basic remaining civic services to independent companies whose jobs generally do not require crossing sector demarcators. The original published list identifies BIF Inc. for sanitation, Gray & Associates, Inc. for public works maintenance, and Renraku Computer Systems (Denver) for the public database and telecommunications.",
      "Most entertainment and news feeds entering the Front Range Free Zone come from outside the region, through the Matrix and leased datalines. The book gives examples of an ABS affiliate from Chicago, Pueblo Infotainment Service from Santa Fe, and Spirit Voice from Casper, alongside hundreds of other channels.",
      "In the source-period chronology the Administrative Branch established the Monitoring Office in 2043 to supervise outside media feeds and restrict material it deemed inappropriate for presentation in the Free Zone. Speakers express differing opinions on censorship, but this 2043 institutional creation is described by the book narrator.",
      "The fictional Free Zone supports a local trideo station called Free Zone Voice, broadcasting from the City and Council Building Annex 2 at Cleveland and Colfax. A division of the Administrative Branch manages the station in close coordination with the Monitoring Office; the narrator says it has little public viewership.",
      "The government-sanctioned datafax service, Rocky Mountain Post (RMP), is rigorously screened by the Monitoring Office. The source describes a 2014 merger of the Rocky Mountain News and the Denver Post, which had previously competed, under obscured common corporate ownership that subsequently eliminated the appearance of competition.",
      "The narrator describes independent and pirate media alternatives without endorsing allegations made by named commentators about their reliability or feasibility."
