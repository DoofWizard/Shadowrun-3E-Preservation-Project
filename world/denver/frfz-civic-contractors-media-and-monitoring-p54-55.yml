    "section": "THE REST OF IT; HEAR YE, HEAR YE; Free Zone Voice; Rocky Mountain Post",
    "narrator_established": [
      "The fictional Denver Administrative Branch hired independent contractors to provide remaining basic civic services not requiring crossing sector demarcations. The original published list names BIF Inc. for sanitation, Gray & Associates, Inc. for public works maintenance, and Renraku Computer Systems (Denver) for public database and telecommunications.",
      "The fictional sourcebook states that most entertainment and news media for the Front Range Free Zone originate outside the region and enter by the Matrix and dedicated leased datalines; examples include an ABS affiliate in Chicago, Pueblo Infotainment Service in Santa Fe, and Spirit Voice in Casper, among hundreds of channels.",
      "In the original setting chronology, the Administrative Branch established a Monitoring Office in 2043 to watch outside media feeds and restrict elements the office judged inappropriate for Free Zone presentation.",
      "The fictional Free Zone has a local trideo station, Free Zone Voice, broadcasting from City and Council Building Annex 2 at Cleveland and Colfax. A special Administrative Branch division operates the station with the Monitoring Office; the narrator says public viewership is rare.",
      "The government-sanctioned datafax service Rocky Mountain Post is rigorously screened by the Monitoring Office. The printed history describes a merger in 2014 of the Rocky Mountain News and the Denver Post, formerly outward competitors that were actually subsidiaries of the same conglomerate beneath multiple shell corporations. The narrator says the conglomerate dropped the shells when the artificial rivalry became public."
