  place: Council Hall
  map_location: 5
  roving_i_bylined_descriptions:
  - The building was originally known as the Denver City and Council Building and
    was renamed after the 2018 Treaty of Denver; it occupies the western end of the
    Civic Center at East Colfax Avenue and Broadway. The earlier civic structure is
    described as a remodeled 1920s monolith.
  - Council Hall falls officially within the Aztlan Sector, so representatives traveling
    from the other sectors cross national demarcation lines to attend Council meetings.
  - The building contains the Council Room, a relatively small private meeting space
    with an oval real-mahogany table, data ports and terminals, teak-lined walls,
    and no capacity for ordinary spectators beyond a handful of invited guests.
  - An adjacent press room has trideo feeds and is used for announcements the Council
    elects to make public; the building also provides offices for each Council member
    and personal aides.
  - A distinct security organization called the Council Guard provides security within
    and outside Council Hall, nominally answering directly to the Council of Denver.
  attribution_and_certainty: >-
    The Council Hall descriptions are within Roving I's named PLACES OF INTEREST
    guide beginning on original printed p98 and continuing through p101.
    They should not be labeled anonymous book-narrator facts. Claims about
    Council Guard factions, border politics and hypothetical closures made
    by signed Shadowland speakers on p100 remain separately attributed.
  edition: FASA7212 original Second Edition-era 2055 institutional portrayal, no later
    Shadowrun conversion
