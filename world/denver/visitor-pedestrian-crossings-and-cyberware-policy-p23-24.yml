data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    published fictional Shadowrun Second Edition-era tabletop-RPG sourcebook; source.fasa-7212;
    no inferred Third Edition conversion.'
  source_context: Historically published in-world fictional setting information; narrator
    facts, attributed Shadowland posts, and hypothetical examples are distinct.
  extraction:
    narrator_inspection_stages:
    - Crossing on foot is compared to a heavily supervised airport checkpoint. Travelers
      enter a scanner arch with metal and chemical detectors.
    - A traveler flagged by the sensors may be subjected to additional questioning
      and an invasive physical search at the guards’ discretion. The described conduct
      is coercive, not voluntary assistance.
    - After initial screening, the traveler must provide reason for entering, duration,
      intended residence, and identification; the sourcebook mentions a credstick
      read and thumbprint comparison.
    - Immigration officials can deny admission and require inspection without giving
      a detailed justification; one poster states that some sectors permit administrative
      appeals.
    narrator_variability: Procedures and enforcement are presented as highly variable
      by sector and individual officials.
    cyberware_issues:
      named_poster: Wu
      assertion: Reports that weaponized cyberlimbs such as spurs or integrated guns
        may be disabled with control-circuit restraints at some sector entrances;
        other augmentations may be tolerated, depending on sector.
      coercion: If applied, security restraints are imposed as a condition for entry
        rather than requested personal enhancement.
      limitation: The source is a named in-world assertion, not a globally effective
        mechanic or real-world implementation instruction.
