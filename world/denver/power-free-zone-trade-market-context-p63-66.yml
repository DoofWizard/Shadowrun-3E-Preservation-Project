    "publication_context": "Fictional tabletop-RPG sourcebook Denver: The City of Shadows, published by FASA Corporation in 1994 (FASA7212; source.fasa-7212); historical Shadowrun Second Edition-era setting, no inferred Third Edition conversions.",
    "section": "The Real Power / Smuggling and T-Bird Runs / Markets",
    "narrator_facts": [
      "The fictional Treaty of Denver bars tariffs and duties levied on traffic between signatories. Alongside the Free Zone’s six-way political division, the book describes those provisions as contributing to Denver’s large cross-sector free-port and irregular trade markets, rather than making all particular goods lawful everywhere.",
      "The narrator distinguishes two market categories for fictional cross-sector commerce: the Denver population, and the six signatory governments. The official Free Zone population is 3.5 million; the narrator estimates actual residents and potential consumers at more than 4 million.",
      "The narrator attributes demand for unregulated cargo in part to the sector-by-sector legal differences of the six signatories and the combination of local resident needs and official buyers.",
      "The source says formal distributors and merchants undersupply Free Zone residents because of complicated commercial rules and costs across sector lines; as a result, certain products legitimately permitted in their destination also pass through informal trade channels.",
      "The narration distinguishes legal versus prohibited goods at the destination from goods’ status in transit jurisdictions. A distributor may carry merchandise that is lawful in its final sector but restricted in a different one. Such in-world classifications do not establish actual real-world legality.",
      "The narrator says the Free Zone simultaneously sustains trading in unlawful recreational drugs, illicit simchip entertainment and military-class goods; this is taxonomy of the fictional setting, not directions for trafficking.",
      "The signatory governments are identified as the other major purchaser category, separate from the broad population market."
    ],
