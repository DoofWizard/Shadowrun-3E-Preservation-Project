data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994), a published fictional
    Shadowrun Second Edition-era tabletop role-playing sourcebook, catalog source.fasa-7212; no inferred
    Third Edition conversion.'
  extraction:
    book_narrator:
    - The published setting describes the Treaty of Denver signed in 2018 and the division of Denver among
      the United States, Ute Nation, Pueblo Corporate Council, Sioux Nation and Aztlan.
    - Denver, Boulder and Colorado Springs were valued for military facilities and transportation/communications
      connections during the conflicts between the U.S. and the Sovereign American Indian Movement, later
      the Native American Nations.
    - The area was consequently a target for raids by people following Howling Coyote. Both sides escalated
      actions, bringing a near-direct conflict over the city.
    - The Great Ghost Dance occurred on August 17, 2017 according to the setting, and combatants shifted
      military forces outside the Denver metropolitan area during the subsequent treaty negotiations.
    published_full_page_illustration:
      printed_page: 30
      pdf_page: 31
      description: Large original monochrome combat image with two armed people in a damaged interior
        and a smaller foreground figure; illustrated source credit appears at lower right of artwork.
      source_is_fictional: true
  editorial_review_notes: Narrator history is separate from Abraxas's and other Shadowland posters' differing
    personal recollections of a nine-day blockade.
