    "publication_context": "Fictional tabletop-RPG sourcebook Denver: The City of Shadows, published by FASA Corporation in 1994 (FASA7212; source.fasa-7212); historical Shadowrun Second Edition-era setting, no inferred Third Edition conversions.",
    "section": "The Real Power / Policlubs",
    "narrator_facts": [
      "In the fictional 2055 Denver Free Zone, political clubs range from benevolent groups to militant factions, with rapid turnover and frequent change. Estimates vary from roughly twenty to more than one hundred groups in the Free Zone; the book emphasizes Humanis and Unity as particularly consequential.",
      "The Humanis policlub is described as ideologically consistent with other fictional Humanis organizations. Its leadership strongly denies connections to Alamos 20K, while the narrator characterizes that connection as an open secret; denial and narrator assessment are separate assertions.",
      "Unity arose soon after the Treaty of Denver. The narrator characterizes it as strongly anti-metahuman, anti-Amerindian, anti-government, xenophobic, homophobic, and hostile toward magic; the source also describes an ideology of narrow human ethnic and social conformity.",
      "The narrator describes actual links between Unity and Alamos 20K, yet emphasizes that Unity and Humanis are bitter opponents rather than allies. During the months preceding the book’s 2055 setting, killings and violent reprisals between members of the two groups were reported in both directions. The text does not explain a verified cause."
