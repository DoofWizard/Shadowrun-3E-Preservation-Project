data:
  publication_context: 'FASA Corporation, Denver: The City of Shadows (FASA7212, 1994),
    fictional historical Shadowrun Second Edition-era tabletop RPG; source.fasa-7212;
    no inferred Third Edition conversion.'
  section: COMING AND GOING / In the Air (continuation)
  published_airports:
  - sector: CAS
    facility: Lowry
    book_narration: Former Lowry Air Force Base converted to international commercial
      use; flights mostly corporate rather than ordinary public traffic.
  - sector: Aztlan
    facility: Azzie airfield near former Chamberlain Observatory
    book_narration: High-traffic airport handling F-B Commuters and larger VTOL/STOL
      craft, but not suborbitals or semiballistics; main sector contact with outside
      world. The book states traffic is controlled by Aero Montezuma, owned by Aztlan
      government and managed by Aztechnology.
  - sector: Pueblo
    facility: Sedalia
    book_narration: Only Pueblo international facility near south Denver; small, and
      unable to land heavily loaded craft.
  - sector: Ute
    facility: Niwot Airport near Boulder
    book_narration: Former small municipal field upgraded after Treaty for regional
      and international traffic; short-haul flights dominate, suborbital/semiballistic
      trips rare and restricted to special corporate charters; no ordinary international
      public carriers.
  former_us_air_force_academy: Reported by in-world commentators near foothills; the
    narrator does not confirm the purpose or contents of any surviving military installations.
  narrator_aviation_overview: The original guide describes overlapping airfields,
    distinct radar/control, transponder and scheduling systems of different sectors,
    and conflicting military/civilian flight activity as a serious source of congestion.
  attributed_comments:
  - speaker: Chacmool
    claim: Regards Aztlan government and Aztechnology control of air traffic as a
      troubling combination.
  - speaker: Freedom Cryer
    claim: Jokes that the distinction between government and corporation is nonexistent.
  - speaker: Wingz
    claim: Short incredulous response to Sedalia as an international airport.
  - speaker: Talbot and Moraya
    claim: Discuss the old U.S. Air Force Academy field; Moraya argues the original
      academy airfield was used mainly for propeller training and Treaty dispute over
      land/remaining facilities.
  - speaker: Hurricane and Hicks
    claim: Speculate about underground academy infrastructure and severe military
      destruction; unconfirmed in-world claims.
  - speaker: Sky Pilot
    claim: Complains that seven international airports, additional airfields and military
      aircraft create complicated approach control and scheduling.
  publication_note: Names and events are from the alternate-history tabletop setting;
    this is not current real-world airport or security information.
