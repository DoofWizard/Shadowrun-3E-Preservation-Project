    Second Edition-era source material. Printed pages and physical PDF pages are distinguished;
    no Third Edition conversion is asserted.'
  section: Fictional 2055 Aztlan sector manager, corporate law, visas, policing, and
    regulated goods
  narrator_assertions_by_page:
  - page: 93
    facts: Mother Jonah’s attributed article identifies the fictional sector manager
      as Francisco Valdez, an Aztechnology employee who directs sector security; Aztechnology
      Corporate Security (ACS) is described as the principal sector law-enforcement
      organization, with foot, vehicle and rotorcraft units, computer support and
      magical capabilities.
  - page: 93
    facts: The article states the sector applies Aztechnology corporate law and describes
      judiciary councils operating under corporate sector management, without local
      popular ratification. It reports broad authorization for security force and
      narrow avenues for residents to challenge rulings.
  - page: 93
    facts: Other megacorporations may maintain limited liaison/import-export offices
      but are not permitted manufacturing or research facilities in the Aztlan Sector;
      a named Shadowland speaker separately describes the offices as possible espionage
      centers.
  - page: 94
    facts: Sector immigration requires a prospective applicant to have a job committed
      by a recognized corporation, an extensive personal-background and documentation
      review, and an interview at the Sector Management Building (Centennial Building,
      Lincoln and East 13th). A successful applicant becomes a resident alien permitted
      to work, not an Aztlan citizen.
  - page: 94
    facts: Temporary Aztlan-sector travel passes are tied to the individual’s personal
      credstick and identity record and are time-limited depending on purpose; the
      article emphasizes strict entry paperwork and inspection.
  - page: 95
    facts: Security personnel conduct document spot checks, and the source depicts
      the corporate security force as carrying more powerful arms and armor than its
      civilian population.
  - page: 96
    facts: The article distinguishes civilian possession of light personal weapons,
      including SMGs, from restrictions on heavier armaments. It separately describes
      strict controls on importation of drugs and simsense chips, comparatively lenient
      local-use controls, and a legally available alcohol market.
  - page: 97
    facts: The article describes cyberware registration and licensed installation
      requirements. Cyberdecks are unavailable for legal purchase, and unauthorized
      decks are characterized as legally risky; these are fictional setting legal
      conditions, not procedures for evasion.
  named_book_author:
    page_start: 93
    name: Mother Jonah
    article: We’re from the Government and We’re Here to Help You
  scope: Fictional 2055 Aztlan-sector social and legal setting, no real-world law
    and no conversion to SR3.
