data:
  publication_context: 'The fictional tabletop role-playing sourcebook Denver: The
    City of Shadows, FASA Corporation (1994), catalog FASA7212, source.fasa-7212,
    describes historical Shadowrun Second Edition-era Front Range Free Zone taxation;
    printed pp48-49, nominal PDF pp49-50.'
  section: KEEPIN' IT ALL TOGETHER; (DEATH AND) TAXES; VAT; Income Tax; National Taxes
  narrator_established:
  - In the fictional Front Range Free Zone, the Administrative Branch maintains infrastructure
    and uses general tax revenues for operating expenses. The publication says it
    often acts without meaningful direction from the Council of Denver; its Revenue
    and Taxation Service (RTS) operates with substantial autonomy.
  - The Treaty of Denver gives the Council the sole authority to levy taxes, duties
    and tariffs on Free Zone residents and on goods entering or leaving the Free Zone,
    without regard to which sector they inhabit. The Council delegates collection
    and control of taxation to the Administrative Branch. Changes to collection methods
    or significant rate increases require a Council resolution, characterized by the
    text as rare.
  - The Free Zone has a flat 10 percent value-added tax (VAT), with no exemptions,
    on goods and services, tangible or intangible. The original publication lists
    food, DocWagon bills, water, other utilities, and goods made or sold through successive
    stages. Manufacturers, distributors, retailers and consumers each pay VAT as value
    is added or items are sold; registered businesses can seek a deduction or rebate
    for VAT on goods or services essential to business, subject to burdensome registration
    and documentation.
  - The narrator explicitly classifies a business's failure to charge customers VAT
    on goods and services as a felony under the setting's Free Zone system. This fictional
    legal classification is distinct from Watchdog's claim that charging VAT twice
    is unlawful.
  - The Free Zone levies an income tax at a flat 15 percent of income, paid promptly
    to the RTS without sliding scale, indexing, or marginal brackets.
  - Under the Treaty as described by the narrator, national taxes, tariffs, and other
    levies are prohibited in the Free Zone; inhabitants of any sector pay the Free
    Zone income tax rather than a national income tax there.
  named_in_world_claims:
  - speaker: Watchdog
    printed_page: 48
    claim: The fictional Shadowland commentator says some sellers include VAT in their
      displayed prices, others add it at checkout, and others allegedly do both; Watchdog
      calls double charging unlawful. This is attributed market commentary, not a
      second narrator statement assigning felony status.
  - speaker: Bean Counter
    printed_page: 49
    claim: The fictional Shadowland commentator claims that UCAS and CAS may treat
      their nationals' Free Zone income as tax-deferred rather than exempt when those
      nationals later leave the zone; the source presents this as a named speaker's
      interpretation, not independently narrator-confirmed Treaty law.
  exact_source_period_values:
    VAT_percent: 10
    income_tax_percent: 15
  dating: Original fictional source's 2055 setting chronology; not real-world tax
    advice and not a Shadowrun Third Edition rules conversion.
