  section: KEEPIN' IT ALL TOGETHER; (DEATH AND) TAXES; VAT; Income Tax; National Taxes
  narrator_established:
  - In the fictional Front Range Free Zone, the Council's Administrative Branch maintains
    infrastructure and finances operating expenses from tax receipts. The book observes
    that Council direction is often absent, and that the Revenue and Taxation Service
    (RTS) operates largely independently within this structure.
  - Under the Treaty of Denver, the Council alone may levy taxes, duties or tariffs
    on Free Zone residents or on goods entering or leaving the zone, regardless of
    sector. The Council delegated taxation collection and administration to the Administrative
    Branch. Alterations to collection methods and significant rate increases require
    a Council resolution, which the narrative characterizes as rare.
  - The value-added tax (VAT) is a flat 10 percent applied without exception to tangible
    and intangible goods and services throughout the Free Zone. The book gives examples
    including food, water, utilities and DocWagon services. VAT arises at successive
    production and sale stages when value is added; registered businesses may seek
    a deduction or rebate for prior VAT on goods or services essential to their business,
    with onerous filing and qualification requirements.
  - The narrator says that some merchants include VAT in posted prices while others
    add it at checkout. Watchdog, an identified fictional Shadowland commenter, alleges
    that some merchants charge VAT in both ways and calls that practice unlawful.
    Neither the narrator nor the cited comment assigns a specific felony classification
    to failure to charge VAT.
  - The Free Zone income tax is a flat 15 percent of income. The source describes
    no sliding scale, indexing or marginal brackets, and directs the tax amount to
    the Revenue and Taxation Service.
  - The Treaty prohibits national income taxes, tariffs, duties and other levies upon
    Free Zone income or trade. A separate fictional commentator, Bean Counter, alleges
    that CAS and UCAS may defer rather than exempt their nationals' income when earned
    in the zone; that is an attributed interpretation, not narrator-confirmed treaty
    law.
  exact_source_period_values:
    VAT_percent: 10
    income_tax_percent: 15
  dating: Original fictional source discusses 2055 conditions; these are neither real-world
    tax rules nor modern Shadowrun Third Edition conversions.
