    "publication_context": "Fictional tabletop RPG sourcebook Denver: The City of Shadows, FASA Corporation (1994), catalog FASA7212, historical Shadowrun Second Edition era, source.fasa-7212; page numbers refer to original printed pages and their nominal physical PDF page numbers; no implied Third Edition conversion.",
    "section": "KEEPIN' IT ALL TOGETHER; (DEATH AND) TAXES; VAT; Income Tax; National Taxes",
    "narrator_established": [
      "Within the fictional Front Range Free Zone (FRFZ), the Administrative Branch maintains infrastructure under the Council of Denver's general direction. The branch is funded from the revenue generated through various forms of taxation; the Revenue and Taxation Service (RTS) operates with substantial administrative independence.",
      "The Treaty of Denver reserves taxation and other duties or tariffs on residents and goods entering or leaving the Free Zone to the Council alone, regardless of sector. The Council has delegated taxation administration to its Administrative Branch. Changing collection methods or making significant rate increases requires a Council resolution, which the book says is seldom achieved.",
      "The value-added tax (VAT) is a flat 10 percent on goods and services, tangible or intangible, imposed at successive production and retail stages. The example scope includes food, utility bills, and DocWagon services. The book explains that registered businesses can claim deductions or rebates for VAT already paid on goods or services deemed essential to doing business, while depicting qualification and filing as complex.",
      "The source states that businesses' failure to charge VAT is a felony in the fictional FRFZ. Some businesses include VAT in advertised prices and others add it at payment; a named Shadowland participant further alleges double-charging by some businesses.",
      "Income tax is 15 percent of income, without a sliding scale, indexation, or marginal rates. The source instructs that 15 percent be remitted to RTS.",
      "Under the Treaty, national income taxes, duties, tariffs, and other national levies are forbidden on Free Zone income or trade. A subsequent speaker claims individual signatories interpret how to account for income differently; that claim is not independently established by the narrator."
    ],
