durable_facts:
  - "Dunkelzahn was traveling in the presidential motorcade after the Watergate Hotel event when the fatal incident occurred."
  - "The scene involved a catastrophic blast centered on the presidential limousine and extensive emergency/security response."
  - "A magical/astral phenomenon appeared over the site within minutes and rapidly became a separate public-security hazard."
  - "Government, military, law-enforcement, media and private witnesses supplied different partial views of the event."
  - "The chapter does not settle responsibility for the assassination; competing explanations remain attributed claims."

investigative_context:
  - "Interview subjects repeatedly describe security confusion, incomplete information and contradictory observations."
  - "Shadowland contributors use the testimony to challenge simple public narratives and to frame the assassination as an unresolved investigation rather than a solved event."
  - "The section leads directly into Dunkelzahn's will and the political/corporate fallout rather than supplying a definitive culprit."

