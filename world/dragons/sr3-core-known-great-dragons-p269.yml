  great_dragon_world_profiles:
  - name: Aden
    kind: sirush
    narrator_report: The fictional source attributes Tehran’s destruction in 2020
      to Aden, following the ruling ayatollah’s call for jihad against the Awakened.
    location_certainty: believed
    reported_lair: Mount Ararat
  - name: Alamais
    kind: western dragon
    narrator_report: The source describes suspected involvement with Der Nachtmachen,
      Alt Welt and other German-European political groups.
    certainty: suspected
    whereabouts: unknown
  - name: Celedyr
    kind: western dragon
    narrator_report: The dragon is described as lairing in Caerleon, Britain beneath
      an ancient Roman amphitheater that forms the center of a Transys Neuronet research
      facility.
    public_sightings: The source says Celedyr had been seen only three times since
      the Awakening.
  - name: Dunkelzahn
    kind: western dragon
    narrator_report: The source recounts a televised interview by Holly Brighton soon
      after his first appearance, an unprecedented non-human elected-office campaign,
      his 2057 UCAS presidential victory and his assassination after taking office.
    death: The book attributes his death to a mysterious explosion outside the Watergate
      Hotel in the Federal District of Columbia; no agent or motive is established
      here.
  - name: Hestaby
    kind: western dragon
    reported_lair: Mount Shasta, California Free State
    narrator_report: The source describes a community of humans and metahumans serving
      Hestaby and credits her with repelling a Tir Tairngire invasion of Northern
      California.
  - name: Hualpa
    kind: feathered serpent
    narrator_report: The fictional narrator identifies Hualpa as a leader and spokesperson
      for the Awakened forces of Amazonia.
    location_certainty: believed
    reported_lair: Yucatan
  - name: Lofwyr
    kind: western dragon
    narrator_report: The book names Lofwyr as CEO and chair of Saeder-Krupp Heavy
      Industries and a member of the Tir Tairngire Council of Princes.
    reported_lair: Rhine-Ruhr Megaplex, German Alliance
  - name: Lung
    kind: eastern dragon
    narrator_report: The source describes Lung as involved in several Triad conflicts
      after the Awakening, supporting factions with money and magical influence.
    current_whereabouts: unknown
    location_certainty: believed to be in mainland China
  - name: Mujaji
    alias: Rain Queen
    kind: feathered serpent
    reported_lair: Cape Republic, Africa
    narrator_report: The source portrays an antagonistic relationship with neighboring
      elves of the Zulu Nation.
  - name: Rhonabwy
    kind: western dragon
    reported_lair: Llandovery, Wales
    narrator_report: The source characterizes Rhonabwy as a corporate power player,
      musician and supporter of metahuman rights.
    uncertainty: The supposed feud with a great dragon called the Sea Dragon in Cardigan
      Bay is described as possibly a local legend.
  - name: Ryumyo
    kind: eastern dragon
    first_public_sighting: December 24, 2011 near Mount Fuji
    narrator_report: After two further claimed sightings at Ise and Kyoto, Ryumyo
      is said to have disappeared from view.
    uncertainty: Connections to Japanese Yakuza are rumors, not established facts.
  - name: Sirrurg
    kind: western dragon
    narrator_report: The source associates Sirrurg with possible responsibility for
      the loss of EuroAir Flight 329 in 2041 and with attributed attacks on corporate
      or government holdings in Europe.
    uncertainty: Possible involvement in the coup establishing Amazonia is qualified,
      and current whereabouts remain unknown.
