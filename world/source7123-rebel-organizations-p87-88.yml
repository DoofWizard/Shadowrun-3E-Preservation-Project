groups:
  knights_of_the_red_branch:
    leader: "Ian O'Donnel"
    headquarters: "Boston, UCAS"
    notes:
      - "Irish-American armed opposition group seeking to replace the Tir na nOg government with a restored Irish government."
      - "O'Donnel is described as a physical adept and former Irish military officer who formed the Boston organization after leaving Tir na nOg."
  la_venta:
    leader: "Unknown"
    headquarters: "Unknown; Denver or Austin suggested"
    notes:
      - "Anti-Aztlan underground network presented as active in Aztlan's internal conflict and especially in the Front Range Free Zone/Austin resistance."
      - "The source describes a compartmentalized cell structure and presents claims about hidden leadership or Aztechnology manipulation as speculation."
  quebec_unite:
    leader: "Jean-Claude Monteblanc"
    headquarters: "Montreal, Quebec"
    notes:
      - "Pro-reunification underground movement advocating Quebec's eventual return to the UCAS."
      - "The source describes government prohibition, outside corporate backing claims and conflict with pro-separatist groups as part of its source-period political context."

