nadja_daviar:
  source_profile:
    - "The chapter presents Nadja Daviar as Dunkelzahn's longtime translator/assistant, executor of his estate, chair of the Draco Foundation and the nominee to become UCAS Vice President."
    - "The source says she was born in Estonia in 2014 during an early UGE wave; her parents were killed in a riot when she was eight, after which she grew up in an orphanage."
    - "The reliable public trail is described as fragmentary until her appearance in Prague in 2035 at age 21."
    - "The source attributes much of the uncertainty about her early life to the Crash of 2029 and to deliberately obscured financial records."
    - "Daviar is described as multilingual; speculation about her exact ancestry, metatype, wealth, private history and relationship with Dunkelzahn remains attributed rather than settled."
  power_and_assets:
    - "Her authority over the estate and Foundation immediately makes her one of the most influential individuals in the post-Dunkelzahn political/corporate environment."
    - "The text distinguishes documented offices and assets from rumors that she personally directs a broader hidden agenda."

and_trouble_for_all:
  - "The will and Foundation redistribute wealth, corporate leverage, magical artifacts and research incentives on a scale that destabilizes existing alliances."
  - "Corporations, governments, magical groups and private actors are all shown trying to interpret or exploit the new incentives."
  - "The source emphasizes that the same bequests can create cooperation, competition, political friction and deniable contracting at the same time."
  - "Shadowland posts speculate about concealed motives and coordinated long-range planning; those claims remain speculation unless separately supported."

dunkelzahn_the_martyr:
  - "The source records an immediate religious and cultural response to Dunkelzahn's death, including spontaneous memorialization and attempts to frame him as a martyr."
  - "The death becomes a symbol for pro-Awakened, metahuman-rights and broader political causes, while opposing groups interpret the event differently."
  - "The chapter treats the growth of myth around Dunkelzahn as a world-state consequence rather than proof of any supernatural claim about his death."
  - "Public memory, political symbolism and newly formed movements are presented as ongoing campaign forces after 2057."

