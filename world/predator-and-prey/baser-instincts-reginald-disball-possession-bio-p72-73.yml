    "publication_context": "Historical fictional Shadowrun tabletop-roleplaying adventure Predator and Prey, FASA Corporation (1998), FASA7324, source.fasa-7324, Second Edition-era publication; not a real-world event or a Third Edition rules conversion.",
    "disball": "Reginald Disball prefers animals to humans and works as an animal handler at the Fort Lewis Zoological Gardens. He struggled socially and professionally before meeting an unusual companion at an environmental club meeting in a diner. The companion is an astral entity that needs paranimal proximity for sustenance. It persuaded Disball that the arrangement would help his work. Disball did not know much about magic and accepted the arrangement; the narrator distinguishes that initial agreement from subsequent loss of control. Disball gained a better post at the zoo and grew accustomed to the creature’s demands.",
    "loss_of_agency": "The entity subsequently seized control of Disball, slowly crowding out his own identity. Disball is aware of the attacks and believes the entity considers them necessary, but does not know its true motives. He wants it stopped and cannot independently stop it.",
    "appearance": "Average height, white hair surrounding a bald crown, underweight and unshaven for at least a week in the narrator’s account.",
    "conditional_GM_rule_context": "The bracketed game statistics apply only while Disball is actively influenced by the entity. For a higher-powered opponent the book suggests treating the possessed Disball as Superhuman. This is optional GM guidance, not a permanent change to his ordinary abilities.",
    "entity": "The astral companion values access to paranimals and initially facilitates Disball’s work, then increasingly exploits the relationship and exerts coercive control. Do not equate Disball’s wishes with the entity’s actions."
