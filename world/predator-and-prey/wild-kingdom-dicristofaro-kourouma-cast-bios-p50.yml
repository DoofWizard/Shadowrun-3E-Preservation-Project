  "data": {
    "source_context": "Fictional Shadowrun tabletop RPG adventure Predator and Prey, FASA Corporation (1998), FASA7324, catalog source.fasa-7324; historical Second Edition-era material, with no inferred Third Edition replacement. Printed p50; PDF p51.",
    "albert_dicristofaro": "The 1998 adventure describes a short, balding Anglo man with brown hair and blue eyes. A JHIH employee in Baltimore studying comparative neurology across human, metahuman and animal brains, he agreed to a PBT extraction offer promising pay, access to research and employer support. He did not consent to enslavement; the narrator presents his later captivity in the African slave trade as an unwanted and terrifying consequence. He is portrayed as fastidious before the adventure and fearful by the meeting with the party.",
    "ahmadou_kourouma": "The fictional PBT representative is a human from Anyi territory in the former Cote d'Ivoire. His family suffered under King Gissale's anti-human purges. The source depicts a heavily built man with close-cut hair, dark eyes, a beard and a frequent anxious smile. He prioritizes business even while holding a residual personal dislike of orks and trolls from his upbringing. The narrator says he treats corporate slavery as a business practice, disregarding moral objections. Phoenix Biotechnologies financed his education and career; he loves both of his wives, Massan and Tsotso, and will not endanger his employer position.",
    "provenance": "These are named characters in a published fictional tabletop adventure, not biographies or allegations about actual people. Source-described consent to an extraction is not consent to subsequent enslavement."
