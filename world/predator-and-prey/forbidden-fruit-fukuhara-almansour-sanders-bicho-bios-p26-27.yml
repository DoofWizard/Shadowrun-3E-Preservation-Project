  "data": {
    "publication_context": "FICTIONAL published Shadowrun tabletop RPG adventure anthology Predator and Prey, FASA Corporation, copyright 1998, FASA7324, catalog source.fasa-7324, historical Second Edition, printed p26-27/PDF p27-28.",
    "eiji_fukuhara": "Dr. Eiji Fukuhara, a slender Japanese-descended graduate of the University of Pittsburgh, proposed the botanical kiwi expedition to Green Globe International and portrays himself as its leader. His book-narrated fixation on cultivating Brazilian kiwi outside the Amazon may make him dismiss risks. The book establishes his research background, while his personal self-image is characterization.",
    "mohammed_al_mansour": "Dr. Mohammed Al-Mansour, a solitary sour-faced hobgoblin (SR Companion p40), fled persecution by a fundamentalist regime in his fictional Syrian homeland and was violently attacked after arriving in the UCAS. He later joined GGI and settled in Seattle. The book attributes his suspicion of humans to past experiences and describes prior military and self-defense training; he is the expedition’s only armed scientist.",
    "carl_sanders": "Dr. Carl Sanders, a University of Washington graduate, favors actual field research over simsense and virtual reproductions. Fellow researchers may regard him as unconventional, but the narration describes him as productive, intelligent, sociable, and a storyteller with extensive field experience.",
    "roberto_bicho_xavier": "Roberto “Bicho” Xavier served in the Brazilian army and was stationed near the Amazonian rainforest town of Fonte Boa. The source states that in 2033 his squad was sent downriver toward Manaus to protect it from dragons and metahumans, but a surprise paranormal creature attack nearly destroyed the squad. Xavier and other surviving soldiers fled up the river and out of Brazil; he alone reached the Peruvian border. He subsequently moved to Iquitos as a guide and distrusts metahumans while hiding that prejudice except during extreme duress. The scene presents this as the fictional narrator’s biography, distinct from character-alleged events.",
    "portrait_art": "Two illustrated grayscale NPC bust portraits on printed p26 show Fukuhara and Al-Mansour; the profiles for Sanders and Xavier are text-only on printed p27."
  },
  "headline": "FICTIONAL published Shadowrun tabletop RPG adventure anthology Predator and Prey, FASA Corporation, copyright 1998, FASA7324, catalog source.fasa-7324, historical Second Edition, printed p26-27/PDF p27-28. Forbidden Fruit: source narrator biographies of the expedition scientists and Bicho.",
