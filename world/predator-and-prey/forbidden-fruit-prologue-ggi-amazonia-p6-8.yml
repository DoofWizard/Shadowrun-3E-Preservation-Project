  "data": {
    "publication_context": "FICTIONAL published Shadowrun tabletop RPG adventure anthology Predator and Prey, FASA Corporation, copyright 1998, FASA7324, catalog source.fasa-7324, historical Second Edition, printed p6-8/PDF p7-9.",
    "source_attributed_characters": "The fiction opens with Edwin Danforth, a dwarf partner of Randall Pape, at Green Globe International (GGI); Pape argues the firm should hire shadowrunners. They had spent ten months and approximately half a million nuyen planning a plant expedition.",
    "fictional_company_goal": "GGI is described as a botanical research company seeking samples of a rare large Brazilian kiwi grown in Amazonia; Dunkelzahn is said to have offered ten million nuyen for the first successful cultivation outside its native range. The invented Amazonian government has refused GGI permission to enter and collect plants.",
    "allegation_and_motive_distinction": "Danforth objects to illegal approaches and worries about the company’s integrity; Pape insists the firm needs an alternative to losing its investment and seeks an unofficial expedition. These are in-world character arguments, not approvals or real-world recommendations.",
    "adventure_synopsis": "A group of shadowrunners is employed to accompany three GGI botanists through the fictional Amazonian border region, protect the party and return plant samples. The introductory synopsis foreshadows scientists clashing, one becoming violent, another dying, and larval Awakened insects emerging from collected fruit during the flight home. This is fictional scenario setup and does not establish a mandatory player outcome.",
    "campaign_position": "The text says the adventure takes place after Dunkelzahn’s death and the publication of his will. It recommends a shaman or mage but does not require one; riggers may have opportunities with drones."
