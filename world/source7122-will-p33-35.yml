  - {recipient: "Xeros Positive Research Tank, specifically its Mendocino Laboratory", bequest: "Neptune's Net."}
  - {recipient: "Keitha and the Lake Louise centaurs", bequest: "The meadows and forests in which they live."}
  - {recipient: "Shadowland Nexus", bequest: "Ownership and control of specified Matrix LTG sites, locations and passcodes whose titles had already been transmitted under Dunkelzahn's electronic signature."}
