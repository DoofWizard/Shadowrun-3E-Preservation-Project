  - {recipient: "Tara Bills", bequest_condition: "One ally spirit is directed to use its accident power against her three times a week for one year."}
  - {recipient: "Howard Folkner", bequest_condition: "One ally spirit is directed to use binding power to prevent him from abandoning specified family/employment obligations."}
  - {recipient: "Sir David Meyerhoff", bequest_condition: "One ally spirit is directed to use alienation power on him for seven weeks."}
  - {recipient: "Stefan Rubloff", bequest_condition: "One ally spirit is directed to maintain a constant telepathic link for one year and a day, provide any permitted assistance he requires, and issue position/event updates every 20 minutes."}
  - {recipient: "Enrico Hernandez", bequest: "Pictures in Dunkelzahn's safe-deposit box at the Glendale branch of Angeles Fidelity Bank."}
  - {recipient: "First party to track down the Russian crown jewels", bequest: "The treasure except the scepter and crown, which the Draco Foundation will return to descendants of their original owners."}
  - {recipient: "Gypsies of northern California", bequest: "Permanent ownership rights to specified California holdings", condition: "Appear at Shasta Dam on 21 June 2058, where Hestaby will distribute the land rights."}
  - {recipient: "Abigail Ceccion", bequest: "One dozen red roses from the New Zealand horticultural complex delivered weekly for the rest of her natural life."}
  - {recipient: "People's University of the California Free State", bequest: "Access code to a Matrix location described by Dunkelzahn as useful."}
  - {recipient: "Lawrence Edward Grafton", bequest: "50,000 nuyen annually for as long as he remains in good standing in the source's stated condition."}
  - {recipient: "Parties the Draco Foundation agrees have achieved breakthroughs necessary to successful deep-space living and travel", bequest: "50,000,000 nuyen each for continuing research."}
  - {recipient: "Art Dankwalther", bequest: "34,586,224,739.58 UCAS dollars plus 1 percent interest per annum", purpose: "Settlement of a debt Dunkelzahn attributes to an ancestor and a borrowed gold piece."}
  - {recipient: "Josey Anne Miller", bequest: "The antidote labeled DDF2 stored in Dunkelzahn's office refrigerator at Gavilan Ventures."}
  - {recipient: "Bradley Smith", bequest: "A small token of esteem distributed by the Draco Foundation."}
  - {recipient: "Vlad Curcio", bequest: "Dunkelzahn's open-ended pass to Virtual World Disney."}
  - {recipient: "Ryumthausar", bequest: "Dunkelzahn's heart, located at his Lake Louise residence."}
  - {recipient: "Last Knight of the Crying Spire", bequest: "Armor worn by Richard the Lion-Hearted on Crusade and the sword Excalibur if found", condition: "Whoever finds Excalibur may deliver it to the Draco Foundation for a reward and title, after which it will be turned over to the knight."}
  - {recipient: "Draco Foundation annual innovation competitions", bequest: "Continuing Foundation program beginning February 2058", schedule: "Two competitions each year, the second roughly six months after the first", categories: "Magical innovation including Spell Design, Magical Theory, Magical Objects and Astral Exploration; technological innovation including Rigger Technology, Space Technology, Matrix Technology, Medical Technology and Cybernetics."}

