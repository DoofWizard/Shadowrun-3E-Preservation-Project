  - {recipient: "Arthur Vogel", bequest: "Dunkelzahn's seat on the board of Ares Macrotechnology", condition: "Read all reports he is entitled to and judge the corporation's actions with an open mind."}
  - {recipient: "Glenn Dudley", bequest: "A small token of esteem distributed by the Draco Foundation."}
  - {recipient: "Lady Brane Deigh", bequest: "A set of antique path cards."}
  - {recipient: "Toshiro Mitsuhama of Mitsuhama Computer Technologies", bequest: "An ancestral katana forged by Masamune."}
  - {recipient: "Upper Sandusky Magicians Society", bequest: "25,000,000 nuyen", condition: "Carry out a sequence of five ally-spirit service assignments supplied by the Draco Foundation, with summoners submitting to a post-summoning dose of laes administered by a Draco Foundation representative."}
