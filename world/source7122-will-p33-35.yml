  - {recipient: "Arleesh", bequest: "A statement of support and promise of Draco Foundation cooperation when needed."}
  - {recipient: "University of Cheyenne", bequest: "100,000 nuyen plus a detailed map of an archaeological site near Oraibi", condition: "Excavate with care."}
  - {recipient: "Thomas Nolan", bequest: "Dunkelzahn's home outside Vancouver and surrounding land."}
  - {recipient: "Alma", bequest: "An invitation to join the Draco Foundation and a personal message centered on hope and rejoining the world."}
  - {recipient: "Jan Petersen of Saeder-Krupp Aerospace", bequest: "Promissory notes for sums owed to Dunkelzahn by the vice president of Rrescha Corporation, a Shiawase subsidiary."}
  - {recipient: "Oliver McClure of Quebec City", bequest: "Dunkelzahn's voting stock in Aztechnology and the board seat attached to it."}
