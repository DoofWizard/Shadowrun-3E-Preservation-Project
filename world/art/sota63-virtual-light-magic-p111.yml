summary: 'Source-reviewed fictional in-world artscene hostzine report on virtual art in the matrix, its named galleries
  and artists, and separately attributed shadowland comments. From FanPro State of the Art: 2063 (Shadowrun Third
  Edition, FanPro10664, 2003), printed pp111/physical PDF pp112; narrator descriptions and named in-world opinions
  are distinguished.'
data:
  publication:
    title: 'State of the Art: 2063'
    publisher: FanPro
    publication_year: 2003
    catalog_number: FanPro10664
    source_id: source.fanpro-10664
    edition: Shadowrun Third Edition
    printed_pages: '111'
    physical_pdf_pages: '112'
    source_pdf_sha256: a49f6c0030ed18e8541a7d45ca2a263ada608e6a22689287a4d234caa471265a
    source_kind: Published fictional tabletop RPG setting reference
  section:
    title: Virtual Light and Magic
    chapter: Culture Shock
    byline: Juno McIvens
    in_world_outlet: ArtScene hostzine
    context: A fictional 2063 arts feature describing Matrix-only art; observations are attributed to its named
      feature writer.
  reported_virtual_art_history:
    medium: Art exists entirely within Matrix environments; artists use color, shade, code, and Matrix sculpt techniques
      to make exhibits.
    first_gallery_claim: The author identifies the Renraku Gallery in Los Angeles as the first venue for a wholly
      Matrix-based exhibition, presenting Valsav Smenko’s art earlier that past June.
    exhibition_title: Comet Dust Viruses
    subsequent_dispute: The feature reports that forged copies circulated and that Smenko sued the Richards Gallery
      for material damages. No judgment, liability finding or outcome is stated.
  featured_artist:
    name: Roberto Wauneka
    age_in_feature: 22
    tribal_identity_as_reported: Zuni
    political_community: Pueblo Corporate Council
    current_exhibition:
      title: Eagle and Coyote
      venue: Governor’s Gallery
      city: Santa Fe
      claim: The feature reports strong Matrix visitor attendance for this exhibition.
    quoted_artist_position: Wauneka describes his Matrix sculpt as no less secure than ordinary applications; he
      says application and language variation complicate breaking or reverse-engineering a sculpt.
    announced_exhibition:
      venue: Kachina Gallery
      street: Osuna Boulevard
      city: Albuquerque
      opens: May 14 (as printed)
      closes: July 25 (as printed)
      calendar_year: Not independently inferred from the feature date
  separate_named_shadowland_reactions:
  - speaker: Scag
    statement_class: personal reaction
    report: Responds with distaste to the virtual artwork; not a report of exhibition facts.
  - speaker: Rose Red
    statement_class: reply to Scag
    report: Responds that Scag could not become normal simply by trying.
  - speaker: Firebird
    statement_class: technical opinion
    report: Praises the quality of the code used for the artwork.
  - speaker: Hack Tech
    statement_class: personal technical review
    report: Claims to have tested examples and rates their technical merit 5.4 while declining to score artistic
      expression; the rating is this commenter’s view.
  coverage_limit: Only the separately titled art feature and four reactions on printed p111/PDF112. The adjacent
    ending of the Top Ten Trids and Sims and its other comments belong to an existing distinct record; no game mechanics
    are asserted.
framing: newsroom_neutral
