    "book_narrator_background": {
      "setting": "The first of three connected corporate-reprisal adventures, Double Take, takes place chiefly in Tír Tairngire, including a Universal Omnitech Portland facility, with initial runner recruitment in Seattle.",
      "political_conflict": "The adventure presents a power contest between Lofwyr and Aithne Oakforest, both involved in the Tír Tairngire Council of Princes; the dispute extends through their respective corporate interests, Saeder-Krupp and Telestrian Industries.",
      "sponsor_and_agent": "Aithne Oakforest, acting through his agent Count Evan Parris (Blackwing), directs a company woman from Telestrian Industries to recruit shadowrunners outside Tír Tairngire. Oakforest is described as having strong connections to the Telestrian family and a significant stockholding and influence within the corporation.",
      "commissioned_objective": "The runners are to gain access to Universal Omnitech's Portland research laboratory and its project data. The laboratory has made progress in gene mapping and research into genes purportedly responsible for magical aptitude, called the magus factor.",
      "bequest_reference": "The source connects this breakthrough with Dunkelzahn's bequest offering ten million nuyen for an explanation of the biological basis of magical ability.",
      "company_benefit": "The adventure says the obtained research data will go to Telestrian Industries to advance its own genetic research.",
      "deception": "Information designed to associate the runners with Saeder-Krupp will be leaked to the Tír media. In the intended corporate frame-up, the runners become fugitives and media attention is directed at Saeder-Krupp.",
      "intended_political_consequences": "The source's projected scandal increases pressure on Lofwyr and makes Oakforest appear comparatively conciliatory, while strengthening Telestrian's research position; these are planned outcomes, not immutable campaign history."
    },
    "named_character_background": {
      "name": "Moire Ferguson",
      "former_shadowrunner_alias": "Banshee",
      "employer": "Telestrian Industries",
      "history": "Moire previously worked as a shadowrunner in Seattle, then moved to Tír Tairngire drawn by its apparent commitment to elven society; over several years, she became disillusioned by prejudice, elitism and internal rivalries.",
      "coercive_pressure": "Count Parris selects Moire for the operation, knowing her earlier shadowrunning history and her changed attitude toward Tír society. The narrator says her unwillingness to risk her secure corporate position leads her to comply despite misgivings.",
      "recruitment": "Moire meets and hires the runners in Seattle, arranges travel to Portland and supporting contacts, and conceals her sponsors' full agenda from the players."
    },
