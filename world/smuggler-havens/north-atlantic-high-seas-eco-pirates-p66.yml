data:
  section: "Off the Deep End — High-Seas Eco-War"
  in_world_narrator: Mal-de-Mer
  source_review_context: "Fictional Shadowrun tabletop-RPG setting account in FASA Corporation's Target: Smuggler Havens (FASA7215, 1998), printed p66/PDF p67. The chapter narrator's descriptions are kept separate from in-world rumor and from optional GM rules."
  scope_and_comparison:
    printed_page: 66
    pdf_page: 67
    fact: >-
      The fictional narrator says the North Atlantic has a share of cinematic and unusual pirates, but fewer than the Caribbean League or West African coast, and that many of its pirates do not conform to stereotypical pirate imagery. This is a regional comparison, not a claim about all North Atlantic seafarers.
  eco_pirate_subset:
    printed_page: 66
    pdf_page: 67
    fact: >-
      The narrator characterizes many, not all, North Atlantic pirates as environmentally motivated groups targeting companies they regard as notorious polluters or despoilers, specifically AG Chemie Europa, Zeta-ImpChem, Saeder-Krupp, and Proteus. Their described motivation is to impose losses on selected companies rather than to plunder primarily for wealth or survival.
  proceeds_and_purpose:
    printed_page: 66
    pdf_page: 67
    fact: >-
      In the source's fictional account, goods that these eco-pirates seize and sell on shadow markets generally fund operating expenses and armaments, rather than serving as the group's ultimate objective. No tactical methods, equipment statistics, prices, or real-world instructions are provided by this record.
  source_commentary:
    printed_page: 66
    pdf_page: 67
    fact: >-
      Mal-de-Mer frames the discussion as a correction to prior Shadowland contributors' incomplete regional overview, naming Gangbanger Man and Cap'n Krupp among contributors whose earlier pirate discussion omitted the environmentalist faction.
  mechanics_review: "This narrated setting subsection provides no operative die rolls, target numbers, equipment tables, or rules modifications."
