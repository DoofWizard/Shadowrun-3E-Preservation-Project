data:
  heading: Running in Vladivostok — Local Color and Siberian Wilderness
  source_frame: Fictional Second Edition-era Shadowrun sourcebook narrator’s portrayals, stereotypes, and optional
    campaign material; not independently established facts about contemporary Russian/Korean/Chinese societies.
  east_meets_west: The narrator compares the fictional Vladivostok to a frontier “San Francisco of the East” with
    intermingled Russian, Korean, Chinese and Siberian communities, plus metahumans whom the narrator says fled
    racial persecution in Japan; it also describes contrasting neighborhoods, local intermediaries and technologies.
  contact_variation: The narrator contrasts some old-school Russian fixers who will meet in a bathhouse or a noon restaurant
    without concern for who might listen with some Korean fixers who prefer high-tech counter-surveillance
    and control details as small as hand movements. These are dated examples of specific fictional
    intermediaries; no method or trait is ascribed to every individual of any nationality.
  police_state: The fictional narrator portrays suspicion, informant networks and criminal arrangements in which some
    criminals share information with police in exchange for police turning away from their other activity.
    It identifies MVD as the federal police force and UGB as a covert intelligence agency. The text says
    Vladivostok is distant from Moscow, and MVD and UGB cannot keep close tabs on all local residents.
    These are descriptions of the invented setting, not instructions or general claims about real police.
  russian_inefficiency_as_book_claim: The source makes broad claims about bureaucratic inefficiency, bribery and
    shortages in the fictional setting; these are the dated book’s claims, not real-world universal characterizations.
  siberian_environment: The book depicts Siberia as expansive taiga forests, mountains and river plains, largely
    untamed in areas, rich in fictional magical natural resources. These setting descriptions are separate from
    the spirit-behavior rules.
  associated_illustration: A monochrome large scene with an animal-like creature and armed silhouettes occupies
    much of printed p98; no creature identity is established by a caption.
  concrete_local_color_examples:
    fixer_residences_and_equipment: The book narrator contrasts a fictional fixer living miles outside Vladivostok on a farm stocked with the latest Japanese cyberdecks and programs with another fixer in the city whose warehouse contains old Chinese, Russian and American tanks from past wars; these are individual examples, not universal national traits.
    adjacent_downtown_periods: The narrator says some downtown places resemble the modern districts of Europe, Seattle or Japan, but a move of only a few blocks can evoke the 1920s during the founding of the Soviet Republic.
  policing_tone_from_source:
    public_vs_covert: The fictional MVD is portrayed as a federal police force that openly uses its presence to intimidate would-be criminals; the UGB is separately described as a covert intelligence agency whose encounters should be secretive and duplicitous.
    limits_of_suspicion: The book expressly advises game masters not to overstate suspicion; Vladivostok lies far from Moscow, surrounded by hostile forces, and the local MVD and UGB have more urgent matters than keeping close tabs on every shadowrunner.
