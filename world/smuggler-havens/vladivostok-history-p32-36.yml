    "historical_background": [
      {
        "printed_page": 32,
        "account": "Vladivostok originated as a Russian military outpost in the nineteenth century under a border arrangement with imperial China, later becoming Russia’s leading Pacific port and a Pacific Fleet operating base."
      },
      {
        "printed_page": 32,
        "account": "Soviet authorities closed the port to foreign commerce in 1954; following the end of Soviet rule it reopened to foreign vessels and developed trade links with ports including Tacoma, Washington."
      },
      {
        "printed_pages": [
          32,
          33
        ],
        "account": "Raskolnikov describes the fictional Second Korean War as beginning after North–South antagonism and an assassination of South Korean President Rhee; South Korean General Yun moved against the North with Japanese-corporate support. The author describes the Korean War as a turning point for Japanese imperial nationalism and puts the rebirth of Imperial Japan in 2006."
      },
      {
        "printed_page": 33,
        "account": "During the Korean conflict, Russian forces at Vladivostok prepared for contingencies and sheltered North Korean communist refugees as the North collapsed; the source author describes mounting Japanese military mobilization."
      },
      {
        "printed_page": 33,
        "account": "The chapter depicts the Sovereign American Indian Movement’s 2009 seizure of a missile silo and launch of a Lone Eagle missile against Russia; Russian authorities prevented the attack from destroying its target, and General Secretary Chelenko then closed Vladivostok to foreign commerce."
      },
      {
        "printed_page": 34,
        "account": "The 2011 Awakening changed Russia, and a 2012 earthquake split off Kamchatka from the mainland, leaving a roughly 50-kilometer strait joining the Bering Sea and Sea of Okhotsk."
      },
      {
        "printed_page": 34,
        "account": "Raskolnikov reports that elves and dwarfs arrived and that a large part of the city underwent goblinization into orks and trolls; his estimate is one third of the city, a fictional narrator statistic rather than a verified census."
      },
      {
        "printed_pages": [
          34,
          35
        ],
        "account": "In 2022 after anti-metahuman unrest, goblinized residents in Vladivostok faced vigilante threats, followed by renewed VITAS mortality; Japan expelled metahuman residents toward the prison island Yomi, and some refugees instead came to Vladivostok. The narrator describes this displacement as contributing to a growing local metahuman population and the nickname anti-Yomi."
      },
      {
        "printed_page": 34,
        "account": "In 2017 Russia deployed troops against Trans-Polar Aleut tribes in the north over resource and listening-station disputes; Raskolnikov attributes the military reversal to indigenous magical resistance. He says Russia ceded its northern border areas to the new Trans-Polar Aleut nation in 2018."
      },
      {
        "printed_pages": [
          34,
          35
        ],
        "account": "In the early 2030s, Yakut’s Awakened forces declared independence from the Russian Republic and CIS, claiming lands east of the Ural Mountains; the chapter describes participation by Evenk and Ussuri peoples, metahumans previously in government service, and criminal groups."
      },
      {
        "printed_page": 35,
        "account": "Raskolnikov reports that the Russian Interior Army could not suppress Yakut forces, which he describes as aided by magic, Awakened creatures, supply disruptions, and sympathy inside Russian territory. Yakut forces gained Krasnoyarsk, Yamalia, Khantia-Mansia and further districts."
      },
      {
        "printed_pages": [
          35,
          36
        ],
        "account": "During the Euro Wars, Raskolnikov describes Russian campaigns in Poland and central Europe, including fighting around Poznan and Berlin, followed by withdrawal after the Nightwraith attack of January 2033 and new pressure in 2034 from Islamic militants. The fall of the Russian government bloc followed these combined crises; the Democratic Recovery Alliance and General Secretary Kropunin took control."
      },
      {
        "printed_page": 36,
        "account": "The Democratic Recovery Alliance reopened Vladivostok in 2035 to outside traders to revive the economy. Raskolnikov says recovery initially lagged because merchants and megacorporations remained reluctant to invest; the Alliance lost power to National Soviet Reconstructionists in 2037."
      }
