summary: 'Historical published-fiction reference from FASA Corporation’s Target: Smuggler
  Havens (FASA7215, 1998, Shadowrun Second Edition-era), printed pp.74-77/PDF pp.75-78.
  Reports the sourcebook’s underwater-city setting and security constraints without
