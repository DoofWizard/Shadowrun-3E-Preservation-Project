data:
  section: Underwater Security, by Undertow
  context: The fictional source describes aquatic corporate cities/bases (aquacologies),
    with construction and upkeep described as costing millions and sometimes billions
    of nuyen. These are in-world premises, not real-world advice.
  source_period_assertions:
  - printed_pages: 74-75
    topic: environmental tradeoffs
    detail: Underwater installations face substantial limitations for familiar surface
      surveillance and require different security measures; source narrator distinguishes
      system design from the claims made by forum participants.
  - printed_pages: 75-76
    topic: security patrol arrangements
    detail: The narrator says there are relatively few human underwater patrols; ordinary
      scuba immersion, decompression requirements, and the price of minisubs constrain
      them. Security divers and armed minisubs are generally held in reserve until
      an alert rather than constantly patrolling.
  - printed_pages: 75-76
    topic: critter patrol arrangements
    detail: The narrator describes mixed results when aquacologies train Awakened
      sea creatures. Training is difficult, and the security teams generally do not
      combine trained sea creatures and divers; creatures may attack guards as well
      as intruders.
  - printed_pages: '76'
    topic: underwater drones
    detail: The narrator describes unmanned drones as a common alternative to human
      water patrols and presents their range as subject to fuel and signal-reception
      constraints. Cable-connected and signal-relayed designs are distinguished.
  - printed_pages: '76'
    topic: magical countermeasures
    detail: According to the book’s narrator, submersion does not inherently negate
      spellcasting; breathing equipment can interfere with spoken chants. Aquacologies
      employ magicians, spirits and astral projection for magical security. Water
      elementals and nature spirits are characterized as virtually invisible underwater.
  - printed_pages: '77'
    topic: airlocks and decompression
    detail: The chapter defines an airlock as a controlled transfer chamber between
      underwater conditions and breathable air, with decompression equipment returning
      pressure toward the normal atmosphere. A diving bell or submerged bay with trapped
      air still needs pressure-control access; occupants remain exposed to decompression
      hazards if at surrounding-water pressure.
  - printed_pages: '77'
    topic: restricted entries
    detail: The published game setting depicts airlock bulkheads as robust, access-restricted
      entry points; it presents alarms, locking and possible detentions as optional
      fictional encounters rather than proof of an actual event.
  - printed_pages: '77'
    topic: interior security
    detail: Narrator describes cramped living space, conventional patrols, cameras,
      motion detectors and laser sensors inside air-filled compartments, with short
      response times. The source says incendiaries, gas and smoke are ruled out because they jeopardize
      interior air supplies. Grenades and other heavy explosives are almost never used;
      APDS and explosive ammunition are rarely employed because of hull-breach,
      flooding and decompression risks. The named equipment examples are tasers,
      flashpaks, netguns, squirts and sliverguns.
  attribution_notes: Fictional eyewitness anecdotes and strategic opinions from named
    Shadowtalk commenters are stored independently in the attributed_claim record;
    narrator statements here do not establish those anecdotes as fact.
  mechanical_note: No dice tests, target numbers, weapon damage codes, ratings, price
    tables or SR3 conversions are specified in these printed-page subsections.
