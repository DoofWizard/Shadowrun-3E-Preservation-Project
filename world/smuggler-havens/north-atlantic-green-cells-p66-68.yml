data:
  source_review_context: 'Fictional Shadowrun tabletop source: FASA Corporation, Target:
    Smuggler Havens (FASA7215, 1998), historical Shadowrun Second Edition-era tabletop
    RPG sourcebook; source.fasa-7215, printed pp66-68/PDF pp67-69. In-world report
    by Mal-de-Mer; narrator text and named forum replies remain differentiated.'
  in_world_narrator: Mal-de-Mer
  historical_lineage:
  - pages: 66-67
    fact: The author links the fictional Green Cells to historic German radical environmentalism
      and anti-imperialist autonomous cells, referencing earlier German revolutionary,
      anarchist and left-wing groups including the Red Army Faction, Revolutionary
      Cells, and Rote Zora as historical antecedents rather than asserting the organizations
      are identical.
  - page: 67
    fact: >-
      The narrator describes the dissolution of anarchist Revolutionary Cells into affinity groups associated with the takeovers of Kronstadt in 2034 and Berlin in 2038. These networks also became a constituency for groups such as the Shockwave Riders and Klabauterbund; some members added environmental priorities and formed the fictional Green Cells. The history does not establish that all named groups were identical.
  - page: 67
    fact: The author says smaller environmental cells arose from networks and loose
      political affiliations, spreading from Barcelona to St. Petersburg; he expressly
      describes the Green Cells as a decentralized group of numerous autonomous cells,
      not a single centrally controlled organization.
  organization:
  - page: 67
    fact: Individual Green Cells comprise approximately ten to a hundred people, averaging
      in the low twenties. There is no formal central command, and even their own
      members do not know the exact number of cells.
  - page: 67
    fact: The narrator describes the group’s usual goal as imposing costs on corporations
      perceived as polluting through sabotage and property destruction, generally
      avoiding deaths where possible, but acknowledges that some members intentionally
      kill opponents.
  - page: 67
    fact: Green Cells operate in northern European waters, especially against AG Chemie
      Europa and Proteus, and often make use of relationships with maritime smugglers
      and pirates.
  internal_factions:
  - page: 67
    fact: The author reports an effort to centralize some cells in Schleswig-Holstein
      led by Eva Susinka, described as a mercurial Nordic blonde; she formed a Steering
      Committee, developed links with Russian submarine pirates and caused concern
      among less centralizing groups.
  - page: 68
    fact: >-
      The comparative GreenWar history on this page is explicitly supplied by the named Shadowtalk speaker Ecotope, not as a separate fact asserted by the chapter narrator. The companion attributed-claim record preserves Ecotope's distinction between GreenWar's centralized leadership, discriminatory ideas about overpopulation, internal toxic-shaman conflict and the Green Cells' social-ecology emphasis and cooperation with other movements.
  mechanics_review: The numbers ten to a hundred and low twenties describe fictional
    cell size; no rules procedures or game-stat block are printed here.
