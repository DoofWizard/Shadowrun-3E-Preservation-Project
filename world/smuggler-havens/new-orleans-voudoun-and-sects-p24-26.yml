{"id":"world.smuggler-havens.new-orleans-voudoun-and-sects-p24-26","record_type":"world","status":"ingested","source":"source.fasa-7215","printed_pages":"24-26","pdf_pages":"25-27","edition_scope":"Original FASA Corporation Shadowrun Target: Smuggler Havens (FASA7215, ©1998), historical Second Edition-era setting context; not a Shadowrun Third Edition conversion","content_class":["world_fact"],"data":{"source_voice":"Fictional Shadowland post introduced by Captain Chaos and credited to Doc Cane; the religious history, in-world supernatural events and city prevalence figures below are Doc Cane’s character account, not claims about real practitioners or an omniscient modern historical survey.","introduction":{"source":"Captain Chaos introduces Doc Cane as an experienced voudoun street runner in New Orleans, and says the report concerns magical culture and sects in the Sixth World.","posting_context":"Shadowland upload transmitted 02-14-59 at 01:35:04 EST.","magic_context":"Doc Cane calls the New Orleans French Quarter and nearby bayous unusually active with magical practitioners, spirits and magical dangers."},"religious_practices":{"history_as_told":"Doc Cane traces the tradition to West African beliefs carried by enslaved Africans after the Atlantic slave trade began circa 1510; enslaved people were forbidden to practice ancestral faiths openly and blended invocations of spirits with Catholic saints and ceremonies. The post describes syncretism shaped by forced displacement and coercion, not voluntary migration.","beliefs_in_account":"Doc Cane describes a supreme deity, an array of intermediary loa, ancestral spirits, offerings and preferred symbolic associations such as colors, days and foods; loa are said to manifest in natural phenomena, places and temporary possession.","practitioner_categories":"Doc Cane distinguishes nonmagical devotees from houngans and mambos with the Talent. He estimates about 20 percent of the fictional city follows voudoun, then gives an approximate figure of 2 percent for Talent among the adherents discussed; the source does not provide a census or mechanical population table. These are Doc Cane’s character estimates, not real demographic statistics.","public_and_private":"Traditional community religious practice is not equated with malevolent magical sects; Doc Cane specifically notes that most adherents are harmless ordinary people."},"named_groups":[{"name":"Le Tour Rouge (Red Tower)","category":"secretive magical sect","description":"Doc Cane describes the group as keeping its meetings hidden and unlike the Midnight Dancers, which perform public tourist shows."},{"name":"Gens des Etoiles (People of the Stars)","category":"local magical sect","description":"One of several groups that Doc Cane says guard ritual knowledge."},{"name":"Bizangoes","category":"local magical sect","description":"Listed alongside Red Tower, Gens des Etoiles and Midnight Dancers."},{"name":"Midnight Dancers","category":"voudoun-oriented magical group","description":"Doc Cane describes members staging public native dances and genuine-looking ritual shows for tourists while meeting privately for serious magical practice."},{"name":"Red Sects","category":"source-described dangerous magical factions","description":"Doc Cane describes some sects as practicing Petro voudoun and ritual harm or sacrifice for power, motivated by histories of persecution and revenge; it does not portray all Petro practitioners or all voudoun worshippers as Red Sect members."}],"fictional_social_context":"Doc Cane describes voudoun as important among marginalized metahuman communities, with some krewes organized around it. The account separately mentions tourist talisman retailers and legitimate magical-supply shops; neither makes general religious practice criminal.","mechanics_review":"Pages 24–26 provide setting narration and magical lore; they do not specify a spell formula, ritual test, target number, numeric game effect, Availability code, initiation requirement or price list."},"headline":"Fictional new orleans voudoun traditions, sects and doc cane’s in-world cultural account — FASA Corporation, Target: Smuggler Havens (FASA7215, ©1998), fictional Shadowrun tabletop RPG, Second Edition-era historical setting; printed pp24-26/PDF25-27","summary":"Source-reviewed fictional New Orleans voudoun traditions, sects and Doc Cane’s in-world cultural account from FASA Corporation, Target: Smuggler Havens (FASA7215, ©1998), fictional Shadowrun tabletop RPG, Second Edition-era historical setting, source.fasa-7215, printed pp24-26/PDF25-27. In-world narrators and named commenters retain their own levels of certainty; there is no implied Third Edition mechanics conversion.","framing":"newsroom_neutral"}
