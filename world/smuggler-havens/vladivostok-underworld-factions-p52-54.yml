data:
  source_context: 'Underworld survey credited to Kosak in FASA Corporation, Target:
    Smuggler Havens (FASA7215, copyright 1998), historical Shadowrun Second Edition-era
    tabletop sourcebook, printed pp52–54. The book describes the invented Vladivostok
    setting; named forum contributors make separate claims recorded in the companion
    Shadowtalk record.'
  vory_v_zakone:
  - printed_page: 52
    fact: Kosak depicts the Vory v Zakone (Russian mob) as dominant in Vladivostok
      after Soviet dissolution; numerous syndicates exist, with most answering, in
      some fashion, to the Byelmodin, Kovalenka, or Yunggart factions. The Vory dominate
      local markets including gambling, prostitution and extortion.
  - printed_page: 52
    fact: Sergei Byelmodin, 62, is the most powerful of the tzar faction leaders.
      Kosak says he returned from Moscow to Vladivostok in 2048 to reunite the Vory
      after an internal struggle. He rebuilt control of markets previously seized
      by Seoulpa Rings and Triads during the 2046–2048 conflict.
  - printed_page: 52
    fact: Byelmodin has temporarily pursued a truce with the Seoulpa Rings and Triads
      because of renewed Yakuza interest in Vladivostok. His previous priority had
      been recovering lost territory from those two groups.
  - printed_page: 52
    fact: Otsana Kovalenka is described as the youngest of the Vory faction tzarinas,
      age 36. Her Russian naval officer father was killed fighting Siberians. She
      rose as an enforcer for Sergei Byelmodin and succeeded Vasily Korodov, killed
      in a Triad ambush three years before the source account.
  - printed_page: 52
    fact: Kosak describes Kovalenka as strongly Russian-nationalist, hostile to foreign
      syndicates (particularly Asians), and nicknamed Bloody Otsana for violent campaigns
      against the Rings and Triads. It says she survived five Rings assassination
      attempts, three after becoming tzarina in 2056.
  - printed_page: 52
    fact: Brugar Yunggart, an Udege, is the sole non-Muscovite Vory tzar among the
      three primary factions. His faction profits from smuggling bootleg weapons to
      Siberians and rare Siberian telesma into Vladivostok markets.
  seoulpa_rings:
  - printed_pages: 52-53
    fact: Kosak ranks the Seoulpa Rings second behind the Vory in Vladivostok. Korean
      refugee communities established their foothold in the opening years of the twenty-first
      century, particularly around Amurskiy Bay and northern slums; following the
      Vory split in 2046, they expanded toward the south.
  - printed_page: 53
    fact: Seoulpa activities focus on high-technology crime, including computer hacking,
      BTL trafficking and credit fraud. They also have contacts and operations in
      clandestine information brokerage, which the Vory had been less proficient at
      managing.
  - printed_pages: 53-54
    fact: Kosak notes rumors that a Vladivostok Ring has considered bringing the remnants
      of Beppu Data Haven to Vladivostok. Korean-linked pirate crews also raid Japanese
      merchants and have interfered with smuggler traffic; some have arranged obstruction
      of independent maritime operators.
  triads:
  - printed_page: 54
    fact: The Triads established a Vladivostok foothold during the Vory mob war of
      2046–2048 and operate largely around Golden Horn Bay and the East Bosfor Strait.
      Kosak calls them the third most powerful local group, or second weakest depending
      on the comparison.
  - printed_page: 54
    fact: Although weaker overall than the Vory and Seoulpa Rings, the Triads are
      especially influential as dealers and middlemen for magical contraband and telesma
      between inland Siberian and Manchurian smugglers and overseas destinations including
      Seattle and Japan. They have attempted to expand into weapons and electronics
      markets.
  yakuza_and_kawaru_gumi:
  - printed_page: 54
    fact: Kosak describes the Japanese Yakuza as weakest among Vladivostok syndicates.
      They had limited presence historically and now seek to return while the Vory,
      Triads and Rings resist their entry. The narrative describes rumors that the
      Vory have received MVD information on Yakuza movements; this is not presented
      as proven.
  - printed_page: 54
    fact: A distinct Yakuza-associated group called the kawaru-gumi is said to operate
      around Khasan coast lowtown slums. It includes resident metahumans and Japanese
      or non-Japanese recruits associated with changed Yakuza traditions. Members
      provide local municipal services in underserved districts and maintain a low
      profile to avoid provoking the Vory.
  rules_review: Printed pp52–54/PDF53–55 contain no dice tests, target numbers, game-stat
    blocks, prices, Availability codes, equipment specifications or executable game
    procedures; the underworld information is fictional world context.
