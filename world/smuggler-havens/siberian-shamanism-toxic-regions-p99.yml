data:
  section: Game Information — Rudnaya Pristan and Siberian Shamanism
  fictional_narrator_frame: FASA Corporation game-world narrator facts, with rumored totem practitioners
    explicitly presented as rumors.
  rudnaya_pristan:
    location: Harbor near Dalnegorsk; the source identifies runoff from boron and bauxite strip
      mines from nearby Dalnegorsk.
    classification: Toxic domain (fictional Shadowrun magical setting).
    consequences:
    - Toxic spirits drawn to harbor area
    - Several mutated paracritters living near area.
    edition_rules_reference: California Free State sourcebook pp147–149 for mutated and toxic
      creatures; no rules conversion made.
  siberian_shamanism:
    common_practice: Siberian magicians generally practice shamanism and source compares it with
      Native American shamanic practices.
    shaman_term: Source claims the English term shaman is derived from Siberian saman, designating
      holy men; presented as the book narrator’s assertion, not an independently verified real-world
      etymology.
    typical_totems:
    - Bear (sometimes Polar Bear)
    - Raven
    - Spider
    - Reindeer (same as Stag)
    - Horse
    - Tiger (same as Puma)
    - Wolf
    rumored_unusual_totems:
    - Elk
    - Fox
    - Fenrir
    - Polecat
    - Wolverine
    rumor_qualifier: Source describes these latter groups as abundant rumors rather than confirmed
      practitioners.
  historical_lineage: Shadowrun historical Second Edition-era setting; fiction preserved as published.
  source_pages: FASA7215 printed p99/PDF100.
framing: newsroom_neutral
