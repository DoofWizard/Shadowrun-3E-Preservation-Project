id: world.smuggler-havens.new-orleans-city-commerce-communities-p7-13
record_type: world
status: ingested
source: source.fasa-7215
printed_pages: 7-13
pdf_pages: 8-14
edition_scope: FASA Shadowrun fictional setting, 1998 publication; historical narrative
  only, no inferred SR3 mechanic
content_class:
- world_fact
headline: 'Fictional Shadowrun New Orleans setting — FASA Corporation, Target: Smuggler
  Havens (FASA7215, 1998), printed pp7–13/PDF8–14'
summary: 'Reference record for the New Orleans introductory setting, city history,
  business activity and communities as depicted by a fictional in-world New Orleans
  narrator in FASA Corporation''s Target: Smuggler Havens (FASA7215, 1998; source.fasa-7215),
  printed pp7–13/PDF8–14. Source-period narration and corporate self-descriptions
  are not independent real-world claims or Third Edition rules.'
data:
  narratorial_frame:
    primary_city_guide: Toshi Akimura is introduced by Captain Chaos as a New Orleans-based
      local contact; the subsequent city narrative reflects that in-world perspective.
    opening_illustration_p7: Printed p7/PDF8 contains a framed night-dock illustration with a hat-wearing figure, cargo and a ship; the separate full-page gothic city montage is printed p9/PDF10. Neither image supplies game statistics.
  regional_position:
    printed_pages: 7-8
    polity: The Confederate American States (CAS).
    geography: A Mississippi River port with access to Lake Pontchartrain, the Gulf
      coast and the Caribbean.
    trade_connections:
    - Caribbean League
    - Aztlan
    - UCAS
    - Native American Nations
    significance: The narrator portrays the city as a central market for both licensed
      and illicit goods, and as a cultural center rather than a corporate-headquarters
      city.
  city_history_as_narrated:
    printed_pages: 8-10
    milestones:
    - '1718: early French settlement on the Mississippi, according to the in-world
      historical account.'
    - '1801: return to French control, followed by the Louisiana Purchase two years
      later.'
    - '1815: Battle of New Orleans is mentioned as a remembered local event.'
    - 'Nineteenth century: prominence as a port followed by diminished commercial
      importance as rail transport and national economic patterns changed.'
    - 'Twentieth century: tourism, jazz and Mardi Gras, followed by petrochemical
      and oil business, then later challenges and recovery.'
    - '2034: New Orleans backed formation of the CAS and sought to become its capital; Atlanta prevailed. The narrator describes continuing local cultural pride alongside disappointment at this outcome.'
    interpretive_caveat: This is the game's in-world narrator's compressed historical
      account; its contemporary-world and alternate-history assertions are not independently
      fact-checked real-world history.
    historical_enslavement_segregation: Toshi Akimura’s account on printed p8 says
      French colonists imported enslaved Africans in the 1720s, forcing their labor
      within the colonial economy. After the Louisiana Purchase, the narrator says
      entrenched local Creole residents excluded newly arriving American settlers
      from the French Quarter and restricted them to districts that became the Central
      Business District and Garden District. These were separate systems of coercion
      and exclusion; the passage does not establish that the latter restrictions were
      imposed on free Black residents.
    colonial_conflict_and_migration: The fictional city guide describes French-Spanish
      colonial rivalry, the 1815 battle, subsequent immigrant groups, and a late-nineteenth-century
      Mafia presence following Sicilian immigration.
  modern_enterprise:
    printed_pages: 10-11
    economic_profile: Industry described as chiefly petroleum, natural gas, petrochemicals,
      biotech and biotechnological investigation of Awakened coastal ecosystems, alongside
      music and entertainment.
    named_petroleum_and_gas_businesses:
    - United Oil
    - Gulfstar
    - Shiawase Petrochemical
    - Geatronics
    named_biotech_businesses:
    - Cross Biomedical
    - Biogene Technologies
    - Envirotech
    - Universal Omnitech
    - SereTech
    - Phoenix Biotechnologies
    international_ownership_context: The narrator says larger megacorporations often
      oversee local operations from other cities and highlights the New Orleans businesses
      as regionally based.
    Gulfstar:
      president_ceo: Jacob Keene
      source_activity: Petrochemicals and high-performance fuel research.
      associated_venture: Gulfstar’s Delta Queen riverboats are presented as offering
        dinner-and-jazz cruises. The in-world narrator further alleges gambling, occasional
        brothel operations disguised as private parties, and river smuggling. The
        narrator says Jacob Keene transports Mafia goods under an arrangement with
        Dona Miriam Kozlowski and receives a share of gambling proceeds, while refusing
        to speculate whether their relationship goes beyond business. These are source-attributed
        fictional allegations, not independent real-world company facts.
    Cross_Biomedical:
      new_orleans_office_head: Rick Leland
      parent_company: Cross Applied Technologies
      head_office: Boston
      activity: Biotechnological research and bioware/pharmaceutical investigation;
        New Orleans field collection in local wetlands.
      local_research_context: The book says field expeditions seek Awakened biological
        specimens or byproducts to study and potentially commercialize.
      boston_management_and_autonomy_as_narrated: On printed p11, the fictional
        narrator identifies Sandra Wright as managing Cross Applied Technologies'
        Boston operations and claims she gives local division head Rick Leland
        extensive autonomy despite personal tensions, conditional on productivity
        and avoiding adverse publicity. Leland is depicted as pursuing a major
        biotechnology discovery; this is Akimura's account, not independent
        confirmation of the corporation's internal decisions.
      expedition_risk_as_narrated: Toshi Akimura says Cross survey boats have
        disappeared in the local swamps and recalls people who joined Cross
        expeditions and did not survive; he supplies no verified casualty count
        or cause of the reported losses. His brother operates daylight bayou
        tours, according to the same in-world narrator.
    Blue_Dog_Tunes:
      president_ceo: Mariah O'Mara
      activity: Local music recording and artist discovery, discussed as a small independent
        company in the fictional source.
      source_attribution: Descriptions of founder career and personal reputation appear
        in Toshi Akimura's local account; not independently established character
        biographies.
      earlier_shadow_work_as_narrated: The fictional narrator claims Mariah O'Mara
        had worked in the shadows before operating Blue Dog Tunes legitimately,
        knows many local performers, and maintains links to the French Quarter's
        live-music scene. This is the source-period character account, not an
        independently established real-world biography.
    organized_crime_and_illicit_trade: The narrator calls New Orleans a hub for smuggling
      and vice, with an entrenched Mafia presence. It describes contraband movements
      from the Caribbean League and Aztlan, other goods from Native American territories
      via river routes, and illicit arms deliveries toward the Yucatán; these are
      source-period fictional setting assertions, not instructions or present-day
      reporting.
  communities:
    printed_pages: 12-13
    local_groups:
    - Cajun residents
    - Creole communities
    - Native American communities
    - French- and Spanish-speaking residents
    - other immigrant and local populations
    cultural_note: The in-world narrator emphasizes distinctions within Cajun and
      Creole cultures and cautions against stereotyping; the terminology, histories
      and opinions are source-period in-world statements.
    legal_setting_as_narrated: The narrator notes Louisiana civil-law traditions and
      the state's parish nomenclature; no game court-resolution mechanics are supplied
      here.
    wetland_work: Bayou boat crews, guides, repair workers and supply networks are
      depicted as important local community roles.
    cajun_displacement_as_narrated: The p12 in-world account describes Acadians expelled
      from Nova Scotia in 1755 by the British military, with some seeking refuge in
      Louisiana and developing Cajun communities; their removal is a coercive historical
      displacement, not an elective cultural exchange.
    free_black_landowners_as_narrated: The p12 narrator says some free Black residents
      held substantial land prior to the Civil War, while enslaved people and their
      descendants had other, unequal legal and social experiences; this account does
      not conflate free Black property ownership with enslavement.
  quantitative_mechanics: No printed target-number table, dice test, damage code,
    weapon statistic, availability rating or gear price is given for this range.
