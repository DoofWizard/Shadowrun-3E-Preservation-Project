data:
  original_section: Special Rules for Low-Altitude Vehicles (LAVs) — descriptive military background preceding
    the rules
  source_voice: The 1998 sourcebook narrator describes imagined vehicles and fictional military employment;
    these are in-universe claims, not real-world air-combat guidance or game statistics.
  vehicle_identity:
    formal_category: low-altitude vehicle (LAV)
    informal_names:
    - thunderbird
    - t-bird
    depicted_propulsion: Directed thrust jets rather than conventional aerodynamic-wing lift; the narrator
      contrasts LAV mobility and armor with ordinary aircraft.
  narrated_military_roles:
  - forward screening
  - economy-of-force missions
  - breakthrough-exploitation missions
  - short-range close-air support
  narrated_armor_and_engagement_claims:
    armor_capacity: The narrator says LAVs can carry heavier armor than ordinary aircraft and describes this
      armor as protective against much of the damage caused by most anti-aircraft guns and surface-to-air
      missiles.
    qualification: The text explicitly denies total protection against antitank weapons.
    ground_based_weapon_comparison: The narrator says ground-based antitank weapons generally perform poorly
      against aircraft, especially a moderately fast-moving LAV.
    noted_vulnerability: The narrator singles out airborne antitank-attack helicopters equipped with antitank
      guided missiles as a major danger to the fictional t-bird.
  published_limits_and_rule_boundary: The same page separately establishes a 1,500-meter flight ceiling, VSTOL/VTOL
    and jetwash rules. Their exact numbers and test procedures are already recorded in rules/smuggler-havens/low-altitude-vehicles-special-rules-p106-107.yml;
    this world-fact entry does not revise or reissue them.
headline: 'FICTIONAL tabletop-RPG setting record — FASA Corporation, Target: Smuggler Havens (FASA7215, 1998,
  Second Edition era), printed p106/PDF107: narrated military background of thunderbird low-altitude vehicles'
summary: Third-person historical reference to the fictional Shadowrun sourcebook’s particular LAV military
  roles, qualified armor claims, and vulnerability to fictional antitank aircraft; exact tabletop vehicle
  procedures remain in the separate p106–107 rules record.
