data:
  section: Game Information — Running the Border, prose accompanying the fictional sensor and encounter 
    tables
  source_mode: Third-person reporting of the 1998 FASA fictional Shadowrun setting. Entries are in-world
    narrator descriptions and GM-facing options, not factual reports about present-day countries or 
    actual law enforcement.
  profiles:
    Algonkian-Manitou Council: The source describes patrols with nature spirits, watchers, four-person 
      units, and occasional shamans; relations with neighbors said to be good, making boundary 
      comparatively open.
    Athabaskan Council: Described as inheriting radar-net and listening posts, using drones and aerial 
      patrols plus ground and water patrols and occasionally paranormal animals; Tsimshian boundary 
      emphasized.
    Aztlan: The source describes dense fictional patrols of at least 20 well-armed and armored ground 
      troops, with paranormal animals and spirits; listed vehicles include Ferrari Appaloosas, Liebre 
      RPV drones, Tiburón patrol boats, Aguilar helicopters, Halcón attack aircraft, and Lobo LAVs.
    CAS: Described as using three-person patrol groups with trained attack dogs; fictional astral 
      coverage weak or absent; vehicles include Hawker-Siddeley Skytrucks, Surfstar Seacops, and 
      Banshees; Aztlan boundary is semi-mobilized.
    California Free State: The source describes its fictional military as disorganized except along the 
      Tir Tairngire and Aztlan boundaries; Imperial Japanese marine forces based in San Francisco are 
      prepared for unauthorized activity, especially seaborne intrusions, using a military response.
    Pueblo: The source describes sending a stealth drone to investigate disturbances and tailoring 
      fictional response units to apparent threat; all borders said to be heavily patrolled.
    Quebec: The fictional source describes two-person patrols in Patrol One and aerial Yellowjacket 
      patrols; listed equipment includes modified CyberSpace Designs Wolfhound drone, Appaloosas, GMC 
      Riverines, and Lone Star SWAT Hovertrucks.
    Salish-Shidhe: Typical four-person squads in light scout vehicle, with Salish Rangers in emergencies
      using Citymasters, Appaloosas and Hughes Stallions; Rangers usually include a mage or shaman.
    Sioux Nation: Patrols described as similar to Salish-Shidhe, using Sikorsky-Bell Red Ranger scout 
      ACVs and microskimmer drones.
    Tir Tairngire: The fictional narrator describes unusually stealthy and magic-intensive border 
      patrols, typically four or six lightly but efficiently armed personnel, employing spirits and 
      detection magic, with scout LAV support in emergencies.
    Tsimshian: Described as small three-person units with light scout vehicles, weak air cover.
    UCAS: Patrols described with GMC Banshees, Northrop Yellowjacket minichoppers, and trained attack 
      dogs.
    Ute: The narrator describes scarce conventional patrols, supplemented by road checks and traffic 
      stops in the fiction.
  fictional_response_discretion: The source says GMs may vary patrol composition and intercept forces 
    according to player actions and campaign needs. These are described patrol ideas, not universal or 
    mandatory mechanical values.
  mechanics_separation: Numeric sensor, electronic-warfare and encounter mechanics are preserved 
    separately under rule content class for pp108–110.
  standard_patrol_versus_interception_team: The Unauthorized Border Crossing Table gives Threat and 
    Professional Ratings for standard border guards. The book separately says dispatched interception 
    teams are generally more heavily equipped than routine patrols; actual composition depends on the 
    vehicle encountered and the in-world response so far.
