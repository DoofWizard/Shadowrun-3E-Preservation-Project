data:
  source_context: 'In-world survey Ports of Call, in FASA Corporation, Target: Smuggler
    Havens (FASA7215, copyright 1998), historical Shadowrun Second Edition-era tabletop
    sourcebook, printed pp59–61/PDF60–62. Describes fictional era Korean maritime
    sites; the source narrator’s regional statements are distinct from named forum
    posters whose claims are recorded separately.'
  japanese_islands:
  - printed_page: 59
    fact: The in-world author portrays Japanese corporations as using Korean and Chinese
      freelance runners or pirates for deniable action against rival underwater sites,
      while portraying Korean and Chinese crews as aware of that corporate arrangement.
  pusan:
  - printed_page: 60
    fact: Pusan is described as Korea’s largest port and its second industrial/commercial
      center after Seoul, with headquarters of several Korean corporations and important
      Korean naval and air forces based nearby.
  - printed_page: 60
    fact: Korean maritime crews are said to base around Koje, Tolsan and Kumo islands,
      and sometimes use Cheju, approximately 150 kilometers southeast of Korea, for
      activity in the East China Sea. Korean crews sometimes meet corporate intermediaries
      in Pusan harbor.
  - printed_page: 60
    fact: Eastern Tiger, described as Korea’s largest corporation, is headquartered
      in Pusan and has an underwater research project near Cheju. The source reports
      a reward offered by Eastern Tiger contacts for information or agricultural/biological
      samples from that project; this is a fictional-world plot detail, not real-world
      guidance.
  - printed_page: 60
    fact: The narrator remarks on the conspicuous presence of Imperial Japanese Navy
      ships in Pusan, linking them to Japanese imperial leverage and resentment among
      Korean residents rooted in historical experiences.
  wonsan:
  - printed_pages: 60-61
    fact: Wonsan is described as a port on Yonghung Bay badly damaged by the forced
      reunification of the two Koreas, with industrial collapse and unreconstructed
      districts after the war.
  - printed_page: 61
    fact: The in-world narrator describes Wonsan as a center of Korea’s criminal economy,
      with Seoulpa Rings and pirate groups such as the Kimchi Fleet and Red Sun Gang
      dominating local activities rather than the formal government.
  chongjin:
  - printed_page: 61
    fact: Ch’ongjin is identified as the northernmost of the Korean maritime pirate
      ports and as near Vladivostok and Japanese-corporate undersea facilities. The
      source says Shiawase and Mitsuhama hire local maritime crews for corporate observation.
  - printed_page: 61
    fact: The fictional city lies roughly one hundred kilometers from the Manchurian
      border, serving as a market linked to Manchurian talisleggers, telesma and magical
      goods, as well as Korean electronics and manufactured goods.
  - printed_page: 61
    fact: The city has a diverse maritime trading population including people traveling
      from Vladivostok and Seattle; the narrator describes many independent smugglers
      and no one syndicate dominating its community.
  rules_review: Original printed pp59–61/PDF60–62 contain no mechanics, game dice,
    target numbers, damage codes, armor, cargo equipment statistics or procedural
    rules; numerical geography and history are world facts.
