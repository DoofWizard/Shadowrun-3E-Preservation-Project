data:
  source_review_context: 'Fictional Shadowrun tabletop source: FASA Corporation, Target:
    Smuggler Havens (FASA7215, 1998), historical Shadowrun Second Edition-era tabletop
    RPG sourcebook; source.fasa-7215, printed pp65-66/PDF pp66-67. In-world report
    by Mal-de-Mer; narrator text and named forum replies remain differentiated.'
  in_world_narrator: Mal-de-Mer
  ag_chemie_europa:
  - page: 65
    fact: >-
      The chapter describes AG Chemie Europa as formerly the largest chemical-manufacturing corporation in Europe. It says most of the corporation's North Atlantic petroleum fields lie outside the North Sea, farther north off Norway and Iceland, in the Norwegian Sea and North Cape region, tapped around the turn of the century.
  - page: 65
    fact: >-
      The narrator identifies AG Chemie's political influence in Frankfurt, the North German Federation and the German Alliance, and rivalry with Saeder-Krupp over a new plasteel polymer. The two firms had poached scientists from one another three times within two months. A separate named Shadowtalk post by Hermsgervørden, preserved in the companion attributed-claim record, makes the submarine-tanker and escort-submarine claims; these are not independently established by the narrator.
  zeta_impchem:
  - page: 65
    fact: Zeta-ImpChem is identified as a second-tier British-Swiss chemical corporation
      and AG Chemie’s principal rival, with offshore oil and gas platforms in shallower
      and more polluted waters.
  - page: 66
    fact: The corporations previously cooperated to dominate the chemicals market
      but have become hostile in competition. Zeta-ImpChem is reported to own a controlling
      share of one of AG Chemie’s three core companies; the narrator reports receiving
      allegations that ZIC arranged microchemistry field testing on AG Chemie personnel,
      with grave consequences, but the precise evidence is not independently documented.
  - page: 66
    fact: Their research interests include environmental toxicity, mutation, and paranormal
      effects, within the book’s fantasy setting.
  ifmu_geste:
  - page: 66
    fact: IFMU expands to Internationale Fahrzeug- und Maschinenbau-Union, translated
      in the book as International Vehicle and Machine Building Union, a consortium
      including Daimler-Benz and Messerschmidt-Kawasaki.
  - page: 66
    fact: GestE, IFMU’s technical-development division, supports Eastern European
      construction. After Proteus’s rise, IFMU-GestE partnered with the Estonian metals
      company Kopitsuu to develop an underwater Baltic mining venture targeting titanium,
      nickel, and cobalt nodules.
  mechanics_review: No operative target-number, weapon-stat, check, or equipment table
    in the covered North Atlantic corporation subsections.
