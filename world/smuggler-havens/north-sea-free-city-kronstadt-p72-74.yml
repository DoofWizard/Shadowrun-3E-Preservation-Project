data:
  source_context: 'Fictional Shadowrun tabletop RPG source from FASA Corporation,
    Target: Smuggler Havens (FASA7215, 1998), historical Second Edition-era; source.fasa-7215.
    Printed pp72-74/PDF pp73-75. Narrative assertions and named Shadowtalk posts are
    separate.'
  narrator: Mal-de-Mer, Free City of Kronstadt port profile
  history:
  - page: 72
    fact: After Siberia's 2030 revolt, Belarus and Ukrainian leaders joined resistance
      to Russian rule. Russia fought on western fronts through those territories into
      Poland while suffering famine and economic crisis.
  - page: 72
    fact: Kronstadt, on Kotlin Island by the Finnish Gulf near St. Petersburg, had
      long served as Russia's principal naval base. The Vory v Zakone used its port
      for clandestine freight before the crisis and had relationships with serving
      military personnel.
  - page: 72
    fact: With the Russian war effort collapsing and resources diverted against the
      Islamic Jihad in 2034, soldiers and sailors at Kronstadt mutinied in October
      2034. They took the base, commandeered naval vessels and blocked the channel
      to St. Petersburg; after unsuccessful attempts to retake it, Russian authorities
      conceded Kronstadt's independence.
  - page: 72
    fact: After the rebellion, tensions among military personnel, anarchists, syndicates,
      political factions and collectives produced internal conflict. Corporations
      were initially excluded, but Saeder-Krupp later gained a naval-yard presence
      through agreements.
  contemporary_setting:
  - page: 73
    fact: The fictional city has an emergency council for crises and otherwise a decentralized
      collection of competing and cooperative local groups, including some direct-democratic
      collectives; the chapter does not describe a single governing ruler.
  - page: 74
    fact: The port exchanges chips, electronics and vehicles inbound for arms, biotech
      and medtech outbound. Kronstadt offers refuge from Russian state persecution,
      attracting refugees, criminals fleeing prosecution, bounty hunters, Russian
      UGB intelligence agents and foreign and corporate agents.
  - page: 74
    fact: Vory v Zakone is the dominant major criminal faction under Tzar Otto Tepich,
      but independent gangs also exist. The Misfits are a group of metahuman political
      exiles and former mercenaries and perform self-described damage control by addressing paranormal
      hazards, confronting and expelling particularly disruptive residents, and levying
      occasional service taxes on visiting corporate representatives; NetWorkers are a self-organized collection
      of Matrix deckers and technicians maintaining city connectivity in exchange
      for resources.
  - page: 74
    fact: Saeder-Krupp is the only major corporate physical presence in Kronstadt
      and invested in restoring shipyards and local infrastructure, receiving use
      of a substantial military-materiel area and stationing a facility at the yards.
      The port also hosts pirates, environmentalist militants and a Roma family known
      as the Floating Roms, whose livelihood includes maritime raiding.
  mechanics_review: No tests, target numbers, damage codes, or gear/vehicle statistics
    are given in the selected Kronstadt narrative. The following Underwater Security
    section begins on printed p74 and is NOT included in this record.
