data:
  source_review_context: 'Fictional Shadowrun tabletop source: FASA Corporation, Target:
    Smuggler Havens (FASA7215, 1998), historical Shadowrun Second Edition-era tabletop
    RPG sourcebook; source.fasa-7215, printed pp68-69/PDF pp69-70. In-world report
    by Mal-de-Mer; narrator text and named forum replies remain differentiated.'
  in_world_narrator: Mal-de-Mer
  identity:
  - page: 68
    fact: The Klabauterbund takes its name from the Klabautermann, a German maritime
      fairy. The book describes a maritime environmentalist, anarchist and anti-high-technology
      network with artists, free-thinkers, and metahumans.
  - page: 68
    fact: The group publicly opposes megacorporations and advanced-technology dependency,
      operating in northern Germany, the Frisian regions of the United Netherlands,
      and southern Denmark. Its Hamburg headquarters claims more than 5,000 members;
      this is the organization’s own membership claim.
  - page: 68
    fact: The chapter says the group has relationships with Green Cells and North
      Sea pirates. It has sponsored pirate groups and publicly defended some piracy
      as resistance to corporate dominance; this is narrative description of fictional
      political conflict, not approval or advice.
  - page: 68
    fact: The narrator states that magical adepts, hermetic magicians and nature-focused
      practitioners are among its membership, and describes its belief that ship kobolds—spirits—may
      reclaim the oceans against metahuman misuse.
  mechanics_review: No magic spell, spirit-stat, weapon-stat, target number, or explicit
    role-playing rule is printed in these Klabauterbund pages.
