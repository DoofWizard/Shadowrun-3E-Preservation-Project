data:
  section: Getting In/Out
  scope: Game Information reference narrative about imaginary 2059 ports, travel networks
    and airports; not a real-world route instruction.
  new_orleans:
    waterways: The source describes the city as a river and ocean-transfer hub, with
      Caribbean Sea (Gulf of Mexico), Mississippi River and surrounding wetlands;
      these are in-universe traffic and trade contexts.
    fictional_road_links: The fictional account names CAS Interstate 10 from east
      and west, Interstates 55 and 59 from the north, and UCAS/CAS Highway 61 near
      the Mississippi; I-55 connects through St. Louis and Chicago, while I-59 leads
      northeast through Mississippi and Alabama toward Atlanta.
    airport: The source says New Orleans has an international airport but no suborbital
      service; it describes Atlanta and Dallas/Fort Worth as interchanges for suborbital
      passengers.
  vladivostok:
    port: International shipping at Golden Horn Bay connects the fictional port with
      Japan, Korea, the Chinese coast, and North American ports including Seattle,
      Vancouver, Anchorage and San Francisco; ferry traffic serves the city, Khasan
      Coast and adjoining bay/island regions.
    railroad: The Trans-Siberian Railroad terminates at Vladivostok; the text gives
      a 9,600-kilometer route from Moscow and approximately six days of near-continuous
      travel, with further rail links into Mongolia, Korea and northern China.
    airport: Vladivostok International Airport serves conventional and suborbital
      flights, not semiballistics or spaceplanes; cited daily direct flights connect
      Anchorage, Seattle and San Francisco, with regular Asian services.
    corporate_terminals: Yamatetsu and Federated Boeing maintain dedicated terminals;
      Federated Boeing plans a local air commuter service.
    local_road_network: The source characterizes regional highways as underdeveloped;
      it names a main road via Artyom branching toward nearby towns and north toward
      Khabarovsk.
    government_security: The book describes regular patrols by armed UGB Border Guards,
      sometimes with trained dogs; this is an in-universe security fact, not present-day
      law-enforcement guidance.
  boundary: New Orleans text begins on printed p92/PDF93 and continues above Vladivostok
    on that page. Vladivostok continues into the top left of printed p93/PDF94, ending
    before Cost of Living.
