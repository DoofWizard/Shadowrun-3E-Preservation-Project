data:
  context: Historical invented-world geography from the Vladivostok chapter of the
    Shadowrun tabletop RPG; the book narrator’s setting assertions are distinguished
    from Shadowtalk testimony recorded separately.
  petropavlovsk_kamchatskiy:
  - printed_page: 45
    claim: The narrator places Petropavlovsk-Kamchatskiy on the severed Kamchatka
      Peninsula as one of the remaining outposts of the fictional Russian Empire;
      the city served as a Cold War-era Soviet Pacific Fleet submarine base.
  - printed_page: 45
    claim: Russian surface naval forces are deployed near the Shelekhov Gulf, close
      to Kamchatka’s break from the continental mainland, where they have repelled
      attempted Siberian crossings. The narrator contrasts safer southern waters with
      submarine threats from the northern Sea of Okhotsk and describes fishing and
      resale routes toward Seattle.
  - printed_pages: 45-46
    claim: The narrator depicts limited industrial development alongside fishing,
      software piracy and a black market involving smugglers and pirates. Occasional
      free traders and traders from Southeast Asia are said to unload cargo there.
      The city is not subject to the closed-port policy used elsewhere, with the lack
      of money for port policing described as a major explanation.
  valley_of_geysers:
  - printed_page: 46
    claim: Dolina Geizerov, the Valley of Geysers, lies in a narrow ravine about 150–160
      km north of Petropavlovsk-Kamchatskiy. The Kamchatka Peninsula has more than
      200 volcanoes, more than several dozen active, and the book references the 2012 Kamchatka
      earthquake.
  - printed_page: 46
    claim: The canyon contains more than 200 geysers and hot springs; the narrator
      describes it as the second-largest geyser field in the world after Yellowstone,
      with mineral waters, geyser outflows, bright mineral pools and steam vents.
  - printed_page: 46
    claim: The narrator says the Geyser River flowing through the ravine has been
      recorded at temperatures as high as 27 degrees Celsius during the coldest winter.
  mechanics_review: Printed pp45–46/PDF46–47 are a fictional regional setting description
    without character statistics, target numbers, dice tests, modifiers, vehicle performance
    data, spell effects, availability ratings or game prices; supernatural rumors
    remain in the separately attributed record.
