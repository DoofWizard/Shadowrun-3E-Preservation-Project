data:
  source_context: 'Fictional Shadowrun tabletop RPG source from FASA Corporation,
    Target: Smuggler Havens (FASA7215, 1998), historical Second Edition-era; source.fasa-7215.
    Printed pp70-71/PDF pp71-72. Narrative assertions and named Shadowtalk posts are
    separate.'
  narrator: Mal-de-Mer, Off the Deep End; northern port profiles
  ports:
  - page: 70
    place: Aberdeen
    fact: At the Dee River mouth in the Scottish Wild Lands, Aberdeen appears an ordinary
      port, but the surrounding region has limited British or Scottish Parliamentary
      authority. Rival Scottish clans exert local influence; the MacRanald clan dominates
      Aberdeen business and politics.
  - page: 70
    place: Amsterdam
    fact: The United Netherlands city remains a European counterculture center.
      The narrator specifically names chips, pharmaceuticals, and other controlled
      substances shipped into Amsterdam from ports worldwide, and presents the city
      as a trading hub used by fictional smugglers distributing them to cities in
      Northern, Western and Central Europe.
  - page: 71
    place: Amsterdam
    fact: After the 2011 Great Flood and the bursting of the IJsselmeer Dam, much
      of northern and western Amsterdam remained inundated in 2059. Water-gangs contest
      northeastern Nieuwendam and Durgerdam; pirates gather east of the North Sea
      Canal, especially around Diemen, a largely houseboat and motorboat settlement.
  mechanics_review: These port descriptions provide no new numeric role-playing test,
    character stat line, legality code, or cost. In-world legal distinctions are recorded
    as narrative facts only.
