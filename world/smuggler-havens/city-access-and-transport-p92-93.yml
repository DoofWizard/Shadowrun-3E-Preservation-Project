data:
  heading: Getting In/Out
  reporting_frame: Geographic transportation and fictional in-world logistics as described by the sourcebook narrator,
    not real-world routing recommendations.
  new_orleans:
    water: Mississippi River and Gulf/Caribbean Sea access; large sea cargo vessels and smaller river barges through
      port facilities, with surrounding bayou/swamp terrain.
    roads:
    - name: CAS Interstate 10
      geography: East-west Caribbean Seaboard corridor; links Houston and northern Florida.
    - name: Interstate 55
      geography: Southward route from Chicago through St. Louis to New Orleans.
    - name: Interstate 59
      geography: Northeastern route through Mississippi and Alabama.
    - name: UCAS/CAS Highway 61
      geography: Runs alongside the Mississippi River between St. Louis and Baton Rouge; east bank south of St.
        Louis, west bank north of St. Louis.
    air: International airport receives conventional aircraft but no direct suborbital service; suborbital passengers
      arrive through Atlanta or Dallas/Fort Worth and transfer.
  vladivostok:
    water: Golden Horn Bay port with daily maritime traffic from Japan, Korea, and the Chinese coastal provinces;
      outlying routes include the Khassan Coast, islands, Amursky Bay and Peter the Great Bay.
    transoceanic: The narrator names Seattle, Vancouver, Anchorage and San Francisco as connected North American
      ports.
    rail: The Trans-Siberian Railway terminates here; Moscow departure is described as a 9,600-kilometre journey,
      six days of near-continuous travel and five time zones. Additional train connections lead toward Mongolia,
      Korea and northern China.
    air: Vladivostok International Airport handles conventional and suborbital aircraft, not semiballistics or
      spaceplanes. Named international connections include Anchorage, Seattle, San Francisco, Tokyo, Seoul, Beijing,
      Shanghai, Hong Kong and Taipei.
    security_setting: The sourcebook describes UGB Border Guards making regular armed patrols, sometimes with
      dogs, while local airport technology is comparatively limited.
    corporate_terminals: Yamatesu and Federated Boeing maintain dedicated airport terminals; Boeing expects local
      air-commuter service in the near future (a forecast, not an established operation).
    roads: Regional roads described as underdeveloped; one major highway goes from Vladivostok to Artyom and continues
      through smaller settlements toward Khabarovsk, with branches to Khassan Coast and Dalnegorsk.
