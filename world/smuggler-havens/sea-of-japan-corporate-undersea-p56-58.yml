data:
  source_context: 'Sea of Japan — Turn of the Tides, in-world report by Soju, FASA
    Corporation, Target: Smuggler Havens (FASA7215, copyright 1998), historical Shadowrun
    Second Edition-era tabletop sourcebook, printed pp56–58/PDF57–59. Printed p57/PDF58
    is a full-page illustration and contains no new rules or prose. The author’s claims
    and other posters’ allegations are distinguished.'
  corporate_background:
  - printed_page: 56
    fact: Soju describes recent conflict among Japanese megacorporations about undersea
      holdings. Tadamako Shibanokuji departed Yamatetsu’s chairmanship following a
      serious stroke, and his son Yuri assumed leadership.
  - printed_page: 56
    fact: Soju identifies Yuri as an ork and half-Russian, reports that Japan’s trade
      ministry obstructed Yamatetsu’s plans, and says Yuri worked with Buttercup to
      shift the corporation’s focus toward Vladivostok and the Pacific Rim.
  - printed_page: 56
    fact: Yamatetsu had been assembling a five-million-nuyen underwater-city competition
      project before the leadership shift; as its plans changed, other corporations
      competed over existing Sea of Japan underwater holdings.
  - printed_page: 56
    fact: Many undersea corporate sites are small installations staffed by approximately
      25–60 personnel on six-month rotations. Soju notes that they are not self-sustaining
      and rely on supply runs for food, materials and sometimes energy.
  yamatetsu:
  - printed_page: 56
    fact: Yamatetsu operates marine biological research sites and undersea farms growing
      fish, krill, shellfish, seaweed and other marine foods. Products go to Japanese
      food-processing facilities and domestic markets.
  - printed_pages: 56-58
    fact: Soju says food prices and shortages increased as Japan sanctioned Yamatetsu,
      while the corporation continued work on a consolidated Saotome AquaDomes underwater-community
      project intended to hold roughly 200 people; the project was approximately one-third
      built, with a small staff present.
  - printed_page: 58
    fact: Soju reports that Yamatetsu may be reconsidering the project or collaborating
      with another corporation following reports of a Wuxing freighter near the construction
      site; the implication remains speculative.
  - printed_page: 58
    fact: >-
      Soju reports hearing of a Wuxing freighter bringing supplies and personnel to
      Yamatetsu's partly completed Saotome AquaDomes project. He separately speculates
      that Yamatetsu might sell its involvement or that a larger Wuxing arrangement
      could exist; neither possible transaction is established in this report.
  shiawase:
  - printed_page: 58
    fact: Soju identifies Shiawase as a principal electrical supplier to the Japanese
      islands, operating offshore power stations using thermal geothermal energy and
      wave motion. He mentions plants near southwest Honshu, wave generators along
      the Tsugaru Strait, and offshore oil and gas wells north of Honshu.
  other_corporations:
  - printed_page: 56
    fact: Mitsuhama has comparatively few underwater bases in the Sea of Japan but
      many offshore artificial manufacturing or chemical-processing platforms. Renraku
      has several underwater facilities, although Soju says he cannot determine their
      precise purpose.
  rules_review: No exact ship, submarine, equipment or underwater travel statistics,
    target numbers, damage codes, dice checks or other mechanical procedures are printed
    on pp56–58/PDF57–59; quantitative staff, rotation and project sizes are fictional
    setting facts.
