data:
  context: A geographically labeled game-world sprawl map at printed p47 and in-world
    Polecat location guide extending through p48. The image is not reproduced; this
    record indexes its mapped names and the source narrator’s fictional period descriptions.
  map_labels:
    printed_page: 47
    bays_straits:
    - Amursky Bay
    - East Bosfor Strait
    - Peter the Great Bay
    - Zolotoy Rog Bay (Golden Horn Bay)
    districts_sites:
    - Northern Vladivostok (Slobodkas, Korean Enclaves)
    - Downtown Vladivostok
    - Khasan Coast (Sprawl, Slums)
    - Russky Island — Russian Pacific Fleet Base
    - Popov Island — Yamatesu Corporate Headquarters
    - Peschany Island — Pacific Fleet Supply Depot
    - Reineke Island
    - Rikorda Island
    streets:
    - Leniskaya Street (Entertainment District)
    - Krasnogo Znameni Avenue (Business District)
  locations:
  - printed_page: 47
    name: Golden Horn Bay (Zolotoy Rog Bay)
    claim: The central city and naval-port area lies on the bay, between hills and
      its eastern and southern shores. Polecat calls its layout and hill streets the
      San Francisco of the East and identifies the central port and adjoining downtown
      as relatively defensible.
  - printed_page: 47
    name: Central downtown
    claim: Leniskaya Street houses entertainment operations associated in the in-world
      guide with the Vory and Triad-operated talisman shops; the main business district
      is described on the eastern side of Golden Horn Bay, along Krasnogo Znameni
      Avenue.
  - printed_pages: 47-48
    name: Russky Island
    claim: Largest island of Amursky Bay and site of Russian Pacific Fleet headquarters
      and support facilities, including shipyards, port docks, supply depots, barracks
      and training fields; the p47 map also labels a Pacific Fleet supply depot on
      Peschany Island.
  - printed_page: 48
    name: Popov Island
    claim: A residence and political center for wealthy figures and the new headquarters
      of Yamatesu; the narrator places a Yamatesu executive complex on the western
      slopes overlooking Amursky Bay and says a UGB main office is rumored to be on
      the island. In-world Vory and Seoulpa figures are also said to live there.
  - printed_page: 48
    name: Northern Vladivostok
    claim: Northern coastal districts called slobodkas, populated in part by Korean
      refugees following warfare and by Korean and other metahuman immigrants. The
      narrator describes communities of ethnic Koreans and a variety of small manufacturing/distribution
      firms.
  - printed_page: 48
    name: Khasan Coast
    claim: Across Amursky Bay from the city core, formerly fishing settlements and
      later an expanding slum after foreign-trade growth and economic collapse. The
      guide describes informal purchasing and trade, marginalized residents, local
      crime and contested municipal control.
  mechanics_review: These location descriptions and map labels contain no location-specific
    dice pool, target number, price list, character combat statistic, rule modifier,
    or game-resolution procedure.
