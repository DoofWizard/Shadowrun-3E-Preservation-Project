data:
  source_context: 'Fictional Shadowrun tabletop RPG source from FASA Corporation,
    Target: Smuggler Havens (FASA7215, 1998), historical Second Edition-era; source.fasa-7215.
    Printed pp69-70/PDF pp70-71. Narrative assertions and named Shadowtalk posts are
    separate.'
  narrator: Mal-de-Mer, Off the Deep End in-world chapter
  pirates:
  - page: 69
    fact: The source distinguishes profit-seeking North Atlantic pirates from the
      Green Cells and Klabauterbund, which criticize profit-first piracy but sometimes
      cooperate under an enemy-of-my-enemy rationale. The narrator characterizes common
      raids as grab-and-go seizures near busy international trade, including German-to-UK
      routes.
  - page: 69
    fact: Many maritime jurisdictions and city-states, combined with valuable consumer
      and manufactured cargo, make the trade busy; the narrator describes both smuggling
      markets and favorable treatment from particular territories.
  - page: 69
    fact: Zhelyezniy Akula (Russian Iron Sharks) are rogue Russian submarine crews
      associated with the Kronstadt rebellion after the Euro-Wars in 2034. Several
      crews from the Baltic Sea and North Cape mutinied; one joined the Kronstadt
      Militia, others turned to piracy, and some combined for mutual protection in
      the late 2030s. Kronstadt remains their principal port and naval-yard base.
  - page: 69
    fact: Akula crews typically use small diesel-electric attack submarines, usually
      older Zhirinovsky-class hunter-killers. Recent reports identify some Vaneyev-class
      submarines, possibly acquired from third parties; the narrator explicitly reports
      no rogue Akula nuclear-submarine operations.
  - page: 70
    fact: The Midnight Marauders are a mostly Night One (dark elf) crew under the
      elven captain Morgana. They acquired a reputation after kidnapping Greta Hollister,
      wife of a General Genetics Worldwide division head (the company is an AG Chemie
      subsidiary), and successfully obtaining ransom. Their Hamburg association is
      identified as suspected rather than verified.
  mechanics_review: In the narrative paragraphs selected on printed pp69-70, no explicit
    game test, TN, damage line or equipment stat block is printed. Submarine model
    names are source facts, not invented vehicle statistics.
