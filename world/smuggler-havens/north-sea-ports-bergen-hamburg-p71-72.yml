  narrator: Mal-de-Mer; North Sea ports profile
  ports:
  - page: 71
    place: Bergen
    fact: Bergen is the largest Scandinavian city on the North Sea in the source,
      and an AG Chemie petroleum and gas hub serving the Norwegian Sea, North Cape,
      and Iceland-UK gap. Green Cells target AG Chemie tankers and refineries. Local
      fjords also shelter pirate activity.
  - page: 71
    place: Free City of Hamburg
    fact: Hamburg remains an independent city-state within the German Alliance. The
      2011 Great Flood destroyed nearly half the metropolitan area and left much of
      southern Hamburg marshland. Its flood-damaged geography earns it the source
      nickname Venice of the North.
  - page: 71
    place: Free City of Hamburg
    fact: German corporations rebuilt most city districts and exercise substantial
      control. Knight Errant holds most policing contracts, but waterfront areas remain
      outside firm governmental or corporate control. Pirate and environmentalist
      groups occupy half-flooded northern neighborhoods, including St. Pauli and St.
      Georg.
  mechanics_review: The named groups and flooding dates are setting facts; no independent
    tabletop numerical rule is given in these port-profile narrator passages.
