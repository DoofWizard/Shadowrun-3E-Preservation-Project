data:
  attribution: Toshi Akimura's fictional New Orleans city guide; market descriptions are in-world source-period narration, not independent real-world reporting.
  goods_and_not_so_goods:
    heading: THE GOODS (AND NOT-SO-GOODS)
    printed_page: 15
    narrator_context: The narrator portrays New Orleans as a transit market for varied lawful and unlawful consignments moving north and south, where value, risk and scarce cargo space affect the fictional smuggler's earnings. Toshi explicitly names vice, arms smuggling, organlegging and talislegging as active local illicit markets. These are separate in-world categories, not a single lawful trade. No equipment statistics, item prices, test target numbers or real-world transport instructions are printed in this introduction.
  vice_rackets:
    heading: VICE RACKETS
    printed_page: 15
    narrator_context: The guide depicts New Orleans as a profitable adult-entertainment and illicit-business center after Atlanta became the CAS capital, treating entertainment commerce and criminal rackets as distinct categories within the fictional city.
  transition_to_mafia:
    heading: The Crescent City Mafia
    printed_page: 15
    narrator_context: The narrator begins the organized-crime section by identifying the fictional New Orleans Mafia as a dominant participant in local profitable rackets; the source's leadership, succession, family and casino detail continues on pp16-18 and is separately recorded.
  game_mechanics: No printed dice test, target number, transport modifier, gear cost, Availability rating or other game-statistical mechanic is present in this p15 introductory prose.
