data:
  context: Historical fictional Russian naval force description in FASA Corporation’s
    1998 Shadowrun Second Edition-era setting. The source narrator’s depiction of
    force structure is not advice for contemporary real-world activity; attributed
    forum claims are separately recorded.
  pacific_fleet:
  - printed_page: 51
    account: The setting positions Vladivostok as a nucleus of Russia’s naval operations
      on the Sea of Japan, emphasizing Pacific Ocean trade routes and the adjacent
      Imperial Japanese Navy. The narrator says Russia seeks to protect sea lanes
      of communication and the Pacific Rim maritime trading interest.
  - printed_page: 51
    account: The narrator says the military is nominally controlled by the National
      Supreme Soviet but individual generals and admirals have ties to megacorporations
      including Saeder-Krupp and Korea’s Eastern Tiger, and to mercenary group MET
      2000.
  naval_infantry:
  - printed_page: 51
    account: The Pacific Fleet Naval Infantry is described as a division-sized amphibious
      ground-combat force of approximately ten thousand personnel, similar in mission
      and organization to American and Japanese marines; its historical inspiration
      in the book is Russia’s naval troops.
  - printed_page: 51
    account: The narrator lists medium tanks, amphibious wheeled armored personnel
      carriers, hovercraft and helicopters as typical equipment categories, and describes
      training for airborne and beach assault operations. It says the force lacks
      a dedicated air arm apart from a few attack helicopters, relying on fleet support
      for air cover.
  rules_review: No Naval Infantry personnel stat line, tactical map, weapon damage
    code, vehicle game stats, equipment costs, target numbers, modifiers, deployment
    ranges or operational sequence is printed in this passage.
