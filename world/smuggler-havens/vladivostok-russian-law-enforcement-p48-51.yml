data:
  source_context: Russian political-security institutions described by the fictional
    writer Petrov in the historical Shadowrun Vladivostok chapter, printed pp48–51.
    This record preserves his first-person account and distinguishes named forum replies
    elsewhere; it is not a description of real-world present-day Russia.
  national_supreme_soviet:
  - printed_page: 48
    account: Petrov identifies the National Supreme Soviet as Russia’s leadership
      body, populated by National Soviet Reconstructionists (NSR). He calls the NSR doctrine fascist in nature, combining rigid authoritarianism,
      nationalism, jingoism, state capitalism and hard-line old-school communism;
      ethnic, military, police and corporate factions compete for influence. Petrov explicitly
      identifies Yakutians, Japanese people and Jews as minority groups scapegoated
      by this fictional political movement.
  - printed_pages: 48-49
    account: General Secretary Korolenko is the nominal leader, but Petrov says his
      influence has diminished while military, police and UGB-connected figures assert
      greater autonomy. He describes corporate sponsorship, naming Saeder-Krupp and
      Zeta-ImpChem among companies cooperating to limit other megacorporate influence.
  - printed_page: 49
    account: Petrov describes the Supreme Soviet’s continued objective of rebuilding
      Russian territorial power, with restoration of Siberia among its ambitions and
      its anti-foreign policy complicated by corporate relationships.
  ugb:
  - printed_page: 49
    name: UGB, Upravleniye Gosudarstvennoy Bezopasnosti (Directorate of State Security)
    account: Petrov describes this fictional Russian security service as a later incarnation
      of the Soviet-era KGB and NKVD. It consolidated formerly separate security agencies
      during the NSR return to power.
  - printed_pages: 49-50
    account: In the source the UGB is responsible for internal and external intelligence,
      government security, border and coastline patrols and control of the mechanized
      Border Guard. Its declared missions include preventing unauthorized border crossings
      and suppressing ethnic/racial dissent; Petrov reports systematic communications
      surveillance and restricted procedures without furnishing playable surveillance
      mechanics.
  - printed_page: 49
    account: Petrov describes Rassily Romanov as the UGB prime director and the
      strongest leader, backed by Saeder-Krupp. He describes two competing leadership
      factions as proxies of Zeta Imperial Chemical Company and the Vory v Zakone,
      respectively, alongside another UGB faction that apparently avoids outside
      connections and has consolidated control of the UGB nuclear security department.
      His internal-faction account belongs to the fictional Shadowrun setting.
  mvd:
  - printed_page: 50
    name: MVD, Ministerstvo Vnutrennikh Del (Ministry of Internal Affairs)
    account: Petrov contrasts this visible federal law-enforcement and ordinary criminal-investigation
      organization with the UGB secret police; his criticism alleges police brutality,
      disregard for legal process, bribery, poor discipline and penetration by the
      Vory v Zakone. A named Shadowtalk poster disputes the breadth of his generalization.
  - printed_pages: 50-51
    name: Vnutrennie Voiska (Interior Army)
    account: Petrov describes the MVD’s internal military force as guarding installations,
      substations, prisons and gulags, suppressing civil unrest, and operating in
      conflict around Yakut. Its security responsibilities and institutional rivalry
      with the Red Army and UGB Border Guard are discussed, with the fiercest rivalry
      claims attributed to posts elsewhere.
  - printed_page: 51
    account: Petrov speculates that the Eastern Orthodox Church is an influential
      supporter of the MVD, points to the church’s social leverage and describes religious
      and ethnically motivated figures within the police. This is the fictional writer’s
      interpretation, not an independently established fact.
  rules_review: Printed pp48–51/PDF49–52 contain political faction and force-structure
    setting prose; no printed law-enforcement or personnel stat block, surveillance
    or combat target number, dice test, modifier, price, Availability, game legality
    code or scenario-resolution procedure is supplied here.
