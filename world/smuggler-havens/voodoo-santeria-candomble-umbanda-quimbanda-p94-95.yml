data:
  heading: Voodoo — Santeria — Candomble, Umbanda and Quimbanda
  historical_source_attribution: These are the fictional 1998 Shadowrun sourcebook’s descriptions and game-magic
    comparisons; they are not assertions of comprehensive real-world religious scholarship.
  voudoun:
    source_comparison: The book identifies its form of voudoun with the Haitian tradition as portrayed in Awakenings.
    new_orleans_setting: Fictional New Orleans mixes voudoun more freely with French and Spanish European magical
      practices and Native American local shamanic traditions.
    public_private: Local houngans practice somewhat more openly than in Haiti and the Caribbean League, while
      concealing sensitive magical work; the source ties related traditions to forced African migration to the
      New World.
  santeria:
    historical_narrative: The source describes enslaved Africans in Spanish-controlled areas combining African
      shamanic practices with the Catholicism of slaveholders; it draws a parallel to French colonies.
    terminology:
      name_origin: Spanish santo, saint
      venerated: Orishas, compared in the game to loas
      practitioners:
      - santeros
      - santeras
      liturgical_language: Yoruba
      community_house: casa, compared to a voudoun honfour
    locations_in_source: Caribbean, South America, and communities with substantial Hispanic populations.
  candomble:
    source_association: Brazilian forms related to voudoun and Santeria, using Portuguese-based names for Orishas
      rather than Spanish-based ones.
  umbanda:
    source_association: Similar Brazilian tradition, described by the book as having some Hindu and Buddhist influences.
  quimbanda:
    source_association: The book compares it to the Petro tradition (cites Awakenings p129), and characterizes
      it negatively as a path of bad magic; this is source-attributed language, not an objective judgment about
      living practices.
  fictional_game_abilities: The sourcebook instructs the game master to apply the same loa, possession and other
    voudoun magical rules from Awakenings printed pp120–131 to the listed related traditions; no new numerical
    conversion is specified.
