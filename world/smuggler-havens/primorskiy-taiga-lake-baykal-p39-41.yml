    "lake_baykal": [
      {
        "printed_page": 40,
        "claim": "Lake Baykal is introduced as approximately 1,000 kilometres northwest of Vladivostok, an inland freshwater lake of more than 31,000 square kilometres and roughly 1,600 metres in maximum depth. The narrator treats the lake as a critical boundary between the Russian-controlled south and the Siberian-controlled north."
      },
      {
        "printed_page": 40,
        "claim": "The Trans-Siberian line reaches Irkutsk near the southwest shore; the text describes a former holiday location transformed by military conflict, where soldiers now make up many of the visitors."
      },
      {
        "printed_page": 40,
        "claim": "The largest island, Olkhon, lies approximately 8 kilometres off the north shore. The source attributes to Buryat belief the legend that gods lived there, and describes the island as contested near military front lines."
      },
      {
        "printed_page": 40,
        "claim": "Awakened reindeer, humphed horses and woolly mammoths are discussed as distinctive wildlife around the lake; the narrator also mentions other local predators. Any claims that a species is a spirit or shifter are attributed to in-world participants."
      },
      {
        "printed_page": 41,
        "claim": "The Barguzin Mountains along the northeast shore reach approximately 2,800 metres according to the source and contain some volcanic hot-spring valleys; the narrator describes steep ridges and sparse settlement."
      }
    ],
    "local_communities": [
      {
        "printed_page": 41,
        "claim": "The text names Evenks and Buryats as the two major peoples of the Lake Baykal region; in the book’s fictional conflict, it says Evenks often side with Siberians while Buryats try to avoid the fighting."
      },
      {
        "printed_page": 41,
        "claim": "The Evenks are described as recovering after severe historical Soviet-era persecution and as having reindeer-herding and shamanic traditions; the narrator compares their cultural practices to Native American Plains traditions."
      },
      {
        "printed_page": 41,
        "claim": "The Buryats are described as a Mongolic people whose ancestors settled around the lake many centuries ago; the source describes Buddhist institutions and adaptation to semi-nomadic horse culture despite generations of enforced Russification."
      }
