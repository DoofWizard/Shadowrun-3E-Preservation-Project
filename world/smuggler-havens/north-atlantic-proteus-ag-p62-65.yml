data:
  source_review_context: 'Fictional Shadowrun tabletop source: FASA Corporation, Target:
    Smuggler Havens (FASA7215, 1998), historical Shadowrun Second Edition-era tabletop
    RPG sourcebook; source.fasa-7215, printed pp62-65/PDF pp63-66. In-world report
    by Mal-de-Mer; narrator text and named forum replies remain differentiated.'
  in_world_narrator: Mal-de-Mer
  regional_overview:
  - page: 62
    fact: The narrator frames the North Atlantic as a contested region involving undersea
      corporations, eco-activists and pirates; Proteus AG filed an award claim with
      the Draco Foundation for its North Sea arkoblocks.
  - page: 62
    fact: Proteus AG established its headquarters in 2057 on the flooded island of
      Helgoland in northern European waters; the offshore arcology blocks occupy flooded
      areas of north Germany and the Netherlands. The corporation also announced a
      space-launching arcology on Devil’s Island in French Guiana.
  - page: 62
    fact: Proteus applied for the Draco Foundation’s five-million-nuyen award for
      underwater cities; Aina DuPree and engineers inspected all five North Sea arkoblocks
      and DuPree ruled that none satisfied the Foundation’s requirements for full
      submersion and independent self-sufficiency.
  - page: 62
    fact: Proteus announced an intended ninth arcology offshore from Rømø Island,
      near the Germany–Denmark border, claiming it would be fully submerged and self-sufficient;
      construction was projected to begin by year-end with complete operation around
      2065. This is a planned future project, not a completed installation.
  corporate_history:
  - page: 63
    fact: Proteus was formally chartered in the German Alliance on the first day of
      2049. Rumors claimed its headquarters was being built under a shell company
      by January 2048; corporate patrons are suspected by the narrator but unproven.
  - page: 63
    fact: The narrator reports a large founding workforce and an apparently unexplained
      source of capital, and describes Proteus biotechnology and marine-biology work,
      while acknowledging a lack of publicly found research products or patents.
  - page: 63
    fact: Proteus received two Japanese offshore arcology contracts in 2050, in Osaka
      Bay and near Okinawa; both were completed in 2053, Okinawa in March and Osaka
      in August.
  - page: 63
    fact: Proteus was granted German extraterritorial status in 2051 under guidelines
      set by the German Constitutional Court in Karlsruhe. North Sea projects were
      commissioned in Emden, Groningen, Wilhelmshaven and Cuxhaven; Emden opened June
      2054, Groningen and Wilhelmshaven in 2055, and Cuxhaven in 2057.
  - page: 63
    fact: The in-world narrator describes a failed attempted hostile takeover of Proteus
      in 2056 by AG Chemie Europa, possibly with an eastern dragon named Chong-chao,
      whom the narrator also describes as a Proteus sponsor or partner in building
      its Japanese arkoblocks. This collusion is presented as likely but not proved.
      The narrator says the ensuing hostilities ended quickly and Proteus remained
      mostly unchanged, while the exact participants and events remain uncertain.
  corporate_profile:
  - page: 64
    fact: 'Proteus operates eight arcologies at the time of the report: five in the
      North Sea, two near Japan, and one off South America, plus a smaller Berlin
      arcology. These are setting counts, not game mechanics.'
  - page: 64
    fact: Proteus focuses on heavy industry and aquatechnology, a surface-and-submarine
      fleet, offshore petroleum and natural-gas extraction, marine biological laboratories,
      and biotechnology farms producing algae and plankton.
  - page: 65
    fact: The narrator considers Proteus’s Devil’s Island aerospace project an expansion
      into the space-launch and orbital industry, but forecasts that Proteus will
      need time before it can compete with existing space-going corporations such
      as Ares or Fuchi; future commercial success is not established.
  mechanics_review: These pages supply source-setting dates, locations, counts, and
    five-million-nuyen award information, but no printed target numbers, dice pools,
    equipment statistics, damage codes, rules procedures, or price/Availability tables.
