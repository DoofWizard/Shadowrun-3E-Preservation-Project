{"id":"world.smuggler-havens.new-orleans-spirits-walking-dead-bayou-p26-29","record_type":"world","status":"ingested","source":"source.fasa-7215","printed_pages":"26-29","pdf_pages":"27-30","edition_scope":"Original FASA Corporation Shadowrun Target: Smuggler Havens (FASA7215, ©1998), historical Second Edition-era setting context; not a Shadowrun Third Edition conversion","content_class":["world_fact"],"data":{"source_voice":"Doc Cane’s fictional New Orleans magical-lore account continues through printed p29; this record distinguishes his in-world descriptions from disputed Shadowland assertions and provides no real-world occult practice instructions.","supernatural_overview":{"places":"French Quarter, Lakefront District, cemeteries and bayous are characterized as encounters with magical beings and dangerous specters; Mardi Gras crowds are said to heighten magical spirit activity.","entities_named":["loup-garou","devil jack diamonds","hellbenders","corpselights","free spirits","ghosts","specters","ghouls","vampires","zombies"],"ghost_vs_specter":"Doc Cane portrays many ordinary ghosts as harmless repeating remnants, often visible only to those with the Talent; he distinguishes more dangerous specters that can manifest physical phenomena or possess living bodies, especially when tied to locations or unresolved grievances.","spirit_diversity":"The guide describes free spirits as individuals with differing motives, including companionship, trickery and predation. These descriptions do not establish one universal motive for all spirits."},"named_free_spirits":[{"name":"Toussaint","reported_location":"French Quarter","reported_powers":"A city free spirit said by an attributed poster to enjoy celebrations and to materialize gold/silver coins or old-fashioned money; sometimes assumes different metahuman forms."},{"name":"Mal","reported_location":"French Quarter","reported_powers":"Another free spirit, jokingly called Toussaint’s brother by a poster; can assume humanoid forms and performs troublesome pranks, sometimes handing out money."},{"name":"Malice","reported_relationship":"An elven woman named in Tommy Dre’s post as someone with whom Mal has fought; the passage does not establish she is a free spirit or assign her game statistics."}],"walking_dead":{"doc_cane_narration":"Doc Cane refers to zombies, ghouls, vampires and other nocturnal beings as fearsome walking dead in local folklore; some are associated with cemeteries, mausoleums or forest/bayou surroundings.","critical_distinction":"Magister and other Shadowtalk contributors challenge the label undead for vampires and ghouls, attributing their transformation to HMHVV infection instead of death and resurrection. Zombies are disputed separately as spirit-animated bodies or magical puppets, so neither category is collapsed into the other.","baron_samedi":"The Doc says some dangerous beings are associated with Baron Samedi and related supernatural figures; this is fictional character lore, not an independent factual claim about religion.","hmhvv":"The page-28 discussion calls the condition Human-Metahuman Vampiric Virus, a setting-specific retroviral disease; the discussion contains disputed theories, not an exact rules conversion."},"bayou_threats":{"corpselights":"The guide describes floating greenish-yellow magical lights in the bayous that can lure victims and drain their life force, but supplies no dice code or numerical attack mechanics.","ecology":"Natural and city spirits, magical animals, swamps and moss-covered woodlands contribute to the danger of astral exploration, in Doc Cane’s account.","toxic_magic_conflict":"Doc Cane characterizes a subset of bayou shamans as toxic and damaging to petrochemical installations, while subsequent Shadowtalk explicitly challenges this blanket labeling and alleges corporate pollution as a cause of conflict."},"mechanics_review":"No explicit game target numbers, dice pools, Essence loss values, spirits’ Force ratings, spell attributes, numeric damage codes, vehicle or gear tables, or combat procedure appear in printed pp26–29. Preserve supernatural categories as historical lore only."},"headline":"Fictional new orleans free spirits, ghosts, hmhvv, and bayou lore — FASA Corporation, Target: Smuggler Havens (FASA7215, ©1998), fictional Shadowrun tabletop RPG, Second Edition-era historical setting; printed pp26-29/PDF27-30","summary":"Source-reviewed fictional New Orleans free spirits, ghosts, HMHVV, and bayou lore from FASA Corporation, Target: Smuggler Havens (FASA7215, ©1998), fictional Shadowrun tabletop RPG, Second Edition-era historical setting, source.fasa-7215, printed pp26-29/PDF27-30. In-world narrators and named commenters retain their own levels of certainty; there is no implied Third Edition mechanics conversion.","framing":"newsroom_neutral"}
