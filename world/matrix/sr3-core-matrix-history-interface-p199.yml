  narrator_world_system_description:
    network_composition: The original fictional-book narrator describes the Matrix as interlinked computers
      called hosts, joined by grids identified with the worldwide telecommunications network.
    system_access_qualification: The narrator says most fictional computer systems are Matrix-accessible with
      authorized passcodes or by unauthorized intrusion. It does not claim that all hosts are freely accessible.
    geographic_latency_qualification: The narrator says a Matrix user can theoretically connect to a host across
      the planet within seconds, a world-setting description rather than a fixed tabletop action interval.
    source_period_rationale: The book relates broad interconnectivity to the fictional corporate world and
      to the perceived need to keep rapidly changing data current.
    data_cognition_limit: The narrator says human users cannot intuitively understand raw Matrix data flows;
      older textual commands, file names and procedural languages would be unwieldy at Matrix scale.
  fictional_history_and_interface:
    historical_comparison: The source contrasts ordinary windowed computer-file retrieval in its 1998 example
      with the later fictional Matrix sensory interface.
    historical_event_year: 2029
    historical_event: The source says the Crash of 2029 preceded development or application of Artificial Sensory
      Induction System Technology (ASIST) to direct neural interface (DNI) computer access and the birth of
      the Matrix.
    graphics_metaphor: The narrator says physical components, programs and even file-copy operations appear
      graphically as icons in a computer-generated environment.
    file_retrieval_example: For an authorized in-world file lookup, the system presents a simulated landscape,
      directs the user toward the validated file, and permits sensory interaction and downloading to a cyberterminal.
    subjective_time_wording: The book calls the simulated file-search journey microsecond-long; this is prose
      and is not separately printed as a tabletop test duration.
    intent_based_operation: The setting description says users can invoke desired actions rather than recalling
      command sets and filenames; it illustrates programming or design by manipulating virtual representations
      whose actions the computer translates into real-world processes.
    decker_context: The narrator says Shadowrun deckers apply the same sensory-access technology to intrude
      into fictional computer systems for their own objectives, distinct from ordinary authorized users.
  existing_rules_not_replaced:
    mechanical_boundary: No Matrix test, Target Number, dice-pool modifier, interface rating, game hacking
      procedure, or guaranteed timed movement rule is introduced by this opening narration; separate original
      p200 onward technical Matrix rules remain as their accepted records.
    period_scope: Do not conflate narrated in-world history with actual computer technology, real-world intrusion
      advice, or later sourcebook Matrix revisions.
