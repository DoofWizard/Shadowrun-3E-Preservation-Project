id: world.matrix.target-matrix-data-havens
record_type: world
name: "Target: Matrix - Data Havens"
domain: matrix
status: ingested
source_period: "2060"
source: source.fasa-7219
printed_pages: "23-51"
pdf_pages: "24-52"

data_haven_model:
  definition:
    - "Independent or semi-independent Matrix systems operated to preserve, exchange, publish, or broker information."
    - "Common roles include archives, whistleblower publication, shadow-community communication, specialist research, and protected discussion."
  access:
    - "Some havens are public-facing; others require referrals, reputation, invitation, or restricted routes."
    - "Operators may restrict accounts, monitor abuse, and remove users who endanger the haven."
  information_policy:
    - "Havens differ in whether they merely host information, authenticate it, broker it, or protect sources."
    - "Reliability varies; unverified claims and deliberate misinformation remain possible."
  security:
    - "Security is commonly layered around access control, user reputation, host architecture, and protection of archives."
    - "Haven operators often avoid storing identifying source data when doing so would endanger contributors."
  recommendations:
    - "Use intermediaries and reputation carefully."
    - "Do not assume anonymity merely because a haven is shadow-oriented."
    - "Separate acquisition of information from verification of information."

shadowland:
  role: "Major shadow-community information network."
  structure:
    - "Uses distributed nodes and local operators."
    - "Shadowland nodes provide discussion, file exchange, contacts, and local information."
  access:
    - "Accounts and access depend heavily on local node policy and reputation."
    - "Moderators/sysops can restrict or remove disruptive users."
  nexus:
    role: "Core Shadowland coordination/data infrastructure."
    characteristics:
      - "Serves as a major routing and archival center for Shadowland."
      - "Maintains high security and restricted physical/Matrix access."
  operating_culture:
    - "User reputation, specialist forums, private messaging, and local node communities are central."
    - "The chapter distinguishes public discussion from restricted or private material."

named_havens:
  asgard:
    focus: "Matrix haven with strong mythic/Norse presentation and specialist community."
    notes:
      - "Access and participation are shaped by local culture and operator policy."
  azziewatch:
    focus: "Information collection and discussion concerning Aztechnology/Aztlan."
    notes:
      - "Maintains adversarial research focus and source-protection concerns."
  helix:
    focus: "European/Matrix haven with layered internal communities."
    notes:
      - "Includes public-facing and restricted areas with differing access."
  kalinin:
    focus: "Eastern European/Russian-oriented haven and information exchange."
    notes:
      - "Political and regional intelligence are prominent themes."
  manchester:
    focus: "UK-oriented haven/network."
    notes:
      - "Regional hacker culture and local-network information are emphasized."
  morgue:
    focus: "Singapore-based archival/research haven."
    characteristics:
      - "Large-scale data collection and historical/business records."
      - "Economic, market, and corporate research are major uses."
  mosaic:
    focus: "Japanese/Asian-oriented haven with long-running shadow-community history."
    notes:
      - "Operates through a network of contacts and mirrors rather than a single simple public service."

campaign_use:
  - "Data havens provide a structured source for legwork, rumors, contacts, specialist data, and campaign exposition."
  - "Information obtained from a haven should retain its provenance and reliability level; posted claims are not automatically factual."
  - "Haven access can itself be a scenario constraint through reputation, invitation, authentication, or restricted network routes."

sources:
