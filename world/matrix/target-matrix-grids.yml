scope:
  - "Source-period descriptions of public and private Matrix grids, their access culture, visual metaphors, security posture, and operational character."
  - "Shadowtalk is preserved as attributed commentary rather than neutral fact."

grids:
  angel_satellite_constellation:
    operator: "Ares subsidiary / orbital communications infrastructure"
    access:
      - "Satellite access is commercially available but expensive."
      - "Legitimate use relies on scheduled communications links and authorized services."
    security:
      - "Intrusion risks include traceability through orbital routing and conventional Matrix countermeasures."
    presentation:
      - "Orbital/satellite visual metaphors are common."
  chicago_noose_net:
    context: "Chicago-area network surviving under severe local disruption."
    access:
      - "Connectivity is fragmented and improvised."
      - "Outside access is inconsistent and dependent on surviving links."
    security:
      - "Local conditions and damaged infrastructure make navigation and data reliability significant hazards."
  department_of_justice:
    hosts:
      - "Department of Justice hosts"
      - "Federal Bureau of Investigation"
      - "UCAS Marshals"
    characteristics:
      - "Federal law-enforcement systems use strong access control and compartmented information."
      - "Different agencies maintain distinct host responsibilities and investigative data."
  magicknet:
    purpose: "Awakened-interest Matrix community and service network."
    characteristics:
      - "Combines public discussion, private hosts, magical research exchange, and specialized services."
      - "Access culture reflects magical traditions and community reputation."
  matrix_service_providers:
    providers:
      - "UCAS Online"
      - "PlanetLink"
      - "Yamatetsu MetaMatrix"
    characteristics:
      - "Commercial Matrix service providers vary in pricing, service packages, and security policy."
      - "Subscriber identity, billing, and service-level controls are recurring operational considerations."
  pueblo_corporate_council:
    characteristics:
      - "Pueblo grids emphasize corporate administration and regional network identity."
      - "User access and internal hosts are structured around corporate/civic services."
  saeder_krupp_prime:
    characteristics:
      - "Highly controlled corporate network with strong internal compartmentalization."
      - "Access architecture and iconography reinforce Saeder-Krupp institutional identity."
      - "Security favors layered access, monitoring, and restricted internal movement."
  shiawase_mifd:
    name: "Matrix Information and Forecasting Department"
    purpose:
      - "Data-analysis and forecasting network."
      - "Large-scale information collection and pattern analysis."
    security:
      - "Strong defenses protect proprietary forecasting data."
      - "Semi-autonomous expert systems and specialized analysis software are part of the operating model."
  transys_neuronet:
    characteristics:
      - "Research-oriented Matrix infrastructure associated with Transys Neuronet."
      - "Experimental interface work and neural-computing research are central themes."
    caerlion_system:
      - "Restricted research host associated with advanced interface and experimental data."
      - "Source commentary links it to unusual research projects and tightly controlled access."

operational_notes:
  - "These descriptions are setting/world-state material, not standalone replacements for SR3 Matrix core rules."
  - "Where the chapter discusses individual host security, access, or architecture without explicit numeric mechanics, those descriptions remain qualitative."
  - "Later Game Information in this source is the authoritative deep-capture section for reusable mechanics."

