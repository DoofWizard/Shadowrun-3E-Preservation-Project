role:
  - "Intergovernmental forum for the Native American Nations."
  - "Modeled as a loose coordinating body rather than a central federal government."

representation:
  - "Each member nation has one vote."
  - "The Council elects a Speaker."
  - "The Speaker votes only to break a tie."

responsibilities:
  - "International diplomacy and representation."
  - "Interstate coordination among NAN member nations."
  - "Administration and oversight functions assigned collectively by the member nations."
  - "Relationship to the Native American Nations Reserve Bank and other shared institutions."

authority_limits:
  - "The Council can issue decisions and judgments affecting member nations."
  - "The source emphasizes that the STC lacks a strong independent enforcement mechanism."
  - "Compliance therefore depends heavily on member-state cooperation."

headquarters:
  location: "Cheyenne, Sioux Nation"

currency_coordination:
  - "A unified NAN currency was considered but not adopted."
  - "Member nations continued using their own currencies, commonly alongside the nuyen."

current_operation:
  - "The STC remains an important forum for interstate relations and conflict management."
  - "Regular meetings and larger summits are used to address shared political, economic, and security issues."

provenance_policy:
  - "Individual delegate motives and shadowtalk allegations remain attributed."

