data:
  publication:
    publication_title: 'State of the Art: 2063'
    publisher: FanPro
    publication_year: 2003
    catalog_number: FanPro10664
    edition: Shadowrun Third Edition
    source_id: source.fanpro-10664
    source_pdf_sha256: a49f6c0030ed18e8541a7d45ca2a263ada608e6a22689287a4d234caa471265a
    chapter: Soldiers of Fortune
    fictional_source: Published fictional cyberpunk tabletop role-playing game sourcebook
    printed_pages: 65-66
    physical_pdf_pages: 66-67
  article:
    source_voice: Picador’s in-world Soldiers of Fortune feature
    section: Brothers in Arms
    topic: Mercenary organizations and their attributed reputations
  organization_profiles:
  - organization: MET 2000
    printed_pages: 65-66
    described_base: Hannover, Germany
    book_narrator_report:
    - Largest mercenary organization worldwide in this source-era feature, with divisions working in Europe,
      the Middle East and Africa.
    - Major backers include the German Confederation government, German defense company Ruhrmetall and Euro-industrial
      IFMU.
    - The source says it favors armored and mechanized infantry, with much of its current activity in Africa,
      the Middle East and the Balkans; regular German reserve obligations also keep a standing force near the
      SOX nuclear wasteland.
    reader_comments:
    - speaker: Ballidou
      claim: Criticizes MET 2000’s style and disputes its superiority relative to Tsunami.
    - speaker: METalhead
      claim: Defends MET 2000 and requests a rematch after previous rivalry.
    - speaker: Picador
      claim: Rebuts claims Matador’s dislike of MET 2000 was merely personal and warns of the long memory surrounding
        the Northwest feud.
  - organization: Tsunami
    printed_pages: '66'
    described_base: Okinawa
    book_narrator_report:
    - Second-largest by Picador’s estimate, headquartered in Okinawa, with work across the world but a preference
      for the Pacific theater.
    - Much of its backing comes from the Japanocorps. It is described as investing heavily in cyberware and
      bioware specialists rather than chiefly heavy armor and heavy weapons.
    - The narrator describes Tsunami as comparatively dangerous at the individual augmented specialist level.
    reader_comments:
    - speaker: Ballidou
      claim: Criticizes MET 2000’s formal battlefield tactics and praises Tsunami’s flexibility.
    - speaker: Akyn
      claim: Claims Japanocorp sponsorship affects Tsunami’s treatment of metahuman mercenaries and that Imperial
        Regent tensions threaten its special extraterritorial status in Okinawa.
  - organization: 10,000 Daggers (10K Daggers)
    printed_pages: '66'
    described_base: Constantinople
    book_narrator_report:
    - Formed several years after Constantinople’s independence by former Ukrainian officers and Turkish war
      veterans.
    - Described as a smaller organization without MET 2000/Tsunami-sized backers or equipment, with a reputation
      for commando operations, long-range scouting and nighttime work.
    reader_comments:
    - speaker: Flak Jack
      claim: Believes the Daggers wield influence in Constantinople’s government but questions which institution
        depends on the other.
    - speaker: Zortan
      claim: Speculates about the hit on Ibn Eisa, Mossad and the possible Daggers’ involvement; no responsibility
        is established.
    - speaker: Saever
      claim: Responds by speculating about political actors seeking the Daggers’ support.
  - organization: Combat Inc.
    printed_pages: '66'
    described_base: Macao following move from Hong Kong
    book_narrator_report:
    - Mercenary organization with specialized work across the Pacific Rim and operations in Southeast Asia
      and Australia.
    - The source says Combat Inc. announced its relocation to Macao across the Pearl River estuary.
    reader_comments:
    - speaker: Johnny Hotel
      claim: Attributes the relocation to a dispute connected with Wuxing, natural orichalcum discovery, and
        local corporate pressure; claims are disputed and not established by the narrator.
    - speaker: Mk I Eyeball
      claim: Claims recent activities on the Salish–Tsimshian border, Mojave Wars, and contracts benefiting
        Tsunami in Peru; the source voice treats these as in-world reports.
  coverage_limit: Brothers in Arms organizational introduction and four named company profiles spanning printed
    pp65–66/PDF66–67; related individual claims are separately attributed. Does not infer personnel statistics,
    available equipment, game stat blocks, or present-day reality.
headline: 'Fictional tabletop RPG source: FanPro State of the Art: 2063 (FanPro10664, 2003), Shadowrun Third
  Edition; printed pp65-66/physical PDF pp66-67: MET 2000, Tsunami, 10K Daggers and Combat Inc.'
summary: Records fictional mercenary organizations, their source-era geographic bases, relative scale, sponsors,
  and reported specialties while distinguishing commentator allegations from book-narrator assertions. Original
  printed pp65-66/physical PDF pp66-67, FanPro10664 (2003), Shadowrun Third Edition. In-world sources and claims
  are identified; not a real-world report.
