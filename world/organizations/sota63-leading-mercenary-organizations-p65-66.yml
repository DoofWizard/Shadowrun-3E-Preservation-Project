          "Major backers include the German Confederation government, German defense company Ruhrmetall and Euro-industrial IFMU.",
          "The source says it favors armored and mechanized infantry, with much of its current activity in Africa, the Middle East and the Balkans; regular German reserve obligations also keep a standing force near the SOX nuclear wasteland."
        ],
        "reader_comments": [
          {
            "speaker": "Ballidou",
            "claim": "Ballidou criticizes reliance on advanced equipment over tactical adaptability; the commentator does not compare MET 2000 favorably or unfavorably to Tsunami in this remark."
