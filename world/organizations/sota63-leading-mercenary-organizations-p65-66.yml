        "printed_pages": "66",
        "described_base": "Okinawa",
        "book_narrator_report": [
          "Second-largest by Picador’s estimate, headquartered in Okinawa, with work across the world but a preference for the Pacific theater.",
          "Much of its backing comes from the Japanocorps. It is described as investing heavily in cyberware and bioware specialists rather than chiefly heavy armor and heavy weapons.",
          "The narrator describes Tsunami as comparatively dangerous at the individual augmented specialist level."
        ],
        "reader_comments": [
          {
            "speaker": "Ballidou",
            "claim": "Ballidou also criticizes Tsunami, disputing that its augmentations make it superior and expressing a preference for learned skills over reliance on skill chips. This is opinion, not a new skill-chip modifier."
