strategic_position:
  - "Seattle is presented as the only UCAS city on the Pacific Coast and a principal gateway between the UCAS and Pacific Rim."
  - "Pacific Rim and overland trade from Tir Tairngire and Salish-Shidhe territory supplies raw materials, food, technology, luxury goods, electronics, magical goods and regional crafts."
  - "Seattle's corporate and government data-processing infrastructure forms a major information conduit between Pacific Rim interests and the UCAS."
  - "The metroplex is also a major smuggling and black-market hub because of its position between UCAS, NAN and Pacific trade routes."

corporate_environment:
  - "Large AAA megacorporations coexist with strong Seattle-based corporations and newer entrants."
  - "The source emphasizes competition for Seattle facilities, contracts, information and Pacific Rim access."

