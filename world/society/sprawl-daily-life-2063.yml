housing:
  - "Modern residences are commonly built around automated household systems, networked appliances, environmental controls and integrated security."
  - "High-density urban housing ranges from luxury towers and corporate enclaves to improvised squats and low-cost prefab housing."
  - "Squatter communities commonly rely on scavenged utilities, illicit service taps, improvised repairs and communal protection."
  - "Interior displays, color-changing surfaces and simulated views are common consumer conveniences in wealthier homes."

networked_home:
  - "Homes commonly use a central terminal plus wired and/or wireless local networks to coordinate appliances, communications and services."
  - "Consumer devices may collect behavioral and purchasing data for commercial profiling."
  - "Telecommuting is common, though corporate employers isolate remote-worker access from sensitive internal systems."
  - "Integrated home security commonly links locks, alarms and monitoring systems to Matrix-connected response services."

food_and_household:
  - "Synthetic foods based on soy and mycoprotein are widespread, while natural food remains comparatively expensive."
  - "Domestic automation includes cleaning drones, smart kitchens, automated supply ordering and environmental management."

shopping:
  - "Shopping malls and franchise chains remain major consumer spaces and often reflect megacorporate ownership or influence."
  - "Black-market bazaars provide an informal alternative for stolen, scavenged, bootlegged and gray-market goods."
  - "Magical-goods shops tend to be small specialized businesses rather than large franchises."
  - "Consumer retail increasingly uses personalized advertising, purchase-history profiling and automated inventory/payment systems."

