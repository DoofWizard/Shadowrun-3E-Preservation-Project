id: world.group.new-revolution
record_type: world
name: "New Revolution"
domain: society
status: ingested
source_period: "2062"
game_information:
  objective: "Restore a single United States government across North America; the source presents the movement as rejecting the legitimacy of the existing successor nations."
  operating_style:
    - "A covert conspiracy that prefers manipulation, infiltration and compartmentalized cells over direct action."
    - "Uses secrecy, subterfuge and hidden agendas; most operatives know only a small part of the larger organization."
    - "The organization deliberately creates instability and then positions its own networks to exploit the resulting loss of confidence and authority."
  branches:
    militia:
      role: "Supports outside insurgent and extremist groups with supplies, weapons, advice and infiltrated support networks."
      strategic_goal: "Weaken incumbent governments rather than necessarily enabling any one supported faction to win."
    political:
      role: "Creates scandals and crises, undermines reputations and public confidence, and works through political/media infiltration."
      leadership: "A group known only as the Council."
      source_period_location: "Previously operated from Denver; the source says it is relocating to Pueblo-occupied Los Angeles after Ghostwalker's arrival."
    reconstitution:
      role: "Builds the replacement order by cultivating control over resources, infrastructure, institutions and sympathetic leaders."
      internal_issue: "The eventual leadership of the proposed restored state is unresolved and a source of factional tension."
campaign_guidance:
  - "The source recommends revealing the conspiracy piecemeal rather than using defining names for senior figures immediately."
  - "Different branches can support distinct campaign styles and may cooperate without fully sharing goals or information."
  - "The Game Information section treats the New Revolution as the GM-facing underlying organization; earlier dossier and Shadowland material remains attributed intelligence or speculation."
sources:
  - {source: source.fanpro-10652, pages: "55-63", pdf_pages: "55-63", relation: defines}
notes:
  - "Specific allegations in the dossier about named governments, corporations, criminal groups or individual leaders are not promoted to fact unless the Game Information section confirms them."
