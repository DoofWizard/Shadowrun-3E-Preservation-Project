entertainment_and_media:
  - "Urban nightlife spans mainstream bars/clubs, niche subculture venues, underground clubs and Matrix-based social spaces."
  - "Music, trideo and simsense are heavily integrated with megacorporate entertainment ownership and distribution."
  - "Corporate employers use in-house media, events, travel and entertainment as employee rewards and culture-building tools."
  - "Advertising is pervasive, increasingly personalized through consumer data and device/location profiling."
  - "News media uses ubiquitous cameras, implants, Matrix feeds and subscription services; pirate broadcasters operate alongside mainstream outlets."
  - "Professional sports combine mass media spectacle, corporate sponsorship and augmentation technology; simsense feeds are commercially important."

identity:
  - "System Identification Numbers (SINs) establish legal identity/citizenship and are tied to personal data held by national, corporate and global registries."
  - "SINless people face barriers to legal employment, banking, housing, utilities, education, travel and many consumer services."
  - "Criminal SINs and other status data may be cross-indexed with biometric and legal records."

credsticks:
  - "Registered credsticks combine financial access with identity, permits/licenses, contracts, medical data and optional beacon functions."
  - "Certified credsticks function more like bearer instruments and generally omit identity data."
  - "Credstick transactions and associated readers produce logs and may support consumer profiling."
  - "Verification readers are managed by issuing/distribution networks and perform database-backed authorization."

finance:
  - "Electronic banking dominates ordinary finance, with online accounts, automated services, credit, investments and loans."
  - "Corporate employee banking can be integrated with personnel systems."
  - "Shadow/anonymous banking and high-privacy financial services exist outside ordinary regulated channels."

