id: world.group.order-of-the-temple
record_type: world
name: "Order of the Temple"
domain: society
status: ingested
source_period: "2062"
group_profile:
  type: "Conspiratorial"
  members: "Approximately 600 worldwide"
  resources: "Luxury"
  dues: "None"
  patron: "Roman Catholic Church"
  strictures:
    - "Belief: Roman Catholic"
    - Fraternity
    - "Limited Membership: Awakened Roman Catholic priests only"
    - "Oath: religious vows"
    - Obedience
    - Sacrifice
    - Secrecy
organization:
  - "The Order answers to the Pope; the Master of the Temple directs field activity and receives access to requested information."
  - "Members remain part of the organization for life unless formally expelled."
  - "An international support network of inactive members supplies information, money and other assistance."
  - "The modern organization distinguishes magically active ordained-priest knights from more numerous sergeants who emphasize technology, Matrix work and support; sergeants need not be priests."
patronages:
  raphael:
    focus: "Healing, magical theory/science and Matrix or medical support."
    taggant: "Small serpent on the forehead."
  michael:
    focus: "Combat, weapons procurement and infiltration of military/security forces."
    taggant: "Unsheathed sword, point down."
  gabriel:
    focus: "Communications, detection magic, conjuring, field communications and Matrix contact."
    taggant: "Scepter."
  uriel:
    focus: "Enchanting and procurement of rare magical materials and supplies."
    taggant: "Open hand holding a flame."
magic_practice:
  - "The source describes Templar practice as a distinct Christian hermetic-style school drawing on Church traditions and using Latin incantations."
  - "Conjured elementals are interpreted as angels sent through the relevant Patronage; the text describes qualitative affinity with a knight's patron and difficulty with opposing Patronages rather than giving a numeric modifier."
  - "Great-form elementals are interpreted by the Order as personal servitors of the patron Archangel."
magical_training:
  - "Metamagical skills vary among the internal Patronages."
  - "Centering and Quickening are commonly taught early."
  - "The group never teaches Possession metamagic."
  - "Aspected magicians are comparatively common, especially fire and earth elementalists in the Patronages of Michael and Uriel respectively."
field_equipment:
  - "Field operatives normally wear body armor and carry at least a pistol and sharp knife."
  - "Issued contact lenses contain short-range microscopic MADs used to detect Templar taggant marks."
  - "Knights commonly favor broadswords, sometimes as weapon foci, plus quickened spells or sustaining foci in place of extensive cyberware."
  - "Sergeants favor modern weapons and may use more cyberware; quickened reaction-enhancing spells are described as common magical augmentation."
campaign_use:
  - "The source presents the Order as active worldwide and usable as a recurring patron, antagonist or campaign framework."
sources:
  - {source: source.fanpro-10652, pages: "102-108", pdf_pages: "102-108", relation: describes_source_period_structure_and_practice}
  - {source: source.fanpro-10652, page: 109, pdf_pages: "109", relation: defines_gm_truth}
notes:
  - "Earlier testimony in the chapter is treated as in-character evidence; the p.109 Game Information section is authoritative for underlying group facts."
  - "Operational goals and allegations appearing only in the fictional testimony are not promoted to unqualified fact."
