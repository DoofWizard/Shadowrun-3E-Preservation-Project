title: "Who Watches the Watchers?"

investigation:
  - "The file centers on Hawke's investigation after the death of Boston fixer Xancer Brand."
  - "Brand's records contain names, contact material and references connecting multiple runners, fixers and other individuals to Dunkelzahn."
  - "Many of the named people also appear in Dunkelzahn's will or in the orbit of Nadja Daviar, the Draco Foundation and related post-will activity."

dunkelzahn_shadow_network:
  established_context:
    - "The source presents substantial evidence that Dunkelzahn maintained a broad clandestine network of runners, fixers, informants and contacts while alive."
    - "The network appears decentralized: many participants knew only their immediate handler or a narrow portion of the larger structure."
  post_death_state:
    - "The chapter does not establish a single confirmed successor or command structure after Dunkelzahn's death."
    - "Commentators speculate that parts of the network continued under Nadja Daviar, the Draco Foundation, independent former handlers or self-organizing local cells."
    - "The conclusion explicitly leaves open whether the network's fragmentation was planned, accidental or part of a larger posthumous strategy."

ex_denver_kid_account:
  handler: "Mr. Cajun"
  context:
    - "A veteran runner describes years of assignments through a handler called Mr. Cajun."
    - "One described assignment involved an Aztechnology high priest and an operation in which blood magic was encountered."
  compensation_example:
    nuyen: 2000000
    additional_compensation: "ownership of an island off the coast of Florida"
    classification: "attributed campaign/world example, not a universal shadowrun-pay rule"
  later_context:
    - "Mr. Cajun later sought a meeting after Dunkelzahn announced his presidential candidacy, then cancelled it before the meeting took place."

brand_and_network_security:
  - "Brand's death is treated as potentially connected to knowledge of Dunkelzahn's organization, but no definitive responsible party is established."
  - "The final discussion suggests that surviving members may be monitoring one another, gathering leverage and reorganizing while trying to determine who can be trusted."
  - "Claims that Dunkelzahn deliberately exposed, pruned or restructured the network through his will remain attributed theories rather than settled facts."

