summary: 'Source-reviewed fictional in-world indie spotlight writer wally nguyen’s in-world selection of ten 2062
  nightlife venues, numbered but explicitly without comparative ordering. From FanPro State of the Art: 2063 (Shadowrun
  Third Edition, FanPro10664, 2003), printed pp112-114/physical PDF pp113-115; narrator descriptions and named in-world
  opinions are distinguished.'
data:
  publication:
    title: 'State of the Art: 2063'
    publisher: FanPro
    publication_year: 2003
    catalog_number: FanPro10664
    source_id: source.fanpro-10664
    edition: Shadowrun Third Edition
    printed_pages: 112-114
    physical_pdf_pages: 113-115
    source_pdf_sha256: a49f6c0030ed18e8541a7d45ca2a263ada608e6a22689287a4d234caa471265a
    source_kind: Published fictional tabletop RPG setting reference
  section:
    title: 'Sweet Spots: 2062’s Top 10 Scenes'
    chapter: Culture Shock
    author: Wally Nguyen
    in_world_outlet: Indie Spotlight hostzine
    year_of_selection: 2062
    ranking_method: The writer says the ten finalists have no particular precedence, even though their presentation
      uses the numbers 1 through 10. The list is an editorial selection based on polling and venue visits, not independent
      numerical attendance data.
  venues:
  - printed_number: 1
    name: Whiskey Sour
    place: Dee Cee, UCAS
    description: An old-money, 1800s-styled bar with a maple bar, classical music, leather seats, suited and political
      patrons; the narrator emphasizes inclusive service and fine drinks.
  - printed_number: 2
    name: Purgatory Central
    place: Atlanta, CAS
    description: New downtown dance club opened by owners of Dante’s Inferno in Seattle; nine themed levels, some
      still to open, mixing an astral level, a Matrix level, a sprawl level, elemental levels and live music. Private
      rooms are lower down and owner parties are an invitation-only privilege.
  - printed_number: 3
    name: Emerald
    place: New Orleans, CAS
    owner: Elenor LaGrasse
    description: Bourbon Street jazz, imported spirits and casual food overseen nightly by its music-patron owner;
      staff are described as friendly.
  - printed_number: 4
    name: Pulsar
    place: Albuquerque, PCC
    owner: Lazer
    description: Intentionally futuristic club with coordinated lighting and sound, high-tech decor, extensive cyber-style
      dress expectations and expensive distinctive drinks.
  - printed_number: 5
    name: Altitude
    place: Denver
    description: Laid-back downtown bar with dark-granite and iridescent-white decor, dim lighting, casual clothes,
      conversational atmosphere and plenty of beer.
  - printed_number: 6
    name: Al Coda
    place: Boston, UCAS
    description: Old-world conversational bar with upstairs dance floor and live-music space, private rooms for
      rent, no food service and reasonable drink prices. Writer recalls an uncommon performance by Darwin’s Bastards.
  - printed_number: 7
    name: ?!?
    place: New York City, UCAS
    description: Club on 61st Street nicknamed “that club on 61st Street”; draw for celebrities, with black-and-white
      punctuation decor and a stringent fashion-conscious entry scene.
  - printed_number: 8
    name: The Gaslight
    place: Los Angeles, PCC
    owner: Angel Seraphim, former sim star
    description: 1940s film-noir-themed venue, without a dance floor, specializing in hard liquor and period memorabilia;
      many attendees are entertainment executives and aspirants.
  - printed_number: 9
    name: Shipni no Sekai
    place: San Francisco, California Protectorate
    description: Japanese-inspired multifloor social club, with a public bar, private rooms and baths requiring
      annual membership; specialty Asian-style cocktails and a reflective pool are described.
  - printed_number: 10
    name: The Strip
    place: Las Vegas, Ute
    location: Ground floor of the Plaza Hotel
    description: Quiet hotel bar combining a slightly casino-like ambiance with gold leaf, upscale yet welcoming
      seating, gentle music and live feeds from area shows.
  separate_named_shadowland_reactions:
  - speaker: Ghede
    about: Emerald
    classification: unverified in-world allegation
    report: Alleges that Genevieve, described as Elenor’s personal secretary, is an exceptionally skilled fixer
      and that the relationship between the two may be personal as well as professional; the feature does not establish
      those remarks as fact.
  - speaker: Leary
    about: Emerald
    classification: unverified in-world tip
    report: Claims that unusual alchemical drinks can be obtained, at nontrivial prices.
  - speaker: Gearshift
    about: Pulsar
    classification: unverified in-world claim
    report: Claims Lazer has contacts who could arrange discounted or financed cyberware; the author’s venue description
      does not substantiate this offer.
  - speaker: Zak
    about: Altitude
    classification: in-world social observation
    report: Claims Nicholas Whitebird occasionally rests there between errands for Big White Wyrm.
  - speaker: Lotus Eater
    about: Shipni no Sekai
    classification: in-world anecdote
    report: Suggests that the baths draw people displaying elaborate body art; this is opinion, not a reviewed venue
      service guarantee.
  illustrations:
    printed_page: 112
    description: A large black-and-white fictional character scene from the preceding Culture Shock feature.
  coverage_limit: Complete named ten-venue selection and principal venue-specific comments from printed pp112–114/PDF113–115;
    discards long prose and non-substantive reactions; does not claim venue costs or tabletop mechanics not specified.
