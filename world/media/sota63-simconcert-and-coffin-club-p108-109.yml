    section: Performance simcasting and Psychlone coffin club
  fictional_music_sector:
    section: 'Bandwidth: Enhanced Performance'
    byline: Indra Kelly, MusicNet
    general_source_description: In the fictional 2063 culture report, concerts use
      trid screens, pyrotechnics, illusions and Matrix-linked experiences. The author
      contrasts enhanced shows with performers relying more on stage presentation.
  simcast_performance:
    subsection: Sim-Casting
    performer: Hemlock
    event: A concert in Albuquerque in the PCC at the University of Pueblo
    source_description: The book describes a simultaneous partial sim-feed using cyber
      simrig implants to add performance sensation for audience members, layered over
      the live concert experience. It says the band expanded the technique to other
      tour stops.
    other_performers: The account says several groups on the Ersatz! label use pre-recorded
      simsense shows; Shadowland posters dispute intellectual-property claims between
      Ersatz! and Aurica/Pollux.
  attributed_controversies:
  - speaker: Connie Connoisseur
    claim: Claims former Ersatz! songwriter Doug Z died following a cyber simrig procedure
      and suggests a label cover-up; this is explicitly a fictional commenter allegation,
      not established death or wrongdoing.
  - speaker: Nuyen Nick
    claim: Rejects the death assertion and says Doug Z is hiding while undergoing
      treatment for a botched procedure; alternative unverified allegation.
  - speaker: Scag
    claim: Offers a sarcastic explanation for missing performers; no independent evidence.
  - speaker: Mixmaster
    claim: Highlights audience emotion as an additional transmission track and discusses
      its appeal; a named in-world observation, not a real-world device instruction.
  fictional_venue:
    subsection: Coffin Clubbing
    venue: Psychlone
    city: Seattle
    proprietor: Lucius Kellarven
    source_description: The in-world article describes a large establishment with
      conventional and astral entertainment. Paying guests occupy booths named coffins,
      while trained magical staff provide an astral counterpart to the dance floor.
    fictional_attributions: Posters Silicon Mage and Winterhawk describe the growth
      of coffin-clubbing and security arrangements. Serena discusses an optional VIP
      experience, while Prickly Pear objects to its risks. These are speaker claims
      and reactions, not universally accepted source facts.
  coverage_limit: Covers the Bandwidth, Sim-Casting and Coffin Clubbing feature through
    printed p109/PDF110; does not claim the separately indexed Top Ten Trids and Sims
    section beginning on that page.
