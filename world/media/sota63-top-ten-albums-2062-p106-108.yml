data:
  source_context:
    publication_title: 'State of the Art: 2063'
    publisher: FanPro
    publication_year: 2003
    edition: Shadowrun Third Edition
    catalog_number: FanPro10664
    source_id: source.fanpro-10664
    chapter: Culture Shock
    fictional_context: All events, technology, companies, rankings, music, and in-world
      speakers belong to the Shadowrun fictional setting, not real-world reporting.
    printed_pages: 106-108
    physical_pdf_pages: 107-109
    section: MusicNet ten albums of fictional 2062
  ranking:
    title: 'Critic’s Choice: Top Ten Albums of 2062'
    attributed_publisher: MusicNet
    reviewer: Hans Grassler
    ranking_year: 2062
    ranking_qualification: The printed introductory text describes the ten selections
      as the reviewer’s picks in no particular order, despite the numbered presentation.
    entries:
    - printed_number: 1
      album: Talking in Circles
      artist: Andrea Frost
      source_description: The reviewer describes Frost as returning to the celebrated
        group Concrete Dreams-associated song style; the band’s members remain a distinct
        entity from the solo artist.
    - printed_number: 2
      album: The Mother of the Sea
      artist: Shield Wall
      source_description: The reviewer notes a renewed tour and Jay Keith’s recovery
        after a near-fatal auto accident; a named Shadowland poster disputes the accident
        explanation and another gives a counter-allegation.
    - printed_number: 3
      album: Time to Die
      artist: CrimeTime
      source_description: Described as a verbal ork synth-hop artist from Vladivostok;
        a European tour is described as beginning the following February.
    - printed_number: 4
      album: Playing House
      artist: Erosthesia
      source_description: Reviewer describes a San Francisco/Saito-era themed release
        with layered, minimal arrangements and alienated-group traditions.
    - printed_number: 5
      album: Body Rhythms
      artist: Eddie Mwabe
      source_description: Reviewer identifies a Rio de Janeiro performer with South
        African and Amazonian influences.
    - printed_number: 6
      album: Elektron Welle
      artist: Synaptic
      source_description: German Elektron Wave musicians described as producing a
        new release, extra tracks available from the host, and a Seattle LTG reference.
    - printed_number: 7
      album: Who Calls the Nightbird Home?
      artist: Ghost Bear
      source_description: Reviewer describes a Sioux Nation group blending traditional
        rhythms with high-tech music; the fictional Sioux Legend of the Flute is referenced.
    - printed_number: 8
      album: Atú
      artist: Deirdre
      source_description: A young Tir-born performer described as using both elven
        heritage and wider European musical influences; the reviewer associates her
        with Surehand family connections, while commenters dispute their significance.
    - printed_number: 9
      album: White Crowz
      artist: Plastosapiens
      source_description: A CAS group including vocalist Chantelle Taylor and synth-bassist
        Johnny Bale; the review describes New Orleans jazz and Asian/Haitian influences.
    - printed_number: 10
      album: Blazing in the Night
      artist: Melody Tyger
      source_description: The reviewer describes a follow-up to Fearful Symmetry,
        with gender, meta-sexuality and gender-identity themes instead of a primarily
        broad social-commentary focus.
  separate_attributed_shadowland_discussion:
  - speaker: Jackhammer
    subject: Shield Wall / Jay Keith
    claim: Alleges Keith’s collision was not accidental; the book does not establish
      this accusation as fact.
  - speaker: Concrete Dreamer
    subject: Shield Wall / Jay Keith
    claim: Disputes the attempted-murder insinuation and alleges Keith had misappropriated
      a different musician’s creative work; neither allegation is independently established
      by the rankings.
  - speaker: Giorgio
    subject: CrimeTime
    claim: Posts a hostile, speculative comment about the artist’s career; the statement
      is in-world audience opinion.
  - speaker: Bull
    subject: Erosthesia
    claim: Defends the Silk Surfers against another fan’s criticism; opinion is attributed
      to the speaker.
  - speaker: Fan Addict
    subject: Erosthesia
    claim: Describes a different group as their preferred musical interest; fan commentary,
      not a ranking fact.
  - speaker: Spes
    subject: Deirdre
    claim: Makes claims about Deirdre’s parentage and politics, which are challenged
      by other posts including Parsifal; treat as disputed rumor.
  - speaker: Neon Wraith
    subject: Plastosapiens
    claim: Alleges record-label contractual difficulties; an associated named performer’s
      career is discussed but no certainty is established.
  coverage_limit: This record preserves ten album identities, their numbered ordering
    and concise source descriptions plus principal named allegations. It excludes
    original long-form reviews, artwork on printed p107/PDF108, and the separate Bandwidth
    section beginning p108.
