source_epistemics:
  - "Threats presents each major entry first as an in-world Shadowland download and comments from in-world readers."
  - "The book explicitly warns that these downloads may contain facts, rumors, bias, inaccuracies, deliberate misinformation, or speculation."
  - "Gamemasters are expected to decide what is true in their campaigns rather than treating every Shadowland claim as universal fact."

use:
  - "The book presents fourteen world-scale threats and encourages gamemasters to use them as campaign antagonists, background forces, red herrings, patrons, or recurring pressures."
  - "Threats are grouped conceptually into secret organizations, Awakened threats, and nominally 'good' threats whose methods or ambitions can still make them dangerous."
  - "Each threat is followed by game-facing material that provides hooks, rules, and guidance for incorporating it into play."

