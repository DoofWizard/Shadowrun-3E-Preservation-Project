title: "The Sleeping Dragon"

wuxing_bequest:
  beneficiary: "Wuxing, Inc."
  amount_nuyen: 200000000
  terms:
    - "Dunkelzahn's will leaves 200 million nuyen to Wuxing, Inc., to be used at the discretion of the Chief Executive Officer and principal shareholders."
  source_period_effect:
    - "The story presents the bequest as a major catalyst for Wuxing's post-will expansion and research activity."

jade_dragon_of_wind_and_fire:
  description:
    - "Ancient Chinese jade statue described as a dragon of wind and fire."
    - "The statue weighs approximately 25 kilograms."
  source_period_events:
    - "Wu Lung-Wai acquires the statue and places it in a highly secured location at Wuxing headquarters."
    - "The source reports that he refuses multiple purchase offers, including an offer of one billion nuyen."
  attributed_properties:
    - "Researchers and Shadowland posters suspect magical significance, but the story does not establish a formal power, Force rating or game statistic for the statue."

dragon_lines_and_feng_shui:
  world_facts:
    - "Wuxing headquarters is described as sitting on the crossing point of major dragon lines, called feng lung or dragon lines in the text."
    - "The building, exterior, landscaping and interior arrangement are described as deliberately designed to maximize local chi flow."
    - "The source states that feng shui and related geomantic practices can affect the flow of manalines and influence an area's background count, with positive or negative effects on magical practice."
  limits:
    - "The chapter gives no numeric modifier, test procedure or Background Count value for Wuxing headquarters."

four_coins_of_luck:
  folklore:
    first: "wealth"
    second: "longevity"
    third: "fertility"
    fourth: "general good fortune"
  source_period_distribution:
    first_coin:
      recipient: "Sun Yat-sun"
      context: "Hong Kong fisherman"
    second_coin:
      recipient: "Lung"
      context: "great eastern dragon"
    third_coin:
      recipient: "Sharon Chiang-Wu"
      context: "Wuxing executive/family connection"
    fourth_coin:
      status: "not located by the narrator during the investigation"
  attributed_properties:
    - "The coins are repeatedly discussed as potentially possessing the magical qualities associated with their folklore, but the story provides no formal artifact statistics or activation rules."

triad_and_corporate_context:
  - "The investigation links Wuxing personnel, Hong Kong underworld activity and competing claims about Triad connections; these remain a mixture of observed events and Shadowland interpretation."
  - "The closing commentary specifically rejects a definitive identification of Wu Lung-Wai as the dragon Lung; the claim remains speculation."

