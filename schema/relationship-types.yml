relationship_types:
  defines:
    meaning: "Introduces the canonical definition or mechanic."
  extends:
    meaning: "Adds material without replacing the existing definition."
  clarifies:
    meaning: "Explains ambiguity without changing the underlying rule."
  adds_option:
    meaning: "Adds a selectable option to an existing concept."
  adds_modifier:
    meaning: "Adds a conditional modifier to an existing concept."
  exception:
    meaning: "Creates a bounded exception to a broader rule."
  replaces:
    meaning: "Replaces a specific earlier rule or value."
  supersedes:
    meaning: "A later source/version takes precedence over an earlier treatment."
  conversion:
    meaning: "Explains how material from another edition/source is interpreted here."
  example:
    meaning: "Provides a worked or illustrative example."
  references:
    meaning: "Points to another record without changing it."
  errata:
    meaning: "Corrects a published error."

record_links:
  allowed_common_links:
    - affects
    - affected_by
    - uses
    - requires
    - modifies
    - modified_by
    - contains
    - component_of
    - interacts_with
    - resolves_with
    - prerequisite
    - incompatible_with
    - replaces
    - supersedes
    - references
