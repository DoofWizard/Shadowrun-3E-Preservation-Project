resolution:
  summary: "For SR3-era play, Man & Machine replaces the Cyberware and the Pool section on p. 19 of Virtual Realities 2.0. Encephalon and math SPU add their ratings in dice to the decker's Hacking Pool, cumulatively."
  inputs:
    - "encephalon rating"
    - "math SPU rating"
  outputs:
    - "Hacking Pool bonus dice"
  steps:
    - "Add encephalon rating to Hacking Pool."
    - "Add math SPU rating to Hacking Pool."
    - "Apply both cumulatively when both are present."

