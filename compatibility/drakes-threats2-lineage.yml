id: lineage.dragons.drakes.threats2
record_type: compatibility
name: "Threats 2 Drake Rules Lineage"
domain: dragons
status: ingested
source: source.fanpro-10652
printed_pages: "79-80"
pdf_pages: "79-80"
canonical_target: rule.dragons.drakes
relationship: historical_predecessor
effective_rule: {source: source.fanpro-10666, canonical_id: rule.dragons.drakes, status: current}
threats2_contribution:
  origin:
    - "Drakes were created in a previous Age of Magic by dragons as magically engineered servants able to assume human/metahuman form."
    - "Some Sixth World people display drake abilities; source leaves open whether they are old servants, memory-wiped descendants, or a new phenomenon."
  awakening:
    first_change:
      trigger_examples:
        - fear
        - anger
        - passion
        - high-Force spells
        - free spirits
        - power sites
        - dragons or dragon magic
      control: "Initially random/uncontrolled; later becomes voluntary with practice."
    signal: "First transformation produces a faint astral ripple sensed by great dragons and similarly powerful magical beings such as free spirits."
    latent_detection: "Great dragons can apparently detect drake potential by reading auras; ordinary magicians have not learned the secret."
  transformation:
    action: "Exclusive Complex Action."
    equipment: "Clothing/equipment is not transformed and may be damaged."
    involuntary_check: "Under trauma, emotional stress, strong magic, or dragon magic, Willpower (6) Test; failure causes involuntary transformation."
  humanoid_form:
    statistics: "Normal human/metahuman statistics."
    astral_perception: "Available; toggled on/off as Simple Action."
  dracoform:
    nature: "Dual-natured."
    speech: "Cannot speak normally; drakes can communicate with one another through sounds, body movement and limited telepathy."
    flight_multiplier: 5
    stats_formula:
      B: "(N + 4)/6"
      Q: "(N + 1) x4"
      S: "N + 4"
      C: "N"
      I: "N"
      W: "N"
      E: "6Z"
      R: "N + 1"
      note: "N = normal attribute in human/metahuman form."
    initiative: "Reaction + 2D6"
    attack: "(STR)M"
    reach: "+1"
    powers:
      - Astral Armor
      - "Enhanced Senses (Wide-Band Hearing, Low-Light Vision, Thermographic Vision)"
      - "Innate Spell (Flamethrower)"
  magic:
    options: "May learn/use Magical Skills like full/aspected magicians or somatic powers like adepts."
    initial_magic: "Based on Essence."
    initiation: "May initiate under normal Magic in the Shadows rules."
    dracoform_use: "May cast spells, conjure, use adept powers and other magical abilities in dracoform."
    astral_projection: "If capable, may project in either form."
  implants:
    essence_loss: "Double normal Essence loss."
    bio_index: "Double normal Bio Index."
    dracoform: "Implants do not function and effectively do not exist while in dracoform."
  astral_detection:
    awakened_drake: "At least 4 successes on Astral Perception Test to identify true nature in humanoid form."
    latent_drake: "At least 6 successes before first transformation."
    masking: "Initiated drakes may use Masking."
lineage_differences_vs_current:
  - "Later Dragons of the Sixth World differentiates true and bred drakes and provides fixed stat lines rather than this N-based formula."
  - "Later source changes Astral Perception thresholds to 3 successes for awakened humanoid-form drakes and 5 for not-yet-awakened drakes."
  - "No supersession is inferred here beyond the later source's explicit current treatment already recorded on rule.dragons.drakes."
sources:
  - {source: source.fanpro-10652, printed_pages: "79-80", pdf_pages: "79-80", relation: historical_predecessor}
