  "resolution": {
    "summary": "A VCR translates neural impulses into vehicle-control commands and grants the rigger's primary control bonuses when directly jacked in.",
    "inputs": [
      "VCR rating",
      "rigger adaptation",
      "control mode"
    ],
    "outputs": [
      "Control Pool",
      "Reaction/Initiative vehicle bonuses",
      "defaulting behavior",
      "simulated sensory control"
    ],
    "steps": [
      "Full VCR benefits require both the VCR implant and rigger adaptation in the vehicle.",
      "When directly jacked in, the VCR provides Control Pool and the SR3 VCR Reaction/Initiative benefits; other Reaction/Initiative bonus sources normally do not stack unless specifically permitted.",
      "When using captain's-chair mode instead of directly rigging, VCR bonuses do not apply; the operator receives +1 Reaction for vehicle-related tasks but +1 TN to actions other than controlling drones/vehicles.",
      "When directly rigging, defaulting from Vehicle skills to Reaction has its modifier reduced by half, subject to the bandwidth limit implied by VCR rating.",
      "The rigger can override RAS to regain temporary physical control, but doing so adds +8 TN to physical actions and Perception while still rigging."
    ]
  },
