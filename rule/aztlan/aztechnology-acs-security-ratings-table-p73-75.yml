data:
  original_document: Fictional Knight Errant Security competitive analysis, file KES1000/companal.az.acs/compet.intro/1002,
    security profile BlackKnight-008. The 0-10 ratings are sourcebook operational-profile values, not
    dice TNs or a newly invented resolution mechanic.
  operational_profile_scale: 0 to 10
  comparison_ares_macrotechnology:
    overall_security: 7
    magic: 7
    matrix: 7
    physical: 9
  aztechnology_acs_ratings:
    overall_security: 8
    magical_security: 9
    matrix_security: 8
    physical_security: 7
  typical_matrix_security_benchmarks:
  - node_type: Dataline junctions and slave modules
    peripheral_system: Green-3 to Orange-1
    core_system: Orange-1 to Orange-3
  - node_type: I/O ports, low-security datastores and SPUs
    peripheral_system: Orange-2 to Red-1
    core_system: Orange-4 to Red-2
  - node_type: CPUs, SPUs, SANs and high-security datastores
    peripheral_system: Red-2 to Red-5
    core_system: Red-3 to Red-8
  matrix_ice_distribution: The fictional security source says peripheral systems generally use white/gray
    IC and core systems generally black IC, with deckers routinely patrolling sensitive subsystems.
  rule_preservation: Preserves the original printed benchmark strings, order, punctuation and values;
    no target-number conversion or interpretation of color grade as game edition transfer.
