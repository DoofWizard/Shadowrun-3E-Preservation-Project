data:
  section: New Loas
  game_reference: Game-master-facing historical Shadowrun Second Edition-era magic
    options; no unsupported Third Edition spell mechanic.
  great_form_loa:
    who: Voudoun initiates
    procedure: Can attempt to summon a great form work loa by undergoing an astral
      quest.
    base_spirit: Work loa as published in Awakenings p127.
    additional_powers:
    - Psychokinesis
    - Manifestation
    manifested_form: Source says the form often reflects a greater loa, with examples
      Ogoun the Iron Warrior and Damballah’s great albino serpent form.
    manifest_attributes: Use statistics of Spirits of Man to calculate manifested
      attributes.
    precision: No new explicit quest TN, required Force value, or additional summoning
      dice pool printed here.
  ancestor_spirits:
    procedure: Shamans in New Orleans may summon ancestor spirits according to the
      rules in Cyberpirates p152.
    campaign_application: GM can incorporate traditionalist African shamans in the
      fictional New Orleans community if desired; this is optional guidance, not a
      mandatory character prerequisite.
  mechanical_boundary: The Critters subsection starts later on printed p95 and requires
    separate exact stat preservation; this record does not claim those critter statistics
    have been extracted.
