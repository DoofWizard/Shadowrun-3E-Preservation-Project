data:
  section: Game Information / New Orleans Critters (original printed Second Edition-era
    stat lines)
  stat_column_definition: B=Body, Q=Quickness, S=Strength, C=Charisma, I=Intelligence,
    W=Willpower, E=Essence, R=Reaction, INT=initiative dice modifier; a dash means
    the source prints an em dash and is not zero.
  initiative_reference: The source states the INT column is dice rolled and added
    to Reaction per Shadowrun, Second Edition, p79; preserve its exact sign and parentheses.
  creatures:
  - name: Corpselight
    printed_page: 95
    stats:
      B: '5'
      Q: '10'
      S: —
      C: —
      I: '2'
      W: '5'
      E: (2D6)A
      R: '5'
      INT: +2D6
    attacks: 3M (burning touch), -1 Reach
    powers:
    - Essence Drain
    - Immunity to Normal Weapons
    - Manifestation
    - Movement
    - Psychokinesis
    - Regeneration
    weaknesses:
    - Essence Loss
    essence_first_encounter: 2D6
    essence_max: 12
    astral_force: equal to current Essence rating in astral combat
  - name: Devil Jack Diamond
    printed_page: 95
    stats:
      B: 5/3
      Q: 3 x 5
      S: '5'
      C: —
      I: 1/3
      W: '4'
      E: '6'
      R: '4'
      INT: +2D6
    attacks: 8S (bite)
    armor_exception: additional +2 points of armor versus attacks directed against
      its back
    source_numeric_profile: about 3 metres long and 150 kilograms
  - name: Loup Garou
    printed_page: 96
    stats:
      B: 4 (6)
      Q: 4 x 4
      S: 7 (9)
      C: —
      I: 3/4
      W: '4'
      E: '5'
      R: 4 (6)
      INT: +1D6 (+3D6)
    attacks: 7M (9M)
    notation: parenthesized values describe creature at peak power
    powers:
    - Enhanced Physical Attributes (Strength, once per day for (Essence)D6 turns)
    - Enhanced Senses (Thermographic Vision)
    weaknesses:
    - Allergy (Sunlight, Severe)
    - Allergy (Aconite or Horseradish, Severe)
  - name: Nutria
    printed_page: 96
    stats:
      B: '1'
      Q: 3 x 3
      S: '1'
      C: —
      I: 1/3
      W: '1'
      E: '6'
      R: '4'
      INT: +1D6
    attacks: 5L (bite)
    powers:
    - Concealment (self only)
    - Immunity to Pathogens
    - Immunity to Poisons
    weaknesses:
    - None
  - name: Specter
    printed_page: 96
    stats:
      B: F+1
      Q: F+2 (x3)
      S: F-2
      C: F
      I: F
      W: F
      E: (F)A
      R: F+1
      INT: +1D6
    attacks: Special
    manifested_vs_astral: Printed formulae refer to manifest form; in astral form
      use Force for all tests.
    powers_mandatory:
    - Immunity to Normal Weapons
    - Manifestation
    powers_optional_examples:
    - Accident
    - Compulsion
    - Confusion
    - Fear
    - Noxious Breath
    - Paralyzing Touch (or Howl)
    - Psychokinesis
    weakness_condition: Some specters have an Allergy to objects or circumstances
      significant during their lives.
  edition_lineage: Source cites original Shadowrun Second Edition pp214–219 and Predator
    and Prey pp88–96 for power descriptions, without creating new SR3 conversions.
