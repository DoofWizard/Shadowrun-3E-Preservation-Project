data:
  section: Game Information / Critters — setting-specific mechanical procedures and
    source-qualified observations
  source_persons: All creatures below are imaginary Shadowrun Second Edition-era paranormal
    creatures. These statements concern fictional entities and the tabletop rules,
    not actual animals, diseases, crime, or living people.
  corpselight:
    identity: The published corpselight, called will-o-the-wisp, is an astral entity
      manifesting as a pale glowing sphere roughly 0.3 metres across, hovering a couple
      metres above ground.
    source_agency: The author says corpselights drain the Essence of living creatures
      and seek to induce fear; their conduct is attributed to a fictional monster.
    astral_combat: If fought in astral combat, its Force equals its current Essence
      rating.
    essence_roll: When first encountered, it has 2D6 Essence, capped at 12.
    attack_reference: 3M burning-touch damage and -1 Reach; all other exact stat values
      are preserved in the companion stat-line record.
  devil_jack_diamond:
    appearance: A roughly 3-metre, 150-kilogram large fish with heavy scales, a broad
      flat head, strong jaws and teeth.
    fictional_behavior: Floats at water surface resembling a log when not feeding;
      source describes it as attacking creatures in the water.
    damage_defense: 8S bite, +2 armor against attacks made from behind.
  grande_zombie:
    origin_and_agency: The fictional grande zombie is a loa zombie, referenced to
      Awakenings p130, that escaped its master and became a free spirit, referenced
      to Grimoire 2 p76. It remains bound to its physical body. This is not a conventional
      SR3 zombie template.
    force_rule: Retains loa zombie abilities from Awakenings, except effective Force
      increases with Spirit Energy as for other free spirits.
    free_spirit_powers_rule: At becoming free receives 1D6 divided by 2 free spirit
      powers, using Grimoire 2 pp79–81. The source does not specify a new rounding
      convention.
    usual_powers:
    - Aura Masking
    - Hidden Life
    - Sorcery
    not_permitted:
    - Animal Form
    - Human Form
    - Possession
    essence_loss: Suffers Essence Loss under Shadowrun Second Edition p220, losing
      one point of Force every month.
    fictional_sustenance: The game source explicitly states the fictional creature
      requires human or metahuman flesh monthly to replace its physical body; this
      is a horror setting fact, not medical advice or real-world instruction.
    fictional_societal_context: The narrator depicts organ-trafficking groups and
      some voudoun sects in imaginary New Orleans as facilitating this fictional creature’s
      feeding. The text describes possible infiltration or control of ghoul packs;
      it is not an allegation about actual religious communities.
    spell_ability: Grande zombies capable of Sorcery often use illusion spells to
      conceal physical appearance and Aura Masking to hide astral nature.
  loup_garou:
    source_nature: A fictional human infected by a particular strain of the Human-Metahuman
      Vampiric Virus (HMHVV), altered with gray-black fur, pronounced canines and
      claw-like nails.
    activity_cycle: Ravening period 4 to 6 days of every 28-day cycle; other days
      described as scavenging.
    contagion_test: After a person comes in contact with one (including being wounded),
      a successful Body (6) Test prevents infection in the sourcebook’s game rules.
    fictional_bounty: In the game setting, New Orleans and many other municipalities
      offer 1,500 nuyen or more per dead loup garou; the source characterizes it as
      a public-health threat.
    peak_power_stats: Stats given in parentheses describe the peak period. Attack
      code 7M rises to 9M; Body 4→6, Strength 7→9, Reaction 4→6, initiative +1D6→+3D6.
    ability_duration: Enhanced Physical Attributes (Strength) once per day for a duration
      of (Essence)D6 turns.
    weaknesses: Severe Allergy to sunlight and to aconite or horseradish.
  nutria:
    source_description: Published awakened rodent resembling a possum with distinctive
      orange teeth; narrator describes packs of up to thirty.
    carrier_chance: 'One in six has VITAS-3 in the game: an 11 or 12 result on 2D6.'
    bite_infection_procedure: After a bite from an infected nutria, roll 2D6; infection
      occurs on a result of 9 or greater.
    mechanics: 5L bite; Concealment only self; Immunity to Pathogens and Immunity
      to Poisons; weakness None.
  specter:
    source_nature: Fictional hostile spirit able to manifest and interact with the
      physical world; has a Force attribute used in astral tests and combat.
    physical_anchor_rule: While its person or object anchor survives, it is immune
      to banishing. Astral combat can disrupt rather than permanently end it.
    return_time_rule: A disrupted specter returns after 28 minus its Force days, as
      stated by the original source.
    domain_restriction: Domain-based powers are usable only within the particular
      haunting location; source examples include graveyard, old manor or alley.
    advanced_spirit_options: Some powerful examples may have Spirit Energy, gain it
      by karma, and have additional Free Spirit powers, especially Hidden Life, Possession
      and Sorcery; Grimoire 2 p76.
    departure_condition: Certain specters disappear when a personal unfinished task
      is completed; others persist as hostile ghosts.
    attack_form: Manifested statistics are printed as Force expressions; use Force
      for all astral-form tests.
  power_description_sources:
  - Shadowrun Second Edition pp214–219
  - Predator and Prey pp88–96
  no_third_edition_conversion: All TNs, dice expressions, time intervals, damage codes,
    Agency/Power/Force distinctions and lineage remain as printed; these are not inferred
    Shadowrun Third Edition rules.
