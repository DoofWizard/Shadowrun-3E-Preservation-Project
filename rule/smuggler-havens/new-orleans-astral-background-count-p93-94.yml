data:
  section: Running in New Orleans / The Environment
  scope: Printed historical Shadowrun Second Edition-era environmental and astral
    mechanic; retain original Grimoire 2 rules links without inventing new target
    numbers.
  weather_context: GM reference text says summers are hot and humid, spring/winter
    have rain and dampness, and sensitive electronics and equipment require careful
    care; no numeric equipment-damage procedure is given.
  background_count:
    location: French Quarter, New Orleans
    standard_rating: 1
    temporary_festival_context: During rituals or celebrations, especially Mardi Gras,
      Background Count can rise as high as 3 in many parts of New Orleans.
    festival_max_rating: 3
    reference: Grimoire 2 p89
    effects: The book notes astral activity often becomes difficult during heightened
      Background Count; it does not give new modifiers or a separate test formula
      on these pages.
  astral_spirit_detection:
    rule_reference: Grimoire 2 p92 Astral Patrolling Table
    procedure: GM may use the referenced Astral Patrolling Table to determine whether
      an in-world spirit notices an astrally active character.
    average_detection_test_dice: 4
    adjustment: GM can increase or decrease the number of dice based on the desired
      spirit activity of the area.
    unprinted_fields: No new target number, dice-pool size other than the average
      four dice, or fixed maximum adjustment is printed in this passage.
  in_world_spirits: Source lists nature spirits, elementals, voudoun loas, ghosts,
    specters, watcher spirits, insect spirits, and free spirits; references its Critters
    section from printed p95.
  optional_source_additions: GM may draw on Paranormal Animals and Predator & Prey
    to add other fictional bayou spirits and creatures.
