data:
  section: Cost of Living
  mechanical_rule: Each table value is a percent of the standard Seattle cost, NOT
    a fixed nuyen amount. The text describes variable fictional black-market prices
    affected by arrivals, supply, and heavy legal restrictions. Ranges are represented
    by minimum and maximum percent, including equal endpoints for single printed values.
  new_orleans_percent_of_seattle:
  - item: Weapons
    min_percent: 80
    max_percent: 150
  - item: Ammunition
    min_percent: 50
    max_percent: 100
  - item: Explosives
    min_percent: 150
    max_percent: 200
  - item: Accessories
    min_percent: 100
    max_percent: 150
  - item: Armor
    min_percent: 100
    max_percent: 100
  - item: Security/Communication Devices
    min_percent: 100
    max_percent: 100
  - item: Survival Gear
    min_percent: 100
    max_percent: 150
  - item: Electronics
    min_percent: 40
    max_percent: 120
  - item: Cyberware
    min_percent: 100
    max_percent: 200
  - item: Magical Equipment
    min_percent: 60
    max_percent: 110
  - item: Vehicles (air)
    min_percent: 120
    max_percent: 120
  - item: Vehicles (land)
    min_percent: 130
    max_percent: 130
  - item: Vehicles (water)
    min_percent: 90
    max_percent: 90
  new_orleans_electronics_footnote: Lower end of 40–120% electronics range refers
    specifically to Aztechnology low-end merchandise, which the source says is sold
    in its own country without the standard market-opening burden.
